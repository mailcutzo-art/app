# The whole backend on one machine: PostgreSQL, Redis, database migrations, the api, rt
# (realtime) and worker processes, and Caddy in front (automatic HTTPS for a real domain, plain
# HTTP for testing on your own network).
#
#   cd infra
#   ./init-env.sh lan                 # once: writes .env with random passwords and keys
#   docker compose up -d --build
#
# See infra/README.md for testing with a phone and for running it on a server.

name: quiz

x-logging: &logging
  # The "local" driver rotates logs (5 × 20 MB per container) so they can't fill the disk.
  driver: local

x-backend-env: &backend-env
  APP_ENV: ${APP_ENV:-prod}
  APP_LOG_LEVEL: ${APP_LOG_LEVEL:-INFO}
  APP_DATABASE_URL: postgresql+asyncpg://quiz:${POSTGRES_PASSWORD:?run ./init-env.sh first}@postgres:5432/quiz
  APP_REDIS_URL: redis://:${REDIS_PASSWORD:?run ./init-env.sh first}@redis:6379/0
  APP_JWT_PRIVATE_KEY: ${APP_JWT_PRIVATE_KEY:?run ./init-env.sh first}
  APP_JWT_PUBLIC_KEY: ${APP_JWT_PUBLIC_KEY:?run ./init-env.sh first}
  APP_JWT_KEY_ID: ${APP_JWT_KEY_ID:?run ./init-env.sh first}
  APP_REFRESH_GRACE_KEY: ${APP_REFRESH_GRACE_KEY:?run ./init-env.sh first}
  APP_GOOGLE_CLIENT_IDS: ${APP_GOOGLE_CLIENT_IDS:-}
  APP_DEV_LOGIN_ENABLED: ${APP_DEV_LOGIN_ENABLED:-false}
  APP_CORS_ORIGINS: ${APP_CORS_ORIGINS:-}
  # Only Caddy (on the edge network) may set X-Forwarded-For.
  APP_TRUSTED_PROXIES: ${EDGE_SUBNET:-172.30.0.0/24}
  APP_MIN_BUILD: ${APP_MIN_BUILD:-1}
  APP_MAINTENANCE: ${APP_MAINTENANCE:-false}
  APP_FEATURE_FLAGS: ${APP_FEATURE_FLAGS:-}

x-backend: &backend
  image: quiz-backend:${BACKEND_TAG:-local}
  build:
    context: ../backend
  restart: unless-stopped
  environment: *backend-env
  logging: *logging

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: quiz
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run ./init-env.sh first}
      POSTGRES_DB: quiz
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [data]
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quiz -d quiz"]
      interval: 5s
      timeout: 5s
      retries: 30
    logging: *logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?run ./init-env.sh first}
    # Live match state lives here, so keys must never be evicted (noeviction) and writes are
    # persisted every second (append-only file).
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?run ./init-env.sh first}
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory-policy
      - noeviction
      - --save
      - ""
    volumes:
      - redis-data:/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 30
    logging: *logging

  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
    networks: [data]

  api:
    <<: *backend
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks: [data, edge]

  rt:
    <<: *backend
    command:
      - uvicorn
      - app.main_rt:create_app
      - --factory
      - --host=0.0.0.0
      - --port=8000
      - --no-proxy-headers
      - --no-server-header
      - --no-access-log
      - --ws-max-size=65536
      - --timeout-graceful-shutdown=10
    stop_grace_period: 15s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks: [data, edge]

  worker:
    <<: *backend
    command: ["python", "-m", "app.main_worker"]
    stop_grace_period: 15s
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    # The edge network gives it internet access for push notifications later.
    networks: [data, edge]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      ADMIN_ALLOW_IPS: ${ADMIN_ALLOW_IPS:-0.0.0.0/0 ::/0}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
      rt:
        condition: service_healthy
    networks: [edge]
    logging: *logging

networks:
  # Postgres and Redis live only here: no ports on the host and no internet access.
  data:
    internal: true
  edge:
    ipam:
      config:
        - subnet: ${EDGE_SUBNET:-172.30.0.0/24}

volumes:
  postgres-data:
  redis-data:
  caddy-data:
  caddy-config:
