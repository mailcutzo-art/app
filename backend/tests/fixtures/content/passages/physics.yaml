subject: physics
passages:
  - id: phy-passage-01
    title: Seat belts and inertia
    chapter: laws-of-motion
    difficulty: 2
    body: >-
      When a car brakes hard, the car slows down quickly, but the people inside do not
      automatically slow down with it. By Newton's first law, a body keeps moving with the same
      velocity unless a net force acts on it. Without a seat belt, a passenger carries on forward
      at the car's earlier speed until something stops them, often the dashboard or the
      windscreen, and that stop happens in a very short time.

      The force needed to stop a body depends on how quickly its momentum changes. Newton's second
      law can be written as F = Δp/Δt, so for the same change in momentum, a longer stopping time
      means a smaller force. A seat belt stretches slightly and an airbag squashes, and both
      lengthen the time over which the passenger comes to rest. That lowers the force on the body
      and the chance of injury.

      Crumple zones use the same idea for the car itself. The front of the car is designed to fold
      up gradually, stretching out the time of the collision.
    questions:
      - id: phy-passage-01-q1
        category: concept
        stem: Why does a passenger without a seat belt keep moving forward when a car brakes suddenly?
        options:
          - The brakes push the passenger forward
          - Inertia keeps them moving until a force acts on them
          - The passenger's weight increases during braking
          - Air inside the car pushes the passenger forward
        answer: 1
        explanation: By Newton's first law the passenger keeps the car's earlier velocity until a net force acts on them, so they continue forward while the car slows down.
      - id: phy-passage-01-q2
        category: concept
        stem: How does a seat belt reduce the force on a passenger in a crash?
        options:
          - It increases the time taken to stop
          - It reduces the passenger's mass
          - It reduces the change in momentum to zero
          - It makes the car stop faster
        answer: 0
        explanation: The change in momentum is fixed by the passenger's mass and speed. Since F = Δp/Δt, stretching the stopping time lowers the average force.
      - id: phy-passage-01-q3
        category: numerical
        difficulty: 3
        stem: A 60 kg passenger moving at 10 m s^{-1} is brought to rest in 0.5 s by a seat belt. What is the average force on the passenger?
        options:
          - 300 N
          - 600 N
          - 1200 N
          - 12000 N
        answer: 2
        explanation: F = Δp/Δt = (60 × 10)/0.5 = 1200 N. Stopping in 0.05 s instead would need ten times the force.
