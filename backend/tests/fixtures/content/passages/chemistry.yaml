subject: chemistry
passages:
  - id: che-passage-01
    title: Why water is bent
    chapter: chemical-bonding
    difficulty: 2
    body: >-
      A water molecule has two O–H bonds, but it is not a straight line. The oxygen atom is
      surrounded by four pairs of electrons: two bonding pairs shared with the hydrogen atoms and
      two lone pairs that belong to oxygen alone. According to valence shell electron pair
      repulsion (VSEPR) theory, electron pairs arrange themselves as far apart as possible, which
      for four pairs is roughly tetrahedral.

      Lone pairs sit closer to the oxygen nucleus and spread out more than bonding pairs, so they
      push the O–H bonds towards each other. The H–O–H angle closes from the ideal 109.5° to about
      104.5°, giving water its bent shape.

      Because oxygen is much more electronegative than hydrogen, each O–H bond is polar. In a bent
      molecule these bond dipoles do not cancel, so water has an overall dipole moment. This
      polarity, together with hydrogen bonding between molecules, explains why water dissolves so
      many ionic compounds and has an unusually high boiling point for its size.
    questions:
      - id: che-passage-01-q1
        category: factual
        difficulty: 1
        stem: How many lone pairs does the oxygen atom in a water molecule have?
        options:
          - "1"
          - "2"
          - "3"
          - "0"
        answer: 1
        explanation: Oxygen has six valence electrons. Two are used in the O–H bonds, and the remaining four form two lone pairs.
      - id: che-passage-01-q2
        category: concept
        stem: According to the passage, why does water have an overall dipole moment?
        options:
          - Its molecule is linear
          - Hydrogen is more electronegative than oxygen
          - It has no lone pairs
          - Its polar O–H bonds point in directions that do not cancel
        answer: 3
        explanation: Each O–H bond is polar, and because the molecule is bent the two bond dipoles add up instead of cancelling, leaving a net dipole moment.
      - id: che-passage-01-q3
        category: application
        difficulty: 3
        stem: In hydrogen sulfide (H_2S) the central atom also has two bonds and two lone pairs. What shape should the molecule have?
        options:
          - Linear
          - Bent
          - Tetrahedral
          - Trigonal planar
        answer: 1
        explanation: Like water, the sulfur atom has two bond pairs and two lone pairs, so the electron pairs are roughly tetrahedral and the molecule is bent (its angle is about 92°).
