      name: Molecular shapes (VSEPR)
questions:
  - id: che-bond-001
    topic: bond-types
    category: concept
    difficulty: 1
    battle: true
    stem: Which type of bond forms when one atom transfers electrons to another?
    options:
      - Ionic bond
      - Covalent bond
      - Metallic bond
      - Hydrogen bond
    answer: 0
    explanation: When one atom loses electrons and another gains them, oppositely charged ions form and attract each other. That electrostatic attraction is an ionic (electrovalent) bond, as in NaCl.

  - id: che-bond-002
    topic: bond-types
    category: factual
    difficulty: 1
    battle: true
    stem: How many covalent bonds join the two atoms in a nitrogen molecule, N_2?
    options:
      - "1"
      - "2"
      - "4"
      - "3"
    answer: 3
    explanation: Each nitrogen atom needs three more electrons for an octet, so the two atoms share three pairs. N≡N is a triple bond, made of one σ bond and two π bonds.

  - id: che-bond-003
    topic: bond-types
    category: application
    difficulty: 2
    battle: true
    stem: Which of these compounds has the most ionic character?
    options:
      - NaCl
      - KF
      - LiI
      - HCl
    answer: 1
    explanation: Ionic character grows with the electronegativity difference between the atoms, and K and F differ the most. Fajans' rules agree, since a large cation with a small anion is the least polarised.

  - id: che-bond-004
    topic: bond-types
    category: concept
    difficulty: 2
    battle: true
    stem: Why does H_2O have a dipole moment while CO_2 has none?
    options:
      - C=O bonds are non-polar
      - Oxygen is less electronegative than carbon
      - CO_2 is linear, so its bond dipoles cancel
      - CO_2 has no lone pairs
    answer: 2
    explanation: Both molecules have polar bonds, but CO_2 is linear, so its two C=O bond dipoles point in opposite directions and cancel. H_2O is bent (about 104.5°), so its O–H dipoles add up to a net dipole moment.

  - id: che-bond-005
    topic: vsepr-shapes
    category: factual
    difficulty: 1
    battle: true
    stem: What is the shape of a methane (CH_4) molecule?
    options:
      - Square planar
      - Trigonal planar
      - Tetrahedral
      - Pyramidal
    answer: 2
    explanation: Carbon has four bond pairs and no lone pairs. VSEPR places them as far apart as possible, at the corners of a tetrahedron with bond angles of 109.5°.

  - id: che-bond-006
    topic: vsepr-shapes
    category: application
    difficulty: 2
    battle: true
    stem: What is the shape of an ammonia (NH_3) molecule?
    options:
      - Trigonal pyramidal
      - Trigonal planar
      - Tetrahedral
      - T-shaped
    answer: 0
    explanation: Nitrogen has three bond pairs and one lone pair. The four electron pairs point towards the corners of a tetrahedron, but the shape describes only the atoms, so NH_3 is trigonal pyramidal.

  - id: che-bond-007
    topic: vsepr-shapes
    category: concept
    difficulty: 3
    battle: true
    stem: Why is the H–O–H bond angle in water (about 104.5°) smaller than the tetrahedral angle of 109.5°?
    options:
      - Oxygen is smaller than carbon
      - Lone pairs repel more strongly than bond pairs
      - The hydrogen atoms attract each other
      - Water molecules form hydrogen bonds
    answer: 1
    explanation: Oxygen has two bond pairs and two lone pairs. Repulsion falls in the order lone pair–lone pair > lone pair–bond pair > bond pair–bond pair, so the lone pairs squeeze the O–H bonds closer together.

  - id: che-bond-008
    topic: bond-types
    category: numerical
    difficulty: 3
    battle: true
    stem: What is the bond order of O_2 according to molecular orbital theory?
    options:
      - "1"
      - "2.5"
      - "3"
      - "2"
    answer: 3
    explanation: Bond order = (bonding electrons − antibonding electrons)/2 = (10 − 6)/2 = 2, which matches the O=O double bond. The two unpaired electrons in antibonding π orbitals also make O_2 paramagnetic.
