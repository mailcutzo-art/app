subject: chemistry
chapter:
  slug: atomic-structure
  name: Structure of Atom
  order: 1
  topics:
    - slug: subatomic-particles
      name: Subatomic particles
    - slug: quantum-numbers
      name: Quantum numbers and orbitals
questions:
  - id: che-atom-001
    topic: subatomic-particles
    category: factual
    difficulty: 1
    battle: true
    stem: Who discovered the electron through experiments with cathode rays?
    options:
      - Ernest Rutherford
      - James Chadwick
      - J. J. Thomson
      - Niels Bohr
    answer: 2
    explanation: J. J. Thomson measured the charge-to-mass ratio of cathode rays in 1897 and showed they were streams of negatively charged particles, electrons. Chadwick later discovered the neutron.

  - id: che-atom-002
    topic: subatomic-particles
    category: numerical
    difficulty: 1
    battle: true
    stem: How many neutrons are there in an atom of sodium-23? (The atomic number of sodium is 11.)
    options:
      - "11"
      - "12"
      - "23"
      - "34"
    answer: 1
    explanation: Neutrons = mass number − atomic number = 23 − 11 = 12.

  - id: che-atom-003
    topic: subatomic-particles
    category: concept
    difficulty: 2
    battle: true
    stem: What did Rutherford's gold-foil experiment reveal about the atom?
    options:
      - Its positive charge and most of its mass are in a tiny nucleus
      - Electrons move in fixed circular orbits
      - Its positive charge is spread evenly throughout
      - It cannot be divided into smaller particles
    answer: 0
    explanation: Most alpha particles passed straight through the foil, but a few bounced back sharply. So the atom is mostly empty space, with its positive charge and nearly all its mass packed into a very small nucleus.

  - id: che-atom-004
    topic: subatomic-particles
    category: concept
    difficulty: 2
    battle: true
    stem: Carbon-12 and carbon-14 are isotopes. In what do their atoms differ?
    options:
      - Number of protons
      - Number of electrons
      - Atomic number
      - Number of neutrons
    answer: 3
    explanation: Isotopes are atoms of the same element, so they share the same number of protons (the atomic number) and, when neutral, electrons. They differ in neutrons, with 6 in carbon-12 and 8 in carbon-14.

  - id: che-atom-005
    topic: quantum-numbers
    category: factual
    difficulty: 1
    battle: true
    stem: What is the maximum number of electrons that one orbital can hold?
    options:
      - "1"
      - "6"
      - "8"
      - "2"
    answer: 3
    explanation: By the Pauli exclusion principle no two electrons in an atom can have all four quantum numbers the same, so an orbital holds at most two electrons, with opposite spins.

  - id: che-atom-006
    topic: quantum-numbers
    category: numerical
    difficulty: 2
    battle: true
    stem: How many orbitals are there in the shell with principal quantum number n = 3?
    options:
      - "9"
      - "3"
      - "6"
      - "18"
    answer: 0
    explanation: A shell has n^2 orbitals. For n = 3 that is one 3s, three 3p and five 3d orbitals, 9 in all, holding up to 18 electrons.

  - id: che-atom-007
    topic: quantum-numbers
    category: application
    difficulty: 3
    battle: true
    stem: Which set of quantum numbers (n, l, m_l) is NOT allowed?
    options:
      - (1, 0, 0)
      - (2, 1, 0)
      - (2, 2, 0)
      - (3, 2, −2)
    answer: 2
    explanation: l can only take the values 0 to n − 1, so l = 2 is impossible when n = 2. The other sets satisfy 0 ≤ l < n and −l ≤ m_l ≤ l.

  - id: che-atom-008
    topic: quantum-numbers
    category: application
    difficulty: 2
    battle: true
    stem: By the (n + l) rule, which of these orbitals is filled first?
    options:
      - 3d
      - 4s
      - 4p
      - 4d
    answer: 1
    explanation: Orbitals fill in order of increasing n + l. 4s has 4 + 0 = 4, 3d and 4p have 5, and 4d has 6, so 4s fills first.
