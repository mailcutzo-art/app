questions:
  - id: bio-gen-001
    topic: mendels-laws
    category: numerical
    difficulty: 2
    battle: true
    stem: Tall (T) is dominant over dwarf (t) in pea plants. What fraction of the offspring of a Tt × Tt cross will be tall?
    options:
      - 1/2
      - 3/4
      - 1/4
      - All of them
    answer: 1
    explanation: "The cross gives TT, Tt and tt in a 1 : 2 : 1 ratio. TT and Tt plants are both tall, so 3/4 of the offspring are tall and 1/4 are dwarf."

  - id: bio-gen-002
    topic: mendels-laws
    category: numerical
    difficulty: 3
    battle: true
    stem: In a dihybrid cross RrYy × RrYy, what fraction of the offspring show both recessive traits?
    options:
      - 9/16
      - 3/16
      - 1/16
      - 1/4
    answer: 2
    explanation: "Each gene gives the recessive phenotype with probability 1/4, and the two genes assort independently, so rryy = 1/4 × 1/4 = 1/16. It is the '1' in the 9 : 3 : 3 : 1 ratio."

  - id: bio-gen-003
    topic: mendels-laws
    category: factual
    difficulty: 1
    battle: true
    stem: Which of Mendel's laws states that the two alleles of a gene separate when gametes form?
    options:
      - Law of segregation
      - Law of independent assortment
      - Law of dominance
      - Law of linkage
    answer: 0
    explanation: The law of segregation says the two alleles of a gene separate during gamete formation, so each gamete carries only one of them. Independent assortment concerns different genes.

  - id: bio-gen-004
    topic: mendels-laws
    category: application
    difficulty: 3
    battle: true
    stem: A tall pea plant is crossed with a dwarf (tt) plant, and half of the offspring are dwarf. What is the tall parent's genotype?
    options:
      - Homozygous (TT)
      - Either TT or Tt
      - It can't be determined
      - Heterozygous (Tt)
    answer: 3
    explanation: "This is a test cross. A 1 : 1 ratio of tall to dwarf means the tall parent passed on t in half of its gametes, so it is heterozygous (Tt). A TT parent would give only tall offspring."

  - id: bio-gen-005
    topic: non-mendelian
    category: concept
    difficulty: 2
    battle: true
    stem: Crossing red-flowered and white-flowered snapdragons gives pink-flowered F_1 plants. What does this show?
    options:
      - Codominance
      - Multiple alleles
      - Incomplete dominance
      - Complete dominance
    answer: 2
    explanation: In incomplete dominance the heterozygote shows an intermediate phenotype, here pink. In codominance both parental traits appear side by side, as in the AB blood group.

  - id: bio-gen-006
    topic: non-mendelian
    category: factual
    difficulty: 2
    battle: true
    stem: Human ABO blood groups are an example of which pattern of inheritance?
    options:
      - Incomplete dominance
      - Multiple alleles with codominance
      - Sex-linked inheritance
      - Polygenic inheritance
    answer: 1
    explanation: The ABO gene has three alleles (I^{A}, I^{B} and i), which is multiple allelism. I^{A} and I^{B} are codominant, so both show in group AB, and both are dominant over i.

  - id: bio-gen-007
    topic: non-mendelian
    category: application
    difficulty: 3
    battle: true
    stem: A person with blood group AB and a person with blood group O have children. Which blood groups can the children have?
    options:
      - AB or O only
      - A, B, AB or O
      - O only
      - A or B only
    answer: 3
    explanation: The AB parent passes on I^{A} or I^{B}, and the O parent always passes on i. The children are I^{A}i (group A) or I^{B}i (group B), so none can be AB or O.

  - id: bio-gen-008
    topic: non-mendelian
    category: concept
    difficulty: 2
    battle: true
    stem: Human skin colour varies continuously because several genes each add a small effect. What is this called?
    options:
      - Polygenic inheritance
      - Pleiotropy
      - Codominance
      - Linkage
    answer: 0
    explanation: When several genes each contribute a little to one trait, the phenotypes form a smooth range. That is polygenic inheritance. Pleiotropy is the reverse, one gene affecting several traits.
