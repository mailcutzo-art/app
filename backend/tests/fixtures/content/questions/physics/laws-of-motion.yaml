      name: Friction
questions:
  - id: phy-lom-001
    topic: newtons-laws
    category: concept
    difficulty: 1
    battle: true
    stem: Passengers lurch forward when a moving bus brakes suddenly. Which law explains this?
    options:
      - Newton's second law
      - Newton's first law (inertia)
      - Newton's third law
      - The law of gravitation
    answer: 1
    explanation: By inertia (Newton's first law), the passengers' bodies keep moving forward while the bus, and their feet on its floor, slow down.

  - id: phy-lom-002
    topic: newtons-laws
    category: numerical
    difficulty: 1
    battle: true
    stem: A net force of 10 N acts on a 2 kg block. What is its acceleration?
    options:
      - 5 m s^{-2}
      - 20 m s^{-2}
      - 0.2 m s^{-2}
      - 12 m s^{-2}
    answer: 0
    explanation: From F = ma, a = F/m = 10 N ÷ 2 kg = 5 m s^{-2}.

  - id: phy-lom-003
    topic: newtons-laws
    category: concept
    difficulty: 3
    battle: true
    stem: A book rests on a table. By Newton's third law, which force is the reaction to the book's weight?
    options:
      - The table's upward push on the book
      - The book's downward push on the table
      - Friction between the book and the table
      - The book's gravitational pull on the Earth
    answer: 3
    explanation: Action and reaction act on different bodies and are the same kind of force. The weight is the Earth pulling the book, so its pair is the book pulling the Earth. The table's push balances the weight but is not its reaction.

  - id: phy-lom-004
    topic: newtons-laws
    category: numerical
    difficulty: 2
    battle: true
    stem: A 0.5 kg ball moving at 4 m s^{-1} is stopped in 0.1 s. What average force stops it?
    options:
      - 2 N
      - 0.2 N
      - 20 N
      - 40 N
    answer: 2
    explanation: Force equals the rate of change of momentum, F = Δp/Δt = (0.5 × 4)/0.1 = 20 N.

  - id: phy-lom-005
    topic: newtons-laws
    category: factual
    difficulty: 1
    battle: true
    stem: Which quantity measures how much inertia a body has?
    options:
      - Mass
      - Weight
      - Velocity
      - Acceleration
    answer: 0
    explanation: Inertia is a body's resistance to a change in its motion, and mass measures it. The larger the mass, the smaller the acceleration a given force produces.

  - id: phy-lom-006
    topic: friction
    category: concept
    difficulty: 2
    battle: true
    stem: Why is it harder to start a heavy box sliding than to keep it sliding?
    options:
      - Kinetic friction is greater than static friction
      - The box gets lighter once it moves
      - Maximum static friction is greater than kinetic friction
      - Air resistance acts only at the start
    answer: 2
    explanation: Limiting static friction (μ_s N) is larger than kinetic friction (μ_k N) because μ_s > μ_k, so more force is needed to start the motion than to keep it going.

  - id: phy-lom-007
    topic: friction
    category: numerical
    difficulty: 2
    battle: true
    stem: A 10 kg block slides on a floor where the coefficient of kinetic friction is 0.2. Taking g = 10 m s^{-2}, what is the friction force?
    options:
      - 2 N
      - 50 N
      - 200 N
      - 20 N
    answer: 3
    explanation: Kinetic friction f = μ_k N = μ_k mg = 0.2 × 10 × 10 = 20 N.

  - id: phy-lom-008
    topic: friction
    category: application
    difficulty: 3
    battle: true
    stem: A block rests on a rough incline. If the incline is made slightly steeper and the block still does not slide, what happens to the friction on it?
    options:
      - It decreases
      - It increases
      - It stays the same
      - It becomes zero
    answer: 1
    explanation: At rest, static friction exactly balances the weight's component along the slope, mg sin θ. That component grows with θ, so friction grows too, until it reaches its limit and the block slips.
