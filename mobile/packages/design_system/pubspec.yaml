name: design_system
description: "Pastel design system for the quiz app: tokens, theme, icons, motion and widgets."
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.4
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  hugeicons: ^1.2.0
  path_parsing: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: fonts/PlusJakartaSans_400Regular.ttf
          weight: 400
        - asset: fonts/PlusJakartaSans_500Medium.ttf
          weight: 500
        - asset: fonts/PlusJakartaSans_600SemiBold.ttf
          weight: 600
        - asset: fonts/PlusJakartaSans_700Bold.ttf
          weight: 700
        - asset: fonts/PlusJakartaSans_800ExtraBold.ttf
          weight: 800
