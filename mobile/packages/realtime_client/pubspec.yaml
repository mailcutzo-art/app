name: realtime_client
description: "WebSocket client for live quiz battles: protocol v1 codec, connection manager, clock sync, resume and the match reducer."
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.4

dependencies:
  web_socket_channel: ^3.0.3

dev_dependencies:
  fake_async: ^1.3.3
  # Only here so the `include` in the shared ../../analysis_options.yaml resolves.
  flutter_lints: ^6.0.0
  test: ^1.31.1
