questions:
  - id: bio-reprohealth-001
    topic: reprohealth-amniocentesis
    subtopic: Amniocentesis
    concept: Amniocentesis analyses the chromosomal pattern in the amniotic fluid around the developing embryo
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [amniocentesis, amniotic-fluid]
    stem: Amniocentesis is a foetal sex determination test based on the chromosomal pattern in the
    options:
      - seminal fluid of the father
      - blood of the pregnant mother
      - amniotic fluid surrounding the developing embryo
      - urine of the pregnant mother
    answer: 2
    explanation: NCERT describes amniocentesis as a foetal sex determination test based on the chromosomal pattern in the amniotic fluid that surrounds the developing embryo. The cells and fluid, not the mother's blood, urine or the father's semen, are examined.
  - id: bio-reprohealth-002
    topic: reprohealth-amniocentesis
    subtopic: Statutory ban
    concept: The statutory ban on amniocentesis for sex-determination is meant to check female foeticide
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [statutory-ban, female-foeticide]
    stem: A statutory ban on amniocentesis for sex-determination is operational in India mainly to check increasing
    options:
      - cases of male infertility
      - sexually transmitted infections
      - deaths of mothers during delivery
      - female foeticides
    answer: 3
    explanation: NCERT states that the statutory ban on amniocentesis for sex-determination is an attempt to legally check increasing female foeticides. It is not aimed at infections, infertility or maternal deaths.
  - id: bio-reprohealth-003
    topic: reprohealth-amniocentesis
    subtopic: Statutory ban
    concept: The ban applies to the use of amniocentesis for sex-determination of the foetus
    category: concept
    format: direct
    difficulty: 4
    time: 85
    ncert: true
    battle: true
    tags: [statutory-ban, misuse]
    stem: The statutory ban in India is on the use of amniocentesis for
    options:
      - detecting haemophilia in the foetus
      - determining the sex of the foetus
      - detecting Down's syndrome in the foetus
      - detecting sickle-cell anaemia in the foetus
    answer: 1
    explanation: The ban is a statutory ban on amniocentesis for sex-determination, because the test is misused to find the sex of the foetus and end female pregnancies. Using the same technique to find genetic disorders such as Down's syndrome, haemophilia or sickle-cell anaemia is not what the ban targets.
  - id: bio-reprohealth-004
    topic: reprohealth-amniocentesis
    subtopic: Chromosomal pattern
    concept: A male foetus shows 22 pairs of autosomes with one X and one Y chromosome
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [xy, foetal-sex]
    stem: The chromosomal pattern of cells in the amniotic fluid of a normal male foetus shows
    options:
      - 23 pairs of autosomes with a Y chromosome
      - 22 pairs of autosomes with one X and one Y chromosome
      - 22 pairs of autosomes with two X chromosomes
      - 22 pairs of autosomes with a single X chromosome
    answer: 1
    explanation: A normal human male has 22 pairs of autosomes and one pair of sex chromosomes made of an X and a Y. Two X chromosomes mean a female, and a single X gives Turner's syndrome.
  - id: bio-reprohealth-005
    topic: reprohealth-amniocentesis
    subtopic: Sex determination in humans
    concept: The type of sex chromosome in the sperm decides the sex of the child
    category: concept
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [sex-determination, sperm]
    stem: The sex of a human child depends on the
    options:
      - type of sex chromosome carried by the sperm that fertilises the ovum
      - type of sex chromosome carried by the ovum
      - hormones of the mother during pregnancy
      - number of autosomes contributed by the mother
    answer: 0
    explanation: All ova carry an X chromosome, while sperms carry either X or Y in equal numbers. So the sex of the child depends on whether an X-bearing or a Y-bearing sperm fertilises the ovum.
  - id: bio-reprohealth-006
    topic: reprohealth-amniocentesis
    subtopic: Sex determination in humans
    concept: Human males are heterogametic and produce X-bearing and Y-bearing sperms
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [heterogametic, gametes]
    stem: Human males are called heterogametic because they produce
    options:
      - one type of gamete, all of them with X
      - gametes that carry both X and Y together
      - two types of gametes, one with X and the other with no sex chromosome
      - two types of gametes, 50 per cent with X and 50 per cent with Y
    answer: 3
    explanation: A male has XY sex chromosomes, so half of his sperms carry X and half carry Y. A gamete with no sex chromosome is the pattern of XO males in grasshopper, not of humans.
  - id: bio-reprohealth-007
    topic: reprohealth-amniocentesis
    subtopic: Chromosomal disorders
    concept: Down's syndrome is trisomy of chromosome 21
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [down-syndrome, trisomy-21]
    stem: Down's syndrome is caused by the presence of an additional copy of
    options:
      - chromosome 11
      - chromosome 21
      - chromosome 16
      - the X chromosome
    answer: 1
    explanation: Down's syndrome results from trisomy of chromosome 21, giving 47 chromosomes. Chromosomes 11 and 16 carry the globin genes concerned with thalassemia, and an extra X is seen in Klinefelter's syndrome.
  - id: bio-reprohealth-008
    topic: reprohealth-amniocentesis
    subtopic: Chromosomal disorders
    concept: Absence of one X chromosome in a female gives Turner's syndrome
    category: concept
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [turner-syndrome, monosomy]
    stem: A female foetus whose cells show 44 autosomes and a single X chromosome is expected to develop
    options:
      - Klinefelter's syndrome
      - Turner's syndrome
      - a normal female phenotype
      - Down's syndrome
    answer: 1
    explanation: The sex chromosome complement 44 + XO (45 chromosomes) is Turner's syndrome, in which the female is sterile with rudimentary ovaries. Klinefelter's syndrome is XXY and Down's syndrome is trisomy 21.
  - id: bio-reprohealth-009
    topic: reprohealth-amniocentesis
    subtopic: Chromosomal disorders
    concept: Klinefelter's syndrome has the sex chromosome complement XXY
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [klinefelter-syndrome, xxy]
    stem: In Klinefelter's syndrome the sex chromosomes of the affected person are
    options:
      - XXX
      - XYY
      - XXY
      - XO
    answer: 2
    explanation: Klinefelter's syndrome arises from an additional X chromosome in a male, giving 47 chromosomes with the sex chromosomes XXY. XO is Turner's syndrome.
  - id: bio-reprohealth-010
    topic: reprohealth-amniocentesis
    subtopic: Aneuploidy
    concept: Aneuploidy results from failure of segregation of chromatids during cell division
    category: concept
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [aneuploidy, non-disjunction]
    stem: Gain or loss of a single chromosome (aneuploidy) is due to
    options:
      - crossing over between non-sister chromatids
      - failure of cytokinesis after telophase
      - failure of segregation of chromatids during cell division
      - substitution of a single base in a gene
    answer: 2
    explanation: NCERT attributes aneuploidy to the failure of segregation of chromatids during cell division, which produces a gain or loss of a chromosome. Failure of cytokinesis after telophase gives polyploidy, and a base substitution is a gene mutation.
  - id: bio-reprohealth-011
    topic: reprohealth-amniocentesis
    subtopic: Polyploidy
    concept: Polyploidy is an increase in a whole set of chromosomes due to failure of cytokinesis
    category: concept
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [polyploidy, cytokinesis]
    stem: An increase in a whole set of chromosomes due to failure of cytokinesis after telophase is called
    options:
      - monosomy
      - trisomy
      - aneuploidy
      - polyploidy
    answer: 3
    explanation: Failure of cytokinesis after telophase leaves a cell with an extra whole set of chromosomes, which is polyploidy and is often seen in plants. Trisomy and monosomy are aneuploid conditions involving a single chromosome.
  - id: bio-reprohealth-012
    topic: reprohealth-amniocentesis
    subtopic: Genetic disorders
    concept: Sickle-cell anaemia is caused by substitution of glutamic acid by valine in the beta globin chain
    category: factual
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [sickle-cell, beta-globin]
    stem: The mutation causing sickle-cell anaemia replaces, at the sixth position of the β-globin chain,
    options:
      - valine by glutamic acid
      - glutamic acid by lysine
      - glutamic acid by valine
      - phenylalanine by tyrosine
    answer: 2
    explanation: In sickle-cell anaemia a single base substitution changes the sixth codon of the β-globin gene so that glutamic acid is replaced by valine. The mutant haemoglobin HbS polymerises under low oxygen tension.
  - id: bio-reprohealth-013
    topic: reprohealth-amniocentesis
    subtopic: Genetic disorders
    concept: Phenylketonuria is due to lack of the enzyme converting phenylalanine to tyrosine
    category: factual
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [phenylketonuria, enzyme]
    stem: Phenylketonuria is caused by the absence of an enzyme that converts
    options:
      - tyrosine into phenylalanine
      - fibrinogen into fibrin
      - phenylalanine into tyrosine
      - glucose into glycogen
    answer: 2
    explanation: Phenylketonuria is an inborn error of metabolism in which the enzyme that converts the amino acid phenylalanine into tyrosine is lacking. Phenylalanine and its derivatives such as phenylpyruvic acid then accumulate and cause mental retardation.
  - id: bio-reprohealth-014
    topic: reprohealth-amniocentesis
    subtopic: Genetic disorders
    concept: A single protein of the clotting cascade is affected in haemophilia
    category: concept
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [haemophilia, clotting]
    stem: A simple cut leads to non-stop bleeding in haemophilia because
    options:
      - a protein of the cascade of reactions of blood clotting is affected
      - the number of platelets is abnormally high
      - the red blood cells have become sickle-shaped
      - too few β-globin chains are made
    answer: 0
    explanation: In haemophilia a single protein that is part of the cascade of reactions involved in blood clotting is affected, so even a simple cut bleeds without stopping. Sickle-shaped cells and reduced globin chains belong to sickle-cell anaemia and thalassemia.
  - id: bio-reprohealth-015
    topic: reprohealth-amniocentesis
    subtopic: Genetic disorders
    concept: Thalassemia is a quantitative globin defect, sickle-cell anaemia a qualitative one
    category: concept
    format: direct
    difficulty: 4
    time: 85
    ncert: true
    battle: false
    tags: [thalassemia, sickle-cell]
    stem: Which one correctly distinguishes thalassemia from sickle-cell anaemia?
    options:
      - Thalassemia is a quantitative problem of too few globin molecules, while sickle-cell anaemia is a qualitative problem of an incorrectly functioning globin
      - Thalassemia is caused by an extra chromosome, while sickle-cell anaemia is caused by a single gene
      - Thalassemia is an X-linked trait, while sickle-cell anaemia is an autosome-linked trait
      - Thalassemia is a qualitative problem of an incorrectly functioning globin, while sickle-cell anaemia is a quantitative problem of too few globin molecules
    answer: 0
    explanation: NCERT points out that thalassemia is a quantitative problem, since too few globin molecules are synthesised, whereas sickle-cell anaemia is a qualitative problem, since an incorrectly functioning globin is made. Both are autosome-linked recessive traits caused by gene mutations, not by an extra chromosome.
  - id: bio-reprohealth-016
    topic: reprohealth-amniocentesis
    subtopic: Colour blindness
    concept: Colour blindness occurs in about 8 per cent of males and 0.4 per cent of females
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [colour-blindness, incidence]
    stem: Red-green colour blindness occurs in about 8 per cent of males and only about what percentage of females?
    options:
      - 8 per cent
      - 0.8 per cent
      - 4 per cent
      - 0.4 per cent
    answer: 3
    explanation: NCERT gives the incidence of colour blindness as about 8 per cent in males and only about 0.4 per cent in females. The gene lies on the X chromosome and is recessive, so females are affected far less often.
  - id: bio-reprohealth-017
    topic: reprohealth-amniocentesis
    subtopic: Sex-linked disorders
    concept: A haemophilic father passes the X-linked allele to all his daughters but to none of his sons
    category: application
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [haemophilia, x-linked]
    stem: A haemophilic man marries a homozygous normal woman. Their daughters will be
    options:
      - half carriers and half normal, with all sons haemophilic
      - all carriers and their sons all normal
      - all normal and their sons all haemophilic
      - all haemophilic and their sons all normal
    answer: 1
    explanation: The father gives his X (with the recessive allele) to every daughter and his Y to every son. The normal mother gives a normal X to all children, so all daughters are carriers and all sons are normal.
  - id: bio-reprohealth-018
    topic: reprohealth-amniocentesis
    subtopic: Sex-linked disorders
    concept: A haemophilic daughter needs a carrier or affected mother and a haemophilic father
    category: application
    format: direct
    difficulty: 4
    time: 85
    ncert: true
    battle: true
    tags: [haemophilia, carrier]
    stem: A haemophilic daughter is extremely rare because she can be born only when
    options:
      - the gene is passed on through the Y chromosome of the father
      - the mother is at least a carrier and the father is haemophilic
      - the mother is homozygous normal and the father is haemophilic
      - the mother is a carrier and the father is normal
    answer: 1
    explanation: A daughter must receive the recessive allele on both X chromosomes, so her mother must be at least a carrier and her father haemophilic. NCERT notes that such a father is unlikely to survive to reproduce, which makes the case extremely rare.
  - id: bio-reprohealth-019
    topic: reprohealth-amniocentesis
    subtopic: Sex determination in animals
    concept: In birds the female is heterogametic (ZW)
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [zw, heterogamety]
    stem: In which of the following is the female heterogametic?
    options:
      - Drosophila
      - Birds
      - Humans
      - Grasshopper
    answer: 1
    explanation: In birds the total chromosome number is the same in both sexes but the female is ZW (heterogametic) and the male is ZZ. Humans and Drosophila follow the XX-XY pattern with male heterogamety, and grasshopper males are XO.
  - id: bio-reprohealth-020
    topic: reprohealth-amniocentesis
    subtopic: Sex determination in animals
    concept: In grasshopper the male is XO and the female is XX
    category: factual
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [xo, grasshopper]
    stem: In the XO type of sex determination found in grasshopper, the sex chromosome constitution is
    options:
      - XX in males and XO in females
      - XY in males and XX in females
      - ZZ in males and ZW in females
      - XO in males and XX in females
    answer: 3
    explanation: In grasshopper the male has only one X chromosome and no Y (XO), while the female has two (XX). Half of the sperms carry an X and half have none.
  - id: bio-reprohealth-021
    topic: reprohealth-amniocentesis
    subtopic: Genetic disorders
    concept: Chromosomal disorders are caused by absence, excess or abnormal arrangement of chromosomes
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [chromosomal-disorders]
    stem: Disorders caused by absence, excess or abnormal arrangement of one or more chromosomes are called
    options:
      - Mendelian disorders
      - sex-linked disorders
      - single-gene disorders
      - chromosomal disorders
    answer: 3
    explanation: NCERT defines chromosomal disorders as those caused by the absence or excess, or abnormal arrangement, of one or more chromosomes. Mendelian disorders are mainly due to an alteration or mutation in a single gene.
  - id: bio-reprohealth-022
    topic: reprohealth-amniocentesis
    subtopic: Pedigree analysis
    concept: Pedigree analysis traces the inheritance of a trait through generations of a family
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [pedigree]
    stem: Tracing the inheritance of a specific trait, abnormality or disease through the generations of a family is called
    options:
      - amniocentesis
      - pedigree analysis
      - test cross
      - back cross
    answer: 1
    explanation: A pedigree is a record of the inheritance of a trait through several generations of a family, and pedigree analysis is used to trace it. Amniocentesis examines the foetus, and test and back crosses are breeding experiments.
  - id: bio-reprohealth-023
    topic: reprohealth-amniocentesis
    subtopic: Medical termination of pregnancy
    concept: MTP was legalised in India in 1971 with strict conditions to avoid misuse
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [mtp, misuse]
    stem: The Government of India legalised medical termination of pregnancy, with strict conditions to avoid its misuse, in the year
    options:
      - '1951'
      - '1981'
      - '1991'
      - '1971'
    answer: 3
    explanation: NCERT states that the Government of India legalised MTP in 1971 with some strict conditions to avoid its misuse. The restrictions are important to check indiscriminate and illegal female foeticides.
  - id: bio-reprohealth-024
    topic: reprohealth-amniocentesis
    subtopic: Amniocentesis
    concept: Amniocentesis is based on the chromosomal pattern of the amniotic fluid and is banned for sex-determination
    category: concept
    format: statement-pair
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [amniocentesis, statutory-ban]
    stem: |-
      Statement I: Amniocentesis is a foetal sex determination test based on the chromosomal pattern in the amniotic fluid surrounding the developing embryo.
      Statement II: A statutory ban on amniocentesis for sex-determination is operational in India to legally check increasing female foeticides.
    options:
      - Both Statement I and Statement II are correct
      - Both Statement I and Statement II are incorrect
      - Statement I is correct but Statement II is incorrect
      - Statement I is incorrect but Statement II is correct
    answer: 0
    explanation: Both statements follow NCERT. The test reveals the foetal sex from the chromosomal pattern of the amniotic fluid, and the ban on its use for sex-determination is meant to check female foeticides.
  - id: bio-reprohealth-025
    topic: reprohealth-amniocentesis
    subtopic: Misuse
    concept: Amniocentesis examines the fluid around the embryo, not the mother's blood; knowing the sex can lead to foeticide
    category: concept
    format: statement-pair
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [misuse, female-foeticide]
    stem: |-
      Statement I: Amniocentesis is carried out by examining the chromosomal pattern of the blood cells of the pregnant mother.
      Statement II: Armed with the knowledge of the foetal sex, family members could take a decision on female foeticide.
    options:
      - Both Statement I and Statement II are correct
      - Both Statement I and Statement II are incorrect
      - Statement I is correct but Statement II is incorrect
      - Statement I is incorrect but Statement II is correct
    answer: 3
    explanation: Statement I is incorrect because amniocentesis examines the chromosomal pattern in the amniotic fluid surrounding the embryo, not the mother's blood. Statement II is correct and is exactly how the technique is misused.
  - id: bio-reprohealth-026
    topic: reprohealth-amniocentesis
    subtopic: Sex determination in humans
    concept: Sperm decides the sex; XY in foetal cells indicates a male, not a female
    category: application
    format: statement-pair
    difficulty: 4
    time: 85
    ncert: true
    battle: false
    tags: [sex-determination, xy]
    stem: |-
      Statement I: The sex of a human child is determined by the sperm that fertilises the ovum.
      Statement II: Cells from the amniotic fluid showing 44 autosomes and the sex chromosomes XY indicate a female foetus.
    options:
      - Both Statement I and Statement II are correct
      - Both Statement I and Statement II are incorrect
      - Statement I is correct but Statement II is incorrect
      - Statement I is incorrect but Statement II is correct
    answer: 2
    explanation: Statement I is correct because the ovum always carries an X while the sperm carries X or Y. Statement II is incorrect because XY is the male sex chromosome pattern, and a female foetus would show XX.
  - id: bio-reprohealth-027
    topic: reprohealth-amniocentesis
    subtopic: Chromosomal disorders
    concept: Down's syndrome is trisomy 21; Turner's syndrome is loss of one X, not an extra X
    category: concept
    format: statement-pair
    difficulty: 4
    time: 85
    ncert: true
    battle: false
    tags: [down-syndrome, turner-syndrome]
    stem: |-
      Statement I: Down's syndrome is caused by trisomy of chromosome 21.
      Statement II: Turner's syndrome is caused by the presence of an additional X chromosome in a female.
    options:
      - Both Statement I and Statement II are correct
      - Both Statement I and Statement II are incorrect
      - Statement I is correct but Statement II is incorrect
      - Statement I is incorrect but Statement II is correct
    answer: 2
    explanation: Statement I is correct. Statement II is incorrect because Turner's syndrome results from the absence of one X chromosome (44 + XO), whereas an additional X in a male causes Klinefelter's syndrome.
  - id: bio-reprohealth-028
    topic: reprohealth-amniocentesis
    subtopic: Genetic disorders
    concept: Phenylketonuria is autosomal recessive and haemophilia is X-linked recessive
    category: concept
    format: statement-pair
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [phenylketonuria, haemophilia]
    stem: |-
      Statement I: Phenylketonuria is an X-linked recessive disorder.
      Statement II: Haemophilia is an autosome-linked recessive disorder.
    options:
      - Both Statement I and Statement II are correct
      - Both Statement I and Statement II are incorrect
      - Statement I is correct but Statement II is incorrect
      - Statement I is incorrect but Statement II is correct
    answer: 1
    explanation: Both statements are incorrect. Phenylketonuria is an autosomal recessive trait, and haemophilia is a sex-linked recessive trait whose gene lies on the X chromosome.
  - id: bio-reprohealth-029
    topic: reprohealth-amniocentesis
    subtopic: Chromosomal disorders
    concept: Klinefelter's males are sterile with breast development; Turner's females have rudimentary ovaries
    category: concept
    format: statement-pair
    difficulty: 4
    time: 85
    ncert: true
    battle: false
    tags: [klinefelter-syndrome, turner-syndrome]
    stem: |-
      Statement I: A person with Klinefelter's syndrome has overall masculine development with development of breasts (gynaecomastia) and is sterile.
      Statement II: A woman with Turner's syndrome has rudimentary ovaries and lacks secondary sexual characters.
    options:
      - Both Statement I and Statement II are correct
      - Both Statement I and Statement II are incorrect
      - Statement I is correct but Statement II is incorrect
      - Statement I is incorrect but Statement II is correct
    answer: 0
    explanation: Both statements agree with NCERT. Klinefelter's syndrome (XXY) gives masculine development with gynaecomastia and sterility, and Turner's syndrome (XO) gives sterile females with rudimentary ovaries and no secondary sexual characters.
  - id: bio-reprohealth-030
    topic: reprohealth-amniocentesis
    subtopic: Statutory ban
    concept: A ban exists on amniocentesis for sex-determination because it can be misused for female foeticide
    category: concept
    format: assertion-reason
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [statutory-ban, misuse]
    stem: |-
      Assertion (A): A statutory ban on amniocentesis for sex-determination is operational in India.
      Reason (R): The test can be misused to find the sex of a foetus and terminate female pregnancies.
    options:
      - Both A and R are true and R is the correct explanation of A
      - Both A and R are true but R is not the correct explanation of A
      - A is true but R is false
      - A is false but R is true
    answer: 0
    explanation: The ban exists because the foetal sex revealed by the chromosomal pattern can lead to female foeticide, so R explains A.
  - id: bio-reprohealth-031
    topic: reprohealth-amniocentesis
    subtopic: Sex determination in humans
    concept: The father's gamete decides the sex because sperms are of two kinds and all ova carry X
    category: concept
    format: assertion-reason
    difficulty: 4
    time: 85
    ncert: true
    battle: false
    tags: [sex-determination, gametes]
    stem: |-
      Assertion (A): The sex of a human child is decided by the father's gamete.
      Reason (R): A man produces two types of sperms, X-bearing and Y-bearing, whereas all the ova carry an X chromosome.
    options:
      - Both A and R are true and R is the correct explanation of A
      - Both A and R are true but R is not the correct explanation of A
      - A is true but R is false
      - A is false but R is true
    answer: 0
    explanation: Since every ovum carries an X, the type of sperm that fertilises it decides whether the zygote is XX (female) or XY (male). R is the correct explanation of A.
  - id: bio-reprohealth-032
    topic: reprohealth-amniocentesis
    subtopic: Sex-linked disorders
    concept: Haemophilia is commoner in males; the Queen Victoria pedigree is only an example, not the reason
    category: concept
    format: assertion-reason
    difficulty: 4
    time: 85
    ncert: true
    battle: false
    tags: [haemophilia, pedigree]
    stem: |-
      Assertion (A): Haemophilia is much more common in males than in females.
      Reason (R): Queen Victoria was a carrier of haemophilia and passed the gene to some of her descendants.
