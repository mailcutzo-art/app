    stem: A lesion destroys the neurosecretory cells of the hypothalamus, while the pituitary gland itself is intact. Which set of effects is expected?
    options:
      - Loss of control over anterior pituitary secretion only, as the posterior pituitary makes its own hormones
      - Reduced release of oxytocin and vasopressin from the posterior pituitary, and loss of control over anterior pituitary secretion
      - Reduced release of oxytocin and vasopressin only, as the anterior pituitary is controlled by the thalamus
      - No endocrine change, as the pituitary is controlled only by the cerebral cortex
    answer: 1
    explanation: Oxytocin and vasopressin are synthesised by hypothalamic neurons and reach the posterior pituitary through axons, so their release falls. The releasing and inhibiting hormones that regulate the anterior pituitary also come from the hypothalamus, so that control is lost.
