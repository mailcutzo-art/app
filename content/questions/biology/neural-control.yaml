questions:
  - id: bio-neural-001
    topic: neural-neural-organisation
    subtopic: Neural system in animals
    concept: The neural system of all animals is made of neurons that detect, receive and transmit stimuli
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [neurons, neural-system]
    stem: The neural system of all animals is composed of highly specialised cells that can detect, receive and transmit different kinds of stimuli. These cells are the
    options:
      - neuroglial cells
      - neurons
      - Schwann cells
      - fibroblasts
    answer: 1
    explanation: NCERT states that the neural system of all animals is composed of highly specialised cells called neurons, which detect, receive and transmit different kinds of stimuli. Neuroglial cells and Schwann cells support and insulate neurons, and fibroblasts belong to connective tissue.
  - id: bio-neural-002
    topic: neural-neural-organisation
    subtopic: Neural system in animals
    concept: In Hydra the neural organisation is a network of neurons
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [hydra, neural-system]
    stem: In Hydra, which is a lower invertebrate, the neural organisation is very simple and is composed of
    options:
      - a network of neurons
      - a brain and a number of ganglia
      - a spinal cord with cranial nerves
      - a dorsal hollow nerve cord
    answer: 0
    explanation: NCERT gives Hydra as the example of simple neural organisation in lower invertebrates, where the system is a network of neurons. A brain with ganglia appears in insects, and a spinal cord or a dorsal hollow nerve cord belongs to vertebrates and other chordates.
  - id: bio-neural-003
    topic: neural-neural-organisation
    subtopic: Nerve fibres of the PNS
    concept: Nerve fibres of the PNS are afferent and efferent
    category: factual
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [afferent, efferent, pns]
    stem: The nerve fibres of the peripheral neural system are of two types, namely
    options:
      - somatic fibres and autonomic fibres
      - sympathetic fibres and parasympathetic fibres
      - afferent fibres and efferent fibres
      - central fibres and peripheral fibres
    answer: 2
    explanation: NCERT classifies the nerve fibres of the PNS into afferent fibres, which bring impulses to the CNS, and efferent fibres, which carry regulatory impulses away from it. Somatic and autonomic are the two divisions of the PNS, and sympathetic and parasympathetic are the two divisions of the autonomic system, not fibre types.
  - id: bio-neural-004
    topic: neural-neural-organisation
    subtopic: CNS and PNS
    concept: The CNS of humans includes the brain and the spinal cord
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [cns]
    stem: The central neural system (CNS) of humans includes the
    options:
      - brain and the cranial nerves
      - spinal cord and the spinal nerves
      - brain, spinal cord and all the peripheral nerves
      - brain and the spinal cord
    answer: 3
    explanation: NCERT states that the CNS includes the brain and the spinal cord. Cranial and spinal nerves, which are associated with them, belong to the peripheral neural system.
  - id: bio-neural-005
    topic: neural-neural-organisation
    subtopic: CNS and PNS
    concept: The CNS is the site of information processing and control
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [cns]
    stem: In the human neural system, the site of information processing and control is the
    options:
      - central neural system
      - peripheral neural system
      - somatic neural system
      - autonomic neural system
    answer: 0
    explanation: The CNS, made of the brain and the spinal cord, is the site of information processing and control. The PNS only carries impulses to and from it, and the somatic and autonomic systems are divisions of the PNS.
  - id: bio-neural-006
    topic: neural-neural-organisation
    subtopic: CNS and PNS
    concept: The PNS comprises all the nerves associated with the CNS
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [pns]
    stem: The peripheral neural system (PNS) of humans comprises
    options:
      - all the nerves associated with the brain and the spinal cord
      - the brain and the spinal cord
      - only the nerves that supply the skeletal muscles
      - only the nerves that supply the involuntary organs
    answer: 0
    explanation: NCERT defines the PNS as all the nerves associated with the CNS, that is, with the brain and the spinal cord. The brain and spinal cord themselves form the CNS.
  - id: bio-neural-007
    topic: neural-neural-organisation
    subtopic: Afferent and efferent fibres
    concept: Afferent fibres carry impulses from tissues and organs to the CNS
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [afferent]
    stem: Afferent nerve fibres of the peripheral neural system transmit impulses from
    options:
      - the CNS to the peripheral tissues or organs
      - skeletal muscles to smooth muscles
      - tissues or organs to the CNS
      - the brain to the spinal cord only
    answer: 2
    explanation: Afferent fibres transmit impulses from the tissues and organs to the CNS. Efferent fibres do the opposite and carry regulatory impulses from the CNS to the concerned peripheral tissues and organs.
  - id: bio-neural-008
    topic: neural-neural-organisation
    subtopic: Somatic and autonomic systems
    concept: The somatic neural system relays impulses from the CNS to skeletal muscles
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [somatic]
    stem: The somatic neural system relays impulses from the CNS to the
    options:
      - skeletal muscles
      - involuntary organs
      - smooth muscles of the body
      - viscera
    answer: 0
    explanation: NCERT says the somatic neural system relays impulses from the CNS to the skeletal muscles. Involuntary organs, smooth muscles and the viscera are supplied by the autonomic neural system.
  - id: bio-neural-009
    topic: neural-neural-organisation
    subtopic: Somatic and autonomic systems
    concept: The autonomic neural system supplies involuntary organs and smooth muscles
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [autonomic]
    stem: The autonomic neural system transmits impulses from the CNS to the
    options:
      - skeletal muscles attached to the bones
      - involuntary organs and smooth muscles of the body
      - sense organs and the skin
      - brain, from the viscera only
    answer: 1
    explanation: The autonomic neural system carries impulses from the CNS to the involuntary organs and smooth muscles of the body. Skeletal muscles are served by the somatic neural system.
  - id: bio-neural-010
    topic: neural-neural-organisation
    subtopic: Somatic and autonomic systems
    concept: The autonomic system has sympathetic and parasympathetic divisions
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [autonomic, sympathetic]
    stem: The autonomic neural system is further classified into
    options:
      - somatic and visceral neural systems
      - afferent and efferent neural systems
      - central and peripheral neural systems
      - sympathetic and parasympathetic neural systems
    answer: 3
    explanation: NCERT classifies the autonomic neural system into the sympathetic neural system and the parasympathetic neural system. Somatic and autonomic are the divisions of the PNS, and afferent and efferent describe nerve fibres.
  - id: bio-neural-011
    topic: neural-neural-organisation
    subtopic: Visceral nervous system
    concept: Visceral nervous system is the complex of nerves, fibres, ganglia and plexuses between CNS and viscera
    category: factual
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [visceral]
    stem: The part of the peripheral nervous system that comprises the whole complex of nerves, fibres, ganglia and plexuses between the CNS and the viscera is the
    options:
      - somatic neural system
      - central neural system
      - parasympathetic neural system
      - visceral nervous system
    answer: 3
    explanation: NCERT describes the visceral nervous system as the part of the peripheral nervous system made of the whole complex of nerves, fibres, ganglia and plexuses by which impulses travel from the CNS to the viscera and from the viscera to the CNS. The somatic system serves skeletal muscles and the CNS is the brain and spinal cord.
  - id: bio-neural-012
    topic: neural-neural-organisation
    subtopic: Types of neurons
    concept: A multipolar neuron has one axon and two or more dendrites
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [multipolar, neuron-types]
    stem: A neuron that has one axon and two or more dendrites is called
    options:
      - bipolar
      - unipolar
      - multipolar
      - myelinated
    answer: 2
    explanation: On the basis of the number of axons and dendrites, a neuron with one axon and two or more dendrites is multipolar. A bipolar neuron has one axon and one dendrite, and a unipolar neuron has a cell body with one axon only.
  - id: bio-neural-013
    topic: neural-neural-organisation
    subtopic: Types of neurons
    concept: Bipolar neurons are found in the retina
    category: factual
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [bipolar, neuron-types]
    stem: Bipolar neurons, which have one axon and one dendrite, are found in the
    options:
      - cerebral cortex
      - retina of the eye
      - spinal and cranial nerves
      - embryonic stage
    answer: 1
    explanation: NCERT places bipolar neurons in the retina of the eye. Multipolar neurons occur in the cerebral cortex and unipolar neurons are usually found in the embryonic stage.
  - id: bio-neural-014
    topic: neural-neural-organisation
    subtopic: Types of neurons
    concept: A unipolar neuron has a cell body with one axon only
    category: factual
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [unipolar, neuron-types]
    stem: The cell body of a unipolar neuron gives rise to
    options:
      - one axon only
      - one axon and one dendrite
      - one axon and two or more dendrites
      - one dendrite only
    answer: 0
    explanation: In a unipolar neuron the cell body has one axon only, and such neurons are usually found in the embryonic stage. One axon with one dendrite describes a bipolar neuron, and one axon with two or more dendrites a multipolar neuron.
  - id: bio-neural-015
    topic: neural-neural-organisation
    subtopic: Neuron structure
    concept: Dendrites conduct towards and the axon away from the cell body
    category: concept
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [dendrite, axon]
    stem: In a neuron, the dendrites and the axon conduct impulses respectively
    options:
      - towards the cell body and away from the cell body
      - away from the cell body and towards the cell body
      - towards the cell body and towards the cell body
      - away from the cell body and away from the cell body
    answer: 0
    explanation: Dendrites are short, repeatedly branched fibres that transmit impulses towards the cell body. The axon is a long fibre that transmits nerve impulses away from the cell body to a synapse or a neuromuscular junction.
  - id: bio-neural-016
    topic: neural-neural-organisation
    subtopic: Neuron structure
    concept: Synaptic vesicles with neurotransmitters lie in the synaptic knob
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [synaptic-knob, neurotransmitter]
    stem: The bulb-like ending of each axon branch, which has synaptic vesicles containing chemicals called neurotransmitters, is the
    options:
      - node of Ranvier
      - Nissl's granule
      - synaptic knob
      - dendrite
    answer: 2
    explanation: Each branch of the distal end of an axon ends as a bulb-like synaptic knob, which possesses synaptic vesicles containing neurotransmitters. Nissl's granules lie in the cell body and dendrites, and the node of Ranvier is a gap in the myelin sheath.
  - id: bio-neural-017
    topic: neural-neural-organisation
    subtopic: Myelinated and unmyelinated fibres
    concept: Schwann cells form the myelin sheath
    category: factual
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [myelin-sheath, schwann-cells]
    stem: In a myelinated nerve fibre, the myelin sheath around the axon is formed by
    options:
      - Nissl's granules
      - synaptic vesicles
      - Schwann cells
      - macrophages
    answer: 2
    explanation: NCERT states that myelinated nerve fibres are enveloped with Schwann cells, which form a myelin sheath around the axon. Nissl's granules and synaptic vesicles are structures inside the neuron, and macrophages do not form the sheath.
  - id: bio-neural-018
    topic: neural-neural-organisation
    subtopic: Myelinated and unmyelinated fibres
    concept: Nodes of Ranvier are the gaps between adjacent myelin sheaths
    category: factual
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [node-of-ranvier, myelin-sheath]
    stem: The gaps between two adjacent myelin sheaths along a nerve fibre are called
    options:
      - synaptic knobs
      - synaptic clefts
      - Nissl's granules
      - nodes of Ranvier
    answer: 3
    explanation: NCERT calls the gaps between two adjacent myelin sheaths the nodes of Ranvier. Synaptic knobs are the bulb-like endings of the axon branches and Nissl's granules lie in the cell body and dendrites.
  - id: bio-neural-019
    topic: neural-neural-organisation
    subtopic: Myelinated and unmyelinated fibres
    concept: An unmyelinated fibre is enclosed by a Schwann cell that forms no myelin sheath
    category: concept
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [unmyelinated, schwann-cells]
    stem: Which description fits an unmyelinated nerve fibre?
    options:
      - It is covered by a myelin sheath that is interrupted at nodes of Ranvier
      - It is enclosed by a Schwann cell that does not form a myelin sheath around the axon
      - It has a bare axon with no Schwann cell around it
      - It is a dendrite-like fibre that conducts impulses only towards the cell body
    answer: 1
    explanation: NCERT says an unmyelinated nerve fibre is enclosed by a Schwann cell that does not form a myelin sheath around the axon. A myelin sheath with nodes of Ranvier is the feature of the myelinated fibre, and the Schwann cell is still present.
  - id: bio-neural-020
    topic: neural-neural-organisation
    subtopic: Neural control of muscle
    concept: A motor neuron with the muscle fibres connected to it forms a motor unit
    category: factual
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [motor-unit]
    stem: A motor neuron along with the muscle fibres connected to it constitutes a
    options:
      - neuromuscular junction
      - motor-end plate
      - motor unit
      - sarcomere
    answer: 2
    explanation: In the NCERT account of muscle contraction, a motor neuron together with the muscle fibres connected to it is called a motor unit. The junction between the motor neuron and the sarcolemma is the neuromuscular junction (motor-end plate).
  - id: bio-neural-021
    topic: neural-neural-organisation
    subtopic: Coordination
    concept: The neural system gives point-to-point connections for quick coordination
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [coordination, neural-system]
    stem: Which system provides an organised network of point-to-point connections for quick coordination?
    options:
      - Endocrine system
      - Neural system
      - Circulatory system
      - Excretory system
    answer: 1
    explanation: NCERT states that the neural system provides an organised network of point-to-point connections for quick coordination. The endocrine system works by chemical integration through hormones.
  - id: bio-neural-022
    topic: neural-neural-organisation
    subtopic: Neural control of the heart
    concept: Sympathetic and parasympathetic signals have opposite effects on the heart
    category: concept
    format: direct
    difficulty: 4
    time: 85
    ncert: true
    battle: false
    tags: [sympathetic, parasympathetic, heart]
    stem: Which row correctly describes the control of the human heart by the autonomic neural system?
    options:
      - 'Sympathetic: lowers heart rate; parasympathetic: raises heart rate and cardiac output'
      - 'Sympathetic: raises heart rate; parasympathetic: raises the speed of conduction of the action potential'
      - 'Sympathetic: lowers strength of ventricular contraction; parasympathetic: lowers heart rate'
      - 'Sympathetic: raises heart rate and strength of ventricular contraction; parasympathetic: lowers heart rate and speed of conduction of the action potential'
    answer: 3
    explanation: Sympathetic neural signals increase the rate of heartbeat and the strength of ventricular contraction, raising cardiac output. Parasympathetic signals decrease the rate of heartbeat and the speed of conduction of the action potential, lowering cardiac output.
  - id: bio-neural-023
    topic: neural-neural-organisation
    subtopic: Coordination
    concept: The endocrine system provides chemical integration through hormones
    category: concept
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [endocrine, coordination]
    stem: In contrast to the point-to-point connections of the neural system, the endocrine system provides
    options:
      - chemical integration through hormones
      - rapid integration through nerve impulses
      - integration through ganglia and plexuses
      - integration through afferent and efferent fibres
    answer: 0
    explanation: NCERT states that the endocrine system provides chemical integration through hormones, whereas the neural system gives point-to-point connections for quick coordination. Nerve impulses, ganglia and afferent or efferent fibres belong to neural coordination.
  - id: bio-neural-024
    topic: neural-neural-organisation
    subtopic: Afferent and efferent fibres
    concept: A fibre from the CNS to a leg skeletal muscle is an efferent fibre of the somatic system
    category: application
    format: direct
    difficulty: 4
    time: 85
    ncert: false
    battle: true
    tags: [efferent, somatic]
    stem: A nerve fibre carries regulatory impulses from the CNS to the skeletal muscles of the leg. It is best described as
    options:
      - an afferent fibre of the somatic neural system
      - an efferent fibre of the autonomic neural system
      - an efferent fibre of the somatic neural system
      - an afferent fibre of the autonomic neural system
    answer: 2
    explanation: Fibres carrying regulatory impulses from the CNS to the periphery are efferent, and impulses going to skeletal muscles are relayed by the somatic neural system. An afferent fibre would bring impulses to the CNS, and the autonomic system supplies involuntary organs and smooth muscles.
  - id: bio-neural-025
    topic: neural-neural-organisation
    subtopic: Somatic and autonomic systems
    concept: Correct statement on afferent, efferent, somatic and autonomic roles
    category: concept
    format: statements
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [pns, somatic]
    stem: Which one of the following statements about the human peripheral neural system is correct?
    options:
      - Afferent fibres carry regulatory impulses from the CNS to the peripheral organs.
      - The somatic neural system relays impulses from the CNS to the skeletal muscles.
      - Efferent fibres carry impulses from the tissues and organs to the CNS.
      - The autonomic neural system relays impulses from the CNS to the skeletal muscles.
    answer: 1
    explanation: The somatic neural system relays impulses from the CNS to skeletal muscles. Afferent fibres carry impulses to the CNS, efferent fibres carry regulatory impulses from the CNS, and the skeletal muscles are not served by the autonomic neural system.
  - id: bio-neural-026
    topic: neural-neural-organisation
    subtopic: Somatic and autonomic systems
    concept: Identify the incorrect statement about the autonomic neural system
    category: concept
    format: statements
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [autonomic]
    stem: Which one of the following statements about the autonomic neural system is NOT correct?
    options:
      - It is a division of the peripheral neural system.
      - It transmits impulses from the CNS to the involuntary organs and smooth muscles.
      - It is further classified into the sympathetic and parasympathetic neural systems.
      - It relays impulses from the CNS to the skeletal muscles of the body.
    answer: 3
    explanation: The autonomic neural system is a division of the PNS that transmits impulses from the CNS to involuntary organs and smooth muscles, and it is classified into sympathetic and parasympathetic systems. Relaying impulses to skeletal muscles is the work of the somatic neural system.
  - id: bio-neural-027
    topic: neural-neural-organisation
    subtopic: Types of neurons
    concept: Correct pairing of neuron type, structure and location
    category: concept
    format: statements
    difficulty: 4
    time: 85
    ncert: true
    battle: false
    tags: [neuron-types]
    stem: Which one of the following statements about the types of neurons is correct?
    options:
      - Multipolar neurons have one axon and two or more dendrites and are found in the cerebral cortex.
      - Bipolar neurons have one axon and one dendrite and are found in the cerebral cortex.
      - Unipolar neurons have a cell body with one axon only and are found in the retina of the eye.
      - Multipolar neurons have a cell body with one axon only and are usually found in the embryonic stage.
    answer: 0
    explanation: Multipolar neurons have one axon and two or more dendrites and occur in the cerebral cortex. Bipolar neurons (one axon, one dendrite) are found in the retina, and unipolar neurons (cell body with one axon only) are usually found in the embryonic stage; the other options mix up these features.
  - id: bio-neural-028
    topic: neural-neural-organisation
    subtopic: Neural organisation across animals
    concept: Nerve cord of chordates versus non-chordates and the cockroach
    category: concept
    format: statements
    difficulty: 4
    time: 85
    ncert: true
    battle: false
    tags: [nerve-cord, chordates]
    stem: Which one of the following statements about the nervous system of animals is correct?
    options:
      - In chordates the nerve cord is ventral, solid and double, whereas in non-chordates it is dorsal, hollow and single.
      - In the cockroach the whole nervous system is confined to the head, and the brain is the supra-oesophageal ganglion.
      - In Hydra, a brain along with a number of ganglia forms the neural system.
      - In chordates the nerve cord is dorsal, hollow and single, whereas in non-chordates it is ventral, solid and double.
    answer: 3
    explanation: In chordates the nerve cord is dorsal, hollow and single, whereas in non-chordates it is ventral, solid and double. The cockroach has only a bit of its nervous system in the head, the rest lying along the ventral part of the body, and Hydra has only a network of neurons.
  - id: bio-neural-029
    topic: neural-neural-organisation
    subtopic: CNS and PNS
    concept: CNS, PNS and the roles of afferent fibres
    category: concept
    format: multi-statement
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [cns, pns, afferent]
    stem: |-
      Consider the following statements about the human neural system.
      I. The CNS includes the brain and the spinal cord.
      II. The CNS is the site of information processing and control.
      III. The PNS comprises all the nerves associated with the brain and the spinal cord.
      IV. Afferent fibres transmit regulatory impulses from the CNS to the peripheral organs.
      Which of the statements are correct?
    options:
      - I, II and IV only
      - I, II and III only
      - II, III and IV only
      - I and IV only
    answer: 1
    explanation: Statements I to III follow NCERT. Statement IV is wrong because afferent fibres bring impulses from tissues and organs to the CNS; it is the efferent fibres that carry regulatory impulses from the CNS to the periphery.
  - id: bio-neural-030
    topic: neural-neural-organisation
    subtopic: Somatic and autonomic systems
