  - id: bio-microbes-030
    topic: microbes-biocontrol
    subtopic: Bacillus thuringiensis
    concept: Statements on how Bt is supplied, sprayed and how it kills
    category: concept
    format: multi-statement
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [bt, multi-statement]
    stem: |-
      Consider the following statements about *Bacillus thuringiensis* (Bt).
      I. It is available in sachets as dried spores.
      II. The spores are mixed with water and sprayed onto vulnerable plants such as brassicas and fruit trees.
      III. The toxin is released in the gut of the larvae that eat the spores, and the larvae are killed.
      IV. The sprayed spores are eaten by adult butterflies, which are killed by the toxin.
      Which of the statements are correct?
    options:
      - I, II and IV only
      - II, III and IV only
      - I, II and III only
      - I, III and IV only
    answer: 2
    explanation: Statements I to III follow NCERT. Statement IV is wrong because it is the larvae, that is the caterpillars eating the sprayed plants, that are killed, not the adult butterflies.
  - id: bio-microbes-031
    topic: microbes-biocontrol
    subtopic: Organic farming view
    concept: Statements on the organic farmer's holistic approach to pests
    category: concept
    format: multi-statement
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [organic-farmer, multi-statement]
    stem: |-
      Consider the following statements about the organic farmer's approach to pests.
      I. Biodiversity is believed to further health.
      II. A landscape with less variety is more sustainable.
      III. The insects called pests are kept at manageable levels instead of being eradicated.
      IV. The approach is holistic and tries to understand the webs of interaction among the organisms of the field.
      Which of the statements are correct?
    options:
      - I, II and III only
      - II, III and IV only
      - I, II and IV only
      - I, III and IV only
    answer: 3
    explanation: Statement II is wrong because NCERT says the more variety a landscape has, the more sustainable it is. Statements I, III and IV agree with NCERT.
  - id: bio-microbes-032
    topic: microbes-biocontrol
    subtopic: Baculoviruses
