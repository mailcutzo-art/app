    tags: [trichoderma, plant-disease]
    stem: '*Trichoderma* is being developed for use as a biological control in the treatment of'
    options:
      - butterfly caterpillar infestation
      - plant disease
      - mosquito breeding
      - aphid infestation
    answer: 1
    explanation: NCERT presents Trichoderma as a biological control for the treatment of plant disease; it is an effective biocontrol agent of several plant pathogens. Caterpillars, mosquitoes and aphids are tackled by Bt, dragonflies and ladybirds respectively.
  - id: bio-microbes-025
    topic: microbes-biocontrol
    subtopic: Bacillus thuringiensis
    concept: Correct statement on Bt spores, spraying and larvae
    category: concept
