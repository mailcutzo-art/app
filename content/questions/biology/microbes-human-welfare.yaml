      - Bt and baculoviruses act on insect pests, whereas *Trichoderma* acts on plant pathogens
      - Baculoviruses and *Trichoderma* are both free-living organisms common in root ecosystems
    answer: 2
    explanation: Bt kills the larvae that eat it, baculoviruses attack insects and other arthropods, and Trichoderma is a biocontrol agent of plant pathogens. Bt is a bacterium, Trichoderma a fungus and baculoviruses are viruses; only Bt is described as dried spores, and only Trichoderma as common in root ecosystems.
  - id: bio-microbes-029
    topic: microbes-biocontrol
