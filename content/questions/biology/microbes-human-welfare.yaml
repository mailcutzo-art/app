  - id: bio-microbes-027
    topic: microbes-biocontrol
    subtopic: Organic farming view
    concept: The view of the organic farmer on pests and ecosystems
    category: concept
    format: statements
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [organic-farmer, statements]
    stem: Which one of the following statements reflects the view of the organic farmer, as given in NCERT?
    options:
      - A uniform landscape with a few species is the most sustainable
      - Insects called pests should be kept at manageable levels, not eradicated
      - Predators and parasitic insects survive well even after all pests are removed
      - Chemical methods should be used to kill both useful and harmful life forms
    answer: 1
    explanation: The organic farmer works to keep pests at manageable levels through checks and balances. Greater variety makes a landscape more sustainable, beneficial insects depend on pests, and killing both useful and harmful life forms with chemicals is the conventional practice.
  - id: bio-microbes-028
    topic: microbes-biocontrol
