questions:
  - id: bio-microbes-001
    topic: microbes-biocontrol
    subtopic: 'Biocontrol: meaning'
    concept: Biocontrol means using biological methods to control plant diseases and pests
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [biocontrol, definition]
    stem: Biocontrol refers to the use of which kind of methods for controlling plant diseases and pests?
    options:
      - Chemical methods using insecticides and pesticides
      - Biological methods
      - Methods that depend on weedicides
      - Methods that depend on chemical fertilisers
    answer: 1
    explanation: NCERT defines biocontrol as the use of biological methods for controlling plant diseases and pests. Insecticides, pesticides and weedicides are chemical methods, which biocontrol aims to replace.
  - id: bio-microbes-002
    topic: microbes-biocontrol
    subtopic: Bacillus thuringiensis
    concept: Bt is the microbial biocontrol agent used against butterfly caterpillars
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [bt, caterpillars]
    stem: Which bacterium is introduced as a microbial biocontrol agent to control butterfly caterpillars?
    options:
      - '*Rhizobium*'
      - '*Lactobacillus*'
      - '*Methanobacterium*'
      - '*Bacillus thuringiensis*'
    answer: 3
    explanation: NCERT gives *Bacillus thuringiensis* (Bt) as the microbial biocontrol agent against butterfly caterpillars. *Rhizobium* is a biofertiliser, *Lactobacillus* turns milk into curd, and *Methanobacterium* is a methanogen of biogas plants.
  - id: bio-microbes-003
    topic: microbes-biocontrol
    subtopic: Trichoderma
    concept: Trichoderma is a free-living fungus that controls plant pathogens
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [trichoderma, fungus]
    stem: '*Trichoderma*, an effective biocontrol agent of several plant pathogens, is a'
    options:
      - nitrogen-fixing bacterium
      - free-living fungus
      - virus of insects
      - cyanobacterium of paddy fields
    answer: 1
    explanation: '*Trichoderma* species are free-living fungi that are very common in root ecosystems. Nitrogen-fixing bacteria and cyanobacteria are biofertilisers, and the viruses used against insects are baculoviruses.'
  - id: bio-microbes-004
    topic: microbes-biocontrol
    subtopic: Natural predators
    concept: Dragonflies are useful in getting rid of mosquitoes
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [dragonfly, predators]
    stem: Dragonflies are useful in biocontrol because they help to get rid of
    options:
      - aphids
      - mosquitoes
      - butterfly caterpillars
      - plant pathogens
    answer: 1
    explanation: NCERT states that the ladybird and dragonflies are useful to get rid of aphids and mosquitoes, respectively. Caterpillars are controlled by Bt and plant pathogens by *Trichoderma*.
  - id: bio-microbes-005
    topic: microbes-biocontrol
    subtopic: Baculoviruses
    concept: Most baculoviruses used in biocontrol belong to the genus Nucleopolyhedrovirus
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [baculovirus, nucleopolyhedrovirus]
    stem: The majority of baculoviruses used as biological control agents belong to the genus
    options:
      - '*Nucleopolyhedrovirus*'
      - '*Bacillus*'
      - '*Trichoderma*'
      - '*Glomus*'
    answer: 0
    explanation: Most baculoviruses used in biocontrol are in the genus *Nucleopolyhedrovirus*. *Bacillus* is a bacterial genus (Bt), *Trichoderma* is a free-living fungus and *Glomus* is a mycorrhizal fungus.
  - id: bio-microbes-006
    topic: microbes-biocontrol
    subtopic: Bacillus thuringiensis
    concept: Bt is made available in sachets as dried spores
    category: factual
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [bt, spores]
    stem: In practice, *Bacillus thuringiensis* is made available to farmers in sachets as
    options:
      - dried fungal mycelium
      - dried viral particles
      - dried cells of nitrogen-fixing bacteria
      - dried spores
    answer: 3
    explanation: NCERT says Bt is available in sachets as dried spores, which are mixed with water and sprayed on vulnerable plants. Fungal mycelium and viral particles belong to other kinds of agents.
  - id: bio-microbes-007
    topic: microbes-biocontrol
    subtopic: Bacillus thuringiensis
    concept: Bt spores are sprayed on vulnerable plants such as brassicas and fruit trees
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [bt, brassicas]
    stem: The dried spores of *Bacillus thuringiensis* are mixed with water and sprayed onto vulnerable plants such as
    options:
      - brassicas and fruit trees
      - cereals and pulses
      - paddy and aquatic plants
      - root crops and tubers
    answer: 0
    explanation: NCERT names brassicas and fruit trees as the vulnerable plants on which the Bt spore suspension is sprayed, so that insect larvae eat it.
  - id: bio-microbes-008
    topic: microbes-biocontrol
    subtopic: Bacillus thuringiensis
    concept: The Bt toxin is released in the gut of the larvae that eat the spores
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [bt, larvae, gut]
    stem: After larvae eat plants sprayed with *Bacillus thuringiensis* spores, the toxin is released in their
    options:
      - salivary glands
      - gut
      - Malpighian tubules
      - fat body
    answer: 1
    explanation: NCERT states that in the gut of the larvae the toxin is released and the larvae get killed. The toxin acts after the spores are eaten, not in the other organs listed.
  - id: bio-microbes-009
    topic: microbes-biocontrol
    subtopic: Trichoderma
    concept: Trichoderma species are free-living fungi common in root ecosystems
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [trichoderma, root-ecosystem]
    stem: '*Trichoderma* species are free-living fungi that are very common in the'
    options:
      - rumen of cattle
      - anaerobic sludge of sewage plants
      - water of paddy fields
      - root ecosystems
    answer: 3
    explanation: NCERT describes Trichoderma as free-living fungi very common in the root ecosystems. The rumen and anaerobic sludge are habitats of methanogens, and paddy-field water is where cyanobacteria act as biofertilisers.
  - id: bio-microbes-010
    topic: microbes-biocontrol
    subtopic: Baculoviruses
    concept: Baculoviruses attack insects and other arthropods
    category: factual
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [baculovirus, arthropods]
    stem: Baculoviruses are pathogens that attack
    options:
      - insects only
      - insects, mammals and birds
      - insects and other arthropods
      - plants and soil fungi
    answer: 2
    explanation: NCERT says baculoviruses are pathogens that attack insects and other arthropods, so insects alone is incomplete. They have been shown to have no negative impact on plants, mammals, birds or fish.
  - id: bio-microbes-011
    topic: microbes-biocontrol
    subtopic: Chemical pesticides
    concept: Chemical insecticides and pesticides are toxic to humans and animals alike
    category: concept
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [pesticides, pollution]
    stem: NCERT describes the chemical insecticides and pesticides of modern agriculture as
    options:
      - toxic to insect pests but safe for human beings and animals
      - harmful to human beings but safe for animals
      - harmful only while they remain in the soil, not in the crops
      - toxic and extremely harmful to human beings and animals alike
    answer: 3
    explanation: NCERT says these chemicals are toxic and extremely harmful to human beings and animals alike, and that they pollute the soil, ground water, fruits, vegetables and crop plants.
  - id: bio-microbes-012
    topic: microbes-biocontrol
    subtopic: Organic farming view
    concept: The key belief of the organic farmer is that biodiversity furthers health
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [organic-farmer, biodiversity]
    stem: A key belief of the organic farmer is that
    options:
      - the complete eradication of pests is needed for a healthy crop
      - a landscape with less variety is more sustainable
      - chemical control gives the most dependable protection
      - biodiversity furthers health
    answer: 3
    explanation: NCERT states that the key belief of the organic farmer is that biodiversity furthers health, and that the more variety a landscape has, the more sustainable it is.
  - id: bio-microbes-013
    topic: microbes-biocontrol
    subtopic: Natural predators
    concept: The ladybird, a beetle with red and black markings, gets rid of aphids
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [ladybird, aphids]
    stem: The familiar beetle with red and black markings that helps to get rid of aphids is the
    options:
      - dragonfly
      - honeybee
      - ladybird
      - butterfly
    answer: 2
    explanation: NCERT names the ladybird, a beetle with red and black markings, as useful in getting rid of aphids; dragonflies are used against mosquitoes. Honeybees and butterflies are not described as biocontrol agents.
  - id: bio-microbes-014
    topic: microbes-biocontrol
    subtopic: Chemical pesticides
    concept: Chemicals used to remove weeds (weedicides) also pollute the soil
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [weedicides, soil-pollution]
    stem: Besides insecticides and pesticides, the chemicals used to remove weeds also pollute the soil. They are called
    options:
      - weedicides
      - biofertilisers
      - antibiotics
      - enzymes
    answer: 0
    explanation: NCERT notes that the soil is also polluted through the use of weedicides to remove weeds. Biofertilisers, antibiotics and enzymes are microbial products with other uses.
  - id: bio-microbes-015
    topic: microbes-biocontrol
    subtopic: Organic farming view
    concept: Pests are kept at manageable levels, not eradicated
    category: concept
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [organic-farmer, pests]
    stem: In the biological approach of the organic farmer, the insects sometimes called pests are
    options:
      - kept at manageable levels, not eradicated
      - eradicated completely before every crop
      - protected from all natural predators
      - killed together with useful insects to avoid competition
    answer: 0
    explanation: NCERT says the organic farmer does not eradicate the pests but keeps them at manageable levels through a complex system of checks and balances within a living ecosystem.
  - id: bio-microbes-016
    topic: microbes-biocontrol
    subtopic: Organic farming view
    concept: Eradicating pests is undesirable because beneficial predators and parasites depend on them
    category: concept
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [organic-farmer, predators, parasites]
    stem: Why does the organic farmer regard the eradication of pests as undesirable?
    options:
      - Pests are needed for pollination of the crop
      - Beneficial predatory and parasitic insects depend on pests as food or hosts
      - Pests are the main source of nutrients for the soil of the field
      - Pests are harmless to the crop at every population level
    answer: 1
    explanation: NCERT gives the reason that without pests, the beneficial predatory and parasitic insects, which depend on them as food or hosts, would not be able to survive.
  - id: bio-microbes-017
    topic: microbes-biocontrol
    subtopic: Organic farming view
    concept: Conventional chemical methods kill useful and harmful life forms indiscriminately
    category: concept
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [conventional-farming, chemicals]
    stem: NCERT says that the chemical methods of conventional farming often kill
    options:
      - only the harmful pests, sparing the useful organisms
      - both useful and harmful life forms indiscriminately
      - only the predatory and parasitic insects
      - only the weeds that grow in the field
    answer: 1
    explanation: In contrast to the holistic approach of the organic farmer, conventional chemical methods often kill both useful and harmful life forms indiscriminately.
  - id: bio-microbes-018
    topic: microbes-biocontrol
    subtopic: Organic farming view
    concept: Knowing life cycles, feeding patterns and habitats helps develop appropriate biocontrol
    category: concept
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [organic-farmer, life-cycles]
    stem: An organic farmer studies the predators and pests of the field, their life cycles, feeding patterns and preferred habitats in order to
    options:
      - decide the dose of chemical insecticides
      - develop appropriate means of biocontrol
      - eradicate all predators and pests
      - select the weedicide for the field
    answer: 1
    explanation: NCERT says that becoming familiar with the life forms of the field, their life cycles, patterns of feeding and preferred habitats helps to develop appropriate means of biocontrol.
  - id: bio-microbes-019
    topic: microbes-biocontrol
    subtopic: Baculoviruses
    concept: Baculoviruses suit species-specific, narrow-spectrum insecticidal applications
    category: concept
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [baculovirus, narrow-spectrum]
    stem: Baculoviruses are described as excellent candidates for
    options:
      - broad-spectrum control of insects, birds and fish
      - control of plant pathogens in root ecosystems
      - species-specific, narrow-spectrum insecticidal applications
      - biological predation on aphids and mosquitoes
    answer: 2
    explanation: NCERT calls baculoviruses excellent candidates for species-specific, narrow-spectrum insecticidal applications. Root pathogens are handled by *Trichoderma*, and aphids and mosquitoes by ladybirds and dragonflies.
  - id: bio-microbes-020
    topic: microbes-biocontrol
    subtopic: Integrated pest management
    concept: Baculoviruses spare beneficial insects conserved in an IPM programme
    category: concept
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [baculovirus, ipm]
    stem: Baculoviruses are especially desirable in an integrated pest management programme because they
    options:
      - kill every insect in the field, useful or harmful
      - fix atmospheric nitrogen and supply it to the crop
      - act as broad-spectrum insecticides on all arthropods
      - do not harm the beneficial insects that are being conserved
    answer: 3
    explanation: NCERT notes that baculoviruses have no negative impact on non-target insects, which is desirable when beneficial insects are conserved in an IPM programme or when an ecologically sensitive area is treated.
  - id: bio-microbes-021
    topic: microbes-biocontrol
    subtopic: Bt toxin genes in plants
    concept: Bt-cotton carries Bacillus thuringiensis toxin genes introduced by genetic engineering
    category: concept
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [bt-cotton, genetic-engineering]
    stem: Bt-cotton is an example of a crop in which
    options:
      - dried Bt spores are mixed with water and sprayed on the leaves
      - the roots are colonised by *Trichoderma* to check pathogens
      - baculoviruses are mixed with the soil to kill insect larvae
      - '*B. thuringiensis* toxin genes have been introduced by genetic engineering'
    answer: 3
    explanation: Through genetic engineering, scientists introduced *Bacillus thuringiensis* toxin genes into plants such as cotton, which makes them resistant to insect pests. Spraying dried spores is a different method used on ordinary plants.
  - id: bio-microbes-022
    topic: microbes-biocontrol
    subtopic: Trichoderma
    concept: Trichoderma includes biocontrol agents and a species that yields cyclosporin A
    category: concept
    format: direct
    difficulty: 4
    time: 85
    ncert: true
    battle: false
    tags: [trichoderma, cyclosporin-a]
    stem: Which fungal genus includes species that act as biocontrol agents of plant pathogens and also a species that yields the immunosuppressant cyclosporin A?
    options:
      - '*Penicillium*'
      - '*Aspergillus*'
      - '*Trichoderma*'
      - '*Monascus*'
    answer: 2
    explanation: '*Trichoderma* species control several plant pathogens, and *Trichoderma polysporum* yields cyclosporin A, used as an immunosuppressant in organ-transplant patients. *Penicillium* gives penicillin, *Aspergillus niger* citric acid and *Monascus purpureus* statins.'
  - id: bio-microbes-023
    topic: microbes-biocontrol
    subtopic: Comparison of agents
    concept: Ladybird is a biocontrol agent that is not a microbe
    category: concept
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [ladybird, microbes]
    stem: Which of the following biocontrol agents is not a microbe?
    options:
      - '*Bacillus thuringiensis*'
      - '*Trichoderma*'
      - '*Nucleopolyhedrovirus*'
      - Ladybird
    answer: 3
    explanation: Bt is a bacterium, *Trichoderma* a fungus and *Nucleopolyhedrovirus* a virus, so all three are microbes. The ladybird is a beetle, an insect predator of aphids.
  - id: bio-microbes-024
    topic: microbes-biocontrol
    subtopic: Trichoderma
    concept: Trichoderma is being developed as a biological control for plant disease
    category: concept
    format: direct
    difficulty: 3
    time: 50
    ncert: true
