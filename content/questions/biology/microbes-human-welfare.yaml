    tags: [bt, statements]
    stem: Which one of the following statements about *Bacillus thuringiensis* as a biocontrol agent is correct?
    options:
      - Its dried spores are mixed with water and sprayed, and are eaten by insect larvae on the plants
      - It kills every insect that visits the sprayed plants, including the beneficial ones
      - Its toxin is released in the root ecosystem, where it kills several plant pathogens
      - It is a free-living fungus that is very common in the soil and in roots
    answer: 0
    explanation: NCERT says Bt is supplied as dried spores that are mixed with water and sprayed, and the larvae that eat them are killed by the toxin released in the gut. Bt leaves other insects unharmed, does not act on plant pathogens, and is a bacterium, not a fungus.
  - id: bio-microbes-026
    topic: microbes-biocontrol
