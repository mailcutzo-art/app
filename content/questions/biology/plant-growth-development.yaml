questions:
  - id: bio-growth-001
    topic: growth-growth-phases
    subtopic: Arithmetic and geometric growth
    concept: Features of arithmetic growth, geometric growth, lag and stationary phase
    category: concept
    format: match
    difficulty: 4
    time: 85
    ncert: true
    battle: false
    tags: [match, growth-rates]
    stem: |-
      Match List I with List II.
      List I
      P. Arithmetic growth
      Q. Geometric growth
      R. Lag phase
      S. Stationary phase
      List II
      1. Both progeny cells retain the ability to divide
      2. Only one daughter cell continues to divide
      3. Initial slow growth
      4. Growth slows because of limited nutrient supply
    options:
      - P-1, Q-2, R-3, S-4
      - P-2, Q-3, R-1, S-4
      - P-2, Q-1, R-3, S-4
      - P-2, Q-1, R-4, S-3
    answer: 2
    explanation: In arithmetic growth only one daughter cell continues to divide (2), while in geometric growth both progeny cells do (1). The lag phase is the initial slow growth (3), and the stationary phase appears when growth slows with limited nutrient supply (4).
  - id: bio-growth-002
    topic: growth-growth-phases
    subtopic: Geometric growth and sigmoid curve
    concept: Counting correct statements on geometric growth, log and stationary phases
    category: concept
    format: multi-statement
    difficulty: 5
    time: 120
    ncert: true
    battle: false
    tags: [geometric-growth, sigmoid-curve, stationary-phase]
    stem: |-
      Consider the following statements.
      I. In geometric growth, both progeny cells following mitotic division retain the ability to divide and continue to do so.
      II. In arithmetic growth, a plot of the growth parameter against time gives a sigmoid curve.
      III. In the log phase, growth occurs at an exponential rate.
      IV. In the stationary phase, growth slows down because the cells lose the ability to divide altogether.
      How many of the above statements are correct?
    options:
      - Only one
      - Only two
      - All four
      - Only three
    answer: 1
    explanation: Statements I and III are correct. Arithmetic growth gives a linear plot, so II is wrong. The stationary phase arises because the nutrient supply is limited, not because the cells lose the ability to divide altogether, so IV is wrong. Two statements are correct.
  - id: bio-growth-003
    topic: growth-growth-phases
    subtopic: Definition of growth
    concept: Growth is an irreversible permanent increase in size of an organ, its parts or a cell
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [growth, definition]
    stem: Growth in plants is best defined as
    options:
      - a change in the form of an organ during its life cycle
      - a temporary increase in size that reverses when water is withdrawn
      - an increase in the number of cells only, never in the size of a cell
      - an irreversible permanent increase in size of an organ, its parts or even an individual cell
    answer: 3
    explanation: NCERT defines growth as an irreversible permanent increase in size of an organ or its parts or even of an individual cell. A reversible swelling is not growth, a change of form alone is not growth, and the increase can come from cell number or from cell size.
  - id: bio-growth-004
    topic: growth-growth-phases
    subtopic: Growth equations
    concept: Final size depends on W_0 and r is the relative growth rate
    category: concept
    format: statement-pair
    difficulty: 4
    time: 85
    ncert: true
    battle: false
    tags: [exponential-growth, efficiency-index]
    stem: |-
      Statement I: In W_1 = W_0 e^{rt}, the final size is independent of the initial size W_0.
      Statement II: In this equation r is the relative growth rate and is also called the efficiency index.
    options:
      - Both Statement I and Statement II are correct
      - Both Statement I and Statement II are incorrect
      - Statement I is correct but Statement II is incorrect
      - Statement I is incorrect but Statement II is correct
    answer: 3
    explanation: 'Statement I is incorrect because NCERT states that the final size W_1 depends on the initial size W_0. Statement II is correct: r is the relative growth rate, the measure of the ability of the plant to produce new plant material.'
  - id: bio-growth-005
    topic: growth-growth-phases
    subtopic: Maturation phase
    concept: Maturation lies farther from the apex than the elongation zone
    category: concept
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [maturation-phase, root-zones]
    stem: In a growing root, the portion of the axis lying farther from the apex than the zone of elongation is undergoing
    options:
      - cell division in the meristematic phase
      - increased vacuolation of the elongation phase
      - maturation
      - the lag phase of geometric growth
    answer: 2
    explanation: The zones follow the order meristematic, elongation and maturation from the apex. The portion more proximal to the elongation zone is the maturation zone, where cells attain maximal wall thickening and protoplasmic modification.
  - id: bio-growth-006
    topic: growth-growth-phases
    subtopic: Parallel line technique
    concept: Interpret the parallel line technique on a root tip
    category: application
    format: diagram
    difficulty: 4
    time: 85
    ncert: true
    battle: false
    diagram: 'Two drawings of the same young root apex side by side, tip at the bottom. Left drawing (start): seven horizontal ink lines across the root at equal intervals of 1 mm from the apex, giving seven equal zones labelled A (nearest the apex) to G (farthest). Right drawing (after 24 hours): the root is longer and the same seven zones are visible; zones A, B, C and D are each much wider than before, while zones E, F and G are almost unchanged in width. An arrow beside the drawings is labelled ''time''.'
    tags: [diagram, parallel-line-technique]
    stem: The figure shows the parallel line technique applied to a root. What does the result demonstrate?
    options:
      - Cell division, not elongation, is confined to the zones immediately behind the apex
      - Elongation is greatest in the zones farthest from the apex, and the zones near the apex hardly elongate
      - Elongation is greatest in the zones immediately behind the apex, and the older zones far from the apex hardly elongate
      - Elongation is equal in all seven zones, since the marks stay equally spaced
    answer: 2
    explanation: In the parallel line technique, equally spaced marks drawn on the root move apart where cells elongate. NCERT states that the zones immediately behind the apex (A to D) have elongated most, which detects the zone of elongation.
  - id: bio-growth-007
    topic: growth-growth-phases
    subtopic: Growth equations
    concept: Meaning of symbols in L_t = L_0 + rt and W_1 = W_0 e^{rt}
    category: factual
    format: match
    difficulty: 4
    time: 85
    ncert: true
    battle: false
    tags: [match, equation]
    stem: |-
      Match the term in List I with its meaning in List II.
      List I
      P. L_0 in L_t = L_0 + rt
      Q. r in L_t = L_0 + rt
      R. W_0 in W_1 = W_0 e^{rt}
      S. r in W_1 = W_0 e^{rt}
      List II
      1. Initial size at the beginning of the period
      2. Length at time zero
      3. Elongation per unit time
      4. Relative growth rate (efficiency index)
    options:
      - P-1, Q-3, R-2, S-4
      - P-2, Q-3, R-1, S-4
      - P-2, Q-3, R-4, S-1
      - P-2, Q-4, R-1, S-3
    answer: 1
    explanation: L_0 is the length at time zero (2) and r in the arithmetic equation is the elongation per unit time (3). In the exponential equation W_0 is the initial size at the beginning of the period (1) and r is the relative growth rate or efficiency index (4).
  - id: bio-growth-008
    topic: growth-growth-phases
    subtopic: Absolute and relative growth rate
    concept: Compare absolute and relative growth of two leaves from the NCERT figure
    category: application
    format: diagram
    difficulty: 4
    time: 85
    ncert: true
    battle: false
    diagram: 'Two pairs of leaf outlines on a plain background. Left pair: a small leaf A with solid outline labelled ''5 cm^2'', surrounded by a larger dotted outline of the same leaf labelled ''A1, 10 cm^2''. Right pair: a large leaf B with solid outline labelled ''50 cm^2'', surrounded by a slightly larger dotted outline labelled ''B1, 55 cm^2''. A caption between the pairs says ''Both leaves increase their area by 5 cm^2 in a given time''.'
    tags: [diagram, relative-growth-rate]
    stem: In the figure, both leaves A and B gain the same area in the same time. Which one of the following is correct?
    options:
      - Their absolute growth rates are equal, but leaf A has a much higher relative growth rate than leaf B
      - Their absolute growth rates are equal, but leaf B has a higher relative growth rate because it is larger
      - Leaf B has the higher absolute growth rate and the higher relative growth rate because it is larger
      - Both absolute and relative growth rates are equal because the gain in area is the same
    answer: 0
    explanation: 'Both leaves increase by 5 cm^2, so their absolute growth rates are equal. Relative growth rate is per unit initial area: A = 5/5 = 1 and B = 5/50 = 0.1, so A has the much higher relative growth rate (10 times).'
  - id: bio-growth-009
    topic: growth-growth-phases
    subtopic: Geometric growth
    concept: A culture doubling at each cell division in geometric growth
    category: numerical
    format: direct
    difficulty: 3
    time: 50
    ncert: false
    battle: true
    tags: [geometric-growth, numerical]
    stem: A culture of 500 cells shows geometric growth, every cell dividing and the number doubling every 3 hours. Ignoring lag and stationary phases, the number of cells after 12 hours is
    options:
      - '2000'
      - '4000'
      - '8000'
      - '16000'
    answer: 2
    explanation: 12 hours with a doubling every 3 hours means 4 doublings, so N = 500 × 2^4 = 8000. Multiplying by 4 gives 2000, and miscounting the doublings as 3 or 5 gives 4000 or 16000.
  - id: bio-growth-010
    topic: growth-growth-phases
    subtopic: Arithmetic growth
    concept: Identify arithmetic growth from data and predict the length
    category: numerical
    format: case
    difficulty: 3
    time: 50
    ncert: false
    battle: false
    tags: [case, arithmetic-growth, numerical]
    stem: A seedling root measures 4.0 cm on day 0, 5.2 cm on day 2, 6.4 cm on day 4 and 7.6 cm on day 6. If the same pattern continues, what will its length be on day 10 and what kind of growth is this?
    options:
      - 10.0 cm; arithmetic growth
      - 14.9 cm; geometric growth
      - 10.0 cm; geometric growth
      - 16.0 cm; arithmetic growth
    answer: 0
    explanation: The root gains 1.2 cm every 2 days, a constant 0.6 cm per day, so it shows arithmetic growth and L_t = 4.0 + 0.6t. On day 10, L_t = 4.0 + 6.0 = 10.0 cm. Treating 1.2 as the daily rate gives 16.0 cm, and a ratio of 1.3 per 2 days (a geometric pattern) gives about 14.9 cm.
  - id: bio-growth-011
    topic: growth-growth-phases
    subtopic: Indeterminate growth
    concept: Unlimited growth is due to meristems, not to division of all cells
    category: concept
    format: multi-statement
    difficulty: 4
    time: 85
    ncert: true
    battle: false
    tags: [meristem, open-growth, secondary-growth]
    stem: |-
      Consider the following statements about plant growth.
      I. Unlimited growth in plants is due to the presence of meristems at certain locations.
      II. All cells in the plant body retain the ability to divide and self-perpetuate.
      III. In the open form of growth, new cells are always added to the plant body by meristem activity.
      IV. Apical meristems alone are responsible for the increase in girth of organs.
      Which of the statements are correct?
    options:
      - I and III only
      - I, III and IV only
      - II and IV only
      - I, II and III only
    answer: 0
    explanation: Statements I and III are NCERT facts. Statement II is wrong because only the meristem cells divide and self-perpetuate, while their products lose the capacity to divide. Statement IV is wrong because girth increases through the lateral meristems (vascular cambium and cork cambium).
  - id: bio-growth-012
    topic: growth-growth-phases
    subtopic: Arithmetic growth
    concept: L_t = L_0 + rt gives the length of a root elongating at a constant rate
    category: numerical
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [arithmetic-growth, numerical]
    stem: A root is 2.4 cm long at the start and elongates at a constant 0.5 cm per day. Its length after 6 days, from L_t = L_0 + rt, is
    options:
      - 3.0 cm
      - 5.4 cm
      - 8.4 cm
      - 14.4 cm
    answer: 1
    explanation: L_t = L_0 + rt = 2.4 + 0.5 × 6 = 2.4 + 3.0 = 5.4 cm. Forgetting L_0 gives 3.0 cm, and wrongly adding t instead of rt gives 8.4 cm.
  - id: bio-growth-013
    topic: growth-growth-phases
    subtopic: Arithmetic and geometric growth
    concept: Compare a straight-line and a J-shaped curve and the sigmoid outcome
    category: concept
    format: graph
    difficulty: 5
    time: 120
    ncert: true
    battle: false
    diagram: A graph with the horizontal axis 'Time' and the vertical axis 'Growth parameter (length or weight)'. Curve X is a straight line rising at constant slope from the origin to the top right corner. Curve Y starts at the same point as X, rises slowly at first, then bends upward and climbs ever more steeply, ending above X at the top right corner. It shows no flattening. Curves are labelled X and Y at their right ends.
    tags: [graph, arithmetic-growth, geometric-growth]
    stem: Curves X and Y are plotted on the same axes. Which statement is correct?
    options:
      - X shows the log phase of geometric growth; Y shows arithmetic growth that levels off at a stationary phase
      - X shows arithmetic growth; Y shows the log phase of geometric growth, which would level off only when nutrients become limited
      - X shows geometric growth; Y shows arithmetic growth with a constant rate of elongation
      - Both X and Y show arithmetic growth because both increase with time
    answer: 1
    explanation: X is a straight line, the plot of arithmetic growth (L_t = L_0 + rt). Y rises at an ever steeper exponential rate, the log phase of geometric growth, which flattens into a stationary phase only when nutrient supply becomes limited, giving a sigmoid curve.
  - id: bio-growth-014
    topic: growth-growth-phases
    subtopic: Phases of growth
    concept: Identify three regions of a root tip and their characteristic features
    category: concept
    format: diagram
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    diagram: Longitudinal outline of a young root tip drawn vertically with the apex at the bottom. Three consecutive regions are bracketed from the apex upward. Region P (bottom, shortest) is drawn with small square cells packed with dense cytoplasm, each with one large nucleus and thin walls. Region Q (middle, longer) is drawn with cells clearly longer than wide, each containing a large central vacuole. Region R (top) is drawn with cells of varied shapes with visibly thick walls. A vertical arrow labelled 'distance from apex' points upward along the side. Region names are not written.
    tags: [diagram, root-zones]
    stem: In the figure of a young root tip, regions P, Q and R are marked from the apex upward. Which row correctly names the phase of each region and one of its features?
    options:
      - 'P: meristematic, increased vacuolation; Q: elongation, large conspicuous nuclei; R: maturation, maximal wall thickening'
      - 'P: elongation, large conspicuous nuclei; Q: meristematic, increased vacuolation; R: maturation, maximal wall thickening'
      - 'P: meristematic, large conspicuous nuclei; Q: elongation, increased vacuolation; R: maturation, maximal wall thickening'
      - 'P: meristematic, large conspicuous nuclei; Q: maturation, maximal wall thickening; R: elongation, increased vacuolation'
    answer: 2
    explanation: Region P at the apex has constantly dividing cells with large conspicuous nuclei (meristematic phase). Region Q, next to it, shows increased vacuolation and enlargement (elongation phase). Region R, farthest from the apex, shows maximal wall thickening (maturation phase).
  - id: bio-growth-015
    topic: growth-growth-phases
    subtopic: Growth equations
    concept: Same r and t with different W_0 give different final sizes
    category: concept
    format: assertion-reason
    difficulty: 5
    time: 120
    ncert: true
    battle: false
    tags: [exponential-growth, initial-size]
    stem: |-
      Assertion (A): Two cultures with the same relative growth rate and the same time of growth end with different final sizes if their initial sizes differ.
      Reason (R): In W_1 = W_0 e^{rt}, the final size depends on the initial size W_0.
    options:
      - Both A and R are true and R is the correct explanation of A
      - Both A and R are true but R is not the correct explanation of A
      - A is true but R is false
      - A is false but R is true
    answer: 0
    explanation: With r and t equal, e^{rt} is the same, so W_1 is proportional to W_0. NCERT states that the final size depends on the initial size, so R explains A.
  - id: bio-growth-016
    topic: growth-growth-phases
    subtopic: Indeterminate growth
    concept: Meristems give plants the capacity for unlimited growth
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [meristem, open-growth]
    stem: The capacity of plants for unlimited growth throughout life is due to the presence of
    options:
      - meristems at certain locations in the body
      - primary cell walls that are thin and cellulosic
      - a vascular system running through the body
      - permanent tissues in the cortex
    answer: 0
    explanation: NCERT states that plants retain the capacity for unlimited growth because meristems are present at certain locations in the body. The cells of a meristem can divide and self-perpetuate.
  - id: bio-growth-017
    topic: growth-growth-phases
    subtopic: Sigmoid curve
    concept: Read culture data to find the log phase
    category: numerical
    format: case
    difficulty: 4
    time: 85
    ncert: false
    battle: false
    tags: [case, sigmoid-curve, numerical]
    stem: 'A culture was counted every 2 hours. Cells (in thousands): 0 h = 5, 2 h = 5.2, 4 h = 6, 6 h = 12, 8 h = 24, 10 h = 48, 12 h = 52, 14 h = 53. Between which times is the culture in its exponential (log) phase?'
    options:
      - 10 h to 14 h
      - 0 h to 4 h
      - 2 h to 6 h
      - 4 h to 10 h
    answer: 3
    explanation: Growth is slow from 0 to 4 h (lag phase). From 4 h to 10 h the number doubles every 2 hours (6 to 12, 12 to 24, 24 to 48), the log phase. After 10 h the increase is small, which is the stationary phase caused by limited nutrient supply.
  - id: bio-growth-018
    topic: growth-growth-phases
    subtopic: Growth equations
    concept: Exponential growth W_1 = W_0 e^{rt} applied numerically
    category: numerical
    format: direct
    difficulty: 3
    time: 50
    ncert: false
    battle: true
    tags: [exponential-growth, numerical]
    stem: A culture has an initial dry weight of 10 mg and a relative growth rate r of 0.1 per day. Using W_1 = W_0 e^{rt} with e ≈ 2.72, its dry weight after 10 days is about
    options:
      - 10 mg
      - 27 mg
      - 37 mg
      - 270 mg
    answer: 1
    explanation: W_1 = W_0 e^{rt} = 10 × e^{0.1 × 10} = 10 × e^1 ≈ 10 × 2.72 = 27 mg. Writing W_0 × rt gives 10 mg, and adding W_0 to the result gives 37 mg.
  - id: bio-growth-019
    topic: growth-growth-phases
    subtopic: Absolute growth rate
    concept: Comparison of total growth per unit time is the absolute growth rate
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [absolute-growth-rate]
    stem: The measurement and comparison of total growth per unit time is called the
    options:
      - absolute growth rate
      - relative growth rate
      - geometric growth rate
      - efficiency index
    answer: 0
    explanation: NCERT calls the measurement and comparison of total growth per unit time the absolute growth rate. When growth per unit time is expressed per unit initial parameter, it is the relative growth rate.
  - id: bio-growth-020
    topic: growth-growth-phases
    subtopic: Elongation phase
    concept: Identify the phase of cells from a description and predict the next
    category: application
    format: case
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [case, elongation-phase, maturation-phase]
    stem: A student examines cells from a region of a bean root behind the dividing zone. The cells are twice as long as those near the tip, have several small vacuoles fusing into a large one and are laying down new wall material. No mitosis is seen. Which phase are these cells in, and what do they enter next?
    options:
      - Maturation phase; they enter the meristematic phase
      - Meristematic phase; they enter the elongation phase
      - Elongation phase; they return to the meristematic phase
      - Elongation phase; they enter the maturation phase
    answer: 3
    explanation: Increased vacuolation, cell enlargement and new wall deposition without division are characteristic of the elongation phase. Further from the apex the cells attain maximal wall thickening and protoplasmic modification in the maturation phase.
  - id: bio-growth-021
    topic: growth-growth-phases
    subtopic: Growth equations
    concept: Final size in exponential growth depends on the initial size
    category: application
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [exponential-growth, initial-size]
    stem: Two tissues have the same relative growth rate r and time t but different initial sizes W_0. In W_1 = W_0 e^{rt}, their final sizes W_1 will be
    options:
      - the same, since r and t are equal
      - the same, since e is a constant
      - different, since r depends on the final size
      - different, since the final size depends on the initial size
    answer: 3
    explanation: NCERT notes that the final size W_1 depends on the initial size W_0. With r and t equal, e^{rt} is the same for both, so W_1 is proportional to W_0 and the two final sizes differ.
  - id: bio-growth-022
    topic: growth-growth-phases
    subtopic: Definition of growth
    concept: Expansion of a leaf is growth, but a reversible swelling is not
    category: application
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [growth, definition]
    stem: Which one of the following is an example of growth, as NCERT defines it?
    options:
      - A wilted leaf regaining its size after watering
      - Swelling of a piece of wood placed in water, which reverses on drying
      - Shrinkage of a leaf as it loses water
      - Expansion of a leaf
    answer: 3
    explanation: NCERT gives the expansion of a leaf as an example of growth, an irreversible permanent increase in size. A wilted leaf regaining turgor and wood swelling in water are reversible changes, and shrinkage is a decrease.
  - id: bio-growth-023
    topic: growth-growth-phases
    subtopic: Arithmetic growth
    concept: Arithmetic growth has one dividing daughter cell per division and a linear plot
    category: concept
    format: statements
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [arithmetic-growth]
    stem: Which one of the following statements about arithmetic growth is incorrect?
    options:
      - A root elongating at a constant rate is its simplest expression
      - Both daughter cells continue to divide, so the number of dividing cells doubles after every mitosis
      - A plot of length against time gives a linear curve
      - Following mitosis only one daughter cell continues to divide while the other differentiates and matures
    answer: 1
    explanation: In arithmetic growth only one daughter cell continues to divide, the other differentiates and matures, so the number of dividing cells does not double. A root elongating at a constant rate is the simplest example, and length plotted against time is linear.
  - id: bio-growth-024
    topic: growth-growth-phases
    subtopic: Growth equations
    concept: Terms of the exponential growth equation W_1 = W_0 e^{rt}
    category: concept
    format: statements
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [exponential-growth, equation]
    stem: Which one of the following statements about the equation W_1 = W_0 e^{rt} is correct?
    options:
      - t is the base of natural logarithms and e is the time of growth
      - It describes a root that elongates by a constant amount in each unit of time
      - W_1 may be a final weight, height or number, and W_0 is the size at the beginning of the period
      - r is the absolute growth rate, and the final size is independent of W_0
    answer: 2
    explanation: W_1 is the final size (weight, height, number etc.) and W_0 the initial size at the beginning of the period. The equation describes exponential (geometric) growth, e is the base of natural logarithms, t is the time and r is the relative growth rate.
  - id: bio-growth-025
    topic: growth-growth-phases
    subtopic: Phases of growth
    concept: Phases of growth and the parallel line technique
    category: factual
    format: match
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [match, phases-of-growth]
    stem: |-
      Match List I with List II.
      List I
      P. Meristematic phase
      Q. Elongation phase
      R. Maturation phase
      S. Parallel line technique
      List II
      1. Increased vacuolation, cell enlargement and new cell wall deposition
      2. Detection of zones of elongation
      3. Constantly dividing cells with large conspicuous nuclei
      4. Maximal size in terms of wall thickening and protoplasmic modifications
    options:
      - P-1, Q-3, R-4, S-2
      - P-3, Q-4, R-1, S-2
      - P-3, Q-1, R-4, S-2
      - P-3, Q-1, R-2, S-4
    answer: 2
    explanation: The meristematic phase has constantly dividing cells with large nuclei (3), the elongation phase shows vacuolation, enlargement and new wall deposition (1), and the maturation phase attains maximal wall thickening and protoplasmic modification (4). The parallel line technique detects zones of elongation (2).
  - id: bio-growth-026
    topic: growth-growth-phases
    subtopic: Geometric growth and sigmoid curve
    concept: A sigmoid curve arises in geometric growth with limited nutrient supply
    category: concept
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [sigmoid-curve, geometric-growth]
    stem: Which type of growth gives a typical sigmoid curve when a growth parameter is plotted against time?
    options:
      - Arithmetic growth in which one daughter cell differentiates
      - Geometric growth in which the nutrient supply is unlimited
      - Geometric growth in which the nutrient supply becomes limited
