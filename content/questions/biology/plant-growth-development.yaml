    stem: In an early embryo, a zygote first divides for 3 successive rounds in which every cell keeps dividing (geometric phase). Then, in each of the next 4 rounds, every dividing cell gives one daughter that keeps dividing and one that loses the capacity to divide (arithmetic phase). At the end, how many cells are there in all, and how many can still divide?
