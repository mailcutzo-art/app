  - id: bio-orgpop-493
    topic: orgpop-responses-regulation
    subtopic: 'Regulate: surface area and heat loss'
    concept: Heat loss per unit volume varies inversely with body length for geometrically similar animals
    category: numerical
    format: ordering
    difficulty: 4
    time: 85
    ncert: false
    battle: false
    tags: [ordering, surface-area]
    stem: Four geometrically similar animals P, Q, R and S have body lengths of 10 cm, 2 cm, 40 cm and 5 cm respectively. Assuming that heat loss is proportional to surface area, arrange them in decreasing order of heat loss per unit body volume.
    options:
      - R, P, S, Q
      - Q, S, P, R
      - Q, P, S, R
      - S, Q, P, R
    answer: 1
    explanation: Heat loss depends on surface area, which scales as L^2, while volume scales as L^3. So heat loss per unit volume is proportional to 1/L. The order of decreasing 1/L is Q (2 cm), S (5 cm), P (10 cm), R (40 cm). Smaller animals lose heat faster per unit volume.
