    battle: false
    tags: [case, interspecific-interactions]
    stem: |-
      A survey of a hill area lists six associations: P. a lichen on a rock; Q. a koel's egg in a crow's nest; R. barnacles on the back of a whale; S. ticks on a dog; T. a fig tree and its partner wasp; U. an orchid on a mango branch.
      Which option correctly names the associations in which (a) both partners benefit, (b) a parasite lives on the external surface of its host, and (c) one species benefits while the other is neither harmed nor benefited?
    options:
      - (a) P and T; (b) S; (c) R and U
      - (a) P and T; (b) Q; (c) R and U
      - (a) P and R; (b) S; (c) T and U
      - (a) P and T; (b) S; (c) Q and R
    answer: 0
    explanation: A lichen (P) and the fig-wasp relationship (T) are mutualisms, so both partners benefit. Ticks (S) feed on the host's external surface; the koel's egg in a crow's nest (Q) is brood parasitism, not an ectoparasite. Barnacles on a whale (R) and an orchid on a mango branch (U) are commensalisms.
  - id: bio-orgpop-320
    topic: orgpop-interactions
    subtopic: Host-parasite co-evolution
    concept: Interpreting a host-specific parasite and its host over time using co-evolution and effects of parasites
    category: application
    format: case
    difficulty: 5
    time: 120
    ncert: false
    battle: false
    tags: [case, co-evolution, parasitism]
    stem: |-
      A field study of a host-specific parasite and its host records three observations: (i) the host population evolves a new mechanism to resist the parasite; (ii) the parasite population first declines and then recovers; (iii) throughout, host density stays lower than in a parasite-free area.
      Which interpretation is consistent with NCERT?
    options:
      - The recovery shows that the host stopped being harmed, so the interaction has become commensalism
      - The parasite evolved mechanisms to counteract the host's resistance; the low host density fits parasites reducing host survival, growth and reproduction
      - The parasite recovered by switching to other host species, because host-specific parasites can parasitise any host
      - The low host density shows that the parasite is a mutualist that removes the weaker host individuals
    answer: 1
    explanation: NCERT says that when the host of a host-specific parasite evolves a mechanism of resistance, the parasite has to evolve counter-mechanisms to stay successful on the same host; this fits the recovery. Parasites reduce the survival, growth and reproduction of the host and its density, which fits the lower host density. A host-specific parasite cannot simply switch hosts, and it is neither a mutualist nor a commensal.
