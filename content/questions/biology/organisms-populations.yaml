    stem: 'Two isolated populations of the same species, P and Q, each start with 1000 individuals in habitats with unlimited resources and no immigration or emigration. In P the per capita birth rate is 0.45 and the death rate 0.30 per year; in Q they are 0.30 and 0.10 per year. Taking N_t = N_0 e^{rt} and e = 2.72, the ratio N_Q : N_P after 20 years is closest to'
