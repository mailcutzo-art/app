      Q. The parasitic bird lays its eggs in the host's nest
      R. The host bird detects some foreign eggs and ejects them from the nest
      S. Parasite eggs that resemble the host's eggs in size and colour become common
    options:
      - Q, P, R, S
      - Q, R, P, S
      - R, Q, P, S
      - Q, R, S, P
    answer: 1
    explanation: The parasite first lays its eggs in the host's nest (Q). The host detects and ejects some foreign eggs (R), so eggs that resemble the host's are ejected less often (P), and such eggs become common over evolutionary time (S). This is the logic behind NCERT's statement that parasite eggs have evolved to resemble the host's eggs in size and colour.
