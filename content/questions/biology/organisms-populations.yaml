questions:
  - id: bio-orgpop-001
    topic: orgpop-abiotic-adaptations
    subtopic: Major abiotic factors
    concept: Temperature is the most important ecologically relevant environmental factor
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [temperature, abiotic-factors]
    stem: According to NCERT, which abiotic factor is the most important ecologically relevant environmental factor?
    options:
      - Light
      - Temperature
      - Soil
      - Water
    answer: 1
    explanation: NCERT calls temperature the most important ecologically relevant environmental factor, because it affects enzyme kinetics, metabolic activity and the geographical distribution of species. Water comes next in importance, and light and soil also shape habitats but are not given this rank.
  - id: bio-orgpop-002
    topic: orgpop-abiotic-adaptations
    subtopic: Major abiotic factors
    concept: Temperature, water, light and soil are the key abiotic elements that vary among habitats
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [abiotic-factors, habitat]
    stem: NCERT lists four key elements that bring about the wide variation in the physical and chemical conditions of habitats. These are
    options:
      - temperature, predators, light and soil
      - water, pathogens, soil and competitors
      - temperature, pH, light and parasites
      - temperature, water, light and soil
    answer: 3
    explanation: The most important elements causing variation in the physico-chemical conditions of habitats are temperature, water, light and soil. Predators, pathogens, parasites and competitors are biotic components of a habitat, and pH is only one parameter within water or soil.
  - id: bio-orgpop-003
    topic: orgpop-abiotic-adaptations
    subtopic: Tolerance range
    concept: A vast majority of organisms tolerate only a narrow range of temperatures and are stenothermal
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [stenothermal, tolerance]
    stem: A vast majority of organisms are restricted to a narrow range of temperatures. Such organisms are called
    options:
      - stenothermal
      - eurythermal
      - stenohaline
      - euryhaline
    answer: 0
    explanation: Organisms restricted to a narrow range of temperatures are stenothermal, and they form the vast majority. A few organisms that tolerate a wide range of temperatures are eurythermal, while stenohaline and euryhaline refer to tolerance of salinity.
  - id: bio-orgpop-004
    topic: orgpop-abiotic-adaptations
    subtopic: Tolerance range
    concept: Euryhaline organisms tolerate a wide range of salinities
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [euryhaline, salinity]
    stem: Organisms that tolerate a wide range of salinities are described as
    options:
      - stenohaline
      - eurythermal
      - euryhaline
      - stenothermal
    answer: 2
    explanation: Euryhaline organisms are tolerant of a wide range of salinities, whereas stenohaline organisms are restricted to a narrow range. Eurythermal and stenothermal describe tolerance of temperature, not salinity.
  - id: bio-orgpop-005
    topic: orgpop-abiotic-adaptations
    subtopic: Temperature
    concept: On land, average temperature falls from the equator to the poles and from plains to mountain tops
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [temperature, latitude-altitude]
    stem: On land, the average temperature decreases progressively
    options:
      - from the equator towards the poles and from plains to mountain tops
      - from the poles towards the equator and from plains to mountain tops
      - from the equator towards the poles and from mountain tops to plains
      - from the poles towards the equator and from mountain tops to plains
    answer: 0
    explanation: NCERT states that the average temperature on land varies seasonally and decreases progressively from the equator towards the poles and from plains to mountain tops. The other options reverse one or both of these trends.
  - id: bio-orgpop-006
    topic: orgpop-abiotic-adaptations
    subtopic: Water and salinity
    concept: For aquatic organisms the quality of water, its chemical composition and pH, becomes important
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [water, aquatic]
    stem: For aquatic organisms, the quality of water becomes important. NCERT mentions this quality in terms of the water's
    options:
      - colour and turbidity
      - volume and depth
      - chemical composition and pH
      - flow velocity and temperature
    answer: 2
    explanation: Organisms living in oceans, lakes and rivers still face water-related issues, because for aquatic organisms the chemical composition and pH of water become important. Colour, depth and flow velocity are not given as measures of water quality.
  - id: bio-orgpop-007
    topic: orgpop-abiotic-adaptations
    subtopic: Light
    concept: Many plants depend on sunlight to meet their photoperiodic requirement for flowering
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [light, photoperiod]
    stem: Many plants are dependent on sunlight to meet their photoperiodic requirement for
    options:
      - nitrogen fixation
      - flowering
      - mineral absorption
      - transpiration
    answer: 1
    explanation: NCERT states that many plants depend on sunlight to meet their photoperiodic requirement for flowering. The other processes are not linked to photoperiod in the chapter.
  - id: bio-orgpop-008
    topic: orgpop-abiotic-adaptations
    subtopic: Soil
    concept: Soil composition, grain size and aggregation determine percolation and water holding capacity
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [soil, water-holding-capacity]
    stem: Which set of soil characteristics determines its percolation and water holding capacity?
    options:
      - Soil pH, mineral composition and topography
      - Climate, weathering and the course of soil development
      - Sediment characteristics and the benthic fauna
      - Soil composition, grain size and aggregation
    answer: 3
    explanation: Soil composition, grain size and aggregation determine the percolation and water holding capacity of soil. Climate, weathering and soil development decide the nature of the soil, and pH, mineral composition and topography act along with these features on vegetation.
  - id: bio-orgpop-009
    topic: orgpop-abiotic-adaptations
    subtopic: Temperature
    concept: Thermal springs and deep-sea hydrothermal vents have average temperatures above 100 degrees C
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [temperature, extreme-habitats]
    stem: Habitats in which the average temperature exceeds 100 °C include
    options:
      - tropical deserts in summer
      - polar areas
      - thermal springs and deep-sea hydrothermal vents
      - high mountain tops
    answer: 2
    explanation: NCERT mentions thermal springs and deep-sea hydrothermal vents as unique habitats with average temperatures above 100 °C. Tropical deserts in summer exceed 50 °C, while polar areas and high altitudes can be subzero.
  - id: bio-orgpop-010
    topic: orgpop-abiotic-adaptations
    subtopic: Temperature
    concept: Temperature affects the kinetics of enzymes and through it metabolic activity and physiology
    category: concept
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [temperature, enzymes]
    stem: NCERT explains the significance of temperature to living organisms by stating that it affects the
    options:
      - kinetics of enzymes and through it the metabolic activity and other physiological functions
      - photoperiod of the habitat and through it the flowering of plants
      - osmotic concentration of the surrounding medium and through it its salinity
      - percolation of water in the soil and through it the vegetation
    answer: 0
    explanation: Temperature affects the kinetics of enzymes and, through it, the metabolic activity and other physiological functions of an organism. It does not set photoperiod, the salinity of the medium or soil percolation.
  - id: bio-orgpop-011
    topic: orgpop-abiotic-adaptations
    subtopic: Temperature
    concept: Thermal tolerance largely determines the geographical distribution of species
    category: concept
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [temperature, distribution]
    stem: Mango trees do not grow in Canada, snow leopards are absent from Kerala forests and tuna are rarely caught beyond the tropics. These examples show that
    options:
      - soil composition and pH decide the kind of animals an area can support
      - the level of thermal tolerance largely decides the geographical distribution of species
      - water availability alone decides the productivity of plants in a region
      - photoperiod decides the timing of migration in animals
    answer: 1
    explanation: NCERT uses these examples to show that the levels of thermal tolerance of different species determine, to a large extent, their geographical distribution. The other options state ideas from other parts of the chapter that are not illustrated by these examples.
  - id: bio-orgpop-012
    topic: orgpop-abiotic-adaptations
    subtopic: Light
    concept: Animals use photoperiod as a cue for timing foraging, reproductive and migratory activities
    category: concept
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [light, photoperiod, animals]
    stem: NCERT states that many animals use diurnal and seasonal variations in light intensity and duration (photoperiod) as cues for timing their
    options:
      - osmoregulation, thermoregulation and excretion
      - hibernation, aestivation and diapause
      - growth, ageing and death
      - foraging, reproductive and migratory activities
    answer: 3
    explanation: For many animals, variations in light intensity and duration serve as cues for timing foraging, reproductive and migratory activities. Hibernation, aestivation and diapause are described as ways of coping with stress, not as photoperiod-timed activities.
  - id: bio-orgpop-013
    topic: orgpop-abiotic-adaptations
    subtopic: Soil
    concept: In the aquatic environment sediment characteristics determine the type of benthic animals
    category: concept
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [soil, sediment, benthic]
    stem: In an aquatic environment, the type of benthic animals that can thrive is often determined by the
    options:
      - spectral quality of sunlight
      - number of daylight hours
      - characteristics of the sediment
      - depth of the water table
    answer: 2
    explanation: NCERT states that in the aquatic environment the sediment characteristics often determine the type of benthic animals that can thrive there, a counterpart of the soil on land.
  - id: bio-orgpop-014
    topic: orgpop-abiotic-adaptations
    subtopic: Light
    concept: Light availability on land is closely linked with temperature because the Sun is the source of both
    category: concept
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [light, temperature]
    stem: The availability of light on land is closely linked with that of temperature because
    options:
      - the Sun is the source of both
      - temperature determines the spectral quality of light
      - light determines the kinetics of enzymes
      - both are controlled by the grain size of soil
    answer: 0
    explanation: NCERT points out that on land the availability of light is closely linked with that of temperature since the Sun is the source of both. The other options give relationships that NCERT does not state.
  - id: bio-orgpop-015
    topic: orgpop-abiotic-adaptations
    subtopic: Biomes
    concept: Biomes arise from annual variation in temperature together with annual variation in precipitation
    category: concept
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [biomes, precipitation]
    stem: Major biomes such as desert, rain forest and tundra are accounted for by annual variations in temperature together with annual variation in
    options:
      - soil pH and mineral composition
      - precipitation, including both rain and snow
      - salinity and chemical composition of water
      - photoperiod and spectral quality of light
    answer: 1
    explanation: The tilt of the Earth's axis and its rotation around the Sun cause annual variations in the intensity and duration of temperature. These, together with annual variation in precipitation (rain and snow), account for biomes such as desert, rain forest and tundra.
  - id: bio-orgpop-016
    topic: orgpop-abiotic-adaptations
    subtopic: Habitat and niche
    concept: Tolerable range of conditions, resources used and functional role together comprise the niche
    category: concept
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [niche, tolerance]
    stem: An organism's defined range of tolerable conditions, the diversity of resources it utilises and its distinct functional role together comprise its
    options:
      - habitat
      - biome
      - population
      - niche
    answer: 3
    explanation: NCERT defines the niche as the sum of the range of conditions an organism can tolerate, the diversity of resources it utilises and its functional role in the ecological system. The habitat is the place with its abiotic and biotic components, so it is not the answer.
  - id: bio-orgpop-017
    topic: orgpop-abiotic-adaptations
    subtopic: Light
    concept: Red algae are the likely group in the deepest waters of the sea
    category: concept
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [light, algae, spectral-quality]
    stem: Among the red, green and brown algae of the sea, which group is most likely to be found in the deepest waters?
    options:
      - Green algae
      - Brown algae
      - Red algae
      - All three are equally likely
    answer: 2
    explanation: Not all colour components of sunlight reach the deeper layers of the ocean. Red algae, which contain the pigment r-phycoerythrin, occur even at great depths where relatively little light penetrates, so they are the likely group in the deepest waters.
  - id: bio-orgpop-018
    topic: orgpop-abiotic-adaptations
    subtopic: Temperature
    concept: Identify the correct statement about temperature as an ecological factor
    category: concept
    format: statements
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [temperature, statements]
    stem: Which one of the following statements about temperature as an ecological factor is correct?
    options:
      - Average temperature on land increases progressively from the equator towards the poles.
      - Thermal springs and deep-sea hydrothermal vents are habitats where average temperatures exceed 100 °C.
      - Average temperature in tropical deserts in summer remains below 50 °C.
      - A vast majority of organisms are eurythermal.
    answer: 1
    explanation: NCERT gives thermal springs and deep-sea hydrothermal vents as habitats with average temperatures above 100 °C. Temperature falls from the equator towards the poles, tropical deserts exceed 50 °C in summer, and a vast majority of organisms are stenothermal, not eurythermal.
  - id: bio-orgpop-019
    topic: orgpop-abiotic-adaptations
    subtopic: Water and salinity
    concept: Identify the correct statement about water and salinity for aquatic organisms
    category: concept
    format: statements
    difficulty: 4
    time: 85
    ncert: true
    battle: false
    tags: [water, salinity, statements]
    stem: Which one of the following statements about water as an abiotic factor is correct?
    options:
      - Salinity, measured in parts per thousand, is less than 5 in the sea and 30–35 in inland waters.
      - The quality of water matters to aquatic organisms, but freshwater animals can live in sea water as long as its pH is the same.
      - Stenohaline organisms tolerate a wide range of salinities, whereas euryhaline organisms are restricted to a narrow range.
      - Many freshwater animals cannot live for long in sea water because of the osmotic problems they would face.
    answer: 3
    explanation: NCERT says many freshwater animals cannot live for long in sea water, and vice versa, because of osmotic problems. Inland waters have salinity below 5 and the sea 30–35, so the first option swaps them, the second ignores the osmotic problem, and the third swaps euryhaline and stenohaline.
  - id: bio-orgpop-020
    topic: orgpop-abiotic-adaptations
    subtopic: Soil
    concept: Identify the statement about soil and vegetation that is NOT correct
    category: concept
    format: statements
    difficulty: 4
    time: 85
    ncert: true
    battle: false
    tags: [soil, vegetation, statements]
    stem: Which one of the following statements about soil as an abiotic factor is NOT correct?
    options:
      - The vegetation of an area is determined only by the percolation and water holding capacity of its soil, and not by soil pH, mineral composition or topography.
      - The nature and properties of soil depend on climate, weathering, whether the soil is transported or sedimentary, and how soil development occurred.
      - Soil composition, grain size and aggregation determine the percolation and water holding capacity of soil.
      - The vegetation of an area dictates the type of animals that can be supported there.
    answer: 0
    explanation: NCERT says that percolation and water holding capacity, along with pH, mineral composition and topography, determine to a large extent the vegetation of an area. So the first statement, which excludes pH, minerals and topography, is wrong; the other three follow NCERT.
  - id: bio-orgpop-021
    topic: orgpop-abiotic-adaptations
    subtopic: Light
    concept: Identify the correct statement about light as an ecological factor
    category: concept
    format: statements
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [light, statements]
    stem: Which one of the following statements about light as an ecological factor is correct?
    options:
      - Light is available at every depth of the ocean, so deep-sea organisms can photosynthesise.
      - Photoperiod influences only plants, and animals do not use it as a cue.
      - Many small herbs and shrubs of forests are adapted to photosynthesise optimally under very low light because tall canopied trees overshadow them.
      - All colour components of the visible spectrum are equally available to marine plants at every depth.
    answer: 2
    explanation: NCERT notes that many small herbs and shrubs of forests are adapted to photosynthesise optimally under very low light, as they are constantly overshadowed by tall canopied trees. Deep oceans (below 500 m) are dark, animals also use photoperiod as a cue, and not all colour components of the spectrum reach every depth.
  - id: bio-orgpop-022
    topic: orgpop-abiotic-adaptations
    subtopic: Temperature
    concept: Four statements on temperature, thermal tolerance and distribution
    category: concept
    format: multi-statement
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [temperature, eurythermal]
    stem: |-
      Consider the following statements about temperature.
      I. Temperature affects the kinetics of enzymes and through it the metabolic activity of organisms.
      II. Average temperature on land decreases from the equator towards the poles and from plains to mountain tops.
      III. Eurythermal organisms are restricted to a narrow range of temperatures.
      IV. The levels of thermal tolerance of different species determine to a large extent their geographical distribution.
      Which of the statements are correct?
    options:
      - I, II and IV only
      - I, III and IV only
      - II, III and IV only
      - I, II and III only
    answer: 0
    explanation: Statements I, II and IV agree with NCERT. Statement III is wrong, because eurythermal organisms tolerate a wide range of temperatures; it is the stenothermal organisms that are restricted to a narrow range.
  - id: bio-orgpop-023
    topic: orgpop-abiotic-adaptations
    subtopic: Water and salinity
    concept: Four statements on water, salinity and euryhaline organisms
    category: concept
    format: multi-statement
    difficulty: 4
    time: 85
    ncert: true
    battle: false
    tags: [water, salinity, euryhaline]
    stem: |-
      Consider the following statements about water as an abiotic factor.
      I. The productivity and distribution of plants are heavily dependent on water.
      II. The salinity of inland waters is 30–35 parts per thousand and that of the sea is less than 5.
      III. Organisms tolerant of a wide range of salinities are called euryhaline.
      IV. Many freshwater animals cannot live for long in sea water, and vice versa, because of osmotic problems.
      Which of the statements are correct?
    options:
      - I, II and III only
      - I, III and IV only
      - II, III and IV only
      - I, II and IV only
    answer: 1
    explanation: 'Statements I, III and IV follow NCERT. Statement II swaps the values: salinity is less than 5 parts per thousand in inland waters and 30–35 in the sea (and above 100 in some hypersaline lagoons).'
  - id: bio-orgpop-024
    topic: orgpop-abiotic-adaptations
    subtopic: Light
    concept: Four statements on light, UV, spectral quality and photoperiod
    category: concept
    format: multi-statement
    difficulty: 4
    time: 85
    ncert: true
    battle: false
    tags: [light, spectral-quality, photoperiod]
    stem: |-
      Consider the following statements about light.
      I. The availability of light on land is independent of temperature, since light and heat come from different sources.
      II. The UV component of the solar spectrum is harmful to many organisms.
      III. Not all the colour components of the visible spectrum are available to marine plants living at different depths of the ocean.
      IV. Animals use diurnal and seasonal variations in light intensity and duration as cues for timing their foraging, reproductive and migratory activities.
      Which of the statements are correct?
    options:
      - I, II and III only
      - I, III and IV only
      - I, II and IV only
      - II, III and IV only
    answer: 3
    explanation: Statement I is wrong because the availability of light on land is closely linked with that of temperature, the Sun being the source of both. Statements II, III and IV agree with NCERT.
  - id: bio-orgpop-025
    topic: orgpop-abiotic-adaptations
    subtopic: Biomes
    concept: Four statements from different parts of the chapter on biomes, habitat and thermal tolerance
    category: concept
    format: multi-statement
    difficulty: 5
    time: 120
    ncert: true
    battle: false
    tags: [biomes, habitat, temperature]
    stem: |-
      Consider the following statements.
      I. Major biomes such as desert, rain forest and tundra result from annual variations in temperature together with annual variation in precipitation, which includes both rain and snow.
      II. The major biomes of India shown in NCERT are tropical rain forest, deciduous forest, desert and sea coast.
      III. The physico-chemical (abiotic) components alone characterise the habitat of an organism completely.
      IV. Regional and local variations within each biome lead to a wide variety of habitats.
      V. Tuna fish are rarely caught beyond tropical latitudes mainly because of the limited availability of light.
      Which of the statements are correct?
    options:
      - I, III and IV only
      - II, IV and V only
      - I, II and IV only
      - I, II and V only
    answer: 2
    explanation: Statements I, II and IV follow NCERT. Statement III is wrong because the habitat also includes biotic components such as pathogens, parasites, predators and competitors. Statement V is wrong because NCERT cites the rarity of tuna beyond tropical latitudes as an effect of temperature.
  - id: bio-orgpop-026
    topic: orgpop-abiotic-adaptations
    subtopic: Major abiotic factors
    concept: Count the correct statements among five on temperature, water, light and salinity
    category: application
    format: multi-statement
    difficulty: 5
    time: 120
    ncert: true
    battle: false
    tags: [abiotic-factors, salinity]
    stem: |-
      Consider the following statements.
      I. In deserts, water availability is so limited that only special adaptations make it possible for organisms to live there.
      II. Salinity is less than 5 parts per thousand in inland waters, 30–35 in the sea and more than 100 in deep-sea hydrothermal vents.
      III. The levels of thermal tolerance of different species determine to a large extent their geographical distribution.
      IV. Many plants depend on sunlight to meet their photoperiodic requirement for flowering.
      V. Average temperature on land decreases progressively from the equator towards the poles and from mountain tops to plains.
      How many of the above statements are correct?
    options:
      - Only two
      - Only three
      - Only four
      - All five
    answer: 1
    explanation: Statements I, III and IV are correct. Statement II is wrong because the salinity above 100 is found in some hypersaline lagoons, not in hydrothermal vents. Statement V is wrong because temperature decreases from plains to mountain tops, not the reverse. So only three are correct.
  - id: bio-orgpop-027
    topic: orgpop-abiotic-adaptations
    subtopic: Tolerance range
    concept: Eurythermal organisms tolerate a wide range of temperatures but are few
    category: concept
    format: statement-pair
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [eurythermal, stenothermal]
    stem: |-
      Statement I: Eurythermal organisms can tolerate and thrive in a wide range of temperatures.
      Statement II: A vast majority of organisms are eurythermal.
    options:
      - Both Statement I and Statement II are correct
      - Both Statement I and Statement II are incorrect
      - Statement I is correct but Statement II is incorrect
      - Statement I is incorrect but Statement II is correct
    answer: 2
    explanation: Statement I is correct because eurythermal organisms tolerate a wide range of temperatures. Statement II is incorrect because a vast majority of organisms are stenothermal, restricted to a narrow range of temperatures.
  - id: bio-orgpop-028
    topic: orgpop-abiotic-adaptations
    subtopic: Water and salinity
    concept: Euryhaline organisms have a wide salinity range; freshwater animals face osmotic problems in sea water
    category: concept
    format: statement-pair
    difficulty: 4
    time: 85
    ncert: true
    battle: false
    tags: [euryhaline, osmotic-problems]
    stem: |-
      Statement I: Euryhaline organisms are restricted to a narrow range of salinities.
      Statement II: Many freshwater animals cannot live for long in sea water because of the osmotic problems they would face.
    options:
      - Both Statement I and Statement II are correct
      - Both Statement I and Statement II are incorrect
      - Statement I is correct but Statement II is incorrect
      - Statement I is incorrect but Statement II is correct
    answer: 3
    explanation: Statement I is incorrect because euryhaline organisms tolerate a wide range of salinities; stenohaline organisms are restricted to a narrow range. Statement II is correct as stated in NCERT.
  - id: bio-orgpop-029
    topic: orgpop-abiotic-adaptations
    subtopic: Soil
    concept: Swapped determinants of percolation and of vegetation, and benthic animals tied to light
    category: concept
    format: statement-pair
    difficulty: 4
    time: 85
    ncert: true
    battle: false
    tags: [soil, benthic, sediment]
    stem: |-
      Statement I: Soil pH and topography determine the percolation and water holding capacity of soil, whereas soil composition, grain size and aggregation determine its vegetation.
      Statement II: In the aquatic environment, the type of benthic animals that can thrive is determined by the spectral quality of light and not by the characteristics of the sediment.
    options:
      - Both Statement I and Statement II are correct
      - Both Statement I and Statement II are incorrect
      - Statement I is correct but Statement II is incorrect
      - Statement I is incorrect but Statement II is correct
    answer: 1
    explanation: 'Statement I swaps the roles: soil composition, grain size and aggregation determine percolation and water holding capacity, and these along with pH, mineral composition and topography influence the vegetation. Statement II is wrong because sediment characteristics often determine the type of benthic animals.'
  - id: bio-orgpop-030
    topic: orgpop-abiotic-adaptations
    subtopic: Temperature
    concept: Thermal tolerance explains the absence of mango trees in Canada and Germany
    category: concept
    format: assertion-reason
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [temperature, distribution]
    stem: |-
      Assertion (A): Mango trees do not grow in temperate countries like Canada and Germany.
      Reason (R): The levels of thermal tolerance of a species determine to a large extent its geographical distribution.
    options:
      - Both A and R are true and R is the correct explanation of A
      - Both A and R are true but R is not the correct explanation of A
