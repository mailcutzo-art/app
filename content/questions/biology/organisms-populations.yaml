  - id: bio-orgpop-500
    topic: orgpop-responses-regulation
    subtopic: 'Regulate: surface area and heat loss'
    concept: Per-gram heat loss scales as m^{-1/3} for geometrically similar animals of the same density
    category: numerical
    format: direct
    difficulty: 5
    time: 120
    ncert: false
    battle: false
    tags: [surface-area, numerical]
    stem: A 10 g shrew and a 10 kg mammal are geometrically similar and of equal density. If heat loss in cold surroundings is proportional to surface area, the heat lost per gram of body mass is greater in the shrew by a factor of
    options:
      - '100'
      - '10'
      - '1000'
      - about 3
    answer: 1
    explanation: The mass ratio is 10 000 g / 10 g = 1000, so the length ratio is 1000^{1/3} = 10 and the surface-area ratio is 10^2 = 100. Heat loss per gram is (1/100) / (1/1000) = 10 times greater in the shrew. Using 100 forgets to divide by the mass.
