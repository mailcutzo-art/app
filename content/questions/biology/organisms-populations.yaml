    diagram: 'Three small line graphs side by side with a common x-axis, time in days (0 to 24), and a common y-axis, population density in individuals per mL (0 to 25). Graph 1, species X grown alone in a culture medium with limited food: an S-shaped curve rising to a plateau at about 20. Graph 2, species Y grown alone in the same limited medium: an S-shaped curve rising to a plateau at about 15. Graph 3, X and Y grown together in the same limited medium: curve X rises to a plateau at about 14; curve Y rises at first to about 8 by day 8, then falls steadily and reaches zero at about day 20.'
    tags: [gause-principle, competition]
    stem: X and Y are two closely related species grown alone and together in a medium with limited food (figure). Which conclusion is best supported by the three graphs?
    options:
      - 'It is predation: X feeds on Y, so Y''s density falls to zero'
      - It is competition, but Y's elimination shows that the resources were not limiting
      - Both species are harmed (X falls from 20 to 14) and the inferior species Y is eliminated, as Gause's principle predicts for a limiting resource
      - 'It is amensalism: Y is eliminated while X is unaffected'
    answer: 2
    explanation: 'X reaches 20 alone but only 14 with Y, so X is also harmed: this is competition (−, −), not amensalism. Y is the competitively inferior species and is eliminated, which is what the competitive exclusion principle predicts when resources are limiting. Nothing shows X feeding on Y.'
