      Counting the two partners of each association (eight organisms in all), how many are benefited, harmed and unaffected, respectively?
    options:
      - 4, 1, 3
      - 6, 1, 1
      - 5, 2, 1
      - 5, 1, 2
    answer: 3
    explanation: 'Orchid on mango: orchid +, mango 0. Mycorrhiza: fungus +, mango roots +. Cuscuta on hedge: Cuscuta +, hedge plant −. Egret and cattle: egret +, cattle 0. Benefited: 5 (orchid, fungus, mango roots, Cuscuta, egret); harmed: 1 (hedge plant); unaffected: 2 (mango in (i), cattle).'
  - id: bio-orgpop-319
    topic: orgpop-interactions
    subtopic: Interactions and examples
    concept: Sorting six associations into mutualism, ectoparasitism and commensalism
    category: application
    format: case
    difficulty: 5
