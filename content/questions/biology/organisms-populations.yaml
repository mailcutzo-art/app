    formula: N_{t+1} = N_t + [(B + I) − (D + E)]
    diagram: 'A line graph with time in years (0 to 6) on the x-axis and population density N on the y-axis. The line passes through these points: year 0, N = 100; year 1, N = 120; year 2, N = 140; year 3, N = 150; year 4, N = 150; year 5, N = 130; year 6, N = 110. The line rises from year 0 to year 3, is horizontal between years 3 and 4, and falls from year 4 to year 6.'
    tags: [density-equation, graph]
    stem: The graph shows the density of a population over six years. Which statement about the processes in N_{t+1} = N_t + [(B + I) − (D + E)] is correct?
    options:
      - Between years 3 and 4 there were no births and no deaths; between years 4 and 6 there were no births
      - Between years 3 and 4, (B + I) equals (D + E); between years 4 and 6, (D + E) exceeds (B + I)
      - Between years 0 and 3, (D + E) exceeded (B + I); between years 3 and 4, (B + I) exceeded (D + E)
