    ncert: true
    battle: false
    diagram: A line graph. The x-axis is 'External environmental factor' (for example temperature or the osmotic concentration of the surrounding medium), increasing from left to right. The y-axis is 'Internal environmental factor' (body temperature or osmotic concentration of body fluids). Three lines are plotted. Line X is a horizontal straight line across the whole x-axis. Line Y is a straight line rising diagonally from the bottom left to the top right, so the internal value follows the external value. Line Z is a gently S-shaped curve that is nearly horizontal over the middle range of the x-axis and rises steeply at both the low and the high ends.
