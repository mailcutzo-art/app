  - id: bio-orgpop-499
    topic: orgpop-responses-regulation
    subtopic: Regulators, conformers and short-lived stress
    concept: Classify three animals from temperature data and decide what a short heat wave means for each
    category: application
    format: case
    difficulty: 5
    time: 120
    ncert: false
    battle: false
    tags: [case, regulate, conform]
    stem: |-
      A student recorded the body temperature (°C) of three animals P, Q and R kept at different ambient temperatures.
      Ambient temperature (°C): 10, 25, 40, 50
      Animal P: 37, 37, 37, 37
      Animal Q: 10, 25, 40, 50
      Animal R: 10, 37, 37, 50
      A localised heat wave of 50 °C lasts only a few days. Which statement is correct?
    options:
      - P and R keep a constant temperature at 50 °C, whereas only Q conforms and must migrate or suspend activity
      - Q is a regulator and P a conformer, so only P can tide over the heat wave by migrating or suspending activity
