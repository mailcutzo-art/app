      - Both A and R are true and R is the correct explanation of A
      - Both A and R are true but R is not the correct explanation of A
      - A is true but R is false
      - A is false but R is true
    answer: 1
    explanation: Both statements are true, but the enzyme is thermostable because it must stay active during the high temperature induced denaturation of the double-stranded DNA. Ligation of the product with a vector is a later use of the amplified DNA and does not explain the choice of enzyme.
  - id: bio-biotech2-421
