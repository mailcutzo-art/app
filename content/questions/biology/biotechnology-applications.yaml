    explanation: The reason is true, since ELISA is based on antigen-antibody interaction and detects antigens or antibodies of the pathogen. The assertion is false because amplification of nucleic acid is done in PCR.
  - id: bio-biotech2-422
    topic: biotech2-molecular-diagnosis
