  - id: bio-biotech2-406
    topic: biotech2-molecular-diagnosis
    subtopic: PCR
    concept: Minimum number of doubling cycles needed to exceed 10^9 molecules from four template molecules
    category: numerical
    format: direct
    difficulty: 4
    time: 85
    ncert: false
    battle: false
    formula: N = N_0 × 2^n
    tags: [pcr, amplification]
    stem: Starting with 4 target DNA molecules, and assuming that every PCR cycle exactly doubles the number of molecules, the minimum number of cycles needed to exceed 10^9 molecules is
    options:
      - '25'
      - '27'
      - '28'
      - '30'
    answer: 2
    explanation: The number of molecules is 4 × 2^n. For n = 27 it is 4 × 1.34 × 10^8 = 5.4 × 10^8, which is below 10^9, and for n = 28 it is 4 × 2.68 × 10^8 = 1.07 × 10^9. So 28 cycles are needed, and 30 is the trap from the single-template case.
