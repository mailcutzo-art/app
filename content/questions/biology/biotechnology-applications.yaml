    diagram: Two panels side by side, (a) and (b), each showing a nematode feeding on a root cell of tobacco. In panel (a) the host cell has no introduced DNA; inside the nematode an mRNA labelled X is being read by a ribosome that is making a growing protein chain, and the nematode is drawn healthy. In panel (b) the host cell carries a DNA segment labelled Y; two RNAs made from Y pair to form a double-stranded RNA labelled Z; Z is shown bound to the mRNA X inside the nematode, the ribosome on X has a cross mark and no protein chain, and the nematode is drawn shrivelled.
