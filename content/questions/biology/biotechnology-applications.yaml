    stem: A PCR is started with 2 target DNA molecules. If every cycle exactly doubles the number of molecules, how many are present after 5 cycles?
    options:
      - '10'
      - '25'
      - '32'
      - '64'
    answer: 3
    explanation: Each cycle doubles the number of molecules, so N = N_0 × 2^n = 2 × 2^5 = 64. Choosing 32 forgets the two starting molecules, 10 adds 2 five times and 25 squares the cycle number.
