      - Both A and R are true but R is not the correct explanation of A
      - A is true but R is false
      - A is false but R is true
    answer: 2
    explanation: Active immunity is slow and takes time to give its full response, because the host has to make its own antibodies after exposure to the antigens. The reason is false, since directly giving ready-made antibodies is passive immunity.
  - id: bio-biotech2-423
