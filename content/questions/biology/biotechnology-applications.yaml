    answer: 0
    explanation: P is the Agrobacterium vector that delivers the DNA, Q is the introduced DNA carrying the nematode-specific gene, and R and S are the sense and anti-sense RNAs made from it. Paired along their length, they form the dsRNA (T), which silences the parasite's mRNA (U).
  - id: bio-biotech2-085
    topic: biotech2-agriculture
    subtopic: RNAi in tobacco
    concept: Compare a normal host cell with a transgenic host cell producing dsRNA against the nematode
    category: application
