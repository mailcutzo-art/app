questions:
  - id: bio-biotech2-001
    topic: biotech2-agriculture
    subtopic: Genetically modified organisms
    concept: GMOs are plants, bacteria, fungi and animals whose genes have been altered by manipulation
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [gmo, definition]
    stem: Plants, bacteria, fungi and animals whose genes have been altered by manipulation are called
    options:
      - biofertilisers
      - bio-pesticides
      - somaclones
      - genetically modified organisms
    answer: 3
    explanation: NCERT defines Genetically Modified Organisms (GMO) as plants, bacteria, fungi and animals whose genes have been altered by manipulation. Somaclones are genetically identical plants raised by micropropagation, and biofertilisers and bio-pesticides are agricultural inputs, not a class of altered organisms.
  - id: bio-biotech2-002
    topic: biotech2-agriculture
    subtopic: Options for increasing food production
    concept: Agro-chemical, organic and genetically engineered crop-based agriculture are the three options for more food
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [food-production, gm-crops]
    stem: Agro-chemical based agriculture, organic agriculture and ____ are the three options thought of for increasing food production.
    options:
      - shifting cultivation
      - hydroponic agriculture
      - greenhouse-based agriculture
      - genetically engineered crop-based agriculture
    answer: 3
    explanation: 'NCERT lists three options for raising food production: agro-chemical based agriculture, organic agriculture and genetically engineered crop-based agriculture. The other choices are not among the options it discusses.'
  - id: bio-biotech2-003
    topic: biotech2-agriculture
    subtopic: Advantages of GM crops
    concept: Genetic modification has made crops more tolerant to the abiotic stresses cold, drought, salt and heat
    category: concept
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [abiotic-stress, gm-crops]
    stem: Genetic modification has made crops more tolerant to which of the following abiotic stresses?
    options:
      - Cold, drought, salt and pest attack
      - Cold, drought, salt and heat
      - Drought, salt, heat and fungal infection
      - Cold, heat, weeds and bacterial infection
    answer: 1
    explanation: NCERT gives cold, drought, salt and heat as the abiotic stresses to which GM crops are more tolerant. Pest attack, fungal infection, weeds and bacterial infection are biotic factors, so each wrong option contains at least one biotic stress.
  - id: bio-biotech2-004
    topic: biotech2-agriculture
    subtopic: Advantages of GM crops
    concept: Tailor-made GM plants supply starches, fuels and pharmaceuticals to industries
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [gm-crops, industry]
    stem: GM has been used to create tailor-made plants that supply alternative resources to industries in the form of
    options:
      - starches, fuels and pharmaceuticals
      - timber, resins and dyes
      - minerals, fertilisers and biogas
      - vitamins, antibiotics and fibres
    answer: 0
    explanation: NCERT states that GM has been used to create tailor-made plants that supply alternative resources to industries in the form of starches, fuels and pharmaceuticals. The other sets are not mentioned.
  - id: bio-biotech2-005
    topic: biotech2-agriculture
    subtopic: Advantages of GM crops
    concept: Increased efficiency of mineral usage by GM plants prevents early exhaustion of soil fertility
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [mineral-usage, gm-crops]
    stem: Increased efficiency of mineral usage by genetically modified plants helps to prevent
    options:
      - damage caused by abiotic stresses
      - attack by insect pests
      - post-harvest losses of the crop
      - early exhaustion of the fertility of soil
    answer: 3
    explanation: NCERT notes that genetic modification has increased the efficiency of mineral usage by plants, and this prevents early exhaustion of fertility of soil. Lower post-harvest losses, pest resistance and stress tolerance are separate benefits.
  - id: bio-biotech2-006
    topic: biotech2-agriculture
    subtopic: Need for GM crops
    concept: GM crops are suggested as a possible solution to minimise fertiliser and chemical use and their harmful effects
    category: concept
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [gm-crops, environment]
    stem: According to NCERT, a possible solution for minimising the use of fertilisers and chemicals, and so reducing their harmful effects on the environment, is the use of
    options:
      - genetically modified crops
      - somatic hybrids such as pomato
      - micropropagated somaclones
      - heavier application of agrochemicals
    answer: 0
    explanation: After asking whether the use of fertilisers and chemicals can be minimised so that their harmful effects on the environment are reduced, NCERT answers that the use of genetically modified crops is a possible solution. Somatic hybrids and somaclones come from tissue culture and do not address chemical use.
  - id: bio-biotech2-007
    topic: biotech2-agriculture
    subtopic: Bt toxin and Bt crops
    concept: Bt toxin is produced by the bacterium Bacillus thuringiensis
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [bt-toxin, bacillus-thuringiensis]
    stem: Bt toxin is produced by a bacterium called
    options:
      - '*Agrobacterium tumefaciens*'
      - '*Thermus aquaticus*'
      - '*Escherichia coli*'
      - '*Bacillus thuringiensis*'
    answer: 3
    explanation: Bt stands for *Bacillus thuringiensis*, the bacterium that produces the Bt toxin. *Agrobacterium tumefaciens* is a source of vectors for plants, *E. coli* is a common host and *Thermus aquaticus* is the source of Taq polymerase.
  - id: bio-biotech2-008
    topic: biotech2-agriculture
    subtopic: Bt toxin and Bt crops
    concept: A Bt toxin gene expressed in a plant gives insect resistance without insecticide, in effect a bio-pesticide
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [bt-toxin, bio-pesticide]
    stem: Expressing the cloned Bt toxin gene in a crop gives resistance to insects without insecticides, so the plant is in effect a
    options:
      - biogas source
      - bio-pesticide
      - biofertiliser
      - bioreactor
    answer: 1
    explanation: NCERT says the Bt toxin gene cloned from the bacterium and expressed in plants provides resistance to insects without the need for insecticides, in effect creating a bio-pesticide.
  - id: bio-biotech2-009
    topic: biotech2-agriculture
    subtopic: Mode of action of Bt toxin
    concept: B. thuringiensis forms protein crystals containing a toxic insecticidal protein in a particular growth phase
    category: factual
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [bt-toxin, crystals]
    stem: During a particular phase of its growth, *Bacillus thuringiensis* forms protein crystals that contain a
    options:
      - reserve food polysaccharide
      - plasmid DNA carrying the vector
      - toxic insecticidal protein
      - restriction endonuclease
    answer: 2
    explanation: NCERT states that B. thuringiensis forms protein crystals during a particular phase of its growth, and these crystals contain a toxic insecticidal protein.
  - id: bio-biotech2-010
    topic: biotech2-agriculture
    subtopic: Mode of action of Bt toxin
    concept: The Bt toxin exists in the bacterium as an inactive protoxin, so it does not kill the bacterium
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [protoxin, bt-toxin]
    stem: The Bt toxin protein does not harm the Bacillus that makes it, since inside the bacterium it exists as
    options:
      - an inactive protoxin
      - a toxin made only after the bacterium dies
      - an active toxin neutralised by the bacterial cell wall
      - an active toxin enclosed in a vacuole
    answer: 0
    explanation: NCERT explains that the Bt toxin protein exists as an inactive protoxin, so it does not kill the Bacillus. It becomes active only after an insect ingests it.
  - id: bio-biotech2-011
    topic: biotech2-agriculture
    subtopic: Mode of action of Bt toxin
    concept: Alkaline pH of the insect gut solubilises the Bt crystals and activates the toxin
    category: concept
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [alkaline-ph, bt-toxin]
    stem: The crystals of Bt protoxin are solubilised in the gut of an insect that ingests them because of its
    options:
      - high salt concentration
      - acidic pH
      - alkaline pH
      - high temperature
    answer: 2
    explanation: NCERT states that once an insect ingests the inactive protoxin it is converted into the active toxin due to the alkaline pH of the gut, which solubilises the crystals.
  - id: bio-biotech2-012
    topic: biotech2-agriculture
    subtopic: Mode of action of Bt toxin
    concept: The activated Bt toxin binds to the surface of midgut epithelial cells
    category: factual
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [midgut, bt-toxin]
    stem: After activation, the Bt toxin binds to the surface of which cells in the gut of the insect?
    options:
      - hindgut epithelial cells
      - fat body cells
      - salivary gland cells
      - midgut epithelial cells
    answer: 3
    explanation: NCERT says the activated toxin binds to the surface of midgut epithelial cells and creates pores in them. The hindgut, salivary glands and fat body are not the site of action.
  - id: bio-biotech2-013
    topic: biotech2-agriculture
    subtopic: Mode of action of Bt toxin
    concept: Pores formed by the activated toxin cause cell swelling and lysis and death of the insect
    category: concept
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [pore-formation, bt-toxin]
    stem: Pores created by the activated Bt toxin in the gut epithelial cells of an insect cause
    options:
      - mutations in the DNA of the gut cells
      - cell swelling and lysis, eventually killing the insect
      - blockage of the tracheae of the insect
      - cell shrinkage and plasmolysis of the gut cells
    answer: 1
    explanation: NCERT states that the pores cause cell swelling and lysis and eventually cause the death of the insect. Plasmolysis is shrinkage of a plant cell in a hypertonic medium and is not involved.
  - id: bio-biotech2-014
    topic: biotech2-agriculture
    subtopic: cry genes and specificity
    concept: Bt toxins are insect-group specific, so the Bt gene is chosen by crop and targeted pest
    category: concept
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [cry-genes, specificity]
    stem: The choice of the Bt gene for a crop depends upon the crop and the targeted pest because most Bt toxins are
    options:
      - active only in the crop in which they were first isolated
      - insect-group specific
      - toxic to every insect group alike
      - effective only against plant pathogens
    answer: 1
    explanation: NCERT says the choice of genes depends upon the crop and the targeted pest, as most Bt toxins are insect-group specific. A gene effective against one group of insects will not necessarily control another.
  - id: bio-biotech2-015
    topic: biotech2-agriculture
    subtopic: cry genes and specificity
    concept: The Bt toxin is coded by a gene named cry
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [cry-genes]
    stem: The Bt toxin is coded by a gene named
    options:
      - '*rop*'
      - '*lacZ*'
      - '*cry*'
      - '*ampR*'
    answer: 2
    explanation: NCERT states that the toxin is coded by a gene named cry, and there are a number of such genes such as cryIAc, cryIIAb and cryIAb.
  - id: bio-biotech2-016
    topic: biotech2-agriculture
    subtopic: Bt as a biocontrol agent
    concept: Dried Bt spores are mixed with water and sprayed on brassicas and fruit trees as a biocontrol agent
    category: factual
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [biocontrol, bt-spray]
    stem: As a biocontrol agent, dried spores of Bt are mixed with water and sprayed on vulnerable plants such as
    options:
      - grasses and bamboos
      - brassicas and fruit trees
      - aquatic plants and algae
      - cereals and pulses
    answer: 1
    explanation: NCERT (Microbes in Human Welfare) says dried Bt spores are mixed with water and sprayed on vulnerable plants such as brassicas and fruit trees, where insect larvae eat them and the toxin is released in the larval gut.
  - id: bio-biotech2-017
    topic: biotech2-agriculture
    subtopic: Bt toxin and Bt crops
    concept: Bt toxin genes have been expressed in cotton, corn, rice, tomato, potato and soyabean
    category: factual
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [bt-crops, gm-crops]
    stem: Which one of the following sets contains only crops that NCERT names as having received the Bt toxin gene?
    options:
      - Cotton, corn, tomato and potato
      - Corn, soyabean, tomato and mustard
      - Cotton, corn, tomato and wheat
      - Cotton, rice, potato and sugarcane
    answer: 0
    explanation: NCERT gives Bt cotton, Bt corn, rice, tomato, potato and soyabean as examples. Wheat, sugarcane and mustard are not named, so only the first set is made entirely of named crops.
  - id: bio-biotech2-018
    topic: biotech2-agriculture
    subtopic: Green Revolution
    concept: Further yield gains with existing varieties are not possible with conventional breeding
    category: factual
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [green-revolution, conventional-breeding]
    stem: For farmers in the developing world, agrochemicals are often too expensive, and further increases in yield with existing varieties are not possible using
    options:
      - tissue culture
      - genetic engineering
      - somatic hybridisation
      - conventional breeding
    answer: 3
    explanation: NCERT states that agrochemicals are often too expensive for farmers in the developing world and that further increases in yield with existing varieties are not possible using conventional breeding. This is why other approaches, including GM crops, are considered.
  - id: bio-biotech2-019
    topic: biotech2-agriculture
    subtopic: Advantages of GM crops
    concept: Identify the statement that is not a benefit of genetic modification of crops
    category: concept
    format: statements
    difficulty: 2
    time: 30
    ncert: true
    battle: false
    tags: [gm-crops, advantages]
    stem: Which one of the following is NOT a benefit of genetic modification of crops listed in NCERT?
    options:
      - Tolerance to cold, drought, salt and heat
      - Reduction in post-harvest losses
      - Greater reliance on chemical pesticides
      - Increased efficiency of mineral usage by plants
    answer: 2
    explanation: Genetic modification has reduced, not increased, reliance on chemical pesticides through pest-resistant crops. Abiotic stress tolerance, fewer post-harvest losses and better mineral usage are all benefits given in NCERT.
  - id: bio-biotech2-020
    topic: biotech2-agriculture
    subtopic: Bt toxin and Bt crops
    concept: Some Bt strains kill lepidopterans, coleopterans and dipterans; Bt toxins are group specific
    category: concept
    format: statements
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [bt-toxin, insect-groups]
    stem: Which one of the following statements about *Bacillus thuringiensis* and its toxin is correct?
    options:
      - Some strains produce proteins that kill lepidopterans, coleopterans and dipterans.
      - Its toxin kills every group of insects with equal effectiveness.
      - Its protein crystals are formed in all phases of its growth.
      - Its toxin gene has been expressed only in cotton.
    answer: 0
    explanation: NCERT says some strains produce proteins that kill lepidopterans, coleopterans and dipterans. Most Bt toxins are insect-group specific, the crystals form in a particular phase of growth, and the gene has also been used in corn, rice, tomato, potato and soyabean.
  - id: bio-biotech2-021
    topic: biotech2-agriculture
    subtopic: Bt as a biocontrol agent
    concept: Bt spray uses dried spores, whereas Bt crops express the toxin gene in the plant
    category: application
    format: statements
    difficulty: 4
    time: 85
    ncert: true
    battle: false
    tags: [bt-spray, bt-crops]
    stem: Which one of the following statements correctly compares the use of Bt as a spray and as a gene in crops?
    options:
      - In both methods the toxin gene is introduced into the insect larvae, which then make the toxin themselves.
      - Bt crops express the toxin gene in the plant; in the spray method larvae eat dried Bt spores and the toxin is released in their gut.
      - In both methods a chemical insecticide is needed to convert the inactive protoxin into the active toxin in the larval gut.
      - Bt crops are made by spraying dried spores on plants; in the spray method the toxin gene is cloned into the sprayed plant.
    answer: 1
    explanation: In the spray method (Microbes in Human Welfare) larvae eat the sprayed spores and the toxin is released in their gut. In Bt crops the cloned toxin gene is expressed in the plant itself. In both cases the protoxin is activated by the insect's gut, not by an insecticide.
  - id: bio-biotech2-022
    topic: biotech2-agriculture
    subtopic: Green Revolution
    concept: Agrochemical cost, limits of conventional breeding, GM crops as a solution and the role of improved varieties
    category: concept
    format: multi-statement
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [green-revolution, gm-crops]
    stem: |-
      Consider the following statements.
      I. For farmers in the developing world, agrochemicals are often too expensive.
      II. Further increases in yield with existing varieties are not possible using conventional breeding.
      III. Genetically modified crops are a possible solution for minimising the use of fertilisers and chemicals.
      IV. Improved crop varieties alone were responsible for the increased yields of the Green Revolution.
      Which of the statements are correct?
    options:
      - I, II and III only
      - I, II and IV only
      - I, III and IV only
      - II, III and IV only
    answer: 0
    explanation: Statements I, II and III follow NCERT. Statement IV is wrong because increased yields were partly due to improved crop varieties but mainly due to better management practices and agrochemicals.
  - id: bio-biotech2-023
    topic: biotech2-agriculture
    subtopic: Bt toxin and Bt crops
    concept: Bt toxin gene cloned from the bacterium, expressed in the plant, bio-pesticide and examples of Bt crops
    category: concept
    format: multi-statement
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [bt-crops, bio-pesticide]
    stem: |-
      Consider the following statements about Bt crops.
      I. The Bt toxin gene has been cloned from *Bacillus thuringiensis*.
      II. In Bt crops the toxin gene is expressed in the insect that feeds on the plant.
      III. Bt crops, in effect, act as bio-pesticides.
      IV. Bt corn, rice, tomato, potato and soyabean are examples of Bt crops.
      Which of the statements are correct?
    options:
      - I, II and III only
      - I, III and IV only
      - II, III and IV only
      - I, II and IV only
    answer: 1
    explanation: Statement II is wrong because the cloned Bt toxin gene is expressed in the plant, which then resists insects without insecticides. Statements I, III and IV agree with NCERT.
  - id: bio-biotech2-024
    topic: biotech2-agriculture
    subtopic: Mode of action of Bt toxin
    concept: Protoxin crystals, alkaline activation, pore formation and the wrong claim of nuclear destruction
    category: concept
    format: multi-statement
    difficulty: 4
    time: 85
    ncert: true
    battle: false
    tags: [bt-toxin, mechanism]
    stem: |-
      Consider the following statements about the action of Bt toxin.
      I. The crystals contain a toxic insecticidal protein that exists as an inactive protoxin in the bacterium.
      II. The protoxin is solubilised and activated by the alkaline pH of the gut of the insect that ingests it.
      III. The activated toxin enters the midgut epithelial cells and destroys their nuclei.
      IV. The pores formed cause cell swelling and lysis, which eventually kills the insect.
      Which of the statements are correct?
    options:
      - I, II and IV only
      - I, III and IV only
      - II, III and IV only
      - I, II and III only
    answer: 0
    explanation: 'Statement III is wrong: the activated toxin binds to the surface of midgut epithelial cells and creates pores, it does not enter and destroy nuclei. Statements I, II and IV follow NCERT.'
  - id: bio-biotech2-025
    topic: biotech2-agriculture
    subtopic: cry genes and specificity
    concept: Count the correct statements on cryIAc, cryIIAb, cryIAb and insect-group specificity
    category: application
    format: multi-statement
    difficulty: 4
    time: 85
    ncert: true
    battle: false
    tags: [cry-genes, count]
    stem: |-
      Consider the following statements about Bt toxin genes.
      I. The proteins encoded by the genes *cryIAc* and *cryIIAb* control the cotton bollworms.
      II. The protein encoded by the gene *cryIAb* controls the corn borer.
      III. The gene *cryIAc* controls the corn borer.
      IV. Most Bt toxins are insect-group specific.
      How many of the above statements are correct?
    options:
      - Only one
      - Only two
      - Only three
      - All four
    answer: 2
    explanation: Statements I, II and IV are correct. Statement III is wrong because it is cryIAb, not cryIAc, that controls the corn borer; cryIAc controls cotton bollworms. So three statements are correct.
  - id: bio-biotech2-026
    topic: biotech2-agriculture
    subtopic: Integration of GM crops and Bt
    concept: Green Revolution, insect groups killed by Bt, gut activation and the basis for choosing a Bt gene
    category: concept
    format: multi-statement
    difficulty: 5
    time: 120
    ncert: true
    battle: false
    tags: [bt-toxin, green-revolution]
    stem: |-
      Consider the following statements.
      I. The Green Revolution succeeded in tripling the food supply, and the increased yields were mainly due to improved crop varieties.
      II. Some strains of *Bacillus thuringiensis* produce proteins that kill lepidopterans, coleopterans and dipterans.
      III. In the insect gut the toxin crystals are solubilised by alkaline pH and the activated toxin binds to midgut epithelial cells.
      IV. The choice of the Bt gene for a crop depends only on the targeted pest and not on the crop.
      Which of the statements are correct?
    options:
      - II and III only
      - I and IV only
      - II, III and IV only
      - I, II and III only
    answer: 0
    explanation: Statement I is wrong because the increase in yield was mainly due to better management practices and agrochemicals, improved varieties being only a partial cause. Statement IV is wrong because NCERT says the choice depends upon both the crop and the targeted pest. Statements II and III follow NCERT.
  - id: bio-biotech2-027
    topic: biotech2-agriculture
    subtopic: Advantages of GM crops
    concept: Abiotic stress tolerance is a GM benefit but insect resistance is not abiotic stress tolerance
    category: concept
    format: statement-pair
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [abiotic-stress, pest-resistance]
    stem: |-
      Statement I: Genetic modification has made crops more tolerant to abiotic stresses such as cold, drought, salt and heat.
      Statement II: Resistance of a crop to insect pests is an example of tolerance to an abiotic stress.
    options:
      - Both Statement I and Statement II are correct
      - Both Statement I and Statement II are incorrect
      - Statement I is correct but Statement II is incorrect
      - Statement I is incorrect but Statement II is correct
    answer: 2
    explanation: Statement I is correct as given in NCERT. Statement II is incorrect because insect pests are biotic factors, and pest resistance is listed separately as reduced reliance on chemical pesticides.
  - id: bio-biotech2-028
    topic: biotech2-agriculture
    subtopic: cry genes and specificity
    concept: cryIAb controls corn borer, not bollworms; the toxin is an inactive protoxin in the bacterium
    category: concept
    format: statement-pair
    difficulty: 4
    time: 85
    ncert: true
    battle: false
    tags: [cry-genes, protoxin]
    stem: |-
      Statement I: The gene *cryIAb* controls the cotton bollworms.
      Statement II: In *Bacillus thuringiensis* the Bt toxin protein exists as an active toxin.
    options:
      - Both Statement I and Statement II are correct
      - Both Statement I and Statement II are incorrect
      - Statement I is correct but Statement II is incorrect
      - Statement I is incorrect but Statement II is correct
    answer: 1
    explanation: Statement I is incorrect because cryIAc and cryIIAb control cotton bollworms, while cryIAb controls the corn borer. Statement II is incorrect because the toxin exists as an inactive protoxin in the bacterium and becomes active only in the alkaline gut of an insect.
  - id: bio-biotech2-029
    topic: biotech2-agriculture
    subtopic: Green Revolution
    concept: Green Revolution tripled food supply but was not enough; yields were mainly due to management and agrochemicals
    category: concept
    format: statement-pair
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [green-revolution]
    stem: |-
      Statement I: The Green Revolution succeeded in tripling the food supply, and this was enough to feed the growing human population.
      Statement II: Increased yields in the Green Revolution were mainly due to better management practices and the use of agrochemicals.
    options:
      - Both Statement I and Statement II are correct
      - Both Statement I and Statement II are incorrect
      - Statement I is correct but Statement II is incorrect
      - Statement I is incorrect but Statement II is correct
    answer: 3
    explanation: 'Statement I is incorrect because NCERT says the tripling of food supply was still not enough for the growing population. Statement II is correct: improved varieties contributed only partly, and the increase was mainly due to better management and agrochemicals.'
  - id: bio-biotech2-030
    topic: biotech2-agriculture
    subtopic: Mode of action of Bt toxin
    concept: The toxin does not kill the bacterium because it exists there as an inactive protoxin
    category: concept
    format: assertion-reason
    difficulty: 2
    time: 30
    ncert: true
    battle: false
    tags: [protoxin, bt-toxin]
    stem: |-
      Assertion (A): The Bt toxin does not kill the bacterium *Bacillus thuringiensis* that produces it.
      Reason (R): Inside the bacterium the Bt toxin protein exists as an inactive protoxin.
    options:
      - Both A and R are true and R is the correct explanation of A
      - Both A and R are true but R is not the correct explanation of A
