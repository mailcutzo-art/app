      R. The insect ingests crystals containing the inactive protoxin
      S. The insect dies
      T. The alkaline pH of the gut solubilises the crystals
    options:
      - R, Q, T, P, S
      - T, R, Q, P, S
      - R, T, Q, P, S
      - R, T, P, Q, S
    answer: 2
    explanation: The insect ingests the crystals of inactive protoxin (R); the alkaline gut pH solubilises them and activates the toxin (T); the toxin binds to midgut epithelial cells (Q) and creates pores that cause swelling and lysis (P); finally the insect dies (S). So the order is R, T, Q, P, S.
