    explanation: PCR amplifies nucleic acid with primers and a thermostable polymerase (3), ELISA is based on antigen-antibody interaction (2), a probe is a radioactive single-stranded DNA or RNA that hybridises to its complementary DNA (1), and a recombinant vaccine is made from an antigenic polypeptide produced in yeast or bacteria (4).
  - id: bio-biotech2-424
