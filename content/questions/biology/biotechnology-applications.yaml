    explanation: A recombinant vaccine is made by producing the antigenic polypeptide of the pathogen in bacteria or yeast by recombinant DNA technology, which allows large scale production. Injecting preformed antibodies is passive immunisation, and injecting untreated virus or a probe-labelled virus is unsafe and is not a recombinant vaccine.
  - id: bio-biotech2-436
