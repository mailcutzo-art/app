    diagram: A line graph of antibody concentration (y-axis, arbitrary units) against time in weeks (x-axis, 0 to 12). A vaccine dose is given at week 0 and the same dose is given again at week 6, each marked by an upward arrow on the x-axis. After the first dose the curve rises slowly to a low peak at about week 3 and then falls. After the second dose the curve rises sharply and quickly to a much higher peak at about week 7 and stays high for longer.
