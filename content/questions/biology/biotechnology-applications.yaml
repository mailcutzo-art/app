    diagram: A ladder-style drawing of an RNA duplex of 10 base pairs. The upper strand is labelled 'mRNA of the nematode' and reads 5'-AUGGCUUACG-3' from left to right. Beneath each base of the upper strand a dotted line joins it to a '?' on the lower strand, which is the complementary RNA made in the host cell. The lower strand is labelled 3' at its left end and 5' at its right end.
