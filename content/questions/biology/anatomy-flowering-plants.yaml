      - The conjunctive tissue of a dicot root lies between the endodermis and the pericycle.
      - In a dicot stem the pericycle lies on the inner side of the endodermis and above the phloem.
    answer: 3
    explanation: The stem pericycle lies inside the endodermis and above the phloem. The root cambium ring appears later, medullary rays lie between bundles (not within a bundle), and conjunctive tissue lies between the xylem and phloem patches of the root.
