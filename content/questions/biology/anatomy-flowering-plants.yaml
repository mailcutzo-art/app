    tags: [spongy-parenchyma, isobilateral-leaf]
    stem: |-
      Statement I: The spongy parenchyma of a dorsiventral leaf is made up of elongated cells arranged vertically and parallel to each other.
      Statement II: The mesophyll of an isobilateral leaf is differentiated into palisade and spongy parenchyma, as in a dorsiventral leaf.
    options:
      - Both Statement I and Statement II are correct
      - Both Statement I and Statement II are incorrect
      - Statement I is correct but Statement II is incorrect
      - Statement I is incorrect but Statement II is correct
    answer: 1
    explanation: Both statements are wrong. Elongated, vertical and parallel cells are palisade cells, whereas spongy cells are oval or round and loosely arranged. The mesophyll of an isobilateral leaf is not differentiated into palisade and spongy parenchyma.
  - id: bio-anat-028
