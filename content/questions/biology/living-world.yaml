questions:
  - id: bio-living-001
    topic: living-taxonomical-aids
    subtopic: Herbarium
    concept: A herbarium stores dried, pressed plant specimens preserved on sheets
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [herbarium]
    stem: A store house of collected plant specimens that are dried, pressed and preserved on sheets is called a
    options:
      - Herbarium
      - Botanical garden
      - Museum
      - Zoological park
    answer: 0
    explanation: NCERT defines a herbarium as a store house of collected plant specimens that are dried, pressed and preserved on sheets. A botanical garden holds living plants, a museum holds preserved plant and animal specimens, and a zoological park keeps living wild animals.
  - id: bio-living-002
    topic: living-taxonomical-aids
    subtopic: Botanical gardens
