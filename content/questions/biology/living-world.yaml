    time: 20
    ncert: true
    battle: true
    tags: [flora]
    stem: Which taxonomical aid gives the actual account of habitat and distribution of the plants of a given area?
    options:
      - Monograph
      - Key
      - Museum
      - Flora
    answer: 3
    explanation: A flora contains the actual account of the habitat and distribution of plants of a given area and serves as an index to the plant species found there. A monograph is about one taxon and a key is used for identification.
  - id: bio-living-009
    topic: living-taxonomical-aids
    subtopic: Museum
    concept: Insects are preserved in insect boxes after collecting, killing and pinning
    category: factual
    format: direct
    difficulty: 2
