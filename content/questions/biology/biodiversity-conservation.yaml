      - fragmentation of their habitat
      - over-exploitation by humans
    answer: 3
    explanation: NCERT names Steller's sea cow and the passenger pigeon as examples of species lost in the last 500 years through over-exploitation by humans.
  - id: bio-biodiv-014
    topic: biodiv-biodiversity-loss
    subtopic: Threatened species
    concept: Extinctions are not random across taxa; amphibians appear especially vulnerable
    category: factual
    format: direct
    difficulty: 2
