    time: 50
    ncert: true
    battle: true
    tags: [over-exploitation, marine-fish]
    stem: Which one of the following statements about over-exploitation is correct?
    options:
      - Over-exploitation has so far affected only terrestrial animals and never marine fish
      - Many marine fish populations are now over-harvested, endangering some commercially important species
      - Over-harvesting endangers only those marine species that have no commercial value
      - Over-exploitation is a more important cause of extinction than habitat loss
    answer: 1
    explanation: NCERT states that many marine fish populations around the world are over-harvested, endangering the continued existence of some commercially important species. It calls habitat loss, not over-exploitation, the most important cause.
  - id: bio-biodiv-026
    topic: biodiv-biodiversity-loss
    subtopic: Causes of loss
    concept: Present extinctions are largely due to human activities and are not balanced by speciation
    category: concept
    format: statements
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [human-activities, extinction]
    stem: Which one of the following statements about the present-day loss of species is correct?
    options:
      - The present extinctions are mostly natural and smaller than those of the geological past
      - Extinctions today are balanced by the steady speciation of new species
      - The accelerated rates of extinction are largely due to human activities, which fall under four major causes
      - Extinction rates today are about the same as in pre-human times
    answer: 2
    explanation: NCERT says that the accelerated rates of extinction are largely due to human activities and are grouped under four major causes. It adds that it is doubtful whether new species are being added through speciation, and that today's rates are 100 to 1,000 times those of pre-human times.
  - id: bio-biodiv-027
    topic: biodiv-biodiversity-loss
    subtopic: Alien species invasions
    concept: Alien species may be introduced unintentionally or deliberately, so 'only deliberately' is incorrect
    category: concept
    format: statements
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [evil-quartet, alien-species]
    stem: Which of the following statements about the Evil Quartet is INCORRECT?
    options:
      - Co-extinction involves species associated in an obligatory way with an extinct species
      - Habitat loss and fragmentation is the most important of the four causes
      - Over-exploitation arises when human need turns into greed
      - Alien species invasions arise only when a species is introduced deliberately
    answer: 3
    explanation: NCERT says alien species may be introduced unintentionally or deliberately, for whatever purpose, and some of them turn invasive. The other three statements follow the NCERT descriptions of co-extinction, habitat loss and over-exploitation.
  - id: bio-biodiv-028
