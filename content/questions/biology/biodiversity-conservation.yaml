questions:
  - id: bio-biodiv-001
    topic: biodiv-biodiversity-loss
    subtopic: The Evil Quartet
    concept: The Evil Quartet is the sobriquet for the four major causes of accelerated species extinction
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [evil-quartet]
    stem: '''The Evil Quartet'' is the sobriquet used by ecologists for'
    options:
      - the four levels at which biodiversity is studied
      - the four mass extinctions of the geological past
      - the four biodiversity hotspots that cover India
      - the four major causes of the accelerated species extinctions of today
    answer: 3
    explanation: NCERT groups habitat loss and fragmentation, over-exploitation, alien species invasions and co-extinctions as the four major causes of present-day species extinctions and calls them 'The Evil Quartet'. Biodiversity is studied at three levels, five mass extinctions occurred earlier, and three hotspots cover India.
  - id: bio-biodiv-002
    topic: biodiv-biodiversity-loss
    subtopic: Extent of extinction
    concept: Colonisation of tropical Pacific Islands by humans led to the extinction of over 2,000 native bird species
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [pacific-islands, extinction]
    stem: The colonisation of tropical Pacific Islands by humans is said to have led to the extinction of more than
    options:
      - 2,000 species of native birds
      - 200 species of cichlid fish
      - 784 species of vertebrates
      - 15,500 species of flowering plants
    answer: 0
    explanation: NCERT states that human colonisation of the tropical Pacific Islands is said to have led to the loss of more than 2,000 species of native birds. The 200 cichlid species belong to the Lake Victoria example, 784 is the IUCN count of all recorded extinctions in 500 years, and 15,500 is the number of threatened species.
  - id: bio-biodiv-003
    topic: biodiv-biodiversity-loss
    subtopic: Co-extinctions
    concept: Co-extinction is the loss of species associated in an obligatory way with an extinct species
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [co-extinction]
    stem: When a species becomes extinct, the plant and animal species associated with it in an obligatory way also become extinct. This cause of biodiversity loss is called
    options:
      - over-exploitation
      - habitat fragmentation
      - co-extinction
      - alien species invasion
    answer: 2
    explanation: NCERT defines co-extinction as the loss of species that are obligately associated with a species that has itself become extinct, such as the parasites of a host fish or a coevolved pollinator of a plant.
  - id: bio-biodiv-004
    topic: biodiv-biodiversity-loss
    subtopic: Extent of extinction
