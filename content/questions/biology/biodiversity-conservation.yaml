    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [extinction, projection]
    stem: If present trends continue, ecologists warn that what fraction of all the species on earth might be wiped out within the next 100 years?
    options:
      - Nearly half
      - About one-tenth
      - About one-fourth
      - About three-fourths
    answer: 0
    explanation: NCERT cites the warning of ecologists that, if the present trends continue, nearly half of all the species on earth might be wiped out within the next 100 years.
  - id: bio-biodiv-005
