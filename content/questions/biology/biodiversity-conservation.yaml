      - Soil-dwelling decomposers
      - Aquatic algae and other phytoplankton
    answer: 0
    explanation: NCERT states that when large habitats are broken up into small fragments, mammals and birds requiring large territories and certain animals with migratory habits are badly affected, leading to population declines.
  - id: bio-biodiv-016
