    options:
      - Birds
      - Amphibians
      - Mammals
      - Gymnosperms
    answer: 1
    explanation: 'NCERT notes that some groups, such as amphibians, appear more vulnerable to extinction. Its figures agree: 32 per cent of amphibian species face the threat, against 12 per cent of birds and 23 per cent of mammals.'
  - id: bio-biodiv-015
    topic: biodiv-biodiversity-loss
