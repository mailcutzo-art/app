  - id: bio-biodiv-031
    topic: biodiv-biodiversity-loss
    subtopic: Alien species invasions
    concept: The Nile perch was an introduced alien species, not an indigenous one
    category: concept
    format: assertion-reason
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [nile-perch, alien-species]
    stem: |-
      Assertion (A): The Nile perch is an indigenous species of Lake Victoria whose spread eliminated many cichlid fish.
      Reason (R): Invasive alien species can cause the decline or extinction of indigenous species.
    options:
      - Both A and R are true and R is the correct explanation of A
      - Both A and R are true but R is not the correct explanation of A
      - A is true but R is false
      - A is false but R is true
    answer: 3
    explanation: 'The assertion is false, because the Nile perch was introduced into Lake Victoria, which makes it an alien species. The reason is true: NCERT says some alien species turn invasive and cause decline or extinction of indigenous species.'
  - id: bio-biodiv-032
    topic: biodiv-biodiversity-loss
    subtopic: Habitat loss and fragmentation
    concept: Large animals and migrants need large territories, so fragmentation reduces their populations
    category: concept
    format: assertion-reason
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [fragmentation, habitat-loss]
