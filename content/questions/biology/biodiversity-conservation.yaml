    options:
      - 9 per cent
      - 3 per cent
      - 12 per cent
      - 6 per cent
    answer: 3
    explanation: 'NCERT gives tropical rain forests as the most dramatic example of habitat loss: from more than 14 per cent of the earth''s land surface they have shrunk to no more than 6 per cent.'
  - id: bio-biodiv-010
    topic: biodiv-biodiversity-loss
    subtopic: Extent of extinction
    concept: IUCN Red List (2004) documents the extinction of 784 species in the last 500 years
