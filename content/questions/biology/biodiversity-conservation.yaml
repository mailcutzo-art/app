      - '*Rauwolfia vomitoria*'
    answer: 3
    explanation: NCERT names carrot grass (*Parthenium*), *Lantana* and water hyacinth (*Eichhornia*) as invasive weeds. *Rauwolfia vomitoria* appears in the chapter as a medicinal plant showing genetic variation in reserpine content, not as an invasive weed.
  - id: bio-biodiv-019
    topic: biodiv-biodiversity-loss
    subtopic: Sixth extinction
    concept: The Sixth Extinction differs from earlier mass extinctions in its rate and its human cause
    category: concept
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [sixth-extinction, extinction-rate]
    stem: The 'Sixth Extinction' now in progress differs from the five earlier mass extinctions chiefly in
    options:
      - its rate, estimated at 10 to 100 times that of earlier episodes, with climatic change responsible
      - its rate, estimated at 100 to 1,000 times that of pre-human times, with human activities responsible
      - its duration, since it has continued for more than 3 billion years
      - its extent, since it has so far removed only species of tropical rain forests
    answer: 1
    explanation: 'NCERT says the difference lies in the rate: current extinction rates are estimated to be 100 to 1,000 times faster than in pre-human times, and human activities are responsible. Large-scale loss of species had happened before humans appeared.'
  - id: bio-biodiv-020
    topic: biodiv-biodiversity-loss
    subtopic: Consequences of biodiversity loss
    concept: Loss of biodiversity lowers resistance to perturbations, so a rise in resistance is not a consequence
    category: concept
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [biodiversity-loss, ecosystem-processes]
    stem: In general, loss of biodiversity in a region may lead to all of the following EXCEPT
    options:
      - a decline in plant production
      - an increase in the resistance of the ecosystem to drought and other perturbations
      - an increased variability in processes such as water use
      - an increased variability in pest and disease cycles
    answer: 1
    explanation: 'NCERT lists three likely effects of biodiversity loss: a decline in plant production, lowered resistance to environmental perturbations such as drought, and increased variability in ecosystem processes such as productivity, water use and pest and disease cycles. Resistance is lowered, not raised.'
  - id: bio-biodiv-021
    topic: biodiv-biodiversity-loss
    subtopic: Extent of extinction
    concept: Invertebrates form 359 of the 784 species recorded extinct by IUCN (2004)
    category: numerical
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [iucn, numerical]
    stem: 'The IUCN Red List (2004) records 784 extinctions in 500 years: 338 vertebrates, 87 plants and the rest invertebrates. How many are invertebrates?'
    options:
      - '297'
      - '421'
      - '359'
      - '349'
    answer: 2
    explanation: Invertebrates = 784 - (338 + 87) = 784 - 425 = 359. This agrees with the NCERT figure of 359 invertebrates.
  - id: bio-biodiv-022
    topic: biodiv-biodiversity-loss
    subtopic: Habitat loss and fragmentation
    concept: Rain forest cover fell from over 14 to no more than 6 per cent of land, a loss of at least 57 per cent
    category: numerical
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [rain-forest, numerical]
    stem: Rain forests once covered over 14% of the land surface and now cover at most 6%. At least what percentage of the original forest area is lost?
    options:
      - 8 per cent
      - About 57 per cent
      - 43 per cent
      - 14 per cent
    answer: 1
    explanation: Loss is at least (14 - 6)/14 x 100 = 57 per cent of the original area. The trap options are 8, which is a difference in percentage points, and 43, which is the fraction that remains.
  - id: bio-biodiv-023
    topic: biodiv-biodiversity-loss
    subtopic: Sixth extinction
    concept: At 100 to 1,000 times the pre-human rate, 3 species per 1,000 years becomes 300 to 3,000
    category: numerical
    format: direct
    difficulty: 3
    time: 50
    ncert: false
    battle: true
    tags: [extinction-rate, numerical]
    stem: In pre-human times a region lost about 3 species per 1,000 years. If extinction is now 100 to 1,000 times faster, expected losses in 1,000 years are
    options:
      - 30 to 300
      - 3 to 30
      - 300 to 3,000
      - 3,000 to 30,000
    answer: 2
    explanation: Present rates are 100 to 1,000 times the pre-human rate, so 3 x 100 = 300 and 3 x 1,000 = 3,000 species in 1,000 years.
  - id: bio-biodiv-024
