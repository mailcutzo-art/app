  - id: bio-biodiv-017
    topic: biodiv-biodiversity-loss
    subtopic: Alien species invasions
    concept: Illegal introduction of Clarias gariepinus for aquaculture threatens indigenous catfishes
    category: factual
    format: statements
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [alien-species, clarias]
    stem: Which one of the following statements about the African catfish *Clarias gariepinus* is correct?
    options:
      - Its introduction destroyed the cichlid fish of Lake Victoria
      - It is an invasive aquatic weed that chokes Indian water bodies
