  - id: bio-biodiv-030
    topic: biodiv-biodiversity-loss
    subtopic: Habitat loss and fragmentation
    concept: Fragmentation harms animals needing large ranges; pollution also degrades habitats
    category: concept
    format: statement-pair
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [fragmentation, pollution]
    stem: |-
      Statement I: Fragmentation of habitats chiefly harms small sedentary animals that need little space.
      Statement II: Degradation of habitats by pollution also threatens the survival of many species.
    options:
      - Both Statement I and Statement II are correct
      - Both Statement I and Statement II are incorrect
      - Statement I is correct but Statement II is incorrect
      - Statement I is incorrect but Statement II is correct
