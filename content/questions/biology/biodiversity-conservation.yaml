    explanation: The Evil Quartet comprises habitat loss and fragmentation, over-exploitation, alien species invasions and co-extinctions. Climate change is not part of this group in NCERT.
  - id: bio-biodiv-025
    topic: biodiv-biodiversity-loss
    subtopic: Over-exploitation
    concept: Many marine fish populations are over-harvested, endangering commercially important species
    category: concept
    format: statements
