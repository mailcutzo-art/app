    answer: 2
    explanation: NCERT says the recent illegal introduction of the African catfish *Clarias gariepinus* for aquaculture is posing a threat to the indigenous catfishes of our rivers. The Lake Victoria cichlids were lost to the Nile perch, and the aquatic weed is water hyacinth.
  - id: bio-biodiv-018
    topic: biodiv-biodiversity-loss
    subtopic: Alien species invasions
