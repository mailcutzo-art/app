      - '27'
      - 2,000
    answer: 0
    explanation: NCERT states that the IUCN Red List (2004) documents the extinction of 784 species (338 vertebrates, 359 invertebrates and 87 plants) in the last 500 years. The figure 27 refers to the last twenty years alone.
  - id: bio-biodiv-011
