  - id: bio-biodiv-389
    topic: biodiv-patterns
    subtopic: Applying the patterns
    concept: Fitting Z from two islands and predicting a third
    category: numerical
    format: case
    difficulty: 4
    time: 85
    ncert: false
    battle: false
    tags: [case, regression]
    stem: On islands of one region a survey finds 20 bat species on a 10 km^2 island and 32 species on a 100 km^2 island. Assuming the same Z, about how many species are expected on a 1,000 km^2 island?
    options:
      - '100'
      - '64'
      - '50'
      - '44'
    answer: 2
    explanation: Z = log(32 ÷ 20) ÷ log(100 ÷ 10) = 0.2. A further 10-fold rise in area multiplies the richness by 10^0.2 ≈ 1.6, so S ≈ 32 × 1.6 ≈ 50. Adding the same 12 species again (44) treats the relationship as linear, and 64 treats it as a doubling for every 10-fold rise.
