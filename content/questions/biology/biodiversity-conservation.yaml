  - id: bio-biodiv-007
    topic: biodiv-biodiversity-loss
    subtopic: The Evil Quartet
    concept: Habitat loss and fragmentation is the most important cause driving species to extinction
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [evil-quartet, habitat-loss]
    stem: Which of the four major causes of biodiversity loss is regarded as the most important one driving animals and plants to extinction?
    options:
      - Over-exploitation
      - Habitat loss and fragmentation
      - Alien species invasions
      - Co-extinctions
    answer: 1
    explanation: NCERT calls habitat loss and fragmentation the most important cause driving animals and plants to extinction, the most dramatic examples coming from tropical rain forests.
  - id: bio-biodiv-008
    topic: biodiv-biodiversity-loss
    subtopic: Sixth extinction
    concept: Fossil history shows five episodes of mass extinction before the present Sixth Extinction
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [mass-extinction, sixth-extinction]
    stem: Fossil records show that since life originated on earth, how many episodes of mass extinction occurred before the present 'Sixth Extinction'?
    options:
      - Four
      - Six
      - Three
      - Five
    answer: 3
    explanation: During the more than 3 billion years since life originated, there were five episodes of mass extinction. The ongoing one is called the Sixth Extinction, so the number before it is five, not six.
  - id: bio-biodiv-009
    topic: biodiv-biodiversity-loss
