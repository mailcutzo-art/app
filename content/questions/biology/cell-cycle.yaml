      - Meiosis II of a secondary spermatocyte
      - Meiosis I of a primary spermatocyte
    answer: 1
    explanation: Meiosis I of a primary oocyte is unequal and forms a large secondary oocyte and a tiny first polar body. A primary spermatocyte forms two equal secondary spermatocytes, a secondary spermatocyte forms two equal spermatids, and mitosis of a spermatogonium gives equal cells.
  - id: bio-cellcycle-498
    topic: cellcycle-mitosis-meiosis-comparison
    subtopic: DNA and chromosome number
    concept: A secondary spermatocyte has half the chromosomes of a G1 cell but the same DNA content
    category: concept
