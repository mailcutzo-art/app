questions:
  - id: bio-cellcycle-001
    topic: cellcycle-meiosis-two-significance
    subtopic: Telophase II and cytokinesis
    concept: Telophase II and cytokinesis give a tetrad of four haploid cells
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [telophase-ii, tetrad]
    stem: Telophase II followed by cytokinesis in meiosis results in a tetrad of cells that are
    options:
      - Four in number and haploid
      - Four in number and diploid
      - Two in number and haploid
      - Two in number and diploid
    answer: 0
    explanation: Meiosis ends with telophase II, in which the chromosome groups are enclosed by nuclear envelopes; cytokinesis then forms a tetrad of four haploid cells. Only two cells (a diad) are present at the end of meiosis I.
  - id: bio-cellcycle-002
    topic: cellcycle-meiosis-two-significance
    subtopic: Interkinesis
    concept: The stage between the two meiotic divisions is interkinesis
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [interkinesis]
    stem: The generally short-lived stage between meiosis I and meiosis II is called
    options:
      - Interphase
      - Diakinesis
      - Interkinesis
      - Cytokinesis
    answer: 2
    explanation: Interkinesis is the stage between the two meiotic divisions and is generally short lived; it is followed by prophase II. Diakinesis is the last substage of prophase I, interphase precedes a division and cytokinesis is the division of the cytoplasm.
  - id: bio-cellcycle-003
    topic: cellcycle-meiosis-two-significance
    subtopic: Anaphase II
    concept: Anaphase II begins with simultaneous splitting of the centromere of each chromosome
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [anaphase-ii, centromere]
    stem: Anaphase II begins with the simultaneous splitting of the
    options:
      - Centromere of each chromosome
      - Chiasmata of each bivalent
      - Nuclear envelope of each cell
      - Kinetochore microtubules of the spindle
    answer: 0
    explanation: At the start of anaphase II the centromere of every chromosome, which had held the two sister chromatids together, splits at the same time, so the chromatids can move to opposite poles.
  - id: bio-cellcycle-004
    topic: cellcycle-meiosis-two-significance
    subtopic: Metaphase II
    concept: 'Metaphase II: chromosomes at the equator, sister kinetochores attached to opposite poles'
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [metaphase-ii]
    stem: In which stage of meiosis II do the chromosomes align at the equator, with microtubules from opposite poles attached to the kinetochores of sister chromatids?
    options:
      - Prophase II
      - Anaphase II
      - Metaphase II
      - Telophase II
    answer: 2
    explanation: 'This is the description of metaphase II given in NCERT: chromosomes lie at the equator and spindle microtubules from opposite poles hold the kinetochores of the sister chromatids. Prophase II precedes it, the chromatids separate in anaphase II and nuclei re-form in telophase II.'
  - id: bio-cellcycle-005
    topic: cellcycle-meiosis-two-significance
    subtopic: Prophase II
    concept: The nuclear membrane disappears by the end of prophase II
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [prophase-ii, nuclear-membrane]
    stem: By the end of which stage of meiosis does the nuclear membrane disappear before the chromosomes align for the second division?
    options:
      - Interkinesis
      - Metaphase II
      - Telophase II
      - Prophase II
    answer: 3
    explanation: NCERT states that the nuclear membrane disappears by the end of prophase II and the chromosomes again become compact. Interkinesis comes before it, and at telophase II the envelope re-forms.
  - id: bio-cellcycle-006
    topic: cellcycle-meiosis-two-significance
    subtopic: Entry into meiosis II
    concept: Meiosis II starts immediately after cytokinesis, before chromosomes fully elongate
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [meiosis-ii, interkinesis]
    stem: Meiosis II is usually initiated immediately after cytokinesis of meiosis I, at a time when
    options:
      - A fresh S phase has doubled the DNA
      - The chromosomes have reached the extremely extended interphase state
      - The chromosomes have not yet fully elongated
      - A long G2 phase has been completed
    answer: 2
    explanation: NCERT says meiosis II starts right after cytokinesis, usually before the chromosomes have fully elongated. There is no fresh S phase and the chromosomes do not return to the extremely extended interphase state.
  - id: bio-cellcycle-007
    topic: cellcycle-meiosis-two-significance
    subtopic: Meiosis II and mitosis
    concept: Meiosis II resembles a normal mitosis
    category: concept
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [meiosis-ii, mitosis]
    stem: Which division of meiosis resembles a normal mitosis?
    options:
      - Meiosis I
      - Meiosis II
      - Both meiosis I and meiosis II
      - Neither meiosis I nor meiosis II
    answer: 1
    explanation: 'In contrast to meiosis I, meiosis II resembles a normal mitosis: the centromeres split and sister chromatids separate. Meiosis I is different because homologous chromosomes pair, recombine and then separate.'
  - id: bio-cellcycle-008
    topic: cellcycle-meiosis-two-significance
    subtopic: Anaphase I versus anaphase II
    concept: Sister chromatids go to opposite poles in anaphase II
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [anaphase-ii, sister-chromatids]
    stem: Sister chromatids of a chromosome move to opposite poles during which stage of meiosis?
    options:
      - Anaphase I
      - Anaphase II
      - Metaphase II
      - Telophase I
    answer: 1
    explanation: In anaphase I the homologous chromosomes separate while sister chromatids stay together at their centromeres. In anaphase II the centromeres split, so the sister chromatids move to opposite poles.
  - id: bio-cellcycle-009
    topic: cellcycle-meiosis-two-significance
    subtopic: Features of meiosis
    concept: Meiosis has two sequential nuclear and cell divisions
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [meiosis, two-divisions]
    stem: How many sequential cycles of nuclear and cell division are there in meiosis?
    options:
      - Two
      - One
      - Three
      - Four
    answer: 0
    explanation: Meiosis involves two sequential cycles of nuclear and cell division, called meiosis I and meiosis II, but only a single cycle of DNA replication.
  - id: bio-cellcycle-010
    topic: cellcycle-meiosis-two-significance
    subtopic: Prophase II
    concept: Chromosome and chromatid number at prophase II of a 2n = 20 organism
    category: numerical
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [chromosome-number, prophase-ii]
    stem: A diploid cell of an organism has 2n = 20. Each cell entering prophase II contains
    options:
      - 20 chromosomes, each with two chromatids
      - 10 chromosomes, each with two chromatids
      - 10 chromosomes, each with one chromatid
      - 20 chromosomes, each with one chromatid
    answer: 1
    explanation: Meiosis I halves the chromosome number, so each cell of the diad has n = 10 chromosomes. No DNA replication follows, so each chromosome still has two sister chromatids until anaphase II.
  - id: bio-cellcycle-011
    topic: cellcycle-meiosis-two-significance
    subtopic: Results of meiosis II
    concept: DNA content per cell falls from 4C after S phase to C after meiosis II
    category: numerical
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [dna-content, meiosis-ii]
    stem: A diploid cell has DNA content 2C in G1. What is the DNA content of each cell at the end of meiosis II?
    options:
      - 2C
      - C
      - 4C
      - C/2
    answer: 1
    explanation: S phase doubles the DNA to 4C. Meiosis I gives two cells with 2C each and meiosis II gives four cells with C each. Halving the G1 value twice (to C/2) forgets the S phase doubling.
  - id: bio-cellcycle-012
    topic: cellcycle-meiosis-two-significance
    subtopic: Results of meiosis II
    concept: Tetrad of cells at the end of meiosis II differs from the tetrad of chromatids of pachytene
    category: concept
    format: direct
    difficulty: 4
    time: 85
    ncert: true
    battle: true
    tags: [tetrad, confused-terms]
    stem: The 'tetrad' formed at the end of meiosis II is a group of
    options:
      - Four haploid cells
      - Four chromatids of a bivalent
      - Four homologous chromosomes
      - Four nuclei inside a single cell
    answer: 0
    explanation: NCERT uses 'tetrad' for the four chromatids of a bivalent at pachytene in prophase I. The tetrad at the end of meiosis II is a tetrad of cells, that is, four haploid cells.
  - id: bio-cellcycle-013
    topic: cellcycle-meiosis-two-significance
    subtopic: Results of meiosis II
    concept: Diad of cells after telophase I and tetrad of cells after telophase II
    category: factual
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [diad, tetrad]
    stem: In meiosis, the groups of cells formed at the end of telophase I and telophase II are respectively called
    options:
      - Diad of cells and tetrad of cells
      - Tetrad of cells and diad of cells
      - Diad of cells and bivalent
      - Bivalent and tetrad of cells
    answer: 0
    explanation: Cytokinesis after telophase I gives a diad of cells and cytokinesis after telophase II gives a tetrad of cells. Bivalents are paired homologous chromosomes of prophase I, not cells.
  - id: bio-cellcycle-014
    topic: cellcycle-meiosis-two-significance
    subtopic: Metaphase II
    concept: At metaphase II spindle microtubules attach to kinetochores of sister chromatids
    category: concept
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [metaphase-ii, kinetochore]
    stem: During metaphase II, the microtubules from opposite poles of the spindle get attached to the kinetochores of
    options:
      - The two homologous chromosomes of each bivalent
      - Sister chromatids of each chromosome
      - Non-sister chromatids of homologous chromosomes
      - Only one chromatid of each chromosome
    answer: 1
    explanation: In metaphase I the microtubules attach to the pair of homologous chromosomes. In metaphase II they attach to the kinetochores of the sister chromatids of each chromosome, so that anaphase II can pull the chromatids apart.
  - id: bio-cellcycle-015
    topic: cellcycle-meiosis-two-significance
    subtopic: Anaphase II
    concept: Splitting of centromeres occurs in anaphase II but not in anaphase I
    category: concept
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [anaphase-ii, anaphase-i]
    stem: Which event takes place in anaphase II but not in anaphase I of meiosis?
    options:
      - Separation of homologous chromosomes
      - Movement of chromosomes towards opposite poles
      - Sister chromatids remaining associated at their centromeres
      - Splitting of the centromere of each chromosome
    answer: 3
    explanation: Chromosomes move to the poles in both anaphases. In anaphase I homologous chromosomes separate and the sister chromatids stay associated at their centromeres. Only in anaphase II does the centromere of each chromosome split.
  - id: bio-cellcycle-016
    topic: cellcycle-meiosis-two-significance
    subtopic: Telophase II
    concept: Nuclear envelope re-forms around the two groups of chromosomes in telophase II
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [telophase-ii, nuclear-envelope]
    stem: In which stage of meiosis II are the two groups of chromosomes once again enclosed by a nuclear envelope?
    options:
      - Prophase II
      - Metaphase II
      - Anaphase II
      - Telophase II
    answer: 3
    explanation: NCERT says meiosis ends with telophase II, in which the two groups of chromosomes get enclosed by nuclear envelopes; cytokinesis then follows. In the earlier stages the envelope is absent.
  - id: bio-cellcycle-017
    topic: cellcycle-meiosis-two-significance
    subtopic: Prophase II
    concept: Prophase II is simpler than prophase I because homologous chromosomes do not pair
    category: concept
    format: direct
    difficulty: 3
    time: 50
    ncert: false
    battle: true
    tags: [prophase-ii, prophase-i]
    stem: Prophase II is a much simpler prophase than prophase I mainly because it
    options:
      - Takes place without any condensation of chromosomes
      - Does not involve pairing and recombination of homologous chromosomes
      - Takes place with the nuclear membrane intact throughout
      - Is preceded by a fresh round of DNA replication
    answer: 1
    explanation: Prophase I includes pairing of homologous chromosomes, synapsis and recombination. These are absent in prophase II, which resembles the prophase of a normal mitosis.
  - id: bio-cellcycle-018
    topic: cellcycle-meiosis-two-significance
    subtopic: Anaphase II
    concept: Number of chromosomes moving to each pole in anaphase II of an n = 4 cell
    category: numerical
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [anaphase-ii, chromosome-number]
    stem: In an organism with 2n = 8, how many chromosomes move to each pole during anaphase II of a cell undergoing meiosis II?
    options:
      - '2'
      - '8'
      - '4'
      - '16'
    answer: 2
    explanation: Each cell in meiosis II has n = 4 chromosomes, each of two chromatids. When the centromeres split, 8 daughter chromosomes form and 4 go to each pole. The value 8 is the total, not the number per pole.
  - id: bio-cellcycle-019
    topic: cellcycle-meiosis-two-significance
    subtopic: Significance of meiosis
    concept: Meiosis ensures the haploid phase of the life cycle
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [meiosis, haploid-phase]
    stem: Which phase of the life cycle of sexually reproducing organisms does meiosis ensure?
    options:
      - The diploid phase
      - The haploid phase
      - The polyploid phase
      - The G0 phase
    answer: 1
    explanation: Meiosis produces haploid cells and so ensures the haploid phase of the life cycle, whereas fertilisation restores the diploid phase.
  - id: bio-cellcycle-020
    topic: cellcycle-meiosis-two-significance
    subtopic: Significance of meiosis
    concept: Meiosis conserves the chromosome number of a species across generations
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [significance, chromosome-number]
    stem: Meiosis makes it possible for a sexually reproducing species to keep its characteristic chromosome number
    options:
      - Doubled in every successive generation
      - Halved in every successive generation
      - Constant from one generation to the next
      - Increased by one chromosome in each generation
    answer: 2
    explanation: Meiosis halves the chromosome number of the gametes and fertilisation restores it, so the chromosome number of the species is conserved from one generation to the next.
  - id: bio-cellcycle-021
    topic: cellcycle-meiosis-two-significance
    subtopic: Significance of meiosis
    concept: Variation introduced by meiosis is important for evolution
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [significance, variation]
    stem: The genetic variability that meiosis introduces into a population is important mainly for
    options:
      - Growth of the organism
      - Evolution
      - Repair of damaged tissues
      - Restoring the nucleo-cytoplasmic ratio
    answer: 1
    explanation: NCERT says meiosis increases genetic variability from one generation to the next, and variations are very important for the process of evolution. Growth, repair and the nucleo-cytoplasmic ratio are linked to mitosis.
  - id: bio-cellcycle-022
    topic: cellcycle-meiosis-two-significance
    subtopic: Significance of meiosis
    concept: Conservation of chromosome number across generations is a role of meiosis, not mitosis
    category: concept
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [significance, mitosis]
    stem: Which role is performed by meiosis but not by mitosis?
    options:
      - Growth of multicellular organisms
      - Replacement of cells of the gut lining
      - Restoring the nucleo-cytoplasmic ratio of a cell
      - Conserving the chromosome number of a species across generations
    answer: 3
    explanation: Meiosis conserves the chromosome number of a species across sexually reproducing generations. Growth, replacement of lost cells and restoring the nucleo-cytoplasmic ratio are significances of mitosis.
  - id: bio-cellcycle-023
    topic: cellcycle-meiosis-two-significance
    subtopic: Meiosis II in gametogenesis
    concept: The second meiotic division of the secondary oocyte is completed after sperm entry
    category: factual
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [oogenesis, meiosis-ii]
    stem: In a human female, the second meiotic division of the secondary oocyte is completed
    options:
      - Before ovulation, inside the Graafian follicle
      - At puberty, when the primary follicle forms
      - After a sperm enters the ovum
      - Before birth, in the foetal ovary
    answer: 2
    explanation: The secondary oocyte released at ovulation completes its second meiotic division only after a sperm enters it. This division is unequal and forms a second polar body and a haploid ovum.
  - id: bio-cellcycle-024
    topic: cellcycle-meiosis-two-significance
    subtopic: Meiosis II in gametogenesis
    concept: 'Meiosis II of a secondary oocyte is unequal: one ovum and a polar body'
    category: factual
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [oogenesis, polar-body]
    stem: The second meiotic division of a secondary oocyte is unequal and results in
    options:
      - Two equal haploid ova
      - Two equal polar bodies
      - Four equal haploid ootids
      - One large haploid ovum and a tiny second polar body
    answer: 3
    explanation: NCERT states that the second meiotic division of the oocyte is also unequal and forms a tiny second polar body and a large haploid ovum (ootid).
  - id: bio-cellcycle-025
    topic: cellcycle-meiosis-two-significance
    subtopic: Meiosis II in gametogenesis
    concept: A secondary spermatocyte gives two equal haploid spermatids by meiosis II
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [spermatogenesis, meiosis-ii]
    stem: Each secondary spermatocyte completes meiosis II to give rise to
    options:
      - Four haploid spermatids
      - Two diploid spermatids
      - One spermatid and one polar body
      - Two equal haploid spermatids
    answer: 3
    explanation: A primary spermatocyte forms two secondary spermatocytes in meiosis I. Each secondary spermatocyte divides in meiosis II into two equal haploid spermatids, so four spermatids arise from one primary spermatocyte.
  - id: bio-cellcycle-026
    topic: cellcycle-meiosis-two-significance
    subtopic: Significance of meiosis
    concept: Meiocytes are the gamete mother cells that undergo meiosis
    category: factual
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [meiocyte, gametes]
    stem: In diploid organisms, the specialised gamete mother cells that undergo meiosis to form gametes are called
    options:
      - Zygotes
      - Zoospores
      - Blastomeres
      - Meiocytes
    answer: 3
    explanation: Gametes of a diploid organism arise from specialised diploid cells, the meiocytes (gamete mother cells), by meiosis. Zygotes are formed by fertilisation and blastomeres by cleavage of the zygote.
  - id: bio-cellcycle-027
    topic: cellcycle-meiosis-two-significance
    subtopic: Significance of meiosis
    concept: Meiosis in the zygote of haplontic algae gives haploid spores
    category: factual
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [haplontic, life-cycle]
    stem: In haplontic algae such as *Spirogyra*, meiosis takes place in the diploid zygote and gives rise to
    options:
      - Haploid gametes
      - Diploid spores
      - Haploid spores
      - Diploid gametes
    answer: 2
    explanation: In a haplontic life cycle the only diploid stage is the one-celled zygote. Its meiosis forms haploid spores, which divide mitotically to form the haploid gametophyte.
  - id: bio-cellcycle-028
    topic: cellcycle-meiosis-two-significance
    subtopic: Stages of meiosis II
    concept: Anaphase II splits centromeres; no homologue separation, no new S phase
    category: concept
    format: statements
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [meiosis-ii, statements]
    stem: Which one of the following statements about meiosis II is correct?
    options:
      - Homologous chromosomes separate from each other in anaphase II
      - The centromere of each chromosome splits in anaphase II and the sister chromatids move to opposite poles
      - A fresh S phase doubles the DNA content of each cell before prophase II begins
      - Chiasmata hold the chromosomes together at the equator in metaphase II
    answer: 1
    explanation: In anaphase II the centromere of each chromosome splits and the sister chromatids move to opposite poles. Homologous chromosomes separate in anaphase I, no fresh S phase precedes meiosis II and chiasmata belong to prophase I.
  - id: bio-cellcycle-029
    topic: cellcycle-meiosis-two-significance
    subtopic: Interkinesis
    concept: Interkinesis is a short stage between divisions without DNA replication
    category: concept
    format: statements
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [interkinesis, statements]
    stem: Which one of the following statements about interkinesis is correct?
    options:
      - DNA is replicated in it, so each cell enters meiosis II with doubled DNA content
      - Its chromosomes are in the fully extended state of the interphase nucleus
      - It lies between the two meiotic divisions and is generally short lived
      - It is the longest stage of meiosis and ends with the formation of a diad of cells
    answer: 2
    explanation: Interkinesis lies between the two meiotic divisions and is generally short lived. There is no second round of DNA replication, and the chromosomes may disperse somewhat but do not reach the extremely extended state of the interphase nucleus.
  - id: bio-cellcycle-030
    topic: cellcycle-meiosis-two-significance
    subtopic: Results of meiosis II
    concept: Features of the four cells at the end of meiosis II
    category: application
    format: statements
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [tetrad, statements]
    stem: Which one of the following statements about the four cells formed at the end of meiosis II is incorrect?
    options:
      - Each chromosome in the four cells consists of a single chromatid
      - The four cells contain the haploid number of chromosomes
      - The DNA content of each of the four cells is half that of a cell at the end of meiosis I
      - The four cells are genetically identical to the original diploid parent cell
    answer: 3
    explanation: Each of the four cells is haploid, each chromosome is a single chromatid after anaphase II and the DNA content is C, half of the 2C per cell after meiosis I. Because of recombination and the halving of the chromosome number, the cells are not identical to the diploid parent cell.
  - id: bio-cellcycle-031
    topic: cellcycle-meiosis-two-significance
    subtopic: Metaphase II
    concept: Bivalents align in metaphase I but individual chromosomes align in metaphase II
    category: concept
    format: statements
    difficulty: 4
    time: 85
    ncert: true
    battle: false
    tags: [metaphase-i, metaphase-ii]
    stem: Which one of the following correctly distinguishes metaphase I from metaphase II?
    options:
      - Bivalents are aligned at the equator in metaphase I, whereas individual chromosomes, each made of two chromatids, are aligned in metaphase II
      - Microtubules attach to kinetochores of sister chromatids in metaphase I and to those of homologous chromosomes in metaphase II
      - The chromosomes at the equator are made of single chromatids in metaphase II but of two chromatids in metaphase I
      - A haploid cell aligns the chromosomes in metaphase I, whereas a diploid cell does so in metaphase II
    answer: 0
    explanation: Metaphase I has bivalents on the equatorial plate with microtubules attached to the homologous chromosomes. Metaphase II has individual chromosomes, each of two chromatids, with microtubules attached to the kinetochores of the sister chromatids. Chromosomes carry two chromatids at both stages, and the cell of metaphase I is diploid while that of metaphase II is haploid, the reverse of the last option.
  - id: bio-cellcycle-032
    topic: cellcycle-meiosis-two-significance
    subtopic: Genetic variation
    concept: Chromatids that separate in anaphase II may differ because of crossing over
    category: application
    format: statements
    difficulty: 5
    time: 120
    ncert: false
    battle: false
    tags: [genetic-variation, crossing-over]
    stem: Which one of the following is correct about the two chromatids of a chromosome that separate at anaphase II?
    options:
      - They are the two homologous chromosomes of a bivalent that stayed paired since pachytene
      - They are always genetically identical, because no DNA exchange occurs during meiosis
      - They are non-sister chromatids that were held together at chiasmata
      - They are sister chromatids, which can differ in some segments because of crossing over in prophase I
    answer: 3
    explanation: They are sister chromatids. Crossing over in prophase I exchanges segments between non-sister chromatids of homologous chromosomes, so a chromatid can carry a piece of the homologue and may differ from its sister in that segment.
