    difficulty: 5
    time: 120
    ncert: false
    battle: false
    tags: [counting, ploidy]
    stem: |-
      A flowering plant has 2n = 8. Consider the following statements.
      I. A microspore mother cell at metaphase I shows 4 bivalents.
      II. Each cell of a microspore tetrad has 4 chromosomes.
      III. A generative cell at its metaphase has 4 chromosomes, each with two chromatids.
      IV. The primary endosperm nucleus has 8 chromosomes.
      Which of the statements are correct?
    options:
      - I and II only
      - II, III and IV only
      - I, III and IV only
      - I, II and III only
    answer: 3
    explanation: Four pairs of homologues form 4 bivalents at metaphase I, microspores are haploid (4), and a mitotic metaphase in a haploid generative cell shows 4 chromosomes with two chromatids each. The primary endosperm nucleus is triploid with 12 chromosomes, so IV is wrong.
  - id: bio-cellcycle-494
    topic: cellcycle-mitosis-meiosis-comparison
    subtopic: Anaphase
    concept: Centromeres split in anaphase of mitosis and anaphase II but not in anaphase I
    category: concept
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [anaphase, centromere]
    stem: The centromere of each chromosome splits and sister chromatids separate during
    options:
      - metaphase of mitosis and metaphase II of meiosis
      - anaphase of mitosis and anaphase II of meiosis
      - anaphase of mitosis and anaphase I of meiosis
      - anaphase I and anaphase II of meiosis
    answer: 1
    explanation: In the anaphase of mitosis the centromeres split and chromatids move to opposite poles; anaphase II begins with the simultaneous splitting of the centromere of each chromosome. In anaphase I homologous chromosomes separate while sister chromatids stay joined at their centromeres.
  - id: bio-cellcycle-495
    topic: cellcycle-mitosis-meiosis-comparison
    subtopic: Male gametophyte
    concept: The microspore nucleus divides mitotically into a vegetative and a generative cell
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [pollen, mitosis]
    stem: The nucleus of a microspore divides to form a vegetative cell and a generative cell. This division is
    options:
      - meiotic, and both cells are haploid
      - mitotic, and both cells are haploid
      - mitotic, and both cells are diploid
      - meiotic, and both cells are diploid
    answer: 1
    explanation: The microspore is already haploid, so its nucleus divides by mitosis and both daughter cells stay haploid. The generative cell later divides mitotically to form the two male gametes.
  - id: bio-cellcycle-496
    topic: cellcycle-mitosis-meiosis-comparison
