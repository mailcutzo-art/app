      - Both Statement I and Statement II are correct
      - Both Statement I and Statement II are incorrect
      - Statement I is correct but Statement II is incorrect
      - Statement I is incorrect but Statement II is correct
    answer: 2
    explanation: A primary spermatocyte has the diploid number and completes meiosis I to form two equal haploid secondary spermatocytes. Unequal divisions with polar bodies occur in oogenesis and not in spermatogenesis.
  - id: bio-cellcycle-484
    topic: cellcycle-mitosis-meiosis-comparison
    subtopic: Gametes and sex chromosomes
    concept: Meiosis I separates X and Y so a male meiocyte gives two X-bearing and two Y-bearing sperms
    category: application
    format: direct
    difficulty: 4
    time: 85
    ncert: false
    battle: true
    tags: [sex-chromosomes, meiosis]
    stem: A human primary spermatocyte has the sex chromosomes X and Y. After complete meiosis, the four sperms formed from it carry
    options:
      - four sperms, each with both X and Y
      - one X-bearing sperm, one Y-bearing sperm and two without a sex chromosome
      - two X-bearing and two Y-bearing sperms
      - four X-bearing sperms
    answer: 2
    explanation: X and Y are homologous sex chromosomes that separate in anaphase I, so one secondary spermatocyte gets X and the other Y. Each then divides by meiosis II, giving two X-bearing and two Y-bearing sperms.
  - id: bio-cellcycle-485
    topic: cellcycle-mitosis-meiosis-comparison
    subtopic: Origin of offspring
    concept: Asexual offspring are genetically identical to the parent since no meiosis or gamete fusion is involved
    category: concept
    format: statements
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [asexual-reproduction, clones]
    stem: Which one of the following statements about the origin of offspring is correct?
    options:
      - Gametes of a diploid organism are formed by mitosis of the meiocytes and are diploid.
      - In every sexually reproducing organism, meiosis takes place in the zygote.
      - Offspring formed by asexual reproduction are genetically identical to the parent, as no meiosis or gamete fusion is involved.
      - Offspring formed by sexual reproduction are exact copies of their parents, as gametes are formed by mitosis in diploid organisms.
    answer: 2
    explanation: Asexual offspring are clones of the single parent. Sexual reproduction mixes the genes of two parents through meiosis and fertilisation. In diploid organisms meiocytes form haploid gametes by meiosis, and the zygote divides by mitosis in most organisms.
  - id: bio-cellcycle-486
    topic: cellcycle-mitosis-meiosis-comparison
    subtopic: Metaphase
    concept: Individual chromosomes align at the metaphase plate in mitosis and bivalents in metaphase I
    category: concept
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [metaphase, bivalent]
    stem: Which option states what is arranged on the equatorial plate at metaphase of mitosis and at metaphase I of meiosis, respectively?
    options:
      - Individual chromosomes; bivalents
      - Bivalents; bivalents
      - Bivalents; individual chromosomes
      - Individual chromosomes; individual chromosomes
    answer: 0
    explanation: At mitotic metaphase each chromosome, made of two chromatids, lies singly on the metaphase plate. At metaphase I the bivalents, each a pair of synapsed homologous chromosomes, align on the equatorial plate.
  - id: bio-cellcycle-487
    topic: cellcycle-mitosis-meiosis-comparison
    subtopic: Occurrence
