    explanation: The main plant body of a moss is the haploid gametophyte, which bears the sex organs and forms gametes by mitosis; meiosis would halve the number again. So A is false and R is true. Meiosis occurs in the spore mother cells of the sporophyte.
  - id: bio-cellcycle-497
    topic: cellcycle-mitosis-meiosis-comparison
