    battle: false
    tags: [occurrence, somatic-cells]
    stem: |-
      Assertion (A): Meiosis does not take place in the cells of the epidermis of human skin.
      Reason (R): Epidermal cells are somatic cells that divide by mitosis to replace the cells lost from the skin.
    options:
      - Both A and R are true and R is the correct explanation of A
      - Both A and R are true but R is not the correct explanation of A
      - A is true but R is false
      - A is false but R is true
    answer: 0
    explanation: Meiosis is restricted to the cells that form gametes, while somatic cells such as those of the epidermis divide by mitosis to replace lost cells. So R explains A.
  - id: bio-cellcycle-488
    topic: cellcycle-mitosis-meiosis-comparison
    subtopic: Genetic outcome
    concept: Mitosis of the functional megaspore gives identical nuclei, but meiosis gives genetically different megaspores
    category: application
    format: statement-pair
    difficulty: 5
    time: 120
    ncert: false
    battle: false
    tags: [megaspore, recombination]
    stem: |-
      Statement I: The eight nuclei of a mature embryo sac are genetically identical, since they arise by mitosis from one functional megaspore.
      Statement II: The four megaspores formed from one megaspore mother cell are genetically identical to one another.
    options:
      - Both Statement I and Statement II are correct
      - Both Statement I and Statement II are incorrect
      - Statement I is correct but Statement II is incorrect
      - Statement I is incorrect but Statement II is correct
    answer: 2
    explanation: The eight nuclei descend from a single haploid megaspore by mitosis, which is equational, so they are identical. The four megaspores are products of meiosis, in which crossing over recombines genetic material, so they can differ from one another.
  - id: bio-cellcycle-489
    topic: cellcycle-mitosis-meiosis-comparison
    subtopic: Chromosome number
    concept: A human gamete has 23 chromosomes and the zygote has 46
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [ploidy, human]
    stem: A human gamete mother cell (meiocyte) has 46 chromosomes. How many chromosomes are present in a human gamete and in a human zygote, respectively?
    options:
      - 46 and 23
      - 23 and 46
      - 23 and 23
      - 46 and 92
    answer: 1
    explanation: Meiocytes are diploid and meiosis halves the chromosome number, so a gamete has 23 chromosomes. Fusion of two gametes restores the diploid number, so the zygote has 46.
  - id: bio-cellcycle-490
    topic: cellcycle-mitosis-meiosis-comparison
    subtopic: Counting chromatids
    concept: Chromosome and chromatid numbers at metaphase, metaphase I, metaphase II and in a gamete of a 2n = 6 cell
    category: numerical
    format: multi-statement
    difficulty: 5
    time: 120
    ncert: false
    battle: false
    tags: [chromatids, counting]
    stem: |-
      A diploid cell has 2n = 6. Consider the following statements.
      I. At metaphase of mitosis the cell has 6 chromosomes made of 12 chromatids.
      II. At metaphase I the cell has 3 bivalents containing 12 chromatids in all.
      III. At metaphase II each cell has 3 chromosomes made of 6 chromatids.
      IV. Each gamete has 3 chromosomes made of 6 chromatids.
      Which of the statements are correct?
    options:
      - I and II only
      - I, III and IV only
      - I, II and III only
      - II, III and IV only
    answer: 2
    explanation: 'Mitotic metaphase: 6 chromosomes x 2 = 12 chromatids. Metaphase I: 3 bivalents x 4 = 12 chromatids. Metaphase II: 3 chromosomes x 2 = 6 chromatids. A gamete has 3 chromosomes with one chromatid each, so statement IV is wrong.'
  - id: bio-cellcycle-491
    topic: cellcycle-mitosis-meiosis-comparison
    subtopic: Cleavage
    concept: Cleavage divisions of the zygote are mitotic
    category: factual
    format: direct
    difficulty: 1
