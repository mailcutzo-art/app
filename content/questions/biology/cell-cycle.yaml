    battle: false
    tags: [dna-content, spermatogenesis]
    stem: |-
      Assertion (A): A G1 cell and a secondary spermatocyte of the same man have the same number of chromosomes.
      Reason (R): A secondary spermatocyte has the same amount of DNA as a G1 cell, because each of its chromosomes has two chromatids.
    options:
      - Both A and R are true and R is the correct explanation of A
      - Both A and R are true but R is not the correct explanation of A
      - A is true but R is false
      - A is false but R is true
