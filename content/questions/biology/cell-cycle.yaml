  - id: bio-cellcycle-499
    topic: cellcycle-mitosis-meiosis-comparison
    subtopic: Significance
    concept: Growth of the organism from the zygote is a role of mitosis and not of meiosis
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [mitosis, significance]
    stem: Which of the following is a significance of mitosis but not of meiosis?
    options:
      - Increase in genetic variability of a population
      - Conservation of chromosome number across generations
      - Reduction of the chromosome number from 2n to n
      - Growth of a multicellular organism from the zygote
    answer: 3
    explanation: Mitosis increases the number of cells, so it makes growth from a single zygote possible and replaces lost cells. Conserving the chromosome number, increasing genetic variability and halving the chromosome number are roles of meiosis.
  - id: bio-cellcycle-500
    topic: cellcycle-mitosis-meiosis-comparison
    subtopic: Human spermatogenesis
    concept: Spermatogonia are diploid and divide by mitosis, secondary spermatocytes are haploid and divide by meiosis II
    category: concept
    format: statements
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [spermatogenesis, ploidy]
    stem: Which one of the following statements about human spermatogenesis is correct?
    options:
      - Primary spermatocytes are haploid and divide by meiosis I.
      - Spermatids are diploid and divide by meiosis II to form sperms.
      - Secondary spermatocytes are diploid and divide by mitosis to form spermatids.
      - Spermatogonia are diploid and multiply by mitosis, and secondary spermatocytes are haploid and divide by meiosis II.
    answer: 3
    explanation: Spermatogonia (2n) multiply by mitosis, a diploid primary spermatocyte undergoes meiosis I to form two haploid secondary spermatocytes, and each secondary spermatocyte undergoes meiosis II to form haploid spermatids that become sperms.
