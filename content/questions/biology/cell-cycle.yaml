    stem: The cleavage divisions that convert a zygote into a ball of blastomeres are
    options:
      - meiotic divisions
      - mitotic divisions
      - alternately meiotic and mitotic divisions
      - a single meiotic division followed by many mitotic divisions
    answer: 1
    explanation: NCERT describes cleavage as the mitotic division of the zygote that forms 2, 4, 8 and 16 daughter cells called blastomeres. Mitosis keeps the diploid number, so every blastomere has the same chromosome number as the zygote.
  - id: bio-cellcycle-492
    topic: cellcycle-mitosis-meiosis-comparison
    subtopic: Apomixis and polyembryony
    concept: Nucellar embryos arise by mitosis and are genetically identical to the parent
    category: concept
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [polyembryony, mitosis]
    stem: In some Citrus and mango varieties, nucellar cells protrude into the embryo sac and develop into embryos. These embryos are formed by ___ divisions and are ___ the parent.
    options:
      - meiotic; genetically different from
      - mitotic; genetically identical to
      - meiotic; genetically identical to
      - mitotic; genetically different from
    answer: 1
    explanation: Nucellar cells are diploid cells of the parent, and they form embryos by mitosis without meiosis or fertilisation. The embryos are therefore genetically identical to the parent.
  - id: bio-cellcycle-493
    topic: cellcycle-mitosis-meiosis-comparison
    subtopic: Counting across divisions
    concept: Chromosome numbers in meiotic and mitotic cells of a flowering plant with 2n = 8
    category: numerical
