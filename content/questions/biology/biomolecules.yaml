      R. Pyruvic acid
      S. Glucose
    options:
      - S, P, R, Q
      - S, R, Q, P
      - R, S, P, Q
      - S, R, P, Q
    answer: 3
    explanation: Glucose is broken down to pyruvic acid by glycolysis (S, R). In the mitochondrial matrix pyruvic acid is converted to acetyl CoA, and the acetyl group condenses with oxaloacetic acid to give citric acid (P, Q).
