questions:
  - id: bio-biomol-001
    topic: biomol-nucleic-acids
    subtopic: Nucleotide as monomer
    concept: The monomer of a nucleic acid is the nucleotide
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [nucleotide, monomer]
    stem: The monomer (building block) of a nucleic acid is the
    options:
      - Nucleoside
      - Nitrogenous base
      - Nucleotide
      - Pentose sugar
    answer: 2
    explanation: Nucleic acids are polynucleotides, so the nucleotide is the repeating unit. A nucleoside lacks the phosphate group, and a base or a sugar is only one component of the monomer.
  - id: bio-biomol-002
    topic: biomol-nucleic-acids
    subtopic: Components of a nucleotide
    concept: A nucleotide has a base, a pentose sugar and phosphate, never a hexose
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [nucleotide, components]
    stem: Which of the following is NOT a component of a nucleotide?
    options:
      - A heterocyclic nitrogenous base
      - A pentose sugar
      - A phosphate group
      - A hexose sugar
    answer: 3
    explanation: 'A nucleotide has three chemically distinct parts: a heterocyclic nitrogenous base, a pentose sugar (ribose or 2′-deoxyribose) and a phosphate group. A hexose such as glucose is not part of it.'
  - id: bio-biomol-003
    topic: biomol-nucleic-acids
    subtopic: Purines
    concept: Adenine and guanine are the purines of nucleic acids
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [purine, bases]
    stem: Which pair of nitrogenous bases are purines?
    options:
      - Adenine and guanine
      - Cytosine and thymine
      - Thymine and uracil
      - Guanine and cytosine
    answer: 0
    explanation: NCERT states that adenine and guanine are substituted purines, while cytosine, thymine and uracil are substituted pyrimidines. Every wrong option contains at least one pyrimidine.
  - id: bio-biomol-004
    topic: biomol-nucleic-acids
    subtopic: Pyrimidines
    concept: Cytosine, thymine and uracil are the pyrimidines
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [pyrimidine, bases]
    stem: Which one of the following sets contains only pyrimidines?
    options:
      - Adenine, cytosine and uracil
      - Cytosine, thymine and uracil
      - Guanine, thymine and uracil
      - Adenine, guanine and thymine
    answer: 1
    explanation: Cytosine, thymine and uracil are the substituted pyrimidines of nucleic acids. Each of the other sets includes adenine or guanine, which are purines.
  - id: bio-biomol-005
    topic: biomol-nucleic-acids
    subtopic: Pentose sugars
    concept: DNA contains 2′-deoxyribose as its pentose sugar
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [deoxyribose, dna]
    stem: The pentose sugar found in the nucleotides of DNA is
    options:
      - Ribose
      - Glucose
      - Fructose
      - 2′-deoxyribose
    answer: 3
    explanation: DNA contains 2′-deoxyribose and RNA contains ribose; both are pentoses. Glucose and fructose are hexoses and are not part of nucleic acids.
  - id: bio-biomol-006
    topic: biomol-nucleic-acids
    subtopic: Nitrogenous bases
    concept: Thymine is also called 5-methyl uracil
    category: factual
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [thymine, uracil]
    stem: Another chemical name for thymine is
    options:
      - 5-methyl uracil
      - 5-methyl cytosine
      - 5-methyl adenine
      - 2′-deoxy uracil
    answer: 0
    explanation: NCERT notes that in RNA uracil is found in place of thymine (5-methyl uracil, another name for thymine). Thymine is therefore uracil carrying a methyl group at position 5; it is a pyrimidine, not a methylated purine.
  - id: bio-biomol-007
    topic: biomol-nucleic-acids
    subtopic: Nucleosides and nucleotides
    concept: A base joined to a pentose sugar, without phosphate, is a nucleoside
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [nucleoside]
    stem: A nitrogenous base joined to a pentose sugar, with no phosphate group, is called a
    options:
      - Nucleotide
      - Dinucleotide
      - Nucleoside
      - Polynucleotide
    answer: 2
    explanation: A base linked to a pentose sugar forms a nucleoside, for example adenosine. Adding a phosphate group to the nucleoside gives a nucleotide, and joining nucleotides gives di- and polynucleotides.
  - id: bio-biomol-008
    topic: biomol-nucleic-acids
    subtopic: Nucleosides and nucleotides
    concept: The base and the pentose sugar of a nucleoside are joined by an N-glycosidic linkage
    category: factual
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [n-glycosidic, nucleoside]
    stem: In a nucleoside, the nitrogenous base is linked to the pentose sugar through a
    options:
      - Phosphodiester linkage
      - N-glycosidic linkage
      - Peptide bond
      - Phosphoester linkage
    answer: 1
    explanation: The base and the sugar are joined by an N-glycosidic linkage to give a nucleoside. The phosphoester linkage attaches phosphate to the 5′-OH and the phosphodiester linkage joins two nucleotides; the peptide bond belongs to proteins.
  - id: bio-biomol-009
    topic: biomol-nucleic-acids
    subtopic: Nitrogenous bases
    concept: Adenine, guanine and cytosine occur in both DNA and RNA
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [bases, dna-vs-rna]
    stem: Which three nitrogenous bases are present in both DNA and RNA?
    options:
      - Adenine, guanine and thymine
      - Adenine, cytosine and uracil
      - Adenine, guanine and cytosine
      - Guanine, cytosine and uracil
    answer: 2
    explanation: Adenine, guanine and cytosine occur in both nucleic acids. Thymine is found only in DNA and uracil only in RNA, where it takes the place of thymine.
  - id: bio-biomol-010
    topic: biomol-nucleic-acids
    subtopic: Phosphodiester bond
    concept: A phosphodiester bond joins the 3′ carbon of one sugar to the 5′ carbon of the next
    category: factual
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [phosphodiester, polynucleotide]
    stem: A phosphodiester bond in a polynucleotide chain links which carbons of two adjacent pentose sugars?
    options:
      - The 3′ carbon of one sugar and the 5′ carbon of the next sugar
      - The 5′ carbon of one sugar and the 5′ carbon of the next sugar
      - The 2′ carbon of one sugar and the 5′ carbon of the next sugar
      - The 3′ carbon of one sugar and the 3′ carbon of the next sugar
    answer: 0
    explanation: A phosphate group joins the 3′ carbon of the sugar of one nucleotide to the 5′ carbon of the sugar of the next nucleotide, giving a 3′–5′ phosphodiester linkage. The 2′ carbon carries the extra –OH of RNA and takes no part in it.
  - id: bio-biomol-011
    topic: biomol-nucleic-acids
    subtopic: Phosphodiester bond
    concept: A chain of n nucleotides has n − 1 phosphodiester bonds
    category: numerical
    format: direct
    difficulty: 3
    time: 50
    ncert: false
    battle: true
    tags: [phosphodiester, counting]
    stem: How many phosphodiester bonds does a single polynucleotide chain of 25 nucleotides contain?
    options:
      - '25'
      - '48'
      - '50'
      - '24'
    answer: 3
    explanation: 'Joining n nucleotides end to end needs n − 1 phosphodiester bonds, so 25 nucleotides have 24. The count is not n, and it is not doubled: each phosphodiester bond contains two ester bonds but is counted once.'
  - id: bio-biomol-012
    topic: biomol-nucleic-acids
    subtopic: Phosphodiester bond
    concept: Count phosphodiester bonds in both strands of a double-stranded fragment
    category: numerical
    format: direct
    difficulty: 4
    time: 85
    ncert: false
    battle: true
    tags: [phosphodiester, counting, trap]
    stem: A double-stranded DNA fragment has 40 nucleotides in all, counting both strands together. How many phosphodiester bonds does it contain?
    options:
      - '40'
      - '38'
      - '39'
      - '19'
    answer: 1
    explanation: Each strand has 20 nucleotides and so 19 phosphodiester bonds; two strands give 38. The hydrogen bonds between the strands are not phosphodiester bonds, and 39 is the figure for a single strand of 40 nucleotides.
  - id: bio-biomol-013
    topic: biomol-nucleic-acids
    subtopic: Base pairing
    concept: Guanine and cytosine are joined by three hydrogen bonds
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [base-pairing, hydrogen-bond]
    stem: How many hydrogen bonds join guanine to cytosine in a DNA double helix?
    options:
      - One
      - Two
      - Three
      - Four
    answer: 2
    explanation: Guanine pairs with cytosine through three hydrogen bonds, whereas adenine pairs with thymine through two.
  - id: bio-biomol-014
    topic: biomol-nucleic-acids
    subtopic: Chargaff's rules
    concept: In double-stranded DNA A = T and G = C
    category: numerical
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [chargaff, base-composition]
    stem: In a double-stranded DNA, adenine makes up 30% of the bases. What percentage of the bases is cytosine?
    options:
      - 10%
      - 20%
      - 30%
      - 40%
    answer: 1
    explanation: A = T = 30%, so A + T = 60% and the remaining 40% is G + C. Since G = C, cytosine is 20%. Choosing 30% confuses C with A, and 40% is the sum G + C.
  - id: bio-biomol-015
    topic: biomol-nucleic-acids
    subtopic: Base pairing
    concept: Count hydrogen bonds from base percentages in a duplex
    category: numerical
    format: direct
    difficulty: 4
    time: 85
    ncert: false
    battle: false
    tags: [hydrogen-bond, chargaff, numerical]
    stem: A double-stranded DNA has 2000 nucleotides in all (both strands together), and 20% of its bases are guanine. How many hydrogen bonds hold its two strands together?
    options:
      - '1800'
      - '2200'
      - '2400'
      - '2600'
    answer: 2
    explanation: 'G = C = 400 and A = T = (2000 − 800) ÷ 2 = 600. There are 600 A–T pairs (2 bonds each) and 400 G–C pairs (3 bonds each): 1200 + 1200 = 2400. Swapping the bond numbers gives 2600, and treating 20% as the share of base pairs gives 2200.'
  - id: bio-biomol-016
    topic: biomol-nucleic-acids
    subtopic: Polarity of strands
    concept: The two strands of DNA are antiparallel
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [antiparallel, polarity]
    stem: The two strands of a DNA double helix have
    options:
      - Antiparallel polarity, 5′→3′ in one strand and 3′→5′ in the other
      - Parallel polarity, both strands 5′→3′
      - Parallel polarity, both strands 3′→5′
      - No fixed polarity
    answer: 0
    explanation: 'NCERT states that the two chains have anti-parallel polarity: if one chain runs 5′→3′, the other runs 3′→5′. Parallel strands or strands without fixed polarity are not found in the helix.'
  - id: bio-biomol-017
    topic: biomol-nucleic-acids
    subtopic: Helix dimensions
    concept: Distance between adjacent base pairs is pitch divided by base pairs per turn
    category: numerical
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [helix, pitch]
    stem: A DNA helix has a pitch of 3.4 nm with about 10 base pairs per turn. The distance between two adjacent base pairs is about
    options:
      - 34 nm
      - 3.4 nm
      - 0.034 nm
      - 0.34 nm
    answer: 3
    explanation: Distance per base pair = pitch ÷ base pairs per turn = 3.4 nm ÷ 10 = 0.34 nm. The 3.4 nm figure is the length of one full turn, not the gap between two base pairs.
  - id: bio-biomol-018
    topic: biomol-nucleic-acids
    subtopic: Helix dimensions
    concept: Convert helix length to base pairs and then to nucleotides of both strands
    category: numerical
    format: direct
    difficulty: 3
    time: 50
    ncert: false
    battle: true
    tags: [helix, nucleotide-count]
    stem: A double-stranded DNA fragment is 17 nm long. Taking 0.34 nm between adjacent base pairs, how many nucleotides does it contain in all (both strands)?
    options:
      - '50'
      - '100'
      - '170'
      - '500'
    answer: 1
    explanation: Base pairs = 17 ÷ 0.34 = 50. Each base pair contains two nucleotides, one from each strand, so the fragment has 100 nucleotides. The figure 50 counts base pairs, not nucleotides.
  - id: bio-biomol-019
    topic: biomol-nucleic-acids
    subtopic: Base pairing
    concept: Predict the complementary strand, keeping antiparallel orientation
    category: application
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [complementary, antiparallel]
    stem: If one strand of a DNA segment reads 5′-ATGCCGTA-3′, the complementary strand reads
    options:
      - 5′-TACGGCAT-3′
      - 3′-ATGCCGTA-5′
      - 3′-TACGGCAT-5′
      - 3′-UACGGCAU-5′
    answer: 2
    explanation: The strands are complementary (A–T, G–C) and antiparallel, so the partner of 5′-ATGCCGTA-3′ is 3′-TACGGCAT-5′. Writing the same bases with the wrong polarity, or with uracil, does not describe a DNA partner strand.
  - id: bio-biomol-020
    topic: biomol-nucleic-acids
    subtopic: Phosphodiester bond
    concept: A phosphodiester bond has an ester bond on either side of the phosphate
    category: concept
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [phosphodiester, ester-bond]
    stem: The linkage between two nucleotides is called a phosphodiester bond because the phosphate group forms
    options:
      - A peptide bond with an amino acid on each of its two sides
      - An N-glycosidic bond with a nitrogenous base on each of its two sides
      - A hydrogen bond with a nitrogenous base on each of its two sides
      - An ester bond with a hydroxyl group of a sugar on each of its two sides
    answer: 3
    explanation: The phosphate is esterified to the 3′-OH of one sugar and to the 5′-OH of the next. Because there is an ester bond on either side of the phosphate, the linkage is called a phosphodiester bond.
  - id: bio-biomol-021
    topic: biomol-nucleic-acids
    subtopic: Pentose sugars
    concept: RNA ribose has an extra –OH at the 2′ position
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [ribose, rna]
    stem: Compared with deoxyribose, the ribose sugar of RNA carries an additional –OH group at the
    options:
      - 1′ carbon
      - 2′ carbon
      - 3′ carbon
      - 5′ carbon
    answer: 1
    explanation: NCERT states that every RNA nucleotide has an additional –OH group at the 2′ position of ribose; 2′-deoxyribose has only hydrogen there. The 3′ carbon bears –OH in both sugars and is used in the phosphodiester linkage.
  - id: bio-biomol-022
    topic: biomol-nucleic-acids
    subtopic: Nucleosides and nucleotides
    concept: Adenosine and deoxyadenosine differ in their pentose sugar
    category: concept
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [nucleoside, ribose]
    stem: Adenosine and deoxyadenosine differ in
    options:
      - The pentose sugar attached to adenine
      - The nitrogenous base present
      - The number of phosphate groups
      - The type of linkage between base and sugar
    answer: 0
    explanation: Both are nucleosides of adenine joined by an N-glycosidic linkage, and neither carries a phosphate. Adenosine has ribose, whereas deoxyadenosine has 2′-deoxyribose.
  - id: bio-biomol-023
    topic: biomol-nucleic-acids
    subtopic: Double helix
    concept: In the double helix the bases lie inside and the sugar–phosphate backbone outside
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [double-helix, backbone]
    stem: In the double helix of DNA, the nitrogenous bases of the two strands lie
    options:
      - Outside the helix, with the sugar–phosphate backbone inside
      - Alternately inside and outside along the helix
      - Outside one strand but inside the other strand
      - Inside the helix, with the sugar–phosphate backbone on the outside
    answer: 3
    explanation: NCERT describes the backbone of each strand as sugar–phosphate, with the bases projecting inside the helix where they pair through hydrogen bonds.
  - id: bio-biomol-024
    topic: biomol-nucleic-acids
    subtopic: Nucleic acids as macromolecules
    concept: Nucleic acids are polynucleotides found in the acid-insoluble fraction
    category: concept
    format: statements
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [polynucleotide, macromolecule]
    stem: Which one of the following statements about nucleic acids is correct?
    options:
      - Nucleic acids are polymers of nucleosides joined by peptide bonds.
      - Nucleic acids are polymers of nucleotides and are found in the acid-insoluble fraction of a tissue.
      - Nucleic acids are polymers of nucleotides found mainly in the acid-soluble pool.
      - Nucleic acids are polymers of pentose sugars joined by glycosidic bonds.
    answer: 1
    explanation: NCERT places nucleic acids, which are polynucleotides, among the macromolecules of the acid-insoluble fraction of a tissue. Their units are nucleotides joined by phosphodiester bonds; peptide bonds join amino acids and glycosidic bonds join monosaccharides.
  - id: bio-biomol-025
    topic: biomol-nucleic-acids
    subtopic: DNA versus RNA
    concept: The extra 2′-OH belongs to RNA, not DNA
    category: concept
    format: statements
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [dna-vs-rna, ribose]
    stem: Which of the following statements about DNA and RNA is NOT correct?
    options:
      - Adenine, guanine and cytosine occur in both DNA and RNA.
      - Uracil takes the place of thymine in RNA.
      - The sugar of DNA is 2′-deoxyribose and the sugar of RNA is ribose.
      - Every nucleotide residue of DNA carries an additional –OH group at the 2′ position of its sugar.
    answer: 3
    explanation: The extra –OH group at the 2′ position is a feature of RNA (ribose), not of DNA, whose 2′-deoxyribose lacks it. The other three statements are NCERT facts.
  - id: bio-biomol-026
    topic: biomol-nucleic-acids
    subtopic: Nucleosides and nucleotides
    concept: Nucleoside = base + sugar; nucleotide = nucleoside + phosphate on the 5′-OH
    category: concept
    format: statements
    difficulty: 4
    time: 85
    ncert: true
    battle: false
    tags: [nucleoside, nucleotide, phosphoester]
    stem: Which one of the following statements about nucleosides and nucleotides is correct?
    options:
      - A nucleotide is formed when a phosphate group is linked to the 5′-OH of a nucleoside through a phosphoester linkage.
      - A nucleoside is formed when a phosphate group is linked to a nucleotide through an N-glycosidic linkage.
      - A nucleoside consists of a pentose sugar and a phosphate group but no nitrogenous base.
      - A nucleotide is formed when a base is linked to the 3′-OH of a pentose sugar through a phosphodiester linkage.
    answer: 0
    explanation: Base + sugar (N-glycosidic linkage) gives a nucleoside, and a phosphate linked to the 5′-OH of the nucleoside by a phosphoester linkage gives a nucleotide. The other statements reverse these relationships or name the wrong linkage.
  - id: bio-biomol-027
    topic: biomol-nucleic-acids
    subtopic: Polynucleotide chain
    concept: A polynucleotide has a free 5′ phosphate end and a free 3′-OH end
    category: concept
    format: statements
    difficulty: 4
    time: 85
    ncert: true
    battle: false
    tags: [polynucleotide, 5-prime-3-prime]
    stem: Which one of the following statements about a single polynucleotide chain is correct?
    options:
      - Both ends of the chain carry a free phosphate group.
      - The nitrogenous bases form the backbone and the sugar–phosphate units project from it.
      - One end has a free phosphate group (the 5′ end) and the other end has a free 3′-OH group on the sugar (the 3′ end).
      - Each phosphodiester bond joins the 5′ carbons of two adjacent sugars.
    answer: 2
    explanation: The sugar–phosphate backbone ends with a free phosphate at the 5′ end and a free 3′-OH on the sugar at the 3′ end, and the bases project from the backbone. Phosphodiester bonds join the 3′ carbon of one sugar to the 5′ carbon of the next.
  - id: bio-biomol-028
    topic: biomol-nucleic-acids
    subtopic: Nitrogenous bases
    concept: Distribution of adenine, thymine, uracil and cytosine between DNA and RNA
    category: concept
    format: multi-statement
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [bases, dna-vs-rna]
    stem: |-
      Consider the following statements about the nitrogenous bases of nucleic acids.
      I. Adenine is present in both DNA and RNA.
      II. Thymine is present in RNA but absent from DNA.
      III. Uracil is present in RNA in place of thymine.
      IV. Cytosine is present only in DNA.
      Which of the statements are correct?
    options:
      - I and II only
      - II and IV only
      - I and III only
      - I, III and IV only
    answer: 2
    explanation: I and III are correct. Thymine is a DNA base, so II is wrong, and cytosine occurs in both DNA and RNA, so IV is wrong.
  - id: bio-biomol-029
    topic: biomol-nucleic-acids
    subtopic: Nucleosides and nucleotides
    concept: Identify the sugar, base and phosphate content of named nucleosides
    category: concept
    format: multi-statement
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [nucleoside, adenosine]
    stem: |-
      Consider the following statements about nucleosides.
      I. Adenosine contains a pentose sugar.
      II. Deoxycytidine contains 2′-deoxyribose.
      III. Uridine contains thymine.
      IV. Guanosine contains a phosphate group.
      Which of the statements are correct?
    options:
      - I and II only
      - II and III only
      - I, II and IV only
      - III and IV only
    answer: 0
    explanation: I and II are correct. Uridine is the nucleoside of uracil, not thymine, so III is wrong, and a nucleoside has no phosphate group, since adding one gives a nucleotide, so IV is wrong.
  - id: bio-biomol-030
    topic: biomol-nucleic-acids
    subtopic: Double helix
    concept: 'Features of the DNA double helix: backbone, polarity, pairing and handedness'
    category: concept
    format: multi-statement
    difficulty: 4
    time: 85
    ncert: true
    battle: false
    tags: [double-helix, polarity]
    stem: |-
      Consider the following statements about the DNA double helix.
      I. The sugar–phosphate backbone is on the outside and the bases project inwards.
      II. The 5′ end of one strand lies opposite the 5′ end of the other strand.
      III. Adenine pairs with thymine by two hydrogen bonds and guanine pairs with cytosine by three.
      IV. The strands are coiled in a right-handed fashion, with about 10 base pairs per turn.
      Which of the statements are correct?
    options:
      - I and III only
      - II and III only
      - I, II and IV only
      - I, III and IV only
    answer: 3
    explanation: The strands are antiparallel, so the 5′ end of one strand lies opposite the 3′ end of the other, and II is wrong. I, III and IV are NCERT features of the double helix.
  - id: bio-biomol-031
    topic: biomol-nucleic-acids
    subtopic: Linkages in biomolecules
    concept: Compare glycosidic, N-glycosidic, peptide and phosphodiester linkages
    category: concept
    format: multi-statement
    difficulty: 4
    time: 85
    ncert: true
    battle: false
    tags: [linkages, peptide-bond, glycosidic]
    stem: |-
      Consider the following statements about the linkages in biomolecules.
      I. A peptide bond forms between the –COOH of one amino acid and the –NH_2 of the next, with loss of water.
      II. A phosphodiester bond has an ester bond on either side of the phosphate group.
      III. Adjacent monosaccharides in a polysaccharide are joined by an N-glycosidic bond.
      IV. In a nucleoside, the base is joined to the sugar by a phosphoester bond.
      Which of the statements are correct?
    options:
      - I, II and III only
      - I and II only
      - II, III and IV only
      - I and IV only
    answer: 1
    explanation: I and II are correct. Monosaccharides are joined by a glycosidic bond, and the N-glycosidic linkage joins a base to a sugar, so III is wrong. The base–sugar bond is N-glycosidic, and the phosphoester linkage attaches phosphate to the 5′-OH, so IV is wrong.
  - id: bio-biomol-032
    topic: biomol-nucleic-acids
    subtopic: Chargaff's rules
    concept: Derive base percentages and purine content of a duplex with 30% adenine
    category: numerical
    format: multi-statement
    difficulty: 5
    time: 120
    ncert: false
    battle: false
    tags: [chargaff, base-composition, trap]
    stem: |-
      A double-stranded DNA contains 30% adenine. Consider the following statements about it.
      I. It contains 30% thymine.
      II. It contains 20% guanine.
      III. Purines make up 50% of its bases.
      IV. The ratio (A + T) / (G + C) is equal to one.
      Which of the statements are correct?
    options:
      - I and II only
      - I, III and IV only
      - II, III and IV only
      - I, II and III only
    answer: 3
