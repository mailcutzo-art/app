      Arrange the following compounds in the order in which they are formed during glycolysis.
      P. Fructose-1,6-bisphosphate
      Q. Glucose-6-phosphate
      R. Phosphoenolpyruvate
      S. 3-phosphoglyceric acid
    options:
      - P, Q, S, R
      - Q, P, S, R
      - Q, P, R, S
      - Q, S, P, R
    answer: 1
    explanation: 'Glycolysis runs: glucose to glucose-6-phosphate (Q), then fructose-6-phosphate, fructose-1,6-bisphosphate (P), triose phosphate, 1,3-bisphosphoglyceric acid, 3-phosphoglyceric acid (S), 2-phosphoglycerate, phosphoenolpyruvate (R) and finally pyruvic acid.'
