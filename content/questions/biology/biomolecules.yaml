    stem: In the figure of a DNA segment, which option correctly identifies bases Q, S and T?
    options:
      - 'Q: thymine; S: guanine; T: thymine'
      - 'Q: thymine; S: guanine; T: cytosine'
      - 'Q: uracil; S: guanine; T: thymine'
      - 'Q: thymine; S: adenine; T: thymine'
    answer: 0
    explanation: Adenine (P) pairs with thymine by two hydrogen bonds, so Q is thymine. Cytosine (R) pairs with guanine by three bonds, so S is guanine. T is joined to adenine (U) by two bonds, so T is thymine. Uracil does not occur in DNA.
