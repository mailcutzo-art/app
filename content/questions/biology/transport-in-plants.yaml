      - The mist enters the leaves through the stomata and raises turgor directly
      - Root pressure rises because the air is humid
    answer: 1
    explanation: Humid air reduces the difference in water vapour concentration between the leaf and the air, and still air does not carry the vapour away. Both effects lower transpiration, so the leaves lose less water and wilt less.
