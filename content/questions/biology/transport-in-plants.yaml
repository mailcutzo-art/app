questions:
  - id: bio-transport-001
    topic: transport-phloem-transport
    subtopic: Direction of phloem flow
    concept: Unidirectional xylem flow versus bi-directional phloem flow
    category: concept
    format: multi-statement
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [bidirectional, xylem-vs-phloem]
    stem: |-
      Consider the following statements about the movement of materials in vascular tissues.
      I. Water in the xylem can move both upward and downward, depending on the source and the sink.
      II. Food in the phloem can move upward or downward.
      III. Phloem sap is mainly water and sucrose.
      IV. The direction of food movement in the phloem depends on where the sugar source and the sink lie.
      Which of the statements are correct?
    options:
      - I, II and III only
      - I and IV only
      - II, III and IV only
      - I, III and IV only
    answer: 2
    explanation: Statements II, III and IV are NCERT facts. Statement I is wrong because the movement in the xylem is always unidirectional, i.e. upward.
  - id: bio-transport-002
    topic: transport-phloem-transport
    subtopic: Water potential in phloem
    concept: Pressure potential of a sieve tube at equilibrium with the xylem, from psi_w = psi_s + psi_p
    category: numerical
    format: direct
    difficulty: 5
    time: 120
    ncert: false
    battle: false
    formula: ψ_w = ψ_s + ψ_p
    tags: [water-potential, numerical]
    stem: At a source, the sieve tube has a solute potential (ψ_s) of −1.8 MPa. Water enters from the adjacent xylem (ψ_w = −0.4 MPa) until the water potential of the sieve tube equals that of the xylem. What pressure potential (ψ_p) does the sieve tube then reach?
    options:
      - +2.2 MPa
      - −1.4 MPa
      - +1.8 MPa
      - +1.4 MPa
    answer: 3
    explanation: At equilibrium ψ_w of the sieve tube = −0.4 MPa. From ψ_w = ψ_s + ψ_p, ψ_p = ψ_w − ψ_s = −0.4 − (−1.8) = +1.4 MPa. Adding the magnitudes gives the trap +2.2 MPa, and −1.4 MPa is a sign slip.
  - id: bio-transport-003
    topic: transport-phloem-transport
    subtopic: Unloading at the sink
    concept: Removal of sugar at the sink lowers osmotic pressure and water leaves the phloem
    category: concept
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [unloading, osmotic-pressure]
    stem: At the sink, removal of sugars from the phloem sap makes the osmotic pressure of the sap
    options:
      - increase, so that water moves into the phloem
      - remain unchanged, since only water is exchanged
      - decrease, so that water moves into the phloem from the xylem
      - decrease, so that water moves out of the phloem
    answer: 3
    explanation: As sugars are removed at the sink, the solute concentration and so the osmotic pressure of the phloem sap decrease and water moves out of the phloem. Water entering the phloem is the event at the source, after loading.
  - id: bio-transport-004
    topic: transport-phloem-transport
    subtopic: Pressure flow hypothesis
    concept: Fill the blanks of a flowchart of the pressure flow hypothesis
    category: concept
    format: diagram
    difficulty: 4
    time: 85
    ncert: true
    battle: false
    diagram: 'Flowchart of seven boxes joined by downward arrows. Box 1: ''Glucose made at the source''. Box 2: ''Converted into P''. Box 3: ''Moved into the companion cells and sieve tube cells by Q''. Box 4: ''Phloem becomes R relative to the adjacent xylem''. Box 5: ''Water enters the phloem from the xylem by S''. Box 6: ''Pressure builds up and the sap moves to the sink''. Box 7: ''Sugar is removed at the sink; the osmotic pressure T and water moves U the phloem''.'
    tags: [pressure-flow, flowchart]
    stem: Which option correctly fills the blanks P to U in the flowchart?
    options:
      - 'P: sucrose; Q: active transport; R: hypertonic; S: osmosis; T: decreases; U: out of'
      - 'P: starch; Q: active transport; R: hypertonic; S: osmosis; T: decreases; U: out of'
      - 'P: sucrose; Q: diffusion; R: hypotonic; S: osmosis; T: increases; U: into'
      - 'P: sucrose; Q: active transport; R: hypertonic; S: active transport; T: decreases; U: out of'
    answer: 0
    explanation: Glucose is converted to sucrose (P), which is loaded by active transport (Q). The phloem becomes hypertonic (R) and water enters by osmosis (S). At the sink the osmotic pressure decreases (T) and water moves out of the phloem (U).
  - id: bio-transport-005
    topic: transport-phloem-transport
    subtopic: Direction of phloem flow
    concept: Movement in the phloem can be upward or downward
    category: concept
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [bidirectional, phloem]
    stem: In which direction can food move through the phloem of a plant?
    options:
      - Upward or downward, depending on where the source and the sink are
      - Only upward, as water does in the xylem
      - Only downward, from the leaves to the roots
      - Only horizontally, from the pith towards the cortex
    answer: 0
    explanation: Because the source-sink relationship is variable, the direction of movement in the phloem can be upward or downward, i.e. bi-directional. In the xylem the movement is always unidirectional, i.e. upward.
  - id: bio-transport-006
    topic: transport-phloem-transport
    subtopic: Loading and unloading
    concept: Active transport is needed for both loading at the source and unloading at the sink
    category: concept
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [active-transport, loading, unloading]
    stem: In the translocation of sugars, active transport is needed for
    options:
      - loading at the source only
      - unloading at the sink only
      - both loading at the source and unloading at the sink
      - neither step, since both are done by osmosis
    answer: 2
    explanation: NCERT says sucrose is loaded into the sieve tubes by active transport, and 'again active transport is needed' to move sucrose out of the phloem sap into the cells that use it. Osmosis moves only the water.
  - id: bio-transport-007
    topic: transport-phloem-transport
    subtopic: Mass flow
    concept: Pressure of xylem sap is negative and that of phloem sap is positive in bulk flow
    category: concept
    format: graph
    difficulty: 4
    time: 85
    ncert: false
    battle: false
    diagram: Bar graph with two vertical bars standing on a horizontal baseline drawn at y = 0. The y-axis is labelled 'Pressure potential of the sap (MPa)' and runs from −1.5 to +1.5. The left bar, labelled 'Xylem sap of a transpiring tree', extends downward from the baseline to −1.0. The right bar, labelled 'Phloem sap of a source leaf', extends upward from the baseline to +1.0.
    tags: [mass-flow, xylem-vs-phloem, graph]
    stem: Which conclusion about the bulk flow of the two saps agrees with the graph and with NCERT?
    options:
      - Xylem sap is pulled under a negative pressure created by transpiration, whereas phloem sap is pushed under a positive pressure built up by osmosis.
      - Both saps flow under a positive pressure, as water does in a garden hose.
      - Both saps flow under a negative pressure, as in suction through a straw.
      - Xylem sap flows under a positive pressure from the roots, whereas phloem sap flows under a negative pressure from transpiration.
    answer: 0
    explanation: NCERT says bulk flow can occur through a positive hydrostatic pressure gradient (garden hose) or a negative one (suction through a straw). The transpiration pull suctions the xylem sap, while in the phloem the osmotic pressure builds up at the source and pushes the sap to areas of lower pressure.
  - id: bio-transport-008
    topic: transport-phloem-transport
    subtopic: Source and sink
    concept: The same plant part can be a sink at one time and a source at another
    category: concept
    format: statements
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [source-sink]
    stem: Which one of the following statements about source and sink is correct?
    options:
      - A source is the part of the plant that needs or stores the food.
      - Only leaves can ever be sources and only roots can ever be sinks.
      - A sink is the part of the plant that synthesises the food.
      - The same plant part can act as a sink at one time of the year and as a source at another.
    answer: 3
    explanation: NCERT says the source and sink may be reversed depending on the season or the plant's needs; for example, roots storing sugar become a source in early spring when buds are a sink. A source makes food and a sink needs or stores it.
  - id: bio-transport-009
    topic: transport-phloem-transport
    subtopic: Mass flow
    concept: Mass flow is independent of solute concentration
    category: concept
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [mass-flow]
    stem: Which one of the following is true of mass (bulk) flow?
    options:
      - It moves each solute only down its own concentration gradient.
      - It is independent of the concentration of the solutes in the moving fluid.
      - It moves substances from a region of lower pressure to one of higher pressure.
      - It is effective only over very short distances.
    answer: 1
    explanation: NCERT describes mass flow as movement in bulk due to a pressure difference, unidirectional from higher to lower pressure and independent of solute concentration. Movement of each solute down its own gradient describes diffusion, which suits only short distances.
  - id: bio-transport-010
    topic: transport-phloem-transport
    subtopic: Loading at the source
    concept: Sucrose enters by active transport; water enters by osmosis
    category: concept
    format: statement-pair
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [loading, osmosis, active-transport]
    stem: |-
      Statement I: Water enters the sieve tubes at the source by active transport.
      Statement II: Sucrose is moved into the companion cells and then into the sieve tube cells by active transport.
    options:
      - Both Statement I and Statement II are correct
      - Both Statement I and Statement II are incorrect
      - Statement I is correct but Statement II is incorrect
      - Statement I is incorrect but Statement II is correct
    answer: 3
    explanation: Sucrose is loaded into the companion cells and sieve tube cells by active transport, which makes the phloem hypertonic. Water then enters from the adjacent xylem by osmosis, so statement I is incorrect and statement II is correct.
  - id: bio-transport-011
    topic: transport-phloem-transport
    subtopic: Phloem sap
    concept: Sucrose is the main sugar translocated through the phloem
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [phloem-sap, sucrose]
    stem: Which carbohydrate is the primary form in which food is translocated through the phloem?
    options:
      - Glucose
      - Sucrose
      - Starch
      - Cellulose
    answer: 1
    explanation: NCERT states that food, primarily sucrose, is transported by the phloem from a source to a sink. Starch and cellulose are insoluble storage or structural carbohydrates, and glucose is converted to sucrose before it is loaded.
  - id: bio-transport-012
    topic: transport-phloem-transport
    subtopic: Pressure flow hypothesis
    concept: Match each step of phloem transport with the process involved
    category: concept
    format: match
    difficulty: 4
    time: 85
    ncert: true
    battle: false
    tags: [match, pressure-flow]
    stem: |-
      Match the events of phloem transport in List I with the process involved in List II.
      List I
      P. Entry of water into the phloem at the source
      Q. Entry of sucrose into the companion cells and sieve tube cells
      R. Movement of sap along the sieve tubes
      S. Removal of sucrose from the sieve tubes at the sink
      List II
      1. Active transport into the cells that use the sugar
      2. Bulk flow along a pressure gradient
      3. Osmosis from the adjacent xylem
      4. Active transport that makes the phloem hypertonic
    options:
      - P-4, Q-3, R-2, S-1
      - P-3, Q-4, R-2, S-1
      - P-3, Q-4, R-1, S-2
      - P-3, Q-2, R-4, S-1
    answer: 1
    explanation: Water enters the phloem by osmosis (3). Sucrose is loaded by active transport, which makes the phloem hypertonic (4). The sap then moves by bulk flow along a pressure gradient (2), and sucrose is removed at the sink by active transport (1).
  - id: bio-transport-013
    topic: transport-phloem-transport
    subtopic: Pressure flow hypothesis
    concept: Sucrose is loaded by active transport, not by osmosis
    category: concept
    format: statements
    difficulty: 4
    time: 85
    ncert: true
    battle: false
    tags: [pressure-flow, active-transport, osmosis]
    stem: Which one of the following statements about the pressure flow hypothesis is NOT correct?
    options:
      - Sucrose is moved by osmosis into the companion cells at the source.
      - Glucose prepared at the source is converted into sucrose before loading.
      - As sugars are removed at the sink, water moves out of the phloem.
      - As osmotic pressure builds up, the sap moves to areas of lower pressure.
    answer: 0
    explanation: Sucrose enters the companion cells and sieve tube cells by active transport, not by osmosis; osmosis is how water enters the phloem. The other three statements are steps of the NCERT account.
  - id: bio-transport-014
    topic: transport-phloem-transport
    subtopic: Loading at the source
    concept: Loading of sucrose makes the phloem hypertonic
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [loading, hypertonic]
    stem: The loading of sucrose into the phloem at the source produces which condition in the phloem?
    options:
      - Hypertonic
      - Hypotonic
      - Isotonic
      - Flaccid
    answer: 0
    explanation: Moving sucrose into the sieve tubes raises the solute concentration, so the phloem becomes hypertonic to the adjacent xylem and water is drawn in by osmosis. Hypotonic and isotonic would not pull water in, and flaccid describes a cell, not a solution.
  - id: bio-transport-015
    topic: transport-phloem-transport
    subtopic: Pressure flow hypothesis
    concept: Water entry at the source and bi-directional flow are unrelated facts
    category: concept
    format: assertion-reason
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [pressure-flow, bidirectional]
    stem: |-
      Assertion (A): At the source, water moves from the adjacent xylem into the phloem.
      Reason (R): The movement of food in the phloem can be upward or downward.
    options:
      - Both A and R are true and R is the correct explanation of A
      - Both A and R are true but R is not the correct explanation of A
      - A is true but R is false
      - A is false but R is true
    answer: 1
    explanation: Both are NCERT facts. Water enters the phloem because loading of sucrose makes it hypertonic, not because the flow can run in either direction, so R does not explain A.
  - id: bio-transport-016
    topic: transport-phloem-transport
    subtopic: Mass flow
    concept: A garden hose is the NCERT example of bulk flow by positive hydrostatic pressure
    category: factual
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [mass-flow, hydrostatic-pressure]
    stem: NCERT gives a garden hose as an example of bulk flow driven by a
    options:
      - negative hydrostatic pressure gradient
      - concentration gradient of a solute
      - positive hydrostatic pressure gradient
      - gradient of carrier protein density
    answer: 2
    explanation: NCERT says bulk flow can be achieved by a positive hydrostatic pressure gradient, as in a garden hose, or by a negative hydrostatic pressure gradient, as in suction through a straw. Phloem sap moves under the first kind of gradient, built by osmotic pressure.
  - id: bio-transport-017
    topic: transport-phloem-transport
    subtopic: Seasonal source-sink reversal
    concept: Interpret the reversal of flow in a tree between early spring and summer
    category: application
    format: diagram
    difficulty: 4
    time: 85
    ncert: true
    battle: false
    diagram: 'Two panels showing the same tree. Panel I is headed EARLY SPRING: a leafless trunk with swollen buds on the branches (labelled B) and thick roots below ground (labelled R); a bold arrow runs from R upward along the trunk to B. Panel II is headed SUMMER: the tree bears full green leaves (labelled L) with the same roots R; a bold arrow runs from L downward along the trunk to R.'
    tags: [source-sink, seasonal, diagram]
    stem: Which interpretation of the two panels agrees with NCERT?
    options:
      - In both panels the sugar moves in the same sense, from the shoot to the roots, because phloem flow is only downward.
      - In Panel I the roots are the source and the buds the sink; in Panel II the leaves are the source and the roots the sink.
      - In Panel I the movement is through the xylem, and in Panel II through the phloem.
      - In Panel I the roots are the sink and the buds the source; in Panel II the roots are the source.
    answer: 1
    explanation: NCERT explains that sugar stored in roots is mobilised in early spring, when the buds are a sink, and that source and sink can be reversed with the season. In summer the green leaves are the source, and the sugar moves downward to the roots that store it. This shows that phloem flow can be upward or downward.
  - id: bio-transport-018
    topic: transport-phloem-transport
    subtopic: Loading and unloading
    concept: Path of sugar from the site of photosynthesis to the sink cell
    category: concept
    format: ordering
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [ordering, loading]
    stem: |-
      Arrange the cells through which the sugar passes, from its synthesis to its use.
      P. Companion cell
      Q. Photosynthetic cell of the leaf
      R. Cell of the sink
      S. Sieve tube cell
    options:
      - Q, P, S, R
      - Q, S, P, R
      - P, Q, S, R
      - Q, P, R, S
    answer: 0
    explanation: Sugar is made in a photosynthetic cell of the leaf (Q), moved into the companion cell (P) and then into the sieve tube cell (S) by active transport. It travels in the sieve tubes and is finally unloaded into the cell of the sink (R).
  - id: bio-transport-019
    topic: transport-phloem-transport
    subtopic: Source and sink
    concept: The sink is the part of the plant that needs or stores the food
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [source-sink]
    stem: The part of a plant that needs or stores the food brought through the phloem is called the
    options:
      - Source
      - Sieve plate
      - Companion cell
      - Sink
    answer: 3
    explanation: NCERT defines the sink as the part of the plant that needs or stores the food, whereas the source is the part that synthesises it, usually the leaf. A sieve plate and a companion cell are parts of the phloem itself, not regions of supply or demand.
  - id: bio-transport-020
    topic: transport-phloem-transport
    subtopic: Sieve tubes and companion cells
    concept: The nucleus of the companion cell controls the sieve tube element
    category: application
    format: diagram
    difficulty: 4
    time: 85
    ncert: true
    battle: false
    diagram: Longitudinal view of part of a phloem. A vertical tube is made of two stacked sieve tube elements. Between them lies a cross wall perforated by many pores, labelled R. Each sieve tube element has a thin layer of cytoplasm lining its wall, labelled Q, around a large central space labelled S. No nucleus is drawn in either sieve tube element. Beside each sieve tube element lies a narrow cell with dense cytoplasm and a large, prominent nucleus labelled P; a short channel joins this narrow cell to the sieve tube element.
    tags: [sieve-tube, companion-cell, diagram]
    stem: Which one of the following statements about the structures labelled in the figure is correct?
    options:
      - Q is the nucleus of the sieve tube element, which controls the passage of sap.
      - R is a sieve plate, through which the nucleus P moves into the next element.
      - P is the nucleus of a companion cell, which controls the functions of the sieve tube element that has no nucleus.
      - S is a cytoplasmic strand that carries out the functions of the nucleus.
    answer: 2
    explanation: A mature sieve tube element has peripheral cytoplasm (Q), a large vacuole (S) and perforated cross walls called sieve plates (R), but no nucleus. Its functions are controlled by the nucleus (P) of the adjoining companion cell.
  - id: bio-transport-021
    topic: transport-phloem-transport
    subtopic: Mass flow
    concept: Features of mass flow compared with diffusion
    category: concept
    format: multi-statement
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [mass-flow, diffusion]
    stem: |-
      Consider the following statements about mass (bulk) flow.
      I. It is the movement of substances in bulk from one point to another because of a pressure difference.
      II. It is independent of the concentration of the solutes.
      III. It is unidirectional, from higher pressure to lower pressure.
      IV. It is the same as diffusion, since both depend on the concentration gradient of a solute.
      Which of the statements are correct?
    options:
      - I, II and IV only
      - I, II and III only
      - II, III and IV only
      - I and IV only
    answer: 1
    explanation: 'NCERT describes mass flow as movement in bulk due to a pressure difference, independent of solute concentration and unidirectional from higher to lower pressure. Statement IV is wrong: diffusion depends on the concentration gradient, mass flow does not.'
  - id: bio-transport-022
    topic: transport-phloem-transport
    subtopic: Pressure flow hypothesis
    concept: Without the xylem water supply, pressure cannot build up at the loading zone
    category: application
    format: case
    difficulty: 5
    time: 120
    ncert: false
    battle: false
    tags: [pressure-flow, osmosis]
    stem: The xylem next to the loading zone of a source leaf is blocked so that no water can enter the phloem there, while the companion cells go on loading sucrose. What is the most likely effect on the sieve tubes of that zone?
    options:
      - Sucrose accumulates and water enters from other parts of the phloem, so the pressure rises sharply and the flow speeds up.
      - Sucrose accumulates but little water enters, so the pressure builds up poorly and the flow to the sink slows.
      - Sucrose cannot be loaded at all because active transport needs water as its source of energy.
      - The sieve tubes become hypotonic, so water leaves them and the sap flows to the sink faster.
    answer: 1
    explanation: In the pressure flow hypothesis the pressure at the source builds up because water from the adjacent xylem enters the hypertonic phloem by osmosis. With no water supply the sieve tubes cannot be pressurised, so the pressure difference to the sink is small and the flow slows. Loading is driven by ATP, not by water.
  - id: bio-transport-023
    topic: transport-phloem-transport
    subtopic: Water potential in phloem
    concept: Loading lowers the solute potential and hence the water potential of the sieve tube
    category: concept
    format: direct
    difficulty: 4
    time: 85
    ncert: true
    battle: false
    tags: [water-potential, loading]
    stem: Water enters the sieve tubes from the adjacent xylem at the source after loading mainly because loading
    options:
      - raises the solute potential of the phloem sap above that of the xylem sap
      - pumps water actively into the sieve tubes along with sucrose
      - increases the pressure potential of the xylem sap
      - lowers the solute potential, and hence the water potential, of the phloem sap
    answer: 3
    explanation: Adding sucrose makes the solute potential of the sieve tube more negative, which lowers its water potential, and water moves by osmosis from the xylem (higher water potential) into the phloem. NCERT says water enters by osmosis, not by active transport.
  - id: bio-transport-024
    topic: transport-phloem-transport
    subtopic: Pressure flow hypothesis
    concept: Sap flows from high pressure to low pressure, so food moves from source to sink
    category: concept
    format: assertion-reason
    difficulty: 4
    time: 85
    ncert: true
    battle: false
    tags: [pressure-flow, source-sink]
    stem: |-
      Assertion (A): Food moves from the leaves to the growing parts of a plant.
      Reason (R): Phloem sap moves from a region of lower pressure to a region of higher pressure.
    options:
      - Both A and R are true and R is the correct explanation of A
      - Both A and R are true but R is not the correct explanation of A
      - A is true but R is false
      - A is false but R is true
    answer: 2
    explanation: Food made in the leaves (source) moves to the parts that need or store it (sink), so A is true. In pressure flow the sap moves to areas of lower pressure, so R states the direction backwards and is false.
  - id: bio-transport-025
    topic: transport-phloem-transport
    subtopic: Pressure flow hypothesis
    concept: Pressure flow rests on an osmotically generated pressure difference
    category: concept
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [pressure-flow, osmotic-pressure]
    stem: The pressure flow hypothesis explains the movement of phloem sap on the basis of
    options:
      - tension created by transpiration in the leaves
      - positive pressure developed in the roots by active salt uptake
      - an osmotically generated pressure difference between the source and the sink
      - cohesion and adhesion of water molecules in the sieve tubes
    answer: 2
    explanation: 'In pressure flow, loading at the source raises osmotic pressure and draws in water, while unloading at the sink lowers it, so the sap moves down the resulting pressure difference. The other choices belong to the xylem: transpiration pull, root pressure and cohesion.'
  - id: bio-transport-026
    topic: transport-phloem-transport
    subtopic: Mass flow
    concept: Diffusion is slow over long distances, so long-distance transport uses bulk flow
    category: concept
    format: graph
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    diagram: Line graph. The x-axis is labelled 'Distance travelled (cm)' from 0 to 100; the y-axis is labelled 'Time taken (relative units)'. Curve M is a nearly straight line rising gently from the origin. Curve D starts close to curve M at short distances but bends sharply upwards and reaches a time far above curve M at 100 cm. The curves are labelled M and D.
    tags: [mass-flow, diffusion, graph]
    stem: Curve D shows the time taken by diffusion and curve M the time taken by bulk flow. Which statement is consistent with the graph and with NCERT?
    options:
      - Diffusion suits short distances only; over long distances bulk flow is needed to move water, minerals and food.
      - Diffusion is faster than bulk flow over long distances, so it carries sucrose from the leaves to the roots of a tall tree.
      - Bulk flow becomes slower than diffusion as the distance increases.
