      - Bar A should be 74, because the sternum is not an axial bone
      - Bar B should be 54, because the fore limbs have fewer bones than the hind limbs
      - Bars B and C should each be 63, because the girdles must be added to the limbs
    answer: 0
    explanation: Axial 80, two fore limbs 60 and two hind limbs 60 are correct. Girdles have 6 bones (4 in the pectoral girdle and 2 in the pelvic girdle), so bar D should be 6. Then 80 + 60 + 60 + 6 = 206.
