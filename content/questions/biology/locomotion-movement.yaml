questions:
  - id: bio-loco-001
    topic: loco-types-of-movement
    subtopic: Amoeboid movement
    concept: Macrophages and blood leucocytes show amoeboid movement
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [amoeboid, macrophage]
    stem: Specialised cells of the human body such as macrophages and blood leucocytes exhibit which type of movement?
    options:
      - Amoeboid movement
      - Ciliary movement
      - Muscular movement
      - Flagellar movement
    answer: 0
    explanation: NCERT states that macrophages and leucocytes in blood exhibit amoeboid movement, which is effected by pseudopodia formed by the streaming of protoplasm. Ciliary movement occurs in ciliated tubular organs, and muscular movement moves the limbs, jaws and tongue.
  - id: bio-loco-002
    topic: loco-types-of-movement
    subtopic: Ciliary movement
    concept: Internal tubular organs are lined by ciliated epithelium and show ciliary movement
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [ciliary, ciliated-epithelium]
    stem: Ciliary movement occurs in most of our internal tubular organs because they are lined by
    options:
      - Squamous epithelium
      - Ciliated epithelium
      - Striated muscle
      - Connective tissue
    answer: 1
    explanation: NCERT says that ciliary movement occurs in most of our internal tubular organs, which are lined by ciliated epithelium. Squamous epithelium has no cilia, and muscle and connective tissue do not line these tubes with cilia.
  - id: bio-loco-003
    topic: loco-types-of-movement
    subtopic: Ciliary movement
    concept: Coordinated ciliary movement in the trachea removes inhaled dust particles
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [ciliary, trachea]
    stem: The coordinated movement of cilia in the trachea helps us in
    options:
      - pushing inhaled air towards the alveoli
      - absorbing oxygen from the inhaled air into the blood
      - removing dust particles and some foreign substances inhaled along with the air
      - contracting the diaphragm during inspiration
    answer: 2
    explanation: NCERT states that the coordinated movement of cilia in the trachea helps us remove dust particles and some foreign substances inhaled with atmospheric air. Cilia do not move air, exchange gases or contract the diaphragm.
  - id: bio-loco-004
    topic: loco-types-of-movement
