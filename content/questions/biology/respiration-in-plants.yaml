    options:
      - I and II only
      - I and III only
      - II and IV only
      - III and IV only
    answer: 1
    explanation: NADH + H^+ is reoxidised and less than 7 per cent of the energy is released in both, so I and III are correct. CO_2 is released only in alcoholic fermentation, and lactate dehydrogenase acts only in lactic acid fermentation, so II and IV are wrong.
  - id: bio-resp-023
