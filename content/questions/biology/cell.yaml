    answer: 1
    explanation: Euglenoids have plastids, which NCERT mentions as found in all plant cells and in euglenoids, but they lack a cell wall and have a pellicle. They therefore show a plant-like feature (plastids) together with an animal-like one (no wall), so plastids alone do not mark a plant cell.
