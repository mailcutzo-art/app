    ncert: false
    battle: false
    tags: [euglenoids, plastid, exception]
    stem: A unicellular organism has chloroplasts with pigments like those of higher plants and moves with a flagellum, but it has a flexible protein-rich pellicle instead of a cell wall. Which conclusion is consistent with NCERT?
    options:
      - It must be an animal cell because it has no cell wall and it moves
      - It combines a plant-like feature (plastids) with an animal-like feature (no cell wall)
      - It must be a plant cell because plastids occur only in plant cells
