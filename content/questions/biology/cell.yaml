    diagram: Circular cross-section of a cylindrical structure. Nine evenly spaced units lie around the periphery, each made of three short tubules fused side by side in a row (a triplet). At the exact centre is a small solid round region labelled P with no tubules in it. Thin straight lines labelled Q run outward from P to each of the nine peripheral triplets like the spokes of a cartwheel. The whole structure is drawn lying in a hazy cloud of material outside the triplets.
