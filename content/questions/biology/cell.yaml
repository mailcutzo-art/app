      Statement I: Each of the nine peripheral fibrils of a centriole is a doublet, as in the axoneme of a cilium.
      Statement II: The two centrioles of a centrosome lie parallel to each other.
    options:
      - Both Statement I and Statement II are correct
      - Both Statement I and Statement II are incorrect
