      Statement I: Cilia are small structures that work like oars, whereas flagella are comparatively longer and are responsible for cell movement.
      Statement II: The flagella of prokaryotic bacteria are structurally the same as those of eukaryotes.
    options:
      - Both Statement I and Statement II are correct
      - Both Statement I and Statement II are incorrect
      - Statement I is correct but Statement II is incorrect
      - Statement I is incorrect but Statement II is correct
    answer: 2
