    ncert: true
    battle: false
    diagram: Two circular cross-sections drawn side by side. X is enclosed by a thin outer membrane; inside it nine evenly spaced peripheral units each consist of two fused tubules (a doublet), and two separate single round tubules lie in the centre. Y has no outer membrane; nine evenly spaced peripheral units each consist of three fused tubules (a triplet), and its centre is empty apart from a small hub joined to the units by thin spokes.
    tags: [diagram, cilia, centriole]
