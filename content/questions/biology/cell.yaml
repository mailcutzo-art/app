  - id: bio-cell-034
    topic: cell-cytoskeleton-centrioles
    subtopic: Centrosome in the cell cycle
    concept: Centriole duplicates in S phase, centrosome moves to poles in prophase, spindle attaches to kinetochores at metaphase
    category: application
    format: multi-statement
    difficulty: 5
    time: 120
    ncert: true
    battle: false
    tags: [centrosome, cell-cycle, spindle]
    stem: |-
      Consider the following statements about an animal cell.
      I. The centriole duplicates in the cytoplasm during the S phase, while the DNA replicates in the nucleus.
      II. The duplicated centrosome begins to move towards opposite poles of the cell during prophase.
      III. At metaphase, microtubules from the opposite poles of the spindle attach to the kinetochores of the chromosomes at the equator.
      IV. The centrosome duplicates only after the sister chromatids separate at anaphase.
