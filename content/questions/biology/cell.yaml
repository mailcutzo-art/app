questions:
  - id: bio-cell-001
    topic: organelles
    category: factual
    difficulty: 1
    battle: true
    stem: Which organelle is known as the powerhouse of the cell?
    options:
      - Ribosome
      - Golgi apparatus
      - Lysosome
      - Mitochondrion
    answer: 3
    explanation: Mitochondria carry out aerobic respiration and make most of the cell's ATP, which is why they are called the powerhouse of the cell.

  - id: bio-cell-002
    topic: cell-types
    category: factual
    difficulty: 1
    battle: true
    stem: Which of these organisms is a prokaryote?
    options:
      - "*Escherichia coli*"
      - "*Amoeba*"
      - Yeast
      - "*Chlamydomonas*"
    answer: 0
    explanation: "Bacteria such as *Escherichia coli* are prokaryotes: they have no nuclear membrane and no membrane-bound organelles. *Amoeba*, yeast and *Chlamydomonas* are all eukaryotes."

  - id: bio-cell-003
    topic: cell-types
    category: concept
    difficulty: 2
    battle: true
    stem: Which structure is found in both prokaryotic and eukaryotic cells?
    options:
      - A nucleus with a nuclear membrane
      - Mitochondria
      - Ribosomes
      - Endoplasmic reticulum
    answer: 2
    explanation: Every cell makes proteins, so every cell has ribosomes (70S in prokaryotes, 80S in the eukaryotic cytoplasm). A true nucleus and membrane-bound organelles such as mitochondria and ER occur only in eukaryotes.

  - id: bio-cell-004
    topic: organelles
    category: factual
    difficulty: 2
    battle: true
    stem: Which organelle modifies, sorts and packages proteins for secretion?
    options:
      - Smooth endoplasmic reticulum
      - Golgi apparatus
      - Centriole
      - Nucleolus
    answer: 1
    explanation: Proteins made on the rough ER travel to the Golgi apparatus, which modifies them (for example by adding sugars), sorts them and packs them into vesicles for secretion.

  - id: bio-cell-005
    topic: organelles
    category: concept
    difficulty: 2
    battle: true
    stem: Why are lysosomes called 'suicidal bags'?
    options:
      - They store the cell's waste permanently
      - Their enzymes can digest the cell itself if released
      - They trigger cell division
      - They burst whenever the cell divides
    answer: 1
    explanation: Lysosomes hold hydrolytic enzymes that work at acidic pH. If the lysosome membrane ruptures, the enzymes can digest the cell's own contents (autolysis), hence the name.

  - id: bio-cell-006
    topic: cell-types
    category: application
    difficulty: 3
    battle: true
    stem: A cell has a cell wall, a nucleus and chloroplasts but no centrioles. Where is it most likely from?
    options:
      - A bacterium
      - A human liver
      - A mushroom
      - A leaf of a flowering plant
    answer: 3
    explanation: A cell wall together with chloroplasts points to a plant, and the cells of flowering plants also lack centrioles. Bacteria have no nucleus, animal cells have no cell wall, and fungi such as mushrooms have no chloroplasts.

  - id: bio-cell-007
    topic: organelles
    category: application
    difficulty: 3
    battle: true
    stem: Cells of which tissue would you expect to contain the most mitochondria?
    options:
      - Heart muscle
      - Adipose (fat) tissue
      - Mature red blood cells
      - Cartilage
    answer: 0
    explanation: Heart muscle contracts nonstop and needs a steady supply of ATP, so its cells are packed with mitochondria. Mature human red blood cells have none at all.

  - id: bio-cell-008
    topic: cell-types
    category: factual
    difficulty: 2
    battle: true
    stem: What does the 'S' in 70S and 80S ribosomes stand for?
    options:
      - Size in nanometres
      - Number of subunits
      - Svedberg unit
      - Number of proteins
    answer: 2
    explanation: S is the Svedberg unit, a measure of how fast a particle sediments in an ultracentrifuge. It depends on shape as well as size, so values don't simply add; a 50S and a 30S subunit make a 70S ribosome.
  - id: bio-cell-009
    topic: cell-cytoskeleton-centrioles
    subtopic: Cytoskeleton
    concept: An elaborate network of filamentous proteinaceous structures in the cytoplasm is the cytoskeleton
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [cytoskeleton]
    stem: An elaborate network of filamentous proteinaceous structures present in the cytoplasm is collectively called the
    options:
      - Endomembrane system
      - Cytoskeleton
      - Cell envelope
      - Plasma membrane
    answer: 1
    explanation: NCERT calls the elaborate network of filamentous proteinaceous structures in the cytoplasm the cytoskeleton. The endomembrane system is a set of membrane-bound organelles, and the cell envelope and plasma membrane are the covering of the cell.
  - id: bio-cell-010
    topic: cell-cytoskeleton-centrioles
    subtopic: Cilia and flagella
    concept: Cilia are small hair-like outgrowths of the cell membrane that work like oars
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [cilia]
    stem: Which hair-like outgrowths of the cell membrane work like oars, moving either the cell or the fluid around it?
    options:
      - Flagella
      - Pili
      - Mesosomes
      - Cilia
    answer: 3
    explanation: NCERT describes cilia as small hair-like outgrowths of the cell membrane that work like oars and move the cell or the surrounding fluid. Flagella are longer and mainly move the cell, while pili and mesosomes are not oar-like outgrowths of the cell membrane.
  - id: bio-cell-011
    topic: cell-cytoskeleton-centrioles
    subtopic: Axoneme
    concept: The core of a cilium or flagellum is the axoneme, with microtubules parallel to the long axis
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [axoneme]
    stem: The core of a cilium or flagellum, which has microtubules running parallel to its long axis, is called the
    options:
      - Hub
      - Basal body
      - Pericentriolar material
      - Axoneme
    answer: 3
    explanation: The core of a cilium or flagellum, covered by the plasma membrane, is the axoneme. It has microtubules running parallel to the long axis. The hub belongs to a centriole, and the basal body lies at the base of the cilium.
  - id: bio-cell-012
    topic: cell-cytoskeleton-centrioles
    subtopic: Axoneme
    concept: The axonemal 9+2 array is nine peripheral doublets with a central pair of microtubules
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [9+2-array, axoneme]
    stem: The '9+2' array of a cilium or flagellum refers to
    options:
      - nine peripheral triplets and one central pair of microtubules
      - nine central doublets and two peripheral microtubules
      - nine peripheral singlets and two central doublets
      - nine peripheral doublets and one central pair of microtubules
    answer: 3
    explanation: In the axoneme, nine pairs of radially arranged peripheral microtubules (doublets) surround a pair of central microtubules. This is the 9+2 array. The peripheral units are doublets, not triplets, and they lie around the central pair, not inside it.
  - id: bio-cell-013
    topic: cell-cytoskeleton-centrioles
    subtopic: Axoneme
    concept: The axoneme has nine radial spokes joining the central sheath to the peripheral doublets
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [radial-spoke, axoneme]
    stem: How many radial spokes connect the central sheath to the peripheral doublets in the axoneme of a cilium?
    options:
      - '2'
      - '9'
      - '11'
      - '18'
    answer: 1
    explanation: The central sheath is joined to one tubule of each of the nine peripheral doublets by a radial spoke, so there are nine radial spokes. The number follows the nine doublets, not the two central tubules.
  - id: bio-cell-014
    topic: cell-cytoskeleton-centrioles
    subtopic: Centrosome
    concept: Centrioles are surrounded by amorphous pericentriolar material
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [centrosome, pericentriolar-material]
    stem: The two centrioles of a centrosome are surrounded by an amorphous mass called the
    options:
      - Central sheath
      - Hub
      - Pericentriolar material
      - Linker
    answer: 2
    explanation: A centrosome usually contains two cylindrical centrioles, surrounded by amorphous pericentriolar material. The central sheath and the linker belong to the axoneme, and the hub lies inside the centriole.
  - id: bio-cell-015
    topic: cell-cytoskeleton-centrioles
    subtopic: Basal body
    concept: Cilia and flagella emerge from centriole-like basal bodies
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [basal-body]
    stem: Eukaryotic cilia and flagella both arise from a centriole-like structure called the
    options:
      - Kinetochore
      - Centromere
      - Axoneme
      - Basal body
    answer: 3
    explanation: Both the cilium and the flagellum emerge from a centriole-like structure called the basal body. A kinetochore and a centromere are chromosomal structures, and the axoneme is the core of the cilium itself.
  - id: bio-cell-016
    topic: cell-cytoskeleton-centrioles
    subtopic: Functions
    concept: The cytoskeleton gives mechanical support, motility and shape, but does not package secretions
    category: concept
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [cytoskeleton, functions]
    stem: Which of the following is NOT a function of the cytoskeleton?
    options:
      - Mechanical support to the cell
      - Motility of the cell
      - Maintenance of the shape of the cell
      - Packaging and modification of secretory products
    answer: 3
    explanation: NCERT lists mechanical support, motility and maintenance of the shape of the cell as functions of the cytoskeleton. Packaging and modification of secretory products is carried out by the Golgi apparatus.
  - id: bio-cell-017
    topic: cell-cytoskeleton-centrioles
    subtopic: Axoneme
    concept: Peripheral doublets are interconnected by linkers, while bridges join the central tubules
    category: concept
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [linkers, axoneme]
    stem: In the axoneme of a cilium, the peripheral doublets are interconnected by
    options:
      - bridges
      - linkers
      - radial spokes
      - a central sheath
    answer: 1
    explanation: Adjacent peripheral doublets are interconnected by linkers. Bridges connect the two central tubules, radial spokes join the central sheath to the doublets, and the central sheath encloses the central pair.
  - id: bio-cell-018
    topic: cell-cytoskeleton-centrioles
    subtopic: Centriole vs axoneme
    concept: A central pair in a sheath is found in an axoneme, whereas the centriole has a hub; spokes and linkers occur in both
    category: concept
    format: direct
    difficulty: 4
    time: 85
    ncert: true
    battle: false
    tags: [axoneme, centriole, comparison]
    stem: Which of the following is a feature of the axoneme of a cilium but NOT of a centriole of the centrosome?
    options:
      - Nine evenly spaced peripheral units
      - Radial spokes joining the centre to the peripheral units
      - Linkers between adjacent peripheral units
      - A central pair of microtubules enclosed in a central sheath
    answer: 3
    explanation: The axoneme has a central pair of microtubules enclosed in a central sheath. A centriole has a proteinaceous hub in its centre instead. Both have nine peripheral units, radial spokes from the centre and linkers between adjacent peripheral units.
  - id: bio-cell-019
    topic: cell-cytoskeleton-centrioles
    subtopic: Centriole structure
    concept: Each of the nine peripheral fibrils of a centriole is a triplet, unlike the doublets of the axoneme
    category: concept
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [centriole, triplet]
    stem: Unlike the peripheral microtubules of an axoneme, the nine peripheral fibrils of a centriole are arranged as
    options:
      - doublets
      - singlets
      - triplets
      - doublets joined to a central pair
    answer: 2
    explanation: A centriole is made of nine evenly spaced peripheral fibrils of tubulin protein, and each fibril is a triplet. The peripheral units of the axoneme are doublets.
  - id: bio-cell-020
    topic: cell-cytoskeleton-centrioles
    subtopic: Centriole structure
    concept: The hub lies in the central part of the proximal region of the centriole
    category: factual
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [centriole, hub]
    stem: The proteinaceous hub of a centriole is located in the
    options:
      - central part of the distal region
      - pericentriolar material around the centriole
      - wall between two adjacent triplets
      - central part of the proximal region
    answer: 3
    explanation: NCERT places the hub in the central part of the proximal region of the centriole. It is joined to the peripheral triplets by radial spokes made of protein.
  - id: bio-cell-021
    topic: cell-cytoskeleton-centrioles
    subtopic: Centrosome
    concept: The two centrioles of a centrosome lie perpendicular to each other
    category: factual
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [centrosome, centriole]
    stem: The two centrioles present in a centrosome lie
    options:
      - parallel to each other
      - perpendicular to each other
      - end to end in a straight line
      - inside the nucleolus
    answer: 1
    explanation: Both the centrioles in a centrosome lie perpendicular to each other. They are surrounded by pericentriolar material and are not parallel or placed end to end.
  - id: bio-cell-022
    topic: cell-cytoskeleton-centrioles
    subtopic: Centriole structure
    concept: A centriole is cartwheel-like, with radial spokes joining the hub to the peripheral triplets
    category: concept
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [centriole, cartwheel]
    stem: A centriole has an organisation like a cartwheel, in which the radial spokes join the central hub to the
    options:
      - peripheral triplets of tubulin fibrils
      - central pair of microtubules
      - pericentriolar material
      - plasma membrane
    answer: 0
    explanation: In the cartwheel organisation, the proteinaceous radial spokes link the hub to the nine peripheral triplets of tubulin fibrils. A central pair of microtubules is a feature of the axoneme, not of the centriole.
  - id: bio-cell-023
    topic: cell-cytoskeleton-centrioles
    subtopic: Centrosome
    concept: Centrioles form basal bodies and the spindle fibres that make the spindle apparatus in animal cells
    category: factual
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [centriole, spindle]
    stem: In animal cells, besides forming the basal bodies of cilia and flagella, centrioles also give rise to the
    options:
      - nuclear pores of the envelope
      - spindle fibres of the spindle apparatus
      - nucleolus
      - cell plate
    answer: 1
    explanation: NCERT states that centrioles form the basal body of cilia or flagella, and the spindle fibres that give rise to the spindle apparatus during cell division in animal cells. They have no role in making the nucleolus, nuclear pores or the cell plate.
  - id: bio-cell-024
    topic: cell-cytoskeleton-centrioles
    subtopic: Cilia and flagella
    concept: Cilia work like oars and flagella are longer, but bacterial flagella differ structurally from eukaryotic ones
    category: concept
