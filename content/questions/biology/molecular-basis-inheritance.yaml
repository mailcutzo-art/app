    explanation: The first AUG begins at the fifth base, so the codons are AUG, AAG, CUU, AGC, CGG and then UAA. UAA is the first in-frame stop codon and codes for no amino acid, so five amino acids are added. The UGA near the start and the UAG in the middle lie in other frames and are not read as stops.
  - id: bio-molbasis-348
    topic: molbasis-translation
