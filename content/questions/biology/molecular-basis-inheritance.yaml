      Statement I: A nucleoside is formed when a nitrogenous base is linked to the pentose sugar through an N-glycosidic linkage.
      Statement II: A nucleotide is formed when a phosphate group is linked to the 5′-OH of a nucleoside through a 3′–5′ phosphodiester linkage.
    options:
