    tags: [chargaff, base-composition]
    stem: A sample of double-stranded DNA from a bacterium is found to contain 18% cytosine. What percentage of its bases are adenine and thymine together?
    options:
      - 32%
      - 36%
      - 82%
      - 64%
    answer: 3
    explanation: C = G = 18%, so G + C = 36%. The rest, 100 − 36 = 64%, is A + T (32% each). The value 32% is only adenine, 36% is G + C, and 82% results from subtracting only C.
