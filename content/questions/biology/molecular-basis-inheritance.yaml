    explanation: NCERT describes the tRNA as having an anticodon loop, which has bases complementary to the code, and an amino acid acceptor end to which it binds the amino acid. The 5' cap and the poly-A tail are features of eukaryotic mRNA.
  - id: bio-molbasis-334
