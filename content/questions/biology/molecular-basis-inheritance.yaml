      - No transformation, because RNA is the transforming principle
      - Transformation is inhibited, because the two enzymes together also digest DNA
    answer: 0
    explanation: Protease and RNase did not affect transformation, since the transforming substance is DNA and neither enzyme digests it. Only DNase would inhibit transformation.
  - id: bio-molbasis-130
    topic: molbasis-genetic-material
