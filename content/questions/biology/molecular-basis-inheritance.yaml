    explanation: NCERT says that if two charged tRNAs are brought close enough, the formation of a peptide bond between them is favoured energetically, and a catalyst enhances its rate. Uncharged tRNAs carry no amino acid to join, and free amino acids are not activated.
  - id: bio-molbasis-344
