    answer: 3
    explanation: NCERT describes tRNA as having an anticodon loop with bases complementary to the code and an amino acid acceptor end that binds the amino acid. The two roles are not interchangeable, there are no tRNAs for stop codons, and the clover-leaf is the secondary structure while the actual shape is an inverted L.
  - id: bio-molbasis-349
