  - id: bio-molbasis-031
    topic: molbasis-dna-structure
    subtopic: Euchromatin and heterochromatin
    concept: Heterochromatin is dense and inactive; euchromatin is active
    category: concept
    format: statement-pair
    difficulty: 4
    time: 85
    ncert: true
    battle: false
    tags: [euchromatin, heterochromatin]
    stem: |-
      Statement I: Heterochromatin is loosely packed chromatin that stains light and is transcriptionally active.
      Statement II: Euchromatin is transcriptionally active chromatin, whereas heterochromatin is inactive.
    options:
      - Both Statement I and Statement II are correct
      - Both Statement I and Statement II are incorrect
      - Statement I is correct but Statement II is incorrect
      - Statement I is incorrect but Statement II is correct
    answer: 3
    explanation: Statement I is incorrect because the loosely packed, light-staining and active chromatin is euchromatin; heterochromatin is densely packed and stains dark. Statement II is correct.
  - id: bio-molbasis-032
    topic: molbasis-dna-structure
    subtopic: Nucleosome
    concept: DNA is negatively charged and histones are basic proteins
    category: concept
    format: statement-pair
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [histones, nucleosome]
    stem: |-
      Statement I: Negatively charged DNA is wrapped around a positively charged histone octamer to form a nucleosome.
      Statement II: Histones are rich in the acidic amino acids aspartic acid and glutamic acid, which gives them a positive charge.
    options:
      - Both Statement I and Statement II are correct
      - Both Statement I and Statement II are incorrect
      - Statement I is correct but Statement II is incorrect
      - Statement I is incorrect but Statement II is correct
    answer: 2
    explanation: Statement I is correct. Statement II is incorrect because histones are positively charged owing to their richness in the basic residues lysine and arginine, and acidic residues would give a negative charge.
  - id: bio-molbasis-033
    topic: molbasis-dna-structure
    subtopic: Polynucleotide chain
