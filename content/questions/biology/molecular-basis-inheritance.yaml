    explanation: NCERT states that the ribosome also acts as a catalyst, and that 23S rRNA in bacteria is the ribozyme that forms the peptide bond. The catalyst is therefore an RNA and not a protein enzyme, and 23S rRNA is the one named in NCERT.
  - id: bio-molbasis-338
    topic: molbasis-translation
