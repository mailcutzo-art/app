      - Bacterial ribosomes are 80S, whereas eukaryotic ribosomes are 70S.
    answer: 0
    explanation: In bacteria the mRNA needs no processing and translation can begin before transcription is complete. In eukaryotes the hnRNA is spliced, capped and tailed, and the processed mRNA leaves the nucleus for translation. Bacterial ribosomes are 70S and eukaryotic ones are 80S.
  - id: bio-molbasis-352
