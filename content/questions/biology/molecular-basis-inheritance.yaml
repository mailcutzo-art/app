    ncert: true
    battle: false
    diagram: 'Four test tubes in a row, each containing heat-killed S-cell extract mixed with live R cells, with a culture plate drawn beneath each. Tube 1: extract with no enzyme added; its plate shows both smooth (S) and rough (R) colonies. Tube 2: extract + protease; plate shows S and R colonies. Tube 3: extract + RNase; plate shows S and R colonies. Tube 4: extract + DNase; plate shows only rough (R) colonies.'
    tags: [diagram, avery, enzymes]
    stem: The figure shows plates from tubes 1 to 4. Which conclusion does it support?
    options:
      - The transforming substance is a protein, since protease treatment left the transformation unaffected
      - The transforming substance is DNA, since only DNase destroyed its activity
      - The transforming substance is RNA, since RNase treatment left the transformation unaffected
      - The substance cannot be identified, since R colonies appear on all four plates
    answer: 1
    explanation: S colonies, meaning transformation, appear unless the extract is treated with DNase. Protein and RNA are therefore not the transforming substance, and DNA is. R colonies appear everywhere because untransformed R cells are always present.
  - id: bio-molbasis-126
