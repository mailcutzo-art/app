      - only light DNA
    answer: 2
    explanation: NCERT records that after 40 minutes the DNA was made of equal amounts of hybrid DNA and light DNA. The two parental ^{15}N strands stay in two hybrid molecules, while the other two molecules have only ^{14}N strands.
  - id: bio-molbasis-138
    topic: molbasis-replication
    subtopic: Meselson and Stahl experiment
    concept: Ratio of hybrid to light DNA after three generations
    category: numerical
    format: direct
    difficulty: 3
