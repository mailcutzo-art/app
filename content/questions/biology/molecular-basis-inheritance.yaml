    explanation: NCERT states that the mRNA provides the template, the tRNA brings amino acids and reads the genetic code, and the rRNAs play structural and catalytic roles during translation. Statement I is wrong because it is the tRNA, not the mRNA, that brings amino acids.
  - id: bio-molbasis-354
    topic: molbasis-translation
