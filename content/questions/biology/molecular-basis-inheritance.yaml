    explanation: The blender is what strips the empty coats off the bacterial surface. Without it the coats sediment with the bacteria, so radioactivity appears in the pellet even though the protein never entered the cells, and a student could wrongly conclude that protein enters.
  - id: bio-molbasis-131
    topic: molbasis-replication
    subtopic: Semiconservative replication
    concept: Each separated parental strand is a template for a new complementary strand
    category: concept
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [template, complementary-strand]
    stem: During DNA replication, each separated parental strand acts as a template for a new strand that is
    options:
      - identical in base sequence to the template strand
      - complementary to the template strand
      - made of ribonucleotides complementary to the template
      - a mixture of parental and new nucleotides
    answer: 1
    explanation: In the scheme implicit in the Watson-Crick model, the two strands separate and each acts as a template for the synthesis of a new complementary strand by base pairing (A with T, G with C). The new strand is complementary, not identical, to its template.
  - id: bio-molbasis-132
    topic: molbasis-replication
    subtopic: Semiconservative replication
    concept: Watson and Crick proposed that the strands separate and each acts as a template
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [watson-crick, semiconservative]
    stem: The scheme of DNA replication in which the two strands separate and each acts as a template for a new complementary strand was first suggested by
    options:
      - Meselson and Stahl
      - Hershey and Chase
      - Avery, MacLeod and McCarty
      - Watson and Crick
    answer: 3
    explanation: Watson and Crick noted that the specific base pairing of their double helix suggests a copying mechanism and proposed semiconservative replication. Meselson and Stahl later proved it experimentally, while Hershey and Chase and Avery, MacLeod and McCarty worked on the nature of the genetic material.
  - id: bio-molbasis-133
    topic: molbasis-replication
    subtopic: Meselson and Stahl experiment
    concept: Meselson and Stahl used E. coli
    category: factual
    format: direct
    difficulty: 1
