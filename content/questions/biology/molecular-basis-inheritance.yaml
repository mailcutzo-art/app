      - '*Streptococcus pneumoniae*'
      - '*Vicia faba*'
      - '*Escherichia coli*'
      - bacteriophage T_2
    answer: 2
    explanation: Meselson and Stahl grew *Escherichia coli* in a medium containing ^{15}NH_4Cl and then shifted it to ^{14}NH_4Cl. *Streptococcus pneumoniae* was used by Griffith, *Vicia faba* by Taylor and colleagues, and bacteriophages by Hershey and Chase.
  - id: bio-molbasis-134
    topic: molbasis-replication
