    explanation: NCERT names mRNA, tRNA and rRNA as the three major types of RNA in bacteria and says that all three are needed to synthesise a protein in a cell. The hnRNA is only the unprocessed precursor of eukaryotic mRNA, and snRNA is not one of the three RNAs named for protein synthesis.
  - id: bio-molbasis-335
