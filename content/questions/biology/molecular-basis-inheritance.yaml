    explanation: NCERT says that during elongation complexes of an amino acid linked to tRNA bind sequentially to the appropriate codon in the mRNA by forming complementary base pairs with the tRNA anticodon. The acceptor end holds the amino acid and does not pair with the codon.
  - id: bio-molbasis-341
