    explanation: NCERT says that the UTRs are not translated but are required for the efficient translation process. Recognition of the promoter is a DNA-level event, charging of tRNA is done by the amino acid and ATP, and splicing removes introns from hnRNA.
  - id: bio-molbasis-340
