    answer: 2
    explanation: NCERT defines a translational unit as the sequence of RNA flanked by the start codon (AUG) and the stop codon, which codes for a polypeptide. The promoter and terminator flank the transcription unit of DNA, not the translational unit of mRNA.
  - id: bio-molbasis-339
    topic: molbasis-translation
