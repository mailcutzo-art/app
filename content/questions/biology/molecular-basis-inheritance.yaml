    stem: Hershey and Chase could not have told viral DNA from viral protein if they had labelled the phages with radioactive carbon (^{14}C) instead of ^{32}P and ^{35}S, because
    options:
      - carbon is present only in the polysaccharide coat of the phage
      - DNA does not contain carbon
      - radioactive carbon cannot be detected after centrifugation
      - both DNA and protein contain carbon, so both would be labelled
    answer: 3
    explanation: An isotope can separate DNA from protein only if it is present in one and absent from the other. Phosphorus is in DNA but not protein, sulfur is in the protein but not DNA, but carbon is in both.
