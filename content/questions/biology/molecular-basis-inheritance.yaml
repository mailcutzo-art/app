    explanation: NCERT states that insertion or deletion of one or two bases changes the reading frame from that point, whereas insertion or deletion of three bases, or a multiple of three, adds or removes whole codons and leaves the later frame unaltered. Statements I, II and III follow this, while IV is wrong.
  - id: bio-molbasis-356
