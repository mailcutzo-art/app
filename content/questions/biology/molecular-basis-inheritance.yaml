      - DNA polymerase is too slow for long molecules
      - nucleotides cannot diffuse into a long DNA
      - separating the strands over the whole length needs very high energy
    answer: 3
    explanation: NCERT explains that the two strands of a long DNA cannot be separated in their entire length because of the very high energy requirement, so replication occurs within a small opening called the replication fork.
  - id: bio-molbasis-146
    topic: molbasis-replication
    subtopic: Replication fork
    concept: The replication fork is the small opening of the DNA helix
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
