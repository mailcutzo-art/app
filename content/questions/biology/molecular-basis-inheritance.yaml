      - acting as substrates and providing energy for polymerisation
      - acting as substrates and as primers
    answer: 2
    explanation: NCERT says that the deoxyribonucleoside triphosphates act as substrates and also provide the energy for the polymerisation reaction. They are neither templates nor primers.
  - id: bio-molbasis-144
    topic: molbasis-replication
    subtopic: Enzymes of replication
    concept: DNA ligase joins the discontinuously synthesised fragments
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [dna-ligase]
    stem: The discontinuously synthesised DNA fragments formed during replication are later joined by the enzyme
    options:
      - DNA-dependent DNA polymerase
      - DNA-dependent RNA polymerase
      - DNA ligase
      - restriction endonuclease
    answer: 2
    explanation: DNA ligase joins the discontinuously synthesised fragments of the strand made on the 5′→3′ template. DNA polymerase adds nucleotides, and restriction endonucleases cut DNA rather than join it.
  - id: bio-molbasis-145
    topic: molbasis-replication
    subtopic: Replication fork
    concept: Long DNA replicates within a small opening because separating all of it needs very high energy
    category: concept
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [replication-fork, energy]
    stem: Long DNA molecules replicate within a small opening of the helix and not by separating both strands in their entire length because
    options:
