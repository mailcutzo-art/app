      - 5′→3′, towards the replication fork
      - 3′→5′, away from the replication fork
      - 3′→5′, towards the replication fork
    answer: 0
    explanation: Polymerase always builds a strand 5′→3′. On the lagging template the fork opens in the opposite sense, so each Okazaki fragment grows 5′→3′ away from the fork, and the pieces are then joined by ligase.
  - id: bio-molbasis-150
