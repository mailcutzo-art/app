  - id: bio-molbasis-141
    topic: molbasis-replication
    subtopic: Enzymes of replication
    concept: DNA-dependent DNA polymerase uses a DNA template to make DNA
    category: concept
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [dna-polymerase]
    stem: The main enzyme of DNA replication is called DNA-dependent DNA polymerase because it
    options:
      - uses an RNA template to catalyse polymerisation of deoxynucleotides
      - uses a DNA template to catalyse polymerisation of ribonucleotides
      - needs DNA only as a source of energy for polymerisation
      - uses a DNA template to catalyse polymerisation of deoxynucleotides
    answer: 3
    explanation: NCERT calls it DNA-dependent DNA polymerase since it uses a DNA template to catalyse polymerisation of deoxynucleotides. An enzyme that copies an RNA template into DNA would be RNA-dependent, and RNA is made of ribonucleotides.
  - id: bio-molbasis-142
    topic: molbasis-replication
    subtopic: Enzymes of replication
    concept: DNA polymerases polymerise only in the 5'→3' direction
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [dna-polymerase, polarity]
    stem: DNA-dependent DNA polymerases catalyse polymerisation of nucleotides in only one direction, which is
    options:
      - 3′→5′
      - either direction, depending on the template
      - 5′→3′
      - alternately 5′→3′ and 3′→5′
    answer: 2
    explanation: NCERT states that DNA-dependent DNA polymerases catalyse polymerisation only in the 5′→3′ direction. This restriction creates complications at the replication fork and explains continuous and discontinuous synthesis.
  - id: bio-molbasis-143
    topic: molbasis-replication
    subtopic: Enzymes of replication
    concept: Deoxyribonucleoside triphosphates are substrates and the energy source
    category: concept
    format: direct
    difficulty: 2
