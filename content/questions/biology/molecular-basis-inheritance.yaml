    options:
      - replication fork
      - origin of replication
      - transcription bubble
      - nucleoid
    answer: 0
    explanation: The replication fork is the small, Y-shaped opening of the helix in which the parental strands are copied. The origin of replication is only the site where replication starts, and a transcription bubble is formed during RNA synthesis.
  - id: bio-molbasis-147
    topic: molbasis-replication
    subtopic: Leading and lagging strands
    concept: The continuous strand is formed on the 3'→5' template
    category: concept
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [leading-strand, template-polarity]
    stem: At a replication fork, the new strand that is synthesised continuously is formed on the template strand with polarity
    options:
      - 5′→3′
      - either polarity, depending on the direction of the fork
      - neither, because both new strands are formed in fragments
      - 3′→5′
    answer: 3
    explanation: On the template with polarity 3′→5′, polymerisation in the 5′→3′ direction can follow the opening of the fork, so replication is continuous. On the template with polarity 5′→3′ it is discontinuous.
  - id: bio-molbasis-148
    topic: molbasis-replication
    subtopic: Leading and lagging strands
    concept: Why one strand is made discontinuously
    category: concept
    format: direct
    difficulty: 4
    time: 85
    ncert: true
    battle: false
    tags: [lagging-strand, polymerase-direction]
    stem: Why is the new strand on the template with polarity 5′→3′ synthesised discontinuously at the replication fork?
    options:
      - polymerase cannot copy a template of 5′→3′ polarity at all
      - polymerase works only in the 5′→3′ direction, opposite to the way the fork opens along this template
      - DNA ligase is absent on this strand
      - the fork opens along only one of the two strands
    answer: 1
    explanation: DNA polymerase adds nucleotides only in the 5′→3′ direction, while the fork opens along the 5′→3′ template in the opposite sense. The new strand can therefore be made only in pieces, which are joined later by DNA ligase. It is still copied, so the template is not unusable.
  - id: bio-molbasis-149
    topic: molbasis-replication
    subtopic: Leading and lagging strands
    concept: Okazaki fragments are made 5'→3' away from the fork
    category: concept
    format: direct
    difficulty: 4
