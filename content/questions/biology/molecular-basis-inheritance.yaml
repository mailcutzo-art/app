      - ^{14}C
      - ^{15}N
    answer: 3
    explanation: NCERT states that E. coli were grown in ^{15}NH_4Cl so that ^{15}N, a heavy, non-radioactive isotope of nitrogen, was incorporated into the newly synthesised DNA. The radioactive isotopes ^{32}P and ^{35}S belong to the Hershey-Chase experiment.
  - id: bio-molbasis-135
    topic: molbasis-replication
    subtopic: Meselson and Stahl experiment
    concept: ^{15}N DNA is separated from ^{14}N DNA by CsCl density gradient centrifugation
    category: factual
