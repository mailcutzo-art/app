questions:
  - id: bio-molbasis-001
    topic: molbasis-dna-structure
    subtopic: Nitrogenous bases
    concept: Adenine and guanine are the purines of nucleic acids
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [purines, nitrogenous-bases]
    stem: Which pair of nitrogenous bases consists only of purines?
    options:
      - Cytosine and thymine
      - Adenine and guanine
      - Thymine and uracil
      - Adenine and cytosine
    answer: 1
    explanation: NCERT groups the nitrogenous bases of nucleic acids into purines (adenine and guanine) and pyrimidines (cytosine, thymine and uracil). Every other pair contains at least one pyrimidine.
  - id: bio-molbasis-002
    topic: molbasis-dna-structure
    subtopic: Nitrogenous bases
    concept: Uracil occurs in RNA in place of thymine
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [uracil, rna]
    stem: Which nitrogenous base is found in RNA but not in DNA?
    options:
      - Uracil
      - Thymine
      - Cytosine
      - Guanine
    answer: 0
    explanation: RNA has uracil at the place of thymine. Cytosine, adenine and guanine occur in both nucleic acids, while thymine is the base of DNA only.
  - id: bio-molbasis-003
    topic: molbasis-dna-structure
    subtopic: Double helix
    concept: Wilkins and Franklin produced the X-ray diffraction data used for the double helix model
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [watson-crick, x-ray]
    stem: The X-ray diffraction data used by Watson and Crick for their double helix model were produced by
    options:
      - Hershey and Chase
      - Maurice Wilkins and Rosalind Franklin
      - Meselson and Stahl
      - Erwin Chargaff and Friedrich Miescher
    answer: 1
    explanation: NCERT states that Watson and Crick proposed the double helix model of DNA in 1953 on the basis of X-ray diffraction data produced by Maurice Wilkins and Rosalind Franklin. Hershey-Chase and Meselson-Stahl did different experiments, and Chargaff gave the base ratios.
  - id: bio-molbasis-004
    topic: molbasis-dna-structure
    subtopic: Nucleosome
    concept: A histone octamer is a unit of eight histone molecules
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [histone-octamer, nucleosome]
    stem: A histone octamer is a unit made of
    options:
      - eight base pairs of DNA
      - eight nucleosomes joined together
      - eight molecules of histone proteins
      - eight non-histone chromosomal proteins
    answer: 2
    explanation: Histones are organised to form a unit of eight molecules, the histone octamer. DNA is wrapped around it to form a nucleosome; the octamer is therefore made of proteins, not of DNA or of other nucleosomes.
  - id: bio-molbasis-005
    topic: molbasis-dna-structure
    subtopic: Double helix
    concept: The two strands of DNA have antiparallel polarity
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [antiparallel, double-helix]
    stem: The two polynucleotide chains of a DNA double helix have
    options:
      - antiparallel polarity, one running 5′→3′ and the other 3′→5′
      - parallel polarity, both running 5′→3′
      - identical base sequences on both chains
      - parallel polarity, both running 3′→5′
    answer: 0
    explanation: 'In the Watson and Crick model the two chains have anti-parallel polarity: if one chain runs 5′→3′, the other runs 3′→5′. The chains are complementary, not identical, in base sequence.'
  - id: bio-molbasis-006
    topic: molbasis-dna-structure
    subtopic: Nucleoside and nucleotide
    concept: A base joined to a pentose sugar by an N-glycosidic linkage is a nucleoside
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [nucleoside, n-glycosidic]
    stem: A nitrogenous base linked to a pentose sugar through an N-glycosidic linkage forms a
    options:
      - nucleotide
      - dinucleotide
      - nucleoside
      - polynucleotide
    answer: 2
    explanation: A nitrogenous base joined to the pentose sugar by an N-glycosidic linkage is a nucleoside. A nucleotide needs a phosphate group in addition, and di- or polynucleotides contain several nucleotides.
  - id: bio-molbasis-007
    topic: molbasis-dna-structure
    subtopic: Polynucleotide chain
    concept: Two nucleotides are joined by a 3′-5′ phosphodiester linkage
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [phosphodiester, dinucleotide]
    stem: Two nucleotides are joined to form a dinucleotide through a
    options:
      - N-glycosidic linkage
      - hydrogen bond
      - 3′–5′ phosphodiester linkage
      - 2′–5′ phosphoester linkage
    answer: 2
    explanation: NCERT states that two nucleotides are linked through a 3′-5′ phosphodiester linkage to form a dinucleotide. The N-glycosidic linkage joins a base to its own sugar, and hydrogen bonds hold bases of the two strands together.
  - id: bio-molbasis-008
    topic: molbasis-dna-structure
    subtopic: Polynucleotide chain
    concept: The free phosphate end is the 5′ end and the free -OH end is the 3′ end
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [5-prime-end, 3-prime-end]
    stem: A polynucleotide chain has a free phosphate group at one end and a free hydroxyl group on the sugar at the other. These ends are called the
    options:
      - 3′ end and 5′ end respectively
      - 2′ end and 5′ end respectively
      - 5′ end and 2′ end respectively
      - 5′ end and 3′ end respectively
    answer: 3
    explanation: The end with a free phosphate on the 5′ carbon of the terminal sugar is the 5′ end, and the end where the sugar has a free 3′-OH group is the 3′ end. The 2′ position is not an end of the chain.
  - id: bio-molbasis-009
    topic: molbasis-dna-structure
    subtopic: Length of DNA
    concept: Haploid human DNA has 3.3 x 10^9 base pairs
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [genome-size, human]
    stem: The haploid content of human DNA is
    options:
      - 6.6 × 10^9 bp
      - 3.3 × 10^9 bp
      - 4.6 × 10^6 bp
      - 3.3 × 10^6 bp
    answer: 1
    explanation: NCERT gives the haploid content of human DNA as 3.3 × 10^9 bp. The value 6.6 × 10^9 bp is for the diploid cell, and 4.6 × 10^6 bp is the DNA of *E. coli*.
  - id: bio-molbasis-010
    topic: molbasis-dna-structure
    subtopic: Double helix
    concept: The pitch of the Watson-Crick helix is 3.4 nm
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [pitch, double-helix]
    stem: The pitch of the DNA helix in the Watson-Crick model is
    options:
      - 0.34 nm
      - 34 nm
      - 3.4 nm
      - 10 nm
    answer: 2
    explanation: NCERT gives the pitch of the helix as 3.4 nm, with roughly 10 bp in each turn. The value 0.34 nm is the distance between two adjacent base pairs, not the pitch.
  - id: bio-molbasis-011
    topic: molbasis-dna-structure
    subtopic: Chargaff's rules
    concept: In double-stranded DNA the ratios A/T and G/C are constant and equal to one
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [chargaff, base-ratios]
    stem: Erwin Chargaff showed that in double-stranded DNA the ratios of adenine to thymine and of guanine to cytosine are
    options:
      - constant and equal to one
      - equal to two and three respectively
      - equal to two in both cases
      - variable and different in each species
    answer: 0
    explanation: Chargaff observed that for a double-stranded DNA the ratios between adenine and thymine, and between guanine and cytosine, are constant and equal to one. This is explained by the A-T and G-C base pairing.
  - id: bio-molbasis-012
    topic: molbasis-dna-structure
    subtopic: Histones
    concept: Histones are rich in the basic amino acids lysine and arginine
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [histones, lysine-arginine]
    stem: Histones are rich in the basic amino acid residues
    options:
      - aspartic acid and glutamic acid
      - lysine and arginine
      - glycine and alanine
      - cysteine and methionine
    answer: 1
    explanation: NCERT describes histones as positively charged proteins rich in the basic amino acid residues lysine and arginine. Aspartic acid and glutamic acid are acidic, and the other pairs are neutral residues.
  - id: bio-molbasis-013
    topic: molbasis-dna-structure
    subtopic: Nucleosome
    concept: A typical nucleosome contains about 200 bp of DNA
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [nucleosome, 200-bp]
    stem: A typical nucleosome contains DNA of about
    options:
      - 20 base pairs
      - 2000 base pairs
      - 2 × 10^6 base pairs
      - 200 base pairs
    answer: 3
    explanation: A typical nucleosome contains about 200 bp of DNA helix wrapped around a histone octamer. Nucleosomes are the repeating units of chromatin.
  - id: bio-molbasis-014
    topic: molbasis-dna-structure
    subtopic: Double helix
    concept: Adjacent base pairs of the helix are 0.34 nm apart
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [double-helix, base-pair-spacing]
    stem: In the Watson-Crick model, the distance between two adjacent base pairs of the DNA helix is approximately
    options:
      - 3.4 nm
      - 0.34 nm
      - 0.034 nm
      - 10 nm
    answer: 1
    explanation: The pitch of 3.4 nm contains about 10 bp, so adjacent base pairs lie about 0.34 nm apart. The figure 3.4 nm is the pitch of the whole turn.
  - id: bio-molbasis-015
    topic: molbasis-dna-structure
    subtopic: Chargaff's rules
    concept: 'Base composition: A = T and G = C give G from a known A percentage'
    category: numerical
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    formula: A = T, G = C, A + T + G + C = 100%
    tags: [base-composition, chargaff]
    stem: In a double-stranded DNA, 30% of the bases are adenine. The percentage of guanine in it is
    options:
      - 30%
      - 40%
      - 70%
      - 20%
    answer: 3
    explanation: A = T = 30%, so A + T = 60%. The remaining 40% is G + C, and since G = C, guanine is 20%.
  - id: bio-molbasis-016
    topic: molbasis-dna-structure
    subtopic: Nucleoside and nucleotide
    concept: Uridine is the ribonucleoside carrying uracil
    category: factual
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [nucleoside, uridine]
    stem: Which of the following is a nucleoside found in RNA?
    options:
      - Deoxythymidine
      - Uridine
      - Deoxycytidine
      - Deoxyadenosine
    answer: 1
    explanation: Uridine (uracil with ribose) is an RNA nucleoside. Deoxyadenosine, deoxycytidine and deoxythymidine carry deoxyribose and belong to DNA.
  - id: bio-molbasis-017
    topic: molbasis-dna-structure
    subtopic: Nucleoside and nucleotide
    concept: A phosphate on the 5′-OH of a nucleoside forms a nucleotide through a phosphoester linkage
    category: factual
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [nucleotide, phosphoester]
    stem: The linkage between a phosphate group and the 5′-OH of a nucleoside, giving a nucleotide, is a
    options:
      - N-glycosidic linkage
      - 3′–5′ phosphodiester linkage
      - hydrogen bond
      - phosphoester linkage
    answer: 3
    explanation: NCERT says a nucleotide is formed when a phosphate group is linked to the 5′-OH of a nucleoside through a phosphoester linkage. The 3′-5′ phosphodiester linkage joins two nucleotides, and the N-glycosidic linkage joins base and sugar.
  - id: bio-molbasis-018
    topic: molbasis-dna-structure
    subtopic: DNA and RNA
    concept: Ribose of RNA has an extra -OH at the 2′ position
    category: factual
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [ribose, deoxyribose, rna]
    stem: Compared with the 2′-deoxyribose of DNA, the ribose of RNA carries an additional hydroxyl group on carbon number
    options:
      - 1′
      - 2′
      - 3′
      - 5′
    answer: 1
    explanation: In DNA the 2′ position of the sugar has only H, whereas RNA nucleotides have an additional -OH group at the 2′ position of ribose.
  - id: bio-molbasis-019
    topic: molbasis-dna-structure
    subtopic: Double helix
    concept: Right-handed coiling with about 10 bp per turn
    category: factual
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [double-helix, right-handed]
    stem: In the Watson and Crick model, the two chains of DNA are coiled
    options:
      - in a right-handed fashion, with about 20 base pairs in each turn
      - in a right-handed fashion, with about 10 base pairs in each turn
      - in a left-handed fashion, with about 10 base pairs in each turn
      - in a left-handed fashion, with about 3.4 base pairs in each turn
    answer: 1
    explanation: The two chains coil in a right-handed fashion, and there are roughly 10 bp in each turn of the helix, so a turn spans 3.4 nm. The other options change either the handedness or the number of base pairs per turn.
  - id: bio-molbasis-020
    topic: molbasis-dna-structure
    subtopic: Packaging in prokaryotes
    concept: Bacterial DNA in the nucleoid is organised in large loops held by proteins
    category: factual
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [nucleoid, prokaryotic-dna]
    stem: In bacteria, the DNA present in the nucleoid is organised
    options:
      - as beads-on-string nucleosomes around histone octamers
      - as a single naked thread without any protein
      - as several linear chromosomes inside a nuclear envelope
      - in large loops held by proteins
    answer: 3
    explanation: In prokaryotes such as *E. coli* the negatively charged DNA is held with some positively charged proteins in the nucleoid, where it is organised in large loops held by proteins. Nucleosomes with histone octamers are described for eukaryotes.
  - id: bio-molbasis-021
    topic: molbasis-dna-structure
    subtopic: Chromatin packaging
    concept: Non-histone chromosomal proteins are needed for higher-level packaging
    category: factual
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [nhc-proteins, chromatin]
    stem: Packaging of chromatin at a higher level requires an additional set of proteins called
    options:
      - histone octamer proteins
      - non-histone chromosomal (NHC) proteins
      - nucleoid proteins
      - ribosomal proteins
    answer: 1
    explanation: Beyond the nucleosome level, packaging requires an additional set of proteins collectively called non-histone chromosomal (NHC) proteins. Histones form the nucleosome core and are not an additional set.
  - id: bio-molbasis-022
    topic: molbasis-dna-structure
    subtopic: Chromatin packaging
    concept: Chromatin fibres are condensed to chromosomes at metaphase
    category: factual
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [chromosome, metaphase]
    stem: Chromatin fibres are further coiled and condensed at which stage of cell division to form chromosomes?
    options:
      - Interphase
      - Metaphase
      - Telophase
      - G_1 phase
    answer: 1
    explanation: NCERT states that chromatin is packaged into chromatin fibres, which are further coiled and condensed at the metaphase stage of cell division to form chromosomes.
  - id: bio-molbasis-023
    topic: molbasis-dna-structure
    subtopic: Nucleosome
    concept: Nucleosomes appear as beads-on-string in the electron microscope
    category: factual
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [nucleosome, beads-on-string]
    stem: When chromatin is viewed under the electron microscope, the nucleosomes appear as
    options:
      - a thick unbranched rope of protein only
      - free circular loops lying in the cytoplasm
      - beads on a string
      - a smooth membrane-bound sac
    answer: 2
    explanation: Nucleosomes are the repeating units of chromatin and look like beads on a string under the electron microscope. The string between beads is the DNA connecting adjacent nucleosomes.
  - id: bio-molbasis-024
    topic: molbasis-dna-structure
    subtopic: Base composition numericals
    concept: Hydrogen bond count from the number of G-C pairs (3 per G-C, 2 per A-T)
    category: numerical
    format: direct
    difficulty: 3
    time: 50
    ncert: false
    battle: true
    formula: H-bonds = 3 × (G-C pairs) + 2 × (A-T pairs)
    tags: [hydrogen-bonds, base-pairs]
    stem: A 100 bp DNA segment contains 30 G–C base pairs. The total number of hydrogen bonds holding its two strands is
    options:
      - '230'
      - '200'
      - '270'
      - '300'
    answer: 0
    explanation: 'There are 30 G–C pairs (3 bonds each) and 70 A–T pairs (2 bonds each): 30 × 3 + 70 × 2 = 90 + 140 = 230. The value 200 would be for all A–T pairs, 270 for 70 G–C pairs, and 300 for all G–C pairs.'
  - id: bio-molbasis-025
    topic: molbasis-dna-structure
    subtopic: Base composition numericals
    concept: Chargaff's rules applied to a count of nucleotides
    category: numerical
    format: direct
    difficulty: 3
    time: 50
    ncert: false
    battle: true
    formula: A = T, G = C
    tags: [chargaff, base-composition]
    stem: A double-stranded DNA of 2000 nucleotides has 400 cytosine residues. The number of adenine residues is
    options:
      - '400'
      - '600'
      - '800'
      - '1200'
    answer: 1
    explanation: C = G = 400, so G + C = 800. The remaining 1200 nucleotides are A + T, and A = T, so adenine is 600. The value 800 comes from forgetting that guanine equals cytosine, and 1200 is A + T.
  - id: bio-molbasis-026
    topic: molbasis-dna-structure
    subtopic: Base composition numericals
    concept: Purine/pyrimidine ratio of a strand is the reciprocal of the ratio in the complementary strand
    category: numerical
    format: direct
    difficulty: 4
    time: 85
    ncert: false
    battle: true
    formula: (A + G)/(T + C) of one strand = reciprocal for the other
    tags: [complementary-strand, chargaff]
    stem: In one strand of a double-stranded DNA the ratio (A + G)/(T + C) is 0.4. What is this ratio in the complementary strand?
    options:
      - '0.4'
      - '1.0'
      - '0.6'
      - '2.5'
    answer: 3
    explanation: The bases of the complementary strand pair A with T and G with C. Its purines (A + G) equal the T + C of the first strand and its pyrimidines equal A + G of the first strand, so the ratio is 1/0.4 = 2.5. For the whole duplex the ratio is 1, as Chargaff's rules require.
  - id: bio-molbasis-027
    topic: molbasis-dna-structure
    subtopic: Base composition numericals
    concept: Counting hydrogen bonds and 3′-5′ phosphodiester bonds in a short linear duplex
    category: numerical
    format: direct
    difficulty: 5
    time: 120
    ncert: false
    battle: false
    formula: H-bonds = 2 × AT + 3 × GC; linkages = 2 × (n − 1)
    tags: [hydrogen-bonds, phosphodiester]
    stem: A linear double-stranded DNA of 10 bp has 3 G–C base pairs. Which option gives the total number of hydrogen bonds between its strands and the total number of 3′–5′ phosphodiester linkages in its two chains?
    options:
      - 23 hydrogen bonds and 20 phosphodiester linkages
      - 26 hydrogen bonds and 18 phosphodiester linkages
      - 23 hydrogen bonds and 9 phosphodiester linkages
      - 23 hydrogen bonds and 18 phosphodiester linkages
    answer: 3
    explanation: The 7 A–T pairs give 7 × 2 = 14 and the 3 G–C pairs give 3 × 3 = 9, so there are 23 hydrogen bonds. Each chain has 10 nucleotides, joined by 9 phosphodiester linkages, so the two chains have 18. The trap is 20, which counts one linkage per nucleotide, and 9 counts one chain only.
  - id: bio-molbasis-028
    topic: molbasis-dna-structure
    subtopic: Chargaff's rules
    concept: A-T pairs by two hydrogen bonds; G-C by three, not two
    category: concept
    format: statement-pair
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [hydrogen-bonds, base-pairing]
    stem: |-
      Statement I: In a DNA double helix, adenine forms two hydrogen bonds with thymine of the opposite strand.
      Statement II: In a DNA double helix, guanine forms two hydrogen bonds with cytosine of the opposite strand.
    options:
      - Both Statement I and Statement II are correct
      - Both Statement I and Statement II are incorrect
      - Statement I is correct but Statement II is incorrect
      - Statement I is incorrect but Statement II is correct
    answer: 2
    explanation: 'Statement I is correct: A pairs with T through two hydrogen bonds. Statement II is incorrect because G pairs with C through three hydrogen bonds.'
  - id: bio-molbasis-029
    topic: molbasis-dna-structure
    subtopic: Nucleoside and nucleotide
    concept: A nucleotide forms by a phosphoester linkage; the 3′-5′ phosphodiester joins nucleotides
    category: concept
    format: statement-pair
    difficulty: 4
    time: 85
    ncert: true
    battle: false
    tags: [nucleoside, nucleotide, linkages]
