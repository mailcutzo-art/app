    explanation: Several ribosomes attached to a single mRNA form a chain called a polyribosome or polysome, and the ribosomes of a polysome translate the mRNA into proteins. A nucleosome is DNA wound on histones, a chromosome carries genes, and a lysosome digests materials.
  - id: bio-molbasis-325
