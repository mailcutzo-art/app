    options:
      - equal amounts of hybrid DNA and heavy DNA
      - equal amounts of hybrid DNA and light DNA
      - only hybrid DNA
      - only heavy DNA
    answer: 0
    explanation: The experiment works the other way round. The two original ^{14}N strands stay in two hybrid molecules, and the other two molecules are made only of new ^{15}N strands, so equal amounts of hybrid and heavy DNA are seen. The trap is to copy the answer of the usual 15N to 14N shift.
  - id: bio-molbasis-140
    topic: molbasis-replication
    subtopic: Meselson and Stahl experiment
