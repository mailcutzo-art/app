    explanation: NCERT defines the translational unit as the stretch flanked by the start codon and the stop codon that codes for a polypeptide. The UTRs lie outside it, before the start codon and after the stop codon, and they are not translated. The start codon AUG is the first codon of the unit, not part of a UTR.
  - id: bio-molbasis-351
    topic: molbasis-translation
