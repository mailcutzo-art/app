    explanation: NCERT says that at the end of translation a release factor binds to the stop codon, terminating translation and releasing the complete polypeptide from the ribosome. It does not bind to the start codon, the 5' UTR or the anticodon of a tRNA.
  - id: bio-molbasis-332
