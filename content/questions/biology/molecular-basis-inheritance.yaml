    options:
      - '1 : 1'
      - '1 : 7'
      - '1 : 3'
      - '3 : 1'
    answer: 2
    explanation: 'In 60 minutes there are 3 generations, so one parental molecule gives 2^3 = 8 molecules. Only 2 hold a ^{15}N parental strand (hybrid) and the other 6 are light, so hybrid : light = 2 : 6 = 1 : 3.'
  - id: bio-molbasis-139
    topic: molbasis-replication
