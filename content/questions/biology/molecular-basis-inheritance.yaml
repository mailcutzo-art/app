      - Both Statement I and Statement II are incorrect
      - Statement I is correct but Statement II is incorrect
      - Statement I is incorrect but Statement II is correct
    answer: 2
    explanation: Statement I is correct. Statement II is incorrect because the phosphate is linked to the 5′-OH of the nucleoside through a phosphoester linkage; the 3′-5′ phosphodiester linkage is the one that joins two nucleotides.
  - id: bio-molbasis-030
    topic: molbasis-dna-structure
