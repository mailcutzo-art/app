    answer: 1
    explanation: NCERT states that when the small subunit encounters an mRNA, the process of translation of the mRNA to protein begins. The large subunit joins later and carries the sites that hold the incoming amino acids, and the release factor acts only at the end.
  - id: bio-molbasis-329
