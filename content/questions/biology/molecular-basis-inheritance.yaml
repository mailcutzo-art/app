      - R cells became virulent simply by being injected into a mouse
      - the mouse converted the heat-killed S cells into live S cells
    answer: 1
    explanation: Heat-killed S cells (C) and live R cells (B) alone did not kill the mice, but together (D) they did, and live S bacteria were recovered. A transforming principle from the dead S cells had converted the R cells into virulent S cells.
  - id: bio-molbasis-124
    topic: molbasis-genetic-material
