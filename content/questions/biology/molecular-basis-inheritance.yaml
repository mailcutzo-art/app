    diagram: 'Four panels (A-D) arranged in a row, each showing a syringe injecting bacteria into a mouse, with the outcome written beneath. Panel A: syringe labelled ''Live S (smooth, capsulated) bacteria'' injecting a mouse; result ''Mouse dies''. Panel B: syringe labelled ''Live R (rough, non-capsulated) bacteria''; result ''Mouse lives''. Panel C: syringe labelled ''Heat-killed S bacteria''; result ''Mouse lives''. Panel D: syringe labelled ''Heat-killed S bacteria + live R bacteria''; result ''Mouse dies'', with an arrow from the dead mouse to a plate labelled ''Live S bacteria recovered''.'
    tags: [diagram, griffith]
    stem: The figure shows four injections in Griffith's experiment. The result in panel D, compared with panels B and C, shows that
    options:
      - heat-killed S cells came back to life on their own
