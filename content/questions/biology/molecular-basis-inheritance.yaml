      - the tRNAs are made only after the mRNA is complete
    answer: 0
    explanation: In bacteria the mRNA needs no processing to become active, and transcription and translation take place in the same compartment as there is no nucleus separating cytosol from DNA. The mRNA is therefore translated while it is still being made, so the two processes are coupled.
  - id: bio-molbasis-343
    topic: molbasis-translation
