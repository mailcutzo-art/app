      Arrange the following in the order in which they were carried out, earliest first.
      I. Hershey and Chase experiment with ^{32}P and ^{35}S
      II. Griffith's transformation experiment on mice
      III. Biochemical characterisation of the transforming principle by Avery, MacLeod and McCarty
    options:
      - III, II, I
