    explanation: NCERT says that the clover-leaf is only the two-dimensional (secondary) picture of tRNA, while in actual structure the tRNA is a compact molecule that looks like an inverted L. It is not a double helix or a hairpin.
  - id: bio-molbasis-342
    topic: molbasis-translation
    subtopic: Translation in prokaryotes and eukaryotes
    concept: In bacteria transcription and translation are coupled because there is no nucleus and no mRNA processing
    category: concept
    format: direct
    difficulty: 3
