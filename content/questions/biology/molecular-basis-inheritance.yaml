    tags: [diagram, hershey-chase]
    stem: Which statement matches the figure of the Hershey-Chase experiment?
    options:
      - With ^{35}S the radioactivity is in the pellet with the bacteria, and with ^{32}P it is in the supernatant
      - With ^{35}S the radioactivity is in the supernatant with the viral coats, and with ^{32}P it is in the pellet with the bacteria
      - In both sets the radioactivity is found mainly in the pellet
      - In both sets the radioactivity is found mainly in the supernatant
    answer: 1
    explanation: The ^{35}S-labelled coats are removed by blending and stay in the supernatant, while ^{32}P-labelled DNA enters the bacteria, which are found in the pellet. This shows that DNA, not protein, passes into the bacteria.
  - id: bio-molbasis-125
    topic: molbasis-genetic-material
    subtopic: Avery, MacLeod and McCarty
