    tags: [meselson-stahl, cscl]
    stem: In the Meselson and Stahl experiment, ^{15}N DNA was separated from ^{14}N DNA by
    options:
      - electrophoresis in an agarose gel
      - paper chromatography
      - centrifugation in a CsCl density gradient
      - precipitation with ethanol
    answer: 2
    explanation: The two kinds of DNA differ in density, so they form separate bands on centrifugation in a caesium chloride (CsCl) density gradient. Electrophoresis and paper chromatography separate molecules by charge or solubility, not by density.
  - id: bio-molbasis-136
    topic: molbasis-replication
