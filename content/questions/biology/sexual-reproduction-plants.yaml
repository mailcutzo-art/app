questions:
  - id: bio-sexplant-001
    topic: sexplant-apomixis-seed-fruit
    subtopic: Apomixis
    concept: Apomixis is the production of seeds without fertilisation
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [apomixis, definition]
    stem: Apomixis is best described as the production of
    options:
      - fruits without fertilisation of the ovary
      - seeds without fertilisation
      - seeds only after cross-pollination
      - more than one embryo from a single zygote
    answer: 1
    explanation: NCERT defines apomixis as the production of seeds without fertilisation. The production of a fruit without fertilisation is parthenocarpy, and more than one embryo in a seed is polyembryony.
  - id: bio-sexplant-002
    topic: sexplant-apomixis-seed-fruit
    subtopic: Apomixis
    concept: In one type of apomixis the diploid egg cell is formed without reduction division
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [apomixis, diploid-egg]
    stem: In some apomictic species, the egg cell is diploid and develops into an embryo without fertilisation. It is diploid because it is formed without
    options:
      - reduction division
      - mitotic division of the megaspore
      - the presence of a nucellus
      - the entry of the pollen tube
    answer: 0
    explanation: NCERT states that in some apomictic species the diploid egg cell is formed without reduction division (meiosis) and develops into the embryo without fertilisation. The egg is therefore diploid, like the parent.
  - id: bio-sexplant-003
    topic: sexplant-apomixis-seed-fruit
    subtopic: Polyembryony
    concept: Occurrence of more than one embryo in a seed is polyembryony
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [polyembryony, definition]
    stem: The occurrence of more than one embryo in a seed is called
    options:
      - apomixis
      - parthenocarpy
      - polyembryony
      - parthenogenesis
    answer: 2
    explanation: Polyembryony is the occurrence of more than one embryo in a seed. Apomixis is seed formation without fertilisation, and parthenocarpy is fruit formation without fertilisation.
  - id: bio-sexplant-004
    topic: sexplant-apomixis-seed-fruit
    subtopic: Apomixis
    concept: Nucellar cells protrude into the embryo sac and form embryos in Asteraceae and grasses
    category: factual
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [apomixis, nucellar-embryo]
    stem: In many Asteraceae and grasses, the embryos of apomictic seeds develop from the cells of the
    options:
      - synergids
      - antipodals
      - central cell
      - nucellus surrounding the embryo sac
    answer: 3
    explanation: NCERT states that in many Asteraceae and grasses some nucellar cells surrounding the embryo sac start dividing, protrude into the embryo sac and develop into embryos. Synergids, antipodals and the central cell belong to the embryo sac itself.
  - id: bio-sexplant-005
    topic: sexplant-apomixis-seed-fruit
    subtopic: Seed dormancy
    concept: Abscisic acid induces seed dormancy and helps seeds withstand desiccation
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [dormancy, abscisic-acid]
    stem: Which plant growth regulator induces seed dormancy and helps seeds withstand desiccation and other unfavourable conditions?
    options:
      - Gibberellic acid
      - Abscisic acid
      - Cytokinin
      - Indole-3-acetic acid
    answer: 1
    explanation: Abscisic acid plays an important role in seed development, maturation and dormancy, and by inducing dormancy it helps seeds to withstand desiccation and other conditions unfavourable for growth. It generally acts as an antagonist to gibberellins.
  - id: bio-sexplant-006
    topic: sexplant-apomixis-seed-fruit
    subtopic: Fruit development
    concept: The ovary wall develops into the pericarp of the fruit
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [pericarp, fruit]
    stem: The wall of the ovary develops into the wall of the fruit, which is called the
    options:
      - testa
      - tegmen
      - perisperm
      - pericarp
    answer: 3
    explanation: The ovary wall becomes the fruit wall, called the pericarp. The testa and tegmen are layers of the seed coat, and the perisperm is a persistent remnant of the nucellus.
  - id: bio-sexplant-007
    topic: sexplant-apomixis-seed-fruit
    subtopic: Fruit development
    concept: In apple the thalamus contributes to the fruit, making it a false fruit
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [false-fruit, thalamus]
    stem: Which of the following is a false fruit, in which the thalamus also contributes to fruit formation?
    options:
      - Apple
      - Mango
      - Guava
      - Groundnut
    answer: 0
    explanation: NCERT gives apple, strawberry and cashew as false fruits, where the thalamus also contributes to the fruit. Mango, guava and groundnut develop only from the ovary and are true fruits.
  - id: bio-sexplant-008
    topic: sexplant-apomixis-seed-fruit
    subtopic: Parthenocarpy
    concept: Parthenocarpic fruits such as banana develop without fertilisation
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [parthenocarpy, banana]
    stem: Fruits that develop without fertilisation of the ovary, as in banana, are called
    options:
      - false fruits
      - aggregate fruits
      - parthenocarpic fruits
      - drupes
    answer: 2
    explanation: A fruit formed without fertilisation, as in banana, is a parthenocarpic fruit. False fruits include the thalamus in the fruit, and drupes are one-seeded fleshy fruits such as mango.
  - id: bio-sexplant-009
    topic: sexplant-apomixis-seed-fruit
    subtopic: Seed structure
    concept: Persistent nucellus in a seed is the perisperm, as in black pepper and beet
    category: factual
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [perisperm, nucellus]
    stem: The residual, persistent nucellus found in the seeds of black pepper and beet is called
    options:
      - endosperm
      - perisperm
      - scutellum
      - pericarp
    answer: 1
    explanation: In some seeds, such as black pepper and beet, remnants of the nucellus persist, and this residual nucellus is the perisperm. The endosperm is a different tissue formed from the primary endosperm nucleus.
  - id: bio-sexplant-010
    topic: sexplant-apomixis-seed-fruit
    subtopic: Seed structure
    concept: The micropyle of a mature seed lets oxygen and water enter during germination
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [micropyle, germination]
    stem: After seed maturation, the micropyle remains as a small pore. Its role is to facilitate the
    options:
      - escape of carbon dioxide during seed development
      - storage of food for the embryo
      - entry of the pollen tube into the ovule
      - entry of oxygen and water into the seed during germination
    answer: 3
    explanation: NCERT states that the micropyle remains as a small pore in the seed coat and facilitates the entry of oxygen and water into the seed during germination. Entry of the pollen tube is its role in the ovule before fertilisation.
  - id: bio-sexplant-011
    topic: sexplant-apomixis-seed-fruit
    subtopic: Seed structure
    concept: The seed coats are formed by hardening of the integuments of the ovule
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [seed-coat, integuments]
    stem: The tough protective coats of a seed are formed by the hardening of the
    options:
      - integuments of the ovule
      - wall of the ovary
      - nucellus
      - endosperm
    answer: 0
    explanation: The integuments of the ovule harden to form the tough protective seed coats. The ovary wall forms the pericarp of the fruit.
  - id: bio-sexplant-012
    topic: sexplant-apomixis-seed-fruit
    subtopic: Seed dormancy
    concept: A mature seed is dehydrated to about 10-15 per cent moisture by mass
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [seed-maturation, moisture]
    stem: A mature seed becomes dry and contains moisture, by mass, of about
    options:
      - 40-50 per cent
      - 25-30 per cent
      - 10-15 per cent
      - 1-2 per cent
    answer: 2
    explanation: As the seed matures its water content is reduced and the seed becomes dry, with 10-15 per cent moisture by mass. The embryo's metabolic activity slows down and it may enter dormancy.
  - id: bio-sexplant-013
    topic: sexplant-apomixis-seed-fruit
    subtopic: Seed structure
    concept: Pea and groundnut are non-albuminous seeds with the endosperm consumed before maturation
    category: factual
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [non-albuminous, endosperm]
    stem: A non-albuminous seed, in which the endosperm is completely consumed before the seed matures, is that of
    options:
      - wheat
      - groundnut
      - castor
      - maize
    answer: 1
    explanation: In non-albuminous seeds such as pea, groundnut and beans, the endosperm is completely used up by the developing embryo before maturation. Wheat, maize, castor, barley and sunflower have albuminous seeds that retain endosperm.
  - id: bio-sexplant-014
    topic: sexplant-apomixis-seed-fruit
    subtopic: Fruit development
    concept: After fertilisation the ovary develops into the fruit
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [fruit, post-fertilisation]
    stem: After fertilisation, the part of the flower that generally develops into the fruit is the
    options:
      - ovary
      - stigma
      - style
      - petals
    answer: 0
    explanation: After fertilisation the sepals, petals, stamens, style and stigma generally wither and fall off, while the ovary develops into the fruit and the ovules into seeds.
  - id: bio-sexplant-015
    topic: sexplant-apomixis-seed-fruit
    subtopic: Fruit development
    concept: In coconut, a drupe, the mesocarp is fibrous
    category: factual
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [drupe, mesocarp]
    stem: Mango and coconut are both drupes. In coconut the mesocarp is
    options:
      - thin and membranous
      - fleshy and edible
      - stony and hard
      - fibrous
    answer: 3
    explanation: In a drupe the pericarp has an epicarp, a mesocarp and an endocarp. In mango the mesocarp is fleshy and edible, but in coconut it is fibrous, and the endocarp is the stony hard layer.
  - id: bio-sexplant-016
    topic: sexplant-apomixis-seed-fruit
    subtopic: Apomixis
    concept: Identify the incorrect statement about apomixis
    category: concept
    format: statements
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [apomixis, hybrid]
    stem: Which one of the following statements about apomixis is NOT correct?
    options:
      - It is the production of seeds without fertilisation.
      - In many Asteraceae and grasses, nucellar cells protrude into the embryo sac and form embryos.
      - When hybrids are made into apomicts, their progeny show segregation of characters.
      - It is a form of asexual reproduction that mimics sexual reproduction.
    answer: 2
    explanation: If hybrids are made apomictic, there is no segregation of characters in the progeny, so farmers can reuse the seeds each year. The other three statements agree with NCERT.
  - id: bio-sexplant-017
    topic: sexplant-apomixis-seed-fruit
    subtopic: Seed structure
    concept: Only the perisperm statement is correct among four seed and fruit statements
    category: concept
    format: statements
    difficulty: 4
    time: 85
    ncert: true
    battle: false
    tags: [perisperm, false-fruit, parthenocarpy]
    stem: Which one of the following statements about seeds and fruits is correct?
    options:
      - In apple, a true fruit, the thalamus also contributes to the fruit.
      - Parthenocarpic fruits such as banana develop after fertilisation of the egg.
      - In albuminous seeds the endosperm is completely consumed before the seed matures.
      - In black pepper and beet, a persistent remnant of the nucellus forms the perisperm.
    answer: 3
    explanation: Perisperm is the persistent nucellus of black pepper and beet. Apple is a false fruit, banana develops without fertilisation, and it is the non-albuminous seed whose endosperm is consumed before maturity.
  - id: bio-sexplant-018
    topic: sexplant-apomixis-seed-fruit
    subtopic: Seed structure
    concept: Identify what is not an advantage of seed formation
    category: concept
    format: statements
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [seed, advantages]
    stem: Which one of the following is NOT an advantage of seed formation in flowering plants?
    options:
      - Seed formation is less dependable because pollination and fertilisation need water.
      - Seeds have adaptations for dispersal to new habitats, helping the species to colonise other areas.
      - Food reserves nourish the young seedling until it can photosynthesise on its own.
      - Being products of sexual reproduction, seeds generate new genetic combinations leading to variations.
    answer: 0
    explanation: NCERT says that pollination and fertilisation are independent of water, which makes seed formation more dependable, so the first statement is wrong. The other three are listed advantages of seeds.
  - id: bio-sexplant-019
    topic: sexplant-apomixis-seed-fruit
