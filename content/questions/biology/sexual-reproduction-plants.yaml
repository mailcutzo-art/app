    category: application
    format: case
    difficulty: 4
    time: 85
    ncert: false
    battle: false
    tags: [papaya, dioecy, case]
    stem: A farmer has a solitary papaya plant bearing only female flowers, with no other papaya plant nearby. Although bees visit it, no fruit sets. Which explanation is best?
    options:
      - Papaya flowers are self-incompatible, so pollen germination is blocked
      - Papaya is dioecious, so with no male plant to supply pollen, neither autogamy nor geitonogamy can occur
