  - id: bio-sexplant-023
    topic: sexplant-apomixis-seed-fruit
    subtopic: Apomixis
    concept: Apomixis is asexual, and apomictic embryos may arise from a zygote only in sexual seeds
    category: concept
    format: statement-pair
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [apomixis, asexual]
    stem: |-
      Statement I: Apomixis is a form of asexual reproduction that mimics sexual reproduction.
      Statement II: In apomixis the embryo always develops from a zygote formed after syngamy.
    options:
      - Both Statement I and Statement II are correct
      - Both Statement I and Statement II are incorrect
      - Statement I is correct but Statement II is incorrect
      - Statement I is incorrect but Statement II is correct
    answer: 2
    explanation: Statement I is correct as NCERT describes apomixis. Statement II is incorrect because apomictic embryos develop from a diploid egg or from nucellar cells without fertilisation, so no zygote is formed by syngamy.
  - id: bio-sexplant-024
    topic: sexplant-apomixis-seed-fruit
    subtopic: Seed dormancy
    concept: Swapped plants for the 10000-year and 2000-year viable seeds
    category: factual
    format: statement-pair
    difficulty: 4
    time: 85
    ncert: true
    battle: false
    tags: [seed-viability, longevity]
    stem: |-
      Statement I: The seed excavated from the Arctic tundra, which germinated and flowered after about 10,000 years of dormancy, was that of *Phoenix dactylifera*.
      Statement II: The seed about 2000 years old, found during excavation at King Herod's palace near the Dead Sea, was that of *Lupinus arcticus*.
    options:
      - Both Statement I and Statement II are correct
      - Both Statement I and Statement II are incorrect
      - Statement I is correct but Statement II is incorrect
      - Statement I is incorrect but Statement II is correct
    answer: 1
    explanation: Both statements swap the plants. The Arctic tundra seed after about 10,000 years was *Lupinus arcticus*, and the 2000-year-old seed from King Herod's palace was the date palm *Phoenix dactylifera*.
