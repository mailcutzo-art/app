    answer: 3
    explanation: Large amounts of water can be reabsorbed from the collecting duct, a long duct extending from the cortex to the inner medulla, to produce a concentrated urine. The ascending limb is impermeable to water, and the capsule and glomerulus are concerned with filtration.
  - id: bio-excr-354
