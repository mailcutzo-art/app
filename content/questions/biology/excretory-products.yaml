    explanation: Since about 180 L of filtrate is formed daily and only 1.5 L of urine is released, nearly 99 per cent of the filtrate has to be reabsorbed by the renal tubules. The 70–80 per cent figure belongs to the PCT alone.
  - id: bio-excr-332
