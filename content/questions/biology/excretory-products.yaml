      - 6.25 nL
    answer: 0
    explanation: Two kidneys have about 2 × 10^6 nephrons. 125 mL = 125 × 10^6 nL, so one nephron forms 125 × 10^6 / (2 × 10^6) = 62.5 nL per minute. 125 nL results from using one kidney's nephrons only.
