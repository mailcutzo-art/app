    answer: 2
    explanation: Tubular secretion is important because it helps in the maintenance of the ionic and acid-base balance of body fluids. Filtrate formation is the job of the glomerulus, nutrients are reabsorbed in the PCT, and medullary osmolarity is maintained by the loop of Henle.
