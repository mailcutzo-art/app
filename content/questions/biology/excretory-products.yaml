    answer: 1
    explanation: Glucose passes into the filtrate, but the tubular epithelial cells reabsorb it actively, so it is normally absent from urine (glucose in urine, glycosuria, points to diabetes mellitus). It is not held back at the glomerulus because only plasma proteins are retained.
  - id: bio-excr-353
