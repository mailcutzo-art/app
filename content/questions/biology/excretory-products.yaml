    explanation: 60 per cent of 125 = 75 mL per minute, and 75 × 1440 = 1,08,000 mL = 108 L. A fall to 60 per cent is not the same as a fall by 60 per cent, which would give 72 L; 75 L forgets to convert mL per minute to L per day.
  - id: bio-excr-360
