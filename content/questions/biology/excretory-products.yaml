      - Loop of Henle
      - Collecting duct
    answer: 1
    explanation: NCERT states that nearly all essential nutrients, and 70–80 per cent of the electrolytes and water, are reabsorbed by the PCT. The loop of Henle shows minimal reabsorption, DCT reabsorption is conditional, and the collecting duct reabsorbs water to concentrate urine.
  - id: bio-excr-338
