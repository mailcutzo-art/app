      - Statement I is incorrect but Statement II is correct
    answer: 3
    explanation: Sterols, hydrocarbons and waxes are eliminated by sebaceous glands through sebum, not by sweat glands, so Statement I is wrong. NCERT mentions that small amounts of nitrogenous wastes could be eliminated through saliva too, so Statement II is correct.
  - id: bio-excr-017
