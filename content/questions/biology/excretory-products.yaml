    answer: 0
    explanation: NCERT says nitrogenous wastes are absorbed by passive transport and that reabsorption of water also occurs passively in the initial segments. Glucose, amino acids and Na^+ are reabsorbed actively, so each of the other options includes an actively reabsorbed substance.
  - id: bio-excr-334
