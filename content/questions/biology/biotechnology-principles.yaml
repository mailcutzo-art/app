    answer: 1
    explanation: Transformation is the introduction of a piece of DNA into a host bacterium (P-3). A selectable marker helps select transformed cells (Q-1). Insertional inactivation is loss of gene function through insertion of alien DNA within the gene (R-4), and a vector, such as a plasmid, carries alien DNA into the host (S-2).
  - id: bio-biotech1-485
    topic: biotech1-selectable-markers
    subtopic: pBR322 selection
    concept: Sequence of steps in picking out recombinants of pBR322 cloned at BamH I
    category: application
