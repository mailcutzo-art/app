    tags: [transformation, vector, selectable-marker]
    stem: |-
      Match List I with List II.
      List I
      P. Transformation
      Q. Selectable marker
      R. Insertional inactivation
      S. Vector
      List II
      1. A gene that helps in selecting the transformed cells
      2. A plasmid that carries alien DNA into a host
      3. Introduction of a piece of DNA into a host bacterium
      4. Loss of gene function due to insertion of alien DNA within the gene
    options:
      - P-1, Q-3, R-4, S-2
