questions:
  - id: bio-biotech1-001
    topic: biotech1-bioreactors
    subtopic: Bioreactor
    concept: A bioreactor is a vessel in which raw materials are biologically converted into products using cells
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [bioreactor, definition]
    stem: Vessels in which raw materials are biologically converted into specific products using microbial, plant, animal or human cells are called
    options:
      - thermal cyclers
      - gene guns
      - electrophoresis tanks
      - bioreactors
    answer: 3
    explanation: NCERT describes bioreactors as vessels in which raw materials are biologically converted into specific products, individual enzymes and so on, using microbial, plant, animal or human cells. A thermal cycler runs PCR, a gene gun delivers DNA into cells and an electrophoresis tank separates DNA fragments.
  - id: bio-biotech1-002
    topic: biotech1-bioreactors
    subtopic: Types of bioreactors
    concept: The most commonly used bioreactors are of the stirring type
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [stirred-tank, bioreactor]
    stem: The type of bioreactor that is most commonly used for large-scale culture is the
    options:
      - stirring type (stirred-tank)
      - static type without any agitation
      - gravity-flow type
      - centrifugal type
    answer: 0
    explanation: NCERT states that the most commonly used bioreactors are of the stirring type, the stirred-tank reactor. The other designs named in the options are not described in NCERT.
  - id: bio-biotech1-003
    topic: biotech1-bioreactors
    subtopic: Scale of culture
    concept: Bioreactors process culture volumes of 100-1000 litres
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [bioreactor, scale-up]
    stem: The volume of culture that can be processed in a bioreactor is of the order of
    options:
      - 1–10 millilitres
      - 10–100 millilitres
      - 100–1000 millilitres
      - 100–1000 litres
    answer: 3
    explanation: NCERT explains that small-volume cultures cannot give appreciable quantities of a product, so bioreactors in which 100–1000 litres of culture can be processed were developed. Millilitre volumes are laboratory scale.
  - id: bio-biotech1-004
    topic: biotech1-bioreactors
    subtopic: Downstream processing
    concept: Separation and purification of the product together form downstream processing
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [downstream-processing]
    stem: The processes of separation and purification of a product after the biosynthetic stage are collectively called
    options:
      - upstream processing
      - downstream processing
      - insertional inactivation
      - continuous culture
    answer: 1
    explanation: After the biosynthetic stage a product passes through separation and purification, which NCERT calls downstream processing, before it is ready for marketing. Continuous culture is a way of growing cells, and insertional inactivation is used to select recombinants.
  - id: bio-biotech1-005
    topic: biotech1-bioreactors
    subtopic: Stirrer
    concept: The stirrer facilitates even mixing and oxygen availability throughout the bioreactor
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [stirred-tank, agitator]
    stem: In a stirred-tank bioreactor, the stirrer mainly facilitates
    options:
      - even mixing and oxygen availability throughout the bioreactor
      - separation of the product from the cells
      - removal of the used medium from the vessel
      - cooling of the culture to a fixed temperature
    answer: 0
    explanation: NCERT states that the stirrer facilitates even mixing and oxygen availability throughout the bioreactor. Separation of the product belongs to downstream processing, and temperature is handled by the temperature control system.
  - id: bio-biotech1-006
    topic: biotech1-bioreactors
    subtopic: Stirred-tank bioreactor
    concept: A cylindrical vessel or curved base of a stirred-tank reactor facilitates mixing of the contents
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [stirred-tank, design]
    stem: A stirred-tank reactor is usually cylindrical or has a curved base. This shape helps in
    options:
      - mixing of the reactor contents
      - preventing the entry of oxygen
      - sterilising the culture medium
      - separating the product from the cells
    answer: 0
    explanation: According to NCERT, the cylindrical vessel or the curved base facilitates the mixing of the reactor contents. It has nothing to do with excluding oxygen, sterilisation or purification of the product.
  - id: bio-biotech1-007
    topic: biotech1-bioreactors
    subtopic: Cells used in bioreactors
    concept: Bioreactors can use microbial, plant, animal or human cells
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [bioreactor, cells]
    stem: Which cells can be used in a bioreactor to convert raw materials into products?
    options:
      - Microbial, plant, animal or human cells
      - Only bacterial and fungal cells
      - Only bacterial cells
      - Only microbial and plant cells
    answer: 0
    explanation: NCERT says that a bioreactor can use microbial, plant, animal or human cells to convert raw materials into specific products. It is not restricted to bacteria or to microbes.
  - id: bio-biotech1-008
    topic: biotech1-bioreactors
    subtopic: Optimal growth conditions
    concept: A bioreactor provides temperature, pH, substrate, salts, vitamins and oxygen, not the gene sequence
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [bioreactor, growth-conditions]
    stem: A bioreactor provides optimal growth conditions by controlling all of these EXCEPT the
    options:
      - temperature of the culture
      - nucleotide sequence of the cloned gene
      - pH of the medium
      - availability of oxygen
    answer: 1
    explanation: NCERT lists temperature, pH, substrate, salts, vitamins and oxygen as the optimal growth conditions that a bioreactor provides. The sequence of the cloned gene is fixed during cloning, not by the bioreactor.
  - id: bio-biotech1-009
    topic: biotech1-bioreactors
    subtopic: Sampling ports
    concept: Sampling ports let small volumes of culture be withdrawn periodically
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [bioreactor, sampling-ports]
    stem: Sampling ports are provided in a bioreactor so that
    options:
      - the whole culture can be drained at one time
      - foreign DNA can be added to the cells
      - the product can be mixed with preservatives
      - small volumes of culture can be withdrawn periodically
    answer: 3
    explanation: NCERT mentions sampling ports through which small volumes of the culture can be withdrawn periodically, for example to monitor growth. They are not meant for draining the vessel, adding DNA or adding preservatives.
  - id: bio-biotech1-010
    topic: biotech1-bioreactors
    subtopic: Foreign gene in the host
    concept: Alien DNA transferred into a bacterial, plant or animal cell gets multiplied
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [rdna, multiplication]
    stem: When alien DNA in a cloning vector is transferred into a bacterial, plant or animal cell, the alien DNA
    options:
      - is always expressed as a protein at once
      - is destroyed by the host cell
      - gets multiplied in the host cell
      - replaces the entire host genome
    answer: 2
    explanation: NCERT states that alien DNA inserted into a cloning vector and transferred into a bacterial, plant or animal cell gets multiplied. It is not automatically expressed, because a foreign gene is expressed only under appropriate conditions.
  - id: bio-biotech1-011
    topic: biotech1-bioreactors
    subtopic: Product formulation
    concept: After purification the product is formulated with suitable preservatives
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [formulation, downstream-processing]
    stem: After separation and purification, the product from a bioreactor is formulated with
    options:
      - restriction endonucleases
      - selectable markers
      - suitable preservatives
      - fresh log-phase cells
    answer: 2
    explanation: NCERT says the product has to be formulated with suitable preservatives before it is marketed. Restriction endonucleases and selectable markers are cloning tools, and log-phase cells belong to the culture stage.
  - id: bio-biotech1-012
    topic: biotech1-bioreactors
    subtopic: Recombinant protein
    concept: A protein gene expressed in a heterologous host gives a recombinant protein
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [recombinant-protein, heterologous-host]
    stem: A protein-coding gene expressed in a heterologous host gives rise to a
    options:
      - native protein
      - recombinant protein
      - vector protein
      - restriction protein
    answer: 1
    explanation: NCERT states that when a protein-encoding gene is expressed in a heterologous host, the protein is called a recombinant protein. The other terms are not used for this in the chapter.
  - id: bio-biotech1-013
    topic: biotech1-bioreactors
    subtopic: Aim of recombinant DNA technology
    concept: The ultimate aim of most recombinant technologies is to produce a desirable protein
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [rdna, protein-expression]
    stem: In almost all recombinant DNA technologies, the ultimate aim is to produce
    options:
      - more copies of the vector
      - a new restriction enzyme
      - a smaller host genome
      - a desirable protein
    answer: 3
    explanation: NCERT states that the ultimate aim in almost all recombinant technologies is to produce a desirable protein, so the recombinant DNA has to be expressed. Vectors and enzymes are only tools used on the way.
  - id: bio-biotech1-014
    topic: biotech1-bioreactors
    subtopic: Clinical trials
    concept: Formulations of bioreactor products undergo thorough clinical trials as in the case of drugs
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [clinical-trials, formulation]
    stem: Like drugs, the formulated products of bioreactors have to undergo thorough
    options:
      - restriction mapping
      - gel electrophoresis
      - clinical trials
      - insertional inactivation
    answer: 2
    explanation: NCERT states that such formulations have to undergo thorough clinical trials, as in the case of drugs. Restriction mapping, gel electrophoresis and insertional inactivation are cloning and analysis techniques.
  - id: bio-biotech1-015
    topic: biotech1-bioreactors
    subtopic: Continuous culture
    concept: Continuous culture keeps cells in the physiologically most active log (exponential) phase
    category: concept
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [continuous-culture, log-phase]
    stem: Cells in a continuous culture system are maintained in their physiologically most active phase, the
    options:
      - lag phase
      - stationary phase
      - log (exponential) phase
      - decline phase
    answer: 2
    explanation: In a continuous culture system the used medium is drained from one side and fresh medium is added from the other, which maintains the cells in their physiologically most active log (exponential) phase. This gives a larger biomass and a higher yield of the protein.
  - id: bio-biotech1-016
    topic: biotech1-bioreactors
    subtopic: Quality control
    concept: Downstream processing and quality control testing vary from product to product
    category: concept
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [quality-control, downstream-processing]
    stem: Downstream processing and quality control testing of bioreactor products
    options:
      - are identical for every product
      - are done inside the bioreactor while cells grow
      - are needed only for enzymes
      - vary from product to product
    answer: 3
    explanation: NCERT states that the downstream processing and quality control testing vary from product to product, and that strict quality control testing is required for each product. Both follow the biosynthetic stage and are not limited to enzymes.
  - id: bio-biotech1-017
    topic: biotech1-bioreactors
    subtopic: Sparged bioreactor
    concept: In a sparged stirred-tank bioreactor sterile air bubbles are passed through the culture
    category: concept
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [sparged, stirred-tank]
    stem: A sparged stirred-tank bioreactor differs from a simple stirred-tank bioreactor in that sterile air is
    options:
      - used only to cool the culture
      - bubbled (sparged) through the culture
      - passed through the used medium after it is drained
      - blown over the surface of the culture without entering it
    answer: 1
    explanation: NCERT's figure contrasts a simple stirred-tank bioreactor with a sparged one, through which sterile air bubbles are sparged; the text says air can alternatively be bubbled through the reactor. Sparging supplies air to the culture; it does not cool it or act on the used medium.
  - id: bio-biotech1-018
    topic: biotech1-bioreactors
    subtopic: Foreign gene expression
    concept: A foreign gene gets expressed under appropriate conditions only
    category: concept
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [gene-expression, rdna]
    stem: After a foreign gene is cloned into a host, its expression to give the protein occurs
    options:
      - automatically under all conditions
      - only after the host cell is lysed
      - only under appropriate conditions
      - only when the culture exceeds 100 litres
    answer: 2
    explanation: NCERT states that the foreign gene gets expressed under appropriate conditions only, so these have to be optimised. Expression is not automatic, and it does not depend on the culture volume.
  - id: bio-biotech1-019
    topic: biotech1-bioreactors
    subtopic: Scale up
    concept: Large-scale production is considered after cloning the gene and optimising conditions for its expression
    category: concept
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [scale-up, expression]
    stem: Large-scale production of a recombinant protein is considered after the gene has been cloned and
    options:
      - the host cells have been killed
      - the product has been formulated with preservatives
      - clinical trials of the product are complete
      - the conditions for its expression have been optimised
    answer: 3
    explanation: After the gene of interest is cloned and the conditions to induce expression of the target protein are optimised, NCERT says one has to consider producing the protein on a large scale. Formulation and clinical trials come at the end, after separation and purification.
  - id: bio-biotech1-020
    topic: biotech1-bioreactors
    subtopic: Small-scale culture
    concept: Small-scale cultures can be used to extract and purify the protein, but not for large quantities
    category: concept
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [small-scale-culture, scale-up]
    stem: Cells harbouring a cloned gene of interest, grown on a small scale in the laboratory, can be used for
    options:
      - supplying the protein in appreciable commercial quantities
      - skipping the separation and purification steps
      - processing 100–1000 litres of culture in one vessel
      - extracting the desired protein and purifying it by separation techniques
    answer: 3
    explanation: NCERT notes that small-scale cultures of cells with the cloned gene can be used to extract the desired protein and purify it by separation techniques. Small-volume cultures cannot yield appreciable quantities, which is why bioreactors are used.
  - id: bio-biotech1-021
    topic: biotech1-bioreactors
    subtopic: Bioreactor
    concept: A bioreactor provides optimal growth conditions, unlike PCR, restriction enzymes or electrophoresis
    category: concept
    format: statements
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [bioreactor, growth-conditions]
    stem: Which of the following statements about a bioreactor is correct?
    options:
      - It amplifies a gene in vitro with a thermostable DNA polymerase
      - It provides optimal growth conditions such as temperature, pH, substrate, salts, vitamins and oxygen
      - It cuts DNA at specific sites to produce sticky ends
      - It separates DNA fragments by size under an electric field
    answer: 1
    explanation: 'A bioreactor provides optimal conditions for the cells: temperature, pH, substrate, salts, vitamins and oxygen. Amplifying a gene is done by PCR with a thermostable polymerase, cutting DNA by restriction endonucleases and separating fragments by gel electrophoresis.'
  - id: bio-biotech1-022
    topic: biotech1-bioreactors
    subtopic: Stirred-tank bioreactor
    concept: Air can alternatively be bubbled through a stirred-tank reactor, so sparging is possible
    category: application
    format: statements
    difficulty: 4
    time: 85
    ncert: true
    battle: false
    tags: [stirred-tank, sparged]
    stem: Which of the following statements about stirred-tank bioreactors is incorrect?
    options:
      - A stirred-tank reactor is usually cylindrical or has a curved base to facilitate mixing of its contents
      - The stirrer facilitates even mixing and oxygen availability throughout the bioreactor
      - The stirred-tank design excludes sparging, so air can never be bubbled through the reactor
      - Sampling ports allow small volumes of culture to be withdrawn periodically
    answer: 2
    explanation: NCERT says that, alternatively, air can be bubbled through the reactor, and its figure shows a sparged stirred-tank bioreactor. The statement that air can never be bubbled is therefore incorrect; the other three statements are given in NCERT.
  - id: bio-biotech1-023
    topic: biotech1-bioreactors
    subtopic: Sterile ambience
    concept: Sterile ambience in chemical engineering lets only the desired cell grow in large quantities
    category: concept
    format: statements
    difficulty: 4
    time: 85
    ncert: true
    battle: false
    tags: [sterile-ambience, chemical-engineering]
    stem: Which of the following statements about the production of biotechnological products on a large scale is correct?
    options:
      - Genetic engineering alone, without chemical engineering processes, is enough to manufacture products in large quantities
      - Maintaining a sterile ambience in chemical engineering processes allows only the desired microbe or cell to grow in large quantities
      - Downstream processing is carried out in the bioreactor while the cells are still growing
      - Bioreactors can be used only when the host cell is a plant cell
    answer: 1
    explanation: 'NCERT names two core techniques of modern biotechnology: genetic engineering, and the maintenance of a sterile ambience in chemical engineering processes so that only the desired microbe or cell grows in large quantities. Downstream processing follows the biosynthetic stage, and bioreactors use microbial, plant, animal or human cells.'
  - id: bio-biotech1-024
    topic: biotech1-bioreactors
    subtopic: Bioreactor parts
    concept: A bioreactor has agitator, oxygen delivery, foam, temperature and pH control systems and sampling ports
    category: application
    format: multi-statement
