    explanation: Each strand is cut between G and A, reading 5′→3′. The left fragment keeps 3′–CTTAA–5′ on the bottom strand, so its overhang is 3′–TTAA–5′, which is 5′–AATT–3′. The right fragment keeps 5′–AATTC–3′ on the top strand, with the same 5′–AATT–3′ overhang. Reading the bottom strand left to right gives TTAA, which is the trap.
