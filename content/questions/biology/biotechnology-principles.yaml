    diagram: Three circular plasmid maps in a row labelled P1, P2 and P3. Each map shows a box 'ori', an arc 'amp^R' and an arc 'tet^R'. In P1 both arcs are unbroken and there is no insert. In P2 a thick black block labelled 'alien DNA' interrupts the middle of the tet^R arc. In P3 a thick black block labelled 'alien DNA' interrupts the middle of the amp^R arc.
