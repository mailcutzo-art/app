      Which of the following are parts of a bioreactor?
      I. Gel-casting tray
      II. Agitator system
      III. Foam control system
      IV. Sampling ports
    options:
      - I, II and III only
      - II, III and IV only
      - I, III and IV only
      - I, II and IV only
    answer: 1
    explanation: NCERT lists an agitator system, an oxygen delivery system, a foam control system, a temperature control system, a pH control system and sampling ports as parts of a bioreactor. The gel-casting tray is used in gel electrophoresis, so I is not a part.
  - id: bio-biotech1-025
    topic: biotech1-bioreactors
    subtopic: Recombinant protein production
    concept: Combined statements on recombinant proteins, small-scale cultures and scale-up
    category: application
    format: multi-statement
    difficulty: 4
    time: 85
    ncert: true
    battle: false
    tags: [recombinant-protein, scale-up]
    stem: |-
      Which of the following statements about producing a recombinant protein are correct?
      I. A protein-coding gene expressed in a heterologous host gives a recombinant protein.
      II. Cells with the cloned gene can be grown on a small scale in the laboratory to extract and purify the protein.
      III. Small-volume cultures give appreciable quantities of the product.
      IV. Large-scale production is considered after the expression conditions have been optimised.
    options:
      - I, II and III only
      - II, III and IV only
      - I, II and IV only
      - I, III and IV only
    answer: 2
    explanation: I, II and IV are given in NCERT. III is wrong because small-volume cultures cannot yield appreciable quantities of the product, which is why bioreactors that handle 100–1000 litres are needed.
  - id: bio-biotech1-026
    topic: biotech1-bioreactors
    subtopic: Downstream processing
    concept: 'Stages after the biosynthetic stage: formulation, clinical trials and product-specific quality control'
    category: application
    format: multi-statement
    difficulty: 4
    time: 85
    ncert: true
    battle: false
    tags: [downstream-processing, formulation]
    stem: |-
      Which of the following statements about the stages after the biosynthetic stage are correct?
      I. Downstream processing is carried out before the biosynthetic stage.
      II. The product has to be formulated with suitable preservatives.
      III. Formulations have to undergo thorough clinical trials as in the case of drugs.
      IV. Quality control testing is the same for every product.
    options:
      - II and III only
      - I and II only
      - III and IV only
      - I and IV only
    answer: 0
    explanation: II and III are given in NCERT. I is wrong because downstream processing follows the biosynthetic stage, and IV is wrong because quality control testing varies from product to product.
  - id: bio-biotech1-027
    topic: biotech1-bioreactors
    subtopic: Bioreactor
    concept: Combined statements on cells used, sampling ports, working volume and growth conditions of a bioreactor
    category: application
    format: multi-statement
    difficulty: 4
    time: 85
    ncert: true
    battle: false
    tags: [bioreactor, growth-conditions]
    stem: |-
      Which of the following statements about a bioreactor are correct?
      I. It converts raw materials into products using only microbial cells.
      II. Its sampling ports allow small volumes of culture to be withdrawn periodically.
      III. It processes culture volumes of 100–1000 millilitres.
      IV. It provides optimal temperature, pH, substrate, salts, vitamins and oxygen.
    options:
      - I and II only
      - II and IV only
      - II and III only
      - III and IV only
    answer: 1
    explanation: II and IV are correct. A bioreactor uses microbial, plant, animal or human cells, so I is wrong, and it processes 100–1000 litres of culture, not millilitres, so III is wrong.
  - id: bio-biotech1-028
    topic: biotech1-bioreactors
    subtopic: Scale of culture
