      Match List I with List II.
      List I
      P. Alien DNA ligated at the BamH I site of pBR322
      Q. Alien DNA inserted within the β-galactosidase coding sequence
      R. Intact ampicillin resistance gene in a transformant
      S. Intact β-galactosidase gene in the vector
      List II
      1. Colourless colony on a chromogenic substrate
      2. Loss of tetracycline resistance
      3. Growth of the transformant on ampicillin medium
      4. Blue colony on a chromogenic substrate
    options:
      - P-2, Q-1, R-3, S-4
      - P-2, Q-4, R-3, S-1
      - P-3, Q-1, R-2, S-4
      - P-1, Q-2, R-4, S-3
    answer: 0
    explanation: An insert at the BamH I site inactivates the tetracycline gene (P-2). An insert within the β-galactosidase coding sequence gives a colourless colony (Q-1). An intact ampicillin gene lets the transformant grow on ampicillin (R-3), and an intact β-galactosidase gene gives a blue colony (S-4).
  - id: bio-biotech1-484
