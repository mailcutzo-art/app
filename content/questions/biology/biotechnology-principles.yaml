    tags: [pbr322, recombinants]
    stem: |-
      Arrange the following steps of selecting recombinants of pBR322 (alien DNA ligated at the BamH I site) in the correct order.
      P. Plate the transformants on ampicillin medium
      Q. Transfer the colonies growing on ampicillin to tetracycline medium
      R. Introduce the ligated plasmids into *E. coli*
      S. Pick the colonies that grew on ampicillin but not on tetracycline
    options:
      - P → R → Q → S
      - R → Q → P → S
      - R → P → Q → S
      - R → P → S → Q
    answer: 2
    explanation: The plasmids are first introduced into E. coli (R). The transformants are plated on ampicillin medium (P) and the colonies that grow are transferred to tetracycline medium (Q). The recombinants are the colonies that grew on ampicillin but not on tetracycline (S).
