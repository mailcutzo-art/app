      - Sweet pea (*Lathyrus odoratus*)
      - Snapdragon (*Antirrhinum*)
      - Garden pea (*Pisum sativum*)
      - Maize (*Zea mays*)
    answer: 2
    explanation: NCERT states that Mendel conducted his experiments on the garden pea, *Pisum sativum*, over seven years. Snapdragon is the NCERT example for incomplete dominance, and maize and sweet pea were not his material.
  - id: bio-gen-010
    topic: mendels-laws
    subtopic: Contrasting traits
    concept: Mendel studied seven pairs of contrasting traits in the pea
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [contrasting-traits, mendel]
    stem: How many pairs of contrasting traits did Mendel study in the garden pea?
    options:
      - Three
      - Seven
      - Fourteen
      - Twenty-one
    answer: 1
    explanation: Mendel studied seven pairs of contrasting traits, such as seed shape, seed colour and stem height. Fourteen is the number of true-breeding varieties he selected, which formed these seven pairs.
  - id: bio-gen-011
    topic: mendels-laws
    subtopic: Terms in genetics
    concept: Alleles are the slightly different forms of the same gene
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [allele, terminology]
    stem: Slightly different forms of the same gene, such as T and t, are called
    options:
      - Loci
      - Genotypes
      - Phenotypes
      - Alleles
    answer: 3
    explanation: Genes that code for a pair of contrasting traits are known as alleles, the slightly different forms of the same gene. A genotype is the genetic make-up and a phenotype is the observable character.
  - id: bio-gen-012
    topic: mendels-laws
    subtopic: Terms in genetics
    concept: A homozygous individual carries two identical alleles of a gene
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [homozygous, terminology]
    stem: Which of the following pea plant genotypes is homozygous?
    options:
      - yy
      - Tt
      - Rr
      - Aa
    answer: 0
    explanation: A homozygote has two identical alleles of a gene, as in yy, TT or tt. Yy, Tt and Rr carry two different alleles and are heterozygous.
  - id: bio-gen-013
    topic: mendels-laws
    subtopic: Law of dominance
    concept: The recessive allele is present but masked by the dominant allele in the F1 hybrid
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [dominance, f1]
    stem: In a cross between pure tall and pure dwarf pea plants, all the F1 plants are tall because
    options:
      - the dwarf allele is lost during fertilisation
      - the dwarf allele is present but its expression is masked by the tall allele
      - the dwarf allele blends with the tall allele to give a tall phenotype
      - the F1 plants receive alleles only from the tall parent
    answer: 1
    explanation: 'The F1 plants are Tt: they receive T from the tall parent and t from the dwarf parent. The dominant T masks the expression of t, but t is not lost or altered, and it reappears in the F2.'
  - id: bio-gen-014
    topic: mendels-laws
    subtopic: Punnett square
    concept: The Punnett square was developed by the British geneticist Reginald C. Punnett
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [punnett-square]
    stem: The Punnett square, used to work out the genotypes of the offspring in a genetic cross, was developed by
    options:
      - Reginald C. Punnett
      - Gregor Mendel
      - Thomas Hunt Morgan
      - Carl Correns
    answer: 0
    explanation: NCERT credits the Punnett square to the British geneticist Reginald C. Punnett. It is a graphical way of calculating the probability of all possible genotypes of the offspring.
  - id: bio-gen-015
    topic: mendels-laws
    subtopic: Rediscovery of Mendel's work
    concept: Mendel's results were independently rediscovered in 1900 by de Vries, Correns and von Tschermak
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [rediscovery, mendel]
    stem: Mendel's work remained unrecognised until 1900, when his results were independently rediscovered by
    options:
      - Morgan, Sturtevant and Bridges
      - Hardy, Weinberg and Punnett
      - Sutton, Boveri and Morgan
      - de Vries, Correns and von Tschermak
    answer: 3
    explanation: NCERT states that in 1900 three scientists, de Vries, Correns and von Tschermak, independently rediscovered Mendel's results. The other groups are linked to later work on chromosomes, linkage and population genetics.
  - id: bio-gen-016
    topic: mendels-laws
    subtopic: Test cross
    concept: A test cross is made between an organism of dominant phenotype and a homozygous recessive parent
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [test-cross]
    stem: In a test cross, the organism showing the dominant phenotype is crossed with
    options:
      - a homozygous dominant parent
      - a heterozygous parent
      - a homozygous recessive parent
      - a plant of its own genotype by selfing
    answer: 2
    explanation: A test cross crosses the organism of dominant phenotype (genotype unknown) with the recessive parent instead of selfing it. The progeny then show its genotype, because the recessive parent contributes only recessive gametes.
  - id: bio-gen-017
    topic: mendels-laws
    subtopic: Contrasting traits
    concept: Mendel's flower colour pair was violet and white
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [contrasting-traits, flower-colour]
    stem: Which of the following pairs of contrasting traits was NOT studied by Mendel in the garden pea?
    options:
      - Round and wrinkled seeds
      - Inflated and constricted pods
      - Red and white flowers
      - Green and yellow pods
    answer: 2
    explanation: NCERT lists violet and white flowers, and not red and white. Round and wrinkled seeds, inflated and constricted pods and green and yellow pods are all among the seven pairs.
  - id: bio-gen-018
    topic: mendels-laws
    subtopic: True-breeding lines
    concept: A true-breeding line shows stable trait inheritance after continuous self-pollination
    category: concept
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [true-breeding, pure-line]
    stem: A true-breeding pea line is one that
    options:
      - shows stable inheritance and expression of a trait for several generations after continuous self-pollination
      - is heterozygous for all traits and gives mixed progeny
      - is produced by crossing two different varieties in every generation
      - shows a blend of the parental traits in its progeny
    answer: 0
    explanation: NCERT defines a true-breeding line as one that, after continuous self-pollination, shows stable trait inheritance and expression for several generations. Mendel started his crosses with such lines.
  - id: bio-gen-019
    topic: mendels-laws
    subtopic: Genotype and phenotype
    concept: Different genotypes (TT and Tt) can give the same phenotype
    category: concept
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [genotype, phenotype]
    stem: Which pair of pea plants has the same phenotype but different genotypes?
    options:
      - A homozygous tall and a dwarf plant
      - A homozygous tall and a heterozygous tall plant
      - A heterozygous tall and a dwarf plant
      - Two heterozygous tall plants
    answer: 1
    explanation: Homozygous tall (TT) and heterozygous tall (Tt) plants are both tall because T is dominant, yet their genotypes differ. A tall and a dwarf plant differ in both, and two heterozygous plants are alike in both.
  - id: bio-gen-020
    topic: mendels-laws
    subtopic: Law of segregation
    concept: A heterozygote forms two kinds of gametes in equal proportion
    category: concept
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [segregation, gametes]
    stem: A heterozygous tall pea plant (Tt) forms
    options:
      - only T gametes
      - T and t gametes in a 3:1 ratio
      - gametes that each carry both T and t
      - T and t gametes in equal proportion
    answer: 3
    explanation: Alleles of a pair segregate during gamete formation, so each gamete gets only one of them. A heterozygote therefore forms two kinds of gametes, T and t, in equal proportion (1:1).
  - id: bio-gen-021
    topic: mendels-laws
    subtopic: Monohybrid cross
    concept: TT × Tt gives all tall progeny with TT and Tt in a 1:1 ratio
    category: application
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [monohybrid-cross, punnett-square]
    stem: Progeny of a cross between homozygous tall (TT) and heterozygous tall (Tt) pea plants will be
    options:
      - all tall and all heterozygous
      - tall and dwarf in a 1:1 ratio
      - all tall, with TT and Tt in a 1:1 ratio
      - tall and dwarf in a 3:1 ratio
    answer: 2
    explanation: TT forms only T gametes and Tt forms T and t gametes equally. The progeny are half TT and half Tt, and since T is dominant, all are tall.
  - id: bio-gen-022
    topic: mendels-laws
    subtopic: Ratios in F2
    concept: One-third of the tall plants in the F2 of a monohybrid cross are homozygous
    category: numerical
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [f2, ratio]
    stem: What proportion of the tall plants in the F2 generation of a monohybrid cross is homozygous?
    options:
      - 1/4
      - 1/3
      - 1/2
      - 2/3
    answer: 1
    explanation: 'The F2 genotypes are 1 TT : 2 Tt : 1 tt. Tall plants are TT and Tt, that is 3 parts, of which only 1 part (TT) is homozygous, so the proportion is 1/3.'
  - id: bio-gen-023
    topic: mendels-laws
    subtopic: Selfing a heterozygote
    concept: In a selfed heterozygote one quarter of the progeny are true breeding for the dominant trait
    category: numerical
    format: direct
    difficulty: 3
    time: 50
    ncert: false
    battle: true
    tags: [selfing, f2]
    stem: A heterozygous tall pea plant is self-pollinated and yields 2000 seeds that all grow. How many plants will breed true for tallness?
    options:
      - '500'
      - '1000'
      - '1500'
      - '750'
    answer: 0
    explanation: 'Selfing Tt gives 1 TT : 2 Tt : 1 tt. Only the TT plants breed true for tallness, which is 1/4 of 2000 = 500. The 1500 tall plants include 1000 heterozygotes that will again give dwarf progeny.'
  - id: bio-gen-024
    topic: mendels-laws
    subtopic: Ratios in F2
    concept: A selfed heterozygote has half its progeny homozygous (TT and tt) and half heterozygous
    category: numerical
    format: direct
    difficulty: 4
    time: 85
    ncert: false
    battle: true
    tags: [selfing, genotypic-ratio]
    stem: A tall pea plant on self-pollination gives tall and dwarf progeny in a 3:1 ratio. What fraction of its progeny is homozygous?
    options:
      - 1/4
      - 3/4
      - 1/3
      - 1/2
    answer: 3
    explanation: 'The 3:1 ratio shows that the parent is Tt, so the genotypes are 1 TT : 2 Tt : 1 tt. Homozygotes are TT and tt, that is 1/4 + 1/4 = 1/2. The common trap is counting only the homozygous tall plants.'
  - id: bio-gen-025
    topic: mendels-laws
    subtopic: Probability and Punnett square
    concept: The probability of two independent events is the product of their separate probabilities
    category: numerical
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [probability, product-rule]
    stem: From a Tt × Tt cross, two plants are raised one after the other. What is the probability that the first is tall and the second is dwarf?
    options:
      - 1/16
      - 3/8
      - 3/16
      - 9/16
    answer: 2
    explanation: Each offspring is tall with probability 3/4 and dwarf with probability 1/4, and the events are independent. So the probability is 3/4 × 1/4 = 3/16.
  - id: bio-gen-026
    topic: mendels-laws
    subtopic: Probability and Punnett square
    concept: Probability of a given combination of phenotypes among several progeny of a monohybrid cross
    category: numerical
    format: direct
    difficulty: 5
    time: 120
    ncert: false
    battle: true
    tags: [probability, monohybrid-cross]
    stem: A Tt × Tt cross gives three seedlings. What is the probability that exactly two are tall and one is dwarf?
    options:
      - 9/64
      - 27/64
      - 27/256
      - 9/16
    answer: 1
    explanation: Each seedling is tall with probability 3/4 and dwarf with 1/4. The dwarf one can be first, second or third, so P = 3 × (3/4)^2 × (1/4) = 27/64. Forgetting the three possible orders gives 9/64.
  - id: bio-gen-027
    topic: mendels-laws
    subtopic: Basis of dominance
    concept: The dominant allele usually codes for the normal enzyme; the recessive allele for a modified or non-functional one
    category: concept
    format: direct
    difficulty: 4
    time: 85
    ncert: true
    battle: false
    tags: [dominance, enzyme]
    stem: A Tt pea plant is tall, although its t allele is present. The most acceptable explanation at the molecular level is that
    options:
      - the T allele makes a normal functional enzyme, whereas the t allele makes a non-functional or less efficient enzyme
      - the t allele is destroyed in the zygote
      - T and t make enzymes in equal amounts that blend into a tall phenotype
      - the t allele is converted into T during gamete formation
    answer: 0
    explanation: 'NCERT explains dominance through the protein or enzyme the allele codes for: the dominant allele typically gives the normal, functional product, while the recessive allele gives a modified, non-functional or less efficient one. Alleles are not destroyed, blended or converted.'
  - id: bio-gen-028
    topic: mendels-laws
    subtopic: Law of dominance
    concept: The law of dominance explains the expression of one parental character in F1 and the 3:1 ratio in F2
    category: concept
    format: statements
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [dominance, laws]
    stem: Which one of the following statements about the law of dominance is correct?
    options:
      - It states that the alleles of a pair separate from each other during gamete formation
      - It states that a heterozygote shows a phenotype intermediate between those of the two parents
      - It states that alleles of different genes assort independently of one another
      - It explains why only one parental character shows in the F1 and why the F2 shows a 3:1 phenotypic ratio
    answer: 3
    explanation: NCERT uses the law of dominance to explain the expression of only one parental character in F1, both in F2, and the 3:1 proportion. Separation of alleles is the law of segregation, an intermediate phenotype is incomplete dominance, and independent assortment concerns different genes.
  - id: bio-gen-029
    topic: mendels-laws
    subtopic: Test cross
    concept: Homozygous dominant organism test crossed gives only dominant progeny, not a 1:1 ratio
    category: application
    format: statements
    difficulty: 4
    time: 85
    ncert: true
    battle: false
    tags: [test-cross, statements]
    stem: Which one of the following statements about a test cross is incorrect?
    options:
      - It helps to find the genotype of an organism that shows the dominant phenotype
      - If the test organism is homozygous dominant, the progeny show dominant and recessive phenotypes in a 1:1 ratio
      - If the test organism is heterozygous, dominant and recessive progeny appear in a 1:1 ratio
      - The test organism is crossed with a homozygous recessive parent
    answer: 1
    explanation: A homozygous dominant organism (TT) test crossed with tt gives only Tt progeny, all showing the dominant phenotype. The 1:1 ratio of dominant and recessive progeny is obtained only when the test organism is heterozygous, so that statement is the incorrect one.
  - id: bio-gen-030
    topic: mendels-laws
    subtopic: Punnett square
    concept: The Punnett square is a graphical representation to calculate the probability of all possible genotypes of offspring
    category: concept
    format: statements
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [punnett-square, statements]
    stem: Which one of the following statements about the Punnett square is correct?
    options:
      - It was devised by Mendel to record the results of his crosses
      - It shows only the phenotypes of the progeny and not their genotypes
      - It is a graphical representation to calculate the probability of all possible genotypes of offspring in a cross
      - It can be used only for crosses involving a single pair of alleles
    answer: 2
    explanation: NCERT describes the Punnett square as a graphical representation to calculate the probability of all possible genotypes of the offspring in a genetic cross. It was developed by Punnett, shows genotypes (from which phenotypes follow), and NCERT also uses it for dihybrid crosses.
  - id: bio-gen-031
    topic: mendels-laws
    subtopic: Rediscovery of Mendel's work
    concept: Reasons why Mendel's work was not recognised for many years
    category: concept
    format: multi-statement
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [mendel, multi-statement]
    stem: |-
      Mendel's work remained unrecognised till 1900. Consider the following statements about the reasons.
      I. Communication was not easy in those days.
      II. His idea of discrete factors that do not blend was not accepted as an explanation for the continuous variation seen in nature.
      III. His use of mathematics to explain biological phenomena was new and unacceptable to many biologists.
      IV. He could not provide any physical proof for the existence of factors.
      Which of the statements are correct?
    options:
      - I and II only
      - I, II and III only
      - I, III and IV only
      - I, II, III and IV
    answer: 3
    explanation: 'NCERT gives all four reasons: poor communication, non-acceptance of stable, non-blending factors as the basis of continuous variation, the new mathematical approach, and the absence of physical proof for the factors.'
  - id: bio-gen-032
    topic: mendels-laws
    subtopic: Mendel's experimental material
