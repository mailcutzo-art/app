    answer: 1
    explanation: The parents are Aa × Aa. The unaffected son is Aa with probability 2/3, not 1/2. Only then can he pass a to half of the gametes, and the affected woman (aa) always passes a. So the probability is 2/3 × 1/2 = 1/3.
