    explanation: The 9 round yellow boxes are RRYY (1), RRYy (2), RrYY (2) and RrYy (4). Only an RrYy plant gives wrinkled green (rryy) offspring in the test cross, in 1/4 of its progeny. So the fraction is 4/9 × 1/4 = 1/9.
