      III. The seven pairs of traits included seed shape, flower colour and stem height.
      IV. Pod colour was not among the traits he studied.
      Which of the statements are correct?
    options:
      - I, II and III only
      - I and II only
      - II, III and IV only
      - I, III and IV only
    answer: 0
