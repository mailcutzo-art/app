    tags: [sickle-cell, probability]
    stem: A healthy couple has a child with sickle-cell anaemia, an autosomal recessive disease. They plan two more children. What is the probability that exactly one of these two children has sickle-cell anaemia?
    options:
      - 1/4
      - 7/16
      - 1/16
      - 3/8
    answer: 3
    explanation: Healthy parents with an affected child must both be carriers, Hb^A Hb^S. Each child has a 1/4 chance of being Hb^S Hb^S and a 3/4 chance of being unaffected. Exactly one of two is affected in 2 × 1/4 × 3/4 = 3/8 of the cases.
