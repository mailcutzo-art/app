    stem: A woman of blood group A, whose mother was group O, carries the colour blindness allele (I^A i, X^C X^c). Her husband is of blood group B with a group O father and has normal vision (I^B i, X^C Y). What is the probability that their child is a group O colour-blind boy?
    options:
      - 1/8
      - 1/4
      - 1/16
      - 1/32
    answer: 2
    explanation: The blood group gene and the X-linked gene assort independently. Group O (ii) has probability 1/2 × 1/2 = 1/4 and a colour-blind son (X^c Y) has probability 1/4 among all children. Hence the probability is 1/4 × 1/4 = 1/16.
