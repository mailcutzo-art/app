  - id: bio-gen-033
    topic: mendels-laws
    subtopic: F2 genotypes and carriers
    concept: Compute proportions of genotypes and carriers of the recessive allele in the F2 of a monohybrid cross
    category: application
    format: multi-statement
    difficulty: 5
    time: 120
    ncert: false
    battle: false
    tags: [f2, genotypic-ratio, multi-statement]
    stem: |-
      The F2 generation of a Tt × Tt cross is studied. Consider the following statements.
      I. The F2 has 1/4 TT, 1/2 Tt and 1/4 tt plants.
      II. Two-thirds of the tall F2 plants are heterozygous.
      III. The proportion of F2 plants that carry the t allele is 1/2.
      IV. The dwarf F2 plants are homozygous and breed true.
      Which of the statements are incorrect?
    options:
      - I only
      - III only
      - II and IV only
      - III and IV only
    answer: 1
    explanation: 'The genotypes are 1 TT : 2 Tt : 1 tt, so I is correct. Of the three tall parts, two are Tt, so II is correct, and tt plants breed true, so IV is correct. Plants carrying t are Tt and tt, that is 1/2 + 1/4 = 3/4, so III is incorrect.'
  - id: bio-gen-034
    topic: mendels-laws
    subtopic: Law of segregation
    concept: Statements on gamete formation and non-blending of alleles
    category: concept
    format: multi-statement
    difficulty: 4
    time: 85
    ncert: true
    battle: false
    tags: [segregation, multi-statement]
    stem: |-
      Consider the following statements about gamete formation in a monohybrid cross.
      I. A homozygous parent produces gametes that are all alike.
      II. A heterozygous parent produces two kinds of gametes in equal proportion.
      III. The two alleles of a pair fuse during gamete formation, so each gamete carries both.
      IV. Alleles of a pair do not blend, so both parental characters can be recovered in the F2.
      Which of the statements are correct?
    options:
      - I and II only
      - I, III and IV only
      - I, II and IV only
      - II, III and IV only
    answer: 2
    explanation: NCERT states that a gamete receives only one of the two alleles, a homozygote forms similar gametes and a heterozygote forms two kinds in equal proportion, and alleles do not blend. Statement III is wrong because the alleles separate rather than fuse.
  - id: bio-gen-035
    topic: mendels-laws
    subtopic: Ratios in F2
    concept: The F2 phenotypic ratio is 3:1 and the genotypic ratio is 1:2:1
    category: concept
    format: statement-pair
    difficulty: 3
