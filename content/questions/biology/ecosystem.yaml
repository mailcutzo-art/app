    explanation: Panel P, with only microscopic floating cells, is the phytoplankton pioneer stage. Panel Q, with reeds rooted in mud and partly under water, is the reed-swamp stage, which comes before the marsh-meadow. Panel R, with trees on soil where the pond was, is the climax forest; this is hydrarch succession, in which the water body is converted into land.
