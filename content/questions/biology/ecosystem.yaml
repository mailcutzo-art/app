    explanation: Statements I and II are NCERT definitions. Statement III is wrong because humification forms humus; release of inorganic nutrients from humus is mineralisation. Statement IV is wrong because detritivores only fragment detritus; the digestive enzymes are secreted by saprotrophic decomposers (fungi and bacteria).
  - id: bio-ecosys-418
    topic: ecosys-structure-function
    subtopic: Trophic levels
