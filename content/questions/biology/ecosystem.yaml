questions:
  - id: bio-ecosys-001
    topic: ecosys-decomposition
    subtopic: Detritus
    concept: Detritus, the dead remains of plants and animals, is the raw material for decomposition
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [detritus, decomposition]
    stem: The raw material for decomposition in an ecosystem is
    options:
      - humus
      - detritus
      - standing crop
      - gross primary productivity
    answer: 1
    explanation: Dead plant remains such as leaves, bark and flowers, together with the dead remains of animals including faecal matter, form detritus, which is the raw material for decomposition. Humus is a product of decomposition, while standing crop and productivity relate to living biomass.
  - id: bio-ecosys-002
    topic: ecosys-decomposition
    subtopic: Decomposers
    concept: Decomposers convert complex organic matter into carbon dioxide, water and nutrients
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [decomposers, inorganic-substances]
    stem: Decomposers break down complex organic matter into inorganic substances such as
    options:
      - carbon dioxide, water and nutrients
      - glucose, oxygen and ATP
      - starch, proteins and fats
      - humus, detritus and litter
    answer: 0
    explanation: Decomposers break down complex organic matter into inorganic substances like carbon dioxide, water and nutrients, and this is called decomposition. The other options list organic molecules or the organic materials that decomposers act upon.
  - id: bio-ecosys-003
    topic: ecosys-decomposition
    subtopic: Fragmentation
    concept: Detritivores such as earthworms break detritus into smaller particles by fragmentation
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [fragmentation, detritivores]
    stem: The process in which detritivores such as earthworms break detritus into smaller particles is called
    options:
      - leaching
      - catabolism
      - fragmentation
      - mineralisation
    answer: 2
    explanation: Detritivores such as earthworms break detritus into smaller particles, and this step is fragmentation. Leaching moves soluble nutrients down the soil, catabolism is the enzymatic breakdown by bacteria and fungi, and mineralisation releases inorganic nutrients from humus.
  - id: bio-ecosys-004
    topic: ecosys-decomposition
    subtopic: Humification
    concept: Humification leads to accumulation of the dark coloured amorphous substance humus
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [humification, humus]
    stem: Humification leads to the accumulation of a dark coloured amorphous substance called
    options:
      - detritus
      - lignin
      - chitin
      - humus
    answer: 3
    explanation: Humification leads to the accumulation of humus, a dark coloured amorphous substance that is highly resistant to microbial action. Detritus is the raw material, while lignin and chitin are constituents of detritus that slow its decomposition.
  - id: bio-ecosys-005
    topic: ecosys-decomposition
    subtopic: Mineralisation
    concept: Mineralisation is the release of inorganic nutrients from humus by some microbes
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [mineralisation, humus]
    stem: The release of inorganic nutrients from humus through the action of some microbes is called
    options:
      - mineralisation
      - humification
      - fragmentation
      - catabolism
    answer: 0
    explanation: Humus is further degraded by some microbes, and the release of inorganic nutrients from it is known as mineralisation. Humification forms humus, fragmentation only reduces particle size, and catabolism is the enzymatic breakdown of detritus.
  - id: bio-ecosys-006
    topic: ecosys-decomposition
    subtopic: Steps of decomposition
    concept: Fragmentation, leaching, catabolism, humification and mineralisation are the steps of decomposition
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [steps, decomposition]
    stem: Which of the following is NOT one of the important steps of decomposition?
    options:
      - Fragmentation
      - Leaching
      - Humification
      - Nitrification
    answer: 3
    explanation: NCERT lists fragmentation, leaching, catabolism, humification and mineralisation as the important steps of decomposition. Nitrification, the bacterial conversion of ammonia to nitrate, belongs to nitrogen transformations and is not one of these steps.
  - id: bio-ecosys-007
    topic: ecosys-decomposition
    subtopic: Oxygen requirement
    concept: Decomposition is largely an oxygen-requiring process
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [oxygen, aerobic]
    stem: Decomposition in an ecosystem is largely a process that requires
    options:
      - nitrogen gas
      - oxygen
      - sunlight
      - carbon dioxide
    answer: 1
    explanation: Decomposition is largely an oxygen-requiring process, which is why anaerobiosis inhibits it and allows organic materials to build up. Decomposers are heterotrophs, so sunlight is not needed.
  - id: bio-ecosys-008
    topic: ecosys-decomposition
    subtopic: Leaching
    concept: Leaching carries water-soluble inorganic nutrients down the soil horizon
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [leaching, soil-horizon]
    stem: The process by which water-soluble inorganic nutrients go down into the soil horizon and get precipitated as unavailable salts is
    options:
      - fragmentation
      - humification
      - leaching
      - catabolism
    answer: 2
    explanation: In leaching, water-soluble inorganic nutrients move down into the soil horizon and get precipitated as salts that are unavailable to plants. Fragmentation, humification and catabolism do not involve this downward movement.
  - id: bio-ecosys-009
    topic: ecosys-decomposition
    subtopic: Catabolism
    concept: Bacterial and fungal enzymes degrade detritus into simpler inorganic substances in catabolism
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [catabolism, enzymes]
    stem: Bacterial and fungal enzymes degrade detritus into simpler inorganic substances in the step called
    options:
      - catabolism
      - fragmentation
      - leaching
      - humification
    answer: 0
    explanation: Catabolism is the enzymatic degradation of detritus into simpler inorganic substances by bacteria and fungi. Fragmentation is done by detritivores, leaching moves soluble nutrients downward, and humification forms humus.
  - id: bio-ecosys-010
    topic: ecosys-decomposition
    subtopic: Detritus
    concept: Detritus includes dead plant remains, dead animal remains and faecal matter
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [detritus, faecal-matter]
    stem: Which of the following constitutes detritus in an ecosystem?
    options:
      - Only the leaves and bark shed by plants
      - Dead plant remains, dead animal remains and faecal matter
      - Only the dark, colloidal humus of the soil
      - Living roots together with soil water and minerals
    answer: 1
    explanation: Dead plant remains such as leaves, bark and flowers, and dead remains of animals including faecal matter, together constitute detritus. Humus is a product of its decomposition, and living roots, soil water and minerals are not detritus.
  - id: bio-ecosys-011
    topic: ecosys-decomposition
    subtopic: Humus
    concept: Humus is colloidal in nature and serves as a reservoir of nutrients
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [humus, reservoir]
    stem: Humus serves as a reservoir of nutrients because it is
    options:
      - colloidal in nature
      - highly soluble in water
      - rapidly mineralised by microbes
      - made up of coarse leaf fragments
    answer: 0
    explanation: Humus is colloidal in nature, so it holds nutrients and serves as a reservoir of nutrients. It is highly resistant to microbial action and decomposes at an extremely slow rate, so it is not rapidly mineralised.
  - id: bio-ecosys-012
    topic: ecosys-decomposition
    subtopic: Climatic factors
    concept: Temperature and soil moisture are the most important climatic factors regulating decomposition
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [temperature, soil-moisture]
    stem: Which pair of climatic factors is the most important in regulating decomposition?
    options:
      - Light intensity and day length
      - Wind velocity and atmospheric pressure
      - Temperature and soil moisture
      - Altitude and latitude
    answer: 2
    explanation: NCERT states that temperature and soil moisture are the most important climatic factors that regulate decomposition through their effects on the activities of soil microbes. The other pairs are not named as regulators.
  - id: bio-ecosys-013
    topic: ecosys-decomposition
    subtopic: Chemical composition of detritus
    concept: Lignin-rich detritus decomposes more slowly than detritus rich in nitrogen and soluble sugars
    category: application
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [lignin, detritus-quality]
    stem: Under identical climatic conditions, which of the following detritus will decompose most slowly?
    options:
      - Soft young leaves rich in nitrogen
      - Ripe fruit pulp rich in water-soluble sugars
      - Fallen petals rich in water-soluble substances
      - Woody twigs rich in lignin
    answer: 3
    explanation: In a particular climatic condition, decomposition is slower if the detritus is rich in lignin and chitin, and quicker if it is rich in nitrogen and water-soluble substances such as sugars. Woody twigs are lignin-rich, so they decompose most slowly.
  - id: bio-ecosys-014
    topic: ecosys-decomposition
    subtopic: Anaerobiosis and low temperature
    concept: Low temperature and anaerobiosis inhibit decomposition and cause build-up of organic materials
    category: concept
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [anaerobiosis, low-temperature]
    stem: Build-up of organic materials in the soil is promoted by
    options:
      - low temperature and anaerobiosis
      - warm and moist conditions
      - detritus rich in nitrogen and sugars
      - abundant detritivores and oxygen
    answer: 0
    explanation: Low temperature and anaerobiosis inhibit decomposition, which results in the build-up of organic materials. Warm and moist conditions, nitrogen- and sugar-rich detritus, and abundant oxygen with detritivores all favour faster decomposition.
  - id: bio-ecosys-015
    topic: ecosys-decomposition
    subtopic: Factors controlling the rate
    concept: In a given climate the chemical composition of detritus controls the rate of decomposition
    category: concept
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [detritus-quality, rate-of-decomposition]
    stem: In a particular climatic condition, the rate of decomposition is mainly controlled by the
    options:
      - trophic level of the decomposers
      - gross primary productivity of the ecosystem
      - chemical composition of the detritus
      - biomass of the herbivores
    answer: 2
    explanation: NCERT states that the rate of decomposition is controlled by the chemical composition of the detritus and by climatic factors. Once the climate is fixed, the composition of the detritus (for example lignin, chitin, nitrogen, sugars) decides how fast it decomposes.
  - id: bio-ecosys-016
    topic: ecosys-decomposition
    subtopic: Steps operate together
    concept: All the steps of decomposition operate simultaneously on the detritus
    category: concept
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [simultaneous-steps, decomposition]
    stem: Which statement about the steps of decomposition is correct?
    options:
      - Each step begins only after the previous step is complete on all the detritus
      - All the steps operate simultaneously on the detritus
      - Humification is completed before fragmentation begins
      - Leaching begins only after mineralisation has released the nutrients
    answer: 1
    explanation: NCERT notes that all the steps of decomposition, namely fragmentation, leaching, catabolism, humification and mineralisation, operate simultaneously on the detritus. They are not strictly consecutive stages.
  - id: bio-ecosys-017
    topic: ecosys-decomposition
    subtopic: Decomposers
    concept: Decomposers secrete digestive enzymes on dead matter and absorb the simple inorganic products
    category: concept
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [saprotrophs, digestive-enzymes]
    stem: Which of the following correctly describes the decomposers (saprotrophs) of an ecosystem?
    options:
      - They engulf detritus and break it into smaller particles inside the body
      - They make their own food from inorganic substances using light energy
      - They feed on living plants and convert them into humus
      - They secrete digestive enzymes on dead matter and absorb the simple inorganic materials released
    answer: 3
    explanation: Decomposers are heterotrophs that secrete digestive enzymes which break down dead and waste materials into simple inorganic materials, which they then absorb. Breaking detritus into smaller particles is fragmentation by detritivores, and decomposers are not autotrophs or parasites of living plants.
  - id: bio-ecosys-018
    topic: ecosys-decomposition
    subtopic: Detritus food chain
    concept: A much larger fraction of energy flows through the detritus food chain in terrestrial ecosystems
    category: factual
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [detritus-food-chain, energy-flow]
    stem: Compared with the grazing food chain, a much larger fraction of energy flows through the detritus food chain in a
    options:
      - terrestrial ecosystem
      - aquatic ecosystem
      - marine ecosystem
      - pond ecosystem
    answer: 0
    explanation: In a terrestrial ecosystem a much larger fraction of energy flows through the detritus food chain than through the grazing food chain. In aquatic ecosystems, including marine and pond ecosystems, the grazing food chain is the major conduit for energy flow.
  - id: bio-ecosys-019
    topic: ecosys-decomposition
    subtopic: Humus
    concept: Humus is highly resistant to microbial action and decomposes at an extremely slow rate
    category: concept
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [humus, resistance]
    stem: Humus undergoes decomposition at an extremely slow rate because it is
    options:
      - rich in nitrogen and water-soluble sugars
      - highly resistant to microbial action
      - quickly precipitated as unavailable salts
      - completely inaccessible to detritivores like earthworms
    answer: 1
    explanation: Humus is highly resistant to microbial action and therefore undergoes decomposition at an extremely slow rate. Nitrogen and soluble sugars favour quick decomposition, and precipitation of leached nutrients as salts is a feature of leaching, not of humus.
  - id: bio-ecosys-020
    topic: ecosys-decomposition
    subtopic: Climatic factors
    concept: Warm and moist conditions favour decomposition
    category: concept
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [warm-moist, climate]
    stem: Which environmental condition favours decomposition the most?
    options:
      - Cold and dry
      - Cold and moist
      - Warm and waterlogged with very little oxygen
      - Warm and moist
    answer: 3
    explanation: A warm and moist environment favours decomposition by promoting the activity of soil microbes, whereas low temperature and anaerobiosis inhibit it. Waterlogging with little oxygen inhibits this largely oxygen-requiring process even when the soil is warm.
  - id: bio-ecosys-021
    topic: ecosys-decomposition
    subtopic: Chemical composition of detritus
    concept: Lignin-rich woody tissue and chitin-rich arthropod exoskeletons decompose slowly
    category: application
    format: direct
    difficulty: 4
    time: 85
    ncert: false
    battle: false
    tags: [lignin, chitin]
    stem: Detritus rich in lignin and detritus rich in chitin both decompose slowly. Which pair of examples respectively fits these two types?
    options:
      - Fruit pulp; woody twigs
      - Insect exoskeletons; woody twigs
      - Woody twigs; insect exoskeletons
      - Fallen petals; fruit pulp
    answer: 2
    explanation: Lignin is deposited in the walls of woody tissue, so woody twigs are lignin-rich, while chitin forms the exoskeleton of insects and other arthropods. Fruit pulp and petals are rich in soluble substances and decompose quickly, and the lignin and chitin examples must not be reversed.
  - id: bio-ecosys-022
    topic: ecosys-decomposition
    subtopic: Decomposers
    concept: Decomposers are heterotrophic fungi and bacteria, not detritivores such as earthworms
    category: concept
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [decomposers, fungi-bacteria]
    stem: The decomposers of an ecosystem are mainly
    options:
      - earthworms and termites
      - heterotrophic fungi and bacteria
      - autotrophic algae and cyanobacteria
      - protozoa and rotifers
    answer: 1
    explanation: Decomposers are heterotrophic organisms, mainly fungi and bacteria, which obtain energy and nutrients by degrading dead organic matter. Earthworms are detritivores that fragment detritus, and algae and cyanobacteria are autotrophs.
  - id: bio-ecosys-023
    topic: ecosys-decomposition
    subtopic: Climatic factors
    concept: Soil moisture can limit microbial activity even at a high temperature
    category: application
    format: direct
    difficulty: 4
    time: 85
    ncert: true
    battle: true
    tags: [soil-moisture, temperature]
    stem: Litter decomposes faster in the rainy season than in the hot dry summer. This shows that
    options:
      - soil moisture can limit microbial activity even when the temperature is high
      - high temperature alone ensures rapid decomposition
      - decomposition is largely independent of soil microbes
      - oxygen availability is unimportant for decomposition
    answer: 0
    explanation: Temperature and soil moisture regulate decomposition through their effects on the activities of soil microbes. In the hot dry summer low soil moisture can limit microbial activity even though the temperature is high, so high temperature alone does not guarantee rapid decomposition.
  - id: bio-ecosys-024
    topic: ecosys-decomposition
    subtopic: Steps of decomposition
    concept: Detritus, fragmentation, leaching and catabolism assessed together; catabolism is not humus formation
    category: concept
    format: multi-statement
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [steps, detritus]
    stem: |-
      Consider the following statements about the process of decomposition.
      I. Dead plant remains and the faecal matter of animals are both included in detritus.
      II. Detritivores such as earthworms break detritus into smaller particles.
      III. Leaching carries water-soluble inorganic nutrients down into the soil horizon.
      IV. Catabolism is the accumulation of a dark coloured amorphous substance in the soil.
      Which of the statements are correct?
    options:
      - I, II and IV only
      - II, III and IV only
      - I, II and III only
      - I, III and IV only
    answer: 2
    explanation: Statements I, II and III agree with NCERT. Statement IV is wrong because the accumulation of dark coloured, amorphous humus is humification, whereas catabolism is the enzymatic degradation of detritus by bacteria and fungi.
  - id: bio-ecosys-025
    topic: ecosys-decomposition
    subtopic: Humus
    concept: Humus is dark, amorphous, colloidal, a nutrient reservoir and slowly mineralised, not rapidly degraded
    category: concept
    format: multi-statement
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [humus, mineralisation]
    stem: |-
      Consider the following statements about humus.
      I. It is a dark coloured amorphous substance.
      II. It is rapidly degraded by microbes, so it cannot store nutrients for long.
      III. Being colloidal in nature, it serves as a reservoir of nutrients.
      IV. Some microbes degrade it further and release inorganic nutrients by mineralisation.
      Which of the statements are correct?
    options:
      - I, II and III only
      - II, III and IV only
      - I, II and IV only
      - I, III and IV only
    answer: 3
    explanation: Statement II is wrong because humus is highly resistant to microbial action and decomposes at an extremely slow rate. Statements I, III and IV agree with NCERT.
  - id: bio-ecosys-026
    topic: ecosys-decomposition
    subtopic: Steps of decomposition
    concept: Agent and product of each step must not be swapped; mineralisation releases inorganic nutrients
    category: concept
    format: multi-statement
    difficulty: 4
    time: 85
    ncert: true
    battle: false
    tags: [fragmentation, mineralisation, leaching]
    stem: |-
      Consider the following statements about decomposition.
      I. Fragmentation is brought about by the enzymes of bacteria and fungi.
      II. Leached nutrients may get precipitated in the soil horizon as salts unavailable to plants.
      III. Humification and mineralisation take place during decomposition in the soil.
      IV. Humus is further degraded by some microbes, releasing organic nutrients.
      Which of the statements are correct?
    options:
      - I and III only
      - II and III only
      - II and IV only
      - I, II and IV only
    answer: 1
    explanation: Statement I is wrong because fragmentation is done by detritivores, while bacterial and fungal enzymes act in catabolism. Statement IV is wrong because mineralisation of humus releases inorganic, not organic, nutrients. Statements II and III agree with NCERT.
  - id: bio-ecosys-027
    topic: ecosys-decomposition
    subtopic: Detritus food chain
    concept: Statements from different parts of the chapter on food chains, detritivores and lignin and chitin
    category: concept
    format: multi-statement
    difficulty: 4
    time: 85
    ncert: true
    battle: false
    tags: [detritus-food-chain, detritivores, lignin]
    stem: |-
      Consider the following statements.
      I. The detritus food chain begins with dead organic matter.
      II. In an aquatic ecosystem the grazing food chain is the major conduit for energy flow.
      III. Earthworms degrade detritus into simpler inorganic substances by secreting enzymes.
      IV. In a particular climatic condition, detritus rich in lignin and chitin decomposes more slowly.
      Which of the statements are correct?
    options:
      - I, II and IV only
      - I, III and IV only
      - II, III and IV only
      - I, II and III only
    answer: 0
    explanation: Statement III is wrong because earthworms are detritivores that break detritus into smaller particles (fragmentation); the enzymatic degradation into simpler inorganic substances (catabolism) is done by bacteria and fungi. Statements I, II and IV agree with NCERT.
  - id: bio-ecosys-028
    topic: ecosys-decomposition
    subtopic: Simultaneous steps
    concept: Identify the incorrect statements about the sequence and products of the steps of decomposition
    category: concept
    format: multi-statement
    difficulty: 4
    time: 85
    ncert: true
    battle: false
    tags: [simultaneous-steps, humification, mineralisation]
    stem: |-
      Consider the following statements about decomposition.
      I. The steps of decomposition occur one after another, and each step begins only after the previous one has ended.
      II. Humification and mineralisation take place in the soil.
      III. Mineralisation leads to the accumulation of dark coloured humus.
      IV. Humus is further degraded by some microbes.
      Which of the statements are incorrect?
    options:
      - II and IV only
      - I and IV only
      - I and III only
      - II and III only
    answer: 2
    explanation: Statement I is incorrect because all the steps operate simultaneously on the detritus. Statement III is incorrect because humus accumulates during humification, whereas mineralisation releases inorganic nutrients from humus. Statements II and IV are correct.
  - id: bio-ecosys-029
    topic: ecosys-decomposition
    subtopic: Steps of decomposition
    concept: Count the correct statements among five on detritus, steps, humus, leaching and detritus quality
    category: concept
    format: multi-statement
    difficulty: 5
    time: 120
    ncert: true
    battle: false
    tags: [steps, humus, detritus-quality]
    stem: |-
      Consider the following statements about decomposition.
      I. Dead remains of animals, including faecal matter, form part of detritus.
      II. Fragmentation is the process in which bacterial and fungal enzymes degrade detritus into simpler inorganic substances.
      III. Humus is highly resistant to microbial action, so no microbe can degrade it further.
      IV. Leaching removes water-soluble inorganic nutrients to deeper soil layers, where they may be precipitated as unavailable salts.
      V. In a particular climatic condition, decomposition is quicker if the detritus is rich in nitrogen and water-soluble substances.
      How many of the statements are correct?
    options:
      - Only two
      - Only three
      - Only four
      - All five
    answer: 1
    explanation: Statements I, IV and V are correct. Statement II describes catabolism, because fragmentation is done by detritivores. Statement III is wrong because, although humus is highly resistant, it is further degraded by some microbes, which releases inorganic nutrients by mineralisation.
  - id: bio-ecosys-030
    topic: ecosys-decomposition
    subtopic: Factors and steps
    concept: Two-clause statements on leaching, humus, catabolism and the effect of low temperature and anaerobiosis
    category: concept
    format: multi-statement
    difficulty: 5
    time: 120
    ncert: true
    battle: false
    tags: [leaching, catabolism, anaerobiosis]
    stem: |-
      Consider the following statements.
      I. Leaching carries water-soluble inorganic nutrients down into the soil horizon, where they remain freely available to plant roots.
      II. Humus decomposes at an extremely slow rate because it is highly resistant to microbial action.
      III. Catabolism converts detritus into simpler inorganic substances through the enzymes of bacteria and fungi.
      IV. Low temperature inhibits decomposition, whereas anaerobiosis hastens it.
      Which of the statements are correct?
    options:
      - I and II only
      - I and IV only
      - III and IV only
      - II and III only
    answer: 3
    explanation: Statement I is wrong because the leached nutrients get precipitated as salts that are unavailable. Statement IV is wrong because both low temperature and anaerobiosis inhibit decomposition and lead to a build-up of organic materials. Statements II and III agree with NCERT.
  - id: bio-ecosys-031
    topic: ecosys-decomposition
    subtopic: Leaching
    concept: Leaching moves soluble nutrients downward and is not an enzymatic process of bacteria and fungi
    category: concept
    format: statement-pair
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [leaching, enzymes]
    stem: |-
      Statement I: Leaching moves water-soluble inorganic nutrients down into the soil horizon.
      Statement II: Leaching is brought about by the enzymes of bacteria and fungi.
    options:
      - Both Statement I and Statement II are correct
      - Both Statement I and Statement II are incorrect
      - Statement I is correct but Statement II is incorrect
      - Statement I is incorrect but Statement II is correct
    answer: 2
    explanation: Statement I is correct because leaching carries water-soluble inorganic nutrients down into the soil horizon, where they get precipitated as unavailable salts. Statement II is incorrect because the enzymatic degradation by bacteria and fungi is catabolism, not leaching.
  - id: bio-ecosys-032
    topic: ecosys-decomposition
    subtopic: Humification and mineralisation
    concept: Mineralisation, not humification, releases inorganic nutrients from humus
