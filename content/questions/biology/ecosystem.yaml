  - id: bio-ecosys-417
    topic: ecosys-structure-function
    subtopic: Productivity and decomposition
    concept: Primary production and secondary productivity versus humification and detritivore roles
    category: concept
    format: multi-statement
    difficulty: 4
    time: 85
    ncert: true
    battle: false
    tags: [productivity, decomposition]
    stem: |-
      Consider the following statements about ecosystem functions.
      I. Primary production is the amount of biomass produced per unit area over a time period by plants during photosynthesis.
      II. Secondary productivity is the rate of formation of new organic matter by consumers.
      III. Humification leads to the release of inorganic nutrients from humus.
      IV. Detritivores such as earthworms secrete digestive enzymes that break detritus into simple inorganic materials, which they then absorb.
      Which of the statements are correct?
    options:
