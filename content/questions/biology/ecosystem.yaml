    ncert: true
    battle: false
    tags: [sere, climax]
    stem: 'An ecologist records the communities that appear one after another on a lava flow over 300 years: a lichen crust, moss cushions, herbs and shrubs, and finally a forest whose species composition has not changed for the last 100 years. Which pair of terms correctly describes the whole record and the final forest?'
    options:
      - Seral stage and climax community
      - Sere and climax community
      - Sere and pioneer community
      - Seral community and sere
    answer: 1
    explanation: The entire sequence of communities that change in an area is a sere, and each transitional community in it is a seral stage. The final forest, whose composition no longer changes, is the climax community in near equilibrium with its environment.
  - id: bio-ecosys-498
    topic: ecosys-succession
    subtopic: Hydrarch succession
    concept: Interpret decades of change in a new reservoir
    category: application
    format: case
    difficulty: 4
    time: 85
    ncert: false
    battle: false
    tags: [hydrarch, primary-succession]
    stem: 'A dam fills a newly dug rocky basin and creates a reservoir. Over many decades an ecologist notes: a green bloom of microscopic floating organisms; then floating and rooted plants; then reeds in shallow water; then a marshy meadow; then shrubs; and finally a forest where the water once stood. Which statement about this series is correct?'
    options:
      - It is a xerarch primary succession, because the basin is made of rock and lichens were the pioneers.
      - It is a secondary succession, because the reservoir was built by humans and so the earlier organisms were lost.
      - It is a hydrarch succession that proceeds from mesic to hydric conditions and ends in a permanent pond.
      - It is a primary hydrarch succession that starts with phytoplankton, goes from hydric to mesic conditions and ends in a forest as the water body becomes land.
    answer: 3
    explanation: A newly created reservoir is an area where no community existed, so the succession is primary, and because it starts in water it is hydrarch. The pioneers are phytoplankton, the conditions change from hydric to mesic, and the climax forest forms as the water body is converted into land.
