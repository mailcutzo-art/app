    diagram: A line graph. The x-axis is time in months from 0 to 12. The y-axis is litter mass remaining as a percentage of the initial mass, from 0 to 100. Three curves, P, Q and R, all start at 100 at time 0. Curve P falls steeply and reaches about 20 per cent at 12 months. Curve Q falls moderately and reaches about 55 per cent at 12 months. Curve R falls very slowly and is still about 90 per cent at 12 months.
    tags: [decomposition-rate, graph]
    stem: 'Equal masses of three litters were kept for a year. Sample 1: nitrogen-rich litter in warm, moist, aerated soil. Sample 2: lignin-rich litter in the same warm, moist, aerated soil. Sample 3: lignin-rich litter in cold, waterlogged soil. Which option correctly matches the curves P, Q and R?'
    options:
      - P-2, Q-1, R-3
      - P-1, Q-3, R-2
      - P-1, Q-2, R-3
      - P-3, Q-2, R-1
    answer: 2
    explanation: Detritus rich in nitrogen decomposes quickly and one rich in lignin more slowly under the same warm, moist, aerated conditions, so P is sample 1 and Q is sample 2. Low temperature and anaerobiosis inhibit decomposition, so lignin-rich litter in cold, waterlogged soil is slowest (R, sample 3).
  - id: bio-ecosys-437
    topic: ecosys-structure-function
    subtopic: Decomposition
    concept: Predict the effect of removing detritivores on the steps of decomposition
    category: application
    format: case
    difficulty: 4
    time: 85
    ncert: false
    battle: false
    tags: [earthworm, fragmentation]
    stem: A farmer treats a field with a chemical that kills the earthworms in the soil but does not affect fungi and bacteria. Considering the steps of decomposition, which one of the following outcomes is most likely?
    options:
      - Decomposition stops completely, because detritivores are the only agents that secrete enzymes
      - Leaching stops, because earthworms are the source of the water-soluble nutrients
      - Mineralisation stops, because humus can be degraded only by earthworms
      - Fragmentation of detritus is reduced, but bacterial and fungal catabolism can still go on
    answer: 3
    explanation: Earthworms are detritivores and are responsible for fragmentation, helping break complex organic matter into smaller particles. Catabolism is carried out by bacterial and fungal enzymes, and mineralisation of humus is done by some microbes, so these steps are not lost with the earthworms.
  - id: bio-ecosys-438
    topic: ecosys-structure-function
    subtopic: Productivity and energy flow
    concept: From GPP and respiration find NPP, then apply the 10 per cent law twice and express the result as a percentage of GPP
    category: numerical
    format: case
    difficulty: 5
    time: 120
    ncert: false
    battle: false
    tags: [gpp-npp, ten-percent-law]
    stem: In a grassland the gross primary productivity is 9,000 kcal m^{-2} yr^{-1} and the plants lose 4,000 kcal m^{-2} yr^{-1} in respiration. Assuming that the 10 per cent law operates at every transfer in the grazing food chain, what percentage of the GPP is available to the secondary consumers?
    options:
      - 1.0 per cent
      - 0.56 per cent
      - 5.6 per cent
      - 0.44 per cent
    answer: 1
    explanation: NPP = GPP − R = 9,000 − 4,000 = 5,000. Primary consumers get 10 per cent = 500, and secondary consumers 10 per cent of that = 50 kcal m^{-2} yr^{-1}. 50/9,000 × 100 ≈ 0.56 per cent. Applying the law to GPP gives 1.0 per cent, 500/9,000 gives 5.6 per cent, and using R in place of NPP gives 0.44 per cent.
