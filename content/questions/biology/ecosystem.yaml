  - id: bio-ecosys-413
    topic: ecosys-structure-function
    subtopic: Productivity
    concept: Per-unit-area NPP of land versus ocean from the global NPP of 170 and 55 billion tons
    category: numerical
    format: direct
    difficulty: 5
    time: 120
    ncert: false
    battle: false
    tags: [npp, global-productivity]
    stem: The annual net primary productivity of the whole biosphere is approximately 170 billion tons (dry weight), of which the oceans, covering about 70 per cent of the Earth's surface, contribute 55 billion tons. Taking the rest of the surface as land, the net primary productivity per unit area of land is about how many times that per unit area of the oceans?
    options:
      - About 0.5 times
      - About 2.1 times
      - About 4.9 times
      - About 7.2 times
    answer: 2
    explanation: Land contributes 170 − 55 = 115 billion tons from about 30 per cent of the surface, i.e. 115/0.30 ≈ 383 per unit of surface fraction. The oceans give 55/0.70 ≈ 78.6. The ratio is 383/78.6 ≈ 4.9. The value 2.1 (115/55) ignores the unequal areas, and 7.2 wrongly uses the whole 170 billion tons for land.
