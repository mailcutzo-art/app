questions:
  - id: bio-soa-001
    topic: soa-tissue-comparisons
    subtopic: Epithelium versus connective tissue
    concept: Epithelial cells are held together with very little intercellular material
    category: concept
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [epithelium, intercellular-material]
    stem: Which tissue has its cells held together with very little intercellular material?
    options:
      - Areolar tissue
      - Cartilage
      - Blood
      - Epithelial tissue
    answer: 3
    explanation: In epithelium all the cells are held together with little intercellular material. Areolar tissue, cartilage and blood are connective tissues, whose cells lie in a matrix that is semi-fluid, solid and pliable, and fluid respectively.
  - id: bio-soa-002
    topic: soa-tissue-comparisons
    subtopic: Circulatory systems of the three animals
    concept: The cockroach has an open blood vascular system; earthworm and frog have closed systems
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [open-circulation, comparison]
    stem: Which of the following animals has an open type of blood vascular system?
    options:
      - '*Pheretima*'
      - '*Periplaneta americana*'
      - '*Rana tigrina*'
      - '*Lumbricus*'
    answer: 1
    explanation: In the cockroach (Periplaneta americana) the blood vessels are poorly developed and open into the haemocoel, so the visceral organs are bathed in haemolymph. The earthworms (Pheretima, Lumbricus) and the frog have a closed vascular system.
  - id: bio-soa-003
    topic: soa-tissue-comparisons
    subtopic: Excretory organs of the three animals
    concept: Nephridia in earthworm, Malpighian tubules in cockroach and kidneys in frog
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [excretory-organs, comparison]
    stem: Nephridia, Malpighian tubules and kidneys are the main excretory organs of, respectively,
    options:
      - an earthworm, a cockroach and a frog
      - a cockroach, an earthworm and a frog
      - an earthworm, a frog and a cockroach
      - a frog, an earthworm and a cockroach
    answer: 0
    explanation: The earthworm excretes through segmentally arranged coiled nephridia, the cockroach through Malpighian tubules at the junction of midgut and hindgut, and the frog through a pair of kidneys made of nephrons. The other options mix up the animals.
  - id: bio-soa-004
    topic: soa-tissue-comparisons
    subtopic: Respiratory surfaces of the three animals
    concept: Moist body surface in earthworm, tracheae in cockroach, skin, buccal cavity and lungs in frog on land
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [respiration, comparison]
    stem: Gas exchange takes place through which structures in an earthworm, a cockroach and a frog on land, respectively?
    options:
      - Tracheae; moist body surface; lungs only
      - Gills; tracheae; lungs only
      - Moist body surface; tracheae; skin, buccal cavity and lungs
      - Moist body surface; gills; skin only
    answer: 2
    explanation: The earthworm has no specialised breathing device and exchanges gases through its moist body surface. The cockroach uses tracheae opening through spiracles. On land the frog uses its buccal cavity, skin and lungs.
  - id: bio-soa-005
    topic: soa-tissue-comparisons
    subtopic: Dense regular connective tissue
    concept: A ligament joins bone to bone; collagen fibres of dense regular tissue lie in rows between parallel bundles
    category: concept
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [ligament, dense-connective-tissue]
    stem: Which option correctly names the dense connective tissue that attaches one bone to another and describes its fibre arrangement?
    options:
      - Ligament; collagen fibres in rows between many parallel bundles of fibres
      - Tendon; collagen fibres in rows between many parallel bundles of fibres
      - Ligament; fibres and cells loosely arranged in a semi-fluid ground substance
      - Tendon; many fibres oriented in different directions
    answer: 0
    explanation: Ligaments attach one bone to another, whereas tendons attach skeletal muscles to bones; both are dense regular tissue with collagen fibres in rows between parallel bundles. Fibres oriented in different directions mark dense irregular tissue (skin), and loosely arranged fibres in a semi-fluid substance mark loose connective tissue.
  - id: bio-soa-006
    topic: soa-tissue-comparisons
    subtopic: Neurons versus neuroglia
    concept: Neuroglia protect and support neurons and make up more than half the volume of neural tissue
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [neuroglia, neural-tissue]
    stem: Which cells make up more than one-half of the volume of neural tissue in the human body?
    options:
      - Neurons
      - Neuroglial cells
      - Fibroblasts
      - Macrophages
    answer: 1
    explanation: Neurons are the excitable units of neural tissue, but the neuroglial cells that protect and support them make up more than one-half of its volume. Fibroblasts and macrophages are cells of connective tissue.
  - id: bio-soa-007
    topic: soa-tissue-comparisons
    subtopic: Sites of blood cell production
    concept: Blood glands in the earthworm and bone marrow in vertebrate bones produce blood cells
    category: factual
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [blood-glands, bone-marrow]
    stem: Which option names the sites of blood cell production in an earthworm and in some bones of vertebrates, respectively?
    options:
      - Septal nephridia; bone marrow
      - Blood glands; cartilage matrix
      - Blood glands of the 4th, 5th and 6th segments; bone marrow
      - Calciferous glands; bone marrow
    answer: 2
    explanation: In the earthworm the blood glands on the 4th, 5th and 6th segments produce blood cells and haemoglobin. In vertebrates the bone marrow in some bones is the site of blood cell production. Nephridia excrete, calciferous glands neutralise humic acid and cartilage matrix produces no blood cells.
  - id: bio-soa-008
    topic: soa-tissue-comparisons
    subtopic: Digestive systems of the three animals
    concept: The gizzard grinds food in earthworm and cockroach but is absent in the frog
    category: concept
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [gizzard, digestive-system, comparison]
    stem: Which structure is present in the digestive system of both the earthworm and the cockroach but absent in the frog?
    options:
      - Pharynx
      - Intestine
      - Cloaca
      - Gizzard
    answer: 3
    explanation: The earthworm has a muscular gizzard in segments 8-9 and the cockroach has a gizzard in its foregut, both grinding food. The frog's canal runs from pharynx to oesophagus, stomach, intestine, rectum and cloaca with no gizzard. A pharynx is present in all three and the cloaca belongs to the frog.
  - id: bio-soa-009
    topic: soa-tissue-comparisons
    subtopic: Glandular epithelium
    concept: Goblet cells are unicellular glands and the salivary gland is a multicellular gland
    category: concept
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [glandular-epithelium, goblet-cells]
    stem: Unicellular and multicellular glandular epithelia are exemplified, respectively, by
    options:
      - Salivary gland and goblet cells of the alimentary canal
      - Goblet cells of the alimentary canal and salivary gland
      - Goblet cells and the lining of blood vessels
      - Mast cells and salivary gland
    answer: 1
    explanation: Glandular epithelium is unicellular when it consists of isolated glandular cells such as the goblet cells of the alimentary canal, and multicellular when a cluster of cells forms a gland such as the salivary gland. Mast cells belong to loose connective tissue and blood vessels are lined by squamous epithelium.
  - id: bio-soa-010
    topic: soa-tissue-comparisons
    subtopic: Cartilage and bone cells
    concept: Chondrocytes of cartilage and osteocytes of bone lie in cavities or lacunae of the matrix
    category: concept
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [cartilage, bone, lacunae]
    stem: Cells lying in small cavities (lacunae) within a solid matrix are characteristic of
    options:
      - Cartilage and bone
      - Areolar tissue and adipose tissue
      - Tendon and ligament
      - Blood and areolar tissue
    answer: 0
    explanation: The chondrocytes of cartilage are enclosed in small cavities within the matrix, and the osteocytes of bone lie in spaces called lacunae. Areolar and adipose tissue are loose, tendon and ligament are dense with rows of fibres, and blood has a fluid plasma.
  - id: bio-soa-011
    topic: soa-tissue-comparisons
    subtopic: Sexual dimorphism
    concept: Anal styles mark the male cockroach while vocal sacs and copulatory pad mark the male frog
    category: application
    format: direct
    difficulty: 4
    time: 85
    ncert: true
    battle: false
    tags: [sexual-dimorphism, comparison]
    stem: A feature found only in the male cockroach and a feature found only in the male frog are, respectively,
    options:
      - Anal cerci; vocal sacs and a copulatory pad
      - A boat-shaped 7th sternum; vocal sacs and a copulatory pad
      - Anal styles; vocal sacs and a copulatory pad
      - Anal styles; a nictitating membrane over the eye
    answer: 2
    explanation: Male cockroaches bear a pair of short, thread-like anal styles on the 9th segment that females lack, and male frogs have sound-producing vocal sacs and a copulatory pad on the first digit of the forelimb. Anal cerci occur in both sexes, the boat-shaped 7th sternum is a female feature, and the nictitating membrane covers the eyes of every frog.
  - id: bio-soa-012
    topic: soa-tissue-comparisons
    subtopic: Fibres in connective tissue
    concept: In all connective tissues except blood, the cells secrete collagen or elastin fibres
    category: concept
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [blood, connective-tissue, fibres]
    stem: In all connective tissues except one, the cells secrete fibres of collagen or elastin. The exception is
    options:
      - Cartilage
      - Blood
      - Bone
      - Adipose tissue
    answer: 1
    explanation: NCERT states that in all connective tissues except blood the cells secrete fibres of structural proteins called collagen or elastin. Blood is a fluid connective tissue made of plasma, RBC, WBC and platelets, so it is the exception.
  - id: bio-soa-013
    topic: soa-tissue-comparisons
    subtopic: Cartilage versus bone
    concept: Cartilage matrix is solid and pliable whereas bone matrix is hard, non-pliable and rich in calcium salts
    category: concept
    format: statements
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [cartilage, bone, matrix]
    stem: Which one of the following correctly compares cartilage with bone?
    options:
      - Both have a hard, non-pliable matrix rich in calcium salts, but cartilage cells are chondrocytes and bone cells are osteocytes.
      - Cartilage has a solid and pliable matrix that resists compression, whereas bone has a hard, non-pliable matrix rich in calcium salts and collagen fibres.
      - Cartilage has a semi-fluid matrix, whereas bone has a solid and pliable matrix rich in calcium salts.
      - The cells of cartilage are osteocytes lying in lacunae, whereas the cells of bone are chondrocytes lying in small cavities.
    answer: 1
    explanation: The matrix of cartilage is solid and pliable and resists compression, while that of bone is hard and non-pliable because of calcium salts and collagen fibres. Cartilage cells are chondrocytes and bone cells are osteocytes, so the other options misstate the matrix or swap the cells.
  - id: bio-soa-014
    topic: soa-tissue-comparisons
    subtopic: Circulating fluid of the three animals
    concept: Haemoglobin is in the plasma of the earthworm, absent in cockroach haemolymph and in nucleated RBCs of the frog
    category: application
    format: statements
    difficulty: 5
    time: 120
    ncert: true
    battle: false
    tags: [haemoglobin, blood, comparison]
    stem: Which statement about the circulating fluid of the earthworm, cockroach and frog is correct?
    options:
      - The haemolymph of the cockroach carries haemoglobin in its haemocytes, which delivers oxygen to the tissues.
      - The red blood cells of the frog are enucleated, whereas the blood cells of the earthworm are nucleated and carry haemoglobin.
      - The earthworm has haemoglobin in its red blood corpuscles, whereas the frog has it dissolved in the plasma.
      - The earthworm has haemoglobin dissolved in its plasma, whereas the red blood cells of the frog are nucleated and contain haemoglobin.
    answer: 3
    explanation: In the earthworm the blood glands produce blood cells and haemoglobin, which is dissolved in the plasma, and the cells are phagocytic. In the frog the RBCs are nucleated and contain haemoglobin. The cockroach haemolymph has colourless plasma and haemocytes, and oxygen is carried by tracheae.
  - id: bio-soa-015
    topic: soa-tissue-comparisons
    subtopic: Muscle tissues
    concept: Smooth muscle fibres taper at both ends and lack striations; skeletal muscle fibres are striated
    category: concept
    format: statements
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [skeletal-muscle, smooth-muscle, cardiac-muscle]
    stem: Which one of the following statements about muscle tissue is NOT correct?
    options:
      - Skeletal muscle is closely attached to skeletal bones and its fibres show striations.
      - Smooth muscle fibres taper at both ends, show no striations and are held together by cell junctions.
      - Cardiac muscle cells are fused at some points by communication junctions, so neighbouring cells contract together.
      - Skeletal muscle fibres taper at both ends and show no striations, like the fibres of smooth muscle.
    answer: 3
    explanation: Skeletal muscle fibres are long, cylindrical and striated. Tapering (fusiform) fibres without striations are a feature of smooth muscle, so the last statement wrongly gives it to skeletal muscle. The other three statements are NCERT facts.
  - id: bio-soa-016
    topic: soa-tissue-comparisons
    subtopic: Loose and dense connective tissue
    concept: Adipose, dense irregular and dense regular tissue versus the arrangement of loose connective tissue
    category: concept
    format: multi-statement
    difficulty: 4
    time: 85
    ncert: true
    battle: false
    tags: [connective-tissue, dense-tissue, adipose]
    stem: |-
      Consider the following statements about connective tissues.
      I. In adipose tissue the cells are specialised to store fats, and the tissue lies mainly beneath the skin.
      II. Dense irregular connective tissue, present in the skin, has fibroblasts and many fibres oriented in different directions.
      III. In dense regular connective tissue the collagen fibres lie in rows between many parallel bundles of fibres.
      IV. Loose connective tissue has fibres and fibroblasts compactly packed in a rigid ground substance.
      Which of the statements are correct?
    options:
      - I, II and III only
      - II, III and IV only
      - I and IV only
      - I, II and IV only
    answer: 0
    explanation: Statements I, II and III are NCERT facts. Statement IV is wrong because compact packing of fibres and fibroblasts belongs to dense connective tissue; loose connective tissue has cells and fibres loosely arranged in a semi-fluid ground substance.
  - id: bio-soa-017
    topic: soa-tissue-comparisons
    subtopic: Nervous systems of the three animals
    concept: Ventral nerve cord with ganglia in earthworm and cockroach; brain and cranial nerves in frog
    category: application
    format: multi-statement
    difficulty: 5
    time: 120
    ncert: true
    battle: false
    tags: [nervous-system, comparison]
    stem: |-
      Consider the following statements about the nervous system.
      I. In the earthworm, ganglia are arranged segmentwise on the ventral paired nerve cord, which encircles the pharynx and joins the cerebral ganglia dorsally to form a nerve ring.
      II. In the cockroach, six ganglia lie in the thorax and three in the abdomen, and the supra-oesophageal ganglion represents the brain.
      III. In the frog, the brain is enclosed in the cranium and ten pairs of cranial nerves arise from it.
      IV. A cockroach can live for about a week after its head is cut off because its nervous system is spread throughout the body.
      Which of the statements are correct?
    options:
      - I and III only
      - I, II and IV only
      - I, III and IV only
      - II, III and IV only
    answer: 2
    explanation: Statements I, III and IV follow NCERT. Statement II swaps the numbers of ganglia, because the cockroach has three ganglia in the thorax and six in the abdomen. The cockroach keeps most of its nervous system along the ventral side of the body, so it survives decapitation for a week.
  - id: bio-soa-018
    topic: soa-tissue-comparisons
    subtopic: Simple and compound epithelium
    concept: Compound epithelium protects and has a limited role in secretion and absorption
    category: concept
    format: statement-pair
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [simple-epithelium, compound-epithelium]
    stem: |-
      Statement I: Simple epithelium is made of a single layer of cells and functions as a lining for body cavities, ducts and tubes.
      Statement II: Compound epithelium plays a major role in secretion and absorption because it is multi-layered.
    options:
      - Both Statement I and Statement II are correct
      - Both Statement I and Statement II are incorrect
      - Statement I is correct but Statement II is incorrect
      - Statement I is incorrect but Statement II is correct
    answer: 2
    explanation: Statement I is correct. Statement II is wrong, because compound epithelium is multi-layered and so has only a limited role in secretion and absorption; its main function is protection against chemical and mechanical stresses.
  - id: bio-soa-019
    topic: soa-tissue-comparisons
    subtopic: Reproduction in the three animals
    concept: Fertilisation is internal in the cockroach and external in the frog; the earthworm is bisexual
    category: concept
    format: statement-pair
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [reproduction, comparison]
    stem: |-
      Statement I: Fertilisation is internal in the cockroach but external in the frog.
      Statement II: The earthworm is hermaphrodite, whereas the cockroach is dioecious.
    options:
      - Both Statement I and Statement II are correct
      - Both Statement I and Statement II are incorrect
      - Statement I is correct but Statement II is incorrect
      - Statement I is incorrect but Statement II is correct
    answer: 0
    explanation: Cockroach sperms are transferred as spermatophores and fertilisation is internal, while frog fertilisation is external and takes place in water, so Statement I is correct. The earthworm has testes and ovaries in the same individual and the cockroach has separate sexes, so Statement II is correct.
  - id: bio-soa-020
    topic: soa-tissue-comparisons
    subtopic: Absorption in the intestine
    concept: Typhlosole is an absorptive fold of the earthworm intestine; the frog uses villi and microvilli
    category: concept
    format: statement-pair
    difficulty: 4
    time: 85
    ncert: true
    battle: false
    tags: [typhlosole, villi, comparison]
    stem: |-
      Statement I: A typhlosole, a fold of the intestinal wall, increases the area of absorption in the intestine of the frog.
      Statement II: In the frog, digested food is absorbed through the villi and microvilli of the intestinal wall.
    options:
      - Both Statement I and Statement II are correct
      - Both Statement I and Statement II are incorrect
      - Statement I is correct but Statement II is incorrect
      - Statement I is incorrect but Statement II is correct
    answer: 3
    explanation: The typhlosole is an internal median fold of the dorsal wall of the earthworm intestine, so Statement I wrongly gives it to the frog. In the frog digested food is absorbed through the finger-like folds called villi and microvilli, so Statement II is correct.
  - id: bio-soa-021
    topic: soa-tissue-comparisons
    subtopic: Cardiac muscle
    concept: Communication junctions let cardiac muscle cells contract as a unit
    category: concept
    format: assertion-reason
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [cardiac-muscle, intercalated-discs]
    stem: |-
      Assertion (A): The cells of cardiac muscle contract as a unit.
      Reason (R): Communication junctions at some fusion points stimulate the neighbours of a cell that receives a signal to contract.
    options:
      - Both A and R are true and R is the correct explanation of A
      - Both A and R are true but R is not the correct explanation of A
      - A is true but R is false
      - A is false but R is true
    answer: 0
    explanation: Cell junctions fuse the plasma membranes of cardiac muscle cells, and the communication junctions (intercalated discs) at some fusion points pass the signal on, so that when one cell is told to contract its neighbours are also stimulated. R therefore explains A.
  - id: bio-soa-022
    topic: soa-tissue-comparisons
    subtopic: Development of cockroach and frog
    concept: The cockroach develops through nymphs that resemble adults, unlike the frog with a tadpole larva
    category: application
    format: assertion-reason
    difficulty: 4
    time: 85
    ncert: true
    battle: false
    tags: [paurometabolous, nymph, tadpole]
    stem: |-
      Assertion (A): The development of the cockroach is described as paurometabolous.
      Reason (R): The cockroach hatches as a larva that looks very different from the adult and then metamorphoses, as the tadpole of a frog does.
    options:
      - Both A and R are true and R is the correct explanation of A
      - Both A and R are true but R is not the correct explanation of A
      - A is true but R is false
      - A is false but R is true
    answer: 2
    explanation: Paurometabolous development means development through a nymphal stage, and the nymphs look very much like adults, growing by moulting about 13 times. The tadpole larva that metamorphoses is the frog's pattern, so R is false.
  - id: bio-soa-023
    topic: soa-tissue-comparisons
    subtopic: Epithelial types and locations
    concept: Match squamous, cuboidal, columnar and ciliated epithelium with their locations
    category: concept
    format: match
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [match, epithelium]
    stem: |-
      Match the epithelium in List I with its location in List II.
      List I
      P. Squamous epithelium
      Q. Cuboidal epithelium
      R. Columnar epithelium
      S. Ciliated epithelium
      List II
      1. Inner surface of bronchioles and fallopian tubes
      2. Lining of the stomach and intestine
      3. Ducts of glands and tubular parts of nephrons
      4. Walls of blood vessels and air sacs of lungs
    options:
      - P-4, Q-2, R-3, S-1
      - P-4, Q-3, R-2, S-1
      - P-3, Q-4, R-1, S-2
      - P-4, Q-3, R-1, S-2
    answer: 1
    explanation: Squamous cells form the walls of blood vessels and lung air sacs (4), cuboidal cells occur in gland ducts and nephron tubules (3), columnar cells line the stomach and intestine (2), and ciliated cells line bronchioles and fallopian tubes (1).
  - id: bio-soa-024
    topic: soa-tissue-comparisons
    subtopic: Loose and dense connective tissues
    concept: Match areolar, adipose, dense regular and dense irregular tissue with their features
    category: concept
    format: match
    difficulty: 4
    time: 85
    ncert: true
    battle: false
    tags: [match, connective-tissue]
    stem: |-
      Match the connective tissue in List I with its feature in List II.
      List I
      P. Areolar tissue
      Q. Adipose tissue
      R. Dense regular connective tissue
      S. Dense irregular connective tissue
      List II
      1. Cells specialised to store fats, located mainly beneath the skin
      2. Collagen fibres in rows between parallel bundles, as in tendons and ligaments
      3. Fibroblasts, macrophages and mast cells in a semi-fluid ground substance
      4. Many fibres oriented differently; present in the skin
    options:
      - P-1, Q-3, R-2, S-4
      - P-3, Q-1, R-4, S-2
      - P-3, Q-2, R-1, S-4
      - P-3, Q-1, R-2, S-4
    answer: 3
    explanation: Areolar tissue is loose tissue with fibroblasts, macrophages and mast cells in a semi-fluid substance (3). Adipose tissue stores fats (1). Dense regular tissue has fibre rows as in tendons and ligaments (2), and dense irregular tissue has differently oriented fibres and occurs in the skin (4).
  - id: bio-soa-025
    topic: soa-tissue-comparisons
    subtopic: Levels of organisation
    concept: Cells are organised into tissues, tissues into organs and organs into organ systems
    category: concept
    format: ordering
    difficulty: 2
    time: 30
    ncert: true
    battle: false
    tags: [ordering, organisation]
    stem: |-
      Arrange the following in increasing order of structural complexity in an animal body.
      P. Organ
      Q. Cell
      R. Organ system
      S. Tissue
    options:
      - Q, S, P, R
      - Q, P, S, R
      - S, Q, P, R
      - Q, S, R, P
    answer: 0
    explanation: Cells with intercellular substances form tissues, two or more tissues form an organ, and organs performing a common function together form an organ system. The order is cell (Q), tissue (S), organ (P), organ system (R).
  - id: bio-soa-026
    topic: soa-tissue-comparisons
    subtopic: Matrix of connective tissues
    concept: Ground substance runs from fluid in blood to semi-fluid, solid and pliable, then hard and non-pliable in bone
    category: concept
    format: ordering
    difficulty: 3
    time: 50
    ncert: false
    battle: false
    tags: [ordering, matrix]
    stem: |-
      Arrange the following connective tissues from the most fluid to the most rigid ground substance.
      P. Bone
      Q. Blood
      R. Cartilage
      S. Areolar tissue
    options:
      - S, Q, R, P
      - Q, S, R, P
      - Q, R, S, P
      - Q, S, P, R
    answer: 1
    explanation: Blood is a fluid connective tissue (Q), areolar tissue has a semi-fluid ground substance (S), cartilage has a solid and pliable matrix (R), and bone has a hard, non-pliable ground substance rich in calcium salts (P).
