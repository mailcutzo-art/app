    answer: 3
    explanation: X seals the space between cells at fused spots, which is a tight junction that stops leakage. Y has cementing material that keeps neighbours together, an adhering junction. Z has channels joining the cytoplasm of the two cells for rapid transfer of ions and small molecules, a gap junction.
