    diagram: Three schematic side views labelled X, Y and Z, each showing the contact region between two neighbouring epithelial cells (two adjacent rectangles with their plasma membranes drawn as lines). In X the two membranes meet and fuse at a few spots along the contact surface, like stitches, so that no space is left between the cells at those spots. In Y the membranes stay apart with a thin band of dark cementing material filling the gap and holding the two cells together; there are no channels. In Z the membranes stay close and are crossed by tiny tubular channels that open into the cytoplasm of both cells; small dots (ions) are drawn passing through the channels from one cell to the other.
