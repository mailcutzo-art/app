    diagram: 'Three rate-against-substrate-concentration curves on the same axes (x: [S] in mM from 0 to 100; y: rate in arbitrary units from 0 to 100). Curve 1 (enzyme alone): rises steeply, reaches half of its maximum (50) at 5 mM and flattens at a plateau of 100. Curve 2: rises more slowly, reaches 50 only at about 25 mM and approaches the same plateau of 100 at about 100 mM. Curve 3: rises as steeply as curve 1 at low concentration (25 at 5 mM) but flattens at a plateau of only 50.'
