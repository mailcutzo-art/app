  - id: che-bio-118
    topic: enzymes
    subtopic: Specificity of enzymes
    concept: Enzymes act on one enantiomer because the active site is chiral
    category: concept
    format: direct
    difficulty: 4
    time: 85
    ncert: false
    battle: false
    tags: [stereospecificity, chirality, trap]
    stem: An enzyme metabolises D-glucose but not L-glucose, though both have the same functional groups. This is best explained because
    options:
      - the two enantiomers have different molecular formulae
      - the enzyme can act only on dextrorotatory compounds, and L-glucose is laevorotatory
      - L-glucose cannot form a cyclic hemiacetal structure
      - the active site is chiral, built from L-amino acids, so only one enantiomer fits it properly
    answer: 3
    explanation: The active site is made of L-amino acids and is itself chiral, so it can complement the shape of only one enantiomer, like a right hand in a right-hand glove. D and L describe configuration, not the sign of rotation; D-fructose is laevorotatory and is still metabolised, and enantiomers have the same formula and can both form rings.
  - id: che-bio-119
    topic: enzymes
