  - id: che-bio-120
    topic: enzymes
    subtopic: Mechanism of enzyme action
    concept: An enzyme lowers forward and reverse barriers equally and leaves ΔH, ΔG and K unchanged
    category: concept
    format: multi-statement
    difficulty: 5
    time: 120
    ncert: false
    battle: false
    tags: [catalysis-thermodynamics, equilibrium, trap]
    stem: |-
      Consider these statements about an enzyme-catalysed reaction A ⇌ B.
      I. If the enzyme speeds up the forward reaction 10^6-fold, it speeds up the reverse reaction 10^6-fold also.
      II. The equilibrium constant of A ⇌ B increases in the presence of the enzyme.
      III. The enzyme makes ΔG of the reaction more negative, so the reaction becomes more spontaneous.
      IV. The enzyme-catalysed and the uncatalysed paths have the same ΔH.
      Which of these statements are correct?
    options:
      - I and IV only
      - II and III only
      - I, III and IV only
      - II, III and IV only
    answer: 0
    explanation: The enzyme changes neither the energy of A nor that of B, so ΔH and ΔG are unchanged and the forward and reverse barriers fall by the same amount; both rate constants rise by the same factor and K = k_f/k_r stays the same. II and III are therefore wrong, since a catalyst only speeds the approach to equilibrium.
  - id: che-bio-121
    topic: enzymes
    subtopic: Mechanism of enzyme action
    concept: Find Ea from rate doubling over 10 K, then the enhancement over the uncatalysed reaction
    category: numerical
    format: direct
    difficulty: 5
    time: 120
    ncert: false
    battle: false
    formula: ln(k_2/k_1) = (Ea/R)(1/T_1 − 1/T_2)
    tags: [arrhenius, activation-energy, multi-step]
    stem: The rate constant of an enzyme-catalysed reaction doubles when the temperature rises from 300 K to 310 K (no denaturation). The uncatalysed reaction has Ea = 90 kJ mol^{-1}. With equal pre-exponential factors, the enzyme speeds up the reaction at 310 K by about (R = 8.314 J K^{-1} mol^{-1})
    options:
      - 4.6 × 10^2
      - 1.4 × 10^6
      - 1.8 × 10^{11}
      - 1.5 × 10^{15}
    answer: 1
    explanation: From ln 2 = (Ea/R)(1/300 − 1/310), Ea(enzyme) = 8.314 × 0.693 × (300 × 310 ÷ 10) ≈ 53.6 kJ mol^{-1}. Then k_E/k_U = e^{(90 − 53.6) × 1000 ÷ (8.314 × 310)} = e^{14.1} ≈ 1.4 × 10^6. Using the whole 90 kJ gives 1.5 × 10^{15}, and dividing the exponent by 2.303 gives 4.6 × 10^2.
