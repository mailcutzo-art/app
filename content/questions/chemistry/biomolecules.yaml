  - id: che-bio-112
    topic: enzymes
    subtopic: Enzyme inhibitors
    concept: A competitive inhibitor binds the active site, so excess substrate reduces its effect
    category: concept
    format: assertion-reason
    difficulty: 4
    time: 85
    ncert: true
    battle: false
    tags: [competitive-inhibitor, trap]
    stem: |-
      Assertion (A): The inhibition caused by a competitive inhibitor can be reduced by raising the substrate concentration.
      Reason (R): A competitive inhibitor binds to the enzyme at a site other than the active site.
    options:
      - Both A and R are true and R is the correct explanation of A
      - Both A and R are true but R is not the correct explanation of A
      - A is true but R is false
      - A is false but R is true
    answer: 2
    explanation: A is true because substrate and inhibitor compete for the same active site, so a large excess of substrate wins the competition. R is false, since the competitive inhibitor binds at the active site itself; binding at another site is non-competitive (allosteric) inhibition, which excess substrate cannot overcome.
  - id: che-bio-113
    topic: enzymes
    subtopic: Enzymes and temperature
    concept: Cold only slows an enzyme reversibly while heat denatures it irreversibly
    category: application
    format: case
    difficulty: 4
    time: 85
    ncert: true
    battle: false
    tags: [denaturation, low-temperature, case]
    stem: Two tubes hold the same enzyme solution. Tube 1 is kept in ice (273 K) for an hour, then warmed to 310 K and substrate is added. Tube 2 is boiled for 10 minutes, cooled to 310 K and substrate is added. Tube 1 shows good activity and Tube 2 almost none. What is the best explanation?
    options:
      - Boiling hydrolysed the peptide bonds to amino acids, and ice froze the substrate
      - Cooling and boiling both denature the enzyme equally, but cooling is quickly reversed
      - Ice raised the activation energy permanently, whereas boiling lowered it
      - Cold only slows molecular motion and leaves the folded structure intact, whereas boiling unfolds the enzyme irreversibly and destroys the active site
    answer: 3
    explanation: At 273 K the enzyme keeps its globular shape and active site and is merely sluggish, so activity returns on warming. Boiling disrupts the hydrogen bonds that maintain the secondary and tertiary structures, as in coagulation of egg white, and cooling does not refold it. Peptide bonds are not broken by boiling.
  - id: che-bio-114
    topic: enzymes
    subtopic: Mechanism of enzyme action
    concept: Using the NCERT activation energies of sucrose hydrolysis to find the rate enhancement
    category: numerical
    format: direct
    difficulty: 4
    time: 85
    ncert: true
    battle: false
    formula: ln(k_E/k_A) = (Ea_A − Ea_E) ÷ RT
    tags: [arrhenius, sucrase, activation-energy]
    stem: NCERT gives activation energies of 6.22 kJ mol^{-1} for acid hydrolysis of sucrose and 2.15 kJ mol^{-1} for hydrolysis by sucrase. With equal pre-exponential factors, how many times faster is the enzymatic reaction at 298 K? (R = 8.314 J K^{-1} mol^{-1})
    options:
      - About 2.9 times
      - About 5.2 times
      - About 44 times
      - About 59 times
    answer: 1
    explanation: Taking k = A e^{-Ea/RT}, ln(k_E/k_A) = (6220 − 2150) ÷ (8.314 × 298) = 4070 ÷ 2477.6 = 1.64, so k_E/k_A = e^{1.64} ≈ 5.2. The ratio of the two energies gives 2.9, treating 1.64 as a log10 value gives 44, and ignoring RT gives e^{4.07} ≈ 59.
  - id: che-bio-115
    topic: enzymes
    subtopic: Denaturation of enzymes
    concept: Heat disrupts secondary and tertiary structure but not the primary structure
    category: concept
    format: statement-pair
    difficulty: 4
    time: 85
    ncert: true
    battle: false
    tags: [denaturation, protein-structure, trap]
    stem: |-
      Statement I: An enzyme heated above its optimum temperature loses activity because its peptide bonds are hydrolysed.
      Statement II: Heating above the optimum temperature disrupts the secondary and tertiary structures of the enzyme, while its primary structure remains intact.
    options:
      - Both Statement I and Statement II are correct
      - Both Statement I and Statement II are incorrect
      - Statement I is correct but Statement II is incorrect
      - Statement I is incorrect but Statement II is correct
    answer: 3
    explanation: Heat breaks the hydrogen bonds and other weak interactions that hold the helices and the folded globule, so the active site is lost; this is denaturation. The sequence of amino acids joined by peptide bonds, the primary structure, is unchanged, so Statement I is wrong and Statement II is right.
