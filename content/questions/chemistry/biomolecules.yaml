questions:
  - id: che-bio-001
    topic: nucleic-acids
    subtopic: Monomer of nucleic acids
    concept: Nucleic acids are polynucleotides, polymers whose repeating unit is the nucleotide
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [nucleotide, polynucleotide]
    stem: Nucleic acids are long-chain polymers whose repeating units are
    options:
      - Nucleosides
      - Nucleotides
      - Amino acids
      - Pentose sugars
    answer: 1
    explanation: Each repeating unit consists of a nitrogenous base, a pentose sugar and a phosphate group, which is a nucleotide, so nucleic acids are polynucleotides. A nucleoside has no phosphate group and so cannot take part in the phosphodiester links of the chain.
  - id: che-bio-002
    topic: nucleic-acids
    subtopic: Sugar of DNA and RNA
    concept: DNA contains β-D-2-deoxyribose, RNA contains β-D-ribose
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [deoxyribose, sugar]
    stem: The sugar present in the nucleotides of DNA is
    options:
      - β-D-ribose
      - α-D-glucopyranose
      - β-D-2-deoxyribose
      - β-D-fructofuranose
    answer: 2
    explanation: DNA is deoxyribonucleic acid; its sugar is β-D-2-deoxyribose, which has H in place of –OH at C-2′. β-D-ribose is the sugar of RNA, and glucose and fructose are hexoses, not the pentoses found in nucleic acids.
  - id: che-bio-003
    topic: nucleic-acids
    subtopic: Bases of DNA and RNA
    concept: Uracil occurs in RNA in place of thymine and is absent from DNA
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [uracil, bases]
    stem: The nitrogenous base found in RNA but absent from DNA is
    options:
      - Thymine
      - Cytosine
      - Guanine
      - Uracil
    answer: 3
    explanation: Adenine, guanine and cytosine occur in both nucleic acids. The fourth base is thymine in DNA and uracil in RNA, so uracil is the base unique to RNA; thymine is the opposite trap.
  - id: che-bio-004
    topic: nucleic-acids
    subtopic: Purines and pyrimidines
    concept: Adenine and guanine are purines; cytosine, thymine and uracil are pyrimidines
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [purine, pyrimidine]
    stem: Which of the following bases is a purine?
    options:
      - Cytosine
      - Adenine
      - Thymine
      - Uracil
    answer: 1
    explanation: Purines have a fused six- and five-membered ring system, and the two purines in nucleic acids are adenine and guanine. Cytosine, thymine and uracil are pyrimidines with a single six-membered ring.
  - id: che-bio-005
    topic: nucleic-acids
    subtopic: Nucleoside and nucleotide
    concept: A nucleoside is base plus sugar; adding a phosphate group at C-5′ gives a nucleotide
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [nucleoside, nucleotide]
    stem: A nucleoside differs from the corresponding nucleotide in lacking
    options:
      - the pentose sugar
      - the nitrogenous base
      - the link between C-1′ of the sugar and the base
      - the phosphate group
    answer: 3
    explanation: A nucleoside is only a base attached to C-1′ of the sugar. Esterifying its 5′-OH with phosphoric acid gives the nucleotide, so the phosphate group is the missing part.
  - id: che-bio-006
    topic: nucleic-acids
    subtopic: Base pairing in DNA
    concept: A–T pair has two hydrogen bonds and G–C pair has three
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [base-pairing, hydrogen-bond]
    stem: The numbers of hydrogen bonds in an A–T base pair and in a G–C base pair of DNA are respectively
    options:
      - 3 and 2
      - 3 and 3
      - 2 and 2
      - 2 and 3
    answer: 3
    explanation: Adenine pairs with thymine through two hydrogen bonds, and guanine pairs with cytosine through three. Reversing the two numbers is the common slip.
  - id: che-bio-007
    topic: nucleic-acids
    subtopic: Phosphodiester linkage
    concept: Nucleotides are joined by phosphodiester links between C-3′ of one sugar and C-5′ of the next
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [phosphodiester, polynucleotide]
    stem: In a polynucleotide chain, successive nucleotides are joined by a phosphodiester linkage between the
    options:
      - 2′ carbon of one sugar and 5′ carbon of the next sugar
      - 1′ carbon of one sugar and 3′ carbon of the next sugar
      - 5′ carbons of the two adjacent sugars
      - 3′ carbon of one sugar and 5′ carbon of the next sugar
    answer: 3
    explanation: The phosphate group esterified at C-5′ of one nucleotide is also esterified to the 3′-OH of the neighbouring nucleotide, so the link is 3′–5′. This gives the chain a direction, with a 5′ end and a 3′ end.
  - id: che-bio-008
    topic: nucleic-acids
    subtopic: Primary and secondary structure
    concept: Primary structure of a nucleic acid is the nucleotide sequence, secondary structure is the base-paired helix
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [primary-structure, secondary-structure]
    stem: Which of the following describes the primary structure of a nucleic acid?
    options:
      - The sequence of nucleotides along the polynucleotide chain
      - The pairing of two chains through hydrogen bonds between bases
      - The coiling of two chains about each other into a double helix
      - The folding of a single chain into hairpin loops
    answer: 0
    explanation: The primary structure is only the order of nucleotides (that is, of bases) in the chain. Base pairing and the double helix are features of the secondary structure.
  - id: che-bio-009
    topic: nucleic-acids
    subtopic: Hydrolysis products
    concept: Complete hydrolysis of RNA gives ribose, phosphoric acid and the bases A, G, C and U
    category: factual
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [hydrolysis, rna, composition]
    stem: Complete hydrolysis of RNA gives
    options:
      - 2-deoxyribose, phosphoric acid, adenine, guanine, cytosine and thymine
      - ribose, phosphoric acid, adenine, guanine, cytosine and uracil
      - ribose, phosphoric acid, adenine, guanine, cytosine and thymine
      - 2-deoxyribose, phosphoric acid, adenine, guanine, cytosine and uracil
    answer: 1
    explanation: RNA has two features that differ from DNA, a ribose sugar and uracil as the fourth base. The correct set must match both, so only ribose with A, G, C and U is right; of the other sets, one is the DNA set and two mix one DNA feature with one RNA feature.
  - id: che-bio-010
    topic: nucleic-acids
    subtopic: Chargaff's rules
    concept: In double-stranded DNA [A] = [T] and [G] = [C], so G + C = 100 − 2A
    category: numerical
    format: direct
    difficulty: 3
    time: 50
    ncert: false
    battle: true
    formula: '[A] = [T], [G] = [C], [A] + [T] + [G] + [C] = 100%'
    tags: [chargaff, base-composition]
    stem: In a double-stranded DNA, thymine forms 28% of the bases. What percentage of the bases is cytosine?
    options:
      - 22%
      - 28%
      - 36%
      - 44%
    answer: 0
    explanation: With 28% T, adenine is also 28%, so A + T = 56%. The remaining 44% is G + C, shared equally, so cytosine is 22%. Dividing 100 − 28 by 2 gives 36%, which forgets adenine.
  - id: che-bio-011
    topic: nucleic-acids
    subtopic: Hydrogen bonds in a DNA segment
    concept: Total hydrogen bonds = 2 per A–T pair + 3 per G–C pair
    category: numerical
    format: direct
    difficulty: 3
    time: 50
    ncert: false
    battle: true
    formula: H-bonds = 2 × (A–T pairs) + 3 × (G–C pairs)
    tags: [hydrogen-bond, base-pairing]
    stem: A double-stranded DNA fragment has 10 base pairs, of which 4 are A–T pairs. How many hydrogen bonds hold its two strands together?
    options:
      - '20'
      - '24'
      - '26'
      - '30'
    answer: 2
    explanation: The 4 A–T pairs give 4 × 2 = 8 bonds. The other 6 pairs are G–C, giving 6 × 3 = 18, so the total is 26. Swapping the two bond numbers gives 24, and treating every pair alike gives 20 or 30.
  - id: che-bio-012
    topic: nucleic-acids
    subtopic: Thymine and uracil
    concept: Thymine is 5-methyluracil
    category: factual
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [thymine, uracil]
    stem: Compared with uracil, the base thymine has an additional
    options:
      - –CH_3 group at C-5 of the ring
      - –NH_2 group at C-4 of the ring
      - fused five-membered ring
      - –OH group at C-5 of the ring
    answer: 0
    explanation: Both are pyrimidine-2,4-diones, but thymine carries a methyl group at C-5, so it is 5-methyluracil. An amino group at C-4 is what distinguishes cytosine, and a fused five-membered ring is a feature of purines.
  - id: che-bio-013
    topic: nucleic-acids
    subtopic: Complementary strands and directionality
    concept: Complementary strands are antiparallel, so the complement is written in reverse when read 5′→3′
    category: application
    format: direct
    difficulty: 3
    time: 50
    ncert: false
    battle: true
    tags: [antiparallel, complementary-strand]
    stem: The complementary DNA strand of 5′-ATGGCT-3′, written in the 5′→3′ direction, is
    options:
      - 5′-TACCGA-3′
      - 5′-AGCCAT-3′
      - 5′-TCGGTA-3′
      - 5′-UACCGA-3′
    answer: 1
    explanation: Base-pairing gives 3′-TACCGA-5′ opposite the given strand, because the strands are antiparallel. Reading this from its own 5′ end gives 5′-AGCCAT-3′. 5′-TACCGA-3′ forgets the reversal, 5′-TCGGTA-3′ reverses without complementing, and uracil does not occur in DNA.
  - id: che-bio-014
    topic: nucleic-acids
    subtopic: Denaturation of the double helix
    concept: Heating breaks the hydrogen bonds between bases but not the covalent backbone
    category: application
    format: direct
    difficulty: 3
    time: 50
    ncert: false
    battle: true
    tags: [denaturation, hydrogen-bond, secondary-structure]
    stem: On gentle heating, the two strands of double-stranded DNA separate. Which bonds are broken?
    options:
      - Phosphodiester linkages between nucleotides
      - N-glycosidic bonds between sugar and base
      - Hydrogen bonds between complementary bases
      - All the covalent bonds of the backbone
    answer: 2
    explanation: The strands are held together by weak hydrogen bonds between base pairs, which heat breaks first. The covalent phosphodiester and sugar–base bonds stay intact, so each strand keeps its primary structure; only the secondary structure is lost.
  - id: che-bio-015
    topic: nucleic-acids
    subtopic: Phosphodiester linkages in a chain
    concept: A linear chain of n nucleotides has n − 1 phosphodiester linkages
    category: numerical
    format: direct
    difficulty: 3
    time: 50
    ncert: false
    battle: true
    formula: Linkages = n − 1
    tags: [phosphodiester, hydrolysis]
    stem: A linear single-stranded polynucleotide has 25 nucleotides. How many water molecules are used to hydrolyse it completely into 25 free nucleotides?
    options:
      - '25'
      - '48'
      - '50'
      - '24'
    answer: 3
    explanation: Joining 25 nucleotides in a line forms 24 phosphodiester linkages, each with loss of one water molecule. Breaking all of them therefore consumes 24 water molecules; counting the nucleotides themselves (25) is the usual slip.
  - id: che-bio-016
    topic: nucleic-acids
    subtopic: Ring structure of bases
    concept: A purine ring system has four nitrogen atoms and a pyrimidine ring has two
    category: factual
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [purine, pyrimidine, ring-nitrogen]
    stem: The numbers of nitrogen atoms in the ring system of a purine and of a pyrimidine are respectively
    options:
      - 4 and 2
      - 2 and 4
      - 3 and 2
      - 4 and 3
    answer: 0
    explanation: A purine is a fused six- and five-membered ring system with four ring nitrogens, and a pyrimidine is a single six-membered ring with two ring nitrogens. Exocyclic –NH_2 groups are not counted as ring atoms.
  - id: che-bio-017
    topic: nucleic-acids
    subtopic: Hydrogen bonds from a total count
    concept: Total H-bonds = 3 × (base pairs) − (A–T pairs), used in reverse
    category: numerical
    format: direct
    difficulty: 4
    time: 85
    ncert: false
    battle: false
    formula: H-bonds = 2x + 3(n − x), x = number of A–T pairs
    tags: [hydrogen-bond, base-composition]
    stem: A double-stranded DNA of 200 base pairs has a total of 520 hydrogen bonds between its strands. What percentage of all its bases is guanine?
    options:
      - 20%
      - 30%
      - 40%
      - 60%
    answer: 1
    explanation: If x pairs are A–T, then 2x + 3(200 − x) = 600 − x = 520, so x = 80 and G–C pairs = 120. Guanine is 120 of the 400 bases, which is 30%. 20% is adenine, 40% is the share of A–T pairs and 60% is G + C.
  - id: che-bio-018
    topic: nucleic-acids
    subtopic: Ends and linkages of a duplex
    concept: A linear duplex of n base pairs has 2(n − 1) phosphodiester bonds and two 5′ and two 3′ ends
    category: numerical
    format: direct
    difficulty: 5
    time: 120
    ncert: false
    battle: false
    formula: Phosphodiester bonds = 2(n − 1)
    tags: [phosphodiester, antiparallel, counting]
    stem: A linear double-stranded DNA of 50 base pairs has a free phosphate group at the 5′ end of each strand. The numbers of phosphodiester bonds, free 5′-phosphate groups and free 3′-OH groups in it are respectively
    options:
      - 49, 1 and 1
      - 98, 1 and 1
      - 98, 2 and 2
      - 100, 2 and 2
    answer: 2
    explanation: Each strand has 50 nucleotides joined by 49 phosphodiester bonds, so the duplex has 2 × 49 = 98. Each of the two antiparallel strands has one 5′-phosphate end and one 3′-OH end, so there are 2 of each. 49 counts one strand only, and 100 forgets that n nucleotides make n − 1 links.
  - id: che-bio-019
    topic: nucleic-acids
    subtopic: Composition of the bases
    concept: Counting nitrogen atoms in A, G, C and T from their structures
    category: numerical
    format: direct
    difficulty: 5
    time: 120
    ncert: false
    battle: false
    tags: [base-structure, counting]
    stem: A double-stranded DNA segment has 10 base pairs, of which 4 are G–C pairs. The total number of nitrogen atoms in all the bases of both strands is
    options:
      - '37'
      - '60'
      - '74'
      - '76'
    answer: 2
    explanation: Adenine and guanine each contain 5 N atoms (4 in the ring system plus one –NH_2), cytosine contains 3 and thymine 2. An A–T pair therefore has 7 N and a G–C pair has 8 N, so the total is 6 × 7 + 4 × 8 = 74. 60 counts only ring nitrogens, 76 swaps the pair counts and 37 counts one strand.
  - id: che-bio-020
    topic: nucleic-acids
    subtopic: Chargaff's rules in DNA and RNA
    concept: '[A] = [T] and [G] = [C] hold for double-stranded DNA but not for single-stranded RNA'
    category: concept
    format: statement-pair
    difficulty: 3
    time: 50
    ncert: false
    battle: false
    tags: [chargaff, dna-vs-rna]
    stem: |-
      Statement I: In the DNA of any species, the amount of adenine equals that of thymine and the amount of guanine equals that of cytosine.
      Statement II: In every RNA molecule, the amount of adenine must equal that of uracil and the amount of guanine must equal that of cytosine.
    options:
      - Statement I is correct but Statement II is incorrect
      - Both Statement I and Statement II are correct
      - Statement I is incorrect but Statement II is correct
      - Both Statement I and Statement II are incorrect
    answer: 0
    explanation: The equalities in DNA follow from base pairing between its two strands, A with T and G with C. RNA is generally single-stranded, so each base has no obligatory partner and the equalities need not hold.
  - id: che-bio-021
    topic: nucleic-acids
    subtopic: Sugars of DNA and RNA
    concept: Both sugars are β-D-pentofuranoses differing only at C-2′
    category: factual
    format: statement-pair
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [ribose, deoxyribose]
    stem: |-
      Statement I: In both DNA and RNA the pentose sugar is present as a five-membered ring joined to the base at C-1′.
      Statement II: β-D-2-deoxyribose differs from β-D-ribose only in having a hydrogen atom in place of the –OH group at C-2′.
    options:
      - Statement I is correct but Statement II is incorrect
      - Both Statement I and Statement II are correct
      - Both Statement I and Statement II are incorrect
      - Statement I is incorrect but Statement II is correct
    answer: 1
    explanation: Ribose and 2-deoxyribose are both pentoses that exist as five-membered rings attached to the base at C-1′ in nucleosides. They differ only at C-2′, which has H in deoxyribose and –OH in ribose, hence the name 2-deoxy. Both statements are correct.
  - id: che-bio-022
    topic: nucleic-acids
    subtopic: Base pairing in RNA
    concept: Folded RNA has helical stretches in which adenine pairs with uracil, not thymine
    category: concept
    format: statement-pair
    difficulty: 4
    time: 85
    ncert: false
    battle: false
    tags: [rna, base-pairing, trap]
    stem: |-
      Statement I: A single-stranded RNA can fold back on itself so that short stretches form double helices through base pairing.
      Statement II: In such stretches, adenine pairs with thymine through two hydrogen bonds.
    options:
      - Both Statement I and Statement II are correct
      - Both Statement I and Statement II are incorrect
      - Statement I is correct but Statement II is incorrect
      - Statement I is incorrect but Statement II is correct
    answer: 2
    explanation: Folding of an RNA chain brings complementary stretches together, and these pair as double helices, so Statement I is correct. RNA has no thymine; adenine pairs with uracil (two hydrogen bonds) and guanine with cytosine (three), which makes Statement II wrong.
  - id: che-bio-023
    topic: nucleic-acids
    subtopic: Purines and pyrimidines in the double helix
    concept: Equal purines and pyrimidines follow from each pair having one of each, not from the H-bond numbers
    category: concept
    format: assertion-reason
    difficulty: 3
    time: 50
    ncert: false
    battle: false
    tags: [chargaff, purine-pyrimidine, trap]
    stem: |-
      Assertion (A): In a double-stranded DNA, the total number of purine bases equals the total number of pyrimidine bases.
      Reason (R): Adenine pairs with thymine through two hydrogen bonds, and guanine pairs with cytosine through three hydrogen bonds.
    options:
      - Both A and R are true and R is the correct explanation of A
      - Both A and R are true but R is not the correct explanation of A
      - A is true but R is false
      - A is false but R is true
    answer: 1
    explanation: Every base pair is one purine (A or G) joined to one pyrimidine (T or C), so purines and pyrimidines are equal in number. The hydrogen-bond numbers in R are correct, but they do not explain the equality; the one-purine-one-pyrimidine pairing does.
  - id: che-bio-024
    topic: nucleic-acids
    subtopic: Stability of DNA and RNA
    concept: The 2′-OH group of ribose makes RNA more reactive and less stable than DNA
    category: concept
    format: assertion-reason
    difficulty: 4
    time: 85
    ncert: true
    battle: false
    tags: [dna-vs-rna, stability]
    stem: |-
      Assertion (A): RNA is chemically less stable than DNA and is degraded more readily.
      Reason (R): The sugar of RNA carries a reactive –OH group at C-2′, which is absent from the sugar of DNA.
    options:
      - Both A and R are true and R is the correct explanation of A
      - Both A and R are true but R is not the correct explanation of A
      - A is true but R is false
      - A is false but R is true
    answer: 0
    explanation: Ribose has an extra –OH at C-2′ next to the phosphodiester link, which makes RNA labile, whereas 2-deoxyribose has only H there and DNA is chemically less reactive and structurally more stable. Both statements are true and R explains A.
  - id: che-bio-025
    topic: nucleic-acids
    subtopic: Stability and base composition
    concept: DNA rich in G–C pairs is more stable because G–C has three H-bonds against two for A–T
    category: application
    format: assertion-reason
    difficulty: 4
    time: 85
    ncert: false
    battle: false
    tags: [hydrogen-bond, stability, trap]
    stem: |-
      Assertion (A): A DNA rich in G–C pairs separates into single strands at a lower temperature than a DNA of the same length rich in A–T pairs.
      Reason (R): The G–C base pair is held by three hydrogen bonds, whereas the A–T base pair is held by two.
    options:
      - Both A and R are true and R is the correct explanation of A
      - Both A and R are true but R is not the correct explanation of A
      - A is true but R is false
      - A is false but R is true
    answer: 3
    explanation: R is true. Because each G–C pair has an extra hydrogen bond, a G–C-rich DNA has more bonds to break and needs a higher, not lower, temperature to separate its strands, which makes A false.
  - id: che-bio-026
    topic: nucleic-acids
    subtopic: DNA versus RNA
    concept: Comparison of strandedness, bases, sugar and RNA types
    category: factual
    format: multi-statement
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [dna-vs-rna, rna-types]
    stem: |-
      Consider the following statements about nucleic acids.
      I. DNA is usually double-stranded, whereas RNA is usually single-stranded.
      II. DNA contains thymine, whereas RNA contains uracil in its place.
      III. Both DNA and RNA contain β-D-2-deoxyribose as the sugar.
      IV. RNA occurs in three types: m-RNA, r-RNA and t-RNA.
      Which of these statements are correct?
    options:
      - I and II only
      - II, III and IV only
      - I, II and IV only
      - I, III and IV only
    answer: 2
    explanation: Statements I, II and IV are correct. III is wrong because only DNA contains 2-deoxyribose; RNA contains β-D-ribose.
  - id: che-bio-027
    topic: nucleic-acids
    subtopic: Ratios of bases in strands and duplex
    concept: Complementary strands invert the (A+G)/(T+C) ratio but keep (A+T)/(G+C); the duplex has a purine/pyrimidine ratio of 1
    category: application
    format: multi-statement
    difficulty: 5
    time: 120
    ncert: false
    battle: false
    tags: [chargaff, complementary-strand, ratios]
    stem: |-
      In one strand of a double-stranded DNA, (A+G)/(T+C) = 0.8 and (A+T)/(G+C) = 0.6. Consider these statements.
      I. In the complementary strand, (A+G)/(T+C) = 1.25.
      II. In the complementary strand, (A+T)/(G+C) = 1.67.
      III. In the whole double helix, (A+G)/(T+C) = 1.
      IV. In the whole double helix, (A+T)/(G+C) = 0.6.
      Which of these statements are correct?
    options:
      - I, II and III only
      - II, III and IV only
      - I and IV only
      - I, III and IV only
    answer: 3
    explanation: The complementary strand has A, T, G, C equal to T, A, C, G of the first strand, so (A+G)/(T+C) becomes the reciprocal, 1/0.8 = 1.25 (I is correct), while (A+T)/(G+C) is unchanged at 0.6 (II is wrong). In the duplex A = T and G = C overall, so the purine/pyrimidine ratio is 1 (III) and (A+T)/(G+C) stays 0.6 (IV).
  - id: che-bio-028
    topic: nucleic-acids
    subtopic: General features of nucleic acids
    concept: Acidic backbone, complementarity, primary and secondary structure, nucleotide count of a duplex
    category: concept
    format: multi-statement
    difficulty: 4
    time: 85
    ncert: true
    battle: false
    tags: [backbone, complementary-strand, structure]
    stem: |-
      Consider the following statements about nucleic acids.
      I. The phosphate groups of the sugar–phosphate backbone make nucleic acids acidic.
      II. The two strands of a DNA double helix have identical base sequences.
      III. The nucleotide sequence is the primary structure, and the double helix is the secondary structure of DNA.
      IV. A double-stranded DNA with n base pairs contains 2n nucleotides.
      Which of these statements are correct?
    options:
      - I, III and IV only
      - I, II and III only
      - II, III and IV only
      - I and III only
    answer: 0
    explanation: I, III and IV are correct. II is wrong because the strands are complementary, not identical (A in one strand faces T in the other, and G faces C). Each base pair contributes two nucleotides, so n pairs have 2n.
  - id: che-bio-029
    topic: nucleic-acids
    subtopic: Structure of the DNA double helix
    concept: Complementary antiparallel strands with bases paired inside and the backbone outside
