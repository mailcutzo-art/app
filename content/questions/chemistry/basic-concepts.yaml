    explanation: "H_2 + ½O_2 → H_2O (0.5); C + O_2 → CO_2 (1); CH_4 + 2O_2 (2); C_2H_5OH + 3O_2 → 2CO_2 + 3H_2O (3). So H_2 < C < CH_4 < C_2H_5OH."

