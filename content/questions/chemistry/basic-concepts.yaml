questions:
  - id: che-basic-001
    topic: matter-classification
    subtopic: Homogeneous and heterogeneous mixtures
    concept: Air is a homogeneous mixture
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [mixtures, ncert-line]
    stem: Which of the following is a homogeneous mixture?
    options:
      - Mixture of sand and common salt
      - Air
      - Oil and water
      - Iron filings and sulphur powder
    answer: 1
    explanation: "A homogeneous mixture has uniform composition throughout. Air is a uniform mixture of gases (N_2, O_2, Ar, CO_2 and others). The other three mixtures show visibly separate components, so they are heterogeneous."

  - id: che-basic-002
    topic: matter-classification
    subtopic: Compounds versus mixtures
    concept: Compounds have fixed composition and cannot be separated physically
    category: concept
    format: statement-pair
    difficulty: 3
    time: 40
    ncert: true
    battle: false
    tags: [compounds, mixtures, trap]
    stem: |-
      Statement I: The constituents of a compound can be separated by physical methods such as filtration or distillation.
      Statement II: A mixture always has a fixed composition by mass.
    options:
      - Both Statement I and Statement II are correct
      - Both Statement I and Statement II are incorrect
      - Statement I is correct but Statement II is incorrect
      - Statement I is incorrect but Statement II is correct
    answer: 1
    explanation: "Constituents of a compound are chemically combined and can be separated only by chemical methods, so Statement I is wrong. A mixture can have any (variable) composition; it is a compound that has a fixed composition. Hence both statements are incorrect."

  - id: che-basic-003
    topic: matter-classification
    subtopic: Pure substances
    concept: Alloys like brass are mixtures, not pure substances
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: false
    battle: true
    tags: [pure-substances, trap]
    stem: Which of the following is NOT a pure substance?
    options:
      - Distilled water
      - Copper
      - Sodium chloride
      - Brass
    answer: 3
    explanation: "Brass is an alloy of copper and zinc whose composition can vary, so it is a (homogeneous) mixture. Distilled water and sodium chloride are compounds, and copper is an element; all three are pure substances with fixed composition."

  - id: che-basic-004
    topic: measurement-units
    subtopic: Density
    concept: SI unit of density
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [si-units, density]
    stem: What is the SI unit of density?
    options:
      - g cm^{-3}
      - kg m^{-3}
      - kg L^{-1}
      - g mL^{-1}
    answer: 1
    explanation: "Density = mass/volume. In SI, mass is in kg and volume in m^3, so density is in kg m^{-3}. The unit g cm^{-3} is common in the laboratory but it is not the SI unit."

  - id: che-basic-005
    topic: measurement-units
    subtopic: Temperature scales
    concept: Converting Celsius to Fahrenheit
    category: numerical
    format: direct
    difficulty: 2
    time: 35
    ncert: true
    battle: true
    formula: °F = (9/5)(°C) + 32
    tags: [temperature]
    stem: A temperature of 40 °C corresponds to which reading on the Fahrenheit scale?
    options:
      - 72 °F
      - 88 °F
      - 313 °F
      - 104 °F
    answer: 3
    explanation: "°F = (9/5)(40) + 32 = 72 + 32 = 104 °F. The value 72 °F comes from forgetting to add 32, and 313 is the kelvin value, not °F."

  - id: che-basic-006
    topic: measurement-units
    subtopic: Mass and weight
    concept: Mass is constant while weight depends on gravity
    category: concept
    format: statements
    difficulty: 3
    time: 40
    ncert: true
    battle: false
    tags: [mass-weight, ncert-line]
    stem: Which of the following statements about mass and weight is correct?
    options:
      - The mass of a body changes from place to place
      - An analytical balance measures the weight of a body in newtons
      - The mass of a body is constant, whereas its weight may vary with gravity
      - Mass and weight have the same SI unit
    answer: 2
    explanation: "Mass is the amount of matter in a body and stays constant; weight is the force exerted by gravity on it and changes with g. An analytical balance determines mass (in kg or g), and weight has the unit newton, not kilogram."

  - id: che-basic-007
    topic: measurement-units
    subtopic: Volume units
    concept: One litre equals one cubic decimetre
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [volume, ncert-line]
    stem: One litre is equal to
    options:
      - 1 dm^3
      - 1 m^3
      - 100 cm^3
      - 10 cm^3
    answer: 0
    explanation: "1 L = 1000 cm^3 = 1 dm^3, and 1 m^3 = 1000 L. So 1 L is not 1 m^3; students often confuse dm^3 with m^3."

  - id: che-basic-008
    topic: uncertainty-sig-figs
    subtopic: Counting significant figures
    concept: Leading zeros are not significant; trailing zeros after decimal are
    category: concept
    format: direct
    difficulty: 2
    time: 25
    ncert: true
    battle: true
    tags: [significant-figures, trap]
    stem: How many significant figures are there in 0.00520?
    options:
      - "2"
      - "3"
      - "5"
      - "6"
    answer: 1
    explanation: "Zeros to the left of the first non-zero digit only locate the decimal point and are not significant. The digits 5, 2 and the trailing zero (to the right of the decimal point) are significant, giving 3."

  - id: che-basic-009
    topic: uncertainty-sig-figs
    subtopic: Scientific notation
    concept: In scientific notation only the digits of the coefficient are counted
    category: concept
    format: direct
    difficulty: 2
    time: 25
    ncert: true
    battle: true
    tags: [significant-figures, scientific-notation]
    stem: How many significant figures are there in 6.0230 × 10^{23}?
    options:
      - "4"
      - "6"
      - "23"
      - "5"
    answer: 3
    explanation: "In exponential notation, only the digits in the coefficient (6.0230) are significant; the power of ten does not add figures. The coefficient has 5 significant figures, including the trailing zero after the decimal point."

  - id: che-basic-010
    topic: uncertainty-sig-figs
    subtopic: Accuracy and precision
    concept: Close repeated values far from the true value are precise but not accurate
    category: application
    format: case
    difficulty: 3
    time: 40
    ncert: true
    battle: false
    tags: [accuracy-precision]
    stem: The true mass of a sample is 2.00 g. A student weighs it three times and records 3.01 g, 3.02 g and 3.01 g. The student's results are
    options:
      - accurate and precise
      - accurate but not precise
      - precise but not accurate
      - neither accurate nor precise
    answer: 2
    explanation: "Precision is the closeness of repeated measurements to each other; accuracy is agreement with the true value. The readings agree closely with one another (precise) but are about 1 g away from 2.00 g (not accurate)."

  - id: che-basic-011
    topic: uncertainty-sig-figs
    subtopic: Rounding off
    concept: When the dropped digit is 5, an even preceding digit is left unchanged
    category: application
    format: direct
    difficulty: 3
    time: 40
    ncert: true
    battle: true
    tags: [rounding, trap, ncert-line]
    stem: According to the NCERT rounding rule, 2.785 rounded off to three significant figures is
    options:
      - "2.79"
      - "2.78"
      - "2.8"
      - "2.780"
    answer: 1
    explanation: "When the digit to be removed is exactly 5, the preceding digit is left unchanged if it is even and increased by one if it is odd. Here the preceding digit 8 is even, so 2.785 becomes 2.78. The answer 2.79 comes from always rounding 5 upward."

  - id: che-basic-012
    topic: uncertainty-sig-figs
    subtopic: Addition with significant figures
    concept: In addition, the result keeps the least number of decimal places
    category: numerical
    format: direct
    difficulty: 3
    time: 45
    ncert: true
    battle: true
    tags: [significant-figures, addition]
    stem: The sum 12.11 + 18.0 + 1.012, reported to the correct number of significant figures, is
    options:
      - "31.122"
      - "31.12"
      - "31.1"
      - "31"
    answer: 2
    explanation: "In addition and subtraction the result cannot have more digits to the right of the decimal point than the term with the fewest. 18.0 has one decimal place, so 31.122 is reported as 31.1."

  - id: che-basic-013
    topic: laws-of-combination
    subtopic: Law of definite proportions
    concept: Proust gave the law of definite proportions
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [definite-proportions, ncert-line]
    stem: The law of definite proportions was given by
    options:
      - Joseph Proust
      - Antoine Lavoisier
      - John Dalton
      - Amedeo Avogadro
    answer: 0
    explanation: "Joseph Proust stated that a given compound always contains exactly the same proportion of elements by weight (shown with natural and synthetic cupric carbonate). Lavoisier gave the law of conservation of mass and Dalton the law of multiple proportions."

  - id: che-basic-014
    topic: laws-of-combination
    subtopic: Law of multiple proportions
    concept: Masses of O combining with fixed mass of H in H2O and H2O2 are in 1:2
    category: numerical
    format: direct
    difficulty: 3
    time: 40
    ncert: true
    battle: true
    tags: [multiple-proportions]
    stem: In H_2O and H_2O_2, the masses of oxygen that combine with a fixed mass of hydrogen are in the ratio
    options:
      - "1:1"
      - "1:2"
      - "2:1"
      - "1:16"
    answer: 1
    explanation: "With 2 g of hydrogen, water contains 16 g of oxygen and hydrogen peroxide contains 32 g of oxygen. The ratio 16 : 32 = 1 : 2 is a simple whole-number ratio, illustrating the law of multiple proportions."

  - id: che-basic-015
    topic: laws-of-combination
    subtopic: Gay Lussac's law
    concept: Volume ratio of H2, O2 and water vapour is 2:1:2
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [gay-lussac, gaseous-volumes, ncert-line]
    stem: At the same temperature and pressure, the volumes of hydrogen, oxygen and water vapour in the reaction forming water are in the ratio
    options:
      - "2:1:1"
      - "1:1:1"
      - "2:1:2"
      - "1:2:2"
    answer: 2
    explanation: "100 mL of hydrogen combines with 50 mL of oxygen to give 100 mL of water vapour, a ratio of 2 : 1 : 2. This simple ratio of gaseous volumes is Gay Lussac's law."

  - id: che-basic-016
    topic: laws-of-combination
    subtopic: Law of conservation of mass
    concept: Conservation of mass follows from atoms being neither created nor destroyed
    category: concept
    format: assertion-reason
    difficulty: 2
    time: 40
    ncert: true
    battle: false
    tags: [conservation-of-mass, dalton]
    stem: |-
      Assertion (A): In a chemical reaction, the total mass of the reactants equals the total mass of the products.
      Reason (R): In a chemical reaction, atoms are neither created nor destroyed but only rearranged.
    options:
      - Both A and R are true and R is the correct explanation of A
      - Both A and R are true but R is not the correct explanation of A
      - A is true but R is false
      - A is false but R is true
    answer: 0
    explanation: "A is Lavoisier's law of conservation of mass. Dalton explained it with the postulate that a reaction only reorganises atoms without creating or destroying them, so the total mass cannot change. R correctly explains A."

  - id: che-basic-017
    topic: dalton-theory
    subtopic: Postulates
    concept: Dalton postulate explaining conservation of mass
    category: concept
    format: direct
    difficulty: 2
    time: 35
    ncert: true
    battle: false
    tags: [dalton, postulates]
    stem: Which postulate of Dalton's atomic theory accounts for the law of conservation of mass?
    options:
      - Matter consists of indivisible atoms
      - All atoms of a given element have identical properties, including identical mass
      - Compounds are formed when atoms of different elements combine in a fixed ratio
      - Chemical reactions involve reorganisation of atoms, which are neither created nor destroyed
    answer: 3
    explanation: "If atoms are only rearranged, the number of each kind of atom, and so the total mass, stays the same. The fixed-ratio postulate explains the law of definite proportions, not conservation of mass."

  - id: che-basic-018
    topic: dalton-theory
    subtopic: Limitations
    concept: Isotopes contradict identical mass of atoms of an element
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: false
    battle: true
    tags: [dalton, limitations]
    stem: Which discovery shows that atoms of the same element need not have identical masses, contrary to Dalton's theory?
    options:
      - Isobars
      - Isotopes
      - Allotropes
      - Isomers
    answer: 1
    explanation: "Isotopes are atoms of the same element with different masses (for example Cl-35 and Cl-37), contradicting Dalton's postulate. Isobars are atoms of different elements with the same mass number, which contradicts a different idea."

  - id: che-basic-019
    topic: atomic-molecular-mass
    subtopic: Atomic mass unit
    concept: 1 amu is 1/12 of the mass of a carbon-12 atom
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [amu, ncert-line]
    stem: One atomic mass unit (u) is defined as
    options:
      - 1/12 of the mass of one carbon-12 atom
      - the mass of one hydrogen atom
      - 1/16 of the mass of one oxygen-16 atom
      - the mass of one proton
    answer: 0
    explanation: "Since 1961 the reference is carbon-12, assigned exactly 12 u; 1 u is 1/12 of the mass of one C-12 atom (1.66056 × 10^{-24} g). Hydrogen and oxygen-16 were older references."

  - id: che-basic-020
    topic: atomic-molecular-mass
    subtopic: Average atomic mass
    concept: Average atomic mass from isotopic abundances
    category: numerical
    format: direct
    difficulty: 3
    time: 45
    ncert: true
    battle: true
    formula: Average atomic mass = Σ (fractional abundance × isotopic mass)
    tags: [average-atomic-mass, isotopes]
    stem: Chlorine has 75% Cl-35 (35 u) and 25% Cl-37 (37 u). Its average atomic mass is
    options:
      - 36.0 u
      - 35.0 u
      - 36.5 u
      - 35.5 u
    answer: 3
    explanation: "Average atomic mass = 0.75 × 35 + 0.25 × 37 = 26.25 + 9.25 = 35.5 u. The simple average of 35 and 37 (36.0 u) ignores the abundances."

  - id: che-basic-021
    topic: atomic-molecular-mass
    subtopic: Molecular mass
    concept: Molecular mass of glucose
    category: numerical
    format: direct
    difficulty: 1
    time: 30
    ncert: true
    battle: true
    tags: [molecular-mass]
    stem: The molecular mass of glucose (C_6H_{12}O_6) is
    options:
      - 180 u
      - 168 u
      - 186 u
      - 342 u
    answer: 0
    explanation: "Molecular mass = 6(12) + 12(1) + 6(16) = 72 + 12 + 96 = 180 u. 342 u is the molecular mass of sucrose."

  - id: che-basic-022
    topic: atomic-molecular-mass
    subtopic: Formula mass
    concept: Ionic compounds have formula mass as they lack discrete molecules
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [formula-mass, ncert-line]
    stem: For sodium chloride we use the term formula mass instead of molecular mass because
    options:
      - NaCl is a gas at room temperature
      - sodium shows variable valency
      - NaCl has no discrete molecules; it is a three-dimensional array of Na^+ and Cl^- ions
      - NaCl dissociates only in water
    answer: 2
    explanation: "In solid NaCl, each Na^+ is surrounded by six Cl^- and vice versa in a 3D lattice, so no discrete NaCl molecule exists. The formula NaCl only gives the ratio of ions, and its mass (58.5 u) is called the formula mass."

  - id: che-basic-023
    topic: mole-concept
    subtopic: Avogadro number
    concept: One mole of water contains N_A molecules
    category: numerical
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [avogadro-number]
    stem: How many molecules are present in 18 g of water?
    options:
      - 3.011 × 10^{23}
      - 6.022 × 10^{23}
      - 1.2044 × 10^{24}
      - 1.084 × 10^{25}
    answer: 1
    explanation: "Molar mass of H_2O is 18 g mol^{-1}, so 18 g is 1 mol, containing 6.022 × 10^{23} molecules. The value 1.084 × 10^{25} comes from wrongly multiplying N_A by 18."

  - id: che-basic-024
    topic: mole-concept
    subtopic: Mass to moles
    concept: Moles = mass / molar mass for CO2
    category: numerical
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    formula: n = m/M
    tags: [moles]
    stem: How many moles are present in 88 g of carbon dioxide?
    options:
      - 4 mol
      - 0.5 mol
      - 1 mol
      - 2 mol
    answer: 3
    explanation: "Molar mass of CO_2 = 12 + 2(16) = 44 g mol^{-1}. n = 88/44 = 2 mol."

  - id: che-basic-025
    topic: mole-concept
    subtopic: Number of atoms
    concept: Total atoms = moles × atoms per molecule × N_A
    category: numerical
    format: direct
    difficulty: 3
    time: 45
    ncert: true
    battle: true
    tags: [number-of-atoms, trap]
    stem: The total number of atoms present in 0.5 mol of ammonia (NH_3) is
    options:
      - 3.011 × 10^{23}
      - 1.2044 × 10^{24}
      - 6.022 × 10^{23}
      - 2.4088 × 10^{24}
    answer: 1
    explanation: "0.5 mol NH_3 contains 0.5 N_A molecules; each molecule has 4 atoms. Atoms = 0.5 × 4 × 6.022 × 10^{23} = 1.2044 × 10^{24}. 3.011 × 10^{23} is the number of molecules, not atoms."

  - id: che-basic-026
    topic: mole-concept
    subtopic: Mass of a single atom
    concept: Mass of one atom = molar mass / N_A
    category: numerical
    format: direct
    difficulty: 3
    time: 45
    ncert: true
    battle: true
    tags: [mass-of-atom]
    stem: The mass of one atom of carbon-12 in grams is approximately
    options:
      - 1.993 × 10^{-23} g
      - 12 g
      - 1.66 × 10^{-24} g
      - 6.022 × 10^{-23} g
    answer: 0
    explanation: "One mole (6.022 × 10^{23} atoms) of C-12 weighs 12 g, so one atom weighs 12/(6.022 × 10^{23}) = 1.993 × 10^{-23} g. 1.66 × 10^{-24} g is the mass of 1 u, i.e. 1/12 of this."

  - id: che-basic-027
    topic: mole-concept
    subtopic: Comparing number of atoms
    concept: Greatest number of atoms corresponds to greatest number of moles of atoms
    category: numerical
    format: direct
    difficulty: 3
    time: 40
    ncert: false
    battle: true
    tags: [number-of-atoms, comparison]
    stem: Which of the following contains the largest number of atoms? (Fe = 56, Al = 27, C = 12, Ag = 108)
    options:
      - 56 g of iron
      - 27 g of aluminium
      - 24 g of carbon
      - 108 g of silver
    answer: 2
    explanation: "56 g Fe, 27 g Al and 108 g Ag are each 1 mol of atoms, but 24 g of carbon is 24/12 = 2 mol of atoms. So carbon has twice as many atoms (2N_A) as each of the others."

  - id: che-basic-028
    topic: mole-concept
    subtopic: Molar volume
    concept: Moles to volume at STP using 22.4 L mol^-1
    category: numerical
    format: direct
    difficulty: 3
    time: 40
    ncert: false
    battle: true
    formula: V = n × 22.4 L (at 273 K, 1 atm)
    tags: [molar-volume]
    stem: What volume does 4.4 g of CO_2 occupy at 273 K and 1 atm?
    options:
      - 22.4 L
      - 2.24 L
      - 4.48 L
      - 1.12 L
    answer: 1
    explanation: "4.4 g CO_2 = 4.4/44 = 0.1 mol. At 273 K and 1 atm one mole of an ideal gas occupies 22.4 L, so the volume is 0.1 × 22.4 = 2.24 L."

  - id: che-basic-029
    topic: mole-concept
    subtopic: Molar mass
    concept: Molar mass in g mol^-1 is numerically equal to molecular mass in u
    category: concept
    format: statements
    difficulty: 3
    time: 35
    ncert: true
    battle: false
    tags: [molar-mass, ncert-line]
    stem: The molar mass of a substance is
    options:
      - the mass of one molecule of the substance expressed in grams
      - numerically equal to its atomic or molecular mass in u, but expressed in g mol^{-1}
      - Avogadro's number divided by its molecular mass
      - the mass of 22.4 L of the substance, whatever its physical state
    answer: 1
    explanation: "Molar mass is the mass of one mole of a substance; e.g. water has molecular mass 18.02 u and molar mass 18.02 g mol^{-1}. The 22.4 L idea applies only to ideal gases under specified conditions, not to all states."

  - id: che-basic-030
    topic: empirical-molecular-formula
    subtopic: Percentage composition
    concept: Mass percent of carbon in CO2
    category: numerical
    format: direct
    difficulty: 1
    time: 30
    ncert: true
    battle: true
    formula: Mass % = (mass of element in 1 mol / molar mass) × 100
    tags: [percentage-composition]
    stem: The mass percentage of carbon in carbon dioxide is
    options:
      - 72.73%
      - 42.86%
      - 12.00%
      - 27.27%
    answer: 3
    explanation: "Mass % of C = (12/44) × 100 = 27.27%. The value 72.73% is the percentage of oxygen, and 42.86% is carbon in CO."

  - id: che-basic-031
    topic: empirical-molecular-formula
    subtopic: Empirical formula
    concept: Empirical formula of glucose is CH2O
    category: concept
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [empirical-formula]
    stem: The empirical formula of glucose, C_6H_{12}O_6, is
    options:
      - CHO
      - CH_2O
      - C_2H_4O_2
      - C_3H_6O_3
    answer: 1
    explanation: "The empirical formula shows the simplest whole-number ratio of atoms. C : H : O = 6 : 12 : 6 = 1 : 2 : 1, giving CH_2O."

  - id: che-basic-032
    topic: empirical-molecular-formula
    subtopic: Molecular formula from composition
    concept: Molecular formula from percentage composition and molar mass
    category: numerical
    format: direct
    difficulty: 4
    time: 90
    ncert: true
    battle: false
    formula: n = molar mass / empirical formula mass
    tags: [molecular-formula, multi-concept]
    stem: A compound contains 40.0% C, 6.67% H and 53.33% O by mass. Its molar mass is 60 g mol^{-1}. Its molecular formula is
    options:
      - C_2H_4O_2
      - CH_2O
      - C_3H_6O_3
      - C_2H_2O_4
    answer: 0
    explanation: "Moles: C = 40/12 = 3.33, H = 6.67/1 = 6.67, O = 53.33/16 = 3.33; ratio 1 : 2 : 1, so the empirical formula is CH_2O (mass 30). n = 60/30 = 2, giving C_2H_4O_2. CH_2O is only the empirical formula."

  - id: che-basic-033
    topic: empirical-molecular-formula
    subtopic: Molecular formula from empirical formula
    concept: n = molar mass / empirical formula mass
    category: numerical
    format: direct
    difficulty: 2
    time: 35
    ncert: true
    battle: true
    tags: [molecular-formula]
    stem: A hydrocarbon has empirical formula CH and molar mass 78 g mol^{-1}. Its molecular formula is
    options:
      - C_2H_2
      - C_4H_4
      - C_6H_6
      - C_8H_8
    answer: 2
    explanation: "Empirical formula mass of CH = 13. n = 78/13 = 6, so the molecular formula is (CH)_6 = C_6H_6."

  - id: che-basic-034
    topic: empirical-molecular-formula
    subtopic: Relation between formulas
    concept: Molecular formula is n times the empirical formula
    category: concept
    format: statement-pair
    difficulty: 3
    time: 40
    ncert: true
    battle: false
    tags: [empirical-formula, molecular-formula]
    stem: |-
      Statement I: The empirical formula and the molecular formula of hydrogen peroxide are the same.
      Statement II: Molecular formula = n × empirical formula, where n = molar mass / empirical formula mass.
    options:
      - Both Statement I and Statement II are correct
      - Both Statement I and Statement II are incorrect
      - Statement I is correct but Statement II is incorrect
      - Statement I is incorrect but Statement II is correct
    answer: 3
    explanation: "H_2O_2 has H : O = 2 : 2 = 1 : 1, so its empirical formula is HO, different from its molecular formula H_2O_2. Statement II is the standard relation (here n = 34/17 = 2)."

