    stem: |-
      Which statements about the hydrogen spectrum are correct?
      I. In principle, each series contains an infinite number of lines converging to a limit.
      II. The H_α line of the Balmer series is red.
      III. The series-limit energy of a series equals the energy needed to ionise the atom from the level n_1 of that series.
      IV. The first line of the Paschen series has a shorter wavelength than the first line of the Balmer series.
    options:
      - I and II only
      - I, II and III only
      - II, III and IV only
      - I, III and IV only
    answer: 1
    explanation: I, II and III are correct; the series limit (∞ → n_1) photon carries exactly the ionisation energy from n_1. The first Paschen line (1875 nm) is longer than H_α (656 nm), so IV is false.

