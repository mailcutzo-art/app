questions:
  - id: che-atom-001
    topic: subatomic-particles
    subtopic: Cathode rays
    concept: Cathode-ray properties are independent of gas and electrode material
    category: factual
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    tags: [cathode-rays, ncert-line]
    stem: Which statement about the characteristics of cathode rays is correct?
    options:
      - They depend on the nature of the gas in the discharge tube
      - They depend on the material used for the cathode
      - They are independent of both the gas and the electrode material
      - They travel from the anode towards the cathode
    answer: 2
    explanation: Cathode rays are streams of electrons that move from cathode to anode, and their characteristics do not depend on the electrode material or the gas present. This showed electrons are a universal constituent of all atoms.

  - id: che-atom-002
    topic: subatomic-particles
    subtopic: Charge on the electron
    concept: Millikan's oil drop experiment measured the charge of an electron
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [millikan, ncert-line]
    stem: Millikan's oil drop experiment was used to determine the
    options:
      - charge on the electron
      - mass of the proton
      - charge-to-mass ratio of the electron
      - radius of the nucleus
    answer: 0
    explanation: Millikan measured the charge on oil droplets and found it was always an integral multiple of 1.6 × 10^{-19} C, the electronic charge. The e/m ratio had already been found by J. J. Thomson.

  - id: che-atom-003
    topic: subatomic-particles
    subtopic: Mass of the electron
    concept: Electron mass from e/m and e
    category: numerical
    format: direct
    difficulty: 2
    time: 40
    ncert: true
    battle: true
    formula: m_e = e ÷ (e/m_e)
    tags: [e-by-m, ncert-line]
    stem: Given e/m_e = 1.76 × 10^{11} C kg^{-1} and e = 1.60 × 10^{-19} C, the mass of an electron is about
    options:
      - 1.1 × 10^{-30} kg
      - 2.8 × 10^{-30} kg
      - 1.67 × 10^{-27} kg
      - 9.1 × 10^{-31} kg
    answer: 3
    explanation: m_e = e ÷ (e/m_e) = 1.60 × 10^{-19} ÷ 1.76 × 10^{11} ≈ 9.1 × 10^{-31} kg. The value 1.67 × 10^{-27} kg is the mass of a proton.

  - id: che-atom-004
    topic: subatomic-particles
    subtopic: Canal rays
    concept: Largest e/m of canal-ray particles is obtained with hydrogen
    category: concept
    format: direct
    difficulty: 2
    time: 35
    ncert: true
    battle: true
    tags: [canal-rays, proton]
    stem: In a canal-ray experiment, the positive particles have the largest charge-to-mass ratio when the discharge tube contains
    options:
      - helium
      - hydrogen
      - neon
      - nitrogen
    answer: 1
    explanation: Canal-ray particles are positive ions of the gas, so e/m depends on the gas. Hydrogen gives H^+ (a proton), the lightest positive ion, and hence the largest e/m.

  - id: che-atom-005
    topic: subatomic-particles
    subtopic: Discovery of the neutron
    concept: Chadwick bombarded beryllium with α-particles to discover the neutron
    category: factual
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    tags: [neutron, ncert-line]
    stem: Chadwick discovered the neutron by bombarding a thin sheet of which element with α-particles?
    options:
      - Gold
      - Nitrogen
      - Beryllium
      - Aluminium
    answer: 2
    explanation: In 1932 Chadwick bombarded beryllium with α-particles and detected electrically neutral particles slightly heavier than protons, the neutrons. Gold foil was used in Rutherford's scattering experiment.

  - id: che-atom-006
    topic: subatomic-particles
    subtopic: Canal rays
    concept: e/m of canal rays depends on the gas because the ions differ in mass
    category: concept
    format: assertion-reason
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [canal-rays, e-by-m]
    stem: |-
      Assertion (A): The charge-to-mass ratio of canal-ray particles depends on the gas taken in the discharge tube.
      Reason (R): Canal-ray particles are positive ions formed from the gas, and their masses differ from gas to gas.
    options:
      - Both A and R are true and R is the correct explanation of A
      - Both A and R are true but R is not the correct explanation of A
      - A is true but R is false
      - A is false but R is true
    answer: 0
    explanation: Unlike cathode rays, canal rays consist of positive gaseous ions. Their mass (and sometimes charge) depends on the gas, so e/m varies; R directly explains A.

  - id: che-atom-007
    topic: subatomic-particles
    subtopic: Charge on the electron
    concept: Number of electrons making up one coulomb
    category: numerical
    format: direct
    difficulty: 2
    time: 35
    ncert: false
    battle: true
    formula: N = Q ÷ e
    tags: [electron-charge]
    stem: How many electrons together carry a total charge of 1 coulomb? (e = 1.602 × 10^{-19} C)
    options:
      - 1.602 × 10^{19}
      - 6.24 × 10^{18}
      - 6.022 × 10^{23}
      - 9.65 × 10^{4}
    answer: 1
    explanation: N = 1 ÷ 1.602 × 10^{-19} ≈ 6.24 × 10^{18} electrons. 6.022 × 10^{23} is Avogadro's number and 9.65 × 10^4 C is the charge on one mole of electrons.

  - id: che-atom-008
    topic: subatomic-particles
    subtopic: Discoverers and experiments
    concept: Matching experiments with scientists
    category: factual
    format: match
    difficulty: 2
    time: 45
    ncert: true
    battle: false
    tags: [history]
    stem: |-
      Match List I (discovery or measurement) with List II (scientist).
      List I: P. e/m of cathode-ray particles; Q. Charge on the electron; R. Neutron; S. Canal rays
      List II: 1. Chadwick; 2. Goldstein; 3. Millikan; 4. J. J. Thomson
    options:
      - P-3, Q-4, R-1, S-2
      - P-4, Q-3, R-2, S-1
      - P-4, Q-3, R-1, S-2
      - P-1, Q-3, R-4, S-2
    answer: 2
    explanation: Thomson measured e/m of electrons, Millikan the electronic charge, Chadwick discovered the neutron and Goldstein observed canal (anode) rays. So P-4, Q-3, R-1, S-2.

  - id: che-atom-009
    topic: subatomic-particles
    subtopic: Thomson's e/m experiment
    concept: Deflection in fields increases with charge and field, decreases with mass
    category: concept
    format: statements
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [e-by-m, trap]
    stem: In Thomson's experiment, which statement about the deviation of charged particles from their path in electric or magnetic fields is INCORRECT?
    options:
      - The deviation is greater when the charge on the particle is greater
      - The deviation is greater when the field strength is greater
      - The deviation is greater when the potential across the electrodes is greater
      - The deviation is greater when the mass of the particle is greater
    answer: 3
    explanation: NCERT notes that deviation increases with the magnitude of charge and with field strength, but decreases with mass because a heavier particle is harder to deflect. So heavier particles deviate less.

  - id: che-atom-010
    topic: subatomic-particles
    subtopic: Mass of the electron
    concept: Mass of one mole of electrons
    category: numerical
    format: direct
    difficulty: 3
    time: 50
    ncert: false
    battle: false
    formula: M = m_e × N_A
    tags: [mole-concept, multi-concept]
    stem: What is the mass of one mole of electrons? (m_e = 9.1 × 10^{-31} kg, N_A = 6.022 × 10^{23} mol^{-1})
    options:
      - 0.548 mg
      - 1.008 g
      - 5.48 g
      - 0.548 g
    answer: 0
    explanation: Mass = 9.1 × 10^{-31} × 6.022 × 10^{23} = 5.48 × 10^{-7} kg = 5.48 × 10^{-4} g = 0.548 mg. 1.008 g is roughly a mole of protons plus electrons (H atoms).

  - id: che-atom-011
    topic: atomic-models
    subtopic: Thomson model
    concept: Thomson's model is the plum pudding model
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [thomson-model, ncert-line]
    stem: The atomic model in which electrons are embedded in a uniform sphere of positive charge is called the
    options:
      - planetary model
      - plum pudding model
      - nuclear model
      - stationary-state model
    answer: 1
    explanation: Thomson pictured the atom as a sphere of uniformly spread positive charge with electrons embedded in it, like plums in a pudding or seeds in a watermelon. Rutherford's model is the nuclear (planetary) model.

  - id: che-atom-012
    topic: atomic-models
    subtopic: Rutherford's α-scattering
    concept: Most α-particles pass undeflected, so most of the atom is empty
    category: concept
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    tags: [rutherford, ncert-line]
    stem: The observation that most α-particles passed through a gold foil undeflected shows that
    options:
      - the atom is electrically neutral
      - electrons are embedded in positive charge
      - most of the space in an atom is empty
      - the nucleus is negatively charged
    answer: 2
    explanation: Since most α-particles met nothing massive or charged on their way, Rutherford concluded most of the atom is empty space. The few large deflections led to the idea of a small positive nucleus.

  - id: che-atom-013
    topic: atomic-models
    subtopic: Rutherford's α-scattering
    concept: Rebounding α-particles imply a tiny dense positive nucleus
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [rutherford]
    stem: In Rutherford's experiment, a very few α-particles bounced back by nearly 180°. This showed that
    options:
      - electrons have negligible mass
      - α-particles are positively charged
      - the gold foil was not uniform
      - the positive charge and most mass are concentrated in a very small volume
    answer: 3
    explanation: Only a massive, highly concentrated positive centre can repel an α-particle straight back. As only about 1 in 20,000 rebounded, this centre (the nucleus) occupies a tiny volume.

  - id: che-atom-014
    topic: atomic-models
    subtopic: Atomic number and mass number
    concept: Neutrons = A − Z
    category: numerical
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    formula: N = A − Z
    tags: [mass-number]
    stem: How many neutrons are present in ^{37}_{17}Cl?
    options:
      - "20"
      - "17"
      - "37"
      - "54"
    answer: 0
    explanation: Number of neutrons = A − Z = 37 − 17 = 20. The atomic number 17 counts protons, not neutrons.

  - id: che-atom-015
    topic: atomic-models
    subtopic: Atomic number and mass number
    concept: Counting protons, electrons and neutrons in an anion
    category: numerical
    format: direct
    difficulty: 2
    time: 40
    ncert: true
    battle: true
    tags: [ions, ncert-line]
    stem: The numbers of protons, electrons and neutrons in ^{80}_{35}Br^{−} are respectively
    options:
      - 35, 35, 45
      - 35, 34, 45
      - 35, 36, 45
      - 36, 35, 44
    answer: 2
    explanation: Z = 35 gives 35 protons; the −1 charge adds one electron, giving 36 electrons; neutrons = 80 − 35 = 45. Adding the extra electron to the proton count is a common slip.

  - id: che-atom-016
    topic: atomic-models
    subtopic: Isotopes and isobars
    concept: Isobars have the same mass number but different atomic numbers
    category: concept
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    tags: [isobars]
    stem: Which pair of nuclides are isobars?
    options:
      - ^{12}_6C and ^{14}_6C
      - ^{14}_6C and ^{14}_7N
      - ^{14}_6C and ^{16}_8O
      - ^{1}_1H and ^{2}_1H
    answer: 1
    explanation: Isobars share mass number A but differ in Z; ^{14}C and ^{14}N both have A = 14. Pairs with the same Z are isotopes, and ^{14}C/^{16}O have equal neutron numbers (isotones).

  - id: che-atom-017
    topic: atomic-models
    subtopic: Isotones
    concept: Isotones have the same number of neutrons
    category: application
    format: direct
    difficulty: 3
    time: 45
    ncert: false
    battle: true
    tags: [isotones, trap]
    stem: Which pair of nuclides are isotones (same number of neutrons)?
    options:
      - ^{40}_{18}Ar and ^{40}_{20}Ca
      - ^{35}_{17}Cl and ^{37}_{17}Cl
      - ^{3}_1H and ^{3}_2He
      - ^{14}_6C and ^{16}_8O
    answer: 3
    explanation: ^{14}C has 14 − 6 = 8 neutrons and ^{16}O has 16 − 8 = 8 neutrons, so they are isotones. Ar/Ca and ^3H/^3He are isobars; the chlorine pair are isotopes.

  - id: che-atom-018
    topic: atomic-models
    subtopic: Drawbacks of Rutherford model
    concept: Rutherford model fails on stability because an accelerating charge radiates
    category: concept
    format: assertion-reason
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [rutherford, drawbacks, ncert-line]
    stem: |-
      Assertion (A): Rutherford's nuclear model cannot explain the stability of an atom.
      Reason (R): According to electromagnetic theory, an electron revolving round the nucleus is accelerated and should continuously radiate energy and spiral into the nucleus.
    options:
      - Both A and R are true and R is the correct explanation of A
      - Both A and R are true but R is not the correct explanation of A
      - A is true but R is false
      - A is false but R is true
    answer: 0
    explanation: An orbiting electron undergoes centripetal acceleration; by Maxwell's theory it should lose energy as radiation and collapse into the nucleus in about 10^{-8} s. Atoms are stable, so the model fails, and R is the reason.

  - id: che-atom-019
    topic: atomic-models
    subtopic: Size of nucleus
    concept: Nucleus occupies about 10^{-15} of the atomic volume
    category: numerical
    format: direct
    difficulty: 3
    time: 45
    ncert: false
    battle: true
    formula: V ∝ r^3
    tags: [nuclear-size]
    stem: If the radius of an atom is 10^{-10} m and that of its nucleus is 10^{-15} m, what fraction of the atom's volume does the nucleus occupy?
    options:
      - 10^{-5}
      - 10^{-10}
      - 10^{-15}
      - 10^{-25}
    answer: 2
    explanation: Volume ratio = (r_nucleus ÷ r_atom)^3 = (10^{-5})^3 = 10^{-15}. Using the radius ratio 10^{-5} directly forgets that volume scales as the cube.

  - id: che-atom-020
    topic: atomic-models
    subtopic: Rutherford's nuclear model
    concept: Features of Rutherford's nuclear model versus Thomson's model
    category: application
    format: multi-statement
    difficulty: 3
    time: 60
    ncert: true
    battle: false
    tags: [rutherford, thomson-model, confused-pair]
    stem: |-
      Which of the following are features of Rutherford's nuclear model of the atom?
      I. Most of the space in the atom is empty.
      II. The positive charge and most of the mass are concentrated in the nucleus.
      III. Electrons are embedded in a uniform sphere of positive charge.
      IV. Electrons move around the nucleus in circular paths called orbits.
    options:
      - I and II only
      - I, II and IV only
      - II, III and IV only
      - I, III and IV only
    answer: 1
    explanation: Statements I, II and IV describe Rutherford's planetary model. Statement III is Thomson's plum pudding model, which the scattering experiment disproved.

  - id: che-atom-021
    topic: em-radiation
    subtopic: c = νλ
    concept: Frequency from wavelength
    category: numerical
    format: direct
    difficulty: 1
    time: 30
    ncert: true
    battle: true
    formula: ν = c ÷ λ
    tags: [frequency]
    stem: What is the frequency of light of wavelength 600 nm? (c = 3.0 × 10^8 m s^{-1})
    options:
      - 1.8 × 10^{17} Hz
      - 2.0 × 10^{14} Hz
      - 5.0 × 10^{12} Hz
      - 5.0 × 10^{14} Hz
    answer: 3
    explanation: ν = c ÷ λ = 3.0 × 10^8 ÷ 600 × 10^{-9} = 5.0 × 10^{14} Hz. Forgetting to convert nm to m gives absurd values.

  - id: che-atom-022
    topic: em-radiation
    subtopic: Wavenumber
    concept: Wavenumber is the reciprocal of wavelength
    category: numerical
    format: direct
    difficulty: 1
    time: 30
    ncert: true
    battle: true
    formula: ν̄ = 1 ÷ λ
    tags: [wavenumber]
    stem: The wavenumber of radiation of wavelength 500 nm is
    options:
      - 2.0 × 10^6 m^{-1}
      - 5.0 × 10^{-7} m^{-1}
      - 2.0 × 10^{-6} m^{-1}
      - 6.0 × 10^{14} m^{-1}
    answer: 0
    explanation: ν̄ = 1 ÷ λ = 1 ÷ 5.0 × 10^{-7} m = 2.0 × 10^6 m^{-1} (or 2.0 × 10^4 cm^{-1}). 6.0 × 10^{14} is the frequency in Hz, not the wavenumber.

  - id: che-atom-023
    topic: em-radiation
    subtopic: Electromagnetic spectrum
    concept: Frequency order across the electromagnetic spectrum
    category: factual
    format: ordering
    difficulty: 2
    time: 35
    ncert: true
    battle: true
    tags: [em-spectrum]
    stem: Arrange in increasing order of frequency - X-rays, microwaves, ultraviolet, infrared.
    options:
      - X-rays < ultraviolet < infrared < microwaves
      - Infrared < microwaves < ultraviolet < X-rays
      - Microwaves < infrared < ultraviolet < X-rays
      - Microwaves < ultraviolet < infrared < X-rays
    answer: 2
    explanation: Frequency rises from radio and microwaves through infrared, visible and ultraviolet to X-rays and γ-rays. So microwaves < IR < UV < X-rays; wavelength follows the reverse order.

  - id: che-atom-024
    topic: em-radiation
    subtopic: Properties of EM waves
    concept: All electromagnetic radiations travel at the same speed in vacuum
    category: concept
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [speed-of-light, ncert-line]
    stem: In vacuum, compared with visible light, X-rays travel
    options:
      - faster
      - at the same speed
      - slower
      - faster only at high intensity
    answer: 1
    explanation: All electromagnetic radiations travel in vacuum at c = 3.0 × 10^8 m s^{-1}, whatever their frequency. X-rays differ only in frequency and wavelength.

  - id: che-atom-025
    topic: em-radiation
    subtopic: Visible region
    concept: Visible light spans roughly 400–750 nm
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [visible-light, ncert-line]
    stem: The approximate wavelength range of visible light is
    options:
      - 10–100 nm
      - 1–10 μm
      - 100–300 nm
      - 400–750 nm
    answer: 3
    explanation: Visible light runs from violet (about 400 nm) to red (about 750 nm). Shorter wavelengths are ultraviolet; longer ones are infrared.

  - id: che-atom-026
    topic: em-radiation
    subtopic: c = νλ
    concept: Wavelength of a radio broadcast from its frequency
    category: numerical
    format: direct
    difficulty: 2
    time: 40
    ncert: true
    battle: true
    formula: λ = c ÷ ν
    tags: [radio-waves, ncert-line]
    stem: A radio station broadcasts at 1368 kHz. What is the wavelength of its radiation? (c = 3.0 × 10^8 m s^{-1})
    options:
      - 2.19 m
      - 21.9 m
      - 219.3 m
      - 4.56 × 10^{-3} m
    answer: 2
    explanation: λ = c ÷ ν = 3.0 × 10^8 ÷ 1.368 × 10^6 = 219.3 m, typical of AM radio. Taking kHz as 10^3 is essential; a factor-of-ten slip gives 21.9 m.

  - id: che-atom-027
    topic: em-radiation
    subtopic: Properties of EM waves
    concept: Electric and magnetic fields are mutually perpendicular and perpendicular to propagation
    category: concept
    format: statements
    difficulty: 2
    time: 40
    ncert: true
    battle: false
    tags: [em-waves, ncert-line]
    stem: Which statement about electromagnetic radiation is INCORRECT?
    options:
      - The oscillating electric and magnetic fields are parallel to each other
      - Electromagnetic waves do not need a medium to travel
      - Oscillating charged particles produce oscillating electric and magnetic fields
      - Different radiations differ in frequency and wavelength
    answer: 0
    explanation: The electric and magnetic field components are perpendicular to each other and to the direction of propagation. The other statements are correct NCERT descriptions of EM waves.

  - id: che-atom-028
    topic: em-radiation
    subtopic: Wavenumber
    concept: Wavelength from wavenumber in cm^{-1}
    category: numerical
    format: direct
    difficulty: 2
    time: 40
    ncert: true
    battle: true
    formula: λ = 1 ÷ ν̄
    tags: [wavenumber]
    stem: Radiation has a wavenumber of 2.0 × 10^4 cm^{-1}. Its wavelength is
    options:
      - 200 nm
      - 500 nm
      - 50 nm
      - 5000 nm
    answer: 1
    explanation: λ = 1 ÷ 2.0 × 10^4 cm^{-1} = 5.0 × 10^{-5} cm = 5.0 × 10^{-7} m = 500 nm. Unit slips between cm and m give the other options.

  - id: che-atom-029
    topic: em-radiation
    subtopic: Wave characteristics
    concept: Frequency and wavelength are inversely proportional
    category: concept
    format: statement-pair
    difficulty: 2
    time: 40
    ncert: true
    battle: false
    tags: [wavenumber, frequency]
    stem: |-
      Statement I: Wavenumber is the number of wavelengths per unit length, and its SI unit is m^{-1}.
      Statement II: For electromagnetic radiation in vacuum, frequency is directly proportional to wavelength.
    options:
      - Both Statement I and Statement II are correct
      - Both Statement I and Statement II are incorrect
      - Statement I is correct but Statement II is incorrect
      - Statement I is incorrect but Statement II is correct
    answer: 2
    explanation: Statement I is the NCERT definition of wavenumber. Statement II is wrong because c = νλ with c constant, so ν is inversely proportional to λ.

  - id: che-atom-030
    topic: em-radiation
    subtopic: c = νλ
    concept: Graph of ν against 1/λ is a straight line through origin with slope c
    category: concept
    format: graph
    difficulty: 3
    time: 45
    ncert: false
    battle: false
    tags: [graph]
    stem: For electromagnetic radiations in vacuum, a graph of frequency ν (y-axis) against 1/λ (x-axis) is
    options:
      - a rectangular hyperbola
      - a straight line parallel to the x-axis
      - a straight line with slope 1/c
      - a straight line through the origin with slope c
    answer: 3
    explanation: Since ν = c × (1/λ), ν is directly proportional to 1/λ, giving a straight line through the origin whose slope is c. A ν–λ graph, not ν–1/λ, would be a hyperbola.

  - id: che-atom-031
    topic: planck-photoelectric
    subtopic: Energy of a photon
    concept: E = hν for a single photon
    category: numerical
    format: direct
    difficulty: 1
    time: 30
    ncert: true
    battle: true
    formula: E = hν
    tags: [photon-energy]
    stem: What is the energy of one photon of frequency 3.0 × 10^{15} Hz? (h = 6.626 × 10^{-34} J s)
    options:
      - 1.99 × 10^{-18} J
      - 2.21 × 10^{-49} J
      - 1.99 × 10^{-19} J
      - 4.53 × 10^{48} J
    answer: 0
    explanation: E = hν = 6.626 × 10^{-34} × 3.0 × 10^{15} = 1.99 × 10^{-18} J. Dividing instead of multiplying gives the tiny or huge wrong values.

  - id: che-atom-032
    topic: planck-photoelectric
    subtopic: Number of photons
    concept: Number of photons in a given energy of monochromatic light
    category: numerical
    format: direct
    difficulty: 3
    time: 60
    ncert: true
    battle: false
    formula: N = E_total ÷ (hc/λ)
    tags: [photon-count]
    stem: How many photons of wavelength 600 nm together carry 1.0 J of energy? (h = 6.626 × 10^{-34} J s, c = 3.0 × 10^8 m s^{-1})
    options:
      - 3.3 × 10^{-19}
      - 6.0 × 10^{23}
      - 3.0 × 10^{18}
      - 1.5 × 10^{15}
    answer: 2
    explanation: Energy per photon = hc/λ = (6.626 × 10^{-34} × 3.0 × 10^8) ÷ 6.0 × 10^{-7} = 3.31 × 10^{-19} J. N = 1.0 ÷ 3.31 × 10^{-19} ≈ 3.0 × 10^{18}. The first option is the energy of one photon, not the count.

  - id: che-atom-033
    topic: planck-photoelectric
    subtopic: Photoelectric effect
    concept: Intensity affects the number, not the energy, of photoelectrons
    category: concept
    format: direct
    difficulty: 2
