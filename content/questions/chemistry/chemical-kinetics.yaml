questions:
  - id: che-kin-001
    topic: rate-of-reaction
    subtopic: Units of rate
    concept: Rate of reaction is expressed in mol L^{-1} s^{-1}
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [rate-units]
    stem: For a reaction taking place in solution, the rate of reaction is usually expressed in the unit
    options:
      - mol L^{-1} s^{-1}
      - L mol^{-1} s^{-1}
      - s^{-1}
      - mol^{-1} L^{-1} s
    answer: 0
    explanation: Rate is the change in molar concentration per unit time, so its unit is mol L^{-1} s^{-1}. L mol^{-1} s^{-1} and s^{-1} are units of the rate constants of second and first order reactions, not of rate.
  - id: che-kin-002
    topic: rate-of-reaction
    subtopic: Rate in terms of different species
    concept: Relating rate of disappearance of HI to rate of formation of I_2
    category: numerical
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    formula: Rate = −½ d[HI]/dt = d[I_2]/dt
    tags: [stoichiometric-rate]
    stem: For 2HI(g) → H_2(g) + I_2(g), HI is consumed at 4.0 × 10^{-3} mol L^{-1} s^{-1}. At what rate is I_2 formed?
    options:
      - 4.0 × 10^{-3} mol L^{-1} s^{-1}
      - 8.0 × 10^{-3} mol L^{-1} s^{-1}
      - 2.0 × 10^{-3} mol L^{-1} s^{-1}
      - 1.0 × 10^{-3} mol L^{-1} s^{-1}
    answer: 2
    explanation: −½ d[HI]/dt = d[I_2]/dt, so d[I_2]/dt = ½ × 4.0 × 10^{-3} = 2.0 × 10^{-3} mol L^{-1} s^{-1}. Forgetting the coefficient 2 of HI gives 4.0 × 10^{-3}.
  - id: che-kin-003
    topic: rate-of-reaction
    subtopic: Rate in terms of different species
    concept: Rate of consumption of H_2 from rate of formation of NH_3
    category: numerical
    format: direct
    difficulty: 3
    time: 45
    ncert: false
    battle: true
    formula: −⅓ d[H_2]/dt = ½ d[NH_3]/dt
    tags: [stoichiometric-rate, trap]
    stem: In N_2(g) + 3H_2(g) → 2NH_3(g), ammonia is formed at 3.6 × 10^{-4} mol L^{-1} s^{-1}. What is the rate of consumption of H_2?
    options:
      - 2.4 × 10^{-4} mol L^{-1} s^{-1}
      - 1.8 × 10^{-4} mol L^{-1} s^{-1}
      - 5.4 × 10^{-4} mol L^{-1} s^{-1}
      - 1.08 × 10^{-3} mol L^{-1} s^{-1}
    answer: 2
    explanation: −⅓ d[H_2]/dt = ½ d[NH_3]/dt, so −d[H_2]/dt = (3/2) × 3.6 × 10^{-4} = 5.4 × 10^{-4} mol L^{-1} s^{-1}. 1.8 × 10^{-4} is the rate of reaction itself, and 2.4 × 10^{-4} comes from inverting the ratio 3/2.
  - id: che-kin-004
    topic: rate-of-reaction
    subtopic: Average and instantaneous rate
    concept: Instantaneous rate is the negative slope of the tangent to the [R]–t curve
    category: concept
    format: statements
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [instantaneous-rate, average-rate]
    stem: Which statement about the average and instantaneous rates of a reaction is correct?
    options:
      - The average rate of a reaction does not depend on the time interval chosen.
      - For a reactant, the instantaneous rate usually increases as the reaction proceeds.
      - The instantaneous rate at time t equals the negative of the slope of the tangent to the [R]–t curve at t.
      - The instantaneous rate at every instant equals the average rate over the whole reaction.
    answer: 2
    explanation: Instantaneous rate = −d[R]/dt, the negative slope of the tangent at that instant. The average rate −Δ[R]/Δt changes with the interval chosen, and the rate generally falls as reactants are used up, so it is not the same at every instant.
  - id: che-kin-005
    topic: rate-of-reaction
    subtopic: Average rate from concentration data
    concept: Average rate = −Δ[R]/Δt
    category: numerical
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    formula: r_{av} = −Δ[R]/Δt
    tags: [average-rate]
    stem: The concentration of a reactant falls from 0.080 mol L^{-1} to 0.062 mol L^{-1} in the first 60 s. What is the average rate over this interval?
    options:
      - 1.8 × 10^{-2} mol L^{-1} s^{-1}
      - 1.03 × 10^{-3} mol L^{-1} s^{-1}
      - 3.0 × 10^{-3} mol L^{-1} s^{-1}
      - 3.0 × 10^{-4} mol L^{-1} s^{-1}
    answer: 3
    explanation: Average rate = −Δ[R]/Δt = (0.080 − 0.062)/60 = 0.018/60 = 3.0 × 10^{-4} mol L^{-1} s^{-1}. 1.8 × 10^{-2} is only the change in concentration, not divided by the time.
  - id: che-kin-006
    topic: rate-of-reaction
    subtopic: Rate in terms of different species
    concept: Writing rate expressions with stoichiometric coefficients
    category: application
    format: match
    difficulty: 3
    time: 60
    ncert: true
    battle: false
    tags: [stoichiometric-rate, rate-expression]
    stem: |-
      Match each reaction in List I with a correct expression for its rate in List II.
      List I
      P. 2HI(g) → H_2(g) + I_2(g)
      Q. Hg(l) + Cl_2(g) → HgCl_2(s)
      R. 2NO(g) + O_2(g) → 2NO_2(g)
      S. N_2(g) + 3H_2(g) → 2NH_3(g)
      List II
      1. −Δ[Cl_2]/Δt
      2. −½ Δ[HI]/Δt
      3. ½ Δ[NH_3]/Δt
      4. ½ Δ[NO_2]/Δt
    options:
      - P-2, Q-1, R-3, S-4
      - P-1, Q-2, R-4, S-3
      - P-4, Q-1, R-2, S-3
      - P-2, Q-1, R-4, S-3
    answer: 3
    explanation: Each rate of change is divided by the stoichiometric coefficient of that species, with a minus sign for reactants. So P uses −½ Δ[HI]/Δt, Q uses −Δ[Cl_2]/Δt, R uses ½ Δ[NO_2]/Δt and S uses ½ Δ[NH_3]/Δt.
  - id: che-kin-007
    topic: rate-of-reaction
    subtopic: Concentration–time graph
    concept: Flattening of the [R]–t curve shows a falling rate, not a falling k
    category: concept
    format: graph
    difficulty: 3
    time: 40
    ncert: true
    battle: true
    tags: [concentration-time-graph, trap]
    stem: For A → B, a plot of [A] against time starts steep and becomes flatter as time passes. What does the flattening show?
    options:
      - The rate constant decreases as the reaction proceeds.
      - The rate of reaction stays constant throughout.
      - The reaction speeds up as product accumulates.
      - The rate decreases as the concentration of A decreases.
    answer: 3
    explanation: The slope of the [A]–t curve gives −(rate), so a flattening curve means the rate falls because less A is left. The rate constant does not change at a fixed temperature, so blaming k is the common trap.
  - id: che-kin-008
    topic: rate-of-reaction
    subtopic: Rate in terms of different species
    concept: Magnitude of each species' rate of change is proportional to its coefficient
    category: application
    format: ordering
    difficulty: 2
    time: 40
    ncert: true
    battle: false
    tags: [stoichiometric-rate]
    stem: For 5Br^−(aq) + BrO_3^−(aq) + 6H^+(aq) → 3Br_2(aq) + 3H_2O(l), arrange the species in decreasing order of the magnitude of their rates of change (consumption or formation).
    options:
      - Br^− > H^+ > Br_2 > BrO_3^−
      - H^+ > Br^− > Br_2 > BrO_3^−
      - BrO_3^− > Br_2 > Br^− > H^+
      - H^+ > Br_2 > Br^− > BrO_3^−
    answer: 1
    explanation: Each species changes at a rate equal to its stoichiometric coefficient × the rate of reaction, so the magnitudes follow the coefficients 6 (H^+) > 5 (Br^−) > 3 (Br_2) > 1 (BrO_3^−).
  - id: che-kin-009
    topic: rate-of-reaction
    subtopic: Average rate from moles and volume
    concept: Converting moles to molarity before finding an average rate of formation
    category: numerical
    format: direct
    difficulty: 4
    time: 100
    ncert: false
    battle: false
    tags: [average-rate, stoichiometric-rate, multi-concept]
    stem: In a 2.0 L flask, 0.50 mol N_2O_5 decomposes as 2N_2O_5(g) → 4NO_2(g) + O_2(g). After 10 min, 0.30 mol N_2O_5 remains. What is the average rate of formation of NO_2?
    options:
      - 0.020 mol L^{-1} min^{-1}
      - 0.010 mol L^{-1} min^{-1}
      - 0.040 mol L^{-1} min^{-1}
      - 0.005 mol L^{-1} min^{-1}
    answer: 0
    explanation: Δ[N_2O_5] = (0.50 − 0.30)/2.0 = 0.10 mol L^{-1} in 10 min, i.e. 0.010 mol L^{-1} min^{-1}. NO_2 forms twice as fast as N_2O_5 disappears (coefficients 4 and 2), giving 0.020 mol L^{-1} min^{-1}. Ignoring the 2.0 L volume gives 0.040, and 0.005 is the rate of reaction.
  - id: che-kin-010
    topic: rate-of-reaction
    subtopic: Rate expression and stoichiometry
    concept: Dividing by stoichiometric coefficients gives a unique rate of reaction
    category: concept
    format: assertion-reason
    difficulty: 2
    time: 40
    ncert: true
    battle: false
    tags: [stoichiometric-rate]
    stem: |-
      Assertion (A): For 2HI(g) → H_2(g) + I_2(g), the rate of reaction is written as −½ d[HI]/dt.
      Reason (R): Dividing each rate of change by the stoichiometric coefficient gives the same rate of reaction whichever species is followed.
    options:
      - Both A and R are true and R is the correct explanation of A
      - Both A and R are true but R is not the correct explanation of A
      - A is true but R is false
      - A is false but R is true
    answer: 0
    explanation: HI is used up twice as fast as H_2 or I_2 is formed, so its rate of change is halved (and made positive) to give a single rate of reaction. R states exactly why the factor ½ appears.
  - id: che-kin-011
    topic: rate-law
    subtopic: Rate law is experimental
    concept: Rate law is determined experimentally, not from the balanced equation
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [rate-law, ncert-line]
    stem: The rate law of a reaction is determined
    options:
      - from the balanced chemical equation
      - from the equilibrium constant of the reaction
      - experimentally
      - from the enthalpy change of the reaction
    answer: 2
    explanation: The rate law must be found by experiment; its exponents need not match the coefficients of the balanced equation. Only for an elementary step can it be written from the equation.
  - id: che-kin-012
    topic: rate-law
    subtopic: Effect of concentration on rate
    concept: Combined effect of changing two concentrations in rate = k[A]^{1/2}[B]^2
    category: numerical
    format: direct
    difficulty: 3
    time: 45
    ncert: false
    battle: true
    tags: [rate-law, concentration-effect]
    stem: For a reaction with rate = k[A]^{1/2}[B]^2, [A] is made four times and [B] is halved. The rate becomes
    options:
      - twice the original rate
      - the same as the original rate
      - half the original rate
      - one-fourth of the original rate
    answer: 2
    explanation: New rate/old rate = 4^{1/2} × (1/2)^2 = 2 × ¼ = ½. Forgetting to square the factor for B gives 2 × ½ = 1, i.e. no change.
  - id: che-kin-013
    topic: rate-law
    subtopic: Rate constant
    concept: k equals the rate when all reactant concentrations are unity
    category: factual
    format: direct
    difficulty: 2
    time: 25
    ncert: true
    battle: true
    tags: [rate-constant, ncert-line]
    stem: The rate constant of a reaction is numerically equal to its rate when
    options:
      - the reaction is at equilibrium
      - the concentration of each reactant is 1 mol L^{-1}
      - half of the reactant has been consumed
      - the temperature is 0 °C
    answer: 1
    explanation: From rate = k[A]^x[B]^y, putting [A] = [B] = 1 mol L^{-1} gives rate = k. That is why k is also called the specific reaction rate.
  - id: che-kin-014
    topic: rate-law
    subtopic: Rate constant
    concept: k depends on temperature and catalyst but not on concentration
    category: concept
    format: statements
    difficulty: 3
    time: 45
    ncert: true
    battle: false
    tags: [rate-constant, trap]
    stem: Which statement about the rate constant k of a reaction is correct?
    options:
      - k increases when the concentrations of the reactants are increased.
      - k has the same unit for every reaction.
      - k changes with temperature and with the presence of a catalyst.
      - k decreases as the reaction proceeds because reactants are used up.
    answer: 2
    explanation: At a given temperature k is independent of concentration, but it changes with temperature and with a catalyst (which lowers E_a). Its unit depends on the order, and the falling rate during a reaction is due to falling concentration, not a falling k.
  - id: che-kin-015
    topic: rate-law
    subtopic: Initial rate method
    concept: Deducing a fractional-order rate law from initial rate data
    category: application
    format: case
    difficulty: 4
    time: 110
    ncert: true
    battle: false
    tags: [initial-rate-method, rate-law, fractional-order]
    stem: |-
      Initial rates were measured for A + B → products at a fixed temperature (√2 = 1.414).
      Expt 1: [A] = 0.10 M, [B] = 0.10 M, rate = 2.0 × 10^{-3} M s^{-1}
      Expt 2: [A] = 0.20 M, [B] = 0.10 M, rate = 5.66 × 10^{-3} M s^{-1}
      Expt 3: [A] = 0.20 M, [B] = 0.20 M, rate = 2.26 × 10^{-2} M s^{-1}
      What is the rate law?
    options:
      - rate = k[A]^{3/2}[B]^2
      - rate = k[A]^2[B]^2
      - rate = k[A][B]^2
      - rate = k[A]^{3/2}[B]
    answer: 0
    explanation: From Expt 1 to 2, doubling [A] multiplies the rate by 2.83 = 2√2 = 2^{3/2}, so the order in A is 3/2. From Expt 2 to 3, doubling [B] multiplies the rate by 4, so the order in B is 2. Hence rate = k[A]^{3/2}[B]^2.
  - id: che-kin-016
    topic: rate-law
    subtopic: Calculating rate from the rate law
    concept: Substituting concentrations into rate = k[A][B]^2
    category: numerical
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [rate-law]
    stem: For 2A + B → A_2B, rate = k[A][B]^2 with k = 3.0 × 10^{-5} L^2 mol^{-2} s^{-1}. What is the initial rate when [A] = 0.20 mol L^{-1} and [B] = 0.10 mol L^{-1}?
    options:
      - 1.2 × 10^{-7} mol L^{-1} s^{-1}
      - 6.0 × 10^{-8} mol L^{-1} s^{-1}
      - 6.0 × 10^{-7} mol L^{-1} s^{-1}
      - 1.2 × 10^{-8} mol L^{-1} s^{-1}
    answer: 1
    explanation: Rate = k[A][B]^2 = 3.0 × 10^{-5} × 0.20 × (0.10)^2 = 6.0 × 10^{-8} mol L^{-1} s^{-1}. Squaring [A] instead of [B] gives 1.2 × 10^{-7}.
  - id: che-kin-017
    topic: rate-law
    subtopic: Rate as the reaction proceeds
    concept: Both reactants are consumed stoichiometrically when recalculating the rate
    category: numerical
    format: direct
    difficulty: 4
    time: 100
    ncert: true
    battle: false
    tags: [rate-law, trap, multi-concept]
    stem: For 2A + B → A_2B, rate = k[A][B]^2. Initially [A] = 0.20 mol L^{-1} and [B] = 0.10 mol L^{-1}. What fraction of the initial rate is the rate when [A] has fallen to 0.10 mol L^{-1}?
    options:
      - 1/2 of the initial rate
      - 1/4 of the initial rate
      - 1/16 of the initial rate
      - 1/8 of the initial rate
    answer: 3
    explanation: When 0.10 mol L^{-1} of A reacts, 0.05 mol L^{-1} of B reacts (A and B react 2 to 1), leaving [B] = 0.05 mol L^{-1}. Rate ratio = (0.10 × 0.05^2)/(0.20 × 0.10^2) = 1/8. Forgetting that B is also used up gives 1/2.
  - id: che-kin-018
    topic: rate-law
    subtopic: Factors affecting rate
    concept: Concentration, pressure, temperature and catalyst affect rate; a catalyst does not change ΔH
    category: concept
    format: multi-statement
    difficulty: 3
    time: 60
    ncert: true
    battle: false
    tags: [factors-affecting-rate]
    stem: |-
      Consider the following statements about factors that affect the rate of a reaction.
      I. Increasing the concentration of a reactant generally increases the rate.
      II. Increasing the temperature increases the rate constant.
      III. A catalyst changes the rate by changing the enthalpy of the reaction.
      IV. For a gaseous reaction, increasing the partial pressure of a reactant usually increases the rate.
      Which of these are correct?
    options:
      - I and III only
      - II and III only
      - I, II and IV only
      - I, II, III and IV
    answer: 2
    explanation: Concentration (partial pressure for gases), temperature and catalyst all affect the rate. A catalyst, however, works by lowering the activation energy through another path and leaves ΔH unchanged, so III is wrong.
  - id: che-kin-019
    topic: rate-law
    subtopic: Rate law is experimental
    concept: Exponents in the rate law need not equal stoichiometric coefficients
    category: concept
    format: statement-pair
    difficulty: 3
    time: 45
    ncert: true
    battle: false
    tags: [rate-law]
    stem: |-
      Statement I: The exponents of the concentration terms in a rate law need not be equal to the stoichiometric coefficients in the balanced equation.
      Statement II: The rate law of every reaction can be written directly from its balanced chemical equation.
    options:
      - Both Statement I and Statement II are correct
      - Both Statement I and Statement II are incorrect
      - Statement I is correct but Statement II is incorrect
      - Statement I is incorrect but Statement II is correct
    answer: 2
    explanation: The rate law is found experimentally; for CHCl_3 + Cl_2 → CCl_4 + HCl, rate = k[CHCl_3][Cl_2]^{1/2} although both coefficients are 1. Only for an elementary reaction do the exponents match the coefficients, so Statement II is wrong.
  - id: che-kin-020
    topic: rate-law
    subtopic: Effect of volume change on rate
    concept: Compressing a gas mixture raises every concentration and hence the rate
    category: application
    format: direct
    difficulty: 3
    time: 50
    ncert: false
    battle: true
    tags: [concentration-effect, trap]
    stem: For 2NO(g) + O_2(g) → 2NO_2(g), rate = k[NO]^2[O_2]. If the volume of the vessel is reduced to one-third at constant temperature, the rate becomes
    options:
      - 3 times
      - 9 times
      - 1/27 times
      - 27 times
    answer: 3
    explanation: Reducing the volume to one-third triples every concentration, so the rate becomes 3^2 × 3 = 27 times. Thinking that a smaller volume means a slower reaction gives 1/27.
  - id: che-kin-021
    topic: order-of-reaction
    subtopic: Units of rate constant
    concept: Only for first order is the unit of k free of concentration
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    formula: unit of k = (mol L^{-1})^{1−n} s^{-1}
    tags: [rate-constant-units]
    stem: For which order of reaction is the unit of the rate constant independent of the unit of concentration?
    options:
      - Zero order
      - First order
      - Second order
      - Third order
    answer: 1
    explanation: The unit of k is (concentration)^{1−n} time^{-1}. Only for n = 1 does the concentration term vanish, leaving s^{-1} (or min^{-1}).
  - id: che-kin-022
    topic: order-of-reaction
    subtopic: Order from the unit of k
    concept: A rate constant with the unit of rate belongs to a zero order reaction
    category: concept
    format: direct
    difficulty: 2
    time: 25
    ncert: true
    battle: true
    tags: [rate-constant-units]
    stem: The rate constant of a reaction is 2.5 × 10^{-4} mol L^{-1} s^{-1}. The order of the reaction is
    options:
      - one
      - two
      - three
      - zero
    answer: 3
    explanation: The unit of k is (mol L^{-1})^{1−n} s^{-1}. A unit of mol L^{-1} s^{-1}, identical to the unit of rate, means 1 − n = 1, so n = 0.
  - id: che-kin-023
    topic: order-of-reaction
    subtopic: Units of rate constant
    concept: Unit of k for a reaction of order 3/2
    category: numerical
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [rate-constant-units, fractional-order]
    stem: For CH_3CHO(g) → CH_4(g) + CO(g), rate = k[CH_3CHO]^{3/2}. With concentration in mol L^{-1} and time in s, the unit of k is
    options:
      - mol^{1/2} L^{-1/2} s^{-1}
      - L mol^{-1} s^{-1}
      - mol^{-1/2} L^{1/2} s^{-1}
      - s^{-1}
    answer: 2
    explanation: k = rate/[CH_3CHO]^{3/2} = (mol L^{-1} s^{-1})/(mol L^{-1})^{3/2} = (mol L^{-1})^{-1/2} s^{-1} = mol^{-1/2} L^{1/2} s^{-1}. The inverted form mol^{1/2} L^{-1/2} s^{-1} would correspond to an order of ½.
  - id: che-kin-024
    topic: order-of-reaction
    subtopic: Definition of order
    concept: Order is experimental, can be zero or fractional and applies to all reactions
    category: concept
    format: multi-statement
    difficulty: 3
    time: 55
    ncert: true
    battle: false
    tags: [order-of-reaction]
    stem: |-
      Consider these statements about the order of a reaction.
      I. Order can be zero or fractional.
      II. Order is the sum of the powers of the concentration terms in the experimentally determined rate law.
      III. Order is always equal to the sum of the stoichiometric coefficients of the reactants.
      IV. Order can be defined only for elementary reactions.
      Which of these are correct?
    options:
      - I and III only
      - I and II only
      - II and IV only
      - I, II and IV only
    answer: 1
    explanation: Order is an experimental quantity, the sum of the exponents in the rate law, and may be 0 or a fraction. It applies to elementary and complex reactions alike and need not equal the sum of the coefficients, so III and IV are wrong.
  - id: che-kin-025
    topic: order-of-reaction
    subtopic: Units of rate constant in pressure terms
    concept: Unit of k for a 3/2 order gas reaction when rate is in atm s^{-1}
    category: numerical
    format: direct
    difficulty: 3
    time: 60
    ncert: true
    battle: false
    tags: [rate-constant-units, gas-phase]
    stem: The decomposition of a gas follows rate = k(p_A)^{3/2}, where p_A is its partial pressure. If pressure is in atm and time in s, the unit of k is
    options:
      - atm^{-1/2} s^{-1}
      - atm^{1/2} s^{-1}
      - atm^{-3/2} s^{-1}
      - atm s^{-1}
    answer: 0
    explanation: Rate has the unit atm s^{-1}, so k = rate/p_A^{3/2} has the unit atm^{1 − 3/2} s^{-1} = atm^{-1/2} s^{-1}. Forgetting that the rate itself carries the unit atm gives atm^{-3/2} s^{-1}.
  - id: che-kin-026
    topic: order-of-reaction
    subtopic: Units of rate constant
    concept: Units of k for zero, first, second and third order reactions
    category: factual
    format: match
    difficulty: 2
    time: 40
    ncert: true
    battle: false
    tags: [rate-constant-units]
    stem: |-
      Match the order of reaction in List I with the unit of its rate constant in List II.
      List I
      P. Zero order
      Q. First order
      R. Second order
      S. Third order
      List II
      1. L mol^{-1} s^{-1}
      2. mol L^{-1} s^{-1}
      3. L^2 mol^{-2} s^{-1}
      4. s^{-1}
    options:
      - P-4, Q-2, R-1, S-3
      - P-2, Q-4, R-1, S-3
      - P-2, Q-4, R-3, S-1
