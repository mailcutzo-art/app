      - −112 kJ mol^{-1}
    answer: 1
    explanation: Heat released = (200 × 4.18 + 40) × 3.2 ≈ 2803 J for 0.050 mol of water, i.e. about 56.1 kJ mol^{-1}, so ΔH ≈ −56.1 kJ mol^{-1}. Ignoring the calorimeter gives −53.5, and dividing by 0.10 mol gives −28.0.
