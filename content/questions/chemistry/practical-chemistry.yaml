  - id: che-prac-399
    topic: sols-and-kinetics
    subtopic: Effect of dilution in the clock reaction
    concept: Doubling the volume with the same amounts doubles the time for the blue colour
    category: application
    format: direct
    difficulty: 4
    time: 120
    ncert: false
    battle: false
    tags: [clock-reaction, rate-law, trap]
    stem: In the iodide–H_2O_2 clock reaction (rate = k[H_2O_2][I^−]), the same amounts (moles) of all reagents, including thiosulphate, are used but the total volume is doubled with water. The time for the blue colour to appear becomes
    options:
      - half the original time
      - four times the original time
      - the same as before
      - twice the original time
    answer: 3
    explanation: Halving both concentrations cuts the rate (in mol L^{-1} s^{-1}) to one quarter, but because the volume is doubled, the same moles of thiosulphate need only half the concentration of I_2. Time = ½ ÷ ¼ = 2 times the original. Considering only the fall in rate gives four times.
