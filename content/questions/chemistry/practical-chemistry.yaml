    tags: [clock-reaction, starch]
    stem: In the iodide–H_2O_2 clock reaction, which change will NOT noticeably alter the time taken for the blue colour to appear?
    options:
      - Adding a little more starch solution
      - Doubling [I^−]
      - Doubling [H_2O_2]
      - Raising the temperature by 10 °C
    answer: 0
    explanation: Starch is only the indicator for iodine and takes no part in the reaction being timed, so a little extra does not change the time. Changing either reactant concentration or the temperature changes the rate and hence the time.
