questions:
  - id: che-prac-001
    topic: lassaigne-test
    subtopic: Purpose of sodium fusion
    concept: Sodium fusion converts covalently bonded N, S and X into ionic sodium salts
    category: concept
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    tags: [sodium-fusion-extract, ncert-line]
    stem: An organic compound is fused with sodium metal before it is tested for nitrogen, sulphur and halogens because fusion
    options:
      - removes carbon and hydrogen as CO_2 and water vapour
      - converts these covalently bonded elements into ionic, water-soluble sodium salts
      - oxidises these elements to their highest oxidation states
      - converts these elements into volatile hydrides that can be detected by smell
    answer: 1
    explanation: Fusion with sodium changes covalently bonded N, S and X into ionic NaCN, Na_2S and NaX, which dissolve in water and give ionic tests. Carbon is not removed as CO_2; it combines with nitrogen to form cyanide.
  - id: che-prac-002
    topic: lassaigne-test
    subtopic: Nitrogen and sulphur together
    concept: With limited sodium, N and S together form sodium thiocyanate
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [thiocyanate, ncert-line]
    stem: When a compound containing both nitrogen and sulphur is fused with a limited amount of sodium, these elements appear in the extract mainly as
    options:
      - Na_2SO_4 and NaNO_3
      - Na_3N and Na_2S
      - NaSCN
      - NaCN and Na_2S
    answer: 2
    explanation: With limited sodium, Na + C + N + S → NaSCN (sodium thiocyanate). Only with excess sodium is the thiocyanate split into NaCN and Na_2S (NaSCN + 2Na → NaCN + Na_2S).
  - id: che-prac-003
    topic: lassaigne-test
    subtopic: Test for nitrogen
    concept: Prussian blue is iron(III) hexacyanidoferrate(II), Fe_4[Fe(CN)_6]_3
    category: factual
    format: direct
    difficulty: 3
    time: 45
    ncert: true
    battle: true
    tags: [prussian-blue, trap, ncert-line]
    stem: The Prussian blue colour obtained in the Lassaigne's test for nitrogen is due to
    options:
      - Fe_4[Fe(CN)_6]_3
      - Na_4[Fe(CN)_6]
      - "[Fe(SCN)]^{2+}"
      - Fe_3[Fe(CN)_6]_2
    answer: 0
    explanation: CN^− first gives [Fe(CN)_6]^{4-} with Fe^{2+}; Fe^{3+} formed by partial oxidation then gives iron(III) hexacyanidoferrate(II), Fe_4[Fe(CN)_6]_3·xH_2O. Fe_3[Fe(CN)_6]_2 is Turnbull's blue, Na_4[Fe(CN)_6] is only the intermediate, and [Fe(SCN)]^{2+} is the blood-red thiocyanate complex.
  - id: che-prac-004
    topic: lassaigne-test
    subtopic: Effect of excess sodium
    concept: Excess sodium splits NaSCN into NaCN and Na_2S so N and S test separately
    category: application
    format: case
    difficulty: 4
    time: 100
    ncert: true
    battle: false
    tags: [thiocyanate, multi-concept]
    stem: The sodium fusion extract of thiourea, NH_2CSNH_2, prepared with a small piece of sodium, turns blood red with FeCl_3 but gives no Prussian blue. If the fusion is repeated with excess sodium, the new extract will
    options:
      - give a violet colour with sodium nitroprusside but no test for nitrogen
      - give Prussian blue in the nitrogen test and a violet colour with sodium nitroprusside
      - give only the blood-red colour with FeCl_3, as before
      - give Prussian blue but no test for sulphur
    answer: 1
    explanation: With limited sodium only SCN^− forms, which gives blood-red [Fe(SCN)]^{2+}. Excess sodium decomposes it, NaSCN + 2Na → NaCN + Na_2S, so free CN^− (Prussian blue) and S^{2-} (violet with nitroprusside) are both present and the two elements are detected separately.
  - id: che-prac-005
    topic: lassaigne-test
    subtopic: Test for halogens
    concept: Boiling with HNO_3 removes CN^− that would give white AgCN
    category: concept
    format: assertion-reason
    difficulty: 3
    time: 55
    ncert: true
    battle: false
    tags: [halogen-test, ncert-line]
    stem: |-
      Assertion (A): Before testing for halogens, the sodium fusion extract of a compound that also contains nitrogen is boiled with concentrated HNO_3.
      Reason (R): Boiling with HNO_3 decomposes NaCN, which would otherwise give a white precipitate of AgCN with AgNO_3.
    options:
      - A is false but R is true
      - Both A and R are true and R is the correct explanation of A
      - Both A and R are true but R is not the correct explanation of A
      - A is true but R is false
    answer: 1
    explanation: Boiling with HNO_3 decomposes NaCN (and Na_2S) and drives off the volatile products. If cyanide remained, AgNO_3 would give white AgCN, which could be mistaken for AgCl. R is exactly the reason for A.
  - id: che-prac-006
    topic: lassaigne-test
    subtopic: Test for halogens
    concept: Identifying Cl and I together from AgX solubility in NH_4OH
    category: application
    format: case
    difficulty: 4
    time: 110
    ncert: true
    battle: false
    tags: [halogen-test, silver-halides, multi-concept]
    stem: The HNO_3-acidified sodium fusion extract of a compound gives a precipitate with AgNO_3. On shaking with dilute NH_4OH, part of it dissolves, leaving a yellow residue; the ammoniacal filtrate gives a white precipitate when acidified with HNO_3. The halogens present are
    options:
      - iodine only
      - chlorine and iodine
      - bromine and iodine
      - chlorine only
    answer: 1
    explanation: The portion that dissolves in NH_4OH as [Ag(NH_3)_2]^+ and reprecipitates white on acidification is AgCl, so chlorine is present. The yellow residue insoluble in NH_4OH is AgI. Bromide would give pale yellow AgBr, and iodine alone could not give the white precipitate.
  - id: che-prac-007
    topic: lassaigne-test
    subtopic: Test for sulphur
    concept: Violet colour with sodium nitroprusside is due to [Fe(CN)_5NOS]^{4-}
    category: factual
    format: direct
    difficulty: 3
    time: 45
    ncert: true
    battle: true
    tags: [sulphur-test, nitroprusside, ncert-line]
    stem: In the sodium nitroprusside test for sulphur in the sodium fusion extract, the violet colour is due to
    options:
      - PbS
      - "[Fe(CN)_5NOS]^{4-}"
      - "[Fe(CN)_6]^{4-}"
      - "[Fe(SCN)]^{2+}"
    answer: 1
    explanation: S^{2-} + [Fe(CN)_5NO]^{2-} → [Fe(CN)_5NOS]^{4-}, which is violet. PbS is the black precipitate of the lead acetate test, and [Fe(SCN)]^{2+} is the blood-red complex seen when N and S are both present.
  - id: che-prac-008
    topic: lassaigne-test
    subtopic: Limitations of the test
    concept: Hydrazine gives no Lassaigne's test for N because it has no carbon
    category: concept
    format: statement-pair
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [hydrazine, trap]
    stem: |-
      Statement I: Hydrazine (NH_2NH_2) does not give the Lassaigne's test for nitrogen.
      Statement II: In the sodium fusion extract, nitrogen is present as sodium nitrite, NaNO_2.
    options:
      - Statement I is correct but Statement II is incorrect
      - Both Statement I and Statement II are correct
      - Statement I is incorrect but Statement II is correct
      - Both Statement I and Statement II are incorrect
    answer: 0
    explanation: Hydrazine contains no carbon, so NaCN cannot form on fusion and no Prussian blue appears; Statement I is correct. Nitrogen is present in the extract as cyanide (NaCN), not nitrite, so Statement II is incorrect.
  - id: che-prac-009
    topic: lassaigne-test
    subtopic: Test for halogens
    concept: Solubility of silver halides in ammonia decreases from AgCl to AgI
    category: concept
    format: ordering
    difficulty: 3
    time: 45
    ncert: true
    battle: true
    tags: [silver-halides, ordering]
    stem: Which order correctly shows the solubility in aqueous ammonia of the silver halides obtained in the Lassaigne's test?
    options:
      - AgI > AgBr > AgCl
      - AgCl > AgI > AgBr
      - AgBr > AgCl > AgI
      - AgCl > AgBr > AgI
    answer: 3
    explanation: AgCl dissolves readily in NH_4OH as [Ag(NH_3)_2]^+, AgBr only sparingly and AgI practically not at all, because the solubility product falls sharply from AgCl to AgI.
  - id: che-prac-010
    topic: hydroxyl-group-tests
    subtopic: Lucas test
    concept: Lucas reagent is conc. HCl with anhydrous ZnCl_2
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [lucas-test, ncert-line]
    stem: Lucas reagent, used to distinguish primary, secondary and tertiary alcohols, is a mixture of
    options:
      - concentrated HNO_3 and concentrated H_2SO_4
      - concentrated HCl and anhydrous ZnCl_2
      - concentrated H_2SO_4 and anhydrous AlCl_3
      - dilute HCl and ZnSO_4
    answer: 1
    explanation: Lucas reagent is concentrated HCl with anhydrous ZnCl_2, a Lewis acid that helps the C–OH bond break. Conc. HNO_3 with conc. H_2SO_4 is the nitrating mixture.
  - id: che-prac-011
    topic: hydroxyl-group-tests
    subtopic: Lucas test
    concept: Time for turbidity with Lucas reagent is 3° < 2° < 1°
    category: application
    format: ordering
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [lucas-test, ordering]
    stem: Arrange butan-1-ol, butan-2-ol and 2-methylpropan-2-ol in increasing order of the time taken to give turbidity with Lucas reagent at room temperature.
    options:
      - 2-methylpropan-2-ol < butan-1-ol < butan-2-ol
      - 2-methylpropan-2-ol < butan-2-ol < butan-1-ol
      - butan-2-ol < 2-methylpropan-2-ol < butan-1-ol
      - butan-1-ol < butan-2-ol < 2-methylpropan-2-ol
    answer: 1
    explanation: The tertiary alcohol forms a stable carbocation and gives turbidity at once, the secondary alcohol takes about five minutes, and the primary alcohol gives no turbidity at room temperature. The turbidity is the insoluble alkyl chloride.
  - id: che-prac-012
    topic: hydroxyl-group-tests
    subtopic: Ceric ammonium nitrate test
    concept: Alcohols turn yellow ceric ammonium nitrate pink or red
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [can-test, ncert-line]
    stem: When an alcohol is added to ceric ammonium nitrate solution, a positive test is shown by
    options:
      - a white precipitate
      - a violet colour
      - the yellow solution turning pink or red
      - a silver mirror on the wall of the tube
    answer: 2
    explanation: Alcohols replace nitrate ligands of (NH_4)_2[Ce(NO_3)_6] and form a red complex, [Ce(NO_3)_4(ROH)_3], so the yellow reagent turns pink to red. A violet colour with neutral FeCl_3 is the phenol test.
  - id: che-prac-013
    topic: hydroxyl-group-tests
    subtopic: Ferric chloride test
    concept: Neutral FeCl_3 is needed because acid suppresses the iron–phenoxide complex
    category: concept
    format: statements
    difficulty: 3
    time: 60
    ncert: true
    battle: false
    tags: [ferric-chloride-test, trap]
    stem: Which statement about the ferric chloride test for phenols is correct?
    options:
      - The FeCl_3 solution must be neutral, because free acid prevents formation of the coloured iron–phenoxide complex
      - The violet colour is due to a precipitate of Fe(OH)_3
      - Benzyl alcohol gives the same violet colour as phenol
      - Every phenol gives exactly the same violet shade
    answer: 0
    explanation: 6C_6H_5OH + Fe^{3+} ⇌ [Fe(OC_6H_5)_6]^{3-} + 6H^+, so excess acid pushes the equilibrium back; neutral FeCl_3 is made by adding dilute NH_4OH or NaOH until a faint permanent precipitate appears and filtering. Benzyl alcohol is an alcohol and gives no colour, and different phenols give violet, blue, green or red shades.
  - id: che-prac-014
    topic: hydroxyl-group-tests
    subtopic: Liebermann's nitroso test
    concept: Colour sequence in Liebermann's test, green/blue → red on dilution → blue with alkali
    category: factual
    format: direct
    difficulty: 3
    time: 45
    ncert: true
    battle: true
    tags: [liebermann-test]
    stem: In Liebermann's nitroso test, phenol with NaNO_2 and conc. H_2SO_4 gives a deep green or blue colour. On dilution with water the colour becomes
    options:
      - violet
      - colourless
      - red
      - yellow
    answer: 2
    explanation: The indophenol formed is red in dilute acid, and adding NaOH turns it deep blue or green again (its sodium salt). This colour sequence confirms a phenolic –OH group.
  - id: che-prac-015
    topic: hydroxyl-group-tests
    subtopic: Identifying C_7H_8O isomers
    concept: Distinguishing a phenol, an alcohol and an ether of formula C_7H_8O
    category: application
    format: case
    difficulty: 4
    time: 110
    ncert: true
    battle: false
    tags: [multi-concept, isomers]
    stem: Three isomers of formula C_7H_8O behave as follows. X dissolves in aqueous NaOH and gives a violet-blue colour with neutral FeCl_3. Y does not dissolve in NaOH but gives H_2 with sodium and a red colour with ceric ammonium nitrate. Z reacts with none of these reagents. X, Y and Z are respectively
    options:
      - benzyl alcohol, p-cresol and anisole
      - p-cresol, benzyl alcohol and anisole
      - anisole, benzyl alcohol and p-cresol
      - p-cresol, anisole and benzyl alcohol
    answer: 1
    explanation: X is acidic and gives the FeCl_3 colour, so it is a phenol, p-cresol. Y reacts with Na and CAN but is too weakly acidic to dissolve in NaOH, so it is the alcohol C_6H_5CH_2OH. Z, anisole (C_6H_5OCH_3), has no –OH group.
  - id: che-prac-016
    topic: hydroxyl-group-tests
    subtopic: Tests for phenol
    concept: Bromine water test and litmus test for phenol are true but unrelated
    category: concept
    format: assertion-reason
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [bromine-water, phenol]
    stem: |-
      Assertion (A): Phenol gives a white precipitate with bromine water.
      Reason (R): Phenol turns blue litmus red.
    options:
      - A is true but R is false
      - A is false but R is true
      - Both A and R are true and R is the correct explanation of A
      - Both A and R are true but R is not the correct explanation of A
    answer: 3
    explanation: The –OH group strongly activates the ring, so bromine water gives 2,4,6-tribromophenol as a white precipitate. Phenol is also weakly acidic and turns blue litmus red, but its acidity does not explain the bromination.
  - id: che-prac-017
    topic: hydroxyl-group-tests
    subtopic: Iodoform and Lucas tests
    concept: Secondary alcohols with CH_3CH(OH)– give both iodoform and a 5-minute Lucas test
    category: application
    format: multi-statement
    difficulty: 4
    time: 100
    ncert: true
    battle: false
    tags: [iodoform-test, lucas-test, multi-concept]
    stem: |-
      Which of the following alcohols give BOTH a yellow precipitate with I_2/NaOH AND turbidity within about five minutes with Lucas reagent at room temperature?
      I. Propan-2-ol
      II. Butan-2-ol
      III. 2-Methylpropan-2-ol
      IV. Ethanol
    options:
      - I and II only
      - II and III only
      - I, II and IV only
      - I, II and III only
    answer: 0
    explanation: Propan-2-ol and butan-2-ol are secondary alcohols containing CH_3CH(OH)–, so both tests are positive. 2-Methylpropan-2-ol gives Lucas turbidity at once but cannot be oxidised to a methyl ketone, so no iodoform; ethanol gives iodoform but, being primary, no turbidity at room temperature.
  - id: che-prac-018
    topic: carbonyl-group-tests
    subtopic: Tollens' test
    concept: Tollens' reagent is ammoniacal silver nitrate
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [tollens-test, ncert-line]
    stem: In the laboratory test for the aldehydic group, the Tollens' reagent used is
    options:
      - ammoniacal silver nitrate solution
      - alkaline copper(II) tartrate solution
      - rosaniline hydrochloride decolourised by SO_2
      - 2,4-dinitrophenylhydrazine in acid
    answer: 0
    explanation: Tollens' reagent contains [Ag(NH_3)_2]^+ and gives a silver mirror with aldehydes. Alkaline copper(II) tartrate is Fehling's solution and decolourised rosaniline is Schiff's reagent.
  - id: che-prac-019
    topic: carbonyl-group-tests
    subtopic: Fehling's test
    concept: Aromatic aldehydes do not respond to Fehling's test
    category: application
    format: direct
    difficulty: 3
    time: 45
    ncert: true
    battle: true
    tags: [fehling-test, trap, ncert-line]
    stem: Which reagent can distinguish benzaldehyde from acetaldehyde?
    options:
      - Tollens' reagent
      - Schiff's reagent
      - Fehling's solution
      - 2,4-DNP reagent
    answer: 2
    explanation: Acetaldehyde reduces Fehling's solution to red Cu_2O, but aromatic aldehydes such as benzaldehyde do not respond to Fehling's test. Both aldehydes give a silver mirror with Tollens' reagent and a precipitate with 2,4-DNP.
  - id: che-prac-020
    topic: carbonyl-group-tests
    subtopic: Schiff's test
    concept: Schiff's reagent is colourless and aldehydes restore its pink colour
    category: concept
    format: assertion-reason
    difficulty: 3
    time: 55
    ncert: true
    battle: false
    tags: [schiff-test, trap]
    stem: |-
      Assertion (A): Schiff's test for aldehydes is performed in the cold, without heating.
      Reason (R): Schiff's reagent is a pink solution that is decolourised by aldehydes.
    options:
      - Both A and R are true but R is not the correct explanation of A
      - Both A and R are true and R is the correct explanation of A
      - A is false but R is true
      - A is true but R is false
    answer: 3
    explanation: Schiff's reagent is magenta (rosaniline hydrochloride) decolourised by SO_2; an aldehyde restores the pink colour. The test is done cold because heating drives off SO_2 and restores the colour even without an aldehyde. R reverses the colour change, so it is false.
  - id: che-prac-021
    topic: carbonyl-group-tests
    subtopic: 2,4-DNP test
    concept: Aldehydes and ketones both give coloured 2,4-dinitrophenylhydrazones
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [2-4-dnp-test, ncert-line]
    stem: With 2,4-dinitrophenylhydrazine (Brady's reagent), both aldehydes and ketones give
    options:
      - a violet colour that fades slowly
      - a red precipitate of Cu_2O
      - a yellow, orange or red precipitate
      - a silver mirror
    answer: 2
    explanation: The carbonyl group condenses with 2,4-DNP (addition followed by loss of water) to give a coloured 2,4-dinitrophenylhydrazone. The test shows a C=O group but does not tell aldehydes from ketones.
  - id: che-prac-022
    topic: carbonyl-group-tests
    subtopic: Identifying a carbonyl compound
    concept: C_3H_6O positive to 2,4-DNP and iodoform but negative to Tollens' is acetone
    category: application
    format: case
    difficulty: 3
    time: 60
    ncert: true
    battle: false
    tags: [iodoform-test, tollens-test]
    stem: A compound C_3H_6O gives an orange precipitate with 2,4-DNP, does not reduce Tollens' reagent and gives a yellow precipitate with iodine and NaOH. The compound is
    options:
      - propanone
      - prop-2-en-1-ol
      - methoxyethene
      - propanal
    answer: 0
    explanation: The 2,4-DNP result shows a C=O group and the negative Tollens' test rules out an aldehyde, so it is a ketone; CH_3COCH_3 also has the CH_3CO– group needed for iodoform. Propanal would give a silver mirror and no iodoform.
  - id: che-prac-023
    topic: carbonyl-group-tests
    subtopic: Tests for ketones
    concept: m-Dinitrobenzene and sodium nitroprusside tests detect the ketonic group
    category: factual
    format: direct
    difficulty: 3
    time: 45
    ncert: true
    battle: true
    tags: [ketone-test, nitroprusside]
    stem: A violet colour with m-dinitrobenzene in dilute NaOH and a red colour with sodium nitroprusside in NaOH are laboratory tests for
    options:
      - the primary amino group
      - the phenolic group
      - the ketonic group
      - the carboxyl group
    answer: 2
    explanation: Ketones such as acetone give a violet colour (fading slowly) with m-dinitrobenzene in alkali and a red colour with sodium nitroprusside and NaOH. Phenols are tested with neutral FeCl_3 and carboxylic acids with NaHCO_3.
  - id: che-prac-024
    topic: carbonyl-group-tests
    subtopic: Fehling's test
    concept: Composition of Fehling's A and B, role of tartrate and product Cu_2O
    category: application
    format: multi-statement
    difficulty: 4
    time: 100
    ncert: true
    battle: false
    tags: [fehling-test, multi-concept]
    stem: |-
      Consider the following statements about Fehling's test.
      I. Fehling's solution A is aqueous CuSO_4 and solution B is alkaline sodium potassium tartrate.
      II. The tartrate ion complexes Cu^{2+} so that Cu(OH)_2 is not precipitated in the alkaline medium.
      III. Benzaldehyde gives a red precipitate of Cu_2O on warming with Fehling's solution.
      IV. The red precipitate shows reduction of copper from the +2 to the +1 state.
      Which statements are correct?
    options:
      - I and II only
      - I, II and IV only
      - I, III and IV only
      - II, III and IV only
    answer: 1
    explanation: Fehling's A is CuSO_4 solution and B is Rochelle salt in NaOH; tartrate keeps Cu^{2+} in solution, and an aliphatic aldehyde reduces it to red Cu_2O (Cu +2 → +1). Aromatic aldehydes such as benzaldehyde do not give Fehling's test, so III is wrong.
  - id: che-prac-025
    topic: carbonyl-group-tests
    subtopic: Tollens' test stoichiometry
    concept: Each –CHO group deposits 2 Ag, used to find the molar mass of an aldehyde
    category: numerical
    format: direct
    difficulty: 4
    time: 100
    ncert: false
    battle: false
    formula: RCHO + 2[Ag(NH_3)_2]^+ + 3OH^− → RCOO^− + 2Ag + 4NH_3 + 2H_2O
    tags: [tollens-test, stoichiometry, calculation]
    stem: 1.16 g of an aliphatic aldehyde RCHO deposits 4.32 g of silver with excess Tollens' reagent. The aldehyde is (Ag = 108 g mol^{-1})
    options:
      - propanal
      - butanal
      - pentanal
      - ethanal
    answer: 0
    explanation: Moles of Ag = 4.32/108 = 0.040, and each –CHO gives 2 Ag, so the aldehyde is 0.020 mol. Molar mass = 1.16/0.020 = 58 g mol^{-1}, which is C_2H_5CHO, propanal. Assuming one Ag per aldehyde gives an impossible molar mass of 29.
  - id: che-prac-026
    topic: carboxyl-amino-tests
    subtopic: Sodium hydrogencarbonate test
    concept: Carboxylic acids liberate CO_2 with NaHCO_3
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [bicarbonate-test, ncert-line]
    stem: A carboxylic acid is indicated when its solution added to aqueous sodium hydrogencarbonate gives
    options:
      - brisk effervescence of CO_2
      - an offensive smell
      - a violet colour
      - a silver mirror
    answer: 0
    explanation: RCOOH + NaHCO_3 → RCOONa + H_2O + CO_2↑. Carboxylic acids are stronger than carbonic acid, so CO_2 is released with brisk effervescence.
  - id: che-prac-027
    topic: carboxyl-amino-tests
    subtopic: Identifying an amine
    concept: Benzylamine gives the carbylamine test but no azo dye
    category: application
    format: case
    difficulty: 4
    time: 90
    ncert: true
    battle: false
    tags: [carbylamine-test, azo-dye-test, trap]
    stem: An amine C_7H_9N gives an offensive smell when heated with CHCl_3 and alcoholic KOH, but its cold solution in NaNO_2/HCl gives no coloured dye with alkaline 2-naphthol. The amine is
    options:
      - p-toluidine
      - benzylamine
      - m-toluidine
      - N-methylaniline
    answer: 1
