    answer: 0
    explanation: "At 74 pm the attractive and repulsive forces between the two H atoms balance and the energy is minimum (−435.8 kJ mol^{-1}). 37 pm is the covalent radius of H, half the bond length."

  - id: che-bond-020
    topic: bond-parameters
    subtopic: Covalent and van der Waals radii
    concept: Covalent radius is half the bond length in a homonuclear molecule
    category: numerical
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [covalent-radius]
    stem: The Cl–Cl bond length in Cl_2 is 198 pm. What is the covalent radius of chlorine?
    options:
      - 198 pm
      - 180 pm
      - 99 pm
      - 396 pm
    answer: 2
    explanation: The covalent radius is half the distance between the nuclei of two bonded like atoms, 198/2 = 99 pm. The van der Waals radius (about 180 pm) refers to non-bonded atoms and is larger.

  - id: che-bond-021
    topic: bond-parameters
    subtopic: Covalent and van der Waals radii
    concept: van der Waals radius exceeds covalent radius
    category: concept
    format: statement-pair
    difficulty: 2
    time: 45
    ncert: true
    battle: false
    tags: [covalent-radius, van-der-waals-radius, trap]
    stem: |-
      Statement I: The van der Waals radius of an atom is always smaller than its covalent radius.
      Statement II: The van der Waals radius is half the distance between two similar non-bonded atoms in neighbouring molecules of a solid.
    options:
      - Both Statement I and Statement II are correct
      - Both Statement I and Statement II are incorrect
      - Statement I is correct but Statement II is incorrect
      - Statement I is incorrect but Statement II is correct
    answer: 3
    explanation: Non-bonded atoms cannot approach as closely as bonded ones, so the van der Waals radius (e.g. Cl 180 pm) is larger than the covalent radius (Cl 99 pm). Statement II is the correct definition.

