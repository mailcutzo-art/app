  - id: che-bond-025
    topic: bond-parameters
    subtopic: Resonance
    concept: C–O bond order in carbonate ion is 4/3
    category: numerical
    format: direct
    difficulty: 3
    time: 45
    ncert: true
    battle: true
    tags: [resonance, bond-order, carbonate]
    stem: What is the C–O bond order in the carbonate ion, CO_3^{2-}?
    options:
      - "1.5"
      - "2"
      - "1.33"
      - "1"
    answer: 2
    explanation: Three equivalent resonance structures share one C=O double bond among three C–O positions. Bond order = total bonds/number of positions = 4/3 ≈ 1.33.

  - id: che-bond-026
    topic: bond-parameters
    subtopic: Resonance
    concept: Resonance hybrid is more stable than any canonical form
    category: concept
    format: statements
    difficulty: 3
    time: 60
    ncert: true
    battle: false
    tags: [resonance, trap]
    stem: Which statement about resonance is correct?
    options:
      - The molecule oscillates rapidly between its canonical forms.
      - Each canonical form has a real, separate existence.
      - The resonance hybrid has lower energy than any single canonical structure.
      - Canonical forms differ in the positions of their atoms.
    answer: 2
    explanation: The hybrid is the single real structure and resonance lowers its energy (resonance stabilisation). Canonical forms have no real existence, the molecule does not flip between them, and they differ only in electron positions, not atom positions.

  - id: che-bond-027
    topic: bond-parameters
