    ncert: false
    battle: true
    tags: [lattice-enthalpy, ionic-size]
    stem: Arrange the lattice enthalpies of NaF, NaCl, NaBr and NaI in decreasing order.
    options:
      - NaI > NaBr > NaCl > NaF
      - NaCl > NaF > NaBr > NaI
      - NaF > NaCl > NaI > NaBr
      - NaF > NaCl > NaBr > NaI
    answer: 3
    explanation: With the same cation and charge, lattice enthalpy falls as the anion grows (F^- < Cl^- < Br^- < I^-), because the interionic distance increases and attraction weakens.

  - id: che-bond-019
