questions:
  - id: che-bond-001
    topic: kossel-lewis-octet
    subtopic: Kössel–Lewis approach
    concept: Noble gases are chemically inert because of a stable octet
    category: concept
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    tags: [octet-rule, ncert-line]
    stem: According to the Kössel–Lewis approach, atoms combine chemically in order to
    options:
      - increase their number of valence electrons to ten
      - attain a stable noble-gas (octet) configuration
      - lose all their valence electrons
      - acquire an unpaired electron
    answer: 1
    explanation: Kössel and Lewis related bonding to the stability of noble gases; atoms lose, gain or share electrons to attain an octet (duplet for H, Li, Be) in their valence shell.

  - id: che-bond-002
    topic: kossel-lewis-octet
    subtopic: Lewis symbols
    concept: Dots in a Lewis symbol represent valence electrons
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [lewis-symbol]
    stem: How many dots are drawn around the symbol of nitrogen in its Lewis symbol?
    options:
      - "3"
      - "7"
      - "5"
      - "2"
    answer: 2
    explanation: "Nitrogen is 1s^2 2s^2 2p^3; its valence shell holds 5 electrons, so its Lewis symbol shows 5 dots. Seven is the atomic number, not the valence count."

  - id: che-bond-003
    topic: kossel-lewis-octet
    subtopic: Electrovalence
    concept: Electrovalence equals the number of electrons lost or gained
    category: factual
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    tags: [electrovalence]
    stem: What is the electrovalence of calcium in CaCl_2?
    options:
      - "2"
      - "1"
      - "4"
      - "0"
    answer: 0
    explanation: Calcium loses two electrons to form Ca^{2+}; the number of electrons lost or gained in forming an ionic bond is the electrovalence, so it is 2.

  - id: che-bond-004
    topic: kossel-lewis-octet
    subtopic: Formal charge
    concept: Formal charge = V − L − ½S
    category: numerical
    format: direct
    difficulty: 3
    time: 60
    ncert: true
    battle: false
    formula: Formal charge = V − L − ½S
    tags: [formal-charge, ozone, ncert-line]
    stem: In the Lewis structure of ozone (O=O–O, central O bearing one lone pair), what is the formal charge on the central oxygen atom?
    options:
      - "0"
      - "−1"
      - "+2"
      - "+1"
    answer: 3
    explanation: "Central O: V = 6, lone-pair electrons L = 2, bonding electrons S = 6 (one double + one single bond). Formal charge = 6 − 2 − 3 = +1. The singly bonded terminal O carries −1 and the doubly bonded O carries 0."

  - id: che-bond-005
    topic: kossel-lewis-octet
    subtopic: Formal charge
    concept: Terminal singly bonded O in O_3 carries −1 formal charge
    category: numerical
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    formula: Formal charge = V − L − ½S
    tags: [formal-charge, ozone]
    stem: In the Lewis structure of O_3, what is the formal charge on the terminal oxygen that is joined to the central atom by a single bond (and carries three lone pairs)?
    options:
      - "−1"
      - "+1"
      - "0"
      - "−2"
    answer: 0
    explanation: "V = 6, L = 6, S = 2, so formal charge = 6 − 6 − 1 = −1. This balances the +1 on the central oxygen, giving a neutral molecule."

  - id: che-bond-006
    topic: kossel-lewis-octet
    subtopic: Incomplete octet
    concept: BCl_3 has an incomplete octet on boron
    category: factual
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    tags: [octet-exception, incomplete-octet]
    stem: In which of the following molecules does the central atom have fewer than eight electrons in its valence shell?
    options:
      - NH_3
      - CCl_4
      - BCl_3
      - H_2O
    answer: 2
    explanation: Boron has only three valence electrons; forming three B–Cl bonds gives it six electrons, an incomplete octet. N, C and O in the other molecules all complete their octets.

  - id: che-bond-007
    topic: kossel-lewis-octet
    subtopic: Odd-electron molecules
    concept: NO and NO_2 are odd-electron molecules
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [octet-exception, odd-electron, ncert-line]
    stem: Which of the following is an odd-electron molecule for which the octet rule cannot be satisfied for all atoms?
    options:
      - CO
      - NO_2
      - N_2O
      - CO_2
    answer: 1
    explanation: NO_2 has 5 + 12 = 17 valence electrons, an odd number, so nitrogen cannot complete an octet. CO, N_2O and CO_2 all have even electron counts.

  - id: che-bond-008
    topic: kossel-lewis-octet
    subtopic: Expanded octet
    concept: Sulphur in SF_6 has 12 electrons around it
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [octet-exception, expanded-octet]
    stem: How many electrons surround the sulphur atom in SF_6?
    options:
      - "8"
      - "10"
      - "14"
      - "12"
    answer: 3
    explanation: Six S–F bonds put 6 × 2 = 12 electrons around sulphur, an expanded octet possible because S (period 3) has vacant 3d orbitals.

  - id: che-bond-009
    topic: kossel-lewis-octet
    subtopic: Limitations of the octet rule
    concept: Octet rule cannot explain molecular shape or stability
    category: concept
    format: statements
    difficulty: 3
    time: 60
    ncert: true
    battle: false
    tags: [octet-rule, limitations]
    stem: Which statement about the octet rule is INCORRECT?
    options:
      - It cannot explain the formation of compounds such as XeF_2 and KrF_2.
      - It explains the shape of molecules and their relative stability.
      - It is not obeyed in odd-electron molecules such as NO.
      - Elements of period 3 and beyond can accommodate more than eight valence electrons.
    answer: 1
    explanation: The octet rule says nothing about molecular geometry or the energy (stability) of a molecule; that is one of its stated NCERT limitations. The other three are correct statements of its failures.

  - id: che-bond-010
    topic: kossel-lewis-octet
    subtopic: Lewis structures
    concept: Counting lone pairs in the Lewis structure of CO
    category: application
    format: direct
    difficulty: 2
    time: 40
    ncert: true
    battle: true
    tags: [lewis-structure, carbon-monoxide]
    stem: In the Lewis structure of carbon monoxide, how many lone pairs are present in total on both atoms?
    options:
      - "2"
      - "1"
      - "4"
      - "3"
    answer: 0
    explanation: CO has 10 valence electrons. A C≡O triple bond uses 6, leaving 4 electrons as one lone pair on C and one on O, so 2 lone pairs in all.

  - id: che-bond-011
    topic: kossel-lewis-octet
    subtopic: Formal charge
    concept: Formal charges in the carbon monoxide Lewis structure
    category: application
    format: direct
    difficulty: 4
    time: 90
    ncert: false
    battle: false
    formula: Formal charge = V − L − ½S
    tags: [formal-charge, carbon-monoxide, trap]
    stem: In the Lewis structure :C≡O:, what are the formal charges on carbon and oxygen respectively?
    options:
      - 0 and 0
      - +1 and −1
      - −1 and +1
      - −2 and +2
    answer: 2
    explanation: "C: 4 − 2 − 3 = −1. O: 6 − 2 − 3 = +1. The less electronegative carbon carries the negative formal charge here, which partly cancels the expected C→O bond polarity and explains the small dipole moment of CO."

  - id: che-bond-012
    topic: ionic-bond
    subtopic: Conditions for ionic bonding
    concept: Low ionisation enthalpy and high lattice enthalpy favour ionic bonds
    category: concept
    format: direct
    difficulty: 2
    time: 40
    ncert: true
    battle: true
    tags: [ionic-bond, lattice-enthalpy]
    stem: Formation of an ionic compound is favoured by
    options:
      - high ionisation enthalpy of the metal and low lattice enthalpy
      - low ionisation enthalpy of the metal and positive electron gain enthalpy of the non-metal
      - high ionisation enthalpy of the metal and high lattice enthalpy
      - low ionisation enthalpy of the metal and high lattice enthalpy
    answer: 3
    explanation: Easy cation formation (low ΔiH), exothermic anion formation (negative ΔegH) and a large energy release when the lattice forms (high lattice enthalpy) all favour an ionic bond.

  - id: che-bond-013
    topic: ionic-bond
    subtopic: Lattice enthalpy
    concept: Definition of lattice enthalpy
    category: factual
    format: direct
    difficulty: 1
    time: 30
    ncert: true
    battle: true
    tags: [lattice-enthalpy, ncert-line]
    stem: The lattice enthalpy of an ionic solid is the energy required to
    options:
      - completely separate one mole of the solid into its gaseous ions
      - convert one mole of the solid into its liquid form
      - convert one mole of the solid into its constituent atoms in their standard states
      - dissolve one mole of the solid in excess water
    answer: 0
    explanation: NCERT defines lattice enthalpy as the energy needed to completely separate one mole of a solid ionic compound into gaseous constituent ions; for NaCl it is 788 kJ mol^{-1}.

  - id: che-bond-014
    topic: ionic-bond
    subtopic: Lattice enthalpy
    concept: Lattice enthalpy of NaCl is 788 kJ mol^{-1}
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [lattice-enthalpy, ncert-line]
    stem: The lattice enthalpy of NaCl quoted in NCERT is about
    options:
      - 411 kJ mol^{-1}
      - 348 kJ mol^{-1}
      - 788 kJ mol^{-1}
      - 1502 kJ mol^{-1}
    answer: 2
    explanation: About 788 kJ mol^{-1} is needed to separate one mole of solid NaCl into Na^+ and Cl^- ions at infinite distance. This large value explains why the ionic bond forms even though Na → Na^+ needs energy.

  - id: che-bond-015
    topic: ionic-bond
    subtopic: Lattice enthalpy trends
    concept: Higher ionic charge gives higher lattice enthalpy
    category: application
    format: direct
    difficulty: 3
    time: 45
    ncert: false
    battle: true
    tags: [lattice-enthalpy, ionic-charge]
    stem: Which of the following has the highest lattice enthalpy?
    options:
      - NaCl
      - MgO
      - KCl
      - NaF
    answer: 1
    explanation: Lattice enthalpy rises with the product of ionic charges and falls with ionic size. MgO has +2/−2 ions that are also small, so it far exceeds the +1/−1 salts.

  - id: che-bond-016
    topic: ionic-bond
    subtopic: Ionic bond energetics
    concept: Na → Na^+ is endothermic; lattice energy compensates
    category: concept
    format: assertion-reason
    difficulty: 3
    time: 60
    ncert: true
    battle: false
    tags: [ionic-bond, energetics]
    stem: |-
      Assertion (A): NaCl is formed even though the sum of the ionisation enthalpy of Na and the electron gain enthalpy of Cl is positive.
      Reason (R): The energy released when gaseous Na^+ and Cl^- ions pack into a crystal lattice more than compensates for this.
    options:
      - Both A and R are true and R is the correct explanation of A
      - Both A and R are true but R is not the correct explanation of A
      - A is true but R is false
      - A is false but R is true
    answer: 0
    explanation: "ΔiH(Na) = 495.8 kJ mol^{-1} and ΔegH(Cl) = −348.7 kJ mol^{-1}, a net +147 kJ mol^{-1}. The lattice enthalpy (788 kJ mol^{-1}) released on forming the solid makes the overall process strongly favourable, so R explains A."

  - id: che-bond-017
    topic: ionic-bond
    subtopic: Nature of ionic compounds
    concept: Ionic compounds form 3-D crystal lattices, not discrete molecules
    category: concept
    format: statements
    difficulty: 2
    time: 45
    ncert: true
    battle: false
    tags: [ionic-solid]
    stem: Which statement about solid sodium chloride is correct?
    options:
      - It consists of discrete NaCl molecules held by van der Waals forces.
      - Each Na^+ is covalently bonded to one Cl^-.
      - It is a three-dimensional lattice in which each ion is surrounded by oppositely charged ions.
      - Its ions are free to move, so the solid conducts electricity.
    answer: 2
    explanation: In the NaCl crystal each Na^+ is surrounded by six Cl^- and vice versa; the formula only gives the ratio. The ions are fixed in the solid, so it conducts only when molten or dissolved.

  - id: che-bond-018
    topic: ionic-bond
    subtopic: Lattice enthalpy trends
