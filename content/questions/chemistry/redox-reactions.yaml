questions:
  - id: che-redox-001
    topic: classical-concept
    subtopic: Oxidation as addition of oxygen
    concept: Burning of magnesium is oxidation by addition of oxygen
    category: concept
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [classical-definition, ncert-line]
    stem: "In the reaction 2Mg(s) + O_2(g) → 2MgO(s), magnesium undergoes"
    options:
      - "reduction, because it gains oxygen"
      - "oxidation, because it gains oxygen"
      - "neither oxidation nor reduction"
      - "disproportionation"
    answer: 1
    explanation: "In the classical sense, addition of oxygen to a substance is oxidation. Magnesium combines with oxygen to form MgO, so magnesium is oxidised; gaining oxygen is never called reduction."

  - id: che-redox-002
    topic: classical-concept
    subtopic: Oxidation as removal of hydrogen
    concept: H2S is oxidised to S by removal of hydrogen
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [classical-definition, ncert-line]
    stem: "In 2H_2S(g) + O_2(g) → 2S(s) + 2H_2O(l), H_2S is oxidised because"
    options:
      - "hydrogen is removed from it"
      - "oxygen is added to it"
      - "an electropositive element is added to it"
      - "its sulphur gains electrons"
    answer: 0
    explanation: "Classically, removal of hydrogen from a substance is oxidation. H_2S loses its hydrogen to form sulphur. Sulphur goes from −2 to 0, i.e. it loses electrons, so the option saying it gains electrons is wrong."

  - id: che-redox-003
    topic: classical-concept
    subtopic: Electropositive and electronegative elements
    concept: Addition of an electronegative element is oxidation
    category: concept
    format: direct
    difficulty: 3
    time: 45
    ncert: true
    battle: false
    tags: [classical-definition, ncert-line]
    stem: "In the reaction 2HgCl_2 + SnCl_2 → Hg_2Cl_2 + SnCl_4, which statement is correct in terms of the classical definitions?"
    options:
      - "HgCl_2 is oxidised by addition of chlorine"
      - "SnCl_2 is reduced by removal of mercury"
      - "SnCl_2 is oxidised by addition of the electronegative element chlorine"
      - "Neither species is oxidised or reduced"
    answer: 2
    explanation: "SnCl_2 gains chlorine (an electronegative element) to become SnCl_4, which is oxidation. HgCl_2 is reduced because it loses chlorine, equivalently it gains the electropositive element mercury, forming Hg_2Cl_2."

  - id: che-redox-004
    topic: classical-concept
    subtopic: Reduction as removal of oxygen
    concept: CuO is reduced by hydrogen to copper
    category: concept
    format: direct
    difficulty: 1
    time: 20
    ncert: false
    battle: true
    tags: [classical-definition]
    stem: "When hot CuO is treated with H_2 to give Cu and H_2O, the substance reduced is"
    options:
      - "H_2"
      - "H_2O"
      - "Cu"
      - "CuO"
    answer: 3
    explanation: "CuO loses oxygen and becomes Cu, so CuO is reduced. H_2 gains oxygen to form water and is oxidised; Cu is a product, not a substance undergoing reduction."

  - id: che-redox-005
    topic: classical-concept
    subtopic: Removal of electropositive element
    concept: Removal of potassium from K4[Fe(CN)6] is oxidation
    category: application
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [classical-definition, ncert-line, trap]
    stem: "In 2K_4[Fe(CN)_6] + H_2O_2 → 2K_3[Fe(CN)_6] + 2KOH, potassium ferrocyanide is"
    options:
      - "reduced, as it loses an electropositive element"
      - "oxidised, as it loses the electropositive element potassium"
      - "reduced, because iron gains an electron"
      - "neither oxidised nor reduced, since no oxygen is added"
    answer: 1
    explanation: "Removal of an electropositive element (potassium) is classically oxidation. Consistently, iron changes from +2 in K_4[Fe(CN)_6] to +3 in K_3[Fe(CN)_6], a loss of one electron. Oxygen need not be added for oxidation."

  - id: che-redox-006
    topic: classical-concept
    subtopic: Redox is simultaneous
    concept: Oxidation and reduction always occur together
    category: concept
    format: assertion-reason
    difficulty: 2
    time: 40
    ncert: true
    battle: false
    tags: [ncert-line, redox-definition]
    stem: |-
      Assertion (A): Oxidation and reduction always take place simultaneously in a reaction.
      Reason (R): Electrons lost by one species must be gained by another species.
    options:
      - "Both A and R are true and R is the correct explanation of A"
      - "Both A and R are true but R is not the correct explanation of A"
      - "A is true but R is false"
      - "A is false but R is true"
    answer: 0
    explanation: "Free electrons cannot accumulate in a chemical reaction, so electrons released in oxidation must be taken up in reduction. This is exactly why the two processes are coupled and the term redox is used."

  - id: che-redox-007
    topic: classical-concept
    subtopic: Photosynthesis as redox
    concept: In photosynthesis CO2 is reduced and water is oxidised
    category: application
    format: direct
    difficulty: 3
    time: 45
    ncert: false
    battle: true
    tags: [trap, multi-concept]
    stem: "In photosynthesis, 6CO_2 + 6H_2O → C_6H_{12}O_6 + 6O_2. Which species is oxidised?"
    options:
      - "CO_2"
      - "C_6H_{12}O_6"
      - "H_2O"
      - "No species; it is not a redox reaction"
    answer: 2
    explanation: "Oxygen goes from −2 in water to 0 in O_2, so water is oxidised. Carbon goes from +4 in CO_2 to 0 in glucose, so CO_2 is reduced; the trap is to call CO_2 oxidised because it forms a sugar."

  - id: che-redox-008
    topic: electron-transfer
    subtopic: Definitions
    concept: Oxidation is loss of electrons
    category: factual
    format: direct
    difficulty: 1
    time: 15
    ncert: true
    battle: true
    tags: [electronic-concept, ncert-line]
    stem: "According to the electronic concept, oxidation is defined as"
    options:
      - "gain of electrons"
      - "gain of protons"
      - "loss of electrons"
      - "loss of neutrons"
    answer: 2
    explanation: "Oxidation is loss of electrons and reduction is gain of electrons (OIL RIG). Protons and neutrons are not transferred in ordinary chemical reactions."

  - id: che-redox-009
    topic: electron-transfer
    subtopic: Half reactions
    concept: Na is oxidised in formation of NaCl
    category: concept
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [half-reaction, ncert-line]
    stem: "In the reaction 2Na(s) + Cl_2(g) → 2NaCl(s), the half reaction representing oxidation is"
    options:
      - "Cl_2 + 2e^- → 2Cl^-"
      - "2Na → 2Na^+ + 2e^-"
      - "Na^+ + e^- → Na"
      - "2Cl^- → Cl_2 + 2e^-"
    answer: 1
    explanation: "Sodium loses one electron per atom to become Na^+, so 2Na → 2Na^+ + 2e^- is the oxidation half. Chlorine gaining electrons is the reduction half; the reverse processes do not occur here."

  - id: che-redox-010
    topic: electron-transfer
    subtopic: Oxidant and reductant
    concept: The electron acceptor is the oxidising agent
    category: concept
    format: direct
    difficulty: 2
    time: 25
    ncert: true
    battle: true
    tags: [oxidant, confused-pair]
    stem: "A species that accepts electrons in a reaction is called"
    options:
      - "a reducing agent, and it is itself oxidised"
      - "an oxidising agent, and it is itself oxidised"
      - "a reducing agent, and it is itself reduced"
      - "an oxidising agent, and it is itself reduced"
    answer: 3
    explanation: "An electron acceptor oxidises the other species and is itself reduced, so it is the oxidising agent (oxidant). Mixing up 'agent' with 'what happens to it' is the most common error here."

  - id: che-redox-011
    topic: electron-transfer
    subtopic: Identifying electron transfer
    concept: Ca + H2 gives CaH2 where Ca is oxidised
    category: application
    format: direct
    difficulty: 3
    time: 45
    ncert: false
    battle: true
    tags: [hydride, trap]
    stem: "In the formation of CaH_2 from Ca and H_2, the species that gets reduced is"
    options:
      - "Ca"
      - "H_2"
      - "both Ca and H_2"
      - "neither, as hydrogen is not added to oxygen"
    answer: 1
    explanation: "In CaH_2 hydrogen is present as H^- (oxidation number −1), so each H atom gains an electron from Ca: H_2 is reduced and Ca is oxidised to Ca^{2+}. Classical ideas (addition of hydrogen = reduction) mislead here, because Ca is not reduced."

  - id: che-redox-012
    topic: electron-transfer
    subtopic: Half reactions
    concept: Electrons lost equal electrons gained
    category: numerical
    format: direct
    difficulty: 2
    time: 35
    ncert: false
    battle: true
    tags: [electron-count]
    stem: "In 2Al + 3Cu^{2+} → 2Al^{3+} + 3Cu, the total number of electrons transferred is"
    options:
      - "2"
      - "3"
      - "5"
      - "6"
    answer: 3
    explanation: "Each Al loses 3 electrons, so 2Al lose 6; each Cu^{2+} gains 2, so 3Cu^{2+} gain 6. Electrons lost equal electrons gained, 6 in all."

  - id: che-redox-013
    topic: electron-transfer
    subtopic: Definitions
    concept: Reduction as gain of electrons, statement check
    category: concept
    format: statements
    difficulty: 2
    time: 40
    ncert: true
    battle: false
    tags: [electronic-concept]
    stem: "Which of the following statements is correct?"
    options:
      - "A reducing agent gains electrons during a reaction"
      - "Reduction is an increase in oxidation number"
      - "An oxidising agent undergoes a decrease in oxidation number"
      - "Oxidation can occur without any simultaneous reduction"
    answer: 2
    explanation: "An oxidising agent gains electrons, so its oxidation number decreases. A reducing agent loses electrons, reduction lowers the oxidation number, and oxidation never happens alone."

  - id: che-redox-014
    topic: electron-transfer
    subtopic: Ionic reactions
    concept: Fe3+ to Fe2+ is reduction by one electron
    category: concept
    format: direct
    difficulty: 1
    time: 20
    ncert: false
    battle: true
    tags: [half-reaction]
    stem: "The change Fe^{3+} + e^- → Fe^{2+} represents"
    options:
      - "oxidation of iron"
      - "reduction of iron"
      - "disproportionation of iron"
      - "a change that is not redox"
    answer: 1
    explanation: "Fe^{3+} gains one electron and its oxidation number falls from +3 to +2, which is reduction. A single half-reaction cannot be a disproportionation."

  - id: che-redox-015
    topic: electron-transfer
    subtopic: Electron transfer in ionic compounds
    concept: Formation of MgO involves transfer of two electrons per Mg
    category: concept
    format: statement-pair
    difficulty: 2
    time: 40
    ncert: true
    battle: false
    tags: [ncert-line]
    stem: |-
      Statement I: In the formation of MgO from Mg and O_2, each Mg atom loses two electrons.
      Statement II: In the same reaction, O_2 acts as the reducing agent.
    options:
      - "Both Statement I and Statement II are correct"
      - "Both Statement I and Statement II are incorrect"
      - "Statement I is correct but Statement II is incorrect"
      - "Statement I is incorrect but Statement II is correct"
    answer: 2
    explanation: "Mg → Mg^{2+} + 2e^-, so Statement I is correct. O_2 accepts these electrons to form O^{2-}, so it is the oxidising agent, not the reducing agent."

  - id: che-redox-016
    topic: competitive-electron-transfer
    subtopic: Zinc in copper sulphate
    concept: Zn displaces Cu from CuSO4 solution
    category: factual
    format: case
    difficulty: 1
    time: 30
    ncert: true
    battle: true
    tags: [ncert-line, zinc-copper]
    stem: "A zinc rod is dipped in blue copper sulphate solution for an hour. What is observed?"
    options:
      - "Zinc gets coated with reddish copper and the blue colour fades"
      - "Copper dissolves and the solution turns deep blue"
      - "Hydrogen gas bubbles form on the rod"
      - "No change occurs"
    answer: 0
    explanation: "Zn gives electrons to Cu^{2+}: Zn + Cu^{2+} → Zn^{2+} + Cu. Metallic copper deposits on the rod and the blue colour due to Cu^{2+} fades as it is consumed."

  - id: che-redox-017
    topic: competitive-electron-transfer
    subtopic: Copper and zinc ions
    concept: Cu does not reduce Zn2+
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [ncert-line, zinc-copper]
    stem: "A copper rod is placed in zinc sulphate solution. Which is correct?"
    options:
      - "Zinc is deposited on copper"
      - "The solution turns blue quickly"
      - "Oxygen is evolved"
      - "No appreciable reaction occurs"
    answer: 3
    explanation: "Zinc releases electrons more readily than copper, so Cu cannot reduce Zn^{2+}. The NCERT experiment shows no Cu^{2+} forms (no blackening with H_2S), so there is no reaction."

  - id: che-redox-018
    topic: competitive-electron-transfer
    subtopic: Copper and silver nitrate
    concept: Cu displaces Ag from AgNO3 solution
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [ncert-line]
    stem: "When a copper strip is kept in silver nitrate solution, the solution gradually becomes blue because"
    options:
      - "Ag^+ is oxidised to Ag^{2+}"
      - "Cu is oxidised to Cu^{2+} while Ag^+ is reduced to Ag"
      - "NO_3^- is reduced to NO_2"
      - "copper forms a blue complex with silver"
    answer: 1
    explanation: "Cu + 2Ag^+ → Cu^{2+} + 2Ag. The blue colour is due to hydrated Cu^{2+}, and silver metal deposits on the strip."

  - id: che-redox-019
    topic: competitive-electron-transfer
    subtopic: Activity order
    concept: Order of electron-releasing tendency Zn > Cu > Ag
    category: application
    format: ordering
    difficulty: 2
    time: 40
    ncert: true
    battle: true
    tags: [activity-series, ncert-line]
    stem: "Zn reduces Cu^{2+}, and Cu reduces Ag^+. The decreasing order of tendency to release electrons is"
    options:
      - "Ag > Cu > Zn"
      - "Cu > Zn > Ag"
      - "Zn > Cu > Ag"
      - "Zn > Ag > Cu"
    answer: 2
    explanation: "A metal that reduces another's ions releases electrons more readily. Zn beats Cu, and Cu beats Ag, so the order is Zn > Cu > Ag."

  - id: che-redox-020
    topic: competitive-electron-transfer
    subtopic: Predicting displacement
    concept: Metal higher in activity series displaces lower one
    category: application
    format: direct
    difficulty: 3
    time: 45
    ncert: false
    battle: true
    tags: [activity-series]
    stem: "Given E° values Mg^{2+}/Mg −2.37 V, Fe^{2+}/Fe −0.44 V, Cu^{2+}/Cu +0.34 V, which reaction will NOT occur spontaneously?"
    options:
      - "Mg + Fe^{2+} → Mg^{2+} + Fe"
      - "Fe + Cu^{2+} → Fe^{2+} + Cu"
      - "Mg + Cu^{2+} → Mg^{2+} + Cu"
      - "Cu + Fe^{2+} → Cu^{2+} + Fe"
    answer: 3
    explanation: "The metal with the more negative E° is the stronger reducing agent and displaces the other. Cu (+0.34 V) cannot reduce Fe^{2+} (−0.44 V), so that reaction does not occur; the other three do."

  - id: che-redox-021
    topic: competitive-electron-transfer
    subtopic: Storage of solutions
    concept: CuSO4 solution cannot be stored in a zinc vessel
    category: application
    format: case
    difficulty: 3
    time: 50
    ncert: false
    battle: false
    tags: [application, activity-series]
    stem: "Copper sulphate solution is to be stored. Which container is suitable? (E°: Zn −0.76 V, Fe −0.44 V, Ag +0.80 V, Al −1.66 V)"
    options:
      - "Zinc vessel"
      - "Iron vessel"
      - "Silver vessel"
      - "Aluminium vessel"
    answer: 2
    explanation: "Cu^{2+}/Cu has E° = +0.34 V. Zn, Fe and Al all have lower E° and would reduce Cu^{2+}, getting corroded. Silver (+0.80 V) cannot reduce Cu^{2+}, so a silver vessel is safe."

  - id: che-redox-022
    topic: competitive-electron-transfer
    subtopic: Test for Cu2+ ions
    concept: H2S gives black CuS with Cu2+
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [ncert-line, test]
    stem: "In the NCERT experiment, the presence of Cu^{2+} ions in solution is detected by passing H_2S, which gives"
    options:
      - "a white precipitate of ZnS"
      - "a yellow precipitate of S"
      - "a black precipitate of CuS"
      - "a blue precipitate of Cu(OH)_2"
    answer: 2
    explanation: "Cu^{2+} forms black CuS with H_2S; this sensitive test shows whether any copper has gone into solution. White ZnS is the test for Zn^{2+}."

  - id: che-redox-023
    topic: competitive-electron-transfer
    subtopic: Nickel and copper
    concept: Ni reduces Cu2+ ions
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: false
    battle: true
    tags: [activity-series]
    stem: "Nickel metal is placed in CuSO_4 solution (E°: Ni^{2+}/Ni −0.25 V, Cu^{2+}/Cu +0.34 V). The ion formed in solution is"
    options:
      - "Ni^{2+}"
      - "Cu^+"
      - "SO_3^{2-}"
      - "No new ion forms"
    answer: 0
    explanation: "Ni has the lower reduction potential, so it is the better reducing agent: Ni + Cu^{2+} → Ni^{2+} + Cu. Green Ni^{2+} ions enter the solution."

  - id: che-redox-024
    topic: oxidation-number
    subtopic: Basic rules
    concept: Oxidation number of an element in free state is zero
    category: factual
    format: direct
    difficulty: 1
    time: 15
    ncert: true
    battle: true
    tags: [rules, ncert-line]
    stem: "The oxidation number of sulphur in S_8 is"
    options:
      - "−2"
      - "0"
      - "+2"
      - "+8"
    answer: 1
    explanation: "Every atom in an element in its uncombined state has oxidation number zero, whatever the molecule's size (S_8, P_4, O_3 and so on)."

  - id: che-redox-025
    topic: oxidation-number
    subtopic: Oxoanions
    concept: Mn in KMnO4 is +7
    category: numerical
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [manganese]
    stem: "The oxidation number of Mn in KMnO_4 is"
    options:
      - "+2"
      - "+4"
      - "+6"
      - "+7"
    answer: 3
    explanation: "+1 + x + 4(−2) = 0 gives x = +7. The +6 answer belongs to K_2MnO_4 (manganate)."

  - id: che-redox-026
    topic: oxidation-number
    subtopic: Peroxy linkages
    concept: S in H2SO5 is +6 due to one peroxide linkage
    category: application
    format: direct
    difficulty: 4
    time: 90
    ncert: false
    battle: false
    tags: [peroxide, trap, structure-based]
    stem: "Peroxomonosulphuric acid (Caro's acid), H_2SO_5, contains one O–O linkage. The oxidation number of sulphur in it is"
    options:
      - "+8"
      - "+7"
      - "+6"
      - "+5"
    answer: 2
    explanation: "Two peroxide oxygens are −1 each and three others −2 each: 2(+1) + x + 3(−2) + 2(−1) = 0 gives x = +6. Treating all five O as −2 gives the impossible +8, since sulphur cannot exceed +6."

  - id: che-redox-027
    topic: oxidation-number
    subtopic: Fractional oxidation number
    concept: Average oxidation number of Fe in Fe3O4 is 8/3
    category: numerical
    format: direct
    difficulty: 3
    time: 45
    ncert: true
    battle: true
    tags: [fractional, ncert-line]
    stem: "The average oxidation number of iron in Fe_3O_4 is"
    options:
      - "+2"
      - "+3"
      - "+8/3"
      - "+4/3"
    answer: 2
    explanation: "3x + 4(−2) = 0 gives x = +8/3. Fe_3O_4 actually contains Fe^{2+} and Fe^{3+} in 1 : 2 ratio (FeO·Fe_2O_3), and the fraction is only an average."

  - id: che-redox-028
    topic: oxidation-number
    subtopic: Superoxides
    concept: Oxygen in KO2 has oxidation number −1/2
    category: numerical
    format: direct
    difficulty: 3
    time: 35
    ncert: true
    battle: true
    tags: [superoxide, ncert-line]
    stem: "The oxidation number of oxygen in potassium superoxide, KO_2, is"
    options:
      - "−2"
      - "−1"
      - "−1/2"
      - "+1/2"
    answer: 2
    explanation: "K is +1, so 2x = −1 and x = −1/2. The superoxide ion is O_2^-; −1 is the value for peroxides such as Na_2O_2."

  - id: che-redox-029
    topic: oxidation-number
    subtopic: Oxygen with fluorine
    concept: O is +2 in OF2
    category: numerical
    format: direct
    difficulty: 2
    time: 25
    ncert: true
    battle: true
    tags: [exception, ncert-line, trap]
    stem: "The oxidation number of oxygen in OF_2 is"
    options:
      - "−2"
      - "+1"
      - "+2"
      - "−1"
    answer: 2
    explanation: "Fluorine, the most electronegative element, is always −1. So x + 2(−1) = 0 gives x = +2; oxygen has a positive oxidation number only when bonded to fluorine."

  - id: che-redox-030
    topic: oxidation-number
    subtopic: Metal hydrides
    concept: H is −1 in metal hydrides
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [hydride, ncert-line]
    stem: "In which compound does hydrogen have oxidation number −1?"
    options:
      - "HCl"
      - "NaH"
      - "H_2O"
      - "NH_3"
    answer: 1
    explanation: "In binary hydrides of active metals like NaH, LiH and CaH_2, hydrogen is bonded to a less electronegative metal and has −1. In HCl, H_2O and NH_3 it is +1."

  - id: che-redox-031
    topic: oxidation-number
    subtopic: Chromium compounds
    concept: Cr in K2Cr2O7 is +6
    category: numerical
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [chromium]
    stem: "The oxidation number of chromium in K_2Cr_2O_7 is"
    options:
      - "+3"
      - "+6"
      - "+7"
      - "+12"
    answer: 1
    explanation: "2(+1) + 2x + 7(−2) = 0 gives 2x = 12, x = +6. The value +12 is the total for both Cr atoms, not per atom."

  - id: che-redox-032
    topic: oxidation-number
    subtopic: Structure-based oxidation number
    concept: CrO5 has Cr in +6 state due to two peroxide groups
    category: application
    format: direct
    difficulty: 4
    time: 90
    ncert: false
    battle: false
    tags: [peroxide, structure-based, trap]
    stem: "Chromium peroxide, CrO_5, has one oxygen doubly bonded to Cr and two peroxo (O–O) groups. The oxidation number of Cr is"
    options:
      - "+10"
      - "+6"
      - "+5"
      - "+4"
    answer: 1
    explanation: "Four peroxo oxygens are −1 each and one oxo oxygen is −2: x − 4 − 2 = 0 gives x = +6. Using −2 for all oxygens gives +10, which exceeds chromium's maximum of +6."

  - id: che-redox-033
    topic: oxidation-number
    subtopic: Tetrathionate
    concept: Average ON of S in S4O6^2- is +2.5
    category: numerical
    format: direct
    difficulty: 3
    time: 45
    ncert: true
    battle: true
    tags: [fractional, ncert-line]
    stem: "The average oxidation number of sulphur in the tetrathionate ion, S_4O_6^{2-}, is"
    options:
      - "+2"
      - "+2.5"
      - "+3"
      - "+5"
    answer: 1
    explanation: "4x + 6(−2) = −2 gives 4x = 10, x = +2.5. Structurally the two central S atoms are 0 and the two terminal ones +5, which average to +2.5."

  - id: che-redox-034
    topic: oxidation-number
    subtopic: Organic carbon
