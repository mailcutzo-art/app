      - Iron
      - Chromium
      - Manganese
      - Vanadium
    answer: 2
    explanation: Manganese (3d^5 4s^2) shows all states from +2 to +7 because it can use all seven 4s and 3d electrons. Elements near the middle of a series show the greatest variety of oxidation states.
  - id: che-dfb-025
    topic: oxidation-states
    subtopic: Elements with a single oxidation state
    concept: Scandium shows only the +3 oxidation state
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [oxidation-state, scandium]
    stem: Which transition element of the first series does NOT exhibit variable oxidation states?
    options:
      - Titanium
      - Copper
      - Vanadium
      - Scandium
    answer: 3
    explanation: Scandium shows only the +3 state, since Sc^{3+} has the stable argon core and Sc(II) is virtually unknown. Titanium shows +2 to +4, vanadium +2 to +5 and copper +1 and +2.
  - id: che-dfb-026
    topic: oxidation-states
    subtopic: Peroxo compound of chromium
    concept: Cr is +6 in CrO_5, which has two peroxide groups
    category: numerical
    format: direct
    difficulty: 4
    time: 90
    ncert: false
    battle: false
    tags: [oxidation-state, peroxide, trap]
    stem: In acidic medium, H_2O_2 converts Cr_2O_7^{2−} into blue CrO_5, which contains two peroxide (–O–O–) linkages. The oxidation state of chromium in CrO_5 is
    options:
      - "+10"
      - "+5"
      - "+8"
      - "+6"
    answer: 3
    explanation: CrO_5 has one oxide oxygen (−2) and four peroxide oxygens (−1 each), so x − 2 − 4 = 0 and x = +6. Treating all five oxygens as −2 gives the impossible value +10.
  - id: che-dfb-027
    topic: oxidation-states
    subtopic: Variability of oxidation states
    concept: Transition element oxidation states differ by one unit, p-block states by two
    category: concept
    format: statements
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [oxidation-state, comparison, ncert-line]
    stem: Which statement correctly compares the variable oxidation states of transition elements with those of p-block elements?
    options:
      - Transition elements show only even oxidation states, unlike p-block elements
      - Oxidation states of transition elements usually differ by one unit, whereas those of p-block elements usually differ by two
      - In both blocks, lower oxidation states become more stable down a group
      - Transition elements generally show fewer oxidation states than p-block elements
    answer: 1
    explanation: Because d electrons can be lost one at a time, transition metals show series such as V^{II}, V^{III}, V^{IV} and V^{V}, differing by unity, while p-block states usually differ by two (e.g., Tl^+ and Tl^{3+}). In the d-block, heavier members favour higher states, the reverse of the inert pair effect.
  - id: che-dfb-028
    topic: oxidation-states
    subtopic: Stability of higher states down a group
    concept: Higher oxidation states are more stable for heavier d-block members
    category: concept
    format: assertion-reason
    difficulty: 3
    time: 60
    ncert: true
    battle: false
    tags: [oxidation-state, group-trend, ncert-line]
    stem: |-
      Assertion (A): Acidified dichromate (Cr^{VI}) is a strong oxidising agent, whereas MoO_3 and WO_3 are not.
      Reason (R): In the d-block, higher oxidation states become more stable on moving down a group.
    options:
      - A is false but R is true
      - Both A and R are true and R is the correct explanation of A
      - A is true but R is false
      - Both A and R are true but R is not the correct explanation of A
    answer: 1
    explanation: Unlike the p-block, where the inert pair effect favours lower states, heavier d-block members favour higher states, so Mo(VI) and W(VI) are more stable than Cr(VI). The less stable Cr(VI) is readily reduced, which makes dichromate a strong oxidant. R explains A.
  - id: che-dfb-029
    topic: oxidation-states
    subtopic: Oxides versus fluorides
    concept: Oxygen stabilises higher states better than fluorine through multiple bonding
    category: concept
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [oxidation-state, oxides, fluorides, ncert-line]
    stem: Manganese reaches +7 in Mn_2O_7, but its highest fluoride is only MnF_4. Oxygen stabilises higher oxidation states better than fluorine because oxygen
    options:
      - is more electronegative than fluorine
      - is larger than fluorine and so fits more easily around the metal
      - forms only ionic bonds with metals
      - can form multiple bonds with the metal
    answer: 3
    explanation: NCERT attributes the superiority of oxygen to its ability to form multiple bonds to metals, so fewer oxygen atoms can satisfy a high oxidation state. Fluorine is actually more electronegative but forms only single bonds.
  - id: che-dfb-030
    topic: oxidation-states
