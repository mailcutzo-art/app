questions:
  - id: che-dfb-001
    topic: position-configuration
    subtopic: General electronic configuration
    concept: Outer configuration of d-block elements is (n−1)d^{1–10}ns^{1–2}
    category: factual
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    tags: [electronic-configuration, ncert-line]
    stem: The general outer electronic configuration of the d-block elements is
    options:
      - ns^2 np^{1–6}
      - (n−2)f^{1–14} (n−1)d^{0–1} ns^2
      - (n−1)d^{1–10} ns^{1–2}
      - (n−1)d^{10} ns^2 np^{1–6}
    answer: 2
    explanation: NCERT gives (n−1)d^{1–10}ns^{1–2} for the d-block, with palladium (4d^{10}5s^0) as the notable exception. The (n−2)f^{1–14}(n−1)d^{0–1}ns^2 pattern describes the f-block.
  - id: che-dfb-002
    topic: position-configuration
    subtopic: Anomalous configurations
    concept: Chromium is 3d^5 4s^1 due to half-filled stability
    category: factual
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    tags: [electronic-configuration, exception]
    stem: Which is the correct ground-state electronic configuration of the chromium atom (Z = 24)?
    options:
      - "[Ar] 3d^4 4s^2"
      - "[Ar] 3d^6"
      - "[Ar] 3d^5 4s^1"
      - "[Ar] 3d^3 4s^2 4p^1"
    answer: 2
    explanation: Cr adopts 3d^5 4s^1 instead of 3d^4 4s^2 because 3d and 4s are close in energy and a half-filled 3d subshell has extra exchange stability. Writing 3d^4 4s^2 simply follows the aufbau order and misses this exception.
  - id: che-dfb-003
    topic: position-configuration
    subtopic: Definition of transition elements
    concept: Zn has d^{10} in atom and ion, so it is not a transition element
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [definition, zn-cd-hg]
    stem: Which of the following d-block elements is NOT regarded as a transition element?
    options:
      - Copper
      - Scandium
      - Zinc
      - Silver
    answer: 2
    explanation: Zinc has a completely filled 3d^{10} subshell both in the atom and in its only common ion Zn^{2+}, so it does not fit the definition of a transition element. Scandium has 3d^1, while Cu and Ag qualify through Cu^{2+} (3d^9) and Ag^{2+} (4d^9).
  - id: che-dfb-004
    topic: position-configuration
    subtopic: Definition of transition elements
    concept: Silver is a transition element because Ag^{2+} is 4d^9
    category: application
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [definition, ncert-intext]
    stem: Silver has a completely filled 4d^{10} subshell in its ground state, yet it is classed as a transition element because
    options:
      - it forms coloured Ag^+ salts in water
      - its 5s electron is poorly shielded by the 4d electrons
      - it has a very high enthalpy of atomisation
      - in the +2 oxidation state it has an incompletely filled 4d^9 subshell
    answer: 3
    explanation: A transition element has an incompletely filled d subshell in the atom or in any of its oxidation states. Ag^{2+} is 4d^9, so silver qualifies. Ag^+ is 4d^{10}, and its simple salts such as AgNO_3 are colourless.
  - id: che-dfb-005
    topic: position-configuration
    subtopic: Anomalous configurations
    concept: Palladium is 4d^{10} 5s^0
    category: factual
    format: direct
    difficulty: 3
    time: 45
    ncert: true
    battle: true
    tags: [electronic-configuration, exception, trap]
    stem: Which transition element has no electron in its outermost s orbital in the ground state?
    options:
      - Platinum
      - Nickel
      - Silver
      - Palladium
    answer: 3
    explanation: Palladium is [Kr]4d^{10}5s^0, the exception to the general (n−1)d^{1–10}ns^{1–2} pattern. Nickel is 3d^8 4s^2, platinum 5d^9 6s^1 and silver 4d^{10} 5s^1.
  - id: che-dfb-006
    topic: position-configuration
    subtopic: Transition series
    concept: The 5d series is La and Hf to Hg
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [transition-series, ncert-line]
    stem: The 5d transition series comprises
    options:
      - Y and Zr to Cd
      - La and Hf to Hg
      - Ce to Lu
      - Ac and Rf to Cn
    answer: 1
    explanation: NCERT lists four series, 3d (Sc–Zn), 4d (Y–Cd), 5d (La and Hf–Hg) and 6d (Ac and Rf–Cn). Ce to Lu are the 4f lanthanoids that intervene between La and Hf.
  - id: che-dfb-007
    topic: position-configuration
    subtopic: Configuration of ions
    concept: Cu^{2+} is [Ar]3d^9 because the 4s electron is lost first
    category: application
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [electronic-configuration, ions]
    stem: The electronic configuration of Cu^{2+} (Z = 29) is
    options:
      - "[Ar] 3d^9"
      - "[Ar] 3d^8 4s^1"
      - "[Ar] 3d^7 4s^2"
      - "[Ar] 3d^{10}"
    answer: 0
    explanation: Copper is [Ar]3d^{10}4s^1. On ionisation the 4s electron is removed first and then one 3d electron, giving 3d^9 for Cu^{2+}. The 3d^{10} configuration belongs to Cu^+.
  - id: che-dfb-008
    topic: position-configuration
    subtopic: Inner transition elements
    concept: Identifying f-block elements from atomic numbers
    category: application
    format: multi-statement
    difficulty: 3
    time: 60
    ncert: true
    battle: false
    tags: [f-block, atomic-number, ncert-exercise]
    stem: |-
      Which of the following atomic numbers belong to inner transition elements?
      I. 29
      II. 59
      III. 74
      IV. 95
    options:
      - I and III only
      - II and IV only
      - II, III and IV only
      - I, II and IV only
    answer: 1
    explanation: Z = 59 (praseodymium) lies in the lanthanoids (58–71) and Z = 95 (americium) in the actinoids (90–103). Z = 29 is copper and Z = 74 is tungsten, both d-block elements.
  - id: che-dfb-009
    topic: position-configuration
    subtopic: Why transition elements
    concept: The name transition comes from the position between the s- and p-blocks
    category: concept
    format: assertion-reason
    difficulty: 4
    time: 90
    ncert: true
    battle: false
    tags: [definition, ncert-line, trap]
    stem: |-
      Assertion (A): The d-block elements are called transition elements.
      Reason (R): In the d-block elements the differentiating electron enters the (n−1)d subshell.
    options:
      - A is true but R is false
      - Both A and R are true and R is the correct explanation of A
      - A is false but R is true
      - Both A and R are true but R is not the correct explanation of A
    answer: 3
    explanation: NCERT states that the name 'transition' is given only because of their position between the s- and p-block elements. R is true, since the last electron enters (n−1)d, but it defines the d-block rather than explaining the name.
  - id: che-dfb-010
    topic: physical-properties-radii
    subtopic: Enthalpy of atomisation
    concept: Zinc has the lowest enthalpy of atomisation in the 3d series
    category: concept
    format: direct
    difficulty: 3
    time: 45
    ncert: true
    battle: true
    tags: [enthalpy-of-atomisation, ncert-intext]
    stem: In the series Sc to Zn, zinc has the lowest enthalpy of atomisation (126 kJ mol^{-1}) because
    options:
      - it has the smallest atomic radius in the series
      - it has no unpaired d electrons available for metallic bonding
      - its 4s electrons are lost very easily
      - it has the largest nuclear charge in the series
    answer: 1
    explanation: The strength of metallic bonding, and hence the enthalpy of atomisation, increases with the number of unpaired d electrons. Zn (3d^{10}4s^2) has none, so its interatomic bonding is the weakest in the series.
  - id: che-dfb-011
    topic: physical-properties-radii
    subtopic: Radii of 4d and 5d elements
    concept: Zr and Hf have nearly identical radii due to the lanthanoid contraction
    category: factual
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    tags: [lanthanoid-contraction, atomic-radius]
    stem: Zirconium (160 pm) and hafnium (159 pm) have almost identical atomic radii. This is a consequence of
    options:
      - the lanthanoid contraction
      - the inert pair effect
      - the actinoid contraction
      - the diagonal relationship
    answer: 0
    explanation: Filling of the 4f orbitals before the 5d series produces the lanthanoid contraction, which cancels the expected increase in size from the 4d to the 5d series. Hence Zr and Hf have nearly equal radii and very similar chemistry.
  - id: che-dfb-012
    topic: physical-properties-radii
    subtopic: Melting points
    concept: Mn shows an anomalously low melting point in the 3d series
    category: concept
    format: graph
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [melting-point, graph, anomaly]
    stem: A plot of melting point against atomic number for the 3d series rises to a maximum around the d^5 configuration and then falls, but one element in the middle shows an anomalously low value. That element is
    options:
      - chromium
      - manganese
      - iron
      - vanadium
    answer: 1
    explanation: NCERT notes that melting points rise to a maximum at about d^5 and then fall regularly, except for the anomalous values of Mn and Tc. Manganese (about 1519 K) melts far lower than its neighbours Cr and Fe.
  - id: che-dfb-013
    topic: physical-properties-radii
    subtopic: Density
    concept: Density increases across the 3d series from Sc to Cu
    category: concept
    format: ordering
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [density, trend]
    stem: The correct increasing order of density of Sc, Ti, Cr and Cu is
    options:
      - Sc < Ti < Cr < Cu
      - Cu < Cr < Ti < Sc
      - Ti < Sc < Cr < Cu
      - Sc < Cr < Ti < Cu
    answer: 0
    explanation: Across the series atomic mass rises while metallic radius falls, so density increases, Sc (3.43) < Ti (4.1) < Cr (7.19) < Cu (8.9 g cm^{-3}). The largest and lightest atom, Sc, is the least dense.
  - id: che-dfb-014
    topic: physical-properties-radii
    subtopic: Melting points
    concept: High melting points due to (n−1)d and ns electrons in metallic bonding
    category: concept
    format: statements
    difficulty: 3
    time: 45
    ncert: true
    battle: false
    tags: [melting-point, metallic-bonding, ncert-line]
    stem: Which statement about the melting points of transition metals is correct?
    options:
      - They are low because only ns electrons take part in metallic bonding
      - They increase steadily from Sc to Zn
      - They are high because (n−1)d as well as ns electrons take part in metallic bonding
      - Zinc has the highest melting point in the 3d series
    answer: 2
    explanation: NCERT attributes the high melting points to the involvement of a greater number of (n−1)d electrons, in addition to ns electrons, in metallic bonding. Melting points peak near the middle of each series, and zinc melts lowest in the 3d series.
  - id: che-dfb-015
    topic: physical-properties-radii
    subtopic: Atomic radii across a series
    concept: Metallic radii decrease from Sc to Cr
    category: concept
    format: ordering
    difficulty: 3
    time: 45
    ncert: true
    battle: true
    tags: [atomic-radius, trend]
    stem: The correct order of metallic radii of Sc, Ti, V and Cr is
    options:
      - Cr > V > Ti > Sc
      - Ti > Sc > V > Cr
      - Sc > Ti > V > Cr
      - Sc > V > Ti > Cr
    answer: 2
    explanation: Each added electron enters the poorly shielding 3d subshell while the nuclear charge rises by one, so the radius falls, Sc (164) > Ti (147) > V (135) > Cr (129 pm). The decrease becomes small later in the series.
  - id: che-dfb-016
    topic: physical-properties-radii
    subtopic: Enthalpy of atomisation of heavier series
    concept: 4d and 5d metals have higher enthalpies of atomisation than 3d metals
    category: concept
    format: statements
    difficulty: 4
    time: 90
    ncert: true
    battle: false
    tags: [enthalpy-of-atomisation, ncert-line, trap]
    stem: Which statement about the physical properties of the d-block metals is correct?
    options:
      - Zinc, cadmium and mercury are the hardest and least volatile d-block metals
      - Transition metals generally have low tensile strength and are brittle
      - Manganese has the highest melting point in the 3d series
      - Metals of the second and third transition series have greater enthalpies of atomisation than the corresponding first-series metals
    answer: 3
    explanation: NCERT notes that 4d and 5d metals have higher enthalpies of atomisation than 3d metals, which is why metal–metal bonding is more frequent in compounds of the heavy transition metals. Zn, Cd and Hg are soft and volatile, transition metals have high tensile strength, and Mn is anomalously low-melting.
  - id: che-dfb-017
    topic: physical-properties-radii
    subtopic: Enthalpy of atomisation
    concept: Order of enthalpy of atomisation V > Cr > Mn > Zn
    category: application
    format: ordering
    difficulty: 4
    time: 90
    ncert: true
    battle: false
    tags: [enthalpy-of-atomisation, ncert-data]
    stem: The correct decreasing order of enthalpy of atomisation of Cr, Mn, V and Zn is
    options:
      - Cr > V > Mn > Zn
      - V > Mn > Cr > Zn
      - Zn > Mn > Cr > V
      - V > Cr > Mn > Zn
    answer: 3
    explanation: NCERT values are V 515, Cr 397, Mn 281 and Zn 126 kJ mol^{-1}. Mn is anomalously low because its stable 3d^5 electrons take less part in metallic bonding, and Zn, with no unpaired d electrons, is lowest.
  - id: che-dfb-018
    topic: ionisation-enthalpy
    subtopic: Second ionisation enthalpy
    concept: Copper has the highest second ionisation enthalpy because Cu^+ is d^{10}
    category: concept
    format: direct
    difficulty: 3
    time: 45
    ncert: true
    battle: true
    tags: [ionisation-enthalpy, stable-configuration]
    stem: Which of the following 3d metals has the highest second ionisation enthalpy?
    options:
      - Nickel
      - Zinc
      - Copper
      - Manganese
    answer: 2
    explanation: The second electron of copper must come from Cu^+ (3d^{10}), breaking a completely filled subshell, so Δ_iH_2 of Cu (1958 kJ mol^{-1}) is the highest. Zn^+ (3d^{10}4s^1) loses its 4s electron more easily (1734 kJ mol^{-1}).
  - id: che-dfb-019
    topic: ionisation-enthalpy
    subtopic: Second ionisation enthalpy
    concept: Order of second ionisation enthalpy Cr > Mn > V > Ti
    category: application
    format: ordering
    difficulty: 4
    time: 90
    ncert: true
    battle: false
    tags: [ionisation-enthalpy, ordering, trap]
    stem: The correct decreasing order of second ionisation enthalpy of Ti, V, Cr and Mn is
    options:
      - Mn > Cr > V > Ti
      - Ti > V > Cr > Mn
      - Cr > V > Mn > Ti
      - Cr > Mn > V > Ti
    answer: 3
    explanation: Cr^+ is 3d^5, so its next electron comes from a stable half-filled set, making Δ_iH_2 highest for Cr (1592). Mn^+ (3d^5 4s^1) loses a 4s electron (1509), followed by V (1414) and Ti (1309 kJ mol^{-1}).
  - id: che-dfb-020
    topic: ionisation-enthalpy
    subtopic: Third ionisation enthalpy
    concept: Third ionisation enthalpy peaks at Mn and drops at Fe
    category: concept
    format: graph
    difficulty: 4
    time: 90
    ncert: true
    battle: false
    tags: [ionisation-enthalpy, graph, half-filled]
    stem: A plot of third ionisation enthalpy against atomic number for Sc to Zn rises overall, but shows a distinct peak at one element followed by a drop at the next element. The peak and the drop occur, respectively, at
    options:
      - Mn and Fe
      - Cr and Mn
      - Fe and Co
      - Cu and Zn
    answer: 0
    explanation: Mn^{2+} is 3d^5, so removing a third electron breaks a half-filled set (Δ_iH_3 = 3260 kJ mol^{-1}). Fe^{2+} (3d^6) loses one electron to reach the stable 3d^5 state, so Δ_iH_3 of Fe drops to 2962 kJ mol^{-1}.
  - id: che-dfb-021
    topic: ionisation-enthalpy
    subtopic: Third ionisation enthalpy
    concept: High third ionisation enthalpies of Ni, Cu and Zn limit them to +2
    category: concept
    format: statement-pair
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [ionisation-enthalpy, oxidation-state, ncert-line]
    stem: |-
      Statement I: The high third ionisation enthalpies of nickel, copper and zinc explain why oxidation states above +2 are difficult to obtain for these metals.
      Statement II: When 3d metals form M^{2+} ions, the 4s electrons are lost before the 3d electrons.
    options:
      - Statement I is correct but Statement II is incorrect
      - Both Statement I and Statement II are incorrect
      - Both Statement I and Statement II are correct
      - Statement I is incorrect but Statement II is correct
    answer: 2
    explanation: NCERT links the high Δ_iH_3 values of Ni, Cu and Zn (3402, 3556 and 3837 kJ mol^{-1}) to the difficulty of exceeding +2. Statement II is also correct, since ns electrons are removed before (n−1)d electrons when transition metal ions form.
  - id: che-dfb-022
    topic: ionisation-enthalpy
    subtopic: First ionisation enthalpy
    concept: Zinc has the highest first ionisation enthalpy in the 3d series
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [ionisation-enthalpy, zn-cd-hg]
    stem: Among the 3d series elements, the highest first ionisation enthalpy is shown by
    options:
      - copper
      - nickel
      - zinc
      - iron
    answer: 2
    explanation: Zinc (906 kJ mol^{-1}) must lose an electron from a filled 4s^2 pair lying over a filled 3d^{10} subshell, so its Δ_iH_1 is well above that of Fe (762), Cu (745) and Ni (736).
  - id: che-dfb-023
    topic: ionisation-enthalpy
    subtopic: Ionisation enthalpies of 5d elements
    concept: 5d elements have higher ionisation enthalpies due to poor shielding by 4f electrons
    category: concept
    format: statement-pair
    difficulty: 4
    time: 90
    ncert: false
    battle: false
    tags: [ionisation-enthalpy, lanthanoid-contraction, multi-concept]
    stem: |-
      Statement I: The first ionisation enthalpies of the 5d elements are generally higher than those of the corresponding 4d elements.
      Statement II: The 4f electrons shield the outer electrons very effectively from the nuclear charge.
    options:
      - Both Statement I and Statement II are correct
      - Statement I is incorrect but Statement II is correct
      - Both Statement I and Statement II are incorrect
      - Statement I is correct but Statement II is incorrect
    answer: 3
    explanation: After the fourteen lanthanoids the nuclear charge has risen a lot, but 4f electrons shield poorly, so 5d atoms are about as small as 4d atoms and hold their outer electrons more tightly. Statement I is correct; Statement II is wrong because 4f shielding is poor.
  - id: che-dfb-024
    topic: oxidation-states
    subtopic: Number of oxidation states
    concept: Manganese shows the largest number of oxidation states in the 3d series
    category: factual
    format: direct
    difficulty: 1
