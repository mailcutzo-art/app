questions:
  - id: che-amine-001
    topic: structure-classification
    subtopic: Hybridisation of nitrogen
    concept: Nitrogen in aliphatic amines is sp^3 hybridised with one lone pair
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [structure, hybridisation, ncert-line]
    stem: The hybridisation of the nitrogen atom in trimethylamine is
    options:
      - dsp^2
      - sp
      - sp^3
      - sp^2
    answer: 2
    explanation: Nitrogen in amines uses three sp^3 orbitals for σ bonds to carbon or hydrogen, and the fourth sp^3 orbital holds the lone pair, so the molecule is pyramidal. sp^2 nitrogen would make the molecule planar, which trimethylamine is not.
  - id: che-amine-002
    topic: structure-classification
    subtopic: Shape and bond angle
    concept: C–N–C angle in trimethylamine is 108°, less than tetrahedral
    category: factual
    format: direct
    difficulty: 2
    time: 25
    ncert: true
    battle: true
    tags: [structure, bond-angle, ncert-line]
    stem: The C–N–C bond angle in trimethylamine is about
    options:
      - 104.5°
      - 108°
      - 120°
      - 109.5°
    answer: 1
    explanation: NCERT gives the C–N–C angle of pyramidal trimethylamine as 108°, a little below the tetrahedral 109.5° because the lone pair repels the bond pairs more strongly. 120° would need planar sp^2 nitrogen, and 104.5° is the bond angle of water.
  - id: che-amine-003
    topic: structure-classification
    subtopic: Shape and bond angle
    concept: Lone pair–bond pair repulsion lowers the bond angle in amines below 109.5°
    category: concept
    format: assertion-reason
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [structure, bond-angle, vsepr]
    stem: |-
      Assertion (A): In amines, the C–N–E bond angle (E = C or H) is less than 109.5°.
      Reason (R): The unshared electron pair on nitrogen repels the bond pairs more strongly than the bond pairs repel one another.
    options:
      - Both A and R are true and R is the correct explanation of A
      - Both A and R are true but R is not the correct explanation of A
      - A is true but R is false
      - A is false but R is true
    answer: 0
    explanation: Nitrogen is sp^3 hybridised with one orbital holding a lone pair, and lone pair–bond pair repulsion is stronger than bond pair–bond pair repulsion, so the angle is compressed (108° in trimethylamine). Both statements are true and R explains A.
  - id: che-amine-004
    topic: structure-classification
    subtopic: Primary, secondary and tertiary amines
    concept: Amine class depends on groups on N, not on the carbon type (tert-butylamine is 1°)
    category: application
    format: direct
    difficulty: 3
    time: 45
    ncert: true
    battle: true
    tags: [classification, trap]
    stem: Which of the following is a primary amine?
    options:
      - (CH_3)_2NH
      - C_6H_5NHCH_3
      - (CH_3)_3C–NH_2
      - (CH_3)_3N
    answer: 2
    explanation: Amines are classified by the number of alkyl or aryl groups on nitrogen. tert-Butylamine has only one group on N, so it is primary even though that carbon is tertiary; dimethylamine and N-methylaniline are secondary and trimethylamine is tertiary.
  - id: che-amine-005
    topic: structure-classification
    subtopic: Primary, secondary and tertiary amines
    concept: Classifying amines as 1°, 2°, 3°, aliphatic or aromatic
    category: application
    format: match
    difficulty: 3
    time: 60
    ncert: true
    battle: false
    tags: [classification, match]
    stem: |-
      Match the amines in List I with their class in List II.
      List I
      P. (CH_3)_2CHNH_2
      Q. CH_3NHCH(CH_3)_2
      R. (C_2H_5)_2NCH_3
      S. m-BrC_6H_4NH_2
      List II
      1. Tertiary amine
      2. Secondary amine
      3. Primary aliphatic amine
      4. Primary aromatic amine
    options:
      - P-2, Q-3, R-1, S-4
      - P-3, Q-1, R-2, S-4
      - P-3, Q-2, R-4, S-1
      - P-3, Q-2, R-1, S-4
    answer: 3
    explanation: Isopropylamine has one alkyl group on N (primary), CH_3NHCH(CH_3)_2 has two (secondary), (C_2H_5)_2NCH_3 has three (tertiary), and m-bromoaniline has –NH_2 directly on the ring (primary aromatic). Calling isopropylamine secondary confuses the carbon type with the amine class.
  - id: che-amine-006
    topic: structure-classification
    subtopic: Arylamines versus aralkylamines
    concept: Benzylamine has NH_2 on an sp^3 carbon and behaves like an aliphatic primary amine
    category: concept
    format: statements
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [classification, benzylamine, trap]
    stem: Which statement about benzylamine, C_6H_5CH_2NH_2, is correct?
    options:
      - It is a secondary amine because nitrogen is bonded to a benzylic carbon
      - It is an arylamine because its molecule contains a benzene ring
      - Its lone pair is delocalised into the ring, so it is a weaker base than aniline
      - Its –NH_2 group is attached to an sp^3 carbon, so it behaves like an aliphatic primary amine
    answer: 3
    explanation: In benzylamine the –NH_2 group sits on the CH_2 group, not on the ring, so its lone pair is not conjugated with the ring and its pK_b (4.70) is close to that of alkylamines, far below aniline's 9.38. Arylamines have nitrogen bonded directly to the ring.
  - id: che-amine-007
    topic: structure-classification
    subtopic: Uses of amines
    concept: Novocain is used as an anaesthetic in dentistry
    category: factual
    format: direct
    difficulty: 2
    time: 25
    ncert: true
    battle: true
    tags: [uses, drugs, ncert-line]
    stem: Which synthetic amino compound is used as an anaesthetic in dentistry?
    options:
      - Ephedrine
      - Benadryl
      - Novocain
      - Adrenaline
    answer: 2
    explanation: NCERT notes that Novocain, a synthetic amino compound, is used as an anaesthetic in dentistry. Benadryl is an antihistaminic drug, while adrenaline and ephedrine are used to increase blood pressure.
  - id: che-amine-008
    topic: structure-classification
    subtopic: Uses of amines
    concept: Biologically active and useful amino compounds named in NCERT
    category: factual
    format: multi-statement
    difficulty: 3
    time: 60
    ncert: true
    battle: false
    tags: [uses, ncert-line]
    stem: |-
      Consider the following statements about amines and their uses.
      I. Adrenaline and ephedrine contain a secondary amino group and are used to increase blood pressure.
      II. Benadryl, an antihistaminic drug, contains a tertiary amino group.
      III. Quaternary ammonium salts are used as surfactants.
      IV. Diazonium salts are themselves the final dyes, not intermediates in their preparation.
      Which of these statements are correct?
    options:
      - II, III and IV only
      - I and III only
      - I, II and III only
      - I and IV only
    answer: 2
    explanation: Statements I–III are NCERT facts. IV is wrong because diazonium salts are intermediates for making dyes and many other aromatic compounds; the coloured dyes are the azo products formed from them by coupling.
  - id: che-amine-009
    topic: nomenclature-isomerism
    subtopic: IUPAC names of secondary amines
    concept: In R–NH–R', the larger group gives the parent alkanamine and the smaller takes locant N
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [iupac, secondary-amine]
    stem: The IUPAC name of CH_3–NH–CH_2–CH_3 is
    options:
      - ethylmethylamine
      - N-ethylmethanamine
      - 1-methylaminoethane
      - N-methylethanamine
    answer: 3
    explanation: The longer alkyl chain (ethyl) forms the parent ethanamine and the methyl group on nitrogen is given the locant N. N-Ethylmethanamine wrongly takes the smaller group as parent, and ethylmethylamine is the common name.
  - id: che-amine-010
    topic: nomenclature-isomerism
    subtopic: Naming diamines
    concept: The terminal 'e' of the alkane is retained in diamines (ethane-1,2-diamine)
    category: factual
    format: direct
    difficulty: 2
    time: 25
    ncert: true
    battle: true
    tags: [iupac, diamine, ncert-line]
    stem: The IUPAC name of H_2N–CH_2–CH_2–NH_2 is
    options:
      - ethane-1,2-amine
      - ethylenediamine
      - ethane-1,2-diamine
      - ethan-1,2-diamine
    answer: 2
    explanation: With two amino groups the suffix diamine is used with locants and the 'e' of ethane is retained, giving ethane-1,2-diamine (like hexane-1,6-diamine in NCERT). Dropping the 'e' is the usual slip, and ethylenediamine is the common name.
  - id: che-amine-011
    topic: nomenclature-isomerism
    subtopic: Naming arylamines
    concept: C_6H_5N(CH_3)_2 is N,N-dimethylbenzenamine (substituents on N get locant N)
    category: factual
    format: direct
    difficulty: 3
    time: 45
    ncert: true
    battle: true
    tags: [iupac, arylamine]
    stem: The IUPAC name of C_6H_5N(CH_3)_2 is
    options:
      - N,N-dimethylbenzenamine
      - 2,6-dimethylbenzenamine
      - 1,1-dimethylbenzenamine
      - N-methyl-N-phenylmethanamine
    answer: 0
    explanation: The ring carrying nitrogen gives the parent benzenamine (aniline), and both methyl groups sit on nitrogen, so each takes the locant N. 2,6-Dimethylbenzenamine would have the methyl groups on ring carbons, and arylamines are not named as substituted methanamines.
  - id: che-amine-012
    topic: nomenclature-isomerism
    subtopic: Counting isomeric amines
    concept: C_3H_9N has four isomeric amines (two 1°, one 2°, one 3°)
    category: application
    format: direct
    difficulty: 2
    time: 40
    ncert: true
    battle: true
    tags: [isomerism, counting]
    stem: Counting primary, secondary and tertiary amines together, how many structural isomers with formula C_3H_9N are possible?
    options:
      - "2"
      - "4"
      - "3"
      - "5"
    answer: 1
    explanation: Propan-1-amine and propan-2-amine (primary), N-methylethanamine (secondary) and N,N-dimethylmethanamine (tertiary) are possible, giving four. Counting only the primary amines gives 2.
  - id: che-amine-013
    topic: nomenclature-isomerism
    subtopic: Types of isomerism in amines
    concept: Position, metamerism, functional and optical isomerism among C_4H_{11}N amines
    category: concept
    format: multi-statement
    difficulty: 4
    time: 100
    ncert: true
    battle: false
    tags: [isomerism, metamerism, multi-concept]
    stem: |-
      Consider these statements about amines of formula C_4H_{11}N.
      I. Butan-1-amine and butan-2-amine are chain isomers.
      II. N-Ethylethanamine and N-methylpropan-1-amine are metamers.
      III. Butan-1-amine and N,N-dimethylethanamine are functional isomers.
      IV. Butan-2-amine shows optical isomerism.
      Which of these statements are correct?
    options:
      - II, III and IV only
      - I, II and III only
      - I, III and IV only
      - II and IV only
    answer: 0
    explanation: I is wrong because the two butanamines have the same carbon chain and differ only in the position of –NH_2 (position isomers). II is right (different alkyl groups on either side of N), III is right (primary versus tertiary amine), and IV is right because C-2 of butan-2-amine is chiral.
  - id: che-amine-014
    topic: nomenclature-isomerism
    subtopic: IUPAC names of primary amines
    concept: (CH_3)_2CHCH_2NH_2 is 2-methylpropan-1-amine
    category: application
    format: direct
    difficulty: 3
    time: 45
    ncert: false
    battle: true
    tags: [iupac, branched-chain]
    stem: The IUPAC name of isobutylamine, (CH_3)_2CH–CH_2–NH_2, is
    options:
      - butan-1-amine
      - 2-methylpropan-2-amine
      - 2-methylpropan-1-amine
      - 3-methylpropan-1-amine
    answer: 2
    explanation: The longest chain containing the carbon bonded to N has three carbons; numbering from that carbon puts –NH_2 on C-1 and a methyl group on C-2. 2-Methylpropan-2-amine is tert-butylamine, (CH_3)_3C–NH_2, and "3-methylpropan-1-amine" would simply be butan-1-amine misnamed.
  - id: che-amine-015
    topic: nomenclature-isomerism
    subtopic: Counting isomeric amines
    concept: C_5H_{13}N has three structurally isomeric tertiary amines
    category: application
    format: direct
    difficulty: 4
    time: 90
    ncert: false
    battle: false
    tags: [isomerism, counting, tertiary-amine]
    stem: How many structurally isomeric tertiary amines have the molecular formula C_5H_{13}N?
    options:
      - "2"
      - "4"
      - "5"
      - "3"
    answer: 3
    explanation: The three groups on nitrogen must total five carbons. A 1 + 1 + 3 split gives (CH_3)_2N–CH_2CH_2CH_3 and (CH_3)_2N–CH(CH_3)_2, and a 1 + 2 + 2 split gives CH_3N(C_2H_5)_2, so there are three. Forgetting the isopropyl case gives 2.
  - id: che-amine-016
    topic: nomenclature-isomerism
    subtopic: Common and IUPAC systems
    concept: IUPAC alkanamine names versus one-word common alkylamine names
    category: factual
    format: statement-pair
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [nomenclature, ncert-line]
    stem: |-
      Statement I: In the IUPAC system, aliphatic amines are named as alkanamines, derived by replacing the 'e' of the alkane name with 'amine'.
      Statement II: In the common system, the alkyl group and 'amine' are written as two separate words, as in "methyl amine".
    options:
      - Both Statement I and Statement II are correct
      - Both Statement I and Statement II are incorrect
      - Statement I is correct but Statement II is incorrect
      - Statement I is incorrect but Statement II is correct
    answer: 2
    explanation: Statement I is the NCERT rule (CH_3NH_2 is methanamine). Statement II is wrong because the common name is written as one word, alkylamine, for example methylamine.
  - id: che-amine-017
    topic: preparation-reduction
    subtopic: Reduction of nitro compounds
    concept: Sn/HCl reduces nitrobenzene to aniline
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [preparation, nitro-reduction]
    stem: Nitrobenzene on reduction with tin and hydrochloric acid gives
    options:
      - azobenzene
      - benzene
      - N-phenylhydroxylamine
      - aniline
    answer: 3
    explanation: Metals in acidic medium reduce the –NO_2 group completely to –NH_2, so nitrobenzene gives aniline (as its salt, freed by alkali). Azobenzene and N-phenylhydroxylamine arise from reduction in other media, not with Sn/HCl.
  - id: che-amine-018
    topic: preparation-reduction
    subtopic: Reduction of nitro compounds
    concept: Fe scrap/HCl is preferred because FeCl_2 hydrolysis regenerates HCl
    category: concept
    format: assertion-reason
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [preparation, nitro-reduction, ncert-line]
    stem: |-
      Assertion (A): Reduction of nitro compounds with iron scrap and hydrochloric acid is preferred.
      Reason (R): The FeCl_2 formed gets hydrolysed to release HCl, so only a small amount of acid is needed to start the reaction.
    options:
      - Both A and R are true and R is the correct explanation of A
      - Both A and R are true but R is not the correct explanation of A
      - A is true but R is false
      - A is false but R is true
    answer: 0
    explanation: NCERT gives exactly this reason — the FeCl_2 formed is hydrolysed and releases HCl during the reaction, so only a little HCl is needed to initiate it. Both statements are true and R explains A.
  - id: che-amine-019
    topic: preparation-reduction
    subtopic: Reduction of nitriles
    concept: RX → RCN (KCN) → RCH_2NH_2 adds one carbon; the AgCN route gives a secondary amine
    category: application
    format: direct
    difficulty: 4
    time: 90
    ncert: true
    battle: false
    tags: [conversion, nitrile-reduction, multi-concept, trap]
    stem: CH_3CH_2Cl can be converted into CH_3CH_2CH_2NH_2 by treating it successively with
    options:
      - alcoholic KCN, then LiAlH_4
      - AgCN, then LiAlH_4
      - alcoholic KCN, then H_3O^+
      - excess alcoholic NH_3, then LiAlH_4
    answer: 0
    explanation: Cyanide substitution adds a carbon (CH_3CH_2CN) and LiAlH_4 reduces –C≡N to –CH_2NH_2, giving propan-1-amine. AgCN gives the isocyanide CH_3CH_2NC, whose reduction yields the secondary amine CH_3CH_2NHCH_3, and acid hydrolysis of the nitrile gives propanoic acid.
  - id: che-amine-020
    topic: preparation-reduction
    subtopic: Ammonolysis of alkyl halides
    concept: Conditions and limitations of ammonolysis
    category: concept
    format: statements
    difficulty: 3
    time: 55
    ncert: true
    battle: false
    tags: [ammonolysis, ncert-line]
    stem: Which statement about the ammonolysis of alkyl halides is correct?
    options:
      - It gives only the primary amine even when the alkyl halide is in excess
      - It is carried out with an ethanolic solution of ammonia in a sealed tube at about 373 K
      - Aryl halides undergo it as readily as alkyl halides
      - The order of reactivity of the halides is RCl > RBr > RI
    answer: 1
    explanation: NCERT describes ammonolysis as heating the halide with ethanolic NH_3 in a sealed tube at 373 K. It yields a mixture of 1°, 2° and 3° amines and the quaternary salt (primary major only with excess NH_3), the reactivity order is RI > RBr > RCl, and aryl halides are far less reactive.
  - id: che-amine-021
    topic: preparation-reduction
    subtopic: Ammonolysis of alkyl halides
    concept: Large excess of NH_3 makes the primary amine the major product
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [ammonolysis]
    stem: In the ammonolysis of an alkyl halide, the primary amine is obtained as the major product when
    options:
      - the reaction is carried out in aqueous acid
      - a large excess of ammonia is used
      - anhydrous AlCl_3 is added as a catalyst
      - a large excess of the alkyl halide is used
    answer: 1
    explanation: With a large excess of NH_3, the alkyl halide is far more likely to meet ammonia than the newly formed amine, so further alkylation is suppressed. Excess alkyl halide pushes the reaction toward secondary and tertiary amines and the quaternary ammonium salt.
  - id: che-amine-022
    topic: preparation-reduction
    subtopic: Reduction of amides
    concept: LiAlH_4 reduces RCONH_2 to RCH_2NH_2 without loss of carbon
    category: application
    format: direct
    difficulty: 3
    time: 45
    ncert: true
    battle: true
    tags: [amide-reduction, trap]
    stem: Acetamide, CH_3CONH_2, on reduction with LiAlH_4 followed by hydrolysis gives
    options:
      - ethanamine
      - methanamine
      - ethanol
      - ethanenitrile
    answer: 0
    explanation: LiAlH_4 converts the C=O of the amide into CH_2, so RCONH_2 gives RCH_2NH_2 with the same number of carbon atoms, here CH_3CH_2NH_2. Methanamine, with one carbon fewer, is the Hoffmann bromamide product of acetamide.
  - id: che-amine-023
    topic: preparation-reduction
    subtopic: Reduction of nitro compounds
    concept: Mole relation nitrobenzene → aniline with percentage yield
    category: numerical
    format: direct
    difficulty: 3
    time: 60
    ncert: false
    battle: false
    formula: moles of aniline = moles of nitrobenzene × fractional yield
    tags: [stoichiometry, yield, calculation]
    stem: What mass of aniline is obtained from 24.6 g of nitrobenzene if the reduction proceeds with 80% yield? (C = 12, H = 1, N = 14, O = 16)
    options:
      - 19.7 g
      - 14.9 g
      - 18.6 g
      - 12.3 g
    answer: 1
    explanation: Nitrobenzene (M = 123) gives 24.6/123 = 0.20 mol, which would give 0.20 × 93 = 18.6 g of aniline at 100% yield; 80% of this is 14.9 g. Taking 80% of the nitrobenzene mass (19.7 g) ignores the change in molar mass.
  - id: che-amine-024
    topic: preparation-reduction
    subtopic: Reduction of nitro compounds
    concept: Aniline stays in acid as its salt; NaOH liberates the free amine
    category: application
    format: case
    difficulty: 3
    time: 60
    ncert: true
    battle: false
    tags: [nitro-reduction, amine-salts, experiment]
    stem: |-
      A student reduces nitrobenzene with tin and concentrated HCl. No oily layer of aniline separates from the clear acidic solution, but when the solution is made strongly alkaline with NaOH an oily layer appears. What explains this observation?
    options:
      - NaOH reduces the unreacted nitrobenzene to aniline
      - NaOH converts phenol formed in the acid into aniline
      - In acid, aniline exists as a water-soluble anilinium salt, and NaOH regenerates the free amine
      - Aniline is formed only when NaOH decomposes a tin–nitrobenzene complex
    answer: 2
    explanation: Aniline is basic, so in excess HCl it stays dissolved as an anilinium salt; a strong base removes the proton and liberates the water-insoluble amine. NCERT notes that amine salts regenerate the parent amine on treatment with a base like NaOH, which is not a reducing agent.
  - id: che-amine-025
    topic: preparation-reduction
    subtopic: Reduction of nitriles
    concept: Nitrile reduction is used for ascent of the amine series
    category: concept
    format: direct
    difficulty: 3
    time: 45
    ncert: true
    battle: false
    tags: [nitrile-reduction, ascent, ncert-line]
    stem: Why is the reduction of nitriles described as a method for the ascent of the amine series?
    options:
      - The amine formed has one carbon atom fewer than the nitrile
      - Two nitrile molecules combine to give an amine with a doubled chain
      - The reducing agent LiAlH_4 supplies an extra carbon atom
      - The nitrile carbon becomes the CH_2 bonded to nitrogen, so the amine has one carbon more than the alkyl group it came from
    answer: 3
    explanation: In R–X → R–C≡N → R–CH_2NH_2, the carbon of the cyanide group ends up as the CH_2 bonded to nitrogen, so the product has one carbon more than R. Losing one carbon is the feature of Hoffmann bromamide degradation, the descent method.
  - id: che-amine-026
    topic: preparation-reduction
    subtopic: Reduction of isocyanides
    concept: Nitromethane → methylamine → methyl isocyanide → dimethylamine
    category: application
    format: direct
    difficulty: 4
    time: 100
    ncert: true
    battle: false
    tags: [conversion, isocyanide-reduction, multi-concept]
    stem: Which sequence of reagents converts nitromethane into dimethylamine?
    options:
      - Sn/HCl; then NaNO_2/HCl at 273 K; then H_2/Ni
      - Sn/HCl; then CHCl_3 and alcoholic KOH; then H_2/Ni
      - Sn/HCl; then KCN; then H_2/Ni
      - Sn/HCl; then excess CH_3I with Na_2CO_3
    answer: 1
    explanation: Nitromethane is reduced to CH_3NH_2, the carbylamine reaction converts it into CH_3–N≡C, and reduction of an isocyanide gives the secondary amine CH_3NHCH_3. Excess CH_3I alkylates all the way to (CH_3)_4N^+I^-, and HNO_2 turns methylamine into methanol.
  - id: che-amine-027
    topic: preparation-reduction
    subtopic: Reagents for preparing amines
