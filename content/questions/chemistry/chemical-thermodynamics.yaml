questions:
  - id: che-thermo-001
    topic: thermo-terms
    subtopic: Types of systems
    concept: An open system exchanges both matter and energy with the surroundings
    category: concept
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    tags: [open-system, ncert-line]
    stem: Which of the following is an example of an open system?
    options:
      - Hot coffee in a sealed, insulated thermos flask
      - Water boiling in an open beaker
      - Gas enclosed in a sealed steel cylinder
      - Reactants in a closed metal vessel
    answer: 1
    explanation: An open system exchanges both matter (steam escapes) and energy (heat enters) with the surroundings, as water boiling in an open beaker does. A sealed steel cylinder or closed vessel is a closed system (energy only), and an ideal thermos flask approximates an isolated system.

  - id: che-thermo-002
    topic: thermo-terms
    subtopic: State functions
    concept: q + w equals ΔU and is therefore a state function
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [state-function, trap]
    stem: Which of the following quantities is a state function?
    options:
      - Heat absorbed, q
      - Work done, w
      - q + w
      - q − w
    answer: 2
    explanation: By the first law, q + w = ΔU, and internal energy is a state function, so the sum is path-independent even though q and w individually depend on the path. The combination q − w has no such meaning and is not a state function.

  - id: che-thermo-003
    topic: thermo-terms
    subtopic: Intensive and extensive properties
    concept: Molar heat capacity is an intensive property
    category: concept
    format: direct
    difficulty: 2
    time: 25
    ncert: true
    battle: true
    tags: [intensive, trap]
    stem: Which of the following is an intensive property?
    options:
      - Enthalpy
      - Internal energy
      - Volume
      - Molar heat capacity
    answer: 3
    explanation: A molar quantity is a ratio of two extensive properties (heat capacity per mole), so it does not depend on the amount of substance and is intensive. Enthalpy, internal energy and volume all scale with the amount of matter and are extensive.

  - id: che-thermo-004
    topic: thermo-terms
    subtopic: Intensive and extensive properties
    concept: Identifying extensive properties from a list
    category: application
    format: multi-statement
    difficulty: 2
    time: 45
    ncert: true
    battle: false
    tags: [extensive, intensive]
    stem: |-
      Consider the following properties of a system:
      I. Mass
      II. Density
      III. Heat capacity
      IV. Refractive index
      Which of these are extensive properties?
    options:
      - I and III only
      - II and IV only
      - I, II and III only
      - III only
    answer: 0
    explanation: Extensive properties depend on the quantity of matter, so mass and heat capacity are extensive. Density and refractive index are the same for any sample size and are intensive; density being mass/volume, a ratio of two extensive properties, is a common trap.

  - id: che-thermo-005
    topic: first-law
    subtopic: Sign convention
    concept: Work done on the system is positive in the IUPAC convention
    category: concept
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    tags: [sign-convention, ncert-line]
    stem: According to the IUPAC sign convention used in NCERT, work done on the system by the surroundings is taken as
    options:
      - Negative, because the energy of the system decreases
      - Positive, because the energy of the system increases
      - Zero, because work is not a state function
      - Positive only if the process is reversible
    answer: 1
    explanation: When the surroundings do work on the system, energy is transferred into the system and its internal energy rises, so w is positive. Work done by the system (expansion) is negative. The sign convention does not depend on reversibility.

  - id: che-thermo-006
    topic: first-law
    subtopic: First law calculation
    concept: ΔU = q + w with heat absorbed and work done by the system
    category: numerical
    format: direct
    difficulty: 2
    time: 35
    ncert: true
    battle: true
    formula: ΔU = q + w
    tags: [first-law, sign-convention]
    stem: A system absorbs 500 J of heat and does 200 J of work on the surroundings. What is the change in its internal energy?
    options:
      - +700 J
      - −300 J
      - +300 J
      - −700 J
    answer: 2
    explanation: Heat absorbed gives q = +500 J and work done by the system gives w = −200 J, so ΔU = 500 − 200 = +300 J. Taking w as +200 J (to get 700 J) ignores the sign convention.

  - id: che-thermo-007
    topic: first-law
    subtopic: Adiabatic process
    concept: In an adiabatic process ΔU equals the work done, w_{ad}
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [adiabatic, ncert-line]
    stem: For an adiabatic change of a closed system, the change in internal energy equals
    options:
      - Zero
      - The heat absorbed, q
      - The work done on the system, w_{ad}
      - The enthalpy change, ΔH
    answer: 2
    explanation: In an adiabatic process no heat is exchanged (q = 0), so the first law gives ΔU = w_{ad}. ΔU is zero only for an isothermal change of an ideal gas, not for every adiabatic change.

  - id: che-thermo-008
    topic: first-law
    subtopic: Isolated system
    concept: ΔU = 0 for an isolated system
    category: concept
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [isolated-system, ncert-line]
    stem: What is the change in internal energy of an isolated system?
    options:
      - Always positive
      - Always negative
      - Equal to the work done on it
      - Zero
    answer: 3
    explanation: An isolated system exchanges neither heat nor work with its surroundings, so q = 0 and w = 0, giving ΔU = 0. This is a direct statement of the first law (energy of an isolated system is constant).

  - id: che-thermo-009
    topic: pv-work
    subtopic: Irreversible expansion
    concept: w = −p_{ext}ΔV for expansion against constant external pressure
    category: numerical
    format: direct
    difficulty: 2
    time: 40
    ncert: true
    battle: true
    formula: w = −p_{ext}ΔV
    tags: [irreversible-work]
    stem: A gas expands from 2 L to 7 L against a constant external pressure of 2 atm. The work done (1 L atm = 101.3 J) is about
    options:
      - −1013 J
      - +1013 J
      - −506.5 J
      - −1418 J
    answer: 0
    explanation: w = −p_{ext}ΔV = −2 atm × (7 − 2) L = −10 L atm = −10 × 101.3 J ≈ −1013 J. The sign is negative because the gas does work on the surroundings during expansion.

  - id: che-thermo-010
    topic: pv-work
    subtopic: Free expansion
    concept: Work done in free expansion of a gas is zero
    category: concept
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [free-expansion, ncert-line]
    stem: What is the work done when an ideal gas expands into a vacuum?
    options:
      - −p ΔV, where p is the initial gas pressure
      - Zero
      - −nRT ln(V_2/V_1)
      - Equal to ΔH of the gas
    answer: 1
    explanation: Expansion into a vacuum is free expansion; the external pressure is zero, so w = −p_{ext}ΔV = 0. Using the gas's own pressure is a common mistake, since work depends on the opposing external pressure.

  - id: che-thermo-011
    topic: pv-work
    subtopic: Reversible isothermal expansion
    concept: w_{rev} = −2.303 nRT log(V_2/V_1)
    category: numerical
    format: direct
    difficulty: 3
    time: 60
    ncert: true
    battle: false
    formula: w_{rev} = −2.303 nRT log(V_2/V_1)
    tags: [reversible-work, isothermal]
    stem: Two moles of an ideal gas expand isothermally and reversibly at 300 K from 1 L to 10 L. What is the work done? (R = 8.314 J K^{-1} mol^{-1})
    options:
      - −5.74 kJ
      - +11.49 kJ
      - −2.49 kJ
      - −11.49 kJ
    answer: 3
    explanation: w = −2.303 nRT log(V_2/V_1) = −2.303 × 2 × 8.314 × 300 × log 10 ≈ −11488 J ≈ −11.49 kJ. The value −5.74 kJ is for one mole, and the positive value ignores that the gas does work on expanding.

  - id: che-thermo-012
    topic: pv-work
    subtopic: Comparing reversible and irreversible work
    concept: Reversible expansion gives the maximum work output
    category: concept
    format: direct
    difficulty: 3
    time: 40
    ncert: true
    battle: true
    tags: [reversible-work, maximum-work]
    stem: For isothermal expansion of an ideal gas between the same initial and final volumes, the magnitude of work done by the gas is maximum when the expansion is
    options:
      - Carried out reversibly
      - Against a constant external pressure equal to the final pressure
      - Into a vacuum
      - Carried out in a single fast step
    answer: 0
    explanation: In a reversible expansion the external pressure is only infinitesimally smaller than the gas pressure at every stage, so the gas pushes against the largest possible opposing pressure and delivers the maximum work. Single-step or free expansion does less (or zero) work.

  - id: che-thermo-013
    topic: enthalpy
    subtopic: ΔH–ΔU relation
    concept: ΔH = ΔU + Δn_gRT
    category: numerical
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    formula: ΔH = ΔU + Δn_gRT
    tags: [delta-h-delta-u]
    stem: For the reaction N_2(g) + 3H_2(g) → 2NH_3(g) at 298 K, ΔU = −87.1 kJ mol^{-1}. What is ΔH? (R = 8.314 J K^{-1} mol^{-1})
    options:
      - −82.1 kJ mol^{-1}
      - −92.1 kJ mol^{-1}
      - −87.1 kJ mol^{-1}
      - −89.6 kJ mol^{-1}
    answer: 1
    explanation: Δn_g = 2 − 4 = −2, so Δn_gRT = −2 × 8.314 × 298 J ≈ −4.96 kJ. ΔH = −87.1 − 4.96 ≈ −92.1 kJ mol^{-1}. Adding 4.96 kJ instead (−82.1) comes from using Δn_g = +2.

  - id: che-thermo-014
    topic: enthalpy
    subtopic: ΔH–ΔU relation
    concept: ΔH = ΔU when Δn_g = 0
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [delta-h-delta-u]
    stem: For which reaction is ΔH equal to ΔU?
    options:
      - 2SO_2(g) + O_2(g) → 2SO_3(g)
      - PCl_5(g) → PCl_3(g) + Cl_2(g)
      - H_2(g) + I_2(g) → 2HI(g)
      - N_2(g) + 3H_2(g) → 2NH_3(g)
    answer: 2
    explanation: ΔH = ΔU + Δn_gRT, so the two are equal when the moles of gaseous products equal the moles of gaseous reactants. For H_2 + I_2 → 2HI, Δn_g = 2 − 2 = 0; all the others have Δn_g ≠ 0.

  - id: che-thermo-015
    topic: enthalpy
    subtopic: Definition of enthalpy
    concept: ΔH equals heat absorbed at constant pressure
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [enthalpy, ncert-line]
    stem: The enthalpy change of a process is equal to the heat absorbed by the system at constant
    options:
      - Volume
      - Temperature
      - Pressure
      - Entropy
    answer: 2
    explanation: With H = U + pV, at constant pressure ΔH = ΔU + pΔV = q_p. The heat absorbed at constant volume equals ΔU instead.

  - id: che-thermo-016
    topic: enthalpy
    subtopic: ΔH–ΔU relation
    concept: Only gaseous species count in Δn_g for the ΔH–ΔU relation
    category: application
    format: direct
    difficulty: 3
    time: 45
    ncert: false
    battle: true
    tags: [delta-h-delta-u, trap]
    stem: For C(graphite) + O_2(g) → CO_2(g), which relation between ΔH and ΔU holds?
    options:
      - ΔH > ΔU
      - ΔH < ΔU
      - ΔH = ΔU
      - ΔH = −ΔU
    answer: 2
    explanation: Only gases count in Δn_g. One mole of gaseous O_2 gives one mole of gaseous CO_2, so Δn_g = 0 and ΔH = ΔU. Counting solid carbon as a reactant gas would wrongly give ΔH < ΔU.

  - id: che-thermo-017
    topic: heat-capacity-calorimetry
    subtopic: Cp and Cv of an ideal gas
    concept: C_p − C_v = R for one mole of ideal gas
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    formula: C_p − C_v = R
    tags: [heat-capacity, ncert-line]
    stem: For one mole of an ideal gas, the difference C_p − C_v is equal to
    options:
      - Zero
      - R/2
      - 2R
      - R
    answer: 3
    explanation: For an ideal gas ΔH = ΔU + Δ(pV) = ΔU + RΔT per mole, so C_pΔT = C_vΔT + RΔT, giving C_p − C_v = R.

  - id: che-thermo-018
    topic: heat-capacity-calorimetry
    subtopic: Bomb calorimeter
    concept: A bomb calorimeter measures ΔU (heat at constant volume)
    category: factual
    format: direct
    difficulty: 2
    time: 25
    ncert: true
    battle: true
    tags: [calorimetry, ncert-line, trap]
    stem: The heat measured in a bomb calorimeter directly gives the value of
    options:
      - ΔH of the reaction
      - ΔU of the reaction
      - ΔG of the reaction
      - ΔS of the reaction
    answer: 1
    explanation: A bomb calorimeter is a sealed steel vessel, so the reaction occurs at constant volume and no pV work is done; the heat measured is q_v = ΔU. ΔH is measured at constant pressure, for example in a coffee-cup calorimeter.

  - id: che-thermo-019
    topic: heat-capacity-calorimetry
    subtopic: q = mcΔT
    concept: Heat required to raise temperature using specific heat
    category: numerical
    format: direct
    difficulty: 2
    time: 40
    ncert: false
    battle: true
    formula: q = mcΔT
    tags: [specific-heat]
    stem: How much heat is needed to warm 50 g of water from 20 °C to 30 °C? (specific heat of water = 4.18 J g^{-1} K^{-1})
    options:
      - 209 J
      - 2090 J
      - 4180 J
      - 20.9 J
    answer: 1
    explanation: q = mcΔT = 50 × 4.18 × 10 = 2090 J. A change of 10 °C equals a change of 10 K, so no conversion to kelvin is needed for ΔT.

  - id: che-thermo-020
    topic: heat-capacity-calorimetry
    subtopic: Bomb calorimeter calculation
    concept: q = C_{cal}ΔT from the calorimeter constant
    category: numerical
    format: direct
    difficulty: 3
    time: 60
    ncert: true
    battle: false
    formula: q = C_{cal}ΔT
    tags: [calorimetry, bomb-calorimeter]
    stem: 1 g of graphite is burnt in a bomb calorimeter with excess O_2 at 298 K. The temperature rises from 298 K to 299 K and the heat capacity of the calorimeter is 20.7 kJ K^{-1}. What is ΔU for the combustion per mole of graphite?
    options:
      - −20.7 kJ mol^{-1}
      - +248.4 kJ mol^{-1}
      - −248.4 kJ mol^{-1}
      - −1.73 kJ mol^{-1}
    answer: 2
    explanation: Heat released = 20.7 kJ K^{-1} × 1 K = 20.7 kJ for 1 g, i.e. 1/12 mol. Per mole, ΔU = −20.7 × 12 = −248.4 kJ mol^{-1}; it is negative because the reaction releases heat to the calorimeter.

  - id: che-thermo-021
    topic: reaction-enthalpies
    subtopic: Standard enthalpy of formation
    concept: Standard enthalpy of formation of an element in its reference state is zero
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [enthalpy-of-formation, reference-state, trap]
    stem: For which substance is the standard enthalpy of formation zero at 298 K?
    options:
      - C(diamond)
      - O_3(g)
      - Br_2(l)
      - I_2(g)
    answer: 2
    explanation: ΔfH° is zero only for an element in its most stable (reference) state at 1 bar. Bromine is a liquid under standard conditions, so Br_2(l) has ΔfH° = 0. Diamond, ozone and gaseous iodine are not the reference forms of their elements.

  - id: che-thermo-022
    topic: reaction-enthalpies
    subtopic: Standard enthalpy of combustion
    concept: Enthalpy of combustion is always negative
    category: concept
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [combustion]
    stem: The standard enthalpy of combustion of a substance is
    options:
      - Always negative
      - Always positive
      - Zero for hydrocarbons
      - Positive or negative depending on the substance
    answer: 0
    explanation: Combustion reactions release heat, so the standard enthalpy of combustion (per mole of substance burnt completely in oxygen) is always negative.

  - id: che-thermo-023
    topic: reaction-enthalpies
    subtopic: Enthalpy of neutralisation
    concept: Neutralisation of strong acid by strong base gives about −57.1 kJ mol^{-1}
    category: factual
    format: direct
    difficulty: 2
    time: 25
    ncert: false
    battle: true
    tags: [neutralisation]
    stem: The enthalpy of neutralisation of any strong acid by any strong base in dilute solution is nearly
    options:
      - "−13.7 kJ mol^{-1}"
      - −57.1 kJ mol^{-1}
      - −285.8 kJ mol^{-1}
      - +57.1 kJ mol^{-1}
    answer: 1
    explanation: Strong acids and bases are fully ionised, so the only reaction is H^+(aq) + OH^−(aq) → H_2O(l), releasing about 57.1 kJ per mole of water formed (13.7 kcal). The −13.7 value is the same quantity in kcal, not kJ.

  - id: che-thermo-024
    topic: reaction-enthalpies
    subtopic: Enthalpy of neutralisation
    concept: Weak acid neutralisation is less exothermic because ionisation absorbs energy
    category: concept
    format: assertion-reason
    difficulty: 3
    time: 50
    ncert: false
    battle: false
    tags: [neutralisation, weak-acid]
    stem: |-
      Assertion (A): The enthalpy of neutralisation of CH_3COOH by NaOH is less negative than that of HCl by NaOH.
      Reason (R): Part of the heat released is used to ionise the weak acid CH_3COOH.
    options:
      - Both A and R are true and R is the correct explanation of A
      - Both A and R are true but R is not the correct explanation of A
      - A is true but R is false
      - A is false but R is true
    answer: 0
    explanation: Acetic acid is only partly ionised, and its ionisation is endothermic. Some of the energy released by H^+ + OH^− → H_2O is consumed in ionising it, so the net enthalpy of neutralisation (about −55 kJ mol^{-1}) is less negative than −57.1 kJ mol^{-1}. R correctly explains A.

  - id: che-thermo-025
    topic: hess-law
    subtopic: Hess's law statement
    concept: Enthalpy change is the same whether a reaction occurs in one step or many
    category: factual
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    tags: [hess-law, ncert-line]
    stem: Hess's law of constant heat summation is a consequence of the fact that enthalpy is
    options:
      - An intensive property
      - A path function
      - Always negative for chemical reactions
      - A state function
    answer: 3
    explanation: Because enthalpy is a state function, ΔH depends only on the initial and final states, so the total enthalpy change is the same whether the reaction occurs in one step or in several steps.

  - id: che-thermo-026
    topic: hess-law
    subtopic: Combining equations
    concept: Enthalpy of formation of CO from combustion data
    category: numerical
    format: direct
    difficulty: 3
    time: 60
    ncert: true
    battle: false
    tags: [hess-law]
    stem: Given C(graphite) + O_2(g) → CO_2(g), ΔH = −393.5 kJ mol^{-1} and CO(g) + ½O_2(g) → CO_2(g), ΔH = −283.0 kJ mol^{-1}. What is ΔH for C(graphite) + ½O_2(g) → CO(g)?
    options:
      - −110.5 kJ mol^{-1}
      - −676.5 kJ mol^{-1}
      - +110.5 kJ mol^{-1}
      - −221.0 kJ mol^{-1}
    answer: 0
    explanation: Subtract the second equation from the first (reverse it and add). ΔH = −393.5 − (−283.0) = −110.5 kJ mol^{-1}. Adding the two values (−676.5) forgets to reverse the CO combustion.

  - id: che-thermo-027
    topic: hess-law
    subtopic: Reversing and scaling equations
    concept: Reversing an equation changes sign of ΔH; multiplying scales it
    category: numerical
    format: direct
    difficulty: 2
    time: 35
    ncert: true
    battle: true
    tags: [hess-law, thermochemical-equation]
    stem: If H_2(g) + ½O_2(g) → H_2O(l) has ΔH = −285.8 kJ, what is ΔH for 2H_2O(l) → 2H_2(g) + O_2(g)?
    options:
      - "−571.6 kJ"
      - +285.8 kJ
      - +571.6 kJ
      - −285.8 kJ
    answer: 2
    explanation: Reversing the equation changes the sign (+285.8 kJ) and doubling it doubles the value, giving +571.6 kJ.

  - id: che-thermo-028
    topic: hess-law
    subtopic: ΔrH from enthalpies of formation
    concept: ΔrH° = Σ ΔfH°(products) − Σ ΔfH°(reactants)
    category: numerical
    format: direct
    difficulty: 3
    time: 60
    ncert: true
    battle: false
    formula: ΔrH° = ΣνΔfH°(products) − ΣνΔfH°(reactants)
    tags: [enthalpy-of-formation, combustion]
    stem: Using ΔfH° values (kJ mol^{-1}) CH_4(g) = −74.8, CO_2(g) = −393.5 and H_2O(l) = −285.8, find ΔcH° of methane.
    options:
      - "−604.5 kJ mol^{-1}"
      - −890.3 kJ mol^{-1}
      - −1040 kJ mol^{-1}
      - −754.1 kJ mol^{-1}
    answer: 1
    explanation: CH_4 + 2O_2 → CO_2 + 2H_2O. ΔcH° = [−393.5 + 2(−285.8)] − [−74.8 + 0] = −965.1 + 74.8 = −890.3 kJ mol^{-1}. Forgetting the factor 2 for water gives −604.5.

  - id: che-thermo-029
    topic: bond-enthalpy
    subtopic: ΔH from bond enthalpies
    concept: ΔrH = Σ bond enthalpies broken − Σ bond enthalpies formed
    category: numerical
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    formula: ΔrH = ΣBE(reactants) − ΣBE(products)
    tags: [bond-enthalpy]
    stem: Using bond enthalpies H–H = 435, Cl–Cl = 242 and H–Cl = 431 kJ mol^{-1}, find ΔH for H_2(g) + Cl_2(g) → 2HCl(g).
    options:
      - "−185 kJ"
      - +185 kJ
      - −246 kJ
      - +246 kJ
    answer: 0
    explanation: Bonds broken = 435 + 242 = 677 kJ; bonds formed = 2 × 431 = 862 kJ. ΔH = 677 − 862 = −185 kJ. Using only one H–Cl bond gives +246 kJ, and reversing the subtraction gives +185 kJ.

  - id: che-thermo-030
    topic: bond-enthalpy
    subtopic: Bond dissociation enthalpy
    concept: Bond dissociation is always endothermic
    category: concept
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [bond-enthalpy]
    stem: The enthalpy change for breaking a covalent bond in the gaseous state is always
    options:
      - Negative
      - Zero
      - Positive
      - Equal to the enthalpy of formation of the molecule
    answer: 2
    explanation: Energy must be supplied to separate bonded atoms, so bond dissociation enthalpy is always positive (endothermic). Bond formation releases the same amount of energy.

  - id: che-thermo-031
    topic: bond-enthalpy
    subtopic: Mean bond enthalpy
    concept: C–H bond enthalpy is an average over successive dissociation steps in CH_4
    category: concept
    format: statement-pair
    difficulty: 3
    time: 45
    ncert: true
    battle: false
    tags: [mean-bond-enthalpy, ncert-line]
    stem: |-
