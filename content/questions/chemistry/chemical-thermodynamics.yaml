  - id: che-thermo-093
    topic: gibbs-equilibrium
    subtopic: ΔG = ΔG° + RT ln Q
    concept: Direction of reaction from Q relative to K
    category: concept
    format: direct
    difficulty: 3
    time: 45
    ncert: true
    battle: true
    formula: ΔG = ΔG° + RT ln Q
    tags: [reaction-quotient, gibbs-equilibrium]
    stem: For a reaction mixture, the reaction quotient Q is less than K. Which is true?
    options:
      - ΔG > 0 and the reaction proceeds backward
      - ΔG = 0 and the mixture is at equilibrium
      - ΔG < 0 and the reaction proceeds forward
      - ΔG° must be positive
    answer: 2
    explanation: ΔG = ΔG° + RT ln Q = RT ln(Q/K). If Q < K, ln(Q/K) is negative, so ΔG < 0 and the forward reaction is spontaneous until Q reaches K. The sign of ΔG° is not decided by Q.

