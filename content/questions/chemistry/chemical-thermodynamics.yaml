    ncert: true
    battle: false
    formula: ΔG = −TΔS_{total}
    tags: [second-law, gibbs-energy]
    stem: At constant temperature and pressure, the Gibbs energy change of the system is related to the total entropy change of system plus surroundings by
    options:
      - ΔG = TΔS_{total}
      - ΔG = −ΔS_{total}/T
      - ΔG = ΔH − ΔS_{total}
      - ΔG = −TΔS_{total}
    answer: 3
    explanation: ΔS_{total} = ΔS_{sys} + ΔS_{surr} = ΔS_{sys} − ΔH_{sys}/T. Multiplying by −T gives −TΔS_{total} = ΔH − TΔS_{sys} = ΔG. So a positive ΔS_{total} corresponds to a negative ΔG.

