questions:
  - id: che-carb-001
    topic: carbonyl-nomenclature-structure
    subtopic: IUPAC names of aldehydes
    concept: Branched aldehyde named from the longest chain with the CHO carbon as C-1
    category: factual
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    tags: [iupac, aldehyde-naming]
    stem: The IUPAC name of (CH_3)_2CHCHO (isobutyraldehyde) is
    options:
      - 2-methylpropanone
      - 3-methylpropanal
      - 2-methylpropanal
      - butanal
    answer: 2
    explanation: The longest chain containing the CHO carbon has three carbons and is numbered from the CHO carbon (C-1), so the methyl group is on C-2, giving 2-methylpropanal. Butanal is the straight-chain isomer, and "propanone" wrongly treats the compound as a ketone.
  - id: che-carb-002
    topic: carbonyl-nomenclature-structure
    subtopic: Aldehydes attached to rings
    concept: A CHO group attached to a ring is named with the suffix carbaldehyde
    category: application
    format: diagram
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    diagram: Bond-line structure of a cyclohexane ring. One ring carbon, labelled C1, carries a –CHO group drawn as a single line ending in a carbon that is doubly bonded to O and bears an H. The ring carbon next to it, labelled C2, carries a single methyl line. There are no other substituents.
    tags: [iupac, carbaldehyde, trap]
    stem: What is the IUPAC name of the compound whose bond-line structure is shown?
    options:
      - 2-methylcyclohexane-1-carbaldehyde
      - 1-formyl-2-methylcyclohexane
      - 2-methylheptanal
      - 2-methylcyclohexanal
    answer: 0
    explanation: When a –CHO group is attached to a ring, the ring is the parent and the suffix "carbaldehyde" is used, with the ring carbon bearing CHO as C-1; the methyl on the adjacent carbon gets locant 2. "Cyclohexanal" is wrong because the CHO carbon is not part of the ring, and "heptanal" wrongly treats the ring and CHO carbon as one chain.
  - id: che-carb-003
    topic: carbonyl-nomenclature-structure
    subtopic: Seniority of functional groups
    concept: Seniority order COOH > CN > CHO > ketone C=O in choosing the suffix
    category: application
    format: ordering
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [iupac, priority, trap]
    stem: Arrange the groups –CHO, –COOH, –CN and >C=O in decreasing order of priority for choosing the suffix in IUPAC nomenclature.
    options:
      - –CN > –COOH > –CHO > >C=O
      - –COOH > –CN > –CHO > >C=O
      - –CHO > –COOH > –CN > >C=O
      - –COOH > –CHO > >C=O > –CN
    answer: 1
    explanation: The seniority order is carboxylic acid > nitrile > aldehyde > ketone, so OHC–CH_2–CN is named 3-oxopropanenitrile and CH_3COCH_2CHO is 3-oxobutanal. Ranking the aldehyde above the nitrile is the usual mistake.
  - id: che-carb-004
    topic: carbonyl-nomenclature-structure
    subtopic: Polarity of the carbonyl group
    concept: Carbonyl carbon is electrophilic and carbonyl oxygen is nucleophilic
    category: concept
    format: statements
    difficulty: 2
    time: 40
    ncert: true
    battle: false
    tags: [carbonyl-structure, polarity, ncert-line]
    stem: Which statement about the structure of the carbonyl group is correct?
    options:
      - In the dipolar resonance structure the negative charge is on carbon and the positive charge is on oxygen.
      - The carbonyl carbon is an electrophilic (Lewis acid) centre and the carbonyl oxygen is a nucleophilic (Lewis base) centre.
      - Carbonyl compounds are less polar than ethers of comparable molecular size.
      - The π electron cloud of the C=O bond lies in the plane of the three σ bonds of the carbonyl carbon.
    answer: 1
    explanation: Oxygen is more electronegative, so the C=O bond is polarised as C^{δ+}–O^{δ−}; the carbon is electrophilic and the oxygen nucleophilic, and carbonyl compounds have larger dipole moments than ethers. The π cloud lies above and below the plane of the sp^2 σ bonds, not in it.
  - id: che-carb-005
    topic: carbonyl-nomenclature-structure
    subtopic: Common and IUPAC names
    concept: Matching common names of carbonyl compounds with IUPAC names
    category: factual
    format: match
    difficulty: 3
    time: 60
    ncert: true
    battle: false
    tags: [iupac, common-names, ncert-line]
    stem: |-
      Match the common name (List I) with the IUPAC name (List II).
      List I
      P. Acrolein
      Q. Isobutyl methyl ketone
      R. Phthalaldehyde
      S. Diisopropyl ketone
      List II
      1. Benzene-1,2-dicarbaldehyde
      2. 2,4-Dimethylpentan-3-one
      3. Prop-2-enal
      4. 4-Methylpentan-2-one
    options:
      - P-1, Q-4, R-3, S-2
      - P-3, Q-2, R-1, S-4
      - P-4, Q-3, R-2, S-1
      - P-3, Q-4, R-1, S-2
    answer: 3
    explanation: Acrolein is CH_2=CHCHO (prop-2-enal), isobutyl methyl ketone is CH_3COCH_2CH(CH_3)_2 (4-methylpentan-2-one), phthalaldehyde has two CHO groups ortho on benzene (benzene-1,2-dicarbaldehyde) and diisopropyl ketone is (CH_3)_2CHCOCH(CH_3)_2 (2,4-dimethylpentan-3-one). Swapping the two ketones is the usual slip.
  - id: che-carb-006
    topic: carbonyl-nomenclature-structure
    subtopic: Isomerism in carbonyl compounds
    concept: C_5H_{10}O has four aldehyde and three ketone structural isomers
    category: numerical
    format: direct
    difficulty: 4
    time: 90
    ncert: false
    battle: false
    tags: [isomerism, counting]
    stem: How many structurally isomeric aldehydes and ketones together have the molecular formula C_5H_{10}O?
    options:
      - "7"
      - "6"
      - "5"
      - "8"
    answer: 0
    explanation: The aldehydes are pentanal, 2-methylbutanal, 3-methylbutanal and 2,2-dimethylpropanal (4), and the ketones are pentan-2-one, pentan-3-one and 3-methylbutan-2-one (3), a total of 7. Missing 3-methylbutan-2-one or 2,2-dimethylpropanal gives the tempting 6.
  - id: che-carb-007
    topic: carbonyl-nomenclature-structure
    subtopic: Compounds with both CHO and ketone groups
    concept: Aldehyde outranks ketone, so the ketone oxygen becomes an oxo prefix
    category: application
    format: direct
    difficulty: 3
    time: 50
    ncert: false
    battle: true
    tags: [iupac, oxo-prefix, priority]
    stem: The IUPAC name of CH_3COCH_2CH_2CHO is
    options:
      - 4-oxopentanal
      - pentane-1,4-dione
      - 2-oxopentanal
      - 5-oxopentan-2-one
    answer: 0
    explanation: The aldehyde has the higher priority, so it provides the suffix and its carbon is C-1; the ketone carbonyl then falls on C-4 and is shown by the prefix oxo, giving 4-oxopentanal. Naming it as a ketone (5-oxopentan-2-one) ignores the higher priority of CHO.
  - id: che-carb-008
    topic: carbonyl-nomenclature-structure
    subtopic: Aromatic ketones
    concept: Acetophenone is 1-phenylethan-1-one
    category: factual
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    tags: [iupac, aromatic-ketone, ncert-line]
    stem: The IUPAC name of acetophenone, C_6H_5COCH_3, is
    options:
      - 1-phenylethan-1-one
      - 2-phenylethan-1-one
      - diphenylmethanone
      - 1-phenylethanal
    answer: 0
    explanation: In C_6H_5COCH_3 the two-carbon chain has the carbonyl group at C-1 and the phenyl group on the same carbon, so the name is 1-phenylethan-1-one (NCERT writes 1-phenylethanone). Diphenylmethanone is benzophenone, C_6H_5COC_6H_5.
  - id: che-carb-009
    topic: carbonyl-nomenclature-structure
    subtopic: Dipole moment of carbonyl compounds
    concept: The polar C=O bond gives carbonyl compounds substantial dipole moments
    category: concept
    format: assertion-reason
    difficulty: 2
    time: 40
    ncert: true
    battle: false
    tags: [carbonyl-structure, dipole-moment]
    stem: |-
      Assertion (A): Aldehydes and ketones have substantial dipole moments.
      Reason (R): Oxygen is more electronegative than carbon, so the C=O bond is polarised with a partial positive charge on carbon.
    options:
      - Both A and R are true and R is the correct explanation of A
      - Both A and R are true but R is not the correct explanation of A
      - A is true but R is false
      - A is false but R is true
    answer: 0
    explanation: The electronegativity difference makes the carbonyl bond polar (C^{δ+}=O^{δ−}), with a significant contribution from the dipolar resonance structure; this polarity is exactly why carbonyl compounds have large dipole moments, larger than those of ethers. R explains A.
  - id: che-carb-010
    topic: carbonyl-nomenclature-structure
    subtopic: Greek-letter locants in common names
    concept: β-Methylbutyraldehyde corresponds to 3-methylbutanal
    category: application
    format: statement-pair
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [common-names, greek-locants, ncert-line]
    stem: |-
      Statement I: The common name β-methylbutyraldehyde corresponds to the IUPAC name 3-methylbutanal.
      Statement II: In common names, the carbon atom directly attached to the carbonyl carbon is designated α.
    options:
      - Both Statement I and Statement II are correct
      - Both Statement I and Statement II are incorrect
      - Statement I is correct but Statement II is incorrect
      - Statement I is incorrect but Statement II is correct
    answer: 0
    explanation: In common names the carbon next to the carbonyl carbon is α, the next is β, and so on. In butyraldehyde the β carbon is C-3 of IUPAC numbering (the CHO carbon being C-1), so β-methylbutyraldehyde is (CH_3)_2CHCH_2CHO, 3-methylbutanal. Both statements are correct.
  - id: che-carb-011
    topic: carbonyl-preparation
    subtopic: Rosenmund reduction
    concept: Acyl chloride hydrogenated over Pd on BaSO_4 gives an aldehyde
    category: factual
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    tags: [rosenmund, named-reaction, ncert-line]
    stem: Benzoyl chloride is converted into benzaldehyde by
    options:
      - LiAlH_4 followed by water
      - zinc amalgam and conc. HCl
      - H_2 over nickel at 523 K
      - H_2 over palladium on barium sulphate
    answer: 3
    explanation: Hydrogenation of an acyl chloride over Pd supported on BaSO_4 (Rosenmund reduction) stops at the aldehyde. Active nickel or LiAlH_4 would reduce the compound further to benzyl alcohol, and Zn–Hg/conc. HCl is the Clemmensen reagent for C=O to CH_2.
  - id: che-carb-012
    topic: carbonyl-preparation
    subtopic: Rosenmund reduction
    concept: BaSO_4 poisons Pd so that reduction stops at the aldehyde stage
    category: concept
    format: assertion-reason
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [rosenmund, catalyst-poison]
    stem: |-
      Assertion (A): In the Rosenmund reduction, the palladium catalyst is supported on barium sulphate.
      Reason (R): Barium sulphate partly poisons palladium, so the aldehyde formed is not reduced further to an alcohol.
    options:
      - Both A and R are true and R is the correct explanation of A
      - Both A and R are true but R is not the correct explanation of A
      - A is true but R is false
      - A is false but R is true
    answer: 0
    explanation: A fully active palladium catalyst would hydrogenate the aldehyde on to a primary alcohol. The BaSO_4 support lowers the activity of the catalyst so that the reaction stops at RCHO. R explains A.
  - id: che-carb-013
    topic: carbonyl-preparation
    subtopic: Stephen reaction
    concept: Nitrile reduced by SnCl_2/HCl to an imine that is hydrolysed to an aldehyde
    category: factual
    format: statements
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [stephen-reaction, named-reaction, confused-pair]
    stem: Which statement about the Stephen reaction is correct?
    options:
      - An acyl chloride is hydrogenated over Pd–BaSO_4 to give an aldehyde.
      - A nitrile is reduced by SnCl_2 and HCl to a primary amine, which is the final product.
      - A nitrile reacts with a Grignard reagent and the adduct is hydrolysed to give a ketone.
      - A nitrile is reduced by SnCl_2 and HCl to an imine, which on hydrolysis gives an aldehyde.
    answer: 3
    explanation: In the Stephen reaction RC≡N is reduced by stannous chloride and HCl to the imine (as its salt), and hydrolysis of the imine gives RCHO. Hydrogenation of acyl chlorides is the Rosenmund reduction, and nitrile plus Grignard reagent is a ketone synthesis.
  - id: che-carb-014
    topic: carbonyl-preparation
    subtopic: DIBAL-H reduction of nitriles
    concept: DIBAL-H reduces C≡N to CHO and leaves a C=C bond intact
    category: application
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [dibal-h, chemoselectivity, ncert-line]
    stem: CH_3CH=CHCH_2CH_2CN is treated with DIBAL-H and then with water. The product is
    options:
      - CH_3CH=CHCH_2CH_2CH_2NH_2
      - CH_3CH=CHCH_2CH_2CHO
      - CH_3CH_2CH_2CH_2CH_2CHO
      - CH_3CH=CHCH_2CH_2CH_2OH
    answer: 1
    explanation: Diisobutylaluminium hydride reduces a nitrile to an imine–aluminium complex that water hydrolyses to the aldehyde, and it does not touch the C=C bond, so hex-4-enal is formed. Complete reduction to the amine needs LiAlH_4 or H_2/Ni.
  - id: che-carb-015
    topic: carbonyl-preparation
    subtopic: Benzaldehyde from toluene
    concept: Etard, chromic oxide–acetic anhydride and benzal chloride routes all give benzaldehyde
    category: application
    format: multi-statement
    difficulty: 4
    time: 90
    ncert: true
    battle: false
    tags: [etard-reaction, benzaldehyde, multi-concept]
    stem: |-
      Which of the following methods convert toluene into benzaldehyde?
      I. CrO_2Cl_2 in CS_2, followed by hydrolysis of the complex
      II. CrO_3 in acetic anhydride, followed by hydrolysis of the benzylidene diacetate
      III. Cl_2 in sunlight to give benzal chloride, followed by hydrolysis
      IV. Hot alkaline KMnO_4, followed by acidification
    options:
      - II, III and IV only
      - I, II, III and IV
      - I and II only
      - I, II and III only
    answer: 3
    explanation: Chromyl chloride (Etard reaction) and chromic oxide in acetic anhydride both stop at the aldehyde stage because they form intermediates that resist further oxidation, and side-chain chlorination to C_6H_5CHCl_2 followed by hydrolysis is the commercial route. Hot KMnO_4 oxidises the side chain completely to benzoic acid.
  - id: che-carb-016
    topic: carbonyl-preparation
    subtopic: Gattermann–Koch reaction
    concept: Benzene with CO and HCl over anhydrous AlCl_3 or CuCl gives benzaldehyde
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [gattermann-koch, named-reaction, ncert-line]
    stem: In the Gattermann–Koch reaction, benzene is converted into benzaldehyde by treatment with
    options:
      - CrO_2Cl_2 followed by hydrolysis
      - CO and HCl in the presence of anhydrous AlCl_3 or CuCl
      - CH_3COCl in the presence of anhydrous AlCl_3
      - CO_2 and NaOH under pressure
    answer: 1
    explanation: Passing carbon monoxide and HCl through benzene with anhydrous AlCl_3 (or CuCl) introduces a CHO group directly. CrO_2Cl_2 (Etard reaction) acts on toluene, not benzene, and CH_3COCl/AlCl_3 gives acetophenone by Friedel–Crafts acylation.
  - id: che-carb-017
    topic: carbonyl-preparation
    subtopic: Ketones from acyl chlorides
    concept: Dialkylcadmium converts an acyl chloride into a ketone
    category: application
    format: direct
    difficulty: 3
    time: 45
    ncert: true
    battle: true
    tags: [dialkylcadmium, ketone-synthesis]
    stem: Which reagent converts ethanoyl chloride into propanone?
    options:
      - (CH_3)_2Cd
      - H_2 over Pd–BaSO_4
      - Excess CH_3MgBr, then H_3O^+
      - CH_3OH in the presence of pyridine
    answer: 0
    explanation: 2CH_3COCl + (CH_3)_2Cd → 2CH_3COCH_3 + CdCl_2; the organocadmium reagent is too weakly nucleophilic to attack the ketone formed. Excess Grignard reagent would add again to give 2-methylpropan-2-ol, Rosenmund conditions give ethanal, and methanol gives methyl ethanoate.
  - id: che-carb-018
    topic: carbonyl-preparation
    subtopic: Ozonolysis of alkenes
    concept: 2,3-Dimethylbut-2-ene gives only propanone on ozonolysis
    category: application
    format: direct
    difficulty: 3
    time: 45
    ncert: true
    battle: true
    tags: [ozonolysis, structure-deduction]
    stem: Which alkene gives only propanone on ozonolysis followed by treatment with Zn and water?
    options:
      - 2-Methylpropene
      - But-2-ene
      - 2,3-Dimethylbut-2-ene
      - 2-Methylbut-2-ene
    answer: 2
    explanation: (CH_3)_2C=C(CH_3)_2 splits at the double bond into two identical (CH_3)_2C=O fragments. 2-Methylpropene gives propanone and methanal, but-2-ene gives two ethanal molecules, and 2-methylbut-2-ene gives propanone and ethanal.
  - id: che-carb-019
    topic: carbonyl-preparation
    subtopic: Hydration of alkynes
    concept: Both but-1-yne and but-2-yne hydrate to butan-2-one
    category: application
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [alkyne-hydration, markovnikov, trap]
    stem: Which alkyne gives butan-2-one on hydration with dilute H_2SO_4 and HgSO_4?
    options:
      - But-1-yne only
      - Both but-1-yne and but-2-yne
      - But-2-yne only
      - Neither; both give butanal
    answer: 1
    explanation: But-1-yne adds water by Markovnikov's rule to give CH_3CH_2C(OH)=CH_2, and symmetrical but-2-yne gives CH_3C(OH)=CHCH_3; both enols tautomerise to CH_3COCH_2CH_3. Only ethyne gives an aldehyde by this method.
  - id: che-carb-020
    topic: carbonyl-preparation
    subtopic: General methods of preparation
    concept: Evaluating preparative methods for aldehydes and ketones
    category: application
    format: multi-statement
    difficulty: 4
    time: 90
    ncert: true
    battle: false
    tags: [preparation, multi-concept, trap]
    stem: |-
      Consider the following statements about the preparation of carbonyl compounds.
      I. Ethanal can be obtained by passing ethyne into dilute H_2SO_4 containing HgSO_4.
      II. Ketones can be prepared from acyl chlorides by the action of dialkylcadmium.
      III. Methanal can be prepared by Rosenmund reduction of methanoyl chloride.
      IV. Nitriles reduced by SnCl_2/HCl and then hydrolysed give ketones.
      Which statements are correct?
    options:
      - I and IV only
      - II and IV only
      - I and II only
      - I, II and III only
    answer: 2
    explanation: I and II are standard NCERT methods. III fails because methanoyl (formyl) chloride is unstable and cannot be isolated, so methanal is not made this way. IV is the Stephen reaction, which gives aldehydes, not ketones.
  - id: che-carb-021
    topic: carbonyl-preparation
    subtopic: Oxidation of primary alcohols
    concept: An aldehyde is distilled off as formed to prevent over-oxidation to the acid
    category: concept
    format: case
    difficulty: 3
    time: 60
    ncert: false
    battle: false
    tags: [oxidation, lab-method]
    stem: A student oxidises propan-1-ol with acidified K_2Cr_2O_7 to prepare propanal and arranges for the propanal to distil out of the flask as soon as it forms. The main reason for this arrangement is that
    options:
      - propanal decomposes into ethene and methanal if it stays in the acidic mixture
      - propan-1-ol would otherwise be dehydrated to propene by the dichromate
      - the oxidation is reversible, and removing propanal shifts the equilibrium forward
      - propanal boils well below propan-1-ol, and removing it at once prevents its further oxidation to propanoic acid
    answer: 3
    explanation: Aldehydes are oxidised to carboxylic acids very easily. Propanal (b.p. 322 K) has no intermolecular hydrogen bonding and distils out well below propan-1-ol (370 K), so it escapes before it can be oxidised further. Dichromate oxidation is not a reversible equilibrium.
  - id: che-carb-022
    topic: carbonyl-preparation
    subtopic: Ketones from nitriles
    concept: Nitrile plus Grignard reagent followed by hydrolysis gives a ketone
    category: application
    format: direct
    difficulty: 3
    time: 45
    ncert: true
    battle: true
    tags: [grignard, nitrile, ketone-synthesis, ncert-line]
    stem: Propanenitrile reacts with phenylmagnesium bromide in dry ether, and the adduct is hydrolysed with dilute acid. The product is
    options:
      - diphenylmethanone
      - propylbenzene
      - 1-phenylpropan-1-ol
      - 1-phenylpropan-1-one
    answer: 3
    explanation: C_6H_5MgBr adds across the C≡N of CH_3CH_2CN to give an imine salt, and hydrolysis converts C=NH into C=O, giving C_6H_5COCH_2CH_3 (propiophenone). An alcohol would need a carbonyl compound, not a nitrile, as the starting material.
  - id: che-carb-023
    topic: carbonyl-physical-properties
    subtopic: Boiling points
    concept: Boiling points n-butane < methoxyethane < propanal < propanone < propan-1-ol
    category: application
    format: ordering
    difficulty: 4
    time: 90
    ncert: true
    battle: false
    tags: [boiling-point, intermolecular-forces, ncert-line]
    stem: Arrange the following compounds of comparable molecular mass in increasing order of boiling point.
    options:
      - n-Butane < methoxyethane < propan-1-ol < propanal < propanone
      - n-Butane < methoxyethane < propanal < propanone < propan-1-ol
      - Methoxyethane < n-butane < propanone < propanal < propan-1-ol
      - n-Butane < propanal < methoxyethane < propanone < propan-1-ol
    answer: 1
    explanation: NCERT values are n-butane 273 K, methoxyethane 281 K, propanal 322 K, propanone 329 K and propan-1-ol 370 K. Dipole–dipole attraction lifts the carbonyl compounds above the hydrocarbon and the ether, but only the alcohol has intermolecular hydrogen bonding.
  - id: che-carb-024
    topic: carbonyl-physical-properties
    subtopic: Physical state
    concept: Methanal is a gas at room temperature
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [physical-state, ncert-line]
    stem: Which carbonyl compound is a gas at room temperature?
    options:
      - Methanal
      - Ethanal
      - Propanone
      - Benzaldehyde
    answer: 0
    explanation: Methanal (HCHO, b.p. about 254 K) is a gas at room temperature. Ethanal is a volatile liquid, and the other aldehydes and ketones are liquids or solids.
  - id: che-carb-025
    topic: carbonyl-physical-properties
    subtopic: Solubility in water
    concept: Lower carbonyls dissolve by hydrogen bonding with water, not with each other
    category: concept
    format: assertion-reason
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [solubility, hydrogen-bonding, trap]
    stem: |-
      Assertion (A): Methanal, ethanal and propanone are miscible with water in all proportions.
      Reason (R): Aldehydes and ketones form strong intermolecular hydrogen bonds among their own molecules.
    options:
      - Both A and R are true and R is the correct explanation of A
      - Both A and R are true but R is not the correct explanation of A
      - A is true but R is false
      - A is false but R is true
    answer: 2
    explanation: The lower carbonyl compounds dissolve because their oxygen accepts hydrogen bonds from water molecules. They have no O–H hydrogen, so they cannot hydrogen-bond with one another, which is also why they boil lower than alcohols. A is true, R is false.
  - id: che-carb-026
    topic: carbonyl-physical-properties
    subtopic: Boiling points
    concept: Carbonyl boiling points lie above hydrocarbons but below alcohols
    category: concept
    format: statement-pair
    difficulty: 2
    time: 40
    ncert: true
    battle: false
    tags: [boiling-point, dipole-dipole]
    stem: |-
      Statement I: Aldehydes and ketones boil at higher temperatures than hydrocarbons of comparable molecular mass.
