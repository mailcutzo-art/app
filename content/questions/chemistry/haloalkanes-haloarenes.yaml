questions:
  - id: che-halo-001
    topic: haloalkane-classification-nomenclature
    subtopic: Halides with an sp3 C–X bond
    concept: In benzylic halides X is on an sp^3 carbon attached to an aromatic ring
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [classification, benzylic-halide, ncert-line]
    stem: In which type of halide is the halogen bonded to an sp^3 carbon that is itself attached directly to a benzene ring?
    options:
      - Aryl halide
      - Benzylic halide
      - Vinylic halide
      - Allylic halide
    answer: 1
    explanation: In benzylic halides such as C_6H_5CH_2Cl the halogen sits on an sp^3 carbon next to the aromatic ring. In aryl halides the halogen is bonded directly to an sp^2 ring carbon, and in allylic halides the sp^3 carbon is next to a C=C bond instead of a ring.
  - id: che-halo-002
    topic: haloalkane-classification-nomenclature
    subtopic: Allylic halides
    concept: 3-Bromopropene is an allylic halide
    category: concept
    format: direct
    difficulty: 2
    time: 25
    ncert: true
    battle: true
    tags: [classification, allylic-halide]
    stem: The halogen compound CH_2=CH–CH_2–Br is classified as
    options:
      - a vinylic halide
      - an aryl halide
      - an allylic halide
      - a benzylic halide
    answer: 2
    explanation: The bromine is on the sp^3 CH_2 carbon next to the C=C double bond, which makes 3-bromopropene (allyl bromide) an allylic halide. In a vinylic halide such as CH_2=CHBr the halogen is on the doubly bonded sp^2 carbon itself.
  - id: che-halo-003
    topic: haloalkane-classification-nomenclature
    subtopic: Vinylic halides
    concept: Halogen on an sp^2 carbon of a C=C bond makes a vinylic halide
    category: application
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [classification, vinylic-halide, trap]
    stem: Which of these compounds is a vinylic halide?
    options:
      - C_6H_5CH_2Cl
      - CH_2=CHCH_2Cl
      - CH_3CH=CHCl
      - C_6H_5Cl
    answer: 2
    explanation: In CH_3CH=CHCl (1-chloroprop-1-ene) chlorine is bonded to an sp^2 carbon of a C=C bond, so it is vinylic. Chlorobenzene also has an sp^2 C–Cl bond but is classed as an aryl halide, while allyl chloride and benzyl chloride have the halogen on an sp^3 carbon.
  - id: che-halo-004
    topic: haloalkane-classification-nomenclature
    subtopic: IUPAC names of haloalkanes
    concept: Neopentyl chloride is 1-chloro-2,2-dimethylpropane
    category: application
    format: direct
    difficulty: 2
    time: 35
    ncert: true
    battle: true
    tags: [iupac-name, ncert-line]
    stem: The IUPAC name of neopentyl chloride, (CH_3)_3CCH_2Cl, is
    options:
      - 1-chloro-2,2-dimethylbutane
      - 3-chloro-2,2-dimethylpropane
      - 1-chloro-2,2-dimethylpropane
      - 2-(chloromethyl)-2-methylpropane
    answer: 2
    explanation: The parent chain carrying the most substituents has three carbons (propane); numbering from the CH_2Cl end gives the locant set 1,2,2, lower than 2,2,3, so the name is 1-chloro-2,2-dimethylpropane. The molecule has only five carbons, so it cannot be a butane with two methyl groups.
  - id: che-halo-005
    topic: haloalkane-classification-nomenclature
    subtopic: Structural isomers of C5H11Br
    concept: C_5H_{11}Br has eight structural isomers
    category: application
    format: direct
    difficulty: 3
    time: 60
    ncert: true
    battle: false
    tags: [isomerism, ncert-line]
    stem: How many structural isomers (ignoring stereoisomers) are possible for C_5H_{11}Br?
    options:
      - "6"
      - "7"
      - "9"
      - "8"
    answer: 3
    explanation: n-Pentane gives three bromides (1-, 2- and 3-bromopentane), 2-methylbutane gives four and 2,2-dimethylpropane gives one, a total of 8. Missing the neopentyl isomer, 1-bromo-2,2-dimethylpropane, is the usual reason for answering 7.
  - id: che-halo-006
    topic: haloalkane-classification-nomenclature
    subtopic: Primary, secondary and tertiary halides
    concept: Of the eight C_5H_{11}Br isomers, three are secondary bromides
    category: application
    format: direct
    difficulty: 4
    time: 100
    ncert: true
    battle: false
    tags: [isomerism, degree-of-halide, ncert-line, multi-concept]
    stem: Of the eight structural isomers of C_5H_{11}Br, how many are secondary alkyl bromides?
    options:
      - "1"
      - "4"
      - "2"
      - "3"
    answer: 3
    explanation: The secondary bromides are 2-bromopentane, 3-bromopentane and 2-bromo-3-methylbutane. Four isomers are primary (1-bromopentane, 1-bromo-2-methylbutane, 1-bromo-3-methylbutane and 1-bromo-2,2-dimethylpropane) and only 2-bromo-2-methylbutane is tertiary.
  - id: che-halo-007
    topic: haloalkane-classification-nomenclature
    subtopic: Dihalogen derivatives
    concept: Geminal dihalides have both halogens on the same carbon
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [gem-dihalide, ncert-line, trap]
    stem: Dihalogen compounds in which both halogen atoms are on the same carbon atom are called
    options:
      - vicinal dihalides
      - alkylene dihalides
      - geminal dihalides
      - allylic dihalides
    answer: 2
    explanation: Geminal (gem) dihalides, commonly called alkylidene halides, carry both halogens on one carbon, e.g. CH_3CHCl_2. Vicinal dihalides have them on adjacent carbons and are the ones called alkylene dihalides, e.g. ClCH_2CH_2Cl.
  - id: che-halo-008
    topic: haloalkane-classification-nomenclature
    subtopic: Common and IUPAC names
    concept: Common names of dihalides and allyl chloride matched to IUPAC names
    category: factual
    format: match
    difficulty: 3
    time: 60
    ncert: true
    battle: false
    tags: [common-names, iupac-name]
    stem: |-
      Match the common names in List I with the IUPAC names in List II.
      List I
      P. Ethylidene chloride
      Q. Ethylene dichloride
      R. Methylene chloride
      S. Allyl chloride
      List II
      1. Dichloromethane
      2. 1,1-Dichloroethane
      3. 1,2-Dichloroethane
      4. 3-Chloropropene
    options:
      - P-3, Q-2, R-1, S-4
      - P-2, Q-3, R-1, S-4
      - P-2, Q-3, R-4, S-1
      - P-3, Q-2, R-4, S-1
    answer: 1
    explanation: Ethylidene chloride is the gem-dihalide CH_3CHCl_2 (1,1-dichloroethane) and ethylene dichloride is the vic-dihalide ClCH_2CH_2Cl (1,2-dichloroethane). Methylene chloride is CH_2Cl_2, and allyl chloride is CH_2=CHCH_2Cl, 3-chloropropene.
  - id: che-halo-009
    topic: haloalkane-classification-nomenclature
    subtopic: Classification by hybridisation
    concept: Allylic and benzylic halides have X on an sp^3 carbon; neopentyl chloride is primary
    category: concept
    format: statements
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [classification, trap]
    stem: Which statement about the classification of organic halides is correct?
    options:
      - (CH_3)_3CCH_2Cl is a tertiary alkyl halide because it contains a quaternary carbon
      - C_6H_5CH_2Cl is an aryl halide because it contains a benzene ring
      - CH_2=CHCl is an allylic halide
      - In allylic and benzylic halides the halogen is bonded to an sp^3 carbon
    answer: 3
    explanation: Allylic and benzylic halides have the halogen on an sp^3 carbon next to a C=C bond or an aromatic ring. Neopentyl chloride is primary because the carbon carrying Cl is attached to only one other carbon; benzyl chloride is benzylic, and vinyl chloride is vinylic.
  - id: che-halo-010
    topic: c-x-bond-nature
    subtopic: Polarity of the C–X bond
    concept: The carbon of the C–X bond carries a partial positive charge
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [bond-polarity]
    stem: In the carbon–halogen bond of a haloalkane, the carbon atom carries
    options:
      - a partial negative charge
      - a partial positive charge
      - a full positive charge
      - no charge, as the bond is non-polar
    answer: 1
    explanation: Halogens are more electronegative than carbon, so the shared pair is pulled towards X; carbon becomes δ+ and the halogen δ−. This electron-deficient carbon is the site attacked by nucleophiles, but the bond is polar covalent, not ionic.
  - id: che-halo-011
    topic: c-x-bond-nature
    subtopic: Bond enthalpy
    concept: C–X bond enthalpy decreases from C–F to C–I
    category: factual
    format: ordering
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [bond-enthalpy, ncert-line]
    stem: The correct order of carbon–halogen bond enthalpy in the methyl halides is
    options:
      - CH_3–I > CH_3–Br > CH_3–Cl > CH_3–F
      - CH_3–Cl > CH_3–F > CH_3–Br > CH_3–I
      - CH_3–F > CH_3–Cl > CH_3–Br > CH_3–I
      - CH_3–F > CH_3–Br > CH_3–Cl > CH_3–I
    answer: 2
    explanation: Down the group the halogen gets larger, the C–X bond gets longer (139, 178, 193, 214 pm) and weaker, so bond enthalpy falls (about 452, 351, 293 and 234 kJ mol^{−1}). The order CH_3Cl > CH_3F belongs to dipole moment, not bond enthalpy.
  - id: che-halo-012
    topic: c-x-bond-nature
    subtopic: Dipole moment
    concept: CH_3Cl has the highest dipole moment among the methyl halides
    category: factual
    format: direct
    difficulty: 3
    time: 30
    ncert: true
    battle: true
    tags: [dipole-moment, trap, ncert-line]
    stem: Which methyl halide has the highest dipole moment?
    options:
      - CH_3F
      - CH_3Cl
      - CH_3Br
      - CH_3I
    answer: 1
    explanation: Dipole moments are CH_3Cl 1.860 D > CH_3F 1.847 D > CH_3Br 1.830 D > CH_3I 1.636 D. Although fluorine is the most electronegative, the very short C–F bond makes the product of charge and distance slightly smaller than for C–Cl.
  - id: che-halo-013
    topic: c-x-bond-nature
    subtopic: C–X bond in haloarenes
    concept: The C–Cl bond in chlorobenzene is shorter; its carbon is sp^2, not sp^3
    category: concept
    format: assertion-reason
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [bond-length, hybridisation, trap]
    stem: |-
      Assertion (A): The C–Cl bond in chlorobenzene (169 pm) is shorter than the C–Cl bond in a haloalkane (about 177 pm).
      Reason (R): The carbon atom of the C–Cl bond in chlorobenzene is sp^3 hybridised.
    options:
      - Both A and R are true and R is the correct explanation of A
      - Both A and R are true but R is not the correct explanation of A
      - A is true but R is false
      - A is false but R is true
    answer: 2
    explanation: The assertion is true; the bond is shorter because resonance gives it partial double bond character and because the carbon is sp^2 hybridised. The reason is false, since an sp^2 carbon (more s character) holds the bond pair more tightly, whereas an sp^3 carbon gives the longer haloalkane bond.
  - id: che-halo-014
    topic: c-x-bond-nature
    subtopic: Bond strength and reactivity
    concept: The strong C–F bond makes alkyl fluorides least reactive despite high polarity
    category: concept
    format: direct
    difficulty: 3
    time: 45
    ncert: true
    battle: true
    tags: [bond-enthalpy, reactivity, trap]
    stem: Although the C–F bond is the most polar carbon–halogen bond, alkyl fluorides are the least reactive in nucleophilic substitution because
    options:
      - F^− is the best leaving group among the halides
      - the carbon of a C–F bond is sp^2 hybridised
      - fluorine has vacant d orbitals that repel nucleophiles
      - the C–F bond is the strongest carbon–halogen bond and is hardest to break
    answer: 3
    explanation: Reactivity in substitution depends mainly on how easily the C–X bond breaks; C–F has the highest bond enthalpy, so R–F reacts slowest (R–I > R–Br > R–Cl > R–F). F^− is in fact the poorest leaving group, and fluorine has no d orbitals.
  - id: che-halo-015
    topic: haloalkane-preparation
    subtopic: From alcohols with thionyl chloride
    concept: SOCl_2 gives pure alkyl chloride because SO_2 and HCl escape as gases
    category: factual
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    tags: [thionyl-chloride, ncert-line]
    stem: Thionyl chloride is preferred for converting an alcohol into an alkyl chloride mainly because
    options:
      - the other products, SO_2 and HCl, are gases that escape and leave a pure alkyl chloride
      - it converts the –OH group into a stronger nucleophile
      - it reacts only with primary alcohols
      - its by-product H_3PO_3 is easily removed by filtration
    answer: 0
    explanation: R–OH + SOCl_2 → R–Cl + SO_2 + HCl; both by-products are escapable gases, so the alkyl chloride is obtained pure. H_3PO_3 is the by-product of PCl_3, not of SOCl_2.
  - id: che-halo-016
    topic: haloalkane-preparation
    subtopic: Alkyl iodides from alcohols
    concept: H_2SO_4 is not used with KI because it oxidises HI to I_2
    category: concept
    format: direct
    difficulty: 3
    time: 45
    ncert: true
    battle: true
    tags: [alkyl-iodide, ncert-line, trap]
    stem: Alkyl iodides are made by heating an alcohol with KI in 95% H_3PO_4 rather than in concentrated H_2SO_4 because concentrated H_2SO_4
    options:
      - oxidises the HI formed to I_2
      - is too weak an acid to produce HI from KI
      - forms insoluble K_2SO_4 that stops the reaction
      - reduces the alcohol to an alkane
    answer: 0
    explanation: Concentrated H_2SO_4 is an oxidising agent and converts the HI produced into I_2, so little alkyl iodide forms; non-oxidising orthophosphoric acid gives good yields. It is not a weak acid, and it does not reduce alcohols.
  - id: che-halo-017
    topic: haloalkane-preparation
    subtopic: Halogen exchange reactions
    concept: Finkelstein makes iodides with NaI; Swarts makes fluorides with metallic fluorides
    category: factual
    format: statement-pair
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [finkelstein, swarts, trap]
    stem: |-
      Statement I: In the Finkelstein reaction an alkyl iodide is converted into an alkyl chloride by NaCl in dry acetone.
      Statement II: In the Swarts reaction an alkyl fluoride is prepared by heating an alkyl chloride with NaI.
    options:
      - Both Statement I and Statement II are correct
      - Both Statement I and Statement II are incorrect
      - Statement I is correct but Statement II is incorrect
      - Statement I is incorrect but Statement II is correct
    answer: 1
    explanation: Both statements get the reagents wrong. Finkelstein converts alkyl chlorides or bromides into alkyl iodides with NaI in dry acetone, while Swarts makes alkyl fluorides by heating alkyl chlorides or bromides with metallic fluorides such as AgF, Hg_2F_2, CoF_2 or SbF_3.
  - id: che-halo-018
    topic: haloalkane-preparation
    subtopic: Finkelstein reaction
    concept: Precipitation of NaCl or NaBr in dry acetone drives the Finkelstein reaction forward
    category: concept
    format: direct
    difficulty: 3
    time: 40
    ncert: true
    battle: true
    tags: [finkelstein, le-chatelier, ncert-line]
    stem: The Finkelstein reaction, R–Cl + NaI → R–I + NaCl in dry acetone, goes nearly to completion because
    options:
      - NaI is insoluble in dry acetone
      - alkyl iodides are more stable than alkyl chlorides
      - acetone reacts with the alkyl chloride first
      - the NaCl formed is insoluble in dry acetone and precipitates out
    answer: 3
    explanation: NaI dissolves in dry acetone but NaCl and NaBr do not, so they precipitate and are removed from the equilibrium; by Le Chatelier's principle the reaction is pushed forward. If NaI were insoluble the reaction would not occur at all.
  - id: che-halo-019
    topic: haloalkane-preparation
    subtopic: Alkyl iodides from alkenes
    concept: But-1-ene → 1-bromobutane (HBr, peroxide) → 1-iodobutane (Finkelstein)
    category: application
    format: direct
    difficulty: 4
    time: 80
    ncert: true
    battle: false
    tags: [conversion, peroxide-effect, finkelstein, multi-concept]
    stem: Which reagent sequence converts but-1-ene into 1-iodobutane?
    options:
      - HI, then NaI in dry acetone
      - HBr in the presence of peroxide, then NaI in dry acetone
      - HBr in the absence of peroxide, then NaI in dry acetone
      - I_2 in CCl_4, then zinc dust
    answer: 1
    explanation: In the presence of peroxide HBr adds anti-Markovnikov, giving 1-bromobutane, and the Finkelstein reaction (NaI in dry acetone) then replaces Br by I. HI, or HBr without peroxide, adds by Markovnikov's rule and puts the halogen on C-2.
  - id: che-halo-020
    topic: haloalkane-preparation
    subtopic: Reactivity of alcohols with HX
    concept: Tertiary alcohols react fastest with HCl and ZnCl_2 (3° > 2° > 1°)
    category: application
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [alcohol-to-halide, reactivity-order]
    stem: Which alcohol reacts fastest with concentrated HCl in the presence of anhydrous ZnCl_2?
    options:
      - CH_3CH_2CH_2CH_2OH
      - CH_3CH(OH)CH_2CH_3
      - (CH_3)_3COH
      - (CH_3)_2CHCH_2OH
    answer: 2
    explanation: The order of reactivity of alcohols with a given halogen acid is 3° > 2° > 1°, because the tertiary alcohol can react through the most stable carbocation. Tertiary alcohols react even on simple shaking with concentrated HCl at room temperature.
  - id: che-halo-021
    topic: haloalkane-preparation
    subtopic: From alcohols
    concept: Conditions for converting alcohols to haloalkanes; phenols do not react this way
    category: application
    format: multi-statement
    difficulty: 3
    time: 70
    ncert: true
    battle: false
    tags: [alcohol-to-halide, ncert-line]
    stem: |-
      Consider these statements about preparing haloalkanes from alcohols.
      I. Primary and secondary alcohols need anhydrous ZnCl_2 as a catalyst when treated with HCl.
      II. Tertiary alcohols react with concentrated HCl simply on shaking at room temperature.
      III. PBr_3 and PI_3 are usually generated in situ from red phosphorus and the halogen.
      IV. Phenols are easily converted into aryl chlorides by heating with concentrated HCl.
      Which statements are correct?
    options:
      - I and II only
      - II, III and IV only
      - I, II and III only
      - I, III and IV only
    answer: 2
    explanation: Statements I, II and III are NCERT facts. IV is wrong because the C–O bond in phenols has partial double bond character and is difficult to break, so these methods do not give aryl halides.
  - id: che-halo-022
    topic: haloalkane-preparation
    subtopic: Free radical halogenation
    concept: Monochlorination of 2-methylbutane gives four structural isomers
    category: application
    format: direct
    difficulty: 3
    time: 45
    ncert: true
    battle: true
    tags: [free-radical-halogenation, isomerism, ncert-line]
    stem: Free-radical monochlorination of 2-methylbutane, (CH_3)_2CHCH_2CH_3, can give how many structural isomers?
    options:
      - "3"
      - "5"
      - "2"
      - "4"
    answer: 3
    explanation: 2-Methylbutane has four kinds of hydrogen, giving 1-chloro-2-methylbutane, 2-chloro-2-methylbutane, 2-chloro-3-methylbutane and 1-chloro-3-methylbutane. The two CH_3 groups on C-2 are equivalent, so 5 overcounts.
  - id: che-halo-023
    topic: haloalkane-preparation
    subtopic: Free radical halogenation
    concept: A C5H10 inert to Cl2 in the dark but giving one monochloride in light is cyclopentane
    category: application
    format: direct
    difficulty: 4
    time: 100
    ncert: true
    battle: false
    tags: [free-radical-halogenation, structure-deduction, multi-concept]
    stem: A hydrocarbon C_5H_{10} does not react with chlorine in the dark but gives a single monochloro compound, C_5H_9Cl, in bright sunlight. The hydrocarbon is
    options:
      - pent-1-ene
      - cyclopentane
      - methylcyclobutane
      - 2-methylbut-2-ene
    answer: 1
    explanation: No reaction in the dark rules out a C=C bond (alkenes add Cl_2 readily), so C_5H_{10} must be a cycloalkane. All ten hydrogens of cyclopentane are equivalent, giving one monochloride, whereas methylcyclobutane would give four structural isomers.
  - id: che-halo-024
    topic: haloalkane-preparation
    subtopic: Conversions
    concept: 1-Bromopropane → propene (alc. KOH) → 2-bromopropane (HBr, Markovnikov)
    category: application
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [conversion, markovnikov, multi-concept]
    stem: Which reagent sequence converts 1-bromopropane into 2-bromopropane?
    options:
      - aqueous KOH, then HBr
      - alcoholic KOH, then HBr in the absence of peroxide
      - alcoholic KOH, then HBr in the presence of peroxide
      - Na in dry ether, then HBr
    answer: 1
    explanation: Alcoholic KOH eliminates HBr to give propene, and HBr then adds by Markovnikov's rule to give 2-bromopropane. With peroxide, HBr adds anti-Markovnikov and would give back 1-bromopropane, while aqueous KOH gives propan-1-ol.
  - id: che-halo-025
    topic: haloalkane-preparation
    subtopic: Addition of halogens to alkenes
    concept: Br_2 in CCl_4 adds to alkenes giving colourless vic-dibromides
    category: factual
    format: direct
    difficulty: 2
    time: 25
    ncert: true
    battle: true
    tags: [vic-dihalide, ncert-line]
    stem: When bromine in CCl_4 is added to an alkene, its reddish-brown colour disappears. The colourless product is a
    options:
      - gem-dibromide
      - vic-dibromide
      - bromohydrin
      - monobromoalkane
    answer: 1
    explanation: Br_2 adds across the C=C bond, placing one bromine on each doubly bonded carbon, so a vicinal (1,2-) dibromide forms. This decolourisation is a laboratory test for unsaturation; a gem-dibromide would need both bromines on the same carbon.
  - id: che-halo-026
    topic: haloalkane-preparation
    subtopic: Carbocation rearrangement
    concept: 3-Methylbutan-2-ol with HBr gives 2-bromo-2-methylbutane via a hydride shift
    category: application
    format: direct
    difficulty: 4
    time: 90
    ncert: false
    battle: false
    tags: [rearrangement, carbocation, trap]
    stem: 3-Methylbutan-2-ol, CH_3CH(OH)CH(CH_3)_2, is heated with concentrated HBr. The major product is
    options:
      - 2-bromo-3-methylbutane
      - 1-bromo-3-methylbutane
      - 1-bromo-2-methylbutane
      - 2-bromo-2-methylbutane
    answer: 3
    explanation: Loss of water from the protonated alcohol gives a secondary carbocation, which undergoes a 1,2-hydride shift to the more stable tertiary carbocation (CH_3)_2C^+CH_2CH_3. Bromide then attacks it, giving 2-bromo-2-methylbutane; the unrearranged 2-bromo-3-methylbutane is the trap.
  - id: che-halo-027
    topic: haloarene-preparation
    subtopic: Sandmeyer reaction
    concept: Diazonium salt with Cu_2Cl_2 and HCl gives chlorobenzene
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [sandmeyer, diazonium]
    stem: In Sandmeyer's reaction, benzenediazonium chloride is converted into chlorobenzene by treating it with
    options:
      - Cu_2Cl_2 and HCl
      - Cl_2 and anhydrous FeCl_3
      - SOCl_2
