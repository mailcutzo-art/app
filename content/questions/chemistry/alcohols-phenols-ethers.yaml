    answer: 1
    explanation: Lithium aluminium hydride is a strong reducing agent that converts RCOOH into RCH_2OH. NaBH_4 is too mild to reduce carboxylic acids, and Zn–Hg/conc. HCl reduces the carbonyl group of aldehydes and ketones to CH_2.
  - id: che-ape-023
