questions:
  - id: che-ape-001
    topic: alcohol-classification-nomenclature
    subtopic: Mono-, di- and trihydric compounds
    concept: Glycerol has three –OH groups on sp^3 carbons and is a trihydric alcohol
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [classification, polyhydric]
    stem: Glycerol (propane-1,2,3-triol) is classified as a
    options:
      - trihydric alcohol
      - dihydric alcohol
      - monohydric alcohol
      - trihydric phenol
    answer: 0
    explanation: Glycerol, HOCH_2–CH(OH)–CH_2OH, carries three –OH groups, each on an sp^3 carbon, so it is a trihydric alcohol. It is not a phenol because no –OH group is attached to an aromatic ring.
  - id: che-ape-002
    topic: alcohol-classification-nomenclature
    subtopic: Allylic, benzylic and vinylic alcohols
    concept: In allylic alcohols the –OH is on an sp^3 carbon next to a C=C bond
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [classification, allylic-alcohol, trap]
    stem: Which of the following is an allylic alcohol?
    options:
      - CH_2=CH–CH_2–OH
      - CH_2=CH–OH
      - CH_3–CH_2–CH_2–OH
      - C_6H_5–CH_2–OH
    answer: 0
    explanation: In prop-2-en-1-ol the –OH is on an sp^3 carbon next to the C=C bond, the defining feature of an allylic alcohol. In CH_2=CH–OH the –OH sits on the double-bonded carbon itself (vinylic alcohol), and C_6H_5CH_2OH is benzylic.
  - id: che-ape-003
    topic: alcohol-classification-nomenclature
    subtopic: Allylic, benzylic and vinylic alcohols
    concept: 1-Phenylethanol is a secondary benzylic alcohol
    category: concept
    format: direct
    difficulty: 3
    time: 45
    ncert: true
    battle: true
    tags: [classification, benzylic-alcohol]
    stem: C_6H_5–CH(OH)–CH_3 is best described as a
    options:
      - primary benzylic alcohol
      - secondary benzylic alcohol
      - tertiary benzylic alcohol
      - secondary allylic alcohol
    answer: 1
    explanation: The carbinol carbon carries the –OH, one phenyl group and one methyl group, so it is bonded to two carbons (secondary). Because this sp^3 carbon is attached directly to an aromatic ring, the alcohol is benzylic, not allylic.
  - id: che-ape-004
    topic: alcohol-classification-nomenclature
    subtopic: Compounds with a C(sp2)–OH bond
    concept: Vinylic alcohols and phenols contain a C_{sp^2}–OH bond
    category: application
    format: multi-statement
    difficulty: 3
    time: 60
    ncert: true
    battle: false
    tags: [classification, hybridisation]
    stem: |-
      Consider the compounds
      I. CH_2=CH–OH
      II. C_6H_5–OH
      III. CH_2=CH–CH_2–OH
      IV. C_6H_5–CH_2–OH
      In which of them is the –OH group bonded to an sp^2 hybridised carbon?
    options:
      - I and II only
      - I and III only
      - II and IV only
      - I, II and III only
    answer: 0
    explanation: In ethenol (a vinylic alcohol) and in phenol the –OH is attached directly to a doubly bonded or aromatic carbon, which is sp^2. In the allylic (III) and benzylic (IV) alcohols the carbon bearing –OH is sp^3, even though it is next to an sp^2 carbon.
  - id: che-ape-005
    topic: alcohol-classification-nomenclature
    subtopic: Common and IUPAC names of alcohols
    concept: Isobutyl alcohol is 2-methylpropan-1-ol
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [iupac-name, common-name, confused-pair]
    stem: The IUPAC name of isobutyl alcohol is
    options:
      - butan-2-ol
      - 2-methylpropan-2-ol
      - butan-1-ol
      - 2-methylpropan-1-ol
    answer: 3
    explanation: Isobutyl alcohol is (CH_3)_2CH–CH_2–OH; the longest chain containing the carbinol carbon has three carbons with a methyl group at C-2, so it is 2-methylpropan-1-ol. sec-Butyl alcohol is butan-2-ol and tert-butyl alcohol is 2-methylpropan-2-ol.
  - id: che-ape-006
    topic: alcohol-classification-nomenclature
    subtopic: IUPAC names of alcohols
    concept: The chain is numbered from the end nearer the –OH group
    category: application
    format: direct
    difficulty: 3
    time: 45
    ncert: true
    battle: true
    tags: [iupac-name, numbering]
    stem: The IUPAC name of CH_3–CH(CH_3)–CH_2–CH(OH)–CH_3 is
    options:
      - 4-methylpentan-2-ol
      - 2-methylpentan-4-ol
      - 1,3-dimethylbutan-1-ol
      - 4-methylhexan-2-ol
    answer: 0
    explanation: The longest chain containing the carbon bearing –OH has five carbons, and it is numbered from the end nearer the –OH, which puts –OH at C-2 and the methyl group at C-4. Numbering from the other end (2-methylpentan-4-ol) gives the –OH a higher locant, which is wrong.
  - id: che-ape-007
    topic: alcohol-classification-nomenclature
    subtopic: Nomenclature of ethers
    concept: Anisole is methoxybenzene
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [iupac-name, ethers, common-name]
    stem: The IUPAC name of anisole, C_6H_5–O–CH_3, is
    options:
      - ethoxybenzene
      - phenoxymethane
      - methoxybenzene
      - methyl phenyl ether
    answer: 2
    explanation: In IUPAC naming an ether is treated as a hydrocarbon carrying an alkoxy group, with the larger group (benzene) as the parent, so C_6H_5OCH_3 is methoxybenzene. Methyl phenyl ether is its common name, and ethoxybenzene is phenetole.
  - id: che-ape-008
    topic: alcohol-classification-nomenclature
    subtopic: Naming substituted phenols
    concept: Substituted phenols take –OH at C-1, lowest locants and alphabetical prefixes
    category: application
    format: diagram
    difficulty: 3
    time: 60
    ncert: true
    battle: false
    diagram: Bond-line drawing of a benzene ring. One ring carbon (drawn at the top) carries an –OH group. The ring carbon immediately to its right (ortho to –OH) carries a –CH_3 group. The ring carbon directly opposite the –OH carbon (para to –OH, at the bottom) carries a –Br atom. The other three ring carbons carry hydrogen atoms.
    tags: [iupac-name, phenols]
    stem: What is the IUPAC name of the compound shown in the figure?
    options:
      - 2-methyl-4-bromophenol
      - 4-bromo-2-methylphenol
      - 4-bromo-6-methylphenol
      - 1-bromo-3-methyl-4-hydroxybenzene
    answer: 1
    explanation: The ring carbon bearing –OH is C-1 of the parent phenol; numbering towards the methyl group gives the lowest locant set (2, 4), and prefixes are cited alphabetically (bromo before methyl), so the name is 4-bromo-2-methylphenol. Writing methyl first ignores the alphabetical rule, and 6-methyl gives a higher locant set.
  - id: che-ape-009
    topic: alcohol-classification-nomenclature
    subtopic: Common names of phenols and ethers
