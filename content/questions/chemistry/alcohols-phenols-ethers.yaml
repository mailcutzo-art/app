  - id: che-ape-010
    topic: alcohol-classification-nomenclature
    subtopic: Isomers of C7H8O
    concept: Of the five aromatic C_7H_8O isomers, only the three cresols are phenols
    category: application
    format: direct
    difficulty: 4
    time: 90
    ncert: true
    battle: false
    tags: [isomerism, cresols, trap]
    stem: How many of the aromatic isomers of molecular formula C_7H_8O are phenols?
    options:
      - "2"
      - "3"
      - "4"
      - "5"
    answer: 1
    explanation: The aromatic isomers of C_7H_8O are o-, m- and p-cresol (phenols), benzyl alcohol (an alcohol, with –OH on an sp^3 carbon) and anisole (an ether). Only the three cresols have –OH on the ring, so the answer is 3; counting all five isomers is the usual slip.
  - id: che-ape-011
    topic: alcohol-classification-nomenclature
    subtopic: Symmetrical and unsymmetrical ethers
    concept: An ether with two different groups on oxygen is mixed (unsymmetrical)
    category: concept
    format: statements
    difficulty: 3
    time: 45
    ncert: true
    battle: false
    tags: [classification, ethers]
    stem: Which statement about the classification of ethers is correct?
    options:
      - C_2H_5–O–C_2H_5 is an unsymmetrical ether
      - C_2H_5–O–C_6H_5 is a mixed (unsymmetrical) ether
      - CH_3–O–CH_3 is a mixed ether because oxygen links two carbon atoms
      - Anisole is a symmetrical ether because both groups are hydrocarbon groups
    answer: 1
    explanation: An ether is simple (symmetrical) when both groups on oxygen are the same and mixed (unsymmetrical) when they differ. C_2H_5OC_6H_5 has an ethyl and a phenyl group, so it is mixed; diethyl ether and dimethyl ether are symmetrical, and anisole (CH_3 and C_6H_5) is unsymmetrical.
  - id: che-ape-012
    topic: structure-bonding
    subtopic: Bond angles and bond lengths
    concept: C–O–H angle of methanol, C–O length of phenol and C–O–C angle of methoxymethane
    category: factual
    format: diagram
    difficulty: 4
    time: 90
    ncert: true
    battle: false
    diagram: Three structures drawn side by side. (a) Methanol, H_3C–O–H, with the C–O–H bond angle marked X. (b) Phenol, a benzene ring carrying –OH, with the ring C–O bond length marked Y. (c) Methoxymethane, H_3C–O–CH_3, with the C–O–C bond angle marked Z. Each oxygen shows two lone pairs.
    tags: [bond-angle, bond-length, ncert-line]
    stem: In the figure, the values X, Y and Z are respectively
    options:
      - "104.5°, 142 pm and 109.5°"
      - "111.7°, 136 pm and 108.9°"
      - "108.9°, 136 pm and 111.7°"
      - "108.9°, 142 pm and 105.0°"
    answer: 2
    explanation: NCERT gives the C–O–H angle of methanol as 108.9° (below the tetrahedral value because of lone-pair repulsion), the C–O bond of phenol as 136 pm (shorter than 142 pm in methanol) and the C–O–C angle of methoxymethane as 111.7° (opened up by repulsion between the bulky methyl groups). Swapping the two angles is the usual mistake.
  - id: che-ape-013
    topic: structure-bonding
    subtopic: C–O bond length in phenol
    concept: Partial double-bond character and an sp^2 carbon shorten the C–O bond of phenol
    category: concept
    format: assertion-reason
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [bond-length, resonance, ncert-line]
    stem: |-
      Assertion (A): The carbon–oxygen bond in phenol is shorter than that in methanol.
      Reason (R): In phenol the lone pair on oxygen is conjugated with the ring, giving the C–O bond partial double-bond character, and the carbon bearing –OH is sp^2 hybridised.
    options:
      - A is true but R is false
      - Both A and R are true and R is the correct explanation of A
      - A is false but R is true
      - Both A and R are true but R is not the correct explanation of A
    answer: 1
    explanation: The C–O bond of phenol (136 pm) is shorter than that of methanol (142 pm). NCERT attributes this to partial double-bond character from conjugation of the oxygen lone pair with the ring and to the sp^2 state of the carbon, so R explains A.
  - id: che-ape-014
    topic: structure-bonding
    subtopic: Structure of ethers
    concept: The C–O–C angle exceeds the tetrahedral angle because the alkyl groups repel
    category: concept
    format: direct
    difficulty: 3
    time: 45
    ncert: true
    battle: true
    tags: [bond-angle, ethers]
    stem: The C–O–C bond angle in methoxymethane is slightly greater than the tetrahedral angle because of
    options:
      - sp^2 hybridisation of oxygen in ethers
      - repulsion between the two bulky alkyl groups
      - delocalisation of the oxygen lone pairs into the C–O bonds
      - hydrogen bonding between ether molecules
    answer: 1
    explanation: The ether oxygen has two bond pairs and two lone pairs in a roughly tetrahedral arrangement; repulsion between the two bulky alkyl groups opens the angle to about 111.7°. Ethers have no O–H hydrogen, so they cannot hydrogen bond with one another.
  - id: che-ape-015
    topic: structure-bonding
    subtopic: Electron pairs on oxygen
    concept: The ether oxygen has two bond pairs and two lone pairs arranged roughly tetrahedrally
    category: concept
    format: statements
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [hybridisation, structure]
    stem: Which statement about the bonding in alcohols, phenols and ethers is correct?
    options:
      - In phenol, the –OH group is attached to an sp^3 hybridised carbon
      - The C–O–H angle in alcohols is larger than the tetrahedral angle because of lone-pair repulsion
      - In ethers, the two bond pairs and two lone pairs on oxygen are arranged approximately tetrahedrally
      - In methanol, the oxygen atom is sp^2 hybridised
    answer: 2
    explanation: NCERT describes the ether oxygen as having two bond pairs and two lone pairs in an approximately tetrahedral arrangement. In phenol the –OH is on an sp^2 ring carbon, the C–O–H angle of alcohols is slightly smaller (not larger) than tetrahedral, and the oxygen of methanol is sp^3.
  - id: che-ape-016
    topic: structure-bonding
    subtopic: Orbital overlap in the C–O bond
    concept: The C–O σ bond in alcohols comes from sp^3–sp^3 overlap
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [hybridisation, ncert-line]
    stem: In alcohols, the C–O σ bond is formed by overlap of
    options:
      - an sp^2 orbital of carbon with a p orbital of oxygen
      - an sp^3 orbital of carbon with a p orbital of oxygen
      - an sp orbital of carbon with an sp^3 orbital of oxygen
      - an sp^3 orbital of carbon with an sp^3 orbital of oxygen
    answer: 3
    explanation: NCERT states that the oxygen of the –OH group is attached to carbon by a σ bond formed by overlap of an sp^3 hybridised orbital of carbon with an sp^3 hybridised orbital of oxygen.
  - id: che-ape-017
    topic: alcohol-preparation
    subtopic: Acid-catalysed hydration of alkenes
    concept: Hydration of propene follows Markovnikov's rule and gives propan-2-ol
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [hydration, markovnikov]
    stem: Acid-catalysed hydration of propene gives mainly
    options:
      - propan-1-ol
      - propanal
      - propane-1,2-diol
      - propan-2-ol
    answer: 3
    explanation: Protonation of propene gives the more stable secondary carbocation CH_3–C^+H–CH_3, which water attacks; loss of H^+ then gives propan-2-ol, in line with Markovnikov's rule. Propan-1-ol is the product of hydroboration–oxidation.
  - id: che-ape-018
    topic: alcohol-preparation
    subtopic: Hydroboration–oxidation
    concept: Hydroboration–oxidation of propene gives propan-1-ol
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [hydroboration, anti-markovnikov, confused-pair]
    stem: Propene is treated with diborane and the product is oxidised with alkaline H_2O_2. The alcohol formed is
    options:
      - propan-2-ol
      - propan-1-ol
      - propanone
      - propane-1,2-diol
    answer: 1
    explanation: Boron adds to the less substituted terminal carbon, giving (CH_3CH_2CH_2)_3B, and oxidation with H_2O_2/OH^- replaces boron by –OH, so propan-1-ol is obtained. The net result looks like anti-Markovnikov addition of water.
  - id: che-ape-019
    topic: alcohol-preparation
    subtopic: Alcohols from Grignard reagents
    concept: Methanal gives 1°, other aldehydes 2° and ketones 3° alcohols with RMgX
    category: application
    format: match
    difficulty: 3
    time: 75
    ncert: true
    battle: false
    tags: [grignard, match]
    stem: |-
      Match the reactants (List I), each followed by hydrolysis, with the alcohol formed (List II).
      List I
      P. CH_3MgBr + HCHO
      Q. CH_3MgBr + CH_3CHO
      R. CH_3MgBr + CH_3COCH_3
      S. C_2H_5MgBr + HCHO
      List II
      1. Propan-2-ol
      2. Ethanol
      3. Propan-1-ol
      4. 2-Methylpropan-2-ol
    options:
      - P-2, Q-4, R-1, S-3
      - P-2, Q-1, R-4, S-3
      - P-3, Q-1, R-4, S-2
      - P-1, Q-2, R-4, S-3
    answer: 1
    explanation: RMgX adds R to the carbonyl carbon. Methanal gives primary alcohols (CH_3CH_2OH from CH_3MgBr, CH_3CH_2CH_2OH from C_2H_5MgBr), ethanal gives the secondary alcohol CH_3CH(OH)CH_3, and propanone gives the tertiary alcohol (CH_3)_3COH.
  - id: che-ape-020
    topic: alcohol-preparation
    subtopic: Alcohols from Grignard reagents
    concept: Ketones give tertiary and methanal gives primary alcohols with RMgX
    category: concept
    format: statement-pair
    difficulty: 3
    time: 45
    ncert: true
    battle: false
    tags: [grignard, trap]
    stem: |-
      Statement I: Reaction of a Grignard reagent with a ketone followed by hydrolysis gives a secondary alcohol.
      Statement II: Reaction of a Grignard reagent with methanal followed by hydrolysis gives a primary alcohol.
    options:
      - Statement I is incorrect but Statement II is correct
      - Both Statement I and Statement II are correct
      - Statement I is correct but Statement II is incorrect
      - Both Statement I and Statement II are incorrect
    answer: 0
    explanation: A ketone already has two carbon groups on the carbonyl carbon, so adding R from RMgX gives a tertiary alcohol, which makes Statement I wrong. Methanal has no carbon group on its carbonyl carbon, so it gives RCH_2OH, a primary alcohol.
