  - id: che-ape-024
    topic: alcohol-preparation
    subtopic: Mechanism of hydration
    concept: Hydration begins with protonation of the alkene by H_3O^+ to give a carbocation
    category: concept
    format: direct
    difficulty: 3
    time: 45
    ncert: true
    battle: true
    tags: [mechanism, hydration, ncert-line]
    stem: The first step in the acid-catalysed hydration of ethene to ethanol is
    options:
      - nucleophilic attack of water on ethene
      - deprotonation of an oxonium ion
      - attack of OH^- on a carbocation
      - protonation of ethene by H_3O^+ to form a carbocation
    answer: 3
    explanation: NCERT gives three steps, protonation of the alkene by electrophilic attack of H_3O^+ to form a carbocation, nucleophilic attack of water on the carbocation, and deprotonation of the oxonium ion to give the alcohol. OH^- is not the nucleophile in acid medium.
  - id: che-ape-025
    topic: alcohol-preparation
    subtopic: Rearrangement during hydration
    concept: A 1,2-methyl shift turns the 2° carbocation into a more stable 3° carbocation
    category: application
    format: direct
    difficulty: 4
    time: 100
    ncert: false
    battle: false
    tags: [rearrangement, carbocation, trap, multi-concept]
    stem: Acid-catalysed hydration of 3,3-dimethylbut-1-ene gives mainly
    options:
      - 3,3-dimethylbutan-2-ol
      - 3,3-dimethylbutan-1-ol
      - 2,2-dimethylbutan-1-ol
      - 2,3-dimethylbutan-2-ol
    answer: 3
    explanation: Protonation gives the secondary carbocation (CH_3)_3C–C^+H–CH_3. A 1,2-methyl shift converts it into the more stable tertiary carbocation (CH_3)_2C^+–CH(CH_3)_2, which water captures to give 2,3-dimethylbutan-2-ol. The unrearranged 3,3-dimethylbutan-2-ol is the tempting but minor answer.
  - id: che-ape-026
    topic: alcohol-preparation
    subtopic: Choosing hydration or hydroboration
    concept: 2-Methylpropene gives different alcohols by hydration and by hydroboration–oxidation
    category: application
    format: case
    difficulty: 3
    time: 60
    ncert: true
    battle: false
    tags: [hydroboration, hydration, multi-concept]
    stem: An alkene X gives 2-methylpropan-1-ol on hydroboration–oxidation, but 2-methylpropan-2-ol on acid-catalysed hydration. X is
    options:
      - but-1-ene
      - but-2-ene
      - 2-methylbut-2-ene
      - 2-methylpropene
    answer: 3
    explanation: Both alcohols have the (CH_3)_2C skeleton with four carbons, so X is (CH_3)_2C=CH_2. Hydration puts –OH on the more substituted carbon through the tertiary carbocation, giving (CH_3)_3COH, while hydroboration–oxidation puts –OH on the terminal CH_2, giving (CH_3)_2CHCH_2OH.
  - id: che-ape-027
    topic: alcohol-preparation
