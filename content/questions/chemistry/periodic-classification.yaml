    options:
      - "65"
      - "72.6"
      - "70"
      - "68"
    answer: 2
    explanation: NCERT compares Mendeleev's prediction of 68 for eka-aluminium with the observed value of 70 for gallium. 72.6 is the observed atomic weight of germanium (eka-silicon), a common mix-up.

  - id: che-per-013
    topic: mendeleev-table
    subtopic: Mendeleev's table
    concept: Noble gases were added later as a separate group
    category: factual
    format: statements
    difficulty: 3
    time: 45
    ncert: false
    battle: false
    tags: [mendeleev, noble-gases]
    stem: Which statement about Mendeleev's original (1869) periodic table is correct?
    options:
      - It contained a separate group for the noble gases.
      - It was based on the atomic numbers of the elements.
      - It had no gaps, as all elements were known by then.
      - The noble gases were unknown then and were fitted in later as a separate group.
    answer: 3
    explanation: The noble gases were discovered only in the 1890s and were accommodated later as a new group (group zero). The 1869 table was based on atomic weights and famously left gaps for undiscovered elements.

