questions:
  - id: che-per-001
    topic: early-classification
    subtopic: Döbereiner's triads
    concept: Identifying a valid Döbereiner triad
    category: factual
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    tags: [dobereiner, triads, ncert-line]
    stem: Which of the following sets of elements is a Döbereiner triad?
    options:
      - Na, Mg, Al
      - N, O, F
      - Li, Na, K
      - Be, B, C
    answer: 2
    explanation: Döbereiner grouped chemically similar elements in threes (triads) such as Li, Na, K; Ca, Sr, Ba; and Cl, Br, I. The other sets are consecutive elements of one period, which have very different properties.

  - id: che-per-002
    topic: early-classification
    subtopic: Döbereiner's triads
    concept: Middle element's atomic mass ≈ mean of the other two in a triad
    category: numerical
    format: direct
    difficulty: 3
    time: 45
    ncert: true
    battle: true
    formula: M(middle) ≈ [M(first) + M(third)]/2
    tags: [dobereiner, triads]
    stem: In the triad Ca (40), Sr, Ba (137), the atomic mass of strontium predicted by the law of triads is about
    options:
      - "97"
      - "88.5"
      - "177"
      - "48.5"
    answer: 1
    explanation: By the law of triads the middle element's atomic mass is roughly the average of the other two, (40 + 137)/2 = 88.5, close to the actual 87.6 of Sr. The value 177 is the sum, not the mean.

  - id: che-per-003
    topic: early-classification
    subtopic: Newlands' law of octaves
    concept: Law of octaves held only up to calcium
    category: factual
    format: direct
    difficulty: 2
    time: 25
    ncert: true
    battle: true
    tags: [newlands, octaves, ncert-line]
    stem: Newlands' law of octaves was found to hold good only up to which element?
    options:
      - Potassium
      - Argon
      - Calcium
      - Iron
    answer: 2
    explanation: Newlands noticed that every eighth element resembled the first, like the eighth note of a musical octave, but the relationship worked only for the lighter elements up to calcium. Beyond calcium the repetition broke down.

  - id: che-per-004
    topic: early-classification
