    battle: true
    tags: [mendeleev, eka-elements, ncert-line]
    stem: The element Mendeleev called eka-silicon was later discovered and named
    options:
      - gallium
      - scandium
      - tin
      - germanium
    answer: 3
    explanation: Mendeleev left a gap below silicon and called the missing element eka-silicon; germanium, discovered in 1886, fitted his predictions closely. Gallium was eka-aluminium and scandium was eka-boron.

  - id: che-per-009
