    concept: Chancourtois made a cylindrical table showing periodic recurrence (1862)
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [chancourtois, history]
    stem: Who, in 1862, arranged the known elements by increasing atomic weight on a cylindrical table to show the periodic recurrence of properties?
    options:
      - A. E. B. de Chancourtois
      - J. W. Döbereiner
      - Lothar Meyer
      - Henry Moseley
    answer: 0
    explanation: In 1862 the French geologist de Chancourtois drew the elements on a cylindrical (helical) table in order of increasing atomic weight; it attracted little attention. Döbereiner worked with triads, Lothar Meyer with atomic-volume curves and Moseley with X-ray frequencies.

  - id: che-per-005
    topic: early-classification
    subtopic: Lothar Meyer's curves
    concept: Lothar Meyer plotted atomic volume against atomic weight
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [lothar-meyer, history]
    stem: Lothar Meyer showed periodicity by plotting which physical property against atomic weight?
    options:
      - Ionization enthalpy
      - Electronegativity
      - Density of the oxide
      - Atomic volume
    answer: 3
    explanation: Lothar Meyer plotted physical properties such as atomic volume, melting point and boiling point against atomic weight and obtained a periodically repeating curve. Ionization enthalpy and electronegativity were not available as periodic data then.

  - id: che-per-006
    topic: early-classification
    subtopic: Newlands' law of octaves
    concept: Newlands received the Davy Medal in 1887
    category: factual
    format: statement-pair
    difficulty: 3
    time: 45
    ncert: true
    battle: false
    tags: [newlands, ncert-line, trap]
    stem: |-
      Statement I: Newlands' law of octaves was widely accepted as soon as it was proposed in 1865.
      Statement II: Newlands was later awarded the Davy Medal by the Royal Society of London in 1887.
    options:
      - Both Statement I and Statement II are correct
      - Both Statement I and Statement II are incorrect
      - Statement I is correct but Statement II is incorrect
      - Statement I is incorrect but Statement II is correct
    answer: 3
    explanation: Newlands' idea was initially ridiculed and not accepted, so Statement I is wrong. His work was recognised much later when the Royal Society awarded him the Davy Medal in 1887, so Statement II is right.

  - id: che-per-007
    topic: mendeleev-table
    subtopic: Mendeleev's periodic law
    concept: Mendeleev's periodic law is based on atomic weight
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [mendeleev, periodic-law, trap]
    stem: According to Mendeleev's periodic law, the properties of elements are a periodic function of their
    options:
      - atomic numbers
      - atomic weights
      - number of valence electrons
      - atomic volumes
    answer: 1
    explanation: Mendeleev stated that the properties of elements are a periodic function of their atomic weights. Atomic number is the basis of the modern periodic law, which came after Moseley's work in 1913.

  - id: che-per-008
    topic: mendeleev-table
