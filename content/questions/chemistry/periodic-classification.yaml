  - id: che-per-015
    topic: modern-periodic-law
    subtopic: Moseley's experiment
    concept: √ν of characteristic X-rays is linear in atomic number
    category: concept
    format: graph
    difficulty: 2
    time: 35
    ncert: true
    battle: true
    tags: [moseley, x-rays, ncert-line]
    stem: Moseley found a straight-line graph when he plotted atomic number (Z) against
    options:
      - the frequency ν of characteristic X-rays
      - atomic mass
      - the square root of the frequency, √ν, of characteristic X-rays
      - the wavelength λ of characteristic X-rays
    answer: 2
    explanation: Moseley showed that √ν of the characteristic X-rays varies linearly with Z (√ν ∝ Z), whereas a plot of ν itself against atomic mass or Z is curved. This made atomic number the fundamental property.

  - id: che-per-016
    topic: modern-periodic-law
    subtopic: Modern periodic law
    concept: Modern periodic law is based on atomic number
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [modern-periodic-law, ncert-line]
    stem: The modern periodic law states that the physical and chemical properties of elements are periodic functions of their
    options:
      - atomic masses
      - atomic numbers
      - mass numbers
      - equivalent weights
    answer: 1
    explanation: After Moseley's work, the periodic law was restated with atomic number (number of protons) in place of atomic weight. This removed anomalies like Ar/K and Te/I.

  - id: che-per-017
    topic: modern-periodic-law
