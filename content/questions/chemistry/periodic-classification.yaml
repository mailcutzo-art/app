    stem: How many groups and periods are there in the long form of the periodic table?
    options:
      - 8 groups and 7 periods
      - 18 groups and 9 periods
      - 16 groups and 7 periods
      - 18 groups and 7 periods
    answer: 3
    explanation: The IUPAC long form has 18 vertical groups numbered 1–18 and 7 horizontal periods. The 8-group scheme belonged to Mendeleev's table.

  - id: che-per-018
    topic: modern-periodic-law
    subtopic: Elements per period
    concept: The sixth period contains 32 elements
    category: factual
    format: direct
    difficulty: 2
    time: 25
    ncert: true
    battle: true
    tags: [periods, ncert-line]
    stem: How many elements are there in the sixth period of the periodic table?
    options:
      - "18"
      - "8"
      - "32"
      - "36"
    answer: 2
    explanation: In period 6 the 6s, 4f, 5d and 6p orbitals are filled, holding 2 + 14 + 10 + 6 = 32 electrons, so 32 elements. Period 4 and 5 each have 18.

  - id: che-per-019
    topic: modern-periodic-law
    subtopic: Periods and shells
    concept: Period number equals the principal quantum number of the valence shell
    category: concept
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    tags: [periods]
    stem: The period number of an element in the long form periodic table corresponds to the
    options:
      - number of valence electrons
      - highest principal quantum number (n) of its electrons
      - number of unpaired electrons
      - azimuthal quantum number of the last electron
    answer: 1
    explanation: Each period begins with filling a new shell, so the period number equals the maximum n of the atom (e.g. Na, 3s^1, is in period 3). Valence electrons decide the group, not the period.

  - id: che-per-020
    topic: modern-periodic-law
    subtopic: Placement of f-block
    concept: Lanthanoids and actinoids are placed separately at the bottom
    category: concept
    format: statements
    difficulty: 2
    time: 45
    ncert: true
    battle: false
    tags: [f-block, long-form]
    stem: Which statement about the placement of the lanthanoids and actinoids in the long form table is correct?
    options:
      - They are placed at the bottom only because they are all radioactive.
      - They form group 3 and group 4 respectively.
      - They are placed separately at the bottom to keep the table compact while preserving its structure.
      - They are placed at the bottom because they are all non-metals.
    answer: 2
    explanation: The 14 lanthanoids and 14 actinoids are shown in two separate rows at the bottom so that the table does not become too wide; they logically belong in periods 6 and 7. Most lanthanoids are not radioactive and all are metals.

  - id: che-per-021
    topic: modern-periodic-law
    subtopic: Moseley's law
    concept: ν ∝ (Z − 1)^2 for Kα lines
    category: numerical
    format: direct
    difficulty: 4
    time: 90
    ncert: false
    battle: false
    formula: √ν = a(Z − b), with b = 1 for Kα lines
    tags: [moseley, x-rays, multi-concept]
    stem: For Kα X-ray lines, √ν = a(Z − 1). If the Kα frequency for an element with Z = 11 is ν_0, what is the Kα frequency for an element with Z = 21?
    options:
      - 2ν_0
      - 4ν_0
      - 1.9ν_0
      - 3.6ν_0
    answer: 1
    explanation: ν ∝ (Z − 1)^2, so ν/ν_0 = (20/10)^2 = 4. Taking ν ∝ Z (giving about 1.9) or √ν ratio 2 as the frequency ratio are the usual slips.

