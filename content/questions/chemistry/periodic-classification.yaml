  - id: che-per-030
    topic: configuration-blocks
    subtopic: Locating elements
    concept: Z = 35 lies in period 4, group 17
    category: application
    format: direct
    difficulty: 3
    time: 45
    ncert: true
    battle: true
    tags: [locating-elements]
    stem: An element has atomic number 35. Its position in the periodic table is
    options:
      - period 4, group 17
      - period 4, group 7
      - period 5, group 17
      - period 3, group 15
    answer: 0
    explanation: Z = 35 is [Ar]3d^{10}4s^24p^5. The highest n is 4 (period 4), and a p-block element with 7 electrons in ns and np is in group 10 + 7 = 17. Group 7 is a common slip from counting only valence electrons.

  - id: che-per-031
    topic: configuration-blocks
    subtopic: Locating elements
    concept: Fe (Z = 26) is a d-block element of group 8
    category: application
    format: direct
    difficulty: 3
    time: 45
    ncert: true
    battle: true
    tags: [locating-elements, d-block]
    stem: The element with atomic number 26 belongs to
    options:
      - p-block, group 16
      - d-block, group 6
      - d-block, group 8
      - s-block, group 2
    answer: 2
    explanation: Z = 26 is [Ar]3d^64s^2. The last electron enters a d orbital, so it is d-block; group = ns + (n − 1)d electrons = 2 + 6 = 8. Group 6 comes from counting only the d electrons.

  - id: che-per-032
