  - id: che-per-010
    topic: mendeleev-table
    subtopic: Anomalous pairs
    concept: Te placed before I to keep similar properties in the same group
    category: concept
    format: assertion-reason
    difficulty: 3
    time: 60
    ncert: true
    battle: false
    tags: [mendeleev, anomalous-pairs, ncert-line]
    stem: |-
      Assertion (A): Mendeleev placed tellurium (Te) before iodine (I) even though Te has the higher atomic weight.
      Reason (R): Mendeleev gave more importance to similarity in properties than to strict order of atomic weights.
    options:
      - Both A and R are true and R is the correct explanation of A
      - Both A and R are true but R is not the correct explanation of A
      - A is true but R is false
      - A is false but R is true
    answer: 0
    explanation: Mendeleev ignored the atomic-weight order for Te (127.6) and I (126.9) so that iodine fell with the halogens and tellurium with O, S and Se. This was done precisely because he ranked chemical similarity above atomic weight, so R explains A.

  - id: che-per-011
    topic: mendeleev-table
    subtopic: Limitations of Mendeleev's table
    concept: Isotopes have no separate place in Mendeleev's scheme
    category: concept
    format: multi-statement
    difficulty: 4
    time: 75
    ncert: false
    battle: false
    tags: [mendeleev, limitations]
    stem: |-
      Which of the following are genuine limitations of Mendeleev's periodic table?
      I. Isotopes of an element, having different atomic weights, should occupy different places.
      II. The position of hydrogen is uncertain.
      III. Elements with similar properties were placed in different groups everywhere.
      IV. Some pairs such as Co and Ni are placed against the order of increasing atomic weight.
    options:
      - I and III only
      - II and III only
      - I, II and IV only
      - I, II, III and IV
    answer: 2
    explanation: Basing the table on atomic weight leaves no proper place for isotopes (I), hydrogen's position is ambiguous (II), and anomalous pairs like Co/Ni break the atomic-weight order (IV). Statement III is false; Mendeleev's great success was grouping similar elements together.

  - id: che-per-012
    topic: mendeleev-table
    subtopic: Predicted elements
    concept: Predicted atomic weight of eka-aluminium (68) vs gallium (70)
    category: factual
