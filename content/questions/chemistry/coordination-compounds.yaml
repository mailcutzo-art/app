questions:
  - id: che-coord-001
    topic: werner-theory
    subtopic: Primary and secondary valence
    concept: Werner's primary valence corresponds to the oxidation state of the metal
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [primary-valence, ncert-line]
    stem: According to Werner's theory, the primary valence of a metal in a coordination compound corresponds to its
    options:
      - "coordination number"
      - "number of neutral ligands"
      - "total charge on the coordination entity"
      - "oxidation state"
    answer: 3
    explanation: "Werner's primary valence is ionisable and is satisfied by negative ions; in modern terms it is the oxidation state of the metal. The secondary valence corresponds to the coordination number."
  - id: che-coord-002
    topic: werner-theory
    subtopic: Primary and secondary valence
    concept: Secondary valences are satisfied by neutral molecules or negative ions
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [secondary-valence, ncert-line]
    stem: In Werner's theory, which groups can satisfy the secondary valences of a metal ion?
    options:
      - "Neutral molecules or negative ions"
      - "Only negative ions"
      - "Only neutral molecules"
      - "Only positive ions"
    answer: 0
    explanation: "Secondary valences are non-ionisable and can be satisfied by neutral molecules (NH_3, H_2O) or by negative ions (Cl^−, CN^−); they equal the coordination number. Primary valences are satisfied only by negative ions."
  - id: che-coord-003
    topic: werner-theory
    subtopic: Werner's precipitation experiments
    concept: Only chloride outside the coordination sphere precipitates as AgCl
    category: application
    format: case
    difficulty: 3
    time: 60
    ncert: true
    battle: false
    tags: [agcl-precipitation, werner-experiment, ncert-line]
    stem: One mole each of CoCl_3·6NH_3, CoCl_3·5NH_3, CoCl_3·4NH_3 and CoCl_3·3NH_3 is treated separately with excess AgNO_3 in the cold. What is the total number of moles of AgCl precipitated from the four solutions together?
    options:
      - "12"
      - "7"
      - "8"
      - "6"
    answer: 3
    explanation: "Only chloride outside the coordination sphere precipitates: [Co(NH_3)_6]Cl_3 gives 3, [CoCl(NH_3)_5]Cl_2 gives 2, [CoCl_2(NH_3)_4]Cl gives 1 and [CoCl_3(NH_3)_3] gives 0 mol AgCl, a total of 6 mol. Counting all 12 chlorides ignores that coordinated chloride is non-ionisable."
  - id: che-coord-004
    topic: werner-theory
    subtopic: Assigning secondary valence
    concept: PdCl2·4NH3 giving 2 mol AgCl has secondary valence 4
    category: application
    format: direct
    difficulty: 3
    time: 45
    ncert: true
    battle: true
    tags: [secondary-valence, ncert-example]
    stem: An aqueous solution of PdCl_2·4NH_3 gives 2 mol of AgCl per mole with excess AgNO_3. What is the secondary valence of palladium in this compound?
    options:
      - "2"
      - "6"
      - "3"
      - "4"
    answer: 3
    explanation: "Both chlorides are ionisable, so they lie outside the coordination sphere: [Pd(NH_3)_4]Cl_2. The four NH_3 molecules make the secondary valence (coordination number) 4, while the primary valence (oxidation state) is 2."
  - id: che-coord-005
    topic: werner-theory
    subtopic: Conductivity of cobalt ammine chlorides
    concept: Molar conductivity rises with the number of ions given by the complex
    category: application
    format: ordering
    difficulty: 3
    time: 60
    ncert: true
    battle: false
    tags: [conductivity, number-of-ions]
    stem: |-
      Arrange the following in decreasing order of molar conductivity of their equimolar aqueous solutions:
      I. CoCl_3·4NH_3
      II. CoCl_3·6NH_3
      III. CoCl_3·3NH_3
      IV. CoCl_3·5NH_3
    options:
      - "IV > II > I > III"
      - "II > IV > I > III"
      - "III > I > IV > II"
      - "II > I > IV > III"
    answer: 1
    explanation: "The compounds are [Co(NH_3)_6]Cl_3 (4 ions), [CoCl(NH_3)_5]Cl_2 (3 ions), [CoCl_2(NH_3)_4]Cl (2 ions) and [CoCl_3(NH_3)_3] (non-electrolyte). Molar conductivity rises with the number of ions, so II > IV > I > III."
  - id: che-coord-006
    topic: werner-theory
    subtopic: Double salts versus complexes
    concept: Double salts dissociate completely into simple ions in water
    category: concept
    format: statements
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [double-salt, ncert-line]
    stem: Which statement about double salts and coordination compounds in aqueous solution is correct?
    options:
      - "Mohr's salt gives no test for Fe^{2+} ions"
      - "K_4[Fe(CN)_6] gives the usual tests for Fe^{2+} and CN^− ions"
      - "Carnallite remains as a single complex ion in solution"
      - "Potash alum dissociates completely into K^+, Al^{3+} and SO_4^{2−} ions"
    answer: 3
    explanation: "Double salts such as carnallite, Mohr's salt and potash alum dissociate completely into simple ions in water, so potash alum shows K^+, Al^{3+} and SO_4^{2−}. In K_4[Fe(CN)_6] the [Fe(CN)_6]^{4−} ion stays intact and does not give the tests of Fe^{2+} or CN^−."
  - id: che-coord-007
    topic: werner-theory
    subtopic: Ionisable and non-ionisable chloride
    concept: Coordinated chloride satisfies a secondary valence and is non-ionisable
    category: concept
    format: assertion-reason
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [werner-postulates, ionisable-chloride]
    stem: |-
      Assertion (A): In [CoCl(NH_3)_5]Cl_2, only two of the three chloride ions are precipitated by AgNO_3.
      Reason (R): The chloride bound to cobalt satisfies a secondary valence and is non-ionisable.
    options:
      - "Both A and R are true and R is the correct explanation of A"
      - "Both A and R are true but R is not the correct explanation of A"
      - "A is true but R is false"
      - "A is false but R is true"
    answer: 0
    explanation: "[CoCl(NH_3)_5]Cl_2 has one Cl^− inside the coordination sphere, held by a non-ionisable secondary linkage, and two Cl^− as counter ions. Only the two counter ions are free to precipitate as AgCl, so R correctly explains A."
  - id: che-coord-008
    topic: werner-theory
    subtopic: Formula from chemical tests
    concept: Lattice water is lost easily and ionisable chloride fixes the formula of a CrCl3·6H2O isomer
    category: application
    format: case
    difficulty: 4
    time: 100
    ncert: false
    battle: false
    tags: [hydrate-isomers, multi-concept]
    stem: An isomer of CrCl_3·6H_2O loses two molecules of water per formula unit when kept over conc. H_2SO_4, and one mole of it gives one mole of AgCl with excess AgNO_3. What is its formula?
    options:
      - "[Cr(H_2O)_6]Cl_3"
      - "[CrCl_2(H_2O)_4]Cl·2H_2O"
      - "[CrCl(H_2O)_5]Cl_2·H_2O"
      - "[CrCl_3(H_2O)_3]·3H_2O"
    answer: 1
    explanation: "Only lattice water is lost easily over conc. H_2SO_4, so two H_2O lie outside the sphere; one ionisable Cl^− means one Cl^− outside: [CrCl_2(H_2O)_4]Cl·2H_2O. [CrCl(H_2O)_5]Cl_2·H_2O would lose only one H_2O and give 2 mol AgCl."
  - id: che-coord-009
    topic: werner-theory
    subtopic: Werner's precipitation experiments
    concept: Mass of AgCl from the ionisable chloride of CoCl3·5NH3
    category: numerical
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    formula: mass of AgCl = moles of ionisable Cl^− × 143.5 g mol^{-1}
    tags: [agcl-precipitation, stoichiometry]
    stem: What mass of AgCl is precipitated when 0.1 mol of CoCl_3·5NH_3 reacts with excess AgNO_3? (Molar mass of AgCl = 143.5 g mol^{-1})
    options:
      - "43.05 g"
      - "14.35 g"
      - "28.7 g"
      - "57.4 g"
    answer: 2
    explanation: "CoCl_3·5NH_3 is [CoCl(NH_3)_5]Cl_2, which has two ionisable Cl^−, so 0.1 mol gives 0.2 mol AgCl = 0.2 × 143.5 = 28.7 g. 43.05 g assumes all three chlorides precipitate."
  - id: che-coord-010
    topic: ligands-denticity
    subtopic: Polydentate ligands
    concept: EDTA4− is hexadentate
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [edta, denticity, ncert-line]
    stem: How many donor atoms does the EDTA^{4−} ion use to bind a single metal ion?
    options:
      - "4"
      - "6"
      - "2"
      - "8"
    answer: 1
    explanation: "EDTA^{4−} is hexadentate: it binds through two nitrogen atoms and four carboxylate oxygen atoms. Its four acetate arms tempt students to answer 4."
  - id: che-coord-011
    topic: ligands-denticity
    subtopic: Ambidentate ligands
    concept: NO2− is ambidentate, binding through N or O
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [ambidentate]
    stem: Which of the following ligands is ambidentate?
    options:
      - "C_2O_4^{2−}"
      - "NH_3"
      - "H_2NCH_2CH_2NH_2"
      - "NO_2^−"
    answer: 3
    explanation: "An ambidentate ligand has two different donor atoms but binds through only one at a time; NO_2^− binds through N (nitrito-N) or O (nitrito-O). Oxalate and ethane-1,2-diamine use two donor atoms together (didentate), and NH_3 has a single donor atom."
  - id: che-coord-012
    topic: ligands-denticity
    subtopic: Chelating ligands
    concept: Chelating ligands form rings and give more stable complexes; NO2− is not chelating
    category: concept
    format: multi-statement
    difficulty: 3
    time: 60
    ncert: true
    battle: false
    tags: [chelation, chelate-effect, trap]
    stem: |-
      Consider the following statements about chelating ligands:
      I. A chelating ligand binds a single metal ion through two or more donor atoms simultaneously.
      II. Chelate complexes tend to be more stable than similar complexes of unidentate ligands.
      III. NO_2^− acts as a chelating ligand because it has two donor atoms.
      IV. Ethane-1,2-diamine forms a five-membered ring with the metal ion.
      The correct statements are
    options:
      - "I and II only"
      - "II and III only"
      - "I, III and IV only"
      - "I, II and IV only"
    answer: 3
    explanation: "I, II and IV are correct: en binds through both N atoms, closing the five-membered ring M–N–C–C–N, and chelates are more stable. NO_2^− is ambidentate: it binds through N or O, never both to the same metal, so III is wrong."
  - id: che-coord-013
    topic: ligands-denticity
    subtopic: Denticity from coordination number
    concept: Carbonate is didentate in [Co(NH3)4(CO3)]+ but unidentate in [Co(NH3)5(CO3)]+
    category: application
    format: statement-pair
    difficulty: 4
    time: 90
    ncert: false
    battle: false
    tags: [denticity, carbonate, coordination-number]
    stem: |-
      Statement I: In [Co(NH_3)_4(CO_3)]^+, the carbonate ion acts as a didentate ligand.
      Statement II: In [Co(NH_3)_5(CO_3)]^+, the carbonate ion acts as a unidentate ligand.
    options:
      - "Both Statement I and Statement II are correct"
      - "Both Statement I and Statement II are incorrect"
      - "Statement I is correct but Statement II is incorrect"
      - "Statement I is incorrect but Statement II is correct"
    answer: 0
    explanation: "Co(III) has coordination number 6. With four NH_3, carbonate must supply two O donor atoms (didentate); with five NH_3, it supplies only one (unidentate). Both statements are correct."
  - id: che-coord-014
    topic: ligands-denticity
    subtopic: Nature of ligands
    concept: Ligands range from simple ions and small molecules to macromolecules such as proteins
    category: factual
    format: statements
    difficulty: 2
    time: 40
    ncert: true
    battle: false
    tags: [ligand-definition, ncert-line]
    stem: Which statement about ligands in coordination compounds is correct?
    options:
      - "Every ligand must carry a negative charge"
      - "A ligand acts as a Lewis acid towards the metal ion"
      - "Ligands may be ions, small molecules or even macromolecules such as proteins"
      - "A ligand must donate at least two electron pairs to the metal"
    answer: 2
    explanation: "NCERT notes that ligands range from simple ions such as Cl^− and small molecules such as H_2O or NH_3 to larger molecules and even proteins. Ligands donate electron pairs, so they are Lewis bases; they may be neutral, and a unidentate ligand donates only one pair."
  - id: che-coord-015
    topic: ligands-denticity
    subtopic: Denticity of common ligands
    concept: Denticity of tren, oxalate, EDTA and thiocyanate
    category: factual
    format: match
    difficulty: 3
    time: 60
    ncert: true
    battle: false
    tags: [denticity, polydentate]
    stem: |-
      Match the ligand in List I with its denticity in List II.
      List I
      P. N(CH_2CH_2NH_2)_3
      Q. C_2O_4^{2−}
      R. EDTA^{4−}
      S. SCN^−
      List II
      1. Unidentate
      2. Didentate
      3. Tetradentate
      4. Hexadentate
    options:
      - "P-4, Q-2, R-3, S-1"
      - "P-3, Q-1, R-4, S-2"
      - "P-3, Q-2, R-4, S-1"
      - "P-2, Q-3, R-4, S-1"
    answer: 2
    explanation: "N(CH_2CH_2NH_2)_3 has four N donor atoms (tetradentate), oxalate binds through two O atoms, EDTA^{4−} through two N and four O atoms, and thiocyanate, though ambidentate, binds through one atom. So P-3, Q-2, R-4, S-1."
  - id: che-coord-016
    topic: ligands-denticity
    subtopic: Requirement for a ligand
    concept: A ligand needs a lone pair; NH4+ has none
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: false
    battle: true
    tags: [ligand-definition, lone-pair, trap]
    stem: Which of the following species cannot act as a ligand?
    options:
      - "CO"
      - "NH_4^+"
      - "H_2O"
      - "Cl^−"
    answer: 1
    explanation: "A ligand must donate a lone pair to the metal. In NH_4^+ the nitrogen lone pair is already used to bond the fourth H^+, so it cannot coordinate; CO, H_2O and Cl^− all have lone pairs."
  - id: che-coord-017
    topic: ligands-denticity
    subtopic: Chelate effect
    concept: "[Ni(en)3]2+ is more stable than [Ni(NH3)6]2+ because en chelates"
    category: concept
    format: assertion-reason
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [chelate-effect]
    stem: |-
      Assertion (A): [Ni(en)_3]^{2+} is more stable than [Ni(NH_3)_6]^{2+}.
      Reason (R): Ethane-1,2-diamine is a unidentate ligand.
    options:
      - "Both A and R are true and R is the correct explanation of A"
      - "Both A and R are true but R is not the correct explanation of A"
      - "A is true but R is false"
      - "A is false but R is true"
    answer: 2
    explanation: "The tris(en) complex is more stable because each en is didentate and closes a chelate ring (chelate effect). R is false: en binds through both nitrogen atoms."
  - id: che-coord-018
    topic: ligands-denticity
    subtopic: Chelate rings
    concept: Each oxalate forms one chelate ring, so a tris(oxalato) complex has three rings
    category: application
    format: direct
    difficulty: 3
    time: 45
    ncert: false
    battle: true
    tags: [chelate-ring, trap]
    stem: How many chelate rings are present in the complex ion [Cr(C_2O_4)_3]^{3−}?
    options:
      - "6"
      - "3"
      - "2"
      - "0"
    answer: 1
    explanation: "Each oxalate binds Cr through two O atoms and closes one five-membered ring (Cr–O–C–C–O), so three oxalates give three chelate rings. Six is the number of Cr–O bonds, not rings."
  - id: che-coord-019
    topic: ligands-denticity
    subtopic: Unsymmetrical didentate ligands
    concept: Glycinate binds through one N and one O atom
    category: factual
    format: direct
    difficulty: 3
    time: 45
    ncert: false
    battle: true
    tags: [glycinate, didentate]
    stem: The glycinate ion (H_2NCH_2COO^−) acts as a didentate ligand. Through which donor atoms does it bind a metal ion?
    options:
      - "Two oxygen atoms"
      - "Two nitrogen atoms"
      - "One nitrogen and one oxygen atom"
      - "One carbon and one oxygen atom"
    answer: 2
    explanation: "Glycinate binds through the amino N and one carboxylate O, forming a five-membered chelate ring. It has only one nitrogen, and the carboxylate uses just one of its oxygens for a given metal."
  - id: che-coord-020
    topic: key-terms
    subtopic: Oxidation state of the central atom
    concept: Co is −1 in K[Co(CO)4]
    category: numerical
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [oxidation-state, carbonyl]
    stem: What is the oxidation state of cobalt in K[Co(CO)_4]?
    options:
      - "+1"
      - "0"
      - "−1"
      - "+3"
    answer: 2
    explanation: "CO is neutral and K is +1, so the complex anion [Co(CO)_4]^− carries −1, all of it on cobalt. Students often assume that carbonyl complexes always contain the metal in the 0 state."
  - id: che-coord-021
    topic: key-terms
    subtopic: Homoleptic and heteroleptic complexes
    concept: Homoleptic complexes contain only one kind of donor group
    category: application
    format: multi-statement
    difficulty: 2
    time: 40
    ncert: true
    battle: false
    tags: [homoleptic, heteroleptic, ncert-line]
    stem: |-
      Which of the following are homoleptic complexes?
      I. [Co(NH_3)_6]^{3+}
      II. [Co(NH_3)_4Cl_2]^+
      III. [Ni(CN)_4]^{2−}
      IV. [Ni(NH_3)_4Cl_2]
    options:
      - "I and II only"
      - "II and IV only"
      - "I, III and IV only"
      - "I and III only"
    answer: 3
    explanation: "A homoleptic complex has only one kind of donor group: [Co(NH_3)_6]^{3+} (only NH_3) and [Ni(CN)_4]^{2−} (only CN^−). II and IV contain both NH_3 and Cl^−, so they are heteroleptic."
  - id: che-coord-022
    topic: key-terms
    subtopic: Coordination number
    concept: Only σ bonds count towards the coordination number
    category: concept
    format: statement-pair
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [coordination-number, ncert-line]
    stem: |-
      Statement I: The coordination number of a metal counts both the σ bonds and the π bonds formed between the ligands and the metal.
      Statement II: The coordination number of iron in [Fe(C_2O_4)_3]^{3−} is 6.
    options:
      - "Both Statement I and Statement II are correct"
      - "Both Statement I and Statement II are incorrect"
      - "Statement I is correct but Statement II is incorrect"
      - "Statement I is incorrect but Statement II is correct"
    answer: 3
    explanation: "NCERT defines the coordination number through σ bonds only; π bonds between ligand and metal are not counted, so Statement I is wrong. Each oxalate binds through two O atoms, so three oxalates give Fe six donor atoms and Statement II is correct."
  - id: che-coord-023
    topic: key-terms
    subtopic: Coordination sphere and counter ions
    concept: In K4[Fe(CN)6] the coordination sphere is [Fe(CN)6]4− and K+ is the counter ion
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [coordination-sphere, counter-ion, ncert-line]
    stem: In K_4[Fe(CN)_6], the coordination sphere and the counter ion are, respectively,
    options:
      - "K^+ and [Fe(CN)_6]^{4−}"
      - "Fe^{2+} and CN^−"
      - "[Fe(CN)_6]^{4−} and K^+"
      - "[Fe(CN)_6]^{3−} and K^+"
    answer: 2
    explanation: "The central atom and its ligands, written in square brackets, form the coordination sphere [Fe(CN)_6]^{4−}; the ionisable K^+ ions outside it are the counter ions."
  - id: che-coord-024
    topic: key-terms
    subtopic: Coordination polyhedron
    concept: The coordination polyhedron is the spatial arrangement of donor atoms around the central atom
    category: concept
    format: statements
    difficulty: 3
    time: 45
    ncert: true
    battle: false
    tags: [coordination-polyhedron, ncert-line]
    stem: Which statement about the coordination polyhedron of a complex is correct?
    options:
      - "It is the set of all ions present in the crystal of the complex"
      - "It includes the counter ions that balance the charge"
      - "[Ni(CO)_4] has a square planar coordination polyhedron"
      - "It is the spatial arrangement of the ligand atoms directly attached to the central atom"
    answer: 3
    explanation: "The coordination polyhedron is the spatial arrangement of the ligand atoms directly attached to the central atom, e.g. octahedral for [Co(NH_3)_6]^{3+} and tetrahedral for [Ni(CO)_4]. Counter ions lie outside the coordination sphere."
  - id: che-coord-025
    topic: key-terms
    subtopic: Oxidation state of the central atom
    concept: Pt is +4 in [PtCl2(en)2]2+ because en is neutral
    category: numerical
    format: direct
    difficulty: 3
    time: 45
    ncert: true
    battle: true
    tags: [oxidation-state, trap]
    stem: What is the oxidation state of platinum in the complex ion [PtCl_2(en)_2]^{2+}?
    options:
      - "+2"
      - "+6"
      - "+4"
      - "0"
    answer: 2
    explanation: "en is neutral and each Cl^− is −1, so x + 2(−1) = +2 gives x = +4. Answering +2 comes from reading the ion's charge as the metal's oxidation state."
  - id: che-coord-026
    topic: key-terms
    subtopic: Oxidation state and coordination number
    concept: Co is +3 with coordination number 6 in [Co(NH3)5(CO3)]Cl
    category: numerical
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [oxidation-state, coordination-number]
    stem: What are the oxidation state and coordination number of cobalt in [Co(NH_3)_5(CO_3)]Cl?
    options:
      - "+2 and 6"
      - "+3 and 7"
      - "+3 and 6"
      - "+1 and 6"
    answer: 2
    explanation: "The counter ion Cl^− makes the complex ion +1, so x + 0 + (−2) = +1 and x = +3. Five NH_3 and one carbonate O donor give coordination number 6; carbonate is unidentate here, so 7 is wrong."
  - id: che-coord-027
    topic: key-terms
    subtopic: Oxidation number of the central atom
    concept: Oxidation number is the charge left after removing ligands with their shared electron pairs
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [oxidation-number, ncert-line]
    stem: The oxidation number of the central atom in a complex is defined as the charge it would carry if
    options:
      - "all counter ions were removed from the compound"
      - "each ligand donated one extra electron to the metal"
      - "all the ligands were removed along with the electron pairs shared with it"
      - "all the ligands were removed as neutral atoms"
    answer: 2
    explanation: "NCERT defines the oxidation number of the central atom as the charge it would carry if all ligands were removed together with the electron pairs they share with it. Removing only the counter ions leaves the charge of the whole complex ion."
  - id: che-coord-028
    topic: nomenclature
    subtopic: Naming complex cations
    concept: "[Co(NH3)5Cl]Cl2 is pentaamminechloridocobalt(III) chloride"
    category: factual
    format: direct
    difficulty: 2
    time: 35
    ncert: true
    battle: true
    tags: [iupac-name, ncert-exercise]
    stem: What is the IUPAC name of [Co(NH_3)_5Cl]Cl_2?
    options:
      - "pentaamminechloridocobaltate(III) chloride"
