    answer: 3
    explanation: NCERT gives C_{12}H_{26} → C_7H_{16} + C_5H_{10} + other products; total carbon count is conserved (7 + 5 = 12).
  - id: che-hc-030
    topic: conformations
    subtopic: Staggered and eclipsed
    concept: Staggered ethane is more stable than eclipsed
    category: concept
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    tags: [conformation, stability]
    stem: The most stable conformation of ethane is the
    options:
      - skew conformation with 30° dihedral angle
      - staggered conformation
      - eclipsed conformation
      - conformation with 120° dihedral angle
    answer: 1
    explanation: In the staggered form the C–H bonds on adjacent carbons are as far apart as possible, so torsional strain is minimum. At 120° the bonds are eclipsed again.
  - id: che-hc-031
    topic: conformations
    subtopic: Torsional strain
    concept: Energy difference between conformations of ethane is ~12.5 kJ/mol
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [torsional-strain, ncert-line]
    stem: The energy difference between the staggered and eclipsed conformations of ethane is about
    options:
      - 348 kJ mol^{-1}
      - 125 kJ mol^{-1}
      - 12.5 kJ mol^{-1}
      - 1.25 kJ mol^{-1}
    answer: 2
    explanation: NCERT quotes about 12.5 kJ mol^{-1}. 348 kJ mol^{-1} is roughly the C–C bond enthalpy, far larger than any rotational barrier.
  - id: che-hc-032
    topic: conformations
    subtopic: Interconversion
    concept: Conformers of ethane cannot be isolated at room temperature
    category: concept
    format: assertion-reason
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [conformation, ncert-line]
    stem: |-
      Assertion (A): The conformations of ethane cannot be separated at room temperature.
      Reason (R): The energy barrier to rotation about the C–C bond is so small that the conformers interconvert rapidly.
    options:
      - Both A and R are true but R is not the correct explanation of A
      - A is true but R is false
      - A is false but R is true
      - Both A and R are true and R is the correct explanation of A
    answer: 3
    explanation: The ~12.5 kJ mol^{-1} barrier is easily crossed by thermal energy at room temperature, so the forms interconvert rapidly and cannot be isolated. R correctly explains A.
  - id: che-hc-033
    topic: conformations
    subtopic: Dihedral angle
    concept: Staggered ethane has dihedral angle 60°
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [dihedral-angle]
    stem: In the Newman projection of staggered ethane, the dihedral angle between the nearest C–H bonds on the front and rear carbons is
    options:
      - 109.5°
      - 60°
      - 0°
      - 120°
    answer: 1
    explanation: In the staggered form the rear C–H bonds lie midway between the front ones, at 60°. A dihedral angle of 0° (or 120°) corresponds to an eclipsed form; 109.5° is the tetrahedral bond angle, not a dihedral angle.
  - id: che-hc-034
    topic: conformations
    subtopic: Representations
    concept: Sawhorse vs Newman projections
    category: concept
    format: statements
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [newman, sawhorse]
    stem: Which statement about the representations of ethane conformations is correct?
    options:
