    options:
      - Mo_2O_3
      - (CH_3COO)_2Mn
      - V_2O_5
      - Cu
    answer: 3
    explanation: 2CH_4 + O_2 → 2CH_3OH over Cu at 523 K/100 atm. Mo_2O_3 gives methanal instead, and manganese acetate converts ethane to ethanoic acid.
  - id: che-hc-026
    topic: alkane-properties
    subtopic: Aromatisation
    concept: n-Hexane aromatises to benzene
    category: factual
    format: direct
    difficulty: 2
    time: 35
    ncert: true
    battle: true
    tags: [aromatisation]
    stem: n-Hexane heated at 773 K and 10–20 atm over Cr_2O_3 supported on alumina gives
    options:
      - cyclohexane
      - hex-1-ene
      - benzene
      - toluene
    answer: 2
    explanation: Alkanes with six or more carbons cyclise and dehydrogenate (aromatise) over oxides of V, Mo or Cr on alumina; n-hexane gives benzene. Toluene comes from n-heptane.
  - id: che-hc-027
    topic: alkane-properties
    subtopic: Isomerisation
    concept: Anhydrous AlCl_3 and HCl isomerise n-alkanes
    category: factual
    format: direct
    difficulty: 2
