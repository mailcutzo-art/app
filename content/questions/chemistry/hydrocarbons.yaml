    battle: true
    tags: [pyrolysis, cracking, ncert-line]
    stem: Pyrolysis of dodecane in the presence of Pt, Pd or Ni gives a mixture of
    options:
      - decane and ethene
      - hexane and hexene
      - octane and butene
