  - id: che-hc-025
    topic: alkane-properties
    subtopic: Controlled oxidation
    concept: Methane to methanol with Cu at 523 K, 100 atm
    category: factual
    format: direct
    difficulty: 3
    time: 40
    ncert: true
    battle: true
    tags: [controlled-oxidation, ncert-line]
