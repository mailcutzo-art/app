    explanation: With peroxide the addition is anti-Markovnikov, so A is 1-bromopropane. Wurtz coupling doubles the chain to n-hexane (B). n-Hexane has three sets of equivalent hydrogens (C1/C6, C2/C5, C3/C4), giving 1-, 2- and 3-chlorohexane. Ignoring the peroxide gives 2-bromopropane, then 2,3-dimethylbutane and only 2 products; counting enantiomers of the chiral 2- and 3-chloro isomers would wrongly give 5.
