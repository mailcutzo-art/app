    topic: alkynes
    subtopic: Separation of gas mixtures
    concept: Ammoniacal silver nitrate removes only the terminal alkyne, bromine water then removes the alkene
    category: numerical
    format: case
    difficulty: 3
    time: 60
    ncert: false
    battle: false
    tags: [gas-mixture, terminal-alkyne, unsaturation-test]
    stem: A 50 mL gaseous mixture of ethane, ethene and ethyne is shaken with ammoniacal silver nitrate solution, and the volume falls to 40 mL. The remaining gas is then shaken with bromine water, and the volume falls to 25 mL. The composition of the original mixture is
    options:
      - Ethane 25 mL, ethene 10 mL, ethyne 15 mL
      - Ethane 15 mL, ethene 25 mL, ethyne 10 mL
      - Ethane 10 mL, ethene 15 mL, ethyne 25 mL
      - Ethane 25 mL, ethene 15 mL, ethyne 10 mL
    answer: 3
    explanation: Only the terminal alkyne ethyne reacts with ammoniacal AgNO_3 (white silver acetylide), so ethyne = 50 − 40 = 10 mL. Ethene then adds Br_2 and is absorbed, so ethene = 40 − 25 = 15 mL. Ethane is unreactive towards both reagents and is the 25 mL left.
  - id: che-hc-504
    topic: alkane-properties
    subtopic: Combustion of gaseous hydrocarbons
    concept: Finding a hydrocarbon formula from the volume contraction and the CO_2 absorbed by KOH
    category: numerical
    format: direct
    difficulty: 4
    time: 85
    ncert: false
    battle: false
    tags: [eudiometry, combustion, formula-determination]
    stem: 10 mL of a gaseous hydrocarbon is burnt completely with 70 mL of oxygen. After cooling to room temperature the gas volume is 55 mL, which falls to 25 mL on passing through KOH solution. The hydrocarbon is
    options:
      - C_3H_8
      - C_4H_8
      - C_3H_6
      - C_3H_4
    answer: 2
    explanation: The 30 mL absorbed by KOH is CO_2, so x = 30/10 = 3. The 25 mL left is unused O_2, so O_2 consumed = 70 − 25 = 45 mL = 10(x + y/4), which gives x + y/4 = 4.5 and y = 6. The formula is C_3H_6. Check, CO_2 30 mL plus O_2 25 mL = 55 mL, as given.
  - id: che-hc-505
    topic: benzene-reactions
    subtopic: Multi-step synthesis
    concept: Acylation, meta bromination and Clemmensen reduction give a meta-bromo n-propylbenzene
    category: application
    format: direct
    difficulty: 5
    time: 120
    ncert: false
    battle: false
    tags: [friedel-crafts, directive-influence, synthesis, trap]
    stem: Which sequence correctly converts benzene into 1-bromo-3-propylbenzene?
    options:
      - CH_3CH_2CH_2Cl, anhyd. AlCl_3; then Br_2, FeBr_3
      - Br_2, FeBr_3; then CH_3CH_2COCl, anhyd. AlCl_3; then Zn–Hg, conc. HCl
      - CH_3CH_2COCl, anhyd. AlCl_3; then Zn–Hg, conc. HCl; then Br_2, FeBr_3
      - CH_3CH_2COCl, anhyd. AlCl_3; then Br_2, FeBr_3; then Zn–Hg, conc. HCl
    answer: 3
    explanation: Acylation gives propiophenone with no carbocation rearrangement, and its C=O is a meta director, so Br enters the meta position. Clemmensen reduction last converts C=O into CH_2 and leaves the C–Br bond intact. Direct alkylation with 1-chloropropane rearranges to isopropylbenzene, and any alkyl group or Br present before the second substitution directs ortho/para, so the other routes give o/p products.
