      - anhydrous AlCl_3 and HCl gas
      - alcoholic KOH
      - Cr_2O_3 on alumina
    answer: 1
    explanation: n-Alkanes isomerise to branched alkanes on heating with anhydrous AlCl_3 and HCl. Cr_2O_3 on alumina aromatises n-hexane to benzene.
  - id: che-hc-028
    topic: alkane-properties
