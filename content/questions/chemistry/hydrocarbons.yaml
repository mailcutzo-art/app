      Statement I: Platinum and palladium catalyse the addition of H_2 to alkenes at room temperature.
      Statement II: Nickel catalyses the same hydrogenation only at relatively higher temperature and pressure.
    options:
      - Both Statement I and Statement II are correct
      - Statement I is correct but Statement II is incorrect
      - Both Statement I and Statement II are incorrect
      - Statement I is incorrect but Statement II is correct
    answer: 0
    explanation: NCERT states that finely divided Pt or Pd adsorb H_2 and catalyse hydrogenation at room temperature, whereas Ni requires higher temperature and pressure. Both statements are correct.
  - id: che-hc-017
    topic: alkane-preparation
    subtopic: Kolbe's electrolysis
    concept: Kolbe's product has even number of carbons
    category: application
    format: direct
    difficulty: 3
    time: 45
    ncert: true
    battle: true
    tags: [kolbe]
    stem: Electrolysis of an aqueous solution of potassium propanoate gives which alkane at the anode?
    options:
      - Hexane
      - Propane
      - Ethane
      - Butane
    answer: 3
    explanation: Each propanoate ion loses CO_2 to give an ethyl radical, and two ethyl radicals combine to form butane. Ethane would be the decarboxylation-with-sodalime product.
  - id: che-hc-018
    topic: alkane-preparation
    subtopic: Choice of method
    concept: Methane can be made by sodalime decarboxylation but not by Kolbe or Wurtz
    category: application
    format: multi-statement
    difficulty: 3
    time: 60
    ncert: true
    battle: false
    tags: [methane, exception, multi-concept]
    stem: |-
      Which of the following methods can be used to prepare methane?
      I. Heating sodium acetate with sodalime
      II. Kolbe's electrolysis of sodium acetate
      III. Wurtz reaction of methyl bromide
      IV. Reduction of CH_3Br with Zn and dilute HCl
    options:
      - I and IV only
      - I, II and III only
      - I, III and IV only
      - II and III only
    answer: 0
    explanation: Decarboxylation of CH_3COONa and reduction of CH_3Br both give CH_4. Kolbe's electrolysis of acetate and the Wurtz reaction of CH_3Br both give ethane, since they join two methyl groups.
  - id: che-hc-019
    topic: alkane-preparation
    subtopic: Decarboxylation
    concept: Mass/mole relation in decarboxylation
    category: numerical
    format: direct
    difficulty: 3
    time: 60
    ncert: false
    battle: false
    formula: CH_3COONa + NaOH → CH_4 + Na_2CO_3
    tags: [stoichiometry, decarboxylation]
    stem: What volume of methane at STP is obtained by heating 41 g of sodium acetate (molar mass 82 g mol^{-1}) with excess sodalime?
    options:
      - 44.8 L
      - 22.4 L
      - 5.6 L
      - 11.2 L
    answer: 3
    explanation: 41 g is 0.5 mol of CH_3COONa, which gives 0.5 mol CH_4 (1:1 mole ratio). At STP this occupies 0.5 × 22.4 = 11.2 L.
  - id: che-hc-020
    topic: alkane-properties
    subtopic: Boiling points
    concept: Branching lowers boiling point of isomeric alkanes
    category: concept
    format: ordering
    difficulty: 2
    time: 40
    ncert: true
    battle: true
    tags: [boiling-point, branching, ncert-line]
    stem: The correct order of boiling points of the isomeric pentanes is
    options:
      - isopentane > n-pentane > neopentane
      - n-pentane > neopentane > isopentane
      - neopentane > isopentane > n-pentane
      - n-pentane > isopentane > neopentane
    answer: 3
    explanation: Branching makes the molecule more spherical, reducing surface area and van der Waals forces. So n-pentane (309 K) > isopentane (301 K) > neopentane (282.5 K).
  - id: che-hc-021
    topic: alkane-properties
    subtopic: Halogenation
    concept: Halogenation of alkanes proceeds by free-radical chain mechanism
    category: factual
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    tags: [halogenation, mechanism]
    stem: Chlorination of methane in diffused sunlight proceeds through
    options:
      - a nucleophilic addition mechanism
      - an ionic addition mechanism
      - a free-radical chain mechanism
      - an electrophilic substitution mechanism
    answer: 2
    explanation: Light homolytically cleaves Cl_2 into chlorine free radicals, which start a chain of initiation, propagation and termination steps. Electrophilic substitution is typical of benzene, not alkanes.
  - id: che-hc-022
    topic: alkane-properties
    subtopic: Halogenation
    concept: Reactivity order of halogens towards alkanes
    category: factual
    format: ordering
    difficulty: 2
    time: 35
    ncert: true
    battle: true
    tags: [halogenation, reactivity]
    stem: The reactivity of halogens in the halogenation of alkanes follows the order
    options:
      - F_2 > Cl_2 > Br_2 > I_2
      - Br_2 > Cl_2 > F_2 > I_2
      - I_2 > Br_2 > Cl_2 > F_2
      - Cl_2 > F_2 > Br_2 > I_2
    answer: 0
    explanation: Halogenation reactivity is F_2 > Cl_2 > Br_2 > I_2; fluorination is too violent to control and iodination is very slow and reversible.
  - id: che-hc-023
    topic: alkane-properties
    subtopic: Halogenation
    concept: Iodination is reversible and needs an oxidising agent
    category: concept
    format: assertion-reason
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [iodination, ncert-line]
    stem: |-
      Assertion (A): Iodination of alkanes is carried out in the presence of an oxidising agent such as HIO_3 or HNO_3.
      Reason (R): Iodination is reversible, and the oxidising agent removes the HI formed.
    options:
      - Both A and R are true but R is not the correct explanation of A
      - A is true but R is false
      - Both A and R are true and R is the correct explanation of A
      - A is false but R is true
    answer: 2
    explanation: CH_4 + I_2 ⇌ CH_3I + HI is reversible because HI reduces CH_3I back; oxidising HI with HIO_3 or HNO_3 drives the reaction forward. R explains A.
  - id: che-hc-024
    topic: alkane-properties
    subtopic: Halogenation
    concept: Number of monochloro products of propane
    category: application
    format: direct
    difficulty: 2
    time: 35
    ncert: false
