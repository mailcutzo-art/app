questions:
  - id: che-hc-001
    topic: classification-nomenclature
    subtopic: Types of hydrocarbons
    concept: Alkanes are saturated open-chain hydrocarbons with only C–C single bonds
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [classification, ncert-line]
    stem: Hydrocarbons containing only carbon–carbon single bonds in an open chain are called
    options:
      - alkynes
      - alkenes
      - alkanes
      - arenes
    answer: 2
    explanation: Alkanes (paraffins) are saturated open-chain hydrocarbons in which all carbon–carbon bonds are single bonds. Alkenes and alkynes contain double and triple bonds, and arenes contain a benzene ring.
  - id: che-hc-002
    topic: classification-nomenclature
    subtopic: General formulae
    concept: General formula of alkynes is C_nH_{2n−2}
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [general-formula]
    stem: The general formula of open-chain alkynes containing one triple bond is
    options:
      - C_nH_{2n-6}
      - C_nH_{2n}
      - C_nH_{2n-2}
      - C_nH_{2n+2}
    answer: 2
    explanation: Each π bond reduces the hydrogen count by 2 from the alkane formula C_nH_{2n+2}; a triple bond has two π bonds, giving C_nH_{2n−2}. C_nH_{2n} is the formula of alkenes (and cycloalkanes).
  - id: che-hc-003
    topic: classification-nomenclature
    subtopic: Structural isomers of alkanes
    concept: C_5H_12 has three chain isomers
    category: application
    format: direct
    difficulty: 2
    time: 40
    ncert: true
    battle: true
    tags: [isomerism, chain-isomers]
    stem: How many structural isomers are possible for the alkane C_5H_{12}?
    options:
      - "5"
      - "2"
      - "3"
      - "4"
    answer: 2
    explanation: Pentane, 2-methylbutane and 2,2-dimethylpropane are the only three chain isomers of C_5H_{12}. Five isomers are possible for C_6H_{14}, not C_5H_{12}.
  - id: che-hc-004
    topic: classification-nomenclature
    subtopic: IUPAC nomenclature
    concept: Longest chain selection in branched alkanes
    category: application
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [iupac, trap]
    stem: The correct IUPAC name of (CH_3)_2CH–CH(CH_3)–CH_2–CH_3 is
    options:
      - 1,1,2-trimethylbutane
      - 2-isopropylbutane
      - 3,4-dimethylpentane
      - 2,3-dimethylpentane
    answer: 3
    explanation: The longest chain has five carbons, with methyl groups on C-2 and C-3 when numbered from the end nearer the branch. Naming it as a butane with an isopropyl group ignores the longer five-carbon chain, and 3,4 violates the lowest-locant rule.
  - id: che-hc-005
    topic: classification-nomenclature
    subtopic: Degree of unsaturation
    concept: Degree of unsaturation from molecular formula
    category: numerical
    format: direct
    difficulty: 3
    time: 50
    ncert: false
    battle: true
    formula: DU = (2C + 2 − H)/2
    tags: [unsaturation, calculation]
    stem: What is the degree of unsaturation (rings + π bonds) of C_6H_6?
    options:
      - "2"
      - "4"
      - "6"
      - "3"
    answer: 1
    explanation: DU = (2 × 6 + 2 − 6)/2 = 4, i.e. one ring plus three π bonds in benzene. Counting only the three double bonds and forgetting the ring gives 3.
  - id: che-hc-006
    topic: classification-nomenclature
    subtopic: Sources of hydrocarbons
    concept: LPG is mainly butane; CNG is mainly methane
    category: factual
    format: statement-pair
    difficulty: 2
    time: 40
    ncert: true
    battle: false
    tags: [fuels, ncert-line]
    stem: |-
      Statement I: Liquefied petroleum gas (LPG) used as domestic fuel consists mainly of butane.
      Statement II: Compressed natural gas (CNG) consists mainly of methane.
    options:
      - Both Statement I and Statement II are correct
      - Both Statement I and Statement II are incorrect
      - Statement I is incorrect but Statement II is correct
      - Statement I is correct but Statement II is incorrect
    answer: 0
    explanation: NCERT notes that LPG is a mixture of hydrocarbons chiefly butane (with propane), while CNG and natural gas are chiefly methane. Both statements are therefore correct.
  - id: che-hc-007
    topic: classification-nomenclature
    subtopic: Isomers of alkenes
    concept: Structural isomers of butene
    category: application
    format: direct
    difficulty: 3
    time: 60
    ncert: true
    battle: true
    tags: [isomerism, alkenes]
    stem: How many structurally isomeric alkenes (ignoring geometrical isomers) have the formula C_4H_8?
    options:
      - "3"
      - "2"
      - "6"
      - "4"
    answer: 0
    explanation: But-1-ene, but-2-ene and 2-methylpropene are the three structural alkene isomers. Counting cis and trans but-2-ene separately gives 4, and adding cyclobutane and methylcyclopropane gives 6 isomers of C_4H_8 in all.
  - id: che-hc-008
    topic: classification-nomenclature
    subtopic: IUPAC nomenclature
    concept: Numbering alkenes gives the double bond the lowest locant
    category: application
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [iupac, alkenes]
    stem: The IUPAC name of CH_3–CH(CH_3)–CH=CH_2 is
    options:
      - 2-methylbut-1-ene
      - 3-methylbut-1-ene
      - 2-methylbut-3-ene
      - pent-1-ene
    answer: 1
    explanation: The chain is numbered from the end nearer the double bond, so C=C gets locant 1 and the methyl group sits on C-3. 2-Methylbut-3-ene numbers from the wrong end, giving the double bond a higher locant.
  - id: che-hc-009
    topic: classification-nomenclature
    subtopic: Types of isomerism
    concept: Pentane and 2-methylbutane are chain isomers
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [isomerism]
    stem: Pentane and 2-methylbutane are related as
    options:
      - functional isomers
      - geometrical isomers
      - position isomers
      - chain isomers
    answer: 3
    explanation: Both are C_5H_{12} and differ only in the carbon skeleton (straight versus branched), which is chain isomerism. Position isomers differ in the location of a group or multiple bond on the same skeleton.
  - id: che-hc-010
    topic: alkane-preparation
    subtopic: Wurtz reaction
    concept: Wurtz reaction couples alkyl halides with sodium in dry ether
    category: factual
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    tags: [wurtz, ncert-line]
    stem: Ethyl bromide reacts with sodium in dry ether to give
    options:
      - ethene
      - butane
      - propane
      - ethane
    answer: 1
    explanation: In the Wurtz reaction 2 C_2H_5Br + 2Na → C_2H_5–C_2H_5 + 2NaBr, so two ethyl groups join to give butane, an alkane with double the number of carbons.
  - id: che-hc-011
    topic: alkane-preparation
    subtopic: Wurtz reaction
    concept: Methane cannot be prepared by Wurtz reaction
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [wurtz, exception, trap]
    stem: Which alkane cannot be prepared by the Wurtz reaction?
    options:
      - Butane
      - Methane
      - Hexane
      - Ethane
    answer: 1
    explanation: The Wurtz reaction joins two alkyl groups, so the product has at least two carbon atoms; methane (one carbon) cannot be formed. Ethane forms from methyl halide.
  - id: che-hc-012
    topic: alkane-preparation
    subtopic: Wurtz reaction
    concept: Mixed Wurtz gives a mixture of three alkanes
    category: application
    format: direct
    difficulty: 3
    time: 60
    ncert: true
    battle: false
    tags: [wurtz, mixed-wurtz, trap]
    stem: When a mixture of methyl bromide and ethyl bromide is treated with sodium in dry ether, the products are
    options:
      - propane only
      - ethane, propane and butane
      - methane, ethane and propane
      - ethane and butane only
    answer: 1
    explanation: Radicals/alkyl groups couple randomly, giving CH_3–CH_3, CH_3–C_2H_5 and C_2H_5–C_2H_5, i.e. ethane, propane and butane. This is why the Wurtz reaction is unsuitable for alkanes with an odd number of carbons.
  - id: che-hc-013
    topic: alkane-preparation
    subtopic: Decarboxylation
    concept: Sodalime decarboxylation gives alkane with one carbon less
    category: application
    format: direct
    difficulty: 2
    time: 35
    ncert: true
    battle: true
    tags: [decarboxylation, sodalime]
    stem: Heating sodium propanoate with sodalime gives
    options:
      - ethane
      - methane
      - propane
      - butane
    answer: 0
    explanation: RCOONa + NaOH (CaO) → RH + Na_2CO_3; the –COONa carbon is lost, so C_2H_5COONa gives C_2H_6. Propane would require sodium butanoate.
  - id: che-hc-014
    topic: alkane-preparation
    subtopic: Kolbe's electrolysis
    concept: Kolbe electrolysis of sodium acetate gives ethane at anode
    category: factual
    format: direct
    difficulty: 2
    time: 35
    ncert: true
    battle: true
    tags: [kolbe, electrolysis]
    stem: In Kolbe's electrolysis of aqueous sodium acetate, ethane is liberated at
    options:
      - the cathode, along with CO_2
      - the cathode, along with H_2
      - the anode, along with H_2
      - the anode, along with CO_2
    answer: 3
    explanation: Acetate ions are oxidised at the anode to CH_3 radicals and CO_2; the radicals dimerise to ethane. Hydrogen and NaOH form at the cathode.
  - id: che-hc-015
    topic: alkane-preparation
    subtopic: Reduction of alkyl halides
    concept: Zn and dilute HCl reduce alkyl halides to alkanes
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [reduction, alkyl-halide]
    stem: CH_3Cl can be converted into methane by treating it with
    options:
      - sodalime
      - alcoholic KOH
      - Zn and dilute HCl
      - Na in dry ether
    answer: 2
    explanation: Zinc and dilute HCl supply hydrogen that reduces the C–Cl bond, giving CH_4 (except fluorides, alkyl halides react this way). Na in dry ether would couple methyl groups to ethane.
  - id: che-hc-016
    topic: alkane-preparation
    subtopic: Catalytic hydrogenation
