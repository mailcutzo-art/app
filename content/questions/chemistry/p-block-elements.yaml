questions:
  - id: che-pblock-001
    topic: p-block-general
    subtopic: Electronic configuration
    concept: Valence shell configuration of p-block elements is ns^2np^{1−6}
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [electronic-configuration, ncert-line]
    stem: The general valence shell electronic configuration of the p-block elements (other than helium) is
    options:
      - ns^{1−2}
      - ns^2np^{1−6}
      - (n−1)d^{1−10}ns^{1−2}
      - (n−2)f^{1−14}(n−1)d^{0−1}ns^2
    answer: 1
    explanation: In p-block elements the last electron enters a p orbital, so the valence shell is ns^2np^1 to ns^2np^6; helium (1s^2) is the only exception. ns^{1−2} describes the s-block and (n−1)d^{1−10}ns^{1−2} the d-block.
  - id: che-pblock-002
    topic: p-block-general
    subtopic: Oxidation states
    concept: Group oxidation state of a p-block element equals group number minus 10
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [oxidation-state, group-oxidation-state]
    stem: The highest oxidation state shown by a p-block element is generally equal to
    options:
      - the group number minus 10
      - the number of its p electrons only
      - the group number minus 12
      - eight minus the group number
    answer: 0
    explanation: The maximum (group) oxidation state equals the total number of valence s and p electrons, i.e. group number − 10 (+3 in group 13, +5 in group 15). Group number − 12 is the lower state favoured by the inert pair effect in heavier elements.
  - id: che-pblock-003
    topic: p-block-general
    subtopic: Inert pair effect
    concept: Inert pair effect makes Tl(+1) more stable than Tl(+3)
    category: concept
    format: assertion-reason
    difficulty: 3
    time: 60
    ncert: true
    battle: false
    tags: [inert-pair-effect, thallium, ncert-line]
    stem: |-
      Assertion (A): Thallium shows the +1 oxidation state more commonly than the +3 oxidation state.
      Reason (R): Down group 13, the ns^2 electrons are increasingly reluctant to take part in bonding because the intervening d and f electrons shield the nucleus poorly.
    options:
      - Both A and R are true and R is the correct explanation of A
      - Both A and R are true but R is not the correct explanation of A
      - A is true but R is false
      - A is false but R is true
    answer: 0
    explanation: In thallium the 6s^2 pair is held tightly (poor shielding by 4f and 5d electrons), so only the 6p electron is commonly used and Tl^+ is more stable than Tl^{3+}. This inert pair effect is exactly what R describes, so R explains A.
  - id: che-pblock-004
    topic: p-block-general
    subtopic: Acidic character of oxides
    concept: Acidic character of oxides increases across period 3 from Al to Cl
    category: application
    format: ordering
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [oxides, acidic-character, periodic-trend]
    stem: The correct order of increasing acidic character of the following oxides is
    options:
      - Cl_2O_7 < SO_3 < P_4O_{10} < SiO_2 < Al_2O_3
      - SiO_2 < Al_2O_3 < P_4O_{10} < SO_3 < Cl_2O_7
      - Al_2O_3 < SiO_2 < P_4O_{10} < SO_3 < Cl_2O_7
      - Al_2O_3 < P_4O_{10} < SiO_2 < Cl_2O_7 < SO_3
    answer: 2
    explanation: Across period 3 the non-metallic character and the oxidation state of the element increase, so the oxides change from amphoteric Al_2O_3 through weakly acidic SiO_2 to strongly acidic Cl_2O_7. Placing SiO_2 below Al_2O_3 ignores that Al_2O_3 is amphoteric.
  - id: che-pblock-005
    topic: p-block-general
    subtopic: Anomalous behaviour of the first member
    concept: First member of each p-block group forms pπ–pπ multiple bonds more readily
    category: concept
    format: statements
    difficulty: 3
    time: 60
    ncert: true
    battle: false
    tags: [anomalous-behaviour, multiple-bonding, trap]
    stem: Which statement about the anomalous behaviour of the first member of each p-block group is correct?
    options:
      - It can expand its covalency beyond four by using vacant d orbitals
      - It has the largest atomic radius in its group
      - It always shows the highest oxidation state of its group most stably
      - It has a greater ability than the heavier members to form pπ–pπ multiple bonds, both with itself and with other second-period elements
    answer: 3
    explanation: Small size and high electronegativity let second-period elements form strong pπ–pπ bonds such as C=C, N≡N and C=O. They have no d orbitals, so covalency is limited to four, they are the smallest in their groups, and F or O cannot show their group oxidation states.
  - id: che-pblock-006
    topic: p-block-general
    subtopic: Maximum covalency
    concept: Second-period p-block elements have a maximum covalency of four
    category: concept
    format: direct
    difficulty: 2
    time: 25
    ncert: true
    battle: true
    tags: [covalency, anomalous-behaviour]
    stem: The maximum covalency of the first member of each group of the p-block is limited to
    options:
      - "4"
      - "6"
      - "3"
      - "5"
    answer: 0
    explanation: Second-period elements have only four valence orbitals (one 2s and three 2p) and no d orbitals, so they can form at most four covalent bonds, as in BF_4^- or NH_4^+. Heavier members use d orbitals to reach 5 or 6 (PCl_5, SF_6).
  - id: che-pblock-007
    topic: group-13-properties
