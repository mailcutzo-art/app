  - id: che-pblock-025
    topic: group-14-properties
    subtopic: Trends in radius and ionisation enthalpy
    concept: Covalent radius rises sharply C to Si; IE of Pb is slightly higher than Sn
    category: concept
    format: statement-pair
    difficulty: 3
    time: 60
    ncert: true
    battle: false
    tags: [covalent-radius, ionisation-enthalpy, trap]
    stem: |-
      Statement I: The covalent radius increases considerably from carbon to silicon, but only slightly from silicon to lead.
      Statement II: The first ionisation enthalpy decreases regularly from carbon to lead.
    options:
      - Both Statement I and Statement II are correct
      - Both Statement I and Statement II are incorrect
      - Statement I is correct but Statement II is incorrect
      - Statement I is incorrect but Statement II is correct
    answer: 2
    explanation: The filled d and f subshells in heavier members shield poorly, so radius grows only slightly after silicon (Statement I correct). For the same reason the first ionisation enthalpy of Pb (715 kJ mol^{-1}) is slightly higher than that of Sn (708 kJ mol^{-1}), so the decrease is not regular.
  - id: che-pblock-026
    topic: group-14-properties
    subtopic: Oxidation states
    concept: Stability of +2 state increases Ge < Sn < Pb
    category: concept
    format: ordering
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [inert-pair-effect, oxidation-state]
    stem: The correct order of increasing stability of the +2 oxidation state in group 14 is
    options:
      - Ge^{2+} < Sn^{2+} < Pb^{2+}
      - Pb^{2+} < Sn^{2+} < Ge^{2+}
      - Sn^{2+} < Ge^{2+} < Pb^{2+}
      - Ge^{2+} < Pb^{2+} < Sn^{2+}
    answer: 0
    explanation: Because of the inert pair effect, the ns^2 electrons are used less readily down the group, so the tendency to show +2 increases Ge < Sn < Pb. That is why Pb(II) compounds are stable while Pb(IV) compounds are oxidising.
  - id: che-pblock-027
    topic: group-14-properties
    subtopic: Nature of oxides
