    options:
      - Boron
      - Aluminium
      - Gallium
      - Thallium
    answer: 1
    explanation: Aluminium (8.3% by mass) is the most abundant metal and the third most abundant element in the earth's crust, after oxygen and silicon. Boron is a fairly rare element.
  - id: che-pblock-008
    topic: group-13-properties
    subtopic: Atomic radii
    concept: Ga is smaller than Al because 3d electrons shield poorly
    category: concept
    format: direct
    difficulty: 3
    time: 45
    ncert: true
    battle: true
    tags: [atomic-radius, poor-shielding, exception]
    stem: The atomic radius of gallium (135 pm) is smaller than that of aluminium (143 pm) because
    options:
      - the ten 3d electrons of gallium shield the outer electrons poorly, so they feel a larger effective nuclear charge
      - gallium has one electron shell fewer than aluminium
      - gallium shows a stable +1 oxidation state due to the inert pair effect
      - the 4f electrons of gallium provide very poor shielding
    answer: 0
    explanation: Gallium has ten 3d electrons that screen the nucleus poorly, so its 4s and 4p electrons experience a higher effective nuclear charge and are pulled in. Gallium has no 4f electrons; poor 4f shielding matters only from hafnium onwards and for thallium.
  - id: che-pblock-009
    topic: group-13-properties
    subtopic: Melting points
    concept: Melting point in group 13 is lowest for gallium
    category: concept
    format: graph
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [melting-point, gallium, graph]
    stem: When the melting points of the group 13 elements B, Al, Ga, In and Tl are plotted against atomic number, the graph shows
    options:
      - a very high value for boron, a fall to a minimum at gallium, and then a rise for indium and thallium
      - a steady decrease from boron to thallium
      - a steady increase from boron to thallium
      - a minimum at aluminium followed by a steady increase up to thallium
    answer: 0
    explanation: The melting points are B 2453 K, Al 933 K, Ga 303 K, In 430 K and Tl 576 K, so the curve falls to a minimum at gallium, which melts just above room temperature, and then rises again. The trend is therefore not a steady decrease.
  - id: che-pblock-010
    topic: group-13-properties
    subtopic: Ionisation enthalpy
    concept: Irregular first ionisation enthalpy order in group 13
    category: application
    format: ordering
    difficulty: 4
    time: 90
    ncert: true
    battle: false
    tags: [ionisation-enthalpy, irregular-trend, trap]
    stem: The correct order of first ionisation enthalpy of the group 13 elements is
    options:
      - B > Al > Ga > In > Tl
      - B > Tl > Ga > Al > In
      - B > Ga > Tl > Al > In
      - Tl > B > Ga > In > Al
    answer: 1
    explanation: The values (kJ mol^{-1}) are B 801, Al 577, Ga 579, In 558 and Tl 589. Poor shielding by 3d electrons makes Ga slightly higher than Al, and poor shielding by 4f and 5d electrons makes Tl higher than both, so a smooth decrease is wrong.
  - id: che-pblock-011
    topic: group-13-properties
    subtopic: Covalent versus ionic compounds
    concept: Boron forms only covalent compounds; Al forms Al^{3+}
    category: concept
    format: statement-pair
    difficulty: 3
    time: 60
    ncert: true
    battle: false
    tags: [boron, aluminium, ionisation-enthalpy, ncert-line]
    stem: |-
      Statement I: Boron forms only covalent compounds because the sum of its first three ionisation enthalpies is very high.
      Statement II: On moving from boron to aluminium, the sum of the first three ionisation enthalpies decreases considerably, so aluminium is able to form Al^{3+} ions.
    options:
      - Both Statement I and Statement II are correct
      - Both Statement I and Statement II are incorrect
      - Statement I is correct but Statement II is incorrect
      - Statement I is incorrect but Statement II is correct
    answer: 0
    explanation: The tiny boron atom holds its electrons so strongly that B^{3+} cannot form, so boron compounds are covalent. The larger aluminium atom has a much lower sum of ionisation enthalpies, making it a highly electropositive metal that forms Al^{3+}; both statements are correct.
  - id: che-pblock-012
    topic: group-13-properties
    subtopic: Nature of oxides
    concept: Oxides change from acidic (B) through amphoteric (Al, Ga) to basic (In, Tl)
    category: application
    format: multi-statement
    difficulty: 4
    time: 90
    ncert: true
    battle: false
    tags: [oxides, acid-base-character, multi-concept]
    stem: |-
      Consider the following statements about the oxides of group 13 elements.
      I. B_2O_3 is acidic.
      II. Al_2O_3 and Ga_2O_3 are amphoteric.
      III. In_2O_3 and Tl_2O_3 are basic.
      IV. Tl_2O_3 is more acidic than Al_2O_3.
      The correct statements are
    options:
      - I and II only
      - II, III and IV only
      - I and IV only
      - I, II and III only
    answer: 3
    explanation: Metallic character increases down the group, so the oxides change from acidic B_2O_3 through amphoteric Al_2O_3 and Ga_2O_3 to basic In_2O_3 and Tl_2O_3. Statement IV reverses this trend, so only I, II and III are correct.
  - id: che-pblock-013
    topic: group-13-properties
    subtopic: Chemical reactivity
    concept: Group 13 elements form trihalides except TlI_3
    category: application
    format: statements
    difficulty: 4
    time: 75
    ncert: true
    battle: false
    tags: [reactivity, trihalides, trap, ncert-line]
    stem: Which statement about the reactivity of the group 13 elements is incorrect?
    options:
      - All group 13 elements form stable trihalides, including TlI_3
      - Crystalline boron is unreactive, but amorphous boron on heating in air forms B_2O_3
      - Aluminium dissolves in dilute HCl as well as in aqueous NaOH, liberating H_2
      - Concentrated HNO_3 renders aluminium passive by forming a protective oxide layer
    answer: 0
    explanation: The elements form trihalides EX_3 except TlI_3; the compound of that formula is really Tl^+(I_3)^-, because Tl^{3+} would oxidise iodide. The other three statements are correct NCERT facts about boron and amphoteric aluminium.
  - id: che-pblock-014
    topic: group-13-properties
    subtopic: Lewis acid character
    concept: Electron-deficient BCl_3 acts as a Lewis acid towards NH_3
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [lewis-acid, electron-deficient]
    stem: Boron trichloride readily forms the adduct BCl_3·NH_3 because BCl_3 is
    options:
      - a Lewis base with a lone pair on boron
      - an ionic compound containing B^{3+}
      - electron deficient and acts as a Lewis acid
      - a Brønsted acid that donates a proton to NH_3
    answer: 2
    explanation: Boron in BCl_3 has only six electrons in its valence shell, so it accepts the lone pair of NH_3 to complete its octet; BCl_3 is a Lewis acid. It has no lone pair on boron and no proton to donate.
  - id: che-pblock-015
    topic: group-13-properties
    subtopic: Dimerisation of AlCl3
    concept: AlCl_3 dimerises through chlorine bridges to complete the octet of Al
    category: concept
    format: direct
    difficulty: 3
    time: 45
    ncert: true
    battle: true
    tags: [aluminium-chloride, dimer, electron-deficient]
    stem: Aluminium chloride achieves stability by forming the dimer Al_2Cl_6. The dimer forms because
    options:
      - Al–Al metallic bonds form between two AlCl_3 units
      - hydrogen bonds link two AlCl_3 molecules
      - aluminium uses its vacant 3d orbitals to form π bonds with chlorine
      - each Al accepts a lone pair from a chlorine atom of the other AlCl_3 unit, completing its octet through Cl bridges
    answer: 3
    explanation: Monomeric AlCl_3 is electron deficient (six electrons around Al). In Al_2Cl_6 each aluminium accepts a lone pair from a chlorine of the partner unit, giving two Cl bridges and a tetrahedral octet around each Al. No hydrogen or Al–Al bond is involved.
  - id: che-pblock-016
    topic: boron-aluminium-compounds
    subtopic: Borax
    concept: Formula of borax
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [borax, formula]
    stem: The chemical formula of borax is
    options:
      - NaBO_2
      - Na_2B_4O_7·10H_2O
      - H_3BO_3
      - Na_2B_2O_4·10H_2O
    answer: 1
    explanation: Borax is sodium tetraborate decahydrate, Na_2B_4O_7·10H_2O; its correct structural formula is Na_2[B_4O_5(OH)_4]·8H_2O. NaBO_2 is sodium metaborate and H_3BO_3 is orthoboric acid.
  - id: che-pblock-017
    topic: boron-aluminium-compounds
    subtopic: Borax
    concept: Aqueous borax is alkaline due to hydrolysis to NaOH and H_3BO_3
    category: concept
    format: direct
    difficulty: 3
    time: 45
    ncert: true
    battle: true
    tags: [borax, hydrolysis]
    stem: An aqueous solution of borax is alkaline because
    options:
      - borax releases ammonia when dissolved in water
      - boric acid formed on dissolution is a strong acid
      - sodium ions react with water to liberate hydrogen
      - it hydrolyses to give the strong base NaOH and the weak acid H_3BO_3
    answer: 3
    explanation: Na_2B_4O_7 + 7H_2O → 2NaOH + 4H_3BO_3. NaOH is a strong base while orthoboric acid is a very weak acid, so the solution is alkaline. Boric acid is weak, not strong.
  - id: che-pblock-018
    topic: boron-aluminium-compounds
    subtopic: Structure of diborane
    concept: Terminal B–H bonds are 2c–2e and shorter than 3c–2e bridge bonds
    category: concept
    format: diagram
    difficulty: 4
    time: 90
    ncert: true
    battle: false
    diagram: "Structure of diborane, B_2H_6: two B atoms side by side, each carrying two terminal H atoms; the two B atoms and all four terminal H atoms lie in one horizontal plane, and one terminal B–H bond is labelled 'a'. Two bridging H atoms sit one above and one below this plane, each joined to both B atoms by curved (banana) bonds; one B–H–B bridge bond is labelled 'b'."
    tags: [diborane, three-centre-bond, structure]
    stem: In the structure of diborane shown, bond 'a' is a terminal B–H bond and bond 'b' is a bridging B–H bond. Which statement about these bonds is correct?
    options:
      - b is a two-centre two-electron bond and is shorter than a
      - a and b are both three-centre two-electron bonds
      - a is a two-centre two-electron bond and is shorter than b
      - a is a three-centre two-electron bond and is longer than b
    answer: 2
    explanation: The four terminal B–H bonds are ordinary two-centre two-electron bonds, while each bridge B–H–B unit holds only two electrons over three atoms (a banana bond). The electron-poor bridge bonds are longer, so a is shorter than b.
  - id: che-pblock-019
    topic: boron-aluminium-compounds
    subtopic: Orthoboric acid
    concept: Boric acid is monobasic by accepting OH^-; its layer structure does not explain this
    category: concept
    format: assertion-reason
    difficulty: 3
    time: 60
    ncert: true
    battle: false
    tags: [boric-acid, lewis-acid, structure]
    stem: |-
      Assertion (A): Orthoboric acid is a weak monobasic acid.
      Reason (R): Orthoboric acid has a layer structure in which planar BO_3 units are joined by hydrogen bonds.
    options:
      - Both A and R are true and R is the correct explanation of A
      - Both A and R are true but R is not the correct explanation of A
      - A is true but R is false
      - A is false but R is true
    answer: 1
    explanation: B(OH)_3 is monobasic because it acts as a Lewis acid, accepting OH^- from water to form [B(OH)_4]^- and releasing one H_3O^+. Its hydrogen-bonded layer structure is also true, but it explains its softness and crystal form, not its basicity.
  - id: che-pblock-020
    topic: boron-aluminium-compounds
    subtopic: Uses of boron compounds
    concept: Uses and properties of borax, boric acid, diborane and NaBH_4
    category: factual
    format: match
    difficulty: 3
    time: 60
    ncert: true
    battle: false
    tags: [uses, boron-compounds]
    stem: |-
      Match the compounds in List I with their properties or uses in List II.
      List I: P. Borax  Q. Orthoboric acid  R. Diborane  S. Sodium borohydride
      List II: 1. Reducing agent in organic synthesis  2. Flux for soldering metals  3. Burns in oxygen releasing a very large amount of energy  4. Aqueous solution used as a mild antiseptic
    options:
      - P-4, Q-2, R-1, S-3
      - P-2, Q-3, R-4, S-1
      - P-1, Q-4, R-3, S-2
