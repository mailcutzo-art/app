    answer: 3
    explanation: Borax is a flux for soldering, dilute boric acid is a mild antiseptic, diborane burns in oxygen with Δ_cH = −1976 kJ mol^{-1}, and NaBH_4 is a reducing agent in organic synthesis. Hence P-2, Q-4, R-3, S-1.
  - id: che-pblock-021
    topic: boron-aluminium-compounds
    subtopic: Borax bead test
    concept: Blue borax bead with cobalt is cobalt metaborate
    category: application
    format: case
    difficulty: 4
    time: 90
    ncert: true
    battle: false
    tags: [borax-bead-test, metaborate, qualitative-analysis]
    stem: In a borax bead test, borax is heated on a platinum loop until it swells and then melts into a clear glassy bead of NaBO_2 and B_2O_3. When this bead is heated again with a trace of cobalt(II) oxide, it turns blue. The blue colour is due to
    options:
      - Co(BO_2)_2
      - CoO
      - Na_2B_4O_7
      - Co_3(BO_3)_2
    answer: 0
    explanation: B_2O_3 in the bead combines with the metal oxide to form the metaborate, CoO + B_2O_3 → Co(BO_2)_2, which is blue. Transition metal metaborates have characteristic colours, which is why the test identifies them; CoO itself is not the coloured product.
  - id: che-pblock-022
    topic: boron-aluminium-compounds
