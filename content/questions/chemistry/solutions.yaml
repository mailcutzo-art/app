questions:
  - id: che-sol-001
    topic: types-of-solutions
    subtopic: Solid solutions
    concept: Hydrogen in palladium is a gas-in-solid solution
    category: factual
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    tags: [types, ncert-line]
    stem: Which of the following is an example of a solid solution in which the solute is a gas?
    options:
      - Camphor in nitrogen gas
      - Solution of hydrogen in palladium
      - Amalgam of mercury with sodium
      - Copper dissolved in gold
    answer: 1
    explanation: "In a solution of hydrogen in palladium the solvent (palladium) is a solid and the solute (hydrogen) is a gas. Camphor in nitrogen is a gaseous solution, sodium amalgam is liquid in solid and copper in gold is solid in solid."

  - id: che-sol-002
    topic: types-of-solutions
    subtopic: Solid solutions
    concept: Sodium amalgam is a liquid-in-solid solution
    category: factual
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    tags: [types, ncert-line]
    stem: An amalgam of mercury with sodium is classified as a solution of the type
    options:
      - liquid solute in solid solvent
      - solid solute in liquid solvent
      - solid solute in solid solvent
      - liquid solute in liquid solvent
    answer: 0
    explanation: "NCERT lists amalgam of mercury with sodium as a solid solution with a liquid solute (mercury). The solvent, sodium metal, is solid, so the solution is solid. Students often reverse solute and solvent because mercury is a liquid."

  - id: che-sol-003
    topic: types-of-solutions
    subtopic: Gaseous solutions
    concept: Camphor in nitrogen gas is a solid-in-gas solution
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [types, ncert-line]
    stem: A solution of camphor in nitrogen gas is an example of which type of solution?
    options:
      - Gas in solid
      - Gas in gas
      - Solid in liquid
      - Solid in gas
    answer: 3
    explanation: "Nitrogen, the component present in larger amount, is the solvent and is a gas, so the solution is gaseous. Camphor is the solid solute, giving a solid-in-gas solution."

  - id: che-sol-004
    topic: types-of-solutions
    subtopic: Nature of solutions
    concept: Solutions have uniform composition and properties throughout
    category: concept
    format: statements
    difficulty: 1
    time: 30
    ncert: true
    battle: true
    tags: [homogeneous-mixture]
    stem: Which statement about solutions is correct?
    options:
      - Air is a heterogeneous mixture of gases
      - Every solution must have a liquid solvent
      - A solution has uniform composition and properties throughout
      - Brass is an example of a gaseous solution
    answer: 2
    explanation: "A solution is a homogeneous mixture, so its composition and properties are the same throughout. Air is a homogeneous gaseous solution, solvents can be solid or gas as well as liquid, and brass is a solid solution of zinc in copper."

  - id: che-sol-005
    topic: types-of-solutions
    subtopic: Classification by physical state
    concept: Matching common solutions to their solute-solvent states
    category: factual
    format: match
    difficulty: 2
    time: 60
    ncert: true
    battle: false
    tags: [types, ncert-line]
    stem: |-
      Match List I with List II.
      List I
      P. Oxygen dissolved in water
      Q. Copper dissolved in gold
      R. Chloroform mixed with nitrogen gas
      S. Glucose dissolved in water
      List II
      1. Solid in solid
      2. Gas in liquid
      3. Solid in liquid
      4. Liquid in gas
    options:
      - P-2, Q-3, R-4, S-1
      - P-4, Q-1, R-2, S-3
      - P-2, Q-1, R-3, S-4
      - P-2, Q-1, R-4, S-3
    answer: 3
    explanation: "Oxygen in water is gas in liquid (P-2), copper in gold is solid in solid (Q-1), chloroform vapour in nitrogen is liquid in gas (R-4) and glucose in water is solid in liquid (S-3)."

  - id: che-sol-006
    topic: types-of-solutions
    subtopic: Gaseous solutions
    concept: Air behaves as a gaseous solution because gases mix completely
    category: concept
    format: assertion-reason
    difficulty: 2
    time: 45
    ncert: true
    battle: false
    tags: [types]
    stem: |-
      Assertion (A): Air can be regarded as a gaseous solution.
      Reason (R): Gases mix in all proportions to form a homogeneous mixture.
    options:
      - Both A and R are true and R is the correct explanation of A
      - Both A and R are true but R is not the correct explanation of A
      - A is true but R is false
      - A is false but R is true
    answer: 0
    explanation: "Air is a homogeneous mixture of nitrogen, oxygen and other gases, so it is a gaseous solution. It is homogeneous precisely because gases intermix freely in all proportions, so R explains A."

  - id: che-sol-007
    topic: types-of-solutions
    subtopic: Classification by physical state
    concept: Identifying correct statements on solution types
    category: application
    format: multi-statement
    difficulty: 3
    time: 60
    ncert: true
    battle: false
    tags: [types]
    stem: |-
      Consider the statements.
      I. In a gaseous solution the solvent is a gas.
      II. Chloroform mixed with nitrogen gas is a gaseous solution.
      III. Glucose dissolved in water is a liquid solution.
      IV. Copper dissolved in gold is a liquid solution.
      Which statements are correct?
    options:
      - I and II only
      - I, II and III only
      - II and IV only
      - I, III and IV only
    answer: 1
    explanation: "The physical state of a solution is that of its solvent. Statements I, II and III follow this rule. Copper dissolved in gold has a solid solvent (gold), so it is a solid solution and IV is wrong."

  - id: che-sol-008
    topic: concentration-terms
    subtopic: Molality
    concept: Definition of molality
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [molality]
    stem: Molality of a solution is defined as the number of moles of solute present in
    options:
      - 1 L of solution
      - 1 L of solvent
      - 1 kg of solvent
      - 1 kg of solution
    answer: 2
    explanation: "Molality (m) = moles of solute ÷ mass of solvent in kg. The trap is 1 kg of solution; that is not used, and per litre of solution defines molarity."

  - id: che-sol-009
    topic: concentration-terms
    subtopic: Temperature dependence
    concept: Molarity changes with temperature because volume changes
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [molarity, trap]
    stem: Which of the following concentration terms changes with temperature?
    options:
      - Molality
      - Mole fraction
      - Mass percentage
      - Molarity
    answer: 3
    explanation: "Molarity is moles per litre of solution, and volume expands or contracts with temperature. Molality, mole fraction and mass percentage involve only masses or moles, so they are temperature independent."

  - id: che-sol-010
    topic: concentration-terms
    subtopic: Molarity
    concept: Molarity from mass of solute and volume of solution
    category: numerical
    format: direct
    difficulty: 2
    time: 40
    ncert: true
    battle: true
    formula: M = (w/M_2) ÷ V(L)
    tags: [molarity]
    stem: 4 g of NaOH is dissolved in water to make 250 mL of solution. What is its molarity?
    options:
      - 0.1 M
      - 0.4 M
      - 0.8 M
      - 1.6 M
    answer: 1
    explanation: "Moles of NaOH = 4/40 = 0.1 mol. Molarity = 0.1 ÷ 0.250 L = 0.4 M. Using 250 mL as if it were 1 L gives the wrong 0.1 M."

  - id: che-sol-011
    topic: concentration-terms
    subtopic: Molality
    concept: Molality from mass of solute and mass of solvent
    category: numerical
    format: direct
    difficulty: 2
    time: 40
    ncert: true
    battle: true
    formula: m = (w_2/M_2) ÷ w_1(kg)
    tags: [molality]
    stem: 9 g of glucose (molar mass 180 g mol^{-1}) is dissolved in 500 g of water. The molality of the solution is
    options:
      - 0.01 m
      - 0.05 m
      - 0.1 m
      - 0.2 m
    answer: 2
    explanation: "Moles of glucose = 9/180 = 0.05 mol. Molality = 0.05 ÷ 0.500 kg = 0.1 mol kg^{-1}. Forgetting to divide by the mass in kg gives 0.05."

  - id: che-sol-012
    topic: concentration-terms
    subtopic: Mole fraction
    concept: Mole fraction of a component in a binary liquid mixture
    category: numerical
    format: direct
    difficulty: 2
    time: 45
    ncert: true
    battle: true
    formula: x_A = n_A/(n_A + n_B)
    tags: [mole-fraction]
    stem: 46 g of ethanol is mixed with 36 g of water. The mole fraction of ethanol in the mixture is about
    options:
      - "0.50"
      - "0.25"
      - "0.67"
      - "0.33"
    answer: 3
    explanation: "Moles of ethanol = 46/46 = 1 and moles of water = 36/18 = 2. Mole fraction of ethanol = 1/(1 + 2) = 0.33. The value 0.67 is the mole fraction of water."

  - id: che-sol-013
    topic: concentration-terms
    subtopic: Molarity to molality conversion
    concept: Converting molarity to molality using density
    category: numerical
    format: direct
    difficulty: 4
    time: 120
    ncert: true
    battle: false
    formula: m = 1000M/(1000d − M × M_2)
    tags: [molarity, molality, multi-concept]
    stem: A 2 M aqueous solution of NaOH has a density of 1.08 g mL^{-1}. What is its molality? (Molar mass of NaOH = 40 g mol^{-1})
    options:
      - 1.85 m
      - 2.00 m
      - 2.16 m
      - 1.08 m
    answer: 1
    explanation: "Take 1 L of solution. Its mass = 1000 × 1.08 = 1080 g. It contains 2 mol NaOH = 80 g, so mass of water = 1080 − 80 = 1000 g = 1 kg. Molality = 2 mol ÷ 1 kg = 2.00 m."

  - id: che-sol-014
    topic: concentration-terms
    subtopic: Mole fraction and molality
    concept: Mole fraction of solute in a 1 molal aqueous solution
    category: numerical
    format: direct
    difficulty: 3
    time: 60
    ncert: true
    battle: false
    formula: x_2 = n_2/(n_1 + n_2)
    tags: [mole-fraction, molality]
    stem: What is the mole fraction of the solute in a 1.00 molal aqueous solution?
    options:
      - "0.0177"
      - "0.0555"
      - "0.982"
      - "0.100"
    answer: 0
    explanation: "1 mol of solute is present in 1000 g water = 1000/18 = 55.5 mol water. x_2 = 1/(1 + 55.5) = 0.0177. The value 0.982 is the mole fraction of water."

  - id: che-sol-015
    topic: concentration-terms
    subtopic: Parts per million
    concept: Expressing trace concentrations in ppm
    category: numerical
    format: direct
    difficulty: 2
    time: 40
    ncert: true
    battle: true
    formula: ppm = (mass of component/total mass) × 10^6
    tags: [ppm]
    stem: A 1 kg sample of water contains 0.005 g of dissolved oxygen. The concentration of oxygen in ppm is
    options:
      - "50"
      - "0.5"
      - "500"
      - "5"
    answer: 3
    explanation: "ppm = (0.005 g ÷ 1000 g) × 10^6 = 5 ppm. Forgetting to convert 1 kg into 1000 g leads to wrong powers of ten."

  - id: che-sol-016
    topic: concentration-terms
    subtopic: Mass percentage
    concept: Mass percentage uses mass of solution in the denominator
    category: numerical
    format: direct
    difficulty: 1
    time: 30
    ncert: true
    battle: true
    formula: w/w % = (mass of solute/mass of solution) × 100
    tags: [mass-percentage, trap]
    stem: 5 g of common salt is dissolved in 45 g of water. The mass percentage of salt in the solution is
    options:
      - 10%
      - 11.1%
      - 5%
      - 90%
    answer: 0
    explanation: "Mass of solution = 5 + 45 = 50 g, so mass % = 5/50 × 100 = 10%. Dividing by the mass of water alone gives the trap answer 11.1%."

  - id: che-sol-017
    topic: concentration-terms
    subtopic: Comparing concentration terms
    concept: Properties of molality, molarity and mole fraction
    category: concept
    format: statements
    difficulty: 2
    time: 40
    ncert: true
    battle: false
    tags: [molality, mole-fraction]
    stem: Which of the following statements is correct?
    options:
      - Molarity is expressed in mol kg^{-1}
      - Mole fraction has the unit mol^{-1}
      - The sum of mole fractions of the two components of a binary solution is 2
      - Molality of a solution does not change when it is heated
    answer: 3
    explanation: "Molality depends only on masses, which do not change on heating. Molarity is in mol L^{-1}, mole fraction is dimensionless and the mole fractions of all components add up to 1."

  - id: che-sol-018
    topic: concentration-terms
    subtopic: Molarity
    concept: Molarity of pure water
    category: numerical
    format: direct
    difficulty: 2
    time: 30
    ncert: false
    battle: true
    tags: [molarity, water]
    stem: Taking the density of water as 1 g mL^{-1}, the molarity of pure water is about
    options:
      - 1 M
      - 18 M
      - 55.5 M
      - 100 M
    answer: 2
    explanation: "1 L of water weighs 1000 g, which is 1000/18 = 55.5 mol. So pure water is about 55.5 M. The value 18 is its molar mass, not its molarity."

  - id: che-sol-019
    topic: concentration-terms
    subtopic: Molality
    concept: Mass of solute needed for a solution of given molality
    category: numerical
    format: direct
    difficulty: 3
    time: 60
    ncert: true
    battle: false
    formula: n_2 = m × w_1(kg)
    tags: [molality, urea]
    stem: What mass of urea (NH_2CONH_2, molar mass 60 g mol^{-1}) must be dissolved in 2.5 kg of water to make a 0.25 molal solution?
    options:
      - 15 g
      - 3.75 g
      - 37.5 g
      - 150 g
    answer: 2
    explanation: "Moles of urea = molality × kg of water = 0.25 × 2.5 = 0.625 mol. Mass = 0.625 × 60 = 37.5 g. Treating 2.5 kg as 1 kg gives 15 g."

  - id: che-sol-020
    topic: concentration-terms
    subtopic: Choice of concentration unit
    concept: Molality is preferred for colligative work as it is temperature independent
    category: concept
    format: assertion-reason
    difficulty: 3
    time: 45
    ncert: true
    battle: false
    tags: [molality, molarity]
    stem: |-
      Assertion (A): Molality is preferred over molarity for expressing concentration in studies of boiling and freezing points.
      Reason (R): Molality is based on the mass of solvent, which does not change with temperature.
    options:
      - Both A and R are true and R is the correct explanation of A
      - Both A and R are true but R is not the correct explanation of A
      - A is true but R is false
      - A is false but R is true
    answer: 0
    explanation: "Boiling and freezing point measurements involve temperature change. Molarity would change with volume, but molality uses mass of solvent, which is constant, so R correctly explains A."

  - id: che-sol-021
    topic: solubility-henrys-law
    subtopic: Henry's law constant
    concept: Larger K_H means lower solubility of a gas
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    formula: p = K_H x
    tags: [henrys-law, trap]
    stem: At a given temperature and partial pressure, a gas with a higher Henry's law constant K_H has
    options:
      - higher solubility in the liquid
      - lower solubility in the liquid
      - the same solubility as other gases
      - solubility that does not depend on pressure
    answer: 1
    explanation: "From p = K_H x, x = p/K_H. At fixed p, a larger K_H gives a smaller mole fraction of dissolved gas, so the solubility is lower. Many students assume a bigger constant means more solubility."

  - id: che-sol-022
    topic: solubility-henrys-law
    subtopic: Temperature and gas solubility
    concept: Solubility of gases in liquids decreases with rise in temperature
    category: concept
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    tags: [gas-solubility, ncert-line]
    stem: How does the solubility of a gas in water change as the temperature is raised?
    options:
      - It increases steadily
      - It remains unchanged
      - It first increases and then decreases
      - It decreases
    answer: 3
    explanation: "Dissolution of a gas is exothermic, so by Le Chatelier's principle raising the temperature shifts the equilibrium back and solubility decreases. This is also seen as K_H increasing with temperature."

  - id: che-sol-023
    topic: solubility-henrys-law
    subtopic: Applications of Henry's law
    concept: Helium is used to dilute air in scuba tanks to avoid bends
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [henrys-law, scuba, ncert-line]
    stem: To avoid the painful condition called bends, the air in tanks used by scuba divers is diluted with
    options:
      - helium
      - nitrogen
      - carbon dioxide
      - argon
    answer: 0
    explanation: "At depth, high pressure increases the solubility of nitrogen in blood, and on surfacing it forms bubbles, causing bends. NCERT notes the tanks use air diluted with helium (about 11.7% He, 56.2% N_2 and 32.1% O_2). Adding nitrogen would worsen bends."

  - id: che-sol-024
    topic: solubility-henrys-law
    subtopic: Applications of Henry's law
    concept: Anoxia at high altitude from low partial pressure of oxygen
    category: application
    format: case
    difficulty: 2
    time: 45
    ncert: true
    battle: false
    tags: [henrys-law, anoxia]
    stem: Climbers at high altitude often feel weak and are unable to think clearly. This condition, anoxia, occurs mainly because
    options:
      - the temperature at high altitude increases the solubility of oxygen in blood
      - the low partial pressure of oxygen reduces its concentration in blood
      - nitrogen dissolves in blood and forms bubbles
      - carbon dioxide becomes more soluble in blood at low pressure
    answer: 1
    explanation: "By Henry's law the amount of dissolved gas is proportional to its partial pressure. At high altitude the partial pressure of O_2 is lower, so less oxygen dissolves in blood and tissues. Nitrogen bubbles describe bends, not anoxia."

  - id: che-sol-025
    topic: solubility-henrys-law
    subtopic: Henry's law calculations
    concept: Mole fraction of dissolved gas from Henry's law
    category: numerical
    format: direct
    difficulty: 2
    time: 40
    ncert: true
    battle: true
    formula: x = p/K_H
    tags: [henrys-law]
    stem: The Henry's law constant of a gas in water is 100 kbar at 298 K. What is its mole fraction in water when its partial pressure is 1 bar?
    options:
      - 1 × 10^{-5}
      - 1 × 10^{-3}
      - 1 × 10^{-8}
      - 1 × 10^{5}
    answer: 0
    explanation: "x = p/K_H = 1 bar ÷ (100 × 10^3 bar) = 1 × 10^{-5}. Forgetting that 1 kbar = 1000 bar gives 1 × 10^{-2} or other wrong powers."

  - id: che-sol-026
    topic: solubility-henrys-law
    subtopic: Pressure and gas solubility
    concept: Mass of gas dissolved is proportional to its partial pressure
    category: numerical
    format: direct
    difficulty: 2
    time: 35
    ncert: true
    battle: true
    tags: [henrys-law, proportionality]
    stem: The solubility of a gas in water is 0.02 g L^{-1} at 2 atm. At the same temperature, what is its solubility at 5 atm?
    options:
      - 0.008 g L^{-1}
      - 0.04 g L^{-1}
      - 0.05 g L^{-1}
      - 0.10 g L^{-1}
    answer: 2
    explanation: "By Henry's law the solubility is proportional to the partial pressure. Solubility at 5 atm = 0.02 × 5/2 = 0.05 g L^{-1}."

  - id: che-sol-027
    topic: solubility-henrys-law
    subtopic: Applications of Henry's law
    concept: Soft drinks are bottled under high CO2 pressure
    category: factual
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    tags: [henrys-law, ncert-line]
    stem: Soft drink and soda water bottles are sealed under high pressure mainly to
    options:
      - prevent the entry of oxygen
      - lower the freezing point of the drink
      - kill microorganisms in the drink
      - increase the solubility of carbon dioxide
    answer: 3
    explanation: "According to Henry's law, a higher partial pressure of CO_2 increases its solubility, so the bottles are sealed under high pressure. On opening, the pressure falls and the gas fizzes out."

  - id: che-sol-028
    topic: solubility-henrys-law
    subtopic: Solubility of solids
    concept: Endothermic dissolution means solubility increases with temperature
    category: concept
    format: direct
    difficulty: 3
    time: 45
    ncert: true
    battle: false
    tags: [solid-solubility, le-chatelier]
    stem: For a solid whose dissolution in water is endothermic (Δ_{sol}H > 0) and which is in equilibrium with its saturated solution, the solubility on increasing temperature will
    options:
      - increase
      - decrease
      - remain unchanged
      - first decrease and then increase
    answer: 0
    explanation: "Solute + solvent ⇌ solution is an equilibrium. If dissolution absorbs heat, raising temperature shifts it forward by Le Chatelier's principle, so solubility increases. It decreases only when Δ_{sol}H is negative."

  - id: che-sol-029
    topic: solubility-henrys-law
    subtopic: Pressure and solid solubility
    concept: Pressure hardly affects solubility of solids because solids and liquids are incompressible
    category: concept
    format: statement-pair
    difficulty: 2
    time: 45
    ncert: true
    battle: false
    tags: [solid-solubility, ncert-line]
    stem: |-
      Statement I: Pressure does not have any significant effect on the solubility of solids in liquids.
      Statement II: Solids and liquids are highly incompressible.
    options:
      - Both Statement I and Statement II are correct
      - Both Statement I and Statement II are incorrect
      - Statement I is correct but Statement II is incorrect
      - Statement I is incorrect but Statement II is correct
    answer: 0
    explanation: "NCERT states that pressure has no significant effect on the solubility of solids in liquids because solids and liquids are practically incompressible and hardly respond to pressure changes. Both statements are correct."

  - id: che-sol-030
    topic: solubility-henrys-law
    subtopic: Henry's law constant
    concept: K_H has the units of pressure when p = K_H x
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [henrys-law, units]
    stem: When Henry's law is written as p = K_H x, where x is the mole fraction of the gas in solution, the unit of K_H is
    options:
      - mol L^{-1}
      - mol L^{-1} bar^{-1}
      - bar
      - it is dimensionless
    answer: 2
    explanation: "Mole fraction x has no unit, so K_H = p/x carries the unit of pressure, e.g. bar or kbar. mol L^{-1} bar^{-1} would apply to the form C = kp."

  - id: che-sol-031
    topic: solubility-henrys-law
    subtopic: Henry's law graph
    concept: Plot of partial pressure against mole fraction of gas is linear with slope K_H
    category: concept
    format: graph
    difficulty: 3
    time: 45
    ncert: true
    battle: false
    tags: [henrys-law, graph]
    stem: For a gas obeying Henry's law, a plot of the partial pressure of the gas (y-axis) against its mole fraction in solution (x-axis) at constant temperature is
    options:
      - a straight line through the origin with slope 1/K_H
      - a rectangular hyperbola
      - a straight line through the origin with slope K_H
      - an exponentially rising curve
    answer: 2
    explanation: "Since p = K_H x, the graph of p against x is a straight line passing through the origin whose slope equals K_H. Slope 1/K_H would be for x plotted on the y-axis."

  - id: che-sol-032
    topic: vapour-pressure-raoults-law
    subtopic: Raoult's law
    concept: Partial vapour pressure equals mole fraction times pure vapour pressure
    category: factual
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    formula: p_1 = x_1 p_1°
    tags: [raoults-law]
    stem: According to Raoult's law, for a solution of volatile liquids the partial vapour pressure of each component is
    options:
      - inversely proportional to its mole fraction
      - directly proportional to its mole fraction
      - independent of its mole fraction
      - proportional to the square of its mole fraction
    answer: 1
    explanation: "Raoult's law states that p_1 = x_1 p_1°, so the partial vapour pressure of each volatile component is directly proportional to its mole fraction in the solution."

  - id: che-sol-033
    topic: vapour-pressure-raoults-law
    subtopic: Total vapour pressure
    concept: Total vapour pressure of an ideal binary solution
    category: numerical
    format: direct
    difficulty: 2
    time: 40
    ncert: true
    battle: true
