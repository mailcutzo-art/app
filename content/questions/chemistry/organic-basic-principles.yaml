    ncert: true
    battle: true
    tags: [hybridisation, ncert-line]
    stem: The hybridisation of carbon atoms C1, C2 and C3 in CH_2=CH–C≡N (numbered from left) is respectively
    options:
      - sp^2, sp^2, sp
      - sp^2, sp, sp
      - sp^3, sp^2, sp
      - sp, sp^2, sp^2
    answer: 0
    explanation: Both carbons of the C=C double bond are sp^2 hybridised, and the nitrile carbon (C≡N) forms a triple bond, so it is sp. A carbon with a double bond is never sp^3.
  - id: che-goc-002
    topic: carbon-tetravalence
    subtopic: s-character and electronegativity
    concept: Greater s-character makes a hybrid orbital more electronegative
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [s-character, electronegativity]
    stem: Which hybridised carbon is the most electronegative?
    options:
      - sp^3
      - sp^2
      - sp
      - sp^3d
    answer: 2
    explanation: An sp orbital has 50% s-character, the highest among sp, sp^2 (33%) and sp^3 (25%). s electrons are held closer to the nucleus, so sp carbon is most electronegative. Carbon never shows sp^3d hybridisation.
  - id: che-goc-003
    topic: carbon-tetravalence
    subtopic: Sigma and pi bonds
    concept: Counting σ and π bonds in buta-1,3-diene
    category: numerical
    format: direct
    difficulty: 2
    time: 40
    ncert: false
    battle: true
    tags: [sigma-pi-count]
    stem: The number of σ and π bonds in buta-1,3-diene (CH_2=CH–CH=CH_2) is
    options:
      - 7 σ and 2 π
      - 9 σ and 2 π
      - 11 σ and 2 π
      - 9 σ and 4 π
    answer: 1
    explanation: There are 6 C–H σ bonds and 3 C–C σ bonds (one in each double bond plus the central single bond) = 9 σ; each of the two double bonds adds one π bond. A common slip is counting two π bonds per C=C.
  - id: che-goc-004
    topic: carbon-tetravalence
    subtopic: Bond length and hybridisation
    concept: C–C bond length decreases as s-character increases
    category: factual
    format: ordering
    difficulty: 2
    time: 40
    ncert: true
    battle: true
    tags: [bond-length, ncert-line]
    stem: The correct order of carbon–carbon bond length is
    options:
      - C≡C > C=C > C–C
      - C=C > C–C > C≡C
      - C–C > C≡C > C=C
      - C–C > C=C > C≡C
    answer: 3
    explanation: Bond lengths are about 154 pm (C–C, sp^3), 134 pm (C=C, sp^2) and 120 pm (C≡C, sp). More s-character and more shared electron pairs shorten the bond.
  - id: che-goc-005
    topic: carbon-tetravalence
    subtopic: Shapes of molecules
    concept: Allene has perpendicular π bonds and a central sp carbon
    category: concept
    format: direct
    difficulty: 4
    time: 90
    ncert: false
    battle: false
    tags: [allene, hybridisation, trap]
    stem: In allene (CH_2=C=CH_2), the hybridisation of the central carbon and the relative orientation of the two terminal CH_2 planes are
    options:
      - sp^2; the two CH_2 planes are coplanar
      - sp; the two CH_2 planes are coplanar
      - sp; the two CH_2 planes are perpendicular
      - sp^2; the two CH_2 planes are perpendicular
    answer: 2
    explanation: The central carbon forms two σ bonds and two π bonds, so it is sp. Its two unhybridised p orbitals are at 90°, so the two π bonds lie in perpendicular planes and the terminal CH_2 groups are twisted by 90°. Assuming a flat molecule like ethene is the trap.
  - id: che-goc-006
    topic: carbon-tetravalence
    subtopic: Pi bond formation
    concept: A π bond needs parallel p orbitals, restricting rotation
    category: concept
    format: assertion-reason
    difficulty: 3
    time: 60
    ncert: true
    battle: false
    tags: [pi-bond, restricted-rotation, ncert-line]
    stem: |-
      Assertion (A): Rotation about a carbon–carbon double bond is restricted.
      Reason (R): A π bond is formed by sideways overlap of parallel p orbitals, and rotation would destroy this overlap.
    options:
      - Both A and R are true and R is the correct explanation of A
      - Both A and R are true but R is not the correct explanation of A
      - A is true but R is false
      - A is false but R is true
    answer: 0
    explanation: The π electron cloud lies above and below the molecular plane; twisting one carbon would break the parallel alignment of the p orbitals and hence the π bond. This is exactly why free rotation about C=C is restricted.
