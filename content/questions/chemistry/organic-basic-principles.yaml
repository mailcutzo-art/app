    concept: All carbons of benzene are sp^2 and the ring is planar
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [benzene, hybridisation]
    stem: The hybridisation of each carbon atom in benzene is
    options:
      - sp^3
      - sp
      - sp^2
      - a mix of sp^2 and sp^3
    answer: 2
    explanation: Every carbon in benzene forms three σ bonds (two C–C and one C–H) and takes part in the delocalised π system, so all six carbons are sp^2 and the ring is planar.
