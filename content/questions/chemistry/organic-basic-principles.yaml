    ncert: true
    battle: false
    tags: [s-character, acidity, multi-concept]
    stem: |-
      Statement I: Ethyne is more acidic than ethane.
      Statement II: The sp hybridised carbon of ethyne holds the C–H bonding electrons closer to itself than the sp^3 carbon of ethane does.
    options:
      - Both Statement I and Statement II are correct
      - Both Statement I and Statement II are incorrect
      - Statement I is correct but Statement II is incorrect
      - Statement I is incorrect but Statement II is correct
    answer: 0
    explanation: With 50% s-character, the sp carbon is more electronegative, so the acetylide anion formed on losing H^+ is more stable. Both statements are correct, and II explains I.
  - id: che-goc-010
