questions:
  - id: che-elec-001
    topic: electrochemical-cells
    subtopic: Galvanic cell basics
    concept: A galvanic cell converts chemical energy of a spontaneous redox reaction into electrical energy
    category: concept
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [galvanic-cell, ncert-line]
    stem: A galvanic cell converts
    options:
      - electrical energy into chemical energy
      - chemical energy of a spontaneous redox reaction into electrical energy
      - heat energy into electrical energy
      - chemical energy of a non-spontaneous reaction into heat
    answer: 1
    explanation: In a galvanic (voltaic) cell the Gibbs energy of a spontaneous redox reaction is converted into electrical work. Converting electrical energy into chemical energy is what an electrolytic cell does.
  - id: che-elec-002
    topic: electrochemical-cells
    subtopic: Daniell cell
    concept: Electrode polarity and reactions in the Daniell cell
    category: factual
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    tags: [daniell-cell]
    stem: In a Daniell cell, which electrode acts as the anode and what is its polarity?
    options:
      - Copper, positive
      - Copper, negative
      - Zinc, positive
      - Zinc, negative
    answer: 3
    explanation: Zinc is oxidised (Zn → Zn^{2+} + 2e^−), so it is the anode; electrons accumulate on it, making it the negative terminal in a galvanic cell. Students often carry over the electrolytic-cell convention where the anode is positive.
  - id: che-elec-003
    topic: electrochemical-cells
    subtopic: Salt bridge
    concept: Function of the salt bridge
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [salt-bridge]
    stem: The main function of a salt bridge in a galvanic cell is to
    options:
      - supply electrons to the cathode
      - complete the inner circuit and maintain electrical neutrality of the two solutions
      - allow the two electrolytes to mix freely
      - increase the standard emf of the cell
    answer: 1
    explanation: Ions of the salt bridge (e.g. K^+ and NO_3^−) migrate into the half-cells, completing the internal circuit and preventing charge build-up. Electrons flow only through the external wire, and the salt bridge does not change E°.
  - id: che-elec-004
    topic: electrochemical-cells
    subtopic: Cell notation
    concept: Anode is written on the left in cell notation
    category: concept
    format: direct
    difficulty: 2
    time: 35
    ncert: true
    battle: true
    tags: [cell-notation]
    stem: "For the cell Zn(s) | Zn^{2+}(aq) || Ag^+(aq) | Ag(s), the reaction at the cathode is"
    options:
      - Zn → Zn^{2+} + 2e^−
      - Ag → Ag^+ + e^−
      - Ag^+ + e^− → Ag
      - Zn^{2+} + 2e^− → Zn
    answer: 2
    explanation: By convention the anode (oxidation) is written on the left and the cathode (reduction) on the right. So Ag^+ ions are reduced at the silver cathode.
  - id: che-elec-005
    topic: electrochemical-cells
    subtopic: Cell notation
    concept: Writing cell representation from a redox reaction
    category: application
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [cell-notation]
    stem: Which is the correct cell representation for the reaction Mg(s) + 2Ag^+(aq) → Mg^{2+}(aq) + 2Ag(s)?
    options:
      - Ag(s) | Ag^+(aq) || Mg^{2+}(aq) | Mg(s)
      - Mg^{2+}(aq) | Mg(s) || Ag(s) | Ag^+(aq)
      - Mg(s) | Ag^+(aq) || Mg^{2+}(aq) | Ag(s)
      - Mg(s) | Mg^{2+}(aq) || Ag^+(aq) | Ag(s)
    answer: 3
    explanation: Mg is oxidised, so the Mg/Mg^{2+} half-cell (anode) goes on the left written as metal | ion, and the Ag^+/Ag half-cell (cathode) goes on the right written as ion | metal, with || for the salt bridge.
  - id: che-elec-006
    topic: electrochemical-cells
    subtopic: Electron and current flow
    concept: Direction of electron flow versus conventional current
    category: concept
    format: statements
    difficulty: 2
    time: 40
    ncert: true
    battle: false
    tags: [daniell-cell, trap]
    stem: For a working Daniell cell, which statement is correct?
    options:
      - Electrons flow from copper to zinc through the external wire
      - Current flows from zinc to copper through the external wire
      - Electrons flow from zinc to copper through the external wire
      - Electrons flow through the salt bridge from zinc to copper solution
    answer: 2
    explanation: Electrons leave the zinc anode and travel through the external wire to the copper cathode; conventional current is opposite, copper to zinc. Electrons never pass through the salt bridge, only ions do.
  - id: che-elec-007
    topic: electrochemical-cells
    subtopic: Opposing external potential
    concept: Effect of an external opposing potential greater than 1.1 V on a Daniell cell
    category: concept
    format: direct
    difficulty: 3
    time: 45
    ncert: true
    battle: true
    tags: [daniell-cell, ncert-line]
    stem: An external opposing potential of 1.5 V is applied to a Daniell cell (E° = 1.1 V). What happens?
    options:
      - The cell stops and no current flows
      - The cell works as an electrolytic cell; Zn is deposited and Cu dissolves
      - Current continues to flow from Cu to Zn in the external circuit
      - Zn continues to dissolve at a slower rate
    answer: 1
    explanation: When the external potential exceeds 1.1 V, current reverses; the device behaves as an electrolytic cell with Zn^{2+} reduced to Zn and Cu oxidised to Cu^{2+}. No current flows only when the opposing potential equals exactly 1.1 V.
  - id: che-elec-008
    topic: electrochemical-cells
    subtopic: Opposing external potential
    concept: At external potential exactly equal to cell emf, no current flows
    category: factual
    format: direct
    difficulty: 2
    time: 25
    ncert: true
    battle: true
    tags: [daniell-cell]
    stem: For a Daniell cell of emf 1.1 V, when does the current in the external circuit become zero?
    options:
      - When the external opposing potential is 1.1 V
      - When the external opposing potential is 0.55 V
      - When the external opposing potential is 2.2 V
      - When the salt bridge is replaced by a copper wire
    answer: 0
    explanation: An opposing potential equal to the cell potential balances it exactly, so the reaction and current stop. Below 1.1 V the cell still discharges; above it the reaction reverses.
  - id: che-elec-009
    topic: electrochemical-cells
    subtopic: Galvanic vs electrolytic
    concept: Comparing galvanic and electrolytic cells
    category: concept
    format: statement-pair
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [galvanic-cell, electrolytic-cell, confused-pair]
    stem: |-
      Statement I: In both galvanic and electrolytic cells, oxidation occurs at the anode.
      Statement II: In both galvanic and electrolytic cells, the anode is the negative electrode.
    options:
      - Both Statement I and Statement II are correct
      - Both Statement I and Statement II are incorrect
      - Statement I is correct but Statement II is incorrect
      - Statement I is incorrect but Statement II is correct
    answer: 2
    explanation: Oxidation always occurs at the anode by definition. The polarity differs; the anode is negative in a galvanic cell but positive in an electrolytic cell, because it is connected to the positive terminal of the external source.
  - id: che-elec-010
    topic: electrochemical-cells
    subtopic: Salt bridge
    concept: Choice of electrolyte in salt bridge
    category: application
    format: direct
    difficulty: 3
    time: 45
    ncert: false
    battle: true
    tags: [salt-bridge, trap]
    stem: For a cell whose cathode half-cell contains Ag^+ ions, which electrolyte is unsuitable for the salt bridge?
    options:
      - KNO_3
      - NH_4NO_3
      - KCl
      - K_2SO_4 in dilute solution
    answer: 2
    explanation: Cl^− from a KCl bridge would precipitate AgCl at the junction with the Ag^+ solution. KNO_3 or NH_4NO_3 are used instead because their ions do not react and have similar mobilities.
  - id: che-elec-011
    topic: electrochemical-cells
    subtopic: Inert electrodes
    concept: Use of inert Pt electrode when no metal is involved
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [inert-electrode]
    stem: Platinum is used as the electrode in the half-cell Fe^{3+}(aq), Fe^{2+}(aq) | Pt because platinum
    options:
      - is oxidised more easily than Fe^{2+}
      - reacts with Fe^{3+} to form a stable alloy
      - provides a surface for electron transfer without taking part in the reaction
      - increases the standard potential of the couple
    answer: 2
    explanation: When both oxidised and reduced forms are in solution, an inert metal such as Pt is needed only to conduct electrons; it is not oxidised or reduced itself.
  - id: che-elec-012
    topic: electrode-potential
    subtopic: Standard hydrogen electrode
    concept: SHE construction and assigned potential
    category: factual
    format: statements
    difficulty: 2
    time: 40
    ncert: true
    battle: false
    tags: [she, ncert-line]
    stem: Which statement about the standard hydrogen electrode is incorrect?
    options:
      - It uses a platinum electrode coated with platinum black
      - Pure hydrogen gas at 1 bar is bubbled through the solution
      - The H^+ ion activity in the solution is unity
      - Its potential is assigned the value 0 V only at 273 K
    answer: 3
    explanation: The SHE is assigned zero potential at all temperatures. It consists of platinised Pt dipped in a solution of unit H^+ activity with H_2 at 1 bar bubbled through it.
  - id: che-elec-013
    topic: electrode-potential
    subtopic: Standard electrode potential
    concept: Standard cell emf from reduction potentials
    category: numerical
    format: direct
    difficulty: 1
    time: 30
    ncert: true
    battle: true
    formula: E°_cell = E°_cathode − E°_anode
    tags: [emf-calculation]
    stem: Given E°(Zn^{2+}/Zn) = −0.76 V and E°(Cu^{2+}/Cu) = +0.34 V, the standard emf of the Daniell cell is
    options:
      - 0.42 V
      - −1.10 V
      - 1.10 V
      - −0.42 V
    answer: 2
    explanation: E°_cell = E°_cathode − E°_anode = 0.34 − (−0.76) = 1.10 V. Adding the numbers directly (0.34 + (−0.76)) gives the tempting but wrong −0.42 V.
  - id: che-elec-014
    topic: electrode-potential
    subtopic: Electrochemical series
    concept: Lower reduction potential means stronger reducing agent
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [electrochemical-series, reducing-agent]
    stem: "Standard reduction potentials: Li^+/Li −3.05 V, Mg^{2+}/Mg −2.36 V, Zn^{2+}/Zn −0.76 V, Ag^+/Ag +0.80 V. The strongest reducing agent is"
    options:
      - Ag
      - Zn
      - Mg
      - Li
    answer: 3
    explanation: The more negative the reduction potential, the greater the tendency of the metal to lose electrons. Li, with −3.05 V, is the strongest reducing agent in aqueous solution.
  - id: che-elec-015
    topic: electrode-potential
    subtopic: Electrochemical series
    concept: Highest reduction potential means strongest oxidising agent
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [electrochemical-series, oxidising-agent]
    stem: Which of the following is the strongest oxidising agent in aqueous solution?
    options:
      - Cl_2
      - F_2
      - Br_2
      - I_2
    answer: 1
    explanation: F_2/F^− has the highest standard reduction potential (+2.87 V) in the series, so F_2 is the strongest oxidising agent.
  - id: che-elec-016
    topic: electrode-potential
    subtopic: Predicting displacement
    concept: A metal with lower E° displaces a metal ion with higher E°
    category: application
    format: direct
    difficulty: 2
    time: 40
    ncert: true
    battle: true
    tags: [displacement, electrochemical-series]
    stem: "Which reaction will NOT occur spontaneously under standard conditions? (E°: Zn^{2+}/Zn −0.76, Cu^{2+}/Cu +0.34, Ag^+/Ag +0.80 V)"
    options:
      - Zn + Cu^{2+} → Zn^{2+} + Cu
      - Cu + 2Ag^+ → Cu^{2+} + 2Ag
      - Zn + 2Ag^+ → Zn^{2+} + 2Ag
      - Cu + Zn^{2+} → Cu^{2+} + Zn
    answer: 3
    explanation: Copper (higher E°) cannot reduce Zn^{2+} (lower E°); E°_cell = −0.76 − 0.34 = −1.10 V, negative. The other three have positive E°_cell.
  - id: che-elec-017
    topic: electrode-potential
    subtopic: Storage of solutions
    concept: Copper sulphate solution cannot be stored in a zinc vessel
    category: application
    format: case
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [displacement, ncert-line]
    stem: A student wants to store 1 M CuSO_4 solution. Given E°(Zn^{2+}/Zn) = −0.76 V, E°(Ag^+/Ag) = +0.80 V, E°(Fe^{2+}/Fe) = −0.44 V and E°(Cu^{2+}/Cu) = +0.34 V, which vessel is safe to use?
    options:
      - Zinc vessel
      - Iron vessel
      - Silver vessel
      - Galvanised iron vessel
    answer: 2
    explanation: Only a metal with higher E° than Cu^{2+}/Cu will not reduce Cu^{2+}. Silver (+0.80 V) cannot, while Zn and Fe (and zinc-coated iron) would dissolve and deposit copper.
  - id: che-elec-018
    topic: electrode-potential
    subtopic: Reactivity with acids
    concept: Metals with negative E° liberate H2 from dilute acids
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [hydrogen-displacement]
    stem: Which metal will NOT liberate hydrogen from dilute HCl?
    options:
      - Zn (E° = −0.76 V)
      - Fe (E° = −0.44 V)
      - Cu (E° = +0.34 V)
      - Mg (E° = −2.36 V)
    answer: 2
    explanation: Metals with negative reduction potentials lie below hydrogen and can reduce H^+ to H_2. Copper has a positive E°, so it cannot displace hydrogen from dilute non-oxidising acids.
  - id: che-elec-019
    topic: electrode-potential
    subtopic: Sign convention
    concept: Reduction potential and oxidation potential are equal in magnitude and opposite in sign
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [sign-convention]
    stem: If the standard reduction potential of Ni^{2+}/Ni is −0.25 V, the standard oxidation potential of Ni/Ni^{2+} is
    options:
      - −0.25 V
      - +0.50 V
      - "0 V"
      - +0.25 V
    answer: 3
    explanation: Reversing a half-reaction reverses the sign of its potential, so the oxidation potential of Ni → Ni^{2+} + 2e^− is +0.25 V.
  - id: che-elec-020
    topic: electrode-potential
    subtopic: Intensive property
    concept: Electrode potential does not change when the half-reaction is multiplied
    category: concept
    format: assertion-reason
    difficulty: 3
    time: 45
    ncert: true
    battle: false
    tags: [intensive-property, trap]
    stem: |-
      Assertion (A): The E° of Ag^+ + e^− → Ag and 2Ag^+ + 2e^− → 2Ag are the same.
      Reason (R): Electrode potential is an intensive property.
    options:
      - Both A and R are true and R is the correct explanation of A
      - Both A and R are true but R is not the correct explanation of A
      - A is true but R is false
      - A is false but R is true
    answer: 0
    explanation: Potential is energy per unit charge, an intensive quantity that does not depend on how many moles react, so multiplying the half-equation leaves E° unchanged. ΔG°, an extensive quantity, does double.
  - id: che-elec-021
    topic: electrode-potential
    subtopic: Oxidising power order
    concept: Arranging oxidising agents by E°
    category: application
    format: ordering
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [electrochemical-series, ordering]
    stem: "Given E°: MnO_4^−/Mn^{2+} = +1.51 V, Cr_2O_7^{2−}/Cr^{3+} = +1.33 V, Fe^{3+}/Fe^{2+} = +0.77 V, Cl_2/Cl^− = +1.36 V. The increasing order of oxidising power is"
    options:
      - Fe^{3+} < Cr_2O_7^{2−} < Cl_2 < MnO_4^−
      - Fe^{3+} < Cl_2 < Cr_2O_7^{2−} < MnO_4^−
      - MnO_4^− < Cl_2 < Cr_2O_7^{2−} < Fe^{3+}
      - Cr_2O_7^{2−} < Fe^{3+} < Cl_2 < MnO_4^−
    answer: 0
    explanation: Oxidising power rises with reduction potential; 0.77 < 1.33 < 1.36 < 1.51 V gives Fe^{3+} < Cr_2O_7^{2−} < Cl_2 < MnO_4^−.
  - id: che-elec-022
    topic: electrode-potential
    subtopic: Measuring electrode potential
    concept: Electrode potential measured against SHE
    category: numerical
    format: direct
    difficulty: 2
    time: 35
    ncert: true
    battle: true
    tags: [she, emf-calculation]
    stem: The cell Pt | H_2(1 bar) | H^+(1 M) || Cu^{2+}(1 M) | Cu has an emf of 0.34 V. What is E°(Cu^{2+}/Cu)?
    options:
      - −0.34 V
      - +0.34 V
      - +0.17 V
      - "0 V"
    answer: 1
    explanation: With SHE as anode, E°_cell = E°_R − 0 = 0.34 V, so E°(Cu^{2+}/Cu) = +0.34 V. The positive value shows Cu^{2+} is reduced more easily than H^+.
  - id: che-elec-023
    topic: electrode-potential
    subtopic: Combining half-cell potentials
    concept: Potentials of half-reactions are combined through ΔG, not added directly
    category: numerical
    format: direct
    difficulty: 4
    time: 120
    ncert: false
    battle: false
    formula: nE° = n_1E°_1 + n_2E°_2
    tags: [latimer, multi-concept, trap]
    stem: Given E°(Fe^{3+}/Fe^{2+}) = +0.77 V and E°(Fe^{2+}/Fe) = −0.44 V, the value of E°(Fe^{3+}/Fe) is
    options:
      - +0.33 V
      - −0.036 V
      - +1.21 V
      - −0.11 V
    answer: 1
    explanation: Add ΔG° values, not potentials; −3F·E° = −1F(0.77) − 2F(−0.44), so 3E° = 0.77 − 0.88 = −0.11 and E° = −0.037 V ≈ −0.036 V. Simply adding gives the wrong 0.33 V.
  - id: che-elec-024
    topic: nernst-equation
    subtopic: Nernst equation form
    concept: Nernst equation for a metal electrode
    category: factual
    format: direct
    difficulty: 1
    time: 30
    ncert: true
    battle: true
    formula: E = E° − (0.059/n) log(1/[M^{n+}])
    tags: [nernst]
    stem: For M^{n+}(aq) + ne^− → M(s) at 298 K, the Nernst equation is
    options:
      - E = E° + (0.059/n) log(1/[M^{n+}])
      - E = E° − (0.059/n) log[M^{n+}]
      - E = E° − (0.059/n) log(1/[M^{n+}])
      - E = E° − 0.059n log(1/[M^{n+}])
    answer: 2
    explanation: E = E° − (RT/nF) ln Q with Q = 1/[M^{n+}] (solid activity = 1), giving E = E° − (0.059/n) log(1/[M^{n+}]) at 298 K. This is the same as E° + (0.059/n) log[M^{n+}].
  - id: che-elec-025
    topic: nernst-equation
    subtopic: Effect of ion concentration
    concept: Decreasing metal ion concentration lowers the reduction potential
    category: concept
    format: direct
    difficulty: 2
    time: 35
    ncert: true
    battle: true
    tags: [nernst]
    stem: For the electrode Cu^{2+}(aq) | Cu(s), if [Cu^{2+}] is decreased from 1 M to 0.01 M at 298 K, the reduction potential
    options:
      - increases by 0.059 V
      - decreases by 0.059 V
      - decreases by 0.118 V
      - remains unchanged
    answer: 1
    explanation: E = E° + (0.059/2) log[Cu^{2+}] = E° + 0.0295 × (−2) = E° − 0.059 V. Using n = 1 by mistake gives 0.118 V.
  - id: che-elec-026
    topic: nernst-equation
    subtopic: Hydrogen electrode and pH
    concept: Potential of hydrogen electrode depends on pH
    category: numerical
    format: direct
    difficulty: 2
    time: 40
    ncert: true
    battle: true
    formula: E = −0.059 pH
    tags: [hydrogen-electrode, ph]
    stem: The reduction potential of a hydrogen electrode (p_{H_2} = 1 bar) dipped in a solution of pH 10 at 298 K is
    options:
      - +0.59 V
      - −0.059 V
      - −5.9 V
      - −0.59 V
    answer: 3
    explanation: For 2H^+ + 2e^− → H_2, E = 0 − (0.059/2) log(1/[H^+]^2) = −0.059 pH = −0.059 × 10 = −0.59 V.
  - id: che-elec-027
    topic: nernst-equation
    subtopic: Cell emf at non-standard conditions
    concept: Nernst equation for Daniell cell
    category: numerical
    format: direct
    difficulty: 3
    time: 60
    ncert: true
    battle: false
    formula: E_cell = E°_cell − (0.059/2) log([Zn^{2+}]/[Cu^{2+}])
    tags: [nernst, daniell-cell]
    stem: "Calculate the emf of the cell Zn | Zn^{2+}(0.1 M) || Cu^{2+}(0.001 M) | Cu at 298 K. (E°_cell = 1.10 V)"
    options:
      - 1.16 V
      - 1.07 V
      - 1.04 V
      - 1.13 V
    answer: 2
    explanation: Q = [Zn^{2+}]/[Cu^{2+}] = 0.1/0.001 = 100, so E = 1.10 − (0.059/2) × 2 = 1.10 − 0.059 ≈ 1.04 V. Writing the ratio upside down gives the tempting 1.16 V.
  - id: che-elec-028
    topic: nernst-equation
    subtopic: Concentration cell
    concept: A concentration cell has E°cell = 0 and emf arises only from concentration difference
    category: concept
    format: direct
    difficulty: 2
    time: 35
    ncert: true
    battle: true
    tags: [concentration-cell]
    stem: For the concentration cell Ag | Ag^+(C_1) || Ag^+(C_2) | Ag to have a positive emf,
    options:
      - C_1 must be greater than C_2
      - C_1 must equal C_2
      - C_2 must be greater than C_1
      - E°_cell must be positive
    answer: 2
    explanation: E°_cell = 0, so E = 0.059 log(C_2/C_1). E is positive only when the cathode solution (right) is more concentrated, C_2 > C_1.
  - id: che-elec-029
    topic: nernst-equation
    subtopic: Concentration cell
    concept: EMF of a hydrogen concentration cell
    category: numerical
    format: direct
    difficulty: 3
    time: 60
    ncert: false
    battle: false
    tags: [concentration-cell, ph]
    stem: What is the emf at 298 K of the cell Pt | H_2(1 bar) | H^+(pH = 5) || H^+(pH = 2) | H_2(1 bar) | Pt?
    options:
      - 0.177 V
      - −0.177 V
      - 0.059 V
      - 0.413 V
    answer: 0
    explanation: E = 0.059 log([H^+]_cathode/[H^+]_anode) = 0.059 log(10^{−2}/10^{−5}) = 0.059 × 3 = 0.177 V. The cathode side is more acidic, so E is positive.
  - id: che-elec-030
    topic: nernst-equation
    subtopic: Numerical value of 2.303RT/F
    concept: Origin of 0.059 V at 298 K
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [nernst, constants]
    stem: At 298 K, the quantity 2.303RT/F in the Nernst equation has the value
    options:
      - 0.0296 V
      - 0.059 V
      - 0.0821 V
      - 8.314 V
    answer: 1
    explanation: 2.303 × 8.314 × 298 / 96487 ≈ 0.0591 V. The value 0.0296 V is 0.059/2, used only when n = 2.
  - id: che-elec-031
    topic: nernst-equation
    subtopic: Effect of dilution
    concept: Effect of diluting the cathode solution on emf
    category: concept
    format: direct
    difficulty: 3
    time: 45
    ncert: false
    battle: true
    tags: [nernst, daniell-cell]
