questions:
  - id: che-eqm-001
    topic: physical-equilibrium
    subtopic: Solid–liquid equilibrium
    concept: At the melting point, rates of melting and freezing are equal
    category: concept
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    tags: [solid-liquid, ncert-line]
    stem: For ice ⇌ water at 273 K and 1 atm in a perfectly insulated thermos flask, which statement is correct?
    options:
      - Only melting of ice takes place
      - The masses of ice and water keep changing with time
      - Rate of melting of ice equals rate of freezing of water
      - Only freezing of water takes place
    answer: 2
    explanation: At 273 K and 1 atm ice and water coexist in dynamic equilibrium; melting and freezing both continue at equal rates, so the masses of ice and water stay constant.

  - id: che-eqm-002
    topic: physical-equilibrium
    subtopic: Liquid–vapour equilibrium
    concept: Equilibrium vapour pressure is constant at a given temperature
    category: concept
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    tags: [vapour-pressure]
    stem: Water is kept in a closed vessel at constant temperature. Once equilibrium is reached, which quantity remains constant?
    options:
      - Pressure of water vapour above the liquid
      - Rate of evaporation only, while condensation stops
      - Number of molecules leaving the surface falls to zero
      - Volume of liquid keeps decreasing slowly
    answer: 0
    explanation: In a closed vessel the rates of evaporation and condensation become equal, so the vapour pressure of water becomes constant (equilibrium vapour pressure) at that temperature; neither process stops.

  - id: che-eqm-003
    topic: physical-equilibrium
    subtopic: Solid–vapour equilibrium
    concept: Iodine in a closed vessel shows solid ⇌ vapour equilibrium
    category: factual
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    tags: [sublimation, ncert-line]
    stem: Solid iodine placed in a closed glass vessel soon fills it with violet vapour whose intensity then stays constant. This is an example of
    options:
      - liquid ⇌ vapour equilibrium
      - solid ⇌ liquid equilibrium
      - gas ⇌ solution equilibrium
      - solid ⇌ vapour equilibrium
    answer: 3
    explanation: Iodine sublimes; once the rate of sublimation equals the rate of deposition, I_2(s) ⇌ I_2(vapour) is at equilibrium and the violet colour stops deepening.

  - id: che-eqm-004
    topic: physical-equilibrium
    subtopic: Dissolution of gases in liquids
    concept: Henry's law — mass of gas dissolved is proportional to its pressure
    category: application
    format: case
    difficulty: 2
    time: 40
    ncert: true
    battle: true
    tags: [henrys-law, ncert-line]
    stem: A sealed soda-water bottle fizzes when opened. Which fact best explains this?
    options:
      - Dissolution of CO_2 in water is endothermic
      - Solubility of CO_2 falls as its partial pressure above the liquid falls
      - CO_2 reacts with water only at high temperature
      - Opening the bottle raises the temperature of the drink
    answer: 1
    explanation: By Henry's law the amount of gas dissolved is proportional to its pressure above the liquid. On opening, the CO_2 pressure drops to its atmospheric value, so dissolved CO_2 escapes to reach the new equilibrium.

  - id: che-eqm-005
    topic: physical-equilibrium
    subtopic: Solid–solution equilibrium
    concept: Saturated solution is in dynamic equilibrium with undissolved solute
    category: concept
    format: case
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [saturated-solution, radioactive-tracer]
    stem: A little radioactive sugar is added to a saturated sugar solution containing excess solid sugar. After some time radioactivity is found both in the solution and in the solid. This shows that
    options:
      - the solution was not saturated
      - sugar reacts chemically with water
      - dissolution and precipitation continue at equal rates at equilibrium
      - radioactive sugar is more soluble than ordinary sugar
    answer: 2
    explanation: Tracer molecules move into and out of the solid, proving the equilibrium sugar(s) ⇌ sugar(solution) is dynamic; the concentration stays constant only because both rates are equal.

  - id: che-eqm-006
    topic: physical-equilibrium
    subtopic: General characteristics
    concept: Features of equilibria in physical processes
    category: concept
    format: statements
    difficulty: 2
    time: 45
    ncert: true
    battle: false
    tags: [characteristics, trap]
    stem: Which statement about equilibria in physical processes is INCORRECT?
    options:
      - Equilibrium is possible only in a closed system at a given temperature
      - Both opposing processes occur at the same rate
      - All measurable properties of the system remain constant
      - At equilibrium both opposing processes come to a stop
    answer: 3
    explanation: Equilibrium is dynamic, so the forward and reverse processes continue at equal rates; they never stop. The other three are the NCERT characteristics of physical equilibria.

  - id: che-eqm-007
    topic: physical-equilibrium
    subtopic: Effect of pressure on melting
    concept: Higher pressure lowers the melting point of ice
    category: concept
    format: direct
    difficulty: 3
    time: 45
    ncert: false
    battle: true
    tags: [ice-water, trap]
    stem: For ice ⇌ water, increasing the pressure on the system at 273 K causes
    options:
      - freezing, because ice is denser than water
      - no change, because only solids and liquids are present
      - melting, because water occupies a smaller volume than ice
      - melting point of ice to rise
    answer: 2
    explanation: Water is denser than ice, so melting reduces volume; increased pressure favours the smaller-volume phase, making ice melt and lowering its melting point.

  - id: che-eqm-008
    topic: physical-equilibrium
    subtopic: Constant quantities in physical equilibria
    concept: Quantity that is fixed for each type of physical equilibrium
    category: factual
    format: match
    difficulty: 3
    time: 60
    ncert: true
    battle: false
    tags: [ncert-line]
    stem: |-
      Match each physical equilibrium (List I) with the quantity that is constant at a given temperature (List II).
      List I
      P. H_2O(l) ⇌ H_2O(g)
      Q. H_2O(s) ⇌ H_2O(l)
      R. Sugar(s) ⇌ Sugar(solution)
      S. CO_2(g) ⇌ CO_2(solution)
      List II
      1. [CO_2(aq)]/[CO_2(g)]
      2. Concentration of solute in solution
      3. Melting point at fixed pressure
      4. p_{H_2O}
    options:
      - P-4, Q-3, R-2, S-1
      - P-3, Q-4, R-2, S-1
      - P-4, Q-3, R-1, S-2
      - P-2, Q-3, R-4, S-1
    answer: 0
    explanation: Liquid–vapour fixes the vapour pressure; solid–liquid fixes the melting point at fixed pressure; solid–solution fixes solubility (solute concentration); gas–solution fixes the ratio of dissolved to gaseous concentration.

  - id: che-eqm-009
    topic: physical-equilibrium
    subtopic: Boiling point
    concept: Boiling point is where vapour pressure equals external pressure
    category: concept
    format: assertion-reason
    difficulty: 2
    time: 40
    ncert: true
    battle: false
    tags: [boiling-point]
    stem: |-
      Assertion (A): Water boils at a temperature below 100 °C on a high mountain.
      Reason (R): A liquid boils when its vapour pressure equals the external (atmospheric) pressure.
    options:
      - Both A and R are true and R is the correct explanation of A
      - Both A and R are true but R is not the correct explanation of A
      - A is true but R is false
      - A is false but R is true
    answer: 0
    explanation: Atmospheric pressure is lower at altitude, so water's vapour pressure equals it at a lower temperature; R directly explains A.

  - id: che-eqm-010
    topic: law-of-equilibrium
    subtopic: Writing Kc
    concept: Kc expression for 2SO2 + O2 ⇌ 2SO3
    category: factual
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    formula: K_c = [products]^{coefficients}/[reactants]^{coefficients}
    tags: [kc-expression]
    stem: The equilibrium constant K_c for 2SO_2(g) + O_2(g) ⇌ 2SO_3(g) is
    options:
      - "[SO_3]/[SO_2][O_2]"
      - "[SO_2]^2[O_2]/[SO_3]^2"
      - "[SO_3]^2/[SO_2]^2[O_2]"
      - "[SO_3]^2/[SO_2][O_2]^2"
    answer: 2
    explanation: K_c is the product of product concentrations over reactant concentrations, each raised to its stoichiometric coefficient, giving [SO_3]^2/([SO_2]^2[O_2]).

  - id: che-eqm-011
    topic: law-of-equilibrium
    subtopic: Manipulating K
    concept: Reversing and halving a reaction gives K' = 1/√K
    category: numerical
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [manipulating-k, trap]
    stem: If K is the equilibrium constant for N_2 + 3H_2 ⇌ 2NH_3, the equilibrium constant for NH_3 ⇌ ½N_2 + 3/2H_2 is
    options:
      - 1/K
      - √K
      - 1/K^2
      - 1/√K
    answer: 3
    explanation: Reversing gives 1/K and halving the coefficients takes the square root, so K' = (1/K)^{1/2} = 1/√K. Choosing 1/K forgets the halving.

  - id: che-eqm-012
    topic: law-of-equilibrium
    subtopic: Manipulating K
    concept: K for reverse half reaction of HI formation
    category: numerical
    format: direct
    difficulty: 2
    time: 40
    ncert: true
    battle: true
    tags: [manipulating-k]
    stem: For H_2(g) + I_2(g) ⇌ 2HI(g), K_c = 49 at a certain temperature. K_c for HI(g) ⇌ ½H_2(g) + ½I_2(g) at the same temperature is
    options:
      - 1/49
      - 1/7
      - "7"
      - "49"
    answer: 1
    explanation: Reversing gives 1/49; halving takes the square root, so K = (1/49)^{1/2} = 1/7.

  - id: che-eqm-013
    topic: law-of-equilibrium
    subtopic: Combining reactions
    concept: K of overall reaction is the product of K values of added steps
    category: concept
    format: direct
    difficulty: 3
    time: 45
    ncert: false
    battle: true
    tags: [manipulating-k]
    stem: If A ⇌ B has constant K_1 and B ⇌ C has constant K_2, the constant for A ⇌ C is
    options:
      - K_1 + K_2
      - K_1/K_2
      - K_1 × K_2
      - K_2/K_1
    answer: 2
    explanation: When reactions are added, their equilibrium expressions multiply; [B] cancels, so K = K_1 × K_2.

  - id: che-eqm-014
    topic: law-of-equilibrium
    subtopic: Dynamic nature
    concept: Deuterium tracer in Haber synthesis proves dynamic equilibrium
    category: factual
    format: case
    difficulty: 2
    time: 45
    ncert: true
    battle: false
    tags: [isotope-tracer, ncert-line]
    stem: Two identical Haber-process equilibrium mixtures are prepared, one with H_2 and one with D_2 (same amounts). When they are mixed and analysed after some time, NH_3, NH_2D, NHD_2 and ND_3 are all found. This proves that
    options:
      - D_2 is more reactive than H_2
      - the reaction does not reach equilibrium
      - equilibrium composition depends on the isotope used
      - forward and reverse reactions continue at equilibrium
    answer: 3
    explanation: Scrambling of H and D among ammonia molecules can occur only if ammonia keeps decomposing and forming, so chemical equilibrium is dynamic even though the overall composition stays the same.

  - id: che-eqm-015
    topic: law-of-equilibrium
    subtopic: Units of Kc
    concept: Units of Kc depend on Δn
    category: numerical
    format: direct
    difficulty: 2
    time: 40
    ncert: true
    battle: true
    tags: [units]
    stem: The unit of K_c for N_2(g) + 3H_2(g) ⇌ 2NH_3(g) is
    options:
      - mol^2 L^{-2}
      - mol L^{-1}
      - L mol^{-1}
      - mol^{-2} L^2
    answer: 3
    explanation: Δn = 2 − 4 = −2, so K_c has units (mol L^{-1})^{-2} = mol^{-2} L^2.

  - id: che-eqm-016
    topic: law-of-equilibrium
    subtopic: Approach to equilibrium
    concept: Same equilibrium is reached from either direction
    category: concept
    format: graph
    difficulty: 3
    time: 60
    ncert: true
    battle: false
    tags: [graph, ncert-line]
    stem: In experiment X, 2 mol H_2 and 2 mol I_2 are heated in a 1 L flask; in experiment Y, 4 mol HI is heated in an identical flask at the same temperature. In concentration–time graphs of both, what is observed after equilibrium?
    options:
      - The equilibrium concentrations of H_2, I_2 and HI are the same in both
      - HI concentration is higher in experiment X than in Y
      - Experiment Y never reaches equilibrium because HI is stable
      - The curves become flat at different times but reach different K values
    answer: 0
    explanation: Both starting mixtures contain the same total amounts of H and I atoms, so the same equilibrium state is reached from either side; the flat portions of the curves coincide.

  - id: che-eqm-017
    topic: law-of-equilibrium
    subtopic: Law of mass action
    concept: Guldberg and Waage proposed the law of mass action
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [history, ncert-line]
    stem: The law of mass action was proposed by
    options:
      - Le Chatelier and Braun
      - Arrhenius and Ostwald
      - Guldberg and Waage
      - Brønsted and Lowry
    answer: 2
    explanation: Norwegian chemists Cato Guldberg and Peter Waage (1864) proposed the law of mass action relating reaction rate and equilibrium to the active masses of reactants.

  - id: che-eqm-018
    topic: law-of-equilibrium
    subtopic: Factors affecting K
    concept: K depends only on temperature for a given reaction
    category: concept
    format: multi-statement
    difficulty: 3
    time: 60
    ncert: true
    battle: false
    tags: [trap, multi-concept]
    stem: |-
      For a given balanced reaction, the value of K_c changes when
      I. the temperature is changed
      II. a catalyst is added
      III. the initial concentrations of reactants are doubled
      IV. the equation is written in reverse
    options:
      - I and IV only
      - I only
      - I, II and III only
      - II and III only
    answer: 0
    explanation: K changes with temperature, and the numerical value for the reverse equation becomes 1/K. A catalyst and initial concentrations do not change K; they only change how fast or at what composition equilibrium is reached.

  - id: che-eqm-019
    topic: kp-kc
    subtopic: Kp and Kc relation
    concept: Kp = Kc when Δn = 0
    category: concept
    format: direct
    difficulty: 1
    time: 30
    ncert: true
    battle: true
    formula: K_p = K_c(RT)^{Δn}
    tags: [kp-kc]
    stem: For which reaction is K_p equal to K_c?
    options:
      - N_2(g) + 3H_2(g) ⇌ 2NH_3(g)
      - PCl_5(g) ⇌ PCl_3(g) + Cl_2(g)
      - 2SO_2(g) + O_2(g) ⇌ 2SO_3(g)
      - H_2(g) + I_2(g) ⇌ 2HI(g)
    answer: 3
    explanation: K_p = K_c(RT)^{Δn}; for H_2 + I_2 ⇌ 2HI, Δn = 2 − 2 = 0, so K_p = K_c.

  - id: che-eqm-020
    topic: kp-kc
    subtopic: Kp and Kc relation
    concept: Kp/Kc = RT for N2O4 ⇌ 2NO2
    category: numerical
    format: direct
    difficulty: 2
    time: 35
    ncert: true
    battle: true
    formula: K_p = K_c(RT)^{Δn}
    tags: [kp-kc]
    stem: For N_2O_4(g) ⇌ 2NO_2(g), the ratio K_p/K_c equals
    options:
      - 1/RT
      - RT
      - (RT)^2
      - "1"
    answer: 1
    explanation: Δn = 2 − 1 = 1, so K_p = K_c(RT)^1 and K_p/K_c = RT.

  - id: che-eqm-021
    topic: kp-kc
    subtopic: Converting Kc to Kp
    concept: Kp from Kc for PCl5 dissociation
    category: numerical
    format: direct
    difficulty: 3
    time: 60
    ncert: true
    battle: false
    formula: K_p = K_c(RT)^{Δn}
    tags: [kp-kc, calculation]
    stem: For PCl_5(g) ⇌ PCl_3(g) + Cl_2(g), K_c = 2.0 × 10^{-2} mol L^{-1} at 500 K. Taking R = 0.0831 L bar K^{-1} mol^{-1}, K_p is about
    options:
      - 0.83 bar
      - 2.4 × 10^{-2} bar
      - 4.8 × 10^{-4} bar
      - 8.3 bar
    answer: 0
    explanation: Δn = 1, so K_p = K_c × RT = 0.020 × 0.0831 × 500 = 0.020 × 41.55 ≈ 0.83 bar.

  - id: che-eqm-022
    topic: kp-kc
    subtopic: Heterogeneous equilibrium
    concept: Kp for CaCO3 decomposition equals pCO2
    category: concept
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    tags: [heterogeneous, ncert-line]
    stem: For CaCO_3(s) ⇌ CaO(s) + CO_2(g), K_p is equal to
    options:
      - p_{CO_2} × p_{CaO}/p_{CaCO_3}
      - p_{CO_2}
      - 1/p_{CO_2}
      - p_{CO_2}^2
    answer: 1
    explanation: Pure solids have unit activity and are omitted, so K_p = p_{CO_2}; at a given temperature the CO_2 pressure over the solids is fixed.

  - id: che-eqm-023
    topic: kp-kc
    subtopic: Heterogeneous equilibrium
    concept: Kc for iron–steam reaction omits solids
    category: factual
    format: direct
    difficulty: 2
    time: 35
    ncert: true
    battle: true
    tags: [heterogeneous]
    stem: For 3Fe(s) + 4H_2O(g) ⇌ Fe_3O_4(s) + 4H_2(g), the expression for K_c is
    options:
      - "[Fe_3O_4][H_2]^4/[Fe]^3[H_2O]^4"
      - "[H_2]/[H_2O]"
      - "[H_2O]^4/[H_2]^4"
      - "[H_2]^4/[H_2O]^4"
    answer: 3
    explanation: Fe and Fe_3O_4 are pure solids and are left out; the gases appear with their coefficients, K_c = [H_2]^4/[H_2O]^4.

  - id: che-eqm-024
    topic: kp-kc
    subtopic: Kp in terms of mole fraction
    concept: Kp = Kx P^Δn
    category: concept
    format: direct
    difficulty: 3
    time: 45
    ncert: false
    battle: true
    tags: [mole-fraction]
    stem: For a gaseous equilibrium with Δn ≠ 0, K_x (in mole fractions) is related to K_p at total pressure P by
    options:
      - K_p = K_x P^{-Δn}
      - K_p = K_x(RT)^{Δn}
      - K_p = K_x P^{Δn}
      - K_p = K_x
    answer: 2
    explanation: Each partial pressure is p_i = x_i P, so K_p = K_x P^{Δn}; unlike K_p, K_x therefore changes with total pressure when Δn ≠ 0.

  - id: che-eqm-025
    topic: kp-kc
    subtopic: Heterogeneous equilibrium with equal gases
    concept: For NH4HS(s) ⇌ NH3 + H2S, Kp = P²/4
    category: numerical
    format: direct
    difficulty: 3
    time: 60
    ncert: false
    battle: false
    tags: [heterogeneous, calculation]
    stem: Solid NH_4HS dissociates in a closed vessel as NH_4HS(s) ⇌ NH_3(g) + H_2S(g). If the total pressure at equilibrium is 0.6 atm, K_p is
    options:
      - 0.36 atm^2
      - 0.09 atm^2
      - 0.30 atm^2
      - 0.18 atm^2
    answer: 1
    explanation: The gases form in equal amounts, so each partial pressure is 0.3 atm and K_p = 0.3 × 0.3 = 0.09 atm^2. Squaring the total pressure (0.36) is the common error.

  - id: che-eqm-026
    topic: kp-kc
    subtopic: Pure solids in K
    concept: Activity of pure solid is unity
    category: concept
    format: assertion-reason
    difficulty: 2
    time: 40
    ncert: true
    battle: false
    tags: [heterogeneous]
    stem: |-
      Assertion (A): For CaCO_3(s) ⇌ CaO(s) + CO_2(g), the equilibrium pressure of CO_2 at a given temperature does not depend on how much CaCO_3 is taken.
      Reason (R): The concentration (activity) of a pure solid is constant and is taken as unity in the equilibrium expression.
    options:
      - Both A and R are true and R is the correct explanation of A
      - Both A and R are true but R is not the correct explanation of A
      - A is true but R is false
      - A is false but R is true
    answer: 0
    explanation: Since K_p = p_{CO_2} with solids excluded (activity 1), the CO_2 pressure is fixed by temperature alone as long as both solids are present; R explains A.

  - id: che-eqm-027
    topic: kp-kc
    subtopic: Units of Kp
    concept: Units of Kp from Δn
    category: factual
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    tags: [units]
    stem: The unit of K_p for PCl_5(g) ⇌ PCl_3(g) + Cl_2(g) is
    options:
      - bar^{-1}
      - bar^2
      - dimensionless
      - bar
    answer: 3
    explanation: Δn = 2 − 1 = 1, so K_p has units bar^1.

  - id: che-eqm-028
    topic: applications-of-k
    subtopic: Extent of reaction
    concept: K > 10^3 means products predominate
    category: concept
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    tags: [extent, ncert-line]
    stem: A reaction has K_c = 4.0 × 10^{31} at 300 K. At equilibrium the mixture contains
    options:
      - mainly products
      - mainly reactants
      - comparable amounts of reactants and products
      - no products at all
    answer: 0
    explanation: If K_c > 10^3, products predominate and the reaction proceeds nearly to completion; if K_c < 10^{-3}, reactants predominate.

  - id: che-eqm-029
    topic: applications-of-k
    subtopic: Reaction quotient
    concept: Q < K means net forward reaction
    category: concept
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    tags: [reaction-quotient]
    stem: If the reaction quotient Q_c of a mixture is less than K_c, the reaction will
    options:
      - be at equilibrium
      - proceed in the reverse direction
      - proceed in the forward direction
      - stop completely
    answer: 2
    explanation: Q_c < K_c means product concentrations are too low; the net reaction goes forward until Q_c = K_c.

  - id: che-eqm-030
    topic: applications-of-k
    subtopic: Reaction quotient
    concept: Predicting direction by computing Q
    category: numerical
    format: direct
    difficulty: 2
    time: 45
    ncert: true
    battle: true
    tags: [reaction-quotient]
    stem: For H_2(g) + I_2(g) ⇌ 2HI(g), K_c = 50. A mixture has [H_2] = [I_2] = 0.1 M and [HI] = 0.5 M. The reaction will
    options:
      - go backward, since Q_c = 50
      - be at equilibrium
      - go backward, since Q_c > K_c
      - go forward, since Q_c = 25
    answer: 3
    explanation: Q_c = (0.5)^2/(0.1 × 0.1) = 0.25/0.01 = 25, which is less than 50, so more HI forms.

  - id: che-eqm-031
    topic: applications-of-k
    subtopic: K and ΔG°
    concept: Negative ΔG° gives K > 1
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    formula: ΔG° = −RT ln K
    tags: [gibbs-energy]
    stem: For a reaction with ΔG° < 0 at temperature T, the equilibrium constant K is
    options:
      - greater than 1
      - equal to 1
      - less than 1 but positive
      - negative
    answer: 0
    explanation: From ΔG° = −RT ln K, a negative ΔG° requires ln K > 0, i.e. K > 1. K can never be negative.

  - id: che-eqm-032
    topic: applications-of-k
    subtopic: K and ΔG°
    concept: ΔG° = 0 gives K = 1
    category: numerical
    format: direct
    difficulty: 1
