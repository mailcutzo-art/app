    stem: Which statement about the solubility product of a sparingly soluble salt is correct?
    options:
      - K_sp decreases when a common ion is added
      - K_sp is constant at a given temperature, but solubility can change with added ions
      - K_sp and solubility are always numerically equal
      - K_sp does not depend on temperature
    answer: 1
    explanation: K_sp is an equilibrium constant fixed by temperature; a common ion lowers the solubility, not K_sp. K_sp equals s only in special relations such as s^2 for AB salts, never in general.

