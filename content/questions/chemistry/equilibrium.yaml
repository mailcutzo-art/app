    stem: |-
      Statement I: AgCl (K_sp = 1.8 × 10^{-10}) is more soluble in water than Ag_2CrO_4 (K_sp = 1.1 × 10^{-12}).
      Statement II: For salts of different stoichiometry, a smaller K_sp does not necessarily mean lower molar solubility.
    options:
      - Both Statement I and Statement II are correct
      - Both Statement I and Statement II are incorrect
      - Statement I is correct but Statement II is incorrect
      - Statement I is incorrect but Statement II is correct
    answer: 3
    explanation: For AgCl s = √(1.8 × 10^{-10}) ≈ 1.3 × 10^{-5} M; for Ag_2CrO_4 s = (K_sp/4)^{1/3} = (2.75 × 10^{-13})^{1/3} ≈ 6.5 × 10^{-5} M. So Ag_2CrO_4 is more soluble despite its smaller K_sp; Statement I is false, II true.
