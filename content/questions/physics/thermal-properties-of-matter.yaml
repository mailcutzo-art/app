    concept: Equal temperatures do not imply equal internal energies
    category: concept
    format: statements
    difficulty: 3
    time: 45
    ncert: true
    battle: false
    tags: [heat, internal-energy, trap]
    stem: Which of the following statements is correct?
    options:
      - Temperature is a measure of the total heat contained in a body
      - A body contains a definite quantity of heat that it can give up
      - Two bodies at the same temperature can have different internal energies
      - Heat always flows from the body with the larger heat capacity
    answer: 2
    explanation: Internal energy depends on mass and material as well as temperature, so a bucket of water and a cup of water at the same temperature have very different internal energies. Heat is energy in transit, not something a body contains, and its flow is decided by temperature alone.

