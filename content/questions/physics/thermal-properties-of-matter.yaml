questions:
  - id: phy-tpm-001
    topic: temperature-heat
    subtopic: Definition of heat
    concept: Heat is energy in transit due to a temperature difference
    category: concept
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    tags: [heat, ncert-line]
    stem: Heat is best described as
    options:
      - the total kinetic energy of the molecules of a body
      - the temperature of a body measured in joules
      - energy transferred between systems because of a temperature difference
      - the energy stored in a body at a given temperature
    answer: 2
    explanation: NCERT defines heat as the form of energy transferred between two (or more) systems or a system and its surroundings by virtue of a temperature difference. The energy stored in a body is its internal energy, not heat; heat is energy in transit.

  - id: phy-tpm-002
    topic: temperature-heat
    subtopic: Direction of heat flow
    concept: Heat flows from higher to lower temperature, not higher to lower heat content
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [heat-flow, trap]
    stem: When two bodies are placed in thermal contact, the direction of net heat flow is decided by their
    options:
      - temperatures
      - internal energies
      - masses
      - specific heat capacities
    answer: 0
    explanation: Heat always flows from the body at higher temperature to the one at lower temperature until the temperatures are equal. A large cool body may have more internal energy than a small hot one, yet heat still flows from the hot one, so internal energy is the trap.

  - id: phy-tpm-003
    topic: temperature-heat
    subtopic: Units of heat and temperature
    concept: Heat is measured in joule; temperature in kelvin, a base unit
    category: factual
    format: statement-pair
    difficulty: 1
    time: 30
    ncert: true
    battle: true
    tags: [units]
    stem: |-
      Statement I: The SI unit of heat is the joule.
      Statement II: Thermodynamic temperature is an SI base quantity with unit kelvin.
    options:
      - Both Statement I and Statement II are correct
      - Both Statement I and Statement II are incorrect
      - Statement I is correct but Statement II is incorrect
      - Statement I is incorrect but Statement II is correct
    answer: 0
    explanation: Heat is a form of energy, so its SI unit is the joule. Thermodynamic temperature is one of the seven SI base quantities and is measured in kelvin (K). Both statements are true.

  - id: phy-tpm-004
    topic: temperature-heat
    subtopic: Thermal equilibrium
    concept: No net heat flow between bodies at equal temperature regardless of internal energy
    category: concept
    format: assertion-reason
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [thermal-equilibrium, trap]
    stem: |-
      Assertion (A): There is no net flow of heat between two bodies in contact that are at the same temperature.
      Reason (R): Heat always flows from the body with greater internal energy to the body with smaller internal energy.
    options:
      - Both A and R are true and R is the correct explanation of A
      - Both A and R are true but R is not the correct explanation of A
      - A is true but R is false
      - A is false but R is true
    answer: 2
    explanation: Bodies at the same temperature are in thermal equilibrium, so no net heat flows (A true). Heat flow is decided by temperature, not internal energy; a large lukewarm bath has more internal energy than a hot pin, yet heat flows from the pin to the bath. So R is false.

  - id: phy-tpm-005
    topic: temperature-heat
    subtopic: Calorie and joule
    concept: 1 calorie ≈ 4.186 J
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    formula: 1 cal = 4.186 J
    tags: [units, ncert-line]
    stem: One calorie is approximately equal to
    options:
      - 0.239 J
      - 1 J
      - 41.86 J
      - 4.186 J
    answer: 3
    explanation: One calorie is the heat needed to raise the temperature of 1 g of water from 14.5 °C to 15.5 °C, and it equals about 4.186 J. The value 0.239 is the reverse conversion (1 J ≈ 0.239 cal).

  - id: phy-tpm-006
    topic: temperature-scales
    subtopic: Fahrenheit to Celsius
    concept: t_C = (t_F − 32) × 5/9
    category: numerical
    format: direct
    difficulty: 1
    time: 30
    ncert: true
    battle: true
    formula: t_F = (9/5) t_C + 32
    tags: [temperature-conversion]
    stem: A temperature of 100 °F on the Celsius scale is about
    options:
      - 37.8 °C
      - 38.9 °C
      - 55.6 °C
      - 212 °C
    answer: 0
    explanation: t_C = (t_F − 32) × 5/9 = (100 − 32) × 5/9 = 68 × 5/9 ≈ 37.8 °C. The value 55.6 °C comes from forgetting to subtract 32.

  - id: phy-tpm-007
    topic: temperature-scales
    subtopic: Equal readings on two scales
    concept: Celsius and Fahrenheit readings coincide at −40
    category: numerical
    format: direct
    difficulty: 2
    time: 35
    ncert: true
    battle: true
    formula: t_F = (9/5) t_C + 32
    tags: [temperature-conversion]
    stem: At what temperature do the Celsius and Fahrenheit scales show the same numerical reading?
    options:
      - −32°
      - −40°
      - "40°"
      - −273°
    answer: 1
    explanation: Put t_F = t_C = x in t_F = (9/5)t_C + 32; then x = 1.8x + 32, so −0.8x = 32 and x = −40. So −40 °C = −40 °F.

  - id: phy-tpm-008
    topic: temperature-scales
    subtopic: Equal readings on two scales
    concept: Fahrenheit and Kelvin readings coincide near 574.6
    category: numerical
    format: direct
    difficulty: 3
    time: 60
    ncert: false
    battle: false
    formula: t_F = (9/5)(T − 273.15) + 32
    tags: [temperature-conversion, trap]
    stem: At what temperature does a Fahrenheit thermometer show the same reading as a Kelvin thermometer?
    options:
      - "313"
      - −40
      - "574.6"
      - "460"
    answer: 2
    explanation: Set t_F = T = x in t_F = (9/5)(T − 273.15) + 32. Then x = 1.8x − 491.67 + 32, so 0.8x = 459.67 and x ≈ 574.6. −40 is the Celsius–Fahrenheit coincidence, a common mix-up.

  - id: phy-tpm-009
    topic: temperature-scales
    subtopic: Temperature intervals
    concept: A 1 °C interval equals a 1.8 °F interval; no offset for differences
    category: numerical
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [temperature-difference, trap]
    stem: The temperature of a body rises by 50 °C. The same rise on the Fahrenheit scale is
    options:
      - 122 °F
      - 90 °F
      - 50 °F
      - 27.8 °F
    answer: 1
    explanation: For a temperature difference the offset 32 cancels, so Δt_F = (9/5)Δt_C = 1.8 × 50 = 90 °F. The answer 122 °F converts a temperature, not a difference, which is the trap.

  - id: phy-tpm-010
    topic: temperature-scales
    subtopic: Triple point of water
    concept: Triple point of water is 273.16 K
    category: factual
    format: direct
    difficulty: 2
    time: 20
    ncert: true
    battle: true
    tags: [triple-point, ncert-line]
    stem: The triple point of water, used as the fixed point for the Kelvin scale, is assigned the temperature
    options:
      - 273.15 K
      - 0.01 K
      - 373.15 K
      - 273.16 K
    answer: 3
    explanation: The triple point of water (where ice, water and vapour coexist, at about 0.006 atm) is assigned 273.16 K exactly, i.e. 0.01 °C. 273.15 K is the ice point at 1 atm (0 °C), a close distractor.

  - id: phy-tpm-011
    topic: temperature-scales
    subtopic: Arbitrary temperature scales
    concept: Linear interpolation between fixed points on any scale
    category: numerical
    format: direct
    difficulty: 2
    time: 45
    ncert: true
    battle: true
    formula: (X − X_ice)/(X_steam − X_ice) = t_C/100
    tags: [arbitrary-scale]
    stem: On scale X the ice point is 20 °X and the steam point is 220 °X. A reading of 70 °X corresponds to
    options:
      - 25 °C
      - 35 °C
      - 50 °C
      - 70 °C
    answer: 0
    explanation: (X − 20)/(220 − 20) = t_C/100, so t_C = 100 × (70 − 20)/200 = 25 °C.

  - id: phy-tpm-012
    topic: temperature-scales
    subtopic: Faulty thermometer
    concept: Correcting a faulty thermometer by linear scaling
    category: numerical
    format: direct
    difficulty: 3
    time: 60
    ncert: false
    battle: false
    formula: (R − R_ice)/(R_steam − R_ice) = t/100
    tags: [arbitrary-scale, faulty-thermometer]
    stem: A faulty thermometer reads 5 °C in melting ice and 95 °C in steam at 1 atm. When it reads 59 °C, the true temperature is
    options:
      - 59 °C
      - 60 °C
      - 54 °C
      - 65 °C
    answer: 1
    explanation: (59 − 5)/(95 − 5) = t/100, so t = 100 × 54/90 = 60 °C. Simply subtracting the zero error gives 54 °C, which ignores that the 90 divisions span 100 degrees.

  - id: phy-tpm-013
    topic: temperature-scales
    subtopic: Fahrenheit to Kelvin
    concept: Two-step conversion F → C → K
    category: numerical
    format: direct
    difficulty: 2
    time: 40
    ncert: true
    battle: true
    tags: [temperature-conversion]
    stem: Normal human body temperature is 98.6 °F. On the Kelvin scale this is about
    options:
      - 310 K
      - 371.6 K
      - 305 K
      - 336 K
    answer: 0
    explanation: t_C = (98.6 − 32) × 5/9 = 37 °C, and T = 37 + 273.15 ≈ 310 K. Adding 273 directly to 98.6 gives 371.6 K, which skips the Fahrenheit conversion.

  - id: phy-tpm-014
    topic: temperature-scales
    subtopic: Graph between scales
    concept: t_F versus t_C is a straight line of slope 9/5 and intercept 32
    category: concept
    format: graph
    difficulty: 2
    time: 35
    ncert: true
    battle: true
    formula: t_F = (9/5) t_C + 32
    tags: [graph, temperature-conversion, ncert-line]
    stem: A graph is plotted with Fahrenheit temperature on the y-axis and Celsius temperature on the x-axis. The graph is
    options:
      - a straight line through the origin with slope 5/9
      - a parabola with vertex at (0, 32)
      - a straight line with slope 1.8 and y-intercept 32 °F
      - a straight line with slope 1.8 and x-intercept 32 °C
    answer: 2
    explanation: t_F = 1.8 t_C + 32 is linear, so the graph is a straight line with slope 9/5 = 1.8 and y-intercept 32 °F (at t_C = 0). It does not pass through the origin.

  - id: phy-tpm-015
    topic: ideal-gas-absolute
    subtopic: Constant-volume gas thermometer
    concept: T = 273.16 K × P/P_tr for a constant-volume gas thermometer
    category: numerical
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    formula: T = 273.16 K × (P/P_tr)
    tags: [gas-thermometer]
    stem: In a constant-volume gas thermometer, the gas pressure at a temperature T is 1.5 times its pressure at the triple point of water. T is about
    options:
      - 182 K
      - 273 K
      - 136.6 K
      - 409.7 K
    answer: 3
    explanation: At constant volume P ∝ T, so T = 273.16 × 1.5 ≈ 409.7 K. 182 K comes from dividing by 1.5 instead of multiplying, and 136.6 K is half the triple-point temperature.

  - id: phy-tpm-016
    topic: ideal-gas-absolute
    subtopic: Absolute zero
    concept: Absolute zero is −273.15 °C
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [absolute-zero, ncert-line]
    stem: Absolute zero on the Celsius scale is
    options:
      - 0 °C
      - −100 °C
      - −273.15 °C
      - −459.67 °C
    answer: 2
    explanation: Absolute zero, 0 K, corresponds to −273.15 °C. The value −459.67 is absolute zero on the Fahrenheit scale, not the Celsius scale.

  - id: phy-tpm-017
    topic: ideal-gas-absolute
    subtopic: Pressure–temperature graph of a gas
    concept: P–t lines of low-density gases extrapolate to −273.15 °C
    category: concept
    format: graph
    difficulty: 2
    time: 40
    ncert: true
    battle: true
    tags: [absolute-zero, graph, ncert-line]
    stem: For a low-density gas at constant volume, the pressure versus Celsius temperature line, when extrapolated to zero pressure, meets the temperature axis at
    options:
      - 0 °C
      - −273.15 °C for every gas
      - a temperature that depends on the gas used
      - −273.15 °C only for hydrogen
    answer: 1
    explanation: At constant volume P ∝ T for an ideal gas, so all low-density gases give straight P–t lines that extrapolate to zero pressure at the same point, −273.15 °C. This common intercept defines absolute zero and is independent of the gas.

  - id: phy-tpm-018
    topic: ideal-gas-absolute
    subtopic: Charles's law
    concept: At constant pressure V ∝ T (in kelvin)
    category: numerical
    format: direct
    difficulty: 2
    time: 40
    ncert: true
    battle: true
    formula: V_1/T_1 = V_2/T_2
    tags: [charles-law, trap]
    stem: A gas at 27 °C is heated at constant pressure until its volume doubles. Its final temperature is
    options:
      - 54 °C
      - 327 °C
      - 600 °C
      - 300 °C
    answer: 1
    explanation: V ∝ T in kelvin, so T_2 = 2 × 300 K = 600 K = 327 °C. Doubling the Celsius value (54 °C) is the classic mistake; 600 °C forgets to convert back from kelvin.

  - id: phy-tpm-019
    topic: ideal-gas-absolute
    subtopic: Gas thermometers
    concept: Low-density gases agree because they behave ideally
    category: concept
    format: direct
    difficulty: 2
    time: 35
    ncert: true
    battle: true
    tags: [gas-thermometer]
    stem: Constant-volume gas thermometers using different gases give nearly the same readings when the gases are at low density because
    options:
      - all real gases behave nearly like an ideal gas at low density
      - all gases have the same molar mass at low density
      - the specific heat of all gases becomes zero
      - the gas does not expand at low density
    answer: 0
    explanation: At low density intermolecular forces and molecular size become negligible, so every gas obeys PV = μRT closely. Their pressures then vary identically with temperature, and the readings agree.

  - id: phy-tpm-020
    topic: thermal-expansion
    subtopic: Linear expansion
    concept: ΔL = LαΔT
    category: numerical
    format: direct
    difficulty: 1
    time: 30
    ncert: true
    battle: true
    formula: ΔL = LαΔT
    tags: [linear-expansion]
    stem: A steel rod 1 m long (α = 1.2 × 10^{-5} K^{-1}) is heated through 100 K. Its length increases by
    options:
      - 0.12 mm
      - 1.2 mm
      - 12 mm
      - 0.012 mm
    answer: 1
    explanation: ΔL = LαΔT = 1 × 1.2 × 10^{-5} × 100 = 1.2 × 10^{-3} m = 1.2 mm.

  - id: phy-tpm-021
    topic: thermal-expansion
    subtopic: Relation between coefficients
    concept: For an isotropic solid α_V = 3α_l
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    formula: α_V = 3α_l
    tags: [expansion-coefficients, ncert-line]
    stem: For an isotropic solid, the coefficient of volume expansion α_V is related to the coefficient of linear expansion α_l by
    options:
      - α_V = α_l/3
      - α_V = 2α_l
      - α_V = 3α_l
      - α_V = α_l^3
    answer: 2
    explanation: A cube of side l has V = l^3, so ΔV/V = 3Δl/l for small changes, giving α_V = 3α_l. Area expansion gives 2α_l, which is the tempting distractor.

  - id: phy-tpm-022
    topic: thermal-expansion
    subtopic: Area and volume expansion
    concept: Percentage change in volume is 3/2 times percentage change in area
    category: numerical
    format: direct
    difficulty: 2
    time: 40
    ncert: false
    battle: true
    tags: [superficial-expansion, volume-expansion]
    stem: When a metal block is heated, the area of each face increases by 0.2%. The volume increases by
    options:
      - 0.1%
      - 0.2%
      - 0.3%
      - 0.6%
    answer: 2
    explanation: Area change = 2αΔT = 0.2%, so αΔT = 0.1%. Volume change = 3αΔT = 0.3%.

  - id: phy-tpm-023
    topic: thermal-expansion
    subtopic: Expansion of a hole
    concept: A hole in a plate expands like the material that would fill it
    category: concept
    format: direct
    difficulty: 2
    time: 35
    ncert: false
    battle: true
    tags: [superficial-expansion, trap]
    stem: A metal plate has a circular hole in it. When the plate is heated uniformly, the diameter of the hole
    options:
      - decreases
      - remains unchanged
      - decreases only if the plate is thin
      - increases
    answer: 3
    explanation: Thermal expansion is a uniform magnification of every length in the plate, including the hole. The hole grows exactly as a disc of the same metal filling it would. Many students expect the metal to expand inward and shrink the hole.

  - id: phy-tpm-024
    topic: thermal-expansion
    subtopic: Expansion of an ideal gas
    concept: For an ideal gas at constant pressure α_V = 1/T
    category: numerical
    format: direct
    difficulty: 2
    time: 35
    ncert: true
    battle: true
    formula: α_V = 1/T
    tags: [gas-expansion, ncert-line]
    stem: The coefficient of volume expansion of an ideal gas at constant pressure at 300 K is
    options:
      - 3.3 × 10^{-3} K^{-1}
      - 300 K^{-1}
      - 3.7 × 10^{-3} K^{-1}
      - 3.3 × 10^{-5} K^{-1}
    answer: 0
    explanation: From PV = μRT at constant P, ΔV/V = ΔT/T, so α_V = 1/T = 1/300 ≈ 3.3 × 10^{-3} K^{-1}. The value 3.7 × 10^{-3} K^{-1} is 1/273, which applies at 0 °C.

  - id: phy-tpm-025
    topic: thermal-expansion
    subtopic: Bimetallic strip
    concept: Metal with larger α lies on the convex side when a bimetallic strip is heated
    category: application
    format: direct
    difficulty: 2
    time: 35
    ncert: true
    battle: true
    tags: [bimetallic-strip]
    stem: A bimetallic strip is made of brass (α = 19 × 10^{-6} K^{-1}) and steel (α = 12 × 10^{-6} K^{-1}). On heating, the strip
    options:
      - bends with steel on the convex side
      - bends with brass on the convex side
      - stays straight but becomes longer
      - twists about its length
    answer: 1
    explanation: Brass expands more, so it becomes the longer, outer (convex) side of the arc. On cooling the strip bends the other way, with brass on the concave side. This is the principle of thermostats.

  - id: phy-tpm-026
    topic: thermal-expansion
    subtopic: Pendulum clocks
    concept: A metal pendulum lengthens in summer, so the clock loses time
    category: application
    format: direct
    difficulty: 2
    time: 35
    ncert: false
    battle: true
    formula: T = 2π√(L/g)
    tags: [pendulum-clock]
    stem: A pendulum clock with a brass pendulum keeps correct time in winter. In summer it will
    options:
      - gain time
      - keep correct time
      - stop
      - lose time
    answer: 3
    explanation: In summer the pendulum becomes longer, so its period T = 2π√(L/g) increases. Each tick takes longer and the clock runs slow, i.e. it loses time.

  - id: phy-tpm-027
    topic: thermal-expansion
    subtopic: Pendulum clocks
    concept: Fractional change in period = ½αΔθ
    category: numerical
    format: direct
    difficulty: 4
    time: 90
    ncert: false
    battle: false
    formula: ΔT/T = ½αΔθ
    tags: [pendulum-clock, multi-concept]
    stem: A pendulum clock keeps correct time at 20 °C. Its pendulum rod has α = 2 × 10^{-5} K^{-1}. At 30 °C the clock loses about how much time per day?
    options:
      - 4.32 s
      - 8.64 s
      - 17.28 s
      - 0.864 s
    answer: 1
    explanation: T ∝ √L, so ΔT/T = ½αΔθ = ½ × 2 × 10^{-5} × 10 = 10^{-4}. Time lost per day = 86400 × 10^{-4} ≈ 8.64 s. Forgetting the factor ½ gives 17.28 s.

  - id: phy-tpm-028
    topic: thermal-expansion
    subtopic: Measuring scales and temperature
    concept: An expanded scale under-reads lengths
    category: application
    format: direct
    difficulty: 3
    time: 45
    ncert: false
    battle: true
    tags: [scale-error, trap]
    stem: A steel measuring tape is calibrated at 20 °C. It is used at 40 °C to measure the length of a glass rod. The reading obtained is
    options:
      - less than the true length
      - more than the true length
      - equal to the true length
      - more or less depending on the rod's thickness
    answer: 0
    explanation: At 40 °C each marked division of the tape is longer than its calibrated value, so fewer divisions fit along the rod and the reading is smaller than the true length.

  - id: phy-tpm-029
    topic: thermal-expansion
    subtopic: Density and temperature
    concept: ρ' ≈ ρ(1 − γΔT)
    category: numerical
    format: direct
    difficulty: 2
    time: 40
    ncert: false
    battle: true
    formula: ρ' = ρ(1 − γΔT)
    tags: [density-change]
    stem: A metal has a coefficient of volume expansion 6 × 10^{-5} K^{-1}. When heated through 100 K, its density decreases by about
    options:
      - 0.06%
      - 0.2%
      - 0.6%
      - 6%
    answer: 2
    explanation: Mass is constant, so the fractional decrease in density equals the fractional increase in volume, γΔT = 6 × 10^{-5} × 100 = 6 × 10^{-3} = 0.6%.

  - id: phy-tpm-030
    topic: thermal-expansion
    subtopic: Constant length difference
    concept: Difference of lengths stays constant when L_1α_1 = L_2α_2
    category: numerical
    format: direct
    difficulty: 3
    time: 60
    ncert: false
    battle: false
    formula: L_1α_1 = L_2α_2
    tags: [linear-expansion, multi-concept]
    stem: An iron rod (α = 1.2 × 10^{-5} K^{-1}) is 30 cm long. What should be the length of a brass rod (α = 1.8 × 10^{-5} K^{-1}) so that the difference in their lengths remains the same at all temperatures?
    options:
      - 20 cm
      - 45 cm
      - 30 cm
      - 18 cm
    answer: 0
    explanation: The difference stays fixed if both rods expand by the same amount, L_1α_1ΔT = L_2α_2ΔT. So L_2 = 30 × 1.2/1.8 = 20 cm. 45 cm inverts the ratio.

  - id: phy-tpm-031
    topic: thermal-expansion
    subtopic: Expansion in daily life
    concept: Gaps in railway tracks allow for thermal expansion
    category: concept
    format: assertion-reason
    difficulty: 1
    time: 30
    ncert: false
    battle: false
    tags: [linear-expansion, applications]
    stem: |-
      Assertion (A): Small gaps are left between successive rails of a railway track.
      Reason (R): Rails expand when their temperature rises.
    options:
      - Both A and R are true and R is the correct explanation of A
      - Both A and R are true but R is not the correct explanation of A
      - A is true but R is false
      - A is false but R is true
    answer: 0
    explanation: Rails lengthen on hot days; without gaps the expansion would be prevented and the large thermal stress would buckle the track. So R correctly explains A.

  - id: phy-tpm-032
    topic: anomalous-expansion-thermal-stress
    subtopic: Anomalous expansion of water
    concept: Water has maximum density at 4 °C
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [anomalous-expansion, ncert-line]
    stem: Water has its maximum density at
    options:
      - 0 °C
      - −4 °C
      - 100 °C
      - 4 °C
    answer: 3
    explanation: Water contracts on heating from 0 °C to 4 °C and expands above 4 °C, so its density is maximum (about 1000 kg m^{-3}) at 4 °C.

  - id: phy-tpm-033
    topic: anomalous-expansion-thermal-stress
    subtopic: Anomalous expansion of water
    concept: Water contracts when heated from 0 °C to 4 °C
