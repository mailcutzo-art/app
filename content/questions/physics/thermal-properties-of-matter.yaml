    explanation: Power spreads over a sphere of radius d, so S = σT^4 (R/d)^2. T^4 = 1400 × (1.5 × 10^{11}/7 × 10^8)^2/5.67 × 10^{-8} ≈ 1400 × 4.59 × 10^4/5.67 × 10^{-8} ≈ 1.13 × 10^{15}, so T ≈ 5.8 × 10^3 K.

