questions:
  - id: phy-thermo-001
    topic: zeroth-law
    subtopic: Statement of the zeroth law
    concept: The zeroth law gives the concept of temperature
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [zeroth-law, ncert-line]
    stem: The zeroth law of thermodynamics leads directly to the concept of
    options:
      - Internal energy
      - Temperature
      - Entropy
      - Heat capacity
    answer: 1
    explanation: The zeroth law says two systems each in thermal equilibrium with a third are in equilibrium with each other, so there must be a common property that decides equilibrium. That property is temperature. Internal energy is associated with the first law and entropy with the second.

  - id: phy-thermo-002
    topic: zeroth-law
    subtopic: Transitivity of thermal equilibrium
    concept: Bodies in equilibrium with a common third body are in equilibrium with each other
    category: concept
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    tags: [zeroth-law, thermal-equilibrium]
    stem: Bodies A and B are each separately in thermal equilibrium with body C. Which statement about A and B is necessarily true?
    options:
      - They have the same internal energy
      - They contain equal amounts of heat
      - They are in thermal equilibrium with each other
      - They have the same specific heat
    answer: 2
    explanation: By the zeroth law, A and B are in thermal equilibrium with each other, which means they are at the same temperature. Equal temperature does not mean equal internal energy or equal specific heat, since these depend on mass and material, and a body does not "contain" heat.

  - id: phy-thermo-003
    topic: zeroth-law
    subtopic: Thermometry and equilibrium
    concept: A thermometer reads correctly only after reaching thermal equilibrium
    category: concept
    format: assertion-reason
    difficulty: 2
    time: 40
    ncert: false
    battle: false
    tags: [zeroth-law, thermometer]
    stem: |-
      Assertion (A): A clinical thermometer must be held in contact with the body for some time before it is read.
      Reason (R): A thermometer shows the temperature of a body correctly only after it attains thermal equilibrium with the body.
    options:
      - Both A and R are true and R is the correct explanation of A
      - Both A and R are true but R is not the correct explanation of A
      - A is true but R is false
      - A is false but R is true
    answer: 0
    explanation: A thermometer always indicates its own temperature. Only after heat exchange stops, that is at thermal equilibrium, is its temperature equal to the body's. So R is true and explains A, which is the basis of thermometry via the zeroth law.

  - id: phy-thermo-004
    topic: heat-work-internal-energy
    subtopic: Internal energy of an ideal gas
    concept: Internal energy of an ideal gas depends only on temperature
    category: concept
    format: direct
    difficulty: 2
    time: 25
    ncert: true
    battle: true
    tags: [internal-energy, ideal-gas]
    stem: For a fixed amount of an ideal gas, the internal energy depends only on its
    options:
      - Pressure
      - Volume
      - Temperature
      - Density
    answer: 2
    explanation: In an ideal gas there are no intermolecular forces, so there is no potential energy term; the internal energy is purely the kinetic energy of molecules, which depends only on temperature. Pressure or volume alone can change without changing U if T stays fixed.

  - id: phy-thermo-005
    topic: heat-work-internal-energy
    subtopic: State and path functions
    concept: Internal energy is a state function; heat and work are path dependent
    category: concept
    format: statements
    difficulty: 2
    time: 40
    ncert: true
    battle: false
    tags: [state-function, path-function, trap]
    stem: Which of the following statements is correct?
    options:
      - Heat is a state variable of a system
      - The work done by a gas is the same for every path between two given states
      - The change in internal energy depends only on the initial and final states
      - A body in a given state contains a definite amount of heat
    answer: 2
    explanation: Internal energy is a state variable, so ΔU depends only on the end states. Heat and work are modes of energy transfer that depend on the path taken; a body has internal energy, not "heat". Hence only the third statement is correct.

  - id: phy-thermo-006
    topic: heat-work-internal-energy
    subtopic: Work at constant pressure
    concept: W = PΔV for expansion at constant pressure
    category: numerical
    format: direct
    difficulty: 1
    time: 30
    ncert: true
    battle: true
    formula: W = PΔV
    tags: [work-done, isobaric]
    stem: A gas expands by 2 × 10^{-3} m^3 against a constant pressure of 1 × 10^5 Pa. The work done by the gas is
    options:
      - 2 J
      - 20 J
      - 2000 J
      - 200 J
    answer: 3
    explanation: W = PΔV = (1 × 10^5 Pa)(2 × 10^{-3} m^3) = 200 J. The common slip is a factor-of-10 error in the powers of ten.

  - id: phy-thermo-007
    topic: heat-work-internal-energy
    subtopic: Heat and work as modes of energy transfer
    concept: Internal energy can be changed either by heat or by work
    category: concept
    format: case
    difficulty: 2
    time: 40
    ncert: true
    battle: false
    tags: [heat, work, internal-energy, ncert-line]
    stem: The temperature of a gas in a cylinder can be raised either by keeping the cylinder on a hot plate or by pushing the piston in quickly. This shows that
    options:
      - heat and work are two different modes of changing the internal energy of a system
      - work is a form of internal energy stored in the gas
      - the gas holds more heat after compression than after heating
      - heat can be transferred only by doing mechanical work
    answer: 0
    explanation: Both heating (energy transfer due to temperature difference) and doing work on the gas raise the internal energy and hence the temperature. Heat and work are not stored; they are modes of transfer, while internal energy is what the gas possesses.

  - id: phy-thermo-008
    topic: first-law
    subtopic: Applying ΔQ = ΔU + ΔW
    concept: ΔU = Q − W for heat absorbed and work done by gas
    category: numerical
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    formula: ΔU = ΔQ − ΔW
    tags: [first-law]
    stem: A gas absorbs 300 J of heat and does 120 J of work on its surroundings. The change in its internal energy is
    options:
      - 420 J
      - 180 J
      - −180 J
      - 120 J
    answer: 1
    explanation: ΔU = ΔQ − ΔW = 300 − 120 = 180 J. Adding the two (420 J) wrongly treats work done by the gas as energy gained.

  - id: phy-thermo-009
    topic: first-law
    subtopic: Sign convention
    concept: Work done on gas is negative ΔW; heat released is negative ΔQ
    category: numerical
    format: direct
    difficulty: 2
    time: 35
    ncert: true
    battle: true
    formula: ΔU = ΔQ − ΔW
    tags: [first-law, sign-convention, trap]
    stem: 200 J of work is done on a gas while it gives out 50 J of heat to the surroundings. The change in internal energy of the gas is
    options:
      - +250 J
      - −150 J
      - +150 J
      - −250 J
    answer: 2
    explanation: With ΔW as work by the gas, ΔW = −200 J and ΔQ = −50 J. So ΔU = ΔQ − ΔW = −50 + 200 = +150 J. Choosing +250 J ignores that the heat is lost.

  - id: phy-thermo-010
    topic: first-law
    subtopic: Meaning of the first law
    concept: The first law is the law of conservation of energy
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [first-law, ncert-line]
    stem: The first law of thermodynamics is essentially a statement of the principle of
    options:
      - conservation of mass
      - increase of entropy
      - conservation of momentum
      - conservation of energy
    answer: 3
    explanation: ΔQ = ΔU + ΔW states that heat supplied goes into raising internal energy and doing work, which is the conservation of energy applied to thermal systems. Entropy increase belongs to the second law.

  - id: phy-thermo-011
    topic: first-law
    subtopic: First law in phase change
    concept: In boiling, ΔU = mL − PΔV
    category: numerical
    format: direct
    difficulty: 4
    time: 120
    ncert: true
    battle: false
    formula: ΔU = ΔQ − PΔV
    tags: [first-law, latent-heat, multi-concept, ncert-line]
    stem: 1.00 g of water at 100 °C (volume 1.00 cm^3) becomes 1671 cm^3 of steam at a pressure of 1.013 × 10^5 Pa. The latent heat of vaporisation is 2256 J g^{-1}. The increase in internal energy is about
    options:
      - 2256 J
      - 2425 J
      - 2087 J
      - 169 J
    answer: 2
    explanation: Work done by the system = PΔV = 1.013 × 10^5 × 1670 × 10^{-6} ≈ 169 J. Heat supplied = 2256 J, so ΔU = 2256 − 169 ≈ 2087 J. Taking ΔU equal to the latent heat forgets the work done against the atmosphere during expansion.

  - id: phy-thermo-012
    topic: first-law
    subtopic: Sign convention
    concept: ΔW is work by the system and is negative in compression
    category: concept
    format: statement-pair
    difficulty: 2
    time: 40
    ncert: true
    battle: false
    tags: [first-law, sign-convention]
    stem: |-
      Statement I: In the relation ΔQ = ΔU + ΔW, ΔW stands for the work done by the system on its surroundings.
      Statement II: When a gas is compressed, ΔW in this relation is negative.
    options:
      - Both Statement I and Statement II are correct
      - Both Statement I and Statement II are incorrect
      - Statement I is correct but Statement II is incorrect
      - Statement I is incorrect but Statement II is correct
    answer: 0
    explanation: In the NCERT convention ΔW is work done by the system. During compression the surroundings do work on the gas, so work by the gas is negative. Both statements are correct.

  - id: phy-thermo-013
    topic: first-law
    subtopic: Different paths between same states
    concept: ΔU is path independent, so Q − W is the same for all paths
    category: application
    format: direct
    difficulty: 3
    time: 60
    ncert: false
    battle: false
    formula: ΔQ = ΔU + ΔW
    tags: [first-law, state-function, multi-concept]
    stem: A gas goes from state A to state B along path 1, absorbing 80 J of heat and doing 30 J of work. Along path 2 between the same states it does 50 J of work. The heat absorbed along path 2 is
    options:
      - 80 J
      - 100 J
      - 130 J
      - 60 J
    answer: 1
    explanation: ΔU = 80 − 30 = 50 J, and this is the same for path 2 because U is a state function. So Q_2 = ΔU + W_2 = 50 + 50 = 100 J. Taking the same heat for both paths wrongly treats heat as a state function.

  - id: phy-thermo-014
    topic: specific-heats
    subtopic: Mayer's relation
    concept: Cp − Cv = R for an ideal gas
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    formula: C_p − C_v = R
    tags: [mayer-relation, ncert-line]
    stem: For one mole of an ideal gas, the molar specific heats at constant pressure and constant volume are related by
    options:
      - C_p + C_v = R
      - C_p / C_v = R
      - C_p − C_v = R
      - C_v − C_p = R
    answer: 2
    explanation: Mayer's relation C_p − C_v = R follows from the first law since, at constant pressure, extra heat R per kelvin per mole is used as work PΔV = RΔT. The ratio C_p/C_v is γ, not R.

  - id: phy-thermo-015
    topic: specific-heats
    subtopic: Why Cp exceeds Cv
    concept: At constant pressure part of heat does external work
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [specific-heat, cp-cv]
    stem: C_p is greater than C_v for a gas because at constant pressure
    options:
      - part of the heat supplied is used to do work in expansion
      - the gas molecules move faster
      - intermolecular attraction increases
      - the gas loses heat to the surroundings
    answer: 0
    explanation: At constant volume all the heat raises internal energy. At constant pressure the gas also expands and does work PΔV, so more heat is needed for the same rise in temperature, making C_p > C_v.

  - id: phy-thermo-016
    topic: specific-heats
    subtopic: γ for different gases
    concept: γ = 5/3 for a monatomic ideal gas
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    formula: γ = C_p / C_v
    tags: [gamma, monatomic]
    stem: The ratio of specific heats γ = C_p/C_v for a monatomic ideal gas is
    options:
      - "5/3"
      - "7/5"
      - "4/3"
      - "9/7"
    answer: 0
    explanation: For a monatomic gas C_v = 3R/2 and C_p = 5R/2, so γ = 5/3 ≈ 1.67. The value 7/5 applies to a rigid diatomic gas and 4/3 to a non-linear polyatomic gas.

  - id: phy-thermo-017
    topic: specific-heats
    subtopic: C_p from γ
    concept: C_v = R/(γ − 1), C_p = γR/(γ − 1)
    category: numerical
    format: direct
    difficulty: 3
    time: 45
    ncert: false
    battle: true
    formula: C_p = γR/(γ − 1)
    tags: [gamma, cp-cv]
    stem: For an ideal gas with γ = 1.4, the molar specific heat at constant pressure is
    options:
      - 2.5R
      - 3.5R
      - 1.4R
      - 4.5R
    answer: 1
    explanation: C_v = R/(γ − 1) = R/0.4 = 2.5R and C_p = γC_v = 1.4 × 2.5R = 3.5R. The option 2.5R is C_v, not C_p.

  - id: phy-thermo-018
    topic: specific-heats
    subtopic: Specific heats per unit mass
    concept: c_p − c_v = R/M per unit mass
    category: numerical
    format: direct
    difficulty: 3
    time: 50
    ncert: false
    battle: false
    formula: c_p − c_v = R/M
    tags: [mayer-relation, trap]
    stem: For hydrogen gas (molar mass 2 g mol^{-1}), the difference c_p − c_v of the specific heats per unit mass is about (R = 8.31 J mol^{-1} K^{-1})
    options:
      - 16.6 J g^{-1} K^{-1}
      - 8.31 J g^{-1} K^{-1}
      - 2.08 J g^{-1} K^{-1}
      - 4.16 J g^{-1} K^{-1}
    answer: 3
    explanation: Per unit mass the difference is R/M = 8.31/2 ≈ 4.16 J g^{-1} K^{-1}. Writing 8.31 forgets to divide by molar mass, and 16.6 multiplies instead of dividing.

  - id: phy-thermo-019
    topic: state-variables
    subtopic: Extensive and intensive variables
    concept: Internal energy is an extensive variable
    category: factual
    format: direct
    difficulty: 2
    time: 25
    ncert: true
    battle: true
    tags: [extensive, intensive, ncert-line]
    stem: Which of the following is an extensive state variable?
    options:
      - Temperature
      - Pressure
      - Density
      - Internal energy
    answer: 3
    explanation: An extensive variable scales with the size of the system. If a system is divided into two halves, each half has half the internal energy but the same temperature, pressure and density, which are intensive.

  - id: phy-thermo-020
    topic: state-variables
    subtopic: Extensive and intensive variables
    concept: Pressure and temperature are both intensive
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [intensive, extensive]
    stem: Which pair consists only of intensive variables?
    options:
      - Pressure and temperature
      - Volume and mass
      - Internal energy and temperature
      - Mass and density
    answer: 0
    explanation: Intensive variables do not depend on the amount of the system; pressure and temperature stay the same if the system is split. Volume, mass and internal energy are extensive, so every other pair contains at least one extensive variable.

  - id: phy-thermo-021
    topic: state-variables
    subtopic: State variables
    concept: Work is not a state variable
    category: concept
    format: direct
    difficulty: 2
    time: 25
    ncert: true
    battle: true
    tags: [state-function, path-function]
    stem: Which of the following is NOT a state variable of a gas?
    options:
      - Internal energy
      - Work done on it
      - Pressure
      - Temperature
    answer: 1
    explanation: State variables describe an equilibrium state and do not depend on how it was reached. Work done depends on the path between states, so it is not a state variable; U, P and T are.

  - id: phy-thermo-022
    topic: isothermal-process
    subtopic: Work in isothermal expansion
    concept: W = nRT ln(V_2/V_1)
    category: numerical
    format: direct
    difficulty: 3
    time: 60
    ncert: true
    battle: false
    formula: W = nRT ln(V_2/V_1)
    tags: [isothermal, work-done]
    stem: Two moles of an ideal gas at 300 K expand isothermally and reversibly from 10 L to 20 L. The work done by the gas is about (R = 8.31 J mol^{-1} K^{-1}, ln 2 = 0.693)
    options:
      - 3.46 kJ
      - 1.73 kJ
      - 4.99 kJ
      - 6.92 kJ
    answer: 0
    explanation: W = nRT ln(V_2/V_1) = 2 × 8.31 × 300 × 0.693 ≈ 3455 J ≈ 3.46 kJ. Using n = 1 gives 1.73 kJ, and forgetting the log gives 4.99 kJ.

  - id: phy-thermo-023
    topic: isothermal-process
    subtopic: First law for isothermal process
    concept: In isothermal process of an ideal gas ΔU = 0 so Q = W
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [isothermal, first-law]
    stem: During an isothermal expansion of an ideal gas,
    options:
      - no heat is absorbed by the gas
      - the internal energy of the gas decreases
      - the heat absorbed equals the work done by the gas
      - the temperature of the gas falls
    answer: 2
    explanation: At constant temperature the internal energy of an ideal gas does not change, so ΔQ = ΔW. The gas must absorb heat equal to the work it does; no heat absorbed would describe an adiabatic process.

  - id: phy-thermo-024
    topic: isothermal-process
    subtopic: Heat capacity in isothermal process
    concept: Specific heat in an isothermal process is infinite
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: false
    battle: true
    formula: C = ΔQ/(nΔT)
    tags: [isothermal, specific-heat, trap]
    stem: The molar heat capacity of a gas during an isothermal process is
    options:
      - zero
      - infinite
      - C_v
      - C_p
    answer: 1
    explanation: C = ΔQ/(nΔT). In an isothermal process heat is exchanged but ΔT = 0, so C is infinite. Zero heat capacity belongs to the adiabatic process, where ΔQ = 0.

  - id: phy-thermo-025
    topic: isothermal-process
    subtopic: Boyle's law
    concept: PV = constant in isothermal process
    category: numerical
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    formula: PV = constant
    tags: [isothermal, boyle-law]
    stem: A gas at 1 atm is compressed isothermally to one-fourth of its volume. Its final pressure is
    options:
      - 0.25 atm
      - 2 atm
      - 4 atm
      - 16 atm
    answer: 2
    explanation: For an isothermal process PV is constant, so P_2 = P_1V_1/V_2 = 1 × 4 = 4 atm. 16 atm would need P ∝ V^{-2}, which is not the case.

  - id: phy-thermo-026
    topic: isothermal-process
    subtopic: Heat in isothermal compression
    concept: In isothermal compression heat released equals work done on gas
    category: application
    format: direct
    difficulty: 2
    time: 35
    ncert: false
    battle: true
    tags: [isothermal, first-law]
    stem: 500 J of work is done on an ideal gas while it is compressed isothermally. During this process the gas
    options:
      - absorbs 500 J of heat
      - releases 500 J of heat
      - exchanges no heat
      - releases 250 J of heat
    answer: 1
    explanation: ΔU = 0 at constant temperature, so ΔQ = ΔW = −500 J. The negative sign means the gas gives out 500 J of heat, otherwise its temperature would rise.

  - id: phy-thermo-027
    topic: adiabatic-process
    subtopic: Definition
    concept: No heat exchange in an adiabatic process
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [adiabatic]
    stem: Which quantity is zero for every adiabatic process?
    options:
      - Change in internal energy
      - Work done by the gas
      - Heat exchanged with the surroundings
      - Change in temperature
    answer: 2
    explanation: An adiabatic process is one in which the system is insulated, so ΔQ = 0. The gas can still do work and change its internal energy and temperature, as in adiabatic expansion where it cools.

  - id: phy-thermo-028
    topic: adiabatic-process
    subtopic: TV^{γ−1} = constant
    concept: Temperature rise in adiabatic compression of monatomic gas
    category: numerical
    format: direct
    difficulty: 3
    time: 60
    ncert: false
    battle: false
    formula: TV^{γ−1} = constant
    tags: [adiabatic, temperature-volume]
    stem: A monatomic ideal gas is compressed adiabatically to 1/8 of its original volume. The ratio of its final to initial absolute temperature is
    options:
      - "2"
      - "4"
      - "8"
      - "32"
    answer: 1
    explanation: TV^{γ−1} is constant, so T_2/T_1 = (V_1/V_2)^{γ−1} = 8^{2/3} = 4. The value 32 is the pressure ratio 8^{5/3}, a common confusion.

  - id: phy-thermo-029
    topic: adiabatic-process
    subtopic: PV^γ = constant
    concept: Pressure ratio in adiabatic compression of diatomic gas
    category: numerical
    format: direct
    difficulty: 3
    time: 60
    ncert: false
    battle: false
    formula: PV^γ = constant
    tags: [adiabatic, pressure-volume]
    stem: A diatomic ideal gas (γ = 7/5) is compressed adiabatically to 1/32 of its initial volume. Its pressure becomes
    options:
      - 32 times
      - 64 times
      - 128 times
      - 256 times
    answer: 2
    explanation: P_2/P_1 = (V_1/V_2)^γ = 32^{7/5} = (2^5)^{7/5} = 2^7 = 128. Choosing 32 applies Boyle's law, which holds only for isothermal change.

  - id: phy-thermo-030
    topic: adiabatic-process
    subtopic: Cooling in adiabatic expansion
    concept: In adiabatic expansion work comes from internal energy
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [adiabatic, internal-energy]
    stem: When a gas expands adiabatically its temperature falls because
    options:
      - heat flows out of the gas to the surroundings
      - the molecules lose mass during expansion
      - its pressure increases during expansion
      - the gas does work at the expense of its internal energy
    answer: 3
    explanation: With ΔQ = 0, the first law gives ΔU = −ΔW. Positive work by the gas lowers U, and so the temperature falls. No heat leaves the gas, which rules out the first option.

  - id: phy-thermo-031
    topic: adiabatic-process
    subtopic: Work in adiabatic process
    concept: W = nR(T_1 − T_2)/(γ − 1)
    category: numerical
    format: direct
    difficulty: 3
    time: 60
    ncert: true
    battle: false
    formula: W = nR(T_1 − T_2)/(γ − 1)
    tags: [adiabatic, work-done]
    stem: One mole of a monatomic ideal gas expands adiabatically and its temperature falls from 500 K to 300 K. The work done by the gas is about (R = 8.31 J mol^{-1} K^{-1})
    options:
      - 2.49 kJ
      - 1.66 kJ
      - 4.16 kJ
      - 3.74 kJ
    answer: 0
    explanation: W = nR(T_1 − T_2)/(γ − 1) = 8.31 × 200/(2/3) ≈ 2493 J ≈ 2.49 kJ. This equals −ΔU = nC_vΔT = 1.5R × 200. The value 1.66 kJ is just nRΔT.

  - id: phy-thermo-032
    topic: processes-pv-diagrams
    subtopic: Isochoric process
    concept: No work in an isochoric process
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [isochoric, work-done]
    stem: In an isochoric process, the work done by the gas is
    options:
      - nRΔT
      - PΔV with ΔV positive
      - zero
      - equal to the heat supplied
    answer: 2
    explanation: Isochoric means constant volume; with ΔV = 0 no work is done. All the heat supplied goes into internal energy, so the work cannot equal the heat supplied (unless both are zero).

  - id: phy-thermo-033
    topic: processes-pv-diagrams
    subtopic: Cyclic process
    concept: ΔU = 0 over a complete cycle
    category: concept
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [cyclic-process, internal-energy]
    stem: For a gas taken through a complete cyclic process, which quantity is always zero?
    options:
      - Change in internal energy
      - Net work done
      - Net heat absorbed
      - Efficiency of the process
    answer: 0
    explanation: The gas returns to its initial state, and U is a state function, so ΔU = 0. Net work and net heat are equal but generally not zero; they equal the area enclosed on the P–V diagram.

  - id: phy-thermo-034
