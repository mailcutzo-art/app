      - it underlies the concept of temperature on which the other laws rely
      - it was proposed by a scientist before Joule
    answer: 2
    explanation: The zeroth law introduces temperature as the property that decides thermal equilibrium. Since the first and second laws use temperature, it is logically prior, hence the name "zeroth". It has nothing to do with absolute zero.

