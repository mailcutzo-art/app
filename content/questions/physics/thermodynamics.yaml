      - negative and equal to the area enclosed by the cycle
      - equal to the area under path AB only
    answer: 1
    explanation: Net work in a cycle equals the area enclosed on the P–V diagram. For a clockwise cycle the expansion occurs at higher pressure than the compression, so net work by the gas is positive. Zero is wrong because work is path dependent even though ΔU = 0.

