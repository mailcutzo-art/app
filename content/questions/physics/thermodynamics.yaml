    stem: A Carnot engine working between 400 K and 300 K absorbs 1000 J per cycle and uses all its work to drive a Carnot refrigerator working between 300 K and 250 K. The heat removed from the 250 K space per cycle is
    options:
      - 250 J
      - 1000 J
      - 1250 J
      - 750 J
    answer: 2
    explanation: The engine gives W = 1000 × (1 − 300/400) = 250 J. The refrigerator has β = 250/(300 − 250) = 5, so it removes 5 × 250 = 1250 J.

