      - A process whose sole result is complete conversion of heat from a reservoir into work
      - Complete conversion of work into heat
      - Heat flowing by itself from a hot body to a cold body
    answer: 1
    explanation: Kelvin–Planck says no process is possible whose sole result is the absorption of heat from a reservoir and its complete conversion into work. Converting work fully into heat, as in friction, is perfectly possible.

  - id: phy-thermo-039
