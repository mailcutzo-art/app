      - 6 m s^{-2}
      - 4 m s^{-2}
      - 7 m s^{-2}
    answer: 1
    explanation: In the lift frame, the effective gravity is g + a = 12 m s^{-2}. a_{rel} = (3 − 1) × 12/(3 + 1) = 6 m s^{-2}. Using g alone gives 5 m s^{-2}.

