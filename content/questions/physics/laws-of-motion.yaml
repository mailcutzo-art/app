questions:
  - id: phy-lom-001
    topic: inertia-first-law
    subtopic: Aristotle's fallacy
    concept: Aristotle wrongly held that a force is needed to maintain uniform motion
    category: factual
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    tags: [aristotle, ncert-line]
    stem: According to Aristotle's view of motion, which statement was believed to be true?
    options:
      - A body moves with uniform velocity when no force acts on it
      - An external force is required to keep a body in uniform motion
      - Force produces acceleration, not velocity
      - All bodies fall with the same acceleration in vacuum
    answer: 1
    explanation: Aristotle held that an external force is needed to keep a body moving uniformly. Galileo showed this is wrong; a force is needed only because friction opposes motion, and with no net force a body keeps its velocity.

  - id: phy-lom-002
    topic: inertia-first-law
    subtopic: Galileo's inclined planes
    concept: On a frictionless horizontal plane a ball would move forever
    category: concept
    format: case
    difficulty: 2
    time: 40
    ncert: true
    battle: false
    tags: [galileo, inclined-plane]
    stem: In Galileo's double inclined plane experiment, a ball rolls down one smooth plane and up a second. As the slope of the second plane is reduced towards zero, what does Galileo conclude?
    options:
      - The ball stops sooner because it has less height to climb
      - The ball travels a shorter distance on the second plane
      - The ball would travel indefinitely on a frictionless horizontal plane
      - The ball needs a continuous push to keep moving on the horizontal plane
    answer: 2
    explanation: The ball always tends to rise to its original height. As the second slope decreases, it travels farther; on a horizontal frictionless plane it can never regain that height, so it keeps moving forever. This is the germ of the law of inertia.

  - id: phy-lom-003
    topic: inertia-first-law
    subtopic: Measure of inertia
    concept: Mass is the quantitative measure of inertia
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [inertia, mass]
    stem: Which physical quantity is a measure of the inertia of a body?
    options:
      - Velocity
      - Weight
      - Momentum
      - Mass
    answer: 3
    explanation: Inertia is the resistance of a body to a change in its state of rest or uniform motion, and mass measures it. Weight depends on g and momentum depends on velocity, so neither measures inertia.

  - id: phy-lom-004
    topic: inertia-first-law
    subtopic: Inertia of rest
    concept: Beating a carpet removes dust by inertia of rest
    category: application
    format: direct
    difficulty: 1
    time: 25
    ncert: false
    battle: true
    tags: [inertia-of-rest]
    stem: Dust comes out of a carpet when it is beaten with a stick. This is best explained by
    options:
      - inertia of rest of the dust particles
      - inertia of motion of the dust particles
      - Newton's third law acting on the carpet
      - the friction between dust and carpet
    answer: 0
    explanation: The carpet is suddenly set into motion while the dust particles, by inertia of rest, tend to remain where they were, so they separate from the carpet. Friction actually holds dust on, it does not remove it.

  - id: phy-lom-005
    topic: inertia-first-law
    subtopic: Net force and state of motion
    concept: Zero net force does not mean zero forces
    category: concept
    format: statement-pair
    difficulty: 2
    time: 45
    ncert: true
    battle: false
    tags: [first-law, trap]
    stem: |-
      Statement I: A body moving with constant velocity in a straight line has zero net external force on it.
      Statement II: A body at rest must have no forces acting on it.
    options:
      - Both Statement I and Statement II are correct
      - Both Statement I and Statement II are incorrect
      - Statement I is correct but Statement II is incorrect
      - Statement I is incorrect but Statement II is correct
    answer: 2
    explanation: By the first law, constant velocity means zero acceleration and hence zero net force, so Statement I is correct. A body at rest may have several forces acting (a book on a table feels weight and normal force); only their resultant must be zero, so Statement II is incorrect.

  - id: phy-lom-006
    topic: inertia-first-law
    subtopic: Motion in free space
    concept: With no net force a spaceship keeps constant velocity
    category: concept
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    tags: [first-law, trap]
    stem: A spaceship far from all stars moves at 5 km s^{-1} and its engines are switched off. What happens to its motion?
    options:
      - It gradually slows down and stops
      - It moves in a circle
      - It speeds up slowly
      - It continues at 5 km s^{-1} in a straight line
    answer: 3
    explanation: With negligible external force there is no acceleration, so by the first law the ship keeps moving with the same velocity. The idea that it slows down is Aristotle's error; no force is needed to maintain motion.

  - id: phy-lom-007
    topic: inertia-first-law
    subtopic: Inertia of direction
    concept: Passengers are thrown outward when a vehicle turns
    category: concept
    format: assertion-reason
    difficulty: 2
    time: 40
    ncert: true
    battle: false
    tags: [inertia-of-direction]
    stem: |-
      Assertion (A): When a bus takes a sharp left turn, a standing passenger tends to fall towards the right.
      Reason (R): A body tends to continue moving in its original direction unless an external force changes it.
    options:
      - Both A and R are true and R is the correct explanation of A
      - Both A and R are true but R is not the correct explanation of A
      - A is true but R is false
      - A is false but R is true
    answer: 0
    explanation: The bus turns left but the passenger's body, by inertia of direction, tries to continue straight ahead, which relative to the bus is towards the right. R is the first law and directly explains A.

  - id: phy-lom-008
    topic: inertia-first-law
    subtopic: Identifying zero net force
    concept: Uniform circular motion needs a net force
    category: application
    format: multi-statement
    difficulty: 3
    time: 60
    ncert: true
    battle: false
    tags: [first-law, net-force, trap]
    stem: |-
      In which of these cases is the net force on the body zero?
      I. A raindrop falling with constant (terminal) speed
      II. A cork floating at rest on water
      III. A car moving at constant speed around a circular track
      IV. A kite held stationary in the sky
    options:
      - I and II only
      - II and IV only
      - I, II and IV only
      - I, II, III and IV
    answer: 2
    explanation: In I, II and IV the velocity is constant (or zero), so the net force is zero. In III the direction of velocity changes continuously; a centripetal net force is required, so III is excluded.

  - id: phy-lom-009
    topic: inertia-first-law
    subtopic: Content of the first law
    concept: First law defines force qualitatively and inertial frames
    category: concept
    format: direct
    difficulty: 2
    time: 35
    ncert: false
    battle: true
    tags: [first-law, inertial-frame]
    stem: Newton's first law of motion gives
    options:
      - a quantitative measure of force
      - a qualitative definition of force and the idea of inertia
      - the relation between action and reaction
      - the law of conservation of momentum
    answer: 1
    explanation: The first law tells us what a force does (changes the state of rest or uniform motion) and introduces inertia, a qualitative definition. The quantitative measure F = dp/dt comes from the second law.

  - id: phy-lom-010
    topic: inertia-first-law
    subtopic: Coin and card experiment
    concept: A coin falls into the glass when the card is flicked away
    category: application
    format: case
    difficulty: 2
    time: 40
    ncert: false
    battle: false
    tags: [inertia-of-rest, experiment]
    stem: A coin rests on a card placed over the mouth of a glass. When the card is flicked sharply sideways, the coin drops into the glass. The best explanation is that
    options:
      - the flick exerts a large downward force on the coin
      - the coin has inertia of motion and moves with the card
      - friction between card and coin is very large
      - the coin tends to stay at rest while the card is removed quickly, then gravity pulls it down
    answer: 3
    explanation: The quick flick acts for a very short time, so the small friction cannot give the coin appreciable horizontal velocity. By inertia of rest the coin stays in place and then falls under gravity. A large friction would drag the coin with the card instead.

  - id: phy-lom-011
    topic: second-law-momentum
    subtopic: F = ma
    concept: Acceleration from net force and mass
    category: numerical
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    formula: F = ma
    tags: [second-law]
    stem: A net force of 20 N acts on a 5 kg body. What is its acceleration?
    options:
      - 100 m s^{-2}
      - 0.25 m s^{-2}
      - 4 m s^{-2}
      - 15 m s^{-2}
    answer: 2
    explanation: a = F/m = 20/5 = 4 m s^{-2}. Multiplying (100) or dividing the wrong way (0.25) are the usual slips.

  - id: phy-lom-012
    topic: second-law-momentum
    subtopic: Force as rate of change of momentum
    concept: Average force equals change in momentum over time
    category: numerical
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    formula: F = Δp/Δt
    tags: [second-law, momentum]
    stem: The momentum of a body increases from 20 kg m s^{-1} to 50 kg m s^{-1} in 3 s. What is the average force on it?
    options:
      - 10 N
      - 30 N
      - 23.3 N
      - 90 N
    answer: 0
    explanation: F = Δp/Δt = (50 − 20)/3 = 10 N. Using the final momentum alone gives 16.7 N or other wrong values; only the change matters.

  - id: phy-lom-013
    topic: second-law-momentum
    subtopic: Units of momentum
    concept: Momentum has units kg m s^-1, equivalent to N s
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [units, momentum]
    stem: Which of the following is a correct SI unit of linear momentum?
    options:
      - N s^{-1}
      - kg m s^{-2}
      - N s
      - J s
    answer: 2
    explanation: p = mv has unit kg m s^{-1}. Since 1 N = 1 kg m s^{-2}, 1 N s = 1 kg m s^{-1}. kg m s^{-2} is the newton (force) and J s is the unit of angular momentum.

  - id: phy-lom-014
    topic: second-law-momentum
    subtopic: Time-varying velocity
    concept: Force from a velocity that depends on time
    category: numerical
    format: direct
    difficulty: 3
    time: 60
    ncert: false
    battle: false
    formula: F = m dv/dt
    tags: [calculus, second-law]
    stem: The velocity of a 2 kg particle moving along a line is v = 3t^2 m s^{-1}, with t in seconds. What force acts on it at t = 2 s?
    options:
      - 12 N
      - 24 N
      - 6 N
      - 48 N
    answer: 1
    explanation: a = dv/dt = 6t = 12 m s^{-2} at t = 2 s, so F = ma = 2 × 12 = 24 N. The value 12 N forgets the mass, and 24 N is not obtained by using v = 12 m s^{-1} directly.

  - id: phy-lom-015
    topic: second-law-momentum
    subtopic: Momentum as a function of time
    concept: F = dp/dt for polynomial momentum
    category: numerical
    format: direct
    difficulty: 2
    time: 40
    ncert: false
    battle: true
    formula: F = dp/dt
    tags: [calculus, momentum]
    stem: The momentum of a particle is p = (2t^2 + 3t) kg m s^{-1}. What force acts on it at t = 2 s?
    options:
      - 14 N
      - 7 N
      - 8 N
      - 11 N
    answer: 3
    explanation: F = dp/dt = 4t + 3 = 4 × 2 + 3 = 11 N. The value 14 N is the momentum itself at t = 2 s, not its rate of change.

  - id: phy-lom-016
    topic: second-law-momentum
    subtopic: p–t graph
    concept: Slope of a momentum–time graph is force
    category: concept
    format: graph
    difficulty: 2
    time: 35
    ncert: true
    battle: true
    tags: [graph, momentum]
    stem: The momentum–time graph of a body is a straight line with positive slope not passing through the origin. The force on the body is
    options:
      - constant and non-zero
      - zero
      - increasing uniformly with time
      - decreasing uniformly with time
    answer: 0
    explanation: Force equals the slope dp/dt. A straight line has constant slope, so the force is constant; a non-zero intercept only means the body had initial momentum.

  - id: phy-lom-017
    topic: second-law-momentum
    subtopic: Momentum and kinetic energy
    concept: p = √(2mK) for bodies with equal kinetic energy
    category: numerical
    format: direct
    difficulty: 3
    time: 50
    ncert: false
    battle: true
    formula: p = √(2mK)
    tags: [momentum, kinetic-energy]
    stem: Two bodies of masses 1 kg and 4 kg have equal kinetic energies. What is the ratio of their momenta?
    options:
      - "1 : 4"
      - "4 : 1"
      - "1 : 16"
      - "1 : 2"
    answer: 3
    explanation: "p = √(2mK), so with equal K, p ∝ √m. The ratio is √1 : √4 = 1 : 2. The ratio 1 : 4 wrongly assumes p ∝ m."

  - id: phy-lom-018
    topic: second-law-momentum
    subtopic: Machine gun recoil force
    concept: Force = number per second × momentum of each bullet
    category: numerical
    format: direct
    difficulty: 3
    time: 60
    ncert: false
    battle: false
    formula: F = n m v
    tags: [variable-mass, momentum]
    stem: A machine gun fires 10 bullets per second, each of mass 20 g, with a speed of 500 m s^{-1}. What average force must be applied to hold the gun steady?
    options:
      - 10 N
      - 100 N
      - 1000 N
      - 50 N
    answer: 1
    explanation: Momentum given to bullets per second = n m v = 10 × 0.020 × 500 = 100 kg m s^{-2} = 100 N. The same force must be supplied to the gun to hold it in place. Forgetting to convert 20 g into 0.020 kg gives 100 000 N type errors.

  - id: phy-lom-019
    topic: second-law-momentum
    subtopic: Consistency of the laws
    concept: Second law contains the first law as the case F = 0
    category: concept
    format: statements
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [second-law, first-law]
    stem: Which statement about Newton's second law is correct?
    options:
      - It applies only to bodies moving with constant velocity
      - It is consistent with the first law, since F = 0 gives zero acceleration
      - The force at an instant depends on the past history of motion
      - Acceleration and net force can point in different directions for a point particle
    answer: 1
    explanation: Setting F = 0 in F = ma gives a = 0, which is the first law. The second law is a local relation (force at an instant decides acceleration at that instant, not history) and a is always along the net force.

  - id: phy-lom-020
    topic: second-law-momentum
    subtopic: Conveyor belt
    concept: Extra force needed = v × (dm/dt) for mass added to a moving belt
    category: numerical
    format: case
    difficulty: 4
    time: 90
    ncert: false
    battle: false
    formula: F = v dm/dt
    tags: [variable-mass, multi-concept]
    stem: Sand drops vertically at the rate of 2 kg s^{-1} onto a conveyor belt moving horizontally at a constant 3 m s^{-1}. What extra horizontal force is needed to keep the belt moving at constant speed?
    options:
      - 1.5 N
      - 3 N
      - 6 N
      - 12 N
    answer: 2
    explanation: Each second 2 kg of sand gains horizontal velocity 3 m s^{-1}, so the rate of change of momentum is v dm/dt = 3 × 2 = 6 N. Even though the belt's velocity is constant, the system's momentum grows because its mass grows.

  - id: phy-lom-021
    topic: impulse
    subtopic: Dimensions of impulse
    concept: Impulse has the same dimensions as momentum
    category: factual
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    tags: [dimensions, impulse]
    stem: Impulse has the same dimensional formula as
    options:
      - force
      - linear momentum
      - work
      - power
    answer: 1
    explanation: Impulse = F Δt = Δp, so it has the dimensions of momentum, [M L T^{-1}]. Force is [M L T^{-2}], and work is [M L^2 T^{-2}].

  - id: phy-lom-022
    topic: impulse
    subtopic: Ball hit back by a bat
    concept: Reversal of velocity doubles the momentum change
    category: numerical
    format: direct
    difficulty: 2
    time: 35
    ncert: true
    battle: true
    formula: J = m(v − u)
    tags: [impulse, trap]
    stem: A 0.15 kg ball moving at 20 m s^{-1} is hit straight back along its path with the same speed. What is the magnitude of the impulse on the ball?
    options:
      - zero
      - 3 N s
      - 1.5 N s
      - 6 N s
    answer: 3
    explanation: Taking the final direction as positive, J = m(v − u) = 0.15 × (20 − (−20)) = 6 N s. Zero would be the answer only if we wrongly subtract speeds instead of velocities.

  - id: phy-lom-023
    topic: impulse
    subtopic: Catching a cricket ball
    concept: Increasing the time of impact reduces the force
    category: concept
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    tags: [impulse, ncert-line]
    stem: A fielder pulls his hands backward while catching a fast cricket ball in order to
    options:
      - reduce the change in momentum of the ball
      - increase the force on the hands
      - increase the time of impact and so reduce the force
      - reduce the impulse given to the ball
    answer: 2
    explanation: The ball must be brought to rest, so its change of momentum (and the impulse) is fixed. Moving the hands back increases the stopping time, and since F = Δp/Δt, the average force on the hands decreases.

  - id: phy-lom-024
    topic: impulse
    subtopic: F–t graph
    concept: Impulse is the area under a force–time graph
    category: numerical
    format: graph
    difficulty: 2
    time: 40
    ncert: false
    battle: false
    formula: J = area under F–t graph
    tags: [graph, impulse]
    stem: The force on a ball during a collision rises linearly from 0 to 100 N in 0.01 s and then falls linearly back to 0 in the next 0.01 s. What impulse does the ball receive?
    options:
      - 1 N s
      - 2 N s
      - 0.5 N s
      - 4 N s
    answer: 0
    explanation: The F–t graph is a triangle of base 0.02 s and height 100 N. Area = ½ × 0.02 × 100 = 1 N s. Using base × height without the ½ gives 2 N s.

  - id: phy-lom-025
    topic: impulse
    subtopic: Rebound from floor
    concept: Impulse on a ball that falls and rebounds to a lower height
    category: numerical
    format: direct
    difficulty: 4
    time: 75
    ncert: false
    battle: false
    formula: v = √(2gh)
    tags: [impulse, multi-concept]
    stem: A 0.2 kg ball is dropped from a height of 5 m onto a floor and rebounds to a height of 1.25 m. What impulse does the floor give the ball? (g = 10 m s^{-2})
    options:
      - 1 N s
      - 2 N s
      - 3 N s
      - 5 N s
    answer: 2
    explanation: Speed on striking = √(2 × 10 × 5) = 10 m s^{-1} downward; speed on leaving = √(2 × 10 × 1.25) = 5 m s^{-1} upward. Impulse = 0.2 × (5 − (−10)) = 3 N s upward. Subtracting speeds gives the wrong value 1 N s.

  - id: phy-lom-026
    topic: impulse
    subtopic: Oblique impact on a wall
    concept: Only the normal component of momentum reverses
    category: numerical
    format: direct
    difficulty: 3
    time: 70
    ncert: false
    battle: false
    formula: J = 2mv cos θ
    tags: [impulse, oblique]
    stem: A 0.5 kg ball strikes a smooth wall with speed 4 m s^{-1} at 60° to the normal and rebounds with the same speed at 60° to the normal. What is the magnitude of the impulse on the ball?
    options:
      - 4 N s
      - 2√3 N s
      - 1 N s
      - 2 N s
    answer: 3
    explanation: The component parallel to the wall is unchanged; the normal component mv cos 60° reverses. J = 2mv cos 60° = 2 × 0.5 × 4 × 0.5 = 2 N s. Using sin 60° gives 2√3 N s, a common slip.

  - id: phy-lom-027
    topic: impulse
    subtopic: Safety design
    concept: Soft landing surfaces increase stopping time
    category: concept
    format: assertion-reason
    difficulty: 2
    time: 40
    ncert: false
    battle: false
    tags: [impulse, application]
    stem: |-
      Assertion (A): A high jumper lands on a thick foam bed rather than on hard ground.
      Reason (R): The foam reduces the change in momentum of the jumper during landing.
    options:
      - Both A and R are true and R is the correct explanation of A
      - Both A and R are true but R is not the correct explanation of A
      - A is true but R is false
      - A is false but R is true
    answer: 2
    explanation: The jumper must come to rest either way, so the change in momentum is the same; R is false. The foam increases the stopping time, which reduces the average force F = Δp/Δt, and that is why A is sensible.

  - id: phy-lom-028
    topic: impulse
    subtopic: Average force
    concept: Average stopping force from Δp/Δt
    category: numerical
    format: direct
    difficulty: 2
    time: 30
    ncert: false
    battle: true
    formula: F = Δp/Δt
    tags: [impulse, average-force]
    stem: A 0.5 kg ball moving at 10 m s^{-1} is stopped by a wall in 0.05 s. What is the average force exerted by the wall?
    options:
      - 100 N
      - 250 N
      - 25 N
      - 50 N
    answer: 0
    explanation: F = Δp/Δt = (0.5 × 10)/0.05 = 5/0.05 = 100 N. Dividing 5 by 0.05 incorrectly as 5 × 0.05 or as 50 is the usual arithmetic trap.

  - id: phy-lom-029
    topic: third-law
    subtopic: Action and reaction
    concept: Action and reaction act on different bodies
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [third-law, ncert-line]
    stem: Action and reaction forces of Newton's third law
    options:
      - act on the same body and cancel each other
      - act on different bodies and never cancel each other
      - act on the same body but at different instants
      - are unequal when the bodies have unequal masses
    answer: 1
    explanation: The pair forces act on two different bodies, so they cannot cancel each other. They are equal in magnitude, opposite in direction and simultaneous, whatever the masses.

  - id: phy-lom-030
    topic: third-law
    subtopic: Horse and cart
    concept: The cart moves because the net force on it is non-zero, not because the pair is unbalanced
    category: concept
    format: statements
    difficulty: 3
    time: 60
    ncert: true
    battle: false
    tags: [third-law, trap]
    stem: A horse pulls a cart and both accelerate forward on a road. Which statement is correct?
    options:
      - The horse pulls the cart harder than the cart pulls the horse
      - The cart pulls the horse with a force equal in magnitude to the horse's pull on the cart
      - The action–reaction pair cancels, so motion is impossible
      - The horse accelerates because the cart's pull on it is forward
    answer: 1
    explanation: By the third law the two forces are always equal and opposite. They act on different bodies, so they do not cancel. The system accelerates because the ground pushes the horse forward (friction) more than it resists the cart.

  - id: phy-lom-031
    topic: third-law
    subtopic: Identifying reaction pairs
    concept: Reaction of the weight of a book is the book's pull on the Earth
    category: concept
    format: direct
    difficulty: 3
    time: 45
    ncert: true
    battle: true
    tags: [third-law, trap]
    stem: A book rests on a table. The reaction force to the Earth's gravitational pull on the book is
    options:
      - the normal force of the table on the book
      - the force of the book on the table
      - the book's gravitational pull on the Earth
      - the weight of the table
    answer: 2
    explanation: A third-law pair involves the same two bodies and the same type of force. Earth pulls the book gravitationally, so the reaction is the book's gravitational pull on the Earth. The normal force balances the weight but is not its reaction pair.

  - id: phy-lom-032
    topic: third-law
    subtopic: Walking
    concept: The ground pushes us forward when we push it backward
    category: concept
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    tags: [third-law, friction]
    stem: When a person walks forward on the ground, the external force that moves the person forward is
    options:
      - the force of the person's feet on the ground
      - the person's weight
      - the forward frictional force of the ground on the feet
      - the normal force of the ground
    answer: 2
    explanation: The foot pushes the ground backward; by the third law the ground pushes the foot forward through friction. That forward push on the person is what accelerates the person. The person's push acts on the ground, not on the person.

  - id: phy-lom-033
    topic: third-law
    subtopic: Rocket propulsion
    concept: Rocket moves by ejecting gases backward
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [third-law, rocket]
    stem: A rocket can accelerate in outer space where there is no air because
    options:
      - the exhaust gases push against the surrounding air
      - it pushes gases backward and the gases push it forward
      - gravity is absent in space
      - its mass remains constant
    answer: 1
    explanation: The rocket exerts a backward force on the exhaust gases, and they exert an equal forward force on the rocket (third law; equivalently momentum conservation). No air is needed to push against.

