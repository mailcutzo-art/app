      II. The centre of mass of boy + boat stays at the same place.
      III. When he stops, the boat also stops.
      IV. After he stops, the boat keeps drifting backward.
    options:
      - I, II and III only
      - I and IV only
      - II and IV only
      - I, II and IV only
    answer: 0
    explanation: Total momentum stays zero, so the boat moves back while the boy moves forward (I), and the centre of mass stays fixed (II). When the boy's velocity becomes zero, the boat's must also be zero (III), so IV is false.

