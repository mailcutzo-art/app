    battle: false
    tags: [friction, trap]
    stem: |-
      Consider these statements about friction.
      I. Kinetic friction is proportional to the normal force.
      II. The coefficient of friction can be greater than 1 for some surfaces.
      III. Friction always opposes the motion of a body relative to the ground.
      IV. The static friction on a body at rest can be zero.
      Which are correct?
    options:
      - I and III only
      - II and III only
      - I, III and IV only
      - I, II and IV only
    answer: 3
    explanation: I is the basic law of kinetic friction. II is true (e.g. rubber on dry rough surfaces). IV is true when no force tends to move the body. III is false; friction opposes relative motion between surfaces and can act along the motion, as for a box on an accelerating truck.

