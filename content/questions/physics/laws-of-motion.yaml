      - A ball thrown upward returns to the ground
      - A puck struck on smooth ice slides a long way at nearly constant velocity
    answer: 3
    explanation: On smooth ice friction is very small, and the puck keeps nearly the same velocity with no push, just as the first law predicts. The cart stopping is the everyday observation that misled Aristotle; it is due to friction.

  - id: phy-lom-403
    topic: inertia-first-law
