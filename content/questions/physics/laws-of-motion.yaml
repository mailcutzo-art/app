    options:
      - 4 N
      - 10 N
      - 5 N
      - 6 N
    answer: 3
    explanation: Common acceleration a = 10/5 = 2 m s^{-2}. The contact force alone accelerates the 3 kg block, so N = 3 × 2 = 6 N. The value 4 N would apply if the push acted on the 3 kg block instead.

  - id: phy-lom-070
