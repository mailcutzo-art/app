      - Both, because they have equal volumes
      - Neither, because bodies at rest have no inertia
    answer: 0
    explanation: Inertia depends only on mass, not on size or elasticity. The stone is heavier, so it has greater inertia. Bodies at rest also have inertia (inertia of rest).

  - id: phy-lom-103
    topic: inertia-first-law
    subtopic: Why moving bodies stop
    concept: Bodies stop in daily life because of external opposing forces
    category: concept
    format: statements
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [galileo, aristotle, friction]
    stem: A ball rolled on the floor slows down and stops. Which statement correctly explains this?
    options:
      - Every moving body naturally comes to rest when the push is removed
      - The ball's inertia is used up as it moves
      - Its velocity decreases because no force acts on it after release
      - External forces like friction and air resistance act opposite to its motion
    answer: 3
    explanation: The state of uniform motion changes only if a net external force acts. Friction from the floor and air resistance provide that force. The idea that motion needs a continuous push is Aristotle's fallacy, and inertia is not used up.

