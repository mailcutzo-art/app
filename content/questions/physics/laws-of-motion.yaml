  - id: phy-lom-079
    topic: friction
    subtopic: Static friction
    concept: Static friction adjusts itself up to a limiting value
    category: concept
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    tags: [static-friction, ncert-line]
    stem: The force of static friction on a body at rest on a horizontal surface
    options:
      - is always equal to μ_sN
      - adjusts to balance the applied force, up to a maximum of μ_sN
      - is always zero
      - is greater than the applied force
    answer: 1
    explanation: Static friction is self-adjusting; it equals the applied horizontal force until that force exceeds the limiting value μ_sN. μ_sN is the maximum, not the value at every instant.

  - id: phy-lom-080
    topic: friction
    subtopic: Kinetic vs static
    concept: Coefficient of kinetic friction is less than that of static friction
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [kinetic-friction]
    stem: For a given pair of surfaces, how do the coefficients of static (μ_s) and kinetic (μ_k) friction usually compare?
    options:
      - μ_k > μ_s
      - μ_k = μ_s always
      - μ_k < μ_s
      - μ_k = 2μ_s
    answer: 2
    explanation: Kinetic friction is generally smaller than limiting static friction, so μ_k < μ_s. That is why it is harder to start an object moving than to keep it moving.

  - id: phy-lom-081
    topic: friction
    subtopic: Friction below the limit
    concept: Friction equals applied force when the block does not move
    category: numerical
    format: direct
    difficulty: 2
    time: 35
    ncert: true
    battle: true
    tags: [static-friction, trap]
    stem: A 10 kg box on a floor (μ_s = 0.4) is pushed horizontally with 20 N and does not move. What is the friction force on it? (g = 10 m s^{-2})
    options:
      - 40 N
      - 20 N
      - 4 N
      - 0 N
    answer: 1
    explanation: Limiting friction is μ_s mg = 40 N. Since 20 N is less than this, the box stays at rest and friction just balances the push, 20 N. Writing 40 N confuses the limit with the actual friction.

