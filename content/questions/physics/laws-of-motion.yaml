    answer: 0
    explanation: a = (3 − 2) × 10/(3 + 2) = 2 m s^{-2}. For the 2 kg mass, T − 20 = 2 × 2, so T = 24 N (check with 3 kg; 30 − T = 6). 25 N is the average of the weights and is wrong.

