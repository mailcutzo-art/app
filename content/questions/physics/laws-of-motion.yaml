  - id: phy-lom-090
    topic: friction
    subtopic: Friction as a helper
    concept: Friction is necessary for walking and driving
    category: concept
    format: assertion-reason
    difficulty: 2
    time: 40
    ncert: true
    battle: false
    tags: [friction, ncert-line]
    stem: |-
      Assertion (A): A car cannot accelerate on a perfectly frictionless road.
      Reason (R): Friction always opposes motion, so it can never help motion.
    options:
      - Both A and R are true and R is the correct explanation of A
      - Both A and R are true but R is not the correct explanation of A
      - A is true but R is false
      - A is false but R is true
    answer: 2
    explanation: The road's friction on the tyres is the external forward force that accelerates a car, so without it the car cannot accelerate (A true). Friction opposes relative motion between surfaces, not motion itself; here it drives the car, so R is false.

