    answer: 2
    explanation: a = m_2g/(m_1 + m_2) = 10/5 = 2 m s^{-2}. The tension alone accelerates the 4 kg block, T = 4 × 2 = 8 N. It is less than the hanging weight (10 N) because the hanging block accelerates downward.

  - id: phy-lom-072
    topic: connected-bodies
