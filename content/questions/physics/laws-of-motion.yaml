    stem: A uniform rope of length L lies on a smooth horizontal floor and is pulled at one end by a horizontal force F. What is the tension at a distance x from the pulled end?
    options:
      - F
      - Fx/L
      - F(1 − x/L)
      - F/2
    answer: 2
    explanation: The whole rope accelerates with a = F/M. The part beyond the point, of mass M(L − x)/L, is accelerated by the tension there, so T = M(L − x)/L × F/M = F(1 − x/L). It equals F at the pulled end and zero at the free end.

  - id: phy-lom-073
