    formula: μ_s g = ω^2 r
    tags: [friction, turntable]
    stem: A coin placed 0.2 m from the centre of a horizontal turntable just begins to slip. If μ_s = 0.4, what is the angular speed of the turntable? (g = 10 m s^{-2})
    options:
      - 2 rad s^{-1}
      - 2√5 rad s^{-1}
      - 20 rad s^{-1}
      - √2 rad s^{-1}
    answer: 1
    explanation: At the limit, μ_s mg = mω^2r, so ω^2 = 0.4 × 10/0.2 = 20 and ω = 2√5 ≈ 4.5 rad s^{-1}. 20 is ω^2.

  - id: phy-lom-198
    topic: circular-motion
    subtopic: Centrifugal force
    concept: Centrifugal force is a pseudo force in a rotating frame
    category: concept
    format: statement-pair
    difficulty: 3
    time: 45
    ncert: false
    battle: false
    tags: [pseudo-force, trap]
    stem: |-
      Statement I: In an inertial frame, the net force on a body in uniform circular motion is directed towards the centre.
      Statement II: In an inertial frame, an outward centrifugal force acts on the body and balances the centripetal force.
    options:
      - Both Statement I and Statement II are correct
      - Both Statement I and Statement II are incorrect
      - Statement I is correct but Statement II is incorrect
      - Statement I is incorrect but Statement II is correct
    answer: 2
    explanation: In an inertial frame, the net force is centripetal and unbalanced, which is why the body accelerates towards the centre (I correct). The centrifugal force appears only as a pseudo force in the rotating frame; if it balanced the centripetal force, there would be no circular motion (II incorrect).

  - id: phy-lom-199
    topic: circular-motion
    subtopic: Rotor ride
    concept: Friction from the wall must balance weight in a rotating drum
    category: numerical
    format: case
    difficulty: 4
    time: 90
    ncert: false
    battle: false
    formula: μmω^2r ≥ mg
    tags: [friction, rotor, multi-concept]
    stem: In a rotor ride, a person stands against the inner wall of a vertical drum of radius 2 m, and the floor is removed once the drum rotates fast enough. If μ_s = 0.5, what is the minimum angular speed needed? (g = 10 m s^{-2})
    options:
      - 1 rad s^{-1}
      - 10 rad s^{-1}
      - 2.2 rad s^{-1}
      - 3.2 rad s^{-1}
    answer: 3
    explanation: The wall's normal force provides the centripetal force N = mω^2r, and friction μN must balance mg. So ω^2 = g/(μr) = 10/(0.5 × 2) = 10 and ω ≈ 3.2 rad s^{-1}. 10 is ω^2.

