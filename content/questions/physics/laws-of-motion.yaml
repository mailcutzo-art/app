    stem: |-
      Which statements about the gravitational interaction of the Earth and the Moon are correct?
      I. The Earth pulls the Moon with the same magnitude of force as the Moon pulls the Earth.
      II. The Earth's acceleration due to the Moon is smaller than the Moon's due to the Earth.
      III. The two forces cancel, so the Earth–Moon system has no internal effect.
      IV. Both bodies orbit their common centre of mass.
    options:
      - I and II only
      - I, II and IV only
      - I and III only
      - II, III and IV only
    answer: 1
    explanation: The forces are equal and opposite (I), and the more massive Earth accelerates less (II). They act on different bodies, so each changes that body's motion (III false); both revolve round their common centre of mass (IV).

