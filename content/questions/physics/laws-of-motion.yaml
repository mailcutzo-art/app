    format: match
    difficulty: 3
    time: 60
    ncert: false
    battle: false
    tags: [lift, apparent-weight]
    stem: |-
      A person of true weight W is in a lift. Match the motion of the lift (List I) with the apparent weight (List II).
      List I
      P. Moving up with constant speed
      Q. Accelerating upward at g/2
      R. Accelerating downward at g/2
      S. Falling freely
      List II
      1. Zero
      2. W/2
      3. W
      4. 3W/2
    options:
      - P-3, Q-2, R-4, S-1
      - P-3, Q-4, R-2, S-1
      - P-1, Q-4, R-2, S-3
      - P-3, Q-4, R-1, S-2
    answer: 1
    explanation: Apparent weight = m(g + a) with a positive upward. Constant speed gives W; upward g/2 gives 3W/2; downward g/2 gives W/2; free fall gives zero. So P-3, Q-4, R-2, S-1.

  - id: phy-lom-068
