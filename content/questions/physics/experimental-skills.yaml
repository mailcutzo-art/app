questions:
  - id: phy-exp-001
    topic: vernier-callipers
    subtopic: "Least count"
    concept: "LC = 1 MSD − 1 VSD for 10 VSD = 9 MSD"
    category: numerical
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    formula: "LC = 1 MSD − 1 VSD"
    tags: [least-count]
    stem: "In a Vernier callipers, 10 divisions of the Vernier scale coincide with 9 divisions of the main scale, and 1 main scale division is 1 mm. What is the least count?"
    options:
      - "0.01 mm"
      - "0.05 mm"
      - "0.9 mm"
      - "0.1 mm"
    answer: 3
    explanation: "1 VSD = 9/10 MSD = 0.9 mm, so LC = 1 MSD − 1 VSD = 1 − 0.9 = 0.1 mm. 0.9 mm is the size of one VSD, not the least count."

  - id: phy-exp-002
    topic: vernier-callipers
    subtopic: "Least count"
    concept: "LC for 20 VSD = 19 MSD"
    category: numerical
    format: direct
    difficulty: 2
    time: 55
    ncert: true
    battle: true
    formula: "LC = MSD/N"
    tags: [least-count]
    stem: "A Vernier callipers has 20 Vernier divisions equal to 19 main scale divisions of 1 mm each. Its least count is"
    options:
      - "0.02 mm"
      - "0.5 mm"
      - "0.05 mm"
      - "0.95 mm"
    answer: 2
    explanation: "When N VSD = (N − 1) MSD, LC = 1 MSD/N = 1 mm/20 = 0.05 mm. 0.95 mm is the length of one Vernier division."

  - id: phy-exp-003
    topic: vernier-callipers
    subtopic: "Reading"
    concept: "Total reading = MSR + VSR × LC"
    category: numerical
    format: direct
    difficulty: 2
    time: 55
    ncert: true
    battle: true
    formula: "Reading = MSR + n × LC"
    tags: [reading]
    stem: "A Vernier callipers of least count 0.1 mm shows a main scale reading of 2.3 cm and the 6th Vernier division coincides with a main scale mark. With no zero error, the reading is"
    options:
      - "2.36 cm"
      - "2.306 cm"
      - "2.9 cm"
      - "2.46 cm"
    answer: 0
    explanation: "Vernier reading = 6 × 0.1 mm = 0.6 mm = 0.06 cm, so total = 2.3 + 0.06 = 2.36 cm. Adding 0.6 cm (to get 2.9 cm) is the classic mm–cm slip."

  - id: phy-exp-004
    topic: vernier-callipers
    subtopic: "Zero error"
    concept: "Positive zero error is subtracted"
    category: numerical
    format: direct
    difficulty: 3
    time: 75
    ncert: true
    battle: true
    formula: "True reading = observed − zero error"
    tags: [zero-error, trap]
    stem: "A Vernier callipers (LC 0.01 cm) has a positive zero error of 0.03 cm. The observed diameter of a rod is 1.47 cm. The true diameter is"
    options:
      - "1.50 cm"
      - "1.47 cm"
      - "1.41 cm"
      - "1.44 cm"
    answer: 3
    explanation: "Correct reading = observed reading − zero error = 1.47 − (+0.03) = 1.44 cm. Adding the zero error (1.50 cm) is the common mistake; it is the correction, −(zero error), that is added."

  - id: phy-exp-005
    topic: vernier-callipers
    subtopic: "Zero error"
    concept: "Negative zero error value"
    category: numerical
    format: direct
    difficulty: 3
    time: 75
    ncert: true
    battle: false
    formula: "Negative zero error = −(N − n) × LC"
    tags: [zero-error]
    stem: "A Vernier callipers has 10 Vernier divisions and LC 0.1 mm. With the jaws closed, the Vernier zero lies to the left of the main-scale zero and the 7th Vernier division coincides with a main scale mark. The zero error is"
    options:
      - "+0.7 mm"
      - "+0.3 mm"
      - "−0.7 mm"
      - "−0.3 mm"
    answer: 3
    explanation: "Vernier zero to the left of main zero means a negative zero error. Its magnitude is (N − n) × LC = (10 − 7) × 0.1 = 0.3 mm, so zero error = −0.3 mm. Taking −0.7 mm ignores the fact that the coinciding division is counted from the wrong end."

  - id: phy-exp-006
    topic: vernier-callipers
    subtopic: "Parts of the instrument"
    concept: "Inner jaws measure internal diameter"
    category: factual
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    tags: [ncert-line, parts]
    stem: "Which part of a Vernier callipers is used to measure the internal diameter of a hollow cylinder?"
    options:
      - "The lower (outside) jaws"
      - "The depth strip (tail)"
      - "The upper (inside) jaws"
      - "The ratchet"
    answer: 2
    explanation: "The upper jaws, with outward-facing edges, fit inside the tube and measure the internal diameter. The lower jaws measure external dimensions and the thin strip at the back measures depth. A ratchet belongs to the screw gauge."

  - id: phy-exp-007
    topic: vernier-callipers
    subtopic: "Depth of a vessel"
    concept: "Depth measured with the sliding strip"
    category: concept
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    tags: [depth]
    stem: "To find the depth of a beaker with a Vernier callipers, the edge of the main scale rests on the rim and the instrument is opened until"
    options:
      - "the upper jaws touch the inside wall"
      - "the Vernier zero coincides with the main-scale zero"
      - "the lower jaws grip the outside wall"
      - "the depth strip just touches the bottom of the beaker"
    answer: 3
    explanation: "The thin strip attached to the Vernier slides out from the end of the main scale. The reading when it just touches the bottom, with the main scale resting on the rim, gives the depth."

  - id: phy-exp-008
    topic: vernier-callipers
    subtopic: "Precision"
    concept: "More Vernier divisions give a smaller least count"
    category: application
    format: statement-pair
    difficulty: 3
    time: 60
    ncert: false
    battle: false
    tags: [least-count, multi-concept]
    stem: |-
      Statement I: For the same main-scale division, a Vernier with 50 divisions equal to 49 MSD has a smaller least count than one with 10 divisions equal to 9 MSD.
      Statement II: A Vernier callipers with a smaller least count always gives a more accurate reading, whatever its zero error.
    options:
      - "Both Statement I and Statement II are correct"
      - "Both Statement I and Statement II are incorrect"
      - "Statement I is correct but Statement II is incorrect"
      - "Statement I is incorrect but Statement II is correct"
    answer: 2
    explanation: "LC = MSD/N, so N = 50 gives a least count five times smaller than N = 10: Statement I is correct. A smaller least count improves precision (resolution), but a zero error left uncorrected makes the reading inaccurate, so Statement II is incorrect."

  - id: phy-exp-009
    topic: vernier-callipers
    subtopic: "Internal diameter"
    concept: "Wall thickness from external and internal diameters"
    category: numerical
    format: direct
    difficulty: 3
    time: 75
    ncert: true
    battle: false
    formula: "t = (D − d)/2"
    tags: [internal-diameter, multi-concept]
    stem: "Using a Vernier callipers, the external diameter of a hollow tube is 2.54 cm and its internal diameter is 2.12 cm. The thickness of the wall of the tube is"
    options:
      - "0.21 cm"
      - "0.42 cm"
      - "2.33 cm"
      - "0.84 cm"
    answer: 0
    explanation: "The wall appears on both sides of the bore, so D = d + 2t and t = (2.54 − 2.12)/2 = 0.42/2 = 0.21 cm. Reporting the full difference 0.42 cm forgets the factor of 2."

  - id: phy-exp-010
    topic: screw-gauge
    subtopic: "Least count"
    concept: "LC = pitch/number of circular divisions"
    category: numerical
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    formula: "LC = pitch/N"
    tags: [least-count]
    stem: "A screw gauge has a pitch of 0.5 mm and 50 divisions on its circular scale. Its least count is"
    options:
      - "0.1 mm"
      - "0.05 mm"
      - "0.001 mm"
      - "0.01 mm"
    answer: 3
    explanation: "LC = pitch/number of circular scale divisions = 0.5 mm/50 = 0.01 mm."

  - id: phy-exp-011
    topic: screw-gauge
    subtopic: "Pitch"
    concept: "Pitch is the distance moved per full rotation"
    category: factual
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    tags: [pitch, ncert-line]
    stem: "The pitch of a screw gauge is"
    options:
      - "the distance moved by the spindle for one division of the circular scale"
      - "the smallest length the main scale can read"
      - "the number of divisions on the circular scale"
      - "the linear distance moved by the spindle in one complete rotation of the circular scale"
    answer: 3
    explanation: "Pitch is the linear distance advanced by the screw in one full rotation. The distance for one circular division is the least count, pitch/N."

  - id: phy-exp-012
    topic: screw-gauge
    subtopic: "Reading"
    concept: "Reading = LSR + CSR × LC"
    category: numerical
    format: direct
    difficulty: 2
    time: 55
    ncert: true
    battle: true
    formula: "Reading = LSR + n × LC"
    tags: [reading]
    stem: "A screw gauge of least count 0.01 mm shows a linear scale reading of 2 mm and a circular scale reading of 36 divisions for a wire. With no zero error, the diameter is"
    options:
      - "2.036 mm"
      - "2.0036 mm"
      - "5.6 mm"
      - "2.36 mm"
    answer: 3
    explanation: "Diameter = LSR + CSR × LC = 2 + 36 × 0.01 = 2 + 0.36 = 2.36 mm."

  - id: phy-exp-013
    topic: screw-gauge
    subtopic: "Zero error"
    concept: "Correcting a negative zero error"
    category: numerical
    format: direct
    difficulty: 3
    time: 75
    ncert: true
    battle: true
    formula: "True = observed − zero error"
    tags: [zero-error, trap]
    stem: "A screw gauge has a zero error of −0.04 mm. The observed thickness of a sheet is 1.26 mm. Its true thickness is"
    options:
      - "1.22 mm"
      - "1.26 mm"
      - "1.30 mm"
      - "1.34 mm"
    answer: 2
    explanation: "True reading = observed − zero error = 1.26 − (−0.04) = 1.30 mm. A negative zero error makes the instrument read too little, so the correction is added."

  - id: phy-exp-014
    topic: screw-gauge
    subtopic: "Ratchet"
    concept: "Ratchet prevents excess pressure on the object"
    category: factual
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    tags: [ratchet, ncert-line]
    stem: "While measuring the diameter of a wire with a screw gauge, the screw is turned using the ratchet because it"
    options:
      - "removes the backlash error completely"
      - "makes the least count smaller"
      - "prevents the spindle from pressing the wire too hard"
      - "corrects the zero error automatically"
    answer: 2
    explanation: "The ratchet slips once the spindle grips the wire with a fixed light pressure, so the wire is not squeezed and the reading is consistent. It does not change the least count, and backlash is reduced by always turning in one direction."

  - id: phy-exp-015
    topic: screw-gauge
    subtopic: "Backlash error"
    concept: "Backlash from wear of screw threads"
    category: concept
    format: direct
    difficulty: 2
    time: 40
    ncert: true
    battle: true
    tags: [backlash-error]
    stem: "Backlash error in a screw gauge arises because"
    options:
      - "the circular scale has too few divisions"
      - "the object is compressed by the spindle"
      - "the zero of the circular scale does not match the reference line"
      - "worn threads let the screw rotate slightly without moving the spindle when the direction of rotation is reversed"
    answer: 3
    explanation: "Due to wear, there is play between the screw and the nut, so on reversing the direction of rotation the screw turns a little before the spindle moves. It is minimised by always turning the screw in the same direction."

  - id: phy-exp-016
    topic: screw-gauge
    subtopic: "Wire diameter procedure"
    concept: "Diameter measured at several places in perpendicular directions"
    category: concept
    format: statements
    difficulty: 3
    time: 60
    ncert: true
    battle: false
    tags: [procedure, errors]
    stem: "Which step in measuring the diameter of a wire with a screw gauge is NOT correct practice?"
    options:
      - "Take readings at several places along the wire"
      - "At each place take two readings in mutually perpendicular directions"
      - "Tighten the thimble firmly by hand until the wire cannot move"
      - "Find and apply the zero error before reporting the mean"
    answer: 2
    explanation: "The screw should be advanced with the ratchet only until it clicks, not tightened by hand, which squeezes the wire and strains the screw. Readings along the wire and in perpendicular directions average out non-uniformity and ovality."

  - id: phy-exp-017
    topic: screw-gauge
    subtopic: "Zero error sign"
    concept: "Positive zero error with jaws closed"
    category: numerical
    format: direct
    difficulty: 3
    time: 75
    ncert: true
    battle: false
    formula: "Zero error = n × LC"
    tags: [zero-error]
    stem: "When the studs of a screw gauge (LC 0.01 mm) are brought in contact, the zero of the circular scale has moved 4 divisions past the reference line, so the gauge reads +4 divisions with nothing between the studs. A wire then gives LSR 1 mm and CSR 52. The corrected diameter is"
    options:
      - "1.48 mm"
      - "1.52 mm"
      - "1.56 mm"
      - "1.44 mm"
    answer: 0
    explanation: "The zero error is +4 × 0.01 = +0.04 mm. Observed = 1 + 52 × 0.01 = 1.52 mm, so the corrected diameter = 1.52 − 0.04 = 1.48 mm."

  - id: phy-exp-018
    topic: screw-gauge
    subtopic: "Sheet thickness"
    concept: "Screw gauge vs Vernier for thin sheet"
    category: application
    format: direct
    difficulty: 2
    time: 40
    ncert: true
    battle: true
    tags: [instrument-choice]
    stem: "The thickness of a sheet of paper-thin metal foil, about 0.2 mm, is best measured with"
    options:
      - "a metre scale"
      - "a Vernier callipers of LC 0.1 mm"
      - "a screw gauge of LC 0.01 mm"
      - "a travelling microscope focused on the top face"
    answer: 2
    explanation: "For a length of about 0.2 mm, a 0.1 mm least count gives only 2 counts (50% uncertainty). A screw gauge with LC 0.01 mm gives about 20 counts, so it is the right instrument for thin sheets and wires."

  - id: phy-exp-019
    topic: simple-pendulum
    subtopic: "Damping"
    concept: "Amplitude decreases exponentially with time"
    category: concept
    format: graph
    difficulty: 2
    time: 40
    ncert: true
    battle: true
    formula: "A = A_0 e^{−bt/2m}"
    tags: [damping, graph]
    stem: "In the experiment on dissipation of energy of a simple pendulum, the graph of amplitude against time is"
    options:
      - "a straight line with negative slope"
      - "a parabola opening upward"
      - "a horizontal straight line"
      - "a decaying exponential curve"
    answer: 3
    explanation: "Air resistance produces damping, and the amplitude falls as A = A_0 e^{−bt/2m}: it drops quickly at first and then more slowly. A straight line would imply a constant loss of amplitude per second, which is not observed."

  - id: phy-exp-020
    topic: simple-pendulum
    subtopic: "Damping"
    concept: "ln A vs t is linear"
    category: concept
    format: graph
    difficulty: 3
    time: 60
    ncert: false
    battle: true
    formula: "ln A = ln A_0 − (b/2m)t"
    tags: [damping, graph]
    stem: "If ln(amplitude) of a damped simple pendulum is plotted against time, the graph is"
    options:
      - "a straight line with a negative slope"
      - "a straight line with a positive slope"
      - "a rectangular hyperbola"
      - "a decaying exponential curve"
    answer: 0
    explanation: "From A = A_0 e^{−bt/2m}, ln A = ln A_0 − (b/2m)t, which is a straight line of slope −b/2m. Its slope measures how quickly energy is dissipated."

  - id: phy-exp-021
    topic: simple-pendulum
    subtopic: "Energy loss"
    concept: "Energy is proportional to amplitude squared"
    category: numerical
    format: direct
    difficulty: 3
    time: 75
    ncert: false
    battle: true
    formula: "E ∝ A^2"
    tags: [energy, multi-concept]
    stem: "The amplitude of a simple pendulum falls from 10 cm to 5 cm in 2 minutes. By what fraction has its energy of oscillation decreased?"
    options:
      - "1/2"
      - "1/4"
      - "3/4"
      - "7/8"
    answer: 2
    explanation: "Energy of oscillation ∝ A^2, so the energy becomes (5/10)^2 = 1/4 of its initial value. The loss is 1 − 1/4 = 3/4 of the initial energy. Choosing 1/2 treats energy as proportional to amplitude."

  - id: phy-exp-022
    topic: simple-pendulum
    subtopic: "Bob material"
    concept: "Light, large bob is damped faster"
    category: application
    format: case
    difficulty: 3
    time: 60
    ncert: true
    battle: false
    tags: [damping, bob]
    stem: "Two pendulums of equal length and equal initial amplitude have bobs of the same size, one of solid iron and one of wood. Amplitude is plotted against time for each. Which observation is expected?"
    options:
      - "Both amplitudes decay at the same rate since the air drag is the same"
      - "The iron bob's amplitude decays faster because it is heavier"
      - "The wooden bob's amplitude decays faster"
      - "The wooden bob's time period increases steadily while the iron bob's stays constant"
    answer: 2
    explanation: "The drag force is about the same for equal-sized bobs, but the wooden bob has much less mass (and energy), so the damping constant b/2m is larger and its amplitude decays faster. The time period of both remains practically constant."

  - id: phy-exp-023
    topic: simple-pendulum
    subtopic: "Effective length"
    concept: "Effective length includes radius of the bob"
    category: concept
    format: direct
    difficulty: 2
    time: 40
    ncert: true
    battle: true
    formula: "L = l + r"
    tags: [effective-length, ncert-line]
    stem: "The effective length of a simple pendulum in the laboratory is measured from the point of suspension to"
    options:
      - "the hook of the bob"
      - "the lowest point of the bob"
      - "the top of the bob"
      - "the centre of gravity of the bob"
    answer: 3
    explanation: "Effective length = length of thread + length of hook + radius of the bob, i.e. up to the centre of gravity of the spherical bob, which is where the mass may be treated as concentrated."

  - id: phy-exp-024
    topic: simple-pendulum
    subtopic: "L–T^2 graph"
    concept: "Graph of L against T^2 is a straight line"
    category: concept
    format: graph
    difficulty: 2
    time: 40
    ncert: true
    battle: true
    formula: "T^2 = 4π^2 L/g"
    tags: [graph]
    stem: "For a simple pendulum, which graph obtained from the observations is a straight line passing through the origin?"
    options:
      - "T against L"
      - "T^2 against 1/L"
      - "T against 1/L"
      - "T^2 against L"
    answer: 3
    explanation: "T = 2π√(L/g) gives T^2 = (4π^2/g)L, so T^2 ∝ L. The T–L graph is a parabola and the others are curves."

  - id: phy-exp-025
    topic: simple-pendulum
    subtopic: "Small amplitude"
    concept: "Amplitude kept small for SHM"
    category: concept
    format: assertion-reason
    difficulty: 3
    time: 60
    ncert: true
    battle: false
    tags: [small-angle]
    stem: |-
      Assertion (A): In the simple pendulum experiment, the bob is displaced through a small angle only.
      Reason (R): The time period of a simple pendulum is independent of amplitude only for small angular displacements.
    options:
      - "Both A and R are true and R is the correct explanation of A"
      - "Both A and R are true but R is not the correct explanation of A"
      - "A is true but R is false"
      - "A is false but R is true"
    answer: 0
    explanation: "T = 2π√(L/g) is derived with sin θ ≈ θ, valid only for small angles; at large amplitude the period increases. That is exactly why the bob is given a small displacement, so R explains A."

  - id: phy-exp-026
    topic: simple-pendulum
    subtopic: "Counting oscillations"
    concept: "Timing many oscillations reduces error"
    category: numerical
    format: direct
    difficulty: 2
    time: 55
    ncert: true
    battle: true
    formula: "T = t/n"
    tags: [errors]
    stem: "A stopwatch has a least count of 0.1 s. The time for 20 oscillations of a pendulum is 32.0 s. What are the time period and its maximum uncertainty?"
    options:
      - "1.6 s ± 0.1 s"
      - "1.6 s ± 0.05 s"
      - "32.0 s ± 0.1 s"
      - "1.6 s ± 0.005 s"
    answer: 3
    explanation: "T = 32.0/20 = 1.6 s, and the uncertainty of 0.1 s in the total time is shared over 20 oscillations: ΔT = 0.1/20 = 0.005 s. This is why many oscillations are timed together."

  - id: phy-exp-027
    topic: metre-scale-moments
    subtopic: "Principle of moments"
    concept: "m d_1 = M d_2"
    category: numerical
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    formula: "m_1 d_1 = m_2 d_2"
    tags: [moments]
    stem: "A uniform metre scale is balanced at its 50 cm mark on a knife edge. An unknown mass hung at the 20 cm mark is balanced by a 60 g mass hung at the 90 cm mark. The unknown mass is"
    options:
      - "80 g"
      - "45 g"
      - "60 g"
      - "120 g"
    answer: 0
    explanation: "Distances from the fulcrum: 50 − 20 = 30 cm and 90 − 50 = 40 cm. m × 30 = 60 × 40, so m = 80 g."

  - id: phy-exp-028
    topic: metre-scale-moments
    subtopic: "Centre of gravity"
    concept: "First step is to find the balance point of the scale"
    category: factual
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    tags: [procedure, ncert-line]
    stem: "In finding the mass of an object using a metre scale and the principle of moments, the first step is to"
    options:
      - "hang the known mass at the 0 cm end"
      - "hang the unknown mass at the 100 cm end"
      - "measure the length of the scale with a Vernier callipers"
      - "balance the scale alone on the knife edge to locate its centre of gravity"
    answer: 3
    explanation: "The scale alone is balanced on the knife edge; the balance point is its centre of gravity. The scale is then kept on that point so that its own weight has zero moment about the fulcrum."

  - id: phy-exp-029
    topic: metre-scale-moments
    subtopic: "Scale's own weight"
    concept: "Weight of the scale contributes a moment when not supported at its CG"
    category: numerical
    format: direct
    difficulty: 4
    time: 115
    ncert: false
    battle: false
    formula: "Σ clockwise moments = Σ anticlockwise moments"
    tags: [moments, multi-concept]
    stem: "A uniform metre scale of mass 100 g is supported on a knife edge at the 40 cm mark. It balances when a mass m is hung at the 10 cm mark. The value of m is"
    options:
      - "50 g"
      - "25 g"
      - "100 g"
      - "33.3 g"
    answer: 3
    explanation: "The scale's weight acts at its centre, 50 cm, i.e. 10 cm from the fulcrum. Balancing moments: m × (40 − 10) = 100 × (50 − 40), so m × 30 = 1000 and m = 33.3 g."

  - id: phy-exp-030
    topic: metre-scale-moments
    subtopic: "Condition of equilibrium"
    concept: "Rotational equilibrium needs zero net torque"
    category: concept
    format: assertion-reason
    difficulty: 2
    time: 40
    ncert: true
    battle: false
    tags: [moments]
    stem: |-
      Assertion (A): A metre scale carrying two masses balances horizontally on a knife edge when the moments of the masses about the edge are equal and opposite.
      Reason (R): For rotational equilibrium, the net torque about any point must be zero.
    options:
      - "Both A and R are true and R is the correct explanation of A"
      - "Both A and R are true but R is not the correct explanation of A"
      - "A is true but R is false"
      - "A is false but R is true"
    answer: 0
    explanation: "At balance the clockwise and anticlockwise moments cancel, which is the condition of rotational equilibrium stated in R; so R correctly explains A."

  - id: phy-exp-031
    topic: metre-scale-moments
    subtopic: "Sources of error"
