questions:
  - id: phy-epc-001
    topic: potential-difference
    subtopic: "Unit of potential"
    concept: "Volt equals joule per coulomb"
    category: factual
    format: direct
    difficulty: 1
    time: 30
    ncert: true
    battle: true
    tags: [units, ncert-line]
    stem: "The SI unit of electrostatic potential, the volt, is equivalent to"
    options:
      - "N C^{-1}"
      - "J C^{-1}"
      - "C J^{-1}"
      - "J C"
    answer: 1
    explanation: "Potential is work done per unit charge, V = W/q, so 1 V = 1 J C^{-1}. N C^{-1} is the unit of electric field (equal to V m^{-1}), not of potential."

  - id: phy-epc-002
    topic: potential-difference
    subtopic: "Work and potential difference"
    concept: "External work equals q(V_B − V_A)"
    category: numerical
    format: direct
    difficulty: 2
    time: 40
    ncert: true
    battle: true
    formula: "W = q(V_B − V_A)"
    tags: [work, numerical]
    stem: "How much work must an external agent do to move a 5 μC charge slowly from a point at 10 V to a point at 30 V?"
    options:
      - "5 × 10^{-5} J"
      - "2 × 10^{-4} J"
      - "1 × 10^{-4} J"
      - "1.5 × 10^{-4} J"
    answer: 2
    explanation: "W = q(V_B − V_A) = 5 × 10^{-6} × (30 − 10) = 1 × 10^{-4} J. Using 30 V alone gives 1.5 × 10^{-4} J, which ignores the starting potential."

  - id: phy-epc-003
    topic: potential-difference
    subtopic: "Electron volt"
    concept: "1 eV = 1.6 × 10^{-19} J"
    category: factual
    format: direct
    difficulty: 1
    time: 30
    ncert: true
    battle: true
    formula: "1 eV = 1.6 × 10^{-19} J"
    tags: [electron-volt]
    stem: "One electron volt is equal to"
    options:
      - "1.6 × 10^{-19} J"
      - "1.6 × 10^{19} J"
      - "9.1 × 10^{-31} J"
      - "1.6 × 10^{-16} J"
    answer: 0
    explanation: "1 eV is the energy gained by an electron (charge 1.6 × 10^{-19} C) accelerated through 1 V, so 1 eV = 1.6 × 10^{-19} C × 1 V = 1.6 × 10^{-19} J. 1.6 × 10^{-16} J is 1 keV."

  - id: phy-epc-004
    topic: potential-difference
    subtopic: "Definition of potential"
    concept: "Potential defined via external work without acceleration"
    category: concept
    format: statements
    difficulty: 3
    time: 70
    ncert: true
    battle: false
    tags: [definition, trap, ncert-line]
    stem: "Which statement about the electrostatic potential at a point is correct?"
    options:
      - "It is the work done by the electric field in bringing a unit positive charge from infinity to that point"
      - "It is the work done by an external agent in bringing a unit positive charge from infinity to that point without acceleration"
      - "It is the force on a unit positive charge placed at that point"
      - "It is a vector directed along the electric field at that point"
    answer: 1
    explanation: "Potential at a point is the work done by an external force in bringing a unit positive test charge from infinity to the point without acceleration (so KE does not change). The work done by the field is the negative of this, which is the common trap. Potential is a scalar, and force per unit charge is the electric field."

  - id: phy-epc-005
    topic: potential-difference
    subtopic: "Accelerating an electron"
    concept: "KE gained = eV"
    category: numerical
    format: direct
    difficulty: 2
    time: 40
    ncert: true
    battle: true
    formula: "K = qV"
    tags: [electron-volt, kinetic-energy]
    stem: "An electron starting from rest is accelerated through a potential difference of 100 V. The kinetic energy it gains is"
    options:
      - "1.6 × 10^{-21} J"
      - "100 J"
      - "1.6 × 10^{-19} J"
      - "1.6 × 10^{-17} J"
    answer: 3
    explanation: "K = eV = 1.6 × 10^{-19} × 100 = 1.6 × 10^{-17} J, i.e. 100 eV. The value 1.6 × 10^{-19} J is just 1 eV."

  - id: phy-epc-006
    topic: potential-difference
    subtopic: "Dimensions of potential"
    concept: "Dimensional formula of potential"
    category: factual
    format: direct
    difficulty: 2
    time: 40
    ncert: false
    battle: true
    formula: "[V] = [M L^2 T^{-3} A^{-1}]"
    tags: [dimensions]
    stem: "The dimensional formula of electric potential is"
    options:
      - "[M L^2 T^{-2} A^{-1}]"
      - "[M L^2 T^{-3} A^{-1}]"
      - "[M L T^{-3} A^{-1}]"
      - "[M L^2 T^{-3} A^{-2}]"
    answer: 1
    explanation: "V = W/q = [M L^2 T^{-2}]/[A T] = [M L^2 T^{-3} A^{-1}]. [M L^2 T^{-3} A^{-2}] is resistance and [M L T^{-3} A^{-1}] is electric field."

  - id: phy-epc-007
    topic: potential-difference
    subtopic: "Path independence"
    concept: "Potential difference is path-independent because the field is conservative"
    category: concept
    format: assertion-reason
    difficulty: 3
    time: 70
    ncert: true
    battle: false
    tags: [conservative-force, ncert-line]
    stem: |-
      Assertion (A): The work done by an external agent in moving a charge between two points in an electrostatic field does not depend on the path taken.
      Reason (R): The electrostatic force is a conservative force.
    options:
      - "Both A and R are true and R is the correct explanation of A"
      - "Both A and R are true but R is not the correct explanation of A"
      - "A is true but R is false"
      - "A is false but R is true"
    answer: 0
    explanation: "Because the electrostatic force is conservative, the work between two points depends only on the end points, which is exactly why a unique potential difference can be defined. R is the correct explanation of A."

  - id: phy-epc-008
    topic: potential-difference
    subtopic: "Alpha particle acceleration"
    concept: "KE gained is qV with q = 2e"
    category: numerical
    format: direct
    difficulty: 3
    time: 60
    ncert: false
    battle: true
    formula: "K = qV"
    tags: [electron-volt, trap]
    stem: "An alpha particle is accelerated from rest through a potential difference of 1 kV. Its kinetic energy is"
    options:
      - "1 keV"
      - "0.5 keV"
      - "4 keV"
      - "2 keV"
    answer: 3
    explanation: "K = qV and the alpha particle carries charge 2e, so K = 2e × 1000 V = 2 keV. Answering 1 keV ignores the double charge; mass does not enter the energy gained."

  - id: phy-epc-009
    topic: potential-difference
    subtopic: "Motion of free charges"
    concept: "Electrons move towards higher potential"
    category: concept
    format: direct
    difficulty: 2
    time: 40
    ncert: false
    battle: true
    tags: [electron, trap]
    stem: "An electron is released from rest in an electrostatic field. It will move"
    options:
      - "from higher to lower potential"
      - "along an equipotential surface"
      - "from lower to higher potential"
      - "perpendicular to the field lines"
    answer: 2
    explanation: "The force on a negative charge is opposite to E, and E points from high to low potential, so the electron moves towards higher potential. This lowers its potential energy (U = −eV decreases as V rises). A positive charge would move from high to low potential."

  - id: phy-epc-010
    topic: point-charge-potential
    subtopic: "Point charge potential"
    concept: "V = kq/r"
    category: numerical
    format: direct
    difficulty: 1
    time: 30
    ncert: true
    battle: true
    formula: "V = q/(4πε_0 r)"
    tags: [point-charge]
    stem: "What is the potential at a distance of 9 cm from a point charge of 1 nC? (1/4πε_0 = 9 × 10^9 N m^2 C^{-2})"
    options:
      - "1000 V"
      - "10 V"
      - "100 V"
      - "900 V"
    answer: 2
    explanation: "V = kq/r = 9 × 10^9 × 1 × 10^{-9} / 0.09 = 100 V. Forgetting to convert 9 cm to metres gives 1 V-type errors; using r^2 would give the field instead."

  - id: phy-epc-011
    topic: point-charge-potential
    subtopic: "Charges at corners of a square"
    concept: "Superposition of scalar potentials at the centre"
    category: numerical
    format: direct
    difficulty: 3
    time: 70
    ncert: true
    battle: false
    formula: "V = Σ kq_i/r_i"
    tags: [superposition, square]
    stem: "Four equal charges q are placed at the corners of a square of side a. The potential at the centre of the square is"
    options:
      - "4kq/a"
      - "2√2 kq/a"
      - "zero"
      - "4√2 kq/a"
    answer: 3
    explanation: "Each corner is at a/√2 from the centre, so each contributes kq√2/a. Potentials add as scalars: V = 4√2 kq/a. The field at the centre is zero by symmetry, but the potential is not; \"zero\" is the trap."

  - id: phy-epc-012
    topic: point-charge-potential
    subtopic: "V–r graph"
    concept: "V ∝ 1/r is a rectangular hyperbola"
    category: concept
    format: graph
    difficulty: 2
    time: 40
    ncert: false
    battle: true
    formula: "V ∝ 1/r"
    tags: [graph]
    stem: "For an isolated positive point charge, the graph of potential V against distance r (r > 0) is"
    options:
      - "a straight line through the origin"
      - "a rectangular hyperbola decreasing with r"
      - "a parabola opening upward"
      - "a curve falling as 1/r^2"
    answer: 1
    explanation: "V = kq/r, so V·r is constant: a rectangular hyperbola that falls as r increases. The 1/r^2 fall-off belongs to the electric field, not the potential."

  - id: phy-epc-013
    topic: point-charge-potential
    subtopic: "Pair of equal and opposite charges"
    concept: "At the midpoint of +q and −q, V = 0 but E ≠ 0"
    category: concept
    format: statements
    difficulty: 3
    time: 70
    ncert: true
    battle: false
    tags: [superposition, trap, multi-concept]
    stem: "Charges +q and −q are held a distance d apart. At the midpoint of the line joining them,"
    options:
      - "both potential and electric field are zero"
      - "potential is non-zero but electric field is zero"
      - "potential is zero but electric field is non-zero and points towards −q"
      - "potential is zero but electric field is non-zero and points towards +q"
    answer: 2
    explanation: "The potentials kq/(d/2) and −kq/(d/2) cancel, so V = 0. The fields of both charges point from + towards −, so they add and E points towards −q. Zero potential does not imply zero field."

  - id: phy-epc-014
    topic: point-charge-potential
    subtopic: "Charged ring"
    concept: "Potential at centre of a ring is kQ/R regardless of distribution"
    category: concept
    format: direct
    difficulty: 3
    time: 70
    ncert: true
    battle: false
    formula: "V = kQ/R"
    tags: [ring, superposition]
    stem: "A total charge Q is distributed non-uniformly on a thin ring of radius R. The potential at the centre of the ring is"
    options:
      - "zero, because contributions cancel"
      - "kQ/R only if the charge is uniform, otherwise it cannot be found"
      - "kQ/R^2"
      - "kQ/R"
    answer: 3
    explanation: "Every element dq is at the same distance R from the centre, and potential is a scalar, so V = Σ k dq/R = kQ/R whatever the distribution. The field at the centre, a vector, would depend on the distribution and is zero only for uniform charge."

  - id: phy-epc-015
    topic: point-charge-potential
    subtopic: "Zero potential point"
    concept: "Locating V = 0 between unlike charges"
    category: numerical
    format: direct
    difficulty: 3
    time: 70
    ncert: false
    battle: false
    formula: "kq_1/x = kq_2/(d − x) in magnitude"
    tags: [zero-potential]
    stem: "A charge of +2 μC is at x = 0 and a charge of −4 μC is at x = 6 cm. At what point between them is the electric potential zero?"
    options:
      - "x = 2 cm"
      - "x = 3 cm"
      - "x = 4 cm"
      - "x = 1.5 cm"
    answer: 0
    explanation: "Set 2/x = 4/(6 − x): 12 − 2x = 4x, so x = 2 cm from the +2 μC charge. The zero lies nearer the smaller-magnitude charge; the midpoint (3 cm) would need equal magnitudes."

  - id: phy-epc-016
    topic: point-charge-potential
    subtopic: "Scaling with distance"
    concept: "Doubling r halves V but quarters E"
    category: concept
    format: direct
    difficulty: 3
    time: 60
    ncert: true
    battle: true
    formula: "V ∝ 1/r, E ∝ 1/r^2"
    tags: [proportionality, trap]
    stem: "When the distance from a point charge is doubled, the potential and the field become respectively"
    options:
      - "V/2 and E/4"
      - "V/4 and E/2"
      - "V/2 and E/2"
      - "V/4 and E/4"
    answer: 0
    explanation: "V = kq/r falls as 1/r, so it halves; E = kq/r^2 falls as 1/r^2, so it becomes one quarter. Swapping the two dependences is the usual mistake."

  - id: phy-epc-017
    topic: point-charge-potential
    subtopic: "Uniformly charged shell"
    concept: "Potential inside a shell is constant and equal to surface value"
    category: concept
    format: direct
    difficulty: 3
    time: 60
    ncert: true
    battle: true
    formula: "V = kQ/R (r ≤ R)"
    tags: [shell]
    stem: "A thin spherical shell of radius R carries charge Q. The potential at a point inside the shell at distance R/2 from the centre is"
    options:
      - "zero"
      - "2kQ/R"
      - "kQ/R"
      - "kQ/(2R)"
    answer: 2
    explanation: "Inside the shell E = 0, so no work is needed to move a charge within it: the potential is constant and equal to its surface value kQ/R. Zero field does not mean zero potential."

  - id: phy-epc-018
    topic: point-charge-potential
    subtopic: "Regular hexagon"
    concept: "Six equal charges at hexagon vertices"
    category: numerical
    format: direct
    difficulty: 3
    time: 60
    ncert: false
    battle: true
    formula: "V = Σ kq/r"
    tags: [superposition, hexagon]
    stem: "Six equal charges q are placed at the vertices of a regular hexagon of side a. The potential at its centre is"
    options:
      - "zero"
      - "6kq/a"
      - "3kq/a"
      - "6kq/a^2"
    answer: 1
    explanation: "In a regular hexagon the distance from the centre to each vertex equals the side a. So V = 6 × kq/a = 6kq/a. The field at the centre is zero, but potentials add as scalars."

  - id: phy-epc-019
    topic: dipole-potential
    subtopic: "Axial point of dipole"
    concept: "V_axial = kp/r^2"
    category: factual
    format: direct
    difficulty: 1
    time: 30
    ncert: true
    battle: true
    formula: "V = p/(4πε_0 r^2)"
    tags: [dipole]
    stem: "The potential at a distance r (r ≫ dipole length) on the axis of a short dipole of moment p is"
    options:
      - "kp/r^3"
      - "2kp/r^3"
      - "kp/r"
      - "kp/r^2"
    answer: 3
    explanation: "For a short dipole V = kp cos θ/r^2, and on the axis θ = 0, giving V = kp/r^2. The 1/r^3 forms are for the electric field (2kp/r^3 on the axis)."

  - id: phy-epc-020
    topic: dipole-potential
    subtopic: "Equatorial plane"
    concept: "Potential on the equatorial plane is zero"
    category: factual
    format: direct
    difficulty: 1
    time: 30
    ncert: true
    battle: true
    formula: "V = kp cos 90°/r^2 = 0"
    tags: [dipole, ncert-line]
    stem: "The electric potential at any point on the equatorial plane of an electric dipole is"
    options:
      - "zero"
      - "maximum"
      - "kp/r^2"
      - "kp/r^3"
    answer: 0
    explanation: "On the equatorial plane θ = 90°, so V = kp cos 90°/r^2 = 0: the two charges are equidistant and their potentials cancel. The field there is not zero; it is kp/r^3, antiparallel to p."

  - id: phy-epc-021
    topic: dipole-potential
    subtopic: "Fall-off with distance"
    concept: "Dipole potential ∝ 1/r^2"
    category: numerical
    format: direct
    difficulty: 2
    time: 40
    ncert: true
    battle: true
    formula: "V ∝ 1/r^2"
    tags: [proportionality]
    stem: "The potential at a point on the axis of a short dipole is 80 V. What is it at a point on the axis at twice the distance?"
    options:
      - "40 V"
      - "10 V"
      - "20 V"
      - "160 V"
    answer: 2
    explanation: "For a dipole V ∝ 1/r^2 (not 1/r as for a point charge). Doubling r gives V = 80/4 = 20 V. The answer 40 V wrongly applies point-charge behaviour; 10 V uses the 1/r^3 law of the field."

  - id: phy-epc-022
    topic: dipole-potential
    subtopic: "Axial potential numerical"
    concept: "Evaluating kp/r^2"
    category: numerical
    format: direct
    difficulty: 2
    time: 40
    ncert: false
    battle: true
    formula: "V = kp/r^2"
    tags: [dipole, numerical]
    stem: "A short dipole has moment 4 × 10^{-9} C m. The potential at 10 cm from its centre on the axis is (k = 9 × 10^9 SI units)"
    options:
      - "360 V"
      - "3600 V"
      - "36 000 V"
      - "36 V"
    answer: 1
    explanation: "V = kp/r^2 = 9 × 10^9 × 4 × 10^{-9} / (0.1)^2 = 36/0.01 = 3600 V. Dividing by r instead of r^2 gives 360 V."

  - id: phy-epc-023
    topic: dipole-potential
    subtopic: "General point"
    concept: "V = kp cos θ/r^2 at θ = 60°"
    category: numerical
    format: direct
    difficulty: 3
    time: 70
    ncert: true
    battle: false
    formula: "V = kp cos θ/r^2"
    tags: [dipole, angle]
    stem: "At a point on the axis of a short dipole the potential is V. At a point at the same distance but on a line making 60° with the axis, the potential is"
    options:
      - "V/2"
      - "√3V/2"
      - "2V"
      - "V/4"
    answer: 0
    explanation: "V(θ) = kp cos θ/r^2, so V(60°)/V(0°) = cos 60° = 1/2. √3V/2 would need 30°."

  - id: phy-epc-024
    topic: dipole-potential
    subtopic: "Work on equatorial line"
    concept: "No work is done moving a charge along the dipole's equatorial line"
    category: concept
    format: direct
    difficulty: 2
    time: 40
    ncert: true
    battle: true
    tags: [work, dipole]
    stem: "What is the work done in moving a charge of 2 μC from one point to another on the equatorial line of an electric dipole?"
    options:
      - "It depends on the distance moved"
      - "It is positive"
      - "It is negative"
      - "It is zero"
    answer: 3
    explanation: "Every point on the equatorial plane is at zero potential, so the potential difference and hence the work q ΔV are zero, even though a non-zero field exists there (it is perpendicular to the plane)."

  - id: phy-epc-025
    topic: dipole-potential
    subtopic: "Features of dipole potential"
    concept: "Dipole potential depends on r and θ; falls as 1/r^2"
    category: concept
    format: multi-statement
    difficulty: 3
    time: 70
    ncert: true
    battle: false
    tags: [dipole, ncert-line]
    stem: |-
      Consider the potential due to a short electric dipole at large distances.
      I. It falls off as 1/r^2.
      II. It is spherically symmetric.
      III. It depends on the angle between the position vector and the dipole moment.
      IV. It is zero everywhere on the axis.
      Which statements are correct?
    options:
      - "I and IV only"
      - "I and III only"
      - "II and III only"
      - "I, II and III only"
    answer: 1
    explanation: "V = kp cos θ/r^2, so it falls as 1/r^2 (I) and depends on θ (III). It is not spherically symmetric (II false); it is zero on the equatorial plane, not on the axis (IV false)."

  - id: phy-epc-026
    topic: dipole-potential
    subtopic: "Axial versus inclined point"
    concept: "Ratio of dipole potentials depends on cos θ"
    category: numerical
    format: direct
    difficulty: 3
    time: 60
    ncert: false
    battle: true
    formula: "V ∝ cos θ"
    tags: [dipole, ratio]
    stem: "For a short dipole, the ratio of the potential at a point on its axis to that at a point at the same distance with θ = 60° is"
    options:
      - "1 : 2"
      - "1 : 1"
      - "2 : 1"
      - "√3 : 1"
    answer: 2
    explanation: "V ∝ cos θ at fixed r, so V(0°) : V(60°) = 1 : 1/2 = 2 : 1."

  - id: phy-epc-027
    topic: dipole-potential
    subtopic: "Equatorial field and potential"
    concept: "V = 0 but E ≠ 0 on the equatorial plane"
    category: concept
    format: assertion-reason
    difficulty: 3
    time: 70
    ncert: true
    battle: false
    tags: [dipole, trap]
    stem: |-
      Assertion (A): The electric potential at every point on the equatorial plane of a dipole is zero.
      Reason (R): The electric field at every point on the equatorial plane of a dipole is zero.
    options:
      - "Both A and R are true and R is the correct explanation of A"
      - "Both A and R are true but R is not the correct explanation of A"
      - "A is true but R is false"
      - "A is false but R is true"
    answer: 2
    explanation: "A is true: the two charges are equidistant from any equatorial point, so their potentials cancel. R is false: the field there is kp/r^3 directed opposite to p. Zero potential does not imply zero field."

  - id: phy-epc-028
    topic: equipotential-surfaces
    subtopic: "Shape for point charge"
    concept: "Equipotentials of a point charge are concentric spheres"
    category: factual
    format: direct
    difficulty: 1
    time: 30
    ncert: true
    battle: true
    tags: [equipotential, ncert-line]
    stem: "The equipotential surfaces of an isolated point charge are"
    options:
      - "planes perpendicular to the radial direction"
      - "concentric spheres centred on the charge"
      - "coaxial cylinders"
      - "radial lines"
    answer: 1
    explanation: "V = kq/r depends only on r, so each value of V is a sphere of fixed r around the charge. Radial lines are the field lines, which cut these spheres at right angles."

  - id: phy-epc-029
    topic: equipotential-surfaces
    subtopic: "Uniform field"
    concept: "Equipotentials of a uniform field are planes perpendicular to E"
    category: factual
    format: direct
    difficulty: 1
    time: 30
    ncert: true
    battle: true
    tags: [equipotential, uniform-field]
    stem: "In a uniform electric field along the x-axis, the equipotential surfaces are"
    options:
      - "planes parallel to the x-axis"
      - "spheres centred on the origin"
      - "planes perpendicular to the x-axis"
      - "cylinders along the x-axis"
    answer: 2
    explanation: "Equipotentials are always perpendicular to field lines. For E along x, V varies only with x, so each equipotential is a plane x = constant, i.e. perpendicular to the x-axis."

  - id: phy-epc-030
    topic: equipotential-surfaces
    subtopic: "Work on an equipotential"
    concept: "No work moving a charge on an equipotential surface"
    category: concept
    format: direct
    difficulty: 1
    time: 30
    ncert: true
    battle: true
    formula: "W = qΔV"
    tags: [equipotential, work]
    stem: "A 3 μC charge is moved 20 cm along an equipotential surface at 50 V. The work done is"
    options:
      - "zero"
      - "150 μJ"
      - "30 μJ"
      - "3 μJ"
    answer: 0
    explanation: "Along an equipotential ΔV = 0, so W = qΔV = 0. Multiplying q by 50 V (150 μJ) confuses potential with potential difference."

  - id: phy-epc-031
