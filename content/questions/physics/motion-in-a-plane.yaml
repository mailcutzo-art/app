    stem: A particle moves on a circle of radius 2 m with a speed that increases at 3 m s^{-2}. At the instant its speed is 4 m s^{-1}, what is the magnitude of its total acceleration?
    options:
      - 11 m s^{-2}
      - 8 m s^{-2}
      - 5 m s^{-2}
      - √73 m s^{-2}
    answer: 3
    explanation: Centripetal part = v^2/r = 16/2 = 8 m s^{-2} (radial); tangential part = 3 m s^{-2}. They are perpendicular, so a = √(64 + 9) = √73 ≈ 8.5 m s^{-2}.

