questions:
  - id: phy-mip-001
    topic: scalars-vectors
    subtopic: Identifying vectors
    concept: Displacement is a vector while current, work and pressure are scalars
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [vector-quantity, trap]
    stem: Which of the following physical quantities is a vector?
    options:
      - Electric current
      - Work
      - Displacement
      - Pressure
    answer: 2
    explanation: Displacement has magnitude and direction and adds by the triangle law, so it is a vector. Electric current has a direction of flow but does not obey vector addition, so it is a scalar; work and pressure are scalars too.

  - id: phy-mip-002
    topic: scalars-vectors
    subtopic: Scalar or vector test
    concept: Current is scalar because it does not obey the law of vector addition
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: false
    battle: true
    tags: [electric-current, trap]
    stem: Electric current has both magnitude and a direction, yet it is treated as a scalar. Why?
    options:
      - Its direction is fixed by convention only
      - It does not obey the laws of vector addition
      - Its magnitude can never be negative
      - It is an SI base quantity
    answer: 1
    explanation: A quantity is a vector only if it has magnitude and direction AND combines by the triangle (parallelogram) law. Currents meeting at a junction simply add algebraically, whatever the angle between the wires, so current is a scalar. Being a base quantity has nothing to do with it.

  - id: phy-mip-003
    topic: scalars-vectors
    subtopic: Equality of vectors
    concept: Equal vectors have the same magnitude and the same direction
    category: concept
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    tags: [equal-vectors, ncert-line]
    stem: Two vectors A and B are said to be equal if and only if they have
    options:
      - the same magnitude only
      - the same magnitude and the same direction
      - the same magnitude and the same initial point
      - the same magnitude, direction and initial point
    answer: 1
    explanation: Equal vectors have the same magnitude and the same direction. A vector can be shifted parallel to itself, so the initial points need not coincide; the same magnitude alone is not enough.

  - id: phy-mip-004
    topic: scalars-vectors
    subtopic: Null vector
    concept: Zero vector has zero magnitude and no definite direction
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [null-vector, ncert-line]
    stem: A null (zero) vector has
    options:
      - unit magnitude and no direction
      - zero magnitude and a direction along the x-axis
      - zero magnitude and a direction opposite to the original vector
      - zero magnitude and no definite direction
    answer: 3
    explanation: The zero vector 0 has zero magnitude, and its direction cannot be specified. It appears, for example, as A + (−A) or as the displacement of a body that returns to its starting point.

  - id: phy-mip-005
    topic: scalars-vectors
    subtopic: Multiplication by a real number
    concept: Multiplying a vector by a negative number reverses its direction and scales its magnitude
    category: concept
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    tags: [scalar-multiplication]
    stem: A vector A is multiplied by −3. The resulting vector has
    options:
      - magnitude 3|A| and direction opposite to A
      - magnitude 3|A| and the same direction as A
      - magnitude −3|A| and the same direction as A
      - magnitude |A|/3 and direction opposite to A
    answer: 0
    explanation: Multiplying by λ scales the magnitude by |λ| and keeps the direction if λ > 0, reverses it if λ < 0. So −3A has magnitude 3|A| and points opposite to A. A magnitude can never be negative.

  - id: phy-mip-006
    topic: scalars-vectors
    subtopic: Identifying vectors
    concept: Velocity and acceleration are vectors; mass and time are scalars
    category: factual
    format: multi-statement
    difficulty: 1
    time: 30
    ncert: true
    battle: false
    tags: [vector-quantity]
    stem: |-
      Which of the following are vector quantities?
      I. Velocity
      II. Mass
      III. Acceleration
      IV. Time
    options:
      - I only
      - I, II and III only
      - I and III only
      - II and IV only
    answer: 2
    explanation: Velocity and acceleration need a direction to be specified, so they are vectors. Mass and time are fully specified by a number and a unit, so they are scalars.

  - id: phy-mip-007
    topic: scalars-vectors
    subtopic: Unit vectors
    concept: A unit vector has magnitude one and no dimensions or units
    category: concept
    format: direct
    difficulty: 2
    time: 25
    ncert: true
    battle: true
    tags: [unit-vector, ncert-line]
    stem: Which is true of a unit vector?
    options:
      - It has magnitude 1 and carries the unit of the original vector
      - It has magnitude 1 and has no dimensions or units
      - It has zero magnitude and indicates only direction
      - Its magnitude depends on the vector it is drawn from
    answer: 1
    explanation: A unit vector Â = A/|A| has magnitude exactly 1 and is dimensionless; its only job is to specify direction. The units belong to the magnitude |A|.

  - id: phy-mip-008
    topic: scalars-vectors
    subtopic: Position and displacement vectors
    concept: Position vector depends on origin but displacement does not
    category: concept
    format: assertion-reason
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [position-vector, displacement]
    stem: |-
      Assertion (A): The position vector of a point changes if the origin is shifted.
      Reason (R): The displacement vector between two points does not depend on the choice of origin.
    options:
      - Both A and R are true and R is the correct explanation of A
      - Both A and R are true but R is not the correct explanation of A
      - A is true but R is false
      - A is false but R is true
    answer: 1
    explanation: The position vector is drawn from the origin, so shifting the origin changes it (A is true). Displacement r₂ − r₁ is unchanged because the shift cancels (R is true). But R talks about displacement, not about why position vectors change, so R does not explain A.

  - id: phy-mip-009
    topic: scalars-vectors
    subtopic: Multiplication by a scalar quantity
    concept: Velocity vector times a time interval gives a displacement vector
    category: concept
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [scalar-multiplication]
    stem: A constant velocity vector is multiplied by a time interval Δt. The result is
    options:
      - a scalar distance
      - a velocity vector
      - an acceleration vector
      - a displacement vector
    answer: 3
    explanation: Multiplying a vector by a scalar with dimensions gives a vector of a new physical quantity in the same direction. Velocity × time = displacement, which is still a vector along v.

  - id: phy-mip-010
    topic: vector-addition
    subtopic: Perpendicular vectors
    concept: Resultant of perpendicular vectors is √(A^2 + B^2)
    category: numerical
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    formula: R = √(A^2 + B^2)
    tags: [resultant]
    stem: Forces of 3 N and 4 N act on a body at right angles to each other. What is the magnitude of their resultant?
    options:
      - 1 N
      - 5 N
      - 7 N
      - 12 N
    answer: 1
    explanation: For perpendicular vectors R = √(3^2 + 4^2) = √25 = 5 N. 7 N would need the forces to be parallel and 1 N antiparallel.

  - id: phy-mip-011
    topic: vector-addition
    subtopic: Range of the resultant
    concept: Resultant of two vectors lies between |A − B| and A + B
    category: application
    format: direct
    difficulty: 2
    time: 30
    ncert: false
    battle: true
    formula: "|A − B| ≤ R ≤ A + B"
    tags: [resultant, range-of-resultant]
    stem: Two forces of 6 N and 8 N act at a point. Which of the following CANNOT be the magnitude of their resultant?
    options:
      - 2 N
      - 10 N
      - 14 N
      - 15 N
    answer: 3
    explanation: The resultant lies between |8 − 6| = 2 N (antiparallel) and 8 + 6 = 14 N (parallel). 2 N, 10 N and 14 N are possible; 15 N exceeds the maximum.

  - id: phy-mip-012
    topic: vector-addition
    subtopic: Equal vectors at an angle
    concept: Two equal vectors at 120° give a resultant equal to either
    category: numerical
    format: direct
    difficulty: 2
    time: 35
    ncert: false
    battle: true
    formula: R = 2A cos(θ/2)
    tags: [resultant, equal-vectors]
    stem: Two vectors each of magnitude A are inclined at 120° to each other. What is the magnitude of their resultant?
    options:
      - √3 A
      - A/2
      - A
      - 2A
    answer: 2
    explanation: For equal vectors R = 2A cos(θ/2) = 2A cos 60° = A. √3 A would be the answer for 60°, a common slip.

  - id: phy-mip-013
    topic: vector-addition
    subtopic: Equal vectors at an angle
    concept: Finding angle from resultant of equal vectors
    category: numerical
    format: direct
    difficulty: 3
    time: 45
    ncert: false
    battle: true
    formula: R = 2F cos(θ/2)
    tags: [resultant, equal-vectors]
    stem: Two forces, each of magnitude F, have a resultant of magnitude √3 F. What is the angle between them?
    options:
      - 60°
      - 30°
      - 90°
      - 120°
    answer: 0
    explanation: 2F cos(θ/2) = √3 F gives cos(θ/2) = √3/2, so θ/2 = 30° and θ = 60°. At 120° the resultant would be F, and at 90° it would be √2 F.

  - id: phy-mip-014
    topic: vector-addition
    subtopic: Triangle law
    concept: Three vectors summing to zero form a closed triangle
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [triangle-law]
    stem: Three non-zero vectors satisfy A + B + C = 0. Which statement must be true?
    options:
      - All three vectors are parallel
      - The three vectors are mutually perpendicular
      - The three vectors have equal magnitudes
      - The three vectors, placed head to tail, form a closed triangle
    answer: 3
    explanation: If A + B + C = 0, placing them head to tail returns to the starting point, so they form a closed triangle (they must also lie in one plane). They need not be equal, perpendicular or parallel.

  - id: phy-mip-015
    topic: vector-addition
    subtopic: Vector subtraction
    concept: "|A − B| = 2A sin(θ/2) for equal vectors"
    category: numerical
    format: direct
    difficulty: 3
    time: 45
    ncert: false
    battle: true
    formula: "|A − B| = √(A^2 + B^2 − 2AB cos θ)"
    tags: [vector-subtraction, trap]
    stem: Two vectors A and B each have magnitude A and are inclined at 60°. What is the magnitude of A − B?
    options:
      - √3 A
      - A
      - 2A
      - zero
    answer: 1
    explanation: "|A − B|^2 = A^2 + A^2 − 2A^2 cos 60° = A^2, so |A − B| = A. √3 A is the magnitude of A + B, which is the usual mix-up."

  - id: phy-mip-016
    topic: vector-addition
    subtopic: Laws of vector addition
    concept: Vector subtraction is not commutative
    category: concept
    format: statements
    difficulty: 2
    time: 40
    ncert: true
    battle: false
    tags: [commutative-law]
    stem: For two non-zero, non-parallel vectors A and B, which statement is INCORRECT?
    options:
      - A − B = B − A
      - A + B = B + A
      - (A + B) + C = A + (B + C)
      - A − B = A + (−B)
    answer: 0
    explanation: Vector addition is commutative and associative, and subtraction is defined as adding the negative vector. But A − B = −(B − A), so A − B equals B − A only if A = B; the first statement is wrong.

  - id: phy-mip-017
    topic: vector-addition
    subtopic: Direction of resultant
    concept: Resultant of equal vectors bisects the angle between them
    category: numerical
    format: direct
    difficulty: 2
    time: 35
    ncert: false
    battle: true
    formula: tan α = B sin θ/(A + B cos θ)
    tags: [direction-of-resultant]
    stem: Two forces of 10 N each act at a point with an angle of 60° between them. What angle does the resultant make with either force?
    options:
      - 30°
      - 60°
      - 45°
      - 15°
    answer: 0
    explanation: tan α = 10 sin 60°/(10 + 10 cos 60°) = 5√3/15 = 1/√3, so α = 30°. For equal vectors the resultant always bisects the angle between them.

  - id: phy-mip-018
    topic: vector-addition
    subtopic: Maximum and minimum resultant
    concept: Using A + B and A − B to find the perpendicular resultant
    category: numerical
    format: direct
    difficulty: 3
    time: 60
    ncert: false
    battle: false
    formula: R_{max} = A + B, R_{min} = A − B
    tags: [resultant, multi-concept]
    stem: The maximum and minimum magnitudes of the resultant of two forces are 17 N and 7 N. What is the resultant when the two forces act at right angles?
    options:
      - 10 N
      - 12 N
      - 13 N
      - 24 N
    answer: 2
    explanation: A + B = 17 and A − B = 7 give A = 12 N and B = 5 N. At right angles R = √(144 + 25) = 13 N.

  - id: phy-mip-019
    topic: vector-addition
    subtopic: Sum and difference equal
    concept: "|A + B| = |A − B| implies A ⊥ B"
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: false
    battle: true
    tags: [perpendicular-vectors]
    stem: If |A + B| = |A − B| for two non-zero vectors, the angle between A and B is
    options:
      - 60°
      - 90°
      - 0°
      - 180°
    answer: 1
    explanation: Squaring, A^2 + B^2 + 2AB cos θ = A^2 + B^2 − 2AB cos θ, so cos θ = 0 and θ = 90°. The diagonals of the parallelogram are then equal, i.e. it is a rectangle.

  - id: phy-mip-020
    topic: vector-addition
    subtopic: Zero resultant of three forces
    concept: Three forces can balance only if each is at most the sum of the other two
    category: application
    format: direct
    difficulty: 3
    time: 50
    ncert: false
    battle: false
    tags: [equilibrium, triangle-law]
    stem: Which set of three forces acting at a point can give a zero resultant?
    options:
      - 2 N, 3 N, 6 N
      - 1 N, 2 N, 4 N
      - 5 N, 5 N, 11 N
      - 4 N, 6 N, 9 N
    answer: 3
    explanation: Three forces can form a closed triangle only if the largest is not more than the sum of the other two. 9 ≤ 4 + 6 works, while 6 > 5, 4 > 3 and 11 > 10 fail.

  - id: phy-mip-021
    topic: resolution-components
    subtopic: Magnitude from components
    concept: "|A| = √(A_x^2 + A_y^2)"
    category: numerical
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    formula: "|A| = √(A_x^2 + A_y^2)"
    tags: [magnitude]
    stem: What is the magnitude of the vector A = 3î + 4ĵ?
    options:
      - "7"
      - "5"
      - √7
      - "25"
    answer: 1
    explanation: "|A| = √(3^2 + 4^2) = √25 = 5. Adding the components (7) ignores that they are perpendicular."

  - id: phy-mip-022
    topic: resolution-components
    subtopic: Rectangular components
    concept: y-component of a vector is A sin θ
    category: numerical
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    formula: A_y = A sin θ
    tags: [components]
    stem: A force of 10 N acts at 30° above the positive x-axis. What is its y-component?
    options:
      - 5 N
      - 5√3 N
      - 10 N
      - 2.5 N
    answer: 0
    explanation: F_y = F sin 30° = 10 × ½ = 5 N. 5√3 N is the x-component F cos 30°.

  - id: phy-mip-023
    topic: resolution-components
    subtopic: Unit vector along a given vector
    concept: Unit vector = A/|A|
    category: numerical
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    formula: Â = A/|A|
    tags: [unit-vector]
    stem: What is the unit vector along 3î + 4ĵ?
    options:
      - 3î + 4ĵ
      - (3î + 4ĵ)/7
      - 0.6î + 0.8ĵ
      - 0.8î + 0.6ĵ
    answer: 2
    explanation: Divide the vector by its magnitude 5 to get 0.6î + 0.8ĵ, whose magnitude is √(0.36 + 0.64) = 1. Dividing by 7 does not give magnitude 1.

  - id: phy-mip-024
    topic: resolution-components
    subtopic: Direction cosines
    concept: Direction cosine of î + ĵ + k̂ along each axis is 1/√3
    category: numerical
    format: direct
    difficulty: 3
    time: 45
    ncert: false
    battle: true
    formula: cos α = A_x/|A|
    tags: [direction-cosines]
    stem: What angle does the vector î + ĵ + k̂ make with the x-axis?
    options:
      - 45°
      - 60°
      - cos^{-1}(1/3)
      - cos^{-1}(1/√3)
    answer: 3
    explanation: "|A| = √3, so cos α = A_x/|A| = 1/√3 and α = cos^{-1}(1/√3) ≈ 54.7°. Using 1/3 forgets the square root in the magnitude."

  - id: phy-mip-025
    topic: resolution-components
    subtopic: Component versus magnitude
    concept: A rectangular component can never exceed the magnitude of the vector
    category: concept
    format: assertion-reason
    difficulty: 2
    time: 40
    ncert: false
    battle: false
    tags: [components]
    stem: |-
      Assertion (A): A rectangular component of a vector cannot be larger than the magnitude of the vector.
      Reason (R): A_x = A cos θ and |cos θ| ≤ 1.
    options:
      - Both A and R are true and R is the correct explanation of A
      - Both A and R are true but R is not the correct explanation of A
      - A is true but R is false
      - A is false but R is true
    answer: 0
    explanation: Each rectangular component equals the magnitude times the cosine of the angle with that axis, and a cosine never exceeds 1 in size. So R directly explains A.

  - id: phy-mip-026
    topic: resolution-components
    subtopic: Adding by components
    concept: Add vectors component by component, then find magnitude
    category: numerical
    format: direct
    difficulty: 3
    time: 35
    ncert: true
    battle: true
    tags: [analytical-addition]
    stem: If A = 2î + 3ĵ and B = î − ĵ, what is the magnitude of A + B?
    options:
      - "5"
      - √5
      - √13
      - "13"
    answer: 2
    explanation: A + B = 3î + 2ĵ, so |A + B| = √(9 + 4) = √13. Forgetting the square root gives 13.

  - id: phy-mip-027
    topic: resolution-components
    subtopic: Direction cosines
    concept: cos^2 α + cos^2 β + cos^2 γ = 1
    category: numerical
    format: direct
    difficulty: 3
    time: 50
    ncert: false
    battle: false
    formula: cos^2 α + cos^2 β + cos^2 γ = 1
    tags: [direction-cosines]
    stem: A vector makes an angle of 60° with the x-axis and 45° with the y-axis. What angle (acute) does it make with the z-axis?
    options:
      - 60°
      - 90°
      - 45°
      - 30°
    answer: 0
    explanation: cos^2 γ = 1 − cos^2 60° − cos^2 45° = 1 − ¼ − ½ = ¼, so cos γ = ½ and γ = 60°.

  - id: phy-mip-028
    topic: resolution-components
    subtopic: Finding an unknown vector
    concept: Required vector = target − given vector
    category: numerical
    format: direct
    difficulty: 2
    time: 30
    ncert: false
    battle: true
    tags: [analytical-addition]
    stem: What vector must be added to 3î + 4ĵ so that the resultant is 5î?
    options:
      - 2î + 4ĵ
      - 2î − 4ĵ
      - −2î + 4ĵ
      - 8î + 4ĵ
    answer: 1
    explanation: The required vector is 5î − (3î + 4ĵ) = 2î − 4ĵ. The y-component must cancel the +4ĵ, so it has to be negative.

  - id: phy-mip-029
    topic: resolution-components
    subtopic: Scaling a vector
    concept: "|λA| = |λ||A|"
    category: numerical
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    tags: [magnitude, trap]
    stem: If A = 4î − 3ĵ, what is the magnitude of −2A?
    options:
      - "5"
      - "−10"
      - "10"
      - "20"
    answer: 2
    explanation: "|A| = 5, so |−2A| = 2 × 5 = 10. The minus sign only reverses direction; a magnitude is never negative."

  - id: phy-mip-030
    topic: resolution-components
    subtopic: Unit vectors
    concept: cos θ î + sin θ ĵ is a unit vector for every θ
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: false
    battle: true
    tags: [unit-vector]
    stem: The vector n = cos θ î + sin θ ĵ is
    options:
      - a unit vector only when θ = 45°
      - a null vector when θ = 90°
      - always along the x-axis
      - a unit vector for every value of θ
    answer: 3
    explanation: "|n| = √(cos^2 θ + sin^2 θ) = 1 for all θ, so n is a unit vector making angle θ with the x-axis. At θ = 90° it equals ĵ, not zero."

  - id: phy-mip-031
    topic: resolution-components
    subtopic: Components in other quadrants
    concept: Sign of components depends on quadrant
    category: numerical
    format: direct
    difficulty: 2
    time: 35
    ncert: false
    battle: true
    tags: [components, trap]
    stem: A force of 20 N acts at 150° measured anticlockwise from the positive x-axis. What is its x-component?
    options:
      - 10√3 N
      - −10√3 N
      - −10 N
      - 10 N
    answer: 1
    explanation: F_x = 20 cos 150° = 20 × (−√3/2) = −10√3 N. The vector points into the second quadrant, so the x-component is negative; +10 N is the y-component.

  - id: phy-mip-032
    topic: vector-products
    subtopic: Dot product in components
    concept: A·B = A_xB_x + A_yB_y + A_zB_z
    category: numerical
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    formula: A·B = A_xB_x + A_yB_y + A_zB_z
    tags: [dot-product]
    stem: If A = î + 2ĵ + 3k̂ and B = 2î − ĵ + k̂, what is A·B?
    options:
      - "3"
      - "5"
      - "−1"
      - "7"
    answer: 0
    explanation: A·B = (1)(2) + (2)(−1) + (3)(1) = 2 − 2 + 3 = 3.

  - id: phy-mip-033
    topic: vector-products
    subtopic: Perpendicularity condition
    concept: Perpendicular vectors have zero dot product
    category: numerical
    format: direct
    difficulty: 3
    time: 35
    ncert: true
    battle: true
    tags: [dot-product, perpendicular-vectors]
    stem: For what value of p are A = 2î + pĵ + k̂ and B = 3î − 2ĵ + 4k̂ perpendicular?
    options:
      - "3"
      - "5"
      - "−5"
      - "2"
    answer: 1
    explanation: A·B = 6 − 2p + 4 = 0 gives p = 5.

  - id: phy-mip-034
    topic: vector-products
    subtopic: Cross products of unit vectors
    concept: k̂ × ĵ = −î (cyclic order reversed)
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [cross-product, trap]
    stem: What is k̂ × ĵ?
    options:
      - î
      - −î
      - k̂
      - zero
    answer: 1
    explanation: In cyclic order ĵ × k̂ = î. Reversing the order reverses the sign, so k̂ × ĵ = −î.

  - id: phy-mip-035
    topic: vector-products
    subtopic: Equal dot and cross products
    concept: "|A × B| = A·B implies θ = 45°"
    category: concept
    format: direct
    difficulty: 2
    time: 30
