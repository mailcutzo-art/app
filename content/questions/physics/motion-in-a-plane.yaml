      - The sum of three vectors of unequal magnitudes can be zero
      - A vector can have zero magnitude while one of its rectangular components is non-zero
      - A scalar can be added to a vector if both have the same units
    answer: 1
    explanation: Two vectors cancel only if they are equal and opposite, so their magnitudes must be equal. Three unequal vectors can form a closed triangle (e.g. 3, 4, 5) and add to zero. A zero vector has all components zero, and scalars cannot be added to vectors.

