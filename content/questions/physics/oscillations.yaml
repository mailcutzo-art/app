questions:
  - id: phy-osc-001
    topic: periodic-motion
    subtopic: Periodic versus oscillatory motion
    concept: Revolution of a planet is periodic but not oscillatory
    category: concept
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    tags: [periodic-motion, ncert-line]
    stem: Which of the following motions is periodic but NOT oscillatory?
    options:
      - Motion of a simple pendulum bob
      - Revolution of the Earth around the Sun
      - Vibration of a prong of a tuning fork
      - Up-and-down motion of a mass hung from a spring
    answer: 1
    explanation: Oscillatory motion is a to-and-fro motion about a mean position. The Earth repeats its orbit every year, so the motion is periodic, but it does not move back and forth about an equilibrium point, so it is not oscillatory. The other three are to-and-fro motions about a mean position.

  - id: phy-osc-002
    topic: periodic-motion
    subtopic: Period of periodic functions
    concept: Period of a sum of two sinusoids is the LCM of their periods
    category: numerical
    format: direct
    difficulty: 3
    time: 60
    ncert: false
    battle: false
    tags: [periodic-function, multi-concept]
    stem: What is the period of the function y = sin(2πt/3) + cos(πt/2), where t is in seconds?
    options:
      - 3 s
      - 4 s
      - 7 s
      - 12 s
    answer: 3
    explanation: sin(2πt/3) has period 2π ÷ (2π/3) = 3 s and cos(πt/2) has period 2π ÷ (π/2) = 4 s. The sum repeats only when both repeat together, i.e. after the LCM of 3 s and 4 s, which is 12 s. Adding the periods (7 s) is a common mistake.

  - id: phy-osc-003
    topic: periodic-motion
    subtopic: Period and frequency
    concept: Period is the reciprocal of frequency
    category: numerical
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    formula: T = 1/ν
    tags: [period, frequency]
    stem: A body completes 120 oscillations in one minute. What is its time period?
    options:
      - 0.5 s
      - 2 s
      - 120 s
      - 0.2 s
    answer: 0
    explanation: Frequency ν = 120 oscillations ÷ 60 s = 2 Hz, so the period T = 1/ν = 0.5 s. Taking 2 s confuses frequency with period.

  - id: phy-osc-004
    topic: periodic-motion
    subtopic: SHM versus periodic functions
    concept: sin^3 ωt is periodic but not simple harmonic
    category: concept
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [periodic-function, trap, ncert-line]
    stem: The displacement of a particle is x = sin^3 ωt. The motion is
    options:
      - simple harmonic with period 2π/ω
      - simple harmonic with period 2π/(3ω)
      - periodic with period 2π/ω but not simple harmonic
      - non-periodic
    answer: 2
    explanation: sin^3 ωt = (3 sin ωt − sin 3ωt)/4, a combination of two harmonics of different frequencies. It repeats every 2π/ω, so it is periodic, but it is not a single sinusoid and so is not SHM. Seeing the sin 3ωt term tempts students to pick period 2π/(3ω).

  - id: phy-osc-005
    topic: periodic-motion
    subtopic: Angular frequency
    concept: Angular frequency ω = 2πν
    category: numerical
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    formula: ω = 2πν
    tags: [angular-frequency]
    stem: A particle oscillates with frequency 5 Hz. What is its angular frequency?
    options:
      - 5 rad s^{-1}
      - 10 rad s^{-1}
      - 10π rad s^{-1}
      - 5π rad s^{-1}
    answer: 2
    explanation: ω = 2πν = 2π × 5 = 10π rad s^{-1} (about 31.4 rad s^{-1}). Using ω = ν or forgetting the factor 2 gives the wrong choices.

  - id: phy-osc-006
    topic: periodic-motion
    subtopic: Oscillatory and periodic motion
    concept: Every oscillation is periodic but not every periodic motion is oscillatory
    category: concept
    format: statement-pair
    difficulty: 2
    time: 40
    ncert: true
    battle: false
    tags: [periodic-motion, ncert-line]
    stem: |-
      Statement I: Every oscillatory motion is periodic.
      Statement II: Every periodic motion is oscillatory.
    options:
      - Both Statement I and Statement II are correct
      - Both Statement I and Statement II are incorrect
      - Statement I is correct but Statement II is incorrect
      - Statement I is incorrect but Statement II is correct
    answer: 2
    explanation: The oscillations considered in NCERT (ideal, undamped) repeat at regular intervals, so they are periodic. But a periodic motion need not be to-and-fro about a mean position; uniform circular motion and planetary revolution are periodic without being oscillatory. So Statement II is incorrect.

  - id: phy-osc-007
    topic: periodic-motion
    subtopic: Non-periodic functions
    concept: An exponentially decaying function is not periodic
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [periodic-function]
    stem: Which of the following functions of time is NOT periodic?
    options:
      - sin ωt − cos ωt
      - cos ωt + cos 3ωt
      - e^{−ω^2t^2}
      - 3 cos(π/4 − 2ωt)
    answer: 2
    explanation: e^{−ω^2t^2} rises to 1 at t = 0 and then decays to zero; it never repeats, so it is non-periodic. sin ωt − cos ωt and 3 cos(π/4 − 2ωt) are single sinusoids (SHM), and cos ωt + cos 3ωt is periodic with period 2π/ω.

  - id: phy-osc-008
    topic: periodic-motion
    subtopic: Mean position
    concept: At the equilibrium position the net force on an oscillating body is zero
    category: concept
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    tags: [equilibrium, ncert-line]
    stem: For a body oscillating about its equilibrium (mean) position, the net external force on it at the mean position is
    options:
      - maximum
      - zero
      - equal to its weight
      - directed away from the mean position
    answer: 1
    explanation: The mean position is the equilibrium position, where the net force is zero. When displaced, a restoring force acts toward it; the body overshoots because of its inertia, which is why it oscillates.

  - id: phy-osc-009
    topic: periodic-motion
    subtopic: Periodic functions
    concept: cos ωt + cos 3ωt + cos 5ωt is periodic with period 2π/ω but not SHM
    category: application
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [periodic-function, ncert-line]
    stem: The function x(t) = cos ωt + cos 3ωt + cos 5ωt represents
    options:
      - SHM with period 2π/ω
      - a periodic but non-SHM motion with period 2π/(5ω)
      - a non-periodic motion
      - a periodic but non-SHM motion with period 2π/ω
    answer: 3
    explanation: The three terms have periods 2π/ω, 2π/(3ω) and 2π/(5ω). The whole function repeats after the longest of these, 2π/ω, which is a multiple of the others. Being a sum of different harmonics it is not a single sinusoid, so it is not SHM.

  - id: phy-osc-010
    topic: periodic-motion
    subtopic: Units of frequency
    concept: SI unit of frequency is the hertz, one oscillation per second
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [frequency, units]
    stem: One hertz is equal to
    options:
      - one oscillation per minute
      - one radian per second
      - 2π oscillations per second
      - one oscillation per second
    answer: 3
    explanation: The hertz (Hz), named after Heinrich Hertz, is one oscillation (cycle) per second, i.e. 1 s^{-1}. The radian per second is the unit of angular frequency, and 1 Hz corresponds to 2π rad s^{-1}.

  - id: phy-osc-011
    topic: shm-equation
    subtopic: Reading the SHM equation
    concept: Frequency from x = A sin(ωt + φ)
    category: numerical
    format: direct
    difficulty: 1
    time: 30
    ncert: true
    battle: true
    formula: ν = ω/2π
    tags: [shm-equation, frequency]
    stem: The displacement of a particle is x = 5 sin(4πt + π/3) cm, t in seconds. What is the frequency?
    options:
      - 4 Hz
      - 2 Hz
      - 0.5 Hz
      - 4π Hz
    answer: 1
    explanation: Comparing with x = A sin(ωt + φ), ω = 4π rad s^{-1}, so ν = ω/2π = 2 Hz. Reading 4π or 4 directly as the frequency confuses ω with ν.

  - id: phy-osc-012
    topic: shm-equation
    subtopic: Amplitude of combined sinusoids
    concept: a sin ωt + b cos ωt is SHM with amplitude √(a^2 + b^2)
    category: numerical
    format: direct
    difficulty: 2
    time: 35
    ncert: false
    battle: true
    formula: A = √(a^2 + b^2)
    tags: [amplitude, superposition]
    stem: The displacement of a particle is x = 3 sin 2t + 4 cos 2t (in cm). What is the amplitude of its motion?
    options:
      - 7 cm
      - 1 cm
      - 5 cm
      - 3.5 cm
    answer: 2
    explanation: a sin ωt + b cos ωt = R sin(ωt + φ) with R = √(a^2 + b^2) = √(9 + 16) = 5 cm. The two terms are 90° out of phase, so their amplitudes cannot simply be added to give 7 cm.

  - id: phy-osc-013
    topic: shm-equation
    subtopic: Phase
    concept: Phase is the full argument of the sinusoid
    category: concept
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    tags: [phase, ncert-line]
    stem: In x(t) = A cos(ωt + φ), the phase of the motion at time t is
    options:
      - ωt + φ
      - φ
      - ωt
      - A cos φ
    answer: 0
    explanation: The time-varying quantity (ωt + φ), the argument of the cosine, is the phase; it fixes the state of motion (position and velocity) at time t. φ alone is the phase constant, the value of the phase at t = 0.

  - id: phy-osc-014
    topic: shm-equation
    subtopic: Time between positions
    concept: Time from mean position to half amplitude is T/12
    category: numerical
    format: direct
    difficulty: 3
    time: 60
    ncert: false
    battle: false
    tags: [time-between-positions, trap]
    stem: A particle executes SHM with period 2 s, starting from the mean position. What is the minimum time it takes to reach half its amplitude?
    options:
      - 1/6 s
      - 1/4 s
      - 1/3 s
      - 1/2 s
    answer: 0
    explanation: With x = A sin ωt, A/2 = A sin ωt gives ωt = π/6, so t = (π/6)/(2π/T) = T/12 = 2/12 = 1/6 s. Assuming uniform speed would give T/8 = 1/4 s, but the particle is fastest near the mean position, so it covers the first half of the amplitude quickly.

  - id: phy-osc-015
    topic: shm-equation
    subtopic: Time between positions
    concept: Time from extreme to half amplitude is T/6
    category: numerical
    format: direct
    difficulty: 3
    time: 60
    ncert: false
    battle: false
    tags: [time-between-positions]
    stem: A particle in SHM of period 12 s is at its positive extreme at t = 0. After how long does it first reach x = A/2?
    options:
      - 1 s
      - 3 s
      - 2 s
      - 4 s
    answer: 2
    explanation: With x = A cos ωt, A/2 = A cos ωt gives ωt = π/3, so t = T/6 = 12/6 = 2 s. The time from the mean position to A/2 would be T/12 = 1 s; the particle moves slowly near the extreme, so this half takes longer.

  - id: phy-osc-016
    topic: shm-equation
    subtopic: Initial phase
    concept: Phase constant from initial position and direction of motion
    category: application
    format: direct
    difficulty: 3
    time: 60
    ncert: false
    battle: false
    tags: [phase-constant, trap]
    stem: A particle in SHM is described by x = A sin(ωt + φ). At t = 0 it is at x = A/2 and moving towards the positive extreme. What is φ?
    options:
      - π/3
      - 5π/6
      - π/6
      - 2π/3
    answer: 2
    explanation: At t = 0, sin φ = 1/2, so φ = π/6 or 5π/6. The velocity Aω cos φ must be positive (moving towards +A), which needs cos φ > 0, so φ = π/6. φ = 5π/6 gives the same position but motion towards the mean position.

  - id: phy-osc-017
    topic: shm-equation
    subtopic: Reading the SHM equation
    concept: Period from angular frequency in the SHM equation
    category: numerical
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    formula: T = 2π/ω
    tags: [shm-equation, period]
    stem: A particle moves as x = 2 sin(πt/2) m, with t in seconds. What is the period of oscillation?
    options:
      - 2 s
      - 4 s
      - π/2 s
      - 1 s
    answer: 1
    explanation: Here ω = π/2 rad s^{-1}, so T = 2π/ω = 2π ÷ (π/2) = 4 s.

  - id: phy-osc-018
    topic: shm-equation
    subtopic: Amplitude
    concept: Amplitude is the maximum displacement from the mean position
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [amplitude, ncert-line]
    stem: In SHM, the amplitude is the
    options:
      - distance between the two extreme positions
      - total distance moved in one period
      - magnitude of the maximum displacement from the mean position
      - maximum speed of the particle
    answer: 2
    explanation: Amplitude A is the magnitude of the maximum displacement from the mean position, so x ranges from −A to +A. The distance between the extremes is 2A, and the path length in one period is 4A.

  - id: phy-osc-019
    topic: shm-equation
    subtopic: Distance in one period
    concept: Distance covered in one full period of SHM is 4A
    category: numerical
    format: direct
    difficulty: 2
    time: 30
    ncert: false
    battle: true
    tags: [amplitude, distance, trap]
    stem: A particle executes SHM of amplitude 3 cm. What total distance does it travel in one complete period?
    options:
      - 3 cm
      - 6 cm
      - zero
      - 12 cm
    answer: 3
    explanation: In one period the particle goes mean → +A → mean → −A → mean, covering 4A = 12 cm. Its displacement over a full period is zero, which is the trap; distance is not displacement.

  - id: phy-osc-020
    topic: shm-equation
    subtopic: Phase relations
    concept: Displacement and acceleration in SHM differ in phase by π
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [phase-difference]
    stem: In SHM, what is the phase difference between the displacement and the acceleration of the particle?
    options:
      - π/2
      - π/4
      - zero
      - π
    answer: 3
    explanation: a = −ω^2x, so acceleration is always opposite in direction to displacement; the phase difference is π. Velocity, not acceleration, differs from displacement by π/2.

  - id: phy-osc-021
    topic: shm-equation
    subtopic: Time between positions
    concept: Time from x = A/2 to x = A/√2 is T/24
    category: numerical
    format: direct
    difficulty: 4
    time: 100
    ncert: false
    battle: false
    tags: [time-between-positions, multi-concept]
    stem: A particle executes SHM with period 2.4 s about x = 0. What is the minimum time it takes to move from x = A/2 to x = A/√2?
    options:
      - 0.1 s
      - 0.2 s
      - 0.3 s
      - 0.05 s
    answer: 0
    explanation: From the mean position, x = A sin ωt reaches A/2 at ωt = π/6 (t = T/12) and A/√2 at ωt = π/4 (t = T/8). The difference is T/8 − T/12 = T/24 = 2.4/24 = 0.1 s.

  - id: phy-osc-022
    topic: shm-equation
    subtopic: Identifying SHM
    concept: A shifted cosine with argument (π/4 − 2ωt) is SHM with period π/ω
    category: application
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [shm-identification, ncert-line]
    stem: The function x = 3 cos(π/4 − 2ωt) represents
    options:
      - SHM with period 2π/ω
      - SHM with period π/ω
      - periodic but non-SHM motion with period π/ω
      - non-periodic motion
    answer: 1
    explanation: cos(π/4 − 2ωt) = cos(2ωt − π/4), a single sinusoid with angular frequency 2ω. So it is SHM of amplitude 3 and period 2π/(2ω) = π/ω. The minus sign in front of 2ωt only changes the phase constant.

  - id: phy-osc-023
    topic: shm-equation
    subtopic: Superposition of SHMs
    concept: Two equal SHMs 120° apart combine to amplitude A
    category: numerical
    format: direct
    difficulty: 4
    time: 90
    ncert: false
    battle: false
    formula: R = √(A_1^2 + A_2^2 + 2A_1A_2 cos φ)
    tags: [superposition, phasor, multi-concept]
    stem: A particle is subjected simultaneously to two SHMs along the same line, x_1 = A sin ωt and x_2 = A sin(ωt + 2π/3). What is the amplitude of the resultant motion?
    options:
      - 2A
      - √3 A
      - A/2
      - A
    answer: 3
    explanation: R^2 = A^2 + A^2 + 2A^2 cos 120° = 2A^2 − A^2 = A^2, so R = A. √3 A comes from wrongly using cos 60° instead of cos 120°.

  - id: phy-osc-024
    topic: shm-equation
    subtopic: Reading the SHM equation
    concept: Angular frequency and frequency from x = A cos ωt
    category: numerical
    format: direct
    difficulty: 2
    time: 35
    ncert: true
    battle: true
    tags: [shm-equation, frequency]
    stem: The displacement of an oscillator is x = 0.1 cos(20t) m, t in seconds. Its frequency is
    options:
      - 20 Hz
      - 10 Hz
      - 10/π Hz
      - 20π Hz
    answer: 2
    explanation: ω = 20 rad s^{-1}, so ν = ω/2π = 20/(2π) = 10/π Hz ≈ 3.2 Hz. Reading 20 as the frequency ignores the difference between angular frequency and frequency.

  - id: phy-osc-025
    topic: shm-equation
    subtopic: Phase difference
    concept: Phase difference between x = A sin ωt and x = A cos ωt
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: false
    battle: true
    tags: [phase-difference]
    stem: Two particles execute SHM as x_1 = A sin ωt and x_2 = A cos ωt. The phase difference between them is
    options:
      - π/2
      - π
      - zero
      - π/4
    answer: 0
    explanation: A cos ωt = A sin(ωt + π/2), so the second particle leads the first by π/2. When one is at the mean position, the other is at an extreme.

  - id: phy-osc-026
    topic: shm-circular-motion
    subtopic: Reference circle
    concept: Projection of uniform circular motion on a diameter is SHM
    category: concept
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    tags: [reference-circle, ncert-line]
    stem: A particle moves uniformly in a circle. The foot of the perpendicular from it onto a diameter executes
    options:
      - uniform motion along the diameter
      - uniformly accelerated motion
      - simple harmonic motion
      - circular motion
    answer: 2
    explanation: If the radius makes angle ωt + φ with the x-axis, the projection is x = A cos(ωt + φ), which is SHM with amplitude equal to the radius and angular frequency equal to the angular speed of the particle.

  - id: phy-osc-027
    topic: shm-circular-motion
    subtopic: Speed of the projection
    concept: Maximum speed of the projection equals the speed on the circle, ωR
    category: numerical
    format: direct
    difficulty: 2
    time: 45
    ncert: true
    battle: false
    formula: v_{max} = ωA
    tags: [reference-circle, max-speed]
    stem: A particle moves in a circle of radius 0.2 m making 3 revolutions per second. What is the maximum speed of its projection on a diameter?
    options:
      - 0.6 m s^{-1}
      - 1.2π m s^{-1}
      - 0.6π m s^{-1}
      - 3.6π m s^{-1}
    answer: 1
    explanation: The projection executes SHM with A = 0.2 m and ω = 2π × 3 = 6π rad s^{-1}. Its maximum speed, at the centre, is ωA = 6π × 0.2 = 1.2π m s^{-1} ≈ 3.8 m s^{-1}, equal to the particle's speed on the circle.

  - id: phy-osc-028
    topic: shm-circular-motion
    subtopic: Reference circle
    concept: Projection of centripetal acceleration gives a = −ω^2x
    category: concept
    format: assertion-reason
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [reference-circle, acceleration]
    stem: |-
      Assertion (A): The projection of a uniform circular motion on a diameter of the circle is simple harmonic.
      Reason (R): The component of the centripetal acceleration along the diameter is proportional to the displacement of the projection and directed towards the centre.
    options:
      - Both A and R are true and R is the correct explanation of A
      - Both A and R are true but R is not the correct explanation of A
      - A is true but R is false
      - A is false but R is true
    answer: 0
    explanation: The centripetal acceleration ω^2A points towards the centre; its component along the x-diameter is −ω^2A cos(ωt + φ) = −ω^2x. Acceleration proportional to and opposite to displacement is the defining condition of SHM, so R correctly explains A.

  - id: phy-osc-029
    topic: shm-circular-motion
    subtopic: Uniform circular motion itself
    concept: Uniform circular motion is periodic but is not itself SHM
    category: concept
    format: direct
    difficulty: 2
    time: 35
    ncert: true
    battle: true
    tags: [reference-circle, trap]
    stem: Which statement about uniform circular motion is correct?
    options:
      - It is SHM because its speed is constant
      - It is periodic, and its projection on a diameter is SHM
      - It is non-periodic but its projection is SHM
      - It is SHM of amplitude equal to the diameter
    answer: 1
    explanation: Uniform circular motion repeats every revolution, so it is periodic, but it is two-dimensional motion and not a to-and-fro motion along a line. Its projection on any diameter is SHM with amplitude equal to the radius, not the diameter.

  - id: phy-osc-030
    topic: shm-circular-motion
    subtopic: Correspondence of quantities
    concept: Radius of the reference circle equals the amplitude of SHM
    category: factual
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    tags: [reference-circle]
    stem: In the reference-circle picture of SHM, the radius of the circle corresponds to the
    options:
      - period of the SHM
      - maximum speed of the SHM
      - phase constant of the SHM
      - amplitude of the SHM
    answer: 3
    explanation: The projection x = R cos(ωt + φ) swings between −R and +R, so the radius R equals the amplitude A. The angular speed of the reference particle equals ω, and its initial angle equals the phase constant φ.

  - id: phy-osc-031
    topic: shm-circular-motion
    subtopic: Reference circle angle
    concept: The angle of the radius vector gives the phase
    category: application
    format: direct
    difficulty: 3
    time: 60
    ncert: true
    battle: false
    tags: [reference-circle, phase-constant]
    stem: A particle moves anticlockwise on a circle of radius 4 cm with period 6 s. At t = 0 its radius vector makes 30° with the +x axis. Which equation gives the x-projection of its motion (x in cm, t in s)?
    options:
      - x = 4 cos(πt/3 + π/6)
      - x = 4 cos(πt/6 + π/6)
      - x = 4 sin(πt/3 + π/6)
      - x = 2 cos(πt/3 + π/6)
    answer: 0
    explanation: ω = 2π/T = 2π/6 = π/3 rad s^{-1}. The angle of the radius at time t is ωt + π/6, and the x-projection is R cos(angle) = 4 cos(πt/3 + π/6). The sine form gives the y-projection, and 2 cm would wrongly halve the radius.

  - id: phy-osc-032
    topic: shm-circular-motion
    subtopic: Acceleration of the projection
    concept: Maximum acceleration of the projection equals the centripetal acceleration
    category: numerical
    format: direct
    difficulty: 2
    time: 40
    ncert: true
    battle: true
    formula: a_{max} = ω^2A
    tags: [reference-circle, acceleration]
    stem: A particle moves in a circle of radius 0.5 m with angular speed 4 rad s^{-1}. What is the maximum acceleration of its projection on a diameter?
    options:
      - 2 m s^{-2}
      - 4 m s^{-2}
      - 16 m s^{-2}
      - 8 m s^{-2}
    answer: 3
    explanation: The projection's maximum acceleration occurs at the extremes, where it equals the full centripetal acceleration ω^2R = 16 × 0.5 = 8 m s^{-2}. 2 m s^{-2} is ωR, the maximum speed, not the acceleration.

  - id: phy-osc-033
    topic: velocity-acceleration
    subtopic: Velocity as a function of position
