questions:
  - id: phy-dual-001
    topic: electron-emission
    subtopic: Work function
    concept: Definition of work function
    category: factual
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    tags: [work-function, ncert-line]
    stem: The minimum energy required by an electron to escape from a metal surface is called the
    options:
      - ionisation energy
      - stopping potential
      - threshold frequency
      - work function
    answer: 3
    explanation: The work function φ_0 is the minimum energy an electron needs to escape from the metal surface. Ionisation energy refers to a free atom, not a metal surface, and threshold frequency is a frequency, not an energy.

  - id: phy-dual-002
    topic: electron-emission
    subtopic: Work function
    concept: Unit commonly used for work function
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [work-function, units]
    stem: Work function of metals is usually expressed in electron volt. One electron volt equals
    options:
      - 1.6 × 10^{19} J
      - 1.6 × 10^{-19} C
      - 9.1 × 10^{-31} J
      - 1.6 × 10^{-19} J
    answer: 3
    explanation: 1 eV is the energy gained by an electron accelerated through 1 V, so 1 eV = 1.6 × 10^{-19} C × 1 V = 1.6 × 10^{-19} J. The coulomb is the unit of charge, not energy.

  - id: phy-dual-003
    topic: electron-emission
    subtopic: Types of electron emission
    concept: Thermionic emission uses heat
    category: factual
    format: match
    difficulty: 2
    time: 45
    ncert: true
    battle: false
    tags: [thermionic, field-emission, photoelectric, ncert-line]
    stem: |-
      Match the type of electron emission in List I with the source of energy in List II.
      List I: P. Thermionic emission, Q. Field emission, R. Photoelectric emission, S. Secondary emission
      List II: 1. Light of suitable frequency, 2. Strong electric field (about 10^8 V m^{-1}), 3. Heating the metal, 4. Bombardment by fast electrons
    options:
      - P-1, Q-2, R-3, S-4
      - P-3, Q-4, R-1, S-2
      - P-2, Q-3, R-4, S-1
      - P-3, Q-2, R-1, S-4
    answer: 3
    explanation: Thermionic emission uses heat, field emission uses a very strong electric field (of order 10^8 V m^{-1}), photoelectric emission uses light, and secondary emission is caused by fast electrons striking the surface.

  - id: phy-dual-004
    topic: electron-emission
    subtopic: Work function
    concept: Work function depends on nature of metal and surface
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [work-function, trap]
    stem: The work function of a metal depends on
    options:
      - the intensity of the incident light
      - the frequency of the incident light
      - the potential applied to the collector plate
      - the nature of the metal and the condition of its surface
    answer: 3
    explanation: Work function is a property of the metal and its surface (impurities, oxide layers). It does not depend on the light used or on the external circuit.

  - id: phy-dual-005
    topic: electron-emission
    subtopic: Work function
    concept: Caesium has the lowest work function among common metals
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [work-function, ncert-line]
    stem: Which metal has the lowest work function and hence emits electrons even with visible light?
    options:
      - Platinum
      - Nickel
      - Copper
      - Caesium
    answer: 3
    explanation: Caesium has a work function of about 2.14 eV, the lowest in NCERT's table, so visible light can eject electrons from it. Platinum (≈5.65 eV) has one of the highest.

  - id: phy-dual-006
    topic: electron-emission
    subtopic: Free electrons in metals
    concept: Free electrons are held by attraction of positive ions
    category: concept
    format: direct
    difficulty: 2
    time: 35
    ncert: true
    battle: true
    tags: [free-electrons, surface-barrier]
    stem: Why do free electrons in a metal normally not escape from its surface?
    options:
      - They have no kinetic energy at room temperature
      - The surrounding air pressure pushes them back
      - They are bound to individual atoms like core electrons
      - They are pulled back by the attraction of the positive ions near the surface
    answer: 3
    explanation: Free electrons move randomly inside the metal but, on reaching the surface, the net pull of the positive ions draws them back. Energy at least equal to the work function must be supplied to escape.

  - id: phy-dual-007
    topic: electron-emission
    subtopic: Electron volt
    concept: Energy gained through potential difference in eV
    category: numerical
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    formula: E = eV
    tags: [electron-volt]
    stem: An electron is accelerated from rest through a potential difference of 200 V. Its kinetic energy is
    options:
      - 200 J
      - 3.2 × 10^{-21} J
      - 1.25 × 10^{-21} J
      - 3.2 × 10^{-17} J
    answer: 3
    explanation: K = eV = 1.6 × 10^{-19} × 200 = 3.2 × 10^{-17} J (that is, 200 eV). Writing 200 J confuses eV with joule.

  - id: phy-dual-008
    topic: electron-emission
    subtopic: Work function
    concept: Converting work function from eV to joule
    category: numerical
    format: direct
    difficulty: 2
    time: 35
    ncert: true
    battle: true
    tags: [work-function, electron-volt]
    stem: The work function of sodium is 2.75 eV. In joule this is about
    options:
      - 1.72 × 10^{-19} J
      - 2.75 × 10^{-19} J
      - 4.40 × 10^{-18} J
      - 4.40 × 10^{-19} J
    answer: 3
    explanation: 2.75 × 1.6 × 10^{-19} = 4.40 × 10^{-19} J. Dividing instead of multiplying by 1.6 gives the wrong value 1.72 × 10^{-19} J.

  - id: phy-dual-009
    topic: electron-emission
    subtopic: Types of electron emission
    concept: Field emission needs very strong electric field
    category: concept
    format: statement-pair
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [field-emission, thermionic]
    stem: |-
      Statement I: In field emission, electrons are pulled out of a metal by applying a very strong electric field of the order of 10^8 V m^{-1}.
      Statement II: In thermionic emission, heating gives free electrons enough thermal energy to overcome the work function.
    options:
      - Both Statement I and Statement II are correct
      - Both Statement I and Statement II are incorrect
      - Statement I is correct but Statement II is incorrect
      - Statement I is incorrect but Statement II is correct
    answer: 0
    explanation: Both are NCERT descriptions. A field of about 10^8 V m^{-1} can pull electrons out (field emission), and heating supplies thermal energy to cross the surface barrier (thermionic emission).

  - id: phy-dual-010
    topic: electron-emission
    subtopic: Electron volt
    concept: eV is a unit of energy, not potential
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: false
    battle: true
    tags: [electron-volt, trap]
    stem: The electron volt is a unit of
    options:
      - potential difference
      - charge
      - power
      - energy
    answer: 3
    explanation: The electron volt is the energy gained by an electron moving through 1 V, so it is a unit of energy. The word "volt" in its name tempts students to call it a unit of potential.

  - id: phy-dual-011
    topic: electron-emission
    subtopic: Work function
    concept: Work function of a metal changes with surface impurities
    category: concept
    format: assertion-reason
    difficulty: 3
    time: 60
    ncert: true
    battle: false
    tags: [work-function, surface]
    stem: |-
      Assertion (A): The work function of a metal can change if its surface gets oxidised or contaminated.
      Reason (R): The work function depends on the nature of the metal as well as on the condition of its surface.
    options:
      - Both A and R are true and R is the correct explanation of A
      - Both A and R are true but R is not the correct explanation of A
      - A is true but R is false
      - A is false but R is true
    answer: 0
    explanation: NCERT notes that the work function depends on the properties of the metal and the nature of its surface. Oxidation or impurities change the surface, and R explains exactly this.

  - id: phy-dual-012
    topic: photoelectric-discovery
    subtopic: Hertz's observation
    concept: Hertz observed spark enhancement by UV light
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [hertz, history, ncert-line]
    stem: In 1887, while studying electromagnetic waves, Hertz noticed that high voltage sparks across the detector loop were enhanced when the emitter plate was
    options:
      - heated strongly
      - kept in vacuum
      - placed in a strong magnetic field
      - illuminated by ultraviolet light
    answer: 3
    explanation: Hertz found that illuminating the emitter plate with ultraviolet light from an arc lamp enhanced the sparks, the first observation of the photoelectric effect.

  - id: phy-dual-013
    topic: photoelectric-discovery
    subtopic: Hallwachs and Lenard
    concept: UV makes a negatively charged zinc plate lose charge
    category: factual
    format: direct
    difficulty: 2
    time: 35
    ncert: true
    battle: true
    tags: [hallwachs, history, ncert-line]
    stem: Hallwachs found that a negatively charged zinc plate connected to an electroscope, when illuminated with ultraviolet light,
    options:
      - gained more negative charge
      - showed no change at all
      - became strongly magnetised
      - lost its charge
    answer: 3
    explanation: UV light ejected electrons from the negatively charged zinc plate, so it lost its charge. An uncharged plate became positively charged for the same reason.

  - id: phy-dual-014
    topic: photoelectric-discovery
    subtopic: Hallwachs and Lenard
    concept: Positively charged plate's charge increases further
    category: concept
    format: direct
    difficulty: 3
    time: 45
    ncert: true
    battle: true
    tags: [hallwachs, trap]
    stem: A positively charged zinc plate is illuminated with ultraviolet light. Its positive charge
    options:
      - decreases to zero
      - becomes negative
      - remains exactly the same in all cases
      - increases further
    answer: 3
    explanation: Ultraviolet light ejects electrons from zinc, so the plate loses negative charge and its positive charge increases further. It cannot become negative because electrons are only removed.

  - id: phy-dual-015
    topic: photoelectric-discovery
    subtopic: Photosensitive substances
    concept: Alkali metals respond to visible light
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [alkali-metals, ncert-line]
    stem: Which group of metals shows photoelectric emission even with visible light?
    options:
      - Zinc, cadmium and magnesium
      - Iron, cobalt and nickel
      - Copper, silver and gold
      - Lithium, sodium, potassium, caesium and rubidium
    answer: 3
    explanation: Alkali metals like Li, Na, K, Cs and Rb have low work functions and emit electrons with visible light. Zn, Cd and Mg respond only to ultraviolet light of short wavelength.

  - id: phy-dual-016
    topic: photoelectric-discovery
    subtopic: Photosensitive substances
    concept: Zinc, cadmium, magnesium need UV
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [ncert-line, ultraviolet]
    stem: Metals like zinc, cadmium and magnesium show photoelectric emission only with
    options:
      - infrared radiation
      - red light
      - radio waves
      - ultraviolet light of short wavelength
    answer: 3
    explanation: These metals have relatively high work functions, so only short wavelength ultraviolet light has photons energetic enough to eject electrons.

  - id: phy-dual-017
    topic: photoelectric-discovery
    subtopic: Photoelectrons
    concept: Photoelectrons are ordinary electrons
    category: concept
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    tags: [photoelectrons]
    stem: The particles emitted from a metal surface in the photoelectric effect are
    options:
      - photons
      - protons
      - electrons
      - positive ions
    answer: 2
    explanation: Light ejects electrons, called photoelectrons, from the metal. Photons are what is absorbed, not what is emitted.

  - id: phy-dual-018
    topic: photoelectric-discovery
    subtopic: Lenard's experiment
    concept: Current flows only when emitter is illuminated
    category: concept
    format: case
    difficulty: 3
    time: 60
    ncert: true
    battle: false
    tags: [lenard, experiment]
    stem: In Lenard's experiment, two metal plates are sealed in an evacuated tube and connected to a battery. Current flows in the circuit when ultraviolet light falls on the emitter plate and stops as soon as the light is cut off. This shows that
    options:
      - ultraviolet light makes the gas in the tube conduct
      - ultraviolet light heats the collector until it emits electrons
      - the battery supplies electrons across the vacuum on its own
      - light ejects charged particles from the emitter that travel to the collector
    answer: 3
    explanation: With no gas in the tube, the current must be carried by particles ejected by light from the emitter and attracted to the collector. When the light stops, emission stops and the current stops.

  - id: phy-dual-019
    topic: photoelectric-discovery
    subtopic: Threshold frequency
    concept: No emission below threshold frequency
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [threshold-frequency]
    stem: Photoelectric emission from a given metal does not occur if the frequency of the incident light is
    options:
      - greater than the threshold frequency
      - in the ultraviolet region
      - equal to twice the threshold frequency
      - less than the threshold frequency
    answer: 3
    explanation: Each metal has a threshold frequency ν_0. Below it, no electrons are emitted however intense the light is.

  - id: phy-dual-020
    topic: photoelectric-discovery
    subtopic: Photosensitive substances
    concept: Metals sensitive to visible light
    category: application
    format: multi-statement
    difficulty: 3
    time: 60
    ncert: true
    battle: false
    tags: [alkali-metals, ncert-line]
    stem: |-
      Which of these metals can emit photoelectrons with visible light?
      I. Potassium
      II. Zinc
      III. Caesium
      IV. Magnesium
    options:
      - I and III only
      - II and IV only
      - I, II and III only
      - III and IV only
    answer: 0
    explanation: Potassium and caesium are alkali metals with low work functions and respond to visible light. Zinc and magnesium need ultraviolet light.

  - id: phy-dual-021
    topic: photoelectric-discovery
    subtopic: Hallwachs and Lenard
    concept: Uncharged zinc plate becomes positive under UV
    category: concept
    format: direct
    difficulty: 2
    time: 35
    ncert: true
    battle: true
    tags: [hallwachs]
    stem: An uncharged zinc plate on an insulated stand is exposed to ultraviolet light. It becomes
    options:
      - negatively charged
      - alternately positive and negative
      - neutral with no change
      - positively charged
    answer: 3
    explanation: Ultraviolet light removes electrons from zinc. Losing negative charge leaves the plate positively charged.

  - id: phy-dual-022
    topic: photoelectric-discovery
    subtopic: Hallwachs and Lenard
    concept: Photoelectric emission shown to be negatively charged particles
    category: factual
    format: statements
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [history, hallwachs, lenard]
    stem: Which statement about the early photoelectric experiments is correct?
    options:
      - Hallwachs and Lenard concluded that negatively charged particles are emitted when light of suitable frequency falls on the plate
      - Hertz explained the effect using the photon idea
      - Lenard found that visible light ejects electrons from every metal
      - Einstein first discovered the effect while studying sparks
    answer: 0
    explanation: Hallwachs and Lenard concluded that negatively charged particles (electrons) are emitted from the surface by light above a threshold frequency. Hertz discovered the effect but could not explain it; Einstein explained it later in 1905.

  - id: phy-dual-023
    topic: photoelectric-experiment
    subtopic: Effect of intensity
    concept: Photocurrent proportional to intensity
    category: concept
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    tags: [intensity, photocurrent]
    stem: For light above the threshold frequency, the photoelectric current is directly proportional to the
    options:
      - frequency of the light
      - wavelength of the light
      - intensity of the light
      - work function of the metal
    answer: 2
    explanation: The number of photoelectrons emitted per second, and hence the photocurrent, is directly proportional to the intensity of incident light (for ν > ν_0).

  - id: phy-dual-024
    topic: photoelectric-experiment
    subtopic: Stopping potential
    concept: Stopping potential measures maximum KE
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    formula: K_{max} = eV_0
    tags: [stopping-potential]
    stem: The stopping potential in a photoelectric experiment is related to the
    options:
      - average kinetic energy of photoelectrons
      - number of photoelectrons emitted per second
      - maximum kinetic energy of photoelectrons
      - work function of the collector
    answer: 2
    explanation: The stopping potential V_0 is the minimum negative collector potential that stops even the fastest photoelectrons, so K_{max} = eV_0.

  - id: phy-dual-025
    topic: photoelectric-experiment
    subtopic: Stopping potential
    concept: Stopping potential independent of intensity
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [stopping-potential, intensity, trap]
    stem: The intensity of monochromatic light falling on a photosensitive surface is doubled. The stopping potential
    options:
      - doubles
      - becomes half
      - remains unchanged
      - becomes four times
    answer: 2
    explanation: For a given frequency, the stopping potential (maximum kinetic energy) does not depend on intensity. Doubling intensity only doubles the number of photoelectrons, and hence the saturation current.

  - id: phy-dual-026
    topic: photoelectric-experiment
    subtopic: Stopping potential and frequency
    concept: Stopping potential increases linearly with frequency
    category: concept
    format: graph
    difficulty: 2
    time: 40
    ncert: true
    battle: true
    tags: [graph, stopping-potential, frequency]
    stem: For a given metal, the graph of stopping potential V_0 against frequency ν of incident light is
    options:
      - a straight line with a positive intercept on the frequency axis
      - a straight line passing through the origin
      - a parabola opening upward
      - a straight line parallel to the frequency axis
    answer: 0
    explanation: V_0 = (h/e)ν − φ_0/e, a straight line of slope h/e that cuts the frequency axis at the threshold frequency ν_0. It does not pass through the origin because of the work function.

  - id: phy-dual-027
    topic: photoelectric-experiment
    subtopic: Saturation current
    concept: Saturation current when all emitted electrons are collected
    category: concept
    format: direct
    difficulty: 2
    time: 35
    ncert: true
    battle: true
    tags: [saturation-current]
    stem: As the positive potential of the collector is increased, the photocurrent reaches a constant value called saturation current because
    options:
      - the metal's work function increases
      - the collector starts emitting electrons
      - the light intensity decreases
      - all the photoelectrons emitted by the emitter are collected
    answer: 3
    explanation: At a large enough accelerating potential, every photoelectron emitted reaches the collector. The current can grow no further unless more electrons are emitted, which needs more intensity.

  - id: phy-dual-028
    topic: photoelectric-experiment
    subtopic: Effect of potential
    concept: Current at zero collector potential is non-zero
    category: concept
    format: direct
    difficulty: 3
    time: 45
    ncert: true
    battle: true
    tags: [photocurrent, trap]
    stem: When the collector plate is at the same potential as the emitter (zero applied potential), the photocurrent is
    options:
      - zero, because there is no accelerating field
      - equal to the saturation current always
      - non-zero, because photoelectrons leave the emitter with some kinetic energy
      - negative, flowing from collector to emitter
    answer: 2
    explanation: Photoelectrons are emitted with kinetic energies up to K_{max}, so some reach the collector even with no applied potential. Current becomes zero only at the stopping potential.

  - id: phy-dual-029
    topic: photoelectric-experiment
    subtopic: Stopping potential
    concept: KE_max from stopping potential
    category: numerical
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    formula: K_{max} = eV_0
    tags: [stopping-potential]
    stem: The stopping potential in a photoelectric experiment is 1.5 V. The maximum kinetic energy of the photoelectrons is
    options:
      - 1.5 eV
      - 1.5 J
      - 3.0 eV
      - 0.75 eV
    answer: 0
    explanation: K_{max} = eV_0 = e × 1.5 V = 1.5 eV (2.4 × 10^{-19} J). Writing 1.5 J confuses eV with joule.

  - id: phy-dual-030
    topic: photoelectric-experiment
    subtopic: Effect of intensity
    concept: I–V curves for different intensities share stopping potential
    category: concept
    format: graph
    difficulty: 3
    time: 60
    ncert: true
    battle: false
    tags: [graph, intensity, saturation-current]
    stem: Photocurrent versus collector potential curves are drawn for the same frequency but three different intensities I_1 > I_2 > I_3. The curves
    options:
      - have the same saturation current but different stopping potentials
      - coincide completely
      - have different saturation currents and different stopping potentials
      - have different saturation currents but meet the voltage axis at the same stopping potential
    answer: 3
    explanation: Saturation current is proportional to intensity, so the plateaus differ. The stopping potential depends only on frequency, so all curves reach zero current at the same −V_0.

  - id: phy-dual-031
    topic: photoelectric-experiment
    subtopic: Effect of frequency
    concept: I–V curves for different frequencies at same intensity
    category: concept
    format: graph
    difficulty: 3
    time: 60
    ncert: true
    battle: false
    tags: [graph, frequency, stopping-potential]
    stem: Photocurrent versus collector potential curves are drawn for three frequencies ν_1 > ν_2 > ν_3 of incident radiation, with intensity adjusted so that the saturation currents are equal. Which statement is correct?
    options:
      - The stopping potential is largest for ν_3
      - All three curves have the same stopping potential
      - The saturation current is largest for ν_1
      - The stopping potential is largest for ν_1
    answer: 3
    explanation: A higher frequency gives photoelectrons more maximum kinetic energy, so a larger negative potential is needed to stop them. The curve for ν_1 meets the voltage axis farthest to the left.

  - id: phy-dual-032
    topic: photoelectric-experiment
    subtopic: Instantaneous emission
    concept: Photoemission is instantaneous
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [time-lag, ncert-line]
    stem: The time lag between incidence of suitable radiation and emission of photoelectrons is of the order of
    options:
      - 10^{-9} s or less
      - 1 s
      - a few minutes
      - several hours for dim light
    answer: 0
    explanation: Photoelectric emission is practically instantaneous, with a time lag of 10^{-9} s or less, even when the light is very dim.

  - id: phy-dual-033
    topic: photoelectric-experiment
    subtopic: Experimental setup
    concept: Evacuated tube in photoelectric apparatus
    category: concept
    format: direct
    difficulty: 2
    time: 35
    ncert: true
    battle: true
    tags: [experiment, apparatus]
    stem: In the experimental arrangement for studying the photoelectric effect, the emitter and collector are enclosed in an evacuated glass tube so that
    options:
      - photoelectrons do not collide with air molecules on their way to the collector
      - the tube does not break under high voltage
      - ultraviolet light is converted into visible light
      - the emitter stays cold
    answer: 0
    explanation: Air molecules would scatter or absorb the photoelectrons and could get ionised. Vacuum lets the emitted electrons travel freely to the collector.

  - id: phy-dual-034
    topic: photoelectric-experiment
    subtopic: Experimental setup
    concept: Quartz window transmits UV
    category: factual
    format: direct
    difficulty: 3
    time: 40
    ncert: true
    battle: true
    tags: [apparatus, ncert-line, quartz]
    stem: The evacuated tube used to study the photoelectric effect has a quartz window because quartz
    options:
      - is a good conductor of electricity
      - absorbs all infrared radiation
      - allows ultraviolet radiation to pass through
      - makes the light monochromatic
    answer: 2
    explanation: Ordinary glass absorbs ultraviolet light, but quartz transmits it. The window lets UV reach the emitter plate.

  - id: phy-dual-035
    topic: wave-theory-failure
    subtopic: Wave theory predictions
    concept: Wave theory predicts KE increases with intensity
    category: concept
    format: direct
    difficulty: 2
    time: 40
    ncert: true
    battle: true
    tags: [wave-theory]
    stem: According to the wave picture of light, increasing the intensity of light falling on a metal should
    options:
      - increase the maximum kinetic energy of emitted electrons
      - decrease the kinetic energy of emitted electrons
      - not affect the kinetic energy at all
      - stop the emission completely
    answer: 0
    explanation: In the wave picture, a more intense wave carries greater energy density, so electrons should absorb more energy and come out faster. Experiment shows K_{max} does not depend on intensity.

  - id: phy-dual-036
    topic: wave-theory-failure
    subtopic: Threshold frequency
    concept: Wave theory cannot explain threshold frequency
    category: concept
    format: direct
    difficulty: 2
    time: 40
    ncert: true
    battle: true
    tags: [wave-theory, threshold-frequency]
    stem: Which observation of the photoelectric effect is impossible to explain with the wave theory of light?
    options:
      - Emission of electrons from metals
      - Increase of photocurrent with intensity
      - Existence of a threshold frequency below which no emission occurs at any intensity
      - Emission of electrons in vacuum
    answer: 2
    explanation: A wave of any frequency, if intense enough or given enough time, should supply the needed energy. The existence of a sharp threshold frequency cannot be explained this way.

  - id: phy-dual-037
    topic: wave-theory-failure
    subtopic: Time lag
    concept: Wave theory predicts time lag for weak light
    category: concept
