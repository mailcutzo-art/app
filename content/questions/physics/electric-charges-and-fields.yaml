      - III and IV only
      - I, II and IV only
      - II and III only
    answer: 3
    explanation: Induction works without contact and the inducing rod keeps its charge (II true, I false). Conduction shares charge, so the sign is the same (III true). An earthed conductor near a charged rod holds an induced charge of opposite sign, so IV is false.

