questions:
  - id: phy-ecf-001
    topic: charging-methods
    subtopic: Charging by friction
    concept: Glass rubbed with silk becomes positive, silk negative
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [charging-by-friction, ncert-line]
    stem: A glass rod is rubbed with silk. What charges do the rod and the silk acquire?
    options:
      - Glass negative, silk positive
      - Both become positive
      - Glass positive, silk negative
      - Glass positive, silk remains neutral
    answer: 2
    explanation: Electrons are transferred from glass to silk during rubbing, so glass becomes positive and silk becomes equally negative. Charge is transferred, not created, so the silk cannot stay neutral.

  - id: phy-ecf-002
    topic: charging-methods
    subtopic: Mechanism of charging
    concept: Charging by rubbing transfers electrons, not protons
    category: concept
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    tags: [charging-by-friction, trap]
    stem: When a body becomes positively charged by rubbing, what has happened to it?
    options:
      - It has gained protons
      - It has lost electrons
      - It has lost neutrons
      - It has gained positrons
    answer: 1
    explanation: Only the loosely bound outer electrons move during rubbing; protons are locked in the nuclei. A body with a deficit of electrons is positively charged. Gaining protons is the common misconception.

  - id: phy-ecf-003
    topic: charging-methods
    subtopic: Charging by induction
    concept: Induction gives the conductor a charge opposite to the inducing charge
    category: concept
    format: direct
    difficulty: 2
    time: 35
    ncert: true
    battle: true
    tags: [induction]
    stem: A negatively charged rod is held near an isolated metal sphere, the sphere is earthed and then the earth link is removed before the rod. The sphere ends up
    options:
      - positively charged
      - negatively charged
      - neutral
      - positive on the near side and negative on the far side
    answer: 0
    explanation: The rod repels electrons in the sphere to the far side; earthing lets these electrons flow to ground. Breaking the earth link first traps the deficit, so after the rod is removed the sphere is left with a net positive charge spread over its surface.

  - id: phy-ecf-004
    topic: charging-methods
    subtopic: Conductors and insulators
    concept: Charge on a conductor spreads over it; on an insulator it stays put
    category: concept
    format: statements
    difficulty: 2
    time: 40
    ncert: true
    battle: false
    tags: [conductors, insulators]
    stem: Which statement about conductors and insulators is correct?
    options:
      - Charge given to an insulator immediately spreads over its whole surface
      - Metals are insulators because their electrons are tightly bound
      - Charge given to a conductor gets distributed over its entire surface
      - The human body is a good insulator
    answer: 2
    explanation: Conductors have free electrons, so any charge placed on them redistributes over the whole surface. On an insulator the charge stays where it is placed. Metals and the human body are conductors.

  - id: phy-ecf-005
    topic: charging-methods
    subtopic: Attraction of neutral bodies
    concept: A charged body attracts a neutral light body by induced polarisation
    category: application
    format: case
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [induction, trap]
    stem: A charged comb attracts small bits of neutral paper. Which explanation is correct?
    options:
      - The comb transfers charge to the paper before touching it
      - Paper is always slightly charged opposite to the comb
      - Gravity is enhanced near the charged comb
      - The comb induces opposite charge on the near side of the paper, and the attraction there exceeds the repulsion on the far side
    answer: 3
    explanation: The comb polarises the paper, inducing unlike charge on the nearer side and like charge on the farther side. Because force decreases with distance, the net force is attractive. No charge needs to be transferred for attraction.

  - id: phy-ecf-006
    topic: charge-properties
    subtopic: Quantisation of charge
    concept: Number of electrons from total charge, n = q/e
    category: numerical
    format: direct
    difficulty: 1
    time: 30
    ncert: true
    battle: true
    formula: q = ne
    tags: [quantisation]
    stem: How many electrons must be removed from a neutral body to give it a charge of +1.6 μC? (e = 1.6 × 10^{-19} C)
    options:
      - 10^{12}
      - 10^{13}
      - 10^{19}
      - 10^{6}
    answer: 1
    explanation: n = q/e = 1.6 × 10^{-6} / 1.6 × 10^{-19} = 10^{13}. Removing electrons makes the body positive.

  - id: phy-ecf-007
    topic: charge-properties
    subtopic: Quantisation of charge
    concept: A charge must be an integral multiple of e
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [quantisation, trap]
    stem: Which of these cannot be the charge on an isolated body? (e = 1.6 × 10^{-19} C)
    options:
      - 3.2 × 10^{-19} C
      - 4.8 × 10^{-19} C
      - 2.4 × 10^{-19} C
      - 1.6 × 10^{-18} C
    answer: 2
    explanation: Charge is quantised, q = ne with integer n. 2.4 × 10^{-19} C is 1.5e, not an integer multiple, so it is impossible. The others are 2e, 3e and 10e.

  - id: phy-ecf-008
    topic: charge-properties
    subtopic: Additivity of charge
    concept: Charges add algebraically like scalars
    category: numerical
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [additivity]
    stem: A system contains charges +5 μC, −3 μC, +2 μC and −6 μC. What is its total charge?
    options:
      - +16 μC
      - −2 μC
      - +2 μC
      - "0"
    answer: 1
    explanation: Charge is a scalar and adds algebraically, 5 − 3 + 2 − 6 = −2 μC. Adding magnitudes (16 μC) ignores signs.

  - id: phy-ecf-009
    topic: charge-properties
    subtopic: Conservation of charge
    concept: Total charge of an isolated system is conserved
    category: application
    format: direct
    difficulty: 2
    time: 40
    ncert: true
    battle: true
    tags: [conservation]
    stem: Two identical metal spheres carrying +8 μC and −2 μC are touched and separated. What is the charge on each?
    options:
      - +5 μC each
      - +4 μC and −1 μC
      - +6 μC each
      - +3 μC each
    answer: 3
    explanation: Total charge is conserved, 8 − 2 = +6 μC, and identical spheres share it equally, giving +3 μC each.

  - id: phy-ecf-010
    topic: charge-properties
    subtopic: Conservation in nuclear processes
    concept: In pair production charge is conserved
    category: concept
    format: assertion-reason
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [conservation, multi-concept]
    stem: |-
      Assertion (A): A γ-ray photon can create an electron–positron pair.
      Reason (R): Total charge before and after the process is zero, so charge is conserved.
    options:
      - Both A and R are true and R is the correct explanation of A
      - Both A and R are true but R is not the correct explanation of A
      - A is true but R is false
      - A is false but R is true
    answer: 0
    explanation: A neutral photon produces an electron (−e) and a positron (+e); net charge stays zero. Charge conservation is exactly what allows charged particles to be created only in equal and opposite pairs, so R explains A.

  - id: phy-ecf-011
    topic: coulombs-law
    subtopic: Coulomb force in vacuum
    concept: F = kq_1q_2/r^2 numerical
    category: numerical
    format: direct
    difficulty: 2
    time: 45
    ncert: true
    battle: true
    formula: F = kq_1q_2/r^2
    tags: [coulomb-force]
    stem: Two point charges of 2 μC and 3 μC are 30 cm apart in vacuum. The force between them is
    options:
      - 0.06 N
      - 6 N
      - 0.18 N
      - 0.6 N
    answer: 3
    explanation: F = 9 × 10^9 × 2 × 10^{-6} × 3 × 10^{-6} / (0.3)^2 = 0.054/0.09 = 0.6 N. Forgetting to square the distance gives 0.18 N.

  - id: phy-ecf-012
    topic: coulombs-law
    subtopic: Inverse square dependence
    concept: Halving separation makes force four times
    category: numerical
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    formula: F ∝ 1/r^2
    tags: [inverse-square]
    stem: The force between two point charges is F. If the distance between them is halved, the force becomes
    options:
      - 4F
      - 2F
      - F/2
      - F/4
    answer: 0
    explanation: F ∝ 1/r^2, so halving r multiplies F by 2^2 = 4.

  - id: phy-ecf-013
    topic: coulombs-law
    subtopic: Force in a medium
    concept: Force in a medium is reduced by dielectric constant K
    category: numerical
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    formula: F_m = F/K
    tags: [dielectric-constant]
    stem: Two charges exert a force of 20 N on each other in air. What is the force when they are placed at the same separation in a medium of dielectric constant 5?
    options:
      - 100 N
      - 4 N
      - 20 N
      - 0.8 N
    answer: 1
    explanation: In a medium, F_m = F/K = 20/5 = 4 N. The medium reduces the force, so 100 N is the opposite error.

  - id: phy-ecf-014
    topic: coulombs-law
    subtopic: Coulomb's constant
    concept: Value and units of 1/4πε_0
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [constants, ncert-line]
    stem: The value of 1/4πε_0 in SI units is approximately
    options:
      - 8.85 × 10^{-12} N m^2 C^{-2}
      - 9 × 10^{-9} N m^2 C^{-2}
      - 9 × 10^9 C^2 N^{-1} m^{-2}
      - 9 × 10^9 N m^2 C^{-2}
    answer: 3
    explanation: k = 1/4πε_0 ≈ 9 × 10^9 N m^2 C^{-2}. 8.85 × 10^{-12} C^2 N^{-1} m^{-2} is ε_0 itself, with different units.

  - id: phy-ecf-015
    topic: coulombs-law
    subtopic: Sharing charge and new force
    concept: Touching identical spheres with +q and −3q changes force
    category: application
    format: direct
    difficulty: 4
    time: 90
    ncert: false
    battle: false
    formula: F = kq_1q_2/r^2
    tags: [conservation, multi-concept, trap]
    stem: Two identical small conducting spheres with charges +q and −3q attract each other with force F at separation r. They are touched and returned to separation r. The new force is
    options:
      - F/3, attractive
      - F/3, repulsive
      - 3F, repulsive
      - F, repulsive
    answer: 1
    explanation: Initially F = 3kq^2/r^2 (attractive). After contact each sphere has (q − 3q)/2 = −q, so the new force is kq^2/r^2 = F/3 and, with like charges, repulsive.

  - id: phy-ecf-016
    topic: superposition-forces
    subtopic: Equilateral triangle
    concept: Net force on a charge at a vertex of an equilateral triangle of equal charges
    category: numerical
    format: direct
    difficulty: 3
    time: 60
    ncert: true
    battle: false
    formula: F_net = √3 kq^2/a^2
    tags: [superposition, vector-addition]
    stem: Three equal charges q are placed at the vertices of an equilateral triangle of side a. The magnitude of the net force on any one charge is (k = 1/4πε_0)
    options:
      - 2kq^2/a^2
      - kq^2/a^2
      - √3 kq^2/a^2
      - "0"
    answer: 2
    explanation: Each of the other two charges exerts kq^2/a^2 and the angle between these forces is 60°. Resultant = 2F cos 30° = √3 kq^2/a^2.

  - id: phy-ecf-017
    topic: superposition-forces
    subtopic: Principle of superposition
    concept: Force between two charges is unaffected by other charges
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [superposition, ncert-line]
    stem: According to the superposition principle, the force between two charges q_1 and q_2 in the presence of a third charge q_3
    options:
      - increases
      - decreases
      - becomes zero
      - is the same as when q_3 is absent
    answer: 3
    explanation: Each pair interaction is independent of other charges. The net force on q_1 changes because q_3 adds its own force, but the force due to q_2 alone is unchanged.

  - id: phy-ecf-018
    topic: superposition-forces
    subtopic: Equilibrium of a third charge
    concept: Neutral point between two like charges
    category: numerical
    format: direct
    difficulty: 3
    time: 60
    ncert: false
    battle: false
    tags: [equilibrium]
    stem: Charges +4 μC and +1 μC are 30 cm apart. Where must a third charge be placed on the line joining them so that the net force on it is zero?
    options:
      - 10 cm from the +4 μC charge
      - 20 cm from the +4 μC charge
      - 15 cm from each charge
      - 20 cm from the +1 μC charge
    answer: 1
    explanation: At distance x from +4 μC, 4/x^2 = 1/(0.3 − x)^2, so 2(0.3 − x) = x and x = 0.2 m. The point lies between them, closer to the smaller charge.

  - id: phy-ecf-019
    topic: superposition-forces
    subtopic: Charge at centre of square
    concept: Symmetry gives zero net force at centre of square of equal charges
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: false
    battle: true
    tags: [symmetry]
    stem: Four equal charges Q sit at the corners of a square. What is the net force on a charge q at the centre?
    options:
      - "Zero"
      - 4kQq/a^2 where a is the side
      - 2kQq/a^2 where a is the side
      - √2 kQq/a^2 where a is the side
    answer: 0
    explanation: Forces from diagonally opposite corners are equal and opposite, so they cancel in pairs and the net force is zero.

  - id: phy-ecf-020
    topic: superposition-forces
    subtopic: Three collinear charges in equilibrium
    concept: Middle charge −q/4 keeps two end charges q in equilibrium
    category: numerical
    format: direct
    difficulty: 4
    time: 90
    ncert: false
    battle: false
    tags: [equilibrium, multi-concept]
    stem: Two charges +q are placed a distance d apart. What charge Q placed midway between them keeps the whole system of three charges in equilibrium?
    options:
      - −q/2
      - −q
      - −q/4
      - +q/4
    answer: 2
    explanation: For an end charge, the repulsion kq^2/d^2 must be balanced by attraction to Q at d/2, kqQ/(d/2)^2 = 4kqQ/d^2. So |Q| = q/4 and Q must be negative. The middle charge is balanced by symmetry.

  - id: phy-ecf-021
    topic: electric-field
    subtopic: Field of a point charge
    concept: E = kq/r^2 numerical
    category: numerical
    format: direct
    difficulty: 1
    time: 30
    ncert: true
    battle: true
    formula: E = kq/r^2
    tags: [point-charge-field]
    stem: What is the magnitude of the electric field at 3 cm from a point charge of 1 nC in vacuum?
    options:
      - 3 × 10^2 N C^{-1}
      - 10^4 N C^{-1}
      - 3 × 10^5 N C^{-1}
      - 10^2 N C^{-1}
    answer: 1
    explanation: E = 9 × 10^9 × 10^{-9} / (0.03)^2 = 9 / 9 × 10^{-4} = 10^4 N C^{-1}.

  - id: phy-ecf-022
    topic: electric-field
    subtopic: Definition of electric field
    concept: Field is force per unit positive test charge
    category: concept
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    tags: [definition, ncert-line]
    stem: Why is the test charge used to define the electric field taken to be vanishingly small?
    options:
      - So that it does not disturb the source charge distribution
      - So that the force on it is large
      - Because only small charges experience force
      - So that gravity on it can be neglected
    answer: 0
    explanation: E = lim F/q as q → 0. A large test charge would push the source charges around and change the very field being measured.

  - id: phy-ecf-023
    topic: electric-field
    subtopic: Units of electric field
    concept: N C^{-1} is equivalent to V m^{-1}
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [units]
    stem: The SI unit of electric field N C^{-1} is equivalent to
    options:
      - J C^{-1}
      - V m
      - C m^{-1}
      - V m^{-1}
    answer: 3
    explanation: 1 V = 1 J C^{-1}, so V m^{-1} = J C^{-1} m^{-1} = N m C^{-1} m^{-1} = N C^{-1}.

  - id: phy-ecf-024
    topic: electric-field
    subtopic: Motion of an electron in a field
    concept: Acceleration a = eE/m for an electron
    category: numerical
    format: direct
    difficulty: 3
    time: 60
    ncert: true
    battle: false
    formula: a = eE/m
    tags: [charge-in-field]
    stem: An electron is placed in a uniform electric field of 2 × 10^4 N C^{-1}. What is the magnitude of its acceleration? (e/m = 1.76 × 10^{11} C kg^{-1})
    options:
      - 1.76 × 10^{15} m s^{-2}
      - 8.8 × 10^{15} m s^{-2}
      - 3.52 × 10^{15} m s^{-2}
      - 3.52 × 10^{7} m s^{-2}
    answer: 2
    explanation: a = (e/m)E = 1.76 × 10^{11} × 2 × 10^4 = 3.52 × 10^{15} m s^{-2}, directed opposite to E.

  - id: phy-ecf-025
    topic: electric-field
    subtopic: Charged drop in equilibrium
    concept: Balancing weight with electric force, qE = mg
    category: numerical
    format: case
    difficulty: 3
    time: 60
    ncert: false
    battle: false
    formula: qE = mg
    tags: [equilibrium, millikan]
    stem: An oil drop of mass 1.6 × 10^{-15} kg stays stationary between horizontal plates where the field is 5 × 10^4 N C^{-1} upward. How many excess electrons does it carry? (g = 10 m s^{-2}, e = 1.6 × 10^{-19} C)
    options:
      - It carries 1 excess electron
      - It has lost 2 electrons
      - It carries 4 excess electrons
      - It has lost 1 electron
    answer: 1
    explanation: q = mg/E = 1.6 × 10^{-14} / 5 × 10^4 = 3.2 × 10^{-19} C = 2e. The force must be upward along E, so the charge is positive, meaning 2 electrons were lost, not gained.

  - id: phy-ecf-026
    topic: field-lines
    subtopic: Properties of field lines
    concept: Two field lines never cross
    category: concept
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    tags: [field-lines, ncert-line]
    stem: Why can two electric field lines never cross each other?
    options:
      - Because like charges repel
      - Because field lines are always parallel
      - Because the field at the crossing point would have two directions
      - Because field lines are closed loops
    answer: 2
    explanation: The tangent to a field line gives the direction of E. At a crossing point there would be two tangents, meaning two field directions at one point, which is impossible.

  - id: phy-ecf-027
    topic: field-lines
    subtopic: Closed loops
    concept: Electrostatic field lines do not form closed loops
    category: concept
    format: statement-pair
    difficulty: 2
    time: 40
    ncert: true
    battle: false
    tags: [field-lines, conservative-field]
    stem: |-
      Statement I: Electrostatic field lines start on positive charges and end on negative charges.
      Statement II: Electrostatic field lines can form closed loops.
    options:
      - Both Statement I and Statement II are correct
      - Both Statement I and Statement II are incorrect
      - Statement I is correct but Statement II is incorrect
      - Statement I is incorrect but Statement II is correct
    answer: 2
    explanation: Field lines begin on positive charges (or at infinity) and end on negative charges (or at infinity). Because the electrostatic field is conservative, its lines cannot close on themselves.

  - id: phy-ecf-028
    topic: field-lines
    subtopic: Density of field lines
    concept: Crowded field lines indicate a strong field
    category: concept
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [field-lines]
    stem: In a field-line diagram, the region where the lines are most closely spaced has
    options:
      - the strongest field
      - the weakest field
      - zero field
      - the highest density of charge
    answer: 0
    explanation: The number of lines crossing unit area perpendicular to them is proportional to the field strength, so crowded lines mean a strong field.

  - id: phy-ecf-029
    topic: field-lines
    subtopic: Lines at a conductor
    concept: Field lines meet a conductor surface at right angles
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [field-lines, conductor]
    stem: At what angle do electrostatic field lines meet the surface of a charged conductor in equilibrium?
    options:
      - 0°
      - 45°
      - 60°
      - 90°
    answer: 3
    explanation: Any tangential component of E would move free charges along the surface. In electrostatic equilibrium there is none, so field lines are normal to the surface.

  - id: phy-ecf-030
    topic: electric-flux
    subtopic: Flux through a plane area
    concept: φ = EA cos θ with θ the angle between E and area normal
    category: numerical
    format: direct
    difficulty: 2
    time: 40
    ncert: true
    battle: true
    formula: φ = EA cos θ
    tags: [flux]
    stem: A uniform field of 200 N C^{-1} makes 60° with the normal to a plane surface of area 0.1 m^2. The flux through the surface is
    options:
      - 20 N m^2 C^{-1}
      - 10√3 N m^2 C^{-1}
      - 10 N m^2 C^{-1}
      - "0"
    answer: 2
    explanation: φ = EA cos 60° = 200 × 0.1 × 0.5 = 10 N m^2 C^{-1}. Using sin 60° gives 10√3, a common error.

  - id: phy-ecf-031
    topic: electric-flux
    subtopic: Units of flux
    concept: SI unit of electric flux is N m^2 C^{-1} or V m
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [units]
    stem: The SI unit of electric flux is
    options:
      - N C^{-1}
      - V m
      - V m^{-1}
      - N m^{-2} C
    answer: 1
    explanation: φ = EA has units N C^{-1} m^2, and since N C^{-1} = V m^{-1}, this equals V m.

  - id: phy-ecf-032
    topic: electric-flux
    subtopic: Area vector orientation
    concept: Flux is zero when the field is parallel to the surface
    category: concept
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    tags: [flux]
    stem: A uniform field E is parallel to the plane of a flat surface of area A. The flux through the surface is
    options:
      - EA
      - EA/2
      - "Zero"
      - 2EA
    answer: 2
    explanation: The area vector is normal to the surface, so it is perpendicular to E and cos 90° = 0. No field lines pass through the surface.

  - id: phy-ecf-033
    topic: electric-flux
    subtopic: Dimensions of flux
    concept: Dimensional formula of electric flux
    category: factual
    format: direct
    difficulty: 3
    time: 50
    ncert: false
    battle: false
    tags: [dimensions]
    stem: The dimensional formula of electric flux is
    options:
      - "[ML^3T^{-3}A^{-1}]"
      - "[MLT^{-3}A^{-1}]"
      - "[ML^2T^{-3}A^{-1}]"
      - "[ML^3T^{-3}A]"
    answer: 0
    explanation: E = F/q has [MLT^{-2}]/[AT] = [MLT^{-3}A^{-1}]. Multiplying by area [L^2] gives [ML^3T^{-3}A^{-1}].

  - id: phy-ecf-034
    topic: electric-dipole
    subtopic: Dipole moment
    concept: p = q × 2a and it points from −q to +q
    category: factual
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    tags: [dipole-moment, ncert-line]
    stem: The direction of the electric dipole moment of a dipole is
    options:
      - from +q to −q
      - perpendicular to the dipole axis
      - from −q to +q
      - along the equatorial line
    answer: 2
    explanation: By convention p = q × 2a is directed from the negative charge to the positive charge along the dipole axis.

  - id: phy-ecf-035
    topic: electric-dipole
    subtopic: Axial and equatorial fields
    concept: Axial field is twice the equatorial field at equal large distances
    category: concept
