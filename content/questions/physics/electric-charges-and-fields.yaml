    tags: [induction, conduction]
    stem: |-
      Consider the following statements.
      I. Charging by induction requires the charged body to touch the conductor.
      II. In charging by induction, the inducing body loses none of its charge.
      III. Charging by conduction gives the conductor charge of the same sign as the charging body.
      IV. Earthing a conductor near a charged rod always leaves it neutral.
      Which statements are correct?
    options:
