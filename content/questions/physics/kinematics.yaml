subject: physics
chapter:
  slug: kinematics
  name: Motion in a Straight Line
  order: 1
  topics:
    - slug: speed-velocity
      name: Speed and velocity
    - slug: equations-of-motion
      name: Equations of motion
questions:
  - id: phy-kin-001
    topic: speed-velocity
    category: concept
    difficulty: 1
    battle: true
    stem: A runner completes one full lap of a circular track and stops at the start. What is the runner's displacement?
    options:
      - Zero
      - Equal to the circumference
      - Equal to the diameter
      - Equal to the radius
    answer: 0
    explanation: Displacement is the straight-line change in position. The runner ends where they started, so the displacement is zero even though the distance covered is one full circumference.

  - id: phy-kin-002
    topic: speed-velocity
    category: numerical
    difficulty: 2
    battle: true
    stem: A car covers 60 km at 30 km h^{-1} and the next 60 km at 60 km h^{-1}. What is its average speed for the whole trip?
    options:
      - 45 km h^{-1}
      - 50 km h^{-1}
      - 40 km h^{-1}
      - 35 km h^{-1}
    answer: 2
    explanation: Average speed = total distance ÷ total time = 120 km ÷ (2 h + 1 h) = 40 km h^{-1}. It is less than the simple mean of 45 km h^{-1} because more time is spent at the lower speed.

  - id: phy-kin-003
    topic: speed-velocity
    category: concept
    difficulty: 2
    battle: true
    stem: What does the slope of a position–time graph give at any instant?
    options:
      - Acceleration
      - Instantaneous velocity
      - Displacement
      - Distance travelled
    answer: 1
    explanation: The slope of a position–time graph is dx/dt, the velocity at that instant. The slope of a velocity–time graph gives the acceleration.

  - id: phy-kin-004
    topic: speed-velocity
    category: factual
    difficulty: 1
    battle: true
    stem: What is the SI unit of velocity?
    options:
      - m s^{-2}
      - km h^{-1}
      - m s
      - m s^{-1}
    answer: 3
    explanation: Velocity is displacement per unit time, so its SI unit is the metre per second (m s^{-1}). The unit m s^{-2} belongs to acceleration, and km h^{-1} is not an SI unit.

  - id: phy-kin-005
    topic: equations-of-motion
    category: numerical
    difficulty: 2
    battle: true
    stem: A car starts from rest and accelerates uniformly at 2 m s^{-2}. How far does it travel in 5 s?
    options:
      - 10 m
      - 25 m
      - 50 m
      - 100 m
    answer: 1
    explanation: Starting from rest (u = 0), s = ut + ½at^2 = ½ × 2 × 5^2 = 25 m.

  - id: phy-kin-006
    topic: equations-of-motion
    category: numerical
    difficulty: 3
    battle: true
    stem: A ball is thrown straight up at 20 m s^{-1}. Taking g = 10 m s^{-2}, how high does it rise?
    options:
      - 10 m
      - 40 m
      - 2 m
      - 20 m
    answer: 3
    explanation: At the highest point v = 0, so v^2 = u^2 − 2gh gives h = u^2/2g = 400/20 = 20 m.

  - id: phy-kin-007
    topic: equations-of-motion
    category: concept
    difficulty: 2
    battle: true
    stem: What does the velocity–time graph of a body accelerating uniformly from rest look like?
    options:
      - A straight line through the origin
      - A horizontal line
      - A parabola
      - A curve that levels off
    answer: 0
    explanation: From rest with constant acceleration, v = at, so velocity grows in proportion to time. The graph is a straight line through the origin, and its slope is the acceleration.

  - id: phy-kin-008
    topic: equations-of-motion
    category: application
    difficulty: 3
    battle: true
    stem: Two stones are dropped from the same height, one 1 s after the other. Ignoring air resistance, what happens to the gap between them as they fall?
    options:
      - It stays the same
      - It shrinks
      - It grows
      - It grows, then shrinks
    answer: 2
    explanation: Both stones have the same acceleration g, but the first is always faster by g × 1 s ≈ 10 m s^{-1}. With a constant relative velocity, the gap keeps growing steadily.
