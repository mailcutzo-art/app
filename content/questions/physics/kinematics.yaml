questions:

  - id: phy-kin-001
    topic: position-displacement
    subtopic: Distance and displacement on a curved path
    concept: Half lap of a circle gives distance πR and displacement 2R
    category: numerical
    format: direct
    difficulty: 2
    time: 35
    ncert: false
    battle: true
    formula: distance = πR, |displacement| = 2R
    tags: [distance, displacement, circular-path]
    stem: An athlete runs along a circular track of radius 21 m from one end of a diameter to the other end. What are the distance covered and the magnitude of displacement?
    options:
      - 66 m and zero
      - 66 m and 42 m
      - 42 m and 66 m
      - 132 m and 42 m
    answer: 1
    explanation: "Distance is the length of the path actually followed, here half the circumference: πR = (22/7) × 21 = 66 m. Displacement is the straight line from start to finish, which is the diameter 2R = 42 m. Swapping the two values is the usual slip; zero displacement would need the athlete to return to the start."

  - id: phy-kin-002
    topic: position-displacement
    subtopic: Path length versus displacement
    concept: Magnitude of displacement can never exceed the path length
    category: concept
    format: statements
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [distance, displacement, trap]
    stem: Which one of the following statements about a particle moving along a straight line is correct?
    options:
      - The magnitude of its displacement can never be greater than the path length covered
      - Its path length can be negative when it moves along the negative x direction
      - Its displacement is always equal to its path length
      - Its path length can be zero even when its displacement is not zero
    answer: 0
    explanation: Path length is the total length of the route followed; it is a positive scalar that never decreases. Displacement is the change in position (x_2 − x_1) and can be positive, negative or zero. Because the straight line between two points is the shortest route, |displacement| ≤ path length, with equality only when the particle never turns back. A non-zero displacement needs some path to be covered, so the path length cannot be zero, and path length is never negative.

  - id: phy-kin-003
    topic: position-displacement
    subtopic: Frame of reference and origin
    concept: Displacement does not depend on the choice of origin
    category: concept
    format: assertion-reason
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [frame-of-reference, displacement, origin]
    stem: |-
      Assertion (A): The displacement of a particle between two instants does not depend on where the origin of the x-axis is chosen.
      Reason (R): Displacement is the difference of two position coordinates measured from the same origin, so shifting the origin changes both coordinates by the same amount.
    options:
      - Both A and R are true and R is the correct explanation of A
      - Both A and R are true but R is not the correct explanation of A
      - A is true but R is false
      - A is false but R is true
    answer: 0
    explanation: If the origin is shifted by d, every position coordinate changes from x to x − d. The displacement Δx = (x_2 − d) − (x_1 − d) = x_2 − x_1 is unchanged. Positions depend on the choice of origin, but differences of positions do not; this is exactly what R states, so R correctly explains A.

  - id: phy-kin-004
    topic: position-displacement
    subtopic: Displacement with change of direction
    concept: Signed displacement and path length for back-and-forth motion on the x-axis
    category: numerical
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    formula: Δx = x_{final} − x_{initial}
    tags: [displacement, path-length, sign-convention]
    stem: A car moves along the x-axis from x = +40 m to x = −20 m and then back to x = +10 m. What are its displacement and path length?
    options:
      - −10 m and 70 m
      - −30 m and 30 m
      - −30 m and 90 m
      - +30 m and 90 m
    answer: 2
    explanation: "Displacement depends only on the end points: Δx = (+10) − (+40) = −30 m, the minus sign showing it points along −x. Path length adds every stretch: 40 − (−20) = 60 m going left, then 10 − (−20) = 30 m going right, total 90 m. Taking the magnitude of displacement as the path length ignores the turn-back."

  - id: phy-kin-005
    topic: average-speed-velocity
    subtopic: Average speed over equal distances
    concept: Equal distances at two speeds give the harmonic mean
    category: numerical
    format: direct
    difficulty: 2
    time: 40
    ncert: false
    battle: true
    formula: v_{avg} = 2v_1v_2/(v_1 + v_2)
    tags: [average-speed, harmonic-mean, trap]
    stem: A bus covers the first half of a journey at 40 km h^{-1} and the second half of the distance at 60 km h^{-1}. What is its average speed?
    options:
      - 52 km h^{-1}
      - 45 km h^{-1}
      - 50 km h^{-1}
      - 48 km h^{-1}
    answer: 3
    explanation: For two equal distances d, the total time is d/40 + d/60 = d/24, so the average speed is 2d ÷ (d/24) = 48 km h^{-1}. Equivalently v_{avg} = 2v_1v_2/(v_1 + v_2) = 4800/100 = 48 km h^{-1}. The simple mean 50 km h^{-1} is wrong because the bus spends more time at the lower speed.

  - id: phy-kin-006
    topic: average-speed-velocity
    subtopic: Average speed over equal distances and equal times
    concept: Equal-time halves give the arithmetic mean, not the geometric mean
    category: concept
    format: statement-pair
    difficulty: 3
    time: 55
    ncert: false
    battle: false
    tags: [average-speed, arithmetic-mean, harmonic-mean]
    stem: |-
      Statement I: If a body covers two equal distances at speeds v_1 and v_2, its average speed is 2v_1v_2/(v_1 + v_2).
      Statement II: If a body moves for two equal time intervals at speeds v_1 and v_2, its average speed is √(v_1v_2).
    options:
      - Both Statement I and Statement II are correct
      - Both Statement I and Statement II are incorrect
      - Statement I is correct but Statement II is incorrect
      - Statement I is incorrect but Statement II is correct
    answer: 2
    explanation: "Equal distances d: total time = d/v_1 + d/v_2, so v_{avg} = 2d ÷ (d/v_1 + d/v_2) = 2v_1v_2/(v_1 + v_2), the harmonic mean; Statement I is correct. Equal times t: total distance = v_1t + v_2t, so v_{avg} = (v_1 + v_2)/2, the arithmetic mean, not the geometric mean √(v_1v_2); Statement II is incorrect."

  - id: phy-kin-007
    topic: average-speed-velocity
    subtopic: Round trip
    concept: Round trip gives zero average velocity but non-zero average speed
    category: numerical
    format: direct
    difficulty: 3
    time: 60
    ncert: true
    battle: false
    tags: [average-speed, average-velocity, round-trip]
    stem: A man walks 2 km along a straight road to a shop at 4 km h^{-1}, and immediately walks back home along the same road at 6 km h^{-1}. What are his average speed and the magnitude of his average velocity for the whole trip?
    options:
      - 5 km h^{-1} and 1 km h^{-1}
      - 4.8 km h^{-1} and zero
      - 4.8 km h^{-1} and 4.8 km h^{-1}
      - 5 km h^{-1} and zero
    answer: 1
    explanation: Time out = 2/4 = 0.5 h; time back = 2/6 = 1/3 h; total = 5/6 h. Average speed = total path ÷ total time = 4 km ÷ (5/6) h = 4.8 km h^{-1}. He ends where he started, so the displacement and hence the average velocity are zero. The mean of the speeds (5 km h^{-1}) ignores the unequal times.

  - id: phy-kin-008
    topic: average-speed-velocity
    subtopic: Required speed for a target average speed
    concept: An average of twice the first-half speed would need infinite speed in the second half
    category: application
    format: direct
    difficulty: 4
    time: 100
    ncert: false
    battle: false
    tags: [average-speed, trap, harmonic-mean]
    stem: A car covers the first half of a certain distance at 20 km h^{-1}. At what speed must it cover the second half so that its average speed for the whole distance is 40 km h^{-1}?
    options:
      - No finite speed is enough
      - 120 km h^{-1}
      - 60 km h^{-1}
      - 80 km h^{-1}
    answer: 0
    explanation: Let each half be d. To average 40 km h^{-1} over 2d the total time must be 2d/40 = d/20. But the first half alone already takes d/20 at 20 km h^{-1}. The second half would have to take zero time, i.e. infinite speed. The tempting answer 60 km h^{-1} comes from treating the average as the arithmetic mean of the two speeds.

  - id: phy-kin-009
    topic: average-speed-velocity
    subtopic: Average velocity from a position function
    concept: Average velocity equals Δx/Δt computed from x(t) at the two instants
    category: numerical
    format: direct
    difficulty: 3
    time: 60
    ncert: false
    battle: false
    formula: v_{avg} = [x(t_2) − x(t_1)]/(t_2 − t_1)
    tags: [average-velocity, position-function]
    stem: The position of a particle is x = 5 + 2t + 3t^2, where x is in metres and t in seconds. What is its average velocity between t = 1 s and t = 3 s?
    options:
      - 20 m s^{-1}
      - 14 m s^{-1}
      - 19 m s^{-1}
      - 8 m s^{-1}
    answer: 1
    explanation: x(1) = 5 + 2 + 3 = 10 m and x(3) = 5 + 6 + 27 = 38 m. Average velocity = (38 − 10)/(3 − 1) = 14 m s^{-1}. 20 m s^{-1} and 8 m s^{-1} are the instantaneous velocities (v = 2 + 6t) at t = 3 s and t = 1 s, and 19 m s^{-1} wrongly divides x(3) by the interval.

  - id: phy-kin-010
    topic: average-speed-velocity
    subtopic: Average speed versus average velocity
    concept: Average speed is at least the magnitude of average velocity
    category: concept
    format: multi-statement
    difficulty: 3
    time: 60
    ncert: true
    battle: false
    tags: [average-speed, average-velocity, trap]
    stem: |-
      Consider the following statements for motion along a straight line over a time interval.
      I. The average speed is always greater than or equal to the magnitude of the average velocity.
      II. The average velocity can be zero while the average speed is not zero.
      III. The average speed can be zero while the average velocity is not zero.
      IV. If the body never reverses its direction, the average speed equals the magnitude of the average velocity.
      Which of the statements are correct?
    options:
      - I and II only
      - II and III only
      - I, III and IV only
      - I, II and IV only
    answer: 3
    explanation: Average speed = path length/time and |average velocity| = |displacement|/time. Since path length ≥ |displacement|, statement I holds, with equality when there is no reversal (IV). A round trip gives zero displacement but a non-zero path (II). Zero average speed means zero path length, which forces zero displacement, so III is false.

  - id: phy-kin-011
    topic: instantaneous-velocity
    subtopic: Velocity from a position function
    concept: Instantaneous velocity is the time derivative of position
    category: numerical
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    formula: v = dx/dt
    tags: [instantaneous-velocity, differentiation]
    stem: The position of a particle moving along the x-axis is x = 2t^3 − 6t^2 + 5, with x in metres and t in seconds. What is its velocity at t = 3 s?
    options:
      - 5 m s^{-1}
      - 24 m s^{-1}
      - 54 m s^{-1}
      - 18 m s^{-1}
    answer: 3
    explanation: v = dx/dt = 6t^2 − 12t. At t = 3 s, v = 54 − 36 = 18 m s^{-1}. 5 m s^{-1} is just the value of x(3) = 5 m read as a velocity, 54 m s^{-1} keeps only the first term, and 24 is the numerical value of the acceleration (a = 12t − 12) at t = 3 s.

  - id: phy-kin-012
    topic: instantaneous-velocity
    subtopic: Measuring instantaneous speed
    concept: A speedometer shows instantaneous speed
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: false
    battle: true
    tags: [speedometer, instantaneous-speed]
    stem: The reading of a car's speedometer at any moment gives the car's
    options:
      - average speed since the start of the trip
      - instantaneous velocity, including its direction
      - instantaneous speed
      - total distance covered so far
    answer: 2
    explanation: A speedometer shows how fast the car is moving at that instant, i.e. the magnitude of instantaneous velocity. It does not show direction, so it is not a velocity reading. The distance covered is shown by the odometer, and the average speed has to be calculated from distance and time.

  - id: phy-kin-013
    topic: instantaneous-velocity
    subtopic: Instantaneous speed and velocity
    concept: Instantaneous speed always equals the magnitude of instantaneous velocity
    category: concept
    format: assertion-reason
    difficulty: 3
    time: 55
    ncert: true
    battle: false
    tags: [instantaneous-speed, instantaneous-velocity, ncert-line]
    stem: |-
      Assertion (A): Instantaneous speed is always equal to the magnitude of instantaneous velocity, although average speed can exceed the magnitude of average velocity.
      Reason (R): Over an infinitesimally small time interval, the magnitude of the displacement equals the path length.
    options:
      - Both A and R are true and R is the correct explanation of A
      - Both A and R are true but R is not the correct explanation of A
      - A is true but R is false
      - A is false but R is true
    answer: 0
    explanation: Over a finite interval a body may turn back, so path length can exceed |displacement| and average speed can exceed |average velocity|. As Δt → 0 the body has no time to turn back, the tiny displacement and tiny path length become equal, and hence instantaneous speed = |instantaneous velocity|. R is exactly the reason for A.

  - id: phy-kin-014
    topic: instantaneous-velocity
    subtopic: Slope of the tangent on an x–t graph
    concept: Instantaneous velocity equals the slope of the tangent to the x–t curve
    category: numerical
    format: graph
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    formula: v = slope of tangent = Δx/Δt along the tangent
    tags: [x-t-graph, tangent, instantaneous-velocity]
    stem: On the curved x–t graph of a particle, the tangent drawn at the point corresponding to t = 4 s passes through the points (2 s, 0 m) and (6 s, 12 m). What is the instantaneous velocity of the particle at t = 4 s?
    options:
      - 6 m s^{-1}
      - 1.5 m s^{-1}
      - 2 m s^{-1}
      - 3 m s^{-1}
    answer: 3
    explanation: The instantaneous velocity is the slope of the tangent at that instant. Slope = (12 − 0)/(6 − 2) = 3 m s^{-1}. Dividing 12 m by 6 s (2 m s^{-1}) or by 2 s (6 m s^{-1}) uses a single coordinate instead of the change in both coordinates along the tangent.

  - id: phy-kin-015
    topic: acceleration
    subtopic: Sign of acceleration
    concept: Velocity and acceleration in the same direction means speeding up
    category: concept
    format: direct
    difficulty: 3
    time: 45
    ncert: true
    battle: true
    tags: [sign-convention, speeding-up, trap]
    stem: A car is moving in the −x direction and its acceleration is also in the −x direction. What is happening to the car?
    options:
      - It is moving with constant speed
      - It is speeding up
      - It is slowing down
      - It is about to reverse its direction
    answer: 1
    explanation: Negative acceleration does not by itself mean slowing down. A body speeds up when velocity and acceleration have the same sign and slows down when they have opposite signs. Here both are negative, so the car's speed increases in the −x direction.

  - id: phy-kin-016
    topic: acceleration
    subtopic: Average acceleration during a rebound
    concept: Average acceleration uses the vector change of velocity, so a reversal adds the speeds
    category: numerical
    format: case
    difficulty: 4
    time: 90
    ncert: false
    battle: false
    formula: a_{avg} = (v − u)/Δt
    tags: [average-acceleration, rebound, sign-convention, trap]
    stem: A ball moving at 12 m s^{-1} strikes a wall head-on and rebounds along the same line at 8 m s^{-1}. The contact lasts 0.04 s. What is the average acceleration of the ball during the contact?
    options:
      - 500 m s^{-2}, directed away from the wall
      - 100 m s^{-2}, directed towards the wall
      - 100 m s^{-2}, directed away from the wall
      - 500 m s^{-2}, directed towards the wall
    answer: 0
    explanation: Take the direction away from the wall as positive. Initial velocity u = −12 m s^{-1}, final velocity v = +8 m s^{-1}. a_{avg} = (v − u)/Δt = (8 − (−12))/0.04 = 20/0.04 = 500 m s^{-2}, positive, i.e. away from the wall. Using the difference of speeds (12 − 8 = 4) gives the wrong value 100 m s^{-2}.

  - id: phy-kin-017
    topic: acceleration
    subtopic: Dimensions of acceleration
    concept: Acceleration has dimensions [M^0 L T^{-2}]
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: false
    battle: true
    tags: [dimensions, units]
    stem: What are the dimensions of acceleration?
    options:
      - "[M^1 L^1 T^{-2}]"
      - "[M^0 L^2 T^{-2}]"
      - "[M^0 L^1 T^{-2}]"
      - "[M^0 L^1 T^{-1}]"
    answer: 2
    explanation: Acceleration = change in velocity ÷ time = (L T^{-1}) ÷ T = L T^{-2}, so its dimensions are [M^0 L^1 T^{-2}] and its SI unit is m s^{-2}. [M^0 L^1 T^{-1}] is velocity and [M^1 L^1 T^{-2}] is force.

  - id: phy-kin-018
    topic: acceleration
    subtopic: Average acceleration with unit conversion
    concept: Convert km h^{-1} to m s^{-1} before using a = Δv/Δt
    category: numerical
    format: direct
    difficulty: 2
    time: 40
    ncert: false
    battle: true
    formula: a = (v − u)/t; 1 km h^{-1} = 5/18 m s^{-1}
    tags: [average-acceleration, unit-conversion]
    stem: A car speeds up uniformly from 36 km h^{-1} to 72 km h^{-1} in 5 s. What is its acceleration?
    options:
      - 4 m s^{-2}
      - 2 m s^{-2}
      - 7.2 m s^{-2}
      - 1 m s^{-2}
    answer: 1
    explanation: 36 km h^{-1} = 10 m s^{-1} and 72 km h^{-1} = 20 m s^{-1}. a = (20 − 10)/5 = 2 m s^{-2}. The value 7.2 comes from dividing 36 km h^{-1} by 5 s without converting units.

  - id: phy-kin-019
    topic: acceleration
    subtopic: Velocity and acceleration are independent
    concept: Zero velocity with non-zero acceleration and vice versa are both possible
    category: concept
    format: multi-statement
    difficulty: 3
    time: 60
    ncert: true
    battle: false
    tags: [velocity-acceleration, trap]
    stem: |-
      For a body moving along a straight line, consider:
      I. It can have zero velocity at an instant while its acceleration is not zero.
      II. It can have a non-zero velocity while its acceleration is zero.
      III. If it moves with constant speed without reversing direction, its acceleration is zero.
      IV. A negative acceleration always means that the body is slowing down.
      Which statements are correct?
    options:
      - I and II only
      - I and IV only
      - I, II and III only
      - II, III and IV only
    answer: 2
    explanation: "I: a ball at the top of its flight has v = 0 but a = g. II: uniform motion has v ≠ 0 and a = 0. III: in a straight line, constant speed without reversal means constant velocity, so a = 0. IV is false: if the velocity is also negative, a negative acceleration makes the body speed up. Only the sign relative to the velocity decides slowing down."

  - id: phy-kin-020
    topic: motion-graphs
    subtopic: Area under a v–t graph
    concept: Distance from a trapezium-shaped v–t graph
    category: numerical
    format: graph
    difficulty: 3
    time: 60
    ncert: true
    battle: false
    formula: displacement = area under v–t graph
    tags: [v-t-graph, area, trapezium]
    stem: A car starts from rest, accelerates uniformly to 10 m s^{-1} in 5 s, moves at this speed for 10 s and then decelerates uniformly to rest in 5 s. Using its velocity–time graph, find the total distance covered.
    options:
      - 100 m
      - 150 m
      - 200 m
      - 125 m
    answer: 1
    explanation: The v–t graph is a trapezium. Area = ½ × 5 × 10 + 10 × 10 + ½ × 5 × 10 = 25 + 100 + 25 = 150 m. The value 200 m treats the whole 20 s as if the car moved at 10 m s^{-1} throughout, ignoring the triangular parts.

  - id: phy-kin-021
    topic: motion-graphs
    subtopic: Shape of the x–t graph
    concept: Uniform acceleration from rest gives an upward-opening parabola on the x–t graph
    category: concept
    format: graph
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [x-t-graph, parabola, uniform-acceleration]
    stem: A body starts from rest at the origin and moves with constant positive acceleration. Its position–time graph is
    options:
      - a straight line through the origin
      - a straight line parallel to the time axis
      - a curve through the origin that becomes flatter with time
      - a parabola through the origin that gets steeper with time
    answer: 3
    explanation: "With u = 0, x = ½at^2, so x varies as t^2: a parabola starting at the origin with zero slope. The slope (velocity) keeps increasing, so the curve gets steeper. A straight line would mean constant velocity, and a flattening curve would mean the body is slowing down."

  - id: phy-kin-022
    topic: motion-graphs
    subtopic: Area under an a–t graph
    concept: Area under the a–t graph gives the change in velocity
    category: numerical
    format: graph
    difficulty: 3
    time: 55
    ncert: false
    battle: false
    formula: Δv = area under a–t graph
    tags: [a-t-graph, area, change-in-velocity]
    stem: A particle moving along the x-axis has a velocity of 2 m s^{-1} at t = 0. Its acceleration–time graph shows a = 4 m s^{-2} from t = 0 to t = 3 s and a = 0 after that. What is its velocity at t = 5 s?
    options:
      - 20 m s^{-1}
      - 14 m s^{-1}
      - 22 m s^{-1}
      - 12 m s^{-1}
    answer: 1
    explanation: The area under the a–t graph equals the change in velocity. Area = 4 × 3 = 12 m s^{-1}, so v = 2 + 12 = 14 m s^{-1}, and it stays at 14 m s^{-1} after t = 3 s because a = 0. 12 m s^{-1} forgets the initial velocity, and 22 m s^{-1} wrongly continues the acceleration up to 5 s.

  - id: phy-kin-023
    topic: motion-graphs
    subtopic: Physically impossible graphs
    concept: An x–t graph cannot have a vertical segment
    category: concept
    format: statements
    difficulty: 3
    time: 45
    ncert: true
    battle: true
    tags: [impossible-graph, x-t-graph, ncert-exercise]
    stem: Which of the following cannot represent a real one-dimensional motion?
    options:
      - A position–time graph that is a horizontal straight line
      - A velocity–time graph whose slope changes suddenly
      - A position–time graph with a vertical straight segment
      - A velocity–time graph that crosses the time axis
    answer: 2
    explanation: A vertical segment on an x–t graph means a change of position in zero time, i.e. infinite velocity, which is impossible. A horizontal x–t line is a body at rest, a v–t line crossing the time axis is a body reversing direction, and a sudden change of slope on a v–t graph is just a sudden change of acceleration (for example, brakes applied).

  - id: phy-kin-024
    topic: motion-graphs
    subtopic: Reading slopes on an x–t graph
    concept: The steepest segment of an x–t graph has the largest speed
    category: application
    format: diagram
    difficulty: 3
    time: 60
    ncert: false
    battle: false
    diagram: "Position–time graph: horizontal axis t (s) from 0 to 7, vertical axis x (m) from 0 to 8. Three straight segments joined end to end: O (0 s, 0 m) to A (2 s, 6 m); A (2 s, 6 m) to B (5 s, 6 m), a horizontal segment; B (5 s, 6 m) to C (6 s, 0 m), sloping down. Points O, A, B, C labelled with their coordinates."
    tags: [x-t-graph, slope, speed]
    stem: The figure shows the position–time graph of a particle made of three straight segments OA, AB and BC. In which segment is the particle's speed the greatest?
    options:
      - OA
      - Speeds in OA and BC are equal
      - AB
      - BC
    answer: 3
    explanation: "Speed is the magnitude of the slope. OA: 6/2 = 3 m s^{-1}. AB: horizontal, so 0 (at rest). BC: |0 − 6|/(6 − 5) = 6 m s^{-1}. The negative slope of BC only shows motion towards the origin; its magnitude is the largest, so the speed is greatest in BC."

  - id: phy-kin-025
    topic: motion-graphs
    subtopic: Distance and displacement from a v–t graph
    concept: Areas below the time axis count negative for displacement but positive for distance
    category: application
    format: graph
    difficulty: 4
    time: 90
    ncert: true
    battle: false
    tags: [v-t-graph, distance, displacement, trap]
    stem: The velocity–time graph of a particle is a straight line from +10 m s^{-1} at t = 0 to −10 m s^{-1} at t = 4 s. For these 4 s, what are the displacement and the distance covered?
    options:
      - Displacement zero, distance 20 m
      - Displacement zero, distance zero
      - Displacement 10 m, distance 20 m
      - Displacement 20 m, distance 20 m
    answer: 0
    explanation: The line crosses v = 0 at t = 2 s. The triangle above the axis has area ½ × 2 × 10 = +10 m and the triangle below has area −10 m. Displacement = sum of signed areas = 0. Distance = sum of magnitudes = 20 m. Adding signed areas for distance (zero) is the common mistake.

  - id: phy-kin-026
    topic: motion-graphs
    subtopic: Identifying motion from graph shapes
    concept: Matching x–t and v–t graph shapes with kinds of motion
    category: concept
    format: match
    difficulty: 3
    time: 60
    ncert: true
    battle: false
