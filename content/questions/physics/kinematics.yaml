    explanation: v = 0 at t = 2 s and changes from positive to negative there, so the particle reverses. a = −4t varies with time, and the displacement in 2 s is ∫(8 − 2t^2) dt = 16 − 16/3 ≈ 10.7 m; 16 m wrongly uses 8 × 2.

