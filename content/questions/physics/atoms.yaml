    tags: [de-broglie, bohr-radius, multi-concept]
    stem: Combining the de Broglie condition 2πr = n(h/mv) with the force balance mv^2/r = e^2/(4πε_0 r^2) gives the allowed orbit radii as
    options:
      - r_n = n^2 ε_0 h^2/(π m e^2)
      - r_n = n ε_0 h^2/(π m e^2)
