questions:
  - id: phy-atoms-001
    topic: thomson-rutherford
    subtopic: Thomson model
    concept: Thomson's plum pudding model has electrons embedded in a uniform positive sphere
    category: factual
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    tags: [thomson-model, ncert-line]
    stem: In J. J. Thomson's 1898 model of the atom, the positive charge of the atom is
    options:
      - concentrated in a tiny central nucleus
      - uniformly distributed throughout the volume of the atom
      - carried by electrons revolving in fixed orbits
      - located on the outer surface of the atom only
    answer: 1
    explanation: Thomson proposed that the positive charge is spread uniformly over the whole atom with electrons embedded in it like seeds in a watermelon (plum pudding model). A concentrated central nucleus is Rutherford's later idea.

  - id: phy-atoms-002
    topic: thomson-rutherford
    subtopic: Rutherford nuclear model
    concept: Most of the mass and all positive charge of the atom lie in the nucleus
    category: factual
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    tags: [nuclear-model, ncert-line]
    stem: According to Rutherford's nuclear model, where is most of the mass of an atom located?
    options:
      - Uniformly spread over the atomic volume
      - In the electron cloud
      - In a tiny, positively charged central nucleus
      - In the space between electron orbits
    answer: 2
    explanation: Rutherford concluded that the entire positive charge and nearly all the mass of the atom are concentrated in a very small central nucleus, with electrons moving around it. Electrons contribute a negligible fraction of the mass.

  - id: phy-atoms-003
    topic: thomson-rutherford
    subtopic: Size of the nucleus
    concept: Nuclear size is about 10^{-4} to 10^{-5} of atomic size
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [nuclear-size, ncert-line]
    stem: The size of a nucleus compared with the size of the atom is roughly
    options:
      - 10^{-1} times
      - 10^{-2} times
      - 10^{-8} times
      - 10^{-4} to 10^{-5} times
    answer: 3
    explanation: Atoms are about 10^{-10} m across while nuclei are about 10^{-15}–10^{-14} m, so the nucleus is 10,000 to 100,000 times smaller than the atom. This is why most of an atom is empty space.

  - id: phy-atoms-004
    topic: thomson-rutherford
    subtopic: Rutherford nuclear model
    concept: Most of an atom is empty space
    category: concept
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    tags: [nuclear-model]
    stem: Which observation in the alpha-scattering experiment showed that most of the atom is empty space?
    options:
      - Most alpha particles passed through the foil almost undeflected
      - A few alpha particles bounced back
      - The foil became positively charged
      - Alpha particles were absorbed by the foil
    answer: 0
    explanation: Since the great majority of alpha particles went straight through the thin gold foil with little or no deflection, the atom must be mostly empty. The rare back-scattering instead showed that the positive charge is concentrated in a tiny nucleus.

  - id: phy-atoms-005
    topic: thomson-rutherford
    subtopic: Thomson vs Rutherford
    concept: Thomson model predicts only small deflections of alpha particles
    category: concept
    format: assertion-reason
    difficulty: 3
    time: 60
    ncert: true
    battle: false
    tags: [thomson-model, alpha-scattering]
    stem: |-
      Assertion (A): Thomson's model cannot explain the large-angle scattering of alpha particles by a gold foil.
      Reason (R): In Thomson's model the positive charge is spread over the whole atom, so the electric field inside is too weak to deflect a fast alpha particle by a large angle.
    options:
      - Both A and R are true and R is the correct explanation of A
      - Both A and R are true but R is not the correct explanation of A
      - A is true but R is false
      - A is false but R is true
    answer: 0
    explanation: A diffuse positive charge produces only a weak field, so a massive, fast alpha particle would be deflected by tiny angles only. Large-angle (even backward) scattering needs a strong field from charge concentrated in a tiny nucleus, so R correctly explains A.

  - id: phy-atoms-006
    topic: thomson-rutherford
    subtopic: Nuclear model
    concept: Electrons are held in orbit by electrostatic attraction
    category: concept
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    tags: [nuclear-model, centripetal-force]
    stem: In Rutherford's planetary model of the atom, the centripetal force on an orbiting electron is provided by
    options:
      - gravitational attraction of the nucleus
      - the magnetic force of the nucleus
      - the strong nuclear force
      - electrostatic attraction of the nucleus
    answer: 3
    explanation: The electron is kept in its orbit by the Coulomb attraction between the negative electron and the positive nucleus. Gravity is about 10^{39} times weaker and the nuclear force does not act on electrons.

  - id: phy-atoms-007
    topic: thomson-rutherford
    subtopic: Density of nucleus
    concept: Nuclear density is enormous compared with atomic density
    category: numerical
    format: direct
    difficulty: 3
    time: 60
    ncert: false
    battle: false
    tags: [nuclear-size, multi-concept]
    stem: If the radius of an atom is 10^5 times the radius of its nucleus and almost all the mass is in the nucleus, the density of the nucleus is about how many times the average density of the atom?
    options:
      - 10^5
      - 10^{10}
      - 10^{15}
      - 10^{20}
    answer: 2
    explanation: Density ∝ mass/volume and volume ∝ r^3. With the same mass, the ratio of densities is (10^5)^3 = 10^{15}. Choosing 10^5 forgets that volume goes as the cube of radius.

  - id: phy-atoms-008
    topic: thomson-rutherford
    subtopic: Rutherford nuclear model
    concept: Solar system analogy of Rutherford atom
    category: factual
    format: statements
    difficulty: 2
    time: 45
    ncert: true
    battle: false
    tags: [nuclear-model, ncert-line]
    stem: Which statement about Rutherford's nuclear model is correct?
    options:
      - The electrons are at rest around the nucleus
      - The atom is electrically positive overall
      - Electrons revolve around the nucleus, much as planets revolve around the sun
      - The nucleus contains all the electrons of the atom
    answer: 2
    explanation: Rutherford pictured electrons revolving around a tiny positive nucleus, like planets around the sun; revolution was needed because stationary electrons would fall into the nucleus. The atom as a whole is neutral and electrons are outside the nucleus.

  - id: phy-atoms-009
    topic: thomson-rutherford
    subtopic: History
    concept: Chronology of atomic models
    category: factual
    format: ordering
    difficulty: 2
    time: 40
    ncert: true
    battle: true
    tags: [history]
    stem: Arrange the atomic models in the order in which they were proposed. I Bohr model, II Thomson model, III Rutherford model.
    options:
      - I, II, III
      - III, II, I
      - II, I, III
      - II, III, I
    answer: 3
    explanation: Thomson proposed the plum pudding model in 1898, Rutherford the nuclear model in 1911 after the Geiger–Marsden experiments, and Bohr his quantised model in 1913.

  - id: phy-atoms-010
    topic: thomson-rutherford
    subtopic: Charge neutrality
    concept: Atom is neutral so nuclear charge equals total electron charge
    category: concept
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [atomic-number]
    stem: A neutral atom of atomic number Z has a nuclear charge of
    options:
      - +Ze
      - −Ze
      - +2Ze
      - zero
    answer: 0
    explanation: The nucleus carries charge +Ze and the Z electrons carry −Ze, so the atom as a whole is neutral. The nucleus itself is not neutral.

  - id: phy-atoms-011
    topic: alpha-scattering
    subtopic: Geiger–Marsden set-up
    concept: Gold foil used because it can be made very thin
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [geiger-marsden, ncert-line]
    stem: In the Geiger–Marsden experiment, the thickness of the gold foil used was about
    options:
      - 2.1 × 10^{-3} m
      - 2.1 × 10^{-5} m
      - 2.1 × 10^{-7} m
      - 2.1 × 10^{-10} m
    answer: 2
    explanation: NCERT gives the gold foil thickness as 2.1 × 10^{-7} m. Gold was used because it is highly malleable and can be beaten into such thin sheets that each alpha particle is likely to suffer at most one close encounter.

  - id: phy-atoms-012
    topic: alpha-scattering
    subtopic: Geiger–Marsden set-up
    concept: Scattered alpha particles detected by ZnS screen scintillations
    category: factual
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    tags: [geiger-marsden, ncert-line]
    stem: In the alpha-scattering experiment, scattered alpha particles were detected by
    options:
      - a Geiger counter tube
      - flashes on a zinc sulphide screen viewed through a microscope
      - blackening of a photographic plate
      - a cloud chamber
    answer: 1
    explanation: The scattered alpha particles struck a zinc sulphide screen, producing brief flashes (scintillations) that were counted through a rotatable microscope.

  - id: phy-atoms-013
    topic: alpha-scattering
    subtopic: Source of alpha particles
    concept: Alpha source in NCERT experiment is bismuth-214
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [geiger-marsden, ncert-line]
    stem: In the Geiger–Marsden experiment described in NCERT, 5.5 MeV alpha particles were emitted by
    options:
      - ^{238}_{92}U
      - ^{226}_{88}Ra
      - ^{210}_{84}Po
      - ^{214}_{83}Bi
    answer: 3
    explanation: The source was ^{214}_{83}Bi, emitting 5.5 MeV alpha particles that were collimated into a narrow beam by lead bricks before hitting the gold foil.

  - id: phy-atoms-014
    topic: alpha-scattering
    subtopic: Scattering formula
    concept: Number scattered ∝ 1/sin^4(θ/2)
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: false
    battle: true
    formula: N(θ) ∝ 1/sin^4(θ/2)
    tags: [rutherford-formula]
    stem: The number of alpha particles scattered at angle θ in Rutherford scattering is proportional to
    options:
      - 1/sin^4(θ/2)
      - 1/sin^2(θ/2)
      - sin^4(θ/2)
      - 1/sin^4 θ
    answer: 0
    explanation: Rutherford's formula gives N(θ) ∝ 1/sin^4(θ/2), so the count falls very steeply as θ increases. The half-angle is essential; using sin^4 θ is a common slip.

  - id: phy-atoms-015
    topic: alpha-scattering
    subtopic: Scattering formula
    concept: Ratio of counts at 60° and 90°
    category: numerical
    format: direct
    difficulty: 3
    time: 60
    ncert: false
    battle: false
    formula: N(θ) ∝ 1/sin^4(θ/2)
    tags: [rutherford-formula]
    stem: In a Rutherford scattering experiment, 400 alpha particles per minute are counted at θ = 90°. How many per minute are expected at θ = 60°, other conditions unchanged?
    options:
      - "200"
      - "800"
      - "1600"
      - "3200"
    answer: 2
    explanation: N ∝ 1/sin^4(θ/2). sin^4 45° = 1/4 and sin^4 30° = 1/16, so N(60°)/N(90°) = 16/4 = 4 and N = 4 × 400 = 1600. Using θ instead of θ/2 gives a wrong ratio.

  - id: phy-atoms-016
    topic: alpha-scattering
    subtopic: Observations
    concept: Only a small fraction of alpha particles is scattered by more than 1°
    category: factual
    format: direct
    difficulty: 3
    time: 40
    ncert: true
    battle: true
    tags: [geiger-marsden, ncert-line]
    stem: In the Geiger–Marsden experiment, roughly what fraction of incident alpha particles was scattered by more than 1°?
    options:
      - 0.14%
      - 14%
      - 50%
      - 1.4%
    answer: 0
    explanation: NCERT states that only about 0.14% of incident alpha particles scatter by more than 1°, and about 1 in 8000 deflect by more than 90°. This tiny fraction points to a small, dense nucleus.

  - id: phy-atoms-017
    topic: alpha-scattering
    subtopic: Why alpha is not deflected by electrons
    concept: Electrons are too light to deflect an alpha particle appreciably
    category: concept
    format: direct
    difficulty: 2
    time: 40
    ncert: true
    battle: true
    tags: [alpha-scattering, trap]
    stem: Electrons in the gold atoms hardly deflect the alpha particles in Rutherford scattering because
    options:
      - electrons carry no charge
      - electrons are much lighter than alpha particles
      - electrons repel alpha particles
      - electrons are inside the nucleus
    answer: 1
    explanation: An alpha particle is about 7300 times heavier than an electron, so collisions with electrons barely change its momentum, just as a bowling ball is not deflected by dust. Electrons are charged and actually attract the alpha particle.

  - id: phy-atoms-018
    topic: alpha-scattering
    subtopic: Nature of force
    concept: Scattering is due to Coulomb repulsion of the nucleus
    category: concept
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    tags: [alpha-scattering]
    stem: The large-angle deflection of an alpha particle by a gold nucleus is due to
    options:
      - gravitational attraction
      - strong nuclear attraction
      - magnetic force
      - Coulomb repulsion
    answer: 3
    explanation: The positively charged alpha particle is repelled by the positive gold nucleus through the Coulomb force. At the energies used the alpha particle never gets close enough for the nuclear force to act.

  - id: phy-atoms-019
    topic: alpha-scattering
    subtopic: Trajectory
    concept: Alpha particle trajectory near a nucleus is a hyperbola
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [trajectory]
    stem: The path of an alpha particle scattered by a heavy nucleus is
    options:
      - a straight line
      - a circle
      - a hyperbola
      - an ellipse
    answer: 2
    explanation: Under an inverse-square repulsive force the trajectory of an unbound particle is a hyperbola with the nucleus at the outer focus. Ellipses and circles belong to bound attractive orbits.

  - id: phy-atoms-020
    topic: alpha-scattering
    subtopic: Conditions of experiment
    concept: Experiment done in vacuum to avoid collisions with air molecules
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: false
    battle: true
    tags: [geiger-marsden]
    stem: Why is the alpha-scattering apparatus enclosed in an evacuated chamber?
    options:
      - To prevent the gold foil from oxidising
      - To increase the speed of alpha particles
      - To prevent alpha particles from being scattered or stopped by air molecules
      - To keep the zinc sulphide screen cool
    answer: 2
    explanation: Alpha particles have a short range in air (a few cm) and would be scattered and slowed by air molecules. A vacuum ensures only scattering by the foil is recorded.

  - id: phy-atoms-021
    topic: closest-approach-impact
    subtopic: Distance of closest approach
    concept: Head-on collision; KE converts fully to electrostatic PE
    category: concept
    format: direct
    difficulty: 2
    time: 40
    ncert: true
    battle: true
    formula: d = (1/4πε_0)(2Ze^2/K)
    tags: [closest-approach]
    stem: At the distance of closest approach of an alpha particle in a head-on collision with a heavy nucleus, the alpha particle's kinetic energy is
    options:
      - maximum
      - zero
      - half of its initial value
      - equal to its rest mass energy
    answer: 1
    explanation: In a head-on approach the alpha particle momentarily stops at the distance of closest approach, where all its kinetic energy has become electrostatic potential energy. It then turns back.

  - id: phy-atoms-022
    topic: closest-approach-impact
    subtopic: Distance of closest approach
    concept: d ∝ 1/K
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    formula: d = (1/4πε_0)(2Ze^2/K)
    tags: [closest-approach, proportionality]
    stem: If the kinetic energy of an alpha particle approaching a nucleus head-on is doubled, the distance of closest approach becomes
    options:
      - double
      - four times
      - one-fourth
      - half
    answer: 3
    explanation: From K = (1/4πε_0)(2Ze^2/d), d ∝ 1/K. Doubling K halves d. One-fourth would apply if the speed (not KE) were doubled.

  - id: phy-atoms-023
    topic: closest-approach-impact
    subtopic: Distance of closest approach
    concept: d ∝ 1/v^2
    category: concept
    format: direct
    difficulty: 3
    time: 40
    ncert: false
    battle: true
    tags: [closest-approach, trap, proportionality]
    stem: If the speed of an alpha particle approaching a nucleus head-on is doubled, the distance of closest approach becomes
    options:
      - one-fourth
      - half
      - double
      - unchanged
    answer: 0
    explanation: d ∝ 1/K and K ∝ v^2, so d ∝ 1/v^2. Doubling v makes K four times and d one-fourth. Half is the trap for doubling KE rather than speed.

  - id: phy-atoms-024
    topic: closest-approach-impact
    subtopic: Distance of closest approach
    concept: Numerical value with ke^2 = 1.44 MeV fm
    category: numerical
    format: direct
    difficulty: 3
    time: 75
    ncert: true
    battle: false
    formula: d = 2Z(ke^2)/K, ke^2 = 1.44 MeV fm
    tags: [closest-approach]
    stem: An alpha particle of kinetic energy 7.2 MeV approaches a tin nucleus (Z = 50) head-on. Taking e^2/4πε_0 = 1.44 MeV fm, the distance of closest approach is
    options:
      - 10 fm
      - 40 fm
      - 20 fm
      - 5 fm
    answer: 2
    explanation: d = 2Z(e^2/4πε_0)/K = 2 × 50 × 1.44/7.2 fm = 144/7.2 = 20 fm. Forgetting the factor 2 for the alpha charge gives 10 fm.

  - id: phy-atoms-025
    topic: closest-approach-impact
    subtopic: Impact parameter
    concept: Head-on collision has zero impact parameter and 180° scattering
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [impact-parameter, ncert-line]
    stem: For an alpha particle whose impact parameter is zero, the scattering angle is
    options:
      - 0°
      - 45°
      - 180°
      - 90°
    answer: 2
    explanation: Zero impact parameter means a head-on approach, so the alpha particle is stopped and turned straight back (θ = 180°). A very large impact parameter gives nearly zero deflection.

  - id: phy-atoms-026
    topic: closest-approach-impact
    subtopic: Impact parameter
    concept: Definition of impact parameter
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [impact-parameter, ncert-line]
    stem: The impact parameter in alpha-particle scattering is
    options:
      - the perpendicular distance of the initial velocity vector of the alpha particle from the centre of the nucleus
      - the minimum distance between the alpha particle and the nucleus
      - the radius of the nucleus
      - the distance between the source and the foil
    answer: 0
    explanation: NCERT defines the impact parameter as the perpendicular distance of the initial velocity line of the alpha particle from the centre of the nucleus. The minimum distance during flight is the distance of closest approach, a different quantity.

  - id: phy-atoms-027
    topic: closest-approach-impact
    subtopic: Impact parameter
    concept: Larger impact parameter gives smaller deflection
    category: concept
    format: statement-pair
    difficulty: 2
    time: 45
    ncert: true
    battle: false
    tags: [impact-parameter]
    stem: |-
      Statement I: An alpha particle with a large impact parameter suffers a large deflection.
      Statement II: For a given nucleus, the chance of head-on scattering is small because the nucleus is tiny.
    options:
      - Both Statement I and Statement II are correct
      - Both Statement I and Statement II are incorrect
      - Statement I is correct but Statement II is incorrect
      - Statement I is incorrect but Statement II is correct
    answer: 3
    explanation: A large impact parameter means the alpha particle passes far from the nucleus and is deflected only slightly, so Statement I is wrong. Statement II is correct; since the nucleus is tiny, very few particles have near-zero impact parameter, so back-scattering is rare.

  - id: phy-atoms-028
    topic: closest-approach-impact
    subtopic: Distance of closest approach
    concept: Closest approach gives upper bound on nuclear size
    category: concept
    format: direct
    difficulty: 3
    time: 45
    ncert: true
    battle: true
    tags: [closest-approach, nuclear-size]
    stem: The distance of closest approach in a head-on alpha-scattering experiment gives
    options:
      - the exact radius of the nucleus
      - an upper limit on the size of the nucleus
      - a lower limit on the size of the nucleus
      - the radius of the atom
    answer: 1
    explanation: Since the alpha particle is turned back purely by Coulomb repulsion without touching the nucleus, the nucleus must be smaller than the closest-approach distance. So it is an upper limit, not an exact value.

  - id: phy-atoms-029
    topic: closest-approach-impact
    subtopic: Distance of closest approach
    concept: d ∝ Z for fixed KE
    category: concept
    format: direct
    difficulty: 2
    time: 35
    ncert: false
    battle: true
    tags: [closest-approach, proportionality]
    stem: Alpha particles of the same kinetic energy are fired head-on at nuclei of atomic numbers Z and 2Z. The ratio of their distances of closest approach is
    options:
      - "2 : 1"
      - "1 : 4"
      - "4 : 1"
      - "1 : 2"
    answer: 3
    explanation: d = (1/4πε_0)(2Ze^2/K) so d ∝ Z. The ratio for Z and 2Z is 1 to 2.

  - id: phy-atoms-030
    topic: closest-approach-impact
    subtopic: Proton vs alpha
    concept: d ∝ charge of projectile at fixed KE
    category: application
    format: direct
    difficulty: 3
    time: 50
    ncert: false
    battle: true
    tags: [closest-approach, multi-concept]
    stem: "A proton and an alpha particle with the same kinetic energy approach the same nucleus head-on. The ratio of their distances of closest approach (proton : alpha) is"
    options:
      - "1 : 2"
      - "2 : 1"
      - "1 : 1"
      - "1 : 4"
    answer: 0
    explanation: "At closest approach K = k(q)(Ze)/d, so d ∝ q for the same K. The proton has charge e and the alpha 2e, so d_p : d_α = 1 : 2. Mass does not enter when KE is fixed."

  - id: phy-atoms-031
    topic: electron-orbits
    subtopic: Energy in orbit
    concept: Total energy of electron is negative, meaning it is bound
    category: concept
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    tags: [total-energy]
    stem: The total energy of an electron revolving around the nucleus is negative. This means that the electron
    options:
      - has negative kinetic energy
      - moves opposite to the field
      - is bound to the nucleus
      - is about to escape
    answer: 2
    explanation: A negative total energy means energy must be supplied to free the electron, i.e. it is bound. Kinetic energy is always positive; the negative sign comes from the larger negative potential energy.

  - id: phy-atoms-032
    topic: electron-orbits
    subtopic: Energy in orbit
    concept: KE = e^2/(8πε_0 r)
    category: factual
    format: direct
    difficulty: 2
    time: 35
    ncert: true
    battle: true
    formula: K = e^2/(8πε_0 r)
    tags: [kinetic-energy]
    stem: For an electron in a circular orbit of radius r around a hydrogen nucleus, the kinetic energy is
    options:
      - e^2/(4πε_0 r)
      - −e^2/(8πε_0 r)
      - e^2/(8πε_0 r)
      - e^2/(2πε_0 r)
    answer: 2
    explanation: mv^2/r = e^2/(4πε_0 r^2) gives mv^2 = e^2/(4πε_0 r), so K = ½mv^2 = e^2/(8πε_0 r). Kinetic energy is positive; −e^2/(8πε_0 r) is the total energy.

  - id: phy-atoms-033
    topic: electron-orbits
    subtopic: Energy in orbit
    concept: U = −2K and E = −K
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    formula: U = −2K, E = −K
    tags: [energy-relations]
    stem: For an electron in a circular orbit around a nucleus, the ratio of potential energy to kinetic energy is
    options:
      - "−1"
      - "−2"
      - "−1/2"
      - "2"
    answer: 1
    explanation: U = −e^2/(4πε_0 r) and K = e^2/(8πε_0 r), so U/K = −2. Hence E = K + U = −K.

  - id: phy-atoms-034
    topic: electron-orbits
    subtopic: Energy in orbit
    concept: Given total energy, find KE and PE
    category: numerical
    format: direct
    difficulty: 2
    time: 35
    ncert: true
    battle: true
    tags: [energy-relations]
    stem: The total energy of an electron in an orbit is −3.4 eV. Its kinetic and potential energies are respectively
    options:
      - −3.4 eV and −6.8 eV
      - 3.4 eV and −6.8 eV
      - 6.8 eV and −3.4 eV
      - 3.4 eV and −3.4 eV
    answer: 1
