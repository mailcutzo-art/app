questions:
  - id: phy-mam-001
    topic: bar-magnet-field-lines
    subtopic: Properties of field lines
    concept: Magnetic field lines form continuous closed loops
    category: concept
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    tags: [field-lines, ncert-line]
    stem: Magnetic field lines of a bar magnet
    options:
      - start at the north pole and end at the south pole
      - start at the south pole and end at the north pole
      - form continuous closed loops
      - exist only outside the magnet
    answer: 2
    explanation: Magnetic field lines have no starting or ending points; outside the magnet they run from N to S and inside from S to N, forming closed loops. Unlike electric field lines, they do not begin or end on "charges", because isolated magnetic poles do not exist.

  - id: phy-mam-002
    topic: bar-magnet-field-lines
    subtopic: Properties of field lines
    concept: Direction of field lines inside a bar magnet is from S to N
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [field-lines, trap]
    stem: Inside a bar magnet, the magnetic field lines run
    options:
      - from the south pole to the north pole
      - from the north pole to the south pole
      - perpendicular to the length of the magnet
      - nowhere, as the field inside is zero
    answer: 0
    explanation: Field lines are closed loops, so after emerging from the N pole and entering the S pole outside, they continue inside from S to N. The field inside a bar magnet is not zero; it points along the magnetic moment (S to N).

  - id: phy-mam-003
    topic: bar-magnet-field-lines
    subtopic: Properties of field lines
    concept: Two magnetic field lines never intersect
    category: concept
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    tags: [field-lines]
    stem: Two magnetic field lines can never intersect because
    options:
      - the field is always zero at the point of intersection
      - field lines repel each other
      - magnetic poles are always found in pairs
      - the field at a point has a unique direction
    answer: 3
    explanation: The tangent to a field line gives the direction of B at that point. If two lines crossed, there would be two tangents and hence two directions of B at the same point, which is impossible.

  - id: phy-mam-004
    topic: bar-magnet-field-lines
    subtopic: Field strength from line density
    concept: Density of field lines indicates field strength
    category: concept
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    tags: [field-lines]
    stem: The magnitude of the magnetic field at a point is represented by
    options:
      - the length of the field line through that point
      - the number of field lines crossing unit area normal to them
      - the curvature of the field line at that point
      - the angle the field line makes with the magnet's axis
    answer: 1
    explanation: The larger the number of field lines crossing a unit area placed normal to them, the stronger the field there. Direction is given by the tangent, magnitude by the line density.

  - id: phy-mam-005
    topic: bar-magnet-field-lines
    subtopic: Magnetic lines vs lines of force
    concept: Magnetic field lines are not lines of force on a moving charge
    category: concept
    format: statements
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [field-lines, trap, ncert-line]
    stem: Which statement about magnetic field lines is correct?
    options:
      - They show the direction of force on a moving positive charge
      - They are the paths followed by a free north pole in every case
      - They are not "lines of force", since the force on a moving charge is perpendicular to B
      - They begin on north poles and end on south poles like electric lines on charges
    answer: 2
    explanation: The magnetic force qv × B is perpendicular to B, so field lines do not give the direction of force on a moving charge. NCERT therefore warns that they are not strictly "lines of force", unlike electric field lines. They are also closed loops without ends.

  - id: phy-mam-006
    topic: bar-magnet-field-lines
    subtopic: Pole strength and magnetic moment
    concept: Magnetic moment equals pole strength times magnetic length
    category: numerical
    format: direct
    difficulty: 2
    time: 35
    ncert: false
    battle: true
    formula: m = q_m × 2l
    tags: [magnetic-moment, pole-strength]
    stem: A bar magnet has pole strength 5 A m and magnetic length 10 cm. Its magnetic moment is
    options:
      - 0.5 A m^2
      - 50 A m^2
      - 5 A m^2
      - 0.05 A m^2
    answer: 0
    explanation: m = q_m × 2l = 5 A m × 0.10 m = 0.5 A m^2. Using 10 cm without converting to metres gives the tempting wrong value 50 A m^2.

  - id: phy-mam-007
    topic: bar-magnet-field-lines
    subtopic: Cutting a magnet
    concept: Cutting a magnet perpendicular to its axis halves the moment but keeps pole strength
    category: concept
    format: direct
    difficulty: 3
    time: 45
    ncert: false
    battle: true
    tags: [cutting-magnet, trap]
    stem: A bar magnet of moment m is cut into two equal halves perpendicular to its length. Each half has pole strength and moment respectively
    options:
      - half of original, m
      - same as original, m/2
      - half of original, m/2
      - same as original, m
    answer: 1
    explanation: Cutting perpendicular to the length leaves the cross-section, and hence pole strength, unchanged but halves the magnetic length. So each piece has the same pole strength and moment q_m × l = m/2.

  - id: phy-mam-008
    topic: bar-magnet-field-lines
    subtopic: Cutting a magnet
    concept: Cutting a magnet along its length halves pole strength and moment
    category: concept
    format: direct
    difficulty: 3
    time: 45
    ncert: false
    battle: true
    tags: [cutting-magnet]
    stem: A bar magnet of moment m is cut into two equal parts along its length (parallel to its axis). Each part has
    options:
      - the same pole strength and moment m
      - the same pole strength and moment m/2
      - double the pole strength and moment m
      - half the pole strength and moment m/2
    answer: 3
    explanation: A lengthwise cut halves the cross-sectional area, so pole strength becomes q_m/2, while the length stays the same. Moment = (q_m/2)(2l) = m/2.

  - id: phy-mam-009
    topic: bar-magnet-field-lines
    subtopic: Bending a magnet
    concept: Bending a straight magnet into a semicircle reduces its moment to 2m/π
    category: numerical
    format: direct
    difficulty: 4
    time: 90
    ncert: false
    battle: false
    formula: m' = q_m × 2R, with πR = L
    tags: [bending-magnet, multi-concept]
    stem: A thin bar magnet of length L and moment m is bent into a semicircular arc. Its new magnetic moment is
    options:
      - m
      - m/π
      - 2m/π
      - πm/2
    answer: 2
    explanation: "Pole strength is unchanged. The arc length L = πR, so the straight distance between the poles is 2R = 2L/π. New moment = q_m × 2L/π = (2/π) m. Moment depends on the pole separation, not the length of the wire."

  - id: phy-mam-010
    topic: bar-magnet-field-lines
    subtopic: Bending a magnet
    concept: Bending a magnet at its midpoint into an L shape gives m/√2
    category: numerical
    format: direct
    difficulty: 3
    time: 60
    ncert: false
    battle: false
    tags: [bending-magnet]
    stem: A thin bar magnet of moment m is bent at its midpoint so that the two halves are at right angles. The new magnetic moment is
    options:
      - m/2
      - m/√2
      - √2 m
      - m
    answer: 1
    explanation: Each arm has length L/2, so the poles are now separated by √((L/2)^2 + (L/2)^2) = L/√2. With pole strength unchanged, m' = q_m × L/√2 = m/√2.

  - id: phy-mam-011
    topic: bar-magnet-field-lines
    subtopic: Properties of a bar magnet
    concept: Isolated magnetic poles do not exist
    category: concept
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    tags: [monopole, ncert-line]
    stem: If a bar magnet is broken into many small pieces, each piece
    options:
      - behaves as a complete magnet with N and S poles
      - has only a north pole or only a south pole
      - loses its magnetism completely
      - becomes a magnetic monopole
    answer: 0
    explanation: No matter how small a magnet is broken, each piece has both a north and a south pole. Isolated magnetic poles (monopoles) have never been observed, unlike isolated electric charges.

  - id: phy-mam-012
    topic: bar-magnet-field-lines
    subtopic: Iron filings pattern
    concept: Iron filings align along field lines
    category: factual
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    tags: [iron-filings, ncert-line]
    stem: When iron filings are sprinkled on a sheet of glass placed over a bar magnet and the sheet is tapped, the filings
    options:
      - spread out uniformly over the sheet
      - arrange themselves along the magnetic field lines
      - all collect at the centre of the magnet
      - arrange in straight lines perpendicular to the magnet
    answer: 1
    explanation: Each filing becomes a tiny induced magnet and aligns along the local field, so the pattern traces the field lines, crowded near the poles where the field is strong.

  - id: phy-mam-013
    topic: bar-magnet-field-lines
    subtopic: Magnetic moment direction
    concept: Magnetic moment of a bar magnet points from S to N
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [magnetic-moment]
    stem: The magnetic dipole moment vector of a bar magnet points
    options:
      - from its north pole to its south pole
      - perpendicular to its axis
      - from its south pole to its north pole
      - in the direction of the external field only
    answer: 2
    explanation: By convention the magnetic moment m points from the S pole to the N pole along the axis of the magnet, the same direction as the field inside the magnet.

  - id: phy-mam-014
    topic: bar-magnet-field-lines
    subtopic: Units
    concept: SI unit of magnetic moment is A m^2 or J T^{-1}
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [units, magnetic-moment]
    stem: Which of the following is a valid SI unit of magnetic dipole moment?
    options:
      - T m^{-2}
      - A m^{-1}
      - Wb m^{-2}
      - J T^{-1}
    answer: 3
    explanation: Potential energy U = −m·B, so m has units J/T, which equals A m^2. A m^{-1} is the unit of magnetisation and H; Wb m^{-2} is the tesla, the unit of B.

  - id: phy-mam-015
    topic: bar-magnet-field-lines
    subtopic: Neutral point
    concept: At a neutral point the net magnetic field is zero
    category: concept
    format: direct
    difficulty: 2
    time: 35
    ncert: false
    battle: true
    tags: [neutral-point]
    stem: A neutral point near a bar magnet placed in a uniform external magnetic field is a point where
    options:
      - the field of the magnet alone is zero
      - the external field is zero
      - the net magnetic field is zero
      - the magnet's field is perpendicular to the external field
    answer: 2
    explanation: At a neutral point the magnet's field is equal in magnitude and opposite in direction to the external field, so the resultant field vanishes. A compass placed there shows no preferred direction.

  - id: phy-mam-016
    topic: gauss-law-magnetism
    subtopic: Statement of Gauss's law
    concept: Net magnetic flux through any closed surface is zero
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    formula: ∮ B·dS = 0
    tags: [gauss-law, ncert-line]
    stem: According to Gauss's law for magnetism, the net magnetic flux through any closed surface is
    options:
      - equal to μ_0 times the enclosed pole strength
      - zero
      - equal to the enclosed current times μ_0
      - positive if a north pole is enclosed
    answer: 1
    explanation: "∮ B·dS = 0 for every closed surface: as many field lines leave the surface as enter it. This expresses the absence of magnetic monopoles."

  - id: phy-mam-017
    topic: gauss-law-magnetism
    subtopic: Physical meaning
    concept: Gauss's law for magnetism implies no magnetic monopoles
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [gauss-law, monopole]
    stem: Gauss's law for magnetism is a mathematical statement of the fact that
    options:
      - magnetic field lines can intersect
      - the magnetic field of a current is circular
      - isolated magnetic poles do not exist
      - magnetic flux is always conserved in time
    answer: 2
    explanation: If a monopole existed, a closed surface around it would have non-zero net flux. Since the net flux is always zero, the simplest magnetic element is a dipole or current loop.

  - id: phy-mam-018
    topic: gauss-law-magnetism
    subtopic: Flux through closed surfaces
    concept: Surface enclosing one pole of a magnet still has zero net flux
    category: application
    format: direct
    difficulty: 3
    time: 45
    ncert: true
    battle: true
    tags: [gauss-law, trap]
    stem: A closed surface is drawn around only the north pole end of a long bar magnet. The net magnetic flux through this surface is
    options:
      - positive, as field lines emerge from the N pole
      - negative, as lines enter the magnet
      - equal to μ_0 times the pole strength
      - zero
    answer: 3
    explanation: The lines that emerge outward from the N pole region are exactly matched by the lines entering the surface through the body of the magnet (field inside runs S to N). Since lines are closed loops, net flux through any closed surface is zero.

  - id: phy-mam-019
    topic: gauss-law-magnetism
    subtopic: Electric vs magnetic Gauss's law
    concept: Contrast between Gauss's laws for E and B
    category: concept
    format: statement-pair
    difficulty: 2
    time: 45
    ncert: true
    battle: false
    tags: [gauss-law, confused-pair]
    stem: |-
      Statement I: The net electric flux through a closed surface can be non-zero.
      Statement II: The net magnetic flux through a closed surface can be non-zero if the surface encloses one pole of a magnet.
    options:
      - Both Statement I and Statement II are correct
      - Both Statement I and Statement II are incorrect
      - Statement I is correct but Statement II is incorrect
      - Statement I is incorrect but Statement II is correct
    answer: 2
    explanation: Electric flux through a closed surface equals q_enclosed/ε_0 and is non-zero when net charge is enclosed. Magnetic flux through any closed surface is always zero because monopoles do not exist, even if one "pole" appears to be enclosed.

  - id: phy-mam-020
    topic: gauss-law-magnetism
    subtopic: Hemisphere flux
    concept: Flux through open face equals flux through curved face for a closed surface in B
    category: numerical
    format: direct
    difficulty: 3
    time: 60
    ncert: false
    battle: false
    tags: [gauss-law, flux]
    stem: A hemisphere of radius 10 cm is placed in a uniform magnetic field of 0.2 T directed perpendicular to its flat circular face. The magnitude of flux through its curved surface is (take π = 3.14)
    options:
      - 3.14 × 10^{-3} Wb
      - 1.26 × 10^{-2} Wb
      - 6.28 × 10^{-3} Wb
      - zero
    answer: 2
    explanation: Flat face and curved face together form a closed surface with zero net flux, so the curved surface carries the same magnitude as the flat face, BπR^2 = 0.2 × 3.14 × 0.01 = 6.28 × 10^{-3} Wb. "Zero" is the net flux of the whole closed surface, not of the curved part alone.

  - id: phy-mam-021
    topic: gauss-law-magnetism
    subtopic: Implication for field lines
    concept: Zero net flux means every field line entering a closed surface also leaves it
    category: concept
    format: assertion-reason
    difficulty: 2
    time: 45
    ncert: true
    battle: false
    tags: [gauss-law, field-lines]
    stem: |-
      Assertion (A): Magnetic field lines form closed loops.
      Reason (R): The net magnetic flux through any closed surface is zero.
    options:
      - Both A and R are true and R is the correct explanation of A
      - Both A and R are true but R is not the correct explanation of A
      - A is true but R is false
      - A is false but R is true
    answer: 0
    explanation: Zero net flux through every closed surface means no field line can start or end anywhere (no sources or sinks), so lines must close on themselves. R explains A.

  - id: phy-mam-022
    topic: equivalent-solenoid
    subtopic: Solenoid analogy
    concept: A bar magnet's field resembles that of a current-carrying solenoid
    category: factual
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    tags: [solenoid, ncert-line]
    stem: The magnetic field lines outside a finite current-carrying solenoid most closely resemble those of
    options:
      - a long straight current-carrying wire
      - a bar magnet
      - a single isolated magnetic pole
      - an electric point charge
    answer: 1
    explanation: A finite solenoid produces a field pattern identical in shape to that of a bar magnet, with one end acting as a north pole and the other as a south pole. This is why a bar magnet is modelled as an equivalent solenoid.

  - id: phy-mam-023
    topic: equivalent-solenoid
    subtopic: Current loop as dipole
    concept: Magnetic moment of a current loop is m = NIA
    category: numerical
    format: direct
    difficulty: 2
    time: 35
    ncert: true
    battle: true
    formula: m = NIA
    tags: [current-loop, magnetic-moment]
    stem: A circular coil of 50 turns and area 2 × 10^{-3} m^2 carries a current of 4 A. Its magnetic moment is
    options:
      - 0.04 A m^2
      - 0.2 A m^2
      - 0.4 A m^2
      - 4 A m^2
    answer: 2
    explanation: m = NIA = 50 × 4 × 2 × 10^{-3} = 0.4 A m^2, directed along the axis by the right-hand rule.

  - id: phy-mam-024
    topic: equivalent-solenoid
    subtopic: Solenoid moment
    concept: A solenoid's moment is the sum of the moments of its turns
    category: numerical
    format: direct
    difficulty: 2
    time: 45
    ncert: true
    battle: true
    formula: m = n(2l)IπR^2
    tags: [solenoid, magnetic-moment]
    stem: A solenoid has 1000 turns, cross-sectional area 1 × 10^{-4} m^2 and carries 2 A. The magnitude of its magnetic moment is
    options:
      - 0.02 A m^2
      - 2 A m^2
      - 20 A m^2
      - 0.2 A m^2
    answer: 3
    explanation: Each turn contributes IA and all point the same way, so m = NIA = 1000 × 2 × 1 × 10^{-4} = 0.2 A m^2.

  - id: phy-mam-025
    topic: equivalent-solenoid
    subtopic: Far-axis field of a solenoid
    concept: Far-axis field of solenoid equals dipole field 2m/r^3 form
    category: concept
    format: direct
    difficulty: 3
    time: 45
    ncert: true
    battle: true
    tags: [solenoid, dipole-field, ncert-line]
    stem: At a large distance r on the axis of a short solenoid of magnetic moment m, the magnetic field is
    options:
      - μ_0 m/(4πr^2)
      - μ_0 m/(2πr^3)
      - μ_0 m/(4πr^3)
      - μ_0 nI, independent of r
    answer: 1
    explanation: NCERT shows that for r much greater than the solenoid's length, B = (μ_0/4π)(2m/r^3) = μ_0 m/(2πr^3), exactly the axial field of a bar magnet of moment m. μ_0 nI is the field inside a long solenoid, not far away on its axis.

  - id: phy-mam-026
    topic: equivalent-solenoid
    subtopic: Polarity of a solenoid end
    concept: Anticlockwise current seen from an end makes that end a north pole
    category: concept
    format: direct
    difficulty: 2
    time: 35
    ncert: false
    battle: true
    tags: [solenoid, polarity]
    stem: Looking at one end of a current-carrying solenoid, the current is seen to flow anticlockwise. That end behaves as
    options:
      - a north pole
      - a south pole
      - a neutral region
      - a north pole only if the core is iron
    answer: 0
    explanation: By the right-hand rule, curling fingers anticlockwise (as seen by the observer) points the thumb, and hence m and the emerging field, toward the observer. Field lines emerge from that end, so it is a north pole.

  - id: phy-mam-027
    topic: equivalent-solenoid
    subtopic: Moving the compass test
    concept: Solenoid and bar magnet deflect a compass identically
    category: concept
    format: statements
    difficulty: 2
    time: 45
    ncert: true
    battle: false
    tags: [solenoid, analogy]
    stem: Which observation best supports treating a bar magnet as an equivalent solenoid?
    options:
      - A solenoid attracts copper filings while a bar magnet does not
      - A bar magnet and a solenoid of equal moment deflect a small compass in the same way at the same positions
      - The field inside a bar magnet is zero, as inside a solenoid
      - Only a solenoid has a magnetic moment
    answer: 1
    explanation: Moving a small compass around both shows identical deflections, and when suspended both align in the same way in a uniform field. Neither attracts copper; the field inside either is not zero; both have magnetic moments.

  - id: phy-mam-028
    topic: equivalent-solenoid
    subtopic: Atomic origin
    concept: Magnetism of a bar magnet arises from circulating atomic currents
    category: concept
    format: direct
    difficulty: 2
    time: 35
    ncert: true
    battle: true
    tags: [ampere-hypothesis, origin]
    stem: The equivalence of a bar magnet and a solenoid suggests that the magnetism of a bar magnet is due to
    options:
      - static magnetic charges at its ends
      - free electrons drifting along its length
      - protons held fixed in the lattice
      - circulating currents of electrons in its atoms
    answer: 3
    explanation: Ampere suggested that magnetism arises from tiny circulating currents. In a bar magnet the electron orbital and spin moments act like small current loops aligned together, just like the turns of a solenoid.

  - id: phy-mam-029
    topic: dipole-field
    subtopic: Axial field
    concept: Axial field of a short magnet B = (μ_0/4π)2m/r^3
    category: numerical
    format: direct
    difficulty: 2
    time: 40
    ncert: true
    battle: true
    formula: B_axial = (μ_0/4π)(2m/r^3)
    tags: [axial-field]
    stem: A short bar magnet has magnetic moment 0.5 A m^2. The magnetic field at a point 10 cm from its centre on its axis is
    options:
      - 1 × 10^{-4} T
      - 5 × 10^{-5} T
      - 2 × 10^{-4} T
      - 1 × 10^{-5} T
    answer: 0
    explanation: B = 10^{-7} × 2 × 0.5/(0.1)^3 = 10^{-7} × 1/10^{-3} = 1 × 10^{-4} T. Forgetting the factor 2 gives 5 × 10^{-5} T, the equatorial value.

  - id: phy-mam-030
    topic: dipole-field
    subtopic: Equatorial field
    concept: Equatorial field of a short magnet B = (μ_0/4π)m/r^3
    category: numerical
    format: direct
    difficulty: 2
    time: 40
    ncert: true
    battle: true
    formula: B_eq = (μ_0/4π)(m/r^3)
    tags: [equatorial-field]
    stem: A short bar magnet of moment 0.4 A m^2 produces what field at a distance of 20 cm on its equatorial line?
    options:
      - 1 × 10^{-5} T
      - 2 × 10^{-5} T
      - 5 × 10^{-6} T
      - 5 × 10^{-5} T
    answer: 2
    explanation: B = 10^{-7} × 0.4/(0.2)^3 = 4 × 10^{-8}/8 × 10^{-3} = 5 × 10^{-6} T. The axial field at the same distance would be twice this.

  - id: phy-mam-031
    topic: dipole-field
    subtopic: Axial vs equatorial
    concept: Axial field is twice equatorial field at same distance
    category: concept
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    tags: [axial-field, equatorial-field]
    stem: For a short bar magnet, the ratio of magnetic field at a point on its axis to that at a point on its equator at the same distance is
    options:
      - "1 : 1"
      - "1 : 2"
      - "4 : 1"
      - "2 : 1"
    answer: 3
    explanation: "B_axial = (μ_0/4π)(2m/r^3) and B_eq = (μ_0/4π)(m/r^3), so the ratio is 2 : 1 for equal distances."

  - id: phy-mam-032
    topic: dipole-field
    subtopic: Direction of equatorial field
    concept: Equatorial field is antiparallel to magnetic moment
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [equatorial-field, direction]
    stem: At a point on the equatorial line of a short bar magnet, the magnetic field is directed
    options:
      - along the magnetic moment
      - opposite to the magnetic moment
      - perpendicular to the magnet's axis, away from it
      - perpendicular to the magnet's axis, toward it
    answer: 1
    explanation: B_eq = −(μ_0/4π)(m/r^3), i.e. parallel to the axis but pointing from N to S, opposite to m. On the axis the field points along m.

  - id: phy-mam-033
    topic: dipole-field
    subtopic: Distance dependence
    concept: Dipole field falls as 1/r^3
    category: numerical
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
