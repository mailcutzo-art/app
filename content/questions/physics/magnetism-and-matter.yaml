      - free electrons in the metal flow along the field
    answer: 2
    explanation: In a diamagnetic atom the orbital moments cancel initially. An applied field speeds up electrons circulating one way and slows the others, leaving a net induced moment opposite to B, in the spirit of Lenz's law. Alignment of permanent dipoles describes paramagnetism; domain growth describes ferromagnetism.

