questions:
  - id: phy-mcm-001
    topic: lorentz-force
    subtopic: Force on a stationary charge
    concept: A charge at rest experiences no magnetic force
    category: concept
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [magnetic-force, trap]
    stem: A point charge q is held at rest in a uniform magnetic field B. The magnetic force on it is
    options:
      - qB
      - zero
      - qB directed along the field
      - qB directed opposite to the field
    answer: 1
    explanation: The magnetic force is F = q(v × B). For v = 0 the force vanishes whatever the value of q or B. The options with qB are not even dimensionally a force.

  - id: phy-mcm-002
    topic: lorentz-force
    subtopic: Magnitude of magnetic force
    concept: F = qvB for velocity perpendicular to field
    category: numerical
    format: direct
    difficulty: 1
    time: 30
    ncert: true
    battle: true
    formula: F = qvB sinθ
    tags: [magnetic-force]
    stem: A proton moves at 2 × 10^6 m s^{-1} perpendicular to a uniform magnetic field of 0.5 T. The magnetic force on it is
    options:
      - 3.2 × 10^{-13} N
      - 6.4 × 10^{-13} N
      - 1.6 × 10^{-13} N
      - 0.8 × 10^{-13} N
    answer: 2
    explanation: F = qvB = 1.6 × 10^{-19} × 2 × 10^6 × 0.5 = 1.6 × 10^{-13} N. Forgetting the factor 0.5 gives 3.2 × 10^{-13} N.

  - id: phy-mcm-003
    topic: lorentz-force
    subtopic: Work done by magnetic force
    concept: Magnetic force does no work on a moving charge
    category: concept
    format: assertion-reason
    difficulty: 2
    time: 40
    ncert: true
    battle: false
    tags: [work, magnetic-force, ncert-line]
    stem: |-
      Assertion (A): The kinetic energy of a charged particle moving in a uniform magnetic field alone remains constant.
      Reason (R): The magnetic force on a moving charge is always perpendicular to its velocity.
    options:
      - Both A and R are true and R is the correct explanation of A
      - Both A and R are true but R is not the correct explanation of A
      - A is true but R is false
      - A is false but R is true
    answer: 0
    explanation: Because F = q(v × B) is perpendicular to v, the power F·v is zero, so no work is done and the speed and kinetic energy stay constant. R directly explains A.

  - id: phy-mcm-004
    topic: lorentz-force
    subtopic: Charge moving along the field
    concept: No magnetic force when velocity is parallel to B
    category: concept
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [magnetic-force]
    stem: An electron moves along the direction of a uniform magnetic field. Its path will be
    options:
      - a circle
      - a helix
      - a parabola
      - a straight line
    answer: 3
    explanation: With v parallel to B, sin θ = 0, so F = qvB sin θ = 0. The electron moves on in a straight line with unchanged velocity. A helix needs a velocity component perpendicular to B.

  - id: phy-mcm-005
    topic: lorentz-force
    subtopic: Lorentz force
    concept: Adding electric and magnetic forces in the Lorentz force
    category: numerical
    format: direct
    difficulty: 3
    time: 75
    ncert: true
    battle: false
    formula: F = q(E + v × B)
    tags: [lorentz-force, vectors, multi-concept]
    stem: A charge of 2 μC moves with velocity 10^3 î m s^{-1} in a region where E = 100 k̂ V m^{-1} and B = 0.2 ĵ T. The net Lorentz force on it is
    options:
      - 2 × 10^{-4} N along +z
      - 6 × 10^{-4} N along +z
      - 2 × 10^{-4} N along −z
      - 4 × 10^{-4} N along −z
    answer: 1
    explanation: Electric part qE = 2 × 10^{-6} × 100 = 2 × 10^{-4} N along +z. Magnetic part q(v × B) = 2 × 10^{-6} × 10^3 × 0.2 (î × ĵ) = 4 × 10^{-4} N along +z. Both add to 6 × 10^{-4} N along +z.

  - id: phy-mcm-006
    topic: lorentz-force
    subtopic: Direction of magnetic force
    concept: Sign of charge reverses the direction of v × B force
    category: application
    format: direct
    difficulty: 2
    time: 40
    ncert: false
    battle: true
    tags: [direction, electron, trap]
    stem: An electron moves along +x in a uniform magnetic field directed along +y. The magnetic force on the electron is along
    options:
      - +z
      - −z
      - +y
      - −x
    answer: 1
    explanation: î × ĵ = k̂, so a positive charge would feel a force along +z. The electron's negative charge reverses this, giving −z. Choosing +z ignores the sign of the charge.

  - id: phy-mcm-007
    topic: lorentz-force
    subtopic: Units of magnetic field
    concept: Tesla in base units and relation to gauss
    category: factual
    format: statements
    difficulty: 2
    time: 35
    ncert: true
    battle: false
    tags: [units, ncert-line]
    stem: Which of the following statements about the unit of magnetic field is correct?
    options:
      - 1 T = 1 N A m^{-1}
      - 1 T = 10^{-4} G
      - 1 T = 1 N A^{-1} m^{-1}
      - 1 T = 1 N C^{-1}
    answer: 2
    explanation: From F = qvB, B = F/(qv) has unit N s C^{-1} m^{-1} = N A^{-1} m^{-1}, which is the tesla. Also 1 T = 10^4 G, not 10^{-4} G. N C^{-1} is the unit of electric field.

  - id: phy-mcm-009
    topic: lorentz-force
    subtopic: Magnitude at an angle
    concept: F = qvB sinθ with θ = 30°
    category: numerical
    format: direct
    difficulty: 2
    time: 40
    ncert: true
    battle: true
    formula: F = qvB sinθ
    tags: [magnetic-force]
    stem: A 1 μC charge moves at 2 × 10^4 m s^{-1} at 30° to a 0.5 T magnetic field. The magnetic force on it is
    options:
      - 5 × 10^{-3} N
      - 1 × 10^{-2} N
      - 8.7 × 10^{-3} N
      - 2.5 × 10^{-3} N
    answer: 0
    explanation: F = qvB sin 30° = 10^{-6} × 2 × 10^4 × 0.5 × 0.5 = 5 × 10^{-3} N. Using cos 30° instead gives 8.7 × 10^{-3} N.

  - id: phy-mcm-010
    topic: lorentz-force
    subtopic: Properties of magnetic force
    concept: Features of the magnetic force qv × B
    category: concept
    format: multi-statement
    difficulty: 3
    time: 60
    ncert: true
    battle: false
    tags: [magnetic-force, ncert-line]
    stem: |-
      Consider the magnetic force on a moving point charge.
      I. It depends on the velocity of the charge.
      II. It can change the speed of the charge.
      III. It is perpendicular to both v and B.
      IV. It is zero for a neutral particle.
      Which statements are correct?
    options:
      - I and II only
      - I, III and IV only
      - II and IV only
      - I, II and III only
    answer: 1
    explanation: The force q(v × B) depends on v, is perpendicular to both v and B, and vanishes when q = 0. Being perpendicular to v it cannot change the speed, so II is wrong.

  - id: phy-mcm-011
    topic: lorentz-force
    subtopic: Vector form of magnetic force
    concept: Evaluating q(v × B) in component form
    category: numerical
    format: direct
    difficulty: 4
    time: 100
    ncert: false
    battle: false
    formula: F = q(v × B)
    tags: [vectors, cross-product]
    stem: A proton moves with velocity (2î + 3ĵ) × 10^6 m s^{-1} in a magnetic field 0.5 k̂ T. The magnetic force on it is
    options:
      - (2.4î − 1.6ĵ) × 10^{-13} N
      - (−2.4î + 1.6ĵ) × 10^{-13} N
      - (1.6î − 2.4ĵ) × 10^{-13} N
      - (2.4î + 1.6ĵ) × 10^{-13} N
    answer: 0
    explanation: v × B = 0.5 × 10^6 (2 î × k̂ + 3 ĵ × k̂) = 0.5 × 10^6 (−2ĵ + 3î) = (1.5î − ĵ) × 10^6. Multiplying by 1.6 × 10^{-19} C gives (2.4î − 1.6ĵ) × 10^{-13} N. Remember î × k̂ = −ĵ.

  - id: phy-mcm-012
    topic: circular-helical-motion
    subtopic: Radius of circular path
    concept: r = mv/(qB) for a proton
    category: numerical
    format: direct
    difficulty: 2
    time: 45
    ncert: true
    battle: true
    formula: r = mv/(qB)
    tags: [radius, proton]
    stem: A proton (m = 1.67 × 10^{-27} kg) moves at 10^6 m s^{-1} perpendicular to a 0.1 T field. The radius of its circular path is about
    options:
      - 1.04 cm
      - 5.2 cm
      - 10.4 cm
      - 104 cm
    answer: 2
    explanation: r = mv/(qB) = (1.67 × 10^{-27} × 10^6)/(1.6 × 10^{-19} × 0.1) = 0.104 m ≈ 10.4 cm.

  - id: phy-mcm-013
    topic: circular-helical-motion
    subtopic: Period of revolution
    concept: Period is independent of speed and radius
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    formula: T = 2πm/(qB)
    tags: [period, ncert-line]
    stem: The time period of a charged particle moving in a circle in a uniform magnetic field is independent of its
    options:
      - charge
      - mass
      - speed
      - the magnetic field
    answer: 2
    explanation: T = 2πr/v = 2πm/(qB). A faster particle moves on a proportionally larger circle, so T does not depend on speed, but it does depend on m, q and B.

  - id: phy-mcm-014
    topic: circular-helical-motion
    subtopic: Comparing radii
    concept: Radii of proton and alpha particle at equal speed
    category: numerical
    format: direct
    difficulty: 3
    time: 50
    ncert: false
    battle: true
    formula: r = mv/(qB)
    tags: [radius, alpha-particle, ratio]
    stem: A proton and an α-particle enter a uniform magnetic field perpendicularly with the same speed. The ratio of their radii r_p to r_α is
    options:
      - "1 : 1"
      - "2 : 1"
      - "1 : 4"
      - "1 : 2"
    answer: 3
    explanation: r = mv/(qB). For the α-particle m is 4 times and q is 2 times that of the proton, so r_α = 2r_p, giving a ratio of 1 to 2.

  - id: phy-mcm-015
    topic: circular-helical-motion
    subtopic: Equal kinetic energy
    concept: r = √(2mK)/(qB) comparison for p, d and α
    category: application
    format: ordering
    difficulty: 4
    time: 90
    ncert: false
    battle: false
    formula: r = √(2mK)/(qB)
    tags: [radius, kinetic-energy, trap, multi-concept]
    stem: A proton, a deuteron and an α-particle having the same kinetic energy move perpendicular to the same uniform magnetic field. The correct relation between their radii is
    options:
      - r_p < r_d < r_α
      - r_p = r_α < r_d
      - r_α < r_p < r_d
      - r_p = r_d = r_α
    answer: 1
    explanation: r = √(2mK)/(qB) ∝ √m/q. Proton √1/1 = 1, deuteron √2/1 = √2, α-particle √4/2 = 1. So r_p = r_α < r_d.

  - id: phy-mcm-016
    topic: circular-helical-motion
    subtopic: Accelerated through a potential difference
    concept: r = √(2mV/q)/B after acceleration through V
    category: application
    format: direct
    difficulty: 4
    time: 90
    ncert: false
    battle: false
    formula: r = (1/B)√(2mV/q)
    tags: [radius, potential-difference, multi-concept]
    stem: A proton, a deuteron and an α-particle are accelerated from rest through the same potential difference and then enter a uniform magnetic field perpendicularly. Which relation holds for their radii?
    options:
      - r_p = r_d = r_α
      - r_p > r_d = r_α
      - r_d = r_α > r_p
      - r_α > r_d > r_p
    answer: 2
    explanation: K = qV, so r = √(2mqV)/(qB) = (1/B)√(2mV/q) ∝ √(m/q). Proton √1, deuteron √2, α-particle √(4/2) = √2. Hence r_d = r_α > r_p.

  - id: phy-mcm-017
    topic: circular-helical-motion
    subtopic: Helical motion
    concept: Pitch equals 2π times radius when θ = 45°
    category: application
    format: direct
    difficulty: 3
    time: 60
    ncert: true
    battle: false
    formula: p = 2πm v cosθ/(qB), r = m v sinθ/(qB)
    tags: [helix, pitch]
    stem: A charged particle enters a uniform magnetic field with its velocity at 45° to the field. The ratio of the pitch of its helical path to the radius of the helix is
    options:
      - "1"
      - π
      - 2π
      - 4π
    answer: 2
    explanation: Pitch p = v cosθ × T = 2πm v cosθ/(qB) and radius r = m v sinθ/(qB). So p/r = 2π cotθ = 2π for θ = 45°.

  - id: phy-mcm-018
    topic: circular-helical-motion
    subtopic: Effect of doubling speed
    concept: Doubling speed doubles radius, period unchanged
    category: concept
    format: statements
    difficulty: 2
    time: 40
    ncert: true
    battle: false
    tags: [radius, period]
    stem: The speed of a charged particle moving in a circle in a uniform magnetic field is doubled. Which statement is correct?
    options:
      - Radius doubles and period halves
      - Radius stays the same and period halves
      - Radius doubles and period stays the same
      - Radius becomes four times and period doubles
    answer: 2
    explanation: r = mv/(qB) is proportional to v, so it doubles. T = 2πm/(qB) contains no v, so the period is unchanged.

  - id: phy-mcm-019
    topic: circular-helical-motion
    subtopic: Speed in a magnetic field
    concept: Speed constant, velocity changes in magnetic field
    category: concept
    format: statement-pair
    difficulty: 2
    time: 40
    ncert: true
    battle: false
    tags: [velocity, momentum]
    stem: |-
      A charged particle moves in a uniform magnetic field with no other force acting.
      Statement I: Its speed remains constant.
      Statement II: Its linear momentum remains constant.
    options:
      - Both Statement I and Statement II are correct
      - Both Statement I and Statement II are incorrect
      - Statement I is correct but Statement II is incorrect
      - Statement I is incorrect but Statement II is correct
    answer: 2
    explanation: The magnetic force does no work, so speed is constant. But the force continuously changes the direction of velocity, so the momentum vector changes (unless v is parallel to B, which is not implied).

  - id: phy-mcm-020
    topic: circular-helical-motion
    subtopic: Angular frequency
    concept: ω = qB/m and T = 2π/ω
    category: numerical
    format: direct
    difficulty: 2
    time: 40
    ncert: false
    battle: true
    formula: ω = qB/m
    tags: [period, angular-frequency]
    stem: A particle with specific charge q/m = 10^8 C kg^{-1} moves in a circle in a 0.1 T field. Its time period is
    options:
      - 2π × 10^{-7} s
      - 10^{-7} s
      - 2π × 10^{-9} s
      - π × 10^{-7} s
    answer: 0
    explanation: ω = (q/m)B = 10^8 × 0.1 = 10^7 rad s^{-1}, so T = 2π/ω = 2π × 10^{-7} s.

  - id: phy-mcm-021
    topic: circular-helical-motion
    subtopic: Momentum from radius
    concept: p = qBr
    category: numerical
    format: direct
    difficulty: 2
    time: 40
    ncert: false
    battle: true
    formula: p = qBr
    tags: [momentum, radius]
    stem: A singly charged ion moves in a circle of radius 0.2 m in a 0.5 T field. Its linear momentum is
    options:
      - 3.2 × 10^{-20} kg m s^{-1}
      - 0.8 × 10^{-20} kg m s^{-1}
      - 1.6 × 10^{-19} kg m s^{-1}
      - 1.6 × 10^{-20} kg m s^{-1}
    answer: 3
    explanation: p = mv = qBr = 1.6 × 10^{-19} × 0.5 × 0.2 = 1.6 × 10^{-20} kg m s^{-1}.

  - id: phy-mcm-022
    topic: circular-helical-motion
    subtopic: Radius versus momentum
    concept: r ∝ p in a fixed field
    category: concept
    format: graph
    difficulty: 2
    time: 35
    ncert: false
    battle: false
    tags: [graph, radius, momentum]
    stem: For a given charged particle moving perpendicular to a fixed uniform magnetic field, the graph of radius r of the circular path (y-axis) against its momentum p (x-axis) is
    options:
      - a rectangular hyperbola
      - a straight line through the origin
      - a parabola opening upward
      - a line parallel to the p-axis
    answer: 1
    explanation: r = p/(qB), so for fixed q and B the radius is directly proportional to p, giving a straight line through the origin with slope 1/(qB).

  - id: phy-mcm-023
    topic: velocity-selector-cyclotron
    subtopic: Velocity selector
    concept: Undeflected speed v = E/B
    category: numerical
    format: direct
    difficulty: 1
    time: 30
    ncert: true
    battle: true
    formula: v = E/B
    tags: [velocity-selector]
    stem: In crossed fields E = 3 × 10^4 V m^{-1} and B = 0.2 T, the speed of a charged particle that passes undeflected is
    options:
      - 6 × 10^3 m s^{-1}
      - 1.5 × 10^5 m s^{-1}
      - 6.7 × 10^{-6} m s^{-1}
      - 1.5 × 10^4 m s^{-1}
    answer: 1
    explanation: The particle is undeflected when qE = qvB, so v = E/B = 3 × 10^4/0.2 = 1.5 × 10^5 m s^{-1}.

  - id: phy-mcm-024
    topic: velocity-selector-cyclotron
    subtopic: Velocity selector
    concept: Selection is independent of charge and mass
    category: concept
    format: statements
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [velocity-selector, ncert-line]
    stem: In a velocity selector with mutually perpendicular E and B, which statement is correct?
    options:
      - Only positive ions of speed E/B pass undeflected
      - Particles of speed E/B pass undeflected whatever their charge or mass
      - Only particles of a particular mass pass undeflected
      - Particles of speed B/E pass undeflected
    answer: 1
    explanation: The balance condition qE = qvB gives v = E/B; q cancels and mass does not appear. Reversing the sign of q reverses both forces, so negative particles of that speed also pass undeflected.

  - id: phy-mcm-025
    topic: velocity-selector-cyclotron
    subtopic: Cyclotron frequency
    concept: Cyclotron frequency independent of speed and radius
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    formula: ν = qB/(2πm)
    tags: [cyclotron, ncert-line]
    stem: The operation of a cyclotron is based on the fact that the frequency of revolution of a charged particle in a magnetic field is independent of its
    options:
      - charge
      - mass
      - energy
      - the magnetic field strength
    answer: 2
    explanation: ν_c = qB/(2πm) contains no speed or energy, so the oscillator can be kept at a fixed frequency while the particle gains energy and spirals outward.

  - id: phy-mcm-026
    topic: velocity-selector-cyclotron
    subtopic: Maximum kinetic energy
    concept: K_max = q²B²R²/(2m)
    category: numerical
    format: direct
    difficulty: 4
    time: 100
    ncert: true
    battle: false
    formula: K = q^2B^2R^2/(2m)
    tags: [cyclotron, kinetic-energy]
    stem: A cyclotron with dee radius 0.5 m and magnetic field 1 T accelerates protons (m = 1.67 × 10^{-27} kg). The maximum kinetic energy of the emerging protons is about
    options:
      - 6 MeV
      - 24 MeV
      - 3 MeV
      - 12 MeV
    answer: 3
    explanation: v = qBR/m, so K = q^2B^2R^2/(2m) = (1.6 × 10^{-19})^2 × 1 × 0.25/(2 × 1.67 × 10^{-27}) ≈ 1.92 × 10^{-12} J. Dividing by 1.6 × 10^{-13} J per MeV gives about 12 MeV.

  - id: phy-mcm-027
    topic: velocity-selector-cyclotron
    subtopic: Limitations of cyclotron
    concept: Neutral particles cannot be accelerated
    category: factual
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    tags: [cyclotron]
    stem: Which of these particles cannot be accelerated by a cyclotron?
    options:
      - Proton
      - Deuteron
      - α-particle
      - Neutron
    answer: 3
    explanation: A cyclotron accelerates particles with the electric field across the gap and bends them with the magnetic field; both act only on charged particles, so the neutral neutron cannot be accelerated.

  - id: phy-mcm-028
    topic: velocity-selector-cyclotron
    subtopic: Roles of fields in cyclotron
    concept: E accelerates, B bends in a cyclotron
    category: concept
    format: statement-pair
    difficulty: 2
    time: 40
    ncert: true
    battle: false
    tags: [cyclotron, ncert-line]
    stem: |-
      Statement I: In a cyclotron the magnetic field increases the speed of the ions.
      Statement II: The alternating electric field across the gap between the dees increases the energy of the ions.
    options:
      - Both Statement I and Statement II are correct
      - Both Statement I and Statement II are incorrect
      - Statement I is correct but Statement II is incorrect
      - Statement I is incorrect but Statement II is correct
    answer: 3
    explanation: The magnetic field only bends the ions into semicircles and does no work. Energy is gained each time the ion crosses the gap, where the alternating electric field accelerates it.

  - id: phy-mcm-029
    topic: velocity-selector-cyclotron
    subtopic: Oscillator frequency
    concept: Cyclotron frequency for protons in 1 T
    category: numerical
    format: direct
    difficulty: 3
    time: 60
    ncert: true
    battle: false
    formula: ν = qB/(2πm)
    tags: [cyclotron, frequency]
    stem: The oscillator frequency needed to accelerate protons (m = 1.67 × 10^{-27} kg) in a cyclotron with magnetic field 1 T is about
    options:
      - 15 MHz
      - 30 MHz
      - 7.6 MHz
      - 96 MHz
    answer: 0
    explanation: ν = qB/(2πm) = 1.6 × 10^{-19} × 1/(2π × 1.67 × 10^{-27}) ≈ 1.5 × 10^7 Hz ≈ 15 MHz. Omitting the 2π gives about 96 MHz.

  - id: phy-mcm-030
    topic: velocity-selector-cyclotron
    subtopic: Crossed fields
    concept: Particle faster than E/B deflects toward magnetic force
    category: application
    format: direct
    difficulty: 3
    time: 60
    ncert: false
    battle: false
    tags: [velocity-selector, crossed-fields]
    stem: In a velocity selector set for speed E/B, a positive ion enters with a speed greater than E/B. The ion will
    options:
      - pass undeflected
      - deflect in the direction of the electric force
      - deflect in the direction of the magnetic force
      - be brought to rest
    answer: 2
    explanation: The magnetic force qvB grows with speed while qE is fixed. For v > E/B, qvB > qE, so the net force and the deflection are along the magnetic force.

  - id: phy-mcm-031
    topic: velocity-selector-cyclotron
    subtopic: Effect of doubling B
    concept: K_max ∝ B² in a cyclotron
    category: numerical
    format: direct
    difficulty: 3
    time: 45
    ncert: false
    battle: true
    formula: K = q^2B^2R^2/(2m)
    tags: [cyclotron, proportionality]
    stem: If the magnetic field in a cyclotron is doubled keeping the dee radius fixed, the maximum kinetic energy of the protons becomes
    options:
      - twice
      - half
      - unchanged
      - four times
    answer: 3
    explanation: K_max = q^2B^2R^2/(2m) ∝ B^2, so doubling B makes it four times. (The oscillator frequency must also be doubled.)

  - id: phy-mcm-032
    topic: velocity-selector-cyclotron
    subtopic: Velocity selector design
    concept: B = E/v for a required speed
    category: numerical
    format: direct
    difficulty: 2
    time: 35
    ncert: false
    battle: true
    formula: B = E/v
    tags: [velocity-selector]
    stem: A velocity selector must pass electrons of speed 2 × 10^6 m s^{-1} using an electric field of 10^4 V m^{-1}. The required magnetic field is
    options:
