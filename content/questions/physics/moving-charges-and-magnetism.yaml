  - id: phy-mcm-498
    topic: galvanometer
    subtopic: Rules of conversion
    concept: Shunt for ammeter, series resistance for voltmeter, range dependence
    category: concept
    format: multi-statement
    difficulty: 3
    time: 55
    ncert: true
    battle: false
    tags: [ammeter, voltmeter, shunt]
    stem: |-
      About converting a galvanometer into meters:
      I. For an ammeter, a shunt is connected in parallel.
      II. For a voltmeter, a resistance is connected in series.
      III. An ammeter of larger range needs a smaller shunt.
      IV. A voltmeter of larger range needs a smaller series resistance.
      Which statements are correct?
    options:
      - I and II only
      - I, II and III only
      - II, III and IV only
      - I, II, III and IV
    answer: 1
    explanation: S = I_g G/(I − I_g) falls as I rises, while R = V/I_g − G rises with V. So IV is false and the others are correct.

