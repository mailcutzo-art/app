questions:
  - id: phy-wep-001
    topic: scalar-product
    subtopic: Dot product of unit vectors
    concept: î·î = 1 and î·ĵ = 0
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [unit-vectors, ncert-line]
    stem: For the Cartesian unit vectors, the value of î·î + î·ĵ is
    options:
      - "0"
      - "1"
      - "2"
      - "√2"
    answer: 1
    explanation: Parallel unit vectors give î·î = 1 × 1 × cos 0° = 1, while perpendicular ones give î·ĵ = cos 90° = 0. The sum is 1.
  - id: phy-wep-002
    topic: scalar-product
    subtopic: Dot product in component form
    concept: A·B = A_xB_x + A_yB_y + A_zB_z
    category: numerical
    format: direct
    difficulty: 1
    time: 30
    ncert: true
    battle: true
    formula: A·B = A_xB_x + A_yB_y + A_zB_z
    tags: [components]
    stem: If A = 2î + 3ĵ − k̂ and B = î − ĵ + 4k̂, then A·B equals
    options:
      - "−5"
      - "5"
      - "9"
      - "−9"
    answer: 0
    explanation: A·B = (2)(1) + (3)(−1) + (−1)(4) = 2 − 3 − 4 = −5.
  - id: phy-wep-003
    topic: scalar-product
    subtopic: Angle between vectors
    concept: cos θ = A·B / (AB)
    category: numerical
    format: direct
    difficulty: 2
    time: 40
    ncert: true
    battle: true
    formula: cos θ = A·B/(|A||B|)
    tags: [angle-between-vectors]
    stem: The angle between the vectors A = î + ĵ and B = ĵ + k̂ is
    options:
      - 30°
      - 45°
      - 90°
      - 60°
    answer: 3
    explanation: A·B = 0 + 1 + 0 = 1 and |A| = |B| = √2, so cos θ = 1/2 and θ = 60°. Many pick 90° thinking the vectors share no component, but both have a ĵ part.
  - id: phy-wep-004
    topic: scalar-product
    subtopic: Perpendicular vectors
    concept: Perpendicular vectors have zero dot product
    category: numerical
    format: direct
    difficulty: 3
    time: 50
    ncert: false
    battle: true
    tags: [perpendicular]
    stem: For what value of a are the vectors 2î + aĵ + k̂ and 4î − 2ĵ − 2k̂ perpendicular?
    options:
      - "1"
      - "2"
      - "−3"
      - "3"
    answer: 3
    explanation: Setting the dot product to zero, 8 − 2a − 2 = 0, so a = 3.
  - id: phy-wep-005
    topic: scalar-product
    subtopic: Properties of dot product
    concept: Dot product is commutative and distributive
    category: concept
    format: statements
    difficulty: 2
    time: 40
    ncert: true
    battle: false
    tags: [properties, ncert-line]
    stem: Which of the following statements about the scalar product of two vectors is correct?
    options:
      - A·B = −B·A
      - A·(B + C) = A·B + A·C
      - A·B is a vector along the bisector of A and B
      - A·A can be negative if A points along a negative axis
    answer: 1
    explanation: The scalar product obeys the distributive law and is commutative (A·B = B·A). It is a scalar, and A·A = A^2 is never negative.
  - id: phy-wep-006
    topic: scalar-product
    subtopic: Projection of a vector
    concept: Component of A along B = A·B/|B|
    category: numerical
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    formula: A cos θ = A·B/|B|
    tags: [projection]
    stem: The component (projection) of A = 3î + 4ĵ along B = î + ĵ is
    options:
      - 7 units
      - 7/√2 units
      - 5 units
      - 7/2 units
    answer: 1
    explanation: Projection = A·B/|B| = (3 + 4)/√2 = 7/√2. Dividing by |B|^2 = 2 gives 7/2, which is the coefficient of the vector projection, not the scalar component.
  - id: phy-wep-007
    topic: scalar-product
    subtopic: Magnitude from dot product
    concept: "|A + B|^2 = A^2 + B^2 + 2A·B"
    category: application
    format: direct
    difficulty: 3
    time: 60
    ncert: false
    battle: false
    formula: "|A + B|^2 = A^2 + B^2 + 2A·B"
    tags: [multi-concept]
    stem: Two vectors of equal magnitude A have a resultant of magnitude A. The angle between them is
    options:
      - 60°
      - 90°
      - 120°
      - 150°
    answer: 2
    explanation: A^2 = A^2 + A^2 + 2A^2 cos θ gives cos θ = −1/2, so θ = 120°. The 60° choice confuses the angle between the vectors with the angle each makes with the resultant.
  - id: phy-wep-008
    topic: scalar-product
    subtopic: Dot product of a vector with itself
    concept: A·A = |A|^2
    category: numerical
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    tags: [magnitude]
    stem: If A = 3î − 4ĵ + 12k̂, the value of A·A is
    options:
      - "169"
      - "11"
      - "13"
      - "121"
    answer: 0
    explanation: A·A = 9 + 16 + 144 = 169 = |A|^2. The value 13 is |A| itself.
  - id: phy-wep-009
    topic: work-constant-force
    subtopic: Definition of work
    concept: W = F·d = Fd cos θ
    category: numerical
    format: direct
    difficulty: 1
    time: 30
    ncert: true
    battle: true
    formula: W = Fd cos θ
    tags: [work-definition]
    stem: A force of 10 N pulls a box 5 m along a floor, the force making 60° with the displacement. The work done by the force is
    options:
      - 50 J
      - 25 J
      - 43.3 J
      - 12.5 J
    answer: 1
    explanation: W = Fd cos θ = 10 × 5 × cos 60° = 25 J. Using sin 60° instead gives 43.3 J.
  - id: phy-wep-010
    topic: work-constant-force
    subtopic: Work in vector form
    concept: W = F·d with component vectors
    category: numerical
    format: direct
    difficulty: 2
    time: 35
    ncert: true
    battle: true
    formula: W = F·d
    tags: [components]
    stem: A force F = (3î + 4ĵ) N displaces a particle by d = (2î − ĵ + 5k̂) m. The work done is
    options:
      - 2 J
      - 10 J
      - 22 J
      - −2 J
    answer: 0
    explanation: W = F·d = 3(2) + 4(−1) + 0(5) = 6 − 4 = 2 J. The force has no k̂ component, so the 5 m along z contributes nothing.
  - id: phy-wep-011
    topic: work-constant-force
    subtopic: Zero work
    concept: Force perpendicular to displacement does no work
    category: concept
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    tags: [zero-work, ncert-line]
    stem: A porter carries a suitcase on his head and walks on a level road at constant velocity. The work done by him against gravity on the suitcase is
    options:
      - positive
      - negative
      - zero
      - equal to mgh where h is his height
    answer: 2
    explanation: His supporting force is vertical while the displacement is horizontal, so θ = 90° and W = Fd cos 90° = 0. Tiredness is physiological, not mechanical work.
  - id: phy-wep-012
    topic: work-constant-force
    subtopic: Negative work
    concept: Friction does negative work on a sliding body
    category: concept
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    tags: [negative-work, friction]
    stem: A block slides on a rough horizontal table and comes to rest. The work done on it by kinetic friction is
    options:
      - negative
      - positive
      - zero
      - positive or negative depending on the speed
    answer: 0
    explanation: Kinetic friction acts opposite to the sliding displacement (θ = 180°), so its work is negative and it removes kinetic energy.
  - id: phy-wep-013
    topic: work-constant-force
    subtopic: Work by gravity
    concept: Work done by gravity on a lifted body is −mgh
    category: numerical
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    formula: W_g = −mgh
    tags: [gravity, sign-of-work]
    stem: A 2 kg bag is lifted vertically up by 3 m. The work done by gravity on the bag is (g = 10 m s^{-2})
    options:
      - 60 J
      - 6 J
      - zero
      - −60 J
    answer: 3
    explanation: Gravity (20 N downward) is opposite to the 3 m upward displacement, so W_g = −20 × 3 = −60 J. The lifting agent does +60 J if the bag ends at rest.
  - id: phy-wep-014
    topic: work-constant-force
    subtopic: Work on inclined plane
    concept: Work by gravity depends only on vertical height
    category: numerical
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    formula: W_g = mgh
    tags: [inclined-plane, trap]
    stem: A 5 kg block slides 4 m down a smooth incline of angle 30°. The work done by gravity is (g = 10 m s^{-2})
    options:
      - 200 J
      - 173 J
      - 50 J
      - 100 J
    answer: 3
    explanation: The vertical drop is 4 sin 30° = 2 m, so W_g = mgh = 5 × 10 × 2 = 100 J. Using the full 4 m gives the 200 J trap.
  - id: phy-wep-015
    topic: work-constant-force
    subtopic: Work by normal reaction
    concept: Normal force on a fixed incline does no work
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [normal-force]
    stem: A block slides down a fixed inclined plane. The work done on the block by the normal reaction of the plane is
    options:
      - mgd cos θ
      - −mgd cos θ
      - mgd sin θ
      - zero
    answer: 3
    explanation: The normal reaction is perpendicular to the incline and the block moves along it, so the angle is 90° and the work is zero.
  - id: phy-wep-016
    topic: work-constant-force
    subtopic: Work done by several forces
    concept: Net work = sum of works by all forces
    category: numerical
    format: direct
    difficulty: 3
    time: 60
    ncert: true
    battle: false
    tags: [net-work, friction]
    stem: A 10 kg crate is pulled 6 m across a floor by a horizontal force of 50 N. The coefficient of kinetic friction is 0.3 (g = 10 m s^{-2}). The net work done on the crate is
    options:
      - 300 J
      - 180 J
      - 480 J
      - 120 J
    answer: 3
    explanation: Work by the pull = 50 × 6 = 300 J; friction = 0.3 × 100 = 30 N, doing −180 J. Normal force and gravity do no work, so net work = 120 J.
  - id: phy-wep-017
    topic: work-constant-force
    subtopic: Sign of work
    concept: Identifying positive, negative and zero work
    category: concept
    format: multi-statement
    difficulty: 4
    time: 60
    ncert: true
    battle: false
    tags: [sign-of-work, ncert-line]
    stem: |-
      Consider the following:
      I. Work done by a man lifting a bucket out of a well by a rope is positive.
      II. Work done by gravity on the bucket in this process is positive.
      III. Work done by friction on a body sliding down an incline is negative.
      IV. Work done by the resistive force of air on a vibrating pendulum is negative.
      Which statements are correct?
    options:
      - I and II only
      - I, III and IV only
      - II and III only
      - I, II, III and IV
    answer: 1
    explanation: The man's pull is along the upward displacement (positive). Gravity opposes it (negative), so II is wrong. Friction and air resistance oppose the motion, so III and IV are correct. This is an NCERT exercise.
  - id: phy-wep-018
    topic: work-constant-force
    subtopic: Units of work
    concept: 1 J = 10^7 erg
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [units]
    stem: One joule is equal to
    options:
      - 10^5 erg
      - 10^7 erg
      - 10^{-7} erg
      - 10^3 erg
    answer: 1
    explanation: 1 J = 1 N × 1 m = 10^5 dyne × 10^2 cm = 10^7 erg.
  - id: phy-wep-019
    topic: work-constant-force
    subtopic: Dimensions of work
    concept: Work has dimensions ML^2T^{-2}
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [dimensions]
    stem: The dimensional formula of work is
    options:
      - "[MLT^{-2}]"
      - "[ML^2T^{-3}]"
      - "[ML^2T^{-2}]"
      - "[ML^{-1}T^{-2}]"
    answer: 2
    explanation: Work = force × distance = [MLT^{-2}][L] = [ML^2T^{-2}], the same as energy. [ML^2T^{-3}] is power.
  - id: phy-wep-020
    topic: work-constant-force
    subtopic: Work done by a constant force along a closed path
    concept: Work by gravity over a round trip is zero
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [closed-path]
    stem: A ball is thrown vertically up and caught at the same point. Ignoring air resistance, the total work done by gravity during the round trip is
    options:
      - 2mgh
      - mgh
      - −2mgh
      - zero
    answer: 3
    explanation: Gravity does −mgh on the way up and +mgh on the way down; the net work over the closed path is zero because gravity is conservative.
  - id: phy-wep-021
    topic: work-constant-force
    subtopic: Work by applied force at an angle
    concept: Only the component of force along displacement does work
    category: numerical
    format: direct
    difficulty: 2
    time: 40
    ncert: false
    battle: true
    tags: [angle]
    stem: A child pulls a toy cart by a string inclined at 60° to the horizontal with a force of 20 N. How much work is done in moving it 10 m horizontally?
    options:
      - 200 J
      - 173 J
      - 50 J
      - 100 J
    answer: 3
    explanation: W = F d cos 60° = 20 × 10 × 0.5 = 100 J. Only the horizontal component of the pull does work.
  - id: phy-wep-022
    topic: work-constant-force
    subtopic: Work in uniform circular motion
    concept: Centripetal force does no work
    category: concept
    format: assertion-reason
    difficulty: 2
    time: 40
    ncert: true
    battle: false
    tags: [circular-motion]
    stem: |-
      Assertion (A): The work done by the centripetal force on a body in uniform circular motion is zero.
      Reason (R): The centripetal force is always perpendicular to the instantaneous velocity of the body.
    options:
      - Both A and R are true and R is the correct explanation of A
      - Both A and R are true but R is not the correct explanation of A
      - A is true but R is false
      - A is false but R is true
    answer: 0
    explanation: Since the centripetal force is along the radius and the displacement at each instant is tangential, F·ds = 0 throughout. R directly explains A.
  - id: phy-wep-023
    topic: work-constant-force
    subtopic: Work and frame of reference
    concept: Work depends on the frame of reference
    category: concept
    format: statement-pair
    difficulty: 3
    time: 45
    ncert: false
    battle: false
    tags: [frame-dependence, trap]
    stem: |-
      Statement I: The work done by a force on a body can be different in two inertial frames.
      Statement II: The work done by static friction on a body is always zero.
    options:
      - Both Statement I and Statement II are correct
      - Both Statement I and Statement II are incorrect
      - Statement I is correct but Statement II is incorrect
      - Statement I is incorrect but Statement II is correct
    answer: 2
    explanation: Displacement depends on the frame, so work does too (Statement I correct). Static friction can do positive work, e.g., on a box resting on an accelerating truck bed, so Statement II is wrong.
  - id: phy-wep-024
    topic: work-variable-force
    subtopic: Area under F–x graph
    concept: Work = area under force–displacement graph
    category: numerical
    format: graph
    difficulty: 2
    time: 40
    ncert: true
    battle: true
    tags: [f-x-graph]
    stem: A force rises linearly from 0 at x = 0 to 20 N at x = 4 m. The work done by it over this displacement is
    options:
      - 80 J
      - 20 J
      - 160 J
      - 40 J
    answer: 3
    explanation: The work is the triangular area under the F–x line, ½ × 4 × 20 = 40 J. Multiplying the final force by the full distance gives 80 J.
  - id: phy-wep-025
    topic: work-variable-force
    subtopic: Integration of variable force
    concept: W = ∫F dx for F = kx^2
    category: numerical
    format: direct
    difficulty: 3
    time: 60
    ncert: true
    battle: false
    formula: W = ∫F dx
    tags: [integration]
    stem: A force F = 3x^2 N (x in metres) acts on a particle along the x-axis. The work done in moving it from x = 1 m to x = 3 m is
    options:
      - 27 J
      - 24 J
      - 18 J
      - 26 J
    answer: 3
    explanation: W = ∫ 3x^2 dx from 1 to 3 = [x^3] = 27 − 1 = 26 J. Forgetting the lower limit gives 27 J.
  - id: phy-wep-026
    topic: work-variable-force
    subtopic: Force that depends on position
    concept: W = ∫(a + bx)dx
    category: numerical
    format: direct
    difficulty: 3
    time: 60
    ncert: false
    battle: false
    formula: W = ∫F dx
    tags: [integration]
    stem: A force F = (4 + 2x) N acts along the x-axis. The work done by it as the body moves from x = 0 to x = 2 m is
    options:
      - 12 J
      - 8 J
      - 16 J
      - 10 J
    answer: 0
    explanation: W = ∫(4 + 2x)dx from 0 to 2 = [4x + x^2] = 8 + 4 = 12 J.
  - id: phy-wep-027
    topic: work-variable-force
    subtopic: Graph below the axis
    concept: Area below the x-axis gives negative work
    category: numerical
    format: graph
    difficulty: 3
    time: 60
    ncert: true
    battle: false
    diagram: F–x graph. F = +10 N constant from x = 0 to x = 3 m, then F = −5 N constant from x = 3 m to x = 5 m. Axes labelled F (N) vertical and x (m) horizontal; step-shaped graph.
    tags: [f-x-graph, sign-of-work]
    stem: From the force–displacement graph shown (F = +10 N for 0–3 m, then F = −5 N for 3–5 m), the net work done from x = 0 to x = 5 m is
    options:
      - 40 J
      - 30 J
      - 20 J
      - 10 J
    answer: 2
    explanation: Area above the axis = 10 × 3 = 30 J; area below = 5 × 2 = 10 J, which is negative work. Net work = 30 − 10 = 20 J. Adding both areas gives the 40 J trap.
  - id: phy-wep-028
    topic: work-variable-force
    subtopic: Friction force from NCERT example
    concept: Work against a variable resistive force from a graph
    category: application
    format: case
    difficulty: 3
    time: 60
    ncert: true
    battle: false
    tags: [f-x-graph, ncert-line]
    stem: A woman pushes a trunk on a railway platform with a rough surface. She applies 100 N over the first 10 m, then gets tired and her force drops linearly to 50 N over the next 10 m. The total work done by her over the 20 m is
    options:
      - 1500 J
      - 1750 J
      - 2000 J
      - 1250 J
    answer: 1
    explanation: Work = rectangle 100 × 10 = 1000 J plus trapezium ½(100 + 50) × 10 = 750 J, total 1750 J. This mirrors the NCERT example on variable force.
  - id: phy-wep-029
    topic: work-variable-force
    subtopic: Work as integral
    concept: Work by variable force is the limit of a sum
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [definition]
    stem: For a force F(x) varying with position along a straight line, the work done from x_i to x_f is given by
    options:
      - F(x_f)(x_f − x_i)
      - ∫F(x) dx from x_i to x_f
      - dF/dx evaluated at x_f
      - "[F(x_f) − F(x_i)] x_f"
    answer: 1
    explanation: The displacement is split into small intervals Δx over which F is nearly constant; summing F Δx and taking the limit gives the definite integral of F dx.
  - id: phy-wep-030
    topic: work-variable-force
    subtopic: Variable force in 2D
    concept: W = ∫(F_x dx + F_y dy)
    category: numerical
    format: direct
    difficulty: 4
    time: 90
    ncert: false
    battle: false
    formula: W = ∫F_x dx + ∫F_y dy
    tags: [integration, multi-concept]
    stem: A force F = (2xî + 3y^2ĵ) N acts on a particle that moves from (0, 0) to (2 m, 1 m). The work done by the force is
    options:
      - 5 J
      - 7 J
      - 4 J
      - 3 J
    answer: 0
    explanation: This force is conservative, so W = ∫2x dx (0→2) + ∫3y^2 dy (0→1) = 4 + 1 = 5 J, independent of path.
  - id: phy-wep-031
    topic: work-variable-force
    subtopic: Inverse-square force
    concept: Work by F = k/x^2
    category: numerical
    format: direct
    difficulty: 4
    time: 90
    ncert: false
    battle: false
    tags: [integration]
    stem: A repulsive force F = 8/x^2 N (x in m) acts along the positive x-direction on a particle. The work done by it as the particle moves from x = 1 m to x = 4 m is
    options:
      - 8 J
      - 6 J
      - 2 J
      - 24 J
    answer: 1
    explanation: W = ∫ 8x^{-2} dx from 1 to 4 = 8[−1/x] = 8(1 − 1/4) = 6 J.
  - id: phy-wep-032
    topic: work-variable-force
    subtopic: Force from a velocity–position relation
    concept: Work from velocity dependence on position via W = ΔK
    category: application
    format: direct
    difficulty: 4
    time: 100
    ncert: false
    battle: false
    tags: [multi-concept]
    stem: A 0.5 kg particle moves along the x-axis with velocity v = 2√x m s^{-1} (x in m). The work done on it by the net force as it moves from x = 1 m to x = 4 m is
    options:
      - 1.5 J
      - 3 J
      - 6 J
      - 12 J
    answer: 1
    explanation: v^2 = 4x, so K = ½ × 0.5 × 4x = x joule. ΔK = 4 − 1 = 3 J, which by the work–energy theorem is the net work.
  - id: phy-wep-033
    topic: work-variable-force
    subtopic: Spring-type force graph
    concept: Linear restoring force F = −kx
    category: numerical
    format: graph
    difficulty: 2
    time: 40
    ncert: true
    battle: true
    tags: [f-x-graph]
    stem: The force of a spring is F = −200x N. The work done by the spring force as its extension increases from 0 to 0.1 m is
    options:
      - 1 J
      - −1 J
      - −2 J
      - 2 J
    answer: 1
    explanation: W_s = −½kx^2 = −½ × 200 × 0.01 = −1 J. The spring force opposes the extension, so its work is negative.
  - id: phy-wep-034
    topic: work-energy-theorem
    subtopic: Kinetic energy
    concept: K = ½mv^2
    category: numerical
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    formula: K = ½mv^2
    tags: [kinetic-energy]
    stem: The kinetic energy of a 4 kg body moving at 5 m s^{-1} is
    options:
      - 50 J
      - 10 J
      - 20 J
      - 100 J
    answer: 0
    explanation: K = ½ × 4 × 5^2 = 50 J. Forgetting the ½ gives 100 J.
  - id: phy-wep-035
    topic: work-energy-theorem
    subtopic: Effect of doubling speed
    concept: K ∝ v^2
    category: concept
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [proportionality]
    stem: If the speed of a car is doubled, its kinetic energy becomes
    options:
      - double
      - half
      - unchanged
      - four times
    answer: 3
