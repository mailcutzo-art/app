  - id: phy-units-378
    topic: error-propagation
    subtopic: "Experimental design"
    concept: "Improving the most heavily weighted measurement reduces the error most"
    category: application
    format: statements
    difficulty: 4
    time: 120
    ncert: false
    battle: false
    tags: [experimental-design, power-error]
    stem: "In P = I^2R, the current and resistance are each measured with 2% error, giving 6% error in P. Which single improvement reduces the error in P the most?"
    options:
      - "Halving the error in R"
      - "Halving the error in R and in the constant factor"
      - "Halving the error in I"
      - "Measuring R twice as many times, with the error in I unchanged"
    answer: 2
    explanation: "ΔP/P = 2ΔI/I + ΔR/R. Halving ΔI/I (to 1%) gives 2 + 2 = 4%; halving ΔR/R (to 1%) gives 4 + 1 = 5%. Since I is squared, its error counts twice, so improving I helps most."

