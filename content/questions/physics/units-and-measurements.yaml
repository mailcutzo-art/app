      - "Both A and R are true and R is the correct explanation of A"
      - "Both A and R are true but R is not the correct explanation of A"
      - "A is true but R is false"
      - "A is false but R is true"
    answer: 2
    explanation: "In 4.700 × 10^3 the trailing zeros come after the decimal point, so they are significant and the number has four significant figures (A true). R is false: trailing zeros after a decimal point are significant; only trailing zeros in a whole number without a decimal point are not."

  - id: phy-units-264
