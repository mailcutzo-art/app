    stem: "Which of the following correctly represents 5 millinewton?"
    options:
      - "5 m N"
      - "5 mN"
      - "5 mNs"
      - "5 milli N"
    answer: 1
    explanation: "The prefix symbol m (milli) is written directly before the unit symbol N with no space: mN. With a space, 'm N' reads as metre newton. Unit symbols are never pluralised (no 's'), and a prefix name is not mixed with a unit symbol. Note also that capital M would mean mega."

  - id: phy-units-324
    topic: si-units
