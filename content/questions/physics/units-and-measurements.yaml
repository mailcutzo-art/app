    explanation: "y − w = 2.0 ± 0.2 (absolute errors add), a 10% error. x has 1% error. So ΔZ/Z = 1% + 10% = 11%, and Z = 10.0/2.0 = 5.0 with ΔZ = 0.11 × 5.0 = 0.55. Treating y and w separately as a product (1% + 2% + 3.3%) misses the effect of the subtraction."

  - id: phy-units-293
