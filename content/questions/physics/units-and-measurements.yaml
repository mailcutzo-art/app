    ncert: false
    battle: false
    formula: g = 4π^2 L/T^2, Δg/g = ΔL/L + 2ΔT/T
    tags: [pendulum, power-rule, least-count, multi-concept]
    stem: A student measures a pendulum length of 100.0 cm with a scale of least count 0.1 cm, and the time for 20 oscillations as 40.0 s with a stopwatch of least count 0.1 s. What is the maximum percentage error in g = 4π^2L/T^2?
    options:
      - 0.6%
      - 0.35%
      - 10.1%
      - 0.25%
    answer: 0
    explanation: "ΔL/L = 0.1/100.0 = 0.1%. The time error applies to the total time: Δt/t = 0.1/40.0 = 0.25%, and ΔT/T = Δt/t because T = t/20. Then Δg/g = ΔL/L + 2ΔT/T = 0.1% + 0.5% = 0.6%. Forgetting the factor 2 gives 0.35%; applying the 0.1 s error to a single 2 s period gives about 10%, which is why timing many oscillations is better."

  - id: phy-units-033
    topic: error-propagation
