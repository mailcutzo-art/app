    battle: false
    tags: [prefixes, area, trap]
    stem: |-
      Which of the following relations are correct?
      I. 1 μm = 10^{-6} m
      II. 1 Mm = 10^6 m
      III. 1 mm^2 = 10^{-3} m^2
      IV. 1 km^2 = 10^6 m^2
    options:
      - "I, II and III only"
      - "II and IV only"
      - "I, II and IV only"
      - "I, II, III and IV"
    answer: 2
    explanation: "A prefix is attached to the unit before it is raised to a power: 1 mm^2 = (10^{-3} m)^2 = 10^{-6} m^2, so III is wrong. Likewise 1 km^2 = (10^3 m)^2 = 10^6 m^2 (IV correct). I and II are the definitions of micro and mega."

  - id: phy-units-325
