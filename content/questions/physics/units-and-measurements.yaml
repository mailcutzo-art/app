  - id: phy-units-258
    topic: significant-figures
    subtopic: "Rounding off"
    concept: "Rounding 9.995 to three significant figures gives 10.0"
    category: numerical
    format: direct
    difficulty: 4
    time: 120
    ncert: false
    battle: false
    tags: [rounding, trap]
    stem: "Round off 9.995 to three significant figures."
    options:
      - "9.99"
      - "10.0"
      - "10.00"
      - "9.90"
