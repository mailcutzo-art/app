      - "3 × 10^7 s"
    answer: 1
    explanation: "Keep 3 and 1; the dropped part 56 is more than half, so 1 becomes 2: 3.2 × 10^7 s. 3.15 × 10^7 has three significant figures."

  - id: phy-units-350
