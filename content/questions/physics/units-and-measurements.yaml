    answer: 3
    explanation: "[M L^2 T^{-2}] = [M^{-1} L^3 T^{-2}]^a [M]^b [L]^c. T: a = 1; M: −1 + b = 1 ⇒ b = 2; L: 3 + c = 2 ⇒ c = −1. So U ∝ GM^2/R (the exact result is −3GM^2/(5R))."

