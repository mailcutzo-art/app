    explanation: "v^2 ∝ S/(ρλ) ∝ 1/λ, so v^2 plotted against 1/λ is a straight line through the origin. v against 1/λ is a curve (v ∝ (1/λ)^{1/2}), and v^2 against λ is a hyperbola."

  - id: phy-units-499
    topic: dimensional-derivation
    subtopic: "Oscillating liquid column"
    concept: "Frequency of a liquid column in a U-tube"
    category: application
    format: multi-statement
    difficulty: 3
    time: 70
    ncert: false
    battle: false
    tags: [exponents, oscillations]
    stem: |-
      The frequency f of oscillation of a liquid column of length L in a U-tube is assumed to depend on L, g and the density ρ of the liquid. Dimensional analysis shows:
