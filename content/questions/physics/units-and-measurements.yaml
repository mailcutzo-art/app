    stem: "A screw gauge has pitch 0.5 mm and 50 circular divisions. With the jaws closed, the 47th circular division is against the reference line and the main scale zero is just hidden (negative zero error). Measuring a wire, the main scale reads 2.5 mm and the circular scale 20 divisions. The corrected diameter is"
