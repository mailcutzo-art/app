    explanation: "In the first equation the bracket (t − x) subtracts a length from a time, which is not allowed. In the others vt and x are both lengths, and t/T and x/λ are both dimensionless, so the argument of sine is dimensionless."

  - id: phy-units-492
    topic: dimensional-derivation
