      Reason (R): The total solid angle about a point is 4π steradian.
    options:
      - "Both A and R are true and R is the correct explanation of A"
      - "Both A and R are true but R is not the correct explanation of A"
      - "A is true but R is false"
      - "A is false but R is true"
    answer: 1
    explanation: "A is the definition of the steradian (ΔΩ = ΔA/r^2 = 1). R is also true, since the whole sphere gives 4πr^2/r^2 = 4π sr. But R is a consequence of the definition, not the reason for it, so it does not explain A."

  - id: phy-units-326
