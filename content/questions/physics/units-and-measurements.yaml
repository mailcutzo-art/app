    explanation: "1 F = 1 C/V. The coulomb is A s and the volt is kg m^2 s^{-3} A^{-1}, so 1 F = A s/(kg m^2 s^{-3} A^{-1}) = kg^{-1} m^{-2} s^4 A^2. The second option is its reciprocal."

