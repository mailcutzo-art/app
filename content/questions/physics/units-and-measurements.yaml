      - "I, II and III only"
      - "II and IV only"
      - "II, III and IV only"
    answer: 1
    explanation: "Contributions: A → 1%, B → 2 × 2% = 4%, C → 3 × 1% = 3%. Total = 8% (I true, IV false). C contributes 3% (II) and B contributes most (III)."

  - id: phy-units-469
