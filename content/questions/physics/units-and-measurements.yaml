      Statement I: The absolute error in 2A (2 being exact) is 2ΔA.
      Statement II: The absolute error in A + A, treating the two terms as the same measurement, is 2ΔA.
    options:
      - "Both Statement I and Statement II are correct"
      - "Both Statement I and Statement II are incorrect"
      - "Statement I is correct but Statement II is incorrect"
      - "Statement I is incorrect but Statement II is correct"
    answer: 0
    explanation: "Multiplying by an exact 2 doubles the absolute error while leaving the relative error unchanged (Statement I correct). Adding A to itself gives ΔA + ΔA = 2ΔA by the sum rule, the same result (Statement II correct)."

  - id: phy-units-471
    topic: error-propagation
    subtopic: "Reciprocals"
    concept: "The percentage error of 1/A equals that of A"
    category: concept
    format: statements
    difficulty: 3
