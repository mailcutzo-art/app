      - (300 ± 3.5) Ω
    answer: 2
    explanation: "In series R = R_1 + R_2 = 300 Ω. For a sum the absolute errors add: ΔR = 3 + 4 = 7 Ω. Taking the difference (1 Ω) or the average (3.5 Ω) of the errors underestimates the maximum error."

  - id: phy-units-034
    topic: dimensions
    subtopic: Dimensional formulae in mechanics
    concept: Dimensional formula of force
    category: factual
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    tags: [force, dimensional-formula]
    stem: What is the dimensional formula of force?
    options:
      - "[M L^2 T^{-2}]"
      - "[M L T^{-2}]"
      - "[M L T^{-1}]"
      - "[M L^{-1} T^{-2}]"
    answer: 1
    explanation: Force = mass × acceleration, and [acceleration] = [L T^{-2}], so [F] = [M L T^{-2}]. [M L^2 T^{-2}] is energy, [M L T^{-1}] is momentum and [M L^{-1} T^{-2}] is pressure.

  - id: phy-units-035
    topic: dimensions
    subtopic: Dimensional formulae of constants
    concept: Dimensional formula of the gravitational constant
    category: factual
    format: direct
    difficulty: 2
    time: 35
    ncert: false
    battle: true
    formula: F = G m_1 m_2/r^2
    tags: [gravitational-constant, dimensional-formula]
    stem: What is the dimensional formula of the universal gravitational constant G?
    options:
      - "[M L^3 T^{-2}]"
      - "[M^{-1} L^2 T^{-2}]"
      - "[M^{-2} L^3 T^{-2}]"
      - "[M^{-1} L^3 T^{-2}]"
    answer: 3
    explanation: From F = Gm_1m_2/r^2, G = Fr^2/(m_1m_2). So [G] = [M L T^{-2}][L^2]/[M^2] = [M^{-1} L^3 T^{-2}]. Forgetting that m_1m_2 carries M^2 gives [M L^3 T^{-2}] or other wrong mass powers.

  - id: phy-units-036
    topic: dimensions
    subtopic: Dimensionless quantities
    concept: Identify dimensionless quantities
    category: concept
    format: multi-statement
    difficulty: 2
    time: 45
    ncert: false
    battle: false
    tags: [dimensionless, trap]
    stem: |-
      Which of the following quantities are dimensionless?
      I. Strain
      II. Plane angle
      III. Refractive index
      IV. Specific heat capacity
    options:
      - I and III only
      - II and IV only
      - I, II and III only
      - I, II, III and IV
    answer: 2
    explanation: Strain is a ratio of two lengths, a plane angle is arc ÷ radius, and refractive index is a ratio of two speeds, so all three are dimensionless. Specific heat capacity has dimensions [L^2 T^{-2} K^{-1}] (J kg^{-1} K^{-1}). Leaving out the angle is a common slip because it has a unit (radian) even though it has no dimensions.

  - id: phy-units-037
    topic: dimensions
    subtopic: Dimensional formulae in mechanics
    concept: Dimensional formula of surface tension
    category: factual
    format: direct
    difficulty: 2
    time: 35
    ncert: false
    battle: true
    tags: [surface-tension, dimensional-formula]
    stem: Surface tension is force per unit length. Its dimensional formula is
    options:
      - "[M L T^{-2}]"
      - "[M L^{-1} T^{-2}]"
      - "[M T^{-2}]"
      - "[M L^2 T^{-2}]"
    answer: 2
    explanation: "[Surface tension] = [force]/[length] = [M L T^{-2}]/[L] = [M T^{-2}]. Dividing by area instead of length would give [M L^{-1} T^{-2}], which is pressure."

  - id: phy-units-038
    topic: dimensions
    subtopic: Combinations of electromagnetic constants
    concept: 1/√(μ0ε0) has the dimensions of speed
    category: concept
    format: direct
    difficulty: 3
    time: 60
    ncert: false
    battle: true
    tags: [permittivity, permeability, multi-concept]
    stem: What are the dimensions of 1/√(μ_0ε_0), where μ_0 and ε_0 are the permeability and permittivity of free space?
    options:
      - "[L^2 T^{-2}]"
      - "[L^{-1} T]"
      - "[M L T^{-2}]"
      - "[L T^{-1}]"
    answer: 3
    explanation: 1/√(μ_0ε_0) equals c, the speed of light in vacuum, so its dimensions are [L T^{-1}]. [L^2 T^{-2}] would be 1/(μ_0ε_0) without the square root, and [L^{-1} T] would be √(μ_0ε_0).

  - id: phy-units-039
    topic: dimensions
    subtopic: Dimensional formulae in mechanics
    concept: Coefficient of viscosity from Newton's law of viscosity
    category: numerical
    format: direct
    difficulty: 3
    time: 75
    ncert: false
    battle: false
    formula: F = ηA (dv/dx)
    tags: [viscosity, dimensional-formula]
    stem: The viscous force between fluid layers is F = ηA (dv/dx), where A is area and dv/dx is velocity gradient. The dimensional formula of η is
    options:
      - "[M L T^{-1}]"
      - "[M L^{-2} T^{-1}]"
      - "[M L^{-1} T^{-1}]"
      - "[M L^{-1} T^{-2}]"
    answer: 2
    explanation: η = F/[A (dv/dx)]. [dv/dx] = [L T^{-1}]/[L] = [T^{-1}], so [A dv/dx] = [L^2 T^{-1}]. Then [η] = [M L T^{-2}]/[L^2 T^{-1}] = [M L^{-1} T^{-1}]. [M L^{-1} T^{-2}] is pressure, obtained if the velocity gradient is ignored.

  - id: phy-units-040
    topic: dimensions
    subtopic: Quantities with same dimensions
    concept: Momentum and angular momentum have different dimensions
    category: concept
    format: direct
    difficulty: 2
    time: 35
    ncert: false
    battle: true
    tags: [same-dimensions, confused-pair]
    stem: Which pair of physical quantities does NOT have the same dimensions?
    options:
      - Work and torque
      - Impulse and linear momentum
      - Linear momentum and angular momentum
      - Stress and Young's modulus
    answer: 2
    explanation: "Angular momentum = r × p, so it has an extra length: [M L^2 T^{-1}] against [M L T^{-1}] for linear momentum. Work and torque are both [M L^2 T^{-2}], impulse equals change of momentum [M L T^{-1}], and stress and Young's modulus are both [M L^{-1} T^{-2}] because strain is dimensionless."

  - id: phy-units-041
    topic: dimensional-consistency
    subtopic: Dimensionally correct but wrong equations
    concept: Dimensional analysis cannot check dimensionless factors
    category: concept
    format: assertion-reason
    difficulty: 2
    time: 45
    ncert: true
    battle: false
    tags: [homogeneity, limitations, trap]
    stem: |-
      Assertion (A): The equation s = ut + at^2 is dimensionally correct although the correct relation is s = ut + ½at^2.
      Reason (R): The method of dimensions cannot check the value of dimensionless constants in an equation.
    options:
      - Both A and R are true and R is the correct explanation of A
      - Both A and R are true but R is not the correct explanation of A
      - A is true but R is false
      - A is false but R is true
    answer: 0
    explanation: "Every term in s = ut + at^2 has dimensions [L]: [ut] = [L T^{-1}][T] and [at^2] = [L T^{-2}][T^2]. The equation passes the dimensional test, yet it is wrong by the factor ½. This happens precisely because pure numbers like ½ have no dimensions, which is what R states."

  - id: phy-units-042
    topic: dimensional-consistency
    subtopic: Dimensions of constants in an equation
    concept: Dimensions of b in F = at + bt^2
    category: numerical
    format: direct
    difficulty: 3
    time: 75
    ncert: false
    battle: true
    tags: [homogeneity, constants]
    stem: A force varies with time as F = at + bt^2. What are the dimensions of b?
    options:
      - "[M L T^{-3}]"
      - "[M L T^{-2}]"
      - "[M L T^{-4}]"
      - "[M L T^{-1}]"
    answer: 2
    explanation: By the principle of homogeneity each term must have the dimensions of force. So [b][T^2] = [M L T^{-2}], giving [b] = [M L T^{-4}]. [M L T^{-3}] is the dimension of a (from [a][T] = [F]).

  - id: phy-units-043
    topic: dimensional-consistency
    subtopic: Arguments of trigonometric functions
    concept: Wave number k in A sin(ωt − kx) has dimensions of inverse length
    category: concept
    format: direct
    difficulty: 2
    time: 35
    ncert: false
    battle: true
    tags: [trig-argument, wave-equation]
    stem: A wave is described by y = A sin(ωt − kx), where x is a distance and t is time. What are the dimensions of k?
    options:
      - "[L]"
      - "[L^{-1}]"
      - "[T^{-1}]"
      - "[L T^{-1}]"
    answer: 1
    explanation: The argument of a sine must be dimensionless, so kx must be a pure number. With [x] = [L], [k] = [L^{-1}]. Similarly [ω] = [T^{-1}], and the ratio ω/k has dimensions [L T^{-1}], the wave speed.

  - id: phy-units-044
    topic: dimensional-consistency
    subtopic: Constants in gas equations
    concept: Dimensions of a in the van der Waals equation
    category: numerical
    format: direct
    difficulty: 4
    time: 125
    ncert: false
    battle: false
    formula: (P + a/V^2)(V − b) = RT
    tags: [van-der-waals, homogeneity, multi-concept]
    stem: In the van der Waals equation (P + a/V^2)(V − b) = RT, where P is pressure and V is volume, the dimensions of a are
    options:
      - "[M L^{-1} T^{-2}]"
      - "[M L^{-7} T^{-2}]"
      - "[L^3]"
      - "[M L^5 T^{-2}]"
    answer: 3
    explanation: "Only like quantities can be added, so a/V^2 must be a pressure: [a] = [P][V^2] = [M L^{-1} T^{-2}][L^6] = [M L^5 T^{-2}]. Multiplying by V^{-2} instead gives [M L^{-7} T^{-2}]. [L^3] is the dimension of b, which must be a volume."

  - id: phy-units-045
    topic: dimensional-consistency
    subtopic: Checking equations
    concept: Identifying dimensionally wrong formulas for periodic displacement
    category: application
    format: multi-statement
    difficulty: 3
    time: 80
    ncert: true
    battle: false
    tags: [homogeneity, trig-argument, ncert-exercise]
    stem: |-
      A book with printing errors gives four formulas for the displacement y of a particle in periodic motion (a = amplitude, v = speed, T = period, t = time):
      I. y = a sin(2πt/T)
      II. y = a sin(vt)
      III. y = (a/T) sin(t/a)
      IV. y = a√2 [sin(2πt/T) + cos(2πt/T)]
      Which formulas are dimensionally WRONG?
    options:
      - II and III only
      - I and IV only
      - III only
      - II, III and IV only
    answer: 0
    explanation: The argument of a sine must be dimensionless and y must have dimensions of length. In I and IV, t/T is dimensionless and the prefactor is a length, so they are fine (the √2 is just a number). In II, vt is a length, not a pure number. In III, t/a has dimensions [T L^{-1}], and a/T is not a length. So II and III are wrong.

  - id: phy-units-046
    topic: dimensional-derivation
    subtopic: Deriving the period of a simple pendulum
    concept: Exponents of l and g in the period of a pendulum
    category: numerical
    format: direct
    difficulty: 3
    time: 75
    ncert: true
    battle: false
    formula: T = k l^a g^b
    tags: [pendulum, deducing-relations, ncert-example]
    stem: Assume the period of a simple pendulum depends on its length l and the acceleration due to gravity g as T = k l^a g^b, where k is dimensionless. What are a and b?
    options:
      - a = −½, b = ½
      - a = ½, b = −½
      - a = 1, b = −1
      - a = ½, b = ½
    answer: 1
    explanation: "[T] = [L]^a [L T^{-2}]^b = [L^{a+b} T^{-2b}]. Comparing powers: for T, −2b = 1 so b = −½; for L, a + b = 0 so a = ½. Hence T = k√(l/g); experiment gives k = 2π, which dimensions alone cannot supply."

  - id: phy-units-047
    topic: dimensional-derivation
    subtopic: Limitations of dimensional analysis
    concept: Relations with sums of terms cannot be derived dimensionally
    category: concept
    format: statements
    difficulty: 3
    time: 80
    ncert: true
    battle: false
    tags: [limitations]
    stem: Which of the following relations can NOT be derived by the method of dimensions alone?
    options:
      - s = ut + ½at^2
      - T = 2π√(l/g)
      - F = 6πηrv
      - v = √(T/μ) for a stretched string
    answer: 0
    explanation: Dimensional analysis can find a product-of-powers relation up to a numerical constant, as in the pendulum period, Stokes' law or wave speed on a string (the constants 2π and 6π then come from experiment or theory). It cannot build a relation that is a sum of different terms, such as s = ut + ½at^2, because it only matches powers of one product.

  - id: phy-units-048
    topic: dimensional-derivation
    subtopic: Deriving Stokes' law
    concept: Viscous drag depends linearly on η, r and v
    category: numerical
    format: direct
    difficulty: 3
    time: 75
    ncert: false
    battle: false
    formula: F = k η^a r^b v^c
    tags: [stokes-law, deducing-relations]
    stem: The drag force on a small sphere moving slowly through a viscous fluid is taken as F = k η^a r^b v^c, where η is the coefficient of viscosity [M L^{-1} T^{-1}], r the radius and v the speed. The values of a, b and c are
    options:
      - 1, 2, 1
      - 1, 1, 1
      - 1, 1, 2
      - 2, 1, 1
    answer: 1
    explanation: "[M L T^{-2}] = [M L^{-1} T^{-1}]^a [L]^b [L T^{-1}]^c. Mass: a = 1. Time: −a − c = −2, so c = 1. Length: −a + b + c = 1, so b = 1. Thus F = kηrv, which is Stokes' law with k = 6π."

  - id: phy-units-049
    topic: dimensional-derivation
    subtopic: Log-log graphs of power laws
    concept: Slope of log T versus log l for a pendulum
    category: application
    format: graph
    difficulty: 3
    time: 60
    ncert: false
    battle: false
    tags: [log-log-graph, pendulum]
    stem: For a simple pendulum at a fixed place, a graph is plotted with log T (period) on the y-axis and log l (length) on the x-axis. What does the graph look like?
    options:
      - A straight line of slope 2
      - A parabola through the origin
      - A straight line of slope ½
      - A straight line of slope −½
    answer: 2
    explanation: T = 2π√(l/g) gives log T = ½ log l + log(2π/√g). This is a straight line of slope ½ with a constant intercept. On a log-log plot any power law y = kx^n becomes a straight line whose slope is the exponent n. Slope 2 would be the graph with the axes swapped (log l against log T), and −½ is the exponent of g, not l.

  - id: phy-units-050
    topic: dimensional-derivation
    subtopic: Percentage change from power laws
    concept: Increase in period when pendulum length increases by 44%
    category: numerical
    format: direct
    difficulty: 3
    time: 75
    ncert: false
    battle: true
    tags: [pendulum, proportional-reasoning]
    stem: The length of a simple pendulum is increased by 44%. By what percentage does its period increase?
    options:
      - 22%
      - 20%
      - 44%
      - 12%
    answer: 1
    explanation: T ∝ √l, so T_2/T_1 = √(1.44) = 1.2, an increase of exactly 20%. Halving 44% to get 22% uses the small-change approximation, which is not accurate for such a large change. The period does not rise in proportion to length.
