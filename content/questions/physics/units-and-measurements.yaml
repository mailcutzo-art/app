    tags: [graph, surface-tension, capillary-waves]
    stem: "Dimensional analysis gives the speed of ripples as v ∝ √(S/(ρλ)). For ripples on water (S and ρ fixed), which graph is a straight line through the origin?"
    options:
      - "v against λ"
      - "v^2 against 1/λ"
