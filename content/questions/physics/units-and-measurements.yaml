    explanation: "Pendulum: T ∝ √(l/g) (P-3). String: v ∝ √(T/μ) (Q-4). Gas: v ∝ √(P/ρ) (R-1). Satellite: T ∝ 1/√(Gρ) (S-2). Each result has the right dimensions, time or speed."

  - id: phy-units-321
