    answer: 3
    explanation: "Δv/v = 1% + 2% = 3%. ΔK/K = Δm/m + 2Δv/v = 1% + 2(3%) = 7%. Forgetting to double the error in v gives 4%."

  - id: phy-units-468
    topic: error-propagation
    subtopic: "Largest contributor"
    concept: "Contributions of each factor to the error in AB^2/C^3"
