    explanation: "From F = ηA(dv/dx), η = F/(A dv/dx) with unit N s m^{-2} = Pa s. In base units, (kg m s^{-2})(s)/m^2 = kg m^{-1} s^{-1}. kg m^{-1} s^{-2} is the pascal alone, without the second."

  - id: phy-units-322
