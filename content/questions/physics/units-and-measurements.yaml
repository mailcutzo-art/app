    explanation: K = ½mv^2, so ΔK/K = Δm/m + 2Δv/v = 2% + 2 × 3% = 8%. The factor ½ is exact and carries no error. Adding 2% + 3% = 5% forgets the square on v; 2 × 2% + 3% = 7% puts the power on the wrong quantity.

