      - "1 Pa = 1 N m^{-2}"
      - "1 T = 1 Wb m^{-2}"
      - "1 W = 1 J s"
    answer: 3
    explanation: "Power is energy per unit time, so 1 W = 1 J s^{-1}, not J s (J s is the unit of Planck's constant). The volt is energy per unit charge, the pascal is force per area and the tesla is flux per area."

  - id: phy-units-238
