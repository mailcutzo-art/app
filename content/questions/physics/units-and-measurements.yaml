    explanation: "Because random errors are as likely to be positive as negative, they tend to cancel when many readings are averaged, so the mean approaches the true value. R explains A. This does not work for systematic errors."

  - id: phy-units-282
    topic: errors-measurement
    subtopic: "Error definitions"
    concept: "Properties of absolute, relative and percentage errors"
    category: application
    format: multi-statement
    difficulty: 3
