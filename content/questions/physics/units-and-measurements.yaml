      I. The mass of a bag is correctly written as 10 kg, not 10 kgs.
      II. When written in full, the unit of force is spelt with a capital letter, Newton.
      III. The kelvin is written with the symbol K and no degree sign.
      IV. A full stop is placed after a unit symbol, as in 5 m. for five metres.
      Which statements are correct?
    options:
      - "I, II and III only"
      - "II and IV only"
      - "I and IV only"
      - "I and III only"
    answer: 3
    explanation: "Unit symbols are never pluralised (I correct), and the kelvin has symbol K without °, unlike °C (III correct). A unit named after a person has a capital-letter symbol (N) but its full name is written in lower case: newton (II wrong). Symbols are not followed by a full stop except at the end of a sentence (IV wrong)."

