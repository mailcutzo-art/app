    answer: 3
    explanation: "Relative error = Δa_mean/a_mean, a ratio of two quantities in the same unit, so it is dimensionless and unitless. The absolute error carries the unit of the quantity. For a value greater than 1 unit it is smaller than the absolute error in number, not larger."

