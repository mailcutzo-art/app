    ncert: false
    battle: false
    tags: [error-definitions]
    stem: |-
      Consider the following statements.
      I. Absolute error has the same unit as the measured quantity.
      II. Percentage error does not depend on the units used.
      III. The mean absolute error is always taken as a positive quantity.
      IV. A larger measured value always has a smaller relative error.
      Which statements are correct?
    options:
      - "I and II only"
      - "II, III and IV only"
      - "I, II and III only"
      - "I, II, III and IV"
    answer: 2
    explanation: "I, II and III are true: Δa has the unit of a, percentage error is a pure ratio, and magnitudes are used in the mean absolute error. IV is false: relative error depends on both Δa and a, so a larger quantity measured with a much coarser instrument can have a larger relative error."

