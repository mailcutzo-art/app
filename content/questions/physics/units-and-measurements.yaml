    explanation: "Time unit = velocity/acceleration = 10/2 = 5 s. Length unit = velocity × time = 10 × 5 = 50 m (equivalently v^2/a = 100/2). The value 5 is the time unit in seconds, and 20 m comes from multiplying the two given units."

