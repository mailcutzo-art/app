    explanation: "Density ∝ M/L^3. A smaller mass unit (g) makes n 1000 times larger (Statement I correct). But a smaller length unit makes the volume unit (cm^3) 10^6 times smaller, so the density unit (kg cm^{-3}) is 10^6 times larger and n becomes 10^6 times smaller: n_2 = n_1(L_1/L_2)^{-3} = (100)^{-3}n_1 (Statement II incorrect)."

