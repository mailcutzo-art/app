    explanation: "ΔZ/Z = 3ΔA/A, so ΔZ = 3(ΔA/A)A^3 = 3A^2ΔA. (ΔA)^3 is tiny and wrong; 3ΔA would be the rule for a sum of three equal terms, not a cube."

