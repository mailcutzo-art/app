      - "The absolute error in Z equals ΔA"
      - "The percentage error in Z is zero because 1 is exact"
    answer: 0
    explanation: "Z = A^{-1}, so ΔZ/Z = |−1| ΔA/A = 2%. Maximum errors are always taken as positive, so they never cancel. The absolute error is ΔZ = ΔA/A^2, not ΔA."

  - id: phy-units-472
