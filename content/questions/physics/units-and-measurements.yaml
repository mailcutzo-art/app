    category: numerical
    format: case
    difficulty: 4
    time: 120
    ncert: false
    battle: false
    tags: [subtraction-error, resonance-tube, multi-concept]
    stem: "In a resonance tube experiment with a fork of exactly known frequency, the speed of sound is found from v = 2f(l_2 − l_1), with l_1 = (20.0 ± 0.1) cm and l_2 = (62.0 ± 0.1) cm. The percentage error in v is about"
    options:
      - "0.16%"
      - "0.48%"
      - "0.66%"
      - "0.24%"
    answer: 1
    explanation: "l_2 − l_1 = 42.0 cm with absolute error 0.1 + 0.1 = 0.2 cm, so Δv/v = 0.2/42.0 ≈ 0.48%. Using only one 0.1 cm error gives 0.24%, and adding the relative errors of l_1 and l_2 (0.5% + 0.16%) gives 0.66%, which is the rule for products, not differences."

  - id: phy-units-467
    topic: error-propagation
    subtopic: "Multi-step error"
