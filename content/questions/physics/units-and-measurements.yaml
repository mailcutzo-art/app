    explanation: "Absolute errors: 0.01, 0.06, 0.20, 0.09, 0.18 s; sum = 0.54 s; mean = 0.108 ≈ 0.11 s. Percentage error = 0.11/2.62 × 100 ≈ 4%. The range 0.38 s (2.80 − 2.42) is not the mean absolute error."

  - id: phy-units-464
    topic: errors-measurement
