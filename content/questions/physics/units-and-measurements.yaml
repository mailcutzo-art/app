    explanation: "The dropped digit is exactly 5 and the preceding digit 9 is odd, so it is raised by 1. This carries over: 9.99 + 0.01 = 10.0, which has three significant figures. 10.00 would have four, and 9.99 applies the even rule to an odd digit."

