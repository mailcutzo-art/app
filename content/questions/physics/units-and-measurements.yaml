    explanation: "From e = L dI/dt, 1 H = 1 V s A^{-1}. With 1 V = kg m^2 s^{-3} A^{-1}, 1 H = kg m^2 s^{-3} A^{-1} × s × A^{-1} = kg m^2 s^{-2} A^{-2}. kg m^2 s^{-3} A^{-2} is the ohm, and kg m^2 s^{-2} A^{-1} is the weber."

