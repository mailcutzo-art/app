    explanation: "Plane angle dθ = ds/r is a ratio of two lengths and solid angle dΩ = dA/r^2 is a ratio of an area to an area, so both are dimensionless. That is exactly why their units, radian and steradian, carry no dimensions. R correctly explains A."

  - id: phy-units-059
