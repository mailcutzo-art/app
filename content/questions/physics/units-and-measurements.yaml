    ncert: false
    battle: true
    tags: [systematic-error, random-error]
    stem: "Which statement about dealing with errors is correct?"
    options:
      - "Random errors can be removed completely by repeating the experiment many times"
      - "Systematic errors are reduced by taking the arithmetic mean of many readings"
      - "Systematic errors, once their cause is identified, can be removed by correction or better technique"
      - "Least count errors are completely removed by averaging"
    answer: 2
    explanation: "A known systematic error (for example a zero error) can be corrected exactly. Random errors are only reduced, never fully removed, by averaging. Averaging does nothing to a systematic error, and least count error is reduced only by using a finer instrument."

