    explanation: "From Faraday's law, EMF = rate of change of flux, so 1 Wb = 1 V s. The volt is W/A = kg m^2 s^{-3} A^{-1}, so V s = kg m^2 s^{-2} A^{-1}. kg m^2 s^{-3} A^{-1} is the volt itself, and kg s^{-2} A^{-1} is the tesla (Wb m^{-2})."

  - id: phy-units-057
