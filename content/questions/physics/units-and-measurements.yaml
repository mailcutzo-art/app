    format: statement-pair
    difficulty: 4
    time: 120
    ncert: false
    battle: false
    tags: [mean-absolute-error]
    stem: |-
      Statement I: The mean absolute error of a set of readings is never larger than the largest individual absolute error.
      Statement II: The mean absolute error can be zero even when the readings are not all equal.
    options:
      - "Both Statement I and Statement II are correct"
      - "Both Statement I and Statement II are incorrect"
      - "Statement I is correct but Statement II is incorrect"
      - "Statement I is incorrect but Statement II is correct"
    answer: 2
    explanation: "An average of magnitudes cannot exceed the largest of them (Statement I correct). If the readings differ, at least one differs from the mean and has a non-zero |Δa_i|; since all terms are positive the mean absolute error must be greater than zero (Statement II incorrect)."

