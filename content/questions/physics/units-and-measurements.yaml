      - "Both A and R are true but R is not the correct explanation of A"
      - "A is true but R is false"
      - "A is false but R is true"
    answer: 3
    explanation: "The seven base units are metre, kilogram, second, ampere, kelvin, mole and candela; the radian was once called a supplementary unit and is now treated as a dimensionless derived unit, so A is false. R is true, since angle = arc/radius is a ratio of lengths."

