    answer: 2
    explanation: "LC = 0.5/50 = 0.01 mm. Zero error = −(50 − 47) × 0.01 = −0.03 mm. Observed = 2.5 + 20 × 0.01 = 2.70 mm. Corrected = 2.70 − (−0.03) = 2.73 mm. Treating the error as +0.03 mm gives 2.67 mm."

