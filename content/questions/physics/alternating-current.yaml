      - leads the voltage by π
    answer: 1
    explanation: i = C dv/dt gives i = i_m sin(ωt + π/2), so current leads voltage by a quarter cycle.
  - id: phy-ac-034
    topic: ac-capacitor
    subtopic: Capacitor with DC
    concept: Capacitor blocks steady DC (X_C → ∞)
    category: concept
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [dc, reactance]
