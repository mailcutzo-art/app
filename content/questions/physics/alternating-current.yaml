questions:
  - id: phy-ac-001
    topic: ac-values
    subtopic: RMS value from equation
    concept: V_rms = V_0/√2 read from v = V_0 sin ωt
    category: numerical
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    formula: V_rms = V_0/√2
    tags: [rms-value]
    stem: An AC voltage is given by v = 220√2 sin(100πt) volt. What is its rms value?
    options:
      - 220√2 V
      - 220 V
      - 110√2 V
      - 440 V
    answer: 1
    explanation: The peak value is V_0 = 220√2 V, so V_rms = V_0/√2 = 220 V. The tempting 220√2 V is the peak, not the rms value.
  - id: phy-ac-002
    topic: ac-values
    subtopic: Frequency from equation
    concept: Reading frequency from ω in v = V_0 sin ωt
    category: numerical
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    formula: ω = 2πf
    tags: [frequency, trap]
    stem: For the AC voltage v = 311 sin(100πt) volt, what is the frequency of the supply?
    options:
      - 100π Hz
      - 100 Hz
      - 50 Hz
      - 25 Hz
    answer: 2
    explanation: Here ω = 100π rad s^{-1} and f = ω/2π = 50 Hz. Taking 100 Hz forgets the factor 2π, and 100π Hz confuses ω with f.
  - id: phy-ac-003
    topic: ac-values
    subtopic: Average value over a full cycle
    concept: Mean of sinusoidal current over one full cycle is zero
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [average-value, ncert-line]
    stem: What is the average value of a sinusoidal alternating current i = I_0 sin ωt over one complete cycle?
    options:
      - I_0/√2
      - 2I_0/π
      - I_0/2
      - zero
    answer: 3
    explanation: The positive and negative half cycles are equal and opposite, so the mean over a full cycle is zero. 2I_0/π is the average over a half cycle only.
  - id: phy-ac-004
    topic: ac-values
    subtopic: Half-cycle average value
    concept: Average over half cycle = 2I_0/π
    category: numerical
    format: direct
    difficulty: 2
    time: 35
    ncert: false
    battle: true
    formula: I_avg = 2I_0/π
    tags: [average-value]
    stem: The peak value of a sinusoidal current is 10 A. What is its average value over a positive half cycle?
    options:
      - 6.37 A
      - 7.07 A
      - 5 A
      - 3.18 A
    answer: 0
    explanation: I_avg (half cycle) = 2I_0/π = 20/π ≈ 6.37 A. The value 7.07 A is the rms value I_0/√2, not the average.
  - id: phy-ac-005
    topic: ac-values
    subtopic: Peak to rms ratio
    concept: Peak/rms ratio for sinusoidal AC is √2
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [rms-value]
    stem: For a sinusoidal alternating voltage, what is the ratio of the peak value to the rms value?
    options:
      - 1/√2
      - √2
      - "2"
      - π/2
    answer: 1
    explanation: V_rms = V_0/√2, so V_0/V_rms = √2. The value 1/√2 is the inverse ratio (rms to peak).
  - id: phy-ac-006
    topic: ac-values
    subtopic: Domestic supply peak value
    concept: 220 V rms mains has peak ≈ 311 V
    category: numerical
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    formula: V_0 = √2 V_rms
    tags: [rms-value, ncert-line]
    stem: The domestic supply in India is quoted as 220 V. What is the peak voltage of this supply?
    options:
      - 220 V
      - 156 V
      - 311 V
      - 440 V
    answer: 2
    explanation: Quoted AC voltages are rms values, so V_0 = √2 × 220 ≈ 311 V. 156 V results from wrongly dividing by √2.
  - id: phy-ac-007
    topic: ac-values
    subtopic: Form factor
    concept: rms/half-cycle average = π/(2√2) ≈ 1.11
    category: numerical
    format: direct
    difficulty: 3
    time: 50
    ncert: false
    battle: false
    formula: I_rms/I_avg = (I_0/√2)/(2I_0/π)
    tags: [rms-value, average-value]
    stem: For a sinusoidal current, what is the ratio of its rms value to its average value taken over a half cycle?
    options:
      - "1.11"
      - "0.90"
      - "1.41"
      - "0.637"
    answer: 0
    explanation: I_rms/I_avg = (I_0/√2)/(2I_0/π) = π/(2√2) ≈ 1.11. The value 0.90 is the inverse ratio.
  - id: phy-ac-008
    topic: ac-values
    subtopic: Meaning of rms reading
    concept: AC meters read rms; rms of sine wave is peak/√2
    category: concept
    format: statement-pair
    difficulty: 2
    time: 40
    ncert: true
    battle: false
    tags: [rms-value, trap]
    stem: |-
      Statement I: An AC ammeter connected in a circuit reads the rms value of the current.
      Statement II: The rms value of a sinusoidal current is half of its peak value.
    options:
      - Both Statement I and Statement II are correct
      - Both Statement I and Statement II are incorrect
      - Statement I is correct but Statement II is incorrect
      - Statement I is incorrect but Statement II is correct
    answer: 2
    explanation: AC meters are calibrated to show rms values, so Statement I is correct. The rms value is I_0/√2 ≈ 0.707 I_0, not I_0/2, so Statement II is wrong.
  - id: phy-ac-009
    topic: ac-values
    subtopic: RMS of DC plus AC
    concept: rms of i = I_1 + I_2 sin ωt is √(I_1^2 + I_2^2/2)
    category: numerical
    format: direct
    difficulty: 4
    time: 100
    ncert: false
    battle: false
    formula: I_rms^2 = ⟨i^2⟩
    tags: [rms-value, multi-concept, trap]
    stem: A current i = (4 + 3 sin ωt) A flows through a resistor. What is the rms value of this current?
    options:
      - 5 A
      - 4.53 A
      - 7 A
      - 3.54 A
    answer: 1
    explanation: ⟨i^2⟩ = 16 + 24⟨sin ωt⟩ + 9⟨sin^2 ωt⟩ = 16 + 0 + 4.5 = 20.5, so I_rms = √20.5 ≈ 4.53 A. The answer 5 A wrongly treats the parts as perpendicular phasors of equal weight.
  - id: phy-ac-010
    topic: ac-values
    subtopic: RMS of square wave
    concept: Square wave of ±I_0 has rms value I_0
    category: application
    format: direct
    difficulty: 3
    time: 50
    ncert: false
    battle: true
    tags: [rms-value, trap]
    stem: A current alternates as +I_0 for half a period and −I_0 for the next half. What is its rms value?
    options:
      - I_0/√2
      - 2I_0/π
      - I_0/2
      - I_0
    answer: 3
    explanation: i^2 = I_0^2 at every instant, so ⟨i^2⟩ = I_0^2 and I_rms = I_0. The value I_0/√2 applies only to sinusoidal waves.
  - id: phy-ac-011
    topic: ac-values
    subtopic: Time to reach peak
    concept: Current rises from zero to peak in T/4
    category: numerical
    format: direct
    difficulty: 2
    time: 35
    ncert: false
    battle: true
    formula: t = T/4 = 1/(4f)
    tags: [time-period]
    stem: A 50 Hz alternating current starts from zero. How long does it take to reach its peak value for the first time?
    options:
      - 10 ms
      - 20 ms
      - 5 ms
      - 2.5 ms
    answer: 2
    explanation: T = 1/50 s = 20 ms and zero to peak takes a quarter period, T/4 = 5 ms. 10 ms is half a period, when the current is back to zero.
  - id: phy-ac-012
    topic: ac-values
    subtopic: Zero mean of AC
    concept: Symmetric half cycles make full-cycle mean zero
    category: concept
    format: assertion-reason
    difficulty: 2
    time: 40
    ncert: true
    battle: false
    tags: [average-value]
    stem: |-
      Assertion (A): The average value of a sinusoidal alternating voltage over one complete cycle is zero.
      Reason (R): The positive and negative half cycles of a sinusoidal voltage are identical in shape and opposite in sign.
    options:
      - Both A and R are true and R is the correct explanation of A
      - Both A and R are true but R is not the correct explanation of A
      - A is true but R is false
      - A is false but R is true
    answer: 0
    explanation: Since each positive half cycle is cancelled by an identical negative half cycle, the full-cycle mean is zero. R directly explains A.
  - id: phy-ac-013
    topic: phasors-resistor
    subtopic: Phase in a resistor
    concept: Voltage and current in phase in a pure resistor
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [phase, ncert-line]
    stem: What is the phase difference between voltage and current when AC is applied to a pure resistor?
    options:
      - π/2
      - zero
      - π
      - π/4
    answer: 1
    explanation: For a resistor v = iR at every instant, so both reach maxima and zeros together; the phase difference is zero.
  - id: phy-ac-014
    topic: phasors-resistor
    subtopic: Power in resistor
    concept: P = V_rms^2/R
    category: numerical
    format: direct
    difficulty: 1
    time: 30
    ncert: true
    battle: true
    formula: P = V_rms^2/R
    tags: [power]
    stem: A 100 Ω resistor is connected to a 220 V (rms) AC supply. What is the average power dissipated?
    options:
      - 484 W
      - 968 W
      - 242 W
      - 2.2 W
    answer: 0
    explanation: P = V_rms^2/R = 48400/100 = 484 W. Using the peak voltage would wrongly double it to 968 W.
  - id: phy-ac-015
    topic: phasors-resistor
    subtopic: Phasor definition
    concept: Phasor rotates anticlockwise at ω; vertical projection gives instantaneous value
    category: concept
    format: statements
    difficulty: 2
    time: 40
    ncert: true
    battle: false
    tags: [phasor, ncert-line]
    stem: Which statement about a phasor representing v = v_m sin ωt (as used in NCERT) is correct?
    options:
      - It is a stationary vector along the horizontal axis
      - It rotates clockwise with angular speed 2ω
      - Its length equals the average value of the voltage
      - It rotates anticlockwise with angular speed ω and its vertical projection gives v
    answer: 3
    explanation: A phasor is a vector of length v_m rotating anticlockwise with angular speed ω about the origin; its projection on the vertical axis is v_m sin ωt.
  - id: phy-ac-016
    topic: phasors-resistor
    subtopic: Peak current in resistor
    concept: I_0 = √2 V_rms/R
    category: numerical
    format: direct
    difficulty: 2
    time: 35
    ncert: false
    battle: true
    formula: I_0 = √2 I_rms
    tags: [rms-value]
    stem: A 50 Ω resistor is connected across a 200 V (rms) AC source. What is the peak current through it?
    options:
      - 4 A
      - 5.66 A
      - 2.83 A
      - 8 A
    answer: 1
    explanation: I_rms = 200/50 = 4 A, so I_0 = √2 × 4 ≈ 5.66 A. 4 A is only the rms value.
  - id: phy-ac-017
    topic: phasors-resistor
    subtopic: Bulb on AC mains
    concept: Rated values of a bulb are rms values
    category: numerical
    format: direct
    difficulty: 3
    time: 60
    ncert: true
    battle: false
    formula: R = V^2/P, I_0 = √2 V_rms/R
    tags: [rms-value, multi-concept]
    stem: A bulb rated 100 W, 220 V is connected to 220 V AC mains. What is the peak current through the bulb?
    options:
      - 0.32 A
      - 0.45 A
      - 0.91 A
      - 0.64 A
    answer: 3
    explanation: R = 220^2/100 = 484 Ω, so I_rms = 220/484 ≈ 0.45 A and I_0 = √2 × 0.45 ≈ 0.64 A. 0.45 A is the rms current.
  - id: phy-ac-018
    topic: phasors-resistor
    subtopic: v–t and i–t graphs for resistor
    concept: Peaks of v and i coincide for a resistor
    category: concept
    format: graph
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    tags: [graph, phase]
    stem: On graphs of v and i against t for a pure resistor connected to AC, the maxima of current occur
    options:
      - at the same instants as the maxima of voltage
      - a quarter period after the voltage maxima
      - a quarter period before the voltage maxima
      - half a period after the voltage maxima
    answer: 0
    explanation: In a resistor current and voltage are in phase, so their maxima and zeros occur together. The quarter-period shifts belong to inductors and capacitors.
  - id: phy-ac-019
    topic: phasors-resistor
    subtopic: Average power from peak current
    concept: P_avg = ½ I_0^2 R
    category: numerical
    format: direct
    difficulty: 2
    time: 35
    ncert: true
    battle: true
    formula: P = ½ I_0^2 R
    tags: [power]
    stem: A current i = 2 sin ωt ampere flows through a 10 Ω resistor. What is the average power dissipated?
    options:
      - 40 W
      - 10 W
      - 20 W
      - 28.3 W
    answer: 2
    explanation: P = I_rms^2 R = ½ I_0^2 R = ½ × 4 × 10 = 20 W. 40 W uses the peak current as if it were rms.
  - id: phy-ac-020
    topic: phasors-resistor
    subtopic: Joule heating by AC
    concept: Mean of i^2 is nonzero though mean of i is zero
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [heating-effect, ncert-line]
    stem: Why does an AC current produce heat in a resistor even though its average value over a cycle is zero?
    options:
      - The average of i^2 over a cycle is not zero
      - The resistance changes with frequency
      - Current and voltage are out of phase in a resistor
      - The average of i over a half cycle is zero
    answer: 0
    explanation: Joule heating depends on i^2R, and i^2 is always positive, so its mean I_0^2/2 is nonzero. Current and voltage are actually in phase in a resistor.
  - id: phy-ac-021
    topic: ac-inductor
    subtopic: Inductive reactance
    concept: X_L = 2πfL
    category: numerical
    format: direct
    difficulty: 1
    time: 30
    ncert: true
    battle: true
    formula: X_L = 2πfL
    tags: [reactance]
    stem: What is the inductive reactance of a 0.5 H inductor at 50 Hz?
    options:
      - 157 Ω
      - 78.5 Ω
      - 314 Ω
      - 25 Ω
    answer: 0
    explanation: X_L = 2πfL = 2 × 3.14 × 50 × 0.5 ≈ 157 Ω. 25 Ω uses fL without the 2π factor.
  - id: phy-ac-022
    topic: ac-inductor
    subtopic: Phase in inductor
    concept: Current lags voltage by π/2 in pure inductor
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [phase, ncert-line]
    stem: In a purely inductive AC circuit, how is the current related in phase to the applied voltage?
    options:
      - It leads the voltage by π/2
      - It lags the voltage by π/2
      - It is in phase with the voltage
      - It lags the voltage by π
    answer: 1
    explanation: For an inductor v = L di/dt, giving i = i_m sin(ωt − π/2); the current lags by a quarter cycle. Leading by π/2 is the capacitor case.
  - id: phy-ac-023
    topic: ac-inductor
    subtopic: Power in inductor
    concept: Average power in pure inductor is zero
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [power, ncert-line]
    stem: What is the average power consumed over a complete cycle by an ideal inductor connected to an AC source?
    options:
      - V_rms I_rms
      - ½ V_0 I_0
      - zero
      - V_rms I_rms/√2
    answer: 2
    explanation: With φ = π/2, P = V_rms I_rms cos 90° = 0; energy stored in one quarter cycle is returned in the next.
  - id: phy-ac-024
    topic: ac-inductor
    subtopic: Inductor with DC
    concept: X_L = 0 when f = 0
    category: concept
    format: direct
    difficulty: 1
    time: 20
    ncert: false
    battle: true
    tags: [reactance, dc]
    stem: What is the reactance of an ideal inductor for a steady direct current?
    options:
      - infinite
      - zero
      - equal to L
      - equal to 1/L
    answer: 1
    explanation: X_L = ωL and ω = 0 for steady DC, so the reactance is zero. Infinite reactance for DC is the capacitor case.
  - id: phy-ac-025
    topic: ac-inductor
    subtopic: Effect of frequency on current
    concept: I = V/(2πfL) halves when f doubles
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: false
    battle: true
    tags: [reactance, proportionality]
    stem: A pure inductor is connected to an AC source. If the frequency is doubled keeping the rms voltage same, the rms current becomes
    options:
      - doubled
      - unchanged
      - four times
      - halved
    answer: 3
    explanation: X_L = 2πfL doubles when f doubles, so I = V/X_L is halved.
  - id: phy-ac-026
    topic: ac-inductor
    subtopic: Current in inductor
    concept: I_rms = V_rms/(2πfL)
    category: numerical
    format: direct
    difficulty: 2
    time: 45
    ncert: true
    battle: false
    formula: I = V/(2πfL)
    tags: [reactance]
    stem: A pure inductor of 0.2 H is connected to a 220 V, 50 Hz supply. What is the rms current in the circuit?
    options:
      - 3.5 A
      - 1.75 A
      - 7.0 A
      - 0.35 A
    answer: 0
    explanation: X_L = 2π × 50 × 0.2 ≈ 62.8 Ω, so I_rms = 220/62.8 ≈ 3.5 A.
  - id: phy-ac-027
    topic: ac-inductor
    subtopic: X_L versus frequency graph
    concept: X_L ∝ f gives straight line through origin
    category: concept
    format: graph
    difficulty: 2
    time: 25
    ncert: false
    battle: true
    tags: [graph, reactance]
    stem: What is the shape of the graph of inductive reactance X_L plotted against frequency f?
    options:
      - A rectangular hyperbola
      - A parabola opening upward
      - A straight line passing through the origin
      - A line parallel to the frequency axis
    answer: 2
    explanation: X_L = 2πLf is directly proportional to f, so the graph is a straight line through the origin. The hyperbola is the X_C–f graph.
  - id: phy-ac-028
    topic: ac-inductor
    subtopic: Unit of reactance
    concept: Reactance ωL is measured in ohm
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [units]
    stem: What is the SI unit of inductive reactance?
    options:
      - henry
      - siemens
      - weber
      - ohm
    answer: 3
    explanation: Reactance is the ratio of voltage amplitude to current amplitude, so its unit is the ohm, like resistance.
  - id: phy-ac-029
    topic: ac-inductor
    subtopic: Energy exchange in inductor
    concept: Inductor stores energy in one quarter cycle and returns it in the next
    category: concept
    format: statement-pair
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [power, energy]
    stem: |-
      Statement I: When the current through an inductor connected to AC is increasing, the inductor absorbs energy from the source.
      Statement II: The net energy absorbed by an ideal inductor over a complete cycle is positive.
    options:
      - Both Statement I and Statement II are correct
      - Both Statement I and Statement II are incorrect
      - Statement I is correct but Statement II is incorrect
      - Statement I is incorrect but Statement II is correct
    answer: 2
    explanation: As current grows, magnetic energy ½Li^2 is stored, drawn from the source. When the current falls, that energy is returned, so the net energy over a cycle is zero.
  - id: phy-ac-030
    topic: ac-inductor
    subtopic: Current expression in inductor
    concept: i = (V_0/ωL) sin(ωt − π/2)
    category: numerical
    format: direct
    difficulty: 3
    time: 60
    ncert: true
    battle: false
    formula: i = (V_0/ωL) sin(ωt − π/2)
    tags: [phase, reactance]
    stem: A voltage v = 100 sin(100t) volt is applied across a pure 0.5 H inductor. Which expression gives the current?
    options:
      - 2 sin(100t − π/2) A
      - 2 sin(100t + π/2) A
      - 50 sin(100t − π/2) A
      - 2 sin(100t) A
    answer: 0
    explanation: X_L = ωL = 100 × 0.5 = 50 Ω, so I_0 = 100/50 = 2 A, and current lags voltage by π/2. The + π/2 option describes a capacitor.
  - id: phy-ac-031
    topic: ac-inductor
