    answer: 0
    explanation: For DC, ω = 0 so X_C = 1/ωC is infinite; once charged no current flows, so the capacitor acts as an open circuit.
  - id: phy-ac-035
    topic: ac-capacitor
    subtopic: X_C versus frequency graph
    concept: X_C ∝ 1/f gives rectangular hyperbola
    category: concept
    format: graph
