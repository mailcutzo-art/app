    answer: 0
    explanation: For the nth secondary maximum only a fraction 1/(2n+1) of the slit contributes uncancelled, so the intensity falls rapidly with order. The central maximum is by far the brightest.

  - id: phy-wop-071
    topic: single-slit-diffraction
