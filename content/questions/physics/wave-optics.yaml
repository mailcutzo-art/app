      I. A path difference of λ corresponds to a phase difference of 2π.
      II. A path difference of λ/2 gives destructive interference.
      III. A path difference of 3λ/2 gives constructive interference.
      IV. A phase difference of 4π gives a bright point.
    options:
      - I and III only
      - II and III only
      - I, II and IV only
      - I, II, III and IV
    answer: 2
    explanation: φ = 2πΔx/λ. λ gives 2π (bright), λ/2 gives π (dark), 3λ/2 gives 3π (dark, so III is wrong) and 4π is an even multiple of π (bright).

