    stem: A student looks at light reflected from a glass window (not at the Brewster angle) through a rotating polaroid. The intensity
    options:
      - stays constant
      - varies between a maximum and a non-zero minimum
      - falls to zero twice per rotation
      - increases steadily with rotation
    answer: 1
    explanation: Reflection at angles other than i_B gives partially polarised light, a mixture of polarised and unpolarised light. Rotating the analyser varies the intensity, but the unpolarised part always gets through, so the minimum is not zero.

