    tags: [interference-vs-diffraction, ncert-line]
    stem: Which statement correctly distinguishes a YDSE interference pattern from a single-slit diffraction pattern?
    options:
      - In diffraction all bright fringes have equal intensity
      - In interference the central fringe is twice as wide as other fringes
      - Interference fringes are of equal width while in diffraction the central maximum is twice as wide as the others
      - Diffraction involves only two sources while interference involves a continuum of sources
    answer: 2
    explanation: In the ideal two-slit pattern fringes are equally spaced and of nearly equal intensity, while in single-slit diffraction the central maximum has twice the width of the secondary maxima, whose intensity decreases. Diffraction arises from a continuous family of sources across the slit, not two.

  - id: phy-wop-072
    topic: single-slit-diffraction
