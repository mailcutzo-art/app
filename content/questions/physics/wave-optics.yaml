      - much smaller than a^2/λ
      - independent of the aperture size
    answer: 2
    explanation: The diffraction spread over distance z is about zλ/a; it is negligible compared with the aperture a only if z ≪ a^2/λ (the Fresnel distance). For larger distances the beam spreads significantly.

