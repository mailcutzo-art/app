      - the lasers are not mutually coherent, so their relative phase drifts randomly
      - lasers are always polarised in perpendicular planes
      - the intensity from two lasers is too high for interference
    answer: 1
    explanation: Each laser is coherent in itself, but two independent lasers have no fixed phase relation with each other; the relative phase drifts, so any fringe pattern moves and averages out. Interference in Young's set-up needs both slits lit from the same source.

