questions:
  - id: phy-wop-001
    topic: huygens-wavefronts
    subtopic: Definition of wavefront
    concept: A wavefront is the locus of points oscillating in the same phase
    category: factual
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    tags: [wavefront, ncert-line]
    stem: A wavefront is best defined as the locus of all points that
    options:
      - are at the same distance from the source
      - have the same amplitude of vibration
      - oscillate in the same phase
      - have the same speed of propagation
    answer: 2
    explanation: NCERT defines a wavefront as a surface of constant phase, i.e. the locus of points oscillating in phase. Points at equal distance from a point source happen to be in phase in a uniform medium, but equal distance is not the definition; in a non-uniform medium the wavefront is not a sphere.

  - id: phy-wop-002
    topic: huygens-wavefronts
    subtopic: Shape of wavefronts
    concept: A point source produces spherical wavefronts
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [wavefront-shape]
    stem: The wavefronts emitted by a point source in a homogeneous medium are
    options:
      - spherical
      - cylindrical
      - plane
      - elliptical
    answer: 0
    explanation: Disturbance from a point source spreads equally in all directions, so surfaces of constant phase are spheres centred on the source. A linear source gives cylindrical wavefronts, and a very distant source gives plane wavefronts.

  - id: phy-wop-003
    topic: huygens-wavefronts
    subtopic: Shape of wavefronts
    concept: A linear source (slit) produces cylindrical wavefronts
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: false
    battle: true
    tags: [wavefront-shape]
    stem: Light from a long illuminated narrow slit spreads out with wavefronts that are
    options:
      - spherical
      - plane
      - conical
      - cylindrical
    answer: 3
    explanation: A long slit behaves as a line source, and all points at the same perpendicular distance from the line are in phase, so the wavefronts are coaxial cylinders. Spherical wavefronts need a point source.

  - id: phy-wop-004
    topic: huygens-wavefronts
    subtopic: Ray and wavefront
    concept: Rays are normal to the wavefront
    category: concept
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    tags: [ray, wavefront, ncert-line]
    stem: The angle between a light ray and the wavefront at the point where it meets it is
    options:
      - 0°
      - 45°
      - 90°
      - 180°
    answer: 2
    explanation: The direction of energy flow (the ray) is always perpendicular to the wavefront in an isotropic medium. So the angle is 90°.

  - id: phy-wop-005
    topic: huygens-wavefronts
    subtopic: Plane wavefront
    concept: Light from a very distant source reaches as plane wavefronts
    category: concept
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    tags: [plane-wavefront]
    stem: Sunlight reaching the Earth can be treated as having plane wavefronts because
    options:
      - the Sun is a line source
      - a small part of a very large sphere is nearly flat
      - the atmosphere flattens the wavefronts
      - sunlight is polarised
    answer: 1
    explanation: At a great distance from the source the radius of the spherical wavefront is huge, so any small portion of it is practically a plane. The atmosphere does not flatten wavefronts and polarisation has nothing to do with wavefront shape.

  - id: phy-wop-006
    topic: huygens-wavefronts
    subtopic: Huygens construction
    concept: Each point on a wavefront acts as a source of secondary wavelets
    category: factual
    format: direct
    difficulty: 1
    time: 30
    ncert: true
    battle: true
    tags: [huygens-principle, ncert-line]
    stem: According to Huygens principle, the new position of a wavefront after time t is obtained as
    options:
      - the backward envelope of the secondary wavelets
      - the line joining the centres of the secondary wavelets
      - the surface of maximum intensity of the wavelets
      - the forward envelope (common tangent) of the secondary wavelets
    answer: 3
    explanation: Every point of the wavefront emits secondary wavelets moving with the wave speed; after time t, the forward common tangent (envelope) of these wavelets of radius vt gives the new wavefront. The backward envelope is rejected because no backwave is observed.

  - id: phy-wop-007
    topic: huygens-wavefronts
    subtopic: Backwave
    concept: Huygens assumed the amplitude of secondary wavelets is zero in the backward direction
    category: concept
    format: direct
    difficulty: 2
    time: 35
    ncert: true
    battle: true
    tags: [backwave, ncert-line, trap]
    stem: Why does Huygens construction ignore the backward envelope of secondary wavelets?
    options:
      - Backward wavelets travel slower
      - The amplitude of secondary wavelets is taken as zero in the backward direction
      - Backward wavelets are absorbed by the source
      - Backward wavelets are always out of phase with the forward ones
    answer: 1
    explanation: Huygens ad hoc assumption (later justified by a more rigorous theory) is that the secondary wavelet amplitude is maximum in the forward direction and zero in the backward direction, so no backwave appears. Speed of the wavelets is the same in every direction.

  - id: phy-wop-008
    topic: huygens-wavefronts
    subtopic: Intensity variation
    concept: For a spherical wave amplitude falls as 1/r
    category: numerical
    format: direct
    difficulty: 2
    time: 40
    ncert: false
    battle: true
    formula: A ∝ 1/r, I ∝ 1/r^2
    tags: [spherical-wave, amplitude]
    stem: For a spherical wavefront, if the distance from the point source is doubled, the amplitude becomes
    options:
      - one-fourth
      - unchanged
      - one-half
      - 1/√2 times
    answer: 2
    explanation: Intensity of a spherical wave falls as 1/r^2 because the same power spreads over area 4πr^2; amplitude ∝ √I ∝ 1/r, so doubling r halves it. One-fourth is the change in intensity, not amplitude.

  - id: phy-wop-009
    topic: huygens-wavefronts
    subtopic: Intensity variation
    concept: For a cylindrical wave amplitude falls as 1/√r
    category: numerical
    format: direct
    difficulty: 3
    time: 50
    ncert: false
    battle: true
    formula: I ∝ 1/r, A ∝ 1/√r
    tags: [cylindrical-wave, amplitude, trap]
    stem: For a cylindrical wavefront from a line source, how does amplitude vary with distance r from the source?
    options:
      - A ∝ 1/√r
      - A ∝ 1/r
      - A ∝ 1/r^2
      - A is independent of r
    answer: 0
    explanation: Power per unit length spreads over the curved surface 2πrL, so intensity ∝ 1/r and amplitude ∝ √I ∝ 1/√r. The 1/r law for amplitude belongs to a spherical wave.

  - id: phy-wop-010
    topic: huygens-wavefronts
    subtopic: Wavefront through optical devices
    concept: A convex lens converts a plane wavefront into a converging spherical wavefront
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [lens, wavefront-shape, ncert-line]
    stem: A plane wavefront falls normally on a thin convex lens. The emergent wavefront is
    options:
      - plane
      - diverging spherical
      - cylindrical
      - converging spherical
    answer: 3
    explanation: The central part of the wavefront travels through the thickest glass and is delayed most, so the emergent wavefront is curved with its centre at the focus, i.e. a spherical wavefront converging to the focal point.

  - id: phy-wop-011
    topic: huygens-wavefronts
    subtopic: Wavefront through optical devices
    concept: A prism tilts a plane wavefront but keeps it plane
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [prism, wavefront-shape]
    stem: A plane wavefront passes through a thin prism. The emerging wavefront is
    options:
      - plane but tilted
      - spherical and converging
      - spherical and diverging
      - cylindrical
    answer: 0
    explanation: Near the base the wave goes through more glass and is delayed more than near the apex, and the delay varies linearly across the prism, so the wavefront stays plane but is tilted, i.e. the light is deviated towards the base.

  - id: phy-wop-012
    topic: huygens-wavefronts
    subtopic: Wavefront through optical devices
    concept: Matching incident wavefront with device and emergent wavefront
    category: application
    format: match
    difficulty: 3
    time: 70
    ncert: true
    battle: false
    tags: [wavefront-shape, lens, mirror, prism]
    stem: |-
      A plane wavefront is incident on each device in List I. Match with the emergent/reflected wavefront in List II.
      List I: P. Thin prism; Q. Convex lens; R. Concave mirror; S. Concave lens
      List II: 1. Spherical, diverging from a virtual focus; 2. Plane, tilted; 3. Spherical, converging to a point in front of the mirror; 4. Spherical, converging to a point behind the device
    options:
      - P-2, Q-4, R-1, S-3
      - P-2, Q-4, R-3, S-1
      - P-4, Q-2, R-3, S-1
      - P-1, Q-4, R-3, S-2
    answer: 1
    explanation: A prism deviates the plane wavefront (P-2); a convex lens makes it converge to its focus beyond the lens (Q-4); a concave mirror reflects it as a converging spherical wavefront towards its focus in front of it (R-3); a concave lens makes it diverge as if from a virtual focus (S-1).

  - id: phy-wop-013
    topic: huygens-reflection-refraction
    subtopic: Refraction by Huygens principle
    concept: Snell's law from Huygens construction gives sin i/sin r = v_1/v_2
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    formula: sin i / sin r = v_1/v_2 = n_2/n_1
    tags: [snells-law, ncert-line]
    stem: Using Huygens construction for refraction from medium 1 to medium 2, sin i/sin r equals
    options:
      - v_2/v_1
      - v_1/v_2
      - n_1/n_2
      - v_1 v_2
    answer: 1
    explanation: In the time the incident wavefront travels BC = v_1τ in medium 1, the wavelet from A grows to AE = v_2τ in medium 2. Then sin i = BC/AC and sin r = AE/AC, so sin i/sin r = v_1/v_2 = n_2/n_1. Writing n_1/n_2 inverts the ratio.

  - id: phy-wop-014
    topic: huygens-reflection-refraction
    subtopic: Speed in denser medium
    concept: Wave theory predicts light is slower in the denser medium
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [corpuscular-theory, ncert-line, trap]
    stem: When light bends towards the normal on entering water, the wave theory predicts that the speed of light in water is
    options:
      - greater than in air
      - equal to that in air
      - less than in air
      - zero at the surface
    answer: 2
    explanation: Bending towards the normal means r < i, and from sin i/sin r = v_1/v_2 this requires v_2 < v_1. Newton's corpuscular theory predicted the opposite (faster in water); Foucault's measurement confirmed the wave-theory prediction.

  - id: phy-wop-015
    topic: huygens-reflection-refraction
    subtopic: Frequency and wavelength on refraction
    concept: Frequency stays constant; wavelength becomes λ/n in a medium
    category: numerical
    format: direct
    difficulty: 2
    time: 40
    ncert: true
    battle: true
    formula: λ_medium = λ_0/n
    tags: [wavelength-in-medium]
    stem: Light of wavelength 600 nm in air enters glass of refractive index 1.5. Its wavelength in glass is
    options:
      - 900 nm
      - 600 nm
      - 300 nm
      - 400 nm
    answer: 3
    explanation: Frequency is set by the source and does not change on refraction, while speed drops to c/n, so λ = λ_0/n = 600/1.5 = 400 nm. Multiplying by n (900 nm) is the common slip.

  - id: phy-wop-016
    topic: huygens-reflection-refraction
    subtopic: Frequency and wavelength on refraction
    concept: Frequency is unchanged on refraction
    category: concept
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    tags: [frequency, trap]
    stem: When a light wave passes from air into glass, which quantity remains unchanged?
    options:
      - Frequency
      - Wavelength
      - Speed
      - Direction (for oblique incidence)
    answer: 0
    explanation: Frequency depends on the source and is continuous across the boundary; speed and wavelength both decrease by the factor n, and the direction changes for oblique incidence.

  - id: phy-wop-017
    topic: huygens-reflection-refraction
    subtopic: Doppler effect for light
    concept: Fractional Doppler shift Δν/ν = −v_radial/c for v ≪ c
    category: numerical
    format: direct
    difficulty: 3
    time: 60
    ncert: true
    battle: false
    formula: Δλ/λ = v_radial/c
    tags: [doppler-effect, red-shift]
    stem: A spectral line of wavelength 600 nm from a galaxy is observed at 606 nm. The speed of recession of the galaxy is about
    options:
      - 3 × 10^6 m s^{-1}
      - 3 × 10^5 m s^{-1}
      - 3 × 10^7 m s^{-1}
      - 6 × 10^6 m s^{-1}
    answer: 0
    explanation: For v ≪ c, Δλ/λ = v/c. Here Δλ/λ = 6/600 = 0.01, so v = 0.01 × 3 × 10^8 = 3 × 10^6 m s^{-1}. The increase in wavelength (red shift) shows the galaxy is receding.

  - id: phy-wop-018
    topic: huygens-reflection-refraction
    subtopic: Doppler effect for light
    concept: A receding source shows red shift
    category: concept
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    tags: [doppler-effect, red-shift, ncert-line]
    stem: Light from a star moving away from the Earth is observed to be
    options:
      - blue-shifted, with higher frequency
      - unchanged in wavelength
      - shifted to shorter wavelength
      - red-shifted, with longer wavelength
    answer: 3
    explanation: For a receding source the observed frequency decreases and wavelength increases, moving the lines towards the red end of the spectrum (red shift). Blue shift indicates approach.

  - id: phy-wop-019
    topic: huygens-reflection-refraction
    subtopic: Reflection by Huygens principle
    concept: Huygens construction gives angle of incidence equal to angle of reflection
    category: concept
    format: direct
    difficulty: 2
    time: 35
    ncert: true
    battle: true
    tags: [reflection, huygens-principle]
    stem: In the Huygens construction for reflection at a plane surface, the triangles formed are congruent because
    options:
      - the reflected wavelet travels faster than the incident wave
      - the incident and reflected waves travel in the same medium with the same speed
      - the reflected wave has a phase change of π
      - the surface absorbs part of the wave
    answer: 1
    explanation: Incident and reflected waves are in the same medium, so in time τ both travel the same distance vτ. The right triangles then share the hypotenuse and have an equal side, making them congruent and giving i = r. A phase change of π does not affect the geometry.

  - id: phy-wop-020
    topic: huygens-reflection-refraction
    subtopic: Speed in medium
    concept: Speed ratio from refractive indices
    category: numerical
    format: direct
    difficulty: 2
    time: 40
    ncert: false
    battle: true
    formula: v = c/n
    tags: [speed-of-light]
    stem: The refractive indices of water and glass are 4/3 and 3/2. The ratio of speed of light in water to that in glass is
    options:
      - 8/9
      - 9/8
      - "2"
      - 1/2
    answer: 1
    explanation: v ∝ 1/n, so v_water/v_glass = n_glass/n_water = (3/2)/(4/3) = 9/8. Light is faster in water since water is optically rarer; 8/9 inverts the ratio.

  - id: phy-wop-021
    topic: huygens-reflection-refraction
    subtopic: Total internal reflection via wavefronts
    concept: Critical angle when refracted wavelet cannot form a tangent
    category: numerical
    format: direct
    difficulty: 2
    time: 40
    ncert: true
    battle: true
    formula: sin i_c = v_1/v_2
    tags: [critical-angle]
    stem: Light travels at 2 × 10^8 m s^{-1} in glass and 3 × 10^8 m s^{-1} in air. The sine of the critical angle for glass–air is
    options:
      - 3/2
      - 1/3
      - 2/3
      - 1/2
    answer: 2
    explanation: At the critical angle the refracted wave grazes the surface, r = 90°, so sin i_c = v_glass/v_air = 2/3. A sine value of 3/2 is impossible.

  - id: phy-wop-022
    topic: huygens-reflection-refraction
    subtopic: Doppler effect for light
    concept: Doppler shift depends on the radial component of velocity
    category: concept
    format: assertion-reason
    difficulty: 3
    time: 60
    ncert: true
    battle: false
    tags: [doppler-effect, radial-velocity]
    stem: |-
      Assertion (A): A star moving exactly perpendicular to the line of sight shows (in the non-relativistic approximation) no Doppler shift.
      Reason (R): The Doppler shift of light depends on the component of the source velocity along the line joining source and observer.
    options:
      - Both A and R are true and R is the correct explanation of A
      - Both A and R are true but R is not the correct explanation of A
      - A is true but R is false
      - A is false but R is true
    answer: 0
    explanation: NCERT writes Δν/ν = −v_radial/c, so only the radial component matters. For purely transverse motion v_radial = 0 and the first-order shift vanishes, so R correctly explains A.

  - id: phy-wop-023
    topic: coherent-superposition
    subtopic: Coherent sources
    concept: Coherent sources maintain a constant phase difference
    category: factual
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    tags: [coherence, ncert-line]
    stem: Two sources are called coherent if they
    options:
      - have the same amplitude
      - have the same intensity
      - maintain a constant phase difference with time
      - are placed very close together
    answer: 2
    explanation: Coherence means the phase difference between the two sources does not change with time (which also requires the same frequency). Equal amplitude or intensity is not needed; unequal amplitudes only reduce fringe contrast.

  - id: phy-wop-024
    topic: coherent-superposition
    subtopic: Resultant intensity
    concept: Coherent equal intensities give 4I_0 at constructive interference
    category: numerical
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    formula: I = 4I_0 cos^2(φ/2)
    tags: [constructive-interference]
    stem: Two coherent waves each of intensity I_0 meet in phase. The resultant intensity is
    options:
      - 2I_0
      - 4I_0
      - I_0
      - zero
    answer: 1
    explanation: Amplitudes add, giving 2a, and intensity ∝ amplitude^2, so I = 4I_0. 2I_0 is the result for incoherent sources, where intensities simply add.

  - id: phy-wop-025
    topic: coherent-superposition
    subtopic: Incoherent addition
    concept: Incoherent sources add intensities
    category: concept
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    tags: [incoherent, trap]
    stem: Two incoherent sources each produce intensity I_0 at a point. The average intensity at the point is
    options:
      - 4I_0
      - I_0
      - zero
      - 2I_0
    answer: 3
    explanation: For incoherent sources the phase difference changes rapidly and randomly, so ⟨cos φ⟩ = 0 and the intensities add, giving 2I_0 everywhere with no fringes.

  - id: phy-wop-026
    topic: coherent-superposition
    subtopic: Resultant intensity
    concept: I = 4I_0cos^2(φ/2) at a given phase difference
    category: numerical
    format: direct
    difficulty: 2
    time: 40
    ncert: true
    battle: true
    formula: I = 4I_0 cos^2(φ/2)
    tags: [intensity, phase-difference]
    stem: Two coherent waves of equal intensity I_0 superpose with phase difference π/2. The resultant intensity is
    options:
      - 2I_0
      - I_0
      - 4I_0
      - 3I_0
    answer: 0
    explanation: I = 4I_0cos^2(π/4) = 4I_0 × ½ = 2I_0. Note this equals the incoherent average, but only at this particular phase difference.

  - id: phy-wop-027
    topic: coherent-superposition
    subtopic: Path and phase difference
    concept: Phase difference = (2π/λ) × path difference
    category: numerical
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    formula: φ = (2π/λ)Δx
    tags: [phase-difference]
    stem: A path difference of λ/4 between two waves corresponds to a phase difference of
    options:
      - π
      - π/4
      - π/2
      - 2π
    answer: 2
    explanation: φ = (2π/λ)Δx = (2π/λ)(λ/4) = π/2. A full wavelength corresponds to 2π.

  - id: phy-wop-028
    topic: coherent-superposition
    subtopic: Maximum and minimum intensity
    concept: I_max/I_min = ((√I_1 + √I_2)/(√I_1 − √I_2))^2
    category: numerical
    format: direct
    difficulty: 3
    time: 60
    ncert: false
    battle: true
    formula: I_max/I_min = ((√I_1+√I_2)/(√I_1−√I_2))^2
    tags: [intensity-ratio]
    stem: "Two coherent sources have intensities in the ratio 9 : 4. The ratio of maximum to minimum intensity in the interference pattern is"
    options:
      - "9 : 4"
      - "13 : 5"
      - "81 : 16"
      - "25 : 1"
    answer: 3
    explanation: "Amplitude ratio is √9 : √4 = 3 : 2. I_max/I_min = (3+2)^2/(3−2)^2 = 25/1. Using intensity directly instead of amplitude gives the wrong 13 : 5 type answers."

  - id: phy-wop-029
    topic: coherent-superposition
    subtopic: Maximum and minimum intensity
    concept: Finding amplitude ratio from I_max/I_min
    category: numerical
    format: direct
    difficulty: 3
    time: 70
    ncert: false
    battle: false
    formula: √(I_max/I_min) = (a_1+a_2)/(a_1−a_2)
    tags: [intensity-ratio, amplitude-ratio]
    stem: "In an interference pattern the ratio of maximum to minimum intensity is 16 : 1. The ratio of amplitudes of the two interfering waves is"
    options:
      - "4 : 1"
      - "5 : 3"
      - "16 : 1"
      - "3 : 1"
    answer: 1
    explanation: "√(I_max/I_min) = 4 = (a_1+a_2)/(a_1−a_2). Solving, a_1 + a_2 = 4a_1 − 4a_2, so 3a_1 = 5a_2 and a_1 : a_2 = 5 : 3. Taking 4 : 1 confuses the amplitude sum ratio with the amplitude ratio."

  - id: phy-wop-030
    topic: coherent-superposition
    subtopic: Coherent sources
    concept: Two independent bulbs are not coherent
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [coherence, ncert-line, trap]
    stem: No interference fringes are seen with light from two separate sodium lamps because
    options:
      - their wavelengths are slightly different always
      - their phase difference changes randomly in about 10^{-10} s
      - sodium light is polarised
      - their intensities are too high
    answer: 1
    explanation: Atoms in independent sources emit randomly, so the phase relation changes in times of order 10^{-10} s. The pattern shifts too fast and averages out to uniform illumination. Coherent sources are therefore derived from a single source, as in Young's slits.

  - id: phy-wop-031
    topic: coherent-superposition
    subtopic: Energy conservation in interference
    concept: Interference redistributes energy; average intensity is conserved
    category: concept
    format: statements
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [energy-conservation, interference]
    stem: Which statement about the interference of two coherent beams of equal intensity I_0 is correct?
    options:
      - Energy is destroyed at the dark fringes
      - The average intensity over the pattern is 2I_0, so energy is only redistributed
      - The average intensity over the pattern is 4I_0
      - Energy is created at the bright fringes
    answer: 1
    explanation: Intensity varies from 0 to 4I_0 as 4I_0cos^2(φ/2), whose average is 2I_0, the same as the sum of the two beams. Interference simply redistributes energy from dark to bright regions, consistent with energy conservation.

  - id: phy-wop-032
    topic: coherent-superposition
    subtopic: Resultant intensity
    concept: I = I_1 + I_2 + 2√(I_1I_2)cos φ for unequal intensities
    category: numerical
    format: direct
    difficulty: 3
    time: 60
    ncert: false
    battle: false
    formula: I = I_1 + I_2 + 2√(I_1 I_2) cos φ
    tags: [intensity, unequal-intensity]
    stem: Two coherent waves of intensities I and 4I superpose at a point with phase difference 60°. The resultant intensity is
    options:
      - 5I
      - 9I
      - 7I
      - 3I
    answer: 2
