      - exactly zero
      - independent of wavelength
    answer: 1
    explanation: Angular spread ~ λ/a is large only when a is of the order of λ. For apertures much larger than λ the spreading is negligible and light travels essentially in straight lines. That is why sound (long λ) diffracts easily around doors while light does not.

