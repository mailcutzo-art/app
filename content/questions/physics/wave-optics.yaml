    tags: [polaroid, ncert-line, trap]
    stem: |-
      Statement I: A polaroid consists of long-chain molecules aligned in a particular direction.
      Statement II: The component of the electric field along the direction of the aligned molecules is transmitted by the polaroid.
    options:
      - Both Statement I and Statement II are correct
      - Both Statement I and Statement II are incorrect
      - Statement I is correct but Statement II is incorrect
      - Statement I is incorrect but Statement II is correct
    answer: 2
    explanation: NCERT describes a polaroid as long-chain molecules aligned in one direction (I correct). The electric field along the molecules drives currents and gets absorbed; the component perpendicular to them passes, so the pass axis is perpendicular to the molecules (II incorrect).

