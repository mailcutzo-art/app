    explanation: z_F = a^2/λ = (2 × 10^{-3})^2/(5 × 10^{-7}) = 4 × 10^{-6}/5 × 10^{-7} = 8 m. Beyond this distance diffraction spreading dominates over the aperture size.

  - id: phy-wop-080
    topic: resolving-power
