      - 4 × 10^{-10} A m^{-2}
      - 1 × 10^5 A m^{-2}
      - 1 × 10^6 A m^{-2}
    answer: 3
    explanation: "J = σE = 5 × 10^7 × 0.02 = 1 × 10^6 A m^{-2}."

  - id: phy-cur-027
    topic: ohms-law-resistivity
    subtopic: R = ρL/A
    concept: Resistance from resistivity and dimensions
    category: numerical
    format: direct
