  - id: phy-cur-028
    topic: ohms-law-resistivity
    subtopic: Ohmic and non-ohmic
    concept: A metallic conductor at constant temperature is ohmic
    category: concept
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    tags: [ohmic-devices]
