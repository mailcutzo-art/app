      - A thyristor
      - A nichrome wire kept at constant temperature
      - Gallium arsenide showing negative-resistance behaviour
    answer: 2
    explanation: "A metallic conductor at constant temperature has a linear V–I graph through the origin. Diodes, thyristors and GaAs are NCERT's examples of non-ohmic behaviour."

  - id: phy-cur-029
    topic: ohms-law-resistivity
    subtopic: I–V graph
    concept: Slope of I–V graph equals 1/R
    category: concept
    format: graph
    difficulty: 2
    time: 30
    ncert: false
    battle: true
    tags: [graph-slope, confused-pair]
    stem: For an ohmic conductor, a graph is drawn with current I on the y-axis and voltage V on the x-axis. The slope of the straight line equals
    options:
      - R
      - 1/R
      - R^2
      - the resistivity ρ
    answer: 1
    explanation: "I = V/R, so the slope ΔI/ΔV = 1/R, the conductance. The slope would be R only if V were plotted on the y-axis."

  - id: phy-cur-030
    topic: ohms-law-resistivity
    subtopic: Changing diameter
    concept: R ∝ 1/d^2 for fixed length
    category: numerical
    format: direct
    difficulty: 2
    time: 30
    ncert: false
    battle: true
    formula: R = ρL/(πd^2/4)
    tags: [proportionality]
    stem: "Two wires of the same material and length have diameters in the ratio 1 : 3. The ratio of their resistances is"
    options:
      - "9 : 1"
      - "3 : 1"
      - "1 : 9"
      - "1 : 3"
    answer: 0
    explanation: "R ∝ 1/A ∝ 1/d^2, so R_1 : R_2 = d_2^2 : d_1^2 = 9 : 1. The thinner wire has the larger resistance."

  - id: phy-cur-031
    topic: temperature-dependence
    subtopic: Metals
    concept: Resistivity of metals rises because relaxation time falls
    category: concept
    format: direct
    difficulty: 2
    time: 35
    ncert: true
    battle: true
    tags: [relaxation-time, ncert-line]
    stem: The resistivity of a metal increases with temperature mainly because
    options:
      - the number density of free electrons increases
      - the mass of electrons increases
      - the drift speed becomes equal to the thermal speed
      - the relaxation time decreases as collisions become more frequent
    answer: 3
    explanation: "ρ = m/(ne^2τ). In a metal n hardly changes with temperature, but more vigorous lattice vibrations make collisions more frequent, so τ falls and ρ rises."

  - id: phy-cur-032
    topic: temperature-dependence
    subtopic: Temperature coefficient
    concept: R_T = R_0[1 + α(T − T_0)]
    category: numerical
    format: direct
    difficulty: 2
    time: 40
    ncert: true
    battle: true
    formula: R_T = R_0[1 + α(T − T_0)]
    tags: [temperature-coefficient]
    stem: A wire has resistance 10 Ω at 20 °C and temperature coefficient 4 × 10^{-3} °C^{-1}. What is its resistance at 70 °C?
    options:
      - 14 Ω
      - 12 Ω
      - 10.2 Ω
      - 12.8 Ω
    answer: 1
    explanation: "R = 10[1 + 4 × 10^{-3} × (70 − 20)] = 10 × 1.2 = 12 Ω. Using 70 °C instead of the 50 °C rise gives 12.8 Ω."

  - id: phy-cur-033
    topic: temperature-dependence
    subtopic: Semiconductors
    concept: Semiconductor resistivity falls with temperature as n rises
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [semiconductors, ncert-line]
    stem: The resistivity of a semiconductor decreases as temperature rises because
    options:
      - the number density of charge carriers increases
      - the relaxation time increases sharply
      - the lattice vibrations stop
      - the mass of the carriers decreases
    answer: 0
    explanation: "In semiconductors n increases rapidly with temperature, which more than compensates for the fall in τ, so ρ decreases (negative temperature coefficient)."

  - id: phy-cur-034
    topic: temperature-dependence
    subtopic: Alloys
    concept: Manganin and constantan have very low α
    category: factual
    format: direct
    difficulty: 2
