    options:
      - 1 Ω
      - 4 Ω
      - 0.25 Ω
      - 64 Ω
    answer: 0
    explanation: "Each piece has resistance 16/4 = 4 Ω. Four 4 Ω resistors in parallel give 4/4 = 1 Ω."

  - id: phy-cur-025
    topic: ohms-law-resistivity
    subtopic: Unit of resistivity
    concept: SI unit of resistivity is Ω m
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [units, resistivity]
    stem: The SI unit of electrical resistivity is
    options:
      - Ω m^{-1}
      - Ω m
      - Ω m^{-2}
      - S m^{-1}
    answer: 1
    explanation: "From R = ρL/A, ρ = RA/L with unit Ω m^2/m = Ω m. S m^{-1} is the unit of conductivity."

  - id: phy-cur-026
    topic: ohms-law-resistivity
    subtopic: Microscopic Ohm's law
    concept: J = σE
    category: numerical
    format: direct
    difficulty: 2
    time: 35
