questions:
  - id: phy-cur-001
    topic: electric-current
    subtopic: Unit of current
    concept: The ampere is an SI base unit
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [si-units, ncert-line]
    stem: Which of the following statements about the ampere is correct?
    options:
      - It is a derived unit equal to one coulomb per second
      - It is the SI unit of charge
      - It is one of the seven SI base units
      - It is the SI unit of current density
    answer: 2
    explanation: "Electric current is an SI base quantity and the ampere is its base unit; the coulomb is derived from it (1 C = 1 A s). The tempting choice, a derived unit equal to C s^{-1}, reverses the actual definition hierarchy."

  - id: phy-cur-002
    topic: electric-current
    subtopic: Definition of current
    concept: I = q/t for steady current
    category: numerical
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    formula: I = q/t
    tags: [basic-current]
    stem: A charge of 2 C flows steadily through a wire in 4 s. What is the current?
    options:
      - 2 A
      - 0.5 A
      - 8 A
      - 0.25 A
    answer: 1
    explanation: "I = q/t = 2/4 = 0.5 A. Multiplying charge and time (8 A) is a common slip."

  - id: phy-cur-003
    topic: electric-current
    subtopic: Current and electron flow
    concept: Number of electrons per second for 1 A
    category: numerical
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    formula: n = I/e
    tags: [electron-count]
    stem: How many electrons pass through a cross-section of a wire each second when it carries a current of 1 A?
    options:
      - 1.6 × 10^{19}
      - 6.25 × 10^{17}
      - 1.6 × 10^{-19}
      - 6.25 × 10^{18}
    answer: 3
    explanation: "n = I/e = 1/(1.6 × 10^{-19}) = 6.25 × 10^{18} electrons per second. Writing 1.6 × 10^{19} confuses the electronic charge with its reciprocal."

  - id: phy-cur-004
    topic: electric-current
    subtopic: Nature of current
    concept: Current is a scalar though it has direction
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: false
    battle: true
    tags: [scalar-vector, trap]
    stem: Electric current has a direction, yet it is treated as a scalar quantity because
    options:
      - it does not obey the laws of vector addition
      - its magnitude is always positive
      - it is defined only for metals
      - its direction is fixed by the electron flow
    answer: 0
    explanation: "Currents meeting at a junction add algebraically, not by the parallelogram law, so current is a scalar. Current density J, on the other hand, is a vector."

  - id: phy-cur-005
    topic: electric-current
    subtopic: Instantaneous current
    concept: I = dq/dt for time-varying charge
    category: numerical
    format: direct
    difficulty: 3
    time: 45
    ncert: false
    battle: true
    formula: I = dq/dt
    tags: [calculus]
    stem: The charge through a wire varies as q = 2t^2 + 3t (q in coulomb, t in second). What is the current at t = 2 s?
    options:
      - 14 A
      - 7 A
      - 11 A
      - 4 A
    answer: 2
    explanation: "I = dq/dt = 4t + 3 = 4(2) + 3 = 11 A. Dividing q by t (14/2 = 7 A) gives the average current, not the instantaneous one."

  - id: phy-cur-006
    topic: electric-current
    subtopic: Conventional current
    concept: Conventional current is opposite to electron flow
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [conventional-current, ncert-line]
    stem: In a metallic wire, the direction of conventional current is
    options:
      - the same as the direction of electron flow
      - perpendicular to the electric field
      - from the lower potential end to the higher potential end
      - opposite to the direction of electron drift
    answer: 3
    explanation: "Conventional current is the direction in which positive charge would move, i.e. from higher to lower potential, which is opposite to the drift of the negatively charged electrons."

  - id: phy-cur-007
    topic: electric-current
    subtopic: Current due to orbiting charge
    concept: Orbiting electron constitutes current I = ef
    category: numerical
    format: direct
    difficulty: 3
    time: 50
    ncert: false
    battle: false
    formula: I = qf
    tags: [orbiting-charge, multi-concept]
    stem: An electron revolves in a circular orbit with frequency 6.6 × 10^{15} Hz. What is the equivalent current?
    options:
      - 1.06 mA
      - 1.06 A
      - 0.53 mA
      - 10.6 mA
    answer: 0
    explanation: "Charge e passes any point of the orbit f times per second, so I = ef = 1.6 × 10^{-19} × 6.6 × 10^{15} ≈ 1.06 × 10^{-3} A = 1.06 mA."

  - id: phy-cur-008
    topic: electric-current
    subtopic: Current in a non-uniform conductor
    concept: Current is the same at every cross-section while J varies
    category: concept
    format: statement-pair
    difficulty: 3
    time: 50
    ncert: false
    battle: false
    tags: [current-density, trap]
    stem: |-
      A steady current flows through a metal wire whose cross-section gradually narrows from one end to the other.
      Statement I: The current is the same at every cross-section of the wire.
      Statement II: The current density is larger at the narrower end.
    options:
      - Both Statement I and Statement II are correct
      - Both Statement I and Statement II are incorrect
      - Statement I is correct but Statement II is incorrect
      - Statement I is incorrect but Statement II is correct
    answer: 0
    explanation: "In steady state charge cannot pile up anywhere, so the same current crosses every section. Since J = I/A, the current density is larger where A is smaller. Both statements are correct."

  - id: phy-cur-009
    topic: electric-current
    subtopic: Current density
    concept: Current density is a vector with unit A m^{-2}
    category: factual
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    tags: [current-density]
    stem: Current density is a
    options:
      - scalar with unit A m^{-2}
      - vector with unit A m^{-2}
      - vector with unit A m
      - scalar with unit A m^{-1}
    answer: 1
    explanation: "J = I/A points along the direction of flow of positive charge at a point, so it is a vector; its SI unit is ampere per square metre (A m^{-2})."

  - id: phy-cur-010
    topic: electric-current
    subtopic: Charge from I–t graph
    concept: Area under current–time graph gives charge
    category: numerical
    format: graph
    difficulty: 2
    time: 40
    ncert: false
    battle: true
    formula: q = ∫I dt
    tags: [graph-area]
    stem: The current in a wire increases linearly from 0 to 4 A in 5 s. How much charge flows through it in this time?
    options:
      - 20 C
      - 0.8 C
      - 40 C
      - 10 C
    answer: 3
    explanation: "Charge equals the area under the I–t graph, a triangle here: q = ½ × 5 × 4 = 10 C. Using the final current throughout gives 20 C, which overestimates."

  - id: phy-cur-011
    topic: drift-velocity
    subtopic: Order of drift speed
    concept: Drift speed of electrons is very small (~mm s^{-1})
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [drift-speed, ncert-line]
    stem: The drift speed of free electrons in a copper wire carrying a current of a few amperes is typically of the order of
    options:
      - 10^5 m s^{-1}
      - 10^{-3} m s^{-1}
      - 3 × 10^8 m s^{-1}
      - 10^{-12} m s^{-1}
    answer: 1
    explanation: "NCERT estimates the drift speed in a typical copper wire at about 1 mm s^{-1}, i.e. ~10^{-3} m s^{-1}. The value 10^5 m s^{-1} is the order of the random thermal speed, not the drift speed."

  - id: phy-cur-012
    topic: drift-velocity
    subtopic: I = neAv_d
    concept: Drift speed from current, n and area
    category: numerical
    format: direct
    difficulty: 3
    time: 60
    ncert: true
    battle: false
    formula: v_d = I/(neA)
    tags: [drift-speed]
    stem: A copper wire of cross-sectional area 1 mm^2 carries a current of 1.36 A. If the free-electron density is 8.5 × 10^{28} m^{-3}, what is the drift speed?
    options:
      - 1 × 10^{-4} m s^{-1}
      - 1 × 10^{-3} m s^{-1}
      - 1 × 10^{-5} m s^{-1}
      - 1 × 10^{-2} m s^{-1}
    answer: 0
    explanation: "v_d = I/(neA) = 1.36/(8.5 × 10^{28} × 1.6 × 10^{-19} × 10^{-6}) = 1.36/(1.36 × 10^4) = 1 × 10^{-4} m s^{-1}. Remember 1 mm^2 = 10^{-6} m^2."

  - id: phy-cur-013
    topic: drift-velocity
    subtopic: Drift velocity and field
    concept: v_d = eEτ/m is proportional to E
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    formula: v_d = eEτ/m
    tags: [drift-speed, proportionality]
    stem: If the potential difference across a metallic wire is doubled at constant temperature, the drift speed of its electrons
    options:
      - becomes four times
      - remains unchanged
      - doubles
      - halves
    answer: 2
    explanation: "E = V/L doubles, and v_d = eEτ/m with τ unchanged at constant temperature, so the drift speed doubles."

  - id: phy-cur-014
    topic: drift-velocity
    subtopic: Mobility
    concept: SI unit of mobility
    category: factual
    format: direct
    difficulty: 2
    time: 25
    ncert: true
    battle: true
    formula: μ = v_d/E
    tags: [mobility, units]
    stem: What is the SI unit of electron mobility?
    options:
      - m V^{-1} s^{-1}
      - V m^{-2} s
      - m^2 V s^{-1}
      - m^2 V^{-1} s^{-1}
    answer: 3
    explanation: "Mobility μ = v_d/E has unit (m s^{-1})/(V m^{-1}) = m^2 V^{-1} s^{-1}."

  - id: phy-cur-015
    topic: drift-velocity
    subtopic: Mobility and relaxation time
    concept: μ = eτ/m
    category: numerical
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    formula: μ = eτ/m
    tags: [mobility]
    stem: The relaxation time of electrons in a metal is 2.5 × 10^{-14} s. Taking e/m = 1.76 × 10^{11} C kg^{-1}, the electron mobility is about
    options:
      - 2.2 × 10^{-3} m^2 V^{-1} s^{-1}
      - 4.4 × 10^{-3} m^2 V^{-1} s^{-1}
      - 7.0 × 10^{-4} m^2 V^{-1} s^{-1}
      - 4.4 × 10^{-2} m^2 V^{-1} s^{-1}
    answer: 1
    explanation: "μ = eτ/m = 1.76 × 10^{11} × 2.5 × 10^{-14} = 4.4 × 10^{-3} m^2 V^{-1} s^{-1}."

  - id: phy-cur-016
    topic: drift-velocity
    subtopic: Drift speed in non-uniform wire
    concept: v_d ∝ 1/A for the same current
    category: numerical
    format: direct
    difficulty: 3
    time: 45
    ncert: false
    battle: true
    formula: I = neAv_d
    tags: [drift-speed, proportionality]
    stem: "A current flows through a wire made of two sections of the same metal with cross-sectional areas A and 2A. The ratio of drift speeds (area A : area 2A) is"
    options:
      - "1 : 2"
      - "1 : 4"
      - "2 : 1"
      - "1 : 1"
    answer: 2
    explanation: "The same current flows through both sections and n is the same, so v_d ∝ 1/A. The ratio is 2A : A, i.e. 2 : 1; the narrower section has the larger drift speed."

  - id: phy-cur-017
    topic: drift-velocity
    subtopic: Drift speed and length
    concept: For fixed V, v_d ∝ 1/L
    category: concept
    format: direct
    difficulty: 3
    time: 45
    ncert: false
    battle: true
    tags: [drift-speed, trap]
    stem: A wire is replaced by another of the same material and area but twice the length, with the same potential difference applied. The drift speed becomes
    options:
      - half
      - double
      - one-fourth
      - unchanged
    answer: 0
    explanation: "E = V/L halves when L doubles, and v_d = eEτ/m, so the drift speed halves. It does not depend on area, a common trap."

  - id: phy-cur-018
    topic: drift-velocity
    subtopic: Why bulbs glow instantly
    concept: Field is established almost instantly everywhere in the circuit
    category: concept
    format: direct
    difficulty: 2
    time: 35
    ncert: true
    battle: true
    tags: [drift-speed, misconception]
    stem: Although the drift speed of electrons is only about 1 mm s^{-1}, a bulb glows almost as soon as the switch is closed because
    options:
      - electrons from the switch reach the bulb at the speed of light
      - the thermal speed of electrons is very high
      - the bulb stores charge from the previous use
      - the electric field is set up throughout the circuit almost instantly and electrons everywhere start drifting
    answer: 3
    explanation: "Closing the switch sets up the electric field along the whole circuit at nearly the speed of light, so free electrons already present in the filament begin drifting at once. No single electron has to travel from the switch to the bulb."

  - id: phy-cur-019
    topic: drift-velocity
    subtopic: Thermal motion vs drift
    concept: Random thermal velocities average to zero
    category: concept
    format: assertion-reason
    difficulty: 2
    time: 40
    ncert: true
    battle: false
    tags: [thermal-motion, ncert-line]
    stem: |-
      Assertion (A): In the absence of an electric field, a metal wire carries no net current even though its free electrons move with speeds of about 10^5 m s^{-1}.
      Reason (R): The thermal velocities of the free electrons are randomly directed, so their average is zero.
    options:
      - Both A and R are true and R is the correct explanation of A
      - Both A and R are true but R is not the correct explanation of A
      - A is true but R is false
      - A is false but R is true
    answer: 0
    explanation: "Random thermal motion has no preferred direction, so as many electrons cross any section one way as the other; the average velocity and net current are zero. R correctly explains A."

  - id: phy-cur-020
    topic: drift-velocity
    subtopic: Relaxation time from resistivity
    concept: ρ = m/(ne^2τ)
    category: numerical
    format: direct
    difficulty: 4
    time: 100
    ncert: true
    battle: false
    formula: τ = m/(ne^2ρ)
    tags: [relaxation-time, multi-concept]
    stem: Copper has resistivity 1.7 × 10^{-8} Ω m and free-electron density 8.5 × 10^{28} m^{-3}. Taking m = 9.1 × 10^{-31} kg and e = 1.6 × 10^{-19} C, the relaxation time is about
    options:
      - 2.5 × 10^{-12} s
      - 4.0 × 10^{-14} s
      - 2.5 × 10^{-14} s
      - 2.5 × 10^{-16} s
    answer: 2
    explanation: "τ = m/(ne^2ρ) = 9.1 × 10^{-31}/(8.5 × 10^{28} × 2.56 × 10^{-38} × 1.7 × 10^{-8}) = 9.1 × 10^{-31}/(3.7 × 10^{-17}) ≈ 2.5 × 10^{-14} s."

  - id: phy-cur-021
    topic: ohms-law-resistivity
    subtopic: Ohm's law
    concept: R = V/I
    category: numerical
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    formula: V = IR
    tags: [ohms-law]
    stem: A current of 3 A flows through a resistor when 12 V is applied across it. What is its resistance?
    options:
      - 36 Ω
      - 0.25 Ω
      - 4 Ω
      - 9 Ω
    answer: 2
    explanation: "R = V/I = 12/3 = 4 Ω. 0.25 Ω comes from inverting the ratio."

  - id: phy-cur-022
    topic: ohms-law-resistivity
    subtopic: Factors affecting resistivity
    concept: Resistivity depends on material and temperature, not dimensions
    category: concept
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    tags: [resistivity, confused-pair]
    stem: The resistivity of a metal wire depends on
    options:
      - its length and area of cross-section
      - its material and temperature
      - the potential difference applied across it
      - its length only
    answer: 1
    explanation: "Resistivity is a property of the material at a given temperature. Length and area affect resistance R = ρL/A, not resistivity."

  - id: phy-cur-023
    topic: ohms-law-resistivity
    subtopic: Stretching a wire
    concept: Stretching to n times length multiplies R by n^2
    category: numerical
    format: direct
    difficulty: 3
    time: 45
    ncert: false
    battle: true
    formula: R = ρL/A
    tags: [stretching, trap]
    stem: A wire of resistance R is stretched uniformly so that its length doubles. Its new resistance is
    options:
      - 2R
      - R/2
      - R
      - 4R
    answer: 3
    explanation: "Volume is conserved, so doubling L halves A. R = ρL/A then becomes ρ(2L)/(A/2) = 4R. Answering 2R ignores the change in area."

  - id: phy-cur-024
    topic: ohms-law-resistivity
    subtopic: Cutting and recombining
    concept: Wire cut into n equal parts joined in parallel gives R/n^2
    category: numerical
    format: direct
    difficulty: 3
    time: 45
    ncert: false
    battle: true
    tags: [cutting-wire, multi-concept]
    stem: A wire of resistance 16 Ω is cut into four equal pieces, which are then connected in parallel. The equivalent resistance is
    options:
      - 1 Ω
      - 4 Ω
      - 0.25 Ω
      - 64 Ω
    answer: 0
    explanation: "Each piece has resistance 16/4 = 4 Ω. Four 4 Ω resistors in parallel give 4/4 = 1 Ω."

  - id: phy-cur-025
    topic: ohms-law-resistivity
    subtopic: Unit of resistivity
    concept: SI unit of resistivity is Ω m
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [units, resistivity]
    stem: The SI unit of electrical resistivity is
    options:
      - Ω m^{-1}
      - Ω m
      - Ω m^{-2}
      - S m^{-1}
    answer: 1
    explanation: "From R = ρL/A, ρ = RA/L with unit Ω m^2/m = Ω m. S m^{-1} is the unit of conductivity."

  - id: phy-cur-026
    topic: ohms-law-resistivity
    subtopic: Microscopic Ohm's law
    concept: J = σE
    category: numerical
    format: direct
    difficulty: 2
    time: 35
    ncert: true
    battle: true
