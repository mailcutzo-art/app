questions:
  - id: phy-grav-001
    topic: keplers-laws
    subtopic: Law of orbits
    concept: Planets move in elliptical orbits with the sun at one focus
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [kepler-first-law, ncert-line]
    stem: According to Kepler's first law, the sun is located at which point of a planet's elliptical orbit?
    options:
      - At the centre of the ellipse
      - At one of the foci of the ellipse
      - At the end of the major axis
      - At the midpoint between the two foci
    answer: 1
    explanation: "Kepler's law of orbits states that every planet moves in an elliptical orbit with the sun at one of the foci. The centre of the ellipse (midpoint of the foci) is not the sun's position unless the orbit is a circle."

  - id: phy-grav-002
    topic: keplers-laws
    subtopic: Law of areas
    concept: Kepler's second law follows from conservation of angular momentum
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [kepler-second-law, angular-momentum]
    stem: Kepler's law of areas is a consequence of the conservation of which quantity?
    options:
      - Linear momentum
      - Total mechanical energy
      - Angular momentum
      - Kinetic energy
    answer: 2
    explanation: "Areal velocity dA/dt = L/2m. The gravitational force is central, so its torque about the sun is zero and L is constant, making dA/dt constant. Energy is also conserved, but it is not what gives equal areas in equal times."

  - id: phy-grav-003
    topic: keplers-laws
    subtopic: Law of periods
    concept: T^2 ∝ a^3; period scaling with orbit radius
    category: numerical
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    formula: T^2 ∝ r^3
    tags: [kepler-third-law]
    stem: A planet's orbital radius is 4 times that of the earth. What is its period of revolution around the sun?
    options:
      - 4 years
      - 16 years
      - 2 years
      - 8 years
    answer: 3
    explanation: "From T^2 ∝ r^3, T = 1 year × 4^{3/2} = 8 years. Taking T ∝ r (4 years) or T ∝ r^2 (16 years) are common slips."

  - id: phy-grav-004
    topic: keplers-laws
    subtopic: Law of areas
    concept: Planet moves fastest at perihelion
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [kepler-second-law, perihelion]
    stem: At which point of its elliptical orbit does a planet move with the greatest speed?
    options:
      - Perihelion (closest to the sun)
      - Aphelion (farthest from the sun)
      - At the ends of the minor axis
      - Speed is the same everywhere in the orbit
    answer: 0
    explanation: "Angular momentum mvr is conserved, so speed is largest where r is smallest, at perihelion. Equal areas in equal times means the planet covers a longer arc near the sun."

  - id: phy-grav-005
    topic: keplers-laws
    subtopic: Law of areas
    concept: v_p r_p = v_a r_a at perihelion and aphelion
    category: numerical
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    formula: v_p r_p = v_a r_a
    tags: [kepler-second-law, angular-momentum]
    stem: A comet's distance from the sun is 2 × 10^{10} m at perihelion and 8 × 10^{10} m at aphelion. If its speed at perihelion is 60 km s^{-1}, its speed at aphelion is
    options:
      - 240 km s^{-1}
      - 30 km s^{-1}
      - 15 km s^{-1}
      - 7.5 km s^{-1}
    answer: 2
    explanation: "Conservation of angular momentum at the two extreme points (velocity perpendicular to radius): v_a = v_p r_p/r_a = 60 × 2/8 = 15 km s^{-1}. Multiplying instead of dividing gives 240 km s^{-1}."

  - id: phy-grav-006
    topic: keplers-laws
    subtopic: Law of periods
    concept: T^2/a^3 is the same for all planets of the sun
    category: concept
    format: statement-pair
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [kepler-third-law, multi-concept]
    stem: |-
      Statement I: For all planets of the solar system, the ratio T^2/a^3 has the same value, where a is the semi-major axis.
      Statement II: The value of T^2/a^3 for planets of the sun equals that for satellites of the earth.
    options:
      - Both Statement I and Statement II are correct
      - Both Statement I and Statement II are incorrect
      - Statement I is correct but Statement II is incorrect
      - Statement I is incorrect but Statement II is correct
    answer: 2
    explanation: "T^2/a^3 = 4π^2/GM depends on the mass M of the central body. It is common to all planets of the sun, but for earth satellites M is the earth's mass, so the constant differs."

  - id: phy-grav-007
    topic: keplers-laws
    subtopic: Areal velocity
    concept: Areal velocity equals L/2m
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    formula: dA/dt = L/2m
    tags: [kepler-second-law, areal-velocity]
    stem: For a planet of mass m and angular momentum L about the sun, the areal velocity of the radius vector is
    options:
      - L/m
      - 2L/m
      - L/2m
      - mL/2
    answer: 2
    explanation: "In time Δt the radius vector sweeps ΔA = ½ r × vΔt, so dA/dt = ½ r v sinθ = L/2m. Forgetting the ½ gives L/m."

  - id: phy-grav-008
    topic: keplers-laws
    subtopic: Law of periods
    concept: Deriving T^2 ∝ r^3 for circular orbits from Newton's law
    category: concept
    format: assertion-reason
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [kepler-third-law, centripetal-force]
    stem: |-
      Assertion (A): For circular orbits, Kepler's third law can be derived from Newton's law of gravitation.
      Reason (R): The gravitational force provides the centripetal force, GMm/r^2 = m(2π/T)^2 r, giving T^2 = 4π^2r^3/GM.
    options:
      - Both A and R are true and R is the correct explanation of A
      - Both A and R are true but R is not the correct explanation of A
      - A is true but R is false
      - A is false but R is true
    answer: 0
    explanation: "Equating gravitational force to the required centripetal force gives T^2 = (4π^2/GM) r^3, which is exactly Kepler's third law. So R is true and explains A."

  - id: phy-grav-009
    topic: keplers-laws
    subtopic: Law of periods
    concept: Semi-major axis of an ellipse from perihelion and aphelion distances
    category: numerical
    format: direct
    difficulty: 3
    time: 60
    ncert: true
    battle: false
    formula: a = (r_p + r_a)/2
    tags: [kepler-third-law, ellipse, trap]
    stem: A satellite's orbit around a planet has closest distance r and farthest distance 3r from the planet's centre. A second satellite moves in a circular orbit of radius 2r around the same planet. The ratio of their periods is
    options:
      - "1 : 1"
      - "1 : 2"
      - "√3 : 2√2"
      - "3√3 : 2√2"
    answer: 0
    explanation: "For the ellipse the semi-major axis is a = (r + 3r)/2 = 2r, equal to the radius of the circular orbit. Since T^2 ∝ a^3, the periods are equal. Using the aphelion or perihelion distance alone gives the wrong ratios."

  - id: phy-grav-010
    topic: keplers-laws
    subtopic: Law of areas
    concept: Statements about Kepler's laws
    category: application
    format: multi-statement
    difficulty: 3
    time: 60
    ncert: true
    battle: false
    tags: [kepler-laws, multi-concept]
    stem: |-
      Consider these statements about planetary motion.
      I. A planet's kinetic energy is maximum at perihelion.
      II. The angular momentum of a planet about the sun is constant.
      III. The linear momentum of a planet is constant.
      IV. The line joining the sun and planet sweeps equal areas in equal times.
      Which are correct?
    options:
      - I and III only
      - I, II and IV only
      - II and IV only
      - I, II, III and IV
    answer: 1
    explanation: "Speed is greatest at perihelion (I), angular momentum is conserved under a central force (II) and that gives equal areas (IV). Linear momentum changes direction continuously, so III is false."

  - id: phy-grav-011
    topic: universal-law
    subtopic: Inverse square law
    concept: Force varies as 1/r^2; tripling distance
    category: numerical
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    formula: F = Gm_1m_2/r^2
    tags: [inverse-square]
    stem: The gravitational force between two point masses is F. If the distance between them is tripled, the force becomes
    options:
      - F/3
      - 3F
      - F/9
      - 9F
    answer: 2
    explanation: "F ∝ 1/r^2, so tripling r reduces the force by 3^2 = 9, giving F/9. F/3 comes from treating the law as inverse, not inverse square."

  - id: phy-grav-012
    topic: universal-law
    subtopic: Newton's law
    concept: Force when both masses doubled and distance doubled
    category: numerical
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    formula: F = Gm_1m_2/r^2
    tags: [proportionality]
    stem: Two masses attract with force F. If each mass is doubled and the separation is also doubled, the new force is
    options:
      - F
      - 2F
      - 4F
      - F/2
    answer: 0
    explanation: "The product of masses becomes 4 times and r^2 also becomes 4 times, so F is unchanged."

  - id: phy-grav-013
    topic: universal-law
    subtopic: Newton's law
    concept: Gravitational force between two 1 kg masses 1 m apart equals G
    category: numerical
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    formula: F = Gm_1m_2/r^2
    tags: [magnitude]
    stem: What is the gravitational force between two 1 kg point masses placed 1 m apart? (G = 6.67 × 10^{-11} N m^2 kg^{-2})
    options:
      - 9.8 N
      - 6.67 × 10^{-11} N
      - 6.67 × 10^{11} N
      - 1 N
    answer: 1
    explanation: "F = G × 1 × 1/1^2 = G = 6.67 × 10^{-11} N. This tiny value shows why gravity between everyday objects goes unnoticed."

  - id: phy-grav-014
    topic: universal-law
    subtopic: Nature of gravitational force
    concept: Gravitational force forms an action-reaction pair
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [newtons-third-law, trap]
    stem: The earth pulls an apple with a force F. The force exerted by the apple on the earth is
    options:
      - Much smaller than F because the apple's mass is small
      - Zero, because the apple cannot attract the earth
      - Much larger than F because the earth's mass is large
      - Equal to F in magnitude and opposite in direction
    answer: 3
    explanation: "Gravitational forces between two bodies are equal and opposite (Newton's third law); F = GMm/r^2 is symmetric in the masses. Only the accelerations differ, since the earth's mass is huge."

  - id: phy-grav-015
    topic: universal-law
    subtopic: Superposition
    concept: Net force at centre of equilateral triangle of equal masses is zero
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [superposition, symmetry]
    stem: Three equal masses m are placed at the vertices of an equilateral triangle. The net gravitational force on a mass m₀ placed at the centroid is
    options:
      - Zero
      - 3Gmm₀/r^2 where r is the centroid–vertex distance
      - √3 Gmm₀/r^2
      - Gmm₀/r^2
    answer: 0
    explanation: "The three forces are equal in magnitude and at 120° to each other, so their vector sum is zero. Adding magnitudes gives the tempting 3Gmm₀/r^2."

  - id: phy-grav-016
    topic: universal-law
    subtopic: Superposition
    concept: Null point between two masses
    category: numerical
    format: direct
    difficulty: 3
    time: 60
    ncert: false
    battle: false
    formula: m_1/x^2 = m_2/(d − x)^2
    tags: [null-point, superposition]
    stem: Masses of 4 kg and 9 kg are fixed 1 m apart. At what distance from the 4 kg mass, on the line joining them, is the net gravitational force on a small test mass zero?
    options:
      - 0.6 m
      - 0.5 m
      - 0.4 m
      - 0.3 m
    answer: 2
    explanation: "Set 4/x^2 = 9/(1 − x)^2, so 2/x = 3/(1 − x), giving x = 0.4 m. The null point lies nearer the smaller mass; 0.6 m is its distance from the 9 kg mass."

  - id: phy-grav-017
    topic: universal-law
    subtopic: Nature of gravitational force
    concept: Gravitational force is independent of the intervening medium
    category: concept
    format: statements
    difficulty: 2
    time: 40
    ncert: true
    battle: false
    tags: [properties-of-gravity]
    stem: Which statement about the gravitational force between two particles is correct?
    options:
      - It depends on the medium between the particles
      - It can be attractive or repulsive depending on the masses
      - It is a central force and does not depend on the medium in between
      - It becomes zero if a third body is placed between them
    answer: 2
    explanation: "Gravity acts along the line joining the particles (central), is always attractive and is not screened by any medium or intervening body; each pair interaction is independent (superposition)."

  - id: phy-grav-018
    topic: universal-law
    subtopic: Superposition
    concept: Force on a mass at a square corner from other corners
    category: numerical
    format: direct
    difficulty: 4
    time: 120
    ncert: true
    battle: false
    formula: F = Gm^2/a^2
    tags: [superposition, square, multi-concept]
    stem: Four equal point masses m are placed at the corners of a square of side a. The magnitude of the net gravitational force on any one mass is
    options:
      - (Gm^2/a^2)(√2 + 1/2)
      - (Gm^2/a^2)(2√2)
      - (Gm^2/a^2)(√2 + 1)
      - (Gm^2/a^2)(1 + 1/√2)
    answer: 0
    explanation: "Two adjacent masses give forces Gm^2/a^2 at 90°, resultant √2 Gm^2/a^2 along the diagonal. The diagonal mass at distance √2a gives Gm^2/2a^2 along the same line. Total = (Gm^2/a^2)(√2 + ½)."

  - id: phy-grav-019
    topic: universal-law
    subtopic: Newton's law
    concept: Force from distance ratio
    category: numerical
    format: direct
    difficulty: 2
    time: 35
    ncert: true
    battle: true
    formula: F ∝ 1/r^2
    tags: [inverse-square]
    stem: The gravitational force between two bodies is 36 N. If the separation is increased by a factor of 1.5, the new force is
    options:
      - 24 N
      - 16 N
      - 54 N
      - 81 N
    answer: 1
    explanation: "F' = 36/(1.5)^2 = 36/2.25 = 16 N. Dividing only by 1.5 gives 24 N."

  - id: phy-grav-020
    topic: universal-law
    subtopic: Nature of gravitational force
    concept: Gravity is the weakest fundamental force
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [fundamental-forces]
    stem: Among the fundamental forces of nature, the gravitational force is
    options:
      - The strongest
      - The weakest
      - Stronger than the electromagnetic force
      - Of short range like the nuclear force
    answer: 1
    explanation: "Gravity is the weakest of the fundamental forces but has infinite range and is always attractive, so it dominates on astronomical scales. The nuclear force is short-ranged, gravity is not."

  - id: phy-grav-021
    topic: gravitational-constant
    subtopic: Value and units
    concept: SI unit of G
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [units, ncert-line]
    stem: The SI unit of the universal gravitational constant G is
    options:
      - N m^2 kg^{-2}
      - N m kg^{-1}
      - N kg^2 m^{-2}
      - kg m^2 s^{-2}
    answer: 0
    explanation: "From G = Fr^2/(m_1m_2), the unit is N m^2 kg^{-2}. N kg^2 m^{-2} inverts the ratio."

  - id: phy-grav-022
    topic: gravitational-constant
    subtopic: Dimensions
    concept: Dimensional formula of G
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [dimensions]
    stem: The dimensional formula of G is
    options:
      - "[M L^3 T^{-2}]"
      - "[M^{-1} L^2 T^{-2}]"
      - "[M^{-1} L^3 T^{-2}]"
      - "[M^{-2} L^3 T^{-2}]"
    answer: 2
    explanation: "G = Fr^2/m^2 → [M L T^{-2}][L^2]/[M^2] = [M^{-1} L^3 T^{-2}]."

  - id: phy-grav-023
    topic: gravitational-constant
    subtopic: Cavendish experiment
    concept: Cavendish first measured G using a torsion balance
    category: factual
    format: direct
    difficulty: 1
    time: 20
