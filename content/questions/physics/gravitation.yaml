      - Galileo Galilei
    answer: 2
    explanation: "Henry Cavendish measured G in 1798 using a torsion balance. Newton stated the law but did not measure G."

  - id: phy-grav-024
    topic: gravitational-constant
    subtopic: Universal nature
    concept: G does not depend on medium or location; g does
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [g-vs-G, trap]
    stem: If an experiment to measure G were performed on the moon instead of the earth, the value obtained would be
    options:
      - About one-sixth of the value on the earth
      - Six times the value on the earth
      - Zero, because the moon has no atmosphere
      - The same as on the earth
    answer: 3
    explanation: "G is a universal constant, the same everywhere. It is g, not G, that is about one-sixth on the moon."

  - id: phy-grav-025
    topic: gravitational-constant
    subtopic: Cavendish experiment
    concept: Torsion balance twist balances gravitational torque
    category: concept
    format: case
    difficulty: 3
    time: 60
    ncert: true
    battle: false
    formula: τ = Kθ = F L
    tags: [cavendish, torsion-balance]
    stem: In Cavendish's torsion balance, two large spheres are brought near two small spheres fixed at the ends of a light rod hung by a fine wire. The rod rotates until equilibrium. What balances the gravitational couple at equilibrium?
    options:
      - The weight of the small spheres
      - The restoring torque of the twisted suspension wire
      - The buoyant force of air on the spheres
      - The attraction between the two small spheres
    answer: 1
    explanation: "The gravitational forces on the two small spheres form a couple F × L, which twists the wire until its restoring torque Kθ equals it: FL = Kθ. Measuring θ gives F and hence G."

  - id: phy-grav-026
    topic: gravitational-constant
    subtopic: Value and units
    concept: Numerical value of G
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [value, ncert-line]
    stem: The accepted value of G is approximately
    options:
      - 9.8 N m^2 kg^{-2}
      - 6.67 × 10^{-11} N m^2 kg^{-2}
      - 6.67 × 10^{11} N m^2 kg^{-2}
      - 6.02 × 10^{23} N m^2 kg^{-2}
    answer: 1
    explanation: "G ≈ 6.67 × 10^{-11} N m^2 kg^{-2}. 9.8 is g in m s^{-2} and 6.02 × 10^{23} is Avogadro's number."

  - id: phy-grav-027
    topic: gravitational-constant
    subtopic: Mass of the earth
