  - id: phy-grav-029
    topic: g-on-earth
    subtopic: g in terms of G
    concept: g = GM/R^2
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    formula: g = GM/R^2
