    options:
      - GM/R
      - GM/R^2
      - GMR^2
      - GM^2/R
    answer: 1
    explanation: "Weight mg equals GMm/R^2, so g = GM/R^2, independent of the falling body's mass."

  - id: phy-grav-030
    topic: g-on-earth
    subtopic: g on other planets
    concept: g scales as M/R^2
    category: numerical
    format: direct
    difficulty: 2
    time: 40
    ncert: true
    battle: true
    formula: g = GM/R^2
    tags: [planets, proportionality]
    stem: A planet has twice the mass and twice the radius of the earth. If g on earth is 10 m s^{-2}, g on the planet is
    options:
      - 10 m s^{-2}
      - 20 m s^{-2}
      - 2.5 m s^{-2}
      - 5 m s^{-2}
    answer: 3
    explanation: "g ∝ M/R^2 = 2/4 = ½, so g = 5 m s^{-2}. Assuming g ∝ M/R gives 10."

  - id: phy-grav-031
    topic: g-on-earth
    subtopic: g and density
    concept: g = (4/3)πGρR
    category: numerical
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    formula: g = (4/3)πGρR
    tags: [density, proportionality]
    stem: A planet has the same average density as the earth but half its radius. The acceleration due to gravity on its surface is
    options:
      - g/4
      - g/2
      - 2g
      - g/8
    answer: 1
    explanation: "g = GM/R^2 = (4/3)πGρR, so at equal density g ∝ R and the value is g/2. Using M ∝ R^3 alone without the R^2 gives g/8."

  - id: phy-grav-032
    topic: g-on-earth
    subtopic: Free fall
    concept: All bodies fall with the same acceleration in vacuum
    category: concept
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [free-fall, trap]
    stem: A feather and a steel ball are dropped together from the same height in a vacuum tube. Which reaches the bottom first?
    options:
      - The steel ball
      - The feather
      - Both together
      - It depends on the size of the tube
    answer: 2
    explanation: "Without air resistance, both fall with the same acceleration g = GM/R^2, which does not depend on the body's own mass, so they land together."

