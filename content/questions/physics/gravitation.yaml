  - id: phy-grav-028
    topic: gravitational-constant
    subtopic: Universal nature
    concept: G is a scalar universal constant
    category: concept
    format: assertion-reason
    difficulty: 2
    time: 40
    ncert: true
    battle: false
    tags: [g-vs-G]
    stem: |-
      Assertion (A): The value of G is the same everywhere in the universe.
      Reason (R): The value of g is the same everywhere on the earth's surface.
    options:
      - Both A and R are true and R is the correct explanation of A
      - Both A and R are true but R is not the correct explanation of A
      - A is true but R is false
      - A is false but R is true
