questions:
  - id: phy-emi-001
    topic: faraday-henry-experiments
    subtopic: Magnet and coil experiment
    concept: Deflection occurs only while there is relative motion between magnet and coil
    category: concept
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    tags: [faraday-experiment, ncert-line]
    stem: A bar magnet is held at rest inside a coil connected to a galvanometer. The galvanometer shows
    options:
      - a steady deflection proportional to the magnet's strength
      - a deflection that slowly decays to zero
      - a deflection that reverses periodically
      - no deflection
    answer: 3
    explanation: An emf is induced only when the flux linked with the coil changes. With the magnet at rest there is no change of flux, so there is no deflection. A strong magnet alone does not give a steady deflection.
  - id: phy-emi-002
    topic: faraday-henry-experiments
    subtopic: Magnet and coil experiment
    concept: Faster relative motion gives larger galvanometer deflection
    category: concept
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    tags: [faraday-experiment, rate-of-change]
    stem: In Faraday's magnet–coil experiment, the galvanometer deflection becomes larger when the magnet is
    options:
      - pushed towards the coil more slowly
      - kept closer to the coil but at rest
      - replaced by an unmagnetised iron bar of equal size
      - pushed towards the coil more quickly
    answer: 3
    explanation: The induced emf equals the rate of change of flux. Moving the magnet faster changes the flux more quickly, so the emf and the deflection are larger. A magnet at rest gives no deflection however close it is.
  - id: phy-emi-003
    topic: faraday-henry-experiments
    subtopic: Coil–coil experiment with a key
    concept: A momentary deflection occurs only at switching on or off of the primary current
    category: concept
    format: case
    difficulty: 2
    time: 40
    ncert: true
    battle: false
    tags: [faraday-experiment, ncert-line]
    stem: Coil C1 is connected to a galvanometer and placed near coil C2, which is connected to a battery through a tapping key. The key is pressed and held down for a few seconds, then released. What does the galvanometer show?
    options:
      - A steady deflection for as long as the key is held down
      - Deflections only while the key is held, all in the same direction
      - A momentary deflection on pressing and a momentary deflection in the opposite direction on releasing
      - One deflection when the key is pressed and none when it is released
    answer: 2
    explanation: The flux linked with C1 changes only while the current in C2 grows (key pressed) or decays (key released), giving brief deflections in opposite directions. While the current is steady the flux is constant, so there is no deflection; a steady deflection would need a changing flux all the time.
  - id: phy-emi-004
    topic: faraday-henry-experiments
    subtopic: Coil–coil experiment with a key
    concept: An iron rod inserted along the axis increases the induced deflection
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [faraday-experiment, iron-core]
    stem: In the two-coil experiment, the deflection on pressing the key becomes much larger when
    options:
      - a wooden rod is placed along the common axis of the coils
      - a soft iron rod is placed along the common axis of the coils
      - the galvanometer is replaced by one of higher resistance
      - the coils are turned so that their axes are perpendicular
    answer: 1
    explanation: Soft iron has high permeability, so it greatly increases the flux linked with the secondary for the same primary current, and hence the change of flux and the deflection. Perpendicular axes reduce the linkage and a wooden rod changes nothing.
  - id: phy-emi-005
    topic: faraday-henry-experiments
    subtopic: Magnet and coil experiment
    concept: Reversing the approaching pole reverses the direction of deflection
    category: concept
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    tags: [faraday-experiment, direction]
    stem: Pushing the north pole of a magnet into a coil deflects the galvanometer to the right. Pushing the south pole into the same coil in the same way deflects it
    options:
      - to the right, by the same amount
      - to the right, by a smaller amount
      - to the left
      - not at all
    answer: 2
    explanation: Bringing a south pole changes the flux in the opposite sense, so the induced current and the deflection reverse. The size is the same for the same speed, but the direction is opposite.
  - id: phy-emi-006
    topic: faraday-henry-experiments
    subtopic: Conclusions of the experiments
    concept: The common cause in all of Faraday's experiments is a changing magnetic flux
    category: concept
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    tags: [faraday-experiment, ncert-line]
    stem: The single idea that explains the results of all of Faraday's and Henry's induction experiments is that an emf is induced when
    options:
      - a coil is placed in a strong magnetic field
      - the magnetic flux linked with the coil changes
      - a steady current flows in a nearby coil
      - the coil is made of a ferromagnetic material
    answer: 1
    explanation: Whether a magnet moves, a coil moves or a nearby current changes, the common feature is a change in the magnetic flux through the coil, which induces an emf. A strong but steady field or a steady current induces nothing.
  - id: phy-emi-007
    topic: faraday-henry-experiments
    subtopic: Coil–coil experiment with a key
    concept: A steady current in a neighbouring coil induces no current
    category: concept
    format: assertion-reason
    difficulty: 2
    time: 45
    ncert: true
    battle: false
    tags: [faraday-experiment, steady-current]
    stem: |-
      Assertion (A): A coil placed near a second coil carrying a large steady current shows no induced current.
      Reason (R): An emf is induced only when the magnetic flux linked with a coil changes with time.
    options:
      - Both A and R are true and R is the correct explanation of A
      - Both A and R are true but R is not the correct explanation of A
      - A is true but R is false
      - A is false but R is true
    answer: 0
    explanation: A steady current produces a constant field, so the flux through the nearby coil does not change and no emf is induced. R states exactly this condition, so it explains A.
  - id: phy-emi-008
    topic: faraday-henry-experiments
    subtopic: Moving coil experiment
    concept: Moving the coil towards a fixed magnet also induces current
    category: concept
    format: statements
    difficulty: 2
    time: 45
    ncert: true
    battle: false
    tags: [faraday-experiment, relative-motion]
    stem: Which statement about Faraday's magnet–coil experiments is correct?
    options:
      - Current is induced only when the magnet moves; moving the coil has no effect
      - The induced current is largest when the magnet is at rest at the centre of the coil
      - The direction of induced current is the same whether the magnet approaches or recedes
      - Current is induced whenever there is relative motion between the magnet and the coil
    answer: 3
    explanation: Only relative motion matters, so moving the coil towards a fixed magnet works just as well. At rest there is no induced current, and approach and recession give opposite directions.
  - id: phy-emi-009
    topic: magnetic-flux
    subtopic: Unit of magnetic flux
    concept: SI unit of magnetic flux is the weber (T m^2)
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [units, ncert-line]
    stem: The SI unit of magnetic flux is
    options:
      - weber
      - tesla
      - henry
      - gauss
    answer: 0
    explanation: Magnetic flux Φ = BA cos θ has unit T m^2, called the weber (Wb). Tesla and gauss are units of magnetic field and henry is the unit of inductance.
  - id: phy-emi-010
    topic: magnetic-flux
    subtopic: Flux through a plane area
    concept: Φ = BA cos θ with θ between B and the area normal
    category: numerical
    format: direct
    difficulty: 2
    time: 40
    ncert: true
    battle: true
    formula: Φ = BA cos θ
    tags: [flux-calculation]
    stem: A loop of area 0.02 m^2 lies in a uniform field of 0.5 T, the field making 60° with the normal to the loop. The flux through it is
    options:
      - 0.010 Wb
      - 0.0087 Wb
      - 0.005 Wb
      - 0.020 Wb
    answer: 2
    explanation: Φ = BA cos θ = 0.5 × 0.02 × cos 60° = 0.01 × 0.5 = 0.005 Wb. Using sin 60° gives the tempting 0.0087 Wb, which would be correct only if 60° were measured from the plane.
  - id: phy-emi-011
    topic: magnetic-flux
    subtopic: Flux through a plane area
    concept: Flux is zero when the field lies in the plane of the loop
    category: concept
    format: direct
    difficulty: 2
    time: 25
    ncert: true
    battle: true
    tags: [flux-calculation, trap]
    stem: A flat coil is placed in a uniform magnetic field so that the field lines are parallel to the plane of the coil. The flux through the coil is
    options:
      - maximum
      - half of its maximum value
      - equal to the field times the area
      - zero
    answer: 3
    explanation: With B parallel to the plane, the area vector (normal) is perpendicular to B, so θ = 90° and Φ = BA cos 90° = 0. "Parallel to the plane" is the trap; flux is maximum when B is along the normal.
  - id: phy-emi-012
    topic: magnetic-flux
    subtopic: Dimensions of flux
    concept: Dimensional formula of magnetic flux
    category: factual
    format: direct
    difficulty: 3
    time: 50
    ncert: false
    battle: true
    tags: [dimensions]
    stem: The dimensional formula of magnetic flux is
    options:
      - "[M T^{-2} A^{-1}]"
      - "[M L^2 T^{-2} A^{-1}]"
      - "[M L^2 T^{-2} A^{-2}]"
      - "[M L^2 T^{-3} A^{-1}]"
    answer: 1
    explanation: Flux has units of V s. Since [V] = [M L^2 T^{-3} A^{-1}], multiplying by T gives [M L^2 T^{-2} A^{-1}]. [M T^{-2} A^{-1}] is the field B and [M L^2 T^{-2} A^{-2}] is inductance.
  - id: phy-emi-013
    topic: magnetic-flux
    subtopic: Nature of flux
    concept: Magnetic flux is a scalar quantity
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [flux-definition]
    stem: Magnetic flux through a surface is
    options:
      - a vector along the magnetic field
      - a vector along the normal to the surface
      - a scalar quantity
      - a tensor quantity
    answer: 2
    explanation: Φ = B · A is a dot product of two vectors, so flux is a scalar. It can be positive or negative, but it has no direction.
  - id: phy-emi-014
    topic: magnetic-flux
    subtopic: Unit of magnetic flux
    concept: 1 Wb = 10^8 maxwell
    category: factual
    format: direct
    difficulty: 3
    time: 30
    ncert: false
    battle: true
    tags: [units, cgs]
    stem: How many maxwell (CGS unit of flux) make one weber?
    options:
      - 10^4
      - 10^8
      - 10^6
      - 10^{10}
    answer: 1
    explanation: 1 T = 10^4 G and 1 m^2 = 10^4 cm^2, so 1 Wb = 1 T m^2 = 10^4 × 10^4 G cm^2 = 10^8 maxwell. 10^4 is the tesla–gauss factor, a common slip.
  - id: phy-emi-015
    topic: magnetic-flux
    subtopic: Flux through a closed surface
    concept: Net magnetic flux through any closed surface is zero
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [gauss-law-magnetism]
    stem: A bar magnet is placed completely inside a closed spherical surface. The net magnetic flux through the sphere is
    options:
      - zero
      - μ_0 times the pole strength
      - μ_0 m divided by the radius
      - positive and equal to the flux from the north pole
    answer: 0
    explanation: Magnetic field lines form closed loops, so every line leaving the surface re-enters it and the net flux through any closed surface is zero. There are no isolated magnetic poles to give an electric-style "enclosed charge".
  - id: phy-emi-016
    topic: magnetic-flux
    subtopic: Flux linkage of a coil
    concept: Flux linkage = NBA for a coil normal to field
    category: numerical
    format: direct
    difficulty: 2
    time: 40
    ncert: true
    battle: true
    formula: NΦ = NBA cos θ
    tags: [flux-linkage]
    stem: A coil of 100 turns, each of area 50 cm^2, is held with its plane perpendicular to a 0.2 T field. The total flux linkage is
    options:
      - 0.001 Wb
      - 1.0 Wb
      - 0.01 Wb
      - 0.1 Wb
    answer: 3
    explanation: A = 50 cm^2 = 5 × 10^{-3} m^2 and the normal is along B, so NΦ = 100 × 0.2 × 5 × 10^{-3} = 0.1 Wb. Forgetting N gives 0.001 Wb.
  - id: phy-emi-017
    topic: magnetic-flux
    subtopic: Flux through a plane area
    concept: Angle given with the plane requires sin of that angle
    category: numerical
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    formula: Φ = BA sin α (α from the plane)
    tags: [flux-calculation, trap]
    stem: A 0.1 m^2 loop lies in a 0.4 T field, the field making 30° with the plane of the loop. The flux through the loop is
    options:
      - 0.040 Wb
      - 0.020 Wb
      - 0.035 Wb
      - 0.010 Wb
    answer: 1
    explanation: The angle with the normal is 90° − 30° = 60°, so Φ = 0.4 × 0.1 × cos 60° = 0.02 Wb. Using cos 30° directly gives 0.035 Wb, the trap.
  - id: phy-emi-018
    topic: magnetic-flux
    subtopic: Unit of magnetic flux
    concept: Weber is equivalent to volt second
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: false
    battle: true
    tags: [units]
    stem: One weber is equivalent to
    options:
      - one volt second
      - one volt per second
      - one ampere second
      - one tesla per square metre
    answer: 0
    explanation: From ε = dΦ/dt, flux = emf × time, so 1 Wb = 1 V s. The weber is also 1 T m^2, not T per m^2.
  - id: phy-emi-019
    topic: faradays-law
    subtopic: Average induced emf
    concept: ε = NΔΦ/Δt for a multi-turn coil
    category: numerical
    format: direct
    difficulty: 2
    time: 40
    ncert: true
    battle: true
    formula: ε = −N ΔΦ/Δt
    tags: [faraday-law]
    stem: The flux through each turn of a 50-turn coil falls from 4 mWb to 1 mWb in 0.1 s. The average induced emf is
    options:
      - 0.03 V
      - 2.5 V
      - 1.5 V
      - 0.15 V
    answer: 2
    explanation: |-
      ε = N ΔΦ/Δt = 50 × (3 × 10^{-3})/0.1 = 1.5 V. Omitting N gives 0.03 V; using the final flux instead of the change gives a different wrong value.
  - id: phy-emi-020
    topic: faradays-law
    subtopic: Instantaneous induced emf
    concept: Instantaneous emf is the time derivative of flux
    category: numerical
    format: direct
    difficulty: 2
    time: 45
    ncert: true
    battle: true
    formula: ε = −dΦ/dt
    tags: [faraday-law, calculus]
    stem: The flux through a loop varies as Φ = (3t^2 + 2t + 1) mWb, with t in seconds. The magnitude of the emf at t = 2 s is
    options:
      - 17 mV
      - 12 mV
      - 8 mV
      - 14 mV
    answer: 3
    explanation: dΦ/dt = 6t + 2 = 14 mWb/s at t = 2 s, so |ε| = 14 mV. 17 mV is the value of Φ itself, not its rate of change.
  - id: phy-emi-021
    topic: faradays-law
    subtopic: Flux–time graphs
    concept: A linearly rising flux gives a constant emf
    category: concept
    format: graph
    difficulty: 2
    time: 40
    ncert: false
    battle: true
    tags: [graph, faraday-law]
    stem: The flux through a coil increases linearly with time, as a straight line through the origin. The induced emf
    options:
      - increases linearly with time
      - is zero
      - is constant and non-zero
      - decreases linearly with time
    answer: 2
    explanation: The emf equals the slope of the Φ–t graph. A straight line has a constant slope, so the emf is constant and non-zero. A rising emf would need a curved (parabolic) flux graph.
  - id: phy-emi-022
    topic: faradays-law
    subtopic: Induced charge
    concept: Induced charge Q = NΔΦ/R is independent of time taken
    category: numerical
    format: direct
    difficulty: 3
    time: 60
    ncert: false
    battle: true
    formula: Q = NΔΦ/R
    tags: [induced-charge]
    stem: The flux through each turn of a 100-turn coil of resistance 10 Ω changes by 2 × 10^{-3} Wb. The charge that flows through the coil is
    options:
      - 0.02 C
      - 2 × 10^{-4} C
      - 0.2 C
      - 2 C
    answer: 0
    explanation: I = ε/R = (N/R)(dΦ/dt), so Q = ∫I dt = NΔΦ/R = 100 × 2 × 10^{-3}/10 = 0.02 C. The charge does not depend on how quickly the flux changes.
  - id: phy-emi-023
    topic: faradays-law
    subtopic: Statement of Faraday's law
    concept: Induced emf depends on rate of change of flux, not on flux itself
    category: concept
    format: statements
    difficulty: 2
    time: 45
    ncert: true
    battle: false
    tags: [faraday-law, trap]
    stem: Which statement about the emf induced in a coil is correct?
    options:
      - It is proportional to the magnetic flux linked with the coil
      - It is proportional to the rate of change of the flux linked with the coil
      - It is zero whenever the flux through the coil is zero
      - It depends on the resistance of the coil
    answer: 1
    explanation: Faraday's law gives ε = −dΦ/dt, so the emf depends on how fast the flux changes. The flux can be momentarily zero while changing rapidly, and the resistance affects the current, not the emf.
  - id: phy-emi-024
    topic: faradays-law
    subtopic: Changing field through fixed loop
    concept: ε = A dB/dt for a fixed loop
    category: numerical
    format: direct
    difficulty: 1
    time: 30
    ncert: true
    battle: true
    formula: ε = A dB/dt
    tags: [faraday-law]
    stem: A loop of area 0.5 m^2 is normal to a field that increases at 0.02 T s^{-1}. The emf induced is
    options:
      - 1 mV
      - 25 mV
      - 40 mV
      - 10 mV
    answer: 3
    explanation: ε = A dB/dt = 0.5 × 0.02 = 0.01 V = 10 mV. Dividing instead of multiplying (0.02/0.5) gives 40 mV.
  - id: phy-emi-025
    topic: faradays-law
    subtopic: Changing field through fixed loop
    concept: Circular loop with field reduced uniformly to zero
    category: numerical
    format: direct
    difficulty: 3
    time: 60
    ncert: true
    battle: true
    formula: ε = πr^2 ΔB/Δt
    tags: [faraday-law]
    stem: A circular loop of radius 10 cm is normal to a 1.0 T field. The field is reduced uniformly to zero in 0.5 s. The emf induced is about
    options:
      - 63 mV
      - 6.3 mV
      - 31 mV
      - 0.63 V
    answer: 0
    explanation: A = π(0.1)^2 = 0.0314 m^2, so ε = 0.0314 × 1.0/0.5 = 0.0628 V ≈ 63 mV. Forgetting to divide by 0.5 s gives 31 mV.
  - id: phy-emi-026
    topic: faradays-law
    subtopic: Dependence on turns and time
    concept: ε ∝ N and ∝ 1/Δt
    category: numerical
    format: direct
    difficulty: 2
    time: 30
    ncert: false
    battle: true
    formula: ε = NΔΦ/Δt
    tags: [proportionality]
    stem: The number of turns of a coil is doubled and the same change of flux per turn now takes half the time. The average induced emf becomes
    options:
      - unchanged
      - twice
      - four times
      - half
    answer: 2
    explanation: ε = NΔΦ/Δt. Doubling N doubles ε and halving Δt doubles it again, so ε becomes 4 times.
  - id: phy-emi-027
    topic: faradays-law
    subtopic: Flux–time graphs
    concept: Parabolic flux gives linearly increasing emf
    category: concept
    format: graph
    difficulty: 3
    time: 50
    ncert: false
    battle: true
    tags: [graph, calculus]
    stem: The flux through a loop varies as Φ = kt^2 (a parabola through the origin). The graph of induced emf magnitude against time is
    options:
      - a horizontal straight line
      - a straight line through the origin with positive slope
      - a parabola through the origin
      - a rectangular hyperbola
    answer: 1
    explanation: The emf magnitude is dΦ/dt = 2kt, which is a straight line through the origin. Plotting the flux shape itself (parabola) is the common error.
  - id: phy-emi-028
    topic: faradays-law
    subtopic: Statement of Faraday's law
    concept: Negative sign in Faraday's law expresses Lenz's law
    category: factual
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    tags: [faraday-law, lenz-law, ncert-line]
    stem: In ε = −dΦ/dt, the negative sign indicates that
    options:
      - the emf is always negative
      - the flux always decreases during induction
      - the induced current flows from the negative terminal
      - the induced emf opposes the change of flux that produces it
    answer: 3
    explanation: The minus sign expresses Lenz's law, which says the induced emf opposes the change in flux. It does not mean the emf value is always negative.
  - id: phy-emi-029
    topic: faradays-law
    subtopic: Induced current
    concept: Induced current = NA(dB/dt)/R
    category: numerical
    format: direct
    difficulty: 3
    time: 60
    ncert: true
    battle: true
    formula: I = NA(dB/dt)/R
    tags: [faraday-law, multi-concept]
    stem: A 200-turn coil of area 0.01 m^2 and resistance 5 Ω is normal to a field changing at 0.5 T s^{-1}. The induced current is
    options:
      - 1.0 A
      - 0.02 A
      - 5 A
      - 0.2 A
    answer: 3
    explanation: ε = NA dB/dt = 200 × 0.01 × 0.5 = 1 V, so I = ε/R = 1/5 = 0.2 A. Stopping at 1 V and quoting it as current gives the distractor 1.0 A.
  - id: phy-emi-030
    topic: faradays-law
    subtopic: Sinusoidal flux
    concept: Peak emf = Φ_0 ω for Φ = Φ_0 sin ωt
    category: numerical
    format: direct
    difficulty: 3
    time: 50
    ncert: false
    battle: true
    formula: ε_{max} = Φ_0 ω
    tags: [faraday-law, calculus]
    stem: The flux through a loop is Φ = 10 sin(100πt) mWb. The maximum induced emf is about
    options:
      - 10 mV
      - 3.14 V
      - 1.0 V
      - 6.28 V
    answer: 1
    explanation: ε = −dΦ/dt = −(10 × 10^{-3})(100π) cos(100πt), so ε_{max} = π ≈ 3.14 V. Dropping π gives 1.0 V, and 10 mV is the peak flux value, not the emf.
  - id: phy-emi-031
    topic: faradays-law
    subtopic: Units in Faraday's law
    concept: Rate of change of flux has unit volt
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: false
    battle: true
    tags: [units]
    stem: The SI unit of rate of change of magnetic flux (Wb s^{-1}) is the same as
    options:
      - the volt
      - the henry
      - the ampere
      - the tesla
    answer: 0
    explanation: Faraday's law equates the emf to dΦ/dt, so 1 Wb s^{-1} = 1 V.
  - id: phy-emi-032
    topic: faradays-law
    subtopic: Open and closed circuits
    concept: Emf is induced even in an open circuit; current needs a closed path
    category: concept
    format: assertion-reason
    difficulty: 3
    time: 60
    ncert: false
    battle: false
    tags: [faraday-law, open-circuit]
    stem: |-
      Assertion (A): An emf is induced in a coil with open ends when the flux through it changes.
      Reason (R): An induced current can flow only in a closed circuit.
    options:
      - Both A and R are true and R is the correct explanation of A
      - Both A and R are true but R is not the correct explanation of A
      - A is true but R is false
      - A is false but R is true
    answer: 1
    explanation: Faraday's law gives an emf whenever flux changes, whether or not the circuit is closed, so A is true. R is also true, but it is about current, not about why the emf exists, so it does not explain A.
  - id: phy-emi-033
    topic: faradays-law
    subtopic: Flux–time graphs
    concept: Emf is zero where flux is constant and reverses when flux falls
    category: concept
    format: graph
    difficulty: 3
    time: 60
    ncert: false
    battle: false
    tags: [graph, faraday-law]
    stem: The flux through a coil rises linearly from 0 to 2 s, stays constant from 2 s to 4 s, and falls linearly back to zero from 4 s to 5 s. Which describes the induced emf?
    options:
