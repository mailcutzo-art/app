    tags: [ac-generator, misconception]
    stem: |-
      Statement I: In an AC generator, the emf is maximum at the instant the flux through the coil is maximum.
      Statement II: The carbon brushes of an AC generator rotate together with the coil.
    options:
      - Both Statement I and Statement II are correct
      - Both Statement I and Statement II are incorrect
      - Statement I is correct but Statement II is incorrect
      - Statement I is incorrect but Statement II is correct
    answer: 1
    explanation: The emf is maximum when the flux is zero and changing fastest, so Statement I is incorrect. The slip rings rotate with the coil while the brushes stay fixed and press on them, so Statement II is incorrect too.
