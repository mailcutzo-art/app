    stem: |-
      For a generator with emf ε = ε_0 sin ωt, which statements are correct?
      I. The average emf over one complete cycle is zero.
      II. The average emf over the half cycle from ωt = 0 to π is 2ε_0/π.
      III. The emf is maximum when the plane of the coil is parallel to the field.
