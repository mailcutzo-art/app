      Statement II: With a soft iron core, the coefficient of coupling between two coils can exceed 1.
    options:
      - Both Statement I and Statement II are correct
      - Both Statement I and Statement II are incorrect
      - Statement I is correct but Statement II is incorrect
      - Statement I is incorrect but Statement II is correct
    answer: 2
    explanation: With all flux of one coil linking the other (k = 1), M = √(L_1L_2), so Statement I is correct. The coefficient of coupling k = M/√(L_1L_2) can never exceed 1; an iron core raises L_1, L_2 and M together.
