questions:
  - id: phy-rot-001
    topic: centre-of-mass
    subtopic: Two-particle system
    concept: Centre of mass of two particles lies closer to the heavier one
    category: numerical
    format: direct
    difficulty: 1
    time: 30
    ncert: true
    battle: true
    formula: x_{cm} = (m_1x_1 + m_2x_2)/(m_1 + m_2)
    tags: [two-particle, com-position]
    stem: Masses of 2 kg and 3 kg are placed at x = 0 and x = 5 m. Where is their centre of mass?
    options:
      - x = 2 m
      - x = 2.5 m
      - x = 3 m
      - x = 3.5 m
    answer: 2
    explanation: "x_{cm} = (2 × 0 + 3 × 5)/(2 + 3) = 15/5 = 3 m. It lies nearer the heavier 3 kg mass; 2.5 m would be the answer only for equal masses."

  - id: phy-rot-002
    topic: centre-of-mass
    subtopic: Definition
    concept: Centre of mass need not lie inside the material of the body
    category: concept
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    tags: [com-location, ncert-line]
    stem: For which of these bodies does the centre of mass lie at a point where there is no mass?
    options:
      - A uniform circular ring
      - A uniform solid sphere
      - A uniform rectangular plate
      - A uniform solid cube
    answer: 0
    explanation: "The centre of mass of a uniform ring is at its geometric centre, which is empty space. For the solid sphere, plate and cube the centre lies inside the material."

  - id: phy-rot-003
    topic: motion-of-centre-of-mass
    subtopic: Internal forces
    concept: Internal forces cannot change the velocity of the centre of mass
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [internal-forces, explosion, trap]
    stem: A shell moving along a parabolic path explodes in mid-air. Ignoring air resistance, the centre of mass of the fragments
    options:
      - stops at the point of explosion
      - falls vertically from the point of explosion
      - moves along a straight line from the point of explosion
      - continues along the same parabolic path
    answer: 3
    explanation: "The explosion forces are internal, so only gravity acts externally on the system. The centre of mass therefore keeps following the original parabola until some fragment hits the ground."

  - id: phy-rot-004
    topic: vector-product
    subtopic: Unit vectors
    concept: Cross products of Cartesian unit vectors follow the cyclic order
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [unit-vectors, cross-product]
    stem: What is ĵ × î equal to?
    options:
      - k̂
      - −k̂
      - "0"
      - î
    answer: 1
    explanation: "In cyclic order î × ĵ = k̂. Reversing the order reverses the sign, so ĵ × î = −k̂. Zero would apply only to parallel vectors such as î × î."

  - id: phy-rot-005
    topic: rotational-kinematics
    subtopic: Uniform angular acceleration
    concept: ω = ω_0 + αt for constant angular acceleration
    category: numerical
    format: direct
    difficulty: 1
    time: 30
    ncert: true
    battle: true
    formula: ω = ω_0 + αt
    tags: [angular-kinematics]
    stem: A wheel starts from rest with a constant angular acceleration of 4 rad s^{-2}. What is its angular velocity after 5 s?
    options:
      - 10 rad s^{-1}
      - 9 rad s^{-1}
      - 40 rad s^{-1}
      - 20 rad s^{-1}
    answer: 3
    explanation: "ω = ω_0 + αt = 0 + 4 × 5 = 20 rad s^{-1}. Multiplying α by t twice (40) or halving (10) mixes up the velocity and angle formulas."

  - id: phy-rot-006
    topic: torque-angular-momentum
    subtopic: Torque as a cross product
    concept: Torque τ = r × F
    category: numerical
    format: direct
    difficulty: 3
    time: 60
    ncert: true
    battle: true
    formula: τ = r × F
    tags: [torque, cross-product]
    stem: A force F = 2î N acts at the point r = 3ĵ m. What is the torque about the origin?
    options:
      - 6k̂ N m
      - −6k̂ N m
      - 6î N m
      - 5k̂ N m
    answer: 1
    explanation: "τ = r × F = 3ĵ × 2î = 6(ĵ × î) = −6k̂ N m. Taking F × r instead gives the wrong sign, which is the usual trap."

  - id: phy-rot-007
    topic: rigid-body-equilibrium
    subtopic: Conditions of equilibrium
    concept: Mechanical equilibrium needs zero net force and zero net torque
    category: concept
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    tags: [equilibrium, ncert-line]
    stem: A rigid body is in mechanical equilibrium when
    options:
      - the net external force and the net external torque are both zero
      - only the net external force is zero
      - only the net external torque is zero
      - the body is at rest
    answer: 0
    explanation: "Translational equilibrium needs ΣF = 0 and rotational equilibrium needs Στ = 0; a rigid body in mechanical equilibrium satisfies both. A body moving with constant velocity can also be in equilibrium, so being at rest is not required."

  - id: phy-rot-008
    topic: moment-of-inertia
    subtopic: Ring about its axis
    concept: I = MR^2 for a thin ring about its central axis
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    formula: I = MR^2
    tags: [ring, standard-moi]
    stem: What is the moment of inertia of a thin uniform ring of mass M and radius R about the axis through its centre perpendicular to its plane?
    options:
      - MR^2/2
      - 2MR^2/5
      - MR^2
      - 2MR^2
    answer: 2
    explanation: "Every mass element of the ring lies at the same distance R from the axis, so I = Σm R^2 = MR^2. MR^2/2 is the value for a disc or for the ring about a diameter."

  - id: phy-rot-009
    topic: axes-theorems
    subtopic: Parallel axis theorem
    concept: Rod about its end using the parallel axis theorem
    category: numerical
    format: direct
    difficulty: 3
    time: 40
    ncert: true
    battle: true
    formula: I = I_{cm} + Md^2
    tags: [parallel-axis, rod]
    stem: The moment of inertia of a uniform rod of mass M and length L about its centre is ML^2/12. What is it about a parallel axis through one end?
    options:
      - ML^2/6
      - ML^2/4
      - 7ML^2/12
      - ML^2/3
    answer: 3
    explanation: "I = I_{cm} + M(L/2)^2 = ML^2/12 + ML^2/4 = ML^2/3. Forgetting to square L/2 or adding ML^2/12 twice gives the other options."

  - id: phy-rot-010
    topic: rotational-dynamics
    subtopic: τ = Iα
    concept: Angular acceleration equals torque divided by moment of inertia
    category: numerical
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    formula: τ = Iα
    tags: [newtons-second-law-rotation]
    stem: A torque of 12 N m acts on a wheel of moment of inertia 3 kg m^2. What is its angular acceleration?
    options:
      - 4 rad s^{-2}
      - 36 rad s^{-2}
      - 0.25 rad s^{-2}
      - 9 rad s^{-2}
    answer: 0
    explanation: "α = τ/I = 12/3 = 4 rad s^{-2}. Multiplying instead of dividing gives 36, the common slip."

  - id: phy-rot-011
    topic: angular-momentum-conservation
    subtopic: Ice skater
    concept: Pulling arms in reduces I and raises ω
    category: concept
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    tags: [skater, conservation]
    stem: A spinning ice skater pulls her arms close to her body. What happens to her angular velocity?
    options:
      - It decreases
      - It stays the same
      - It increases
      - It becomes zero
    answer: 2
    explanation: "With no external torque, L = Iω is conserved. Pulling the arms in reduces I, so ω increases."

  - id: phy-rot-012
    topic: rolling-motion
    subtopic: Rolling without slipping
    concept: Contact point of a rolling body is instantaneously at rest
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [rolling, contact-point, ncert-line]
    stem: A wheel rolls without slipping on level ground with centre speed v. What is the speed of the point in contact with the ground?
    options:
      - v
      - 2v
      - v/2
      - Zero
    answer: 3
    explanation: "For pure rolling v = ωR. The contact point has translational velocity v forward and rotational velocity ωR backward, which cancel, so it is instantaneously at rest."

  - id: phy-rot-013
    topic: rolling-motion
    subtopic: Top point velocity
    concept: Topmost point of a rolling wheel moves at 2v
    category: concept
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    tags: [rolling, top-point]
    stem: For a wheel rolling without slipping with centre speed v, the speed of its topmost point is
    options:
      - 2v
      - v
      - √2 v
      - Zero
    answer: 0
    explanation: "At the top, the rotational velocity ωR = v adds to the translational velocity v in the same direction, giving 2v. √2 v is the speed of a point level with the centre."

  - id: phy-rot-014
    topic: centre-of-mass
    subtopic: Semicircular ring
    concept: Centre of mass of a semicircular ring is at 2R/π from centre
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: false
    battle: true
    tags: [continuous-body, semicircular-ring]
    stem: How far from the centre of curvature is the centre of mass of a thin uniform semicircular ring of radius R?
    options:
      - 4R/3π
      - R/2
      - 2R/π
      - 3R/8
    answer: 2
    explanation: "Integrating over the arc gives y_{cm} = 2R/π on the symmetry axis. 4R/3π is for a semicircular disc and 3R/8 is for a solid hemisphere, both common confusions."

  - id: phy-rot-015
    topic: centre-of-mass
    subtopic: Three particles in a plane
    concept: Centre of mass coordinates of three particles
    category: numerical
    format: direct
    difficulty: 3
    time: 60
    ncert: true
    battle: false
    formula: x_{cm} = Σm_ix_i/Σm_i
    tags: [three-particle, com-position]
    stem: "Particles of masses 1 kg, 2 kg and 3 kg are placed at (0, 0), (2 m, 0) and (0, 2 m). What are the coordinates of their centre of mass?"
    options:
      - (1 m, 1 m)
      - (2/3 m, 1 m)
      - (1 m, 2/3 m)
      - (2/3 m, 2/3 m)
    answer: 1
    explanation: "x_{cm} = (1×0 + 2×2 + 3×0)/6 = 4/6 = 2/3 m; y_{cm} = (1×0 + 2×0 + 3×2)/6 = 1 m. Swapping which mass sits on which axis gives (1, 2/3)."

  - id: phy-rot-016
    topic: centre-of-mass
    subtopic: Removed portion
    concept: Centre of mass of a disc with a circular hole
    category: numerical
    format: direct
    difficulty: 4
    time: 120
    ncert: false
    battle: false
    formula: x_{cm} = (M_1x_1 − M_2x_2)/(M_1 − M_2)
    tags: [cavity, negative-mass, multi-concept]
    stem: A circular disc of radius R has a circular hole of radius R/2 cut from it, the hole touching the rim and passing through the centre. How far from the original centre is the centre of mass of the remaining part?
    options:
      - R/2
      - R/4
      - R/3
      - R/6
    answer: 3
    explanation: "Mass is proportional to area: whole disc 4m at x = 0, hole m at x = R/2. x_{cm} = (4m × 0 − m × R/2)/(4m − m) = −R/6, i.e. R/6 on the side opposite the hole. R/4 comes from dividing by 4m instead of 3m."

  - id: phy-rot-017
    topic: motion-of-centre-of-mass
    subtopic: Velocity of centre of mass
    concept: v_{cm} is the mass-weighted mean of velocities
    category: numerical
    format: direct
    difficulty: 3
    time: 40
    ncert: true
    battle: true
    formula: v_{cm} = (m_1v_1 + m_2v_2)/(m_1 + m_2)
    tags: [velocity-cm]
    stem: A 2 kg body moves at 6 m s^{-1} east and a 4 kg body moves at 3 m s^{-1} west. What is the velocity of their centre of mass?
    options:
      - 4 m s^{-1} east
      - 1 m s^{-1} east
      - 1 m s^{-1} west
      - Zero
    answer: 3
    explanation: "Taking east positive, v_{cm} = (2 × 6 + 4 × (−3))/6 = (12 − 12)/6 = 0. The total momentum of the system is zero."

  - id: phy-rot-018
    topic: motion-of-centre-of-mass
    subtopic: Newton's second law for a system
    concept: M a_{cm} equals net external force
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    formula: M a_{cm} = F_{ext}
    tags: [newton-second-law-system, ncert-line]
    stem: The acceleration of the centre of mass of a system of particles depends on
    options:
      - only the internal forces
      - only the external forces
      - both internal and external forces
      - neither internal nor external forces
    answer: 1
    explanation: "Internal forces occur in action–reaction pairs and cancel in the sum, leaving M a_{cm} = F_{ext}. So only external forces determine the motion of the centre of mass."

  - id: phy-rot-019
    topic: motion-of-centre-of-mass
    subtopic: Man on a boat
    concept: Centre of mass stays fixed when no external horizontal force acts
    category: numerical
    format: case
    difficulty: 3
    time: 75
    ncert: false
    battle: false
    tags: [man-on-boat, com-fixed, multi-concept]
    stem: A 60 kg man stands at one end of a 140 kg boat of length 5 m floating at rest on still water. He walks to the other end. Neglecting water friction, how far does the boat move?
    options:
      - 1.5 m
      - 2.1 m
      - 3.5 m
      - 1.2 m
    answer: 0
    explanation: "With no external horizontal force the centre of mass stays fixed: m(L − x) = Mx, so x = mL/(m + M) = 60 × 5/200 = 1.5 m, opposite to the man. 2.1 m comes from using mL/M."

  - id: phy-rot-020
    topic: vector-product
    subtopic: Magnitude
    concept: Magnitude of cross product is AB sin θ
    category: numerical
    format: direct
    difficulty: 1
    time: 30
    ncert: true
    battle: true
    formula: "|A × B| = AB sin θ"
    tags: [cross-product-magnitude]
    stem: Two vectors of magnitudes 4 and 5 units make an angle of 30° with each other. What is the magnitude of their vector product?
    options:
      - 20 units
      - 10√3 units
      - 5 units
      - 10 units
    answer: 3
    explanation: "|A × B| = AB sin θ = 4 × 5 × sin 30° = 10 units. 10√3 is the dot product AB cos θ, the usual mix-up."

  - id: phy-rot-021
    topic: vector-product
    subtopic: Properties
    concept: Vector product is anticommutative
    category: concept
    format: statements
    difficulty: 3
    time: 40
    ncert: true
    battle: false
    tags: [cross-product-properties, ncert-line]
    stem: Which statement about the vector product of two vectors A and B is correct?
    options:
      - A × B = B × A
      - A × B is perpendicular to the plane containing A and B
      - A × A has magnitude A^2
      - A × B changes sign when both vectors are reflected in a mirror
    answer: 1
    explanation: "A × B is normal to the plane of A and B. It is anticommutative (A × B = −B × A), A × A = 0, and under reflection A × B does not change sign because it is an axial vector."

  - id: phy-rot-022
    topic: vector-product
    subtopic: Determinant evaluation
    concept: Cross product from components
    category: numerical
    format: direct
    difficulty: 3
    time: 75
    ncert: true
    battle: false
    tags: [determinant, cross-product]
    stem: If A = î + 2ĵ and B = 3î + ĵ, what is A × B?
    options:
      - 5k̂
      - −7k̂
      - −5k̂
      - 7k̂
    answer: 2
    explanation: "A × B = (A_xB_y − A_yB_x)k̂ = (1 × 1 − 2 × 3)k̂ = −5k̂. Adding the cross terms instead of subtracting gives 7k̂."

  - id: phy-rot-023
    topic: rotational-kinematics
    subtopic: Angular displacement
    concept: θ = ω_0t + ½αt^2
    category: numerical
    format: direct
    difficulty: 2
    time: 40
    ncert: true
    battle: true
    formula: θ = ω_0t + ½αt^2
    tags: [angular-kinematics]
    stem: A disc starts from rest with angular acceleration 2 rad s^{-2}. Through what angle does it turn in the first 4 s?
    options:
      - 8 rad
      - 16 rad
      - 32 rad
      - 4 rad
    answer: 1
    explanation: "θ = ½αt^2 = ½ × 2 × 16 = 16 rad. Forgetting the ½ gives 32 rad."

  - id: phy-rot-024
    topic: rotational-kinematics
    subtopic: Linear and angular velocity
    concept: v = ωr for a point on a rotating body
    category: numerical
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    formula: v = ωr
    tags: [linear-angular-relation]
    stem: A point is 0.5 m from the axis of a wheel rotating at 10 rad s^{-1}. What is its linear speed?
    options:
      - 20 m s^{-1}
      - 0.05 m s^{-1}
      - 5 m s^{-1}
      - 50 m s^{-1}
    answer: 2
    explanation: "v = ωr = 10 × 0.5 = 5 m s^{-1}. Dividing ω by r gives 20, a common slip."

  - id: phy-rot-025
    topic: rotational-kinematics
    subtopic: Rigid body rotation
    concept: All points of a rigid body share the same angular velocity
    category: concept
    format: statement-pair
    difficulty: 3
    time: 45
    ncert: true
    battle: false
    tags: [rigid-body, angular-velocity]
    stem: |-
      Statement I: In a rigid body rotating about a fixed axis, every particle has the same angular velocity.
      Statement II: In a rigid body rotating about a fixed axis, every particle has the same linear speed.
    options:
      - Both Statement I and Statement II are correct
      - Both Statement I and Statement II are incorrect
      - Statement I is correct but Statement II is incorrect
      - Statement I is incorrect but Statement II is correct
    answer: 2
    explanation: "All particles sweep the same angle in the same time, so ω is common. Linear speed v = ωr grows with distance from the axis, so Statement II is false; particles on the axis are at rest."

  - id: phy-rot-026
    topic: torque-angular-momentum
    subtopic: Magnitude of torque
    concept: τ = rF sin θ
    category: numerical
    format: direct
    difficulty: 1
    time: 30
    ncert: true
    battle: true
    formula: τ = rF sin θ
    tags: [torque-magnitude]
    stem: A 20 N force acts on a spanner 0.25 m from the bolt, at 30° to the spanner. What torque does it produce?
    options:
      - 5 N m
      - 4.33 N m
      - 10 N m
      - 2.5 N m
    answer: 3
    explanation: "τ = rF sin θ = 0.25 × 20 × sin 30° = 2.5 N m. Using cos 30° gives 4.33 N m and ignoring the angle gives 5 N m."

  - id: phy-rot-027
    topic: torque-angular-momentum
    subtopic: Angular momentum of a particle
    concept: L = mvr_⊥ for a particle moving in a straight line
    category: numerical
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    formula: L = m v d
    tags: [angular-momentum-particle, trap]
    stem: A 2 kg particle moves at 3 m s^{-1} along the line y = 4 m, parallel to the x-axis. What is the magnitude of its angular momentum about the origin?
    options:
      - 24 kg m^2 s^{-1}
      - 6 kg m^2 s^{-1}
      - Zero
      - 12 kg m^2 s^{-1}
    answer: 0
    explanation: "L = m v d, where d is the perpendicular distance of the line of motion from the origin: 2 × 3 × 4 = 24 kg m^2 s^{-1}. A particle in straight-line motion has non-zero angular momentum about any point off its line."

  - id: phy-rot-028
    topic: torque-angular-momentum
    subtopic: Torque and angular momentum
    concept: Torque equals rate of change of angular momentum
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    formula: τ = dL/dt
    tags: [torque-angular-momentum-relation, ncert-line]
    stem: The rotational analogue of Newton's second law F = dp/dt is
    options:
      - τ = dω/dt
      - L = Iα
      - τ = dL/dt
      - τ = dI/dt
    answer: 2
    explanation: "Differentiating L = r × p gives dL/dt = r × F = τ, so torque is the rate of change of angular momentum. dω/dt is angular acceleration, not torque."

  - id: phy-rot-029
    topic: rigid-body-equilibrium
    subtopic: Principle of moments
    concept: Balancing a lever using moments
    category: numerical
    format: direct
    difficulty: 3
    time: 40
    ncert: true
    battle: true
    formula: F_1d_1 = F_2d_2
    tags: [principle-of-moments, lever]
    stem: A light rod is pivoted at its middle. A 30 N weight hangs 20 cm to the left of the pivot. Where must a 20 N weight hang to balance it?
    options:
      - 20 cm to the right
      - 30 cm to the right
      - 13.3 cm to the right
      - 30 cm to the left
    answer: 1
    explanation: "Taking moments about the pivot, 30 × 20 = 20 × d, so d = 30 cm on the right side. It must be on the opposite side to give an opposing moment."

  - id: phy-rot-030
    topic: rigid-body-equilibrium
    subtopic: Couple
    concept: A couple produces rotation without translation
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [couple, ncert-line]
    stem: A pair of equal and opposite forces with different lines of action acting on a free rigid body produces
    options:
      - pure translation
      - neither translation nor rotation
      - both translation and rotation
      - pure rotation
    answer: 3
    explanation: "Such a pair is a couple: the net force is zero, so there is no translation of the centre of mass, but the net torque is non-zero, so the body rotates."

  - id: phy-rot-031
    topic: moment-of-inertia
    subtopic: Solid sphere
    concept: I = 2MR^2/5 for a solid sphere about a diameter
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    formula: I = (2/5)MR^2
    tags: [solid-sphere, standard-moi]
    stem: The moment of inertia of a uniform solid sphere of mass M and radius R about a diameter is
    options:
      - 2MR^2/3
      - 2MR^2/5
      - MR^2/2
      - 7MR^2/5
    answer: 1
    explanation: "For a solid sphere about a diameter I = (2/5)MR^2. 2MR^2/3 is for a thin hollow sphere and 7MR^2/5 is about a tangent."

  - id: phy-rot-032
    topic: moment-of-inertia
    subtopic: Point masses
    concept: I = Σmr^2 for discrete particles
    category: numerical
    format: direct
    difficulty: 2
    time: 40
    ncert: true
    battle: true
    formula: I = Σm_ir_i^2
    tags: [point-masses]
    stem: Two 2 kg point masses are fixed at the ends of a light rod 1 m long. What is the moment of inertia about an axis through the centre perpendicular to the rod?
    options:
      - 0.5 kg m^2
      - 2 kg m^2
      - 1 kg m^2
      - 4 kg m^2
    answer: 2
    explanation: "Each mass is 0.5 m from the axis: I = 2 × 2 × 0.5^2 = 1 kg m^2. Using the full length 1 m as the distance gives 4 kg m^2."

  - id: phy-rot-033
    topic: moment-of-inertia
    subtopic: Factors affecting I
    concept: Moment of inertia depends on the axis and mass distribution
    category: concept
    format: statements
    difficulty: 2
    time: 40
    ncert: true
    battle: false
    tags: [moi-factors, trap]
    stem: Which statement about the moment of inertia of a rigid body is correct?
    options:
      - It depends only on the total mass of the body
      - It depends on the angular velocity of the body
      - It depends on the position and orientation of the axis of rotation
