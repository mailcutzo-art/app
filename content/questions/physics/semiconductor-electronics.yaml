questions:
  - id: phy-semi-001
    topic: classification-energy-bands
    subtopic: Band gap values
    concept: Band gap of silicon is about 1.1 eV
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [band-gap, ncert-line]
    stem: The energy band gap of silicon at room temperature is about
    options:
      - 0.71 eV
      - 1.1 eV
      - 5.4 eV
      - 3.0 eV
    answer: 1
    explanation: "Silicon has E_g ≈ 1.1 eV. The value 0.71 eV belongs to germanium and 5.4 eV to diamond, which is why diamond is an insulator."

  - id: phy-semi-002
    topic: classification-energy-bands
    subtopic: Band gap and conduction
    concept: Diamond is an insulator because of its large band gap
    category: concept
    format: direct
    difficulty: 2
    time: 35
    ncert: true
    battle: true
    tags: [band-gap, insulator]
    stem: Carbon (diamond), silicon and germanium have the same lattice structure. Diamond is an insulator because
    options:
      - its valence electrons are in the n = 1 shell
      - it has no valence electrons
      - its conduction band overlaps the valence band
      - its band gap (about 5.4 eV) is too large for thermal excitation
    answer: 3
    explanation: "All three have four valence electrons in the same diamond lattice, but the band gap of carbon is about 5.4 eV, far larger than kT at room temperature, so almost no electrons reach the conduction band. For Si (1.1 eV) and Ge (0.71 eV) the gap is small enough for some thermal excitation."

  - id: phy-semi-003
    topic: classification-energy-bands
    subtopic: Classification by resistivity
    concept: Semiconductors have resistivity between about 10^{-5} and 10^6 Ω m
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [resistivity, ncert-line]
    stem: A material has a resistivity of about 10^2 Ω m at room temperature. It is most likely
    options:
      - a semiconductor
      - a metal
      - an insulator
      - a superconductor
    answer: 0
    explanation: "NCERT gives resistivity ranges of roughly 10^{-2} to 10^{-8} Ω m for metals, 10^{-5} to 10^6 Ω m for semiconductors and 10^{11} to 10^{19} Ω m for insulators. 10^2 Ω m falls in the semiconductor range."

  - id: phy-semi-004
    topic: classification-energy-bands
    subtopic: Band picture of metals
    concept: In metals the conduction band is partly filled or overlaps the valence band
    category: concept
    format: statements
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [energy-bands, metals]
    stem: Which statement about the energy bands of a metal is correct?
    options:
      - The valence band is completely filled and separated from an empty conduction band by 3 eV
      - The conduction band is partially filled or overlaps the valence band, so electrons move freely
      - The band gap is about 1 eV, so conduction needs thermal energy
      - The conduction band is completely filled at 0 K
    answer: 1
    explanation: "In metals either the conduction band is partly filled or the valence and conduction bands overlap (E_g = 0), so many electrons are free to move even at low temperature. A filled valence band separated by a gap describes a semiconductor or insulator."

  - id: phy-semi-005
    topic: classification-energy-bands
    subtopic: Photon energy and band gap
    concept: Maximum wavelength that can create an electron-hole pair, λ = hc/E_g
    category: numerical
    format: direct
    difficulty: 3
    time: 50
    ncert: false
    battle: false
    formula: λ_max = hc/E_g ≈ 1240/E_g(eV) nm
    tags: [band-gap, photon]
    stem: What is the longest wavelength of light that can create an electron-hole pair in silicon (E_g = 1.1 eV)? Take hc = 1240 eV nm.
    options:
      - 564 nm
      - 890 nm
      - 1127 nm
      - 2254 nm
    answer: 2
    explanation: "λ_max = 1240/1.1 ≈ 1127 nm (about 1.13 μm). Longer wavelengths carry less than 1.1 eV per photon and cannot lift an electron across the gap. 564 nm comes from wrongly using 2E_g."

  - id: phy-semi-006
    topic: classification-energy-bands
    subtopic: Semiconductor at 0 K
    concept: A pure semiconductor behaves as an insulator at 0 K
    category: concept
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [temperature, ncert-line]
    stem: At absolute zero (0 K), a pure silicon crystal behaves as
    options:
      - a good conductor
      - a superconductor
      - an n-type semiconductor
      - an insulator
    answer: 3
    explanation: "At 0 K the valence band is completely filled and the conduction band is empty, with no thermal energy to excite electrons across the gap. So there are no free charge carriers and the crystal is an insulator."

  - id: phy-semi-007
    topic: classification-energy-bands
    subtopic: Temperature dependence of resistivity
    concept: Semiconductor resistivity falls with temperature as carrier density rises
    category: concept
    format: assertion-reason
    difficulty: 2
    time: 40
    ncert: true
    battle: false
    tags: [temperature, resistivity]
    stem: |-
      Assertion (A): The resistivity of a semiconductor decreases as its temperature increases.
      Reason (R): The number of charge carriers in a semiconductor increases with temperature.
    options:
      - Both A and R are true and R is the correct explanation of A
      - Both A and R are true but R is not the correct explanation of A
      - A is true but R is false
      - A is false but R is true
    answer: 0
    explanation: "Heating excites more electrons across the band gap, sharply increasing the carrier densities; this outweighs the slight fall in mobility, so resistivity decreases (negative temperature coefficient). R directly explains A."

  - id: phy-semi-008
    topic: classification-energy-bands
    subtopic: Band gap values
    concept: Matching materials with their band gaps
    category: factual
    format: match
    difficulty: 3
    time: 60
    ncert: true
    battle: false
    tags: [band-gap, ncert-line]
    stem: |-
      Match the material in List I with its approximate band gap in List II.
      List I: P. Diamond  Q. Silicon  R. Germanium  S. Copper
      List II: 1. 0.71 eV  2. zero (bands overlap)  3. 5.4 eV  4. 1.1 eV
    options:
      - P-4, Q-3, R-1, S-2
      - P-3, Q-1, R-4, S-2
      - P-3, Q-4, R-1, S-2
      - P-2, Q-4, R-1, S-3
    answer: 2
    explanation: "Diamond ≈ 5.4 eV, silicon ≈ 1.1 eV, germanium ≈ 0.71 eV, and copper, a metal, has overlapping bands (zero gap). So P-3, Q-4, R-1, S-2."

  - id: phy-semi-009
    topic: intrinsic-semiconductors
    subtopic: Carrier densities
    concept: In an intrinsic semiconductor n_e = n_h = n_i
    category: concept
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    formula: n_e = n_h = n_i
    tags: [intrinsic, carrier-density]
    stem: In a pure (intrinsic) semiconductor, the number of free electrons n_e and holes n_h satisfy
    options:
      - n_e > n_h
      - n_e = n_h
      - n_e < n_h
      - n_e n_h = 0
    answer: 1
    explanation: "Each electron excited into the conduction band leaves exactly one hole in the valence band, so in an intrinsic semiconductor n_e = n_h = n_i."

  - id: phy-semi-010
    topic: intrinsic-semiconductors
    subtopic: Nature of a hole
    concept: A hole is a vacancy with an effective positive charge +e
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [hole, ncert-line]
    stem: A hole in a semiconductor is best described as
    options:
      - a positron trapped in the crystal lattice
      - a missing atom in the crystal lattice
      - a vacancy in a covalent bond that behaves like a charge +e
      - an extra electron from a donor atom
    answer: 2
    explanation: "When an electron leaves a covalent bond, it leaves a vacancy with an effective charge +e. This hole is not a particle like a positron and not a missing atom; its apparent motion is really bound electrons filling vacancies one after another."

  - id: phy-semi-011
    topic: intrinsic-semiconductors
    subtopic: Hole motion
    concept: Hole current is due to bound valence electrons moving between vacancies
    category: concept
    format: statement-pair
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [hole, current, trap]
    stem: |-
      Statement I: In an applied electric field, holes move in the direction of the field.
      Statement II: Hole current is actually due to free electrons moving in the conduction band.
    options:
      - Both Statement I and Statement II are correct
      - Both Statement I and Statement II are incorrect
      - Statement I is correct but Statement II is incorrect
      - Statement I is incorrect but Statement II is correct
    answer: 2
    explanation: "Holes behave as positive charges and drift along the field. But the hole current arises from bound electrons in the valence band jumping from one vacancy to the next, not from free conduction electrons. So I is correct and II is incorrect."

  - id: phy-semi-012
    topic: intrinsic-semiconductors
    subtopic: Conductivity
    concept: Intrinsic conductivity σ = e n_i (μ_e + μ_h)
    category: numerical
    format: direct
    difficulty: 3
    time: 75
    ncert: false
    battle: false
    formula: σ = e n_i (μ_e + μ_h)
    tags: [conductivity, mobility]
    stem: An intrinsic semiconductor has n_i = 1.5 × 10^{16} m^{-3}, electron mobility 0.135 m^2 V^{-1} s^{-1} and hole mobility 0.048 m^2 V^{-1} s^{-1}. Its conductivity is about
    options:
      - 2.2 × 10^{-4} S m^{-1}
      - 4.4 × 10^{-3} S m^{-1}
      - 4.4 × 10^{-4} S m^{-1}
      - 8.8 × 10^{-4} S m^{-1}
    answer: 2
    explanation: "σ = e n_i (μ_e + μ_h) = 1.6 × 10^{-19} × 1.5 × 10^{16} × 0.183 = 2.4 × 10^{-3} × 0.183 ≈ 4.4 × 10^{-4} S m^{-1}. Using only one mobility or dropping a power of ten gives the other options."

  - id: phy-semi-013
    topic: intrinsic-semiconductors
    subtopic: Mobility
    concept: Electron mobility exceeds hole mobility
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: false
    battle: true
    tags: [mobility, trap]
    stem: In a pure semiconductor n_e = n_h, yet the electron current exceeds the hole current. This is because
    options:
      - electrons have a larger charge than holes
      - electron mobility is greater than hole mobility
      - holes move opposite to the electric field
      - holes are heavier than protons
    answer: 1
    explanation: "Current density is j = e n μ E. With equal carrier densities, the larger mobility of free electrons (they move in the conduction band) makes the electron current larger. The charges are equal in magnitude."

  - id: phy-semi-014
    topic: extrinsic-semiconductors
    subtopic: n-type doping
    concept: Doping Si with a pentavalent impurity gives an n-type semiconductor
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [doping, n-type]
    stem: Silicon doped with phosphorus becomes
    options:
      - a p-type semiconductor
      - an intrinsic semiconductor
      - an insulator
      - an n-type semiconductor
    answer: 3
    explanation: "Phosphorus is pentavalent (group 15). Four of its electrons bond with Si and the fifth is loosely bound and easily freed, so electrons become majority carriers: n-type."

  - id: phy-semi-015
    topic: extrinsic-semiconductors
    subtopic: p-type doping
    concept: Trivalent dopants such as boron give p-type semiconductors
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [doping, p-type]
    stem: Which impurity added to germanium produces a p-type semiconductor?
    options:
      - Boron
      - Arsenic
      - Antimony
      - Phosphorus
    answer: 0
    explanation: "Boron is trivalent (group 13); it completes only three bonds and leaves a hole, making holes the majority carriers. Arsenic, antimony and phosphorus are pentavalent donors that give n-type material."

  - id: phy-semi-016
    topic: extrinsic-semiconductors
    subtopic: Charge neutrality
    concept: Extrinsic semiconductors are electrically neutral
    category: concept
    format: assertion-reason
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [n-type, neutrality, trap]
    stem: |-
      Assertion (A): An n-type semiconductor is electrically neutral.
      Reason (R): In an n-type semiconductor the number of free electrons is much larger than the number of holes.
    options:
      - Both A and R are true and R is the correct explanation of A
      - Both A and R are true but R is not the correct explanation of A
      - A is true but R is false
      - A is false but R is true
    answer: 1
    explanation: "The crystal is neutral because every extra free electron is balanced by a fixed positive donor ion (plus holes). R is a true fact about carrier numbers but does not explain neutrality; in fact the excess electrons alone would suggest a negative charge, which is the common trap."

  - id: phy-semi-017
    topic: extrinsic-semiconductors
    subtopic: Mass action law
    concept: n_e n_h = n_i^2 gives the minority carrier density
    category: numerical
    format: direct
    difficulty: 3
    time: 60
    ncert: true
    battle: false
    formula: n_e n_h = n_i^2
    tags: [mass-action-law, n-type]
    stem: Silicon with n_i = 1.5 × 10^{16} m^{-3} is doped so that n_e ≈ 10^{21} m^{-3}. The hole concentration is
    options:
      - 1.5 × 10^{5} m^{-3}
      - 2.25 × 10^{11} m^{-3}
      - 1.5 × 10^{16} m^{-3}
      - 2.25 × 10^{32} m^{-3}
    answer: 1
    explanation: "n_h = n_i^2/n_e = (1.5 × 10^{16})^2/10^{21} = 2.25 × 10^{32}/10^{21} = 2.25 × 10^{11} m^{-3}. 2.25 × 10^{32} is n_i^2 itself, not divided by n_e."

  - id: phy-semi-018
    topic: extrinsic-semiconductors
    subtopic: Donor energy level
    concept: The donor level lies just below the bottom of the conduction band
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [energy-bands, donor]
    stem: In the energy band diagram of an n-type semiconductor, the donor energy level lies
    options:
      - just above the top of the valence band
      - in the middle of the band gap
      - just below the bottom of the conduction band
      - inside the conduction band
    answer: 2
    explanation: "The fifth electron of a donor is loosely bound, needing only about 0.01–0.05 eV to be freed. So the donor level E_D sits slightly below the conduction band. A level just above the valence band is the acceptor level of p-type material."

  - id: phy-semi-019
    topic: extrinsic-semiconductors
    subtopic: Mass action law
    concept: Carrier densities in arsenic-doped silicon
    category: numerical
    format: direct
    difficulty: 3
    time: 70
    ncert: true
    battle: false
    formula: n_e n_h = n_i^2
    tags: [mass-action-law, ncert-example]
    stem: A pure Si crystal has 5 × 10^{28} atoms m^{-3}. It is doped with 1 ppm of arsenic. If n_i = 1.5 × 10^{16} m^{-3}, the number of holes per m^3 is
    options:
      - 4.5 × 10^{9}
      - 5 × 10^{22}
      - 1.5 × 10^{16}
      - 3.3 × 10^{-7}
    answer: 0
    explanation: "1 ppm doping gives N_D = 5 × 10^{28} × 10^{-6} = 5 × 10^{22} m^{-3}, and n_e ≈ N_D. Then n_h = n_i^2/n_e = 2.25 × 10^{32}/(5 × 10^{22}) = 4.5 × 10^9 m^{-3}. 5 × 10^{22} is the electron density, not the hole density."

  - id: phy-semi-020
    topic: extrinsic-semiconductors
    subtopic: p-type properties
    concept: Majority and minority carriers in p-type material
    category: concept
    format: statements
    difficulty: 2
    time: 40
    ncert: true
    battle: false
    tags: [p-type, carriers]
    stem: Silicon is doped with indium. Which statement about the resulting material is correct?
    options:
      - Electrons are the majority carriers and the crystal is negatively charged
      - Holes are the majority carriers and the crystal is positively charged
      - Electrons are the majority carriers and the crystal is neutral
      - Holes are the majority carriers and the crystal is neutral
    answer: 3
    explanation: "Indium is trivalent, so it creates holes (acceptor), giving p-type material with holes as majority carriers. Each hole is balanced by a fixed negative acceptor ion, so the crystal stays neutral."

  - id: phy-semi-021
    topic: pn-junction-formation
    subtopic: Depletion region
    concept: The depletion region contains immobile ions and no free carriers
    category: concept
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    tags: [depletion-layer]
    stem: The depletion region of an unbiased p-n junction contains
    options:
      - immobile ions only, with almost no free charge carriers
      - only free electrons
      - only free holes
      - equal numbers of free electrons and holes
    answer: 0
    explanation: "Carriers near the junction diffuse across and recombine, leaving uncovered fixed ions: negative acceptor ions on the p-side and positive donor ions on the n-side. The region is depleted of free carriers."

  - id: phy-semi-022
    topic: pn-junction-formation
    subtopic: Diffusion and drift
    concept: Diffusion current is from p to n; drift current is from n to p
    category: concept
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [diffusion, drift, trap]
    stem: In an unbiased p-n junction, the directions of conventional diffusion current and drift current are respectively
    options:
      - n to p and p to n
      - p to n and n to p
      - both p to n
      - both n to p
    answer: 1
    explanation: "Holes diffuse from p to n and electrons from n to p; both give conventional current from p to n. The junction field points from n to p, so the minority-carrier drift current flows from n to p, opposing diffusion."

  - id: phy-semi-023
    topic: pn-junction-formation
    subtopic: Equilibrium
    concept: At equilibrium diffusion current equals drift current, net current zero
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [equilibrium, ncert-line]
    stem: In an unbiased p-n junction at equilibrium, the net current across the junction is zero because
    options:
      - no carriers cross the junction at all
      - the depletion layer is a perfect insulator
      - diffusion current and drift current are equal and opposite
      - only holes cross and they recombine at once
    answer: 2
    explanation: "Carriers do keep crossing: majority carriers diffuse while minority carriers drift in the junction field. At equilibrium the two currents are equal in magnitude and opposite, giving zero net current."

  - id: phy-semi-024
    topic: pn-junction-formation
    subtopic: Barrier potential
    concept: Barrier potential of a Si junction is about 0.7 V
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [barrier-potential, ncert-line]
    stem: The barrier potential of an unbiased silicon p-n junction is about
    options:
      - 0.07 V
      - 7 V
      - 0.2 V
      - 0.7 V
    answer: 3
    explanation: "For Si the barrier potential is about 0.6–0.7 V; for Ge it is about 0.2–0.3 V. 0.2 V is the germanium value."

  - id: phy-semi-025
    topic: pn-junction-formation
    subtopic: Junction field
    concept: The junction field points from the n-side to the p-side
    category: concept
    format: direct
    difficulty: 2
    time: 25
    ncert: true
    battle: true
    tags: [electric-field, depletion-layer]
    stem: In the depletion region of an unbiased p-n junction, the electric field is directed
    options:
      - from the p-side to the n-side
      - from the n-side to the p-side
      - parallel to the junction plane
      - nowhere, since the field is zero
    answer: 1
    explanation: "The n-side of the depletion region has positive donor ions and the p-side has negative acceptor ions, so the field points from n to p. This field opposes diffusion of majority carriers."

  - id: phy-semi-026
    topic: pn-junction-formation
    subtopic: Junction field
    concept: Average field in depletion layer E = V_0/d
    category: numerical
    format: direct
    difficulty: 2
    time: 30
    ncert: false
    battle: true
    formula: E = V_0/d
    tags: [electric-field, depletion-layer]
    stem: A p-n junction has a barrier potential of 0.5 V across a depletion layer 1 μm wide. The average electric field in the layer is
    options:
      - 5 × 10^3 V m^{-1}
      - 5 × 10^{-7} V m^{-1}
      - 5 × 10^5 V m^{-1}
      - 5 × 10^7 V m^{-1}
    answer: 2
    explanation: "E = V_0/d = 0.5/(1 × 10^{-6}) = 5 × 10^5 V m^{-1}. Even a small barrier gives a strong field because the layer is so thin."

  - id: phy-semi-027
    topic: pn-junction-formation
    subtopic: Space charge
    concept: The n-side of the depletion layer carries positive donor ions
    category: concept
    format: statements
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [depletion-layer, space-charge]
    stem: Which statement about the space charge in the depletion layer of a p-n junction is correct?
    options:
      - The n-side has a layer of negative ions and the p-side a layer of positive ions
      - Both sides contain positive ions only
      - The n-side has a layer of positive donor ions and the p-side a layer of negative acceptor ions
      - The layer contains mobile electrons on the n-side and mobile holes on the p-side
    answer: 2
    explanation: "Electrons leaving the n-side uncover positive donor ions; holes leaving the p-side (electrons filling them) uncover negative acceptor ions. These fixed ions form the space-charge region. Swapping the signs is the common error."

  - id: phy-semi-028
    topic: diode-bias-characteristics
    subtopic: Forward bias
    concept: Forward bias connects p-side to the positive terminal
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [forward-bias]
    stem: A p-n junction diode is forward biased when
    options:
      - its p-side is connected to the positive terminal of the battery
      - its n-side is connected to the positive terminal of the battery
      - both sides are at the same potential
      - it is connected to an AC source
    answer: 0
    explanation: "In forward bias the p-side is at a higher potential than the n-side, which opposes the barrier potential and lets majority carriers cross."

  - id: phy-semi-029
    topic: diode-bias-characteristics
    subtopic: Effect of bias on depletion layer
    concept: Forward bias reduces barrier height and depletion width
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [forward-bias, depletion-layer]
    stem: When a p-n junction is forward biased, the barrier height and the width of the depletion layer
    options:
      - both increase
      - both decrease
      - increase and decrease respectively
      - decrease and increase respectively
    answer: 1
    explanation: "The applied voltage V opposes the built-in barrier, so the effective barrier becomes V_0 − V and the depletion layer narrows. Reverse bias does the opposite."

  - id: phy-semi-030
    topic: diode-bias-characteristics
    subtopic: Reverse saturation current
    concept: Reverse current is due to minority carriers and nearly independent of voltage
    category: concept
    format: direct
    difficulty: 3
    time: 45
    ncert: true
    battle: false
    tags: [reverse-bias, minority-carriers]
    stem: Below breakdown, the reverse current of a p-n junction diode is almost independent of the applied reverse voltage because
    options:
      - the depletion layer resistance is zero
      - majority carriers are all used up
      - it is limited by the small number of minority carriers, which the field sweeps across even at small voltage
      - the junction behaves as a capacitor with no current
    answer: 2
    explanation: "Reverse current is a drift current of minority carriers reaching the junction. Even a small reverse voltage sweeps all of them across, so the current saturates; it depends on how many minority carriers exist (temperature), not on the voltage."

  - id: phy-semi-031
    topic: diode-bias-characteristics
    subtopic: I-V characteristic shape
    concept: Forward current is negligible until the threshold voltage, then rises steeply
    category: concept
    format: graph
    difficulty: 2
    time: 40
    ncert: true
    battle: false
    tags: [iv-characteristic, graph, threshold-voltage]
    stem: Which description best matches the forward I-V characteristic of a silicon diode?
    options:
      - A straight line through the origin with constant slope
      - Current rises steeply from V = 0 and then saturates
      - Current is almost zero up to about 0.7 V and then increases steeply (non-linearly)
      - Current decreases as the forward voltage increases
    answer: 2
    explanation: "Until the applied voltage overcomes the barrier (threshold or knee voltage about 0.7 V for Si), the current is very small. Beyond it the current rises steeply, nearly exponentially. A straight line would be ohmic behaviour."

  - id: phy-semi-032
    topic: diode-bias-characteristics
    subtopic: Dynamic resistance
    concept: Dynamic resistance r_d = ΔV/ΔI
    category: numerical
    format: direct
    difficulty: 2
    time: 40
    ncert: true
