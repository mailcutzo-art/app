    tags: [depletion-layer, ordering]
    stem: |-
      Arrange these events in the order in which they happen when a p-n junction forms:
      1. Drift current becomes equal to diffusion current
      2. Majority carriers diffuse across the junction
      3. An electric field builds up across the junction
      4. Fixed ions are uncovered near the junction
    options:
      - 2, 3, 4, 1
      - 4, 2, 3, 1
      - 2, 4, 3, 1
      - 3, 2, 4, 1
    answer: 2
    explanation: "Diffusion of majority carriers (2) uncovers fixed ions (4), whose charges set up a field (3). This field drives a drift current that grows until it equals the diffusion current (1), giving equilibrium."

