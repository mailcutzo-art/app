questions:
  - id: phy-wav-001
    topic: wave-types
    subtopic: Nature of sound waves
    concept: Sound in air is a longitudinal wave
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [longitudinal, ncert-line]
    stem: "Sound waves travelling through air are:"
    options:
      - Transverse mechanical waves
      - Longitudinal mechanical waves
      - Electromagnetic waves
      - Transverse non-mechanical waves
    answer: 1
    explanation: "In sound waves in air the particles oscillate back and forth along the direction of propagation, producing compressions and rarefactions, so the wave is longitudinal and needs a material medium (mechanical). Air cannot sustain shear stress, so transverse waves cannot travel through it."

  - id: phy-wav-002
    topic: wave-types
    subtopic: Media for transverse waves
    concept: Transverse mechanical waves need shear rigidity, so they cannot travel in gases
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [transverse, trap]
    stem: Transverse mechanical waves cannot propagate through the bulk of a gas because a gas
    options:
      - has a very low density
      - has no bulk modulus
      - cannot sustain shearing stress
      - has too high a temperature
    answer: 2
    explanation: "Transverse mechanical waves involve shear deformation, which needs a restoring force against shear, i.e. a shear modulus. Fluids (gases and liquids) have no shear modulus, so only longitudinal waves (which rely on the bulk modulus) travel through them. A gas certainly has a bulk modulus, which is why sound travels in it."

  - id: phy-wav-003
    topic: wave-types
    subtopic: What a wave transports
    concept: A wave transports energy and momentum, not the medium itself
    category: concept
    format: statements
    difficulty: 2
    time: 35
    ncert: true
    battle: false
    tags: [wave-motion, misconception]
    stem: Which statement about a mechanical wave travelling through a medium is correct?
    options:
      - The particles of the medium travel along with the wave to the far end
      - Energy is transferred but the particles only oscillate about their mean positions
      - Neither energy nor momentum is transferred by the wave
      - The wave can travel only if the medium itself flows
    answer: 1
    explanation: "In a wave, a disturbance (pattern) moves while each particle of the medium merely oscillates about its equilibrium position. Energy and momentum are carried along by the wave, but there is no net transport of matter."

  - id: phy-wav-004
    topic: wave-types
    subtopic: Examples of wave types
    concept: Classifying common waves as transverse or longitudinal
    category: factual
    format: match
    difficulty: 3
    time: 60
    ncert: true
    battle: false
    tags: [classification, match]
    stem: |-
      Match the wave in List I with its nature in List II.
      List I: P. Wave on a plucked guitar string  Q. Sound in water  R. Light in vacuum  S. Primary (P) seismic wave
      List II: 1. Longitudinal mechanical  2. Transverse mechanical  3. Transverse electromagnetic  4. Longitudinal mechanical in solid rock
    options:
      - P-2, Q-1, R-3, S-4
      - P-1, Q-2, R-3, S-4
      - P-2, Q-4, R-1, S-3
      - P-3, Q-1, R-2, S-4
    answer: 0
    explanation: "A plucked string carries transverse mechanical waves; sound in water is longitudinal; light is a transverse electromagnetic wave needing no medium; P-waves in earthquakes are longitudinal waves travelling through rock. Confusing sound in water with a transverse wave is the common slip: liquids cannot sustain shear."

  - id: phy-wav-005
    topic: wave-types
    subtopic: Waves in solids
    concept: Solids support both transverse and longitudinal waves
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [solids, ncert-line]
    stem: A steel rod can carry
    options:
      - only longitudinal waves
      - only transverse waves
      - both transverse and longitudinal waves
      - neither type, since it is rigid
    answer: 2
    explanation: "Solids have both a bulk (or Young's) modulus and a shear modulus, so they can sustain compressional and shear strain. Hence both longitudinal and transverse waves travel through solids."

  - id: phy-wav-006
    topic: wave-types
    subtopic: Compressions and rarefactions
    concept: Distance between successive compressions equals one wavelength
    category: numerical
    format: direct
    difficulty: 2
    time: 35
    ncert: true
    battle: true
    formula: v = fλ
    tags: [longitudinal, wavelength]
    stem: A sound wave of frequency 500 Hz travels in air at 340 m s^{-1}. The distance between a compression and the nearest rarefaction is
    options:
      - 0.68 m
      - 0.34 m
      - 0.17 m
      - 1.36 m
    answer: 1
    explanation: "λ = v/f = 340/500 = 0.68 m. Successive compressions are λ apart, and a compression and the adjacent rarefaction are λ/2 = 0.34 m apart. Picking 0.68 m confuses compression–compression with compression–rarefaction."

  - id: phy-wav-007
    topic: wave-types
    subtopic: Water surface waves
    concept: Water surface waves involve both transverse and longitudinal motion
    category: factual
    format: direct
    difficulty: 3
    time: 35
    ncert: true
    battle: true
    tags: [water-waves, ncert-line]
    stem: The ripples on the surface of water are, in terms of particle motion,
    options:
      - purely longitudinal
      - purely transverse
      - a combination of transverse and longitudinal motion
      - electromagnetic
    answer: 2
    explanation: "NCERT notes that in water surface waves the water particles move in roughly circular or elliptical paths, i.e. the motion has both transverse and longitudinal components. Calling them purely transverse is a common oversimplification."

  - id: phy-wav-008
    topic: wave-types
    subtopic: Mechanical vs electromagnetic
    concept: Mechanical waves need a material medium
    category: concept
    format: assertion-reason
    difficulty: 2
    time: 40
    ncert: true
    battle: false
    tags: [mechanical-waves]
    stem: |-
      Assertion (A): Sound cannot be heard on the Moon's surface through its (almost absent) atmosphere.
      Reason (R): Sound is a mechanical wave and requires a material medium for propagation.
    options:
      - Both A and R are true and R is the correct explanation of A
      - Both A and R are true but R is not the correct explanation of A
      - A is true but R is false
      - A is false but R is true
    answer: 0
    explanation: "Sound propagates through the elasticity and inertia of a material medium. With practically no air on the Moon there is nothing to carry the compressions and rarefactions, so R correctly explains A."

  - id: phy-wav-009
    topic: wave-types
    subtopic: Properties of the medium
    concept: Elasticity and inertia of a medium are both needed for mechanical wave propagation
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [elasticity, inertia]
    stem: For a mechanical wave to propagate, the medium must possess
    options:
      - elasticity only
      - inertia only
      - both elasticity and inertia
      - neither, only a source is needed
    answer: 2
    explanation: "Elasticity provides the restoring force that pulls a displaced element back, and inertia (mass) makes it overshoot and pass the disturbance on. Both are required, which is why wave speed depends on an elastic modulus and a density."

  - id: phy-wav-010
    topic: wave-types
    subtopic: Longitudinal wave description
    concept: In a longitudinal wave, pressure variation is maximum where displacement is zero
    category: concept
    format: statement-pair
    difficulty: 4
    time: 60
    ncert: true
    battle: false
    tags: [pressure-wave, trap, multi-concept]
    stem: |-
      Statement I: In a sound wave, the points of maximum excess pressure (compressions) are the points where particle displacement is zero.
      Statement II: Pressure and displacement variations in a sound wave are in phase with each other.
    options:
      - Both Statement I and Statement II are correct
      - Both Statement I and Statement II are incorrect
      - Statement I is correct but Statement II is incorrect
      - Statement I is incorrect but Statement II is correct
    answer: 2
    explanation: "Excess pressure Δp = −B ∂y/∂x, so pressure is extreme where the displacement curve is steepest, i.e. where displacement is zero. The pressure wave is therefore 90° (π/2) out of phase with the displacement wave, making Statement II false."

  - id: phy-wav-011
    topic: progressive-wave
    subtopic: Reading wave parameters
    concept: v = ω/k from y = A sin(kx − ωt)
    category: numerical
    format: direct
    difficulty: 2
    time: 35
    ncert: true
    battle: true
    formula: v = ω/k
    tags: [wave-equation, speed]
    stem: "A wave is y = 0.02 sin(4πx − 200πt), with x, y in metres and t in seconds. Its speed is"
    options:
      - 50 m s^{-1}
      - 800 m s^{-1}
      - 25 m s^{-1}
      - 100 m s^{-1}
    answer: 0
    explanation: "Comparing with y = A sin(kx − ωt): k = 4π m^{-1}, ω = 200π rad s^{-1}. v = ω/k = 200π/4π = 50 m s^{-1}. Multiplying instead of dividing gives the wrong 800 m s^{-1}."

  - id: phy-wav-012
    topic: progressive-wave
    subtopic: Reading wave parameters
    concept: λ = 2π/k
    category: numerical
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    formula: λ = 2π/k
    tags: [wavelength]
    stem: "For y = 0.02 sin(4πx − 200πt) in SI units, the wavelength is"
    options:
      - 4 m
      - 2 m
      - 0.25 m
      - 0.5 m
    answer: 3
    explanation: "k = 2π/λ = 4π, so λ = 2π/4π = 0.5 m. Taking λ = 1/k-coefficient (0.25 m) forgets the factor 2π."

  - id: phy-wav-013
    topic: progressive-wave
    subtopic: Direction of propagation
    concept: kx + ωt signs give propagation along −x
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [direction, trap]
    stem: "The wave y = A sin(kx + ωt) travels"
    options:
      - along +x
      - along −x
      - along +y
      - nowhere; it is a standing wave
    answer: 1
    explanation: "A phase of the form (kx + ωt) stays constant when x decreases as t increases, i.e. the pattern moves towards −x. With (kx − ωt) the wave moves along +x."

  - id: phy-wav-014
    topic: progressive-wave
    subtopic: Particle velocity
    concept: Maximum particle speed is Aω
    category: numerical
    format: direct
    difficulty: 2
    time: 40
    ncert: true
    battle: true
    formula: v_{max} = Aω
    tags: [particle-velocity]
    stem: "For y = 0.05 sin(2x − 10t) (SI units), the maximum speed of a particle of the medium is"
    options:
      - 5 m s^{-1}
      - 0.1 m s^{-1}
      - 0.5 m s^{-1}
      - 0.25 m s^{-1}
    answer: 2
    explanation: "Particle velocity ∂y/∂t = −Aω cos(kx − ωt), so its maximum is Aω = 0.05 × 10 = 0.5 m s^{-1}. The wave speed ω/k = 5 m s^{-1} is a different quantity; confusing the two is a classic trap."

  - id: phy-wav-015
    topic: progressive-wave
    subtopic: Particle vs wave velocity
    concept: Ratio of maximum particle speed to wave speed equals kA
    category: numerical
    format: direct
    difficulty: 3
    time: 60
    ncert: false
    battle: false
    formula: v_{p,max}/v = Aω/(ω/k) = kA
    tags: [particle-velocity, wave-speed]
    stem: "A progressive wave has amplitude 2 cm and wavelength 4π cm. The ratio of maximum particle speed to wave speed is"
    options:
      - "1"
      - "2"
      - "0.5"
      - "π"
    answer: 0
    explanation: "v_{p,max}/v = Aω/(ω/k) = kA = (2π/λ)A = (2π/4π) × 2 = 1. Note the answer is independent of frequency."

  - id: phy-wav-016
    topic: progressive-wave
    subtopic: Phase difference and path difference
    concept: Δφ = (2π/λ)Δx
    category: numerical
    format: direct
    difficulty: 2
    time: 40
    ncert: true
    battle: true
    formula: Δφ = (2π/λ)Δx
    tags: [phase-difference]
    stem: Two points on a wave of wavelength 60 cm are 10 cm apart along the direction of propagation. Their phase difference is
    options:
      - π/6
      - π/2
      - π/3
      - 2π/3
    answer: 2
    explanation: "Δφ = (2π/λ)Δx = (2π/60) × 10 = π/3. Using Δφ = Δx/λ without 2π gives 1/6 and tempts π/6."

  - id: phy-wav-017
    topic: progressive-wave
    subtopic: Frequency and period
    concept: f = ω/2π and T = 1/f
    category: numerical
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    formula: T = 2π/ω
    tags: [period]
    stem: "The time period of the wave y = 3 sin(0.5x − 100πt) (SI units) is"
    options:
      - 0.01 s
      - 0.02 s
      - 50 s
      - 0.05 s
    answer: 1
    explanation: "ω = 100π rad s^{-1}, so T = 2π/ω = 2π/100π = 0.02 s (frequency 50 Hz). The 50 s option inverts the relation."

  - id: phy-wav-018
    topic: progressive-wave
    subtopic: Wave function forms
    concept: A travelling wave must be a function of (x − vt) or (x + vt)
    category: concept
    format: statements
    difficulty: 3
    time: 60
    ncert: false
    battle: false
    tags: [wave-function, trap]
    stem: Which of the following functions (a, b positive constants) can represent a travelling wave?
    options:
      - y = a sin(bx) cos(bt)
      - y = a e^{−(x − 3t)^2}
      - y = a x t
      - y = a (x^2 − t^2)
    answer: 1
    explanation: "A travelling wave keeps its shape and moves, so y must depend on x and t only through the combination (x ± vt). a e^{−(x − 3t)^2} is a Gaussian pulse moving along +x at 3 units. sin(bx) cos(bt) is a standing wave, and xt or x^2 − t^2 are not functions of x ± vt alone."

  - id: phy-wav-019
    topic: progressive-wave
    subtopic: Particle velocity and slope
    concept: Particle velocity = −v × (slope of wave)
    category: concept
    format: direct
    difficulty: 3
    time: 50
    ncert: false
    battle: false
    formula: ∂y/∂t = −v ∂y/∂x
    tags: [particle-velocity, slope]
    stem: A sinusoidal wave travels along +x on a string. At an instant, a particle sits where the string has its maximum positive slope (∂y/∂x largest and positive). The particle is
    options:
      - momentarily at rest at the crest
      - moving upward with maximum speed
      - moving downward with maximum speed
      - moving along +x with the wave speed
    answer: 2
    explanation: "For a wave moving along +x, ∂y/∂t = −v ∂y/∂x. Maximum positive slope gives maximum negative particle velocity, so the particle moves downward at its fastest (it is at the mean position). Particles never move along x with the wave speed in a transverse wave."

  - id: phy-wav-020
    topic: progressive-wave
    subtopic: Wave parameters
    concept: Definitions of angular wave number and angular frequency
    category: factual
    format: match
    difficulty: 2
    time: 50
    ncert: true
    battle: false
    tags: [definitions]
    stem: |-
      For y = A sin(kx − ωt + φ), match List I with List II.
      List I: P. k  Q. ω  R. φ  S. kx − ωt + φ
      List II: 1. Initial phase angle  2. Angular wave number  3. Phase  4. Angular frequency
    options:
      - P-4, Q-2, R-1, S-3
      - P-2, Q-4, R-3, S-1
      - P-2, Q-4, R-1, S-3
      - P-1, Q-4, R-2, S-3
    answer: 2
    explanation: "k = 2π/λ is the angular wave number, ω = 2π/T the angular frequency, φ the initial phase angle (phase at x = 0, t = 0), and the full argument kx − ωt + φ is the phase of the wave."

  - id: phy-wav-021
    topic: progressive-wave
    subtopic: Units of wave parameters
    concept: SI unit of angular wave number is rad m^{-1}
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [units, ncert-line]
    stem: The SI unit of angular wave number k is
    options:
      - rad s^{-1}
      - m
      - m s^{-1}
      - rad m^{-1}
    answer: 3
    explanation: "k = 2π/λ has units of radian per metre (rad m^{-1}). rad s^{-1} is the unit of angular frequency ω."

  - id: phy-wav-022
    topic: progressive-wave
    subtopic: Writing the wave equation
    concept: Constructing y(x,t) from A, λ, f and direction
    category: application
    format: direct
    difficulty: 3
    time: 70
    ncert: true
    battle: false
    formula: y = A sin(2πx/λ − 2πft)
    tags: [wave-equation]
    stem: A wave of amplitude 0.1 m, wavelength 2 m and frequency 5 Hz travels along −x. With y = 0 at x = 0, t = 0 and SI units, its equation can be
    options:
      - y = 0.1 sin(πx − 10πt)
      - y = 0.1 sin(πx + 10πt)
      - y = 0.1 sin(2πx + 5πt)
      - y = 0.1 sin(0.5πx + 10πt)
    answer: 1
    explanation: "k = 2π/λ = π m^{-1}, ω = 2πf = 10π rad s^{-1}. Motion along −x needs (kx + ωt), so y = 0.1 sin(πx + 10πt). The first option has the right numbers but travels along +x."

  - id: phy-wav-023
    topic: progressive-wave
    subtopic: Particle acceleration
    concept: Maximum particle acceleration is Aω^2
    category: numerical
    format: direct
    difficulty: 3
    time: 50
    ncert: false
    battle: true
    formula: a_{max} = Aω^2
    tags: [particle-acceleration]
    stem: "For y = 0.01 sin(20x − 100t) (SI), the maximum acceleration of a medium particle is"
    options:
      - 1 m s^{-2}
      - 100 m s^{-2}
      - 10 m s^{-2}
      - 4 m s^{-2}
    answer: 1
    explanation: "Each particle executes SHM with ω = 100 rad s^{-1}, so a_{max} = Aω^2 = 0.01 × 10^4 = 100 m s^{-2}. Aω = 1 m s^{-1} is the maximum velocity, not acceleration."

  - id: phy-wav-024
    topic: progressive-wave
    subtopic: Phase difference in time
    concept: Phase difference at one point over time Δt is ωΔt
    category: numerical
    format: direct
    difficulty: 2
    time: 40
    ncert: false
    battle: true
    formula: Δφ = 2πΔt/T
    tags: [phase-difference, time]
    stem: A wave has frequency 50 Hz. The phase change of a given particle in 5 ms is
    options:
      - π
      - π/4
      - 2π
      - π/2
    answer: 3
    explanation: "T = 1/50 = 20 ms. Δφ = 2π(Δt/T) = 2π × 5/20 = π/2."

  - id: phy-wav-025
    topic: progressive-wave
    subtopic: Graph of a wave snapshot
    concept: A y–x snapshot gives λ and A; a y–t graph gives T
    category: concept
    format: graph
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [graph, snapshot]
    stem: For a sinusoidal wave, a graph of displacement y against position x at a fixed instant and a graph of y against time t at a fixed x are drawn. The horizontal repeat distance of the first graph and the repeat interval of the second graph give respectively
    options:
      - wavelength and time period
      - time period and wavelength
      - amplitude and frequency
      - wave speed and angular frequency
    answer: 0
    explanation: "A snapshot (y vs x at fixed t) repeats after one wavelength λ; the history of one particle (y vs t at fixed x) repeats after one period T. Their ratio λ/T gives the wave speed."

  - id: phy-wav-026
    topic: speed-on-string
    subtopic: Formula
    concept: v = √(T/μ) on a stretched string
    category: numerical
    format: direct
    difficulty: 1
    time: 30
    ncert: true
    battle: true
    formula: v = √(T/μ)
    tags: [string-speed]
    stem: A string with linear mass density 0.01 kg m^{-1} is under a tension of 100 N. The speed of transverse waves on it is
    options:
      - 10 m s^{-1}
      - 1000 m s^{-1}
      - 100 m s^{-1}
      - 10^4 m s^{-1}
    answer: 2
    explanation: "v = √(T/μ) = √(100/0.01) = √10^4 = 100 m s^{-1}. Forgetting the square root gives 10^4 m s^{-1}."

  - id: phy-wav-027
    topic: speed-on-string
    subtopic: Linear mass density from mass and length
    concept: μ = m/L before using v = √(T/μ)
    category: numerical
    format: direct
    difficulty: 2
    time: 45
    ncert: true
    battle: true
    formula: v = √(TL/m)
    tags: [string-speed, units]
    stem: A 50 cm long string of mass 5 g is stretched with a tension of 64 N. The speed of transverse waves on it is
    options:
      - 8 m s^{-1}
      - 80 m s^{-1}
      - 64 m s^{-1}
      - 800 m s^{-1}
    answer: 1
    explanation: "μ = 0.005 kg / 0.5 m = 0.01 kg m^{-1}. v = √(64/0.01) = √6400 = 80 m s^{-1}. Using grams or centimetres without converting gives the distractors."

  - id: phy-wav-028
    topic: speed-on-string
    subtopic: Effect of tension
    concept: v ∝ √T for a given string
    category: numerical
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    formula: v ∝ √T
    tags: [proportionality]
    stem: The tension in a stretched string is increased to four times its original value. The speed of transverse waves on it becomes
    options:
      - four times
      - half
      - sixteen times
      - twice
    answer: 3
    explanation: "v = √(T/μ) ∝ √T, so quadrupling T doubles v. Proportionality with T itself would wrongly give four times."

  - id: phy-wav-029
    topic: speed-on-string
    subtopic: Dependence on wire properties
    concept: For a wire, μ = ρA, so v = √(T/ρπr^2)
    category: numerical
    format: direct
    difficulty: 3
    time: 60
    ncert: false
    battle: false
    formula: v = √(T/(ρπr^2))
    tags: [radius, density, multi-concept]
    stem: "Two wires of the same material under the same tension have radii r and 2r. The ratio of wave speeds v_1 : v_2 on them is"
    options:
      - "1 : 2"
      - "2 : 1"
      - "4 : 1"
      - "√2 : 1"
    answer: 1
    explanation: "μ = ρπr^2, so v = √(T/ρπr^2) ∝ 1/r. Hence v_1/v_2 = 2r/r = 2, i.e. 2 : 1. The thinner wire carries faster waves."

  - id: phy-wav-030
    topic: speed-on-string
    subtopic: Dimensional check
    concept: √(T/μ) has dimensions of speed
    category: concept
    format: direct
    difficulty: 2
    time: 35
    ncert: true
    battle: true
    tags: [dimensions]
    stem: Which combination of tension T and linear mass density μ has the dimensions of speed?
    options:
      - T/μ
      - √(μ/T)
      - √(T/μ)
      - Tμ
    answer: 2
    explanation: "[T] = MLT^{-2}, [μ] = ML^{-1}. T/μ has dimensions L^2T^{-2}, so √(T/μ) has LT^{-1}, a speed. NCERT derives v = C√(T/μ) exactly this way, with C = 1 from detailed analysis."

  - id: phy-wav-031
    topic: speed-on-string
    subtopic: Independence from frequency
    concept: Wave speed on a string depends on medium, not frequency
    category: concept
    format: statement-pair
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [frequency, trap]
    stem: |-
      Statement I: Doubling the frequency of the source vibrating one end of a stretched string doubles the speed of the waves on it.
      Statement II: The speed of waves on a string is fixed by the tension and linear mass density of the string.
    options:
      - Both Statement I and Statement II are correct
      - Both Statement I and Statement II are incorrect
      - Statement I is correct but Statement II is incorrect
      - Statement I is incorrect but Statement II is correct
    answer: 3
    explanation: "v = √(T/μ) is a property of the medium. Doubling the source frequency halves the wavelength while v stays the same (v = fλ). So Statement I is false, Statement II true."

  - id: phy-wav-032
    topic: speed-on-string
    subtopic: Hanging mass provides tension
    concept: Tension from a hanging load T = mg
    category: numerical
    format: direct
    difficulty: 2
    time: 45
    ncert: false
    battle: true
