      II. The wavelength is 0.5 m.
      III. The maximum particle speed is 0.4π m s^{-1}.
      IV. The wave travels along +x.
      Which are correct?
    options:
      - I and II only
      - II and IV only
      - I, III and IV only
      - I, II, III and IV
    answer: 2
    explanation: "Compare with A sin 2π(t/T − x/λ): f = 10 Hz, 1/λ = 0.5 so λ = 2 m (II false). v = fλ = 20 m s^{-1}. v_{p,max} = Aω = 0.02 × 20π = 0.4π m s^{-1}. The form (t − x) moves along +x."

  - id: phy-wav-222
    topic: progressive-wave
    subtopic: Space and time periodicity
    concept: A harmonic wave is periodic in both space and time, independently
    category: concept
    format: assertion-reason
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [periodicity]
    stem: |-
      Assertion (A): A snapshot of the harmonic wave y = A sin(kx − ωt) at any fixed instant is a sine curve in space.
      Reason (R): At any fixed position, the displacement y varies sinusoidally with time.
    options:
      - Both A and R are true and R is the correct explanation of A
      - Both A and R are true but R is not the correct explanation of A
      - A is true but R is false
      - A is false but R is true
    answer: 1
    explanation: "Fixing t leaves y = A sin(kx − constant), a sine in x (period λ): A is true. Fixing x gives a sine in t (period T): R is true. But the spatial shape follows from the kx term, not from the time variation, so R does not explain A."

