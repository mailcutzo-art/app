    stem: A capacitor with circular plates of radius R is charged by a current of 2 A. The displacement current through a circular area of radius R/2 between the plates, coaxial with them, is
    options:
      - "2 A"
      - "1 A"
      - "0.25 A"
      - "0.5 A"
    answer: 3
    explanation: The field between the plates is uniform, so the flux (and hence i_d) through an area is proportional to that area. Area ratio (R/2)^2/R^2 = 1/4, so i_d = 2/4 = 0.5 A. Taking the ratio of radii instead gives the wrong 1 A.
  - id: phy-emw-017
    topic: maxwell-equations
    subtopic: Gauss's law for magnetism
    concept: ∮B·dA = 0 expresses absence of magnetic monopoles
    category: concept
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    formula: ∮B·dA = 0
    tags: [maxwell-equations, monopole]
    stem: Which of Maxwell's equations expresses the fact that isolated magnetic poles do not exist?
    options:
      - ∮E·dA = Q/ε_0
      - ∮B·dA = 0
      - ∮E·dl = −dΦ_B/dt
      - ∮B·dl = μ_0 i_c + μ_0 ε_0 dΦ_E/dt
    answer: 1
    explanation: The net magnetic flux through any closed surface is zero, ∮B·dA = 0, because magnetic field lines form closed loops and there is no magnetic charge (monopole).
  - id: phy-emw-018
    topic: maxwell-equations
    subtopic: Physical meaning of the four equations
    concept: Matching each Maxwell equation to its law
    category: concept
    format: match
    difficulty: 3
    time: 60
    ncert: true
    battle: false
    tags: [maxwell-equations, match]
    stem: |-
      Match List I (equation) with List II (law).
      List I:
      P. ∮E·dA = Q/ε_0
      Q. ∮B·dA = 0
      R. ∮E·dl = −dΦ_B/dt
      S. ∮B·dl = μ_0 i_c + μ_0 ε_0 dΦ_E/dt
      List II:
      1. Faraday's law of induction
      2. Gauss's law for electricity
      3. Ampere–Maxwell law
      4. Gauss's law for magnetism
    options:
      - P-2, Q-4, R-3, S-1
      - P-4, Q-2, R-1, S-3
      - P-2, Q-4, R-1, S-3
      - P-2, Q-1, R-4, S-3
    answer: 2
    explanation: Gauss's law for electricity relates electric flux to charge (P-2); zero magnetic flux is Gauss's law for magnetism (Q-4); induced emf from changing magnetic flux is Faraday's law (R-1); the magnetic circulation from currents and changing electric flux is the Ampere–Maxwell law (S-3).
  - id: phy-emw-019
    topic: maxwell-equations
    subtopic: Faraday's law in Maxwell's form
    concept: A changing magnetic flux produces a circulating electric field
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    formula: ∮E·dl = −dΦ_B/dt
    tags: [maxwell-equations, faraday]
    stem: The Maxwell equation ∮E·dl = −dΦ_B/dt states that
    options:
      - a changing electric field produces a magnetic field
      - electric field lines begin and end on charges
      - a changing magnetic field produces an electric field
      - magnetic field lines are always closed
    answer: 2
    explanation: "This is Faraday's law: the line integral of E round a loop (the emf) equals minus the rate of change of magnetic flux, so a changing B produces an E field."
