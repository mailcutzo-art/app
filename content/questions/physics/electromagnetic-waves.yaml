questions:
  - id: phy-emw-001
    topic: displacement-current
    subtopic: Definition of displacement current
    concept: Displacement current i_d = ε_0 dΦ_E/dt
    category: factual
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    formula: i_d = ε_0 dΦ_E/dt
    tags: [displacement-current, ncert-line]
    stem: The displacement current through a surface is given by
    options:
      - μ_0 dΦ_E/dt
      - ε_0 dΦ_B/dt
      - ε_0 dΦ_E/dt
      - (1/μ_0) dΦ_E/dt
    answer: 2
    explanation: Maxwell defined the displacement current as i_d = ε_0 dΦ_E/dt, where Φ_E is the electric flux. It involves the permittivity ε_0 and the changing electric (not magnetic) flux.
  - id: phy-emw-002
    topic: displacement-current
    subtopic: Displacement current in a capacitor
    concept: i_d = C dV/dt for a charging capacitor
    category: numerical
    format: direct
    difficulty: 2
    time: 35
    ncert: false
    battle: true
    formula: i_d = C dV/dt
    tags: [capacitor, displacement-current]
    stem: The potential difference across a 2 μF capacitor changes at a rate of 5 × 10^3 V s^{-1}. The displacement current between its plates is
    options:
      - 1 mA
      - 10 mA
      - 100 mA
      - 0.4 mA
    answer: 1
    explanation: For a capacitor, i_d = ε_0 dΦ_E/dt = C dV/dt = 2 × 10^{-6} × 5 × 10^3 = 10^{-2} A = 10 mA.
  - id: phy-emw-003
    topic: displacement-current
