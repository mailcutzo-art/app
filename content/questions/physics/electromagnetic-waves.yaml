  - id: phy-emw-007
    topic: displacement-current
    subtopic: Magnetic field between capacitor plates
    concept: B = μ_0 i r/(2πR^2) inside the region between circular plates
    category: numerical
    format: direct
    difficulty: 4
    time: 100
    ncert: false
    battle: false
    formula: B = μ_0 i_d r/(2πR^2) for r < R
    tags: [capacitor, ampere-maxwell, multi-concept]
    stem: A capacitor with circular plates of radius 10 cm is charged by a current of 0.2 A. The magnetic field at a point 5 cm from the axis, in the region between the plates, is
    options:
      - 4 × 10^{-7} T
      - 1 × 10^{-7} T
      - 8 × 10^{-7} T
      - 2 × 10^{-7} T
    answer: 3
    explanation: The displacement current enclosed by a loop of radius r is i r^2/R^2. Ampere–Maxwell law gives B·2πr = μ_0 i r^2/R^2, so B = (μ_0/2π) i r/R^2 = 2 × 10^{-7} × 0.2 × 0.05/0.01 = 2 × 10^{-7} T. Using the full current i with r gives the wrong 8 × 10^{-7} T.
  - id: phy-emw-008
    topic: displacement-current
    subtopic: Magnetic field between capacitor plates
    concept: B rises linearly with r inside the plate region, then falls as 1/r outside
    category: concept
    format: graph
    difficulty: 3
    time: 60
    ncert: false
    battle: false
    tags: [graph, capacitor, ampere-maxwell]
    stem: A capacitor with circular plates of radius R is being charged by a steady current. How does the magnetic field B in the gap vary with distance r from the axis?
    options:
      - B is constant for r < R and falls as 1/r for r > R
      - B increases linearly with r up to r = R and then falls as 1/r
      - B falls as 1/r everywhere
      - B is zero for r < R and falls as 1/r^2 for r > R
    answer: 1
    explanation: Inside, the enclosed displacement current grows as r^2, so B·2πr ∝ r^2 and B ∝ r. Outside, all of it is enclosed, so B = μ_0 i/(2πr) ∝ 1/r. The peak is at r = R.
  - id: phy-emw-009
    topic: displacement-current
    subtopic: Need for displacement current
    concept: Ampere's law without displacement current fails for a charging capacitor
    category: concept
    format: assertion-reason
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [ampere-maxwell, capacitor, ncert-line]
    stem: |-
      Assertion (A): Ampere's circuital law in its original form gives inconsistent results for a loop around the wire of a charging capacitor.
      Reason (R): A surface bounded by the same loop can pass between the plates, where the conduction current is zero.
    options:
      - Both A and R are true and R is the correct explanation of A
      - Both A and R are true but R is not the correct explanation of A
      - A is true but R is false
      - A is false but R is true
    answer: 0
    explanation: For the same loop, a flat surface cut by the wire encloses current i, while a pot-shaped surface through the gap encloses none, giving B = 0 — a contradiction. This is exactly why Maxwell added the displacement current, so R explains A.
  - id: phy-emw-010
    topic: displacement-current
    subtopic: History
    concept: Maxwell introduced the displacement current
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [history, ncert-line]
    stem: Who introduced the concept of displacement current to make Ampere's law consistent?
    options:
      - Faraday
      - Ampere
      - Maxwell
      - Hertz
    answer: 2
    explanation: James Clerk Maxwell noticed the inconsistency in Ampere's law for a charging capacitor and added the displacement current term ε_0 dΦ_E/dt.
  - id: phy-emw-011
    topic: displacement-current
    subtopic: Units of displacement current
    concept: Displacement current has the unit ampere
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: false
    battle: true
    tags: [units, displacement-current]
    stem: The SI unit of displacement current is
    options:
      - volt metre
      - ampere
      - coulomb
      - weber per second
    answer: 1
    explanation: ε_0 dΦ_E/dt has units (C^2 N^{-1} m^{-2})(N C^{-1} m^2 s^{-1}) = C s^{-1} = A, the same as conduction current.
  - id: phy-emw-012
    topic: displacement-current
    subtopic: Displacement current with AC voltage
    concept: Peak i_d = C V_0 ω for a sinusoidal voltage
    category: numerical
    format: direct
    difficulty: 3
    time: 60
    ncert: false
    battle: false
    formula: i_d = C dV/dt
    tags: [capacitor, ac, multi-concept]
    stem: A 5 μF capacitor is connected across a source V = 200 sin(100t) volt. The maximum displacement current between its plates is
    options:
      - "1 A"
      - "0.1 A"
      - "0.01 A"
      - "10 A"
    answer: 1
    explanation: i_d = C dV/dt = C V_0 ω cos ωt, so the peak value is C V_0 ω = 5 × 10^{-6} × 200 × 100 = 0.1 A.
  - id: phy-emw-013
    topic: displacement-current
    subtopic: Ampere–Maxwell law
    concept: Correct form of Ampere–Maxwell law
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    formula: ∮B·dl = μ_0 i_c + μ_0 ε_0 dΦ_E/dt
    tags: [ampere-maxwell, ncert-line]
    stem: The Ampere–Maxwell law is written as
    options:
      - ∮B·dl = μ_0 i_c
      - ∮B·dl = μ_0 i_c + ε_0 dΦ_B/dt
      - ∮B·dl = μ_0 ε_0 i_c + dΦ_E/dt
      - ∮B·dl = μ_0 i_c + μ_0 ε_0 dΦ_E/dt
    answer: 3
    explanation: Maxwell's generalisation is ∮B·dl = μ_0(i_c + i_d) with i_d = ε_0 dΦ_E/dt, i.e. μ_0 i_c + μ_0 ε_0 dΦ_E/dt.
  - id: phy-emw-014
    topic: displacement-current
    subtopic: Properties of displacement current
    concept: Properties of displacement current
    category: concept
    format: multi-statement
    difficulty: 3
    time: 60
    ncert: true
    battle: false
    tags: [displacement-current]
    stem: |-
      Consider the following statements about displacement current:
      I. It is produced by a time-varying electric field.
      II. It produces a magnetic field just like a conduction current.
      III. It involves the actual flow of charges across the gap of a capacitor.
      IV. The sum of conduction and displacement currents is continuous around a circuit.
      Which are correct?
    options:
      - I, II and IV only
      - I and III only
      - II, III and IV only
      - I, II, III and IV
    answer: 0
    explanation: Displacement current arises from a changing electric field (I), is a source of magnetic field (II) and makes the total current continuous (IV). No charges actually cross the gap, so III is false.
