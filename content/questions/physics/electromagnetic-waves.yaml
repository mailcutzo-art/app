    answer: 3
    explanation: i_d = ε_0 dΦ_E/dt = 8.85 × 10^{-12} × 1.13 × 10^{11} ≈ 1.0 A.
  - id: phy-emw-004
    topic: displacement-current
    subtopic: Currents in a charging capacitor
    concept: Between the plates only displacement current flows, equal to the conduction current in wires
    category: concept
    format: statements
    difficulty: 3
    time: 45
    ncert: true
    battle: false
    tags: [capacitor, displacement-current, ncert-line]
    stem: A parallel plate capacitor is being charged by a steady current I. Which statement about the region between the plates is correct?
    options:
      - The displacement current there equals I and the conduction current is zero
      - The conduction current there equals I and the displacement current is zero
      - Both conduction and displacement currents there are zero
      - Both conduction and displacement currents there equal I
    answer: 0
    explanation: No charges cross the gap, so the conduction current between the plates is zero. The changing electric field gives a displacement current ε_0 dΦ_E/dt = dq/dt = I, so the total current stays continuous.
  - id: phy-emw-005
    topic: displacement-current
    subtopic: Condition for displacement current
    concept: Displacement current needs a time-varying electric field
    category: concept
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [displacement-current, trap]
    stem: In a region where the electric field is steady (constant in time), the displacement current is
    options:
      - equal to the conduction current
      - maximum
      - zero
      - equal to ε_0 E
    answer: 2
    explanation: i_d = ε_0 dΦ_E/dt; if E does not change with time, dΦ_E/dt = 0 and the displacement current is zero, however large E is.
  - id: phy-emw-006
