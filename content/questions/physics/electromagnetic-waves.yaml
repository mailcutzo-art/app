    stem: Arrange in decreasing order of wavelength — P. 1 MHz, Q. 10^{15} Hz, R. 10 GHz, S. 10^{13} Hz.
    options:
      - Q, S, R, P
      - P, S, R, Q
      - R, P, S, Q
      - P, R, S, Q
    answer: 3
    explanation: λ ∝ 1/ν, so the lowest frequency has the longest wavelength. 1 MHz (P) < 10 GHz (R) < 10^{13} Hz (S) < 10^{15} Hz (Q) in frequency, so P > R > S > Q in wavelength.
