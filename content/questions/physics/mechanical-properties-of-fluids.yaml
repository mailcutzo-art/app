questions:
  - id: phy-mpf-001
    topic: pressure-pascal
    subtopic: Nature of pressure
    concept: Pressure is a scalar; the force it produces acts normal to the surface
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [scalar, ncert-line]
    stem: Pressure in a fluid at rest is treated as a scalar quantity because
    options:
      - it always acts vertically downward
      - it is the ratio of two vectors that are always parallel to each other
      - it has magnitude but no direction of its own; the force it exerts is always normal to the surface considered
      - it depends only on the depth and not on the density of the fluid
    answer: 2
    explanation: Pressure is defined as the normal force per unit area. It has no direction of its own; whatever surface is chosen, the force due to pressure acts perpendicular to it. It does not act only downward, which is the common misconception.

  - id: phy-mpf-002
    topic: pressure-pascal
    subtopic: Definition of pressure
    concept: P = F/A for a normal force
    category: numerical
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    formula: P = F/A
    tags: [pressure-basic]
    stem: A normal force of 600 N acts uniformly on an area of 0.02 m^2. What is the pressure?
    options:
      - 3 × 10^4 Pa
      - 1.2 × 10^1 Pa
      - 3 × 10^3 Pa
      - 1.2 × 10^4 Pa
    answer: 0
    explanation: P = F/A = 600/0.02 = 3 × 10^4 Pa. Multiplying F by A (giving 12) is the usual slip.

  - id: phy-mpf-003
    topic: pressure-pascal
    subtopic: Units and dimensions
    concept: Dimensional formula of pressure
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [dimensions]
    stem: The dimensional formula of pressure is
    options:
      - "[MLT^{-2}]"
      - "[ML^2T^{-2}]"
      - "[ML^{-2}T^{-2}]"
      - "[ML^{-1}T^{-2}]"
    answer: 3
    explanation: Pressure = force/area = [MLT^{-2}]/[L^2] = [ML^{-1}T^{-2}], the same as stress and energy per unit volume.

  - id: phy-mpf-004
    topic: pressure-pascal
    subtopic: Hydraulic lift
    concept: Force multiplication F_2 = F_1 A_2/A_1
    category: numerical
    format: direct
    difficulty: 2
    time: 40
    ncert: true
    battle: true
    formula: F_1/A_1 = F_2/A_2
    tags: [hydraulic-lift, pascal-law]
    stem: In a hydraulic lift the pistons have areas 0.01 m^2 and 0.5 m^2. A force of 200 N on the small piston can support what load on the large piston?
    options:
      - 4 N
      - 1.0 × 10^4 N
      - 1.0 × 10^3 N
      - 2.5 × 10^4 N
    answer: 1
    explanation: By Pascal's law the pressure is transmitted undiminished, so F_2 = F_1 × A_2/A_1 = 200 × 50 = 1.0 × 10^4 N. Dividing instead of multiplying gives 4 N.

  - id: phy-mpf-005
    topic: pressure-pascal
    subtopic: Hydraulic lift
    concept: Volume displaced is equal on both sides of a hydraulic lift
    category: numerical
    format: direct
    difficulty: 3
    time: 50
    ncert: false
    battle: true
    formula: A_1 d_1 = A_2 d_2
    tags: [hydraulic-lift, trap]
    stem: The large piston of a hydraulic press has 25 times the area of the small piston. If the small piston is pushed down by 50 cm, the large piston rises by
    options:
      - 12.5 m
      - 25 cm
      - 2 cm
      - 50 cm
    answer: 2
    explanation: The liquid is incompressible, so the volume pushed out equals the volume received, A_1 d_1 = A_2 d_2, giving d_2 = 50/25 = 2 cm. Force is multiplied but distance is reduced by the same factor, so work is not multiplied.

  - id: phy-mpf-006
    topic: pressure-pascal
    subtopic: Hydraulic brakes
    concept: Hydraulic brakes rely on Pascal's law
    category: concept
    format: assertion-reason
    difficulty: 2
    time: 40
    ncert: true
    battle: false
    tags: [hydraulic-brakes, pascal-law]
    stem: |-
      Assertion (A): In hydraulic brakes, pressing the pedal applies an equal braking pressure on all the wheels.
      Reason (R): A pressure change applied to an enclosed incompressible fluid is transmitted undiminished to every part of the fluid and the walls of the container.
    options:
      - Both A and R are true and R is the correct explanation of A
      - Both A and R are true but R is not the correct explanation of A
      - A is true but R is false
      - A is false but R is true
    answer: 0
    explanation: The pedal pushes a master cylinder piston; the pressure is transmitted through the brake oil equally to the slave cylinders at every wheel. This is exactly Pascal's law, so R explains A.

  - id: phy-mpf-007
    topic: pressure-pascal
    subtopic: Density of mixtures
    concept: Density of a mixture of equal masses is the harmonic mean
    category: numerical
    format: direct
    difficulty: 3
    time: 60
    ncert: false
    battle: true
    formula: ρ = 2ρ_1ρ_2/(ρ_1 + ρ_2)
    tags: [density, trap]
    stem: Equal masses of two liquids of densities 2 g cm^{-3} and 3 g cm^{-3} are mixed (no volume change). The density of the mixture is
    options:
      - 2.5 g cm^{-3}
      - 2.2 g cm^{-3}
      - 2.6 g cm^{-3}
      - 2.4 g cm^{-3}
    answer: 3
    explanation: Total mass 2m, total volume m/2 + m/3 = 5m/6, so ρ = 2m/(5m/6) = 2.4 g cm^{-3}. The arithmetic mean 2.5 applies only to equal volumes.

  - id: phy-mpf-008
    topic: pressure-pascal
    subtopic: Density and pressure facts
    concept: Basic facts about density, relative density and the pascal
    category: factual
    format: multi-statement
    difficulty: 2
    time: 50
    ncert: true
    battle: false
    tags: [density, ncert-line]
    stem: |-
      Consider the statements:
      I. Relative density is a dimensionless quantity.
      II. The density of water is maximum at 4 °C.
      III. The density of a liquid does not change at all however large the pressure applied.
      IV. One pascal equals one newton per square metre.
      Which of these are correct?
    options:
      - I and II only
      - I, II and IV only
      - II, III and IV only
      - I, III and IV only
    answer: 1
    explanation: Relative density is a ratio of densities, water is densest at 4 °C, and 1 Pa = 1 N m^{-2}. Liquids are only nearly incompressible; their density rises very slightly under large pressure, so III is wrong.

  - id: phy-mpf-009
    topic: pressure-pascal
    subtopic: Hydraulic machines
    concept: A hydraulic lift multiplies force but not work
    category: concept
    format: statement-pair
    difficulty: 2
    time: 40
    ncert: true
    battle: false
    tags: [hydraulic-lift, trap]
    stem: |-
      Statement I: A hydraulic lift acts as a force multiplier.
      Statement II: A hydraulic lift also multiplies the work done by the input force.
    options:
      - Both Statement I and Statement II are correct
      - Both Statement I and Statement II are incorrect
      - Statement I is correct but Statement II is incorrect
      - Statement I is incorrect but Statement II is correct
    answer: 2
    explanation: The output force is larger by A_2/A_1, but the output piston moves a smaller distance by the same factor, so (ideally) work out equals work in. Energy is conserved; only force is multiplied.

  - id: phy-mpf-010
    topic: pressure-depth
    subtopic: Absolute pressure at depth
    concept: P = P_a + ρgh
    category: numerical
    format: direct
    difficulty: 1
    time: 30
    ncert: true
    battle: true
    formula: P = P_a + ρgh
    tags: [hydrostatic-pressure]
    stem: Taking P_a = 1.01 × 10^5 Pa and g = 10 m s^{-2}, the absolute pressure at a depth of 10 m in water is
    options:
      - 2.01 × 10^5 Pa
      - 1.0 × 10^5 Pa
      - 1.11 × 10^5 Pa
      - 1.01 × 10^6 Pa
    answer: 0
    explanation: ρgh = 1000 × 10 × 10 = 1.0 × 10^5 Pa, so P = 1.01 × 10^5 + 1.0 × 10^5 = 2.01 × 10^5 Pa. The value 1.0 × 10^5 Pa is only the gauge pressure.

  - id: phy-mpf-011
    topic: pressure-depth
    subtopic: Hydrostatic paradox
    concept: Pressure at a depth is independent of the shape of the vessel
    category: concept
    format: case
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [hydrostatic-paradox, ncert-line]
    stem: Three vessels of different shapes (a narrow cylinder, a wide cone opening upward and a cone narrowing upward) have the same base area and are filled with water to the same height. The pressure at the base is
    options:
      - greatest in the vessel holding the most water
      - greatest in the cone narrowing upward
      - least in the narrow cylinder
      - the same in all three vessels
    answer: 3
    explanation: Pressure at a point in a liquid at rest depends only on the depth, density and g (P = P_a + ρgh), not on the shape of the vessel or the amount of liquid. This is the hydrostatic paradox.

  - id: phy-mpf-012
    topic: pressure-depth
    subtopic: Force on the base
    concept: Force on the base depends on area while pressure does not
    category: application
    format: direct
    difficulty: 3
    time: 45
    ncert: false
    battle: false
    tags: [hydrostatic-paradox, trap]
    stem: Two open tanks A and B contain water to the same height. The base area of A is twice that of B. Compared with B, the base of A experiences
    options:
      - twice the pressure and twice the force
      - the same pressure but twice the force
      - the same pressure and the same force
      - half the pressure and the same force
    answer: 1
    explanation: Pressure at the base, P_a + ρgh, is the same since depth is equal. Force = pressure × area, so the larger base experiences twice the force.

  - id: phy-mpf-013
    topic: pressure-depth
    subtopic: Pressure doubling depth
    concept: Depth at which pressure becomes twice atmospheric
    category: numerical
    format: direct
    difficulty: 2
    time: 40
    ncert: false
    battle: true
    formula: ρgh = P_a
    tags: [hydrostatic-pressure]
    stem: Taking P_a = 1.0 × 10^5 Pa and g = 10 m s^{-2}, at what depth in fresh water is the absolute pressure twice the atmospheric pressure?
    options:
      - 1 m
      - 10 m
      - 20 m
      - 76 cm
    answer: 1
    explanation: Absolute pressure 2P_a means ρgh = P_a, so h = 10^5/(1000 × 10) = 10 m. The value 76 cm is the mercury barometer height, not a water depth.

  - id: phy-mpf-014
    topic: pressure-depth
    subtopic: Layered liquids
    concept: Gauge pressure under two immiscible layers adds ρgh of each
    category: numerical
    format: direct
    difficulty: 3
    time: 60
    ncert: false
    battle: false
    formula: P_g = ρ_1gh_1 + ρ_2gh_2
    tags: [layered-liquids, multi-concept]
    stem: A tank contains a 2 m layer of oil (density 800 kg m^{-3}) floating on a 3 m layer of water. Taking g = 10 m s^{-2}, the gauge pressure at the bottom of the tank is
    options:
      - 3.0 × 10^4 Pa
      - 5.0 × 10^4 Pa
      - 4.6 × 10^4 Pa
      - 4.0 × 10^4 Pa
    answer: 2
    explanation: P_g = 800 × 10 × 2 + 1000 × 10 × 3 = 16000 + 30000 = 4.6 × 10^4 Pa. Treating the whole 5 m as water gives 5.0 × 10^4 Pa.

  - id: phy-mpf-015
    topic: pressure-depth
    subtopic: Pressure–depth graph
    concept: P versus h is a straight line with intercept P_a and slope ρg
    category: concept
    format: graph
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [graph]
    stem: For a liquid at rest in an open container, the graph of absolute pressure P (y-axis) against depth h below the free surface (x-axis) is
    options:
      - a straight line through the origin with slope ρg
      - a parabola with vertex at the origin
      - a horizontal straight line at P = P_a
      - a straight line with positive intercept P_a and slope ρg
    answer: 3
    explanation: P = P_a + ρgh is linear in h. At h = 0 the pressure is P_a (not zero), so the line has a positive intercept. A line through the origin describes gauge pressure, not absolute pressure.

  - id: phy-mpf-016
    topic: pressure-depth
    subtopic: Pressure on a diver
    concept: Absolute pressure in atmospheres at depth
    category: numerical
    format: direct
    difficulty: 3
    time: 50
    ncert: false
    battle: true
    formula: P = P_a + ρgh
    tags: [hydrostatic-pressure]
    stem: A diver is 20 m below the surface of a lake. Taking P_a = 1.0 × 10^5 Pa and g = 10 m s^{-2}, the total pressure on the diver is about
    options:
      - 1 atm
      - 2 atm
      - 20 atm
      - 3 atm
    answer: 3
    explanation: ρgh = 1000 × 10 × 20 = 2 × 10^5 Pa = 2 atm; adding the atmospheric 1 atm gives 3 atm. Forgetting the air above gives 2 atm.

  - id: phy-mpf-017
    topic: pressure-depth
    subtopic: Force on a side wall
    concept: Force on a vertical wall uses average pressure ρgh/2
    category: numerical
    format: direct
    difficulty: 4
    time: 100
    ncert: false
    battle: false
    formula: F = ½ρgh^2 w
    tags: [side-wall-force, multi-concept]
    stem: A rectangular tank 2 m wide is filled with water to a depth of 3 m. Ignoring atmospheric pressure and taking g = 10 m s^{-2}, the total force exerted by the water on one 2 m wide vertical wall is
    options:
      - 9.0 × 10^4 N
      - 1.8 × 10^5 N
      - 6.0 × 10^4 N
      - 4.5 × 10^4 N
    answer: 0
    explanation: Gauge pressure rises linearly from 0 at the top to ρgh at the bottom, so the average is ρgh/2. F = (ρgh/2)(h w) = ½ × 1000 × 10 × 9 × 2 = 9.0 × 10^4 N. Using the bottom pressure over the whole wall doubles the answer.

  - id: phy-mpf-018
    topic: pressure-depth
    subtopic: U-tube with two liquids
    concept: Equal pressure at the same level in the same liquid gives ρ_1h_1 = ρ_2h_2
    category: numerical
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    formula: ρ_1h_1 = ρ_2h_2
    tags: [u-tube]
    stem: In a U-tube containing water, oil is poured into one arm. A 10 cm column of oil balances an 8 cm column of water above the interface level. The density of the oil is
    options:
      - 1250 kg m^{-3}
      - 800 kg m^{-3}
      - 900 kg m^{-3}
      - 640 kg m^{-3}
    answer: 1
    explanation: Pressure at the interface level is the same in both arms, so ρ_oil × 10 = 1000 × 8, giving ρ_oil = 800 kg m^{-3}. Inverting the ratio gives 1250.

  - id: phy-mpf-019
    topic: atmospheric-gauge-pressure
    subtopic: Gauge pressure
    concept: Gauge pressure is absolute pressure minus atmospheric pressure
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [gauge-pressure, ncert-line]
    stem: Gauge pressure at a point in a fluid is defined as
    options:
      - the absolute pressure plus the atmospheric pressure
      - the pressure measured only by a mercury barometer
      - the absolute pressure minus the atmospheric pressure
      - the atmospheric pressure at sea level
    answer: 2
    explanation: Gauge pressure P − P_a is the excess of the actual pressure over atmospheric pressure; tyre gauges and manometers read it. At depth h in a liquid it equals ρgh.

  - id: phy-mpf-020
    topic: atmospheric-gauge-pressure
    subtopic: Mercury barometer
    concept: Atmospheric pressure equals ρgh of a 76 cm mercury column
    category: numerical
    format: direct
    difficulty: 2
    time: 40
    ncert: true
    battle: true
    formula: P_a = ρgh
    tags: [barometer, ncert-line]
    stem: A mercury barometer reads 76 cm. With ρ_Hg = 13.6 × 10^3 kg m^{-3} and g = 9.8 m s^{-2}, the atmospheric pressure is about
    options:
      - 1.36 × 10^4 Pa
      - 1.013 × 10^5 Pa
      - 7.6 × 10^4 Pa
      - 1.013 × 10^6 Pa
    answer: 1
    explanation: P_a = ρgh = 13.6 × 10^3 × 9.8 × 0.76 ≈ 1.013 × 10^5 Pa, the value called 1 atm.

  - id: phy-mpf-021
    topic: atmospheric-gauge-pressure
    subtopic: Water barometer
    concept: Height of a water barometer column
    category: numerical
    format: direct
    difficulty: 3
    time: 50
    ncert: false
    battle: true
    formula: h_w = h_{Hg} ρ_{Hg}/ρ_w
    tags: [barometer]
    stem: If water (density 1000 kg m^{-3}) were used instead of mercury (13.6 × 10^3 kg m^{-3}) in a barometer at sea level, the column height would be about
    options:
      - 76 cm
      - 5.6 cm
      - 1.03 m
      - 10.3 m
    answer: 3
    explanation: The same pressure supports a column 13.6 times taller, h = 0.76 × 13.6 ≈ 10.3 m. That impractical height is one reason mercury is used.

  - id: phy-mpf-022
    topic: atmospheric-gauge-pressure
    subtopic: Open-tube manometer
    concept: Gauge pressure from the level difference in a manometer
    category: numerical
    format: direct
    difficulty: 2
    time: 40
    ncert: true
    battle: false
    formula: P − P_a = ρgh
    tags: [manometer]
    stem: An open-tube mercury manometer connected to a gas shows the mercury 20 cm higher in the open arm. With ρ_Hg = 13.6 × 10^3 kg m^{-3} and g = 10 m s^{-2}, the gauge pressure of the gas is
    options:
      - 2.72 × 10^4 Pa
      - 1.28 × 10^5 Pa
      - 2.72 × 10^3 Pa
      - −2.72 × 10^4 Pa
    answer: 0
    explanation: The gas pushes mercury up the open arm, so its pressure exceeds atmospheric by ρgh = 13600 × 10 × 0.2 = 2.72 × 10^4 Pa. The absolute pressure would be about 1.28 × 10^5 Pa, but the question asks for gauge pressure.

  - id: phy-mpf-023
    topic: atmospheric-gauge-pressure
    subtopic: Pressure units
    concept: Common pressure units and their pascal values
    category: factual
    format: match
    difficulty: 3
    time: 60
    ncert: true
    battle: false
    tags: [units, match]
    stem: |-
      Match List I with List II.
      List I: P. 1 atm; Q. 1 bar; R. 1 torr; S. 1 cm of Hg
      List II: 1. 10^5 Pa; 2. about 133 Pa; 3. 1.013 × 10^5 Pa; 4. about 1333 Pa
    options:
      - P-1, Q-3, R-2, S-4
      - P-3, Q-1, R-4, S-2
      - P-3, Q-1, R-2, S-4
      - P-1, Q-3, R-4, S-2
    answer: 2
    explanation: 1 atm = 1.013 × 10^5 Pa, 1 bar = 10^5 Pa (used in meteorology), 1 torr = 1 mm of Hg ≈ 133 Pa, so 1 cm of Hg ≈ 1333 Pa.

  - id: phy-mpf-024
    topic: atmospheric-gauge-pressure
    subtopic: Tilted barometer
    concept: Vertical height of a barometer column stays constant when the tube is tilted
    category: concept
    format: direct
    difficulty: 3
    time: 45
    ncert: false
    battle: true
    tags: [barometer, trap]
    stem: When a mercury barometer tube is tilted from the vertical (its top still above the mercury level), the mercury column
    options:
      - keeps its length but its vertical height falls
      - keeps the same vertical height, so its length along the tube increases
      - keeps both its length and vertical height unchanged
      - rises to a greater vertical height
    answer: 1
    explanation: Atmospheric pressure balances ρgh where h is the vertical height, so h stays 76 cm. In a tilted tube this needs a longer column, length h/cos θ.

  - id: phy-mpf-025
    topic: atmospheric-gauge-pressure
    subtopic: Choice of barometric liquid
    concept: Mercury is used because of high density and low vapour pressure
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: false
    battle: true
    tags: [barometer]
    stem: Mercury is preferred to water as a barometric liquid mainly because it
    options:
      - has a high density and a very low vapour pressure
      - has a low density and wets glass
      - has a high surface tension and high viscosity
      - is a good conductor of heat and electricity
    answer: 0
    explanation: High density keeps the column short (76 cm instead of about 10 m) and low vapour pressure keeps the Torricellian vacuum nearly empty, so the reading is accurate.

  - id: phy-mpf-026
    topic: atmospheric-gauge-pressure
    subtopic: Tyre pressure
    concept: Absolute pressure is gauge plus atmospheric
    category: numerical
    format: direct
    difficulty: 1
    time: 25
    ncert: false
    battle: true
    formula: P = P_g + P_a
    tags: [gauge-pressure]
    stem: A tyre gauge reads 2.0 × 10^5 Pa. If the atmospheric pressure is 1.0 × 10^5 Pa, the absolute pressure of air in the tyre is
    options:
      - 1.0 × 10^5 Pa
      - 2.0 × 10^5 Pa
      - 0.5 × 10^5 Pa
      - 3.0 × 10^5 Pa
    answer: 3
    explanation: A tyre gauge reads gauge pressure, so absolute pressure = 2.0 × 10^5 + 1.0 × 10^5 = 3.0 × 10^5 Pa.

  - id: phy-mpf-027
    topic: buoyancy
    subtopic: Buoyant force
    concept: Buoyant force equals weight of displaced fluid
    category: numerical
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    formula: F_B = ρ_L V g
    tags: [archimedes]
    stem: A body of volume 2 × 10^{-3} m^3 is completely immersed in water. Taking g = 10 m s^{-2}, the buoyant force on it is
    options:
      - 2 N
      - 20 N
      - 200 N
      - 0.2 N
    answer: 1
    explanation: F_B = ρVg = 1000 × 2 × 10^{-3} × 10 = 20 N, the weight of the displaced water.

  - id: phy-mpf-028
    topic: buoyancy
    subtopic: Floating bodies
    concept: Fraction submerged equals ρ_body/ρ_liquid
    category: numerical
    format: direct
    difficulty: 2
    time: 30
    ncert: false
    battle: true
    formula: V_{in}/V = ρ_b/ρ_L
    tags: [flotation]
    stem: A wooden block of density 600 kg m^{-3} floats in water. What fraction of its volume is under water?
    options:
      - 40%
      - 100%
      - 60%
      - 50%
    answer: 2
    explanation: For floating, weight equals buoyant force, ρ_b V g = ρ_w V_{in} g, so V_{in}/V = 600/1000 = 60%. 40% is the fraction above water.

  - id: phy-mpf-029
    topic: buoyancy
    subtopic: Iceberg
    concept: Fraction of floating ice above water
    category: numerical
    format: direct
    difficulty: 2
    time: 30
    ncert: false
    battle: true
    tags: [flotation]
    stem: Ice of density 900 kg m^{-3} floats in fresh water of density 1000 kg m^{-3}. The fraction of the ice volume above the water surface is
    options:
      - 10%
      - 90%
      - 1%
      - 9%
    answer: 0
    explanation: Submerged fraction = 900/1000 = 90%, so 10% of the volume is above water.

  - id: phy-mpf-030
    topic: buoyancy
    subtopic: Relative density by weighing
    concept: Relative density = weight in air / loss of weight in water
    category: numerical
    format: direct
    difficulty: 3
    time: 50
    ncert: false
    battle: true
    formula: RD = W_{air}/(W_{air} − W_{water})
    tags: [relative-density]
    stem: A solid weighs 50 N in air and 40 N when fully immersed in water. Its relative density is
    options:
      - "1.25"
      - "0.8"
      - "4"
      - "5"
    answer: 3
    explanation: Loss of weight = 10 N equals the weight of equal volume of water. RD = 50/10 = 5. Dividing 50 by 40 gives 1.25, a common error.

  - id: phy-mpf-031
    topic: buoyancy
    subtopic: Melting ice
    concept: Floating ice melting in water leaves the level unchanged
    category: application
    format: direct
    difficulty: 3
    time: 45
    ncert: false
    battle: true
    tags: [flotation, trap]
    stem: A cube of pure ice floats in a glass filled with water to the brim. When the ice melts completely, the water
    options:
      - overflows
      - level stays exactly the same
      - level falls
      - level first rises and then falls
    answer: 1
    explanation: Floating ice displaces its own weight of water. On melting it becomes exactly that weight of water, which occupies the displaced volume, so the level is unchanged.

  - id: phy-mpf-032
