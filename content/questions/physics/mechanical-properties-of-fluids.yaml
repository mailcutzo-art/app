      - The volume flow rate is the same in the wide and narrow sections.
    answer: 2
    explanation: For an ideal fluid P + ½ρv^2 (+ ρgh) is the same everywhere along a streamline; in the narrow section kinetic energy per volume rises and pressure falls by the same amount.

