      Consider the statements:
      I. Across a plane liquid surface there is no pressure difference due to surface tension.
      II. Just below the concave water meniscus in a glass capillary, the pressure is less than atmospheric.
      III. Just below the convex mercury meniscus in a glass capillary, the pressure is more than atmospheric.
      IV. Doubling the radius of a drop doubles its excess pressure.
      Which of these are correct?
    options:
      - I and II only
      - II and III only
      - I, II and III only
      - I, II, III and IV
    answer: 2
    explanation: The concave side of a curved surface is at higher pressure. Under a concave water meniscus the liquid is on the convex side, so its pressure is lower than atmospheric (this is why water rises); the opposite holds for mercury. ΔP ∝ 1/r, so IV is wrong.

