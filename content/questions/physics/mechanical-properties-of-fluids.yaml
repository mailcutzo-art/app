    stem: The equation of continuity for an incompressible fluid is a statement of conservation of
    options:
      - energy
      - mass
      - linear momentum
      - angular momentum
    answer: 1
    explanation: What flows in per second must flow out per second, so Av (volume flux) is constant for an incompressible fluid; this is conservation of mass. Bernoulli's equation is the energy statement.

