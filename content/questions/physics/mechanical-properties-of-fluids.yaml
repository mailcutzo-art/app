      - is under greater pressure than interior molecules
    answer: 0
    explanation: An interior molecule is surrounded by neighbours and its attractive (negative) potential energy is maximal in magnitude. A surface molecule has only about half its neighbours, so energy is needed to bring it to the surface; this is surface energy.

