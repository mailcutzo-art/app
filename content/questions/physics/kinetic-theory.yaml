    options:
      - 4/3
      - 127/27
      - 3/4
      - "2"
    answer: 0
    explanation: "At constant volume P ∝ T (absolute). P_2/P_1 = 400/300 = 4/3. Using Celsius temperatures gives the incorrect 127/27."

  - id: phy-kt-031
    topic: pressure-kinetic
    subtopic: Pressure formula
    concept: P = (1/3)nmv_{rms}^2 proportionality
    category: application
    format: direct
    difficulty: 3
    time: 45
    ncert: true
    battle: true
    formula: P = (1/3)nmv_{rms}^2
