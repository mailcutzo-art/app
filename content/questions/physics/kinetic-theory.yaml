questions:
  - id: phy-kt-001
    topic: molecular-nature
    subtopic: Avogadro's hypothesis
    concept: Equal volumes of gases at same T and P contain equal numbers of molecules
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [avogadro, ncert-line]
    stem: According to Avogadro's hypothesis, equal volumes of all gases at the same temperature and pressure contain equal
    options:
      - masses
      - numbers of molecules
      - numbers of atoms
      - densities
    answer: 1
    explanation: "Avogadro's hypothesis states that equal volumes of all gases at equal temperature and pressure have the same number of molecules. The number of atoms differs because molecules can be mono-, di- or polyatomic, and masses differ because molecular masses differ."

  - id: phy-kt-002
    topic: molecular-nature
    subtopic: History of atomic hypothesis
    concept: Kanada proposed the atomic hypothesis in ancient India
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [history, ncert-line]
    stem: Which ancient Indian thinker is credited with proposing that matter is made of indivisible atoms?
    options:
      - Kanada
      - Aryabhata
      - Bhaskara
      - Charaka
    answer: 0
    explanation: "NCERT notes that the atomic hypothesis was proposed by Kanada in India and Democritus in Greece. Aryabhata and Bhaskara were astronomer-mathematicians, and Charaka was a physician."

  - id: phy-kt-003
    topic: gas-laws
    subtopic: Ideal gas equation
    concept: Pressure from PV = nRT
    category: numerical
    format: direct
    difficulty: 2
    time: 40
    ncert: true
    battle: false
    formula: PV = nRT
    tags: [ideal-gas-equation]
    stem: Two moles of an ideal gas occupy 0.0249 m^3 at 300 K. What is the pressure of the gas? (R = 8.31 J mol^{-1} K^{-1})
    options:
      - 1.0 × 10^5 Pa
      - 2.0 × 10^5 Pa
      - 4.0 × 10^5 Pa
      - 2.0 × 10^3 Pa
    answer: 1
    explanation: "P = nRT/V = (2 × 8.31 × 300)/0.0249 = 4986/0.0249 ≈ 2.0 × 10^5 Pa."

  - id: phy-kt-004
    topic: pressure-kinetic
    subtopic: Pressure in terms of density
    concept: P = (1/3)ρv_{rms}^2
    category: numerical
    format: direct
    difficulty: 2
    time: 40
    ncert: true
    battle: true
    formula: P = (1/3)ρv_{rms}^2
    tags: [pressure-formula]
    stem: A gas of density 1.5 kg m^{-3} has rms molecular speed 400 m s^{-1}. What pressure does it exert?
    options:
      - 2.4 × 10^5 Pa
      - 4.0 × 10^4 Pa
      - 1.2 × 10^5 Pa
      - 8.0 × 10^4 Pa
    answer: 3
    explanation: "P = (1/3)ρv_{rms}^2 = (1/3)(1.5)(400)^2 = 0.5 × 1.6 × 10^5 = 8.0 × 10^4 Pa. Forgetting the factor 1/3 gives 2.4 × 10^5 Pa."

  - id: phy-kt-005
    topic: kinetic-temperature
    subtopic: Average KE and temperature
    concept: Average translational KE per molecule depends only on temperature
    category: concept
    format: direct
    difficulty: 2
    time: 25
    ncert: true
    battle: true
    tags: [average-kinetic-energy, trap]
    stem: Hydrogen and oxygen gases are at the same temperature. The ratio of the average translational kinetic energy per molecule of H_2 to that of O_2 is
    options:
      - "1 : 16"
      - "4 : 1"
      - "1 : 1"
      - "16 : 1"
    answer: 2
    explanation: "Average translational KE per molecule is (3/2)kT, which depends only on absolute temperature, not on molecular mass. So the ratio is 1 : 1. The ratio 4 : 1 applies to rms speeds, not to energies."

  - id: phy-kt-006
    topic: kinetic-temperature
    subtopic: Average KE and temperature
    concept: Average KE per molecule = (3/2)kT at 300 K
    category: numerical
    format: direct
    difficulty: 2
    time: 40
    ncert: true
    battle: false
    formula: E_{avg} = (3/2)kT
    tags: [average-kinetic-energy]
    stem: What is the average translational kinetic energy of a gas molecule at 300 K? (k = 1.38 × 10^{-23} J K^{-1})
    options:
      - 4.14 × 10^{-21} J
      - 6.21 × 10^{-21} J
      - 1.24 × 10^{-20} J
      - 2.07 × 10^{-21} J
    answer: 1
    explanation: "E = (3/2)kT = 1.5 × 1.38 × 10^{-23} × 300 = 6.21 × 10^{-21} J. The value 4.14 × 10^{-21} J is just kT, which misses the factor 3/2."

  - id: phy-kt-007
    topic: molecular-speeds
    subtopic: RMS speed and molar mass
    concept: v_{rms} ∝ 1/√M at the same temperature
    category: numerical
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    formula: v_{rms} = √(3RT/M)
    tags: [rms-speed]
    stem: What is the ratio of the rms speed of hydrogen molecules to that of oxygen molecules at the same temperature?
    options:
      - "16 : 1"
      - "1 : 4"
      - "1 : 16"
      - "4 : 1"
    answer: 3
    explanation: "v_{rms} = √(3RT/M), so v_H/v_O = √(M_O/M_H) = √(32/2) = 4. Hydrogen, being lighter, moves 4 times faster. 16 : 1 forgets the square root."

  - id: phy-kt-008
    topic: kinetic-temperature
    subtopic: RMS speed and temperature
    concept: Doubling v_{rms} needs four times the absolute temperature
    category: numerical
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    formula: v_{rms} ∝ √T
    tags: [rms-speed, trap]
    stem: A gas is at 27 °C. To what temperature must it be heated to double the rms speed of its molecules?
    options:
      - 54 °C
      - 327 °C
      - 927 °C
      - 1200 °C
    answer: 2
    explanation: "v_{rms} ∝ √T, so doubling the speed needs T to become 4 times: 4 × 300 K = 1200 K = 927 °C. The option 1200 °C forgets to convert back from kelvin, and 54 °C wrongly doubles the Celsius temperature."

  - id: phy-kt-009
    topic: equipartition
    subtopic: Degrees of freedom of diatomic molecules
    concept: Rigid diatomic molecule has 5 degrees of freedom
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [degrees-of-freedom]
    stem: How many degrees of freedom does a rigid diatomic molecule such as O_2 have at moderate temperatures?
    options:
      - "3"
      - "5"
      - "6"
      - "7"
    answer: 1
    explanation: "A rigid diatomic molecule has 3 translational and 2 rotational degrees of freedom, a total of 5. Rotation about the molecular axis is not counted, and vibration is frozen at moderate temperatures (it would bring the total to 7)."

  - id: phy-kt-010
    topic: gas-specific-heats
    subtopic: Ratio of specific heats
    concept: γ = 5/3 for a monatomic gas
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [gamma]
    stem: What is the ratio of specific heats γ = C_p/C_v for a monatomic ideal gas?
    options:
      - 4/3
      - 9/7
      - 7/5
      - 5/3
    answer: 3
    explanation: "For a monatomic gas C_v = (3/2)R and C_p = (5/2)R, so γ = 5/3 ≈ 1.67. The value 7/5 belongs to a rigid diatomic gas."

  - id: phy-kt-011
    topic: mean-free-path
    subtopic: Dependence on molecular diameter
    concept: Mean free path ∝ 1/d^2
    category: concept
    format: direct
    difficulty: 2
    time: 25
    ncert: true
    battle: true
    formula: l = 1/(√2 nπd^2)
    tags: [mean-free-path]
    stem: If the diameter of gas molecules were doubled with number density unchanged, the mean free path would become
    options:
      - half
      - one-fourth
      - double
      - unchanged
    answer: 1
    explanation: "l = 1/(√2 nπd^2), so l ∝ 1/d^2. Doubling d makes the mean free path one-fourth. Choosing half forgets that d appears squared (the collision cross-section is πd^2)."

  - id: phy-kt-012
    topic: gas-laws
    subtopic: Boyle's law
    concept: PV constant at constant temperature
    category: numerical
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    formula: P_1V_1 = P_2V_2
    tags: [boyles-law]
    stem: A gas occupies 2 L at 1 atm. It is compressed isothermally to 0.5 L. What is the new pressure?
    options:
      - 0.25 atm
      - 2 atm
      - 8 atm
      - 4 atm
    answer: 3
    explanation: "Boyle's law gives P_2 = P_1V_1/V_2 = (1 × 2)/0.5 = 4 atm. Volume became one-fourth, so pressure becomes four times."

  - id: phy-kt-013
    topic: gas-laws
    subtopic: Charles' law
    concept: V ∝ T at constant pressure
    category: numerical
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    formula: V_1/T_1 = V_2/T_2
    tags: [charles-law]
    stem: A gas occupies 2 L at 300 K. At constant pressure, what volume does it occupy at 450 K?
    options:
      - 1.33 L
      - 3 L
      - 4.5 L
      - 2.25 L
    answer: 1
    explanation: "At constant pressure V ∝ T, so V_2 = 2 × 450/300 = 3 L. Inverting the ratio gives 1.33 L, which would be a contraction on heating."

  - id: phy-kt-014
    topic: gas-laws
    subtopic: Dalton's law of partial pressures
    concept: Partial pressure = mole fraction × total pressure
    category: numerical
    format: direct
    difficulty: 2
    time: 35
    ncert: true
    battle: true
    formula: p_i = x_iP
    tags: [dalton-law, partial-pressure]
    stem: A container holds 2 mol of N_2 and 3 mol of O_2 at a total pressure of 10 atm. What is the partial pressure of O_2?
    options:
      - 4 atm
      - 5 atm
      - 3.3 atm
      - 6 atm
    answer: 3
    explanation: "Mole fraction of O_2 = 3/5, so p = (3/5) × 10 = 6 atm. 4 atm is the partial pressure of N_2."

  - id: phy-kt-015
    topic: pressure-kinetic
    subtopic: Origin of gas pressure
    concept: Gas pressure arises from momentum transfer in wall collisions
    category: concept
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [pressure-origin]
    stem: According to kinetic theory, the pressure exerted by a gas on the walls of its container is due to
    options:
      - the change in momentum of molecules colliding with the walls
      - the attraction between gas molecules and wall atoms
      - the weight of the gas molecules
      - collisions of gas molecules with one another
    answer: 0
    explanation: "Molecules hitting a wall reverse the normal component of their momentum; the rate of momentum transfer per unit area is the pressure. Intermolecular collisions do not change the total momentum delivered to the wall in equilibrium."

  - id: phy-kt-016
    topic: pressure-kinetic
    subtopic: Pressure and kinetic energy density
    concept: P = (2/3) × translational KE per unit volume
    category: numerical
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    formula: P = (2/3)E/V
    tags: [energy-density]
    stem: The translational kinetic energy per unit volume of a gas is 1.5 × 10^5 J m^{-3}. What is its pressure?
    options:
      - 1.0 × 10^5 Pa
      - 2.25 × 10^5 Pa
      - 1.5 × 10^5 Pa
      - 0.5 × 10^5 Pa
    answer: 0
    explanation: "From kinetic theory PV = (2/3)E, so P = (2/3)(E/V) = (2/3) × 1.5 × 10^5 = 1.0 × 10^5 Pa. Using 3/2 instead of 2/3 gives 2.25 × 10^5 Pa."

  - id: phy-kt-017
    topic: molecular-speeds
    subtopic: RMS speed calculation
    concept: v_{rms} of N_2 at 300 K
    category: numerical
    format: direct
    difficulty: 3
    time: 60
    ncert: true
    battle: false
    formula: v_{rms} = √(3RT/M)
    tags: [rms-speed, trap]
    stem: What is the rms speed of nitrogen molecules (M = 28 g mol^{-1}) at 27 °C? (R = 8.31 J mol^{-1} K^{-1})
    options:
      - 422 m s^{-1}
      - 476 m s^{-1}
      - 517 m s^{-1}
      - 16.3 m s^{-1}
    answer: 2
    explanation: "v_{rms} = √(3RT/M) = √(3 × 8.31 × 300/0.028) = √(2.67 × 10^5) ≈ 517 m s^{-1}. 422 and 476 m s^{-1} are the most probable and average speeds; 16.3 m s^{-1} results from using M = 28 instead of 0.028 kg mol^{-1}."

  - id: phy-kt-018
    topic: equipartition
    subtopic: Law of equipartition
    concept: Each quadratic degree of freedom has ½kT per molecule
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [equipartition, ncert-line]
    stem: According to the law of equipartition of energy, the average energy associated with each degree of freedom of a molecule in thermal equilibrium at temperature T is
    options:
      - kT
      - (3/2)kT
      - ½RT per molecule
      - ½kT
    answer: 3
    explanation: "Each translational or rotational degree of freedom contributes ½kT per molecule (½RT per mole). A vibrational mode contributes kT because it has both kinetic and potential energy terms, and (3/2)kT is the total for three translational degrees."

  - id: phy-kt-019
    topic: gas-specific-heats
    subtopic: Molar specific heat of diatomic gas
    concept: C_v = (5/2)R for a rigid diatomic gas
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    formula: C_v = (f/2)R
    tags: [molar-specific-heat]
    stem: What is the molar specific heat at constant volume of a rigid diatomic ideal gas?
    options:
      - (5/2)R
      - (3/2)R
      - (7/2)R
      - 3R
    answer: 0
    explanation: "With 5 degrees of freedom, U = (5/2)RT per mole, so C_v = dU/dT = (5/2)R. (7/2)R is its C_p, or C_v when vibration is also excited."

  - id: phy-kt-020
    topic: gas-specific-heats
    subtopic: Specific heat of solids
    concept: Dulong–Petit law C = 3R
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [solids, dulong-petit]
    stem: By the law of equipartition, the molar specific heat of a solid at ordinary temperatures is approximately
    options:
      - (3/2)R
      - R
      - 3R
      - 9R
    answer: 2
    explanation: "Each atom of a solid oscillates in 3 directions; each mode has energy kT (kinetic plus potential). So U = 3RT per mole and C = 3R ≈ 25 J mol^{-1} K^{-1} (Dulong–Petit law)."

  - id: phy-kt-021
    topic: mean-free-path
    subtopic: Mean free path calculation
    concept: l = 1/(√2 nπd^2) with given n and d
    category: numerical
    format: direct
    difficulty: 4
    time: 100
    ncert: true
    battle: false
    formula: l = 1/(√2 nπd^2)
    tags: [mean-free-path, trap]
    stem: A gas has 2.7 × 10^{25} molecules per m^3 and molecular diameter 3 × 10^{-10} m. What is the mean free path of its molecules?
    options:
      - 1.3 × 10^{-7} m
      - 3.1 × 10^{-8} m
      - 9.3 × 10^{-8} m
      - 9.3 × 10^{-10} m
    answer: 2
    explanation: "l = 1/(√2 nπd^2) = 1/(1.414 × 2.7 × 10^{25} × 3.14 × 9 × 10^{-20}) = 1/(1.08 × 10^7) ≈ 9.3 × 10^{-8} m. Omitting the √2 factor (which accounts for the relative motion of all molecules) gives 1.3 × 10^{-7} m."

  - id: phy-kt-022
    topic: molecular-nature
    subtopic: Laws of chemical combination
    concept: Gay-Lussac's law of combining gaseous volumes
    category: factual
    format: direct
    difficulty: 2
    time: 25
    ncert: true
    battle: true
    tags: [gay-lussac, ncert-line]
    stem: The law stating that gases combining chemically to give another gas do so in volumes bearing a simple integer ratio is known as
    options:
      - Gay-Lussac's law of gaseous volumes
      - Dalton's law of partial pressures
      - Boyle's law
      - the law of definite proportions
    answer: 0
    explanation: "Gay-Lussac's law says that combining gaseous volumes (and the product volume, if gaseous) are in small whole-number ratios, e.g. 2 volumes of H_2 with 1 volume of O_2 give 2 volumes of steam. The law of definite proportions concerns masses, not volumes."

  - id: phy-kt-023
    topic: pressure-kinetic
    subtopic: Assumptions of kinetic theory
    concept: Ideal gas molecules have no intermolecular forces except during collisions
    category: concept
    format: statements
    difficulty: 2
    time: 35
    ncert: true
    battle: false
    tags: [assumptions]
    stem: Which of the following is NOT an assumption of the kinetic theory of an ideal gas?
    options:
      - Molecules are in constant random motion.
      - Collisions between molecules and with the walls are elastic.
      - Molecules exert strong attractive forces on one another between collisions.
      - The size of a molecule is negligible compared with the average distance between molecules.
    answer: 2
    explanation: "Kinetic theory assumes no intermolecular forces except during the brief collisions, so molecules move in straight lines between collisions. Strong attraction would make the gas deviate from ideal behaviour, as real gases do at high pressure and low temperature."

  - id: phy-kt-024
    topic: kinetic-temperature
    subtopic: Temperature from energy
    concept: T for which (3/2)kT = 1 eV
    category: numerical
    format: direct
    difficulty: 3
    time: 60
    ncert: false
    battle: false
    formula: (3/2)kT = E
    tags: [average-kinetic-energy, trap]
    stem: At what temperature is the average translational kinetic energy of a gas molecule equal to 1 eV? (k = 1.38 × 10^{-23} J K^{-1}, 1 eV = 1.6 × 10^{-19} J)
    options:
      - 1.16 × 10^4 K
      - 3.9 × 10^3 K
      - 7.7 × 10^3 K
      - 5.8 × 10^3 K
    answer: 2
    explanation: "T = 2E/(3k) = (2 × 1.6 × 10^{-19})/(3 × 1.38 × 10^{-23}) ≈ 7.7 × 10^3 K. Setting kT = 1 eV gives 1.16 × 10^4 K, which ignores the factor 3/2."

  - id: phy-kt-025
    topic: gas-laws
    subtopic: Number density
    concept: n = P/kT gives Loschmidt number at STP
    category: numerical
    format: direct
    difficulty: 3
    time: 60
    ncert: true
    battle: false
    formula: P = nkT
    tags: [number-density]
    stem: How many molecules are there in 1 m^3 of an ideal gas at STP (1.013 × 10^5 Pa, 273 K)? (k = 1.38 × 10^{-23} J K^{-1})
    options:
      - 6.02 × 10^{23}
      - 2.69 × 10^{25}
      - 2.69 × 10^{22}
      - 4.46 × 10^1
    answer: 1
    explanation: "n = P/(kT) = 1.013 × 10^5/(1.38 × 10^{-23} × 273) ≈ 2.69 × 10^{25} m^{-3}. 6.02 × 10^{23} is the number in one mole (22.4 L), and 44.6 is the number of moles in 1 m^3."

  - id: phy-kt-026
    topic: molecular-speeds
    subtopic: Comparison of molecular speeds
    concept: v_{rms} > v_{avg} > v_{mp}
    category: concept
    format: ordering
    difficulty: 2
    time: 30
    ncert: false
    battle: true
    tags: [molecular-speeds]
    stem: For the molecules of a gas at a given temperature, which order of the rms speed, average speed and most probable speed is correct?
    options:
      - v_{mp} > v_{avg} > v_{rms}
      - v_{avg} > v_{rms} > v_{mp}
      - v_{rms} > v_{mp} > v_{avg}
      - v_{rms} > v_{avg} > v_{mp}
    answer: 3
    explanation: "v_{rms} = √(3RT/M), v_{avg} = √(8RT/πM) and v_{mp} = √(2RT/M). Since 3 > 8/π ≈ 2.55 > 2, v_{rms} > v_{avg} > v_{mp}."

  - id: phy-kt-027
    topic: equipartition
    subtopic: Internal energy of monatomic gas
    concept: U = (3/2)RT per mole for a monatomic gas
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [internal-energy]
    stem: What is the internal energy of one mole of a monatomic ideal gas at absolute temperature T?
    options:
      - (5/2)RT
      - 3RT
      - (3/2)kT
      - (3/2)RT
    answer: 3
    explanation: "A monatomic molecule has only 3 translational degrees of freedom, so U = 3 × ½RT = (3/2)RT per mole. (3/2)kT is the energy per molecule, not per mole."

  - id: phy-kt-028
    topic: gas-specific-heats
    subtopic: Mayer's relation per unit mass
    concept: c_p − c_v = R/M per unit mass
    category: application
    format: direct
    difficulty: 3
    time: 50
    ncert: false
    battle: false
    formula: c_p − c_v = R/M
    tags: [mayer-relation, trap]
    stem: For hydrogen, the difference between the specific heats (per kg) c_p − c_v = a, and for oxygen it is b. What is a/b?
    options:
      - "16"
      - "1/16"
      - "4"
      - "1"
    answer: 0
    explanation: "Per mole C_p − C_v = R for any ideal gas, but per unit mass c_p − c_v = R/M. So a/b = M_O/M_H = 32/2 = 16. Answering 1 wrongly uses the molar relation."

  - id: phy-kt-029
    topic: mean-free-path
    subtopic: Dependence on pressure
    concept: At constant T, mean free path ∝ 1/P
    category: concept
    format: direct
    difficulty: 2
    time: 25
    ncert: true
    battle: true
    formula: l = kT/(√2πd^2P)
    tags: [mean-free-path]
    stem: The pressure of a gas is doubled at constant temperature. Its mean free path
    options:
      - doubles
      - halves
      - stays the same
      - becomes four times
    answer: 1
    explanation: "At constant T, doubling P doubles the number density n = P/kT. Since l ∝ 1/n, the mean free path halves."

  - id: phy-kt-030
    topic: gas-laws
    subtopic: Gay-Lussac's (pressure) law
    concept: P ∝ T at constant volume, with T in kelvin
    category: numerical
