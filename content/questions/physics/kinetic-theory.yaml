      - It relates viscosity, conductivity and diffusion to molecular parameters.
      - It predicts that all gases have the same molar specific heat regardless of atomicity.
    answer: 3
    explanation: "Kinetic theory with equipartition predicts different C_v for monatomic (3/2 R), diatomic (5/2 R) and polyatomic gases, in agreement with experiment. The other three are genuine achievements listed in NCERT."

