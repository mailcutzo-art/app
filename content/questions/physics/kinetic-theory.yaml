    stem: If the mass of each gas molecule is doubled and the rms speed is halved, with number density unchanged, the pressure becomes
    options:
      - double
      - half
      - unchanged
      - one-fourth
    answer: 1
    explanation: "P = (1/3)nmv_{rms}^2 ∝ m v_{rms}^2 = 2 × (1/2)^2 = 1/2. The pressure is halved."

  - id: phy-kt-032
    topic: kinetic-temperature
