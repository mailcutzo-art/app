    explanation: "Any bound system is lighter than its separated parts by E_b/c^2. For hydrogen E_b = 13.6 eV, so the atom is lighter by 13.6 eV/c^2 (about 1.5 × 10^{-8} u). This is the atomic analogue of the nuclear mass defect."

