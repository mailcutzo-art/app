    answer: 3
    explanation: "Both nuclei are positively charged, so they must approach within the range of the nuclear force (a few fm) against the Coulomb barrier. Only at temperatures of order 10^{7} K do enough nuclei have the energy to do so; temperature does not change the nuclear force itself."

