  - id: phy-nuc-258
    topic: nuclear-reactions-q-value
    subtopic: Q from binding energies
    concept: Q equals the change in total binding energy because nucleon masses cancel
    category: concept
    format: assertion-reason
    difficulty: 4
    time: 80
    ncert: false
    battle: false
    tags: [q-value, binding-energy, multi-concept]
    stem: |-
      Assertion (A): The Q-value of a nuclear reaction equals the total binding energy of the products minus the total binding energy of the reactants.
      Reason (R): Protons and neutrons are separately conserved in such reactions, so the masses of the free nucleons cancel when the mass difference is written using mass defects.
    options:
      - Both A and R are true but R is not the correct explanation of A
      - A is true but R is false
      - A is false but R is true
      - Both A and R are true and R is the correct explanation of A
    answer: 3
    explanation: "Each nuclear mass is (mass of its free nucleons − E_b/c^2). With the same Z protons and N neutrons on both sides, the free-nucleon masses cancel in Σm_i − Σm_f, leaving Q = ΣE_b(products) − ΣE_b(reactants). R explains A."

