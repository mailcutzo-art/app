  - id: phy-mps-399
    topic: applications
    subtopic: Rope with safety factor
    concept: Minimum rope radius with a safety factor
    category: numerical
    format: direct
    difficulty: 4
    time: 80
    ncert: true
    battle: false
    formula: πr^2 σ_y = (safety factor) × Mg
    tags: [crane, safety-factor, multi-concept]
    stem: A crane rope must lift 5000 kg. The yield strength of steel is 3 × 10^8 N m^{-2}, and a safety factor of 4 is used. Taking g = 10 m s^{-2}, the minimum radius of the rope is about
    options:
      - 0.7 cm
      - 3 cm
      - 2.1 cm
      - 1.5 cm
    answer: 3
    explanation: Design load = 4 × 5000 × 10 = 2 × 10^5 N. A = 2 × 10^5/3 × 10^8 ≈ 6.7 × 10^{-4} m^2. r = √(A/π) ≈ √(2.1 × 10^{-4}) ≈ 1.46 × 10^{-2} m ≈ 1.5 cm. Without the safety factor it would be about 0.7 cm.

