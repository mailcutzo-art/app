questions:
  - id: phy-mps-001
    topic: elasticity-plasticity
    subtopic: Elasticity
    concept: Definition of elasticity
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [elasticity, ncert-line]
    stem: The property of a body by which it tends to regain its original size and shape when the deforming force is removed is called
    options:
      - plasticity
      - elasticity
      - ductility
      - malleability
    answer: 1
    explanation: Elasticity is the property of regaining original size and shape on removal of the deforming force. Plasticity is the opposite behaviour, where the deformation stays after the force is removed.

  - id: phy-mps-002
    topic: elasticity-plasticity
    subtopic: Plasticity
    concept: Putty and mud are close to ideal plastics
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [plasticity, ncert-line]
    stem: Which of the following is closest to an ideal plastic body?
    options:
      - Quartz fibre
      - Steel wire
      - Putty
      - Rubber band
    answer: 2
    explanation: NCERT cites putty and mud as close to ideal plastics; they show no tendency to regain their shape. Quartz fibre and steel are highly elastic, and a rubber band regains its length.

  - id: phy-mps-003
    topic: elasticity-plasticity
    subtopic: Rigid body
    concept: A rigid body keeps interparticle distances fixed
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [rigid-body]
    stem: An ideal rigid body is one in which
    options:
      - the body is perfectly plastic
      - Young's modulus is zero
      - small forces cause permanent deformation
      - the separation between any two particles never changes under applied forces
    answer: 3
    explanation: A rigid body is an idealisation in which no applied force changes the distance between its particles, so it does not deform at all. Real bodies always deform to some extent; a rigid body would have infinite, not zero, modulus.

  - id: phy-mps-004
    topic: elasticity-plasticity
    subtopic: Microscopic view
    concept: Restoring force comes from change in interatomic separation
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [spring-ball-model, interatomic-forces]
    stem: In the spring–ball model of a solid, the restoring force on deformation arises because
    options:
      - gravity pulls the atoms back to their places
      - atoms are displaced from their equilibrium separations
      - nuclear forces act between neighbouring atoms
      - atoms lose their magnetic alignment
    answer: 1
    explanation: When a solid is deformed, atoms are displaced from their equilibrium positions, changing interatomic separations; the interatomic (spring-like) forces then pull them back. These are electromagnetic in origin, not gravitational or nuclear.

  - id: phy-mps-005
    topic: elasticity-plasticity
    subtopic: Perfectly elastic body
    concept: Quartz fibre is nearly perfectly elastic
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: false
    battle: true
    tags: [perfectly-elastic]
    stem: Which of the following is the nearest approach to a perfectly elastic body?
    options:
      - Wax
      - Clay
      - Quartz fibre
      - Putty
    answer: 2
    explanation: Quartz fibre regains its shape almost exactly and is treated as the nearest approach to a perfectly elastic body. Wax, clay and putty are largely plastic.

  - id: phy-mps-006
    topic: elasticity-plasticity
    subtopic: Comparing elasticity
    concept: Steel is more elastic than rubber
    category: concept
    format: assertion-reason
    difficulty: 3
    time: 45
    ncert: true
    battle: false
    tags: [trap, steel-vs-rubber]
    stem: |-
      Assertion (A): Steel is more elastic than rubber.
      Reason (R): For the same stress, the strain produced in steel is much smaller than that in rubber.
    options:
      - Both A and R are true and R is the correct explanation of A
      - Both A and R are true but R is not the correct explanation of A
      - A is true but R is false
      - A is false but R is true
    answer: 0
    explanation: Elasticity is measured by the modulus, stress/strain. Steel shows a far smaller strain for the same stress, so its Young's modulus is much larger and it is more elastic. The everyday idea that rubber is 'more elastic' confuses stretchability with elasticity.

  - id: phy-mps-007
    topic: elasticity-plasticity
    subtopic: Elastic limit
    concept: Meaning of elastic limit
    category: concept
    format: statements
    difficulty: 3
    time: 45
    ncert: true
    battle: false
    tags: [elastic-limit]
    stem: Which of the following statements is correct?
    options:
      - The elastic limit is the maximum stress up to which a body fully regains its original dimensions on unloading
      - A body that has undergone plastic deformation fully recovers its shape on unloading
      - Plasticity is the tendency of a body to regain its original shape
      - Elastic behaviour is shown only by metals
    answer: 0
    explanation: Up to the elastic limit, removing the load restores the original dimensions. Plastic deformation is permanent by definition, and elasticity (not plasticity) is the tendency to recover; non-metals like rubber and bone are also elastic.

  - id: phy-mps-008
    topic: stress-strain
    subtopic: Stress
    concept: Stress is restoring force per unit area
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [stress, ncert-line]
    stem: Stress is defined as the
    options:
      - applied force per unit length
      - change in length per unit length
      - restoring force per unit area
      - restoring force per unit volume
    answer: 2
    explanation: Stress is the restoring force per unit area, which in equilibrium equals the magnitude of the applied force per unit area. Change in length per unit length is strain.

  - id: phy-mps-009
    topic: stress-strain
    subtopic: Dimensions of stress
    concept: Dimensional formula of stress
    category: factual
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    formula: stress = F/A
    tags: [dimensions, stress]
    stem: The dimensional formula of stress is
    options:
      - M L T^{-2}
      - M L^{-1} T^{-2}
      - M L^2 T^{-2}
      - M^0 L^0 T^0
    answer: 1
    explanation: Stress = force/area = M L T^{-2}/L^2 = M L^{-1} T^{-2}, the same as pressure. M L T^{-2} is force itself and M^0 L^0 T^0 is strain.

  - id: phy-mps-010
    topic: stress-strain
    subtopic: Strain
    concept: Strain is a dimensionless ratio
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [strain, units]
    stem: The SI unit of strain is
    options:
      - N m^{-2}
      - metre
      - none, as it is a ratio of similar quantities
      - N m
    answer: 2
    explanation: Strain is change in dimension divided by original dimension (for example ΔL/L), a ratio of two lengths, so it has no unit and no dimensions. N m^{-2} is the unit of stress.

  - id: phy-mps-011
    topic: stress-strain
    subtopic: Calculating stress
    concept: Stress = F/A with area in mm² converted to m²
    category: numerical
    format: direct
    difficulty: 2
    time: 35
    ncert: true
    battle: true
    formula: stress = F/A
    tags: [stress, unit-conversion]
    stem: A force of 200 N is applied on a wire of cross-sectional area 2 mm^2. The tensile stress in the wire is
    options:
      - 10^6 N m^{-2}
      - 10^7 N m^{-2}
      - 10^8 N m^{-2}
      - 10^{10} N m^{-2}
    answer: 2
    explanation: A = 2 mm^2 = 2 × 10^{-6} m^2, so stress = 200/(2 × 10^{-6}) = 10^8 N m^{-2}. Forgetting that 1 mm^2 = 10^{-6} m^2 (not 10^{-3}) gives the wrong power of ten.

  - id: phy-mps-012
    topic: stress-strain
    subtopic: Longitudinal strain
    concept: Longitudinal strain = ΔL/L
    category: numerical
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    formula: strain = ΔL/L
    tags: [strain]
    stem: A wire 2 m long is stretched by 1 mm. The longitudinal strain is
    options:
      - 5 × 10^{-4}
      - 2 × 10^{-3}
      - 5 × 10^{-3}
      - 5 × 10^{-2}
    answer: 0
    explanation: Strain = ΔL/L = (1 × 10^{-3} m)/(2 m) = 5 × 10^{-4}. Keep both lengths in the same unit before dividing.

  - id: phy-mps-013
    topic: stress-strain
    subtopic: Shearing stress
    concept: Tangential force per unit area is shearing stress
    category: concept
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [shearing-stress]
    stem: When the deforming force acts parallel (tangentially) to the surface of a body, the stress produced is called
    options:
      - tensile stress
      - compressive stress
      - shearing stress
      - hydraulic stress
    answer: 2
    explanation: A tangential force per unit area produces shearing (tangential) stress. Tensile and compressive stresses come from forces normal to the cross-section; hydraulic stress is a uniform normal pressure from all sides.

  - id: phy-mps-014
    topic: stress-strain
    subtopic: Hydraulic stress
    concept: Uniform pressure from all sides produces hydraulic stress
    category: concept
    format: direct
    difficulty: 2
    time: 25
    ncert: true
    battle: true
    tags: [hydraulic-stress, ncert-line]
    stem: A solid sphere placed deep inside water experiences a uniform pressure from all sides. The stress in it is called
    options:
      - longitudinal stress
      - hydraulic stress
      - shearing stress
      - tensile stress
    answer: 1
    explanation: A body subjected to uniform normal force from all sides by a fluid experiences hydraulic stress, equal in magnitude to the hydraulic pressure. It changes volume without changing shape.

  - id: phy-mps-015
    topic: stress-strain
    subtopic: Types of strain
    concept: Defining expressions of different strains
    category: factual
    format: match
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [strain-types]
    stem: |-
      Match List I (type of strain) with List II (expression).
      List I: P. Longitudinal strain; Q. Shearing strain; R. Volume strain; S. Lateral strain
      List II: 1. ΔV/V; 2. Δx/L; 3. ΔL/L; 4. Δd/d
    options:
      - P-1, Q-2, R-3, S-4
      - P-3, Q-4, R-1, S-2
      - P-2, Q-3, R-1, S-4
      - P-3, Q-2, R-1, S-4
    answer: 3
    explanation: Longitudinal strain is ΔL/L, shearing strain is the relative sideways displacement Δx/L (= tan θ), volume strain is ΔV/V, and lateral strain is the fractional change in diameter Δd/d.

  - id: phy-mps-016
    topic: stress-strain
    subtopic: Shearing strain
    concept: Shear strain = Δx/L
    category: numerical
    format: direct
    difficulty: 2
    time: 35
    ncert: true
    battle: true
    formula: shear strain = Δx/L
    tags: [shear-strain]
    stem: The top face of a cube of side 10 cm is displaced sideways by 0.5 mm relative to the fixed bottom face. The shearing strain is
    options:
      - 5 × 10^{-3}
      - 5 × 10^{-2}
      - 5 × 10^{-4}
      - 2 × 10^{-3}
    answer: 0
    explanation: Shearing strain = Δx/L = (0.5 × 10^{-3} m)/(0.1 m) = 5 × 10^{-3}. The displacement is divided by the height (the side perpendicular to the displacement).

  - id: phy-mps-017
    topic: stress-strain
    subtopic: Dimensions
    concept: Stress has dimensions of pressure; strain is dimensionless
    category: concept
    format: statement-pair
    difficulty: 3
    time: 45
    ncert: true
    battle: false
    tags: [dimensions]
    stem: |-
      Statement I: Stress has the same dimensions as pressure.
      Statement II: Strain has the dimensions of length.
    options:
      - Both Statement I and Statement II are correct
      - Both Statement I and Statement II are incorrect
      - Statement I is correct but Statement II is incorrect
      - Statement I is incorrect but Statement II is correct
    answer: 2
    explanation: Stress and pressure are both force per unit area, M L^{-1} T^{-2}. Strain is a ratio of two like quantities (ΔL/L), so it is dimensionless; Statement II is wrong.

  - id: phy-mps-018
    topic: hookes-law
    subtopic: Statement of Hooke's law
    concept: Stress ∝ strain within the elastic (proportional) limit
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    formula: stress = k × strain
    tags: [hookes-law, ncert-line]
    stem: Hooke's law states that, for small deformations,
    options:
      - stress is proportional to strain
      - stress is proportional to the square of strain
      - stress is inversely proportional to strain
      - stress is proportional to strain for all loads up to fracture
    answer: 0
    explanation: For small deformations, stress and strain are directly proportional; the constant of proportionality is the modulus of elasticity. The proportionality fails well before fracture, beyond the proportional limit.

  - id: phy-mps-019
    topic: hookes-law
    subtopic: Unit of modulus
    concept: Modulus of elasticity has the unit of stress
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [units, modulus]
    stem: The SI unit of modulus of elasticity is
    options:
      - N m
      - N m^{-1}
      - N m^{-2}
      - N^{-1} m^2
    answer: 2
    explanation: Modulus = stress/strain and strain is dimensionless, so the modulus has the unit of stress, N m^{-2} (pascal). N^{-1} m^2 is the unit of compressibility.

  - id: phy-mps-020
    topic: hookes-law
    subtopic: Dependence of modulus
    concept: Modulus depends only on the material (and temperature)
    category: concept
    format: direct
    difficulty: 2
    time: 25
    ncert: true
    battle: true
    tags: [modulus, trap]
    stem: The modulus of elasticity of a wire depends on
    options:
      - its length
      - its area of cross-section
      - the load applied to it
      - the nature of its material
    answer: 3
    explanation: The modulus is a property of the material (and varies with temperature). Changing length, area or load changes the extension, but the ratio stress/strain stays the same.

  - id: phy-mps-021
    topic: hookes-law
    subtopic: Stress–strain graph
    concept: Slope of linear stress–strain graph is the modulus
    category: concept
    format: graph
    difficulty: 3
    time: 45
    ncert: true
    battle: true
    tags: [graph, hookes-law]
    stem: Within the proportional limit, the graph of stress (y-axis) against strain (x-axis) for a wire is
    options:
      - a parabola through the origin
      - a straight line through the origin whose slope is the modulus
      - a straight line parallel to the strain axis
      - a rectangular hyperbola
    answer: 1
    explanation: Hooke's law gives stress = modulus × strain, a straight line through the origin with slope equal to the modulus of elasticity.

  - id: phy-mps-022
    topic: hookes-law
    subtopic: Dependence of modulus
    concept: Modulus does not change with length of wire
    category: concept
    format: assertion-reason
    difficulty: 3
    time: 45
    ncert: true
    battle: false
    tags: [trap, modulus]
    stem: |-
      Assertion (A): The Young's modulus of a wire increases if the wire is made longer.
      Reason (R): Young's modulus is a characteristic of the material of the wire.
    options:
      - Both A and R are true and R is the correct explanation of A
      - Both A and R are true but R is not the correct explanation of A
      - A is true but R is false
      - A is false but R is true
    answer: 3
    explanation: A longer wire extends more under the same load, but its strain ΔL/L is unchanged, so Y stays the same. Y depends on the material, which is exactly why A is false while R is true.

  - id: phy-mps-023
    topic: hookes-law
    subtopic: Temperature effect
    concept: Elastic moduli decrease with rise in temperature
    category: concept
    format: direct
    difficulty: 2
    time: 25
    ncert: false
    battle: true
    tags: [temperature]
    stem: When the temperature of a metal wire is raised, its Young's modulus generally
    options:
      - increases
      - decreases
      - remains unchanged
      - becomes zero
    answer: 1
    explanation: Heating weakens interatomic bonding, so a smaller stress produces the same strain and the modulus decreases. It does not drop to zero until the material melts.

  - id: phy-mps-024
    topic: hookes-law
    subtopic: Types of moduli
    concept: Bulk modulus is defined for solids, liquids and gases
    category: concept
    format: direct
    difficulty: 2
    time: 25
    ncert: true
    battle: true
    tags: [bulk-modulus, fluids]
    stem: Which elastic modulus is defined for solids, liquids as well as gases?
    options:
      - Young's modulus
      - Modulus of rigidity
      - Bulk modulus
      - Modulus of torsion
    answer: 2
    explanation: Fluids can be compressed but cannot sustain a steady longitudinal or shearing stress, so only the bulk modulus is defined for all three states. Young's and shear moduli apply to solids only.

  - id: phy-mps-025
    topic: hookes-law
    subtopic: Comparing moduli
    concept: Modulus ∝ 1/strain for equal stress
    category: numerical
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    formula: Y = stress/strain
    tags: [ratio]
    stem: Under the same stress, material A shows twice the strain shown by material B. The ratio Y_A/Y_B of their moduli is
    options:
      - "2"
      - "1/2"
      - "4"
      - "1/4"
    answer: 1
    explanation: Y = stress/strain. With equal stress, Y ∝ 1/strain, so Y_A/Y_B = 1/2. The material that strains more has the smaller modulus.

  - id: phy-mps-026
    topic: stress-strain-curve
    subtopic: Proportional limit
    concept: Linear region ends at the proportional limit
    category: factual
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    tags: [stress-strain-curve, ncert-line]
    stem: On the stress–strain curve of a metal wire, the region in which stress is proportional to strain ends at the
    options:
      - yield point
      - proportional limit
      - ultimate tensile strength point
      - fracture point
    answer: 1
    explanation: The initial straight-line part (O to A) obeys Hooke's law and ends at the proportional limit A. Beyond A, stress and strain are no longer proportional, though the body may still be elastic up to the yield point.

  - id: phy-mps-027
    topic: stress-strain-curve
    subtopic: Yield strength
    concept: Stress at the elastic limit is the yield strength
    category: factual
    format: direct
    difficulty: 2
    time: 25
    ncert: true
    battle: true
    tags: [yield-strength, ncert-line]
    stem: The stress corresponding to the elastic limit (yield point) of a material is called its
    options:
      - breaking strength
      - ultimate tensile strength
      - bulk modulus
      - yield strength
    answer: 3
    explanation: The point B up to which the body returns to its original dimensions is the yield point or elastic limit; the stress there is the yield strength σ_y. Ultimate tensile strength is the maximum stress, reached later at D.

  - id: phy-mps-028
    topic: stress-strain-curve
    subtopic: Permanent set
    concept: Unloading beyond the yield point leaves permanent strain
    category: concept
    format: direct
    difficulty: 2
    time: 35
    ncert: true
    battle: true
    tags: [permanent-set, ncert-line]
    stem: A wire is loaded beyond its yield point and the load is then removed. The wire will
    options:
      - return exactly to its original length
      - retain a permanent strain
      - break immediately
      - contract to less than its original length
    answer: 1
    explanation: Beyond the yield point the deformation is partly plastic; on unloading, the strain does not return to zero and the material is said to have a permanent set.

  - id: phy-mps-029
    topic: stress-strain-curve
    subtopic: Ultimate tensile strength
    concept: Maximum stress on the curve is the ultimate tensile strength
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [ultimate-strength]
    stem: The maximum stress on the stress–strain curve of a wire, beyond which it thins and fractures even with reduced load, is its
    options:
      - elastic limit
      - yield strength
      - ultimate tensile strength
      - proportional limit
    answer: 2
    explanation: Point D, the highest stress on the curve, is the ultimate tensile strength σ_u. Beyond it, additional strain is produced even by reduced force and the wire fractures at E.

  - id: phy-mps-030
    topic: stress-strain-curve
    subtopic: Ductile materials
    concept: Large gap between ultimate strength and fracture means ductile
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [ductile, ncert-line]
    stem: Materials in which the fracture point lies far beyond the ultimate tensile strength point are called
    options:
      - brittle
      - elastomers
      - ductile
      - rigid
    answer: 2
    explanation: If the ultimate strength and fracture points are far apart, the material undergoes a large plastic deformation before breaking, so it is ductile (like copper). If they are close, it is brittle.

  - id: phy-mps-031
    topic: stress-strain-curve
    subtopic: Brittle materials
    concept: Brittle materials fracture soon after the elastic limit
    category: concept
    format: direct
    difficulty: 2
    time: 25
    ncert: true
    battle: true
    tags: [brittle]
    stem: A material whose ultimate tensile strength and fracture points are very close together is
    options:
      - ductile
      - brittle
      - plastic
      - an elastomer
    answer: 1
    explanation: When D and E nearly coincide there is almost no plastic range, so the material breaks suddenly without much deformation; such materials (like glass or cast iron) are brittle.

  - id: phy-mps-032
    topic: stress-strain-curve
    subtopic: Elastomers
    concept: Aorta tissue is an elastomer
    category: factual
    format: direct
    difficulty: 2
    time: 25
    ncert: true
    battle: true
    tags: [elastomer, ncert-line]
    stem: The elastic tissue of the aorta, which can be stretched a lot and still regain its size, is an example of
    options:
      - a brittle material
      - a ductile material
      - an elastomer
      - a plastic material
    answer: 2
    explanation: NCERT gives the aorta's tissue and rubber as elastomers, substances that can be stretched to large strains and still recover, though their stress–strain curve is not linear.

  - id: phy-mps-033
    topic: stress-strain-curve
    subtopic: Elastomers
    concept: Characteristics of the stress–strain curve of rubber
    category: application
    format: multi-statement
    difficulty: 3
    time: 60
    ncert: true
    battle: false
    tags: [elastomer, rubber]
    stem: |-
      Consider the following statements about rubber, an elastomer.
      I. It does not obey Hooke's law over most of its elastic region.
      II. It has no well-defined plastic region.
      III. It can be stretched to several times its length and still return to its original length.
      IV. Its Young's modulus is larger than that of steel.
      Which of these are correct?
    options:
      - I and II only
      - I, II and III only
      - II and IV only
      - I, III and IV only
    answer: 1
    explanation: The stress–strain curve of rubber is curved (non-Hookean) over a very large elastic region and has no well-defined plastic region; rubber recovers even after large strains. Its Young's modulus is far smaller than that of steel, so IV is false.

  - id: phy-mps-034
    topic: stress-strain-curve
    subtopic: Sequence of points
    concept: Order of key points on the stress–strain curve
    category: concept
    format: ordering
    difficulty: 3
    time: 45
    ncert: true
    battle: false
    tags: [stress-strain-curve]
    stem: |-
      As a metal wire is stretched until it breaks, arrange these points in the order in which they are reached.
      P. Ultimate tensile strength
      Q. Proportional limit
      R. Fracture point
      S. Yield point
    options:
      - Q, S, P, R
      - S, Q, P, R
      - Q, P, S, R
      - Q, S, R, P
    answer: 0
    explanation: The linear region ends at the proportional limit (Q), the elastic limit or yield point follows (S), the stress then rises to its maximum, the ultimate tensile strength (P), and finally the wire breaks at the fracture point (R).

  - id: phy-mps-035
    topic: stress-strain-curve
    subtopic: Comparing slopes
    concept: Ratio of moduli from slopes of stress–strain lines
    category: numerical
    format: graph
    difficulty: 3
    time: 50
    ncert: false
    battle: false
    formula: Y = slope = tan θ
    tags: [graph, slope]
    stem: The stress–strain graphs of two wires A and B (same scale on both axes) are straight lines through the origin making angles of 60° and 30° respectively with the strain axis. The ratio Y_A/Y_B is
    options:
      - "3"
      - "√3"
      - "1/3"
      - "1/√3"
    answer: 0
    explanation: Y is the slope, tan θ, of the stress–strain line. Y_A/Y_B = tan 60°/tan 30° = √3/(1/√3) = 3. Taking the ratio of the angles or of sines gives the wrong answer.

  - id: phy-mps-036
    topic: youngs-modulus
    subtopic: Calculating Y
    concept: Y = FL/(AΔL)
    category: numerical
    format: direct
