    time: 60
    ncert: false
    battle: false
    tags: [energy-conservation, trap]
    stem: |-
      Statement I: When a load is lowered gradually onto a wire until equilibrium, the elastic energy stored equals half the loss in gravitational potential energy of the load.
      Statement II: The other half appears as kinetic energy of the load at the equilibrium position.
    options:
      - Both Statement I and Statement II are correct
      - Both Statement I and Statement II are incorrect
      - Statement I is correct but Statement II is incorrect
      - Statement I is incorrect but Statement II is correct
    answer: 2
    explanation: Loss in PE = Mgl while the wire stores ½ Mgl, so Statement I is true. When the load is lowered gradually it reaches equilibrium at rest; the other half is taken up by the supporting hand (or ends up as heat), not as kinetic energy.

