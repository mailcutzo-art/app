    options:
      - Y/2
      - Y
      - 2Y
      - Y/4
    answer: 1
    explanation: Doubling the length means ΔL = L, i.e. strain = 1. Stress = Y × strain = Y. In practice wires break long before such a strain.

  - id: phy-mps-048
