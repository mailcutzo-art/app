    explanation: Tension in the rod varies linearly from Mg at the top to zero at the bottom, so the average tension is Mg/2 and ΔL = MgL/(2AY), half of MgL/(AY) for a load Mg at the end.

  - id: phy-mps-047
    topic: youngs-modulus
