questions:
  - id: phy-ray-001
    topic: reflection-mirrors
    subtopic: Focal length and radius of curvature
    concept: Focal length of a spherical mirror is half its radius of curvature
    category: numerical
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    formula: f = R/2
    tags: [focal-length, radius-of-curvature]
    stem: A concave mirror has a radius of curvature of 30 cm. What is its focal length?
    options:
      - 15 cm
      - 30 cm
      - 60 cm
      - 7.5 cm
    answer: 0
    explanation: "For a spherical mirror (paraxial rays) f = R/2 = 30/2 = 15 cm. Doubling R (60 cm) is the common slip of writing R = f/2."

  - id: phy-ray-002
    topic: reflection-mirrors
    subtopic: Mirror formula
    concept: Object at centre of curvature of a concave mirror gives image at C
    category: numerical
    format: direct
    difficulty: 2
    time: 40
    ncert: true
    battle: true
    formula: 1/v + 1/u = 1/f
    tags: [mirror-formula, concave-mirror]
    stem: An object is placed 30 cm in front of a concave mirror of focal length 15 cm. Where is the image formed?
    options:
      - 15 cm in front of the mirror
      - 30 cm behind the mirror
      - 30 cm in front of the mirror
      - 60 cm in front of the mirror
    answer: 2
    explanation: "With u = −30 cm and f = −15 cm, 1/v = 1/f − 1/u = −1/15 + 1/30 = −1/30, so v = −30 cm. The image is real, inverted and of the same size at the centre of curvature, 30 cm in front of the mirror."

  - id: phy-ray-003
    topic: reflection-mirrors
    subtopic: Image by a convex mirror
    concept: Convex mirror always forms a virtual, erect, diminished image of a real object
    category: concept
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    tags: [convex-mirror, nature-of-image]
    stem: For a real object placed anywhere in front of a convex mirror, the image is always
    options:
      - real, inverted and diminished
      - virtual, erect and magnified
      - real, erect and same size
      - virtual, erect and diminished
    answer: 3
    explanation: "A convex mirror diverges the reflected rays, so they only appear to meet behind the mirror between P and F. The image is therefore always virtual, erect and smaller than the object. A virtual magnified image is what a concave mirror gives when the object is inside F."

  - id: phy-ray-004
    topic: reflection-mirrors
    subtopic: Magnification by a mirror
    concept: Image size from mirror formula and m = −v/u
    category: numerical
    format: direct
    difficulty: 3
    time: 60
    ncert: true
    battle: false
    formula: m = −v/u
    tags: [magnification, concave-mirror]
    stem: A 2 cm tall object stands 15 cm in front of a concave mirror of focal length 10 cm. What are the size and nature of the image?
    options:
      - 4 cm, erect
      - 4 cm, inverted
      - 1 cm, inverted
      - 6 cm, inverted
    answer: 1
    explanation: "1/v = 1/f − 1/u = −1/10 + 1/15 = −1/30, so v = −30 cm. m = −v/u = −(−30)/(−15) = −2, so the image is 4 cm tall and inverted (negative m). Taking |m| without the sign makes students choose the erect option."

  - id: phy-ray-005
    topic: reflection-mirrors
    subtopic: Object inside focus of concave mirror
    concept: Object between P and F of a concave mirror gives a virtual magnified image
    category: numerical
    format: direct
    difficulty: 3
    time: 60
    ncert: true
    battle: false
    formula: 1/v + 1/u = 1/f
    tags: [concave-mirror, virtual-image, trap]
    stem: An object is placed 5 cm in front of a concave mirror of focal length 10 cm. The image is
    options:
      - 10 cm in front of the mirror, real and inverted
      - 10 cm behind the mirror, virtual and twice the object size
      - 3.3 cm behind the mirror, virtual and diminished
      - at infinity
    answer: 1
    explanation: "u = −5 cm, f = −10 cm: 1/v = −1/10 + 1/5 = +1/10, so v = +10 cm (behind the mirror). m = −v/u = −10/(−5) = +2, a virtual, erect image twice as large. This is the shaving/makeup mirror case."

  - id: phy-ray-006
    topic: reflection-mirrors
    subtopic: Convex mirror magnification
    concept: Magnification of a convex mirror with object at distance f
    category: numerical
    format: direct
    difficulty: 2
    time: 45
    ncert: true
    battle: true
    formula: m = −v/u
    tags: [convex-mirror, magnification]
    stem: An object is 20 cm in front of a convex mirror of focal length 20 cm. What is the magnification?
    options:
      - "+2"
      - "−0.5"
      - "+0.5"
      - "+1"
    answer: 2
    explanation: "u = −20 cm, f = +20 cm: 1/v = 1/20 + 1/20 = 1/10, v = +10 cm. m = −v/u = −10/(−20) = +0.5. A convex mirror never gives |m| ≥ 1 for a real object, and its image is erect, so m is positive."

  - id: phy-ray-007
    topic: reflection-mirrors
    subtopic: Uses of convex mirrors
    concept: Convex mirrors give a wide field of view, so they serve as rear-view mirrors
    category: concept
    format: assertion-reason
    difficulty: 2
    time: 35
    ncert: true
    battle: false
    tags: [convex-mirror, rear-view-mirror]
    stem: |-
      Assertion (A): Convex mirrors are used as rear-view mirrors in vehicles.
      Reason (R): A convex mirror forms an erect, diminished image and so covers a wider field of view.
    options:
      - Both A and R are true and R is the correct explanation of A
      - Both A and R are true but R is not the correct explanation of A
      - A is true but R is false
      - A is false but R is true
    answer: 0
    explanation: "Because the image is diminished and erect, a small convex mirror shows a large region behind the vehicle the right way up. That is exactly why it is chosen, so R explains A."

  - id: phy-ray-008
    topic: reflection-mirrors
    subtopic: Mirror in a medium
    concept: Focal length of a mirror does not depend on the surrounding medium
    category: concept
    format: direct
    difficulty: 3
    time: 40
    ncert: false
    battle: true
    tags: [trap, medium-independence]
    stem: A concave mirror of focal length 20 cm in air is immersed in water (n = 4/3). Its focal length in water is
    options:
      - 15 cm
      - 26.7 cm
      - 80 cm
      - 20 cm
    answer: 3
    explanation: "Reflection obeys i = r regardless of the medium, and f = R/2 depends only on the geometry, so f stays 20 cm. Dividing or multiplying by 4/3 wrongly applies the lens behaviour to a mirror."

  - id: phy-ray-009
    topic: reflection-mirrors
    subtopic: Graphs of mirror formula
    concept: Plot of 1/v against 1/u for a mirror is a straight line of slope −1
    category: concept
    format: graph
    difficulty: 3
    time: 50
    ncert: false
    battle: false
    formula: 1/v = −1/u + 1/f
    tags: [graph, mirror-formula]
    stem: For a concave mirror, 1/v is plotted on the y-axis against 1/u on the x-axis (Cartesian signs). The graph is
    options:
      - a straight line of slope +1 passing through the origin
      - a rectangular hyperbola
      - a straight line of slope −1 with intercept 1/f on the y-axis
      - a parabola opening upward
    answer: 2
    explanation: "Rearranging 1/v + 1/u = 1/f gives 1/v = −(1/u) + 1/f, a straight line of slope −1 whose y-intercept is 1/f. A plot of v against u (not reciprocals) is the hyperbola."

  - id: phy-ray-010
    topic: reflection-mirrors
    subtopic: Image positions for a concave mirror
    concept: Matching object position with image position for a concave mirror
    category: concept
    format: match
    difficulty: 3
    time: 70
    ncert: true
    battle: false
    tags: [concave-mirror, image-formation]
    stem: |-
      Match the object position for a concave mirror (List I) with the image (List II).
      List I: P. Beyond C; Q. At C; R. Between C and F; S. Between F and P
      List II: 1. Beyond C, real, magnified; 2. Behind mirror, virtual, magnified; 3. Between F and C, real, diminished; 4. At C, real, same size
    options:
      - P-1, Q-4, R-3, S-2
      - P-3, Q-4, R-2, S-1
      - P-3, Q-2, R-1, S-4
      - P-3, Q-4, R-1, S-2
    answer: 3
    explanation: "Object beyond C gives a diminished real image between F and C; at C the image is at C and the same size; between C and F the image is beyond C and magnified; inside F the image is virtual, erect and magnified behind the mirror."

  - id: phy-ray-011
    topic: reflection-mirrors
    subtopic: Paraxial approximation
    concept: Mirror formula assumes paraxial rays
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [paraxial-rays, ncert-line]
    stem: The relation f = R/2 for a spherical mirror holds strictly only for rays that are
    options:
      - paraxial, close to the principal axis and making small angles with it
      - parallel to the mirror surface
      - incident at the centre of curvature
      - of a single wavelength
    answer: 0
    explanation: "The derivation uses tan θ ≈ θ and treats the pole region as nearly flat, valid only for paraxial rays. Marginal rays focus closer to the mirror, which is spherical aberration. Mirrors have no wavelength dependence."

  - id: phy-ray-012
    topic: reflection-mirrors
    subtopic: Rotation of a plane mirror
    concept: Rotating a mirror by θ rotates the reflected ray by 2θ
    category: numerical
    format: direct
    difficulty: 2
    time: 35
    ncert: false
    battle: true
    tags: [plane-mirror, rotation]
    stem: A plane mirror is rotated by 12° about an axis in its plane while the incident ray is fixed. The reflected ray turns through
    options:
      - 6°
      - 12°
      - 36°
      - 24°
    answer: 3
    explanation: "Turning the mirror by θ changes the angle of incidence by θ and the reflected ray moves by 2θ relative to the fixed incident ray, so it turns 24°. 12° forgets that both i and r change."

  - id: phy-ray-013
    topic: reflection-mirrors
    subtopic: Properties of spherical mirrors
    concept: Statements on image formation by spherical mirrors
    category: concept
    format: multi-statement
    difficulty: 3
    time: 60
    ncert: true
    battle: false
    tags: [concave-mirror, convex-mirror]
    stem: |-
      Consider the following statements about spherical mirrors (real objects).
      I. A concave mirror can form both real and virtual images.
      II. A convex mirror can form a real image.
      III. A virtual image formed by a single mirror is always erect.
      IV. A concave mirror never forms a diminished image.
      Which are correct?
    options:
      - I and II only
      - I and III only
      - II and IV only
      - I, III and IV only
    answer: 1
    explanation: "I is true (object inside F gives virtual, elsewhere real). III is true because a single mirror's virtual image is always erect. II is false for real objects, and IV is false since an object beyond C gives a diminished image."

  - id: phy-ray-014
    topic: reflection-mirrors
    subtopic: Sign convention
    concept: Cartesian sign convention for mirrors
    category: factual
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    tags: [sign-convention, ncert-line]
    stem: In the Cartesian sign convention, distances measured in the direction of the incident light from the pole are taken as
    options:
      - negative
      - positive
      - positive only for virtual images
      - negative only for mirrors
    answer: 1
    explanation: "All distances are measured from the pole; those along the direction of incident light are positive and those against it are negative. Hence for a real object in front of a mirror u is negative."

  - id: phy-ray-015
    topic: refraction-plane
    subtopic: Snell's law
    concept: Angle of refraction from Snell's law
    category: numerical
    format: direct
    difficulty: 2
    time: 40
    ncert: true
    battle: true
    formula: n_1 sin i = n_2 sin r
    tags: [snells-law]
    stem: A ray in air strikes a glass surface (n = √3) at 60° incidence. The angle of refraction is
    options:
      - 45°
      - 60°
      - 30°
      - 15°
    answer: 2
    explanation: "sin r = sin 60°/√3 = (√3/2)/√3 = 1/2, so r = 30°. The ray bends towards the normal on entering the denser glass, so r must be less than 60°."

  - id: phy-ray-016
    topic: refraction-plane
    subtopic: Apparent depth
    concept: Apparent depth equals real depth divided by refractive index
    category: numerical
    format: direct
    difficulty: 2
    time: 35
    ncert: true
    battle: true
    formula: apparent depth = real depth/n
    tags: [apparent-depth, normal-shift]
    stem: A coin lies at the bottom of a tank filled with water (n = 4/3) to a depth of 12 cm. Viewed from directly above, the coin appears raised by
    options:
      - 3 cm
      - 9 cm
      - 4 cm
      - 16 cm
    answer: 0
    explanation: "Apparent depth = 12/(4/3) = 9 cm, so the coin appears raised by 12 − 9 = 3 cm. 9 cm is the apparent depth itself, not the shift."

  - id: phy-ray-017
    topic: refraction-plane
    subtopic: Frequency and wavelength in a medium
    concept: Frequency is unchanged on refraction while speed and wavelength change
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [frequency, wavelength, trap]
    stem: When light passes from air into glass, which quantity remains unchanged?
    options:
      - Speed
      - Wavelength
      - Direction for all angles of incidence
      - Frequency
    answer: 3
    explanation: "Frequency is set by the source and the boundary cannot change it. Speed drops to c/n and wavelength to λ/n, and the direction changes except at normal incidence."

  - id: phy-ray-018
    topic: refraction-plane
    subtopic: Speed of light in a medium
    concept: Speed in a medium is c/n
    category: numerical
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    formula: v = c/n
    tags: [refractive-index, speed-of-light]
    stem: The refractive index of glass is 1.5. The speed of light in this glass is
    options:
      - 4.5 × 10^8 m s^{-1}
      - 2 × 10^8 m s^{-1}
      - 1.5 × 10^8 m s^{-1}
      - 3 × 10^8 m s^{-1}
    answer: 1
    explanation: "v = c/n = (3 × 10^8)/1.5 = 2 × 10^8 m s^{-1}. Multiplying by n would give a speed greater than c, which is impossible in a material."

  - id: phy-ray-019
    topic: refraction-plane
    subtopic: Relative refractive index
    concept: Refractive index of glass with respect to water is n_g/n_w
    category: numerical
    format: direct
    difficulty: 2
    time: 35
    ncert: true
    battle: true
    formula: n_{21} = n_2/n_1
    tags: [relative-refractive-index]
    stem: If n_glass = 3/2 and n_water = 4/3, the refractive index of glass with respect to water is
    options:
      - 8/9
      - "2"
      - 9/8
      - 17/6
    answer: 2
    explanation: "n_gw = n_g/n_w = (3/2)/(4/3) = 9/8. The value 8/9 is the index of water with respect to glass; it must be less than 1 since water is optically rarer."

  - id: phy-ray-020
    topic: refraction-plane
    subtopic: Glass slab
    concept: Emergent ray from a parallel slab is parallel to the incident ray but laterally shifted
    category: concept
    format: assertion-reason
    difficulty: 2
    time: 40
    ncert: true
    battle: false
    tags: [glass-slab, lateral-shift]
    stem: |-
      Assertion (A): A ray passing obliquely through a parallel-sided glass slab emerges parallel to the incident ray.
      Reason (R): The angle of refraction at the first face equals the angle of incidence at the second face, and the media on both sides are the same.
    options:
      - Both A and R are true and R is the correct explanation of A
      - Both A and R are true but R is not the correct explanation of A
      - A is true but R is false
      - A is false but R is true
    answer: 0
    explanation: "Parallel faces make r at the first face equal to the incidence angle at the second face. With air on both sides, Snell's law reversed gives an emergence angle equal to i, so the ray only shifts sideways. R explains A."

  - id: phy-ray-021
    topic: refraction-plane
    subtopic: Wavelength in a medium
    concept: Wavelength in a medium is λ/n
    category: numerical
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    formula: λ_m = λ/n
    tags: [wavelength]
    stem: Light of wavelength 600 nm in air enters glass of refractive index 1.5. Its wavelength in glass is
    options:
      - 900 nm
      - 600 nm
      - 300 nm
      - 400 nm
    answer: 3
    explanation: "With frequency fixed and speed reduced by n, λ_glass = 600/1.5 = 400 nm. 900 nm wrongly multiplies by n."

  - id: phy-ray-022
    topic: refraction-plane
    subtopic: Reversibility of light
    concept: n_12 × n_21 = 1 from the principle of reversibility
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [reversibility, ncert-line]
    stem: If n_21 is the refractive index of medium 2 with respect to medium 1, then n_12 equals
    options:
      - n_21
      - 1/n_21
      - n_21 − 1
      - √n_21
    answer: 1
    explanation: "By reversibility of the light path, a ray retracing its route obeys Snell's law with the roles swapped, so n_12 = 1/n_21."

  - id: phy-ray-023
    topic: refraction-plane
    subtopic: Apparent height seen from a denser medium
    concept: An object in air viewed from water appears farther by factor n
    category: application
    format: direct
    difficulty: 3
    time: 60
    ncert: false
    battle: false
    formula: apparent height = n × real height
    tags: [apparent-height, trap]
    stem: A bird flies 6 m above the surface of a still lake. To a fish just below the surface looking straight up (n_water = 4/3), the bird appears to be at a height of
    options:
      - 4.5 m
      - 6 m
      - 8 m
      - 10 m
    answer: 2
    explanation: "For near-normal viewing from the denser medium, apparent distance = (n_observer/n_object) × real = (4/3) × 6 = 8 m. The bird looks farther away, not nearer; 4.5 m is the answer for the reverse situation."

  - id: phy-ray-024
    topic: refraction-plane
    subtopic: Normal incidence
    concept: A ray incident along the normal passes undeviated
    category: concept
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [normal-incidence]
    stem: A ray of light falls normally on the surface of a glass block. Inside the glass the ray
    options:
      - bends towards the normal
      - bends away from the normal
      - is totally reflected
      - continues undeviated but slows down
    answer: 3
    explanation: "With i = 0, Snell's law gives sin r = 0, so r = 0 and the direction is unchanged. The speed still drops to c/n."

  - id: phy-ray-025
    topic: refraction-plane
    subtopic: Normal shift through a slab
    concept: Shift of an object seen through a slab is t(1 − 1/n)
    category: numerical
    format: direct
    difficulty: 3
    time: 50
    ncert: false
    battle: true
    formula: shift = t(1 − 1/n)
    tags: [normal-shift, glass-slab]
    stem: A mark on paper is viewed normally through a glass slab 6 cm thick (n = 1.5). By how much does the mark appear raised?
    options:
      - 2 cm
      - 4 cm
      - 3 cm
      - 1.5 cm
    answer: 0
    explanation: "Shift = t(1 − 1/n) = 6(1 − 2/3) = 2 cm. 4 cm is the apparent thickness t/n, not the shift."

  - id: phy-ray-026
    topic: total-internal-reflection
    subtopic: Critical angle
    concept: sin C = 1/n
    category: numerical
    format: direct
    difficulty: 1
    time: 25
    ncert: true
    battle: true
    formula: sin C = 1/n
    tags: [critical-angle]
    stem: The critical angle for a medium of refractive index √2 (with respect to air) is
    options:
      - 30°
      - 60°
      - 90°
      - 45°
    answer: 3
    explanation: "sin C = 1/n = 1/√2, so C = 45°. Any ray inside the medium hitting the surface at more than 45° is totally reflected."

  - id: phy-ray-027
    topic: total-internal-reflection
    subtopic: Conditions for TIR
    concept: TIR needs light going from denser to rarer medium and i greater than C
    category: concept
    format: statement-pair
    difficulty: 2
    time: 40
    ncert: true
    battle: false
    tags: [tir-conditions]
    stem: |-
      Statement I: Total internal reflection can occur when light travels from air into water.
      Statement II: For total internal reflection the angle of incidence in the denser medium must exceed the critical angle.
    options:
      - Both Statement I and Statement II are correct
      - Both Statement I and Statement II are incorrect
      - Statement I is correct but Statement II is incorrect
      - Statement I is incorrect but Statement II is correct
    answer: 3
    explanation: "Going from rarer (air) to denser (water) the ray bends towards the normal and always refracts, so TIR is impossible; Statement I is wrong. Statement II states the correct angle condition."

  - id: phy-ray-028
    topic: total-internal-reflection
    subtopic: Sparkle of diamond
    concept: Diamond's small critical angle causes multiple TIR and brilliance
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [diamond, ncert-line]
    stem: Diamond (n ≈ 2.42) sparkles mainly because
    options:
      - it has a very small critical angle (about 24°), so light undergoes repeated total internal reflection
      - it emits light when illuminated
      - its critical angle is close to 90°
      - it absorbs all colours except white
    answer: 0
    explanation: "sin C = 1/2.42 gives C ≈ 24.4°. Cut suitably, most light entering a diamond meets inner faces at more than 24° and is totally reflected many times before leaving, so it sparkles."

  - id: phy-ray-029
    topic: total-internal-reflection
    subtopic: Optical fibres
    concept: Core of an optical fibre has higher refractive index than cladding
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [optical-fibre, ncert-line]
    stem: In an optical fibre, light is guided along the core because
    options:
      - the cladding has a higher refractive index than the core
      - the core and cladding have the same refractive index
      - the core has a higher refractive index than the cladding
      - the fibre surface is silvered
    answer: 2
    explanation: "TIR at the core-cladding boundary requires light to travel from denser to rarer medium, so n_core > n_cladding. No silvering is used; reflection loss would be too high."

  - id: phy-ray-030
    topic: total-internal-reflection
    subtopic: Mirage
    concept: Mirage in deserts is caused by total internal reflection in hot air layers
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [mirage, natural-phenomena]
    stem: On a hot day, a road ahead appears wet. This mirage is due to
    options:
      - dispersion of sunlight by dust
      - total internal reflection of light in air layers whose refractive index decreases towards the hot ground
      - scattering of light by water vapour
      - reflection of light from the road surface
    answer: 1
    explanation: "Air near the hot road is less dense and has a lower refractive index. Light from the sky bends progressively away from the normal and is finally totally reflected upward, so an inverted image of the sky appears on the road like water."

  - id: phy-ray-031
    topic: total-internal-reflection
    subtopic: Critical angle between two media
    concept: sin C = n_rarer/n_denser at a glass-water interface
    category: numerical
    format: direct
    difficulty: 3
    time: 45
    ncert: false
    battle: true
    formula: sin C = n_2/n_1
    tags: [critical-angle, relative-refractive-index]
    stem: Light goes from glass (n = 3/2) towards water (n = 4/3). The sine of the critical angle at the interface is
    options:
      - 2/3
      - 3/4
      - 9/8
      - 8/9
    answer: 3
    explanation: "sin C = n_water/n_glass = (4/3)/(3/2) = 8/9. 2/3 is the glass-air value; 9/8 exceeds 1 and cannot be a sine."

  - id: phy-ray-032
    topic: total-internal-reflection
    subtopic: Critical angle and wavelength
    concept: Critical angle is larger for red light than for violet light
    category: concept
    format: direct
    difficulty: 3
    time: 40
    ncert: false
    battle: true
    tags: [critical-angle, wavelength, trap]
    stem: For a given glass, the critical angle for red light compared with violet light is
    options:
      - smaller, because red light travels slower in glass
      - equal, because the critical angle depends only on the glass
      - larger, because the refractive index for red is smaller
