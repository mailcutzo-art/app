    stem: A drug mimics the action of parasympathetic neural signals on the heart. Which set of changes is expected?
    options:
      - Higher heart rate, stronger ventricular contraction and higher cardiac output
      - Lower heart rate, slower conduction of the action potential and lower cardiac output
      - Lower heart rate but higher cardiac output because of stronger ventricular contraction
      - Higher heart rate with slower conduction of the action potential
    answer: 1
    explanation: Parasympathetic neural signals decrease the rate of heartbeat and the speed of conduction of the action potential, and thereby the cardiac output. A drug that mimics them therefore lowers all three, whereas sympathetic signals would raise the heart rate and the strength of ventricular contraction.
