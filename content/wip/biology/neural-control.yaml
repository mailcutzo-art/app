    stem: 'A patient shows these findings: (i) touch on the skin of the forearm is signalled and reaches the spinal cord, (ii) the biceps does not contract when the CNS sends commands, (iii) gut movements and heart rate are normal. Which conclusion is best supported?'
    options:
      - Afferent fibres are damaged, but the efferent fibres of the somatic neural system are intact.
      - Afferent fibres are intact, but the efferent fibres of the autonomic neural system are damaged.
      - Afferent fibres are intact, but the efferent fibres of the somatic neural system are damaged.
      - The efferent fibres of both the somatic and the autonomic neural systems are damaged.
    answer: 2
    explanation: Impulses from the skin reach the CNS, so the afferent fibres are intact. The biceps is a skeletal muscle that fails to respond to the CNS, so the efferent fibres of the somatic neural system are damaged, while the normal gut movements and heart rate show that the autonomic neural system works.
