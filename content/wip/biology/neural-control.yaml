    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [pns, autonomic, visceral]
    stem: |-
      Consider the following statements.
      I. The somatic neural system relays impulses from the CNS to the skeletal muscles.
      II. The autonomic neural system transmits impulses from the CNS to the involuntary organs and smooth muscles.
      III. The sympathetic and parasympathetic neural systems are the two divisions of the somatic neural system.
      IV. The visceral nervous system is a part of the peripheral nervous system.
      Which of the statements are correct?
    options:
      - I, II and III only
      - II, III and IV only
      - I, III and IV only
      - I, II and IV only
    answer: 3
    explanation: Statements I, II and IV agree with NCERT. Statement III is wrong because the sympathetic and parasympathetic neural systems are the two divisions of the autonomic neural system, not of the somatic one.
  - id: bio-neural-031
