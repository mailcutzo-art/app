    stem: After an accident, a patient can no longer move the muscles of her leg voluntarily, but her gut movements and heartbeat continue normally. Which division of the peripheral neural system is most probably affected?
    options:
      - Autonomic neural system
      - Somatic neural system
      - Sympathetic neural system
      - Visceral nervous system
    answer: 1
    explanation: Voluntary movement depends on the skeletal muscles, which are supplied through the somatic neural system. Normal gut movement and heartbeat show that the autonomic neural system, which supplies involuntary organs and smooth muscles, is working.
