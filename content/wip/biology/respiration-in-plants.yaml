questions:
  - id: bio-resp-001
    topic: resp-fermentation
    subtopic: Alcoholic fermentation
    concept: In yeast, anaerobic conversion of pyruvic acid gives CO_2 and ethanol
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [alcoholic-fermentation, yeast]
    stem: In yeast, under anaerobic conditions, pyruvic acid is finally converted into
    options:
      - CO_2 and ethanol
      - Lactic acid and CO_2
      - Acetyl CoA and CO_2
      - CO_2 and H_2O
    answer: 0
    explanation: In alcoholic fermentation yeast converts pyruvic acid to CO_2 and ethanol. Lactic acid is formed by some bacteria and by muscle cells, acetyl CoA forms only when pyruvic acid is oxidised aerobically, and CO_2 with H_2O are the products of complete oxidation.
  - id: bio-resp-002
    topic: resp-fermentation
    subtopic: Lactic acid fermentation
    concept: Lactate dehydrogenase reduces pyruvic acid to lactic acid in animal cells
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [lactic-acid-fermentation, enzyme]
    stem: Which enzyme reduces pyruvic acid to lactic acid in animal cells such as muscle?
    options:
      - Pyruvic acid decarboxylase
      - Lactate dehydrogenase
      - Alcohol dehydrogenase
      - Invertase
    answer: 1
    explanation: Lactate dehydrogenase reduces pyruvic acid to lactic acid when oxygen is inadequate. Pyruvic acid decarboxylase and alcohol dehydrogenase work in yeast alcoholic fermentation, and invertase splits sucrose into glucose and fructose.
  - id: bio-resp-003
    topic: resp-fermentation
    subtopic: Meaning of fermentation
    concept: Fermentation is the incomplete oxidation of glucose under anaerobic conditions
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [fermentation, definition]
    stem: The incomplete oxidation of glucose by yeast under anaerobic conditions is called
    options:
      - Photorespiration
      - Oxidative phosphorylation
      - Fermentation
      - Aerobic respiration
    answer: 2
    explanation: NCERT describes fermentation, say by yeast, as incomplete oxidation of glucose under anaerobic conditions. Aerobic respiration oxidises glucose completely, and oxidative phosphorylation and photorespiration are different processes.
  - id: bio-resp-004
    topic: resp-fermentation
    subtopic: Fates of pyruvic acid
    concept: Pyruvic acid is the common substrate of both fermentations
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [pyruvic-acid]
    stem: The compound that is reduced to lactic acid in muscle cells and changed to CO_2 and ethanol in yeast is
    options:
      - Acetyl CoA
      - Oxaloacetic acid
      - Citric acid
      - Pyruvic acid
    answer: 3
    explanation: Glycolysis ends with pyruvic acid, which is reduced to lactic acid in muscle cells and converted to CO_2 and ethanol in yeast. Acetyl CoA, oxaloacetic acid and citric acid belong to the aerobic pathway.
  - id: bio-resp-005
    topic: resp-fermentation
    subtopic: NADH and NAD+
    concept: NADH + H^+ is the reducing agent and is reoxidised to NAD^+ in fermentation
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [nadh, reducing-agent]
    stem: The reducing agent that is reoxidised to NAD^+ in both lactic acid and alcohol fermentation is
    options:
      - NADH + H^+
      - FADH_2
      - NADPH + H^+
      - Pyruvic acid
    answer: 0
    explanation: NCERT states that the reducing agent in both fermentations is NADH + H^+, which is reoxidised to NAD^+. FADH_2 and NADPH are carriers of other pathways, and pyruvic acid is the compound that gets reduced.
  - id: bio-resp-006
    topic: resp-fermentation
    subtopic: Energy release
    concept: Less than 7 per cent of the energy in glucose is released in fermentation
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [energy, atp]
    stem: In lactic acid or alcohol fermentation, the energy of glucose that is released is
    options:
      - more than 50 per cent, all of it trapped as ATP
      - less than 7 per cent, and not all of it trapped as ATP
      - about 30 per cent, mostly lost as heat
      - nearly 100 per cent, stored as NADH
    answer: 1
    explanation: NCERT states that in both lactic acid and alcohol fermentation less than 7 per cent of the energy in glucose is released, and not all of that is trapped as high energy bonds of ATP.
  - id: bio-resp-007
    topic: resp-fermentation
    subtopic: Fates of pyruvic acid
    concept: Three major ways of handling pyruvic acid
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [pyruvic-acid, fate]
    stem: Which set lists the three major ways in which cells handle the pyruvic acid produced by glycolysis?
    options:
      - Lactic acid fermentation, alcoholic fermentation and photorespiration
      - Alcoholic fermentation, aerobic respiration and photophosphorylation
      - Lactic acid fermentation, alcoholic fermentation and aerobic respiration
      - Glycolysis, Krebs' cycle and electron transport
    answer: 2
    explanation: Depending on the cellular need, pyruvic acid goes into lactic acid fermentation, alcoholic fermentation or aerobic respiration through the Krebs' cycle. Photorespiration and photophosphorylation belong to photosynthesis, and glycolysis is the pathway that makes pyruvic acid.
  - id: bio-resp-008
    topic: resp-fermentation
    subtopic: Organisms that ferment
    concept: Fermentation occurs in many prokaryotes and unicellular eukaryotes
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [organisms, fermentation]
    stem: Fermentation takes place under anaerobic conditions in many
    options:
      - multicellular plants only
      - viruses and bacteria
      - multicellular animals only
      - prokaryotes and unicellular eukaryotes
    answer: 3
    explanation: NCERT says fermentation takes place under anaerobic conditions in many prokaryotes and unicellular eukaryotes, such as some bacteria and yeast. Viruses are not cells and have no respiratory pathway of their own.
  - id: bio-resp-009
    topic: resp-fermentation
    subtopic: Hazards of fermentation
    concept: Fermentation is hazardous because acid or alcohol is produced
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [hazard, products]
    stem: According to NCERT, lactic acid and alcohol fermentation are hazardous to the organism because
    options:
      - they need large amounts of ATP to start
      - either acid or alcohol is produced
      - they release a large amount of energy as heat
      - they destroy the mitochondria of the cell
    answer: 1
    explanation: NCERT calls these processes hazardous because either acid or alcohol is produced. For example, yeasts poison themselves to death when the alcohol concentration reaches about 13 per cent.
  - id: bio-resp-010
    topic: resp-fermentation
    subtopic: Lactic acid fermentation
    concept: Pyruvic acid is converted to lactic acid when oxygen is inadequate in muscles
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [lactic-acid-fermentation, muscle]
    stem: In animal muscle cells, pyruvic acid is reduced to lactic acid when
    options:
      - glucose is present in excess
      - ATP is present in excess
      - oxygen is inadequate for cellular respiration
      - carbon dioxide is absent
    answer: 2
    explanation: NCERT says that in animal cells like muscles during exercise, when oxygen is inadequate for cellular respiration, pyruvic acid is reduced to lactic acid by lactate dehydrogenase. Excess glucose or ATP is not the trigger.
  - id: bio-resp-011
    topic: resp-fermentation
    subtopic: Enzymes of fermentation
    concept: Pyruvic acid decarboxylase releases CO_2 from pyruvic acid in yeast
    category: concept
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [enzyme, decarboxylation]
    stem: In alcoholic fermentation, CO_2 is released in the reaction catalysed by
    options:
      - Pyruvic acid decarboxylase
      - Alcohol dehydrogenase
      - Lactate dehydrogenase
      - Invertase
    answer: 0
    explanation: Pyruvic acid decarboxylase removes CO_2 from pyruvic acid. Alcohol dehydrogenase then reduces the product to ethanol using NADH + H^+. Lactate dehydrogenase acts only in lactic acid fermentation and invertase acts on sucrose.
  - id: bio-resp-012
    topic: resp-fermentation
    subtopic: NADH and NAD+
    concept: In lactic acid formation pyruvic acid is reduced and NADH + H^+ is oxidised
    category: concept
    format: direct
    difficulty: 4
    time: 85
    ncert: true
    battle: true
    tags: [redox, lactic-acid-fermentation]
    stem: When pyruvic acid changes to lactic acid in a muscle cell, which statement about this change is correct?
    options:
      - Pyruvic acid is oxidised and NADH + H^+ is reduced
      - Pyruvic acid is reduced and NADH + H^+ is oxidised
      - Pyruvic acid is oxidised and NAD^+ is reduced
      - Pyruvic acid is reduced and NAD^+ is oxidised
    answer: 1
    explanation: Pyruvic acid accepts hydrogen from NADH + H^+, so it is reduced while NADH + H^+ is oxidised to NAD^+. The trap is to treat the formation of an acid as an oxidation, or to reverse the roles of NADH and NAD^+.
  - id: bio-resp-013
    topic: resp-fermentation
    subtopic: Comparison of the two fermentations
    concept: Reoxidation of NADH + H^+ is common to lactic acid and alcohol fermentation
    category: concept
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [comparison, nadh]
    stem: Which event is common to lactic acid fermentation and alcoholic fermentation?
    options:
      - Release of CO_2 from pyruvic acid
      - Action of lactate dehydrogenase
      - Reoxidation of NADH + H^+ to NAD^+
      - Formation of ethanol
    answer: 2
    explanation: In both fermentations NADH + H^+ is reoxidised to NAD^+. CO_2 release and ethanol formation occur only in alcoholic fermentation, and lactate dehydrogenase works only in lactic acid fermentation.
  - id: bio-resp-014
    topic: resp-fermentation
    subtopic: Lactic acid fermentation
    concept: Count of lactic acid and NAD^+ from ten glucose molecules fermented to lactic acid
    category: numerical
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [numerical, lactic-acid-fermentation]
    stem: Ten glucose molecules are fermented to lactic acid in a muscle. How many lactic acid molecules are formed and how many NAD^+ are regenerated?
    options:
      - 10 and 10
      - 10 and 20
      - 20 and 10
      - 20 and 20
    answer: 3
    explanation: Each glucose gives 2 pyruvic acid in glycolysis, and each pyruvic acid is reduced to one lactic acid, so 20 lactic acid form. Glycolysis also forms 2 NADH + H^+ per glucose, and each is reoxidised in the reduction of pyruvic acid, so 20 NAD^+ are regenerated.
  - id: bio-resp-015
    topic: resp-fermentation
    subtopic: Stoichiometry of alcoholic fermentation
    concept: Carbon atoms leaving as CO_2 and retained in ethanol from one glucose
    category: numerical
    format: direct
    difficulty: 4
    time: 85
    ncert: false
    battle: true
    tags: [numerical, carbon-balance]
    stem: Yeast ferments one glucose molecule to ethanol and CO_2. How many carbon atoms leave the cell as CO_2 and how many remain in ethanol?
    options:
      - 2 and 4
      - 3 and 3
      - 4 and 2
      - 6 and 0
    answer: 0
    explanation: One glucose (6 C) gives 2 pyruvic acid (3 C each). Each pyruvic acid loses one carbon as CO_2, so 2 C leave as CO_2, and the remaining 4 C stay in 2 molecules of ethanol (2 C each).
  - id: bio-resp-016
    topic: resp-fermentation
    subtopic: Comparison with aerobic respiration
    concept: Conversion of pyruvic acid to ethanol is unique to fermentation among the listed features
    category: concept
    format: direct
    difficulty: 5
    time: 120
    ncert: true
    battle: true
    tags: [comparison, aerobic-respiration]
    stem: Which feature is seen in alcoholic fermentation by yeast but not in its aerobic respiration?
    options:
      - Release of CO_2
      - Conversion of pyruvic acid to ethanol
      - Reoxidation of NADH + H^+ to NAD^+
      - Occurrence of glycolysis in the cytoplasm
    answer: 1
    explanation: CO_2 is released in aerobic respiration too, NADH + H^+ is reoxidised there by the electron transport system, and glycolysis is the first step of both. Only the formation of ethanol from pyruvic acid is specific to alcoholic fermentation.
  - id: bio-resp-017
    topic: resp-fermentation
    subtopic: Fermented foods and beverages
    concept: CO_2 from alcoholic fermentation puffs up bread dough
    category: application
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [baker-yeast, dough]
    stem: The dough used for making bread is fermented by baker's yeast. Its puffed-up appearance is due to
    options:
      - ethanol vapour formed by lactic acid fermentation
      - O_2 released by the yeast
      - CO_2 released during alcoholic fermentation of sugars
      - lactic acid formed by bacteria in the dough
    answer: 2
    explanation: Baker's yeast (Saccharomyces cerevisiae) ferments the sugars in the dough, and the CO_2 produced makes the dough rise. Lactic acid fermentation releases no CO_2, and yeast fermentation does not release O_2.
  - id: bio-resp-018
    topic: resp-fermentation
    subtopic: Muscle fibres
    concept: White muscle fibres depend on anaerobic processes and have few mitochondria
    category: concept
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [muscle-fibre, anaerobic]
    stem: Which skeletal muscle fibres have little myoglobin and few mitochondria and depend on an anaerobic process for energy?
    options:
      - Red fibres
      - Aerobic muscle fibres
      - Smooth muscle fibres
      - White fibres
    answer: 3
    explanation: NCERT describes white fibres as having very little myoglobin, few mitochondria and much sarcoplasmic reticulum, so they depend on anaerobic processes. Red fibres are aerobic muscles rich in myoglobin and mitochondria.
  - id: bio-resp-019
    topic: resp-fermentation
    subtopic: Energy yield
    concept: Net ATP in fermentation comes from glycolysis only
    category: concept
    format: direct
    difficulty: 4
    time: 85
    ncert: false
    battle: false
    tags: [atp, glycolysis]
    stem: Which statement about ATP in alcoholic fermentation by yeast is correct?
    options:
      - The net gain of 2 ATP per glucose comes from glycolysis, and the steps from pyruvic acid to ethanol form no ATP
      - The net gain of 2 ATP per glucose comes from the oxidation of NADH + H^+ in the electron transport system
      - The net gain of ATP is the same as in aerobic respiration
      - No ATP is formed because glucose is not completely oxidised
    answer: 0
    explanation: Glycolysis gives a net gain of 2 ATP per glucose. The later steps only reoxidise NADH + H^+ while reducing a pyruvic acid derivative, and no electron transport with O_2 is involved, so the ATP gain is far lower than in aerobic respiration but not zero.
  - id: bio-resp-020
    topic: resp-fermentation
    subtopic: Fermented foods and beverages
    concept: Large holes in Swiss cheese are due to CO_2 from Propionibacterium sharmanii
    category: factual
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [swiss-cheese, bacteria]
    stem: The large holes in 'Swiss cheese' are due to the large amount of CO_2 produced by
    options:
