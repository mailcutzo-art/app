      - A - oxidation of FADH_2; B and C - oxidation of NADH and substrate level phosphorylation
      - A - oxidation of NADH; B and C - glycolysis and the link reaction
      - A - oxidation of NADH; B and C - substrate level phosphorylation and oxidation of FADH_2, in either order
