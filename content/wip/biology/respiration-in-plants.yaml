  - id: bio-resp-022
    topic: resp-fermentation
    subtopic: Comparison of the two fermentations
    concept: Features shared and not shared by lactic acid and alcoholic fermentation
    category: application
    format: multi-statement
    difficulty: 5
    time: 120
    ncert: true
    battle: false
    tags: [comparison, statements]
    stem: |-
      Consider the following statements about lactic acid fermentation and alcoholic fermentation.
      I. In both, NADH + H^+ is reoxidised to NAD^+.
      II. In both, CO_2 is released from pyruvic acid.
      III. In both, less than 7 per cent of the energy in glucose is released.
      IV. In both, lactate dehydrogenase catalyses the last step.
