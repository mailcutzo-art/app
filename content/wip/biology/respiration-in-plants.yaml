    tags: [comparison, aerobic-respiration, statements]
    stem: |-
      Consider the following statements comparing fermentation with aerobic respiration.
      I. Glycolysis is the first stage of both.
      II. In fermentation, NADH + H^+ is reoxidised in the mitochondria using O_2.
      III. Aerobic respiration oxidises glucose completely to CO_2 and H_2O through the Krebs' cycle, which needs O_2.
