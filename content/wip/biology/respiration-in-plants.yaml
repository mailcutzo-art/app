      - '*Propionibacterium sharmanii*'
      - '*Acetobacter aceti*'
    answer: 2
    explanation: NCERT notes that the large holes in Swiss cheese are caused by the CO_2 released by the bacterium Propionibacterium sharmanii. Lactobacillus makes curd, S. cerevisiae is the yeast of bread and brewing, and Acetobacter aceti makes acetic acid.
  - id: bio-resp-021
