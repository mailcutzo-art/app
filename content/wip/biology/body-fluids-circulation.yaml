questions:
  - id: bio-circ-001
    topic: circ-lymph
    subtopic: Formation of tissue fluid
    concept: Fluid that leaves the capillaries into the spaces between cells is interstitial (tissue) fluid
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [tissue-fluid, interstitial-fluid]
    stem: The fluid that leaves the blood capillaries and fills the spaces between the cells of a tissue is called
    options:
      - Plasma
      - Serum
      - Interstitial fluid
      - Gastric juice
    answer: 2
    explanation: As blood passes through the tissue capillaries, some water and small water-soluble substances move out into the spaces between the cells. NCERT calls this fluid the interstitial fluid or tissue fluid. Plasma lies inside the vessels, and serum is plasma without the clotting factors.
  - id: bio-circ-002
    topic: circ-lymph
    subtopic: Fat absorption through lymph
    concept: The lacteal is the large lymph vessel present in each intestinal villus
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [lacteal, villus]
    stem: Which structure in an intestinal villus is a large lymph vessel?
    options:
      - Lacteal
      - Glomerulus
      - Lacuna
      - Alveolus
    answer: 0
    explanation: Each villus has a network of capillaries and a large lymph vessel called the lacteal, through which fats are absorbed. A glomerulus is a capillary tuft of the nephron, a lacuna is a cavity holding cartilage or bone cells, and an alveolus is an air sac of the lung.
  - id: bio-circ-003
    topic: circ-lymph
    subtopic: Lymphatic system
    concept: The lymphatic system collects tissue fluid and drains it back to the major veins
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [lymphatic-system]
    stem: The elaborate network of vessels that collects the tissue fluid and drains it back to the major veins is the
    options:
      - Hepatic portal system
      - Pulmonary circulation
      - Systemic circulation
      - Lymphatic system
    answer: 3
    explanation: NCERT states that an elaborate network of vessels called the lymphatic system collects the tissue fluid and drains it back to the major veins. The other three are pathways of blood.
  - id: bio-circ-004
    topic: circ-lymph
    subtopic: Composition of lymph
    concept: Lymph is colourless and contains specialised lymphocytes for immune responses
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [lymph, lymphocytes]
    stem: Lymph is a colourless fluid that contains specialised cells responsible for the immune responses of the body. These cells are
    options:
      - Erythrocytes
      - Lymphocytes
      - Platelets
      - Basophils
    answer: 1
    explanation: NCERT describes lymph as a colourless fluid containing specialised lymphocytes, which are responsible for the immune responses. Erythrocytes carry haemoglobin, platelets help in clotting, and basophils take part in inflammatory reactions.
  - id: bio-circ-005
    topic: circ-lymph
    subtopic: Role of tissue fluid
    concept: Exchange of nutrients and gases between blood and cells occurs through the tissue fluid
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [tissue-fluid, exchange]
    stem: Nutrients and gases pass between the blood and the cells of a tissue through which fluid?
    options:
      - Tissue fluid
      - Plasma
      - Serum
      - Bile
    answer: 0
    explanation: NCERT states that the exchange of nutrients, gases and other substances between the blood and the cells always occurs through the tissue fluid that fills the spaces around the cells. Plasma and serum are not the fluid in contact with the cells, and bile is a digestive secretion.
  - id: bio-circ-006
    topic: circ-lymph
    subtopic: Composition of tissue fluid
    concept: Tissue fluid has the same mineral distribution as plasma
    category: concept
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [tissue-fluid, minerals]
    stem: The tissue fluid resembles the blood plasma in its
    options:
      - Content of larger proteins
      - Number of formed elements
      - Mineral distribution
      - Concentration of clotting factors
    answer: 2
    explanation: NCERT states that the interstitial fluid has the same mineral distribution as the plasma. The larger proteins, which include the clotting factors, and most of the formed elements stay behind in the blood vessels.
  - id: bio-circ-007
    topic: circ-lymph
    subtopic: Formation of tissue fluid
    concept: Larger proteins and most formed elements stay in the vessels when tissue fluid forms
    category: concept
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [tissue-fluid, capillary]
    stem: When tissue fluid is formed, which of the following is left behind in the blood vessels?
    options:
      - Water and small water-soluble substances
      - Larger proteins and most of the formed elements
      - Water and larger proteins
      - Small water-soluble substances and most of the formed elements
    answer: 1
    explanation: Water along with many small water-soluble substances moves out of the capillaries, leaving the larger proteins and most of the formed elements in the vessels. The other options pair a substance that leaves with one that stays, or send out something that does not leave.
  - id: bio-circ-008
    topic: circ-lymph
    subtopic: Fat absorption through lymph
    concept: Re-formed protein-coated fat globules in the mucosa are chylomicrons
    category: factual
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [chylomicrons, fat-absorption]
    stem: In the intestinal mucosa, the absorbed fatty acids and glycerol are re-formed into very small protein-coated fat globules called
    options:
      - Micelles
      - Chyme
      - Lacteals
      - Chylomicrons
    answer: 3
    explanation: Fatty acids and glycerol enter the mucosa in micelles and are re-formed into protein-coated fat globules called chylomicrons, which pass into the lacteals. Chyme is partly digested food in the stomach, and lacteals are lymph vessels, not globules.
  - id: bio-circ-009
    topic: circ-lymph
    subtopic: Lymph nodes
    concept: Lymph nodes trap micro-organisms and antigens present in the lymph
    category: factual
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [lymph-nodes, lymphoid-organs]
    stem: Small solid structures located at different points along the lymphatic system, which trap micro-organisms and antigens present in the lymph, are the
    options:
      - Thymus
      - Spleen
      - Lymph nodes
      - Bone marrow
    answer: 2
    explanation: Lymph nodes lie along the lymphatic system and trap micro-organisms or other antigens that enter the lymph and tissues. The trapped antigens activate the lymphocytes present there and cause the immune response. The spleen filters blood, and the thymus and bone marrow are primary lymphoid organs.
  - id: bio-circ-010
    topic: circ-lymph
    subtopic: Functions of lymph
    concept: Lymph does not carry oxygen bound to haemoglobin
    category: concept
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [lymph, functions]
    stem: Which of the following is NOT a function of lymph?
    options:
      - Carrying nutrients and hormones
      - Taking up the absorbed fats of the intestinal villi
      - Providing lymphocytes for the immune responses
      - Carrying oxygen bound to haemoglobin to the tissue cells
    answer: 3
    explanation: Lymph is an important carrier for nutrients and hormones, absorbs fats through the lacteals and contains lymphocytes for immune responses. Oxygen is carried bound to the haemoglobin of the red blood cells in the blood, so this is not a function of lymph.
  - id: bio-circ-011
    topic: circ-lymph
    subtopic: Composition of tissue fluid
    concept: Interstitial fluid is plasma-like in minerals but lacks the larger proteins and most formed elements
    category: concept
    format: direct
    difficulty: 4
    time: 85
    ncert: true
    battle: false
    tags: [tissue-fluid, composition]
    stem: Which description best fits the interstitial fluid formed as blood passes through the tissue capillaries?
    options:
      - Water and small water-soluble substances, with the same mineral distribution as plasma, but few larger proteins and few formed elements
      - Water, small solutes and all the plasma proteins, but no formed elements
      - Water, small solutes, larger proteins and lymphocytes, with fewer minerals than plasma
      - Plasma without its clotting factors, together with all the formed elements
    answer: 0
    explanation: NCERT says that water and small water-soluble substances move out, leaving the larger proteins and most formed elements in the vessels, and that the fluid has the same mineral distribution as plasma. Plasma without clotting factors is serum, which is not tissue fluid.
  - id: bio-circ-012
