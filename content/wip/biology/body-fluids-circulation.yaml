      - P-1, Q-2, R-3, S-4
      - P-1, Q-2, R-4, S-3
      - P-3, Q-1, R-2, S-4
    answer: 2
    explanation: A group A recipient has anti-B and so clumps groups B and AB (1). A group B recipient has anti-A and clumps groups A and AB (2). A group AB recipient has no antibody and clumps none (4). A group O recipient has both antibodies and clumps A, B and AB (3).
