    stem: |-
      Match each recipient group in List I with the donor groups whose RBCs would be clumped by it in List II.
      List I
      P. Recipient of group A
      Q. Recipient of group B
      R. Recipient of group AB
      S. Recipient of group O
      List II
      1. Groups B and AB
      2. Groups A and AB
      3. Groups A, B and AB
      4. None of the ABO groups
    options:
