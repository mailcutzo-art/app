      - Pumping of blood from the left ventricle to the limbs
      - Release of water and small solutes from the blood capillaries into the tissue spaces
      - Formation of red blood cells in the limbs
    answer: 0
    explanation: Wuchereria lives in the lymphatic vessels of the lower limbs, and the lymphatic system is the network that collects the tissue fluid and drains it back to the major veins. The pumping of blood is done by the heart, and the fluid still leaves the blood capillaries because that does not depend on the lymphatic vessels.
  - id: bio-circ-030
    topic: circ-lymph
    subtopic: Tissue fluid and lymph
    concept: Identify plasma, tissue fluid and lymph from descriptions and relate them
    category: application
    format: case
    difficulty: 5
    time: 120
    ncert: false
    battle: false
    tags: [case, plasma, tissue-fluid, lymph]
    stem: |-
      Three body fluids from a healthy person were analysed.
      Fluid X is colourless, flows in thin vessels that end in the major veins, and contains specialised lymphocytes.
      Fluid Y is straw coloured and viscous, lies inside the blood vessels, and contains fibrinogen.
      Fluid Z was collected from the spaces between the tissue cells; its minerals are distributed as in Y, but it has far fewer larger proteins and formed elements.
      Which interpretation agrees with NCERT?
    options:
      - Z arises when Y loses its clotting factors, and X is formed from Z inside the lymph nodes
      - Z arises as water and small solutes leave the capillaries carrying Y, and X is the fluid of the system that drains Z into the major veins
      - Y is serum because it contains fibrinogen, and Z is lymph because it lies outside the blood vessels
      - X arises when larger proteins and formed elements leave the capillaries, and Z returns to the blood through the lacteals
    answer: 1
    explanation: Y is plasma. Water and small water-soluble substances leave the capillaries to form Z, the tissue fluid, which is collected by the lymphatic system and drained into the major veins; the fluid inside that system is X, the lymph. Serum lacks the clotting factors, so Y is not serum, and tissue fluid is not formed by loss of clotting factors.
