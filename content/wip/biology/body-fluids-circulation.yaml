  - id: bio-circ-013
    topic: circ-lymph
    subtopic: Tissue fluid and lymph
    concept: The fluid in the lymphatic system is lymph, while that between cells is interstitial or tissue fluid
    category: concept
    format: statement-pair
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [lymph, tissue-fluid]
    stem: |-
      Statement I: The fluid present in the lymphatic system is called the interstitial fluid.
      Statement II: The fluid released from the capillaries into the spaces between the cells is also known as tissue fluid.
    options:
      - Both Statement I and Statement II are correct
      - Both Statement I and Statement II are incorrect
      - Statement I is correct but Statement II is incorrect
      - Statement I is incorrect but Statement II is correct
    answer: 3
    explanation: The fluid released from the capillaries into the tissue spaces is the interstitial or tissue fluid, so Statement II is correct. The fluid present in the lymphatic system is called lymph, so Statement I is wrong.
  - id: bio-circ-014
    topic: circ-lymph
    subtopic: Composition of lymph
    concept: Lymph is colourless, not straw coloured, and chylomicrons go to lacteals, not blood capillaries
    category: concept
    format: statement-pair
    difficulty: 4
    time: 85
    ncert: true
    battle: false
    tags: [lymph, chylomicrons]
    stem: |-
      Statement I: Lymph is a straw coloured fluid containing specialised lymphocytes.
      Statement II: Chylomicrons are carried into the blood capillaries of the intestinal villi.
    options:
      - Both Statement I and Statement II are correct
      - Both Statement I and Statement II are incorrect
      - Statement I is correct but Statement II is incorrect
      - Statement I is incorrect but Statement II is correct
    answer: 1
    explanation: Lymph does contain specialised lymphocytes, but it is colourless; the straw colour belongs to plasma, so Statement I is wrong. Chylomicrons are transported into the lymph vessels (lacteals) of the villi, not the blood capillaries, so Statement II is also wrong.
  - id: bio-circ-015
    topic: circ-lymph
    subtopic: Fat absorption through lymph
    concept: Insoluble fatty acids and glycerol are absorbed through the lacteals
    category: concept
    format: assertion-reason
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [fat-absorption, lacteal]
    stem: |-
      Assertion (A): Fats are absorbed through lymph in the lacteals of the intestinal villi.
      Reason (R): Fatty acids and glycerol are insoluble and cannot be absorbed directly into the blood.
    options:
      - Both A and R are true and R is the correct explanation of A
      - Both A and R are true but R is not the correct explanation of A
      - A is true but R is false
      - A is false but R is true
    answer: 0
    explanation: Fatty acids and glycerol, being insoluble, cannot be absorbed into the blood. They are packed into micelles and then into chylomicrons, which enter the lacteals. The insolubility is the reason fats go through lymph, so R explains A.
  - id: bio-circ-016
    topic: circ-lymph
    subtopic: Composition of lymph
    concept: Lymph takes part in immune responses, and its colour is unrelated to that role
    category: concept
    format: assertion-reason
    difficulty: 4
    time: 85
    ncert: true
    battle: false
    tags: [lymph, immune-response]
    stem: |-
      Assertion (A): Lymph takes part in the immune responses of the body.
      Reason (R): Lymph is a colourless fluid.
    options:
      - Both A and R are true and R is the correct explanation of A
      - Both A and R are true but R is not the correct explanation of A
      - A is true but R is false
      - A is false but R is true
    answer: 1
    explanation: Lymph is a colourless fluid containing specialised lymphocytes, which are responsible for immune responses, so both statements are true. The immune role comes from the lymphocytes, not from the lack of colour, so R does not explain A.
  - id: bio-circ-017
    topic: circ-lymph
    subtopic: Composition of tissue fluid
    concept: Minerals pass out of the capillaries freely, so tissue fluid has the plasma mineral distribution
    category: concept
    format: assertion-reason
    difficulty: 4
    time: 85
    ncert: true
    battle: false
    tags: [tissue-fluid, minerals]
    stem: |-
      Assertion (A): The tissue fluid has the same mineral distribution as the plasma.
      Reason (R): Mineral ions such as Na^+ and Cl^- cannot leave the blood capillaries and stay in the vessels along with the larger proteins.
    options:
      - Both A and R are true and R is the correct explanation of A
      - Both A and R are true but R is not the correct explanation of A
      - A is true but R is false
      - A is false but R is true
    answer: 2
    explanation: NCERT states that the tissue fluid has the same mineral distribution as the plasma, so A is true. R is false because the small water-soluble substances, including mineral ions, move out of the capillaries; only the larger proteins and most formed elements stay behind.
  - id: bio-circ-018
    topic: circ-lymph
