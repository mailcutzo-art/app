  - id: bio-circ-019
    topic: circ-lymph
    subtopic: Composition of lymph
    concept: Spot the incorrect statements about origin, role and fat absorption in lymph
    category: application
    format: multi-statement
    difficulty: 4
    time: 85
    ncert: true
    battle: false
    tags: [lymph, multi-statement]
    stem: |-
      Consider the following statements about lymph.
      I. It is a colourless fluid that contains specialised lymphocytes.
      II. It is first formed in the lymphatic vessels and then leaves them to fill the spaces between the cells.
      III. It is an important carrier for nutrients and hormones.
      IV. The digested glucose and amino acids are absorbed into the lacteals of the villi.
      Which of the statements are incorrect?
    options:
      - I and III only
      - I and II only
      - III and IV only
      - II and IV only
    answer: 3
    explanation: Statements I and III are NCERT lines. Statement II reverses the direction, because the tissue fluid is collected from the tissue spaces into the lymphatic system. Statement IV is wrong because glucose and amino acids are absorbed into the blood, whereas fats go into the lacteals.
  - id: bio-circ-020
    topic: circ-lymph
    subtopic: Composition of lymph
    concept: B and T lymphocytes of lymph are responsible for the immune responses
    category: concept
    format: statements
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [lymphocytes, immune-response]
    stem: Which statement about the lymphocytes present in lymph is correct?
    options:
      - They are granulocytes that secrete histamine, serotonin and heparin
      - They are phagocytic cells like neutrophils and monocytes
      - They are of two major types, B and T, and both are responsible for immune responses
      - They carry haemoglobin and give the fluid its colour
    answer: 2
    explanation: Lymphocytes are of two major types, B and T, and both are responsible for the immune responses of the body. The first option describes basophils, the second describes neutrophils and monocytes, and haemoglobin is found in the red blood cells.
