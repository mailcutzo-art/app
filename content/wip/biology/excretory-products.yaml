  - id: bio-excr-317
    topic: excr-kidney-regulation
    subtopic: Sweating on a trek
    concept: Explain scanty concentrated urine after heavy sweating through osmoreceptors and ADH
    category: application
    format: case
    difficulty: 3
    time: 50
    ncert: false
    battle: false
    tags: [adh, osmoreceptors, case]
    stem: During a long summer trek a man sweats heavily and drinks no water. By evening his urine is scanty and concentrated. Which statement best explains this?
    options:
      - The fall in fluid volume switched off the osmoreceptors, so ADH release stopped and water was conserved
      - Increased blood flow to the atria released ANF, which increased water reabsorption in the tubule
      - The JG cells stopped releasing renin, so angiotensin II dilated the blood vessels and filtration decreased
      - The fluid loss activated the osmoreceptors, which stimulated the hypothalamus to release ADH, and ADH increased water reabsorption in the tubule
    answer: 3
    explanation: Heavy fluid loss activates the osmoreceptors, which stimulate the hypothalamus to release ADH from the neurohypophysis. ADH facilitates water reabsorption from the latter parts of the tubule, so little concentrated urine is passed. A loss of fluid does not switch the osmoreceptors off, ANF is released when atrial blood flow increases, and angiotensin II is a vasoconstrictor.
  - id: bio-excr-318
    topic: excr-kidney-regulation
    subtopic: Narrowed renal artery
    concept: Predict the response of the JG cells when blood flow to one kidney is reduced
    category: application
    format: case
    difficulty: 4
    time: 85
    ncert: false
    battle: false
    tags: [renin, jg-cells, case]
    stem: A patient has a narrowing of the artery supplying one kidney, so the glomerular blood flow and pressure in that kidney are low. Which change is expected?
    options:
      - The JG cells release less renin, so angiotensin II and aldosterone fall
      - The atrial wall releases ANF, which constricts the vessels and restores the glomerular pressure
      - The neurohypophysis stops releasing ADH, so more water is excreted and the glomerular pressure rises
      - The JG cells release more renin, leading to more angiotensin II and aldosterone and a rise in the blood pressure
    answer: 3
    explanation: A fall in glomerular blood flow or pressure activates the JG cells to release renin, which leads to angiotensin II and then aldosterone, and both raise the blood pressure and GFR. ANF dilates vessels and is released when atrial blood flow rises, and ADH does not restore glomerular pressure by being stopped.
  - id: bio-excr-319
    topic: excr-kidney-regulation
    subtopic: Blocked response to angiotensin II
    concept: Predict the outcome when the adrenal cortex cannot respond to angiotensin II
    category: application
    format: case
    difficulty: 5
    time: 120
    ncert: false
    battle: false
    tags: [angiotensin-ii, aldosterone, case]
    stem: A drug stops the adrenal cortex from responding to angiotensin II but does not affect the action of angiotensin II on blood vessels. After a fall in GFR, which outcome is expected?
    options:
      - Renin release stops, so no angiotensin II is formed and the vessels stay dilated
      - Renin is still released and the vessels constrict, but less aldosterone is released and less Na^{+} and water are reabsorbed from the distal parts
      - The vessels fail to constrict and the glomerular pressure falls further, but aldosterone release rises
      - ANF release increases and replaces aldosterone in reabsorbing Na^{+} and water
    answer: 1
    explanation: The fall in GFR still activates the JG cells to release renin, so angiotensin II forms and constricts the vessels. Because the adrenal cortex cannot respond, less aldosterone is released and less Na^{+} and water are reabsorbed from the distal parts. ANF dilates vessels and does not reabsorb Na^{+} or water.
  - id: bio-excr-320
    topic: excr-kidney-regulation
    subtopic: ANF infusion
    concept: Predict the effect of infused ANF on blood vessels and on the renin-angiotensin mechanism
    category: application
    format: case
    difficulty: 4
    time: 85
    ncert: false
    battle: false
    tags: [anf, case]
    stem: A researcher infuses ANF into a healthy animal. Which change is expected?
    options:
      - The blood vessels constrict and the blood pressure rises, reinforcing the renin–angiotensin mechanism
      - The blood vessels dilate and the blood pressure falls, opposing the renin–angiotensin mechanism
      - The adrenal cortex releases more aldosterone, so more Na^{+} and water are reabsorbed
      - The glomerular blood pressure and the GFR increase because the afferent arteriole constricts
    answer: 1
    explanation: ANF causes vasodilation and thereby decreases the blood pressure. This is the opposite of the effect of angiotensin II and aldosterone, so ANF acts as a check on the renin-angiotensin mechanism. Vasoconstriction, more aldosterone and a higher glomerular pressure are effects of the opposing mechanism.
