    ncert: false
    battle: false
    diagram: 'Line graph. x-axis: time in hours after drinking 1 litre of water at time 0 (marks at 0, 1, 2, 3 and 4). y-axis: relative level in arbitrary units. Curve X (solid line) starts high at time 0, falls steeply to a low level within the first hour, stays low until about 2.5 hours, then climbs back towards its starting level by 4 hours. Curve Y (dashed line) starts low, begins to rise after about 0.5 hour, peaks at a high value at about 1.5 hours and then falls back to its starting low level by 4 hours.'
    tags: [adh, graph, feedback]
    stem: The graph shows two variables, X and Y, after a person drinks a large volume of water. Which interpretation is correct?
    options:
      - 'X is plasma ADH and Y is urine volume: the extra fluid switches off the osmoreceptors, ADH release is suppressed and diuresis follows'
      - 'X is urine volume and Y is plasma ADH: the extra fluid activates the osmoreceptors and ADH release rises'
      - 'X is plasma ADH and Y is urine volume: the extra fluid activates the osmoreceptors, so ADH release falls'
      - 'X is plasma ADH and Y is urine concentration: the extra fluid switches off the osmoreceptors, so the urine becomes more concentrated'
    answer: 0
    explanation: Plasma ADH (X) falls because the rise in body fluid volume switches off the osmoreceptors. With less ADH, less water is reabsorbed, so the urine volume (Y) rises (diuresis) and the urine is dilute. Both ADH and urine curves return to normal as the extra water is lost.
  - id: bio-excr-315
    topic: excr-kidney-regulation
    subtopic: Renin release and glomerular pressure
    concept: Interpret a graph of renin release against glomerular blood pressure as a feedback
    category: application
    format: graph
    difficulty: 3
    time: 50
    ncert: false
    battle: false
    diagram: 'Line graph. x-axis: glomerular blood pressure in arbitrary units, increasing to the right. y-axis: rate of renin release from the JG cells in arbitrary units. A single smooth curve starts high at the left, falls steadily as the pressure increases and flattens near zero at the right end.'
    tags: [renin, graph, feedback]
    stem: The graph relates the release of renin by the JG cells to the glomerular blood pressure. Which conclusion agrees with NCERT?
