questions:
  - id: bio-excr-001
    topic: excr-micturition-organs
    subtopic: Micturition reflex
    concept: The release of urine is micturition; the neural mechanism causing it is the micturition reflex
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [micturition, urinary-bladder]
    stem: The process of release of urine from the urinary bladder is called
    options:
      - Ultrafiltration
      - Micturition
      - Tubular secretion
      - Osmoregulation
    answer: 1
    explanation: NCERT states that the release of urine is called micturition, and the neural mechanisms causing it constitute the micturition reflex. Ultrafiltration occurs at the glomerulus, tubular secretion adds substances to the filtrate, and osmoregulation maintains water and ion balance.
  - id: bio-excr-002
    topic: excr-micturition-organs
    subtopic: Excretory role of lungs
    concept: Lungs remove CO_2 and significant quantities of water every day
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [lungs, excretion]
    stem: Besides carbon dioxide, the lungs also remove significant quantities of which substance every day?
    options:
      - Urea
      - Bilirubin
      - Sterols
      - Water
    answer: 3
    explanation: NCERT says our lungs remove large amounts of CO_2 (about 200 mL per minute) and also significant quantities of water every day. Urea is excreted mainly by the kidneys, bilirubin through bile and sterols through sebum.
  - id: bio-excr-003
    topic: excr-micturition-organs
    subtopic: Urine characteristics
    concept: An adult human excretes on an average 1 to 1.5 litres of urine per day
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [urine, volume]
    stem: On an average, an adult human excretes how much urine per day?
    options:
      - 0.2 to 0.5 litre
      - 0.5 to 1 litre
      - 1 to 1.5 litres
      - 2.5 to 3 litres
    answer: 2
    explanation: NCERT gives the average urine output of an adult human as 1 to 1.5 litres per day. The other volumes are not the average values stated in the textbook.
  - id: bio-excr-004
    topic: excr-micturition-organs
    subtopic: Urine characteristics
    concept: Normal urine is light yellow, watery, slightly acidic (pH 6.0) with a characteristic odour
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [urine, ph]
    stem: Normal human urine is a light yellow watery fluid with a characteristic odour, and its reaction is
    options:
      - Slightly acidic, pH about 6.0
      - Neutral, pH 7.0
      - Slightly alkaline, pH about 8.0
      - Strongly acidic, pH about 2.0
    answer: 0
    explanation: NCERT describes the urine as a light yellow coloured watery fluid that is slightly acidic (pH 6.0) and has a characteristic odour. It is neither neutral nor alkaline, and it is far from strongly acidic.
  - id: bio-excr-005
    topic: excr-micturition-organs
    subtopic: Excretory role of skin
    concept: Sweat is a watery fluid containing NaCl, small amounts of urea and lactic acid
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [sweat, skin]
    stem: The sweat produced by the sweat glands is a watery fluid that contains
    options:
      - sterols, hydrocarbons and waxes
      - NaCl, small amounts of urea and lactic acid
      - bilirubin, biliverdin and cholesterol
      - CO_2 and water vapour
    answer: 1
    explanation: NCERT says sweat contains NaCl, small amounts of urea, lactic acid and similar substances. Sterols, hydrocarbons and waxes come from sebum, bilirubin, biliverdin and cholesterol from bile, and CO_2 leaves through the lungs.
  - id: bio-excr-006
    topic: excr-micturition-organs
    subtopic: Sebaceous glands
    concept: Sebaceous glands eliminate sterols, hydrocarbons and waxes through sebum
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [sebum, skin]
    stem: Sterols, hydrocarbons and waxes are eliminated from the body through the secretion of
    options:
      - sweat glands
      - salivary glands
      - hepatic cells
      - sebaceous glands
    answer: 3
    explanation: Sebaceous glands eliminate sterols, hydrocarbons and waxes through sebum, which gives the skin a protective oily covering. Sweat glands release a watery fluid, and hepatic cells release bile.
  - id: bio-excr-007
    topic: excr-micturition-organs
    subtopic: Micturition reflex
    concept: Bladder smooth muscle contracts while the urethral sphincter relaxes during micturition
    category: concept
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [micturition, sphincter]
    stem: During micturition, the motor messages sent by the CNS cause
    options:
      - relaxation of bladder smooth muscles and contraction of the urethral sphincter
      - contraction of bladder smooth muscles and contraction of the urethral sphincter
      - contraction of bladder smooth muscles and relaxation of the urethral sphincter
      - relaxation of bladder smooth muscles and relaxation of the urethral sphincter
    answer: 2
    explanation: The CNS passes motor messages that initiate contraction of the smooth muscles of the bladder and simultaneous relaxation of the urethral sphincter, which releases the urine. Any other combination would keep the urine in the bladder or fail to push it out.
  - id: bio-excr-008
    topic: excr-micturition-organs
    subtopic: Excretory role of skin
    concept: The primary function of sweat is cooling, though it also removes some wastes
    category: concept
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [sweat, cooling]
    stem: The primary function of the sweat produced by the sweat glands is to
    options:
      - facilitate a cooling effect on the body surface
      - remove nitrogenous wastes such as urea
      - form a protective oily covering over the skin
      - eliminate sterols and waxes from the body
    answer: 0
    explanation: NCERT states that the primary function of sweat is to facilitate a cooling effect on the body surface, although it also helps in the removal of some wastes. The oily covering and the sterols and waxes belong to sebum.
  - id: bio-excr-009
    topic: excr-micturition-organs
    subtopic: Urine analysis
    concept: Ketone bodies in urine (ketonuria) are indicative of diabetes mellitus
    category: concept
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [ketonuria, diabetes-mellitus]
    stem: Ketone bodies found in the urine are described by which term, and what do they indicate?
    options:
      - Glycosuria; diabetes mellitus
      - Ketonuria; diabetes mellitus
      - Ketonuria; renal calculi
      - Glycosuria; glomerular nephritis
    answer: 1
    explanation: Presence of ketone bodies in urine is called ketonuria, and along with glycosuria (glucose in urine) it is indicative of diabetes mellitus. Glycosuria refers to glucose, not ketone bodies, and neither term points to renal calculi or glomerular nephritis.
  - id: bio-excr-010
    topic: excr-micturition-organs
    subtopic: Excretory role of liver
    concept: Bile carries cholesterol, bilirubin, degraded steroid hormones, vitamins and drugs, but not lactic acid
    category: application
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [liver, bile]
    stem: Which one of the following is NOT eliminated through the bile secreted by the liver?
    options:
      - Cholesterol
      - Degraded steroid hormones
      - Bilirubin
      - Lactic acid
    answer: 3
    explanation: NCERT lists bilirubin, biliverdin, cholesterol, degraded steroid hormones, vitamins and drugs among the substances in bile. Lactic acid is one of the constituents of sweat.
  - id: bio-excr-011
    topic: excr-micturition-organs
    subtopic: Urine characteristics
    concept: An adult excretes 25 to 30 g of urea per day, so the weekly amount is 175 to 210 g
    category: numerical
    format: direct
    difficulty: 3
    time: 50
    ncert: false
    battle: true
    formula: Urea in 7 days = 7 × (25 to 30 g)
    tags: [urea, urine]
    stem: An adult excretes on an average 25–30 g of urea per day. How much urea is excreted in a week?
    options:
      - 25–30 g
      - 75–90 g
      - 175–210 g
      - 250–300 g
    answer: 2
    explanation: Weekly urea = 7 × 25 g = 175 g to 7 × 30 g = 210 g. The value 75–90 g corresponds to 3 days and 250–300 g to 10 days.
  - id: bio-excr-012
    topic: excr-micturition-organs
    subtopic: Micturition reflex
    concept: Complete sequence of the micturition reflex, from stretching to motor messages
    category: concept
    format: statements
    difficulty: 4
    time: 85
    ncert: true
    battle: false
    tags: [micturition, reflex]
    stem: Which one of the following statements about micturition is correct?
    options:
      - Stretch receptors in the bladder wall send signals to the CNS, which passes motor messages to the bladder muscles and the urethral sphincter.
      - The CNS passes motor messages that relax the smooth muscles of the bladder while the urethral sphincter contracts.
      - The signal for emptying the bladder is initiated by the CNS before the bladder wall is stretched.
      - Stretch receptors present in the wall of the urethra send signals to the CNS as the bladder gets filled.
    answer: 0
    explanation: Filling stretches the bladder wall, its stretch receptors signal the CNS, and the CNS sends motor messages to the bladder muscles and the urethral sphincter. Relaxation of the bladder muscle with a contracting sphincter would retain urine, the signal is initiated by stretching, and the receptors lie in the bladder wall, not the urethra.
  - id: bio-excr-013
    topic: excr-micturition-organs
    subtopic: Urine characteristics
    concept: Combine colour, pH, volume and urea content of normal urine
    category: concept
    format: multi-statement
    difficulty: 4
    time: 85
    ncert: true
    battle: false
    tags: [urine, characteristics]
    stem: |-
      Consider the following statements about the urine of a healthy adult human.
      I. It is a light yellow coloured watery fluid with a characteristic odour.
      II. It is slightly acidic, with a pH of about 6.0.
      III. On an average, 2.5 to 3 litres of urine are excreted per day.
      IV. On an average, 25–30 g of urea is excreted per day.
      Which of the statements are correct?
    options:
      - I, II and III only
      - I, II and IV only
      - II, III and IV only
      - I, III and IV only
    answer: 1
    explanation: Statements I, II and IV are NCERT facts. Statement III is wrong because the average urine output of an adult is 1 to 1.5 litres per day.
  - id: bio-excr-014
    topic: excr-micturition-organs
    subtopic: Excretion through lungs, liver and skin
    concept: Combine lungs, bile, sweat and sebum facts; the half-true statement on sweat is the trap
    category: concept
    format: multi-statement
    difficulty: 5
    time: 120
    ncert: true
    battle: false
    tags: [lungs, liver, skin]
    stem: |-
      Consider the following statements about excretion through organs other than the kidneys.
      I. Lungs remove CO_2 at approximately 200 mL per minute, which is about 12 litres per hour.
      II. Bile secreted by the liver can carry degraded steroid hormones, vitamins and drugs out of the body.
      III. Sweat contains NaCl, small amounts of urea and lactic acid, and its primary function is excretion of urea.
      IV. Sebaceous glands eliminate sterols, hydrocarbons and waxes through sebum.
      Which of the statements are correct?
    options:
      - I, II and III only
      - II, III and IV only
      - I and IV only
      - I, II and IV only
    answer: 3
    explanation: Statement I follows from 200 mL × 60 = 12 000 mL = 12 L per hour. Statements II and IV are NCERT facts. Statement III is wrong because the primary function of sweat is to cool the body surface, even though it also removes some wastes such as small amounts of urea.
  - id: bio-excr-015
    topic: excr-micturition-organs
    subtopic: Micturition reflex
    concept: Stretching of the filled bladder initiates the signal; there are no chemoreceptors for urea
    category: concept
    format: statement-pair
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [micturition, stretch-receptors]
    stem: |-
      Statement I: Urine is stored in the urinary bladder until a voluntary signal is given by the CNS.
      Statement II: The signal for micturition is initiated by chemoreceptors in the bladder wall that sense the urea concentration of urine.
    options:
      - Both Statement I and Statement II are correct
      - Both Statement I and Statement II are incorrect
      - Statement I is correct but Statement II is incorrect
      - Statement I is incorrect but Statement II is correct
    answer: 2
    explanation: Statement I is correct as stated in NCERT. Statement II is wrong because the signal is initiated by stretching of the bladder as it fills, which stimulates the stretch receptors in its wall.
  - id: bio-excr-016
    topic: excr-micturition-organs
    subtopic: Excretory role of skin
