  - id: bio-excr-024
    topic: excr-micturition-organs
    subtopic: Micturition reflex
    concept: Order of events of the micturition reflex from filling to release
    category: concept
    format: ordering
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [ordering, micturition]
    stem: |-
      Arrange the following events of micturition in the correct sequence.
      P. Stretch receptors on the bladder wall send signals to the CNS
      Q. Smooth muscles of the bladder contract and the urethral sphincter relaxes
      R. The bladder gets filled with urine and its wall is stretched
      S. The CNS passes motor messages to the bladder
    options:
      - P, R, S, Q
      - R, S, P, Q
      - R, P, Q, S
      - R, P, S, Q
    answer: 3
    explanation: Filling and stretching of the bladder (R) stimulates the stretch receptors, which signal the CNS (P). The CNS then passes motor messages (S), which cause contraction of the bladder muscles and relaxation of the urethral sphincter (Q).
  - id: bio-excr-025
    topic: excr-micturition-organs
    subtopic: Excretory role of liver
    concept: Sequence of a urea molecule from formation in the liver to release from the body
    category: concept
    format: ordering
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [ordering, urea, liver]
    stem: |-
      Arrange the following in the sequence in which a urea molecule passes from its formation to its release in a mammal.
      P. Release of urine through the urethra after the voluntary signal from the CNS
      Q. Conversion of ammonia into urea in the liver and release of urea into the blood
      R. Storage of urine in the urinary bladder
      S. Filtration of blood and excretion of urea by the kidneys
    options:
      - Q, S, R, P
      - S, Q, R, P
      - Q, R, S, P
      - Q, S, P, R
    answer: 0
    explanation: Ammonia is converted into urea in the liver and released into the blood (Q). The kidneys filter and excrete the urea in urine (S), which is stored in the bladder (R) until a voluntary signal from the CNS allows its release through the urethra (P).
  - id: bio-excr-026
    topic: excr-micturition-organs
    subtopic: Micturition reflex
    concept: Read a micturition reflex diagram showing receptor signals, motor messages, muscle and sphincter action
    category: concept
    format: diagram
    difficulty: 5
    time: 120
    ncert: true
    battle: false
    diagram: Schematic of the micturition reflex in a person whose bladder is full and who has received the voluntary signal to pass urine. Bottom centre is a rounded, stretched urinary bladder with a thick wall; the wall is labelled P (smooth muscle of the bladder wall). Small zig-zag receptor symbols embedded in the inner side of the same wall are labelled Q (stretch receptors). The urethra leaves from the base of the bladder going downward and a ring-shaped muscle around it is labelled R (urethral sphincter). At the top of the figure is a rectangular box labelled S (central nervous system). Three arrows join the parts. Arrow 1, drawn in blue, runs from Q up to S. Arrow 2, drawn in red, runs from S down to P. Arrow 3, drawn in red, runs from S down to R.
    tags: [micturition, diagram]
    stem: In the figure of the micturition reflex, which description of the events is correct?
    options:
      - Arrow 1 carries motor messages from the CNS; P relaxes and R contracts
      - Arrow 1 carries signals from Q to the CNS; P relaxes and R relaxes
      - Arrow 1 carries signals from Q to the CNS; arrows 2 and 3 carry motor messages; P contracts and R relaxes
      - Arrow 1 carries signals from Q to the CNS; arrows 2 and 3 carry motor messages; P contracts and R contracts
    answer: 2
    explanation: Stretch receptors (Q) send signals to the CNS (arrow 1). The CNS passes motor messages (arrows 2 and 3) causing contraction of the bladder smooth muscle (P) and simultaneous relaxation of the urethral sphincter (R). A contracting sphincter would hold the urine back.
