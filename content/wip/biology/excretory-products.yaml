    diagram: 'A student''s flowchart of the renin-angiotensin mechanism, seven boxes joined by arrows from top to bottom. Box 1: ''Rise in glomerular blood pressure''. Box 2: ''JG cells release renin''. Box 3: ''Renin converts angiotensinogen to angiotensin I and then to angiotensin II''. Box 4: ''Angiotensin II dilates blood vessels''. Box 5: ''Angiotensin II activates the adrenal cortex to release aldosterone''. Box 6: ''Aldosterone causes reabsorption of Na^{+} and water from the proximal tubule''. Box 7: ''Blood pressure and GFR rise''.'
