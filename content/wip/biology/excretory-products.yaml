      Assertion (A): Sweat helps in the removal of small amounts of urea from the body.
      Reason (R): The primary function of sweat is to facilitate a cooling effect on the body surface.
    options:
      - Both A and R are true and R is the correct explanation of A
      - Both A and R are true but R is not the correct explanation of A
      - A is true but R is false
      - A is false but R is true
    answer: 1
