    stem: |-
      After a long run on a hot day, a runner feels cooler, finds white salt marks on her clothes and notices a thin oily film on her face.
      Which explanation agrees with NCERT?
    options:
      - Sweat, the main route of urea excretion, left the salt marks; the oily film is another secretion of the sweat glands.
