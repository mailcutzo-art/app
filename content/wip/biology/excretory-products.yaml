    concept: Label the vessels, the region of contact and the tubule at the juxtaglomerular apparatus
    category: application
    format: diagram
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    diagram: Schematic of one renal corpuscle and the tubule beside it. A tuft of capillaries (the glomerulus) lies inside a cup-shaped Bowman's capsule. Vessel P enters the tuft and carries blood towards it (arrow pointing in); vessel Q leaves the tuft and carries blood away (arrow pointing out). A coiled tubule S, returning from the loop of Henle, passes back to touch vessel P close to the tuft. At the point of contact an oval R is drawn around the modified wall cells of S and of P.
    tags: [jga, diagram]
    stem: The figure shows a renal corpuscle and the tubule beside it. Which option correctly names P, Q, R and S?
    options:
      - P - efferent arteriole; Q - afferent arteriole; R - juxtaglomerular apparatus; S - distal convoluted tubule
      - P - afferent arteriole; Q - efferent arteriole; R - juxtaglomerular apparatus; S - proximal convoluted tubule
      - P - afferent arteriole; Q - efferent arteriole; R - Malpighian body; S - collecting duct
      - P - afferent arteriole; Q - efferent arteriole; R - juxtaglomerular apparatus; S - distal convoluted tubule
    answer: 3
    explanation: Blood enters the glomerulus by the afferent arteriole (P) and leaves by the efferent arteriole (Q). The tubule that returns from the loop of Henle to touch the afferent arteriole is the distal convoluted tubule (S), and the oval R, where their modified cells meet, is the JGA.
  - id: bio-excr-311
