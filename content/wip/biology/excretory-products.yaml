    answer: 2
    explanation: Three boxes are wrong. Box 1 should be a fall, not a rise, in the glomerular blood pressure; box 4 is wrong because angiotensin II is a powerful vasoconstrictor, not a dilator; and in box 6 aldosterone acts on the distal parts, not the proximal tubule. Boxes 2, 3, 5 and 7 agree with NCERT.
  - id: bio-excr-314
    topic: excr-kidney-regulation
