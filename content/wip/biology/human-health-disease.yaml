questions:
  - id: bio-health-001
    topic: health-aids
    subtopic: Meaning of AIDS
    concept: AIDS stands for Acquired Immuno Deficiency Syndrome
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [aids, abbreviation]
    stem: AIDS is the abbreviation of
    options:
      - Acquired Infectious Disease Syndrome
      - Autoimmune Deficiency Syndrome
      - Acquired Immuno Deficiency Syndrome
      - Acute Immuno Deficiency Syndrome
    answer: 2
    explanation: 'NCERT states that AIDS stands for Acquired Immuno Deficiency Syndrome: a deficiency of the immune system that is acquired during the lifetime of a person. Autoimmune refers to the body attacking its own cells, which is a different condition.'
  - id: bio-health-002
    topic: health-aids
    subtopic: History of AIDS
    concept: AIDS was first reported in 1981
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [aids, history]
    stem: AIDS was first reported in the year
    options:
      - '1951'
      - '1971'
      - '1991'
      - '1981'
    answer: 3
    explanation: NCERT states that AIDS was first reported in 1981 and then spread all over the world, killing a very large number of people.
  - id: bio-health-003
    topic: health-aids
    subtopic: Diagnosis of AIDS
    concept: ELISA is a widely used diagnostic test for AIDS
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [elisa, diagnosis]
    stem: A widely used diagnostic test for AIDS is
    options:
      - Widal test
      - Biopsy
      - ELISA
      - Computed tomography (CT)
    answer: 2
    explanation: NCERT names the enzyme linked immuno-sorbent assay (ELISA) as a widely used diagnostic test for AIDS. The Widal test is used to confirm typhoid, while biopsy and CT are used in cancer detection.
  - id: bio-health-004
    topic: health-aids
    subtopic: Structure of HIV
    concept: HIV is a retrovirus with an envelope enclosing an RNA genome
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [hiv, retrovirus]
    stem: HIV, the virus that causes AIDS, belongs to the group of viruses called
    options:
      - bacteriophages
      - rhinoviruses
      - retroviruses
      - mosaic viruses
    answer: 2
    explanation: NCERT describes HIV as a member of a group of viruses called retroviruses, which have an envelope enclosing the RNA genome. Bacteriophages infect bacteria, rhinoviruses cause the common cold and mosaic viruses infect plants.
  - id: bio-health-005
    topic: health-aids
    subtopic: Transmission of HIV
    concept: HIV passes from an infected mother to the child through the placenta
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [transmission, placenta]
    stem: According to NCERT, HIV can pass from an infected mother to her child through the
    options:
      - touch while holding the child
      - placenta
      - air breathed out while speaking
      - food prepared by the mother
    answer: 1
    explanation: NCERT lists four routes of HIV transmission and the fourth is from the infected mother to her child through the placenta. HIV spreads only through body fluids, not through touch, air or food.
  - id: bio-health-006
    topic: health-aids
    subtopic: Meaning of AIDS
    concept: Syndrome means a group of symptoms
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [aids, syndrome]
    stem: In the term AIDS, the word 'syndrome' means
    options:
      - a congenital disorder
      - an infectious pathogen
      - a group of symptoms
      - a single characteristic symptom
    answer: 2
    explanation: NCERT explains that 'syndrome' means a group of symptoms. This is why AIDS is not a disease with one symptom but a group of symptoms produced by a weakened immune system.
  - id: bio-health-007
    topic: health-aids
    subtopic: Meaning of AIDS
    concept: AIDS is acquired during life and is not congenital
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [aids, acquired]
    stem: AIDS is called an 'acquired' deficiency because
    options:
      - it is inherited from the parents as a defective gene
      - it is not congenital but develops during the lifetime of an individual
      - it is caused by a mutation in the person's own immune genes
      - it spreads only through contaminated food and water
    answer: 1
    explanation: NCERT says that the deficiency of the immune system is acquired during the lifetime of an individual, indicating that it is not a congenital disease. It is neither inherited as a defective gene nor present from birth.
  - id: bio-health-008
    topic: health-aids
    subtopic: Helper T cells and HIV
    concept: Helper T-lymphocytes progressively decrease in number in an HIV-infected person
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [helper-t-cells, hiv]
    stem: In the body of an HIV-infected person, there is a progressive decrease in the number of
    options:
      - erythrocytes
      - helper T-lymphocytes
      - mast cells
      - macrophages
    answer: 1
    explanation: NCERT explains that progeny viruses released in the blood attack other helper T-lymphocytes, so their number falls progressively. Macrophages keep producing the virus and are not the cells that decrease.
  - id: bio-health-009
    topic: health-aids
    subtopic: Replication of HIV
    concept: Macrophages act as an HIV factory
    category: concept
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [macrophages, hiv-replication]
    stem: Which cells of an HIV-infected person continue to produce the virus and so act like an 'HIV factory'?
    options:
      - Macrophages
      - Helper T-lymphocytes
      - B-lymphocytes
      - Neutrophils
    answer: 0
    explanation: NCERT states that the macrophages continue to produce the virus and in this way act like an HIV factory. Helper T-lymphocytes also support viral replication, but they are the cells whose number progressively falls.
  - id: bio-health-010
    topic: health-aids
    subtopic: Replication of HIV
    concept: Reverse transcriptase makes viral DNA from the RNA genome
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [reverse-transcriptase, hiv-replication]
    stem: In an HIV-infected cell, the RNA genome of the virus is copied into viral DNA with the help of the enzyme
    options:
      - DNA ligase
      - reverse transcriptase
      - RNA polymerase
      - restriction endonuclease
    answer: 1
    explanation: NCERT states that the RNA genome of the virus replicates to form viral DNA with the help of the enzyme reverse transcriptase. DNA ligase joins DNA fragments, RNA polymerase makes RNA from DNA and restriction endonuclease cuts DNA.
  - id: bio-health-011
    topic: health-aids
    subtopic: Replication of HIV
    concept: Viral DNA of HIV is incorporated into the host cell DNA
    category: concept
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [viral-dna, hiv-replication]
    stem: In an HIV-infected macrophage, the viral DNA formed from the viral RNA
    options:
      - stays in the cytoplasm as an independent plasmid
      - is destroyed by the host cell's own enzymes at once
      - is released from the cell without producing any virus
      - gets incorporated into the DNA of the host cell
    answer: 3
    explanation: According to NCERT, the viral DNA gets incorporated into the host cell's DNA and directs the infected cell to produce virus particles. It does not remain as a free plasmid, is not destroyed, and virus particles are produced.
  - id: bio-health-012
    topic: health-aids
    subtopic: Replication of HIV
    concept: The infected cell survives while retroviruses are replicated and released
    category: concept
    format: direct
    difficulty: 4
    time: 85
    ncert: true
    battle: true
    tags: [retrovirus, replication]
    stem: In the NCERT figure of retrovirus replication, what happens to the infected cell while new viruses are produced and released?
    options:
      - It survives only until the viral DNA is incorporated and then bursts to release all the viruses at once
      - It is lysed as soon as the viral RNA is converted into viral DNA
      - It survives, but stops all its own activity so that the viruses are made outside the cell
      - It survives while the viruses are replicated and released
    answer: 3
    explanation: The NCERT figure notes that the infected cell can survive while viruses are being replicated and released. The cell is not lysed when the viral DNA is formed or incorporated, and it is the infected cell itself that produces the new viral RNA.
  - id: bio-health-013
    topic: health-aids
    subtopic: Course of AIDS
    concept: Time-lag between infection and symptoms is usually 5-10 years
    category: factual
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [time-lag, symptoms]
    stem: The usual time-lag between infection with HIV and the appearance of AIDS symptoms is
    options:
      - 1–2 years
      - 12–15 years
      - 20–25 years
      - 5–10 years
    answer: 3
    explanation: NCERT says there is always a time-lag between infection and the appearance of AIDS symptoms. It may vary from a few months to many years, usually 5-10 years.
  - id: bio-health-014
    topic: health-aids
    subtopic: Treatment of AIDS
    concept: Anti-retroviral drugs prolong life but cannot prevent death
    category: factual
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [anti-retroviral, treatment]
    stem: Treatment of an AIDS patient with anti-retroviral drugs can
    options:
      - prolong the life of the patient but cannot prevent death
      - prolong the life of the patient and prevent death if started early
      - remove the viral DNA from the host genome and cure the patient
      - destroy all the macrophages that act as an HIV factory
    answer: 0
    explanation: 'NCERT states that anti-retroviral drugs are only partially effective: they can prolong the life of the patient but cannot prevent death, which is inevitable.'
  - id: bio-health-015
    topic: health-aids
    subtopic: Prevention of AIDS
    concept: NACO educates people about AIDS
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [naco, prevention]
    stem: NACO, which along with NGOs educates people about AIDS in India, stands for
    options:
      - National Association for Care of Orphans
      - Nationwide AIDS Check Organisation
      - National AIDS Cure Organisation
      - National AIDS Control Organisation
    answer: 3
    explanation: NACO is the National AIDS Control Organisation, which together with non-governmental organisations does a lot to educate people about AIDS in our country.
  - id: bio-health-016
    topic: health-aids
    subtopic: Prevention of AIDS
    concept: Isolating infected persons is not a preventive measure
    category: application
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [prevention, society]
    stem: Which one of the following is NOT a step taken to prevent the spread of HIV infection?
    options:
      - Making blood from blood banks safe from HIV
      - Isolating HIV/AIDS infected persons from family and society
      - Using only disposable needles and syringes in hospitals and clinics
      - Promoting regular HIV check-ups in susceptible populations
    answer: 1
    explanation: NCERT lists making blood safe, using only disposable needles and syringes, free condoms, controlling drug abuse, safe sex and regular check-ups. It says infected persons should not be isolated, since they need help and sympathy.
  - id: bio-health-017
    topic: health-aids
    subtopic: Transmission of HIV
    concept: HIV spreads through shared needles, unlike malaria, typhoid and common cold
    category: application
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [transmission, comparison]
    stem: Which one of the following is a mode of spread of HIV?
    options:
      - Sharing of infected needles and syringes
      - Bite of a female Anopheles mosquito
      - Drinking water contaminated with faecal matter
      - Inhaling droplets from an infected person's sneeze
    answer: 0
    explanation: HIV spreads only through body fluids, for example by sharing infected needles and syringes. The bite of a female Anopheles spreads malaria, faecally contaminated water spreads typhoid and amoebiasis, and droplets spread air-borne diseases such as the common cold.
  - id: bio-health-018
    topic: health-aids
    subtopic: Prevention of AIDS
    concept: Condoms also protect from STIs and AIDS
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [condoms, prevention]
    stem: Use of condoms has increased in recent years because, besides preventing conception, they also
    options:
      - cure STIs and AIDS in an infected person
      - increase the number of helper T-lymphocytes
      - protect the user from contracting STIs and AIDS
      - act as emergency contraceptives after coitus
    answer: 2
    explanation: NCERT notes that the use of condoms has increased due to the additional benefit of protecting the user from contracting STIs and AIDS. They do not cure infection, raise helper T-cell numbers or work after coitus.
  - id: bio-health-019
    topic: health-aids
    subtopic: Diagnosis of AIDS
    concept: PCR detects very low amounts of HIV by amplifying its nucleic acid
    category: concept
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [pcr, diagnosis]
    stem: Which technique detects HIV at very low concentration, before symptoms appear, by amplifying its nucleic acid?
    options:
      - Enzyme linked immuno-sorbent assay (ELISA)
      - Agarose gel electrophoresis
      - Autoradiography with a radioactive probe
      - Polymerase chain reaction (PCR)
    answer: 3
    explanation: NCERT states that a very low concentration of a bacterium or virus can be detected by amplification of its nucleic acid by PCR, which is routinely used to detect HIV in suspected AIDS patients. ELISA detects antigens or antibodies and does not amplify nucleic acid.
  - id: bio-health-020
    topic: health-aids
    subtopic: Diagnosis of AIDS
    concept: ELISA is based on antigen-antibody interaction
    category: concept
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [elisa, antigen-antibody]
    stem: ELISA, used to detect infection by pathogens like HIV, is based on the principle of
    options:
      - hybridisation of a labelled probe with complementary DNA
      - amplification of DNA by a thermostable DNA polymerase
      - antigen–antibody interaction
      - separation of DNA fragments by size in agarose
    answer: 2
    explanation: NCERT states that ELISA is based on the principle of antigen-antibody interaction. Complementary base pairing of a probe, amplification by a thermostable polymerase and separation of fragments in agarose are principles of other techniques.
  - id: bio-health-021
    topic: health-aids
    subtopic: Replication of HIV
    concept: In HIV information flows from RNA to DNA
    category: concept
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [central-dogma, reverse-transcription]
    stem: After HIV enters a host cell, the flow of genetic information begins with the conversion of
    options:
      - DNA into RNA
      - RNA into RNA
      - protein into DNA
      - RNA into DNA
    answer: 3
    explanation: NCERT notes that in some viruses the flow of information is in reverse direction, from RNA to DNA. HIV, a retrovirus, forms viral DNA from its RNA genome with the help of reverse transcriptase.
  - id: bio-health-022
    topic: health-aids
    subtopic: AIDS and other STIs
    concept: HIV, hepatitis-B and genital herpes are not completely curable
    category: concept
    format: direct
    difficulty: 4
    time: 85
    ncert: true
    battle: true
    tags: [sti, curability]
    stem: Which group of sexually transmitted infections is not completely curable even if detected early?
    options:
      - Hepatitis-B, genital herpes and syphilis
      - Genital herpes, HIV infection and gonorrhoea
      - Hepatitis-B, HIV infection and genital warts
      - Hepatitis-B, genital herpes and HIV infection
    answer: 3
    explanation: NCERT says that except for hepatitis-B, genital herpes and HIV infections, the other STIs are completely curable if detected early and treated properly. Gonorrhoea, syphilis, chlamydiasis, trichomoniasis and genital warts belong to the curable group, so each wrong option mixes one curable infection with two of the three exceptions.
  - id: bio-health-023
    topic: health-aids
    subtopic: AIDS and drug abuse
    concept: AIDS and hepatitis B are chronic and ultimately fatal
    category: factual
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [hepatitis-b, drug-abuse]
    stem: AIDS and hepatitis B, which spread by sharing infected needles and syringes, are both
    options:
      - chronic infections that are ultimately fatal
      - acute infections that the body always overcomes
      - diseases transmitted only by insect vectors
      - infections that are completely curable by early treatment
    answer: 0
    explanation: NCERT states that both AIDS and Hepatitis B are chronic infections and ultimately fatal, and both can be transmitted through sexual contact or infected blood. They are not completely curable, as shown by the STI list in the Reproductive Health chapter.
  - id: bio-health-024
    topic: health-aids
    subtopic: Helper T cells and HIV
    concept: T-cells help B cells to make antibodies
    category: concept
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [helper-t-cells, antibodies]
    stem: A fall in helper T-lymphocytes in AIDS reduces antibody production because T-cells
    options:
      - are the cells that actually secrete the antibodies
      - are converted into B-lymphocytes when needed
      - do not secrete antibodies themselves but help B cells to produce them
      - are destroyed by the antibodies of B cells
    answer: 2
    explanation: NCERT says that T-cells themselves do not secrete antibodies but help B cells to produce them. Antibodies are made by B-lymphocytes, so fewer helper T cells weaken the humoral response.
  - id: bio-health-025
    topic: health-aids
    subtopic: Symptoms of AIDS
    concept: Fever, diarrhoea and weight loss occur as helper T cells decrease
    category: factual
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [symptoms, helper-t-cells]
    stem: While helper T-lymphocytes of an HIV-infected person progressively decrease, the person suffers from
    options:
      - stools with excess mucus and blood clots with constipation
      - bouts of fever, diarrhoea and weight loss
      - dry scaly lesions with intense itching
      - sneezing, watery eyes and difficulty in breathing
    answer: 1
    explanation: NCERT states that during this period the person suffers from bouts of fever, diarrhoea and weight loss. Stools with blood clots and excess mucus indicate amoebiasis, dry scaly lesions indicate ringworm, and sneezing and wheezing indicate allergy.
  - id: bio-health-026
    topic: health-aids
    subtopic: Opportunistic infections
    concept: AIDS patients get infections by parasites like Toxoplasma that could otherwise be overcome
    category: factual
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [opportunistic-infections, toxoplasma]
    stem: The parasite that NCERT names as infecting an AIDS patient because of the fall in helper T-lymphocytes is
    options:
      - Plasmodium
      - Entamoeba
      - Toxoplasma
      - Wuchereria
    answer: 2
    explanation: NCERT states that the patient starts suffering from infections that could otherwise be overcome, such as those due to bacteria especially Mycobacterium, viruses, fungi and parasites like Toxoplasma. Plasmodium, Entamoeba and Wuchereria are parasites that NCERT links to malaria, amoebiasis and filariasis, not to AIDS.
  - id: bio-health-027
    topic: health-aids
    subtopic: Society and AIDS
    concept: HIV/AIDS infected people need help and sympathy, not isolation
    category: application
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [society, prevention]
    stem: NCERT states that HIV/AIDS infected people need
    options:
      - isolation from the family to protect the other members
      - a separate living space because the infection spreads by touch
      - secrecy about the infection to avoid panic in society
      - help and sympathy instead of being shunned by society
    answer: 3
    explanation: NCERT says that HIV/AIDS infected people need help and sympathy instead of being shunned by society, since the infection spreads only through body fluids and not through mere touch. It also says the infection should not be hidden.
  - id: bio-health-028
    topic: health-aids
    subtopic: Meaning of AIDS
    concept: Correct statement about the nature of AIDS
    category: concept
    format: statements
    difficulty: 2
    time: 30
    ncert: true
    battle: false
    tags: [aids, acquired]
    stem: Which one of the following statements about AIDS is correct?
    options:
      - AIDS is a congenital disease caused by a defective gene.
      - AIDS is a single disease with one characteristic symptom.
      - AIDS is a deficiency of the immune system acquired during the lifetime of an individual.
      - AIDS is caused by a virus with a DNA genome and no envelope.
    answer: 2
    explanation: NCERT describes AIDS as a deficiency of the immune system acquired during the lifetime of an individual. It is not congenital, it is a group of symptoms (a syndrome), and its cause is HIV, a retrovirus with an RNA genome.
  - id: bio-health-029
    topic: health-aids
    subtopic: Replication of HIV
    concept: Identify the incorrect statement about HIV multiplication
    category: concept
    format: statements
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [hiv-replication, macrophages]
    stem: Which one of the following statements about the multiplication of HIV in the human body is incorrect?
    options:
      - The RNA genome of the virus forms viral DNA with the help of reverse transcriptase.
      - The infected macrophages stop producing the virus and die as soon as the viral DNA is incorporated.
      - The viral DNA gets incorporated into the DNA of the host cell.
      - The infected cell is directed to produce virus particles.
    answer: 1
    explanation: 'The RNA genome forms viral DNA with reverse transcriptase, the viral DNA joins the host DNA and the infected cell is directed to make virus particles. The last statement is wrong: NCERT says the macrophages continue to produce virus and act like an HIV factory.'
  - id: bio-health-030
    topic: health-aids
    subtopic: Helper T cells and HIV
    concept: Correct statement about helper T-lymphocytes in HIV infection
    category: concept
    format: statements
    difficulty: 4
    time: 85
    ncert: true
    battle: false
    tags: [helper-t-cells, hiv]
    stem: Which one of the following statements about helper T-lymphocytes in HIV infection is correct?
    options:
      - HIV enters helper T-lymphocytes and replicates; the progeny viruses released in the blood attack only macrophages.
      - HIV enters helper T-lymphocytes and replicates; the progeny viruses released in the blood attack other helper T-lymphocytes.
      - HIV enters helper T-lymphocytes only after the macrophages are destroyed, and then replicates inside them.
      - HIV enters helper T-lymphocytes but replicates only in macrophages, which act as the HIV factory.
    answer: 1
    explanation: NCERT says that, simultaneously with its entry into macrophages, HIV enters helper T-lymphocytes, replicates and produces progeny viruses. The progeny viruses released in the blood attack other helper T-lymphocytes, not only macrophages, and this repetition decreases their number progressively.
  - id: bio-health-031
    topic: health-aids
    subtopic: Diagnosis of AIDS
    concept: Correct statement about ELISA and PCR in detecting HIV
    category: concept
    format: statements
    difficulty: 4
    time: 85
    ncert: true
    battle: false
    tags: [elisa, pcr]
    stem: Which one of the following statements about the detection of HIV infection is correct?
    options:
      - ELISA is based on amplification of nucleic acid, whereas PCR is based on antigen–antibody interaction.
      - Both ELISA and PCR detect infection only when the concentration of the pathogen is already very high.
      - ELISA is based on antigen–antibody interaction, whereas PCR detects a virus by amplifying its nucleic acid.
      - ELISA detects only the antibodies and PCR detects only the antigens of the pathogen.
    answer: 2
    explanation: NCERT states that ELISA is based on antigen-antibody interaction, detecting antigens of the pathogen or antibodies made against it. PCR detects a very low concentration of a virus by amplifying its nucleic acid, even before symptoms appear. The other options swap the two principles, restrict ELISA to one kind of molecule, or claim late detection.
  - id: bio-health-032
    topic: health-aids
    subtopic: Treatment and prevention
    concept: Identify the incorrect statement about AIDS
    category: concept
    format: statements
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [aids, prevention]
    stem: Which one of the following statements about AIDS is incorrect?
    options:
      - HIV infection mostly spreads inadvertently, like pneumonia or typhoid.
      - There is always a time-lag between infection and the appearance of AIDS symptoms.
      - Anti-retroviral drugs can only prolong the life of the patient.
      - AIDS has no cure, so prevention is the best option.
    answer: 0
    explanation: NCERT states there is always a time-lag between infection and symptoms, that anti-retroviral drugs only prolong life and that prevention is best since AIDS has no cure. It also says HIV infection is not inadvertent like pneumonia or typhoid, so the last statement is incorrect.
  - id: bio-health-033
    topic: health-aids
    subtopic: Transmission of HIV
    concept: Individuals at high risk of HIV infection
    category: concept
    format: multi-statement
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [high-risk, transmission]
    stem: |-
      Consider the following persons.
      I. Individuals who have multiple sexual partners
      II. Drug addicts who take drugs intravenously
      III. Individuals who require repeated blood transfusions
      IV. Persons who often shake hands with an infected friend
      Which of them are at a high risk of getting HIV infection?
    options:
      - I, II and IV only
      - I, II and III only
      - II, III and IV only
      - I and IV only
    answer: 1
    explanation: NCERT lists individuals with multiple sexual partners, intravenous drug addicts, those needing repeated blood transfusions and children of HIV infected mothers as high-risk. HIV does not spread by mere touch, so a handshake carries no risk.
  - id: bio-health-034
    topic: health-aids
    subtopic: Replication of HIV
    concept: Statements on HIV entry into macrophages and helper T cells
    category: concept
    format: multi-statement
    difficulty: 4
    time: 85
    ncert: true
    battle: false
    tags: [hiv-replication, helper-t-cells]
    stem: |-
      Consider the following statements about HIV in the human body.
      I. In macrophages, viral DNA is formed from the RNA genome with the help of reverse transcriptase.
      II. The viral DNA is incorporated into the host cell's DNA and directs the cell to produce virus particles.
      III. HIV enters helper T-lymphocytes only after all the macrophages have been destroyed.
      IV. Progeny viruses released in the blood attack other helper T-lymphocytes.
      Which of the statements are correct?
    options:
      - I, II and III only
      - I, II and IV only
      - I, III and IV only
      - II, III and IV only
    answer: 1
