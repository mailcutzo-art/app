questions:
  - id: bio-chemco-001
    topic: chemco-endocrine-overview
    subtopic: Endocrine glands
    concept: Endocrine glands lack ducts and are called ductless glands; their secretions are hormones
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [ductless-glands, hormones]
    stem: Endocrine glands are called ductless glands because they
    options:
      - pour their secretions into body cavities through short ducts
      - lack ducts, so their secretions, the hormones, are released directly into the blood
      - have ducts that open directly into the blood vessels
      - release their secretions on to the body surface through pores
    answer: 1
    explanation: NCERT states that endocrine glands lack ducts and are hence called ductless glands. Their secretions, the hormones, pass straight into the blood, unlike exocrine secretions that travel through ducts.
  - id: bio-chemco-002
    topic: chemco-endocrine-overview
    subtopic: Hormones as chemical messengers
    concept: Hormones are non-nutrient chemicals produced in trace amounts that act as intercellular messengers
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [hormones, chemical-messengers]
    stem: Hormones are best described as
    options:
      - nutrient molecules secreted in large quantities as an energy source
      - enzymes that act only inside the cell that produces them
      - non-nutrient chemicals produced in trace amounts that act as intercellular messengers
      - structural proteins that form the walls of endocrine glands
    answer: 2
    explanation: NCERT defines hormones as non-nutrient chemicals which act as intercellular messengers and are produced in trace amounts. They are not food, not intracellular enzymes and not structural proteins.
  - id: bio-chemco-003
    topic: chemco-endocrine-overview
    subtopic: Chemical coordination
    concept: The neural system and the endocrine system jointly coordinate and regulate physiological functions
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [coordination, endocrine-system]
    stem: The neural system and which other system jointly coordinate and regulate the physiological functions of the body?
    options:
      - Endocrine system
      - Lymphatic system
      - Excretory system
      - Skeletal system
    answer: 0
    explanation: NCERT states that the neural system and the endocrine system together coordinate and regulate the physiological functions of the body. The endocrine system does so by chemical messengers called hormones.
  - id: bio-chemco-004
    topic: chemco-endocrine-overview
    subtopic: Composite gland
    concept: The pancreas acts as both an exocrine and an endocrine gland
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [pancreas, composite-gland]
    stem: Which of the following glands of the human body acts as both an exocrine and an endocrine gland?
    options:
      - Thyroid
      - Parathyroid
      - Thymus
      - Pancreas
    answer: 3
    explanation: NCERT describes the pancreas as a composite gland. Its acinar part is exocrine, while the islets of Langerhans form the endocrine part. The thyroid, parathyroid and thymus are purely endocrine.
  - id: bio-chemco-005
    topic: chemco-endocrine-overview
    subtopic: Endocrine glands
    concept: Organised endocrine glands are ductless, so a gland with a duct such as a sweat gland is not one of them
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: false
    battle: true
    tags: [endocrine-glands, ductless-glands]
    stem: Which of the following is NOT an organised endocrine gland of the human body?
    options:
      - Pineal gland
      - Sweat gland
      - Parathyroid gland
      - Thymus
    answer: 1
    explanation: The pineal, parathyroid and thymus are among the organised endocrine bodies listed in NCERT. A sweat gland discharges its secretion through a duct on to the skin, so it is an exocrine gland.
  - id: bio-chemco-006
    topic: chemco-endocrine-overview
    subtopic: Thymus
    concept: The thymus secretes thymosins that promote differentiation of T-lymphocytes
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [thymus, thymosin]
    stem: Thymosins, which promote the differentiation of T-lymphocytes, are secreted by the
    options:
      - thymus gland
      - thyroid gland
      - parathyroid gland
      - pineal gland
    answer: 0
    explanation: The thymus secretes thymosins, which play a major role in the differentiation of T-lymphocytes that provide cell-mediated immunity. The thyroid, parathyroid and pineal glands secrete other hormones.
  - id: bio-chemco-007
    topic: chemco-endocrine-overview
    subtopic: Gonads
    concept: The ovary secretes two groups of steroid hormones, estrogen and progesterone
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [ovary, steroid-hormones]
    stem: The ovary synthesises and secretes two groups of steroid hormones, which are
    options:
      - androgens and estrogens
      - FSH and LH
      - estrogen and progesterone
      - progesterone and oxytocin
    answer: 2
    explanation: NCERT states that the ovary secretes estrogen, mainly from growing follicles, and progesterone, mainly from the corpus luteum, both steroid hormones. FSH and LH are pituitary hormones and oxytocin comes from the neurohypophysis.
  - id: bio-chemco-008
    topic: chemco-endocrine-overview
    subtopic: Location of glands
    concept: The pineal gland lies on the dorsal side of the forebrain
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [pineal-gland, location]
    stem: The pineal gland, which secretes melatonin, is located on the
    options:
      - ventral side of the aorta between the lungs
      - back side of the thyroid gland
      - anterior part of each kidney
      - dorsal side of the forebrain
    answer: 3
    explanation: NCERT places the pineal gland on the dorsal side of the forebrain. The thymus lies between the lungs on the ventral side of the aorta, the parathyroids on the back of the thyroid, and the adrenals on the kidneys.
  - id: bio-chemco-009
    topic: chemco-endocrine-overview
    subtopic: Location of glands
    concept: Four parathyroid glands lie on the back of the thyroid, two in each lobe
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [parathyroid, location]
    stem: How many parathyroid glands does a human have, and where are they placed?
    options:
      - Two, one on each kidney
      - Four, on the back side of the thyroid gland, two in each lobe
      - Two, inside the sella tursica
      - Six, three on the ventral side of the aorta
    answer: 1
    explanation: NCERT states that four parathyroid glands are present on the back side of the thyroid gland, one pair in each of its two lobes.
  - id: bio-chemco-010
    topic: chemco-endocrine-overview
    subtopic: Gonads
    concept: Leydig cells in the intertubular spaces of the testis secrete androgens
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [testis, leydig-cells]
    stem: Leydig cells, which synthesise and secrete androgens, are found in the
    options:
      - intertubular spaces of the testis
      - follicles of the ovary
      - islets of Langerhans
      - adrenal medulla
    answer: 0
    explanation: The Leydig or interstitial cells lie in the intertubular spaces of the testis and produce androgens, mainly testosterone. The other sites produce different hormones.
  - id: bio-chemco-011
    topic: chemco-endocrine-overview
    subtopic: Hypothalamus
    concept: The hypothalamus is the basal part of the diencephalon of the forebrain
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [hypothalamus, location]
    stem: The hypothalamus, which controls the pituitary, is the basal part of the
    options:
      - cerebellum
      - medulla oblongata
      - diencephalon of the forebrain
      - midbrain
    answer: 2
    explanation: NCERT describes the hypothalamus as the basal part of the diencephalon, which is part of the forebrain. Its neurosecretory cells make hormones that regulate the pituitary.
  - id: bio-chemco-012
    topic: chemco-endocrine-overview
    subtopic: Pineal gland
    concept: Melatonin also influences metabolism, pigmentation, the menstrual cycle and defence capability
    category: factual
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [melatonin, pineal-gland]
    stem: Besides regulating the 24-hour rhythm of the body, melatonin influences
    options:
      - blood calcium level, bone resorption and RBC production
      - gluconeogenesis, lipolysis and proteolysis
      - milk ejection, uterine contraction and water reabsorption
      - metabolism, pigmentation, the menstrual cycle and defence capability
    answer: 3
    explanation: Apart from maintaining the diurnal sleep-wake rhythm and body temperature, melatonin influences metabolism, pigmentation, the menstrual cycle and defence capability. The other options list actions of the parathyroid or thyrocalcitonin, cortisol and neurohypophysial hormones.
  - id: bio-chemco-013
    topic: chemco-endocrine-overview
    subtopic: Adrenal gland
    concept: The adrenal medulla secretes the emergency (fight or flight) hormones
    category: concept
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [adrenal-medulla, fight-or-flight]
    stem: The hormones called emergency hormones, or hormones of fight or flight, are secreted by the
    options:
      - adrenal medulla
      - adrenal cortex
      - pars distalis of the pituitary
      - thyroid follicles
    answer: 0
    explanation: Adrenaline and noradrenaline of the adrenal medulla are rapidly secreted in stress and emergencies, so they are the hormones of fight or flight. The cortex secretes corticoids such as cortisol and aldosterone.
  - id: bio-chemco-014
    topic: chemco-endocrine-overview
    subtopic: Hormone receptors
    concept: Only target tissues carry the specific receptors for a hormone, so only they respond to it
    category: concept
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [hormone-receptors, target-tissue]
    stem: Why does a hormone affect only its target tissue although it travels in the blood to all organs?
    options:
      - Only target tissues are supplied with blood carrying the hormone
      - Only target tissues possess specific receptors for that hormone
      - Only target tissues lie close to the gland that secretes it
      - Only target tissues can take the hormone in through ducts
    answer: 1
    explanation: Hormones act by binding to specific receptor proteins that are located only in the target tissue. Cells without the receptor do not respond, even though the hormone reaches them through the blood.
  - id: bio-chemco-015
    topic: chemco-endocrine-overview
    subtopic: Non-endocrine hormones
    concept: Growth factors from non-endocrine tissues are essential for growth, repair and regeneration of tissues
    category: factual
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [growth-factors, non-endocrine-tissues]
    stem: Several non-endocrine tissues secrete hormones called growth factors, which are essential for
    options:
      - regulating the sleep-wake cycle
      - emergency responses during stress
      - normal growth of tissues and their repair and regeneration
      - water and electrolyte reabsorption in the kidney
    answer: 2
    explanation: NCERT states that many non-endocrine tissues secrete growth factors, which are essential for the normal growth of tissues and for their repair and regeneration.
  - id: bio-chemco-016
    topic: chemco-endocrine-overview
    subtopic: Endocrine systems of animals
    concept: Invertebrates have simple endocrine systems with few hormones, vertebrates use many chemicals as hormones
    category: concept
    format: statements
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [invertebrates, vertebrates]
    stem: Which one of the following statements about the endocrine systems of animals is correct?
    options:
      - Invertebrates have no endocrine system and depend only on the neural system
      - Vertebrates have very simple endocrine systems with few hormones, whereas invertebrates use a large number of hormones
      - Invertebrates and vertebrates have the same number of hormones
      - Invertebrates have very simple endocrine systems with few hormones, whereas a large number of chemicals act as hormones in vertebrates
    answer: 3
    explanation: NCERT states that invertebrates possess very simple endocrine systems with few hormones, whereas a large number of chemicals act as hormones and provide coordination in vertebrates.
  - id: bio-chemco-017
    topic: chemco-endocrine-overview
    subtopic: Pancreas
    concept: Islets of Langerhans, about 1-2 million, form only 1-2 per cent of the pancreatic tissue
    category: factual
    format: statements
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [pancreas, islets-of-langerhans]
    stem: Which one of the following statements about the endocrine part of the pancreas is correct?
    options:
      - A normal human pancreas has about 1-2 million islets of Langerhans, forming only 1-2 per cent of its tissue
      - Islets of Langerhans form most of the pancreatic tissue
      - The islets secrete the digestive enzymes of the pancreas into the duodenum
      - The alpha and beta cells pour their hormones into the duodenum through the pancreatic duct
    answer: 0
    explanation: NCERT states that a normal human pancreas has about 1-2 million islets of Langerhans, which represent only 1-2 per cent of the pancreatic tissue. The islet hormones enter the blood, and the digestive enzymes come from the exocrine part.
  - id: bio-chemco-018
    topic: chemco-endocrine-overview
    subtopic: Location of glands
    concept: Identify the incorrect statement about the position and structure of endocrine glands
    category: application
    format: statements
    difficulty: 4
    time: 85
    ncert: true
    battle: false
    tags: [location, adrenal-gland, thyroid]
    stem: Which one of the following statements about the position and structure of the endocrine glands is INCORRECT?
    options:
      - The pituitary gland is attached to the hypothalamus by a stalk
      - The thymus lies between the lungs, behind the sternum, on the ventral side of the aorta
      - Each adrenal gland lies at the anterior part of a kidney, with the cortex at its centre and the medulla outside it
      - The thyroid gland has two lobes on either side of the trachea, connected by an isthmus
    answer: 2
    explanation: The adrenal gland has a central medulla surrounded by an outer cortex, so the statement reverses them. The other three statements about the pituitary, thymus and thyroid agree with NCERT.
  - id: bio-chemco-019
    topic: chemco-endocrine-overview
    subtopic: Non-endocrine hormones
    concept: The heart, kidney and gastrointestinal tract produce hormones although they are not classical glands
    category: application
    format: multi-statement
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [heart, kidney, gastrointestinal-tract]
    stem: |-
      Which of the following statements about hormone-producing organs other than the classical endocrine glands are correct?
      I. The atrial wall of the heart secretes atrial natriuretic factor.
      II. The juxtaglomerular cells of the kidney secrete erythropoietin.
      III. The gastrointestinal tract secretes gastrin, secretin, cholecystokinin and gastric inhibitory peptide.
      IV. Growth factors are secreted only by the pituitary gland.
    options:
      - I and II only
      - I, II and III only
      - II, III and IV only
      - I, III and IV only
    answer: 1
    explanation: The heart (ANF), the kidney (erythropoietin) and the gastrointestinal tract (gastrin, secretin, CCK, GIP) all secrete hormones. Statement IV is wrong because many non-endocrine tissues secrete growth factors.
  - id: bio-chemco-020
    topic: chemco-endocrine-overview
    subtopic: Pituitary
    concept: Pituitary and neurohypophysial hormones, and which of their actions are matched correctly
    category: application
    format: multi-statement
    difficulty: 4
    time: 85
    ncert: true
    battle: false
    tags: [pituitary, tsh, acth]
    stem: |-
      Which of the following statements about the pituitary are correct?
      I. The pars intermedia secretes only one hormone, MSH.
      II. TSH stimulates the adrenal cortex to secrete glucocorticoids.
      III. LH and FSH are called gonadotrophins because they stimulate gonadal activity.
      IV. Oxytocin and vasopressin are released from the neurohypophysis.
    options:
      - I, II and III only
      - II, III and IV only
      - I, II and IV only
      - I, III and IV only
    answer: 3
    explanation: Statement II is wrong because it is ACTH, not TSH, that stimulates the adrenal cortex; TSH acts on the thyroid. Statements I, III and IV agree with NCERT.
  - id: bio-chemco-021
    topic: chemco-endocrine-overview
    subtopic: Gland and hormone pairs
    concept: Matching hormones with the glands or cells that secrete them
    category: application
    format: multi-statement
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [melatonin, thymosin, glucagon]
    stem: |-
      Which of the following hormone and source pairs are correctly matched?
      I. Melatonin - pineal gland
      II. Thymosin - thymus
      III. Thyrocalcitonin - parathyroid gland
      IV. Glucagon - alpha cells of the islets of Langerhans
    options:
      - I, II and IV only
      - I, II and III only
      - II, III and IV only
      - I, III and IV only
    answer: 0
    explanation: Thyrocalcitonin (TCT) is secreted by the thyroid, not by the parathyroid, which secretes parathyroid hormone. The other three pairs are correct.
  - id: bio-chemco-022
    topic: chemco-endocrine-overview
    subtopic: Hormone actions
    concept: Antagonistic hormone pairs and the actions of aldosterone and vasopressin
    category: application
    format: multi-statement
    difficulty: 4
    time: 85
    ncert: true
    battle: false
    tags: [insulin, parathyroid-hormone, aldosterone, vasopressin]
    stem: |-
      Which of the following statements are correct?
      I. Glucagon raises blood glucose, whereas insulin lowers it.
      II. Parathyroid hormone raises blood Ca^{2+}, whereas thyrocalcitonin lowers it.
      III. Aldosterone promotes reabsorption of Na^+ and water and excretion of K^+ at the renal tubules.
      IV. Vasopressin promotes the loss of water in the urine.
    options:
      - I, II and IV only
      - II, III and IV only
      - I, II and III only
      - I, III and IV only
    answer: 2
    explanation: Statement IV is wrong because vasopressin (ADH) promotes reabsorption of water in the distal tubules and so reduces water loss in urine. Statements I, II and III are correct.
  - id: bio-chemco-023
    topic: chemco-endocrine-overview
    subtopic: Thymus
    concept: The thymus degenerates in old age and thymosins promote T-lymphocyte differentiation
    category: application
    format: statement-pair
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [thymus, thymosin]
    stem: |-
      Statement I: The thymus is most active in old age and its thymosin output is highest then.
      Statement II: Thymosins promote the differentiation of B-lymphocytes.
    options:
      - Both Statement I and Statement II are correct
      - Both Statement I and Statement II are incorrect
      - Statement I is correct but Statement II is incorrect
      - Statement I is incorrect but Statement II is correct
    answer: 1
    explanation: The thymus degenerates in old individuals, so thymosin production falls and immune responses weaken. Thymosins promote the differentiation of T-lymphocytes, not B-lymphocytes, so both statements are incorrect.
  - id: bio-chemco-024
    topic: chemco-endocrine-overview
    subtopic: Parathyroid
    concept: Parathyroid location and the hypercalcemic action of parathyroid hormone
    category: application
    format: statement-pair
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [parathyroid, pth]
    stem: |-
      Statement I: The parathyroid glands lie on the ventral side of the aorta between the lungs.
      Statement II: Parathyroid hormone increases the Ca^{2+} level in the blood.
    options:
      - Both Statement I and Statement II are correct
      - Both Statement I and Statement II are incorrect
      - Statement I is correct but Statement II is incorrect
      - Statement I is incorrect but Statement II is correct
    answer: 3
    explanation: The parathyroids lie on the back side of the thyroid; the gland on the ventral side of the aorta between the lungs is the thymus. Parathyroid hormone is a hypercalcemic hormone, so Statement II is correct.
  - id: bio-chemco-025
    topic: chemco-endocrine-overview
    subtopic: Hormone receptors
    concept: Membrane-bound receptors generate second messengers while steroid hormones act through intracellular receptors
    category: concept
    format: statement-pair
    difficulty: 4
    time: 85
    ncert: true
    battle: false
    tags: [receptors, second-messengers, steroid-hormones]
    stem: |-
      Statement I: Hormones that bind to membrane-bound receptors usually do not enter the target cell but generate second messengers such as cyclic AMP.
      Statement II: Cortisol, being a steroid hormone, acts mainly through intracellular receptors and regulates gene expression.
    options:
      - Both Statement I and Statement II are correct
      - Both Statement I and Statement II are incorrect
      - Statement I is correct but Statement II is incorrect
      - Statement I is incorrect but Statement II is correct
    answer: 0
    explanation: Membrane-bound receptors lead to second messengers such as cAMP, IP_3 and Ca^{2+}. Steroid hormones such as cortisol and iodothyronines bind intracellular receptors and mostly regulate gene expression, so both statements are correct.
  - id: bio-chemco-026
    topic: chemco-endocrine-overview
    subtopic: Hypothalamus and pituitary
    concept: Oxytocin and vasopressin are made in the hypothalamus, not in the posterior pituitary
    category: concept
    format: assertion-reason
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [oxytocin, vasopressin, neurohypophysis]
    stem: |-
      Assertion (A): Oxytocin and vasopressin are released from the posterior pituitary but are not made there.
      Reason (R): The posterior pituitary contains neurosecretory cells that synthesise these hormones.
    options:
      - Both A and R are true and R is the correct explanation of A
      - Both A and R are true but R is not the correct explanation of A
      - A is true but R is false
      - A is false but R is true
    answer: 2
    explanation: Oxytocin and vasopressin are synthesised by the neurosecretory cells of the hypothalamus and transported axonally to the posterior pituitary, from where they are released. So A is true and R is false.
  - id: bio-chemco-027
    topic: chemco-endocrine-overview
    subtopic: Adrenal gland
    concept: Adrenaline and noradrenaline are catecholamines secreted rapidly in stress
    category: concept
    format: assertion-reason
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [catecholamines, adrenal-medulla]
    stem: |-
      Assertion (A): Adrenaline and noradrenaline are commonly called catecholamines.
      Reason (R): They are rapidly secreted in response to stress of any kind and in emergency situations.
    options:
      - Both A and R are true and R is the correct explanation of A
      - Both A and R are true but R is not the correct explanation of A
      - A is true but R is false
      - A is false but R is true
    answer: 1
    explanation: Adrenaline (epinephrine) and noradrenaline (norepinephrine) of the adrenal medulla are called catecholamines, and they are released quickly in stress. The second fact describes when they are secreted, not why they are named catecholamines.
  - id: bio-chemco-028
    topic: chemco-endocrine-overview
    subtopic: Calcium balance
    concept: Thyrocalcitonin lowers while parathyroid hormone raises blood calcium; together they balance it
    category: concept
    format: assertion-reason
    difficulty: 4
    time: 85
    ncert: true
    battle: false
    tags: [thyrocalcitonin, parathyroid-hormone, calcium]
    stem: |-
      Assertion (A): Thyrocalcitonin, like parathyroid hormone, raises the Ca^{2+} level in the blood.
      Reason (R): Parathyroid hormone and thyrocalcitonin together play a significant role in calcium balance in the body.
    options:
      - Both A and R are true and R is the correct explanation of A
      - Both A and R are true but R is not the correct explanation of A
      - A is true but R is false
      - A is false but R is true
    answer: 3
    explanation: Thyrocalcitonin lowers blood Ca^{2+} while parathyroid hormone raises it, so A is false. R is true because the two hormones together regulate calcium balance.
  - id: bio-chemco-029
    topic: chemco-endocrine-overview
    subtopic: Gland and hormone pairs
    concept: Match pineal, thymus, adrenal medulla and thyroid with their hormones
    category: factual
    format: match
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [match, glands, hormones]
    stem: |-
      Match the endocrine glands in List I with their hormones in List II.
      List I
      P. Pineal gland
      Q. Thymus
      R. Adrenal medulla
      S. Thyroid gland
      List II
      1. Thymosins
      2. Adrenaline and noradrenaline
      3. Melatonin
      4. Tetraiodothyronine (T_4) and triiodothyronine (T_3)
    options:
      - P-3, Q-1, R-2, S-4
      - P-1, Q-3, R-2, S-4
      - P-3, Q-1, R-4, S-2
      - P-3, Q-2, R-1, S-4
    answer: 0
    explanation: The pineal secretes melatonin, the thymus secretes thymosins, the adrenal medulla secretes adrenaline and noradrenaline, and the thyroid secretes T_4 and T_3.
  - id: bio-chemco-030
    topic: chemco-endocrine-overview
    subtopic: Non-endocrine hormones
    concept: Gastrointestinal hormones gastrin, secretin, CCK and GIP and their targets
    category: factual
    format: match
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [match, gastrointestinal-hormones]
    stem: |-
      Match the gastrointestinal hormones in List I with their actions in List II.
      List I
      P. Gastrin
      Q. Secretin
      R. Cholecystokinin
      S. Gastric inhibitory peptide
      List II
      1. Acts on the pancreas and gall bladder to release pancreatic enzymes and bile juice
      2. Acts on the exocrine pancreas to release water and bicarbonate ions
      3. Acts on the gastric glands to stimulate secretion of HCl and pepsinogen
      4. Inhibits gastric secretion and motility
    options:
      - P-2, Q-3, R-1, S-4
      - P-3, Q-2, R-1, S-4
      - P-3, Q-2, R-4, S-1
