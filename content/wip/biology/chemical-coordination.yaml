      - Calcitonin only
      - TSH and growth hormone
      - Triiodothyronine and thyroxine
      - Insulin and glucagon
    answer: 2
    explanation: Iodine is needed to make the iodinated tyrosine hormones T_3 and T_4. Calcitonin (thyrocalcitonin), also from the thyroid, is a peptide that needs no iodine, and TSH comes from the pituitary.
