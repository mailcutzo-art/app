    stem: A single meristematic cell undergoes six successive mitotic divisions. In case I, after each division only one daughter divides again and the other differentiates. In case II, every cell formed divides again. How many more cells are there in case II than in case I at the end?
    options:
      - '32'
      - '57'
      - '58'
      - '63'
    answer: 1
    explanation: 'Case I (arithmetic): each division adds one differentiated cell to the single dividing cell, giving 1 + 6 = 7 cells. Case II (geometric): the number doubles each time, 2^6 = 64 cells. The difference is 64 − 7 = 57.'
