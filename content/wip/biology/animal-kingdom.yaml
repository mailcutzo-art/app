    explanation: The formula gives, for each half-jaw, 2 incisors, 1 canine, 2 premolars and 3 molars; there are 4 half-jaws, so the mouth has 8 incisors, 4 canines, 8 premolars and 12 molars. Statements I, II and III are correct and IV is wrong because there are 12 molars.
