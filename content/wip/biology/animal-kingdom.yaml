    stem: On a freezing night, a *Catla* in a pond, a frog (*Rana*) on its bank and a crow (*Corvus*) nearby are all exposed to the cold. Which statement is correct?
    options:
      - Only *Catla* follows the surroundings; *Rana* and *Corvus* keep constant temperatures
