questions:
  - id: bio-animk-001
    topic: animk-chordata-vertebrates
    subtopic: Fundamental chordate characters
    concept: Notochord, dorsal hollow nerve cord and paired pharyngeal gill slits define Chordata
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [chordate-characters, ncert-line]
    stem: Which set gives the fundamental characters of phylum Chordata?
    options:
      - Vertebral column, dorsal hollow nerve cord, paired pharyngeal gill slits
      - Notochord, ventral solid nerve cord, paired pharyngeal gill slits
      - Notochord, dorsal hollow nerve cord, paired pharyngeal gill slits
      - Notochord, dorsal hollow nerve cord, dorsal heart
    answer: 2
    explanation: NCERT says chordates are fundamentally characterised by a notochord, a dorsal hollow nerve cord and paired pharyngeal gill slits. A vertebral column belongs only to vertebrates, a ventral solid nerve cord is a non-chordate feature, and the chordate heart is ventral, not dorsal.
