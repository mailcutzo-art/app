    diagram: Longitudinal section of a *Hydra*-like polyp. The base is fixed to a rock and the cylindrical body encloses a central cavity labelled W. At the free upper end a small raised region carries one opening labelled X, surrounded by a ring of long tentacles. Small cells with stinging capsules, labelled Z, are scattered along the tentacles and the body wall. The body wall has two cell layers with a thin undifferentiated layer between them.
