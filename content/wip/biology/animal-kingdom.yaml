    explanation: Box X is the cyclostomes (*Petromyzon*, *Myxine*), box Y the cartilaginous fishes (*Scoliodon*, *Pristis*, *Carcharodon*, *Trygon*) and box Z the bony fishes (*Labeo*, *Catla*, *Hippocampus*). Only one option places all three correctly.
