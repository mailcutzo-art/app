    explanation: The trachea (wind pipe) is a straight tube extending up to the mid-thoracic cavity, and it divides into a right and a left primary bronchus at the level of the 5th thoracic vertebra. Its cartilaginous rings are incomplete, and the sound box is the larynx.
  - id: bio-breath-029
