    subtopic: Pleura
    concept: Pleural fluid between the two pleural layers reduces friction on the lung surface
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [pleura, pleural-fluid]
    stem: The pleural fluid between the two layers of the pleura serves to
    options:
      - Humidify the inspired air
      - Clear the air of foreign particles
      - Reduce friction on the lung surface
      - Increase the surface area for diffusion
    answer: 2
    explanation: Pleural fluid lies between the two pleural layers and reduces friction on the lung surface. Humidifying the air and clearing foreign particles are functions of the conducting part.
  - id: bio-breath-010
    topic: breath-respiratory-system
