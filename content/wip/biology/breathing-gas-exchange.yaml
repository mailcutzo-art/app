    tags: [carbonic-anhydrase, bicarbonate]
    stem: In a laboratory test, red blood cells are treated with a chemical that completely blocks carbonic anhydrase. When this blood passes through a tissue capillary, which route of CO_2 transport is reduced most?
    options:
      - Transport as bicarbonate
      - Transport as carbamino-haemoglobin
      - Transport as CO_2 dissolved in plasma
      - Transport of O_2 as oxyhaemoglobin
    answer: 0
    explanation: Carbonic anhydrase facilitates the reaction of CO_2 with water, which leads to bicarbonate, the route that carries about 70 per cent of the CO_2. Binding of CO_2 to haemoglobin and the dissolved form do not need the enzyme, and oxyhaemoglobin carries O_2.
