    options:
      - Epiglottis
      - Alveolar ducts
      - Tertiary bronchi
      - Alveoli
    answer: 2
    explanation: NCERT states that the trachea, the primary, secondary and tertiary bronchi and the initial bronchioles are supported by incomplete cartilaginous rings. The epiglottis is a cartilaginous flap and not a ring, and the alveoli and their ducts are not in the list.
  - id: bio-breath-016
    topic: breath-respiratory-system
