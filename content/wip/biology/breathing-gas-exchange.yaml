    options:
      - II and III only
      - I, III and IV only
      - III and IV only
      - I and II only
    answer: 3
    explanation: Statements I and II are NCERT facts. III is wrong because incomplete cartilaginous rings support the trachea, bronchi and initial bronchioles, not the alveoli. IV is wrong because alveoli arise from terminal bronchioles.
  - id: bio-breath-034
    topic: breath-respiratory-system
