      - Fish
      - Flatworm
      - Reptile
    answer: 2
    explanation: Lower invertebrates such as sponges, coelenterates and flatworms exchange gases by simple diffusion over the entire body surface. Insects use tracheal tubes, fishes use gills and reptiles use lungs.
