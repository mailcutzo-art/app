    options:
      - Pharynx
      - Larynx
      - Trachea
      - Nasal chamber
    answer: 3
    explanation: The external nostrils open into the nasal chamber through the nasal passage. The nasal chamber then opens into the pharynx, and the larynx and trachea lie further along the path of air.
  - id: bio-breath-004
