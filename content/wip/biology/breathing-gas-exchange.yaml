    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [alveoli]
    stem: |-
      Consider the following statements about the alveoli.
      I. They are very thin, irregular-walled and vascularised bag-like structures.
      II. A number of alveoli arise from each terminal bronchiole.
      III. They are supported by incomplete cartilaginous rings.
      IV. They arise directly from the primary bronchi.
