    options:
      - Epiglottis
      - Glottis
      - Pharynx
      - Pleura
    answer: 0
    explanation: During swallowing the glottis is covered by the epiglottis, a thin elastic cartilaginous flap, so food does not enter the larynx. The glottis is the opening that gets covered, not the covering flap.
