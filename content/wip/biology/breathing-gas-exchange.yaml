    tags: [numerical, co2-delivery, percentages]
    stem: Assume that 100 ml of deoxygenated blood delivers 4 ml of CO_2 to the alveoli, of which 70 per cent is carried as bicarbonate and 7 per cent in dissolved form, and the rest as carbamino-haemoglobin. How much CO_2 is delivered from carbamino-haemoglobin by 1 litre of deoxygenated blood?
    options:
      - 2.8 ml
      - 9.2 ml
      - 28 ml
      - 30.8 ml
    answer: 1
    explanation: 1 litre (1000 ml) delivers 4 × 10 = 40 ml of CO_2. Bicarbonate gives 70 per cent = 28 ml and the dissolved form 7 per cent = 2.8 ml, so carbamino-haemoglobin gives 40 − 28 − 2.8 = 9.2 ml (23 per cent, within NCERT's 20–25 per cent).
