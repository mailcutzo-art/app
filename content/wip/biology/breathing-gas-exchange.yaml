      - Very thin, irregular-walled, vascularised bag-like structures
      - Very thin, irregular-walled, non-vascular tube-like structures
    answer: 2
    explanation: NCERT describes alveoli as very thin, irregular-walled and vascularised bag-like structures arising from terminal bronchioles. The other options change one or more of these features.
  - id: bio-breath-009
