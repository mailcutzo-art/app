    battle: true
    tags: [larynx, sound-box]
    stem: Which cartilaginous box of the respiratory tract helps in sound production and is hence called the sound box?
    options:
      - Larynx
      - Pharynx
      - Trachea
      - Epiglottis
    answer: 0
    explanation: The larynx is a cartilaginous box that helps in sound production, so it is called the sound box. The pharynx is the common food and air passage, the trachea is the wind pipe and the epiglottis is a flap over the glottis.
  - id: bio-breath-003
    topic: breath-respiratory-system
