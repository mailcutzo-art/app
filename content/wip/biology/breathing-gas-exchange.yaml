    options:
      - Primary bronchi
      - Terminal bronchioles
      - Secondary bronchi
      - Tertiary bronchi
    answer: 1
    explanation: Each terminal bronchiole gives rise to a number of alveoli. Primary, secondary and tertiary bronchi are higher branches of the bronchial tree and do not bear alveoli directly.
  - id: bio-breath-008
    topic: breath-respiratory-system
