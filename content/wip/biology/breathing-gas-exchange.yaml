questions:
  - id: bio-breath-001
    topic: breath-respiratory-system
    subtopic: Pharynx
    concept: The pharynx is the common passage for food and air
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [pharynx]
    stem: The common passage for food and air in the human respiratory tract is the
    options:
      - Larynx
      - Pharynx
      - Trachea
      - Nasal chamber
    answer: 1
    explanation: The nasal chamber opens into the pharynx, which is a common passage for food and air. The larynx and trachea carry air to the lungs, and the nasal chamber is the first air passage.
  - id: bio-breath-002
    topic: breath-respiratory-system
    subtopic: Larynx
    concept: The larynx is a cartilaginous box that helps in sound production
    category: factual
    format: direct
