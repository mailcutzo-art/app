      - Diaphragm only
      - Bronchial wall
    answer: 0
    explanation: The inner pleural membrane is in contact with the lung surface, whereas the outer pleural membrane is in close contact with the thoracic lining.
  - id: bio-breath-011
    topic: breath-respiratory-system
    subtopic: Lungs
    concept: The branching network of bronchi, bronchioles and alveoli comprises the lungs
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [lungs]
    stem: The human lungs consist of the branching network of
    options:
      - Nasal chamber, pharynx and larynx
      - Larynx, trachea and bronchi
      - Bronchi, bronchioles and alveoli
      - Bronchioles, alveoli and the diaphragm
    answer: 2
    explanation: NCERT states that the branching network of bronchi, bronchioles and alveoli comprises the lungs. The nasal chamber, pharynx, larynx and trachea are air passages outside this network, and the diaphragm belongs to the thoracic chamber.
  - id: bio-breath-012
    topic: breath-respiratory-system
    subtopic: Conducting and exchange parts
    concept: The conducting part extends from the external nostrils up to the terminal bronchioles
    category: factual
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [conducting-part]
    stem: The conducting part of the human respiratory system extends from the external nostrils up to the
    options:
      - Tertiary bronchi
      - Terminal bronchioles
      - Alveolar ducts
      - Alveoli
    answer: 1
    explanation: The conducting part runs from the external nostrils up to the terminal bronchioles. The alveoli and their ducts form the respiratory or exchange part.
  - id: bio-breath-013
    topic: breath-respiratory-system
    subtopic: Conducting and exchange parts
    concept: The alveoli and their ducts form the respiratory or exchange part
    category: factual
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [exchange-part, alveoli]
    stem: The respiratory or exchange part of the human respiratory system is formed by the
    options:
      - Terminal bronchioles and alveoli
      - Bronchi and bronchioles
      - Trachea and alveoli
      - Alveoli and their ducts
    answer: 3
    explanation: NCERT says the alveoli and their ducts form the respiratory (exchange) part, the site of actual diffusion of O_2 and CO_2. Terminal bronchioles, like the bronchi and trachea, belong to the conducting part.
  - id: bio-breath-014
    topic: breath-respiratory-system
    subtopic: Conducting and exchange parts
    concept: The conducting part does not carry out diffusion of O2 and CO2; the exchange part does
    category: concept
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [conducting-part, function]
    stem: Which one of the following is NOT a function of the conducting part of the human respiratory system?
    options:
      - Transporting atmospheric air to the alveoli
      - Diffusion of O_2 and CO_2 between blood and atmospheric air
      - Clearing the air of foreign particles
      - Bringing the air to body temperature
    answer: 1
    explanation: The conducting part transports air to the alveoli, clears foreign particles, humidifies the air and brings it to body temperature. Actual diffusion of O_2 and CO_2 between blood and air occurs in the exchange part.
  - id: bio-breath-015
    topic: breath-respiratory-system
    subtopic: Trachea and bronchi
