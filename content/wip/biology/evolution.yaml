      - both are descended from a recent wolf-like common ancestor
      - the marsupial wolf inherited its body form from placental wolves by use and disuse
    answer: 1
    explanation: NCERT says that placental mammals also exhibit adaptive radiation, evolving into varieties each of which appears similar to a corresponding marsupial, for example the placental wolf and the Tasmanian wolf. They are not descendants of each other.
  - id: bio-evol-027
    topic: evol-darwinism-adaptive-radiation
    subtopic: Nature of evolution
    concept: Evolution is a stochastic process based on chance events and chance mutations, not a directed one
    category: concept
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [stochastic, evolution]
    stem: Evolution is described as a stochastic process, which means that it
    options:
      - follows a fixed path towards a predetermined end
      - is driven only by the use and disuse of organs
      - occurs only in isolated island populations
      - depends on chance events in nature and chance mutations, not on a fixed direction
    answer: 3
    explanation: NCERT states that evolution is not a directed process in the sense of determinism; it is a stochastic process based on chance events in nature and chance mutations in the organisms.
  - id: bio-evol-028
    topic: evol-darwinism-adaptive-radiation
    subtopic: Adaptive radiation
    concept: Darwin's finches and Australian marsupials both radiated from an ancestral stock in an isolated area
    category: concept
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [adaptive-radiation, darwins-finches, marsupials]
    stem: A feature common to the adaptive radiation of Darwin's finches and of Australian marsupials is that both occurred
    options:
      - on different continents, from unrelated ancestral forms
      - through large single-step mutations that skipped intermediate forms
      - by individuals acquiring new features through use during their lifetime
      - in an isolated geographical area, from an ancestral stock
    answer: 3
    explanation: Darwin's finches radiated on the Galapagos Islands from seed-eating forms, and the marsupials radiated from an ancestral stock within the Australian island continent. Both are NCERT examples of adaptive radiation in isolated areas.
  - id: bio-evol-029
    topic: evol-darwinism-adaptive-radiation
    subtopic: Darwin's finches
    concept: Altered beaks arose from seed-eating finches, giving insectivorous and vegetarian forms
    category: concept
    format: statements
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [darwins-finches, adaptive-radiation]
    stem: Which one of the following statements about Darwin's finches is correct?
    options:
      - Each variety reached the island separately from a different mainland stock with a ready-made beak
      - Forms with altered beaks arose from the original seed-eating finches and became insectivorous and vegetarian types
      - The beaks became modified because the birds used them more and passed the change on
      - All the varieties on the island remained seed-eating and differed only in body size
    answer: 1
    explanation: NCERT says that from the original seed-eating features many forms with altered beaks arose, enabling insectivorous and vegetarian finches, and that all varieties evolved on the island itself. Passing on beak changes gained by use is Lamarck's idea.
  - id: bio-evol-030
    topic: evol-darwinism-adaptive-radiation
    subtopic: Adaptive radiation
    concept: Adaptive radiation involves species radiating from a point, not unrelated ancestors
    category: concept
    format: statements
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [adaptive-radiation]
    stem: Which one of the following statements about adaptive radiation is incorrect?
    options:
      - It always requires the different species to arise from unrelated ancestors
      - It is the evolution of different species in a geographical area starting from a point
      - Darwin's finches are among its best examples
      - Australian marsupials arose by it from an ancestral stock within the island continent
    answer: 0
    explanation: Adaptive radiation starts from a point, that is a common ancestral stock, and radiates to other habitats. Darwin's finches and Australian marsupials are NCERT examples, so only the statement about unrelated ancestors is incorrect.
  - id: bio-evol-031
    topic: evol-darwinism-adaptive-radiation
    subtopic: Lamarck and Darwin
    concept: Lamarck relied on use and inheritance of acquired change; Darwin on heritable variation and selection
    category: concept
    format: statements
    difficulty: 4
    time: 85
    ncert: true
    battle: false
    tags: [lamarck, darwin]
    stem: Which one of the following correctly compares the views of Lamarck and Darwin?
    options:
      - 'Lamarck: better-fit individuals with inherited variations leave more progeny. Darwin: organs that are used develop and the acquired change is inherited'
      - 'Lamarck: evolution by single-step mutations. Darwin: acquired changes from use are passed on'
      - 'Lamarck: organs that are used develop and the acquired change is inherited. Darwin: better-fit individuals with inherited variations leave more progeny'
      - 'Lamarck: gradual evolution by natural selection. Darwin: evolution by use and disuse of organs'
    answer: 2
    explanation: Lamarck's idea rested on use and disuse of organs and the passing on of the acquired character. Darwin's rested on natural selection of the better-fit, whose adaptive ability is inherited. The other options swap or misassign these views.
  - id: bio-evol-032
    topic: evol-darwinism-adaptive-radiation
    subtopic: Convergent evolution
    concept: The placental and Tasmanian wolves look alike though they belong to different groups of mammals
    category: concept
    format: statements
    difficulty: 4
    time: 85
    ncert: true
    battle: false
    tags: [convergent-evolution, analogy]
    stem: Which one of the following statements about convergent evolution is correct?
    options:
      - The forelimbs of whales, bats, cheetahs and humans arose by convergent evolution
      - The placental wolf and the Tasmanian wolf appear alike although one is a placental mammal and the other a marsupial
      - The wings of a butterfly and of a bird are homologous organs
      - Structures formed by convergent evolution always have the same anatomical pattern
    answer: 1
    explanation: Convergent evolution gives similar-looking forms or analogous structures from different origins, as in the marsupial and placental wolves. Forelimbs of whales, bats, cheetahs and humans are homologous (divergent evolution), butterfly and bird wings are analogous, and analogous structures differ in anatomy.
