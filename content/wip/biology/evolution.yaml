    stem: In a large wild population of pea plants at Hardy-Weinberg equilibrium, 36% of the plants are dwarf (tt) and the rest are tall. A student argues that allele T must be more frequent than allele t because tall is dominant. Which statement is correct?
    options:
      - 'The student is right: T has a frequency of 0.64 and t has a frequency of 0.36'
      - 'The student is wrong: t has a frequency of 0.6 and T has a frequency of 0.4'
      - 'The student is right: T has a frequency of 0.6 and t has a frequency of 0.4'
      - 'The student is wrong: T has a frequency of 0.36 and t has a frequency of 0.64'
    answer: 1
    explanation: The dwarf plants are tt, so q^2 = 0.36, giving q = 0.6 for t and p = 0.4 for T. A dominant allele is not necessarily the more frequent one, so the student is wrong. Taking 0.36 as the frequency of an allele confuses q^2 with q.
  - id: bio-evol-308
    topic: evol-hardy-weinberg
