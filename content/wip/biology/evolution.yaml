    options:
      - convergent evolution
      - divergent evolution
      - genetic drift
      - the founder effect
    answer: 0
    explanation: NCERT calls it convergent evolution when more than one adaptive radiation appears to have occurred in an isolated geographical area representing different habitats. The placental wolf and the Tasmanian wolf are its example.
  - id: bio-evol-017
    topic: evol-darwinism-adaptive-radiation
    subtopic: Fitness
    concept: A better-fit individual leaves more progeny and is selected by nature
    category: concept
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [fitness, natural-selection]
    stem: In Darwinian terms, a better 'fit' individual in a given environment is one that
    options:
      - grows to a larger body size than others
      - lives longer than others of its kind
      - leaves more progeny than others and is selected by nature
      - acquires new organs through constant use
    answer: 2
    explanation: NCERT describes fitness as the end result of the ability to adapt and get selected by nature, and says those better fit leave more progeny. Body size, longevity or acquired organs do not define Darwinian fitness.
  - id: bio-evol-018
    topic: evol-darwinism-adaptive-radiation
