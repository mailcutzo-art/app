    difficulty: 4
    time: 85
    ncert: true
    battle: true
    tags: [convergent-evolution, adaptive-radiation]
    stem: Which pair is an example of convergent evolution rather than of adaptive radiation within one group?
    options:
      - Tasmanian wolf and placental wolf
      - Kangaroo and koala
      - Marsupial mole and marsupial mouse
      - Vegetarian finch and insectivorous finch
    answer: 0
    explanation: The pairs in the other options come from one ancestral stock that radiated within an area (marsupials of Australia, or Darwin's finches). The Tasmanian wolf (a marsupial) and the placental wolf come from separate radiations and look alike, which NCERT calls convergent evolution.
  - id: bio-evol-023
    topic: evol-darwinism-adaptive-radiation
