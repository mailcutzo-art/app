      - homologous structures showing divergent evolution and indicating common ancestry
      - analogous structures showing divergent evolution and indicating different ancestry
      - homologous structures showing convergent evolution and indicating a similar habitat
    answer: 1
    explanation: The same set of bones is present in all three limbs although their shape and function differ. This is homology, based on divergent evolution, and it indicates common ancestry. Analogy would need different structures with the same function.
