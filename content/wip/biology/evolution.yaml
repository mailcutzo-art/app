    stem: A student wants to test in the laboratory the idea that organic molecules could form from inorganic constituents on the early earth. Which set-up follows Miller's design?
    options:
      - An open flask of CH_4, O_2 and N_2 exposed to sunlight, with products collected on the walls
      - A sealed flask of pre-sterilised killed yeast kept without any electric discharge
      - A closed flask of CO_2, O_2 and N_2 with an electric discharge, followed by a condenser
