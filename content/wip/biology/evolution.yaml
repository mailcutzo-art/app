      - new forms appeared only after all older forms had gone extinct together
      - the earth was too young for any new forms to arise
    answer: 0
    explanation: NCERT says there had been extinctions of different life forms, and new forms of life arose at different periods of the earth's history, so there has been gradual evolution of life forms.
  - id: bio-evol-025
    topic: evol-darwinism-adaptive-radiation
    subtopic: Natural selection
    concept: The adaptive ability that makes an individual fit is inherited and has a genetic basis
    category: concept
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [natural-selection, fitness]
    stem: In Darwinian natural selection, the adaptive ability that makes an individual fit for its environment is
    options:
      - inherited and has a genetic basis
      - acquired during life by use of organs
      - unrelated to inheritance
      - determined only by the age of the individual
    answer: 0
    explanation: Fitness depends on characteristics that are inherited, so there must be a genetic basis for getting selected and to evolve. This separates Darwin's idea from the inheritance of acquired characters.
  - id: bio-evol-026
    topic: evol-darwinism-adaptive-radiation
    subtopic: Convergent evolution
