  - id: bio-evol-004
    topic: evol-darwinism-adaptive-radiation
    subtopic: Natural selection
    concept: Darwin held natural selection to be the basis of evolution
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [darwin, natural-selection]
    stem: According to Darwin, the basis of evolution is
    options:
      - inheritance of acquired characters
      - natural selection
      - use and disuse of organs
      - special creation
    answer: 1
    explanation: Darwin called the better survival and outbreeding of the fitter individuals natural selection and regarded it as the basis of evolution. Use and disuse and the inheritance of acquired characters belong to Lamarck, and special creation is the older view that Darwin's ideas challenged.
