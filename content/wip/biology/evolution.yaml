  - id: bio-evol-006
    topic: evol-darwinism-adaptive-radiation
    subtopic: Adaptive radiation
    concept: Adaptive radiation is evolution of different species from a point, radiating into other habitats
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [adaptive-radiation]
    stem: Which description fits adaptive radiation?
    options:
      - Unrelated species evolving similar structures to perform the same function
      - A change in allele frequency caused by chance alone in a small population
      - Gradual elongation of an organ through use, followed by its transmission to offspring
      - Different species arising from a common starting point and radiating into different habitats of a geographical area
    answer: 3
    explanation: Adaptive radiation is the evolution of different species in a given geographical area, starting from a point and literally radiating to other habitats. The other options describe analogy, genetic drift and Lamarck's idea.
