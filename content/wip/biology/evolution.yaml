    formula: p = (n_1 p_1 + n_2 p_2)/(n_1 + n_2)
    tags: [case, gene-flow]
    stem: A wild flower population X has 800 plants, and the frequency of allele A is 0.6. Then 200 plants from population Y, in which the frequency of A is 0.1, migrate into X and interbreed with it. What is the frequency of A in the combined population?
    options:
      - '0.35'
      - '0.40'
      - '0.60'
      - '0.50'
    answer: 3
    explanation: Gene flow changes the allele frequency of the receiving population. The new frequency is the weighted value (800 × 0.6 + 200 × 0.1)/1000 = 0.5. The simple average of 0.6 and 0.1, 0.35, ignores the sizes of the two populations.
