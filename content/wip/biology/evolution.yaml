    explanation: NCERT states that Hugo de Vries, based on his work on evening primrose, brought forth the idea of mutations, large differences arising suddenly in a population. The garden pea is Mendel's material.
  - id: bio-evol-024
    topic: evol-darwinism-adaptive-radiation
