      - large and directionless
      - sudden single-step changes causing speciation
      - characters acquired by use during life
    answer: 0
    explanation: NCERT contrasts the small and directional variations of Darwin, which give gradual evolution, with the mutations of de Vries, which are random and directionless and cause saltation.
  - id: bio-evol-019
    topic: evol-darwinism-adaptive-radiation
    subtopic: Lamarck
    concept: Lamarck's explanation of the giraffe's neck is rejected because acquired characters are not inherited
    category: concept
    format: direct
    difficulty: 3
    time: 50
    ncert: false
    battle: true
    tags: [lamarck, acquired-characters]
    stem: The explanation of Lamarck that giraffes gained long necks is no longer accepted mainly because
    options:
      - organs never change in size with use or disuse
      - characters acquired by an individual during its life are not passed on to its offspring
      - giraffes never fed on the leaves of tall trees
      - natural selection cannot act on the length of an organ
    answer: 1
    explanation: NCERT says that nobody believes the giraffe conjecture anymore. Fitness has a genetic basis, so a neck lengthened by stretching during one lifetime does not alter the genes and is not inherited.
  - id: bio-evol-020
    topic: evol-darwinism-adaptive-radiation
    subtopic: Natural selection
    concept: Dark-winged moths increased after industrialisation because predators spotted white-winged moths on dark trunks
    category: application
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [natural-selection, peppered-moth]
    stem: In the peppered moth study, dark-winged moths became common after industrialisation mainly because
    options:
      - soot caused the white-winged moths to mutate into dark-winged moths
      - moths used their wing pigment more and passed it to their offspring
      - white-winged moths were easily spotted by predators on the darkened trunks, so dark-winged moths survived better
      - dark-winged moths migrated in from distant forests
    answer: 2
    explanation: After industrialisation the tree trunks darkened with soot, and white-winged moths did not survive because predators spotted them, while dark-winged moths survived. This is selection of the better-adapted variant, not a change induced by soot or by use.
  - id: bio-evol-021
    topic: evol-darwinism-adaptive-radiation
    subtopic: Anthropogenic selection
    concept: Resistant pests and microbes that appear within months or years show evolution by anthropogenic action
    category: concept
    format: direct
