    options:
      - adaptive radiation
      - convergent evolution
      - saltation
      - evolution by anthropogenic action
    answer: 3
    explanation: NCERT says that excess use of herbicides, pesticides, antibiotics and drugs selects resistant varieties in a much shorter time scale, in months or years and not centuries, and calls these examples of evolution by anthropogenic action.
  - id: bio-evol-022
    topic: evol-darwinism-adaptive-radiation
    subtopic: Convergent evolution
