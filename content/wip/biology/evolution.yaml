  - id: bio-evol-251
    topic: evol-hardy-weinberg
    subtopic: Gene pool
    concept: The total genes and their alleles in a population make up its gene pool
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [gene-pool]
    stem: The sum total of all the genes and their alleles present in a population is called its
    options:
      - genome
      - genotype
      - karyotype
      - gene pool
    answer: 3
    explanation: NCERT calls the total genes and their alleles in a population its gene pool, and the Hardy-Weinberg principle says that it remains constant. A genome is the complete genetic material of an organism, a genotype is the genetic make-up of an individual and a karyotype is the chromosome complement of a cell.
  - id: bio-evol-252
    topic: evol-hardy-weinberg
