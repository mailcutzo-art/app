    concept: Constant allele frequencies from generation to generation constitute genetic equilibrium
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [genetic-equilibrium]
    stem: Allele frequencies of a population that stay constant from generation to generation are said to be in
    options:
      - adaptive radiation
      - genetic drift
      - genetic equilibrium
      - reproductive isolation
    answer: 2
    explanation: NCERT states that the Hardy-Weinberg principle makes the allele frequencies of a population stable and constant from generation to generation, so the gene pool is constant. This state is called genetic equilibrium. Genetic drift is a chance change in allele frequency, and adaptive radiation and reproductive isolation are different evolutionary ideas.
