  - id: bio-cellcycle-179
    topic: cellcycle-meiosis-one
    subtopic: Metaphase I
    concept: Order of nuclear events from diakinesis to telophase I
    category: application
    format: ordering
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [sequence, nuclear-envelope]
    stem: |-
      Arrange the following events of meiosis I in the order in which they occur.
      P. Reappearance of the nuclear membrane and nucleolus
      Q. Movement of homologous chromosomes to opposite poles
      R. Breakdown of the nuclear envelope
      S. Alignment of bivalents on the equatorial plate
    options:
      - S, R, Q, P
      - R, S, P, Q
      - R, Q, S, P
      - R, S, Q, P
    answer: 3
    explanation: The nuclear envelope breaks down by the end of diakinesis (R), bivalents align at metaphase I (S), homologues move apart in anaphase I (Q) and the nuclear membrane and nucleolus reappear in telophase I (P).
  - id: bio-cellcycle-180
    topic: cellcycle-meiosis-one
    subtopic: Diplotene and chiasmata
    concept: Count chiasmata and name the stage
    category: application
    format: diagram
    difficulty: 4
    time: 85
    ncert: true
    battle: false
    diagram: One bivalent drawn inside a nucleus bounded by an intact double-lined nuclear envelope. Two homologous chromosomes, each made of two sister chromatids joined at one centromere, are separating from each other along most of their length, leaving open gaps between them. They remain attached at three points along their arms where chromatids cross in an X-shape; the three crossings are labelled 1, 2 and 3 from left to right and all lie in the middle of the arms, none at the free ends. No ladder-like band lies between the homologues.
    tags: [chiasmata, diplotene, diagram]
    stem: The figure shows a bivalent inside a cell with an intact nuclear envelope. The number of chiasmata and the substage are
    options:
      - one chiasma; pachytene
      - three chiasmata; diplotene
      - six chiasmata; diplotene
      - three chiasmata; diakinesis
    answer: 1
    explanation: Each X-shaped junction is one chiasma, so there are three. They lie along the arms with the homologues separating between them and no synaptonemal complex, which is diplotene; in diakinesis the chiasmata would have moved to the ends.
