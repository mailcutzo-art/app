      - 'P: Monera, Q: Protista, R: Fungi, S: Animalia'
    answer: 3
    explanation: P lacks a nuclear membrane (Monera). Q is a unicellular eukaryote, which is Protista even though it is photosynthetic, since Plantae are multicellular with tissues and cellulose walls. R has a chitin wall and loose-tissue body (Fungi), and S is a wall-less organ-system heterotroph (Animalia).
