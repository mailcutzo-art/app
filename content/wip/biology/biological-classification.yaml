      - A includes Mycoplasma; B3 are methanogens; C2 includes Nostoc.
      - A includes Mycoplasma; B3 are methanogens; C1 includes Nostoc.
    answer: 3
    explanation: 'A has no cell wall (Mycoplasma). B has a different wall structure (archaebacteria): B1 are halophiles, B2 thermoacidophiles and B3 methanogens. Nostoc is photosynthetic with heterocysts (C1), not chemosynthetic (C2). Each distractor has one wrong item.'
