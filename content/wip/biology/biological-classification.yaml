  - id: bio-bioclass-090
    topic: bioclass-classification-history
    subtopic: Whittaker's five kingdoms
    concept: Four unknown organisms assigned to Monera, Protista, Fungi and Animalia from table features
    category: application
    format: case
    difficulty: 5
