    tags: [two-kingdom, fungi, case]
    stem: A botanist in Linnaeus' time had to place a non-photosynthetic, wall-bearing organism that absorbs food from dead matter, and a filamentous green alga, in one kingdom. Which statement explains how Whittaker's system treats them?
    options:
      - They stay together, because both have cell walls.
      - They are separated by cell type, since the fungus is prokaryotic and the alga is eukaryotic.
      - They are separated by body organisation, since the alga is unicellular and the fungus is multicellular.
