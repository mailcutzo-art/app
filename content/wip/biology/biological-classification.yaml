    stem: A farmer growing a cereal crop on phosphorus-poor, saline, drought-prone land wants a biofertiliser that forms a symbiotic association with the roots, absorbs soil phosphorus for the crop and improves its tolerance to salinity and drought. Which organism should he choose?
    options:
      - '*Rhizobium*'
      - '*Glomus*'
      - '*Azotobacter*'
      - '*Anabaena*'
    answer: 1
    explanation: Only mycorrhizal fungi such as Glomus form a root association that absorbs soil phosphorus and gives tolerance to salinity and drought. Rhizobium works with leguminous plants to fix nitrogen, Azotobacter is a free-living nitrogen fixer, and Anabaena is a nitrogen-fixing cyanobacterium.
