questions:
  - id: bio-bioclass-001
    topic: bioclass-lichens-mycorrhiza
    subtopic: 'Lichens: symbiotic partners'
    concept: Lichens are mutually useful (symbiotic) associations between algae and fungi
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [lichens, symbiosis]
    stem: Lichens are symbiotic (mutually useful) associations between
    options:
      - fungi and the roots of higher plants
      - algae and fungi
      - bacteria and algae
      - algae and the roots of higher plants
    answer: 1
    explanation: NCERT defines lichens as symbiotic, mutually useful associations between algae and fungi. The association between a fungus and the roots of a higher plant is a different symbiosis, called mycorrhiza.
  - id: bio-bioclass-002
    topic: bioclass-lichens-mycorrhiza
    subtopic: Lichens as pollution indicators
    concept: Lichens are very good pollution indicators because they do not grow in polluted areas
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [lichens, pollution-indicator]
    stem: Which of the following is regarded as a very good pollution indicator because it does not grow in polluted areas?
    options:
      - Slime moulds
      - Euglenoids
      - Dinoflagellates
      - Lichens
    answer: 3
    explanation: NCERT calls lichens very good pollution indicators because they do not grow in polluted areas. Slime moulds, euglenoids and dinoflagellates are protists that NCERT does not describe as pollution indicators.
  - id: bio-bioclass-003
    topic: bioclass-lichens-mycorrhiza
    subtopic: Phycobiont and mycobiont
    concept: The autotrophic algal partner of a lichen is the phycobiont
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [lichens, phycobiont]
    stem: In a lichen, the autotrophic partner is called the
    options:
      - phycobiont
      - mycobiont
      - mycorrhiza
      - heterocyst
    answer: 0
    explanation: In a lichen the algal component is the phycobiont, which is autotrophic, and the fungal component is the mycobiont, which is heterotrophic. Mycorrhiza is a fungus–root association, and a heterocyst is a nitrogen-fixing cell of some cyanobacteria.
  - id: bio-bioclass-004
    topic: bioclass-lichens-mycorrhiza
    subtopic: Roles of partners in lichens
    concept: The fungal partner of a lichen provides shelter and absorbs mineral nutrients and water
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [lichens, roles]
    stem: In a lichen, the fungal partner helps the algal partner by
    options:
      - preparing food by photosynthesis
      - fixing atmospheric nitrogen
      - providing shelter and absorbing mineral nutrients and water
      - protecting it from air pollutants
    answer: 2
    explanation: The alga prepares food for the fungus, and the fungus in return provides shelter and absorbs mineral nutrients and water for its partner. Photosynthesis is the alga's role; nitrogen fixation or shielding from pollutants is not a role NCERT gives the fungus.
  - id: bio-bioclass-005
    topic: bioclass-lichens-mycorrhiza
    subtopic: 'Mycorrhiza: partners'
    concept: Mycorrhiza is a symbiotic association of a fungus with the roots of higher plants
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [mycorrhiza, symbiosis]
    stem: Mycorrhiza is a symbiotic association of a fungus with
    options:
      - an alga or a cyanobacterium
      - the roots of higher plants
      - bacteria living in the root nodules of legumes
      - dead organic matter in the soil
    answer: 1
    explanation: Mycorrhiza is the symbiotic association of a fungus with the roots of higher plants. An alga or cyanobacterium as partner makes a lichen, root-nodule bacteria are Rhizobium, and feeding on dead matter is saprophytism, not symbiosis.
  - id: bio-bioclass-006
    topic: bioclass-lichens-mycorrhiza
    subtopic: Fungi as symbionts
    concept: Fungi in lichens and mycorrhiza are symbionts, unlike saprophytes and parasites
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [fungi, nutrition, symbionts]
    stem: Fungi that form lichens with algae and mycorrhiza with the roots of higher plants are described as
    options:
      - saprophytes
      - parasites
      - autotrophs
      - symbionts
    answer: 3
    explanation: 'Fungi are heterotrophs: saprophytes absorb soluble organic matter from dead substrates, parasites depend on living plants and animals, and symbionts live in association with other organisms, as in lichens and mycorrhiza. Fungi are never autotrophic.'
  - id: bio-bioclass-007
    topic: bioclass-lichens-mycorrhiza
    subtopic: 'Mycorrhiza: exchange of materials'
    concept: In mycorrhiza the plant supplies sugars to the fungus, which supplies minerals and water
    category: concept
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [mycorrhiza, exchange]
    stem: In a mycorrhizal association, which of the following is supplied by the plant to the fungus?
    options:
      - Sugars
      - Phosphorus absorbed from the soil
      - Water absorbed from a large volume of soil
      - Protection against root-borne pathogens
    answer: 0
    explanation: The fungus absorbs minerals and water for the plant, and the plant in turn supplies sugars to the fungus. The other three options are benefits that the plant receives, so they flow in the opposite direction.
  - id: bio-bioclass-008
    topic: bioclass-lichens-mycorrhiza
    subtopic: 'Mycorrhiza: phosphorus uptake'
    concept: The fungal symbiont of mycorrhiza absorbs phosphorus from the soil and passes it to the plant
    category: factual
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [mycorrhiza, phosphorus]
    stem: According to NCERT, the fungal symbiont of a mycorrhiza absorbs which nutrient from the soil and passes it to the plant?
    options:
      - Atmospheric nitrogen
      - Sugars
      - Phosphorus
      - Ammonia from root nodules
    answer: 2
    explanation: NCERT states that the fungal symbiont in mycorrhiza absorbs phosphorus from the soil and passes it to the plant. Fixing atmospheric nitrogen in root nodules is done by bacteria such as Rhizobium, and sugars flow from plant to fungus.
  - id: bio-bioclass-009
    topic: bioclass-lichens-mycorrhiza
    subtopic: Lichens as pioneers in succession
    concept: Lichens are the usual pioneers on bare rock and secrete acids that help weathering and soil formation
    category: factual
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [lichens, succession, pioneer]
    stem: In primary succession on a bare rock, the pioneer species are usually
    options:
      - bryophytes
      - lichens
      - phytoplankton
      - shrubs
    answer: 1
    explanation: 'NCERT says lichens are the usual pioneers on rock: they secrete acids that dissolve the rock and help weathering and soil formation. Bryophytes follow in the small amount of soil formed, and phytoplankton are pioneers in water (hydrarch succession).'
  - id: bio-bioclass-010
    topic: bioclass-lichens-mycorrhiza
    subtopic: Mutualism and symbiosis
    concept: A lichen is a mutualistic association; orchid on mango, barnacles on whale and cattle egret are commensalism
    category: application
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [mutualism, commensalism, lichens]
    stem: Which of the following is an example of mutualism rather than commensalism?
    options:
      - An orchid growing as an epiphyte on a mango branch
      - Barnacles growing on the back of a whale
      - Cattle egrets feeding near grazing cattle
      - A lichen formed by a fungus and an alga
    answer: 3
    explanation: In a lichen both partners gain, which is mutualism; NCERT describes lichens as an intimate mutualistic relationship. An epiphytic orchid, barnacles on a whale and egrets near cattle are NCERT examples of commensalism, where one species benefits and the other is unaffected.
  - id: bio-bioclass-011
    topic: bioclass-lichens-mycorrhiza
    subtopic: 'Lichens: photosynthetic partner'
    concept: A lichen with a cyanobacterium pairs a heterotrophic eukaryotic fungus with an autotrophic prokaryote
    category: application
    format: direct
    difficulty: 4
    time: 85
    ncert: true
    battle: false
    tags: [lichens, cyanobacteria, prokaryote]
    stem: A lichen has a cyanobacterium as its photosynthetic partner. Which of the following correctly describes its two partners?
    options:
      - A heterotrophic eukaryote (fungus) and an autotrophic prokaryote (cyanobacterium)
      - Two eukaryotes, one heterotrophic and one autotrophic
      - Two prokaryotes, one heterotrophic and one autotrophic
      - An autotrophic eukaryote (fungus) and a heterotrophic prokaryote (cyanobacterium)
    answer: 0
    explanation: NCERT names the photosynthetic partner of a lichen as an alga or a cyanobacterium. The fungus is a heterotrophic eukaryote, while a cyanobacterium is a photosynthetic prokaryote of Kingdom Monera. The trap is assuming every lichen has two eukaryotic partners.
  - id: bio-bioclass-012
    topic: bioclass-lichens-mycorrhiza
    subtopic: 'Lichens: nature of the association'
    concept: Lichen partners differ in nutrition; the pair looks like one organism and avoids polluted areas
    category: concept
    format: statements
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [lichens, phycobiont, mycobiont]
    stem: Which one of the following statements about lichens is correct?
    options:
      - A lichen in nature clearly looks like two separate organisms, an alga and a fungus
      - Lichens grow luxuriantly in polluted areas and so are poor indicators of pollution
      - 'The two partners of a lichen differ in nutrition: the alga is autotrophic and the fungus is heterotrophic'
      - The algal partner of a lichen is called the mycobiont
    answer: 2
    explanation: The alga (phycobiont) is autotrophic and the fungus (mycobiont) is heterotrophic. NCERT says one would never imagine two organisms in a lichen seen in nature, lichens do not grow in polluted areas, and the mycobiont is the fungal, not the algal, component.
  - id: bio-bioclass-013
    topic: bioclass-lichens-mycorrhiza
    subtopic: 'Mycorrhiza: benefits and examples'
    concept: Pinus has an obligate association with mycorrhiza; plants with mycorrhiza tolerate salinity and drought
    category: concept
    format: statements
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [mycorrhiza, pinus, obligate]
    stem: Select the incorrect statement about mycorrhiza.
    options:
      - Plants with mycorrhizal association show tolerance to salinity and drought
      - '*Pinus* seeds can germinate and establish equally well without the mycorrhizal fungus'
      - The fungal hyphae have a very large surface area for absorbing minerals and water from the soil
      - Many members of the genus *Glomus* form mycorrhiza
    answer: 1
    explanation: 'Pinus has an obligate association with mycorrhiza: its seeds cannot germinate and establish without it, so option B is wrong. The other three statements are NCERT facts (benefits to the plant, very large hyphal surface area, and Glomus as a mycorrhizal genus).'
  - id: bio-bioclass-014
    topic: bioclass-lichens-mycorrhiza
    subtopic: 'Lichens: partners, roles and indicators'
    concept: 'Lichen statements: algae plus fungi, phycobiont is autotrophic, fungal roles, pollution indicators'
    category: concept
    format: multi-statement
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [lichens, multi-statement]
    stem: |-
      Consider the following statements about lichens.
      I. They are mutually useful associations between algae and fungi.
      II. The algal component is called the mycobiont and is heterotrophic.
      III. The fungal partner provides shelter and absorbs water and mineral nutrients for the alga.
      IV. They are very good pollution indicators because they do not grow in polluted areas.
      Which of these statements are correct?
    options:
      - I, III and IV only
      - I and II only
      - II, III and IV only
      - I, II and IV only
    answer: 0
    explanation: Statements I, III and IV are NCERT facts. Statement II is wrong because the algal component is the phycobiont and is autotrophic; the fungal component is the heterotrophic mycobiont.
  - id: bio-bioclass-015
    topic: bioclass-lichens-mycorrhiza
    subtopic: 'Mycorrhiza: benefits to plants'
    concept: Mycorrhizal plants resist root-borne pathogens and tolerate salinity and drought; the fungus does not fix nitrogen
    category: concept
    format: multi-statement
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [mycorrhiza, benefits, multi-statement]
    stem: |-
      Consider the following statements about plants that have a mycorrhizal association.
      I. They show resistance to root-borne pathogens.
      II. They show tolerance to salinity and drought.
      III. Their fungal partner fixes atmospheric nitrogen for them.
      IV. Their fungal partner supplies sugars to them.
      Which of these statements are correct?
    options:
      - II and III only
      - I, II and IV only
      - I, III and IV only
      - I and II only
    answer: 3
    explanation: NCERT lists resistance to root-borne pathogens and tolerance to salinity and drought as benefits (I and II). III is wrong because the fungus absorbs phosphorus, whereas nitrogen fixation belongs to bacteria such as Rhizobium. IV is wrong because sugars pass from the plant to the fungus.
  - id: bio-bioclass-016
    topic: bioclass-lichens-mycorrhiza
    subtopic: Lichens versus mycorrhiza
    concept: Combined NCERT ideas on partners, nutrition, absorption, pollution and succession in lichens and mycorrhiza
    category: application
    format: multi-statement
    difficulty: 5
    time: 120
    ncert: true
    battle: false
    tags: [lichens, mycorrhiza, comparison]
    stem: |-
      Consider the following statements.
      I. The photosynthetic partner of a lichen can be a prokaryote, but the plant partner of a mycorrhiza is always a eukaryote.
      II. In both lichens and mycorrhiza the fungus is the heterotrophic partner and receives organic food from its partner.
      III. In a lichen the fungus absorbs minerals and water for its partner, whereas in a mycorrhiza the plant absorbs them for the fungus.
      IV. Lichens, which do not grow in polluted areas, are pioneers on bare rock, where they secrete acids that help soil formation.
      Which of these statements are correct?
    options:
      - I and II only
      - II, III and IV only
      - I, II and IV only
      - I, III and IV only
    answer: 2
    explanation: 'I is right: a lichen''s photosynthetic partner may be a cyanobacterium (prokaryote), while a mycorrhiza''s partner is a higher plant. II is right: the fungus is heterotrophic in both. III is wrong: in both the fungus does the absorbing. IV is right: both facts are in NCERT.'
  - id: bio-bioclass-017
    topic: bioclass-lichens-mycorrhiza
    subtopic: 'Lichens: roles and indicators'
    concept: Alga prepares food, fungus gives shelter and absorbs water and minerals; lichens avoid polluted areas
    category: concept
    format: statement-pair
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [lichens, pollution-indicator, roles]
    stem: |-
      Statement I: In a lichen, the alga prepares food for the fungus, while the fungus provides shelter and absorbs mineral nutrients and water.
      Statement II: Lichens flourish in polluted areas, so they are poor pollution indicators.
    options:
      - Both Statement I and Statement II are correct
      - Both Statement I and Statement II are incorrect
      - Statement I is correct but Statement II is incorrect
      - Statement I is incorrect but Statement II is correct
    answer: 2
    explanation: 'Statement I is the NCERT account of the two partners'' roles. Statement II is wrong: lichens do not grow in polluted areas, which is why NCERT calls them very good pollution indicators.'
  - id: bio-bioclass-018
    topic: bioclass-lichens-mycorrhiza
    subtopic: Lichens versus mycorrhiza
    concept: In both lichens and mycorrhiza the fungus is heterotrophic, absorbs minerals and water and receives food
    category: application
    format: statement-pair
    difficulty: 4
    time: 85
    ncert: true
    battle: false
    tags: [lichens, mycorrhiza, comparison]
    stem: |-
      Statement I: In both lichens and mycorrhiza, the fungal partner prepares food for its partner by photosynthesis.
      Statement II: In both lichens and mycorrhiza, the fungal partner absorbs mineral nutrients and water for its partner and receives food from it.
    options:
      - Both Statement I and Statement II are correct
      - Both Statement I and Statement II are incorrect
      - Statement I is correct but Statement II is incorrect
      - Statement I is incorrect but Statement II is correct
    answer: 3
    explanation: 'Statement I is wrong: the fungus is heterotrophic in both associations and cannot photosynthesise. Statement II is right: the fungus absorbs minerals and water for the alga or the plant and gets food from the alga or the plant in return.'
  - id: bio-bioclass-019
    topic: bioclass-lichens-mycorrhiza
    subtopic: Lichens as pollution indicators
    concept: Presence of lichens suggests unpolluted air because they do not grow in polluted areas
    category: concept
    format: assertion-reason
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [lichens, pollution-indicator]
    stem: |-
      Assertion (A): The presence of lichens on tree trunks in a locality suggests that the air there is relatively free from pollution.
      Reason (R): Lichens do not grow in polluted areas.
    options:
      - Both A and R are true and R is the correct explanation of A
      - Both A and R are true but R is not the correct explanation of A
      - A is true but R is false
      - A is false but R is true
    answer: 0
    explanation: Because lichens do not grow in polluted areas, their presence points to cleaner air, which is how they act as pollution indicators. R states exactly this property, so it explains A.
  - id: bio-bioclass-020
    topic: bioclass-lichens-mycorrhiza
    subtopic: 'Lichens: nature of the association'
    concept: A lichen looks like one organism in nature although it is made of an alga and a fungus
    category: concept
    format: assertion-reason
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [lichens, symbiosis]
    stem: |-
      Assertion (A): When seen in nature, a lichen does not appear to be made of two different organisms.
      Reason (R): A lichen consists of a single organism, the fungus, living alone.
    options:
      - Both A and R are true and R is the correct explanation of A
      - Both A and R are true but R is not the correct explanation of A
      - A is true but R is false
      - A is false but R is true
    answer: 2
    explanation: NCERT notes that the association is so close that one would never imagine two organisms in a lichen, so A is true. R is false because a lichen contains two organisms, a photosynthetic alga and a fungus.
  - id: bio-bioclass-021
    topic: bioclass-lichens-mycorrhiza
    subtopic: 'Mycorrhiza: benefits to plants'
    concept: Tolerance to salinity and drought is a benefit of mycorrhiza; the fungus receives sugars from the plant
    category: concept
    format: assertion-reason
    difficulty: 4
    time: 85
    ncert: true
    battle: false
    tags: [mycorrhiza, benefits]
    stem: |-
      Assertion (A): Plants with mycorrhizal association show tolerance to salinity and drought.
      Reason (R): In a mycorrhiza, the fungal partner receives sugars from the plant.
    options:
      - Both A and R are true and R is the correct explanation of A
      - Both A and R are true but R is not the correct explanation of A
      - A is true but R is false
      - A is false but R is true
    answer: 1
    explanation: 'Both statements are in NCERT: A lists a benefit that mycorrhizal plants show, and R describes what the fungus gains. But the sugar supply to the fungus does not account for the plant''s tolerance of salinity and drought, so R is not the explanation.'
  - id: bio-bioclass-022
    topic: bioclass-lichens-mycorrhiza
    subtopic: Terms of lichens and mycorrhiza
    concept: Phycobiont, mycobiont, mycorrhiza and Glomus matched with their meanings
    category: factual
    format: match
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [lichens, mycorrhiza, terms]
    stem: |-
      Match the terms in List I with their descriptions in List II.
      List I
      P. Phycobiont
      Q. Mycobiont
      R. Mycorrhiza
      S. *Glomus*
      List II
      1. Heterotrophic fungal component of a lichen
      2. Autotrophic algal component of a lichen
      3. Symbiotic association of a fungus with the roots of higher plants
      4. A fungal genus many of whose members form mycorrhiza
    options:
      - P-1, Q-2, R-3, S-4
      - P-2, Q-1, R-4, S-3
      - P-1, Q-2, R-4, S-3
      - P-2, Q-1, R-3, S-4
    answer: 3
    explanation: Phycobiont is the autotrophic algal partner and mycobiont the heterotrophic fungal partner of a lichen. Mycorrhiza is the fungus–root association, and Glomus is a genus whose members form mycorrhiza.
  - id: bio-bioclass-023
    topic: bioclass-lichens-mycorrhiza
    subtopic: Symbiotic and free-living microbes
    concept: Mycorrhiza absorbs phosphorus, lichens indicate pollution, Rhizobium is symbiotic, Azotobacter is free-living
    category: application
    format: match
    difficulty: 4
    time: 85
    ncert: true
    battle: false
    tags: [mycorrhiza, lichens, biofertiliser]
    stem: |-
      Match the descriptions in List I with the organisms or associations in List II.
      List I
      P. Absorbs phosphorus from the soil and passes it to the plant
      Q. A very good pollution indicator
      R. Symbiotic nitrogen fixer in the root nodules of leguminous plants
      S. Free-living bacterium that fixes atmospheric nitrogen in the soil
      List II
      1. *Rhizobium*
      2. Lichen
      3. *Azotobacter*
      4. Mycorrhizal fungus (*Glomus*)
    options:
      - P-4, Q-2, R-3, S-1
      - P-4, Q-2, R-1, S-3
      - P-2, Q-4, R-1, S-3
      - P-1, Q-2, R-4, S-3
    answer: 1
    explanation: The mycorrhizal fungus (Glomus) passes phosphorus to the plant, lichens are pollution indicators, Rhizobium is the symbiotic nitrogen fixer of legume nodules, and Azotobacter is a free-living nitrogen fixer. The trap is swapping the symbiotic and the free-living nitrogen fixers.
  - id: bio-bioclass-024
    topic: bioclass-lichens-mycorrhiza
    subtopic: Lichens as pioneers in succession
    concept: On bare rock lichens dissolve rock, weathering forms soil, bryophytes follow, bigger plants succeed them
    category: concept
    format: ordering
    difficulty: 4
    time: 85
    ncert: true
    battle: false
    tags: [lichens, succession, sequence]
    stem: |-
      Arrange the following events of primary succession on a bare rock in the correct sequence.
      P. Bryophytes take hold in the small amount of soil
      Q. Lichens secrete acids that dissolve the rock
      R. Weathering of the rock forms a little soil
      S. Bigger plants replace the bryophytes
    options:
      - Q → R → P → S
      - R → Q → P → S
      - Q → P → R → S
      - Q → R → S → P
    answer: 0
    explanation: 'NCERT sequence: lichens secrete acids that dissolve rock, the weathering helps form a little soil, bryophytes then take hold in it, and bigger plants succeed them in time. Soil must form before bryophytes can grow, and bryophytes come before bigger plants.'
  - id: bio-bioclass-025
    topic: bioclass-lichens-mycorrhiza
    subtopic: 'Mycorrhiza: phosphorus uptake'
    concept: A mycorrhizal fungus such as Glomus associates with roots, absorbs and passes on phosphorus, improving plant growth
    category: application
    format: ordering
    difficulty: 3
    time: 50
    ncert: false
    battle: false
    tags: [mycorrhiza, glomus, sequence]
    stem: |-
      Arrange in a logical sequence how a mycorrhizal fungus such as *Glomus* benefits a crop plant.
      P. Fungal hyphae absorb phosphorus from a large volume of soil
      Q. The fungus forms a symbiotic association with the plant roots
      R. The fungus passes phosphorus to the plant
      S. The plant shows better growth and tolerance to salinity and drought
    options:
      - P → Q → R → S
      - Q → R → P → S
      - Q → P → R → S
      - Q → P → S → R
    answer: 2
    explanation: The association with the roots must form first; the hyphae then absorb phosphorus, and the fungus passes it to the plant. Improved growth and tolerance to salinity and drought appear only after the nutrient has reached the plant.
  - id: bio-bioclass-026
    topic: bioclass-lichens-mycorrhiza
    subtopic: 'Lichens: roles of partners'
    concept: 'Reading a lichen diagram: the alga sends food to the fungus, and the fungus supplies water and minerals'
    category: application
    format: diagram
    difficulty: 4
    time: 85
    ncert: true
    battle: false
    diagram: Schematic of a lichen thallus drawn as a rounded rectangle labelled 'Lichen'. Inside it, on the left, a cluster of small round single cells labelled X. On the right, a mass of interwoven colourless thread-like filaments labelled Y, which also extend downward out of the thallus into a grey rock surface labelled 'Substrate'. Arrow 1 runs from X to Y (unlabelled apart from the number 1). Arrow 2 runs from Y to X (number 2 only). Arrow 3 runs from the substrate upward into Y and is labelled 'water and minerals'. No other labels.
    tags: [lichens, diagram, roles]
    stem: In the figure of a lichen, which option correctly identifies X and Y and states what arrows 1 and 2 carry?
    options:
