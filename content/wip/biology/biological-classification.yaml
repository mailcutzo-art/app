    tags: [five-kingdom, case, trap]
    stem: |-
      A taxonomist records four unknown organisms.
      P: unicellular; no membrane around its DNA; makes food by chemosynthesis.
      Q: unicellular; nuclear membrane present; photosynthetic; no cell wall.
      R: multicellular, loose-tissue body; chitin in its wall; absorbs food from dead matter.
      S: multicellular; organ-system level body; no cell wall; heterotrophic.
      Which option assigns them correctly to Whittaker's kingdoms?
    options:
      - 'P: Monera, Q: Plantae, R: Fungi, S: Animalia'
      - 'P: Protista, Q: Monera, R: Fungi, S: Animalia'
