    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [monograph]
    stem: Which taxonomical aid contains information on any one taxon?
    options:
      - Monograph
      - Flora
      - Manual
      - Herbarium
    answer: 0
    explanation: NCERT states that monographs contain information on any one taxon. A flora deals with the plants of a given area, a manual helps identify the names of species found in an area, and a herbarium stores dried specimens.
