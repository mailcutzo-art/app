    ncert: true
    battle: true
    tags: [museum, insects]
    stem: Insects are preserved in insect boxes after
    options:
      - stuffing and drying
      - collecting, killing and pinning
      - pressing and mounting on sheets
      - dipping in preservative solutions
    answer: 1
    explanation: NCERT says insects are preserved in insect boxes after collecting, killing and pinning. Stuffing is used for larger animals such as birds and mammals, and pressing on sheets is used for plants in a herbarium.
  - id: bio-living-010
    topic: living-taxonomical-aids
    subtopic: Museum
    concept: Larger animals like birds and mammals are usually stuffed and preserved
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [museum, stuffed]
    stem: In biological museums, larger animals such as birds and mammals are usually
    options:
      - pinned in insect boxes
      - pressed and mounted on sheets
      - kept alive under human care
      - stuffed and preserved
    answer: 3
    explanation: Larger animals like birds and mammals are usually stuffed and preserved in museums. Pinning in insect boxes is for insects, pressing on sheets is for herbarium plants and keeping animals alive is the function of a zoological park.
  - id: bio-living-011
    topic: living-taxonomical-aids
    subtopic: Museum
