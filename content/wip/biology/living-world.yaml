    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [botanical-garden]
    stem: Specialised gardens that have collections of living plants for reference are called
    options:
      - Herbaria
      - Museums
      - Zoological parks
      - Botanical gardens
    answer: 3
    explanation: Botanical gardens are specialised gardens with collections of living plants for reference. Herbaria hold dried specimens, museums hold preserved specimens, and zoological parks keep living animals.
  - id: bio-living-003
    topic: living-taxonomical-aids
    subtopic: Zoological parks
    concept: Zoological parks keep wild animals in protected environments under human care
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [zoological-park]
    stem: Which taxonomical aid keeps wild animals in protected environments under human care?
    options:
      - Museum
      - Zoological park
      - Herbarium
      - Botanical garden
    answer: 1
    explanation: Zoological parks (zoos) are places where wild animals are kept in protected environments under human care, which lets us learn about their food habits and behaviour. The other three aids hold plants or preserved specimens.
  - id: bio-living-004
    topic: living-taxonomical-aids
    subtopic: Taxonomic keys
    concept: A key identifies plants and animals using similarities and dissimilarities
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [key]
    stem: The taxonomical aid used for identification of plants and animals based on similarities and dissimilarities is the
    options:
      - Key
      - Monograph
      - Herbarium
      - Museum
    answer: 0
    explanation: A key is the taxonomical aid used to identify plants and animals on the basis of their similarities and dissimilarities. A monograph gives information on one taxon, while a herbarium and a museum are collections of specimens.
  - id: bio-living-005
    topic: living-taxonomical-aids
    subtopic: Flora, manuals and monographs
