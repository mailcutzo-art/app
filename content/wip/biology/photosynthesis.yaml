    answer: 2
    explanation: Calvin's use of radioactive ^{14}C in algae showed that the first CO_2 fixation product was a 3-carbon organic acid, 3-phosphoglyceric acid (PGA). Ribulose bisphosphate is the 5-carbon acceptor, and oxaloacetic acid is the first product in C_4 plants.
