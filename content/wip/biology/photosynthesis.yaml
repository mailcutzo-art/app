      - II and III only
      - I, II and III only
      - I, II and IV only
    answer: 3
    explanation: Statements I, II and IV are NCERT facts; purple and green sulphur bacteria release sulphur or sulphate instead of O_2. Statement III is wrong because in green plants H_2O is the donor and its oxidation product is O_2.
