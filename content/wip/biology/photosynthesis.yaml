    battle: false
    tags: [oxygen-source, isotope, equation]
    stem: Green plants are given normal water and CO_2 whose oxygen is the heavy isotope ^{18}O. Using 6CO_2 + 12H_2O → C_6H_{12}O_6 + 6H_2O + 6O_2, where would the label be found?
    options:
      - Glucose and the water formed, but not the O_2 released
      - The O_2 released only
      - The O_2 released and glucose
      - The O_2 released and the water formed
    answer: 0
    explanation: The O_2 released comes from water, so the twelve oxygen atoms of 6O_2 are unlabelled. All twelve oxygen atoms of the 6CO_2 therefore go into glucose (six) and the six H_2O molecules formed on the right side.
  - id: bio-photo-014
    topic: photo-early-experiments
    subtopic: Overall equation
    concept: Twelve water molecules supply the oxygen of six O2 molecules
    category: concept
    format: direct
    difficulty: 5
    time: 120
    ncert: true
    battle: false
    tags: [equation, water]
    stem: In the equation 6CO_2 + 12H_2O → C_6H_{12}O_6 + 6H_2O + 6O_2, twelve molecules of water appear on the left because
    options:
      - Each CO_2 must be reduced by two molecules of water, which are then released as O_2
      - The six O_2 molecules released contain twelve oxygen atoms, all from water, while six water molecules are formed again
      - Glucose has twelve hydrogen atoms, so twelve water molecules must be split to supply them
      - Six water molecules dissolve the CO_2 and six more are used to make glucose
    answer: 1
    explanation: The O_2 released is from water, and 6O_2 contain twelve oxygen atoms, so twelve H_2O are needed. Six H_2O are formed again on the right side, so the net water used is six molecules. The twelve hydrogen atoms of glucose need only six H_2O.
