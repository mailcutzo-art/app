    tags: [van-niel, oxygen-source]
    stem: From his work on purple and green sulphur bacteria, van Niel inferred that the O_2 evolved by green plants comes from
    options:
      - CO_2
      - Glucose
      - Starch
      - H_2O
    answer: 3
    explanation: Sulphur bacteria use H_2S as the hydrogen donor and release sulphur, not O_2. By analogy, in green plants H_2O is the hydrogen donor and is oxidised to O_2, so the O_2 comes from H_2O and not from CO_2.
