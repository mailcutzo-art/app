      - Racemose
      - Cymose
      - Solitary and axillary only
      - Always a single terminal flower
    answer: 0
    explanation: In its floral characters NCERT gives the inflorescence of Fabaceae as racemose. Cymose and solitary forms are mentioned for Solanaceae and Liliaceae, and Fabaceae is not described as bearing only a single flower.
  - id: bio-morph-008
    topic: morph-inflorescence
    subtopic: Racemose inflorescence
    concept: Racemose flowers are borne laterally in acropetal succession
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [racemose, acropetal]
    stem: In a racemose inflorescence, the flowers are borne
    options:
      - Laterally in a basipetal order
      - Laterally in an acropetal succession
      - Terminally in an acropetal succession
      - Terminally in a basipetal order
    answer: 1
    explanation: NCERT states that in a racemose inflorescence the main axis continues to grow and the flowers are borne laterally in an acropetal succession, the older ones towards the base and the younger towards the apex. A basipetal order belongs to the cymose type.
  - id: bio-morph-009
    topic: morph-inflorescence
    subtopic: Cymose inflorescence
    concept: In a cymose inflorescence the terminal flower is the oldest
    category: concept
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [cymose, basipetal, oldest-flower]
    stem: In a cymose inflorescence, the oldest flower is
    options:
      - Located at the base of the axis
      - Located in the middle of the axis
      - The terminal flower at the apex of the main axis
      - Borne on the lowest lateral branch
    answer: 2
    explanation: In a cymose inflorescence the main axis terminates in a flower and the flowers are borne in a basipetal order. So the terminal flower is the first to form and the oldest, and the younger flowers arise below it.
  - id: bio-morph-010
    topic: morph-inflorescence
    subtopic: Shoot tip transformed into a flower
    concept: A flower formed when a shoot tip transforms is always solitary
    category: factual
    format: direct
