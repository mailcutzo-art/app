questions:
  - id: bio-morph-001
    topic: morph-inflorescence
    subtopic: Definition of inflorescence
    concept: Inflorescence is the arrangement of flowers on the floral axis
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [inflorescence, definition]
    stem: The arrangement of flowers on the floral axis is termed
    options:
      - Phyllotaxy
      - Aestivation
      - Inflorescence
      - Placentation
    answer: 2
    explanation: NCERT defines inflorescence as the arrangement of flowers on the floral axis. Phyllotaxy is the arrangement of leaves on a stem, aestivation is the arrangement of sepals or petals in the floral bud, and placentation is the arrangement of ovules within the ovary.
  - id: bio-morph-002
    topic: morph-inflorescence
    subtopic: Types of inflorescence
    concept: The two major types of inflorescence are racemose and cymose
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [racemose, cymose]
    stem: The two major types of inflorescence are
    options:
      - Racemose and cymose
      - Solitary and clustered
      - Acropetal and basipetal
      - Axillary and terminal
    answer: 0
    explanation: Depending on whether the apex of the floral axis gets converted into a flower or continues to grow, NCERT defines two major types, racemose and cymose. Acropetal and basipetal describe the order in which flowers are borne, not the types themselves.
  - id: bio-morph-003
    topic: morph-inflorescence
    subtopic: Racemose inflorescence
    concept: In a racemose inflorescence the main axis continues to grow
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [racemose, main-axis]
    stem: In a racemose inflorescence, the main axis
    options:
      - Terminates in a flower
      - Is limited in growth
      - Bears flowers in a basipetal order
      - Continues to grow
    answer: 3
    explanation: In a racemose inflorescence the main axis continues to grow and bears flowers laterally. Termination in a flower, limited growth and a basipetal order of flowers are all features of the cymose type.
  - id: bio-morph-004
    topic: morph-inflorescence
    subtopic: Racemose and cymose compared
    concept: Pairing each inflorescence type with its correct feature
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [racemose, cymose, basipetal]
    stem: Which pairing of an inflorescence type with its feature is correct?
    options:
      - Racemose - flowers borne in a basipetal order
      - Cymose - flowers borne in a basipetal order
      - Cymose - main axis continues to grow
      - Racemose - main axis terminates in a flower
    answer: 1
    explanation: In a cymose inflorescence the main axis terminates in a flower and the flowers are borne in a basipetal order. A racemose inflorescence has a continuously growing main axis with flowers in acropetal succession, so the other three pairings are reversed.
  - id: bio-morph-005
    topic: morph-inflorescence
    subtopic: Basis of classification
    concept: Inflorescences are classified by whether the apex becomes a flower or continues to grow
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [classification, apex]
    stem: Racemose and cymose inflorescences are distinguished on the basis of whether the apex of the main axis
    options:
      - Bears bisexual or unisexual flowers
      - Bears flowers singly or in clusters
      - Is converted into a flower or continues to grow
      - Bears bracteate or ebracteate flowers
    answer: 2
    explanation: NCERT bases the two types on what happens to the apex of the axis. If it is converted into a flower the inflorescence is cymose, and if it continues to grow the inflorescence is racemose. Sex, number and bracts of the flowers are not the basis.
  - id: bio-morph-006
    topic: morph-inflorescence
    subtopic: Flower as a modified shoot
    concept: The shoot apical meristem changes to floral meristem when a flower forms
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [modified-shoot, meristem]
    stem: In the formation of a flower from a shoot, the shoot apical meristem changes into
    options:
      - Intercalary meristem
      - Lateral meristem
      - A leaf primordium
      - Floral meristem
    answer: 3
    explanation: NCERT describes a flower as a modified shoot in which the shoot apical meristem changes to floral meristem. It does not become intercalary or lateral meristem, and it no longer produces leaf primordia.
  - id: bio-morph-007
    topic: morph-inflorescence
    subtopic: Inflorescence in Fabaceae
    concept: The family Fabaceae has a racemose inflorescence
    category: factual
    format: direct
