      - Solitary
      - A part of a racemose inflorescence
      - One of a series borne in an acropetal order
    answer: 1
    explanation: NCERT states that when a shoot tip transforms into a flower, it is always solitary, because the apex itself becomes the flower. It is not described as axillary or as one of a series of flowers.
  - id: bio-morph-011
    topic: morph-inflorescence
    subtopic: Flower as a modified shoot
    concept: Internodes do not elongate when a shoot apex becomes a flower, so the axis is condensed
    category: concept
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [modified-shoot, internode]
    stem: As a shoot apex transforms into a flower, its internodes
    options:
      - Elongate so that the axis becomes slender
      - Elongate only between the calyx and the corolla
      - Become converted into leaves
      - Do not elongate, so the axis gets condensed
    answer: 3
    explanation: In the modified shoot that forms a flower the internodes do not elongate, so the axis gets condensed. The floral appendages are therefore borne close together at successive nodes instead of leaves.
