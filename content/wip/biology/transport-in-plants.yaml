    stem: A well-watered potted herb is kept overnight in a closed chamber saturated with water vapour. Next morning, droplets of liquid water hang only from its leaf tips while the rest of the leaf surface is dry. This is best explained by
    options:
      - guttation, as transpiration pull is at its maximum in saturated air
