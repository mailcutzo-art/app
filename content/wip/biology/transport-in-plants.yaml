    diagram: 'Three identical rectangular chambers I, II and III, each divided by a vertical semi-permeable membrane into a left compartment holding pure water and a right compartment holding 0.5 M sucrose solution. The right compartment of each chamber has a sliding piston on top. Chamber I: the piston is free and no extra pressure is applied. Chamber II: the piston is pushed down by an arrow labelled ''P equal to the osmotic pressure of the sucrose solution''. Chamber III: the piston is pushed down by a longer arrow labelled ''P greater than the osmotic pressure of the sucrose solution''.'
