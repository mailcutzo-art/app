  - id: bio-transport-147
    topic: transport-long-distance-water
    subtopic: Root pressure and energy
    concept: Active ion uptake needs energy to generate root pressure
    category: application
    format: case
    difficulty: 4
    time: 85
    ncert: false
    battle: false
    tags: [case, root-pressure]
    stem: Sap oozes from the cut stump of a small herb on a humid morning. After its roots are treated with a poison that stops ATP production, oozing falls sharply although the soil stays moist. The best explanation is that
    options:
      - water enters roots only by imbibition, which needs ATP supplied by the root cells
      - the poison breaks the cohesion between the water molecules of the xylem sap
      - transpiration pull depends on ATP supplied by the cells of the roots to the leaves
      - root pressure depends on active transport of ions into the xylem, which needs metabolic energy
    answer: 3
    explanation: Root pressure arises because ions are actively transported into the vascular tissue of the root and water follows. Active transport needs ATP, so blocking ATP production reduces the positive pressure and the oozing. Cohesion is a physical property of water.
  - id: bio-transport-148
    topic: transport-long-distance-water
    subtopic: Transpiration pull
    concept: Removal of leaves removes the driving force of ascent
    category: application
    format: case
    difficulty: 3
    time: 50
    ncert: false
    battle: false
    tags: [case, transpiration-pull]
    stem: In summer, all the leaves of a tall tree are removed. The upward movement of water in the tree would
    options:
      - remain the same, because root pressure supplies most of the water
      - decline sharply, as transpiration from the leaves, the main driving force, is lost
      - reverse its direction, because the phloem now carries water downwards
      - increase, because less water is lost from the plant as vapour through the leaves
    answer: 1
    explanation: Most plants meet their water needs by transpiration pull, driven by evaporation from the leaves. Root pressure is only a modest push and plays no major role in tall trees, so removing the leaves slows the ascent of sap greatly.
