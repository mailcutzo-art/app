    diagram: 'Transverse section of a root that was held in water containing a dye that cannot enter living cells and moves only along cell walls. Layers from outside to inside: epidermis P with root hairs, cortex Q, endodermis R with a dark band in its walls, pericycle S and xylem T. The cell walls of P and Q are coloured by the dye, the colour stops at R, and the walls of S and the cells of T show no dye.'
