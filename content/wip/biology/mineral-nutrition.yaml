  - id: bio-mineral-022
    topic: mineral-amino-acid-synthesis
    subtopic: Amino acid synthesis overview
    concept: Compare what reductive amination and transamination have in common and where they differ
    category: application
    format: multi-statement
    difficulty: 5
    time: 120
    ncert: true
    battle: false
    tags: [reductive-amination, transamination, comparison]
    stem: |-
      Consider the following statements comparing the two main ways of making amino acids.
      I. In both reactions a keto acid is converted into an amino acid.
      II. In both reactions free NH_4^+ is the source of the new amino group.
      III. In both reactions an amino acid is converted into a keto acid.
      IV. Reductive amination can run when no other amino acid is present, but transamination cannot.
      Which statements are correct?
    options:
      - I and II only
      - II and III only
      - I and IV only
      - III and IV only
    answer: 2
    explanation: In reductive amination α-ketoglutaric acid becomes glutamic acid, and in transamination the acceptor keto acid becomes an amino acid, so I is true. Only reductive amination uses free NH_4^+ and only transamination converts a donor amino acid into a keto acid, so II and III are false. Transamination needs a donor amino acid, so IV is true.
  - id: bio-mineral-023
    topic: mineral-amino-acid-synthesis
    subtopic: Transamination
    concept: Transamination cannot convert free NH_4^+ into organic nitrogen
    category: concept
