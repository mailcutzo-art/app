      - Both Statement I and Statement II are incorrect
      - Statement I is correct but Statement II is incorrect
      - Statement I is incorrect but Statement II is correct
    answer: 3
    explanation: Transamination moves an amino group that is already on an amino acid, so Statement I is wrong. Reductive amination of α-ketoglutaric acid with NH_4^+ gives glutamic acid, so Statement II is correct.
