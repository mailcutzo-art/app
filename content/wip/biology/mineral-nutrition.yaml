      - Molecular nitrogen
      - Free ammonia
    answer: 0
    explanation: NCERT says that along with the transpiration stream the nodules of some plants, for example soyabean, export the fixed nitrogen as ureides. Free ammonia is toxic, and N_2 is the substrate, not the export form.
  - id: bio-mineral-008
    topic: mineral-amino-acid-synthesis
    subtopic: Amides
    concept: An amide forms when the hydroxyl part of the acid group is replaced by an NH_2 group
    category: concept
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [amides, asparagine, amidation]
    stem: Asparagine is formed from aspartic acid when
    options:
      - its amino group is removed and replaced by a keto group
      - a methyl group is added to its R group
      - a third carboxyl group is added to the molecule
      - the hydroxyl part of its acid group is replaced by an NH_2 group
    answer: 3
    explanation: NCERT states that asparagine arises from aspartic acid by addition of another amino group, the hydroxyl part of the acid being replaced by NH_2. Removing the amino group would give a keto acid, not an amide.
  - id: bio-mineral-009
    topic: mineral-amino-acid-synthesis
    subtopic: Amides
    concept: Amides carry more nitrogen than amino acids and are therefore suited to long-distance transport
    category: concept
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [amides, nitrogen-transport]
    stem: Amides are suited to carrying nitrogen to other parts of a plant because they
    options:
      - are formed by removing the amino group from amino acids
      - contain more nitrogen than the amino acids
      - are less soluble than the amino acids
      - can enter the xylem only after being converted into nitrate
    answer: 1
    explanation: NCERT says that since amides contain more nitrogen than the amino acids, they are transported to other parts of the plant. Amides are made by adding an amino group, not by removing one, and they travel in xylem as such.
  - id: bio-mineral-010
    topic: mineral-amino-acid-synthesis
