  - id: bio-mineral-019
    topic: mineral-amino-acid-synthesis
    subtopic: Amino acid synthesis overview
    concept: Combine facts on reductive amination, transamination and transaminase
    category: concept
    format: multi-statement
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [reductive-amination, transamination]
    stem: |-
      Consider the following statements about the synthesis of amino acids in plants.
      I. In reductive amination, NH_4^+ reacts with α-ketoglutaric acid and NAD(P)H to form glutamic acid.
      II. Transamination transfers an amino group from an amino acid to the keto group of a keto acid.
      III. Transaminase is the enzyme that adds free NH_4^+ to α-ketoglutaric acid.
      IV. Glutamic acid is the main amino acid donating NH_2 in transamination.
      Which statements are correct?
    options:
      - I, II and III only
      - I, II and IV only
      - II, III and IV only
      - I, III and IV only
    answer: 1
    explanation: Statements I, II and IV are NCERT statements. Statement III is wrong, because adding NH_4^+ to α-ketoglutaric acid is reductive amination (shown with a dehydrogenase), whereas transaminase only moves amino groups between molecules.
  - id: bio-mineral-020
    topic: mineral-amino-acid-synthesis
    subtopic: Fate of ammonia
    concept: Ammonium is assimilated but is toxic and cannot accumulate
    category: concept
    format: multi-statement
    difficulty: 4
    time: 85
    ncert: true
    battle: false
    tags: [ammonium, toxicity]
    stem: |-
      Consider the following statements about ammonia and ammonium in plants.
      I. At physiological pH, ammonia is protonated to NH_4^+.
      II. Most plants can assimilate nitrate as well as ammonium ions.
      III. Ammonium ions are harmless, so they can safely accumulate in plant tissues.
      IV. Ammonium is used in the synthesis of amino acids.
      Which statements are correct?
    options:
      - I, II and III only
      - I, III and IV only
      - II, III and IV only
      - I, II and IV only
    answer: 3
    explanation: Statements I, II and IV agree with NCERT. Statement III is wrong, because NCERT calls ammonium quite toxic to plants, so it cannot accumulate and must be converted into amino acids.
  - id: bio-mineral-021
    topic: mineral-amino-acid-synthesis
