    diagram: 'Four pots of seedlings of the same species and age grown in nutrient solutions, numbered 1 to 4 from left to right. Pot 1: complete nutrient solution; the plant is tall and green. Pot 2: solution lacking element X; the plant is short and its older leaves are yellow. Pot 3: lacking X for the first three weeks, then X was added; after six weeks the plant looks green and healthy like pot 1. Pot 4: lacking X throughout for a long period; the plant is brown, wilted and dead.'
    tags: [diagram, resupply]
    stem: Which conclusion about the deficiency of element X is supported by all four pots?
