    stem: A colleague claims that a K-deficient plant and an N-deficient plant would look identical because both show chlorosis in older leaves. Which observation would let you tell them apart according to NCERT?
    options:
      - Cell division is inhibited only with nitrogen deficiency and never with potassium deficiency
