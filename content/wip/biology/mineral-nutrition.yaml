    ncert: false
    battle: false
    tags: [manganese, mobility, induced-deficiency]
    stem: In a hydroponic tomato culture the Mn level is raised well above the optimum. Soon the oldest leaves turn yellow while the shoot apex stops growing. Which pair of induced deficiencies best explains the two observations?
    options:
      - Calcium in the oldest leaves and magnesium in the shoot apex
      - Magnesium in both the oldest leaves and the shoot apex
      - Calcium in both the oldest leaves and the shoot apex
      - Magnesium in the oldest leaves and calcium in the shoot apex
    answer: 3
    explanation: Excess Mn can induce Mg and Ca deficiency. Magnesium is actively mobilised to young tissues, so its deficiency (chlorosis) shows first in senescent leaves. Calcium is a structural component of the cell and is not easily released, and Mn inhibits its translocation in the shoot apex, so its deficiency shows in the young, dividing tissue there.
