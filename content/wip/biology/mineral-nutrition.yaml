questions:
  - id: bio-mineral-001
    topic: mineral-amino-acid-synthesis
    subtopic: Reductive amination
    concept: Reductive amination of alpha-ketoglutaric acid with NH_4^+ forms glutamic acid
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [reductive-amination, ketoglutaric-acid]
    stem: In reductive amination, ammonium ions react with which keto acid to form glutamic acid?
    options:
      - Oxaloacetic acid
      - α-Ketoglutaric acid
      - Pyruvic acid
      - Citric acid
    answer: 1
    explanation: NCERT states that in reductive amination ammonia reacts with α-ketoglutaric acid (with NAD(P)H) and forms glutamic acid. Oxaloacetic, pyruvic and citric acids are not the keto acid in this reaction.
  - id: bio-mineral-002
    topic: mineral-amino-acid-synthesis
    subtopic: Transamination
    concept: Transaminase catalyses all transamination reactions
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [transamination, transaminase]
    stem: The enzyme that catalyses transamination reactions in plants is
    options:
      - Nitrogenase
      - Glutamate dehydrogenase
      - Transaminase
      - Catalase
    answer: 2
    explanation: NCERT says the enzyme transaminase catalyses all transamination reactions. Nitrogenase reduces N_2 to NH_3 and glutamate dehydrogenase is the enzyme shown for reductive amination.
  - id: bio-mineral-003
    topic: mineral-amino-acid-synthesis
    subtopic: Transamination
    concept: Glutamic acid is the main amino acid donating NH_2 in transamination
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [transamination, glutamic-acid]
    stem: Which amino acid is the main donor of the amino group (NH_2) in transamination?
    options:
      - Aspartic acid
      - Glutamine
      - Asparagine
      - Glutamic acid
    answer: 3
    explanation: NCERT states that glutamic acid is the main amino acid from which the amino group is transferred, and other amino acids are formed through transamination. Glutamine and asparagine are amides, not the main donors.
  - id: bio-mineral-004
    topic: mineral-amino-acid-synthesis
    subtopic: Reductive amination
    concept: NAD(P)H supplies the reducing power in reductive amination
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [reductive-amination, nadph]
    stem: In the reductive amination of α-ketoglutaric acid, the reducing power is supplied by
    options:
      - NAD(P)H
      - ATP
      - Leghaemoglobin
      - Transaminase
    answer: 0
    explanation: The NCERT equation is α-ketoglutaric acid + NH_4^+ + NAD(P)H → glutamate + H_2O + NAD(P)^+. NAD(P)H is oxidised as it supplies the hydrogen, while leghaemoglobin is only the oxygen scavenger of nodules and transaminase belongs to the other route.
  - id: bio-mineral-005
    topic: mineral-amino-acid-synthesis
    subtopic: Amides
    concept: Asparagine and glutamine are the two most important amides of plants
    category: factual
