    tags: [amides, nitrogen-content]
    stem: 100 molecules each of aspartic acid and glutamic acid are fully amidated. The total number of N atoms in them increases by
    options:
      - '100'
      - '200'
      - '400'
      - '0'
    answer: 1
    explanation: Each amino acid has one N atom, and amide formation adds another amino group to each molecule. So 200 molecules go from 200 N atoms to 400, an increase of 200.
  - id: bio-mineral-014
    topic: mineral-amino-acid-synthesis
