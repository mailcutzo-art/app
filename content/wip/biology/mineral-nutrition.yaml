    options:
      - xylem vessels, along with the transpiration stream
      - phloem sieve tubes, against the transpiration stream
      - companion cells alone, without any conducting tube
      - cortical parenchyma only, by diffusion
    answer: 0
    explanation: NCERT says amides are transported via xylem vessels and that soyabean nodules export ureides along with the transpiration stream, which is the xylem stream. Neither is described as moving through phloem.
  - id: bio-mineral-011
    topic: mineral-amino-acid-synthesis
    subtopic: Reductive amination
    concept: Reductive amination is the route that takes free NH_4^+ directly into an amino acid
    category: concept
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [reductive-amination, ammonium]
    stem: Which process directly incorporates free NH_4^+ into an organic molecule to give an amino acid?
    options:
      - Transamination
      - Nitrification
      - Reductive amination
      - Denitrification
    answer: 2
    explanation: In reductive amination NH_4^+ reacts with α-ketoglutaric acid to give glutamic acid. Transamination only moves an amino group already present on an amino acid, and nitrification and denitrification are soil bacterial steps of the nitrogen cycle.
  - id: bio-mineral-012
    topic: mineral-amino-acid-synthesis
    subtopic: Transamination
    concept: A donor amino acid becomes a keto acid when it gives away its amino group
    category: concept
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [transamination, glutamic-acid]
    stem: When glutamic acid donates its amino group to a keto acid in transamination, glutamic acid itself is converted into
    options:
      - oxaloacetic acid
      - aspartic acid
      - glutamine
      - α-ketoglutaric acid
    answer: 3
    explanation: Transamination moves the amino group from an amino acid to the keto group of a keto acid, so the donor becomes a keto acid. Glutamic acid losing its amino group gives α-ketoglutaric acid, the reverse of the product of reductive amination.
  - id: bio-mineral-013
    topic: mineral-amino-acid-synthesis
    subtopic: Amides
    concept: Each amidation adds one more nitrogen atom to the amino acid
    category: numerical
    format: direct
    difficulty: 3
    time: 50
