  - id: bio-mineral-363
    topic: mineral-deficiency-symptoms
    subtopic: Diagnosis by exclusion
    concept: 'High-manganese leaf: toxicity may look like Fe, Mg and Ca deficiency'
    category: application
    format: diagram
    difficulty: 5
    time: 120
    ncert: true
    battle: false
    diagram: 'A single broad leaf drawn from above, showing the midrib and the lateral veins clearly. The veins are pale yellow (chlorotic). Many small brown spots are scattered over the blade, each lying next to a yellow vein. A caption below the leaf reads: leaf from a nutrient culture containing a very high concentration of manganese.'
    tags: [diagram, manganese]
    stem: Which statement about this leaf is most consistent with NCERT?
    options:
      - It shows manganese deficiency, because brown spots surrounded by chlorotic veins are the prominent symptom of Mn deficiency
      - It shows calcium toxicity, because excess Mn promotes translocation of Ca to the shoot apex where it accumulates
      - It shows nitrogen deficiency, because chlorotic veins and necrotic spots are the symptoms NCERT lists for nitrogen
      - It shows manganese toxicity, whose symptoms may really be deficiency symptoms of Fe, Mg and Ca induced by excess Mn
    answer: 3
    explanation: Brown spots surrounded by chlorotic veins are the prominent symptom of Mn toxicity. Excess Mn competes with Fe and Mg for uptake and inhibits Ca translocation in the shoot apex, so these symptoms may really be the deficiency symptoms of Fe, Mg and Ca.
  - id: bio-mineral-364
    topic: mineral-deficiency-symptoms
    subtopic: Critical concentration
    concept: Growth versus tissue concentration of a micronutrient
    category: application
    format: graph
    difficulty: 4
    time: 85
    ncert: true
    battle: false
    diagram: 'Line graph. The x-axis is labelled Concentration of a micronutrient in the tissue (arbitrary units, 0 to 10) and the y-axis is labelled Plant growth as dry weight (arbitrary units, 0 to 100). The curve rises steeply from the origin to a maximum of 100 at x = 4, stays flat as a plateau from x = 4 to x = 6, and then falls steadily to about 40 at x = 10. A vertical dashed line at x = 4 is labelled C. Three zones are marked on the x-axis: zone I from 0 to 4, zone II from 4 to 6 and zone III from 6 to 10.'
    tags: [graph, critical-concentration]
    stem: Which interpretation of the graph agrees with NCERT?
    options:
      - Growth is retarded only at concentrations higher than C, because C is the toxic level
      - Below C the plants are deficient and growth is retarded; a moderate rise beyond the plateau causes toxicity
      - C is the concentration above which the element becomes essential for the survival of the plant
      - Growth keeps increasing at every concentration of the micronutrient, so no toxicity occurs
    answer: 1
    explanation: NCERT defines the critical concentration as the level below which growth is retarded, so the element is deficient below C. For a micronutrient there is a narrow beneficial range, and a moderate increase above it reduces growth, which is toxicity.
