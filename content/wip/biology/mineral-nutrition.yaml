    answer: 0
    explanation: NCERT defines transamination as the transfer of an amino group from one amino acid to the keto group of a keto acid. The carboxyl group of the keto acid stays unchanged.
  - id: bio-mineral-016
    topic: mineral-amino-acid-synthesis
    subtopic: Reductive amination
    concept: Identify the correct statement about reductive amination
    category: concept
    format: statements
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [reductive-amination, statements]
    stem: Which one of the following statements about reductive amination is correct?
    options:
      - Glutamic acid reacts with NH_4^+ and NAD(P)H to form α-ketoglutaric acid.
      - An amino group is passed from one amino acid to a keto acid by transaminase.
      - NH_4^+ reacts with glutamic acid to form the amide asparagine.
      - NH_4^+, α-ketoglutaric acid and NAD(P)H react to give glutamic acid, water and NAD(P)^+.
    answer: 3
    explanation: Reductive amination is α-ketoglutaric acid + NH_4^+ + NAD(P)H → glutamate + H_2O + NAD(P)^+. The first option reverses it, the second describes transamination, and asparagine comes from aspartic acid, not glutamic acid.
  - id: bio-mineral-017
