    tags: [amides, asparagine, glutamine]
    stem: The two most important amides found in plants are
    options:
      - Aspartic acid and glutamic acid
      - Cysteine and methionine
      - Asparagine and glutamine
      - Alanine and glycine
    answer: 2
    explanation: NCERT names asparagine and glutamine as the two most important amides in plants. Aspartic and glutamic acids are the amino acids from which they are formed, and cysteine and methionine are the sulphur-containing amino acids.
  - id: bio-mineral-006
    topic: mineral-amino-acid-synthesis
    subtopic: Fate of ammonia
    concept: At physiological pH ammonia is protonated to the ammonium ion
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [ammonium, physiological-ph]
    stem: At physiological pH, the ammonia produced in a plant cell is protonated to form
    options:
      - NO_2^-
      - NH_4^+
      - NO_3^-
      - N_2
    answer: 1
    explanation: NCERT states that at physiological pH ammonia is protonated to NH_4^+ (ammonium ion). Nitrite and nitrate are oxidised forms made by nitrifying bacteria, and N_2 is the gas that nitrogenase reduces.
  - id: bio-mineral-007
    topic: mineral-amino-acid-synthesis
