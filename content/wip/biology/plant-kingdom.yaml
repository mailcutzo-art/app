    category: numerical
    format: case
    difficulty: 5
    time: 120
    ncert: false
    battle: false
    tags: [case, archegonium, numerical]
    stem: A moss shoot bears 8 archegonia. With a water film present, antherozoids fertilise the egg in 6 of them. Each zygote becomes a sporophyte whose capsule has 20 spore mother cells, all of which undergo meiosis. How many spores are formed on this shoot?
    options:
      - '640'
      - '480'
      - '240'
      - '120'
    answer: 1
    explanation: Each archegonium has one egg, so 6 fertilised eggs give 6 zygotes and 6 sporophytes. Each spore mother cell gives 4 spores, so spores = 6 × 20 × 4 = 480. The value 640 wrongly uses all 8 archegonia.
