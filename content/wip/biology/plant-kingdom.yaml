questions:
  - id: bio-plantk-001
    topic: plantk-angiosperms
    subtopic: Seed enclosed in fruit
    concept: Angiosperm seeds are enclosed within fruits, unlike the naked seeds of gymnosperms
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [seed, fruit]
    stem: In angiosperms, the seeds are enclosed within the
    options:
      - Megasporophyll
      - Fruit
      - Archegonium
      - Sorus
    answer: 1
    explanation: In angiosperms the ovules lie inside the ovary, and after fertilisation the ovary becomes the fruit that encloses the seeds. Gymnosperm seeds are naked; a sorus holds fern sporangia and an archegonium holds the egg.
  - id: bio-plantk-002
    topic: plantk-angiosperms
    subtopic: Size range
    concept: Angiosperms range in size from Wolffia to tall Eucalyptus trees
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [size-range, wolffia]
    stem: Which genus is cited as the smallest of the angiosperms?
    options:
      - '*Wolffia*'
      - '*Eucalyptus*'
      - '*Azolla*'
      - '*Sequoia*'
    answer: 0
    explanation: NCERT gives the size range of angiosperms as the smallest *Wolffia* to tall *Eucalyptus* trees over 100 metres. *Azolla* is a water fern and *Sequoia* is a gymnosperm, so neither is a flowering plant.
  - id: bio-plantk-003
    topic: plantk-angiosperms
    subtopic: Double fertilisation
    concept: Double fertilisation is an event unique to flowering plants
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [double-fertilisation]
    stem: Double fertilisation is an event unique to
    options:
      - Gymnosperms
      - Pteridophytes
      - Flowering plants
      - Bryophytes
    answer: 2
    explanation: Two fusions, syngamy and triple fusion, take place in the embryo sac, and NCERT calls this double fertilisation an event unique to flowering plants. Gymnosperms, pteridophytes and bryophytes do not show it.
  - id: bio-plantk-004
    topic: plantk-angiosperms
    subtopic: Monocots and dicots
    concept: Monocot seeds have a single cotyledon, dicot seeds have two
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [monocot, cotyledon]
    stem: Seeds of monocotyledons have
    options:
      - Two cotyledons
      - Three cotyledons
      - No cotyledon
      - One cotyledon
    answer: 3
    explanation: Dicotyledons are characterised by two cotyledons in their seeds, while monocotyledons have only one. Three cotyledons or none is not a feature of either class.
  - id: bio-plantk-005
    topic: plantk-angiosperms
    subtopic: Embryo sac
    concept: The embryo sac is the highly reduced female gametophyte of an angiosperm
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [embryo-sac, gametophyte]
    stem: The embryo sac of an angiosperm is
    options:
      - A highly reduced female gametophyte
      - A multicellular male gametophyte
      - The diploid megasporangium
      - A structure that bears archegonia
    answer: 0
    explanation: Ovules of angiosperms contain highly reduced female gametophytes called embryo sacs. Embryo-sac formation is preceded by meiosis, so it is a haploid gametophyte, not a sporophytic or male structure.
  - id: bio-plantk-006
    topic: plantk-angiosperms
    subtopic: Embryo sac
    concept: The two polar nuclei fuse to form a diploid secondary nucleus
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [polar-nuclei, secondary-nucleus]
    stem: The two polar nuclei of the embryo sac eventually fuse to produce
    options:
      - A haploid egg nucleus
      - A diploid secondary nucleus
      - A triploid primary endosperm nucleus
      - A diploid zygote
    answer: 1
    explanation: The two polar nuclei of the central cell fuse to give a diploid secondary nucleus. It becomes the triploid primary endosperm nucleus only after fusing with a male gamete.
  - id: bio-plantk-007
    topic: plantk-angiosperms
    subtopic: Monocot root system
    concept: In monocots the primary root is short-lived and is replaced by fibrous roots from the stem base
    category: concept
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [monocot, fibrous-root]
    stem: In a monocot such as wheat, the short-lived primary root is replaced by
    options:
      - A single tap root formed from the radicle
      - Prop roots hanging from the branches
      - Fibrous roots arising from the base of the stem
      - Pneumatophores growing upwards from the soil
    answer: 2
    explanation: In monocots the primary root is short-lived and is replaced by many roots from the base of the stem, forming a fibrous root system. A single tap root from the radicle is typical of dicots; prop roots and pneumatophores are modified roots, not the replacement of the primary root.
  - id: bio-plantk-008
    topic: plantk-angiosperms
    subtopic: Embryo sac
    concept: The egg apparatus is the egg cell with two synergids
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [egg-apparatus, synergids]
    stem: In the embryo sac, the egg cell forms a three-celled egg apparatus together with two
    options:
      - Antipodal cells
      - Polar nuclei
      - Megaspores
      - Synergids
    answer: 3
    explanation: The egg apparatus is a three-celled group made of one egg cell and two synergids. The antipodals are the three cells at the opposite end, and the polar nuclei lie in the central cell.
  - id: bio-plantk-009
    topic: plantk-angiosperms
    subtopic: Defining features
    concept: Pollen grains and ovules of angiosperms develop in flowers; ovules are enclosed in an ovary
    category: concept
    format: statements
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [flower, ovule]
    stem: Which one of the following statements about angiosperms is correct?
    options:
      - Their pollen grains and ovules develop in specialised structures called flowers
      - Their ovules are naked and borne on the surface of megasporophylls
      - Their seeds are not enclosed by any fruit
      - All of them are small herbs and none grows into a tall tree
    answer: 0
    explanation: In angiosperms, pollen grains and ovules develop in specialised structures called flowers, and the ovules are enclosed in the ovary. Naked ovules are a gymnosperm feature, angiosperm seeds are enclosed in fruits, and the group includes tall trees such as *Eucalyptus*.
  - id: bio-plantk-010
    topic: plantk-angiosperms
    subtopic: Seed and fruit
    concept: After fertilisation the ovule becomes the seed and the ovary becomes the fruit
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [seed, fruit, ovary]
    stem: After fertilisation, the ovules and the ovary of an angiosperm flower develop respectively into
    options:
      - Fruit and seeds
      - Seeds and fruit
      - Embryo and endosperm
      - Endosperm and embryo
    answer: 1
    explanation: After fertilisation the ovules develop into seeds and the ovary develops into the fruit. The embryo and the endosperm are products of the zygote and the primary endosperm nucleus inside the seed, not of the ovule and ovary.
  - id: bio-plantk-011
    topic: plantk-angiosperms
    subtopic: Monocots and dicots
    concept: Parallel venation distinguishes monocot leaves from dicot leaves
    category: concept
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [monocot, venation, dicot]
    stem: Which of the following is a feature of monocots but NOT of dicots?
    options:
      - Two cotyledons in the seed
      - Tetramerous or pentamerous flowers
      - Parallel venation in leaves
      - A tap root developed from the radicle
    answer: 2
    explanation: Monocot leaves show parallel venation, whereas dicot leaves show reticulate venation. Two cotyledons, tetramerous or pentamerous flowers and a tap root developed from the radicle are all dicot features.
  - id: bio-plantk-012
    topic: plantk-angiosperms
    subtopic: Double fertilisation
    concept: Synergids and antipodals degenerate after fertilisation
    category: factual
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [synergids, antipodals, double-fertilisation]
    stem: Which cells of the embryo sac degenerate after double fertilisation?
    options:
      - Synergids and antipodals
      - Egg cell and synergids
      - Antipodals and the central cell
      - Synergids and the zygote
    answer: 0
    explanation: After double fertilisation the synergids and antipodals degenerate, while the egg becomes the zygote and the central cell gives the endosperm. So the egg cell and the central cell cannot be the cells that degenerate.
  - id: bio-plantk-013
    topic: plantk-angiosperms
    subtopic: Double fertilisation
    concept: The primary endosperm nucleus forms from a male gamete and the diploid secondary nucleus
    category: concept
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [pen, triple-fusion]
    stem: The triploid primary endosperm nucleus is formed by the fusion of
    options:
      - Two male gametes with one polar nucleus
      - One male gamete with the egg cell and a synergid
      - Two male gametes with the egg cell
      - One male gamete with the diploid secondary nucleus
    answer: 3
    explanation: The second male gamete fuses with the diploid secondary nucleus (formed from the two polar nuclei), so three haploid sets combine to give the triploid primary endosperm nucleus. The other fusion, of a male gamete with the egg, gives the diploid zygote.
  - id: bio-plantk-014
    topic: plantk-angiosperms
    subtopic: Life cycle
    concept: 'Angiosperms are diplontic: the sporophyte is dominant and the gametophyte is reduced'
    category: concept
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [life-cycle, diplontic]
    stem: In the life cycle of an angiosperm, which phase is dominant and independent?
    options:
      - The haploid gametophyte, with a reduced sporophyte
      - The diploid sporophyte, with a highly reduced gametophyte
      - The haploid gametophyte, which nourishes a dependent sporophyte
      - Both phases are equally dominant and free-living
    answer: 1
    explanation: 'Seed-bearing plants follow the diplontic pattern: the diploid sporophyte is the dominant, photosynthetic, independent phase, and the haploid gametophyte is reduced to a few cells (the pollen grain and the embryo sac).'
  - id: bio-plantk-015
    topic: plantk-angiosperms
    subtopic: Monocot seed
    concept: The scutellum is the single cotyledon of a monocot embryo
    category: factual
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [monocot-seed, scutellum]
    stem: In the embryo of a maize grain, the single shield-shaped cotyledon is called the
    options:
      - Scutellum
      - Coleoptile
      - Coleorhiza
      - Aleurone layer
    answer: 0
    explanation: The embryo of a monocot seed such as maize has one large shield-shaped cotyledon, the scutellum. The coleoptile and coleorhiza are protective sheaths of the plumule and radicle, and the aleurone layer is the protein-rich outer layer of the endosperm.
  - id: bio-plantk-016
    topic: plantk-angiosperms
    subtopic: Double fertilisation
    concept: 'Double fertilisation means two fusions: syngamy and triple fusion'
    category: concept
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [double-fertilisation, syngamy]
    stem: Why is the fertilisation event in flowering plants called double fertilisation?
    options:
      - Two pollen tubes enter every embryo sac
      - Two egg cells are fertilised in every embryo sac
      - 'Two fusions occur in the embryo sac: syngamy and fusion with the secondary nucleus'
      - Each male gamete divides twice before it fuses
    answer: 2
    explanation: 'The name comes from the two fusion events in one embryo sac: one male gamete fuses with the egg (syngamy) and the other fuses with the secondary nucleus (triple fusion). A single pollen tube delivers both gametes, and only one egg cell is fertilised.'
  - id: bio-plantk-017
    topic: plantk-angiosperms
    subtopic: Ploidy of endosperm
    concept: Endosperm cells are triploid (3n)
    category: numerical
    format: direct
    difficulty: 3
    time: 50
    ncert: false
    battle: true
    formula: PEN = n + n + n = 3n
    tags: [endosperm, ploidy]
    stem: A flowering plant has 2n = 20 chromosomes. How many chromosomes would a cell of its endosperm contain?
    options:
      - '10'
      - '30'
      - '20'
      - '40'
    answer: 1
    explanation: Endosperm arises from the primary endosperm nucleus, formed by three haploid nuclei (two polar nuclei and one male gamete). With n = 10, the endosperm has 3n = 30 chromosomes; 20 is the zygote number and 10 the gamete number.
  - id: bio-plantk-018
    topic: plantk-angiosperms
    subtopic: Embryo sac
    concept: A mature embryo sac is 7-celled and 8-nucleate, with all nuclei haploid
    category: numerical
    format: direct
    difficulty: 4
    time: 85
    ncert: false
    battle: false
    formula: 8 nuclei × n
    tags: [embryo-sac, chromosome-count]
    stem: A flowering plant has 2n = 32. How many chromosomes are present in total in all the nuclei of its mature embryo sac before fertilisation?
    options:
      - '112'
      - '256'
      - '96'
      - '128'
    answer: 3
    explanation: A mature embryo sac is 7-celled and 8-nucleate, and every nucleus is haploid (n = 16). The total is 8 × 16 = 128. Counting only the 7 cells gives 112, and using 2n for each nucleus gives 256.
  - id: bio-plantk-019
    topic: plantk-angiosperms
    subtopic: Monocot root
    concept: A monocot root has more than six xylem bundles and a large pith
    category: concept
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [monocot-root, polyarch]
    stem: Which feature distinguishes a monocot root from a dicot root in transverse section?
    options:
      - Usually more than six xylem bundles with a large, well-developed pith
      - Two to four xylem bundles with a small or inconspicuous pith
      - Open vascular bundles arranged in a ring
      - A vascular cambium forming secondary xylem and phloem
    answer: 0
    explanation: The monocot root has usually more than six (polyarch) xylem bundles and a large, well-developed pith. The dicot root has two to four xylem bundles, a small pith and shows secondary growth; open bundles in a ring belong to the dicot stem.
  - id: bio-plantk-020
    topic: plantk-angiosperms
    subtopic: Monocot leaf
    concept: Bulliform cells of grass leaves help the leaf curl inwards under water stress
    category: factual
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [bulliform-cells, monocot-leaf]
    stem: In grasses, large, empty, colourless adaxial epidermal cells that make the leaf curl inwards under water stress are the
    options:
      - Guard cells
      - Bulliform cells
      - Subsidiary cells
      - Palisade cells
    answer: 1
    explanation: In grasses, certain adaxial epidermal cells become large, empty, colourless bulliform cells. When they lose water and turn flaccid, they make the leaf curl inwards and reduce water loss.
  - id: bio-plantk-021
    topic: plantk-angiosperms
    subtopic: Gymnosperms vs angiosperms
    concept: Ovules are naked in gymnosperms and enclosed in an ovary in angiosperms
    category: concept
    format: statements
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [gymnosperm, angiosperm, ovule]
    stem: Which one of the following statements comparing gymnosperms and angiosperms is correct?
    options:
      - In angiosperms the seeds are naked, while in gymnosperms they are enclosed in fruits
      - Both groups show double fertilisation inside a flower
      - In angiosperms the ovules are enclosed within an ovary, while in gymnosperms they are naked
      - Pollen grains and ovules are borne in flowers in gymnosperms and in cones in angiosperms
    answer: 2
    explanation: In angiosperms the ovules are enclosed in the ovary and the seeds in fruits; in gymnosperms ovules and seeds are naked. Double fertilisation is unique to flowering plants, and it is gymnosperms that bear their sporophylls in cones while angiosperms bear flowers.
  - id: bio-plantk-022
    topic: plantk-angiosperms
    subtopic: Embryo sac
    concept: The egg, synergids and antipodals are haploid; the secondary nucleus is 2n and the PEN is 3n
    category: concept
    format: statements
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [embryo-sac, ploidy]
    stem: Which statement about the embryo sac and its fertilisation products is NOT correct?
    options:
      - The egg cell and each synergid are haploid
      - The secondary nucleus formed by the two polar nuclei is diploid
      - The primary endosperm nucleus is triploid
      - The antipodal cells are diploid because they arise from the secondary nucleus
    answer: 3
    explanation: All the cells of the embryo sac are haploid, and the antipodals form along with the other cells and not from the secondary nucleus. The secondary nucleus is diploid and the primary endosperm nucleus is triploid, so only the antipodal statement is wrong.
  - id: bio-plantk-023
    topic: plantk-angiosperms
    subtopic: Monocots and dicots
    concept: 'Monocots: one cotyledon, trimerous flowers; dicots: reticulate venation, pentamerous flowers'
    category: concept
    format: statements
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [monocot, dicot]
    stem: Which one of the following statements about monocotyledons is correct?
    options:
      - Their leaves show reticulate venation and their flowers are pentamerous
      - Their seeds have a single cotyledon and their flowers are typically trimerous
      - They usually have a tap root developed from the radicle
      - The vascular bundles of their stem are arranged in a ring and are open
    answer: 1
    explanation: Monocot seeds have one cotyledon and monocot flowers are typically trimerous. Reticulate venation with pentamerous flowers, a tap root from the radicle, and open bundles in a ring are dicot features.
  - id: bio-plantk-024
    topic: plantk-angiosperms
    subtopic: Embryo sac
    concept: 'Structure of the mature embryo sac: egg apparatus, antipodals, central cell'
    category: concept
    format: multi-statement
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [embryo-sac, egg-apparatus]
    stem: |-
      Consider the following statements about a typical mature embryo sac of an angiosperm.
      I. It is 7-celled and 8-nucleate.
      II. The egg apparatus consists of the egg cell and two synergids.
      III. The three antipodal cells lie at the micropylar end.
      IV. The central cell contains two polar nuclei.
      Which statements are correct?
    options:
      - I, II and IV only
      - I, II and III only
      - II, III and IV only
      - I, III and IV only
    answer: 0
    explanation: A typical embryo sac is 7-celled and 8-nucleate, the egg apparatus has the egg and two synergids, and the central cell holds two polar nuclei, so I, II and IV are right. The antipodals lie at the chalazal end, not the micropylar end, so III is wrong.
  - id: bio-plantk-025
    topic: plantk-angiosperms
    subtopic: Monocots and dicots
    concept: 'Dicot features: open bundles in a ring, 4- or 5-merous flowers; monocot: scattered bundles, polyarch root'
    category: application
    format: multi-statement
    difficulty: 4
    time: 85
    ncert: true
    battle: false
    tags: [monocot, dicot, anatomy]
    stem: |-
      Which of the following are characteristic of typical dicots rather than monocots?
      I. Open vascular bundles in the stem
      II. Vascular bundles scattered in the ground tissue of the stem
      III. Tetramerous or pentamerous flowers
      IV. More than six xylem bundles in the root
    options:
      - II and IV only
      - I, III and IV only
      - I and III only
      - I, II and III only
    answer: 2
    explanation: Open vascular bundles (cambium present) and four- or five-merous flowers are dicot features. Scattered bundles in the stem and polyarch xylem (more than six bundles) in the root are monocot features.
  - id: bio-plantk-026
    topic: plantk-angiosperms
    subtopic: Changes after fertilisation
    concept: Zygote gives embryo, PEN gives endosperm, synergids and antipodals degenerate, integuments form seed coat
    category: concept
    format: multi-statement
    difficulty: 4
    time: 85
    ncert: true
    battle: false
    tags: [post-fertilisation, seed]
    stem: |-
      Which of the following events follow double fertilisation in an angiosperm ovule?
      I. The zygote develops into the embryo.
      II. The primary endosperm nucleus develops into the endosperm.
      III. The synergids and antipodals degenerate.
      IV. The wall of the ovary develops into the seed coat.
    options:
      - I, II and III only
      - I, II and IV only
      - II, III and IV only
      - I, III and IV only
    answer: 0
    explanation: The zygote gives the embryo, the primary endosperm nucleus gives the endosperm, and the synergids and antipodals degenerate. The ovary develops into the fruit, and it is the integuments of the ovule that harden into the seed coat, so IV is wrong.
  - id: bio-plantk-027
    topic: plantk-angiosperms
    subtopic: Double fertilisation
    concept: 'Products of double fertilisation: both gametes from one pollen tube, triploid nutritive tissue, one or two cotyledons'
    category: concept
    format: multi-statement
    difficulty: 5
    time: 120
    ncert: true
    battle: false
    tags: [double-fertilisation, endosperm, cotyledon]
    stem: |-
      Consider the following statements.
      I. The zygote and the primary endosperm nucleus are formed from the two male gametes released by the same pollen tube.
      II. The tissue that nourishes the developing embryo has three sets of chromosomes.
      III. The embryo may carry one or two cotyledons.
      IV. Both male gametes fuse with the egg cell.
      V. The synergids continue to nourish the developing embryo.
      Which statements are correct?
    options:
      - I, II, III and V
      - I, II and III only
      - II, III and IV only
      - I, III, IV and V
    answer: 1
    explanation: 'I, II and III are correct: both gametes come from one pollen tube, the endosperm is triploid, and the embryo has one or two cotyledons. IV is wrong because the two male gametes fuse with different nuclei (the egg and the secondary nucleus), and V is wrong because the synergids degenerate after fertilisation.'
  - id: bio-plantk-028
    topic: plantk-angiosperms
    subtopic: Gymnosperms vs angiosperms
    concept: Seed plants share seeds, dominant sporophyte and pollen tubes; only angiosperms enclose ovules in an ovary
    category: concept
    format: multi-statement
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [gymnosperm, angiosperm, comparison]
    stem: |-
      Which of the following features are common to gymnosperms and angiosperms?
      I. Seeds are produced.
      II. The diploid sporophyte is dominant and the gametophyte is reduced.
      III. Ovules are enclosed within an ovary.
      IV. A pollen tube carries the male gametes.
    options:
      - I, III and IV only
      - I, II and III only
      - II, III and IV only
      - I, II and IV only
    answer: 3
    explanation: Both seed-bearing groups produce seeds, have a dominant diploid sporophyte with a reduced gametophyte, and use pollen tubes to carry male gametes. Ovules enclosed in an ovary are found only in angiosperms.
  - id: bio-plantk-029
    topic: plantk-angiosperms
    subtopic: Pollen and embryo sac formation
