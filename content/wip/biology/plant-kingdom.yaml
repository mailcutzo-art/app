    diagram: 'A step graph for a moss. X-axis: eight numbered stages in order, 1 spore, 2 protonema, 3 leafy gametophyte, 4 gametes, 5 zygote, 6 young sporophyte, 7 spore mother cells, 8 spores. Y-axis: number of chromosomes per cell, with ticks at 8 and 16. The line is at 8 for stages 1 to 4, rises to 16 at stage 5, stays at 16 for stages 6 and 7, and falls back to 8 at stage 8.'
