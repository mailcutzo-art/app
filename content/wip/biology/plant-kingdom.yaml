  - id: bio-plantk-090
    topic: plantk-classification-systems
    subtopic: Comparing systems
    concept: Applying androecium-based, equal-weightage, natural, phylogenetic and numerical bases to two situations
    category: application
    format: case
    difficulty: 5
    time: 120
    ncert: false
    battle: false
    tags: [case, comparison]
    stem: |-
      Four flowering plants are studied.
      P and Q have the same androecium structure and similar leaves, but differ in anatomy, embryology and phytochemistry.
      R and S belong to one species; R, grown in shade, differs from S, grown in sun, in leaf size and colour, while their flowers are alike.
      Which statement is most consistent with NCERT?
    options:
      - An androecium-based system groups P and Q together, whereas equal weightage to vegetative and sexual characters could separate R and S
      - Natural classification groups P and Q together because it relies mainly on the androecium, and separates R and S because it relies on leaf characters
      - A phylogenetic system separates P and Q and groups R and S because it relies on vegetative characters
      - Numerical taxonomy groups P and Q since androecium characters count more, and separates R and S since leaf characters count more than flower characters
    answer: 0
    explanation: An androecium-based (artificial) system puts P and Q together although natural systems using anatomy, embryology and phytochemistry could separate them. R and S differ only in vegetative characters, which are more easily affected by the environment, so a system giving equal weightage to vegetative and sexual characters could wrongly separate them. The other options misstate the bases of natural, phylogenetic and numerical approaches.
