      - Both A and R are true but R is not the correct explanation of A
      - A is true but R is false
      - A is false but R is true
    answer: 3
    explanation: 'A is false because natural systems consider internal features such as ultrastructure, anatomy, embryology and phytochemistry along with external features. R is true: natural systems are based on natural affinities among organisms.'
