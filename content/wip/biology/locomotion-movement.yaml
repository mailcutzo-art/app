    diagram: Two side-by-side longitudinal sections of a synovial joint between the ends of two bones. Panel 1 (normal) shows smooth cartilage on each bone end, a clear synovial cavity between them and a thin capsule. Panel 2 shows a thickened capsule shaded red and labelled 'inflamed'. In the synovial cavity of Panel 2 many tiny needle-shaped crystals are drawn and labelled 'crystals of a nitrogenous waste'. The bone ends and the muscles around the joint look normal in both panels.
