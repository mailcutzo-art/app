    options:
      - muscular movement
      - ciliary movement
      - amoeboid movement
      - flagellar movement
    answer: 0
    explanation: NCERT states that the movement of our limbs, jaws, tongue and so on requires muscular movement, which depends on the contractile property of muscles. Ciliary and amoeboid movements are shown by specialised cells and ciliated tubes.
  - id: bio-loco-006
    topic: loco-types-of-movement
    subtopic: Types of movement
    concept: The human body shows three main types of movement
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [types-of-movement]
    stem: According to NCERT, the cells of the human body exhibit three main types of movements, namely
    options:
      - amoeboid, flagellar and muscular
      - amoeboid, ciliary and muscular
      - ciliary, flagellar and muscular
      - amoeboid, ciliary and flagellar
    answer: 1
    explanation: NCERT names the three main types of movement of human body cells as amoeboid, ciliary and muscular. Flagellar movement is not one of the three types listed for the human body.
  - id: bio-loco-007
