    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [ciliary, ovum]
    stem: Passage of ova through the female reproductive tract is facilitated by
    options:
      - amoeboid movement
      - streaming of protoplasm in the ova
      - contraction of skeletal muscles
      - ciliary movement
    answer: 3
    explanation: NCERT lists the passage of ova through the female reproductive tract, along with the removal of dust in the trachea, as a function of ciliary movement. Amoeboid movement and protoplasmic streaming belong to cells like macrophages, and skeletal muscle moves the limbs, jaws and tongue.
  - id: bio-loco-005
    topic: loco-types-of-movement
    subtopic: Muscular movement
    concept: Movement of limbs, jaws and tongue is muscular movement
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
