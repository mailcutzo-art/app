      - Being hydrolysed again by the myosin head so that the cycle repeats
    answer: 2
    explanation: The masking of the active sites is removed by Ca^{2+} binding to a subunit of troponin, not by ATP. ATP provides the energy for cross-bridge formation, its binding breaks the cross bridge, and its renewed hydrolysis lets the cycle repeat.
