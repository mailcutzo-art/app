    category: concept
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [amoeboid, microfilaments, cytoskeleton]
    stem: Which pair correctly relates a type of movement to the cytoskeletal element involved in it?
    options:
      - Ciliary movement - microfilaments
      - Amoeboid movement - axonemal microtubules
      - Amoeboid movement - microfilaments
      - Ciliary movement - pseudopodia
    answer: 2
    explanation: NCERT says cytoskeletal elements like microfilaments are involved in amoeboid movement, along with pseudopodia formed by streaming of protoplasm. A cilium has an axoneme of microtubules, and pseudopodia are not a cytoskeletal element at all.
  - id: bio-loco-008
    topic: loco-types-of-movement
    subtopic: Locomotion and movement
    concept: A movement that does not change the place of the body is not locomotion
    category: concept
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [locomotion, movement]
    stem: Which of the following is a movement but NOT locomotion?
    options:
      - Swimming
      - Climbing
      - Flying
      - Movement of the eyelids
    answer: 3
    explanation: NCERT defines locomotion as a voluntary movement that results in a change of place or location, and says all locomotions are movements but all movements are not locomotions. Swimming, climbing and flying shift the body, whereas moving the eyelids does not.
