  - id: bio-anat-039
    topic: anat-leaf-anatomy
    subtopic: Bulliform cells in water stress
    concept: Flaccid bulliform cells make a grass leaf curl inwards and reduce water loss
    category: application
    format: case
    difficulty: 4
    time: 85
    ncert: true
    battle: false
    tags: [bulliform-cells, water-stress, grasses]
    stem: On a hot afternoon the leaf blades of a lawn grass roll inwards, and they unroll again after watering. A vertical section of the leaf shows large, empty, colourless cells in the adaxial epidermis along the veins. The inward rolling is best explained by
    options:
      - these cells becoming flaccid under water stress, which minimises water loss
      - these cells becoming turgid under water stress, which exposes the leaf surface
      - the guard cells becoming flaccid, which exposes the leaf surface
      - the palisade cells collapsing in the adaxial mesophyll
    answer: 0
    explanation: The large, empty, colourless adaxial cells are bulliform cells. When they are flaccid due to water stress the leaf curls inwards and loses less water, and when turgid they expose the leaf surface. Grasses have no palisade layer, and guard cells regulate the stomata and not leaf rolling.
