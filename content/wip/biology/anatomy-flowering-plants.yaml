    time: 120
    ncert: false
    battle: false
    diagram: 'Two vertical sections of leaf lamina, A and B, drawn side by side with the upper surface at the top. Section A: upper epidermis with no stomata; below it a layer of tall cells arranged vertically and parallel; below that a layer of loosely arranged rounded cells with air spaces; lower epidermis with many stomata; vascular bundles of clearly different sizes, one large bundle in the midrib and several smaller ones in the veins. Section B: both epidermal layers carry stomata; the mesophyll is one uniform mass of similar cells with no layering; the vascular bundles are in a row and nearly equal in size except one larger bundle at the centre; in the upper epidermis, directly above each bundle, is a group of large, empty, colourless cells marked with an arrow.'
    tags: [leaf-section, isobilateral-leaf, bulliform-cells]
    stem: The figure shows vertical sections of two leaves, A and B. Which option correctly identifies them and the large colourless cells marked in B?
    options:
