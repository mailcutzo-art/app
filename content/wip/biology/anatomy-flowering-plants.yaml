questions:
  - id: bio-anat-001
    topic: anat-leaf-anatomy
    subtopic: Parts of a dorsiventral leaf
    concept: A dorsiventral leaf lamina shows epidermis, mesophyll and vascular system
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [dorsiventral-leaf, lamina]
    stem: A vertical section through the lamina of a dorsiventral leaf shows three main parts, namely
    options:
      - epidermis, mesophyll and vascular system
      - epidermis, cortex and vascular system
      - cuticle, palisade tissue and spongy tissue
      - epidermis, hypodermis and pith
    answer: 0
    explanation: NCERT states that a vertical section of a dorsiventral leaf through the lamina shows epidermis, mesophyll and the vascular system. Cortex, hypodermis and pith belong to roots and stems, and palisade and spongy tissues are the two kinds of cells inside the mesophyll.
  - id: bio-anat-002
    topic: anat-leaf-anatomy
    subtopic: Bulliform cells
    concept: Bulliform cells are large, empty, colourless adaxial epidermal cells along the veins of grasses
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [bulliform-cells, grasses]
    stem: In grasses, certain adaxial epidermal cells along the veins become large, empty and colourless. These cells are called
    options:
      - subsidiary cells
      - guard cells
      - bulliform cells
      - trichomes
    answer: 2
    explanation: NCERT calls the large, empty, colourless adaxial epidermal cells that lie along the veins of grass leaves bulliform cells. Subsidiary and guard cells belong to the stomatal apparatus, and trichomes are epidermal hairs.
  - id: bio-anat-003
    topic: anat-leaf-anatomy
    subtopic: Mesophyll
    concept: Mesophyll is the tissue lying between the upper and lower epidermis of a leaf
    category: factual
    format: direct
    difficulty: 1
    time: 20
    ncert: true
    battle: true
    tags: [mesophyll]
    stem: The tissue lying between the upper and the lower epidermis of a leaf is called the
    options:
      - cortex
      - pith
      - pericycle
      - mesophyll
    answer: 3
    explanation: The tissue between the upper and the lower epidermis of a leaf is the mesophyll. It possesses chloroplasts and carries out photosynthesis. Cortex, pith and pericycle are tissues of stems and roots.
  - id: bio-anat-004
    topic: anat-leaf-anatomy
    subtopic: Stomata of grass leaves
    concept: Guard cells of grasses are dumb-bell shaped
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [guard-cells, grasses]
    stem: In the leaves of grasses, the guard cells are
    options:
      - bean-shaped, as in most other plants
      - dumb-bell shaped
      - unicellular elongations like root hairs
      - large, empty and colourless
    answer: 1
    explanation: NCERT says that in grasses the guard cells are dumb-bell shaped, whereas they are bean-shaped in other plants. Root hairs are unicellular elongations of epidermal cells, and large, empty, colourless cells are bulliform cells.
  - id: bio-anat-005
    topic: anat-leaf-anatomy
    subtopic: Palisade parenchyma
    concept: Palisade parenchyma is adaxial, with elongated cells arranged vertically and parallel
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [palisade-parenchyma, mesophyll]
    stem: Which cells of a dorsiventral leaf lie on the adaxial side, are elongated and are arranged vertically and parallel to each other?
    options:
      - Palisade parenchyma
      - Spongy parenchyma
      - Bundle sheath cells
      - Bulliform cells
    answer: 0
    explanation: The adaxially placed palisade parenchyma is made up of elongated cells arranged vertically and parallel to each other. Spongy parenchyma cells are oval or round and loosely arranged, and bulliform cells are epidermal cells of grass leaves.
  - id: bio-anat-006
    topic: anat-leaf-anatomy
    subtopic: Dorsiventral and isobilateral leaves
    concept: An isobilateral monocot leaf has stomata on both surfaces and undifferentiated mesophyll
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [isobilateral-leaf, monocot-leaf]
    stem: Which leaf has stomata on both surfaces of the epidermis and mesophyll that is not differentiated into palisade and spongy parenchyma?
    options:
      - The dorsiventral leaf of a dicot
      - The dorsiventral leaf of a monocot
      - The isobilateral leaf of a monocot
      - The isobilateral leaf of a dicot
    answer: 2
    explanation: NCERT describes the isobilateral leaf as the monocotyledonous leaf, with stomata on both surfaces and mesophyll not differentiated into palisade and spongy parenchyma. The dorsiventral leaf is the dicot leaf.
  - id: bio-anat-007
    topic: anat-leaf-anatomy
    subtopic: Bundle sheath
    concept: Vascular bundles of a dorsiventral leaf are surrounded by thick-walled bundle sheath cells
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [bundle-sheath, vascular-bundle]
    stem: The vascular bundles seen in the veins and midrib of a dorsiventral leaf are surrounded by a layer of
    options:
      - thin-walled palisade cells
      - starch-rich endodermal cells
      - loosely arranged spongy cells
      - thick-walled bundle sheath cells
    answer: 3
    explanation: NCERT states that the vascular bundles of a dorsiventral leaf are surrounded by a layer of thick-walled bundle sheath cells. Palisade and spongy cells are mesophyll, and a starch-rich endodermis is a feature of the dicot stem.
  - id: bio-anat-008
    topic: anat-leaf-anatomy
    subtopic: Stomata and epidermis
    concept: Functions of stomata and of the cuticle in the leaf epidermis
    category: concept
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [stomata, cuticle]
    stem: Which option correctly states the role of the stomata and of the cuticle in the epidermis of a leaf?
    options:
      - Stomata prevent loss of water; the cuticle regulates gaseous exchange
      - Stomata absorb water and minerals; the cuticle prevents loss of water
      - Stomata regulate transpiration and gaseous exchange; the cuticle prevents loss of water
      - Stomata regulate transpiration and gaseous exchange; the cuticle absorbs water from the air
    answer: 2
    explanation: NCERT says stomata regulate transpiration and gaseous exchange, while the waxy, thick cuticle prevents the loss of water. The other options swap these roles or invent a function.
  - id: bio-anat-009
    topic: anat-leaf-anatomy
    subtopic: Palisade and spongy parenchyma
    concept: Palisade and spongy parenchyma are both chloroplast-bearing photosynthetic mesophyll cells
    category: concept
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [mesophyll, palisade-parenchyma, spongy-parenchyma]
    stem: Which feature is common to the palisade parenchyma and the spongy parenchyma of a dorsiventral leaf?
    options:
      - Both are mesophyll cells that contain chloroplasts and carry out photosynthesis
      - Both consist of elongated cells arranged vertically and parallel to each other
      - Both have numerous large spaces and air cavities between their cells
      - Both extend downwards up to the lower epidermis
    answer: 0
    explanation: The mesophyll possesses chloroplasts and carries out photosynthesis, and it has two kinds of cells, palisade and spongy parenchyma. The vertical, parallel arrangement belongs only to palisade cells, and the air cavities and extension to the lower epidermis belong only to spongy cells.
  - id: bio-anat-010
    topic: anat-leaf-anatomy
    subtopic: Vascular system of the leaf
    concept: The size of a vascular bundle in a dorsiventral leaf depends on the size of its vein
    category: concept
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [vascular-bundle, veins]
    stem: In a dorsiventral leaf, the size of a vascular bundle depends on the
    options:
      - number of stomata in the epidermis above it
      - size of the vein in which it lies
      - thickness of the palisade layer above it
      - diameter of the spongy parenchyma cells near it
    answer: 1
    explanation: NCERT says the vascular bundles can be seen in the veins and the midrib, and that their size depends on the size of the veins. The veins vary in thickness in the reticulate venation of dicot leaves, so the bundles also vary in size.
  - id: bio-anat-011
    topic: anat-leaf-anatomy
    subtopic: Epidermal appendages
    concept: Trichomes are multicellular shoot hairs that help to prevent water loss
    category: factual
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [trichomes, epidermal-appendages]
    stem: Which epidermal outgrowths of the shoot are usually multicellular, branched or unbranched, soft or stiff, and may even be secretory?
    options:
      - Root hairs
      - Subsidiary cells
      - Bulliform cells
      - Trichomes
    answer: 3
    explanation: NCERT describes trichomes of the shoot system as usually multicellular, branched or unbranched, soft or stiff and sometimes secretory, and says they help prevent water loss due to transpiration. Root hairs are unicellular elongations.
  - id: bio-anat-012
    topic: anat-leaf-anatomy
    subtopic: Tissue systems of the leaf
    concept: Stomata belong to the epidermal tissue system, mesophyll to the ground tissue system
    category: concept
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [tissue-systems, stomata]
    stem: Which of the following leaf components is correctly assigned to its tissue system?
    options:
      - Palisade parenchyma – epidermal tissue system
      - Mesophyll – vascular tissue system
      - Stomata – epidermal tissue system
      - Xylem – ground tissue system
    answer: 2
    explanation: The epidermal tissue system comprises epidermal cells, stomata and the epidermal appendages. The mesophyll, including palisade parenchyma, is the ground tissue of the leaf, and xylem belongs to the vascular tissue system.
  - id: bio-anat-013
    topic: anat-leaf-anatomy
    subtopic: Cuticle
    concept: Cuticle is conspicuous on leaf epidermis but absent in roots
    category: factual
    format: direct
    difficulty: 2
    time: 30
    ncert: true
    battle: true
    tags: [cuticle, epidermis]
    stem: The waxy cuticle that covers the epidermis of a leaf is absent in
    options:
      - roots
      - young dicot stems
      - the abaxial epidermis of a dorsiventral leaf
      - the adaxial epidermis of a dorsiventral leaf
    answer: 0
    explanation: NCERT states that the cuticle is absent in roots. A young dicot stem is covered with a thin layer of cuticle, and a dorsiventral leaf has a conspicuous cuticle on both its adaxial and abaxial epidermis.
  - id: bio-anat-014
    topic: anat-leaf-anatomy
    subtopic: Stomata and cuticle in a dorsiventral leaf
    concept: 'Dorsiventral leaf: cuticle on both surfaces, more stomata on the abaxial epidermis'
    category: concept
    format: direct
    difficulty: 4
    time: 85
    ncert: true
    battle: false
    tags: [dorsiventral-leaf, stomata, cuticle]
    stem: Which option correctly describes the cuticle and the stomata of the epidermis of a dorsiventral leaf?
    options:
      - The cuticle is conspicuous on both surfaces, and both epidermises bear equal numbers of stomata
      - The cuticle is conspicuous only on the abaxial surface, and the adaxial epidermis bears more stomata
      - The cuticle is absent on both surfaces, and the abaxial epidermis bears more stomata
      - The cuticle is conspicuous on both surfaces, and the abaxial epidermis generally bears more stomata while the adaxial may lack them
    answer: 3
    explanation: In a dorsiventral leaf the epidermis covering the adaxial and abaxial surfaces has a conspicuous cuticle. The abaxial epidermis generally bears more stomata than the adaxial one, which may even lack stomata.
  - id: bio-anat-015
    topic: anat-leaf-anatomy
    subtopic: Spongy parenchyma
    concept: Spongy parenchyma cells are oval or round, loosely arranged, below palisade cells with air cavities
    category: factual
    format: direct
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [spongy-parenchyma, mesophyll]
    stem: Which description fits the spongy parenchyma of a dorsiventral leaf?
    options:
      - Elongated cells arranged vertically and parallel to each other on the adaxial side
      - Oval or round, loosely arranged cells below the palisade cells, extending to the lower epidermis, with large spaces and air cavities between them
      - Oval or round, compactly packed cells without intercellular spaces, lying beneath the adaxial epidermis
      - Elongated, thick-walled cells forming a layer around the vascular bundles
    answer: 1
    explanation: NCERT describes the spongy parenchyma as oval or round, loosely arranged cells situated below the palisade cells and extending to the lower epidermis, with numerous large spaces and air cavities between them. Option A describes palisade cells and option D describes the bundle sheath.
  - id: bio-anat-016
    topic: anat-leaf-anatomy
    subtopic: Isobilateral versus dorsiventral leaf
    concept: Characteristic differences of the isobilateral leaf, and a feature common to both leaf types
    category: concept
    format: direct
    difficulty: 4
    time: 85
    ncert: true
    battle: false
    tags: [isobilateral-leaf, dorsiventral-leaf]
    stem: According to NCERT, which of the following is NOT a characteristic difference between an isobilateral leaf and a dorsiventral leaf?
    options:
      - Occurrence of bulliform cells along the veins in grasses
      - Presence of chloroplasts in the cells of the mesophyll
      - Differentiation of the mesophyll into palisade and spongy parenchyma
      - Presence of stomata on both surfaces of the epidermis
    answer: 1
    explanation: NCERT lists stomata on both surfaces, a mesophyll not differentiated into palisade and spongy parenchyma, and bulliform cells in grasses as features of the isobilateral leaf. The mesophyll of both leaf types is chloroplast-bearing photosynthetic parenchyma, so that is shared and not a difference.
  - id: bio-anat-017
    topic: anat-leaf-anatomy
    subtopic: Mesophyll of a dorsiventral leaf
    concept: Mesophyll is chloroplast-bearing parenchyma between the epidermises that photosynthesises
    category: concept
    format: statements
    difficulty: 3
    time: 50
    ncert: true
    battle: true
    tags: [mesophyll, dorsiventral-leaf]
    stem: Which one of the following statements about the mesophyll of a dorsiventral leaf is correct?
    options:
      - It is made up of collenchyma and sclerenchyma.
      - It possesses chloroplasts, carries out photosynthesis and is made up of parenchyma.
      - It consists of a single type of cell with no differentiation.
      - It is confined to the region below the lower epidermis.
    answer: 1
    explanation: The mesophyll lies between the upper and lower epidermis, possesses chloroplasts, carries out photosynthesis and is made up of parenchyma. In a dorsiventral leaf it has two types of cells, palisade and spongy parenchyma.
  - id: bio-anat-018
    topic: anat-leaf-anatomy
    subtopic: Grass leaf
    concept: 'Combined features of a grass leaf: bulliform cells, dumb-bell guard cells and undifferentiated mesophyll'
    category: application
    format: statements
    difficulty: 5
    time: 120
    ncert: true
    battle: false
    tags: [grass-leaf, bulliform-cells, isobilateral-leaf]
    stem: Which one of the following sets of features is correct for the leaf of a grass?
    options:
      - Bulliform cells in the abaxial epidermis; bean-shaped guard cells; mesophyll differentiated into palisade and spongy parenchyma
      - Bulliform cells in the adaxial epidermis; dumb-bell shaped guard cells; stomata confined to the abaxial surface
      - Bulliform cells in the adaxial epidermis along the veins; dumb-bell shaped guard cells; mesophyll not differentiated into palisade and spongy parenchyma
      - Bulliform cells in the adaxial epidermis along the veins; bean-shaped guard cells; mesophyll not differentiated into palisade and spongy parenchyma
    answer: 2
    explanation: In grass leaves bulliform cells are adaxial epidermal cells along the veins, the guard cells are dumb-bell shaped, and the isobilateral leaf has stomata on both surfaces with undifferentiated mesophyll. Every other option swaps at least one of these three features.
  - id: bio-anat-019
    topic: anat-leaf-anatomy
    subtopic: Epidermis of the leaf
    concept: Epidermis is single-layered with parenchymatous cells and a cuticle; only guard cells are described with chloroplasts
    category: concept
    format: statements
    difficulty: 4
    time: 85
    ncert: true
    battle: true
    tags: [epidermis, cuticle, guard-cells]
    stem: Which one of the following statements about the epidermis of a leaf is incorrect?
    options:
      - It is usually single-layered.
      - Its cells are parenchymatous, with a small amount of cytoplasm lining the wall and a large vacuole.
      - It is covered by a waxy, thick cuticle that prevents the loss of water.
      - All its cells possess chloroplasts and form the main photosynthetic tissue of the leaf.
    answer: 3
    explanation: The epidermis is usually single-layered, its cells have a large vacuole and little cytoplasm, and the cuticle prevents water loss. Photosynthesis is the work of the chloroplast-bearing mesophyll, and among epidermal cells NCERT mentions chloroplasts only in the guard cells.
  - id: bio-anat-020
    topic: anat-leaf-anatomy
    subtopic: Dorsiventral leaf mesophyll
    concept: Position and arrangement of palisade and spongy parenchyma in a dorsiventral leaf
    category: concept
    format: multi-statement
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [dorsiventral-leaf, mesophyll]
    stem: |-
      Consider the following statements about a dorsiventral leaf.
      I. The mesophyll possesses chloroplasts and is made up of parenchyma.
      II. The palisade parenchyma is placed on the adaxial side.
      III. The spongy parenchyma is situated above the palisade cells.
      IV. The cells of the spongy parenchyma are compactly arranged without spaces.
      Which of the statements are correct?
    options:
      - I and II only
      - II and III only
      - I, II and IV only
      - III and IV only
    answer: 0
    explanation: Statements I and II are NCERT facts. The spongy parenchyma lies below the palisade cells and extends to the lower epidermis, so III is wrong, and its loosely arranged cells have numerous large spaces and air cavities, so IV is wrong.
  - id: bio-anat-021
    topic: anat-leaf-anatomy
    subtopic: Isobilateral leaf
    concept: Features of the isobilateral leaf versus bulliform origin and vascular bundle sizes
    category: concept
    format: multi-statement
    difficulty: 4
    time: 85
    ncert: true
    battle: false
    tags: [isobilateral-leaf, bulliform-cells, vascular-bundle]
    stem: |-
      Consider the following statements about an isobilateral leaf.
      I. Stomata are present on both the surfaces of the epidermis.
      II. The mesophyll is not differentiated into palisade and spongy parenchyma.
      III. The bulliform cells are modified cells of the abaxial epidermis.
      IV. The vascular bundles are of near similar size, except in the main veins.
      Which of the statements are correct?
    options:
      - I and II only
      - II, III and IV only
      - I, II and IV only
      - I, III and IV only
    answer: 2
    explanation: I, II and IV are NCERT facts about the monocot leaf, whose parallel venation is reflected in the near similar size of its bundles. Statement III is wrong because bulliform cells are modified adaxial epidermal cells lying along the veins.
  - id: bio-anat-022
    topic: anat-leaf-anatomy
    subtopic: Ground tissue of the leaf
    concept: Mesophyll is the ground tissue of the leaf and not part of the vascular tissue system
    category: concept
    format: multi-statement
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [ground-tissue, mesophyll]
    stem: |-
      Consider the following statements.
      I. In leaves, the ground tissue consists of thin-walled, chloroplast-containing cells.
      II. This ground tissue of the leaf is called the mesophyll.
      III. All tissues except the epidermis and the vascular bundles constitute the ground tissue.
      IV. The mesophyll belongs to the vascular tissue system because it surrounds the veins.
      Which of the statements are correct?
    options:
      - I and II only
      - I, II and III only
      - II, III and IV only
      - I, II, III and IV
    answer: 1
    explanation: 'I, II and III are NCERT statements: the ground tissue of a leaf is the mesophyll, and ground tissue is everything except the epidermis and vascular bundles. IV is wrong, since the vascular tissue system consists only of xylem and phloem.'
  - id: bio-anat-023
    topic: anat-leaf-anatomy
    subtopic: Counting incorrect statements
    concept: Cuticle, stomatal distribution, mesophyll of isobilateral leaf and position of bulliform cells
    category: application
    format: multi-statement
    difficulty: 5
    time: 120
    ncert: true
    battle: false
    tags: [dorsiventral-leaf, isobilateral-leaf, bulliform-cells]
    stem: |-
      Consider the following statements.
      I. The epidermis of a dorsiventral leaf has no cuticle.
      II. The abaxial epidermis of a dorsiventral leaf generally bears more stomata than the adaxial epidermis.
      III. The mesophyll of an isobilateral leaf has palisade and spongy parenchyma.
      IV. Bulliform cells occur in the abaxial epidermis of grass leaves.
      How many of the above statements are incorrect?
    options:
      - Only one
      - Only two
      - All four
      - Only three
    answer: 3
    explanation: Only statement II is correct. The dorsiventral leaf has a conspicuous cuticle, the isobilateral leaf has no palisade and spongy differentiation, and bulliform cells are adaxial epidermal cells, so I, III and IV are incorrect.
  - id: bio-anat-024
    topic: anat-leaf-anatomy
    subtopic: Conjoint vascular bundles
    concept: Conjoint bundles of stems and leaves have xylem and phloem on the same radius, phloem on the outer side
    category: concept
    format: statement-pair
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [conjoint-bundle, vascular-bundle]
    stem: |-
      Statement I: In conjoint vascular bundles, the xylem and phloem are jointly situated along the same radius.
      Statement II: Conjoint bundles are common in stems and leaves, and usually have the phloem located only on the outer side of the xylem.
    options:
      - Both Statement I and Statement II are correct
      - Both Statement I and Statement II are incorrect
      - Statement I is correct but Statement II is incorrect
      - Statement I is incorrect but Statement II is correct
    answer: 0
    explanation: Both statements are NCERT facts. In radial bundles, as in roots, xylem and phloem lie on alternate radii, whereas conjoint bundles of stems and leaves have them on the same radius with the phloem outside the xylem.
  - id: bio-anat-025
    topic: anat-leaf-anatomy
    subtopic: Guard cells
    concept: Guard cells have chloroplasts; their outer walls are thin and inner walls thick
    category: concept
    format: statement-pair
    difficulty: 3
    time: 50
    ncert: true
    battle: false
    tags: [guard-cells, stomata]
    stem: |-
      Statement I: The guard cells of the leaf epidermis possess chloroplasts and regulate the opening and closing of stomata.
      Statement II: The outer wall of a guard cell, away from the stomatal pore, is highly thickened, while the inner wall is thin.
    options:
      - Both Statement I and Statement II are correct
      - Both Statement I and Statement II are incorrect
      - Statement I is correct but Statement II is incorrect
      - Statement I is incorrect but Statement II is correct
    answer: 2
    explanation: Statement I is correct. Statement II is reversed, because NCERT says the outer walls of the guard cells are thin and the inner walls, towards the stomatal pore, are highly thickened.
  - id: bio-anat-026
    topic: anat-leaf-anatomy
    subtopic: Dorsiventral leaf
    concept: Bundle sheath is thick-walled; palisade cells are elongated, not oval and loosely arranged
    category: concept
    format: statement-pair
    difficulty: 4
    time: 85
    ncert: true
    battle: false
    tags: [palisade-parenchyma, bundle-sheath]
    stem: |-
      Statement I: The palisade parenchyma of a dorsiventral leaf is made up of oval or round cells that are loosely arranged.
      Statement II: The vascular bundles of a dorsiventral leaf are surrounded by a layer of thick-walled bundle sheath cells.
    options:
      - Both Statement I and Statement II are correct
      - Both Statement I and Statement II are incorrect
      - Statement I is correct but Statement II is incorrect
      - Statement I is incorrect but Statement II is correct
    answer: 3
    explanation: Statement I describes the spongy parenchyma. Palisade cells are elongated and arranged vertically and parallel to each other, so I is incorrect. II is correct as stated in NCERT.
  - id: bio-anat-027
    topic: anat-leaf-anatomy
    subtopic: Mesophyll of the two leaf types
