      - A - dorsiventral leaf of a dicot; B - isobilateral leaf of a monocot; the marked cells are subsidiary cells
      - A - dorsiventral leaf of a dicot; B - isobilateral leaf of a dicot; the marked cells are bulliform cells
      - A - dorsiventral leaf of a dicot; B - isobilateral leaf of a monocot; the marked cells are bulliform cells
    answer: 3
