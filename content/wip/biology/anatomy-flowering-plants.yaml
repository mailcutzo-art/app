    category: application
    format: case
    difficulty: 5
    time: 120
    ncert: false
    battle: false
    tags: [dorsiventral-leaf, isobilateral-leaf, venation]
    stem: A student studies vertical sections of the leaf of sunflower (a dicot) and of wheat (a grass). Which one of her observations contradicts NCERT?
    options:
      - Sunflower leaf has elongated cells arranged vertically and parallel just below the upper epidermis.
      - Wheat leaf has stomata on both epidermal surfaces and a mesophyll not differentiated into palisade and spongy parenchyma.
      - Wheat leaf has large, empty, colourless adaxial epidermal cells along the veins and bundles of near similar size except in the main veins.
      - Sunflower leaf has vascular bundles of near similar size in all its veins, reflecting its parallel venation.
