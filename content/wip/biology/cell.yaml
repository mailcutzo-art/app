      Statement I: In the axoneme, the peripheral doublets are connected to the central tubules by bridges.
      Statement II: The basal body from which a cilium emerges is a centriole-like structure whose peripheral units are triplets, not doublets.
    options:
      - Both Statement I and Statement II are correct
