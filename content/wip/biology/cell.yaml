      - Statement I is incorrect but Statement II is correct
    answer: 1
    explanation: Each peripheral fibril of a centriole is a triplet, so Statement I is wrong. The two centrioles of a centrosome lie perpendicular to each other, so Statement II is also wrong.
  - id: bio-cell-027
    topic: cell-cytoskeleton-centrioles
    subtopic: Axoneme and basal body
    concept: Bridges join the two central tubules, and the basal body is centriole-like with triplets
    category: concept
    format: statement-pair
    difficulty: 5
