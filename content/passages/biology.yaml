subject: biology
passages:
  - id: bio-passage-01
    title: Mitochondria, the cell's power plants
    chapter: cell
    difficulty: 2
    body: >-
      Almost every eukaryotic cell contains mitochondria, small organelles bounded by two
      membranes. The outer membrane is smooth, while the inner membrane folds into shelves called
      cristae. These folds greatly increase the surface area available for the enzymes of aerobic
      respiration, which break down food molecules to make ATP, the cell's energy currency.

      Mitochondria are unusual in other ways too. They contain their own circular DNA and their
      own 70S ribosomes, more like those of bacteria than those in the surrounding cytoplasm. They
      also divide by fission rather than being built from scratch. These features support the
      endosymbiotic theory, which says mitochondria probably began as free-living bacteria that
      were engulfed by an ancestral cell and came to live inside it.

      Cells that need a lot of energy, such as muscle and liver cells, have many more mitochondria
      than less active cells.
    questions:
      - id: bio-passage-01-q1
        category: factual
        difficulty: 1
        stem: What are the folds of the inner mitochondrial membrane called?
        options:
          - Cisternae
          - Thylakoids
          - Cristae
          - Villi
        answer: 2
        explanation: The inner membrane folds into cristae. Cisternae are the flattened sacs of the Golgi apparatus and ER, and thylakoids are found in chloroplasts.
      - id: bio-passage-01-q2
        category: concept
        stem: Why is the inner mitochondrial membrane folded?
        options:
          - To increase the surface area for respiratory enzymes
          - To store the mitochondrion's DNA
          - To keep water out of the mitochondrion
          - To help the mitochondrion divide
        answer: 0
        explanation: Folding packs more membrane into the same space, giving room for more of the enzymes that carry out aerobic respiration and make ATP.
      - id: bio-passage-01-q3
        category: application
        difficulty: 3
        stem: Which observation supports the idea that mitochondria were once free-living bacteria?
        options:
          - They are found in muscle cells
          - They make ATP
          - They are surrounded by cytoplasm
          - They have circular DNA and 70S ribosomes
        answer: 3
        explanation: Circular DNA and 70S ribosomes are features of bacteria, and mitochondria also divide by fission like bacteria. This is the evidence behind the endosymbiotic theory.
