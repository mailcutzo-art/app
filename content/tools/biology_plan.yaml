# Biology chapter and topic plan (NEET UG syllabus, NCERT Class 11-12 Biology, rationalised edition).
# 34 chapters x 500 questions; only chapters marked `active: true` are being written (the first five). Digestion and Absorption, Strategies for Enhancement in Food
# Production, Reproduction in Organisms and Environmental Issues are not in the NEET syllabus.
# Each topic: s = slug (prefixed with the chapter prefix in the bank), n = name (<= 60 chars),
# c = questions planned, k = scope hint for writers. bio_setup.py checks every chapter sums to 500.
# Existing test questions keep their slugs (keep: true) so they stay valid.

- slug: living-world
  active: true
  prefix: living
  name: The Living World
  classes: [11]
  topics:
    - {s: what-is-living, n: What is living, c: 60, k: "growth, reproduction, metabolism, cellular organisation, consciousness as the defining feature; isolated metabolic reactions in vitro; why growth and reproduction are not universal criteria"}
    - {s: diversity-nomenclature, n: Diversity and binomial nomenclature, c: 110, k: "biodiversity, need for classification, ICBN/ICZN rules of binomial nomenclature, writing scientific names, author citation, examples from NCERT"}
    - {s: taxonomic-hierarchy, n: Taxonomic categories and hierarchy, c: 140, k: "species, genus, family, order, class, phylum/division, kingdom; examples of man, housefly, mango, wheat; each category with its definition; units of classification"}
    - {s: taxonomical-aids, n: Taxonomical aids, c: 100, k: "herbarium, botanical gardens, museum, zoological parks, key, flora, manual, monograph, catalogue; what each provides"}
    - {s: systematics-concepts, n: Taxonomy, systematics and concepts, c: 90, k: "taxonomy vs systematics, characterisation, identification, classification, nomenclature; species concept; Linnaeus; contributions of Whittaker/Haeckel where NCERT gives them"}

