# Every NEET chapter, in display order. Chapter files in questions/<subject>/<slug>.yaml must
# match the entry here (name, order, classes); question ids are <subj>-<prefix>-<nnn>.
# Chapters follow the NCERT (rationalised) textbooks, plus the NEET-UG units NCERT no longer
# covers (p-Block Elements, Experimental Skills, Practical Chemistry).
physics:
  - {slug: units-and-measurements, prefix: units, order: 1, classes: [11], name: Units and Measurements}
  - {slug: kinematics, prefix: kin, order: 2, classes: [11], name: Motion in a Straight Line}
  - {slug: motion-in-a-plane, prefix: mip, order: 3, classes: [11], name: Motion in a Plane}
  - {slug: laws-of-motion, prefix: lom, order: 4, classes: [11], name: Laws of Motion}
  - {slug: work-energy-power, prefix: wep, order: 5, classes: [11], name: "Work, Energy and Power"}
  - {slug: rotational-motion, prefix: rot, order: 6, classes: [11], name: System of Particles and Rotational Motion}
  - {slug: gravitation, prefix: grav, order: 7, classes: [11], name: Gravitation}
  - {slug: mechanical-properties-of-solids, prefix: mps, order: 8, classes: [11], name: Mechanical Properties of Solids}
  - {slug: mechanical-properties-of-fluids, prefix: mpf, order: 9, classes: [11], name: Mechanical Properties of Fluids}
  - {slug: thermal-properties-of-matter, prefix: tpm, order: 10, classes: [11], name: Thermal Properties of Matter}
  - {slug: thermodynamics, prefix: thermo, order: 11, classes: [11], name: Thermodynamics}
  - {slug: kinetic-theory, prefix: kt, order: 12, classes: [11], name: Kinetic Theory}
  - {slug: oscillations, prefix: osc, order: 13, classes: [11], name: Oscillations}
  - {slug: waves, prefix: wav, order: 14, classes: [11], name: Waves}
  - {slug: electric-charges-and-fields, prefix: ecf, order: 15, classes: [12], name: Electric Charges and Fields}
  - {slug: electrostatic-potential-and-capacitance, prefix: epc, order: 16, classes: [12], name: Electrostatic Potential and Capacitance}
  - {slug: current-electricity, prefix: cur, order: 17, classes: [12], name: Current Electricity}
  - {slug: moving-charges-and-magnetism, prefix: mcm, order: 18, classes: [12], name: Moving Charges and Magnetism}
  - {slug: magnetism-and-matter, prefix: mam, order: 19, classes: [12], name: Magnetism and Matter}
  - {slug: electromagnetic-induction, prefix: emi, order: 20, classes: [12], name: Electromagnetic Induction}
  - {slug: alternating-current, prefix: ac, order: 21, classes: [12], name: Alternating Current}
  - {slug: electromagnetic-waves, prefix: emw, order: 22, classes: [12], name: Electromagnetic Waves}
  - {slug: ray-optics, prefix: ray, order: 23, classes: [12], name: Ray Optics and Optical Instruments}
  - {slug: wave-optics, prefix: wop, order: 24, classes: [12], name: Wave Optics}
  - {slug: dual-nature, prefix: dual, order: 25, classes: [12], name: Dual Nature of Radiation and Matter}
  - {slug: atoms, prefix: atoms, order: 26, classes: [12], name: Atoms}
  - {slug: nuclei, prefix: nuc, order: 27, classes: [12], name: Nuclei}
  - {slug: semiconductor-electronics, prefix: semi, order: 28, classes: [12], name: "Semiconductor Electronics: Materials, Devices and Simple Circuits"}
  - {slug: experimental-skills, prefix: exp, order: 29, classes: [11, 12], name: Experimental Skills}
