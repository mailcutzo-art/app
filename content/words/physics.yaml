subject: physics
words:
  - id: phy-word-001
    word: INERTIA
    clue: The tendency of a body to resist any change in its state of rest or motion.
    difficulty: 1
  - id: phy-word-002
    word: FRICTION
    clue: The force that opposes sliding between two surfaces in contact.
    difficulty: 1
  - id: phy-word-003
    word: VELOCITY
    clue: Rate of change of displacement; unlike speed, it has a direction.
    difficulty: 2
  - id: phy-word-004
    word: MOMENTUM
    clue: The product of a body's mass and its velocity.
    difficulty: 2
  - id: phy-word-005
    word: NEWTON
    clue: SI unit of force, equal to one kilogram metre per second squared.
    difficulty: 1
